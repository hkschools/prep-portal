<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HK-Schools.com — Test Portal</title>
<style>
  :root{ --brand:#27406b; --bg:#f4f6fa; --ink:#1f2a3a; --muted:#5b6b7a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
        background:var(--bg); color:var(--ink); line-height:1.55; }
  header{ padding:22px 28px; }
  .brand{ color:var(--brand); font-weight:800; font-size:20px; letter-spacing:.2px; }
  main{ max-width:720px; margin:0 auto; padding:24px 20px 60px; }
  .card{ background:#fff; border:1px solid #e3e8f0; border-radius:14px; padding:32px 30px;
         box-shadow:0 1px 3px rgba(20,40,80,.04); }
  h1{ margin:0 0 10px; font-size:26px; color:var(--brand); }
  p{ margin:0 0 14px; color:var(--muted); }
  .note{ margin-top:24px; padding:14px 16px; background:#f0f4fb; border-radius:10px;
         font-size:14px; color:var(--muted); }
  footer{ text-align:center; color:#9aa6b4; font-size:12px; padding:20px; }
</style>
</head>
<body>
  <header><span class="brand">HK-Schools.com</span></header>
  <main>
    <div class="card">
      <h1>Test Portal</h1>
      <p>This is the private assessment portal for HK-Schools.com students.</p>
      <p>If you have been sent a test link, please open that link directly to begin. Tests are not listed publicly on this page.</p>
      <div class="note">Questions? Contact your HK-Schools.com consultant.</div>
    </div>
  </main>
  <footer>© HK-Schools.com</footer>
</body>
</html>
