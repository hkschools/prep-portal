<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT4 Level D — Quantitative Drill 1</title>
<style>
  :root { --navy:#1f3a6e; --blue:#1a5fb4; --light:#eef2f7; --border:#dbe2ec; --green:#1a7f37; --red:#c0392b; --ink:#1c2733; --muted:#6b7689; }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; background:var(--light); color:var(--ink); }
  .wrap { max-width: 820px; margin:0 auto; padding: 28px 24px 60px; }
  .testtitle { letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-size:.82rem; font-weight:700; }
  .toprow { display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:12px; }
  .qcount { color:var(--blue); font-weight:700; font-size:1rem; }
  .secbadge { background:#dde7f5; color:var(--navy); font-weight:700; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; padding:7px 14px; border-radius:8px; }
  .track { height:6px; background:#dde3ec; border-radius:6px; margin:12px 0 26px; overflow:hidden; }
  .track > div { height:100%; width:0; background:var(--navy); border-radius:6px; transition:width .25s ease; }
  .q { background:#fff; border:1px solid var(--border); border-radius:16px; padding:34px 40px; }
  .stem { font-size:1.4rem; font-weight:700; color:var(--navy); line-height:1.4; margin:0 0 24px; }
  .opts { display:flex; flex-direction:column; gap:14px; }
  .opts label { border:1px solid var(--border); border-radius:12px; padding:16px 20px; cursor:pointer; user-select:none; display:flex; align-items:center; gap:14px; background:#fff; font-size:1.1rem; }
  .opts label:hover { border-color:var(--blue); background:#f7faff; }
  .opts input { appearance:none; -webkit-appearance:none; width:21px; height:21px; border:2px solid #b9c3d4; border-radius:50%; margin:0; flex:0 0 auto; position:relative; cursor:pointer; }
  .opts input:checked { border-color:var(--blue); }
  .opts input:checked::after { content:""; position:absolute; inset:4px; border-radius:50%; background:var(--blue); }
  .opts label.sel { border-color:var(--blue); background:#eaf1fc; }
  .navfoot { display:flex; align-items:center; justify-content:flex-end; gap:20px; margin-top:28px; }
  .saved { color:var(--muted); font-size:.95rem; margin-right:auto; }
  button.primary { background:var(--navy); color:#fff; border:none; border-radius:10px; padding:14px 32px; font-size:1.05rem; font-weight:700; cursor:pointer; }
  button.primary:hover { background:#19305c; } button.primary:disabled { opacity:.4; cursor:not-allowed; }
  .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:28px 32px; }
  .card h2 { margin:0 0 4px; color:var(--navy); }
  .card label { font-weight:600; display:block; margin-bottom:6px; }
  .card input[type=text], .card input[type=email] { width:100%; max-width:440px; padding:11px 14px; border:1px solid var(--border); border-radius:8px; font-size:1rem; }
  #quiz, #result { display:none; }
  .score { font-size:2.2rem; font-weight:800; color:var(--navy); }
  table.sec { border-collapse:collapse; width:100%; max-width:460px; margin:10px 0 8px; }
  table.sec td, table.sec th { border:1px solid var(--border); padding:8px 12px; text-align:left; font-size:.95rem; }
  table.sec th { background:var(--light); }
  h2.rev { background:var(--navy); color:#fff; padding:10px 14px; border-radius:8px; margin:26px 0 12px; font-size:1rem; }
  .ri { background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin:10px 0; }
  .ri .qn { font-weight:700; color:var(--blue); font-size:.9rem; }
  .ri .st { font-size:1.05rem; margin:4px 0 8px; }
  .ri .ans { font-weight:700; } .ri .yourwrong { color:var(--red); } .ri .ok { color:var(--green); }
  .ri .why { color:var(--muted); font-style:italic; margin-top:5px; font-size:.95rem; }
  .spin { display:inline-block; width:16px; height:16px; border:3px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:r .8s linear infinite; vertical-align:middle; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap" id="startArea">
  <div class="testtitle">CAT4 Level D · Quantitative Drill 1</div>
  <div class="card" style="margin-top:18px">
    <h2>Quantitative Drill</h2>
    <p style="color:var(--muted);margin:2px 0 18px">40 questions · Number Analogies &amp; Number Series · one question per screen.</p>
    <label for="sname">Student name (required)</label>
    <input type="text" id="sname" autocomplete="name" placeholder="Full name">
    <div style="height:12px"></div>
    <label for="semail">Email (required)</label>
    <input type="email" id="semail" placeholder="student@example.com">
    <div style="height:18px"></div>
    <p style="color:var(--muted);margin:0 0 16px;font-size:.95rem">Pick an answer and press <b>Next</b>. You can review the correct answers and explanations at the end.</p>
    <button class="primary" id="startBtn">Start drill →</button>
  </div>
</div>

<div class="wrap" id="quiz">
  <div class="testtitle">CAT4 Level D · Quantitative Drill 1</div>
  <div class="toprow">
    <span class="qcount" id="qcount">Question 1 of 40</span>
    <span class="secbadge" id="secLabel"></span>
  </div>
  <div class="track"><div id="trackFill"></div></div>
  <div id="qContainer"></div>
  <div class="navfoot">
    <span class="saved" id="savedNote"></span>
    <button class="primary" id="nextBtn" disabled>Next →</button>
  </div>
</div>

<div class="wrap" id="result">
  <div class="card">
    <h2 style="margin-top:0">Drill complete ✔</h2>
    <div class="score" id="scoreLine"></div>
    <table class="sec" id="secTable"></table>
  </div>
  <div id="reviewArea"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvElq37iX_ujAUDdR7gbkftS0YbKp6ajtVVRwiLwxP5w1-kMC-d1-SRGSwLuUGKZYe/exec";
const LEVEL = "D";
const DRILL = "1";


const QUESTIONS = [{"n": 1, "section": "Number Analogies", "type": "text", "stem": "(15 → 30)    (6 → 12)    (12 → ?)", "options": ["25", "23", "26", "22", "24"]}, {"n": 2, "section": "Number Analogies", "type": "text", "stem": "(15 → 5)    (6 → 2)    (12 → ?)", "options": ["5", "3", "6", "2", "4"]}, {"n": 3, "section": "Number Analogies", "type": "text", "stem": "(8 → 27)    (4 → 15)    (9 → ?)", "options": ["30", "31", "29", "32", "28"]}, {"n": 4, "section": "Number Analogies", "type": "text", "stem": "(7 → 84)    (3 → 36)    (9 → ?)", "options": ["109", "107", "110", "106", "108"]}, {"n": 5, "section": "Number Analogies", "type": "text", "stem": "(8 → 15)    (9 → 17)    (4 → ?)", "options": ["8", "9", "10", "7", "17"]}, {"n": 6, "section": "Number Analogies", "type": "text", "stem": "(13 → 130)    (36 → 360)    (39 → ?)", "options": ["390", "3939", "391", "389", "3900"]}, {"n": 7, "section": "Number Analogies", "type": "text", "stem": "(11 → 33)    (2 → 6)    (8 → ?)", "options": ["27", "21", "24", "34", "25"]}, {"n": 8, "section": "Number Analogies", "type": "text", "stem": "(24 → 8)    (21 → 7)    (15 → ?)", "options": ["15", "6", "4", "5", "7"]}, {"n": 9, "section": "Number Analogies", "type": "text", "stem": "(3 → 9)    (5 → 13)    (8 → ?)", "options": ["20", "18", "19", "16", "21"]}, {"n": 10, "section": "Number Analogies", "type": "text", "stem": "(5 → 60)    (3 → 36)    (9 → ?)", "options": ["111", "108", "105", "118", "109"]}, {"n": 11, "section": "Number Analogies", "type": "text", "stem": "(4 → 8)    (10 → 26)    (5 → ?)", "options": ["11", "12", "13", "14", "10"]}, {"n": 12, "section": "Number Analogies", "type": "text", "stem": "(27 → 270)    (9 → 90)    (11 → ?)", "options": ["1111", "110", "1100", "120", "112"]}, {"n": 13, "section": "Number Analogies", "type": "text", "stem": "(3 → 6)    (14 → 28)    (20 → ?)", "options": ["41", "39", "40", "42", "38"]}, {"n": 14, "section": "Number Analogies", "type": "text", "stem": "(9 → 3)    (24 → 8)    (6 → ?)", "options": ["1", "0", "-1", "3", "2"]}, {"n": 15, "section": "Number Analogies", "type": "text", "stem": "(8 → 28)    (7 → 25)    (9 → ?)", "options": ["33", "32", "30", "31", "29"]}, {"n": 16, "section": "Number Analogies", "type": "text", "stem": "(11 → 132)    (3 → 36)    (5 → ?)", "options": ["61", "60", "59", "62", "58"]}, {"n": 17, "section": "Number Analogies", "type": "text", "stem": "(9 → 23)    (10 → 26)    (8 → ?)", "options": ["21", "19", "20", "22", "18"]}, {"n": 18, "section": "Number Analogies", "type": "text", "stem": "(19 → 190)    (39 → 390)    (17 → ?)", "options": ["1717", "170", "171", "169", "1700"]}, {"n": 19, "section": "Number Analogies", "type": "text", "stem": "(6 → 18)    (11 → 33)    (15 → ?)", "options": ["46", "44", "47", "45", "43"]}, {"n": 20, "section": "Number Analogies", "type": "text", "stem": "(20 → 4)    (25 → 5)    (10 → ?)", "options": ["2", "3", "1", "4", "0"]}, {"n": 21, "section": "Number Series", "type": "text", "stem": "5  20  80  320  ?", "options": ["1281", "1279", "1280", "1520", "1040"]}, {"n": 22, "section": "Number Series", "type": "text", "stem": "243  81  27  9  ?", "options": ["3", "4", "2", "21", "6"]}, {"n": 23, "section": "Number Series", "type": "text", "stem": "2.5  5  7.5  10  12.5  ?", "options": ["16", "14", "17.5", "12.5", "15"]}, {"n": 24, "section": "Number Series", "type": "text", "stem": "-7  -5  -3  -1  1  ?", "options": ["3", "5", "1", "0", "4"]}, {"n": 25, "section": "Number Series", "type": "text", "stem": "2  5  9  14  20  ?", "options": ["28", "26", "33", "54", "27"]}, {"n": 26, "section": "Number Series", "type": "text", "stem": "9  16  25  36  ?", "options": ["49", "50", "48", "60", "38"]}, {"n": 27, "section": "Number Series", "type": "text", "stem": "2  5  7  11  14  16  ?", "options": ["19", "22", "18", "20", "40"]}, {"n": 28, "section": "Number Series", "type": "text", "stem": "3  5  6  5  12  5  ?", "options": ["25", "23", "24", "17", "31"]}, {"n": 29, "section": "Number Series", "type": "text", "stem": "1  2  3  4  6  7  ?", "options": ["9", "8", "7", "10", "11"]}, {"n": 30, "section": "Number Series", "type": "text", "stem": "1  4  16  64  ?", "options": ["257", "255", "256", "304", "208"]}, {"n": 31, "section": "Number Series", "type": "text", "stem": "48  24  12  6  ?", "options": ["4", "2", "9", "3", "6"]}, {"n": 32, "section": "Number Series", "type": "text", "stem": "2.3  4.8  7.3  9.8  12.3  ?", "options": ["15.8", "14.8", "13.8", "17.3", "12.3"]}, {"n": 33, "section": "Number Series", "type": "text", "stem": "-5  -3  -1  1  3  ?", "options": ["6", "4", "5", "7", "3"]}, {"n": 34, "section": "Number Series", "type": "text", "stem": "1  3  6  10  15  ?", "options": ["42", "22", "20", "21", "26"]}, {"n": 35, "section": "Number Series", "type": "text", "stem": "36  49  64  81  ?", "options": ["101", "100", "99", "117", "83"]}, {"n": 36, "section": "Number Series", "type": "text", "stem": "3  7  11  13  17  21  ?", "options": ["46", "23", "24", "22", "27"]}, {"n": 37, "section": "Number Series", "type": "text", "stem": "4  5  8  5  16  5  ?", "options": ["43", "64", "34", "32", "30"]}, {"n": 38, "section": "Number Series", "type": "text", "stem": "1  2  3  5  6  7  ?", "options": ["12", "10", "8", "18", "9"]}, {"n": 39, "section": "Number Series", "type": "text", "stem": "6  12  24  48  ?", "options": ["96", "97", "95", "120", "72"]}, {"n": 40, "section": "Number Series", "type": "text", "stem": "32  16  8  4  ?", "options": ["3", "1", "6", "4", "2"]}];
const LETTERS = ["A","B","C","D","E"];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

document.getElementById("startBtn").addEventListener("click", () => {
  const name = document.getElementById("sname").value.trim();
  if (!name) { alert("Please enter the student name first."); document.getElementById("sname").focus(); return; }
  const email = document.getElementById("semail").value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("Please enter a valid email address — it is required."); document.getElementById("semail").focus(); return; }
  if (SCRIPT_URL.indexOf("PASTE_")===0) { alert("Drill is not connected yet: set SCRIPT_URL in this file."); return; }
  window.studentName = name; window.studentEmail = document.getElementById("semail").value.trim();
  startTime = Date.now();
  document.getElementById("startArea").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  renderQuestion();
});

function renderQuestion() {
  const q = QUESTIONS[idx];
  document.getElementById("qcount").textContent = "Question " + (idx+1) + " of " + total;
  document.getElementById("secLabel").textContent = q.section;
  document.getElementById("trackFill").style.width = (100*idx/total) + "%";
  document.getElementById("savedNote").textContent = "";
  let opts = '<div class="opts">';
  for (let i=0;i<q.options.length;i++) opts += '<label><input type="radio" name="q" value="'+LETTERS[i]+'"><span>'+esc(q.options[i])+'</span></label>';
  opts += "</div>";
  document.getElementById("qContainer").innerHTML = '<div class="q"><div class="stem">Q'+(idx+1)+'. '+esc(q.stem)+'</div>'+opts+'</div>';
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.disabled = true; nextBtn.textContent = (idx===total-1) ? "Finish drill" : "Next →";
  document.querySelectorAll('#qContainer input[name="q"]').forEach((inp)=>{
    inp.addEventListener("change", ()=>{
      document.querySelectorAll("#qContainer .opts label").forEach(l=>l.classList.toggle("sel", l.querySelector("input").checked));
      answers[q.n] = inp.value; nextBtn.disabled = false;
      document.getElementById("savedNote").textContent = "Saved";
    });
  });
  window.scrollTo(0,0);
}

document.getElementById("nextBtn").addEventListener("click", ()=>{
  if (document.getElementById("nextBtn").disabled) return;
  if (idx < total-1) { idx++; renderQuestion(); } else submit();
});

async function submit() {
  const btn = document.getElementById("nextBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Scoring…';
  try {
    const r = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({
      type:"quantdrill", level:LEVEL, drill:DRILL, name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000), answers: answers
    })});
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    showResult(data);
  } catch (err) { btn.disabled=false; btn.textContent="Finish drill"; alert("Submission failed: "+err.message); }
}

function showResult(data) {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("scoreLine").innerHTML = "Score: " + data.total + " / " + data.max +
    (data.total===data.max ? ' <span style="color:#1a7f37">— perfect!</span>' : "");
  let rows = "<tr><th>Section</th><th>Score</th></tr>";
  for (const s of data.sections) rows += "<tr><td>"+esc(s.name)+"</td><td>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML = rows;
  // Review (practice mode)
  const byN = {}; for (const q of QUESTIONS) byN[q.n]=q;
  let html = '<h2 class="rev">Review — correct answers &amp; explanations</h2>';
  for (const rv of (data.review||[])) {
    const q = byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section)+'</span>'
      + '<div class="st">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?'ok':'yourwrong')+'">Your answer: '+yourTxt+(right?' ✓':'')+'</div>'
      + (right ? '' : '<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl ? '<div class="why">'+esc(rv.expl)+'</div>' : '')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML = html;
  document.getElementById("result").style.display = "block";
  window.scrollTo(0,0);
}
</script>
</body>
</html>
