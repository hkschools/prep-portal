const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"What is the correct definition of the underlined word \"prolific\"?","options":["Someone that is extremely popular amongst experts of a specific field.","Someone that produces many high-quality works in a specific field.","Someone that receives widespread acclaim in a specific field."],"passage":"<strong>Passage</strong><br>1. The novelist was a prolific writer, churning out several bestsellers every year.<br>2. The scientist was a prolific researcher, publishing numerous papers on ground-breaking discoveries."},{"n":2,"type":"text","section":"Reading","stem":"Which of the following words is a synonym of the word consequence?","options":["ramification","publication","finalization"]},{"n":3,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["recur","replenish","retrieve"],"passage":"<strong>Passage</strong><br>The transit of Venus, in which Venus passes directly in front of the sun, last occurred in 2012 and is not expected to ___ until December 2117."},{"n":4,"type":"text","section":"Reading","stem":"Which of the following words is a synonym of the word ardent?","options":["enthusiastic","indifferent","confused"]},{"n":5,"type":"text","section":"Reading","stem":"What is the meaning of the word bidirectional?","options":["in one direction","in two directions","in three directions"]},{"n":6,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["exhibited","commissioned","publicized"],"passage":"<strong>Passage</strong><br>In 1994, artist Thomas McKnight was ____ by President Clinton to paint the beautiful images that graced official White House Christmas cards over the next three years."},{"n":7,"type":"text","section":"Reading","stem":"Which of the following is an idiom?","options":["This is the final straw.","The neighbors cornered him.","He was drowning in paperwork."],"passage":"<strong>Passage</strong><br>Quentin owns an apartment in the city. He sublets it to young couples, but he's been having bad luck with tenants for a long time. The first couple who lived in the apartment broke the bathtub. The second couple painted all the walls black without permission. The third couple had a dog that completely destroyed the sofa. When Quentin visited the apartment last week, the neighbors cornered him to complain about the current couple leaving their trash in the corridor instead of throwing it in the trash chute. \"This is the final straw!\" Quentin cried. \"I will never sublet the apartment again!\" He came back home to find his son, Arthur, sitting at his desk and drowning in paperwork. \"How would you like to live in the apartment instead of here with us?\" Quentin asked him. Arthur was as pleased as punch to accept the offer; he had wanted to move out of his parents' house for a long time."},{"n":8,"type":"text","section":"Reading","stem":"What is the meaning of the Greek root \"phil\"?","options":["new","many","love"],"passage":"<strong>Passage</strong><br>Hydrophilic substances are attracted to water."},{"n":9,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["dissuaded","coaxed","assisted"],"passage":"<strong>Passage</strong><br>Larry gave a convincing speech persuading the committee to donate money; that is, he ___ them into supporting his non-profit organization."},{"n":10,"type":"text","section":"Reading","stem":"What is the meaning of the word \"gingerly\"?","options":["with extreme caution","with plenty of spice","as loudly as possible"],"passage":"<strong>Passage</strong><br>Jane knew the river was just beyond the patch of trees in front of her, but to get to it she still had to cross the patch, which was the most dangerous part of the forest. Stepping gingerly and slowly, her eyes darting everywhere to look for signs of danger, she moved from tree to tree, pausing every few seconds to look around and make sure no one was coming."},{"n":11,"type":"text","section":"Reading","stem":"Your class has just finished studying about camel nutrition. You have been asked to write a research paper that further explores camel nutrition. Which of the following would be the best research question?","options":["How much water do camels drink in one day?","What is the camel's most favored food?","How does camel nutrition help camels survive in the desert?"]},{"n":12,"type":"text","section":"Reading","stem":"Shaquille's concluding words in this passage are an example of which literary device?","options":["metaphor","irony","alliteration"],"passage":"<strong>Passage</strong><br>After school, Shaquille went with his friends to the basketball court for a game. On their way, he had bumped into a pile of pruned branches and gotten a flat tire. The group was in a rush to reach the basketball court before it would rain and was excited to finally spend some time together. So, Shaquille decided to deal with the flat tire later. When they finished their basketball game, it was clear to him that he should have headed home a long time ago; he was the only one who lived on the East side, and it would take him an hour to get home. Now, the sky was gray, and he noticed that a storm was approaching rapidly. The clouds were dark, and the strong winds whistled in his ears. \"It's going to start raining soon,\" he thought to himself while walking. He considered his options: He could leave his bicycle and run home or continue walking with it. \"I wish I could just ride it,\" he thought. Now, the streets were deserted, and there was no one in sight. The temperature dropped quickly, and the boy was shivering. He still had a long walk. \"This is just perfect,\" he said to himself, and then he added, \"this has got to be the best day of my life.\""},{"n":13,"type":"text","section":"Reading","stem":"What is \"Come see the most active animals in the world!\" an example for?","options":["hyperbole","anthropomorphism","irony"],"passage":"<strong>Passage</strong><br>Johnny had been looking forward to going to the zoo for weeks. He imagined seeing all sorts of animals and having the time of his life with his dad. But when he got there, he could not believe his eyes. The monkeys were sleeping, the lions were hiding, and the zebras were nowhere to be seen. Johnny couldn't help but chuckle at the sign that read \"Come see the most active animals in the world!\" next to the empty enclosures."},{"n":14,"type":"text","section":"Reading","stem":"Which is the best thesis for a persuasive essay on the first time people landed on the moon?","options":["The moon landing was part of NASA's Apollo program.","A famous sentence said by Neil Armstrong (the first person to walk on the moon) during the landing was, \"That's one small step for a man, one giant leap for mankind.\"","The moon landing is an achievement that humanity would have certainly reached at some point in one way or another."]},{"n":15,"type":"text","section":"Reading","stem":"Which of the following is correct, according to the passage?","options":["A full circle rainbow might be seen from an airplane.","Cloud iridescence occurs only at sunrise or sunset.","A red rainbow occurs when the longer rays of light are scattered."],"passage":"<strong>Passage</strong><br>The light we see contains all colors, but when they blend, we see the light as white; therefore, the sunlight seems white. When sunlight strikes a raindrop at a certain angle, it separates into all the colors we see in the rainbow. The light comes out of the other side of the raindrop in one color, depending on the angle. When it's raining, the light comes out of many raindrops in different angles and colors to form the rainbow we see. The colors of the rainbow are red, orange, yellow, green, blue, indigo, and violet. Sometimes, variations can occur. Two rainbows might be seen at the same time, one above the other. A rainbow might form a full circle instead of the normal arc form. A full circle rainbow is typically only seen from a high viewpoint. When the sky is cloudy and the clouds are thin, a phenomenon called cloud iridescence can occur: rainbow colors appear inside the cloud or at its edges. A rare variation is a red rainbow, which only occurs at sunrise or sunset. Since the light must travel farther at this situation, the shorter rays of light, which are blue, green, and yellow, are scattered and cannot be seen, leaving primarily red."},{"n":16,"type":"text","section":"Reading","stem":"How do the chocolate cake and the whisk contribute to your understanding of the theme?","options":["The chocolate cake was the best recipe David had ever tasted.","The chocolate cake and the whisk are reminiscent of his mother's family time.","The chocolate cake and the whisk represent David's love for baking."],"passage":"<strong>Passage</strong><br>David prepared all the ingredients on the kitchen counter. He was ready to bake his mother's chocolate cake with his 6-year-old son. It was the best cake he had ever tasted. It was the cake his mother baked for his birthdays, graduations, and family events. He melted the dark chocolate with the butter in a pot, measured the flour, baking powder, and the sugar and placed them in a bowl. He then began beating the eggs using his mother's whisk. Baking with his mother Margot was his favorite thing to do. His dearest mother loved spending time in the kitchen with David and always taught him how to bake her special recipes. \"One day after I'll be gone,\" said Margot to her beloved son, \"you will have the responsibility to pass this knowledge to the future generation of our family.\" It was only 10 years ago when the two baked together. It was at that time when Margot gave David her whisk, which had golden letters engraved in it, saying: 'baked with love' and told him that baking with him had always filled her heart with joy."},{"n":17,"type":"text","section":"Reading","stem":"Vidal's sentiments toward his principal can be best described as","options":["aloof respect","comfortable familiarity","reverential gratitude"],"passage":"<strong>Passage</strong><br>\"Who's influenced you the most in your life?\" \"My principal, Ms. Lopez.\" \"How has she influenced you?\" \"When we get in trouble, she doesn't suspend us. She calls us to her office and explains to us how society was built down around us. She tells us that each time somebody fails out of school, a new jail cell gets built. And one time she made every student stand up, one at a time, and she told each one of us that we matter.\" This exchange took place between Brandon Stanton, the creator of the blog Humans of New York (HONY), and Vidal Chastanet, a local eighth-grader, on a street in Brownsville, Brooklyn: one of the poorest neighborhoods in the metropolis."},{"n":18,"type":"text","section":"Reading","stem":"Select the reason that best supports this claim:","options":["Cycling in the street can be dangerous and there are limited other places to do it.","Cycling damages the property in city parks."],"passage":"<strong>Passage</strong><br>Claim: Cycling should be allowed in all city parks."},{"n":19,"type":"text","section":"Reading","stem":"What is the main clause in this sentence?","options":["After the Great Fire in 1666 destroyed London","the capital city of England","architect Sir Christopher Wren led the process of rebuilding the city"],"passage":"<strong>Passage</strong><br>After the Great Fire in 1666 destroyed London, the capital city of England, architect Sir Christopher Wren led the process of rebuilding the city."},{"n":20,"type":"text","section":"Reading","stem":"What role will the train car play in this story?","options":["As the backdrop for the mystery, it will be what Emma must navigate to find answers.","The train car gives a feeling of peace and tranquility and will help put Emma at ease.","Because it is an old train car, it will reinforce a theme about the passage of time."],"passage":"<strong>Passage</strong><br>The abandoned train car sat quietly on the overgrown tracks, a relic from a bygone era. Its weathered exterior bore the marks of time, with patches of rust and peeling paint. Emma approached the car, drawn to its nostalgic charm and the stories it held within. She wondered if it had any part in the tragic incident that led to the mysterious disappearance of several passengers years ago. As she stepped inside, the air was thick with the scent of history. The old train car seemed frozen in time, if not for its wooden benches, worn and aged as they appeared. Emma's footsteps echoed through the silent space, as if awakening the whispers of passengers long departed. She examined the faded ticket stubs tucked away in forgotten corners and deciphered cryptic messages etched into the windowpanes. As Emma cautiously walked along the worn aisle, she stumbled upon a tattered map concealed in a hidden compartment beneath one of the seats. The map indicated a long-forgotten train route, marked with mysterious symbols. Intrigued by the mysteries of the past, Emma hoped to uncover the secrets hidden within the old train car."},{"n":21,"type":"text","section":"Reading","stem":"How does the author persuade the readers that Jocelyn Bell should have received the Nobel Prize?","options":["The author uses scientific evidence.","The author uses repetition to emphasize the main point presented in the passage.","The author uses pathos to appeal to the emotions of the reader."],"passage":"<strong>Passage</strong><br>Have you ever heard about Jocelyn Bell? She was an astrophysicist from Northern Ireland who discovered the first radio pulsars (rapidly spinning neutron stars) in 1967. Despite her enormous contribution to the field of astrophysics, it was her colleague Anthony Hewish who received the Nobel Prize for this finding, mainly because he was a man and Jocelyn was a woman. I believe there are two fundamental issues to discuss here. The first is fairness; Jocelyn Bell was the one who discovered pulsars and invested hours researching them. Therefore, she should have been credited for her amazing discovery and hard work. The second is women empowerment. Had Jocelyn Bell been awarded the Nobel Prize, it would have shown the scientific community that a woman scientist made a tremendous change in the science world by discovering pulsars. This could have inspired other females working in jobs dominated by males to excel and become role models. There is no doubt in my mind that Jocelyn Bell, the astrophysicist from Northern Ireland, is the winner: with or without a Nobel Prize."},{"n":22,"type":"text","section":"Reading","stem":"Which would be the strongest evidence for an argument about investing resources to develop solar powered cars?","options":["Solar powered cars would reduce pollution from fossil fuels by 70%.","Solar powered cars can run forever without any maintenance required.","Solar-powered cars would be more fuel efficient."]},{"n":23,"type":"text","section":"Reading","stem":"Which of the following sentences describes the sequence of events in the passage?","options":["The dodo went extinct because of hunting and predators eating its eggs.","The dodo went extinct before the Dutch settlers came to Mauritius.","Dutch settlers hunted all the dodos, leading to their extinction."],"passage":"<strong>Passage</strong><br>The dodo was a bird that lived on the island of Mauritius until the seventeenth century. Nowadays, it is extinct. It was a large, flightless bird, with a long beak and gray plumage. It had no natural predators on the island. When Dutch settlers came to Mauritius in the sixteenth century, they hunted numerous dodos and ate their meat. They also introduced animals that were new to the island, including dogs, cats, macaques, and pigs. Some of those animals escaped captivity and became feral, and they began plundering dodo nests and eating their eggs. Since the dodo only laid one egg per season, the number of eggs decreased quickly and the dodo population declined drastically, until the dodo went extinct in the middle of the seventeenth century."},{"n":24,"type":"text","section":"Reading","stem":"What rhyme scheme does this stanza follow?","options":["A, B, A, B","A, B, B, A","A, B, C, B"],"passage":"<strong>Passage</strong><br>Ring out the old, ring in the new,<br>Ring, happy bells, across the snow:<br>The year is going, let him go;<br>Ring out the false, ring in the true.<br><br>(Taken from Ring Out, Wild Bells by Alfred Lord Tennyson)"},{"n":25,"type":"text","section":"Reading","stem":"What is the underlying assumption the advertisement is making about its audience?","options":["that its audience engages in running, cycling, and weightlifting activities","that its audience values fitness and health","that its audience is looking for a new watch"],"passage":"<strong>Passage</strong><br>The new Smartwatch EXC is a must-have device for anyone seeking to improve their fitness and health. With advanced features such as heart rate monitoring, sleep tracking, and calorie counting, this smartwatch is the perfect companion for anyone looking to take control of their wellness journey. The real magic of the Smartwatch EXC lies in its ability to track your progress and motivate you to achieve your fitness goals. The watch comes with a range of customizable fitness tracking options, including running, cycling, and weightlifting to name a few. With its intuitive interface and easy-to-use app, you can easily monitor your progress and see how far you have come. The Smartwatch EXC comes in a variety of stylish colors to suit any taste, and is available at a competitive price point of $199."},{"n":26,"type":"text","section":"Reading","stem":"What is the mood of this passage?","options":["brave","melancholy","tense"],"passage":"<strong>Passage</strong><br>Suddenly it started to rain, and we all knew we were in serious trouble. We loved hiking in this area, exploring the crannies of the mountain range. We were intrigued by the system of caves that we were forbidden to enter and were sure there was a hidden treasure in the deepest cave, also known as the Skeleton Cave. We heard stories about people who had entered the cave and never came back, and we knew that if it rained, the cave could go from innocuous to extremely dangerous in a matter of minutes. It was Tom who suggested we enter the cave for an hour and start looking for the treasure. Soon the five of us crawled across narrow paths. We kept scrambling, barely managing to keep our heads above water until we reached one of the chambers in the cave. We were tired, hungry, wet, and freezing. It had been four hours since we entered the cave and none of us knew the way out."},{"n":27,"type":"text","section":"Reading","stem":"Which of the following answers includes some of the differences between Sirmen and Szymanowska, according to the passages?","options":["Sirmen was Italian and Szymanowska was Russian; Sirmen's compositions influenced some famous composers and Szymanowska was more successful as a performer.","Sirmen played the violin and Szymanowska the piano; Sirmen was Italian and Szymanowska Polish; Sirmen only performed with her husband while Szymanowska was a successful performer on her own.","Sirmen was an Italian violinist and Szymanowska a Polish pianist; Szymanowska was one of the first musicians to perform without notes."],"passage":"<strong>Passage</strong><br>Maddalena Laura Sirmen was an Italian violinist and composer. She was born in 1745 in Venice, Italy. It was difficult for women to succeed as musicians at that time, and Sirmen only became successful after her marriage to a renowned violinist, Ludovico Sirmen. The couple performed together, which allowed Maddalena to build a reputation, and later a solo career. She was a successful performer and an even more successful composer; her violin compositions were considered \"brilliant.\"<br><br>Maria Szymanowska was a Polish composer. Born in 1789, she was a brilliant pianist and performed in several countries in Europe, including France, England, Germany, and Italy. Her playing was very well received by critics and audiences, and she was one of the first pianists to perform memorized repertoire in public, without the notes to help her. She moved to Russia in 1828 and became a court pianist to the Russian Empress, Alexandra Feodorovna. Szymanowska composed around 100 piano pieces, which were said to influence Frédéric Chopin, one of the most famous Polish composers of all time."},{"n":28,"type":"text","section":"Reading","stem":"Which literary device is used in this sentence?","options":["metaphor","onomatopoeia","alliteration"],"passage":"<strong>Passage</strong><br>Don't spend time with Spencer's circle of friends; they are the wolves of the school, and they are incredibly rude."},{"n":29,"type":"text","section":"Reading","stem":"What conflict is described in this passage?","options":["The students were not in agreement about the content of the time capsule","The difficulty of creating a time capsule","Miss Nelson needed to decide which stand she agreed with"],"passage":"<strong>Passage</strong><br>\"If you could create a class time capsule,\" asked Miss Nelson, \"what would you like to put in it? Please take a few minutes to discuss this with your peers.\" The students started talking to each other eagerly, bringing up suggestions. Some claimed it would be best to add items that represented only the students in their homeroom class, while others strongly argued that world, sports, and entertainment events, which were the center of public attention, would make the time capsule more meaningful. Miss Nelson walked around the room, listened to the students' arguments and was pleased with the creative ideas the students produced and their overall enthusiasm."},{"n":30,"type":"text","section":"Reading","stem":"An appropriate title for the passage would be","options":["The Discworld Novels: A Review","Terry Pratchett: Through the Eyes of a Fan","The Rise and Fall of Terry Pratchett"],"passage":"<strong>Passage</strong><br>I was 13 years old when a friend introduced me to the Discworld series written by British author Terry Pratchett. Complete with wizards, witches, vampires, and trolls, Discworld was everything you would expect from a fantasy world. But, I soon realized it was a bit different. Pratchett's grim reaper turned out to ride a horse named Binky and to be fond of cats. When she was bitten by a vampire, Pratchett's village witch managed to reverse the curse, causing her assailant to begin craving tea and biscuits. As I advanced through the series, a broader image emerged through the hilarious madness. Our own religions, ethnic strife, economics, demagoguery, war, and social injustice started cropping up in this magical world. At times affectionately poking fun at our humanity and at others shedding stark light on society's afflictions, Pratchett created poignant satire that made you think, keeping you laughing the entire time. And shining through was his love for us human beings, flaws and all. I was not alone in my penchant for Pratchett's work. More than 85 million Discworld novels have been sold worldwide. In 1998, Pratchett was appointed Officer of the Order of the British Empire (OBE). So, his announcement in 2007 that he had been diagnosed with Alzheimer's disease came as a blow to millions. He became a prominent advocate for Alzheimer's research, touching many lives from afar. Upon his death in 2015, the Internet exploded with tributes of many who, like me, considered him a friend we had never met."},{"n":31,"type":"text","section":"Reading","stem":"How does the author support the main claim?","options":["by presenting contrasting perspectives on volunteering","by presenting similar approaches to volunteering","by presenting the negative consequences of not volunteering"],"passage":"<strong>Passage</strong><br>Volunteering in the community is a noble and worthwhile activity that can have many positive impacts on individuals and the world as a whole. When discussing this concept with people, you may be surprised to hear about the various reasons for volunteering. My friend Lisa claims that it is a requirement or an obligation to be fulfilled, for example, a school requirement. I was amazed to learn that she is not bothered about the world and can only see her gain. My older brother Nate argues that it is important to volunteer, as it is needed for one's college application. I couldn't believe my ears! Can't he see that he has a role in improving the world we live in? If you ask me, a person ought to have a genuine desire to give back and make a positive impact in this world; this is why I volunteer whenever I can."},{"n":32,"type":"text","section":"Reading","stem":"Which of the following sentences from the passage shows evidence of bias?","options":["Way Out Escape Room Center provides the best escape room experience in the region.","We have four different escape rooms, each designed around its own theme: Pirates, Mission to Mars, Wild West, and Jewel Theft Mystery.","An escape room can be a great activity for any kind of group or occasion: families, friends, birthday parties, corporate outings, you name it!"],"passage":"<strong>Passage</strong><br>Looking for a fun challenge? Come to Way Out Escape Room Center! An escape room is a popular game all over the world. A group of people enter a room and have to work together to solve puzzles in order to get out. Solving the puzzles require different kinds of skills. An escape room can be a great activity for any kind of group or occasion: families, friends, birthday parties, corporate outings, you name it! If you have a group of 5-8 people you can rent your own escape room. If your group is smaller, we'll match you up with teammates who can become new friends! Just be sure to reserve your spot in advance. We have four different escape rooms, each with its own theme: Pirates, Mission to Mars, Wild West, and Jewel Theft Mystery. You can even try the same room up to three times in Easy, Medium, or Hard mode. Way Out Escape Room Center provides the best escape room experience in the region. Our facility was the first established in our area. All our escape rooms are custom-designed, and we even add a new room every six months. The center is located on Pine Street in the center of town."},{"n":33,"type":"text","section":"Reading","stem":"Which literary device is best suited to describe this passage?","options":["rising action","foreshadowing","setting"],"passage":"<strong>Passage</strong><br>Mrs. Rachel Lynde lived just where the Avonlea main road dipped down into a little hollow traversed by a brook that had its source away back in the woods of the old Cuthbert place; it was known to be an intricate, headlong brook in its earlier course through those woods, with dark secrets of pool and cascade; but by the time it reached Lynde's Hollow it was a quiet, well-conducted little stream. (Taken from Anne of Green Gables by Lucy Maud Montgomery)"},{"n":34,"type":"text","section":"Reading","stem":"How does the structure of the passage contribute to your understanding of the main idea?","options":["by presenting the order of importance","by presenting the differences and similarities","by presenting the problem and a possible solution"],"passage":"<strong>Passage</strong><br>Field trips are an essential component of many educational programs, offering students the opportunity to learn about the world beyond the classroom. However, some argue that field trips should be done away with due to concerns over cost, the impact on instructional time, and of course, safety. In every field trip there is a potential safety risk associated with it, as students may be exposed to unfamiliar environments, animals, or weather conditions. Teachers and chaperones must be vigilant in ensuring the safety of all students, which can be a challenging task. While these concerns are valid, eliminating field trips would deprive students of valuable experiences that cannot be replicated within the confines of a classroom. Field trips offer hands-on learning opportunities that engage students in new and exciting ways, allowing them to explore subjects in depth and gain a deeper understanding of the world around them. Furthermore, field trips can foster social and emotional development, as students learn to work collaboratively and interact with new people and environments. Rather than doing away with field trips, educators should work to address safety and cost concerns while preserving the many benefits that these experiences offer to students."}];

function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
