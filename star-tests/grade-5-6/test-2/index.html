const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["active","futile","dormant"],"passage":"<strong>Q1</strong><br>Sakurajima, whose summit is split into three peaks, is Japan's most _____ volcano; it has had no fewer than 71 eruptions over the past 50 years alone."},{"n":2,"type":"text","section":"Reading","stem":"Which of the following means faulty structure?","options":["misinterpretation","unaccountable","malformation"],"passage":"<strong>Q2</strong>"},{"n":3,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["denied","legitimate","pending"],"passage":"<strong>Q3</strong><br>The townspeople were irate to learn that their petition to provide assistance to the community's disabled residents was still ____."},{"n":4,"type":"text","section":"Reading","stem":"Which individual word in the sentence indicates a cause-and-effect relationship between two of the clauses? (Choose the word exactly as it appears.)","options":["Since","so","around"],"passage":"<strong>Q4</strong><br>Since last winter, around the time Jiaying started her new job, she had been experiencing effects of high stress levels, so she decided to take a short vacation."},{"n":5,"type":"text","section":"Reading","stem":"\"rich\" and \"wealthy\" are two words with some kind of relationship between them. Which of the following pairs of words from the passage has the same relationship?","options":["tasty: delicious","healthy: unhealthy","cultures: religions"],"passage":"<strong>Q5</strong><br>The pomegranate is a very popular fruit because it is so tasty. Pomegranates are grown today all over the Mediterranean area, Southeast Asia, and North America. Pomegranates are not just delicious and healthy, but are also symbolic in many cultures and religions around the world. However, some people believe them to be unhealthy."},{"n":6,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["loyalty","achievement","contribution"],"passage":"<strong>Q6</strong><br>The Jnanpith Award, instituted in 1961, is one of India's two most prestigious literary honors; it is presented annually by the Bharatiya Jnanpith organization for a lifetime ____ to Indian literature."},{"n":7,"type":"text","section":"Reading","stem":"Which of the following dictionary definitions is most appropriate for \"set\" as used in the sentence above?","options":["the act or action of setting","fixed or firmly settled","being in readiness, prepared"],"passage":"<strong>Q7</strong><br>She has very set ideas about how parents should behave."},{"n":8,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["refuge","system","vitality"],"passage":"<strong>Q8</strong><br>Sir Arthur Tansley used the term \"ecological ____\" to describe the whole complex of elements that interact to form the environment."},{"n":9,"type":"text","section":"Reading","stem":"Which of the following words from the passage has a negative connotation?","options":["dashed","towering","frantic"],"passage":"<strong>Q9</strong><br>The boy dashed forward, without so much as a glance at the monuments of the old city. Passing through the towering gates, he slipped on a protruding cobblestone, but quickly got up and continued running. When he arrived, he stormed into the house, breathless and frantic."},{"n":10,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["consumption","ritual","utensils"],"passage":"<strong>Q10</strong><br>A Japanese tea ceremony is not about tea ____, but about a beautiful dance in which one prepares a bowl of tea from one's heart."},{"n":11,"type":"text","section":"Reading","stem":"Which of the following statements contrasts with another statement in the passage?","options":["\"To this day, 'pharos' is the name for lighthouse in several European languages.\"","\"Most of the wonders were built by the Greeks.\"","Out of those structures, only the Temple of Artemis still exists today."],"passage":"<strong>Q11</strong><br>The Seven Wonders of the World is a widely-known list of seven great buildings or structures from the classical time period. Most of the wonders were built by the Greeks. The first wonder is the Great Pyramid of Giza. This is the oldest of the wonders and the only one still standing. The second wonder is the Hanging Gardens of Babylon. The exact location of this monument is unknown. The third wonder is the Statue of Zeus at Olympia. It was a gigantic statue made of marble and ivory. The fourth and fifth wonders are the Temple of Artemis and the Mausoleum of Maussollos. The sixth wonder is the Colossus of Rhodes. At 30 meters, it was the tallest statue in the ancient world. The seventh wonder is the Lighthouse of Alexandria. It was called the Pharos. To this day, \"pharos\" is the name for lighthouse in several European languages. Out of those structures, only the Temple of Artemis still exists today."},{"n":12,"type":"text","section":"Reading","stem":"Which of the following options to complete the sentence creates a mysterious mood?","options":["she demanded impatiently, \"My brother is in there and he needs a doctor.\"","she asked sadly, wondering if Mark would be able to fix the broken equipment.","she asked in a low, trembling voice, as Mark stared back, bewildered."],"passage":"<strong>Q12</strong><br>Maureen stared at Mark; \"Could you please help me?\""},{"n":13,"type":"text","section":"Reading","stem":"How does the author pull the reader into the text?","options":["by writing in second person","by discussing a topic that everyone is familiar with","by describing fleas"],"passage":"<strong>Q13</strong><br>Fleas are small flightless insects that live as parasites on animals' bodies. They typically live on fur or feathers, their strong claws preventing them from being dislodged. They feed on the blood of their host, which might be a dog, a cat, a bird, a reptile, or a human, but a flea can live more than a hundred days without eating. Imagine not eating for a hundred days! The female flea consumes 15 times her own body weight in blood every day; imagine eating 1300 pounds of pasta in one day! One final and amazing fact is that fleas can jump up to eight inches, which is approximately 200 times their own height. That is the same as you jumping to the top of the Empire State Building."},{"n":14,"type":"text","section":"Reading","stem":"Which sentence supports the idea that joining a book club could help someone make friends?","options":["Book clubs are a wonderful way for people to come together and share their love of reading.","By sharing your thoughts and opinions with others, you can gain new insight.","Book clubs can also be a great way to socialize and build relationships."],"passage":"<strong>Q14</strong><br>Book clubs are a wonderful way for people to come together and share their love of reading. Whether you are a lifelong bookworm or someone who has only recently discovered the joys of reading, if you wish to join, you should follow two simple rules: Read the same book as all other members and then meet and talk about it. One of the main advantages of book clubs is the opportunity to engage in lively and thought-provoking discussions about the books you read. By sharing your thoughts and opinions with others, you can gain new insights into the stories and characters and discover new perspectives that you may not have considered on your own. Book clubs can also be a great way to socialize and build relationships with others who share your love of reading. By meeting regularly to discuss books, you can form lasting connections and build a sense of community around your shared passion. Book clubs can benefit readers of all levels and backgrounds. Whether you are looking to expand your literary horizons, build new friendships, or simply share your thoughts on your favorite books, a book club can be a great way to do it."},{"n":15,"type":"text","section":"Reading","stem":"Which of the following is most likely to happen in the future?","options":["Misha Osipov will lose in his next game against a chess grandmaster.","Misha Osipov will become world champion in chess.","Misha Osipov will win in his next game against Karpov."],"passage":"<strong>Q15</strong><br>Mikhail (Misha) Osipov, a young Russian chess star, is only four years old, and he has already beaten Yuri Averbakh, the world's oldest chess grandmaster. In 2016, Misha appeared on a television show for young talents, where he played fast chess against Anatoly Karpov. Karpov, who was world champion for ten years until beaten by Garry Kasparov, is considered by many to be one of the greatest players of all time. Misha, who was only three years old, played well at first, but after fifteen moves he lost his concentration. Karpov offered Misha the chance to end the game in a draw, but Misha refused and eventually lost when his time ran out. In August 2017, Misha appeared in a chess festival in Moscow, where he played against Yuri Averbakh, the oldest living chess grandmaster. Averbakh, 95 years old, made a grave mistake, perhaps due to his poor vision, and young Misha won."},{"n":16,"type":"text","section":"Reading","stem":"The White Rabbit's words are an example for which literary device?","options":["metaphor","anthropomorphism","onomatopoeia"],"passage":"<strong>Q16</strong><br>\"Suddenly a White Rabbit with pink eyes ran close by her. There was nothing so very remarkable in that; nor did Alice think it so very much out of the way to hear the Rabbit say to itself, 'Oh dear! Oh dear! I shall be late!' (When she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually took a watch out of its waistcoat-pocket, and looked at it, and then hurried on, Alice started to her feet...\" (Taken from Alice's Adventures in Wonderland by Lewis Carroll)"},{"n":17,"type":"text","section":"Reading","stem":"What is the author's purpose in this passage?","options":["to inform","to entertain","to persuade"],"passage":"<strong>Q17</strong><br>Studies have found that bilingualism is a great asset to the cognitive process, and therefore, it is very advisable. People who speak more than one language have several cognitive advantages: they score better on different tests; their memory, concentration, and multitasking skills are better; and they are less prone to diseases such as Alzheimer's and dementia when they get older. It is estimated that more than 427 million people speak Spanish as a native language. Spanish is considered one of the easiest languages for a native English speaker to learn, because even though the grammar and pronunciation are different from English, they are simpler and more consistent; so learning Spanish might be very easy for you. Spanish is the most popular second language learned in the United States, and even elementary schools have adopted it into their curriculums."},{"n":18,"type":"text","section":"Reading","stem":"What would be the most impactful reason against irresponsible pranking?","options":["Pranks may be disrespectful.","Pranks may damage relationships.","Pranks may cause emotional distress or physical harm."],"passage":"<strong>Q18</strong><br>Pranks are a form of practical joke that are meant to be humorous or entertaining, typically played on friends, family, or acquaintances. They are often used to break the monotony of everyday life or to lighten the mood in social situations. Pranks can take many different forms, from simple inconveniences like hiding someone's keys, to more elaborate schemes like making a fake phone call to your best friend announcing he or she had won the lottery. They can be done for many different reasons, such as to make someone laugh, to seek revenge, or to prove a point. While they can be fun when done in good spirit, taking a prank too far can have serious consequences, both for the prankster and for the person being pranked, especially when performed on people who would not likely appreciate it, such as your teachers or principal, or a kid who is often picked on. What may start out as harmless fun can quickly turn into something hurtful and damaging. For instance, last year there was a man who had a heart attack after being pranked by three kids in the middle of the street. So, next time you plan to prank someone, make sure it is conducted in a responsible and respectful manner that will not cause real damage, and that it is directed at someone who you know will take it in good spirits."},{"n":19,"type":"text","section":"Reading","stem":"Why had Saroo's mother never left the city?","options":["Because Guddu needed the job in the city.","Because the development of Google Earth meant Saroo could find the city more easily.","Because she wanted Saroo to be able to find her if he came back."],"passage":"<strong>Q19</strong><br>Saroo Brierley, an Australian businessman, was born in 1981 in the city of Khandwa, India and had two brothers and a sister. His family was very poor and his older brother Guddu had to work to support the family. One evening, when Saroo was five years old, Guddu and Saroo took a train to another city, where Guddu had a job. By the time they got there, Saroo was exhausted, and Guddu told him to wait until he came back. When Guddu did not come back, Saroo thought he might be on one of the trains and boarded an empty carriage. He fell asleep waiting for his brother, and when he woke up, the train was traveling across unfamiliar country. When the train finally stopped and someone opened the door, Saroo escaped, not knowing he was about 930 miles away from home. He was found by a teenager, who took him to the police station. The police took him to a government center for lost children. It was impossible to locate his family and hometown, because Saroo, being very young, could not give the staff enough information. Fortunately for Saroo, he was adopted by a loving Australian couple, who took him to their house and raised him as their own. Meanwhile, Saroo's real mother stayed in the same city for twenty-five years, waiting for him to return. Saroo's story does not end here. When he was an adult, he used Google Earth to locate his hometown in India, and one night in 2011, he found it. It looked familiar, and he was convinced it was his real hometown. He traveled to India, found the city, and was reunited with his mother. Saroo wrote a book about his life, and the book was adapted to a film."},{"n":20,"type":"text","section":"Reading","stem":"Lucy's words are an example for which literary device?","options":["metaphor","alliteration","irony"],"passage":"<strong>Q20</strong><br>Edmund's little sister, Lucy, suddenly started telling the entire family about a magical land she had found inside the closet. Edmund did not believe her, and he constantly made fun of her. A few days later, Edmund found out that Lucy hadn't been lying, the magical land was real! However, he didn't want the other family members to think he was insane like Lucy, so when they asked him about it, he lied, saying that he and Lucy had only been pretending that her land was real. \"Thank you very much, Edmund,\" said Lucy."},{"n":21,"type":"text","section":"Reading","stem":"Which one of the following statements in the passage states an opinion?","options":["Organisms need food to be able to keep their bodies working properly.","Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty.","Many people think consuming a lot of fat is always unhealthy, however, this issue is controversial."],"passage":"<strong>Q21</strong><br>Those who choose to study nutrition focus on the scientific side of the food we consume. Nutrition provides the cells of an organism with food. Organisms need food to be able to keep their bodies working properly, and to be able to do certain things. The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water. Carbohydrates, which are complex structures of sugar units, constitute a large part of common foods such as bread, rice, potatoes, fruit, and vegetables. Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty. They take longer to digest, which is why they make us feel fuller for longer. Protein makes up every cell and organ in an organism's body. It also makes up enzymes, which are structures that accelerate chemical reactions in the body. Proteins consist of small units called amino acids. There are twenty amino acids the human body cannot produce internally and must therefore receive from nutrition. Protein is found in meat, eggs, dairy products, and legumes such as beans. Fat is found in foods such as avocado, sesame, meat, butter, nuts, etc. Many people think consuming a lot of fat is always unhealthy, however, this issue is controversial. Fat is found in two main forms: saturated and unsaturated. Unsaturated fats are the healthier option. Vitamins and minerals are essential to the body, but in small doses. Vitamin or mineral deficiency may lead to serious diseases, and excessive levels may also be dangerous. Water, the final nutrient, makes up more than half of the human body weight. It is essential for any life form."},{"n":22,"type":"text","section":"Reading","stem":"Which would be the weakest evidence for an argument about the influence of social media?","options":["A 2017 study published in the Journal of Social and Clinical Psychology found that using social media for just 30 minutes a day can lead to increased feelings of loneliness.","According to a recent American survey, 45% of American teenagers aged 13-17 have changed their social communication from face-to-face to online due to the availability of social media.","Engaging in social media makes people less empathetic and more self-centered."],"passage":"<strong>Q22</strong>"},{"n":23,"type":"text","section":"Reading","stem":"Why did the old woman tell the farmer he would have a nice surprise after he'd taken the animals back to the barn?","options":["His house would be much quieter.","He would realize his house is big enough.","He would have more time for his children."],"passage":"<strong>Q23</strong><br>There was a farmer who lived in a small house with his wife and six children. Every day, his wife complained that the house was too small. He went to ask for advice from a wise, old woman. She told him to bring a chicken, a sheep, and a cow into the house for a week and then come back to her. \"Animals in the house?\" thought the farmer. \"How is that going to help?\" But he brought the chicken, the sheep, and the cow into the house anyway. For a whole week, the farmer, his wife, and their six children lived in the house with the animals. All they did was complain that the house was even more teeming than before. A week later, he went back to the old woman. He said, \"My house is much too crowded now that we brought the animals in to live with us.\" She told him to take the animals back to the barn and that he would have a nice surprise. Once the animals were no longer in the house, he realized what the surprise was. His house was exactly the right size for his family."},{"n":24,"type":"text","section":"Reading","stem":"How is Nika's conflict resolved?","options":["While walking her dog, Nika realizes that her assignments would not take as long as she thought and that she would manage without her sister's help.","While walking her dog, Nika clears her mind and comes up with a plan to list and prioritize her tasks.","Nika finishes her homework assignments and goes outside to play with her friends."],"passage":"<strong>Q24</strong><br>Nika returned home after a long day at school. She was overwhelmed with tasks due to the many homework assignments she was given that day. She thought to herself how unfair it was that after an exhausting day at school, she still needed to sit for hours upon hours and study instead of playing outside with her friends. She was especially stressed about her science and math homework since she needed assistance from her older sister. After giving it some thought, Nika decided to take her beloved dog Rocky for a walk around the neighborhood park. While walking around the lush greenery in the fresh air, she reflected on her day. Soon she came up with a fantastic idea: She should list her tasks and prioritize them according to their level of difficulty. She would start with all the assignments she could do on her own, and when her sister arrives, she would ask for her help. She might even have some time to play a quick game with her friends before bedtime."},{"n":25,"type":"text","section":"Reading","stem":"What does \"burning the candle at both ends for too long\" mean?","options":["To work too hard and become overextended.","To play with fire and get hurt.","To misbehave from beginning to end."],"passage":"<strong>Q25</strong><br>The doctor walked into the room and greeted her patient with a warm smile. After taking some tests, she had a serious conversation with Adam: \"You have been my patient since you were a baby.\" She looked into his big brown eyes, then added: \"Over the years, I have come to appreciate your hard work; you do well at school, you are the captain of the football team, and you volunteer in our community.\" The doctor paused to see if Adam wished to say something, then added: \"It is wonderful that you are a motivated young man; however, you have been burning the candle at both ends for too long, constantly pushing yourself too hard.\" The doctor paused again and handed Adam some tissue paper to wipe his tears. \"It's no wonder your body is showing signs of sickness, dear.\""},{"n":26,"type":"text","section":"Reading","stem":"How does the author support the main claim?","options":["The author provides facts about the importance of purchasing individual copies.","The author provides practical advantages his readers might enjoy if they follow his advice.","The author shares his positive experience of purchasing individual copies prior to becoming a subscriber."],"passage":"<strong>Q26</strong><br>If you are interested in subscribing to a teen magazine, it is advisable to buy it a few times prior to subscribing. After all, this will enable you to review its content over time. For instance, you will be able to decide if the various articles are for your liking, if the health and fitness suggestions it offers interest you, if it covers your favorite celebrities and tv shows, and if the stories inspire you."},{"n":27,"type":"text","section":"Reading","stem":"Which of the following is correct according to the passage?","options":["Nancy Johnson marketed her invention as the \"Johnson Patent Ice Cream Freezer.\"","Someone else made a fortune because of Johnson's invention.","Nancy Johnson always wanted to receive a patent and become famous."],"passage":"<strong>Q27</strong><br>The first ice cream maker was invented by Nancy Johnson. She received a patent in 1843 for her invention, a small-scale ice cream freezer, which comprised two spatulas that fit tightly into a long cylindrical barrel. The spatulas contained holes and were attached to a shaft that could be rotated with a crank, while the cylinder was cooled from the outside with a salt and ice mixture. The spatulas could be rotated in the mix and scrape ice crystals off the inner wall of the cylinder simultaneously. This invention made ice cream making far easier than it had been, and ensured a more uniform texture than had been possible before. It was even possible to produce two flavors of ice cream simultaneously. After Nancy Johnson received her patent, she did not have enough money and resources to manufacture her machine and market it. Therefore, she sold the patent to William Young for $200. Young, in his turn, marketed the machine as the \"Johnson Patent Ice Cream Freezer.\" The mechanism of Johnson's machine was used in ice cream makers around the world for many years, and William Young made a fortune."},{"n":28,"type":"text","section":"Reading","stem":"This stanza of the poem is an example of which genre of poetry?","options":["Haiku","Narrative","Lyric"],"passage":"<strong>Q28</strong><br>I marvel how Nature could ever find space<br>For so many strange contrasts in one human face:<br>There's thought and no thought, and there's paleness and bloom<br>And bustle and sluggishness, pleasure and gloom.<br><br>(Taken from A Character by William Wordsworth)"},{"n":29,"type":"text","section":"Reading","stem":"What is the author's viewpoint on Tolkien in the passage?","options":["Tolkien was a brilliant man.","Tolkien was a noble man.","Tolkien is the most successful author in the world."],"passage":"<strong>Q29</strong><br>J. R. R. Tolkien, author of The Lord of the Rings, was not only a successful author but also a master linguist and philologist. A professor in college, he specialized in studying Old English, but was fond of many other languages, especially Finnish and Welsh. While writing The Lord of the Rings, and for many years after, he created his own languages for the creatures in his stories. He created a whole family of languages for the Elves in the story, called the Elvish languages, and continued to develop their grammar and history until he died. Some of those Elvish languages had traces of Finnish, Welsh, and other European languages."},{"n":30,"type":"text","section":"Reading","stem":"What is the best summary of the author's attitude toward having a summer job?","options":["The author thinks it is important for teenagers' communication skills in the work environment.","The author thinks it is useful for teenagers who need to support themselves financially.","The author thinks it is significant for teenagers' professional competence."],"passage":"<strong>Q30</strong><br>As summer approaches, many teenagers are looking for ways to pass the time. Some may choose to spend their summer relaxing or hanging out with friends, while others may be considering taking on a summer job. It may seem tempting to take it easy during the summer months, but there are many important reasons why teens should consider working during this time. First of all, getting a summer job provides teenagers with valuable work experience that is advantageous for their future careers. This includes essential skills such as time management, communication, and responsibility. Additionally, summer jobs can teach teenagers the value of hard work and earning their own salary. Rather than relying on their parents for pocket money, teens who work during the summer gain a sense of independence and learn how to manage their finances. Furthermore, summer jobs can provide teenagers with the opportunity to meet new people and build their social skills. Whether it's working with customers or co-workers, a summer job can help teens learn how to interact with a variety of people in a professional setting. Finally, working during the summer can help teenagers develop a sense of responsibility and positive work ethic."},{"n":31,"type":"text","section":"Reading","stem":"How had Eli changed over the years?","options":["He started to break fences.","He stopped watching short, funny movies on the internet and playing video games.","He started vandalizing the neighborhood and playing offensive tricks on his neighbors."],"passage":"<strong>Q31</strong><br>James was exhilarated. He was on his way to meet Eli, a friend he hadn't seen since they had entered elementary school five years ago. Eli had moved away with his parents and the two of them only kept in touch over the internet. James was now finally old enough to take the train by himself, and his parents had finally allowed him to go. On his way, he thought longingly of the days he and Eli had spent together; they had always liked to play video games and watch short, funny movies on the internet. He was looking forward to doing that today. When James got off the train and met Eli and his parents, they were all thrilled to see each other, and a short while later they arrived at Eli's house. James wanted to play a video game, but Eli said he didn't have any video games anymore. Eli wanted to go outside and meet his friends and James reluctantly agreed. Eli and his friends ran around the backyards of the neighborhood, breaking fences and leaving insulting letters in mailboxes. When James saw what they were doing, he pretended to be feeling ill so he could go back to the house and ask Eli's parents to take him back to the train station. He knew he would probably never see Eli again, and he was happy about it."},{"n":32,"type":"text","section":"Reading","stem":"What is the purpose of this passage?","options":["It is the climax of the story it is taken from.","It functions as an exposition to the story it is taken from.","It is the setting of the story it is taken from."],"passage":"<strong>Q32</strong><br>Many years ago, there was an Emperor, who was so excessively fond of new clothes, that he spent all his money in dress. He did not trouble himself in the least about his soldiers; nor did he care to go either to the theatre or the chase, except for the opportunities then afforded him for displaying his new clothes. He had a different suit for each hour of the day; and as of any other king or emperor, one is accustomed to say, \"he is sitting in council,\" it was always said of him, \"The Emperor is sitting in his wardrobe.\" (Taken from The Emperor's New Clothes by Hans Christian Andersen)"},{"n":33,"type":"text","section":"Reading","stem":"What does \"I threw caution to the wind\" mean?","options":["I did something risky.","I overcame my childish fears.","I considered the situation very carefully."],"passage":"<strong>Q33</strong><br>I threw caution to the wind and decided to take a shortcut through the dangerous woods. As I stepped into the forest, the sunlight began to set, and the tall trees emerged above me, casting long shadows on the ground. The crunching of the leaves and the occasional snap of branches beneath my feet were the only sounds in the silent forest. My heart raced as I realized that I was alone, with no one to accompany me on this frightening walk. The trees seemed to close in around me, and the darkness deepened with each step. As I continued to walk, my mind filled with the stories I had heard about the creatures that lurked in these woods."},{"n":34,"type":"text","section":"Reading","stem":"What is the structure of the passage?","options":["problem and solution","compare and contrast","cause and effect"],"passage":"<strong>Q34</strong><br>The Great Barrier Reef is one of the most famous natural wonders of the world, located off the coast of Australia. The reef is the largest living structure on the planet, stretching over 2,300 kilometers, and home to thousands of different species of marine life. However, in recent years, the reef has been under threat from a variety of factors, including climate change, pollution, and overfishing. Climate change is one of the most significant threats to the Great Barrier Reef, as rising temperatures are causing coral bleaching, a process that can lead to the death of a coral. Pollution is also a major issue, with chemicals and debris entering the ocean and harming marine life. Overfishing, is equally concerning, as it makes certain species of fish to be caught at unsustainable rates, which can disrupt the delicate balance of the reef's ecosystem. Despite efforts to protect the Great Barrier Reef, including the establishment of marine protected areas, the reef remains under threat. It is essential to address these issues to ensure the survival of this incredible natural wonder for future generations."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
