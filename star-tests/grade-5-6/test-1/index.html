const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WI6eb90dDQsdx7lEuW3HqkI1KrU1N-mxK-_EwBqoTfmWst1Rci8f-ZVYkpLNw5N5/exec";

const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["avoid","encounter","salvage"],"passage":"While American pizzas are most often topped by the old-time favorite pepperoni, on their authentic Italian counterparts you would rarely ____ the spicy sausage."},{"n":2,"type":"text","section":"Reading","stem":"What does the phrase \"a roller coaster of emotions\" mean?","options":["the name of a ride in theme parks","extreme mood swings","being very nervous"],"passage":"My parents recently moved to Chicago, and it was my first day in a new school. I had never been to a new school before; I had always gone to school with children I'd known my whole life. My heart was thumping furiously as I entered the unfamiliar building. One moment, I felt calm and optimistic, and the next, I felt like I was about to faint with nerves. All around me, children were laughing, slapping each other on the back, and greeting each other as old friends. I was the only one who did not spot a familiar face. I lowered my gaze and walked to the classroom. I tried to hope for the best, but it was difficult: it felt like my stomach was doing somersaults. My parents' voices echoed in my ears as I repeated their words softly to myself: \"Just smile and be nice to everyone. Give them a chance to get to know you, and they will like you.\" Trying to believe that, I took a deep breath, clutched my hands tightly in my pockets, and through the roller coaster of emotions inside me, I entered the classroom."},{"n":3,"type":"text","section":"Reading","stem":"Which of the following is an antonym of the word indolent?","options":["lazy","active","passive"]},{"n":4,"type":"text","section":"Reading","stem":"What is the meaning of the word beseech?","options":["demand","steal","beg"],"passage":"Having spent all his money on a new stereo system for his car, Jonah could not pay his rent. Full of remorse, he headed to his parents' house and beseeched them to give him money for rent. \"This is the sixth time this year, Jonah,\" said his mother, \"and every time you sound sadder and sadder. Rent should be the first thing you pay, not the last. I do feel sorry for you though. Please do not cry over it; just be smarter next time.\""},{"n":5,"type":"text","section":"Reading","stem":"\"foal\" and \"horse\" are two words with a certain relationship between them. Which of the following pairs of words from the passage has the same relationship?","options":["lamb: sheep","bald: white-headed","hare: rabbit"],"passage":"Contrary to its name, the bald eagle is not actually bald. The word \"bald\" had several meanings in the past, one of which was \"white-headed.\" Native to North America, the bald eagle is one of the largest birds in the continent, and females are approximately 25% larger than the males. It builds the largest tree nests in nature: one nest may weigh over a ton. The bald eagle is the national bird and the national symbol of the United States. It is a powerful flier and may reach the speed of 43 miles per hour when flying and 100 miles per hour when diving in the air to catch a fish. The bald eagle is a predator and subsists mainly on fish, but also eats rabbits, hares, squirrels, raccoons, turtles, lambs, and sometimes even adult sheep. It usually attacks the young, sickly, injured, or weak individuals. Although bald eagles can catch prey on their own, much of their food is obtained via stealing and scavenging. They have been recorded stealing prey from other predators, such as falcons, hawks, golden eagles, and dogs."},{"n":6,"type":"text","section":"Reading","stem":"Which of the following can replace the word admonished?","options":["reprimanded","investigated","requested"],"passage":"This boy always crosses the line. Last week he came to school with blue hair! He was admonished by the principal, but you can be sure he'll come up with something new this week."},{"n":7,"type":"text","section":"Reading","stem":"If the meaning of the prefix \"iso-\" is \"equal\", which of the following might be described as \"isomagnetic\"?","options":["something with insignificant magnetic force","something without any magnetic force","something with the same magnetic force"]},{"n":8,"type":"text","section":"Reading","stem":"Which of the following words mean to make comprehensible?","options":["clarify","clarification","clearly"]},{"n":9,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["funny","witty","amusing"],"passage":"Her clever jokes and her quick tongue always get her out of trouble. She is extremely ____ and everyone who knows her talks about her puns and play-on-words."},{"n":10,"type":"text","section":"Reading","stem":"Which of the following sentences from the passage contains an idiom?","options":["At the end of the film the viewer feels like both an ant and a giant!","It can be hard to wrap your head around the huge size of the universe and the tiny size of an atom.","A short video called Powers of Ten provides a guided tour of the universe in just eight minutes."],"passage":"It can be hard to wrap your head around the huge size of the universe and the tiny size of an atom. You could read hundreds of science books and still not get a sense for it. A short video called Powers of Ten provides a tour of the universe in just eight minutes. The video begins with a couple having a picnic, and then zooms out ten times further every ten seconds until the whole Earth is visible, then the Solar System, then the Milky Way Galaxy, and finally reaching the edge of the known universe. Then, the video quickly zooms back in to the couple and every 10 seconds keeps moving 10 times closer to a human hand until cells are visible, then molecules, and finally atoms. At the end of the video the viewer feels like both an ant and a giant!"},{"n":11,"type":"text","section":"Reading","stem":"Which of the following sentences describes the sequence of events in the passage?","options":["The clearing of forest areas leads to a rise in pollution levels.","The functioning of trees as natural air filters leads to forest fires.","The loss of habitat for animals leads to the restoration of forests."],"passage":"In recent years, the process of clearing out an area that was once covered in forests has become more common. There are several reasons for this process, including the need for logs, living areas, or pastures. Other causes for this process can be natural, such as forest fires, earthquakes, and tsunamis. Today, this process mostly takes place in countries in which there is not enough awareness of the results of engaging in such a process. These countries also do not have enough resources to restore forests that have been converted to other uses. The damage caused by the clearing of forest areas is unknown to most people. The first effect of this process is the loss of habitat for forest-dwelling animals. In addition, trees function as natural air filters. Thus, when there are less trees, pollution levels rise."},{"n":12,"type":"text","section":"Reading","stem":"What is the theme of this poem?","options":["appreciating unique birds","enjoying summer's benefits","praising nature's beauty"],"passage":"I think that I shall never see<br>A poem lovely as a tree.<br>A tree that may in summer wear<br>A nest of robins in her hair;<br>Upon whose bosom snow has lain;<br>Who intimately lives with rain.<br><br>(Trees, by Joyce Kilmer)"},{"n":13,"type":"text","section":"Reading","stem":"Which of the following is definitely correct?","options":["Lynn's mother did not usually ask Lynn to go grocery shopping.","Lynn had no way to know her mother had gone grocery shopping.","Lynn did not know her mother had gone grocery shopping."],"passage":"It was pouring down rain, and the storm clouds made the sky so dark it was barely possible to see anything out the window. Lynn was playing with her dog in the living room when she suddenly clapped a hand to her mouth: she had forgotten to buy the groceries her mother had asked for; her mother would be furious! Without thinking, Lynn ran outside and immediately got so wet that her clothes were dripping; her shoes were filled with water, and she could barely see three steps ahead of her, but her spirit was determined: she would get those groceries as she had promised. The grocery store was only three blocks away, but each step she took was heavier, and she felt colder and colder by the second, so cold it felt like her bones were about to freeze. When her mother came back home two hours later, Lynn was sitting wrapped up in a blanket with her teeth chattering and her feet soaked in hot water. \"Why didn't you answer your phone, Lynn?\" her mother asked. \"I tried to get in touch and tell you I had some extra time this morning and I already got all the groceries.\""},{"n":14,"type":"text","section":"Reading","stem":"How does the author establish a sense of wonder and fascination surrounding fireflies?","options":["By highlighting the fireflies' unique characteristics and behavior.","By mentioning that fireflies are all around us.","By providing a scientific explanation for what bioluminescent is."],"passage":"Fireflies are enchanting creatures that light up the twilight hours with their mesmerizing glow. These tiny insects belong to the beetle family and possess a unique talent for producing bioluminescent light. They can be found in various habitats around the world, from forests to gardens, swamps, riparian areas, and abandoned fields. As twilight descends, they take to the air, their delicate wings carrying them on graceful flights. Fireflies are primarily carnivorous insects, feeding on other small creatures such as snails and worms to meet their nutritional needs without excessive consumption. In order to attract potential mates, these luminous insects engage in a remarkable courtship ritual. Males produce a series of synchronized flashes, creating a mesmerizing light show to capture the attention of females. Each species has its own unique flashing pattern, like a secret code only understood by their own kind. In the realm of fireflies, light becomes a language, a beacon of connection and attraction. The presence of fireflies reminds us of the beauty that can be found in the simplest of creatures, igniting our own curiosity and fascination with the natural world."},{"n":15,"type":"text","section":"Reading","stem":"Laurel turning off the television is an example of which literary device?","options":["rising action","imagery","irony"],"passage":"Eugene thought he and his little sister were too old to have a babysitter, but their parents, evidently, thought otherwise and insisted on bringing one every time they went out. They have endured some horrific babysitters, including one that sent them to bed at seven o'clock, and another who broke the DVD and then blamed it on them. But this one, their parents promised, was different. Even though Eugene doubted it, he had promised his parents to give her a chance. The babysitter was about seventeen years old, and her name was Laurel. As soon as their parents left, she asked Eugene and his sister Kathleen what they wanted to do. They wanted to watch television. Laurel joined them, but after about twenty minutes, she turned it off. \"Hey, we were watching that!\" Eugene protested. \"Oh, but I've got something much more interesting for us to do,\" Laurel replied. \"I'm going to tell you a story.\" Eugene and Kathleen exchanged gloomy looks. They were not in the mood for a story. They wanted to watch TV. But Laurel seemed so determined that they kept quiet. Laurel took a chair and sat in front of them."},{"n":16,"type":"text","section":"Reading","stem":"Select the reason that best supports this claim.","options":["There are other energy sources available to the body other than granulated sugar.","Granulated sugar is linked to diseases like obesity, diabetes and cardiovascular disease."],"passage":"Claim: Everyone should stop consuming granulated sugar."},{"n":17,"type":"text","section":"Reading","stem":"The tone of this passage can best be described as:","options":["exciting and brief","urgent and intense","mysterious and vague"],"passage":"Bruce rushed down the hallway and burst through the door. \"Everybody out!\" he shouted. His adrenalin was rising and there was no time to explain. \"Out!\" he repeated. Why weren't they moving fast enough?! Didn't they realize they were all in danger? Of course, they didn't. But Bruce was not thinking straight. His one and only thought was getting everybody out of the room as quickly as possible. \"What's going on?\" he heard someone ask. \"No time. Do what I say,\" replied Bruce. The hairs on his skin were erect and he felt sweat streaming down his forehead. Boom! The lights went out. It was time. The ground was shaking. He was ready."},{"n":18,"type":"text","section":"Reading","stem":"What does the paragraph use to convince people to watch the movie Inside Out?","options":["It includes the authentic reviews of the audience.","It compares and contrasts Riley's five emotions.","It uses loaded words such as brilliant, fantastic, reliable, and authentic."],"passage":"Have you watched the brilliant movie Inside Out? It is a fantastic computer-animated film that tells the sophisticated story of a young girl named Riley and her basic emotions that influence her actions. Eleven-year-old Riley moves across the country from Minnesota to San Francisco with her family. As a result of this change, emotions run wild in her mind. Young Riley experiences a transformation in how she perceives herself as she tries to adjust to her new life in the new city. The movie vividly presents Riley's core emotions: Anger, Sadness, Disgust, Fear, and Joy. These emotions begin to disagree on how to deal with Riley's dramatic life changes, which leads to intense problems up in Headquarters, the central living and working place for the five emotions. The emotions are portrayed so reliably and authentically that by the end of the movie, the audience cannot avoid but wondering if they too have their own Headquarters of emotions."},{"n":19,"type":"text","section":"Reading","stem":"Which of the following sentences describes the plot of the story?","options":["Leo and Jemma went to collect branches and did not come back. Their parents and brother went looking for them. They found them, without any branches.","Leo, Jemma, and Grant went on a camping trip with their parents. Leo and Jemma went to collect some branches, while Grant and their parents prepared sandwiches for everyone.","Jemma was playing with a butterfly. Leo was absorbed by rare plants. The whole family went back to the forest to build a tent."],"passage":"Leo, Jemma, and Grant went on a camping trip with their parents. They drove for an hour until they reached the nearest forest. They unpacked their equipment and set up their huge tent. Leo and Jemma volunteered to collect some logs and branches, while Grant and their parents prepared sandwiches for everyone. Leo and Jemma split up: Leo followed the colorful plants on the left and Jemma ran after a cute little squirrel on the right. A half an hour later, Grant noticed that his siblings had not come back yet. Grant and his parents went looking for Leo and Jemma. They called their names and used their whistles to signal them. A few minutes later, they heard Jemma giggle from far away. They kept walking until they found her chasing a beautiful butterfly. She joined them and they all went looking for Leo. Leo was found a few minutes later, absorbed by the rare plants he had encountered on the way. The whole family went back to their tent, amused that the mission to find wood did not go as planned, but had at least turned out to be entertaining for Leo and Jemma."},{"n":20,"type":"text","section":"Reading","stem":"Which of the following sentences is an example of hyperbole?","options":["She was shaking like a leaf.","I have a million things to do.","Time is money."],"passage":"Last week I visited my mother's office. She works as a CEO of a big company. She was busy from the moment we arrived until the moment we left. She ran from meeting to meeting, wrote dozens of e-mails, and answered more phone calls than I could possibly count. The other workers kept going in and out of her office and asking her questions. One of the workers had lost an important file and came to apologize, shaking like a leaf. My mother said quietly, \"I have a million things to do now and I have no time to find a solution. Please ask your colleagues for assistance.\" After the next meeting, the worker came in again to announce the file had been found. My mother exhaled in relief. Then she explained to me just how important that file was. \"How did you manage to keep calm when it was missing?\" I asked. \"Panicking would not have helped,\" my mother replied. \"I was calm so they could keep calm and look for the file in peace. You can't be useful when you're panicking.\" \"But weren't you worried?\" I asked her. \"Of course I was,\" my mother answered. \"But time is money and I don't allow myself to get emotional.\""},{"n":21,"type":"text","section":"Reading","stem":"Which point in the plot contributed most significantly to Brian's character development?","options":["Brian being alienated from the people in his community","Brian being treated with kindness and concern by members of his community.","Brian volunteering at a local food bank"],"passage":"Brian was known for being alienated from the people in his community. He lived in a small house at the edge of town, rarely ventured out unless for essentials, and never seemed to engage in any of the activities or events that brought the community together. One year, when Thanksgiving was just around the corner, a few people in his community decided to make sure he was well. They started to show him kindness and concern, making sure he had food and supplies when they learned he was sick, and checked in on him from time to time. Gradually, he began to open up to them and even started to attend some of the community events that he had previously shunned. As time passed, Brian started to see that there were many people in his community who were struggling, and he wanted to do something to help. He began volunteering at a local food bank and helped organize charity events to raise money for those in need. He understood the importance of helping people in his community."},{"n":22,"type":"text","section":"Reading","stem":"What is the purpose of the descriptive language in the paragraph?","options":["to make the reader understand what the waves looked like","to explain why the heroine chose her profession","to add interest to the story"],"passage":"The pouring rain finally stopped, and the sailor spotted the lighthouse in the distance. The terrible weather conditions turned her journey into a dangerous experience. The waves that had surrounded her, as high as buildings, as intimidating as lions, had finally gone. Her rocky boat stopped shaking as the wind settled. She had made the boat herself; longing thoughts were fleeting through her mind, of joyous days in the warm summer sun with her father, the old, experienced sailor, building the boat together. His voice rang in her ears: \"Someday, my child, you will conquer the seven seas.\" Shivering, her teeth chattering, she wrapped another thick blanket around her soaked clothes, hoping it would keep her warm. At last, the sailor was getting closer to the lighthouse. She was pleased to find the lighthouse emitted two flashes of light every three seconds, which meant she was on her way to the right lighthouse. Mercifully, she was not lost. Half an hour later, she finally reached the shore. The lighthouse keeper was waiting for her there to guide her to his cabin, where a blazing fireplace and a cup of hot tea were meant to keep her warm."},{"n":23,"type":"text","section":"Reading","stem":"Which of the following is the best summary for the passage?","options":["Rubber ducks that fell overboard in 1992 have been found on shores all around the world, and some made it to the North Pacific Gyre.","Rubber ducks that fell into the ocean in 1992 have helped to identify the North Pacific Gyre but have also contributed to the plastic pollution of the ocean.","Rubber ducks found in Hawaii have made their way to the North Pacific Gyre, where they have helped to study it but have also contributed to the plastic pollution of the ocean."],"passage":"In 1992, a shipping crate containing 28,000 rubber ducks fell overboard into the Pacific Ocean. The ship was on its way from Hong Kong to the United States and the crate was lost to the ocean, but the ducks did not disappear: they have been traveling around the world for the last twenty-five years. Some of the rubber ducks have washed up on the shores in various places, such as Hawaii, South America, Australia, Pacific Northwest, and Scotland; others have been found frozen in Arctic ice. 2,000 of the ducks still circulate in the currents of the North Pacific Gyre: a vortex of currents between Japan and southeast Alaska, and the ducks helped to identify the exact whereabouts of the gyre and how long it takes to complete a circuit (three years). However, the rubber ducks have also caused problems. The North Pacific Gyre also contains much garbage, mostly plastic, floating in the ocean, and the rubber ducks have contributed to this pollution that endangers both animals and plants living in the ocean."},{"n":24,"type":"text","section":"Reading","stem":"Which of the sentences is the most appropriate to convey imagery?","options":["His face blossomed when his classmate flattered him.","She felt very sad when she came home and saw her fish was missing.","He closed the door silently so he wouldn't wake her up."]},{"n":25,"type":"text","section":"Reading","stem":"What is the moral of the story?","options":["Appearances may be deceiving.","Be respectful of others.","Every trickster might be caught."],"passage":"Dylan and Connor were twelve-year-old identical twins who liked to play tricks and pranks on everybody. They constantly switched the sugar with the salt at the dinner table, so their father's coffee was undrinkable. They would crank call the neighbors, no matter how often their parents made them apologize. Their favorite trick, though, was switching places. At school, they would always switch places, each making his friends believe he was his own brother, then burst out laughing. They always confessed after a while, unless they used this trick for tests. For Dylan and Connor had a secret: they would switch places and take exams for each other. Since Dylan was more mathematical than Connor, and Connor was more gifted at English, Dylan would take Connor's math exams while Connor would take Dylan's English exams. Therefore, on the day of Connor's math final, they came to school as usual, ready to switch places at the right moment. However, as Connor walked into the classroom in the morning, his mouth dropped open in horror: his mother was standing there, eyeing him sternly. \"W-what are you doing here?\" Connor stammered."},{"n":26,"type":"text","section":"Reading","stem":"What is the author's opinion about virtual friendships?","options":["The author thinks that virtual friendships should be approached with caution.","The author thinks that virtual friendships have more risks than benefits.","The author thinks that virtual friendships are the easiest friendships to form."],"passage":"Virtual friendships, also known as online friendships, are becoming increasingly common in today's digital age. With the rise of social media and online communication platforms, it's easier than ever to connect with people of all ages from all over the world and form meaningful relationships without ever meeting in person. Virtual friendships can be a great source of support, companionship, and personal growth. However, despite their popularity and accessibility, virtual friendships come with some unique challenges. For example, communicating solely through texts, emails, or video chats can sometimes lead to misunderstandings or misinterpretations, as nonverbal clues such as tone of voice or body language can be difficult to convey. Additionally, the lack of physical presence can sometimes make virtual friendships feel less \"real\" or substantial than in-person relationships. Last but not least, there are quite a few risks associated with virtual friendships that should be addressed. One of these is the possibility of interacting with people who are not who they claim to be. It is all too easy for someone to create a false identity online, complete with fake photos and personal information. This can lead to situations where individuals are misled or even harmed by someone they thought was a friend."},{"n":27,"type":"text","section":"Reading","stem":"What is the purpose of this passage?","options":["discussing a problem","advertising a product","introducing a solution"],"passage":"Neris is only number three in the toys market. So why visit our stores? We try harder (when you're not the biggest, you have to). We simply cannot afford to provide you with anything less than the best toys available. Obviously, the thing we aim for hardest is just to be nice. Why? Because we can't afford to take you for granted. Come to our stores next time. The lines at our counters are shorter."},{"n":28,"type":"text","section":"Reading","stem":"Giraffes need to always be alert and on the lookout for predators. Which of the following sentences from the passage explains what happens because of this fact?","options":["Giraffes only eat plants and flowers.","Giraffes do not need to drink a lot.","Giraffes sleep for only 20 minutes a day."],"passage":"Giraffes are herbivores, which means they only eat plants and flowers, mostly from trees. Giraffes eat hundreds of pounds of food per week, but they do not need to drink a lot. They get most of the moisture they need from the leaves and branches they eat. Giraffes sleep for only 20 minutes a day, in two- to three-minute naps, so that they can always be on the lookout. Giraffes have very long legs and have only two gaits: walking and galloping. Giraffes have very interesting coat patterns, and every giraffe has a different one, much like humans' fingerprints."},{"n":29,"type":"text","section":"Reading","stem":"How does the structure of the paragraph support its meaning?","options":["It helps the reader imagine what it might be like to meet a dragon.","It emphasizes the differences in how dragons are viewed in different cultures.","It compares and contrasts the different appearances of various kinds of dragons."],"passage":"How would you feel if you were walking along and came across a dragon? You'd almost certainly feel surprised and excited, but would you feel more joyful, or more afraid? It might depend on how you've been brought up to think about dragons. Dragons have a different significance in Eastern cultures than they do in Western cultures. In China, dragons are called loong, and are considered majestic, benevolent creatures that protect people and bring them good fortune. Eastern dragons are usually associated with water such as lakes and the ocean, usually do not have wings, and do not breathe fire. In Europe, dragons are regarded ferocious flying fire-breathing monsters that usually live in the mountains. In European myths and stories, heroes protect people from dragons. Dragons are an excellent example of how the same or similar symbols can have different meanings in different cultures."},{"n":30,"type":"text","section":"Reading","stem":"Which of the following includes a metaphor?","options":["The police officer listened to her story with a poker face.","My heart was beating fast as it was my turn to go on stage.","It was freezing outside. My hands were as cold as ice."]},{"n":31,"type":"text","section":"Reading","stem":"What is the theme of this story?","options":["Those who appreciate life are happy.","Those who believe in themselves succeed.","Those who are kind and work hard are rewarded for their actions."],"passage":"Once there was a poor, kind and hard-working shoemaker who was left with nothing but leather to make one pair of shoes. Before bedtime, he sat by his table and prepared everything he needed to make a new pair of shoes the next day. In the morning he realized that a new pair of readymade shoes stood on his table. The shoemaker was astounded and speechless. The shoes were so professionally made that there was not one bad stitch in them. Soon a buyer entered the shop and asked to buy the shoes. This unbelievable occurrence repeated itself with a growing number of shoes daily. One night before Christmas the shoemaker told his wife \"What if we were to stay up all night and find out who lends us this helping hand?\" His wife liked the idea and the two hid behind the curtain and watched. At midnight, two little elves arrived wearing worn-out clothes. They sat by the shoemaker's table, arranged the pieces of leather, and began to stitch, sew, and hammer skillfully and rapidly. The elves kept working until the work was done and then ran away. The following morning the wife said \"The elves have helped us so much and made us rich. We are ought to make them clothes and shoes to fit their tiny size.\" The man agreed and they both sat to work."},{"n":32,"type":"text","section":"Reading","stem":"What does the paragraph use to convince people that dolphins are extremely intelligent?","options":["It includes research findings as well as an expert's explanation.","It uses propaganda to convince readers that dolphins are the smartest animal in the world.","It uses loaded words like beautiful, friendly, and joyful."],"passage":"People have always been intrigued by dolphins since they are not only beauti const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
