<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}

.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WI6eb90dDQsdx7lEuW3HqkI1KrU1N-mxK-_EwBqoTfmWst1Rci8f-ZVYkpLNw5N5/exec";
const TEST_ID = "STAR-G34-2";
const BANK_PATH = "star-tests/grade-3-4/test-2/bank.csv";
const TITLE = "STAR Reading Grade 3-4: Practice Test 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"What is the meaning of the simile in this sentence?","options":["The light of the lamp alternates between yellow and blue.","The light of the lamp is very intense.","The lamp does not work properly."],"passage":"Read the sentence. The light that came out of the lamp was like sunshine."},{"n":2,"type":"text","section":"Reading","stem":"Which word expresses a peaceful mood?","options":["quiet","thrilled","energy"]},{"n":3,"type":"text","section":"Reading","stem":"Identify the subjective pronouns in the sentences.","options":["her, she","she, they","her, him"],"passage":"Read the sentences. Ali received a letter from her yesterday. The letter mentioned that she was planning to visit him next month. Ali is very excited as they haven't seen each other for almost a year."},{"n":4,"type":"text","section":"Reading","stem":"Which of the following can replace the word \"admonished\"?","options":["reprimanded","investigated","requested"],"passage":"This boy always crosses the line. Last week he came to school with blue hair! He was admonished by the principal, but you can be sure he'll come up with something new this week."},{"n":5,"type":"text","section":"Reading","stem":"What word best describes how Shana feels at the end of the passage?","options":["proud","tired","disappointed"],"passage":"Shana spent all of her weekend studying for her English test. She asked her brother to help her solve the practice test that was handed out on Thursday. She invited a friend over to review all the homework assignments they completed during the semester. She even read all of the punctuation rules in the textbook twice. When the teacher handed the marked tests back, she smiled at Shana and said, \"I am so proud of you! The progress you made in the last couple of months is really impressive.\" Shana looked at her test. She was hoping for a higher mark."},{"n":6,"type":"text","section":"Reading","stem":"Which of the following words is a synonym of the word profuse?","options":["lacking","sparse","abundant"],"passage":"Last year, our garden was so profuse with fruit and vegetables that we had to give some of them away."},{"n":7,"type":"text","section":"Reading","stem":"Which possible meanings does the word \"terrific\" have in the sentence?","options":["long or short","worrying or relaxing","intense or frightful"],"passage":"Owing to a terrific storm, the captain of the ship had to postpone his departure."},{"n":8,"type":"text","section":"Reading","stem":"Which words suggest a positive meaning?","options":["nosy, unusual, crazy","curious, unusual, original","curious, weird, original"],"passage":"Read the sentences. Judy is a very (nosy, curious) person. She also has (unusual, weird) problem-solving methods and her ideas are usually (crazy, original)."},{"n":9,"type":"text","section":"Reading","stem":"Which of the following is an idiom?","options":["The neighbors cornered him.","This is the final straw.","He was drowning in paperwork."],"passage":"Quentin owns an apartment in the city. He sublets it to young couples, but he's been having bad luck with tenants for a long time. The first couple who lived in the apartment broke the bathtub. The second couple painted all the walls black without permission. The third couple had a dog that completely destroyed the sofa. When Quentin visited the apartment last week, the neighbors cornered him to complain about the current couple leaving their trash in the corridor instead of throwing it in the trash chute. \"This is the final straw!\" Quentin cried. \"I will never sublet the apartment again!\" He came back home to find his son, Arthur, sitting at his desk and drowning in paperwork. \"How would you like to live in the apartment instead of here with us?\" Quentin asked him. Arthur was as pleased as punch to accept the offer; he had wanted to move out of his parents' house for a long time."},{"n":10,"type":"text","section":"Reading","stem":"\"foal\" and \"horse\" are two words with a certain relationship between them. Which of the following pairs of words from the passage has the same relationship?","options":["bald to white-headed","hare to rabbit","lamb to sheep","stealing to scavenging"],"passage":"Contrary to its name, the bald eagle is not actually bald. The word \"bald\" had several meanings in the past, one of which was \"white-headed.\" Native to North America, the bald eagle is one of the largest birds in the continent, and females are approximately 25% larger than the males. It builds the largest tree nests in nature: one nest may weigh over a ton. The bald eagle is the national bird and the national symbol of the United States. It is a powerful flier and may reach the speed of 43 miles per hour when flying and 100 miles per hour when diving in the air to catch a fish. The bald eagle is a predator and subsists mainly on fish, but also eats rabbits, hares, squirrels, raccoons, turtles, lambs, and sometimes even adult sheep. It usually attacks the young, sickly, injured, or weak individuals. Although bald eagles can catch prey on their own, much of their food is obtained via stealing and scavenging. They have been recorded stealing prey from other predators, such as falcons, hawks, golden eagles, and dogs."},{"n":11,"type":"text","section":"Reading","stem":"Which of the following is an example of narrative writing?","options":["Biography","Play","Poem"]},{"n":12,"type":"text","section":"Reading","stem":"Why did the author write this story?","options":["to explain","to entertain","to inform"],"passage":"The pouring rain finally stopped, and the sailor spotted the lighthouse in the distance. The terrible weather turned her journey into a dangerous one. Her boat was rocking among the waves. She wrapped another wool blanket around herself, hoping it would keep her warm. She was getting closer to the lighthouse. The sailor was pleased to find that the lighthouse gave off two flashes of light every three seconds. This meant she was on her way to the right lighthouse. She was not lost. Half an hour later she reached the shore. The lighthouse keeper was waiting for her there to guide her to his cabin where a burning fireplace and a cup of tea were meant to keep her warm. Now, she was ready to begin her mission."},{"n":13,"type":"text","section":"Reading","stem":"What is the main idea of the passage?","options":["the aardvark is an interesting animal","the aardvark is a relative of the elephant","the aardvark can eat 50,000 ants in a night"],"passage":"The aardvark is an interesting animal that lives in the south of Africa. Although it looks a little like a pig, it is actually a distant relative of the elephant. It mainly eats ants and termites and can eat 50,000 ants in one night! The aardvark lives in holes called burrows that it digs in the ground. The name Aardvark comes from South Africa's Afrikaans language and means \"earth pig\" or \"ground pig.\""},{"n":14,"type":"text","section":"Reading","stem":"Which one of the following statements in the passage includes an opinion?","options":["Malnutrition can happen when a person does not eat the right amount of nutrients.","The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water.","Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty."],"passage":"Nutrition provides the cells of an organism with food. Organisms need food to be able to keep their bodies working properly. They also need food to be able to do certain things. Malnutrition can happen when a person does not eat the right amount of nutrients. This person can get better by changing his or her diet so it has the right amount of nutrients. The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water. Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty. They take longer to digest, and because they stay in the stomach longer, they leave the person who has eaten them feeling fuller for longer. Protein is needed for building cells. It is found in meat, beans, and eggs. Fat is found naturally in some foods. Many people think that fat is bad, but there are various opinions on this subject."},{"n":15,"type":"text","section":"Reading","stem":"Which of the following is not a supporting detail in this paragraph?","options":["Members of Generation Z constitute about a quarter of the population in the US.","Members of Generation Z can quickly and efficiently shift between work and play.","Members of Generation Z are typically thought of as being comfortable with technology."],"passage":"Students born from the mid-1990s to 2014 are considered part of Generation Z. They are the youngest generation and constitute about 25% of the population in the U.S. Members of Generation Z are typically thought of as being comfortable with technology, and they interact on social media websites for a significant portion of their socializing."},{"n":16,"type":"text","section":"Reading","stem":"Why did Rowling not sign her full name on the Harry Potter books?","options":["because her publisher thought it was important to donate a lot of money to charity","because she had a low self-esteem at the time","because her publisher thought the book would be less successful if she did"],"passage":"English author J. K. Rowling's life is a rags-to-riches story: her mother was ill for many years and passed away when Rowling was twenty-five years old. Then she moved to Portugal, taught English as a foreign language, and she got married and gave birth to a daughter. Due to the aggression of her husband, she had to leave him and return to the UK a year later. She had started writing Harry Potter, but she was unemployed and lived in a small apartment with her baby daughter. She had a low self-esteem at the time. When she finished writing Harry Potter and the Sorcerer's Stone, several publishers rejected the book. At last, Bloomsbury Publishing, a British publishing house, agreed to publish it, requesting that she use her initials in her pen name, because the publisher believed female authors' names were less appealing to young boys. Once the Harry Potter books were published, they became an instant success."},{"n":17,"type":"text","section":"Reading","stem":"You are asked to write a paper that describes two of the largest land animals in our planet, the African elephant and the hippopotamus. Which method of organization would be the most effective in writing this paper?","options":["sequence","cause and effect","comparison-contrast"]},{"n":18,"type":"text","section":"Reading","stem":"Which of the following might be a conclusion from the text?","options":["Sea otters are friendly to people and other animals.","Sea otters live all over the world.","Sea otters spend a lot of time in water."],"passage":"Sea otters are mammals from the weasel family. Their thick, dense fur, the densest fur in the animal kingdom, repels water; they have webbed feet; and their ears close when they are in the water. They sleep floating on their backs using kelp to keep them from drifting. They are social animals and like to be with other sea otters. They live in groups. It looks like they are \"holding hands\" when they are floating because they stay near each other all the time. In Alaska, sea otters can live in a group with over 2,000 other otters."},{"n":19,"type":"text","section":"Reading","stem":"What is the meaning of the word \"vindictively\"?","options":["in a happy manner","in a revengeful manner","in an embarrassed manner"],"passage":"Julie and I had a fight last year and I thought we could let it go, but today I saw her grin quite vindictively when I got a D on my math test."},{"n":20,"type":"text","section":"Reading","stem":"How does the writer arrange the ideas in the paragraph?","options":["by describing several solutions to a problem","by telling how things are the same or different","by putting events in time order"],"passage":"Whenever you have some free time, you should play a hilarious game called \"To Be Continued\" with your friends. First, get a piece of paper and a pencil. Then, write any sentence that comes to mind at the top of the page and fold it so the sentence cannot be seen. It is best to write a funny or a silly sentence in order to get the best result. For example, you could write, \"The unicorn spent the day dancing midair.\" Next, pass the folded piece of paper to a friend and ask him or her to write a random sentence and fold the paper too. Keep passing the paper between your friends until the page is full of your words. Enjoy gathering around, unfolding the page, and reading the ridiculous story you all wrote together!"},{"n":21,"type":"text","section":"Reading","stem":"Which of the following sentences has the same meaning as the sentence above?","options":["The package I had been waiting for since last month was delivered yesterday by the mailman.","The package I was waiting for since yesterday was delivered last month by the mailman.","Yesterday, I delivered the package the mailman was waiting for since last month."],"passage":"Yesterday, the mailman delivered the package I had been waiting for since last month."},{"n":22,"type":"text","section":"Reading","stem":"Which sentence is correct?","options":["I lent him my favorite book, \"Puss in Boots\", five days ago.","I lent him my favorite book, Puss in Boots, five days ago.","I lent him my favorite book, \"Puss In Boots\", five days ago."]},{"n":23,"type":"text","section":"Reading","stem":"Which of the following is the climax of the story?","options":["Regina's skin tingling with excitement","The teacher walking in and the children starting to sing","The teacher telling the children they have made her birthday the most special day of her life"],"passage":"Regina and Lana were walking around the classroom, laughing and chatting while they put up another \"Happy Birthday!\" sign and hung up a flower garland. A few other children were blowing up balloons and hanging them on the walls. Two girls were in charge of the music and were arguing loudly over which song should be played first. Regina felt her skin tingling with excitement. Then a boy broke into the room and announced breathlessly: \"She's coming!\" \"Everyone be quiet!\" said Regina in a loud whisper and everyone fell silent. Regina took a quick scan of the room. It was beautifully decorated; one balloon had fallen but that barely made a difference. She would pick it up later. The children were all huddling by the door, as quiet as mice, hardly daring to breathe. Lana quickly turned off the lights. They waited a little while longer, and then, finally, the door opened and they all started singing \"Happy Birthday\" at the top of their lungs. Standing at the doorstep, staring at them with great surprise, was their homeroom teacher, Ms. Nolan. Then she smiled and thanked them, telling them no one had ever thrown her a surprise party before, and they had made this birthday the most special day of her life."},{"n":24,"type":"text","section":"Reading","stem":"Click on the sentence that includes propaganda rather than facts.","options":["Joyful Cow is dairy-free, coconut-based ice cream with chunks and soft swirls.","We use a special process that keeps all the nutrients intact.","The competitive brand uses artificial additives that spoil the flavor."],"passage":"Read the advertisement:<br><br>Joyful Cow is dairy-free, coconut-based ice cream with chunks and soft swirls. Our ice cream is sugar-free and gluten-free. We use a special process that keeps all the nutrients intact. The competitive brand uses artificial additives that spoil the flavor. Choose Joyful Cow!<br><br>(Propaganda: Information spread to help a person or a group, which may include unproven details. In addition, propaganda may include statements that harm another person or group.)"},{"n":25,"type":"text","section":"Reading","stem":"How did Sebastian's character develop in the story?","options":["He apologized for stepping on another child's toes.","He learned to play fair.","He stopped yelling."],"passage":"Coach Clarke named two students as team captains and asked them to pick students for their dodgeball teams. When there were only a dozen students left, Sebastian cried, \"If you don't pick me next, I'm not going to play at all!\" Jill named Sebastian next and he joined her team, cheering. Ten minutes into the game, Steve accidentally stepped on Sebastian's toes while trying to catch the ball before it rolled over to the other team's field. \"Foul!\" yelled Sebastian, even though Steve was on his team. \"Steve shouldn't play anymore, Coach!\" he demanded of Coach Clarke. \"He stepped on my toes on purpose!\" Steve apologized to Sebastian repeatedly and promised Coach Clarke it was an accident. Coach Clarke told Sebastian she would allow Steve to keep playing. Sebastian stomped his foot and turned to Steve. \"I don't like playing with you!\" Coach Clarke said, \"If you don't start playing fair and stop ruining the game for everybody else, Sebastian, I won't let you play anymore.\" Sebastian looked at Coach Clarke, and said, \"All right.\" For the rest of the game Sebastian was quiet, and at the end of the game he went to Jill and Steve and apologized. They all shook hands."},{"n":26,"type":"text","section":"Reading","stem":"What is the theme of the passage?","options":["Locking someone in a castle is wrong.","Darkness takes over.","Loneliness is difficult."],"passage":"Ferdinand was sitting in the dark castle, looking outside the small window. The view, which might have been beautiful to a stranger, only depressed him. Everywhere he looked, he could only see trees and a big river. There were no birds, no houses, not a soul in sight. The castle, too, was abandoned and so silent that Ferdinand could hear his own breaths, slow and hollow. Ferdinand sighed as the sky darkened; clouds were gathering, and the air was filled with the smell of rain, which did nothing to comfort his forlorn and desperate soul. A storm began suddenly, and his vision was blurred in the heavy sheets of rain. Ferdinand cried, but there was no one to hear him."},{"n":27,"type":"text","section":"Reading","stem":"What is the main message of the passage?","options":["Animated movies with water that looks real are good.","Moana is one of the best films Disney has ever made.","It is a good idea to have more movies with strong heroines."],"passage":"My friend Sophie came over to my house to play video games. Sophie usually won these games, and this time was no exception. When we finished the game, Sophie received a text message. The sound was familiar. \"What song is that?\" I asked. \"'You're Welcome', from Moana,\" Sophie replied. \"It's a new Disney movie...\" \"I watched it too!\" I interrupted. \"I loved that movie! I loved how the water looked so real.\" \"I loved the songs!\" said Sophie. \"But what I really loved,\" I continued, \"was Moana's character. She's the daughter of the village chief, and she will be the chief after him. She's so independent and strong. She does what she thinks is right, fights the bad guys, and saves her people. And above all, I loved how it's clear to everyone that she's going to be the chief. Usually in films you see that girls can only rule if they get married, but in Moana, no one questions the fact that she can rule on her own.\" \"You're right,\" said Sophie. \"And in most films, the girl is saved by the boy, but Moana saves the day herself.\""},{"n":28,"type":"text","section":"Reading","stem":"This passage is an example of which type of text?","options":["a play","a poem","historical fiction"],"passage":"In the morning, after milking the cow and churning some butter, Elizabeth felt thirsty. She went over to the well, dropped the bucket inside, and then pulled and pulled until it came back up, full to the brim with water. As she put her lips to the bucket and drank the sweet, cold water, she felt much more energetic, and she knew it was going to be a good day."},{"n":29,"type":"text","section":"Reading","stem":"Jennifer is writing a paper about junk food and why children should not consume much of it. Which writing genre is appropriate for Jennifer's purpose?","options":["Descriptive writing","Poetry writing","Persuasive writing"]},{"n":30,"type":"text","section":"Reading","stem":"Out of the following events, what was the second thing that happened last Friday?","options":["Thomas saw that his ice cream had melted","Coach Maggie showed Thomas how to pitch","Thomas got an ice cream cone","Coach Maggie wanted to talk to Thomas"],"passage":"Thomas plays baseball every Friday. Every time, one of the team parents brings ice cream at the end of the game. Last Friday, Thomas' coach wanted to talk to him for a few minutes. His ice cream cone was already in his hand when she called him over. Coach Maggie said he needed to follow through more in his pitches, and showed him how. \"Make sure your arm follows this motion,\" she said, moving her arm down. \"You can't just stop when you release the ball.\" Thomas thanked his coach and looked at the ice cream in his hand. \"Oh, no,\" he thought when he saw that the ice cream had melted. \"Well, I suppose there's always next week.\""},{"n":31,"type":"text","section":"Reading","stem":"Which of the following sentences from the passage is persuasive?","options":["While we sleep, our muscles rest and the information we absorbed during the day is processed in our memories.","Playing ball, swimming, or riding a bicycle can help you fall asleep faster.","If you follow these two rules, you are likely to be more active and focused during the day."],"passage":"Sleep is one of the most important processes in our bodies. While we sleep, our muscles rest and the information we absorbed during the day is processed in our brains. Lack of sleep may lead to restlessness, stubbornness, and mood swings. In order to be healthy and stay focused in school, it is recommended to follow two specific rules. The first one is sticking to a routine. Once you go to sleep every night at a fixed time, your body gets used to it and it is easier to fall asleep. The second one is exercising during the day. Playing ball, swimming, or riding a bicycle can help you fall asleep faster. If you follow these two rules, you are likely to be more active and focused during the day."},{"n":32,"type":"text","section":"Reading","stem":"Which sentence does not belong in the paragraph?","options":["(1)","(2)","(3)","(4)","(5)"],"passage":"(1) The Storyteller was a TV series created by Jim Henson, who also created Sesame Street. (2) In the series, a storyteller is sitting by the fireplace telling old folk tales to his talking dog. (3) The series combined real actors with puppets, which gave the stories a magical feel. (4) Jim Henson was born in 1936. (5) The series won many awards and was loved by children and adults alike."},{"n":33,"type":"text","section":"Reading","stem":"Which of the paragraphs is incomplete and unclear?","options":["Paragraph 1","Paragraph 2"],"passage":"Paragraph 1: Cacao has been grown in the Americas for at least three thousand years. The earliest evidence of chocolate farming was found in the area that is now Mexico. The ancient peoples who lived there then, the Mayans and Aztecs, made chocolate drinks. The ancient word for those drinks, xocolatl, meant \"bitter water.\"<br><br>Paragraph 2: A teddy bear is in the shape of a bear. It was created in the U.S., but also in Germany. Bears mean love, congratulations, or sympathy. Teddy bears are named after President Theodore Roosevelt, whose nickname was \"Teddy,\" although he did not like it. Teddy bear museums and picnics also exist."},{"n":34,"type":"text","section":"Reading","stem":"Which of the following is most likely to happen in the future?","options":["Yuri Averbakh will become world champion in chess.","Misha Osipov will become world champion in chess.","Misha Osipov will lose in his next game against a chess grandmaster."],"passage":"Mikhail (Misha) Osipov, a young Russian chess star, is only four years old, and he has already beaten Yuri Averbakh, the world's oldest chess grandmaster. In 2016, Misha appeared on a television show for young talents, where he played fast chess against Anatoly Karpov. Karpov, who was world champion for ten years until beaten by Garry Kasparov, is considered by many to be one of the greatest players of all time. Misha, who was only three years old, played well at first, but after fifteen moves he lost his concentration. Karpov offered Misha the chance to end the game in a draw, but Misha refused and eventually lost when his time ran out. In August 2017, Misha appeared in a chess festival in Moscow, where he played against Yuri Averbakh, the oldest living chess grandmaster. Averbakh, 95 years old, made a grave mistake, perhaps due to his poor vision, and young Misha won."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
