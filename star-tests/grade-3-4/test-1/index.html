<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WI6eb90dDQsdx7lEuW3HqkI1KrU1N-mxK-_EwBqoTfmWst1Rci8f-ZVYkpLNw5N5/exec";
const TEST_ID = "STAR-G34-1";
const BANK_PATH = "star-tests/grade-3-4/test-1/bank.csv";
const TITLE = "STAR Reading Grade 3-4: Practice Test 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Lucy's words are an example for which literary device?","options":["metaphor","irony","alliteration"],"passage":"<strong>Q1</strong><br>Edmund's little sister, Lucy, suddenly started telling the entire family about a magical land she had found inside the closet. Edmund did not believe her, and he constantly made fun of her. A few days later, Edmund found out that Lucy hadn't been lying: the magical land was real! However, he didn't want the other family members to think he was insane like Lucy, so when they asked him about it, he lied, saying that he and Lucy had only been pretending that her land was real. \"Thank you very much, Edmund,\" said Lucy."},{"n":2,"type":"text","section":"Reading","stem":"What does the author believe?","options":["People should appreciate both summer and winter.","Summer is too hot and humid.","People cannot do things outside in summer."],"passage":"<strong>Q2</strong><br>Some people don't like summer. They think that it gets too hot and humid, and that they are unable to do things outside. Don't they realize that summer is the best season for traveling and spending time at the beach? Surely, people who don't like summer are confused. This is very similar to how people view winter, if you think about it. Many people don't like winter because it's snowy and cold. But this is a great excuse to stay indoors and read an interesting adventure book with a warm cup of cocoa in your hands. Another thing you could do in winter is sit on the rug with your family and do a jigsaw puzzle. There's plenty of stuff to do in winter!"},{"n":3,"type":"text","section":"Reading","stem":"Which of the sentences is the most appropriate to convey imagery?","options":["His face blossomed when he caught a glance of her.","Neil Armstrong was the first astronaut to walk on the moon.","Kuwait City is one of the hottest cities in the world."]},{"n":4,"type":"text","section":"Reading","stem":"What does \"credible\" mean in this passage?","options":["wise","believable","honest"],"passage":"<strong>Q4</strong><br>Karim is one of my most trustworthy friends. If I ask him a question about something, he never makes up an answer just to impress me. He always checks before he answers to make sure what he says is correct. Karim is a credible person."},{"n":5,"type":"text","section":"Reading","stem":"Which prefix best completes the word \"connect\"?","options":["dis-","re-","un-"],"passage":"<strong>Q5</strong><br>The internet connection is not working. Try to ____ connect the router cable to the socket."},{"n":6,"type":"text","section":"Reading","stem":"Which of these pairs of words shares the same meaning?","options":["modern, mill","fly, expand","hover, float"],"passage":"<strong>Q6</strong><br>The hot air balloon is the oldest and simplest of all flying machines. Two brothers from France were the inventors of the modern flying balloon. As paper mill owners, the brothers tried to float bags made of paper and fabric. They turned a bag upside down so the opening was at the bottom. When they held a flame near the opening at the bottom, the bag expanded with hot air and hovered upward."},{"n":7,"type":"text","section":"Reading","stem":"Which of the following meanings of the word \"jam\" is used in the sentence?","options":["very crowded and slow","fruit preserve","a difficult situation"],"passage":"<strong>Q7</strong><br>I was so busy all day that I barely had a spare second to breathe, and I still wasn't finished when I joined my family at the dinner table. During dinner I talked only about the jam I was going to be in if I didn't finish soon, and as soon as dinner was over I ran back to my desk to keep working."},{"n":8,"type":"text","section":"Reading","stem":"Which word has a negative connotation?","options":["curious","nosy","eagerness"]},{"n":9,"type":"text","section":"Reading","stem":"Which adjective correctly completes the sentence?","options":["hardest","harder","hard"],"passage":"<strong>Q9</strong><br>Actually, that was the ____ question of all the questions on the test."},{"n":10,"type":"text","section":"Reading","stem":"Why did the old woman tell the farmer he would have a nice surprise after he'd taken the animals back to the barn?","options":["His house would be much quieter.","He would realize his house is big enough.","He would have more time for his children."],"passage":"<strong>Q10</strong><br>There was a farmer who lived in a small house with his wife and six children. Every day, his wife complained that the house was too small. He went to ask for advice from a wise, old woman. She told him to bring a chicken, a sheep, and a cow into the house for a week and then come back to her. \"Animals in the house?\" thought the farmer. \"How is that going to help?\" But he brought the chicken, the sheep, and the cow into the house anyway. For a whole week, the farmer, his wife, and their six children lived in the house with the animals. All they did was complain that the house was even more teeming than before. A week later, he went back to the old woman. He said, \"My house is much too crowded now that we brought the animals in to live with us.\" She told him to take the animals back to the barn and that he would have a nice surprise. Once the animals were no longer in the house, he realized what the surprise was. His house was exactly the right size for his family."},{"n":11,"type":"text","section":"Reading","stem":"After the molten glass is removed from the oven, it probably","options":["turns to sand.","melts.","hardens."],"passage":"<strong>Q11</strong><br>Making glass is an interesting process. First, you make a mixture of sand, limestone, and soda. Then, you put the combined ingredients in an oven that was heated to 2,850 degrees Fahrenheit, creating molten glass. Then, you remove the molten glass from the oven."},{"n":12,"type":"text","section":"Reading","stem":"What is the purpose of the sign?","options":["to persuade people to light a fire today","to inform that a fire is going on right now","to persuade people not to light a fire today"],"passage":"<strong>Q12</strong><br>(Sign: FIRE DANGER - PREVENT FOREST FIRES)"},{"n":13,"type":"text","section":"Reading","stem":"What is the passage mainly about?","options":["Hattie McDaniel's career","Hattie McDaniel's personal life","The movie Gone with the Wind"],"passage":"<strong>Q13</strong><br>Hattie McDaniel was an American stage actress, singer-songwriter, and comedian born in 1895. In 1931, McDaniel started working as an actress in films. She played several small roles, but towards the end of the 1930s she was chosen to play a part in Gone with the Wind, a very famous and successful movie. McDaniel won an Academy Award for Best Supporting Actress for her role in the movie, making her the first Afro-American person to be nominated for an Oscar, and to win. She played in over 300 movies during her career, and nowadays she has two stars on the Hollywood Walk of Fame."},{"n":14,"type":"text","section":"Reading","stem":"Click on a phrase from the passage which includes an opinion.","options":["Diamonds are found deep in the earth","Diamonds are not only used in rings and necklaces","After all, jewels are silly things to waste such a useful material on"],"passage":"<strong>Q14</strong><br>Diamond is one of the hardest known materials on earth. The word \"diamond\" comes from the Greek word \"adamas,\" which means \"unbreakable.\" Diamonds are billions of years old: in some cases more than three billion years old. Diamonds are found deep in the earth and are formed in a natural process at high temperatures and pressure. Diamonds are not only used in rings and necklaces. After all, jewels are silly things to waste such a useful material on. Diamonds are also used in industry. Since they are so hard, they are good for cutting and drilling with."},{"n":15,"type":"text","section":"Reading","stem":"Which detail from the story best supports the main idea that Aria is excited about ballet class?","options":["She counts down the minutes.","She follows the teacher's instructions.","She thinks all of her friends look happy."],"passage":"<strong>Q15</strong><br>Aria was sitting on a bench in the ballet classroom. She looked at the other girls walking in, arranging their belongings in the corner, and getting ready. She smiled and waved at them all, counting down the minutes until the beginning of the class. She closed her eyes and could almost hear a distant echo of her favorite classical music piece. She pictured herself and her classmates dancing with this song playing in the background. The ballet teacher opened the classroom door and asked the students to take their positions. Aria ran to the left side of the class. As she was following the teacher's instructions, she looked around at her friends. \"They all seem so happy!\" she thought. \"Ballet class is truly magical.\""},{"n":16,"type":"text","section":"Reading","stem":"Which of these sentences is correct?","options":["There were few vegetables left, so the guests enjoyed the food.","Mrs. Price was disappointed, so Dylan brought only five tomatoes and two carrots.","There were few vegetables left, so Mrs. Price decided to cook a different dish."],"passage":"<strong>Q16</strong><br>All kinds of vegetables grow in the Prices' garden. Mrs. Price, Dylan's mother, loves to plant vegetables there and cook them once they are ripe. Today she sent Dylan to pick some vegetables for a dinner party. She asked him to get four carrots, four tomatoes, three cucumbers, and an onion. But when Dylan came back from the garden, he brought only three tomatoes and two carrots. That was all that was left in the garden. Mrs. Price was a little disappointed, but thanked Dylan for his effort. She decided to cook a different dish than planned. Mrs. Price and Dylan cooked and set the table together. When the guests arrived, they enjoyed the food and said it was very tasty."},{"n":17,"type":"text","section":"Reading","stem":"The passage tells what the stepsisters asked the father to bring them and what the girl asked him to bring her. Why does the author make this comparison?","options":["It shows that the stepsisters do not like diamonds.","It shows how different the girl is from her stepsisters.","It shows that the girl is very similar to her stepsisters."],"passage":"<strong>Q17</strong><br>The wife of a rich man fell sick. When she felt she was going to die, she called her only daughter to her bedside and said, \"Always be a good girl, and I will watch over you.\" Soon after, she died. And the little girl was always good and kind to everyone around her. Time passed, and her father married another wife. This new wife had two daughters of her own that she brought home with her. The new stepsisters were beautiful, but bad at heart, and it was now a hard time for the poor little girl. \"You are good for nothing, and do not deserve to sit with us. Go to the kitchen and work!\" they told her. Then they took away her fine clothes and gave her an old grey dress to put on, and laughed at her. One time, the father was going into town and asked his wife's daughters what he should bring them. \"Fine clothes and diamonds,\" answered the stepsisters. \"Now, child,\" he said to his own daughter, \"what will you have?\" \"The first branch, dear father, that brushes against your hat when you turn your face to come home,\" she said. (adapted from Ashputtel (Cinderella), by the Grimm brothers)"},{"n":18,"type":"text","section":"Reading","stem":"Which season of the year was it probably?","options":["winter","autumn","summer"],"passage":"<strong>Q18</strong><br>Oliver and Mia were playing at the playground near their houses. Mia liked rock climbing, and Oliver preferred swinging high on the swings. After a while they went on the seesaw together, and then they played hopscotch. Soon they were hungry, so Oliver took a bag of almonds out of his pocket. They each ate a few almonds and then went bike riding. They rode over to the pond to see the ducks and the changing leaves on the trees. Just then, Mia's aunt drove by and waved. \"Mia, do you and Oliver need a ride home?\" she asked. \"No thanks,\" Mia called. \"We have our bikes!\" An hour later, Oliver and Mia ate more almonds and almost finished the bag. There were only three almonds left in the bag. \"It was really fun spending time with you today, Oliver,\" said Mia. \"Let's hang out next Saturday too!\" Oliver answered, \"OK, see you in school on Monday.\""},{"n":19,"type":"text","section":"Reading","stem":"Based on the paragraph and the prefix \"over-\", what is the meaning of the word \"oversensitive\"?","options":["too friendly","hurt too easily","too helpful"],"passage":"<strong>Q19</strong><br>Rachel saw Leonard sitting in the corner of the school yard, crying. She sat next to him and said, \"Hey, what's wrong?\" Leonard smiled at her and said, \"Hi, Rachel. I'm ok, don't worry. I had an argument with Lisa and I'm a bit upset, it's no big deal. I guess I'm oversensitive.\""},{"n":20,"type":"text","section":"Reading","stem":"Which is the first thing that happened?","options":["The dog pulled the boy to the shore","The dog was trying to catch a stick","The boy was kayaking with his father"],"passage":"<strong>Q20</strong><br>One day Rocky, the dog, was swimming in Roaring Fork River in Colorado. He was trying to catch a stick when Ryan Regan, an eight-year-old boy, floated by. The river was full of melted snow and Ryan was so cold he could not talk. Ryan had been kayaking with his father when their boat turned over and he fell into the water. Rocky knew the boy was in trouble and needed help, so he swam out to him. Ryan grabbed onto Rocky's collar and Rocky pulled him to shore, saving his life."},{"n":21,"type":"text","section":"Reading","stem":"Which is the meaning of the word \"revolutionized\" in the story?","options":["changed","ruined","saved"],"passage":"<strong>Q21</strong><br>Eli Whitney was a young boy who lived on a farm, but he wanted to be an inventor. When he was only a teenager, he made and sold nails in his father's workshop. He grew up and became a teacher and a farmer. He wanted more out of life, so he moved to the South. There he noticed that the farmers were spending a very long time picking cotton every day. He invented a machine called the \"cotton gin.\" It picked cotton quickly and separated the sharp parts from the soft part of the cotton plant. This revolutionized the way cotton was picked and increased the speed of the harvest as well as cotton sales."},{"n":22,"type":"text","section":"Reading","stem":"Which of the following is a hatchling?","options":["an animal of a class that includes lizards","the process of digesting food","a young animal that has recently hatched"],"passage":"<strong>Q22</strong><br>Crocodiles are large reptiles found in tropical regions of Africa, Asia, the Americas, and Australia. The crocodile's diet consists mainly of fish, reptiles, birds, and mammals. To help with digestion, crocodiles swallow small stones that grind up the food in their stomachs. Crocodiles can survive for months without food. Crocodiles lay 10 to 60 eggs at a time. The hatchlings are usually carried to the water in the mouth of their crocodile mother.<br><br>Glossary:<br>reptile: an animal of a class that includes snakes, lizards, crocodiles, turtles, and tortoises<br>region: a particular area<br>hatchling: a young animal that has recently come out of its egg<br>digestion: the process of digesting food"},{"n":23,"type":"text","section":"Reading","stem":"How was Lindsay and Gretchen's problem resolved?","options":["They each got the pet they wanted all along.","One of them got the pet she wanted all along, and the other was disappointed.","They decided on a pet together."],"passage":"<strong>Q23</strong><br>Lindsay and Gretchen are twins. They wished they had a pet at home. They almost managed to convince their mother to buy them a pet for their birthday, but it was delayed because each of them wanted a different pet. Lindsay thought a dog was the best choice, while Gretchen thought a hamster was the best choice. Lindsay and Gretchen's mother told them they had to decide together. \"Raising a pet involves a lot of responsibility. I want to make sure you are both mature enough.\" Lindsay and Gretchen went to the pet store after school. There, they decided together which pet to take. When they came back home with the new member of the family, their mother looked at it with surprise. Lindsay and Gretchen explained that this cute rabbit was looking at them with sad eyes, and they immediately knew it was the right pet."},{"n":24,"type":"text","section":"Reading","stem":"What is the setting of this passage?","options":["a hiking path","a narrow mountain road","a stump of tree over a river"],"passage":"<strong>Q24</strong><br>One morning, two mountain goats started to cross a very narrow log over a river. They started on opposite sides and met in the middle. They both thought they had the right of way. The first goat said to the second goat, \"You have to return to your side so I can cross. There is not enough room for both of us to cross each other!\" There would not have been enough room for even two little chipmunks to cross the log. The second goat was just as stubborn, and said, \"Why should I have to go back? You go back!\" The first goat said, \"If you don't go back then I will fight you!\" Risking both their lives, they started to fight, and they both fell into the river and were swept away by the current."},{"n":25,"type":"text","section":"Reading","stem":"How is the velveteen rabbit introduced in this story?","options":["by what he does","by what he thinks","by what he looks like"],"passage":"<strong>Q25</strong><br>There was once a velveteen rabbit, and in the beginning he was really splendid. He was fat and bunchy, as a rabbit should be; his coat was spotted brown and white, he had real thread whiskers, and his ears were lined with pink sateen. On Christmas morning, when he sat wedged in the top of the Boy's stocking, with a sprig of holly between his paws, the effect was charming. There were other things in the stocking, nuts and oranges and a toy engine, and chocolate almonds and a clockwork mouse, but the Rabbit was quite the best of all. For at least two hours the Boy loved him, and then Aunts and Uncles came to dinner, and there was a great rustling of tissue paper and unwrapping of parcels, and in the excitement of looking at all the new presents the Velveteen Rabbit was forgotten. (from The Velveteen Rabbit by Margery Williams)"},{"n":26,"type":"text","section":"Reading","stem":"What are the two passages mainly about?","options":["Spanish","plants","corn"],"passage":"<strong>Q26</strong><br>Passage 1: Corn is a type of plant. Corn was first domesticated by native peoples in Mexico about 10,000 years ago. Since the introduction of corn into Europe by Christopher Columbus and other explorers, corn has spread to all areas of the world suitable for its planting.<br><br>Passage 2: Corn is called maize by most countries. This comes from the Spanish word \"maiz.\" There are over 3,500 different uses for corn products, with the most popular being popcorn. Popcorn is seeds of corn that are heated until they burst, becoming light, white balls that are usually eaten with salt and butter or a sweet covering on them. As of 2012, the United States produces 40% of the world's total corn harvest."},{"n":27,"type":"text","section":"Reading","stem":"What is the author's viewpoint on babies?","options":["The writer thinks babies are boring.","The writer thinks babies mainly cry and sleep.","The writer thinks babies are fascinating."],"passage":"<strong>Q27</strong><br>Many people think babies' bodies are incapable of doing anything except crying and sleeping, but nothing could be farther from the truth! Babies are actually born with a set of skills and knowledge. A newborn can recognize his or her mother's voice at birth; this is the only sound they recognize, but they can recognize it from just one syllable. This is because babies can hear when they are in the womb and get used to the sounds. Babies also recognize the music their mother heard when they were still in the womb, and it soothes them more than other music. They breathe 40 times a minute, while adults breathe 12-20 times. Unlike adults, they can breathe and swallow simultaneously. But the most amazing fact is that newborns have accents when they cry. Studies have found that French babies wail on a rising melody, while German babies cry with a falling melody. Those patterns match the characteristic of their native language."},{"n":28,"type":"text","section":"Reading","stem":"What type of text is this?","options":["fable","nonfiction","short story"],"passage":"<strong>Q28</strong><br>The Galapagos penguin is a penguin that lives in the Galapagos Islands. The average adult Galapagos penguin is 19 inches long and weighs 5.5 lbs. Galapagos penguins have black heads and white bellies. The female penguins are smaller than the males. Galapagos penguins eat small fish. They search for food only during the day. The Galapagos penguin lays one or two eggs in places like caves, so that the eggs will not overheat from direct sunlight. One parent always stays with the eggs or chicks, while the other goes away for several days to find food."},{"n":29,"type":"text","section":"Reading","stem":"What type of text is this?","options":["a make-believe story","a newspaper article","a realistic story"],"passage":"<strong>Q29</strong><br>Two weeks after the beginning of the summer vacation, Edgar was preparing to board his first flight to Paris on his own. He was supposed to meet his older sister who worked at the embassy, and together they planned to tour the city. Edgar had his boarding pass and passport clutched in his hand. His mother hugged him tightly and said she would miss him, but would meet him at this same spot in a week. Edgar then boarded the plane. The flight attendants were very nice and brought Edgar a sandwich and a hot cup of chocolate during the flight. When he was finished eating, he read his book for a while and then immediately fell asleep. Several hours later, he landed. He was excited to meet his sister and tour the city."},{"n":30,"type":"text","section":"Reading","stem":"Which of the following can be concluded from the passage?","options":["If you are right-handed, you also fold your right arm over your left forearm.","It is possible to fold your arms in a different manner than usual.","L-type hand clasping might change throughout a person's lifetime."],"passage":"<strong>Q30</strong><br>There are two ways to fold your arms: with the right arm above the left forearm, which is characterized as R-type, or with the left arm above the right forearm, which is characterized as L-type. This is independent of whether the person is right-handed or left-handed. About 70% of the population is L-type. When attempting to fold arms in the opposite configuration than usual, the person may feel something is out of the ordinary. The manner of arm folding across the chest does not change throughout a person's lifetime. Hand clasping is another common gesture that can be done in two ways. When interlacing the fingers, people who hold the thumb of the right hand above the thumb of the left are R-type, while people who hold the left thumb over the right thumb are L-type. About 70% of the population is R-type. There is also one per cent of the population without a preference."},{"n":31,"type":"text","section":"Reading","stem":"Which propaganda technique is used in the expert's statement?","options":["loaded words","generalizations","red herring"],"passage":"<strong>Q31</strong><br>Using tablets in public schools is subject to an ongoing debate nowadays. Some schools already use them instead of textbooks, and in the near future, tablets may replace textbooks altogether. Tablets are a big industry, with 42% of US adults owning a tablet, nearly two-thirds of 2- to 10-year-olds having access to a tablet, and a third of children under five having their own tablet. Tablets are indeed lighter than textbooks, and a single tablet can hold hundreds of textbooks, plus homework, quizzes, and other files. However, not everyone approves of this change. It has been claimed that tablets cause too many distractions in class, allowing students to enter their e-mail and other websites, instead of listening to the teacher. Tablets have also been associated with a range of health problems, including eyestrain, headaches, and neck pain. In addition, it is worth mentioning that not everyone can afford their own tablet or even an internet connection at home. Also, tablets can crash or freeze in the middle of a lesson, unlike textbooks. It is yet unclear whether the education system will switch from print textbooks to digital textbooks on tablets in the near future. When asked to comment on the topic, an education expert recently stated, \"While many parents may have concerns on the subject, I can assure you that an open mind is necessary. The use of tablets has indeed increased in recent years, and it is a change. However, let us consider the fact that the weather has changed as well. Things change over time. Sometimes they are linked, sometimes they are not, but only time will tell.\""},{"n":32,"type":"text","section":"Reading","stem":"Which sentence does not belong in the paragraph?","options":["(1)","(2)","(4)"],"passage":"<strong>Q32</strong><br>(1) For thousands of years, people have been making up stories with imaginary creatures. (2) For example, the griffin is a creature with the body of a lion and the head and wings of an eagle. (3) The dragon is a creature that has wings and a pointy tail, and breathes fire. (4) The dog has been man's best friend for many years, too. (5) The phoenix is a bird that lives for 500 years and then burns to death, with a new phoenix rising from the ashes."},{"n":33,"type":"text","section":"Reading","stem":"Which description best defines the characteristics of fictional writing?","options":["A true story about a real person","Literary works whose content is produced by the imagination","Interpretation of science intended for a general audience"]},{"n":34,"type":"text","section":"Reading","stem":"What did they say to Audrey next?","options":["\"We came to tell you the party has been cancelled.\"","\"We are thinking of holding a party and would like your help in planning it.\"","\"We came to take you to the party. We forgot to send you the invitation!\""],"passage":"<strong>Q34</strong><br>Audrey is a special girl. She doesn't walk like the other children in her class. She has a wheelchair that helps her move around. Audrey loves studying, taking her dog on walks, and playing wheelchair tennis. One day, Audrey heard that some children in her class were organizing a party at the park. They were sending out invitations by email, but Audrey didn't get hers. She checked her email again and again, but the invitation hadn't arrived. One time, Audrey passed by a group of children from class who were standing in the corridor and talking. When they saw her, they suddenly went quiet. She was just able to hear one of them say, \"... so don't invite her!\" before they stopped talking. She knew they were talking about her, deciding not to invite her to the party, and was deeply hurt. She didn't hear one of the children say, \"I know what to do! Let's build a bridge over the stream so she can get to the party!\" The day of the party came and Audrey's invitation still hadn't arrived. She was sitting by the window with tears in her eyes and pain in her heart. She knew the party had already started. Suddenly, she saw two of her classmates walking up the driveway! They knocked on the door and she heard her mother saying, \"Hi, come in. Audrey is in the living room.\" The children came into the room and said, \"Hi Audrey! ...\""}];

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
