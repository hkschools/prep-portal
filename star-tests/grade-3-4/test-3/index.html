<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>STAR Reading Grade 3-4: Practice Test 3</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">STAR Reading Grade 3-4: Practice Test 3</div>
  <h2>STAR Reading Grade 3-4</h2>
  <p class="muted">34 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">STAR Reading Grade 3-4: Practice Test 3</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">STAR Reading Grade 3-4: Practice Test 3</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WI6eb90dDQsdx7lEuW3HqkI1KrU1N-mxK-_EwBqoTfmWst1Rci8f-ZVYkpLNw5N5/exec";
const TEST_ID = "STAR-G34-3";
const BANK_PATH = "star-tests/grade-3-4/test-3/bank.csv";
const TITLE = "STAR Reading Grade 3-4: Practice Test 3";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Which word best completes the sentence?","options":["lion","kitten","teapot"],"passage":"<strong>My cousin Tamara</strong><br>My cousin Tamara is as playful as a ____."},{"n":2,"type":"text","section":"Reading","stem":"What does the storm in the story symbolize?","options":["sadness","silence","danger"],"passage":"<strong>The Forest Walk</strong><br>It was late afternoon, and three young children were walking in the forest. The high trees were full of leaves and were blocking their view of the sky, but they were able to see the way. The day was hot, so hot that beads of sweat were running down the children's foreheads and cheeks, and their clothes were sticking to their backs. Small birds were flying around and chirping, but as the children kept walking, they could hear fewer and fewer birds. The trees were growing further apart now, and they could see the sky. Suddenly, they came to a clearing. They looked around them, unsure where to go next. Then, before they could reach a decision, they heard thunder in the distance and the sky above them turned dark almost at once. They looked up and saw clouds gathering up quickly, a storm was coming. Heavy raindrops started to fall all around them and the thunder grew louder and closer."},{"n":3,"type":"text","section":"Reading","stem":"What is the main idea of the paragraph?","options":["Chimpanzees and humans are part of the great ape family.","Both humans and chimpanzees eat plants and meat.","Chimpanzees and humans have great resemblance."],"passage":"<strong>Chimpanzees</strong><br>Chimpanzees are part of the great ape family, just like humans. Chimpanzees are our closest living relatives, and it is estimated that humans and chimpanzees share between 85% to 95% of the same DNA. Chimpanzees have complex greetings and communications and they are omnivorous (eat plants and meat), like us. Both chimpanzees and humans can see in color and create and use tools to help them with daily challenges."},{"n":4,"type":"text","section":"Reading","stem":"Which of these pairs of words shares the same meaning?","options":["fly, carry","hover, float","fabric, balloon"],"passage":"<strong>The Hot Air Balloon</strong><br>The hot air balloon is the oldest and the simplest of all flying machines. Two brothers from France were the inventors of the modern flying balloon. As paper mill owners, the brothers tried to float bags made of paper and fabric. When the brothers held a flame near the opening at the bottom, the bag expanded with hot air and hovered upward. In 1783, a hot air balloon carrying a sheep, a rooster, and a duck flew for eight minutes before the king and queen of France and the French court. Later that year, the balloon had its first human passengers."},{"n":5,"type":"text","section":"Reading","stem":"Which of the following definitions is the best definition for a simile?","options":["an expression whose meaning cannot be understood from the meaning of each separate word","a figure of speech used to compare two things using words such as \"like\" or \"as\"","a figure of speech used to compare two things without using words such as \"like\" or \"as\""]},{"n":6,"type":"text","section":"Reading","stem":"Choose the pair of words that are synonyms (two words that share the same meaning):","options":["lazy, tired","exceptional, common","precise, specific"]},{"n":7,"type":"text","section":"Reading","stem":"You are asked to write an essay about an object that is special to you. Which form of writing is appropriate for this topic?","options":["Expository writing","Persuasive writing","Descriptive writing"]},{"n":8,"type":"text","section":"Reading","stem":"Which of the following sentences includes a simile?","options":["Taylor's voice is music to his ears.","Yesterday was the hottest day of the year. It was boiling outside!","Calvin and his brother fought like cats and dogs."]},{"n":9,"type":"text","section":"Reading","stem":"Which of the following titles is most suitable for persuasive writing?","options":["Does the school day start too early?","Why does the weather become warmer in summer?","The coldest places on earth: an overview"]},{"n":10,"type":"text","section":"Reading","stem":"Which of the following would be the most appropriate topic for a persuasive essay?","options":["The story of my mother's life","Seasons of the year","Why baseball is the best sport"]},{"n":11,"type":"text","section":"Reading","stem":"Which of the following is used as a prewriting strategy?","options":["Rewriting","Clustering","Proofreading"]},{"n":12,"type":"text","section":"Reading","stem":"Who is the most appropriate audience for this paragraph?","options":["university professors","friends and family","newspaper readers"],"passage":"<strong>A Day with Grandma</strong><br>After school today, my grandma picked me up and took me to her house. I helped her make stuffed peppers for lunch. Then I sat at the kitchen table and tried to do my homework, but I was distracted by the sound of the rain outside. Grandma's cat came in and sat on my lap. I love that cat. In the evening, my grandma drove me home."},{"n":13,"type":"text","section":"Reading","stem":"Which detail does not support the main idea of the paragraph?","options":["You need to take the dog for a walk three times a day.","You need to bring it regularly to the veterinarian.","The most popular dog breed in America is the Labrador Retriever."],"passage":"<strong>Caring for a Pet Dog</strong><br>Taking care of a pet dog is not simple. You need to take the dog for a walk three times a day, bring it regularly to the veterinarian, and make sure it has fresh food and water every day. The most popular dog breed in America is the Labrador Retriever."},{"n":14,"type":"text","section":"Reading","stem":"Which of the following sentences from the passage is an opinion, not a fact?","options":["Duke Forest is in North Carolina.","It is a very beautiful place.","Duke Forest is filled with at least 100 kinds of trees and plants."],"passage":"<strong>The Camping Trip</strong><br>Leo, Jemma, and Grant went on a camping trip in Duke Forest with their parents. Duke Forest is in North Carolina. It is a very beautiful place. A creek runs through the forest, called New Hope Creek. When they arrived, Leo said, \"I want to find the creek!\" \"Me too!\" said Jemma. Leo and Jemma went on their mission, while Grant and their parents prepared sandwiches for everyone. Half an hour later, Grant noticed that his brother and sister had not come back yet. Grant and his parents went looking for Leo and Jemma. Suddenly, they heard Jemma giggle from far away. They kept walking until they found her chasing a butterfly. Leo was found a few minutes later, looking at plants he saw on the way. Duke Forest is filled with at least 100 kinds of trees and plants. The family went back to their camp site, amused that the mission to find the creek did not go as planned, but had at least turned out to be fun for Leo and Jemma."},{"n":15,"type":"text","section":"Reading","stem":"Which of the following sentences is grammatically correct?","options":["Some of them are from other countries, but all speaks English well.","The two boys who played together go to the same school.","Here is the books you were looking for all morning."]},{"n":16,"type":"text","section":"Reading","stem":"Which of the following is an example of a cause and effect relationship?","options":["Dylan picked some vegetables for dinner, so the neighbors complimented him and Mrs. Price on the excellent meal.","Dylan picked some vegetables for dinner, so he put the vegetables in a large bowl in the kitchen.","There were not enough vegetables left in the garden, so Dylan and Mrs. Price had to cook a different dish."],"passage":"<strong>The Garden Dinner</strong><br>A variety of vegetables grows in the Prices' garden. Mrs. Price, Dylan's mother, loves to plant vegetables in the garden and cook them once they are ripe. Today she sent Dylan to pick some vegetables for a dinner party with the neighbors next door. She asked him to get four carrots, four tomatoes, three cucumbers, and an onion. When Dylan arrived at the garden, he was surprised to see that there were only five tomatoes and two carrots left. He picked all the vegetables, returned to the house, and put the vegetables in a large bowl in the kitchen. Mrs. Price was a little disappointed there were not enough vegetables, but thanked Dylan for his effort. She consulted with Dylan and together they decided to cook a slightly different dish than planned. Mrs. Price and Dylan cooked, baked, and set the table together. The neighbors arrived at a quarter to seven, as planned. They enjoyed the food and complimented Dylan and Mrs. Price on the excellent meal."},{"n":17,"type":"text","section":"Reading","stem":"Which of the following is a difference between Beever's sidewalk drawings and Boston's sidewalk poetry, according to the passage?","options":["Beever's sidewalk drawings were created by an individual, while the sidewalk poetry was initiated by a collaboration.","Beever's sidewalk drawings were created with chalks, while the sidewalk poetry was created with permanent paint.","None of Beever's sidewalk drawings were painted on sidewalks in Boston."],"passage":"<strong>Sidewalk Art</strong><br>Sidewalks exist on almost every street, and though most are plain-looking, some are decorated. Sidewalk chalk art is found in many big cities in Europe and North and South America. One famous sidewalk chalk artist is Julian Beever, who is originally from the UK and has been creating drawings on sidewalks around the world since the mid-1990s. His drawings create the illusion of three dimensions: some feature holes in the sidewalk, that look so real that pedestrians walk around them instead of crossing them. Others feature extremely realistic swimming pools, dungeons, and scenes from famous movies. Boston sidewalks, another example of sidewalk art, feature a selection of poems that can only be seen when it rains. The poems were painted with a special paint that only appears when covered by fluids. The city of Boston and Mass Poetry, a non-profit organization, formed a collaboration called \"Raining Poetry\" and began painting the poems on the sidewalks in April 2016 in honor of National Poetry Month."},{"n":18,"type":"text","section":"Reading","stem":"What recently happened to Brianna and Tony's mother?","options":["She was sick.","She gave birth.","She came back from a vacation."],"passage":"<strong>The Candy Store</strong><br>One day, Brianna and Tony walked home from school. They stopped at their favorite candy store to buy some gum. Brianna has her own money because she babysits, so she can buy sweets for herself and for Tony. \"I'm delighted to see you both today,\" said Mr. Finn. \"How is your mother feeling?\" \"Much better, thanks,\" said Brianna. \"She still can't cook for us, and we have to help out more around the house right now.\" Brianna chose the pink gum ball and Tony chose the green one. Brianna paid Mr. Finn. \"Come back soon,\" said Mr. Finn, \"and congratulations on your new baby brother.\" \"Thanks,\" said Brianna and Tony together, as they walked out of the store toward home, popping their gum."},{"n":19,"type":"text","section":"Reading","stem":"Which of the following is a characteristic of descriptive writing?","options":["presents a conflict between two characters","states the author's opinion regarding a certain issue","appeals to the five senses and creates a vivid picture of a certain situation"]},{"n":20,"type":"text","section":"Reading","stem":"What happens every morning?","options":["The mother blends the ingredients, and then the child takes the cup and drinks it on the bus.","The child gets on the bus and drinks the milkshake, and then the mother blends the ingredients.","The mother blends the ingredients, and then the child eats breakfast and gets on the bus."],"passage":"<strong>Breakfast on the Bus</strong><br>My mom says breakfast is the most important meal of the day. I don't usually feel like eating until about 10 a.m., but I don't mind having a drink earlier in the morning. To solve this problem, my mom invented a breakfast drink for me. She takes milk, a banana, strawberries, and granola, and puts them all into a blender with ice. Then she blends it and pours it into a cup. I take the cup with me on the bus. I drink it on the bus, and when I get to school, my stomach is full and happy."},{"n":21,"type":"text","section":"Reading","stem":"Which sentence is grammatically correct?","options":["My father drank a cup of tea in the morning and driven to work with his colleague.","I wanted to watch the birds, but they had already flown away when I arrived.","He sleeps for eight hours every night and went to bed at 9 p.m."]},{"n":22,"type":"text","section":"Reading","stem":"What is the purpose of the subheadings?","options":["to hint about what will happen in the last paragraph","to teach the reader new words","to make it easier to locate information"],"passage":"<strong>The Oceanic Dolphin</strong><br>1. Dolphins are a diverse group of aquatic mammals. They live in all the oceans and even in some rivers. Most dolphins prefer the warmer waters of the tropic zones, but some prefer colder climates. Oceanic dolphins are one family of dolphins.<br><br><strong>What They Look Like</strong><br>2. Oceanic dolphins range in size. In some of the species, the males are larger than the females. They have two limbs that can be changed into flippers. They typically have \"beaks\" at the front of their heads, although there are exceptions to this rule. Their skin has a wide range of colors and patterns.<br><br><strong>What They Eat</strong><br>3. Most oceanic dolphins eat fish, along with a smaller number of squid and small crustaceans. Some of these dolphins also eat marine mammals and birds. They all only eat other animals. They typically have between 100 and 200 teeth. There are several ways of feeding among oceanic species. Corralling is a method in which dolphins chase fish into shallow water to catch them more easily.<br><br><strong>Senses</strong><br>4. Oceanic dolphins can make a broad range of sounds and whistles to communicate with other dolphins. The eye of an oceanic dolphin is small for an animal of its size, yet it does have a good eyesight. There are signs that suggest oceanic dolphins have no sense of smell. Oceanic dolphins are not thought to have a good sense of taste, as their taste buds are usually missing."},{"n":23,"type":"text","section":"Reading","stem":"Which literary device is used in the story?","options":["alliteration","rising action","imagery"],"passage":"<strong>The Babysitter's Story</strong><br>Eugene thought he and his little sister were too old to have a babysitter, but their parents, evidently, thought otherwise and insisted on bringing one every time they went out. They have endured some horrific babysitters, including one that sent them to bed at seven o'clock, and another who broke the DVD and then blamed it on them. But this one, their parents promised, was different. Even though Eugene doubted it, he had promised his parents to give her a chance. The babysitter was about seventeen years old, and her name was Laurel. As soon as their parents left, she asked Eugene and his sister Kathleen what they wanted to do. They wanted to watch television. Laurel joined them, but after about twenty minutes, she turned it off. \"Hey, we were watching that!\" Eugene protested. \"Oh, but I've got something much more interesting for us to do,\" Laurel replied. \"I'm going to tell you a story.\" Eugene and Kathleen exchanged gloomy looks. They were not in the mood for a story. They wanted to watch TV. But Laurel seemed so determined that they kept quiet. Laurel took a chair and sat in front of them. \"I want to tell you about something that happened to me two days ago,\" Laurel began. \"I was in the supermarket when a very old lady that I had never seen before came up to me and asked me if I was interested in a deal. I didn't know what she was offering, so I said, why not. She beckoned me over to a part of the supermarket I had never seen before, which was much darker than the rest of the store, with all kinds of strange products in languages I couldn't read...\" Eugene and Kathleen listened with their mouths open. A few minutes later, Laurel paused, took a deep breath and asked: \"So, would you like to watch TV now?\""},{"n":24,"type":"text","section":"Reading","stem":"Which transition word or phrase best completes the paragraph?","options":["in fact","otherwise","as a result"],"passage":"<strong>A Rushed Morning</strong><br>David was in a rush this morning. He left his house at the last minute, hurrying to an important meeting. When he reached his car, David noticed he had a flat tire. In order to drive his car, he had to replace the tire. He wasted a lot of time replacing the tire, and, ____, he was late for his meeting."},{"n":25,"type":"text","section":"Reading","stem":"Who is the speaker in this passage?","options":["the master of the house","a horse","a young bird"],"passage":"<strong>The First Place I Remember</strong><br>The first place that I can well remember was a large, pleasant, grassy field with a pond of clear water in it. Some trees leaned over it, and water-lilies grew at the deep end. Over the fence on one side we looked into a farmer's field, and on the other we looked over a gate at our master's house, which stood by the roadside. While I was young I lived on my mother's milk, as I could not eat grass. In the daytime I ran by her side, and at night I lay down close by her. When it was hot we used to stand by the pond in the shade of the trees, and when it was cold we had a nice warm barn near the trees. (adapted from Black Beauty by Anna Sewell)"},{"n":26,"type":"text","section":"Reading","stem":"What is the theme of this poem?","options":["thankfulness","friendship","loneliness"],"passage":"<strong>Happy Thought</strong><br>by Robert Louis Stevenson<br><br>The world is so full of a number of things,<br>I'm sure we should be as happy as kings."},{"n":27,"type":"text","section":"Reading","stem":"Which type of writing should you choose, if you want to describe the funny costumes your classmates wore to a Halloween party?","options":["A research paper","An informal essay","Business letter"]},{"n":28,"type":"text","section":"Reading","stem":"Which description best defines the characteristics of fictional writing?","options":["A true story about a real person","A report on news and current events","A story based on imagination"]},{"n":29,"type":"text","section":"Reading","stem":"Which of the following characteristics describes fictional writing?","options":["It deals with concrete facts about real people or events.","It gives basic instructions and directions for doing or making something.","It deals with imaginary characters and does not describe real people."]},{"n":30,"type":"text","section":"Reading","stem":"You are asked by your teacher to write a story for preschoolers about their first trip to the dentist. Which group of words is appropriate for your story?","options":["diagnosis, floss, brush","healthy teeth, friendly dentist, tooth fairy","tooth extraction, pain, fluorides"]},{"n":31,"type":"text","section":"Reading","stem":"Which answer is punctuated correctly?","options":["Liam lives in an old house next to the park. The address is 520 Holly St., Edmond, OK 73034.","Liam lives in an old house next to the park. The address is 520 Holly St. Edmond, OK 73034.","Liam lives in an old house next to the park. The address is 520 Holly St. Edmond OK 73034."]},{"n":32,"type":"text","section":"Reading","stem":"What is the last thing that happened?","options":["Peter ate cucumbers","Peter was looking for parsley","Peter met Mr. McGregor"],"passage":"<strong>Peter Rabbit</strong><br>Once upon a time, there were four little Rabbits, and their names were: Flopsy, Mopsy, Cottontail, and Peter. They lived with their Mother underneath the root of a very big fir tree. \"Now my dears,\" said old Mrs. Rabbit one morning, \"you may go into the fields or down the lane, but don't go into Mr. McGregor's garden. Now run along, and don't get into mischief. I am going out.\" Then old Mrs. Rabbit took a basket and her umbrella and went through the wood to the baker. She bought a loaf of brown bread and five currant buns. Flopsy, Mopsy, and Cottontail, who were good little bunnies, went down the lane to gather blackberries. But Peter, who was very naughty, ran straight away to Mr. McGregor's garden, and squeezed under the gate! First, he ate some lettuces and some French beans, and then he ate some radishes; And then, feeling rather sick, he went to look for some parsley. But round the end of a cucumber frame, whom should he meet but Mr. McGregor! (adapted from The Tale of Peter Rabbit by Beatrix Potter)"},{"n":33,"type":"text","section":"Reading","stem":"Which is the best thesis for a persuasive essay on the first time people landed on the moon?","options":["The moon landing was part of NASA's Apollo program.","The moon landing is an achievement that humanity would have certainly reached at some point in one way or another.","A famous sentence said by Neil Armstrong (the first person to walk on the moon) during the landing was, \"That's one small step for a man, one giant leap for mankind.\""]},{"n":34,"type":"text","section":"Reading","stem":"Your teacher assigns the topic \"Advancements in the building of skyscrapers in the world\" for a research paper. Which statement best describes the content of the paper?","options":["Advances in modern elevators","The tallest building in the world","High urban density demands taller buildings"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
