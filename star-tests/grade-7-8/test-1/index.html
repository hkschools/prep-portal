const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WI6eb90dDQsdx7lEuW3HqkI1KrU1N-mxK-_EwBqoTfmWst1Rci8f-ZVYkpLNw5N5/exec";
const TEST_ID = "STAR-G78-1";

const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Which word correctly completes the sentence?","options":["more busy","busier","busiest","busy"],"passage":"<em>This week was ____ than last week. I had a lot of meetings every day.</em>"},{"n":2,"type":"text","section":"Reading","stem":"In which of the sentences is the underlined word used correctly?","options":["I excepted his offer to buy the tickets.","All the players accept for the goalie wore long-sleeved shirts.","Except for Jonathan, nobody liked the new play.","Camilla likes all colors accept purple."]},{"n":3,"type":"text","section":"Reading","stem":"If someone were described as both \"naughty\" and \"nice\" in England in the 1300s, what might one conclude?","options":["This is a poetic and paradoxical description that uses seemingly contradictory terms to imply that he is both bad and good.","This is a complex person who is generally disobedient and often does bad things, but he is also very friendly and kind.","This person is severely lacking in both money and knowledge, making him poor and stupid.","There are numerous different things that this description could mean over that time period, including evil and careless, as well as poor and careful, and both words could even mean that he is needy."],"passage":"<strong>Naughty [ne-ti:]</strong><br>Origin (naught): Old Saxon neowiht &gt; Old High German niwiht &gt; Old English nawiht &gt; Early Middle English naught/nought.<br>Literal Translation: neo/ni/na = no (PIE root ne = not), wiht = thing/being &gt; nawiht = nothing &gt; +y (adj) &gt; naughty = has nothing.<br>Development: When naughty was first adopted by Early Middle English in the 1300s, it was the natural adjective extension of naught, referring to a person who has nothing, or more specifically a poor or needy person with no money and no possessions. It soon developed a connotation of being evil, as naught referred to the absence of morality. In the 1600s it developed a milder meaning, referring to disobedience and inappropriate behavior rather than true evil.<br><br><strong>Nice [na&#618;s]</strong><br>Origin: Latin nescius &gt; Old French nice &gt; Early Middle English nice.<br>Literal Translation: ne = not (PIE root ne = not), scius = knowing (Latin root sci = know) &gt; nescius = not knowing.<br>Development: The original Latin word referred to someone who was ignorant or did not know many things. When it was adopted in France as nice in the 1100s, it developed connotations of being foolish, careless, and even needy and pathetic. When the word was picked up by English in the 1300s, it meant ignorant or stupid like the Latin version, and it continued to change little by little over the centuries, subtly switching from a negative connotation to a positive one, listed here in chronological order from the 1300s to the 1800s: ignorant, foolish, naive, timid, delicate, careful, precise, agreeable, delightful, and finally kind."},{"n":4,"type":"text","section":"Reading","stem":"Which possible meanings does the word terrific have in the sentence?","options":["long or short","worrying or relaxing","marvelous or delicious","intense or frightful"],"passage":"<em>Owing to a terrific storm, the captain of the ship had to postpone his departure.</em>"},{"n":5,"type":"text","section":"Reading","stem":"Which of the words in the paragraph are conjunctions?","options":["to, not, although, on, and","since, although, but, after, and","since, not, but, on, to","have, after, our, the, but"],"passage":"Yesterday, I went to a movie with my brother. We thought we would not make it on time since we could not find the keys to my car. Although we usually have the same taste in movies, this time I liked the movie, but my brother did not. After the movie was over, we went to our favorite diner and ordered two tasty smoothies."},{"n":6,"type":"text","section":"Reading","stem":"Which of the following words is a synonym of the word omniscient?","options":["powerful","alienated","all-knowing","thoughtful"],"passage":"<em>Despite the fact that he always thinks he knows everything, he is not omniscient.</em>"},{"n":7,"type":"text","section":"Reading","stem":"Which of the following is the MOST accurate description of what an ontological proof of God is?","options":["using the concept of existence to prove that there is a God","a philosophical argument that aims to prove that God exists","a metaphysical study that proves God's existence scientifically","a proof for God's existence that shows how he is connected to different concepts within his domain"],"passage":"<strong>Ontological</strong><br>1. of or relating to ontology<br>2. displaying the connections between concepts in a given domain<br>3. related to or being a product of the concept of existence<br><br><strong>Ontology</strong><br>A metaphysical study of the nature of being and existence.<br><br>One of the more favored positions among intellectual theists is the idea that the existence of God can be proven philosophically. One such argument is called an ontological proof; it claims that God's existence can be proven from the very fact that things exist. While science can explain how the world has evolved from the smallest point to become the way it is now, it cannot explain why anything exists in the first place. Therefore, it must be because God made it so. Others claim that this ontological proof is foolish, for what, then, can account for the existence of God himself in the first place?"},{"n":8,"type":"text","section":"Reading","stem":"Which word does not go with the other four?","options":["barren","ample","abundant","copious"]},{"n":9,"type":"text","section":"Reading","stem":"Ultimate is the opposite of","options":["eventual","initial","essential","fundamental"]},{"n":10,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence.","options":["nurture","compliment","deter","covet"],"passage":"<em>As part of its new curriculum, the school offered special afternoon music lessons in order to ____ musical students.</em>"},{"n":11,"type":"text","section":"Reading","stem":"You are asked to write a paper that describes two of the largest land animals in our planet, the African elephant and the hippopotamus. Which method of organization would be the most effective in writing this paper?","options":["sequence","cause and effect","problem and solution","comparison-contrast"]},{"n":12,"type":"text","section":"Reading","stem":"The White Rabbit's words are an example for which literary device?","options":["metaphor","anthropomorphism","onomatopoeia","personification"],"passage":"\"...suddenly a White Rabbit with pink eyes ran close by her. There was nothing so very remarkable in that; nor did Alice think it so very much out of the way to hear the Rabbit say to itself, 'Oh dear! Oh dear! I shall be late!' (When she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually took a watch out of its waistcoat-pocket, and looked at it, and then hurried on, Alice started to her feet...\" (Taken from Alice's Adventures in Wonderland by Lewis Carroll)"},{"n":13,"type":"text","section":"Reading","stem":"The paragraph compares climbing El Capitan and Half Dome to","options":["running a marathon","climbing the Alps","becoming an adult","\"the valley\""],"passage":"No matter where they come from, from the Alps to the Andes, all self-respecting rock climbers yearn to make a pilgrimage to \"the valley\" to measure themselves against its giants: El Capitan, a shimmering prow of stone so immense it makes the hundred-foot ponderosa pines at its base look miniature; Cathedral Rocks, a dark fortress forever in the shade; and Half Dome, a granite apple cleaved in half, its soaring northwest face an invitation to the boldest climbers in the world. To climb here is a rite of passage."},{"n":14,"type":"text","section":"Reading","stem":"How does the author's use of vivid imagery contribute to the effectiveness of the passage about the Rolling Cheese Competition in England?","options":["It exaggerates the importance of cheese and creates a whimsical atmosphere regarding England's Rolling Cheese Competition.","It exposes readers to many details that enrich their knowledge about England's Rolling Cheese Competition.","It brings the event to life, allowing readers to visualize and immerse themselves in England's Rolling Cheese Competition.","It instills a sense of pride by describing the daring competitors of England's Rolling Cheese Competition."],"passage":"In the picturesque countryside of England, where traditions and eccentricities go hand in hand, there exists a competition that rolls its way into the hearts of participants and spectators alike: the Rolling Cheese Competition. Prepare yourself for a whimsical journey through the undulating hills and valleys, where wheels of cheese take center stage and gravity plays its mischievous part. Picture this: a group of daring individuals lining up at the top of a hill, their eyes fixed on the coveted prize, a hefty wheel of cheese. With their determination as strong as the pungent aroma wafting through the air, they brace themselves for the madcap descent that lies ahead. Yes, ladies and gentlemen, it's time to roll some cheese! As the whistle blows, chaos ensues. Competitors scramble to chase their runaway wheels, their limbs flailing about in a dance of desperation. The hills echo with triumphant laughter as participants stumble, tumble, and sometimes even somersault their way to the finish line. Oh, the lengths people will go for a taste of victory! Amidst the laughter and comradery, one cannot help but marvel at the spectators who gather to witness this spectacle. They cheer with exuberance, their faces a mosaic of delight and disbelief."},{"n":15,"type":"text","section":"Reading","stem":"Shaquille's concluding words in this passage are an example of which literary device?","options":["metaphor","irony","alliteration","hyperbole"],"passage":"After school, Shaquille went with his friends to the basketball court for a game. On their way, he had bumped into a pile of pruned branches and gotten a flat tire. The group was in a rush to reach the basketball court before it would rain and was excited to finally spend some time together. So, Shaquille decided to deal with the flat tire later. When they finished their basketball game, it was clear to him that he should have headed home a long time ago; he was the only one who lived on the East side, and it would take him an hour to get home. Now, the sky was gray, and he noticed that a storm was approaching rapidly. The clouds were dark, and the strong winds whistled in his ears. \"It's going to start raining soon,\" he thought to himself while walking. He considered his options: He could leave his bicycle and run home or continue walking with it. \"I wish I could just ride it,\" he thought. Now, the streets were deserted, and there was no one in sight. The temperature dropped quickly, and the boy was shivering. He still had a long walk. \"This is just perfect,\" he said to himself, and then he added, \"this has got to be the best day of my life.\""},{"n":16,"type":"text","section":"Reading","stem":"Donna and Brono were asked to create a presentation for their class entitled: \"Exploring the Benefits of Organic Food: A Holistic Approach to Healthy Living.\" Which detail does not support the topic of the presentation?","options":["The claim that there are potential health benefits associated with organic food consumption.","The claim that organic food is free from harmful pesticides and synthetic chemicals.","The claim that organic food offers a stronger taste and flavor compared to conventionally grown alternative.","The claim that organic food and conventionally grown food have similar nutritional content."]},{"n":17,"type":"text","section":"Reading","stem":"What is the meaning of the simile in this sentence?","options":["The light of the lamp alternates between yellow and blue.","The light of the lamp is very intense.","The lamp does not work properly.","The lamp is a source of heat."],"passage":"<em>The light that came out of the lamp was like sunshine.</em>"},{"n":18,"type":"text","section":"Reading","stem":"Which of the following arguments uses the least valid reasoning?","options":["\"Choosing clothes is one of the main ways people express their personalities.\"","\"Wearing uniforms does not help students learn any better, and instead makes school more boring.\"","\"When uniforms are required, the students' parents must buy them clothes that can only be worn to school, which is an inefficient use of money.\"","\"If teachers and administrators want to ensure that students wear appropriate clothes to school, a dress code can be enforced.\""],"passage":"Students should not be required to wear uniforms to school. Choosing clothes is one of the main ways people express their personalities. Wearing uniforms does not help students learn any better and, instead, just makes school more boring. When uniforms are required, the students' parents must buy them clothes that can only be worn to school, which is an inefficient use of money. It is much more cost-effective to buy everyday clothes that can be worn almost anywhere. If teachers and administrators want to ensure that students wear appropriate clothes to school, a dress code can be enforced. Students could then choose what to wear to school within a range of acceptable styles. I recently switched schools. My old school did not require uniforms, but my new school does. I feel more restricted at my current school than I did at my old school, which is making it harder to adjust to the change."},{"n":19,"type":"text","section":"Reading","stem":"Which of the following is an example of alliteration?","options":["lonely lasses, lazy lads","cherubs in clouds and cinnamon bread","they weep and sweep and fall asleep","muttering indistinctly under his breath"],"passage":"Frederick was walking down the long avenue that led from school to his house when he saw an old beggar sitting on the sidewalk leaning against a wall, his eyes closed and his hand outstretched. Frederick knew it was rude to stare, but decided to give the man a little money in case he was hungry. As Frederick drew closer, he noticed the old beggar was rocking back and forth, muttering indistinctly under his breath. Frederick leaned in to listen and realized the beggar was, in fact, singing:<br><br>\"Lonely lasses, lazy lads,<br>Cherubs in clouds and cinnamon bread.<br>They weep and sweep and fall asleep.<br>I turn my gaze at the red sky that's read.\"<br><br>Although Frederick could not perceive the meaning of the song, he was still impressed and put twice as much money as he had intended in the beggar's outstretched hand."},{"n":20,"type":"text","section":"Reading","stem":"What is the purpose of the descriptive language in the passage?","options":["to make the reader understand what the waves looked like","to explain why the heroine chose her profession","to add interest to the story","to teach the reader how to sail a boat"],"passage":"The pouring rain finally stopped, and the sailor spotted the lighthouse in the distance. The terrible weather conditions turned her journey into a dangerous experience. The waves that had surrounded her, as high as buildings, as intimidating as lions, had finally gone. Her rocky boat stopped shaking as the wind settled. She had made the boat herself; longing thoughts were fleeting through her mind, of joyous days in the warm summer sun with her father, the old, experienced sailor, building the boat together. His voice rang in her ears: \"Someday, my child, you will conquer the seven seas.\" Shivering, her teeth chattering, she wrapped another thick blanket around her soaked clothes, hoping it would keep her warm. At last, the sailor was getting closer to the lighthouse. She was pleased to find the lighthouse emitted two flashes of light every three seconds, which meant she was on her way to the right lighthouse. Mercifully, she was not lost. Half an hour later, she finally reached the shore. The lighthouse keeper was waiting for her there to guide her to his cabin, where a blazing fireplace and a cup of hot tea were meant to keep her warm."},{"n":21,"type":"text","section":"Reading","stem":"Which of the following literary devices is present in the passage?","options":["imagery","hyperbole","metaphor","allegory"],"passage":"After dinner all the gang turned out to hunt for turtle eggs on the bar. They went about poking sticks into the sand, and when they found a soft place they went down on their knees and dug with their hands. Sometimes they would take fifty or sixty eggs out of one hole. They were perfectly round white things a trifle smaller than an English walnut. They had a famous fried-egg feast that night, and another on Friday morning."},{"n":22,"type":"text","section":"Reading","stem":"Which of the following sentences uses vivid imagery?","options":["Sometimes loud planes fly over our house and annoy us.","Plankton are tiny creatures that play an essential role in ocean ecosystems.","The National Mall in Washington, D.C. is a park, not a shopping mall.","Smooth, flat stones are perfect for skipping on a lake to make rippling patterns."]},{"n":23,"type":"text","section":"Reading","stem":"According to the passage, which of the following caused the natives of the new world to disappear?","options":["The mindset of the Spanish settlers that only they were allowed to live in the new world","The natives' refusal to pay tribute and the Spaniards' reaction to this","The arrival of vessels from England and France to the settlements of the new world","A war of extermination against the seamen from Northern Europe"],"passage":"After the discoveries of Columbus, the Spanish mind seems to have been filled with the idea that the whole undiscovered world, wherever it might be, belonged to Spain, and that no other nation had any right whatever to discover anything on the other side of the Atlantic, or to make any use whatever of lands which had been discovered. In fact, the natives of the new countries, and the inhabitants of all old countries except her own, were considered by Spain as possessing no rights whatever. If the natives refused to pay tribute, or to spend their days toiling for gold for their masters, or if vessels from England or France touched at one of their settlements for purposes of trade, it was all the same to the Spaniards; a war of attempted extermination was waged alike against the peaceful inhabitants of Hispaniola, now Hayti, and upon the bearded and hardy seamen from Northern Europe. Under this treatment the natives weakened and gradually disappeared; but the buccaneers became more and more numerous and powerful. (Taken from \"Buccaneers and Pirates of our Coasts\" by Frank R. Stockton)"},{"n":24,"type":"text","section":"Reading","stem":"What does \"I threw caution to the wind\" mean?","options":["I did something risky.","I overcame my childish fears.","I considered the situation very carefully.","I ignored the fear in my heart."],"passage":"I threw caution to the wind and decided to take a shortcut through the dangerous woods. As I stepped into the forest, the sunlight began to set, and the tall trees emerged above me, casting long shadows on the ground. The crunching of the leaves and the occasional snap of branches beneath my feet were the only sounds in the silent forest. My heart raced as I realized that I was alone, with no one to accompany me on this frightening walk. The trees seemed to close in around me, and the darkness deepened with each step. As I continued to walk, my mind filled with the stories I had heard about the creatures that lurked in these woods."},{"n":25,"type":"text","section":"Reading","stem":"Why did Mrs. Chester tell Amy to give up her table?","options":["Mrs. Chester wanted Amy at the flower table because her own daughter wanted Amy's table.","Mrs. Chester and her daughter thought Amy's design of the table was unfitting to the fair.","Mrs. Chester was sure Amy would not mind, since she was deeply interested in the cause of the fair.","Mrs. Chester's daughter was jealous of Amy because of a man or some men and asked her mother to do so."],"passage":"Amy's dismay can be imagined, when, the very evening before the fair, as she was putting the last touches to her pretty table, Mrs. Chester, who, of course, resented the supposed ridicule of her daughter, said, in a bland tone, but with a cold look, \"I find, dear, that there is some feeling among the young ladies about my giving this table to anyone but my girls. As this is the most prominent, and some say the most attractive table of all, and they are the chief getters-up of the fair, it is thought best for them to take this place. I'm sorry, but I know you are too sincerely interested in the cause to mind a little personal disappointment, and you shall have another table if you like.\" Mrs. Chester fancied beforehand that it would be easy to deliver this little speech, but when the time came, she found it rather difficult to utter it naturally, with Amy's unsuspicious eyes looking straight at her full of surprise and trouble. Amy felt that there was something behind this, but would not guess what, and said quietly, feeling hurt, and showing that she did, \"Perhaps you had rather I took no table at all?\" \"Now, my dear, don't have any ill feeling, I beg. It's merely a matter of expediency, you see, my girls will naturally take the lead, and this table is considered their proper place. I think it is very appropriate to you, and feel very grateful for your efforts to make it so pretty, but we must give up our private wishes, of course, and I will see that you have a good place elsewhere. Wouldn't you like the flower table? The little girls undertook it, but they are discouraged. You could make a charming thing of it, and the flower table is always attractive, you know.\" \"Especially to gentlemen,\" added May, with a look which enlightened Amy as to one cause of her sudden fall from favor."},{"n":26,"type":"text","section":"Reading","stem":"Which is the best thesis statement for a persuasive essay on the importance of reducing plastic waste?","options":["Reducing plastic waste is an important global priority that demands environmental activists' action, as it will preserve the environment.","Reducing plastic waste is an urgent global priority that demands collective action, as it ensures the sustainability of our planet for future generations.","Reducing plastic waste is an imperative global priority, as plastic pollution has detrimental effects on marine life.","Reducing plastic waste is an urgent global priority, as there are economic and health risks posed by excessive plastic waste."]},{"n":27,"type":"text","section":"Reading","stem":"How does the structure of the paragraph support its meaning?","options":["It helps the reader imagine what it might be like to meet a unicorn.","It compares and contrasts the visual appearance of unicorns throughout cultures.","It presents the various symbolic meanings of unicorns in a way that is easy to follow.","It functions as an analysis of unicorn-related folklore in different cultures."],"passage":"Unicorns are mythical creatures that have captured the imagination of children and adults alike for centuries. They are often depicted as horse-like creatures with a single, spiraled horn on their forehead and a mane and tail that shimmer in the sunlight. While they are fictional creatures, they hold a special place in popular culture and are associated with various symbolic meanings. One of the most common themes that unicorns represent is purity and innocence. They are often portrayed as gentle and graceful creatures that are untainted by the evils of the world. This is reflected in their depictions as white creatures, often in a forest or meadow setting. Unicorns also represent hope and magic. The idea of a creature that possesses magical powers, such as the ability to heal or grant wishes, is a captivating concept that has been explored in literature, art, and pop culture. Unicorns often appear in fantasy stories and movies as symbols of hope, bringing positivity in dark and challenging situations. While their symbolic meaning may vary depending on the context in which they are used, unicorns continue to captivate people with their beauty, mystery, and magical qualities."},{"n":28,"type":"text","section":"Reading","stem":"Which of the following most accurately states the main idea of the passage?","options":["The lives of indifferent people are of no consequence.","Indifference obstructs change and endangers our humanity.","Indifference is dangerous because it is highly seductive.","We must do everything possible to eliminate suffering."],"passage":"What is indifference? Etymologically, the word means \"no difference.\" A strange and unnatural state in which the lines blur between light and darkness, dusk and dawn, crime and punishment, cruelty and compassion, good and evil. Of course, indifference can be tempting, more than that, seductive. It is so much easier to look away from victims. It is so much easier to avoid such rude interruptions to our work, our dreams, our hopes. It is, after all, awkward, troublesome, to be involved in another person's pain and despair. Yet, for the person who is indifferent, his or her neighbor are of no consequence. And, therefore, their lives are meaningless. Their hidden or even visible anguish is of no interest. Indifference reduces the other to an abstraction. In a way, to be indifferent to that suffering is what makes the human being inhuman. Indifference, after all, is more dangerous than anger and hatred. Anger can at times be creative. One writes a great poem, a great symphony, one does something special for the sake of humanity because one is angry at the injustice that one witnesses. But indifference is never creative. Even hatred at times may elicit a response. You fight it. You denounce it. You disarm it. Indifference elicits no response. Indifference is not a response. Indifference is not a beginning; it is an end."},{"n":29,"type":"text","section":"Reading","stem":"Which of the following statements accurately evaluates the argument presented in the passage?","options":["The passage provides insufficient evidence to support the claims about the benefits of meditation.","The studies mentioned in the passage are up to date but are not reliable.","The passage presents compelling evidence from multiple studies that support the main argument.","The passage fails to address the potential limitations of regular meditation practice."],"passage":"In recent years, there has been a growing interest in the health benefits of meditation. Studies have suggested that regular meditation practice can reduce stress, improve focus, and promote overall well-being. A 2021 study published in the Journal of Mindfulness that included 100 participants reported significant improvements in the participants' mood and cognitive performance after a 10-week meditation program. Another study published in the British Medical Journal in 2022 included 500 participants and showed an improvement in measures of anxiety after a 3-month meditation program that included a daily 15-minute session. The most recent study, published in 2023 in the Journal of Psychiatric Research included 1500 participants as well as a control group and showed staggering structural and functional brain changes in the brains of 750 participants with a long-term traditional meditation practice. These studies provide compelling evidence for the numerous benefits of meditation."},{"n":30,"type":"text","section":"Reading","stem":"How does the author establish a sense of wonder and fascination surrounding fireflies?","options":["By highlighting the fireflies' unique characteristics and behavior.","By mentioning that fireflies are all around us.","By providing a scientific explanation for what bioluminescent is.","By suggesting that fireflies are capable of producing different colors of light."],"passage":"Fireflies are enchanting creatures that light up the twilight hours with their mesmerizing glow. These tiny insects belong to the beetle family and possess a unique talent for producing bioluminescent light. They can be found in various habitats around the world, from forests to gardens, swamps, riparian areas, and abandoned fields. As twilight descends, they take to the air, their delicate wings carrying them on graceful flights. Fireflies are primarily carnivorous insects, feeding on other small creatures such as snails and worms to meet their nutritional needs without excessive consumption. In order to attract potential mates, these luminous insects engage in a remarkable courtship ritual. Males produce a series of synchronized flashes, creating a mesmerizing light show to capture the attention of females. Each species has its own unique flashing pattern, like a secret code only understood by their own kind. In the realm of fireflies, light becomes a language, a beacon of connection and attraction. The presence of fireflies reminds us of the beauty that can be found in the simplest of creatures, igniting our own curiosity and fascination with the natural world."},{"n":31,"type":"text","section":"Reading","stem":"What is the structure of the poem?","options":["limerick","haiku","free verse","sonnet"],"passage":"<strong>Ozymandias, by Percy Bysshe Shelley</strong><br><br>I met a traveller from an antique land,<br>Who said: \"Two vast and trunkless legs of stone<br>Stand in the desert. ... Near them, on the sand,<br>Half sunk a shattered visage lies, whose frown,<br>And wrinkled lip, and sneer of cold command,<br>Tell that its sculptor well those passions read<br>Which n do the same.","The main goal of bees is to keep up the supply of bees.","Bees toil their entire lives so that the next generation can do more, such as improve the color or smell of the flowers."],"passage":"It comes, then, to this. The bee devotes its whole life to preparing for the next generation. But what is the next generation going to do? It is going to spend its whole life preparing for the third generation... and so on for ever. An admirable community, the moralists tell us. Poor moralists! To miss so much of the joy of life; to deny oneself the pleasure (to mention only one among many) of reclining lazily on one's back in a snap-dragon, watching the little white clouds sail past upon a sea of blue; to miss these things for no other reason than that the next generation may also have an opportunity of missing them, is that admirable? What do the bees think that they are doing? If they live a life of toil and self-sacrifice merely in order that the next generation may live a life of equal toil and self-sacrifice, what has been gained? Ask the next bee you meet what it thinks it is doing in this world, and the only answer it can give you is, \"Keeping up the supply of bees.\" Is that an admirable answer? How much more admirable if it could reply that it was eschewing all pleasure and living the life of a galley-slave in order that the next generation might have leisure to paint the poppy a more glorious scarlet. But no. The next generation is going at it just as hard for the same unproductive end; it has no wish to leave anything behind it: a new colour, a new scent, a new idea. It has one object only in this world: more bees. Could any scheme of life be more sterile?"},{"n":34,"type":"text","section":"Reading","stem":"In which of the following does the author speak of cheese as if it were human?","options":["\"It all seems cheese.\"","\"There is too much odour about cheese.\"","Scent... that might knock a man over at two hundred yards.","\"It wants the whole const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
