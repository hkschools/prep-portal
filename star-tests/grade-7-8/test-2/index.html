const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6WI6eb90dDQsdx7lEuW3HqkI1KrU1N-mxK-_EwBqoTfmWst1Rci8f-ZVYkpLNw5N5/exec";

const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Which of the following words shares the closest meaning with the word induce?","options":["tell apart","beat down","go forth","bring about"]},{"n":2,"type":"text","section":"Reading","stem":"Which of the following words should be added into the passage in the indicated space?","options":["postpone","prevent","prolong","procrastinate"],"passage":"<em>\"Ladies and gentlemen, if I can have your attention for a moment, this is your captain speaking. We are experiencing some air-traffic difficulties due to unforeseen problems with some of the other airlines. Unfortunately, it appears that we are going to have to ____ our departure. Please remain seated, and we will update you with a new departure time as soon as we receive confirmation. We predict that this will not likely add any more than 45 minutes to the original arrival time. You may continue to use your hand-held electronic devices as you wish, yet seatbelts must remain fastened until you are instructed otherwise, as we may still be maneuvering on the runway. We thank you for your patience and apologize for the inconvenience.\"</em>"},{"n":3,"type":"text","section":"Reading","stem":"Which words suggest a positive meaning?","options":["nosy, unusual, crazy","curious, unusual, original","curious, weird, original","nosy, weird, crazy"],"passage":"Judy is a very (nosy, curious) person. She also has (unusual, weird) problem-solving methods and her ideas are usually (crazy, original)."},{"n":4,"type":"text","section":"Reading","stem":"Which of the following dictionary definitions corresponds with \"striking\" as used in the sentence above?","options":["extreme in a way that draws attention","attractive in an unusual way","the action of hitting","being on a strike"],"passage":"The poverty in some areas in the country is striking."},{"n":5,"type":"text","section":"Reading","stem":"Which transitional words and phrases are found in the paragraph?","options":["yesterday, as well, consequently, nevertheless","not to mention, consequently, nevertheless, after","not to mention, as well, at all, after","yesterday, that, consequently, so"],"passage":"Yesterday was my birthday party. I wasn't expecting so many people to arrive, not to mention that some people I didn't invite at all came as well. Consequently, we ran out of food and snacks. Nevertheless, everyone had great fun. After they all had left, my friend helped me clean the place."},{"n":6,"type":"text","section":"Reading","stem":"Which of the following words shares the closest meaning with the word eccentric?","options":["peculiar","eerie","elderly","jolly"]},{"n":7,"type":"text","section":"Reading","stem":"If the meaning of the prefix pseudo- is \"false\" or \"fake,\" which of the following might be described as \"pseudonymous\"?","options":["An author who publishes works under their real name","An author who publishes works under a fake name or alias","An author who never reveals their true identity","An author who deliberately includes intentional errors in their writing"]},{"n":8,"type":"text","section":"Reading","stem":"Which of the following words has the same root as the word micromanagement?","options":["microcosm","manager","unimaginable","engagement"]},{"n":9,"type":"text","section":"Reading","stem":"If the meaning of the suffix -phile is \"lover\" or \"enthusiast,\" which of the following might be described as \"bibliophile\"?","options":["someone who loves to analyze and decipher ancient languages","someone who loves to explore extreme and dangerous outdoor activities","someone who loves to collect and read books","someone who loves to study and analyze data and statistics"]},{"n":10,"type":"text","section":"Reading","stem":"Which of the following sentences provides the most helpful context for determining the definition of the word \"counterintuitive\" as it is being used?","options":["John went with the second option, despite it being counterintuitive to what he knew about public relations.","Saltwater is actually good for open wounds, despite being counterintuitive, and if you have a cut on your leg, you should not hesitate to go into the ocean.","Jan thought it was strange, but she agreed that despite the fact that it seemed counterintuitive, it actually made more sense to go under the fence than over in this case.","When Jack was taking his history exam, all of the answer choices for the question on Chinese exported goods seemed counterintuitive."]},{"n":11,"type":"text","section":"Reading","stem":"Which of the following is the best summary of the poem?","options":["In Colonial America, 1775, Paul Revere told his friend to watch to see when the British were coming to attack and to signal him when he sees them; Revere told him to hang a lantern in a church tower if they were coming by land or two lanterns if they were coming by sea. Revere saw two lanterns and began riding his horse in the middle of the night, warning the villages of the arrival of the British by sea. The people heard his warning and fought the British well prepared; the British then retreated in defeat.","I will tell you of Paul Revere's ride at midnight, April 18, '75, when Revere told his friend to let him know when the British were coming, and if by land or by sea. Revere waited impatiently by his horse on the opposite shore and watched the landscape. When he saw the signal for \"sea,\" he got on his horse and began to ride. He rode quickly through Middlesex, a shape in the moonlight, causing sparks to fly from the pebbles on the floor, determining the fate of the nation. You know the rest, America won its independence from the British in the war.","Paul Revere told his friend to signal one light if the British were coming by land and two if by sea. Revere watched the horizon and saw the light, then he rode his horse through the many villages of the colonies and told them that the British were coming. The soldiers fought and the Red Coats retreated, all thanks to the historical ride of Paul Revere.","The story of Paul Revere's midnight ride on April 18th begins with Paul telling his friend to signal him if the British were coming by land or sea. Revere waited by the shore until he saw a light shining from the church tower on the opposite shore. He mounted his horse but waited to see if there would be a second light; finally, he saw a second one which signaled that the British were coming by sea. He rode through the village of Middlesex and alerted the farmers and villagers to ready for war; as you know, his efforts were successful."],"passage":"<strong>Excerpts from \"Paul Revere's Ride\" by Henry Wadsworth Longfellow</strong><br><br>Listen, my children, and you shall hear<br>Of the midnight ride of Paul Revere,<br>On the eighteenth of April, in Seventy-Five:<br>Hardly a man is now alive<br>Who remembers that famous day and year.<br><br>He said to his friend, \"If the British march<br>By land or sea from the town to-night,<br>Hang a lantern aloft in the belfry-arch<br>Of the North-Church-tower, as a signal-light,<br>One if by land, and two if by sea;<br>And I on the opposite shore will be,<br>Ready to ride and spread the alarm<br>Through every Middlesex village and farm,<br>For the country-folk to be up and to arm.\"<br><br>Meanwhile, impatient to mount and ride,<br>Booted and spurred, with a heavy stride,<br>On the opposite shore walked Paul Revere.<br><br>But mostly he watched with eager search<br>The belfry-tower of the old North Church,<br>As it rose above the graves on the hill,<br>Lonely and spectral and sombre and still.<br>And lo! as he looks, on the belfry's height,<br>A glimmer, and then a gleam of light!<br>He springs to the saddle, the bridle he turns,<br>But lingers and gazes, till full on his sight<br>A second lamp in the belfry burns!"},{"n":12,"type":"text","section":"Reading","stem":"Which secondary source should Joey use for writing his paper?","options":["A documentary film made in the 20th century which describes the daily routine in a textile factory in the 19th century.","A diary of an iron factory laborer from the 19th century.","Photos of a factory from the 19th century.","A novel which tells the story of a laborer's family back in the early days of the Industrial Revolution."],"passage":"Joey wants to write a research paper about the early days of the Industrial Revolution during the 19th century."},{"n":13,"type":"text","section":"Reading","stem":"The author's attitude toward people who desire \"commendation of wit\" could best be described as","options":["combative","appreciative","deferential","critical"],"passage":"Some in their discourse desire rather commendation of wit, in being able to hold all arguments, than of judgment, in discerning what is true; as if it were a praise to know what might be said, and not what should be thought. Some have certain common-places and themes, wherein they are good, and want variety; which kind of poverty is for the most part tedious, and, when it is once perceived, ridiculous. The honourablest part of talk is to give the occasion; and again to moderate and pass to somewhat else, for then a man leads the dance. It is good in discourse, and speech of conversation, to vary and intermingle speech of the present occasion with arguments, tales with reasons, asking of questions with telling of opinions, and jest with earnest: for it is a dull thing to tire, and as we say now, to jade any thing too far. As for jest, there be certain things which ought to be privileged from it; namely, religion, matters of state, great persons, any man's present business of importance, any case that deserveth pity."},{"n":14,"type":"text","section":"Reading","stem":"How does the author persuade the readers that Jocelyn Bell should have received the Nobel Prize?","options":["The author uses scientific evidence.","The author uses repetition to emphasize the main point presented in the passage.","The author uses pathos to appeal to the emotions of the reader.","The author uses historical context to support the argument."],"passage":"Have you ever heard about Jocelyn Bell? She was an astrophysicist from Northern Ireland who discovered the first radio pulsars (rapidly spinning neutron stars) in 1967. Despite her enormous contribution to the field of astrophysics, it was her colleague Anthony Hewish who received the Nobel Prize for this finding, mainly because he was a man and Jocelyn was a woman. I believe there are two fundamental issues to discuss here. The first is fairness; Jocelyn Bell was the one who discovered pulsars and invested hours researching them. Therefore, she should have been credited for her amazing discovery and hard work. The second is women empowerment. Had Jocelyn Bell been awarded the Nobel Prize, it would have shown the scientific community that a woman scientist made a tremendous change in the science world by discovering pulsars. This could have inspired other females working in jobs dominated by males to excel and become role models. There is no doubt in my mind that Jocelyn Bell, the astrophysicist from Northern Ireland, is the winner, with or without a Nobel Prize."},{"n":15,"type":"text","section":"Reading","stem":"Which of the following does the last paragraph imply?","options":["Michelangelo was a better painter than a sculptor.","The chapel was Michelangelo's longest-running project.","Michelangelo was passionate about the work on the chapel.","Fungi almost never grow on wet plaster and ruin frescos."],"passage":"Michelangelo, born in Italy in 1475, was only 25 years old when he completed the Pieta. The religious statue of Mary cradling her dead son across her lap roused awe in its observers because of the fluidity of the figures' garments and the \"movement\" of Christ's skin. When Michelangelo sculpted David, Florence was experiencing difficult times. The artist used David as a symbol of courageous fortitude whose faith enabled him to triumph over his people's adversaries using only a sling. Michelangelo wrote in his diary: \"I insisted that the figure should stand before the Palazzo Vecchio, as a symbol of our Republic... He was a warning... whoever governed Florence should govern justly and defend it bravely.\" Michelangelo turned from sculpting to painting after he was commissioned to decorate the ceiling of the Sistine Chapel, a project that inspired and captivated his imagination. Originally planned to include the twelve Apostles, the painting grew to encompass over 300 figures. During Michelangelo's work an infectious fungus began to grow on the plaster, necessitating the removal of the painting entirely and forcing him to begin anew. Michelangelo dismissed all of his assistants, whom he regarded as incompetent, and continued working on the colossal painting on his own. The artist locked himself in the chapel and worked from dawn to dusk, until finally revealing the finished masterpiece after four years. To this day, the Sistine Chapel is considered a magnificent example of High Renaissance art."},{"n":16,"type":"text","section":"Reading","stem":"Which of the following words shows an onomatopoeia?","options":["telephant","trunk","buzzed","elephop"],"passage":"Once there was an elephant,<br>Who tried to use the telephant,<br>No! No! I mean an elephone<br>Who tried to use the telephone,<br>(Dear me! I am not certain quite<br>That even now I've got it right.)<br>Howe'er it was, he got his trunk<br>Entangled in the telephunk;<br>The more he tried to get it free,<br>The louder buzzed the telephee,<br>(I fear I'd better drop the song<br>Of elephop and telephong!)<br><br>(Eletelephony by Laura Elizabeth Richards)"},{"n":17,"type":"text","section":"Reading","stem":"When discussing the octopi's shortage of rigid body parts in the first paragraph, the author's tone can best be described as","options":["sorrowful","mocking","jesting","curious"],"passage":"Octopi are fascinating, eight-legged cephalopod mollusks that roam oceans around the world. Their legs usually have suction cups and their bodies are almost entirely soft, bearing no internal skeleton or protective outer shell. The only rigid part of their body is their beak, which might make you feel sorry for them, but in fact this enables them to squeeze through narrow openings to avoid predators. Another interesting piece of trivia is that octopi possess three hearts, two to pump blood into their gills and one to pump blood into the rest of their bodies. Octopi have quite a brief life expectancy, with some species only surviving for six months. Strangely enough, a common cause of death among the octopi community is reproduction, males die shortly after mating and females after their eggs hatch. A female octopus' optic glands release secretions that induce a genetically-programmed death. If these are removed, however, female octopi can enjoy a rather long and happy life. Experiments have shown that octopi are quite intelligent, they are capable of navigating mazes and solving problems. Unfortunately, they are probably unable to realize their full intellectual potential because of their short life spans."},{"n":18,"type":"text","section":"Reading","stem":"Which pieces of evidence from the passage best support the argument about the woolly mammoths' population?","options":["The dramatic changes in the tundra environment, the shortage of food sources, and the targeting of the woolly mammoths by hunters.","The loss of the woolly mammoths' main food sources in the tundra environment, the species' migration for new food sources, and human hunter's desire for the woolly mammoths' meat, bones, and ivory.","The overwhelming changes in the tundra environment, the shortage of food sources, the targeting of the woolly mammoths by hunters, and the species' decreased immunity.","The drastic changes in the tundra environment that resulted in the loss of food sources, early human hunting practices and the population of the species' meat, bones, and ivory."],"passage":"The woolly mammoth was a large, shaggy-haired mammal that roamed the icy tundra of North America and Eurasia during the last Ice Age. They were well-adapted to the cold climate, with long, curved tusks and a thick layer of fur. However, the woolly mammoth eventually faced extinction. As the climate started to warm and the ice began to recede, the habitat of the woolly mammoth changed dramatically. The loss of the tundra environment, that provided their main food source, led to a decline in their population. Additionally, early human hunters targeted woolly mammoths for their meat, bones, and ivory, contributing to their demise. Interestingly, as the woolly mammoths' population declined, they became more susceptible to various diseases. The changing environmental conditions and reduced genetic diversity within the dwindling population made them more vulnerable to outbreaks of infectious diseases. These diseases, coupled with other factors, further weakened the already declining woolly mammoth population."},{"n":19,"type":"text","section":"Reading","stem":"What is said on natural learning technique?","options":["it is short and easy","it is considered Top Down","it is more popular","it is less effective"],"passage":"Among students preparing for final exams, some rely only on the technique of short, frequent study sessions to improve studying results, and others observe only the natural learning sequence of moving from general issues to specific issues, also known as \"top-down\" learning. Those who rely only on the natural learning sequence get higher final exam scores than do those who rely only on short, frequent study sessions, so the natural learning sequence is more effective than are short, frequent study sessions in helping students improve their final exam scores."},{"n":20,"type":"text","section":"Reading","stem":"This stanza of the poem is an example of which genre of poetry?","options":["Haiku","Narrative","Lyric","Sonnet"],"passage":"I marvel how Nature could ever find space<br>For so many strange contrasts in one human face:<br>There's thought and no thought, and there's paleness and bloom<br>And bustle and sluggishness, pleasure and gloom.<br><br>(Taken from A Character by William Wordsworth)"},{"n":21,"type":"text","section":"Reading","stem":"Which mood does the writer try to convey in the paragraph?","options":["loneliness","sadness","anger","horror"],"passage":"It was a rainy and dark night. My parents went to a concert and would return home late at night, so I was the only person in the house. I had already gone to bed when I suddenly heard the basement door squeaking. I thought that it was probably just the wind, but it wouldn't stop squeaking. I took out a flashlight and went quietly downstairs to the basement. When I finally reached the basement door, I saw my dog, Bucky, trying to open his screen door to the basement. It kept squeaking as he couldn't open it fully."},{"n":22,"type":"text","section":"Reading","stem":"Which of the following affects the credibility of the argument in the passage?","options":["The study fails to provide supporting evidence for the relationship between sea levels and coastal floods.","The study exhibits bias towards the areas mentioned as most vulnerable to coastal flooding.","The study relies on outdated information regarding the most severe flood event.","The study contradicts its own findings by suggesting that flood events are increasing."],"passage":"A new study found a strong relationship between the highest measured sea levels and the incidence of coastal floods and highlights the most vulnerable areas to coastal flooding. These rely on a 2001 study on the subject that was published in the Journal of Environmental Studies. According to this study, the most severe flood in the dataset resulted from the storm surge events of 13-17 December 1989 when eight consecutive extreme high waters occurred. While the current study suggests that extreme sea-level events are becoming more common, it's necessary to reassess the occurrence of flood events in light of the potential limitations the new study presents."},{"n":23,"type":"text","section":"Reading","stem":"Which would be the main topic in an outline?","options":["Gymnastics","Track and Field","Coordination","Physical Education"],"passage":"Topics: Gymnastics, Track and Field, Team Games, Physical Education, Coordination"},{"n":24,"type":"text","section":"Reading","stem":"What is \"Come see the most active animals in the world!\" an example for?","options":["hyperbole","anthropomorphism","irony","oxymoron"],"passage":"Johnny had been looking forward to going to the zoo for weeks. He imagined seeing all sorts of animals and having the time of his life with his dad. But when he got there, he could not believe his eyes. The monkeys were sleeping, the lions were hiding, and the zebras were nowhere to be seen. Johnny couldn't help but chuckle at the sign that read \"Come see the most active animals in the world!\" next to the empty enclosures."},{"n":25,"type":"text","section":"Reading","stem":"Which of the following is used in the passage to create a mental image of the city of Genoa?","options":["personification","simile","irony","alliteration"],"passage":"The city of Genoa (Italian: Genova) is located in the north of Italy and is the sixth-largest city in Italy. Its uniqueness becomes evident when you start wandering around its streets. As you walk along the port, the smell of fresh fish surrounds you, nearly engulfing the strong smell of the ocean. The ocean is particularly beautiful in this city, with the water waltzing in the light wind and glowing in the evening sun with a unique hue. As you keep walking, you can hear the whisper of the waves on one side and the musical, loud Italian on the other; yes, the Genovese are warm, kind, and loud! Genoa is nicknamed \"The Vertical Town\" because of its many narrow, steep stairways in the middle of the street, many of which can only be climbed by one person at a time. The stairways are often the only way to get from one place to another in the streets of Genoa, so be prepared to climb quite a lot."},{"n":26,"type":"text","section":"Reading","stem":"What method of argument is used in the passage?","options":["argument by analogy","argument by authority","argument by emotion","argument by anecdote"],"passage":"Talc is a mineral that has been used for decades in cosmetic products, particularly in powders and blushes. It is valued for its ability to absorb moisture and provide a silky texture. However, the use of talc in cosmetics has come under scrutiny in recent years due to concerns about its safety. Recent research conducted in UCLA (University of California, Los Angeles) has suggested that talc may be linked to serious health conditions. Dr. Barbara Vandross explains, \"We found that some forms of talc contain asbestos, a substance known to cause cancer in and around the lungs when inhaled.\" Due to the potential contamination of talc with asbestos, the US Food and Drug Administration (FDA) emphasizes the importance in selecting talc mining sites carefully and in taking steps to test the ore sufficiently to ensure that all cosmetics are free of asbestos. The European Union Health Committee has taken even stricter measures and restricted the use of talc in all cosmetics."},{"n":27,"type":"text","section":"Reading","stem":"What makes Shinto become local and not globally spread?","options":["missionary work","emphasis on belief","its tiny home-shrines","it is an ethnic religion"],"passage":"Shinto is a religion in which devotees are concerned with their local shrine rather than the religion as a whole, having a tiny shrine-altar at home. Because it is focused on the land of Japan Shinto is clearly an ethnic religion. Therefore, Shinto is little interested in missionary work, and rarely practiced outside its country of origin. It is also an unofficial national religion with shrines that draw visitors from across the country. Because ritual rather than belief is at the heart of Shinto, Japanese people don't usually think of Shinto as a religion."},{"n":28,"type":"text","section":"Reading","stem":"Which of the following best describes the theme of the poem?","options":["Success is only fully understood by those who are victorious in battle.","Success is only truly coveted and understood best by those who failed to achieve it.","Success is never enjoyed once it is actually achieved.","Those who appreciate success the most are those who truly struggled and sacrificed for it."],"passage":"<strong>Success is counted sweetest by Emily Dickinson</strong><br><br>Success is counted sweetest<br>By those who ne'er succeed.<br>To comprehend a nectar<br>Requires sorest need.<br><br>Not one of all the purple host<br>Who took the flag to-day<br>Can tell the definition,<br>So clear, of victory,<br><br>As he, defeated, dying,<br>On whose forbidden ear<br>The distant strains of triumph<br>Break, agonized and clear!"},{"n":29,"type":"text","section":"Reading","stem":"What does it mean that the snake's movements were \"sinuous and fluid like a rippling stream?\"","options":["It moved in steady, continuous movement.","It moved slowly down the stream.","It moved menacingly in a direct path.","It moved slowly and cautiously through the grass."],"passage":"It was a sunny day in the middle of the summer vacation, the perfect opportunity for the family to observe the animals in the jungle. Julia, a curious and adventurous girl, was eager to see the Antiguan Racer, one of the rarest snakes in the world. It took Julia a minute to spot it. The snake slithered through the grass, its movements sinuous and fluid like a rippling stream of water rushing its way down the river."},{"n":30,"type":"text","section":"Reading","stem":"Which would be the strongest evidence for an argument about the benefit of utilizing wind power for electricity generation?","options":["Wind power is entirely free and requires no investment.","Wind power would reduce pollution from fossil fuels by 70%.","Wind power can be used with no limitation.","Wind power plants have a minimal impact on the environment."]},{"n":31,"type":"text","section":"Reading","stem":"How does the structure of the passage contribute to your understanding of the main idea?","options":["by presenting the order of importance","by considering arguments and counterarguments","by presenting the problem and a possible solution","by comparing the benefits of field trips to other educational activities"],"passage":"Field trips are an essential component of many educational programs, offering students the opportunity to learn about the world beyond the classroom. However, some argue that field trips should be done away with due to concerns over cost, the impact on instructional time, and of course, safety. In every field trip there is a potential safety risk associated with it, as students may be exposed to unfamiliar environments, animals, or weather conditions. Teachers and chaperones must be vigilant in ensuring the safety of all students, which can be a challenging task. While these concerns are valid, eliminating field trips would deprive students of valuable experiences that cannot be replicated within the confines of a classroom. Field trips offer hands-on learning opportunities that engage students in new and exciting ways, allowing them to explore subjects in depth and gain a deeper understanding of the world around them. Furthermore, field trips can foster social and emotional development, as students learn to work collaboratively and interact with new people and environments. Rather than doing away with field trips, educators should work to address safety and cost concerns while preserving the many benefits that these experiences offer to students."},{"n":32,"type":"text","section":"Reading","stem":"What rhyme scheme does this stanza follow?","options":["A, B, A, B","A, B, B, A","A, B, C, B","A, B, C, A"],"passage":"Ring out the old, ring in the new,<br>Ring, happy bells, across the snow:<br>The year is going, let him go;<br>Ring out the false, ring in the true.<br><br>(Taken from Ring Out, Wild Bells by Alfred Lord Tennyson)"},{"n":33,"type":"text","section":"Reading","stem":"How does the narrator's specific choice and usage of the word \"right\" in the third to last sentence of the first paragraph affect the meaning of the sentence?","options":["It deliberately portrays the \"sushi haters\" argument in a way that makes it sound less credible.","It uses sarcasm and hyperbole to express how much the narrator disagrees with the sushi haters.","It asserts that the \"sushi haters\" don't believe that sushi can taste good because of its odd ingredients.","It proclaims that since sushi is strange, people should legitimately not be allowed to think that it tastes good."],"passage":"One of the most popular foods across many different cultures and continents is the Japanese delicacy of sushi. Like most people, you are likely familiar with this strangely appealing food, and you may also count yourself among the millions that consider it one of their favorite things to eat. But have you ever wondered why on earth anyone ever decided that it would be a good idea to put raw fish in vinegared rice, wrap it in seaweed, and eat it with a side of pickled ginger? The outspoken minority group of sushi haters that you have doubtlessly encountered tend to point out this oddity as if it should somehow mean that sushi does not have a right to taste good. In truth, no one ever decided to test this recipe out off the top of their head because that would be ridiculous; this delicious abnormality evolved slowly over thousands of years. The basic practice of putting raw fish in vinegared rice dates back to Neolithic China, which refers to the tail end of the Stone Age when civilizations were just starting to be formed, anywhere between seven to twelve thousand years ago. After the rainy seasons, when a surplus of fish would pour into the rice fields from overflown lakes and rivers, the fish would be pickled and placed in fermented rice so that they could be preserved for months, ensuring food during the more difficult periods. This dish was called narezushi (which meant \"salted fish\"), and the rice was discarded before consumption, as only the fish was eaten. Narezushi became a staple of Southeast Asian diets by the second century CE, and it is believed to have reached Japan by the eighth century. Over time in Japan, more vinegar was introduced into the recipe, giving it a sourer taste and reducing the need for fermentation. The term sushi actually meant \"sour tasting\" in Japanese at the time. Once the rice and fish were no longer fermented, the people began eating the rice as well."},{"n":34,"type":"text","section":"Reading","stem":"Select the best evidence to support the statement that exercise can improve cognitive function.","options":["Research has shown that regular exercise can have a positive impact on cognitive function.","Studies have demonstrated that engaging in aerobic exercises, like running or swimming increases blood flow to the brain, delivering oxygen and nutrients that support brain health.","Exercise has been associated with the release of neurochemicals like endorphins and brain-derived neurotrophic factor (BDNF), which promote the growth and survival of neurons.","Physical activity has been linked to improved cognitive performance, including enhanced working memory, decision-making, and cognitive flexibility."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
