streaks were created abruptly by the forceful way in which the owner dried his car."],"passage":"<strong>Precipitate (adj.):</strong> Acting, doing something, or moving with excessive or careless speed. \"The man's precipitate departure from the store proved foolhardy when he realized what he had forgotten.\" Synonyms: cursory, hasty, helter-skelter, hurried, precipitous, rash, rushed. Antonyms: unhurried, unrushed.<br><br><strong>Precipitate (noun):</strong> 1. A product, outcome, or occurrence traceable to a specified cause or action. \"The riots were an obvious precipitate of the recent killings in the neighborhood.\" Synonyms: aftermath, backlash, consequence, effect, outcome, outgrowth, product, result. 2. A substance that settles to the bottom of a body of liquid, or is separated from a solution. \"The scientist filtered out the precipitate from his solution by lighting a fire beneath the vile.\" Synonyms: deposition, dregs, sediment, settlings.<br><br><strong>Sentence:</strong> The streak marks on the car were a precipitate of its owner's inadequate attempt to dry it."},{"n":6,"type":"text","section":"Reading","stem":"Choose the word that best completes the sentence:","options":["nourishing","promoting","exchanging","contaminating"],"passage":"<strong>Read the sentence.</strong><br>The local power plant was accused of ____ the water reservoir."},{"n":7,"type":"text","section":"Reading","stem":"What does the word \"eloquence\" mean in this context?","options":["The ability to manipulate others through cunning and deceitful words.","The use of flamboyant language to convey a message.","The act of expressing oneself in a monotonous manner.","The ability to express oneself clearly and effectively through spoken or written language."],"passage":"<strong>Read the sentences.</strong><br>1. The author's writing style was known for its eloquence, with beautifully crafted sentences that captivated readers.<br>2. The poet's eloquence on stage left the audience spellbound, moved by the power and emotion behind every word."},{"n":8,"type":"text","section":"Reading","stem":"Considering the context, which is the appropriate definition of the underlined word \"right\" as it appears in the sentence?","options":["something that one is entitled to morally or legally","directly or precisely, in relation to time or position","correct, or in accordance with fact","morally sound, or just"],"passage":"<strong>Read the sentence.</strong><br>It is not right to deny people services on the basis of their race."},{"n":9,"type":"text","section":"Reading","stem":"Which of the following words is the closest in meaning to the word designate?","options":["request","appoint","improve","promote"]},{"n":10,"type":"text","section":"Reading","stem":"Choose the correct word:","options":["interest","numbness","diligent","telepathy"],"passage":"<strong>Read the sentence.</strong><br>The opposite of apathy is ____"},{"n":11,"type":"text","section":"Reading","stem":"What have scholars tried to explain?","options":["why the kingdom collapsed","what the inscriptions say","the shift to maritime trade","the survival of the temples"],"passage":"<strong>Read the paragraph.</strong><br>Scholars have come up with a long list of suspected causes, including rapacious invaders, a religious change of heart, and a shift to maritime trade that condemned an inland city. It's mostly guesswork: Roughly 1,300 inscriptions survive on temple doorjambs and freestanding stelae, but the people of Angkor left not a single word explaining their kingdom's collapse."},{"n":12,"type":"text","section":"Reading","stem":"What is the purpose of this passage?","options":["It is the climax of the story it is taken from.","It functions as an exposition to the story it is taken from.","It is the setting of the story it is taken from.","It is the rising action of the story it is taken from."],"passage":"<strong>Read the passage.</strong><br>Many years ago, there was an Emperor, who was so excessively fond of new clothes, that he spent all his money in dress. He did not trouble himself in the least about his soldiers; nor did he care to go either to the theatre or the chase, except for the opportunities then afforded him for displaying his new clothes. He had a different suit for each hour of the day; and as of any other king or emperor, one is accustomed to say, \"he is sitting in council,\" it was always said of him, \"The Emperor is sitting in his wardrobe.\" (Taken from The Emperor's New Clothes by Hans Christian Andersen)"},{"n":13,"type":"text","section":"Reading","stem":"How does the author inform the reader about The Great Pacific Garbage Patch?","options":["The author explains the difference between various kinds of marine pollution.","The author presents it as an example of people's harmful behavior towards the environment.","The author gives possible solutions to The Great Pacific Garbage Patch.","The author emphasizes the location of The Great Pacific Garbage Patch; the North Pacific Ocean."],"passage":"<strong>Read the passage.</strong><br>The Great Pacific Garbage Patch is a massive area of ocean where tremendous amounts of plastic debris have accumulated due to ocean currents and human pollution. It is located in the North Pacific Ocean and is estimated to cover an area of around 1.6 million square kilometers (about twice the area of Texas). The garbage patch is not a solid mass of trash, but rather a swirling mixture of plastic, from large items like fishing nets and plastic bottles to tiny microplastics (plastic particles) that are almost invisible to the naked eye. Plastic pollution poses a significant threat to marine life, as animals can mistake the debris for food or become entangled in it, leading to injury or death. The Great Pacific Garbage Patch is just one example of the damaging impact that human activity can have on the environment, and it highlights the urgent need for more responsible waste management practices and greater awareness of the harm that plastic waste can cause."},{"n":14,"type":"text","section":"Reading","stem":"Lucy's words are an example for which literary device?","options":["metaphor","irony","alliteration","personification"],"passage":"<strong>Read the passage.</strong><br>Edmund's little sister, Lucy, suddenly started telling the entire family about a magical land she had found inside the closet. Edmund did not believe her, and he constantly made fun of her. A few days later, Edmund found out that Lucy hadn't been lying: the magical land was real! However, he didn't want the other family members to think he was insane like Lucy, so when they asked him about it, he lied, saying that he and Lucy had only been pretending that her land was real. \"Thank you very much, Edmund,\" said Lucy."},{"n":15,"type":"text","section":"Reading","stem":"You are writing an essay on the basic practice techniques in becoming a better baseball player. Who is the audience it should be written for?","options":["professional baseball players","beginning basketball players","people who do not play baseball","beginning baseball players"]},{"n":16,"type":"text","section":"Reading","stem":"Claire's sentiments toward her experiences can be best described as","options":["awe-inspired and reverent","overwhelmed and uncertain","intrigued and contemplative","tense apprehension"],"passage":"<strong>Read the passage.</strong><br>On a serene evening, as the sun's golden rays cast a warm glow upon the idyllic countryside, 25-year-old Ronald found himself immersed in a conversation with his 95-year-old grandmother Claire, a gentle soul deeply connected to the natural world. Nestled amidst a picturesque meadow, their exchange unfolded, revealing the profound influences that had shaped Claire's journey. Curiosity gleaming in his eyes, Ronald asked, \"Amidst the tapestry of your life, what event has left an indelible mark on your path?\" Claire's gaze wandered, momentarily lost in a sea of memories, before she replied, her voice laced with a sense of reverence, \"It is difficult to speak of just one, but if I had to choose, it would be the day I witnessed the awe-inspiring dance of the Aurora Borealis, or the Northern Lights, as most people know them.\" With a nostalgic smile, Claire began to recount the magical encounter: \"It was a crisp winter night, far away from the city's glare, where the night sky unveiled its majestic spectacle. As I stood there, under a canopy of stars, the darkness was pierced by ribbons of vibrant colors dancing across the heavens.\" She continued, her voice carrying a hint of wonder, \"In that moment, time seemed to stand still. The ethereal lights swirled and twirled, painting the sky with hues of green, blue, and purple. It was as if nature itself had crafted a symphony of light, a symphony that spoke to the depths of my soul.\""},{"n":17,"type":"text","section":"Reading","stem":"What would be the most impactful reason against irresponsible pranking?","options":["Pranks may be disrespectful.","Pranks may damage relationships.","Pranks may cause emotional distress or physical harm.","Pranks can lead to legal consequences and criminal charges."],"passage":"<strong>Read the passage.</strong><br>Pranks are a form of practical joke that are meant to be humorous or entertaining, typically played on friends, family, or acquaintances. They are often used to break the monotony of everyday life or to lighten the mood in social situations. Pranks can take many different forms, from simple inconveniences like hiding someone's keys, to more elaborate schemes like making a fake phone call to your best friend announcing he or she had won the lottery. They can be done for many different reasons, such as to make someone laugh, to seek revenge, or to prove a point. While they can be fun when done in good spirit, taking a prank too far can have serious consequences, both for the prankster and for the person being pranked, especially when performed on people who would not likely appreciate it, such as your teachers or principal, or a kid who is often picked on. What may start out as harmless fun can quickly turn into something hurtful and damaging. For instance, last year there was a man who had a heart attack after being pranked by three kids in the middle of the street."},{"n":18,"type":"text","section":"Reading","stem":"Which evidence best supports the thesis statement:","options":["A comprehensive study conducted by the National Education Association (NEA) reveals a strong correlation between smaller class sizes and improved academic performance, particularly in standardized test scores, across various grade levels in schools throughout the United States.","According to many parents across the United States, reducing classroom size is significant in improving test performance, as they attribute academic success primarily to individual effort and achievement.","An analysis of school funding data from multiple states suggests that allocating resources towards reducing classroom size is one approach to improving test performance, as other factors such as teacher quality and curriculum development are equally significant on student outcomes.","A meta-analysis of educational research indicates that there is a significant relationship between classroom size and students' motivation."],"passage":"<strong>Thesis:</strong> Reducing classroom size is the most effective way of improving test performance among students in the United States."},{"n":19,"type":"text","section":"Reading","stem":"Which of the following is the best description of the overall effect that the narrator's perspective has on the passage?","options":["It helps the reader understand how a path that takes more time can still be a shortcut.","It compels the reader to take Jake's side, such as in the argument about the shortcut.","It gives the reader a better understanding of where they are and what is going on by delving deep into the scenery.","It makes the story more interesting by providing a unique understanding of certain things that would otherwise be insignificant, such as the sky and the streets."],"passage":"<strong>Read the passage.</strong><br>Ezra and I were breezing through the crowded New York City streets as if the city were our backyard. I looked up at the cloudy sky every few moments expecting it to clear up. I didn't care that it was cloudy, I just felt that the sky was misbehaving, as if it hadn't cleaned up its room. Heck if I cared that its room was messy, as if I ever cleaned my own, but the sky usually did pretty frequently, even this time of year. But he was stubborn and kept it a mess for three days straight now. \"Turn here,\" I said to Ezra, \"it's a shortcut.\" Ezra was pretty good with directions, and he was especially familiar with this neighborhood. A few years back he lived in an apartment just two blocks away. \"Jake, there's no shortcut this way,\" he said. \"Yes, there is!\" I answered. \"We'll go down the stairs by Barry's Bagels and come out of the alleyway by the old playground.\" Ezra thought for a bit and replied, \"You mean the playground by 31st Street? We can't get there that way. That alleyway is blocked from that direction. There's a big metal fence there, Jake. And besides, that would probably take us the same amount of time anyway.\" \"I know there's a fence, dummy, that's what makes it a good shortcut! You've gotta pass some obstacles if you want to get somewhere faster.\" \"But you won't get there faster!\" he shot back. \"In fact, with the time it would take you to climb the fence it would take even longer!\" Ezra might have been good with directions, but he didn't really know the city like I did. Sure, he knew where the streets led to and how to get places and all that, but he didn't really get the city. To him, a street was a way to get places or a place to put stores and houses. But I knew the streets themselves. I knew their attitudes, their personalities, I knew which street was the bigshot in the neighborhood and which ones were shy. I knew which streets worked for which and how they felt about that. I knew when they were sad, scared, angry, or feeling adventurous. And I knew that the alleyway by the old park was a shortcut no matter how long it took because that was its personality."},{"n":20,"type":"text","section":"Reading","stem":"Which of the following sentences is an example of hyperbole?","options":["I have a million things to do.","She was shaking like a leaf.","She was busy from the moment we arrived until the moment we left.","Time is money."],"passage":"<strong>Read the passage.</strong><br>Last week I visited my mother's office. She works as a CEO of a big company. She was busy from the moment we arrived until the moment we left. She ran from meeting to meeting, wrote dozens of e-mails, and answered more phone calls than I could possibly count. The other workers kept going in and out of her office and asking her questions. One of the workers had lost an important file and came to apologize, shaking like a leaf. My mother said quietly, \"I have a million things to do now and I have no time to find a solution. Please ask your colleagues for assistance.\" After the next meeting, the worker came in again to announce the file had been found. My mother exhaled in relief. Then she explained to me just how important that file was. \"How did you manage to keep calm when it was missing?\" I asked. \"Panicking would not have helped,\" my mother replied. \"I was calm so they could keep calm and look for the file in peace. You can't be useful when you're panicking.\" \"But weren't you worried?\" I asked her. \"Of course I was,\" my mother answered. \"But time is money and I don't allow myself to get emotional.\""},{"n":21,"type":"text","section":"Reading","stem":"What is the main conflict in the story?","options":["Carmen teasing Corinna about her jeans and shoes and not inviting her to her parties","Corinna having a lot of work to do","Carmen's parents leaving her in charge of her sisters despite her incompetency","Corinna having to decide whether or not to help Carmen"],"passage":"<strong>Read the passage.</strong><br>Corinna was riding her bike along Wisteria Lane, thinking of her science test the next day. She liked science, but this week she had been busy and had barely studied. She would have to work hard tonight. As she kept riding, she suddenly heard someone scream from inside the nearest house and stopped her bike. Before she could do anything else, a girl came running out of the house and up to her, calling her name. Corinna knew the girl. It was Carmen, who was in her grade and whom she greatly disliked. Carmen had never invited Corinna to her birthday parties and had always made fun of Corinna's jeans and shoes, which were not trendy enough for her taste. \"Corinna,\" said Carmen, her eyes full of tears, \"can you please help me? My little sisters are crying, and I don't know what to do. None of the neighbors are home... My parents went on a day trip and left me in charge, and I don't know what to do... please?\" Corinna sighed, but something in Carmen's eyes made her unable to say no. She thought for a moment, then nodded and followed Carmen to the house. Carmen's little sisters were screaming and crying at the top of their lungs, but Corinna had four little brothers and sisters of her own and knew exactly what to do and how to calm them down. She left Carmen's house three hours later, with the girls fast asleep and Carmen thanking her repeatedly."},{"n":22,"type":"text","section":"Reading","stem":"Which of the following sentences is an example of metonymy?","options":["Aaron is an early bird, but Stacy is a night owl.","The White House made an announcement.","When you arrived it was like sunshine.","The wind blew by, stroking my hair and telling me that everything would be okay."]},{"n":23,"type":"text","section":"Reading","stem":"Which of the following answers includes some of the differences between Sirmen and Szymanowska, according to the text?","options":["Sirmen was Italian and Szymanowska was Russian; Sirmen's compositions influenced some famous composers and Szymanowska was more successful as a performer.","Sirmen was born earlier than Szymanowska; Sirmen was a pianist and Szymanowska was a violinist; Szymanowska was one of the first musicians to perform without notes.","Sirmen played the violin and Szymanowska the piano; Sirmen was Italian and Szymanowska Polish; Sirmen only performed with her husband while Szymanowska was a successful performer on her own.","Sirmen was an Italian violinist and Szymanowska a Polish pianist; Szymanowska was one of the first musicians to perform without notes."],"passage":"<strong>Read the passage.</strong><br>Maddalena Laura Sirmen was an Italian violinist and composer. She was born in 1745 in Venice, Italy. It was difficult for women to succeed as musicians at that time, and Sirmen only became successful after her marriage to a renowned violinist, Ludovico Sirmen. The couple performed together, which allowed Maddalena to build a reputation, and later a solo career. She was a successful performer and an even more successful composer; her violin compositions were considered \"brilliant.\"<br><br>Maria Szymanowska was a Polish composer. Born in 1789, she was a brilliant pianist and performed in several countries in Europe, including France, England, Germany, and Italy. Her playing was very well received by critics and audiences, and she was one of the first pianists to perform memorized repertoire in public, without the notes to help her. She moved to Russia in 1828 and became a court pianist to the Russian Empress, Alexandra Feodorovna. Szymanowska composed around 100 piano pieces, which were said to influence Frederic Chopin, one of the most famous Polish composers of all time."},{"n":24,"type":"text","section":"Reading","stem":"Which sentence best combines and revises these sentences?","options":["Dan takes art classes at Blackwell Community College because he enjoys these classes.","Dan, who enjoys art classes, takes painting and sculpture classes at Blackwell Community College.","Dan, who takes art classes in painting and sculpture, learns at Blackwell Community College.","Blackwell Community College is the place where Dan takes his art classes in painting and sculpture."],"passage":"<strong>Read the sentences.</strong><br>Dan enjoys art classes. He takes classes in painting and sculpture. He takes the classes at Blackwell Community College."},{"n":25,"type":"text","section":"Reading","stem":"The primary purpose of the passage is to","options":["relay the author's lifelong beliefs about language","convey Josh's spirit and message of human connection","tell Josh's life story from the perspective of the author","tear down walls between factions of society"],"passage":"<strong>Read the passage.</strong><br>I had known Josh since childhood, but it was only a decade ago that the opportunity arose for us to collaborate. In the process of joining his team, I was asked to compose a book review to showcase my writing. As was my habit, I utilized intricate sentences and grandiose words like \"concatenation\" and \"labyrinthine.\" I can only smile with embarrassment now trying to conjure up Josh's response when he read that. Thankfully though, something must have gotten through, since I was welcomed aboard. It soon dawned on me that my expertise was not going to serve me in my new position. Documents I sent for Josh's examination were returned with countless remarks, which led to much frustration on both of our parts. \"This isn't formal English; it's not how things are done!\" I would protest. \"It doesn't matter,\" he would sigh. \"Listen to the music. It speaks to people.\" \"You keep missing the point. You only think that that's the kind of language people look for. And perhaps they themselves get confused sometimes. But we are all human beings. Deep down, we want the same. Without genuine connection, all of it is meaningless. It's a waste of time, a waste of life. That impeccable elegance you admire, it's a wall that keeps people out. If you don't allow some cracks, how can they hear the music?\" It took me time to learn to see the beauty in vulnerable simplicity. It took me time to learn that it is in this intimate space, where the heart can be heard, that I want to build my life. It took me time to believe that Josh was right about other people too. But eventually, I did. It was five years ago when Josh departed from our world. He lived as he encouraged others to live. He never let walls get in the way. Perhaps, this is why I can still hear his music. Can you? I tried to leave some cracks in the veneer, just in case."},{"n":26,"type":"text","section":"Reading","stem":"Which of the following counterclaims should the student address to provide a comprehensive analysis of the impact of studying abroad on personal development?","options":["Studying abroad enhances critical thinking abilities.","Studying abroad encourages academic success.","Studying abroad has no impact on self-awareness and independence.","Studying abroad enables opportunities for building a global network."],"passage":"<strong>Context:</strong> A student is researching the benefits of studying abroad."},{"n":27,"type":"text","section":"Reading","stem":"What possible contradiction does the author introduce in this passage?","options":["Between embracing technological advancements and maintaining traditional values","Between the benefits of technological progress and its potential negative effects","Between the desire for convenience and the need for connectivity","Between the fast pace of technological innovation and the slow adoption by society"],"passage":"<strong>Read the passage.</strong><br>In the field of technology, innovation and advancement have been central themes throughout history. From the invention of the telephone by Alexander Graham Bell to the development of the internet, humanity has constantly strived to push the boundaries of what is possible. Yet, as we embrace the convenience and connectivity that technology brings, are there any potential drawbacks to consider? How does our relentless pursuit of technological progress impact our privacy and security?"},{"n":28,"type":"text","section":"Reading","stem":"Which statement is a fact rather than an opinion?","options":["Hugs provide a sense of comfort and security.","Hugs alleviate feelings of loneliness and depression.","Hugs help improve our overall health.","Hugs are the most effective way to express affection and connection with others."],"passage":"<strong>Read the passage.</strong><br>Hugs are a powerful and often underestimated way of expressing affection and connection with others. However, hugs are more than emotional acts, as they offer numerous physical benefits as well. Research conducted in 2005 found that daily hugs help improve our overall health. When we embrace someone in a hug, our bodies release the hormone oxytocin, which promotes feelings of happiness, relaxation, and bonding. As a result, the level of the stress hormone cortisol is reduced, which leads to lower blood pressure, decreased heart rate, and improved immune function. Nevertheless, for me, hugs are much more than that; they provide a sense of comfort and security and help alleviate feelings of loneliness and depression."},{"n":29,"type":"text","section":"Reading","stem":"Which of the following considerations would be most important in evaluating the credibility of the argument presented in the text?","options":["The prevalence of conflicts causing over 1000 deaths in tropical countries.","The source of the information and the expertise of the researchers.","The geographical location of the countries included in the climate analysis.","The historical context of conflicts analyzed in the study."],"passage":"<strong>Read the passage.</strong><br>El Nino and La Nina are climate patterns in the Pacific Ocean that can affect weather worldwide. El Nino tends to bring hotter, drier conditions, and La Nina cooler ones, to tropical countries, but both have less of an influence on temperate countries. A climate analysis included 175 countries and 234 conflicts, over half of which caused more than 1000 deaths. It found that the risk of conflict in tropical countries rose from 3 per cent during La Nina years to 6 per cent during El Nino years. The effect was absent from countries that were only weakly affected by these climate cycles."},{"n":30,"type":"text","section":"Reading","stem":"Select the passage that has a more threatening tone.","options":["The first passage has a more threatening tone.","The second passage has a more threatening tone.","Both are equally threatening.","None of the passages has a threatening tone."],"passage":"<strong>First passage:</strong><br>The king sat on his throne, his eyes narrowed, and his lips pressed into a thin line. The courtiers and advisors before him trembled, knowing that any misstep could lead to their demise. The king's voice rumbled thunder as he spoke, his words dripping with malice.<br><br><strong>Second passage:</strong><br>The castle rose up from the rocky crags like a formidable fortress of old. Its walls of thick stone stood tall, looming over the surrounding landscape like a sentinel of power. Turrets and spires reached towards the sky, their pointed roofs gleaming in the sun. The drawbridge, now lowered, led across a moat filled with muddy water."},{"n":31,"type":"text","section":"Reading","stem":"What is most likely the purpose of this story?","options":["To teach children never to cross brooks or other bodies of water.","To show the importance of good friends, however diverse and unlikely the group may be.","To warn against laughing at your friends.","To provide an imaginative explanation for why beans have a black seam."],"passage":"<strong>Read the passage.</strong><br>In a village dwelt a poor old woman, who had gathered together a dish of beans and wanted to cook them. So she made a fire on her hearth, and that it might burn the quicker, she lighted it with a handful of straw. When she was emptying the beans into the pan, one dropped without her observing it, and lay on the ground beside a straw, and soon afterwards a burning coal from the fire leapt down to the two. [...] 'I think,' [said] the bean, 'that as we have so fortunately escaped[...], we should keep together like good companions, and lest a new mischance should overtake us here, we should go away together, and repair to a foreign country.' The proposition pleased the two others, and they set out on their way together. Soon, however, they came to a little brook, and as there was no bridge or foot-plank, they did not know how they were to get over it. The straw hit on a good idea, and said: 'I will lay myself straight across, and then you can walk over on me as on a bridge.' The straw therefore stretched itself from one bank to the other, and the coal, who was of an impetuous disposition, tripped quite boldly on to the newly-built bridge. But when she had reached the middle, and heard the water rushing beneath her, she was after all, afraid, and stood still, and ventured no farther. The straw, however, began to burn, broke in two pieces, and fell into the stream. The coal slipped after her, hissed when she got into the water, and [washed away]. The bean, who had prudently stayed behind on the shore, could not but laugh at the event, was unable to stop, and laughed so heartily that she burst. It would have been all over with her, likewise, if, by good fortune, a tailor who was travelling in search of work, had not sat down to rest by the brook. As he had a compassionate heart he pulled out his needle and thread, and sewed her together. The bean thanked him most prettily, but as the tailor used black thread, all beans since then have a black seam."},{"n":32,"type":"text","section":"Reading","stem":"Which of the following accurately describes the persuasive techniques that the speaker uses in his address?","options":["The speaker appeals to the pathos of his fans and critics with emotive language in order to convince them that he is sincerely sorry.","The speaker uses descriptive language in order to appeal to the senses of his audience.","The speaker uses irony and sarcasm to draw attention to the foolishness of the criticisms against him.","The speaker appeals to the logos of his fans and critics, using logical arguments, anecdotes, and factual evidence in order to convince them that he did nothing wrong."],"passage":"<strong>Read the passage.</strong><br>My dear followers and beloved, devoted fanatics who seek nothing more than the noble act of removing me from my undeserved fame: I address you today to return the love that you have shown me, and to issue the apology that my managers and sponsors have so thoughtfully advised me and often threatened me to give. When I decided not to attend the premier of my new movie, I had no idea of the incredible and devastating impact that it would have on the world. As you have all kindly pointed out thousands of times on social media over the last few days, disrupting the sleep that I surely do not deserve, it was painfully irresponsible and inconsiderate of me, and I am woefully sorry that I have ruined all of your lives. I should have known that the three minutes you spent watching it on television, expecting to see me, were three crucial minutes that you will never get back, and that the disappointment you endured was more than one should ever have to bear. I should have also known that the three seconds it would have taken you to check the programing beforehand and find out about my last-minute cancellation was way too much to have expected, as you were all clearly engrossed in far more important things. I have learned my lesson that a migraine is no excuse not to attend a movie premiere, as the loud noises and flashing lights would indeed have eased my condition. It was also quite selfish of me not to come and share my cold with my adoring fans. I assure you that I have deeply appreciated all of your colorful posts about my lack of empathy for my fans, and I am so thankful that you spent your time writing them instead of sending annoying messages wishing me good health."},{"n":33,"type":"text","section":"Reading","stem":"Which of the following is likely, according the passage?","options":["Don McPherson is not color-blind.","More men have diabetes than women.","Don McPherson's glasses will work at night, too.","When the rod cells are malfunctional, a person will not see colors at all."],"passage":"<strong>Read the passage.</strong><br>The human eye has two types of cells responsible for vision: rod cells, which are responsible for night vision, and cone cells, which are responsible for color vision and function best in bright light. Therefore, it is much more difficult to see color in the darkness. There are three types of cone cells, each type responsible for a different range of colors. Color blindness is the disability to distinguish between all or specific colors. Some people are completely color blind, which means they cannot see colors at all, but this is extremely rare. Usually, only one type of the cone cells is problematic, and therefore, color-blind people can usually still see some color. Among those who have a decreased ability to tell the difference between certain colors, there are two major groups: those who have difficulty distinguishing between red and green, which is the most common condition and affects about 80% of color-blind people, and those who have difficulty distinguishing between blue and yellow. Color blindness is a hereditary trait which is more common among men. Around 8% of men and 0.5% of women have this trait. Color blindness may also be non-hereditary and occur as a result of a disease, such as diabetes. There is no cure for color blindness. However, there are special glasses that allow people with red-green color blindness to see colors in bright light. The glasses were originally developed to help surgeons see more clearly in the operating room. The fact that they could help color-blind people, as well, was discovered by chance when scientist Don McPherson was wearing the glasses while playing ultimate Frisbee with his friend. McPherson's friend asked to borrow his eyewear, and as he put them on, he was amazed by his sudden ability to see color. McPherson then went ahead to perform research on color blindness, and after some small adjustments, began to sell the glasses to the public."},{"n":34,"type":"text","section":"Reading","stem":"Select the weakest evidence to support the statement that in nature, brightly colored flowers are more likely to attract pollinators than dull-colored flowers.","options":["In nature, brightly colored flowers are more likely to attract pollinators than dull-colored flowers.","The vivid hues of these flowers serve as beacons, guiding pollinators toward them and increasing the likelihood of successful pollination.","The evolution of flower color is intricately connected to the co-evolution between plants and their respective pollinators, as certain pollinators have developed preferences for specific flower colors over time.","Dull-colored flowers, which are lacking vibrant pigments, may have lower attractiveness to pollinators and may experience reduced visitation rates, which can impact the reproductive success of the plants."],"passage":"<strong>Read the passage.</strong><br>In nature, brightly colored flowers are more likely to attract pollinators than dull-colored flowers. Brightly colored flowers, such as those with vibrant shades of red, orange, and purple, are particularly effective in catching the attention of pollinators like bees, butterflies, and birds. The vivid hues of these flowers serve as beacons, guiding pollinators towards them and increasing the likelihood of successful pollination. The evolution of flower color is intricately connected to the co-evolution between plants and their respective pollinators, as certain pollinators have developed preferences for specific flower colors over time. Dull-colored flowers, which are lacking vibrant pigments, may have lower attractiveness to pollinators and may experience reduced visitation rates, which can impact the reproductive success of the plants."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
