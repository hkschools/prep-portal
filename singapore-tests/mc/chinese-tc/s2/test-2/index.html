<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新加坡課程 中二 · 中文（繁體） · 選擇題測驗二</title>
<style>
  :root {
    --navy:#1f3a6e; --blue:#1a5fb4; --light:#eef2f7; --card:#ffffff;
    --border:#dbe2ec; --green:#1a7f37; --red:#c0392b; --ink:#1c2733; --muted:#6b7689;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "PingFang HK", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; margin:0; background:var(--light); color:var(--ink); }
  .qnote { margin-top:18px; padding:11px 16px; background:#fff8e6; border:1px solid #f0dfae; border-left:4px solid #d8a92a; border-radius:8px; color:#6b5410; font-size:.95rem; font-weight:400; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 24px 48px; }
  .testtitle { letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-size:.82rem; font-weight:700; }
  .toprow { display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:12px; }
  .qcount { color:var(--blue); font-weight:700; font-size:1rem; }
  .secbadge { background:#dde7f5; color:var(--navy); font-weight:700; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; padding:7px 14px; border-radius:8px; }
  .track { height:6px; background:#dde3ec; border-radius:6px; margin:12px 0 26px; overflow:hidden; }
  .track > div { height:100%; width:0; background:var(--navy); border-radius:6px; transition:width .25s ease; }
  .q { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:38px 44px; box-shadow:0 1px 3px rgba(20,40,80,.05); }
  .stem { font-size:1.3rem; font-weight:700; color:var(--navy); line-height:1.45; margin:0 0 26px; }
  .stem img { display:block; max-width:100%; height:auto; margin:14px auto 4px; }
  .stem .qtext { margin-top:6px; }
  .stem .intro { color:var(--ink); font-size:1.05rem; font-weight:700; margin-bottom:10px; }
  .passage { background:#f7faff; border:1px solid #e2ebf7; border-left:4px solid var(--blue);
             border-radius:10px; padding:14px 20px; margin:0 0 20px; max-height:340px; overflow:auto;
             font-size:1rem; font-weight:400; color:var(--ink); }
  .passage .ptitle { font-weight:700; color:var(--navy); margin-bottom:8px; }
  .passage .pl { display:flex; gap:10px; line-height:1.55; }
  .passage .ln { flex:0 0 26px; text-align:right; color:#9aa6b8; font-size:.8rem; padding-top:3px; }
  .pattern { font-family:"Courier New",monospace; letter-spacing:4px; font-size:1.35rem; background:#f2f6fc; border:1px solid #dbe4f0; border-radius:8px; padding:6px 14px; display:inline-block; margin-top:6px; }
  table.dt { border-collapse:collapse; margin:12px auto; font-size:1rem; font-weight:400; }
  table.dt td, table.dt th { border:1px solid #b9c3d4; padding:7px 13px; text-align:center; }
  table.dt th { background:#eef2f9; color:var(--navy); }
  .tcap { text-align:center; color:var(--muted); font-size:.9rem; font-weight:400; margin-top:2px; }
  .opts { display:flex; flex-direction:column; gap:16px; }
  .opts label { border:1px solid var(--border); border-radius:12px; padding:18px 22px; cursor:pointer; user-select:none; display:flex; align-items:center; gap:16px; background:#fff; font-size:1.15rem; transition:border-color .12s, background .12s; }
  .opts label:hover { border-color:var(--blue); background:#f7faff; }
  .opts input { appearance:none; -webkit-appearance:none; width:22px; height:22px; border:2px solid #b9c3d4; border-radius:50%; margin:0; flex:0 0 auto; position:relative; cursor:pointer; }
  .opts input:checked { border-color:var(--blue); }
  .opts input:checked::after { content:""; position:absolute; inset:4px; border-radius:50%; background:var(--blue); }
  .opts label.sel { border-color:var(--blue); background:#eaf1fc; }
  .ansrow { display:flex; align-items:center; gap:10px; }
  .ansrow .pfx { font-size:1.3rem; font-weight:700; color:var(--navy); }
  .ansrow input { flex:0 1 300px; padding:14px 16px; border:1px solid var(--border); border-radius:10px; font-size:1.2rem; }
  .ansrow input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(26,95,180,.12); }
  textarea#ansInput { width:100%; padding:14px 16px; border:1px solid var(--border); border-radius:10px; font-size:1.1rem; font-family:inherit; line-height:1.5; resize:vertical; }
  textarea#ansInput:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(26,95,180,.12); }
  .blank select { font: inherit; font-size: 1rem; padding: 4px 8px; border: 1.5px solid var(--blue);
  border-radius: 7px; background: #f7faff; color: var(--navy); font-weight: 600; margin: 0 3px;
  max-width: 220px; }
.blank select:invalid { border-color: #b9c3d4; color: var(--muted); font-weight: 400; background: #fff; }
.subq { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
.subq:first-of-type { border-top: none; margin-top: 6px; }
.subq .sqstem { font-weight: 700; color: var(--navy); margin-bottom: 10px; line-height: 1.5; }
.groupstem { margin-bottom: 6px; }
.anshint { color:var(--muted); font-size:.92rem; margin-top:10px; font-weight:400; }
  .navfoot { display:flex; align-items:center; justify-content:flex-end; gap:22px; margin-top:30px; }
  .saved { color:var(--muted); font-size:.95rem; }
  button.primary { background:var(--navy); color:#fff; border:none; border-radius:10px; padding:15px 34px; font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:0 1px 2px rgba(20,40,80,.2); }
  button.primary:hover { background:#19305c; }
  button.primary:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:30px 34px; box-shadow:0 1px 3px rgba(20,40,80,.05); }
  .card h2 { margin:0 0 4px; color:var(--navy); }
  .card label { font-weight:600; display:block; margin-bottom:6px; }
  .card input[type=text], .card input[type=email] { width:100%; max-width:440px; padding:11px 14px; border:1px solid var(--border); border-radius:8px; font-size:1rem; }
  #quiz, #result { display:none; }
  .spin { display:inline-block; width:16px; height:16px; border:3px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:r .8s linear infinite; vertical-align:middle; }
  @keyframes r { to { transform:rotate(360deg); } }
  #gate { position:fixed; inset:0; background:var(--light); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  #gate .box { background:#fff; border:1px solid var(--border); border-radius:16px; padding:30px; max-width:380px; width:100%; text-align:center; box-shadow:0 4px 16px rgba(20,40,80,.08); }
  #gate input { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px; font-size:1.1rem; text-align:center; letter-spacing:2px; margin:16px 0; }
  #gate .msg { color:var(--red); font-weight:600; min-height:20px; font-size:.92rem; }
  @media (max-width:560px) {
    .q { padding:26px 20px; } .stem { font-size:1.15rem; } .opts label { font-size:1.05rem; padding:15px 16px; }
    .secbadge { font-size:.7rem; padding:6px 10px; }
  }
/* extras for SIS P1 entrance mocks (used via hs_render --css) */
.cgrid { display: flex; flex-wrap: wrap; gap: 3.5mm; margin: 2mm 0 3mm; max-width: 125mm; }
.cicon { width: 10mm; height: 10mm; }
.abox { width: 30mm; height: 12mm; border: 0.45pt solid #8a93a5; border-radius: 1.5mm; margin: 2mm 0 1mm; }
.lbox { display: inline-block; width: 9mm; height: 9mm; border: 0.45pt solid #8a93a5; border-radius: 1mm; vertical-align: middle; margin: 0 1.5mm; }
.wordfill { font-size: 17pt; letter-spacing: 1mm; }
.wline { display: inline-block; width: 48mm; border-bottom: 0.5pt solid #1a2233; height: 6mm; }
.wl { border-bottom: 0.4pt solid #8a93a5; height: 9.5mm; margin-bottom: 0.5mm; }
.passage { border-left: 1.1mm solid #72afdb; padding: 1.5mm 0 1.5mm 5mm; margin: 0 0 5mm; font-size: 12.5pt; line-height: 1.65; }
.sums { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm 12mm; font-size: 15pt; margin: 3mm 0; }
.sums .s { display: flex; gap: 3mm; align-items: baseline; }
.sums .qn2 { font-weight: 700; color: #14213a; min-width: 10mm; text-align: right; font-size: 12pt; font-variant-numeric: tabular-nums; }
.nblank { display: inline-block; width: 16mm; border-bottom: 0.5pt solid #1a2233; height: 5mm; }
.numrow { display: flex; gap: 16mm; font-size: 16pt; margin: 2mm 0 2mm 12mm; font-variant-numeric: tabular-nums; }
.seqchip { display: flex; align-items: center; gap: 5mm; border: 0.35pt solid #c9d0dc; border-radius: 1.5mm; padding: 3mm 4mm; margin-bottom: 3.5mm; font-size: 12.5pt; }
.seqbox { width: 12mm; height: 10mm; border: 0.45pt solid #8a93a5; border-radius: 1mm; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.trace { border-collapse: collapse; margin: 2mm 0; }
.trace td { border: 0.35pt solid #c9d0dc; width: 21mm; height: 15.5mm; text-align: center; vertical-align: middle; font-size: 23pt; color: #c4cad6; }
.picrow { display: flex; gap: 6mm; margin: 2mm 0 4mm; }
.mathsvg { margin: 2mm 0 3mm; }
.mathsvg text { stroke: none; fill: #1a2233; }
.key .keyline { font-size: 11pt; margin: 0 0 2.5mm 4mm; }
.key .keynote { font-size: 9pt; color: #8a93a5; margin-top: 6mm; line-height: 1.5; }

/* P4 key sheets: compact layout so 8-section keys fit one page */
.key .keyline { font-size: 10pt; margin: 0 0 2mm 4mm; line-height: 1.45; }
.key .sec { margin-top: 4.5mm; }
.key .sec h2 { font-size: 12.5pt; }
.key .sec-rule { margin: 0.8mm 0 1.8mm; }
.key .keynote { margin-top: 4mm; }

/* Stacked-option MCQs (Alex 2026-08-30: options never sit in a row).
   Kept tight so a page carries six items instead of four. */
.q.mcqs { margin-bottom: 4.6mm; }
.q.mcqs .qtext { margin-bottom: 2.2mm; }
.q.mcqs .ostack { margin: 0.45mm 0; }
.q.mcqs .opt .w { font-size: 12pt; }

  .q svg { stroke:#14213a; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .q svg text { stroke:none; fill:#1a2233; }
  .q .mathsvg { display:block; margin:14px 0 10px; }
  /* extra.css (print) restyles .passage as a bare left rule sized in mm.  The
     MC suite's passages are long -- a P6 comprehension text runs 700 words --
     so the screen keeps the template's boxed, scrollable panel. */
  .q .passage { background:#f7faff; border:1px solid #e2ebf7; border-left:4px solid var(--blue);
                border-radius:10px; padding:14px 20px; margin:0 0 20px; max-height:340px;
                overflow:auto; font-size:1rem; font-weight:400; line-height:1.6; color:var(--ink); }

</style>
</head>

<div class=\"qtext\">下面哪一個句子沒有語病？</div>", "options": ["只要掌握科學的方法，學習效率就一定名列前茅。", "掌握科學的方法，是提高學習效率的關鍵所在的原因。", "只有掌握科學的方法，才能防止學習效率不下降。", "只有掌握科學的方法，學習效率才能真正提高。"], "labels": ["①", "②", "③", "④"]}, {"label": "12", "section": "第三部分 · 病句判斷", "stem": "<div class=\"qtext\">下面哪一個句子沒有語病？</div>", "options": ["志願者們冒着大雨和泥濘的山路，把物資送到了災民手中。", "志願者們冒着大雨，把物資及時送到了災民手中。", "志願者們把物資及時送到了災民的手中得到了幫助。", "志願者們及時地把大約五百件左右的物資送到災民手中。"], "labels": ["①", "②", "③", "④"]}, {"label": "13", "section": "第三部分 · 病句判斷", "stem": "<div class=\"qtext\">下面哪一個句子沒有語病？</div>", "options": ["會議就如何減少食物浪費的問題上展開了討論。", "會議就如何減少食物浪費展開了深入的討論。", "會議圍繞以減少食物浪費為中心展開了討論。", "經過這次討論，使大家統一了認識。"], "labels": ["①", "②", "③", "④"]}, {"label": "14", "section": "第三部分 · 病句判斷", "stem": "<div class=\"qtext\">下面哪一個句子沒有語病？</div>", "options": ["他不僅精通馬來語，還對英語主持節目十分流利。", "他精通馬來語的原因是因為從小在甘榜長大。", "他能否勝任主持工作，取決於他紮實的語言功底。", "他不僅精通馬來語，還能用流利的英語主持節目。"], "labels": ["①", "②", "③", "④"]}, {"label": "15", "section": "第四部分 · 完成句子", "stem": "<div class=\"qtext\">“我們應該珍惜這來之不易的學習機會。”改為反問句，正確的一項是：</div>", "options": ["我們怎麼能珍惜這來之不易的學習機會呢？", "難道我們應該珍惜這來之不易的學習機會嗎？", "我們怎麼能不珍惜這來之不易的學習機會呢？", "我們是不是該放棄這來之不易的學習機會？"], "labels": ["①", "②", "③", "④"]}, {"label": "16", "section": "第四部分 · 完成句子", "stem": "<div class=\"qtext\">下列句子中，運用了誇張手法的一項是：</div>", "options": ["他的心眼比針鼻兒還小。", "月亮像一隻銀盤掛在天邊。", "小溪一路唱着歌奔向大海。", "我們既要學好華文，也要學好數學。"], "labels": ["①", "②", "③", "④"]}, {"label": "17", "section": "第四部分 · 完成句子", "stem": "<div class=\"qtext\">“老師對小明説：‘你明天別忘了帶作文本。’”改為轉述句，正確的一項是：</div>", "options": ["老師對小明説，你明天別忘了帶作文本。", "老師對小明説，他明天別忘了帶我的作文本。", "小明對老師説，明天別忘了帶作文本。", "老師對小明説，叫他明天別忘了帶作文本。"], "labels": ["①", "②", "③", "④"]}, {"label": "18", "section": "第四部分 · 完成句子", "stem": "<div class=\"qtext\">“（　）遇到再大的困難，我們（　）不能放棄對夢想的追求。”空格處應填入的關聯詞是：</div>", "options": ["即使……也", "因為……所以", "雖然……但是", "只有……才"], "labels": ["①", "②", "③", "④"]}, {"label": "19", "section": "第四部分 · 完成句子", "stem": "<div class=\"qtext\">把下面五個句子排成一段通順的話，正確的順序是：<br>①他把風箏線一點一點放長　②春風一起，廣場上到處都是放風箏的人　③弟弟也拽着他的“老鷹”跑了起來　④“老鷹”越飛越高，終於穩穩地懸在了雲邊　⑤引來一片羨慕的目光</div>", "options": ["②①③④⑤", "②③①④⑤", "③②①④⑤", "②③④①⑤"], "labels": ["①", "②", "③", "④"]}, {"label": "20", "section": "第五部分 · 短文填空", "mode": "list", "stem": "<div class=\"qtext\">讀短文，為每個空格選出最適當的詞語。</div><div class=\"passage\" style=\"font-size:13pt;line-height:2.0\"><span style=\"display:block;margin-bottom:2.5mm\">在新加坡的西北海岸，生長着一片特殊的樹林——紅樹林。漲潮時，海水（20）了它們的根部，只露出繁茂的樹冠；退潮後，泥灘上縱橫交錯的支柱根便（21）出來，像無數隻手指緊緊抓住淤泥。有些紅樹的種子還會在樹上先發芽，落下時像一支支小標槍插進泥裏，幾個小時便能站穩腳跟。</span><span style=\"display:block;margin-bottom:2.5mm\">紅樹林是天然的海岸衞士。它們密集的根系能（22）風浪對堤岸的沖刷，也能留住隨水而來的泥沙。對許多小生物來説，這裏更是理想的（23）：彈塗魚在泥灘上跳躍，招潮蟹揮舞着大螯，鷺鳥則在枝頭安家。漲潮時，小魚小蝦躲進盤錯的根系間躲避天敵，紅樹林因此又被稱為海洋生物的“育兒所”。</span><span style=\"display:block\">然而，隨着填海與開發，本區域的紅樹林面積一度大幅（24）。人們這才意識到，這排綠牆一旦消失，風暴與海浪將直撲堤岸。近年來，人們開始補種紅樹、設立保護區，讓這道綠色屏障得以（25）。據統計，同樣面積的紅樹林，固碳能力可達普通森林的數倍。保護紅樹林，就是保護我們自己的海岸線。</span></div>", "parts": [{"label": "20", "stem": "第（20）格應填入：", "options": ["蒸發", "淨化", "淹沒", "攪動"], "labels": ["①", "②", "③", "④"]}, {"label": "21", "stem": "第（21）格應填入：", "options": ["隱藏", "枯萎", "顯露", "斷裂"], "labels": ["①", "②", "③", "④"]}, {"label": "22", "stem": "第（22）格應填入：", "options": ["減弱", "加劇", "引發", "模仿"], "labels": ["①", "②", "③", "④"]}, {"label": "23", "stem": "第（23）格應填入：", "options": ["戰場", "牢籠", "迷宮", "家園"], "labels": ["①", "②", "③", "④"]}, {"label": "24", "stem": "第（24）格應填入：", "options": ["擴張", "縮減", "翻倍", "穩定"], "labels": ["①", "②", "③", "④"]}, {"label": "25", "stem": "第（25）格應填入：", "options": ["延續", "拆除", "閒置", "褪色"], "labels": ["①", "②", "③", "④"]}]}, {"label": "26", "section": "第六部分 · 閲讀理解（一）", "mode": "list", "stem": "<div class=\"qtext\">讀短文，回答問題。</div><div class=\"passage\" style=\"font-size:12.5pt;line-height:1.9\"><span style=\"display:block;margin-bottom:2.5mm\">常有同學抱怨：功課太多，興趣班太滿，自己的時間被擠得一點不剩。可仔細觀察便會發現，同樣的二十四小時，有人手忙腳亂，有人卻從容有餘：同樣的自習課，有人列好清單逐項完成，有人東翻翻西看看，下課鈴響時仍在原地打轉。差別往往不在時間的多少，而在有沒有自律。</span><span style=\"display:block;margin-bottom:2.5mm\">自律不是自我束縛，而是自我管理。定好九點開始温習，就不摸手機；説好每天跑三圈，就風雨無阻。看似處處受限，實則處處主動——因為每一分鐘花在哪裏，都由自己説了算。相反，想到什麼做什麼的人，表面自由，實際上被情緒和惰性牽着走，才是真正的不自由。</span><span style=\"display:block;margin-bottom:2.5mm\">古今中外，凡有所成者，多半是自律的行家。魯迅把別人喝咖啡的工夫用在寫作上；運動員日復一日重複枯燥的動作，才換來賽場上的行雲流水。我們身邊也不乏這樣的例子：球隊隊長堅持每天提前半小時到校練球，一個學年下來，球技與成績竟不降反升。可見，自由不是想做什麼就做什麼，而是想不做什麼，就能不做什麼。</span><span style=\"display:block\">當然，自律並非一蹴而就。不妨從小處做起：先管住一個睡前刷屏的夜晚，先守住一張學習計劃表。守住了小小的約定，才談得上更大的堅持。日積月累，你會發現，管得住自己的人，才配得上更大的自由。</span></div>", "parts": [{"label": "26", "stem": "本文的中心論點是：", "options": ["功課太多讓學生失去自由", "時間對每個人並不公平", "興趣班應該大幅減少", "自律的人才能獲得真正的自由"], "labels": ["①", "②", "③", "④"]}, {"label": "27", "stem": "第一段以同學的抱怨開頭，作用是：", "options": ["證明學校的功課確實太多", "從生活現象引出論題，引起讀者共鳴", "批評愛抱怨的同學", "説明作者自己時間充裕"], "labels": ["①", "②", "③", "④"]}, {"label": "28", "stem": "作者認為“被情緒和惰性牽着走”的人：", "options": ["敢想敢做，值得學習", "情緒豐富，富有個性", "表面自由，實際上並不自由", "生活輕鬆，令人羨慕"], "labels": ["①", "②", "③", "④"]}, {"label": "29", "stem": "文中舉魯迅和運動員的例子，是為了證明：", "options": ["有所成就的人大多依靠自律", "寫作比運動更需要天賦", "喝咖啡是在浪費時間", "枯燥的訓練毫無意義"], "labels": ["①", "②", "③", "④"]}, {"label": "30", "stem": "對“自由不是想做什麼就做什麼，而是想不做什麼，就能不做什麼”理解正確的一項是：", "options": ["自由就是什麼事都不做", "凡是想做的事都不應該去做", "真正的自由是能約束自己，不被慾望和惰性支配", "自由的人從來沒有想做的事"], "labels": ["①", "②", "③", "④"]}, {"label": "31", "stem": "作者建議培養自律應當：", "options": ["立刻制定宏大的人生目標", "請父母時刻監督自己", "退出所有的興趣班", "從管住睡前刷屏、守住計劃表這樣的小事做起"], "labels": ["①", "②", "③", "④"]}, {"label": "32", "stem": "第三段主要運用的論證方法是：", "options": ["比喻論證", "舉例論證", "引用名言論證", "數據論證"], "labels": ["①", "②", "③", "④"]}, {"label": "33", "stem": "下列説法<u>不符合</u>文意的一項是：", "options": ["自律是自我管理而非自我束縛", "自律可以一蹴而就，立竿見影", "培養自律要靠日積月累", "手忙腳亂未必是因為時間不夠"], "labels": ["①", "②", "③", "④"]}]}, {"label": "34", "section": "第七部分 · 閲讀理解（二）", "mode": "list", "stem": "<div class=\"qtext\">讀文章，回答問題。</div><div class=\"passage\" style=\"font-size:12.5pt;line-height:1.9\"><span style=\"display:block;margin-bottom:2.5mm\">①每年清明前後，祖父都要回一趟“甘榜”。其實那個村子早在四十年前就拆了，原址上立起了一片嶄新的組屋。可祖父仍固執地説“回去”，彷彿水泥地底下，還埋着一整個村莊。</span><span style=\"display:block;margin-bottom:2.5mm\">②祖父的甘榜夢，是從一棵芒果樹開始的。他説，老屋門前那棵芒果樹，是曾祖父親手種下的，樹幹要兩人合抱。每到果子成熟，左鄰右舍不必打招呼，搬來竹竿便打，打下來的芒果論堆分，誰家孩子多就多分一堆。樹下襬着幾張長凳，傍晚時分，大人搖着蒲扇講古，孩子追着螢火蟲跑，誰家飄出飯菜香，半條村都聞得到。“那時候沒有鐵門，”祖父眯着眼説，“家家的門都開着，風從村頭一路吹到村尾。”</span><span style=\"display:block;margin-bottom:2.5mm\">③我從小在冷氣房裏長大，起初並不懂這些故事的好。直到十二歲那年，祖父帶我去了舊址。他在整齊的組屋樓羣間走走停停，忽然在一座電梯口站定，跺了跺腳：“喏，芒果樹就在這兒。”我低頭看，只有灰白的水泥地，連一道裂縫也沒有。他卻像認門牌似的篤定：從大路口數第三根電線杆，再走五十步，錯不了——這條路線，他在心裏走了四十年。説罷，祖父蹲下來，用手掌貼着地面，像在給老朋友把脈。那一刻，我忽然覺得鼻子發酸。</span><span style=\"display:block;margin-bottom:2.5mm\">④回家的路上，祖父給我講村裏的舊事：誰家的井水最甜，哪條水溝裏能摸到泥鰍，大雨天整條村的男人如何一起為漏雨的鄰居補屋頂。他説有一年鬧水災，全村的米糧集中到地勢最高的一户人家，大人們輪流撐船接送孩子上學，沒有一家捱過餓。他講得瑣碎，我卻聽得入神。原來祖父懷念的不是破舊的木屋，而是那種“一家有事，全村上門”的熱絡。推土機可以剷平房子，卻鏟不平人心裏的那口甜井。</span><span style=\"display:block;margin-bottom:2.5mm\">⑤前些日子，我們的組屋樓下辦中秋聯歡，祖父破天荒地下了樓。他起初只坐在角落裏看，後來被孩子們拉去玩套圈，一連套中三個，樂得像個孩子。鄰居請他猜燈謎，他一個也猜不中，笑得卻比誰都響。散場時，隔壁的馬來大嬸塞給他兩塊自家做的椰糕。祖父捧着椰糕，站在燈籠下愣了半晌，輕聲對我説：“你看，甘榜又回來了。”</span><span style=\"display:block\">⑥那晚我忽然明白，甘榜從來不是一個地名。它是芒果論堆分的慷慨，是門不上鎖的信任，是屋檐下互相遞傘的情分。如今在電梯裏遇見鄰居，祖父總要先點頭問好——他説，這是甘榜教他的規矩。只要人心還熱着，高樓裏也能長出甘榜來。</span></div>", "parts": [{"label": "34", "stem": "祖父明知村子已拆，仍堅持説“回去”，這反映出他：", "options": ["記性衰退，忘了拆遷的事", "討厭現在居住的組屋", "打算搬回鄉下種芒果", "對甘榜歲月懷有深深的眷戀"], "labels": ["①", "②", "③", "④"]}, {"label": "35", "stem": "第②段“打下來的芒果論堆分，誰家孩子多就多分一堆”表現了甘榜生活的：", "options": ["缺乏管理、秩序混亂", "芒果太多、無處銷售", "鄰里之間慷慨互助、不分彼此的情誼", "孩子多的人家仗勢欺人"], "labels": ["①", "②", "③", "④"]}, {"label": "36", "stem": "“家家的門都開着，風從村頭一路吹到村尾。”這句話的深層含義是：", "options": ["甘榜人彼此信任，往來毫無隔閡", "甘榜的通風條件很好", "村民們買不起門鎖", "風太大，門關不上"], "labels": ["①", "②", "③", "④"]}, {"label": "37", "stem": "第③段“像在給老朋友把脈”一句運用的修辭手法及其作用是：", "options": ["誇張，説明地面的温度很高", "排比，增強文章的氣勢", "反問，引起讀者的思考", "比喻，把埋在地下的故土當作老朋友，寫出祖父的深情"], "labels": ["①", "②", "③", "④"]}, {"label": "38", "stem": "第③段末“我忽然覺得鼻子發酸”，是因為：", "options": ["“我”被祖父對故土的一往情深觸動，心生酸楚", "水泥地的氣味十分刺鼻", "“我”對芒果樹過敏", "電梯口的風太大了"], "labels": ["①", "②", "③", "④"]}, {"label": "39", "stem": "“推土機可以剷平房子，卻鏟不平人心裏的那口甜井。”這句話的含義是：", "options": ["那口水井至今仍在使用", "房屋可以被拆除，但温暖的記憶與情誼無法被抹去", "推土機的馬力不夠大", "祖父打算重新挖一口井"], "labels": ["①", "②", "③", "④"]}, {"label": "40", "stem": "第⑤段祖父猜燈謎“一個也猜不中，笑得卻比誰都響”，是因為：", "options": ["他覺得燈謎出得太可笑", "他其實猜中了大獎", "他重新感受到鄰里熱絡的暖意，由衷地高興", "他在嘲笑別人猜錯"], "labels": ["①", "②", "③", "④"]}, {"label": "41", "stem": "“你看，甘榜又回來了。”祖父這句話的意思是：", "options": ["政府決定在原址重建甘榜", "芒果樹被重新種了回來", "甘榜式的人情味在組屋社區裏重現了", "祖父準備搬回舊址居住"], "labels": ["①", "②", "③", "④"]}, {"label": "42", "stem": "文章以芒果樹、水泥地、椰糕等物件串聯全文，這種寫法的好處是：", "options": ["以具體事物承載情感，使抽象的懷念變得可觸可感", "羅列物品，湊足篇幅", "顯示作者的見多識廣", "便於介紹各種食物的做法"], "labels": ["①", "②", "③", "④"]}, {"label": "43", "stem": "對第⑥段“只要人心還熱着，高樓裏也能長出甘榜來”理解正確的一項是：", "options": ["高樓的樓頂適合種植芒果樹", "組屋即將被改建成甘榜", "甘榜的消失是無法彌補的遺憾", "只要人們保有真誠熱絡的心，現代社區同樣能擁有甘榜般的人情味"], "labels": ["①", "②", "③", "④"]}, {"label": "44", "stem": "下列對本文寫作特色的分析，<u>不正確</u>的一項是：", "options": ["今昔對比貫穿全文", "全文以説明文的筆法，客觀地介紹甘榜的歷史沿革", "善用生活細節傳達情感", "結尾卒章顯志，昇華主題"], "labels": ["①", "②", "③", "④"]}, {"label": "45", "stem": "本文的主旨是：", "options": ["借祖父與甘榜的故事，讚美守望相助的人情味，並寄望它在現代社區延續", "記錄新加坡的城市化進程", "呼籲保護老樹與老屋", "説明中秋聯歡活動的流程"], "labels": ["①", "②", "③", "④"]}]}];

// A passage with ten blanks used to be shown ten times over, once per question, and
// a flyer with eight questions was shown only on the first — leaving seven questions
// with nothing to read. A group puts the text on screen ONCE with every one of its
// questions: dropdowns in the passage for cloze work, listed choices for the rest.
function renderGroup(q) {
  const parts = q.parts;
  document.getElementById("qContainer").innerHTML =
    '<div class="q"><div class="stem groupstem">' + q.stem + '</div>' +
    (q.mode === "list"
      ? parts.map((p, j) =>
          '<div class="subq"><div class="sqstem">' + p.label + '. ' + p.stem + '</div>' +
          '<div class="opts">' + p.options.map((o, i) =>
            '<label><input type="radio" name="g' + j + '" value="' + LETTERS[i] + '">' +
            '<span><b>' + esc((p.labels && p.labels[i]) || LETTERS[i]) + '</b>&nbsp;&nbsp;' +
            o + '</span></label>').join("") + '</div></div>').join("")
      : "") + '</div>';

  if (q.mode === "inline") {
    // swap each marker in the passage for a dropdown of that blank's choices
    document.querySelectorAll('#qContainer .blank').forEach((slot) => {
      const p = parts.filter((x) => String(x.label) === slot.getAttribute("data-q"))[0];
      if (!p) return;
      const sel = document.createElement("select");
      sel.required = true;
      sel.innerHTML = '<option value="" selected disabled>(' + p.label + ')</option>' +
        p.options.map((o, i) => '<option value="' + LETTERS[i] + '">' + esc(plain(o)) + '</option>').join("");
      sel.addEventListener("change", () => {
        answers[p.label] = sel.value;
        document.getElementById("savedNote").textContent = UI.saved;
      });
      if (answers[p.label]) sel.value = answers[p.label];
      slot.appendChild(sel);
    });
  } else {
    parts.forEach((p, j) => {
      document.querySelectorAll('#qContainer input[name="g' + j + '"]').forEach((inp) => {
        if (answers[p.label] === inp.value) inp.checked = true;
        inp.addEventListener("change", () => {
          inp.closest(".opts").querySelectorAll("label").forEach((l) =>
            l.classList.toggle("sel", l.querySelector("input").checked));
          answers[p.label] = inp.value;
          document.getElementById("savedNote").textContent = UI.saved;
        });
      });
      if (answers[p.label]) {
        document.querySelectorAll('#qContainer input[name="g' + j + '"]').forEach((inp) =>
          inp.closest("label").classList.toggle("sel", inp.checked));
      }
    });
  }
}

function renderQuestion() {
  const q = QUESTIONS[idx];
  const span = q.parts ? (q.parts[0].label + "\u2013" + q.parts[q.parts.length - 1].label)
                       : String(q.label);
  document.getElementById("qcount").textContent =
    UI.qcount.replace("{n}", span).replace("{t}", TOTALQ);
  document.getElementById("secLabel").textContent = q.section;
  document.getElementById("trackFill").style.width = (100 * STARTQ[idx] / TOTALQ) + "%";
  document.getElementById("savedNote").textContent = "";

  const nextBtn0 = document.getElementById("nextBtn");
  nextBtn0.disabled = false;
  nextBtn0.textContent = (idx === total - 1) ? UI.submit : UI.next;
  if (q.parts) { renderGroup(q); window.scrollTo(0, 0); return; }

  // Stems are trusted HTML (they carry passages, tables and figures) — do not escape.
  const stem = '<div class="stem">' + q.label + '. ' + q.stem + '</div>';
  let body;
  if (q.multiline) {
    // Hand-marked written answers need room; a one-line box invites one-word replies.
    body = '<textarea id="ansInput" rows="4" placeholder="' + esc(UI.typeAnswer) + '"></textarea>' +
      (q.hint ? '<div class="anshint">' + esc(q.hint) + '</div>' : '');
  } else if (q.input) {
    body = '<div class="ansrow">' +
      (q.prefix ? '<span class="pfx">' + esc(q.prefix) + '</span>' : '') +
      '<input type="text" id="ansInput" autocomplete="off" autocapitalize="off" placeholder="' + esc(UI.typeAnswer) + '">' +
      (q.unit ? '<span class="pfx">' + esc(q.unit) + '</span>' : '') + '</div>' +
      (q.hint ? '<div class="anshint">' + esc(q.hint) + '</div>' : '');
  } else {
    body = '<div class="opts">';
    for (let i = 0; i < q.options.length; i++) {
      const mark = (q.labels && q.labels[i]) ? q.labels[i] : LETTERS[i];
      body += '<label><input type="radio" name="q" value="' + LETTERS[i] + '"><span><b>' + esc(mark) + '</b>&nbsp;&nbsp;' + q.options[i] + "</span></label>";
    }
    body += "</div>";
  }
  const note = q.note ? '<div class="qnote">' + esc(q.note) + '</div>' : '';
  document.getElementById("qContainer").innerHTML = '<div class="q">' + stem + body + note + "</div>";

  if (q.input || q.multiline) {
    const inp = document.getElementById("ansInput");
    inp.addEventListener("input", () => {
      answers[q.label] = inp.value.trim();
      document.getElementById("savedNote").textContent = UI.saved;
    });
    if (!q.multiline) {
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("nextBtn").click(); }
      });
    }
    inp.focus();
  } else {
    document.querySelectorAll('#qContainer input[name="q"]').forEach((inp) => {
      inp.addEventListener("change", () => {
        document.querySelectorAll("#qContainer .opts label").forEach((l) =>
          l.classList.toggle("sel", l.querySelector("input").checked));
        answers[q.label] = inp.value;
        document.getElementById("savedNote").textContent = UI.saved;
      });
    });
  }
  window.scrollTo(0, 0);
}

document.getElementById("nextBtn").addEventListener("click", () => {
  if (document.getElementById("nextBtn").disabled) return;
  if (idx < total - 1) { idx++; renderQuestion(); }
  else submitTest();
});

async function submitTest() {
  const btn = document.getElementById("nextBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Submitting…';
  const payload = {
    test: TEST_ID,
    name: window.studentName,
    email: window.studentEmail || "",
    elapsedSeconds: Math.round((Date.now() - startTime) / 1000),
    answers: answers
  };
  try {
    const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    showResult(data);
  } catch (err) {
    btn.disabled = false; btn.textContent = UI.submit;
    alert("Submission failed: " + err.message + "\nPlease check your internet connection and try again.");
  }
}

function showResult(data) {
  // Confirmation only — students are not shown their score.
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  window.scrollTo(0, 0);
}
</script>
