<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Non-Verbal Reasoning: Paper 1</title><style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--line:#dce3ea;--ink:#1c2733;--muted:#6b7280;--green:#1a7f37;--red:#c0392b}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:24px 18px}.tt{color:var(--muted);font-size:13px;margin-bottom:8px}
h2{color:var(--navy);margin:0 0 4px}.muted{color:var(--muted)}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.qn{color:var(--muted);font-size:13px;margin-bottom:8px}.sec{color:var(--blue);font-weight:700;font-size:12px}
.fig{width:100%;border:1px solid var(--line);border-radius:8px;margin:0 0 14px;display:block}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{flex:1;min-width:90px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;font-weight:700;color:var(--navy)}
.opts label:hover{border-color:var(--blue);background:#f7fafe}.opts input{margin-right:6px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px}
button.primary:disabled{opacity:.45}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
.ri{border-top:1px solid var(--line);padding:9px 0;font-size:14px}.ok{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">
<div class="tt">GL Assessment · Non-Verbal Reasoning · Paper 1</div>
<h2>Non-Verbal Reasoning</h2>
<p class="muted">80 questions. Look at the sequence on the left, then choose the option (A–E) that best completes it. One question per screen.</p>

<div id="start" class="card">
  <p><label>Full name<br><input type="text" id="nm" autocomplete="name" placeholder="Full name"></label></p>
  <p style="margin-top:10px"><label>Email<br><input type="text" id="em" autocomplete="email" placeholder="student@example.com"></label></p>
  <button class="primary" id="startBtn">Start →</button>
</div>

<div id="quiz" style="display:none">
  <div class="bar"><i id="prog"></i></div>
  <div class="card">
    <div class="qn"><span id="sec" class="sec"></span> · <span id="qlabel"></span></div>
    <img class="fig" id="fig" alt="">
    <div class="opts" id="opts"></div>
    <button class="primary" id="nextBtn" disabled>Next →</button>
  </div>
</div>

<div id="result" style="display:none" class="card">
  <h2 id="scoreLine" style="margin-top:0"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:6px 0 14px"></table>
  <div id="review"></div>
</div>

<script>
const SCRIPT_URL="PASTE_GL_ENGINE_EXEC_URL";
const TEST_ID="NVR-1";
const BANK_PATH="gl/nvr/v1/bank.csv";
const TITLE="Non-Verbal Reasoning: Paper 1";
const LET=["A","B","C","D","E"];
const QUESTIONS=[{"n":1,"img":"q1.png","section":"Section 1"},{"n":2,"img":"q2.png","section":"Section 1"},{"n":3,"img":"q3.png","section":"Section 1"},{"n":4,"img":"q4.png","section":"Section 1"},{"n":5,"img":"q5.png","section":"Section 1"},{"n":6,"img":"q6.png","section":"Section 1"},{"n":7,"img":"q7.png","section":"Section 1"},{"n":8,"img":"q8.png","section":"Section 1"},{"n":9,"img":"q9.png","section":"Section 1"},{"n":10,"img":"q10.png","section":"Section 1"},{"n":11,"img":"q11.png","section":"Section 1"},{"n":12,"img":"q12.png","section":"Section 1"},{"n":13,"img":"q13.png","section":"Section 1"},{"n":14,"img":"q14.png","section":"Section 1"},{"n":15,"img":"q15.png","section":"Section 1"},{"n":16,"img":"q16.png","section":"Section 1"},{"n":17,"img":"q17.png","section":"Section 1"},{"n":18,"img":"q18.png","section":"Section 1"},{"n":19,"img":"q19.png","section":"Section 1"},{"n":20,"img":"q20.png","section":"Section 1"},{"n":21,"img":"q21.png","section":"Section 2"},{"n":22,"img":"q22.png","section":"Section 2"},{"n":23,"img":"q23.png","section":"Section 2"},{"n":24,"img":"q24.png","section":"Section 2"},{"n":25,"img":"q25.png","section":"Section 2"},{"n":26,"img":"q26.png","section":"Section 2"},{"n":27,"img":"q27.png","section":"Section 2"},{"n":28,"img":"q28.png","section":"Section 2"},{"n":29,"img":"q29.png","section":"Section 2"},{"n":30,"img":"q30.png","section":"Section 2"},{"n":31,"img":"q31.png","section":"Section 2"},{"n":32,"img":"q32.png","section":"Section 2"},{"n":33,"img":"q33.png","section":"Section 2"},{"n":34,"img":"q34.png","section":"Section 2"},{"n":35,"img":"q35.png","section":"Section 2"},{"n":36,"img":"q36.png","section":"Section 2"},{"n":37,"img":"q37.png","section":"Section 2"},{"n":38,"img":"q38.png","section":"Section 2"},{"n":39,"img":"q39.png","section":"Section 2"},{"n":40,"img":"q40.png","section":"Section 2"},{"n":41,"img":"q41.png","section":"Section 3"},{"n":42,"img":"q42.png","section":"Section 3"},{"n":43,"img":"q43.png","section":"Section 3"},{"n":44,"img":"q44.png","section":"Section 3"},{"n":45,"img":"q45.png","section":"Section 3"},{"n":46,"img":"q46.png","section":"Section 3"},{"n":47,"img":"q47.png","section":"Section 3"},{"n":48,"img":"q48.png","section":"Section 3"},{"n":49,"img":"q49.png","section":"Section 3"},{"n":50,"img":"q50.png","section":"Section 3"},{"n":51,"img":"q51.png","section":"Section 3"},{"n":52,"img":"q52.png","section":"Section 3"},{"n":53,"img":"q53.png","section":"Section 3"},{"n":54,"img":"q54.png","section":"Section 3"},{"n":55,"img":"q55.png","section":"Section 3"},{"n":56,"img":"q56.png","section":"Section 3"},{"n":57,"img":"q57.png","section":"Section 3"},{"n":58,"img":"q58.png","section":"Section 3"},{"n":59,"img":"q59.png","section":"Section 3"},{"n":60,"img":"q60.png","section":"Section 3"},{"n":61,"img":"q61.png","section":"Section 4"},{"n":62,"img":"q62.png","section":"Section 4"},{"n":63,"img":"q63.png","section":"Section 4"},{"n":64,"img":"q64.png","section":"Section 4"},{"n":65,"img":"q65.png","section":"Section 4"},{"n":66,"img":"q66.png","section":"Section 4"},{"n":67,"img":"q67.png","section":"Section 4"},{"n":68,"img":"q68.png","section":"Section 4"},{"n":69,"img":"q69.png","section":"Section 4"},{"n":70,"img":"q70.png","section":"Section 4"},{"n":71,"img":"q71.png","section":"Section 4"},{"n":72,"img":"q72.png","section":"Section 4"},{"n":73,"img":"q73.png","section":"Section 4"},{"n":74,"img":"q74.png","section":"Section 4"},{"n":75,"img":"q75.png","section":"Section 4"},{"n":76,"img":"q76.png","section":"Section 4"},{"n":77,"img":"q77.png","section":"Section 4"},{"n":78,"img":"q78.png","section":"Section 4"},{"n":79,"img":"q79.png","section":"Section 4"},{"n":80,"img":"q80.png","section":"Section 4"}];
const total=QUESTIONS.length; const answers={}; let idx=0,startTime=0;
const $=id=>document.getElementById(id);
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
$("startBtn").onclick=function(){const nm=$("nm").value.trim(),em=$("em").value.trim();
  if(!nm){alert("Please enter your name.");return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){alert("Please enter a valid email address.");return;}
  window.studentName=nm;window.studentEmail=em;$("start").style.display="none";$("quiz").style.display="block";startTime=Date.now();render();};
function render(){const q=QUESTIONS[idx];
  $("prog").style.width=Math.round(idx/total*100)+"%";
  $("sec").textContent=q.section;$("qlabel").textContent="Question "+q.n+" of "+total;
  $("fig").src=q.img;
  $("opts").innerHTML=LET.map(L=>'<label><input type="radio" name="o" value="'+L+'"'+(answers[q.n]===L?" checked":"")+'>'+L+'</label>').join("");
  const nb=$("nextBtn");nb.disabled=!answers[q.n];nb.textContent=idx===total-1?"Finish":"Next →";
  document.querySelectorAll('input[name=o]').forEach(r=>r.onchange=function(){answers[q.n]=this.value;nb.disabled=false;});
  window.scrollTo(0,0);}
$("nextBtn").onclick=function(){if(this.disabled)return;if(idx<total-1){idx++;render();}else submit();};
async function submit(){const btn=$("nextBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span> Scoring…';
  try{const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({type:"generic",test_id:TEST_ID,bankPath:BANK_PATH,title:TITLE,name:window.studentName,email:window.studentEmail,elapsedSeconds:Math.round((Date.now()-startTime)/1000),answers:answers})});
    const data=await r.json();if(data.error)throw new Error(data.error);showResult(data);
  }catch(err){btn.disabled=false;btn.textContent="Finish";alert("Submission failed: "+err.message);}}
function showResult(data){$("quiz").style.display="none";
  $("scoreLine").textContent="Complete — "+data.total+" / "+data.max+" correct";
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Section</th><th style='padding:6px 12px'>Score</th></tr>";
  (data.sections||[]).forEach(s=>rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>");
  $("secTable").innerHTML=rows;
  let html="<h3>Review</h3>";
  (data.review||[]).forEach(rv=>{const ok=rv.your===rv.correct;
    html+='<div class="ri">Question '+rv.n+': your answer <b>'+(rv.your||"—")+'</b> · correct <b>'+rv.correct+'</b> <span class="'+(ok?"ok":"no")+'">'+(ok?"✓":"✗")+'</span></div>';});
  $("review").innerHTML=html;$("result").style.display="block";window.scrollTo(0,0);}
</script></div></body></html>
