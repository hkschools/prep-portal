<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verbal Reasoning: Paper 1</title><style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--line:#dce3ea;--ink:#1c2733;--muted:#6b7280;--green:#1a7f37;--red:#c0392b}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 18px}.tt{color:var(--muted);font-size:13px;margin-bottom:8px}
h2{color:var(--navy);margin:0 0 4px}.muted{color:var(--muted)}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.qn{color:var(--muted);font-size:13px;margin-bottom:4px}.sec{color:var(--blue);font-weight:700;font-size:12px}
.stem{font-size:18px;font-weight:600;color:var(--navy);margin:8px 0 14px;line-height:1.4}
.grp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts label{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:10px}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts label.sel{border-color:var(--blue);background:#eaf2fb}
.olab{font-weight:700;color:var(--navy);min-width:18px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px}
button.primary:disabled{opacity:.45}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
.ri{border-top:1px solid var(--line);padding:9px 0;font-size:14px}.ok{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">
<div class="tt">GL Assessment &middot; Verbal Reasoning &middot; Paper 1</div>
<h2>Verbal Reasoning</h2>
<p class="muted">80 questions. Read each question and choose your answer. Some questions ask for two words (one from each group, or the two that do not fit). One question per screen.</p>

<div id="start" class="card">
  <p><label>Full name<br><input type="text" id="nm" autocomplete="name" placeholder="Full name"></label></p>
  <p style="margin-top:10px"><label>Email<br><input type="text" id="em" autocomplete="email" placeholder="student@example.com"></label></p>
  <button class="primary" id="startBtn">Start &rarr;</button>
</div>

<div id="quiz" style="display:none">
  <div class="bar"><i id="prog"></i></div>
  <div class="card">
    <div class="qn"><span id="sec" class="sec"></span> &middot; <span id="qlabel"></span></div>
    <div class="stem" id="stem"></div>
    <div id="body"></div>
    <button class="primary" id="nextBtn" disabled>Next &rarr;</button>
  </div>
</div>

<div id="result" style="display:none" class="card">
  <h2 id="scoreLine" style="margin-top:0"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:6px 0 14px"></table>
  <div id="review"></div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxg1hCDNhz5XQlVscVvaO1CIoPetSDNvNSupfWTUaqaMF_q_n4WPeEO48klxMmj5W8C0w/exec";
const TEST_ID="VR-1";
const BANK_PATH="gl/vr/v1/bank.csv";
const TITLE="Verbal Reasoning: Paper 1";
const G1=["A","B","C"], G2=["X","Y","Z"], LET=["A","B","C","D","E"];
const QUESTIONS=[{"n":1,"section":"Move a letter","type":"mcq","stem":"metal though","opts":["m","e","t","a","l"]},{"n":2,"section":"Move a letter","type":"mcq","stem":"liner bother","opts":["l","i","n","e","r"]},{"n":3,"section":"Move a letter","type":"mcq","stem":"biased pant","opts":["b","i","a","s","d"]},{"n":4,"section":"Move a letter","type":"mcq","stem":"chomp tea","opts":["c","h","o","m","p"]},{"n":5,"section":"Move a letter","type":"mcq","stem":"player fight","opts":["p","l","a","y","r"]},{"n":6,"section":"Move a letter","type":"mcq","stem":"brain tale","opts":["b","r","a","i","n"]},{"n":7,"section":"Move a letter","type":"mcq","stem":"flower lit","opts":["f","l","o","w","r"]},{"n":8,"section":"Same letter both brackets","type":"mcq","stem":"wor [ ? ] en    fin [ ? ] ice","opts":["m","t","d","s","n"]},{"n":9,"section":"Same letter both brackets","type":"mcq","stem":"loo [ ? ] eak    wee [ ? ] ull","opts":["b","k","m","p","s"]},{"n":10,"section":"Same letter both brackets","type":"mcq","stem":"roo [ ? ] ick    oa [ ? ] ind","opts":["t","r","m","f","k"]},{"n":11,"section":"Same letter both brackets","type":"mcq","stem":"car [ ? ] ip    fac [ ? ] rust","opts":["t","d","p","c","e"]},{"n":12,"section":"Same letter both brackets","type":"mcq","stem":"chee [ ? ] ang    spea [ ? ] ide","opts":["s","r","b","p","k"]},{"n":13,"section":"Same letter both brackets","type":"mcq","stem":"pe [ ? ] et    cla [ ? ] umber","opts":["w","g","p","l","n"]},{"n":14,"section":"Same letter both brackets","type":"mcq","stem":"her [ ? ] ut    pol [ ? ] asis","opts":["b","o","e","l","d"]},{"n":15,"section":"Word in second group","type":"mcq","stem":"(staff [not] gnome)    (epoch [ ? ] image)","opts":["gem","map","hip","ham","mop"]},{"n":16,"section":"Word in second group","type":"mcq","stem":"(puzzle [zip] boiler)    (nettle [ ? ] brands)","opts":["tan","tee","ten","tar","tab"]},{"n":17,"section":"Word in second group","type":"mcq","stem":"(kiosk [sky] syrup)    (agile [ ? ] upset)","opts":["use","lip","pea","gap","lap"]},{"n":18,"section":"Word in second group","type":"mcq","stem":"(pedal [idea] saint)    (swamp [ ? ] issue)","opts":["swap","saps","sums","saws","swim"]},{"n":19,"section":"Word in second group","type":"mcq","stem":"(relax [axe] exists)    (jewel [ ? ] byway)","opts":["eel","ale","eye","awe","ewe"]},{"n":20,"section":"Word in second group","type":"mcq","stem":"(occupy [cape] repeat)    (snouts [ ? ] chisel)","opts":["once","hens","nets","oils","nest"]},{"n":21,"section":"Word in second group","type":"mcq","stem":"(thigh [hat] atlas)    (dwarf [ ? ] moths)","opts":["for","who","was","oar","wad"]},{"n":22,"section":"Number series","type":"mcq","stem":"27 26 28 25 29 24 30 [ ? ]","opts":["33","29","25","23","31"]},{"n":23,"section":"Number series","type":"mcq","stem":"4 8 11 15 18 [ ? ]","opts":["21","20","25","22","28"]},{"n":24,"section":"Number series","type":"mcq","stem":"28 32 25 27 22 22 19 17 16 [ ? ]","opts":["15","13","12","14","11"]},{"n":25,"section":"Number series","type":"mcq","stem":"20 23 27 32 38 [ ? ]","opts":["45","48","46","39","51"]},{"n":26,"section":"Number series","type":"mcq","stem":"57 56 54 52 50 47 45 41 39 [ ? ]","opts":["32","31","35","33","34"]},{"n":27,"section":"Number series","type":"mcq","stem":"88 92 90 95 92 98 94 101 [ ? ]","opts":["100","95","93","96","99"]},{"n":28,"section":"Number series","type":"mcq","stem":"2 5 14 41 [ ? ]","opts":["122","84","62","140","112"]},{"n":29,"section":"Logic problem","type":"mcq","stem":"At the shops Darren bought 8 oranges. Laura bought 3 oranges fewer than Chris. Rosario bought 3 oranges fewer than Darren and 1 fewer than Chris. How many oranges did Laura buy?","opts":["1","9","3","5","2"]},{"n":30,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["break","ignore","hit"],"g2":["poke","miss","aim"]},{"n":31,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["cheap","price","cost"],"g2":["amount","dear","expense"]},{"n":32,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["complex","superior","modern"],"g2":["old","new","fresh"]},{"n":33,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["lock","close","away"],"g2":["key","distant","shut"]},{"n":34,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["hobby","usual","rarely"],"g2":["habit","often","seldom"]},{"n":35,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["heavy","glow","stiff"],"g2":["shine","hard","flexible"]},{"n":36,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["approximate","true","close"],"g2":["broad","precise","rough"]},{"n":37,"section":"most opposite in meaning","type":"mcq2g","stem":"","g1":["transparent","clear","hollow"],"g2":["empty","vague","glass"]},{"n":38,"section":"Hidden four-letter word","type":"mcq","stem":"They were not alerted at once.","opts":["They were","were not","not alerted","alerted at","at once."]},{"n":39,"section":"Hidden four-letter word","type":"mcq","stem":"The shampoo left bubbles in the bath.","opts":["The shampoo","shampoo left","left bubbles","bubbles in","in the"]},{"n":40,"section":"Hidden four-letter word","type":"mcq","stem":"Visitors wandered around the colourful gardens.","opts":["Visitors wandered","wandered around","around the","the colourful","colourful gardens."]},{"n":41,"section":"Hidden four-letter word","type":"mcq","stem":"She tried to grasp another rope.","opts":["She tried","tried to","to grasp","grasp another","another rope."]},{"n":42,"section":"Hidden four-letter word","type":"mcq","stem":"The rhinoceros escaped from the cage.","opts":["The rhinoceros","rhinoceros escaped","escaped from","from the","the cage."]},{"n":43,"section":"Hidden four-letter word","type":"mcq","stem":"He hid the banjo inside the cupboard.","opts":["He hid","hid the","the banjo","banjo inside","inside the"]},{"n":44,"section":"Hidden four-letter word","type":"mcq","stem":"They searched the patrol area systematically.","opts":["They searched","searched the","the patrol","patrol area","area systematically."]},{"n":45,"section":"Next pair of letters","type":"mcq","stem":"UD VF WH XJ [ ? ]","opts":["ZL","YL","YK","ZK","YM"]},{"n":46,"section":"Next pair of letters","type":"mcq","stem":"ZO WL TI QF [ ? ]","opts":["NC","OD","MC","ND","OB"]},{"n":47,"section":"Next pair of letters","type":"mcq","stem":"AQ CM EI GE [ ? ]","opts":["JB","IB","HE","IA","JA"]},{"n":48,"section":"Next pair of letters","type":"mcq","stem":"HQ LR PS TT [ ? ]","opts":["WV","UV","XU","XT","UX"]},{"n":49,"section":"Next pair of letters","type":"mcq","stem":"SG NL JP GS [ ? ]","opts":["ET","UE","DT","DU","EU"]},{"n":50,"section":"Next pair of letters","type":"mcq","stem":"KM LL ML NM OO PR [ ? ]","opts":["QU","RU","RV","QV","QW"]},{"n":51,"section":"Next pair of letters","type":"mcq","stem":"CQ BL ZH WE [ ? ]","opts":["SC","RC","TD","TC","SD"]},{"n":52,"section":"Hidden three-letter word","type":"mcq","stem":"His favourite food was CABE.","opts":["BAG","GET","EVE","SAG","BAT"]},{"n":53,"section":"Hidden three-letter word","type":"mcq","stem":"The cars SDED in the bad weather.","opts":["DEN","KID","PAR","RAN","LAD"]},{"n":54,"section":"Hidden three-letter word","type":"mcq","stem":"He BED for more space in the room.","opts":["EGG","LAB","ONE","TUG","RIP"]},{"n":55,"section":"Hidden three-letter word","type":"mcq","stem":"The morning was spent CLING the garden.","opts":["ROE","AFT","APE","EAR","OWE"]},{"n":56,"section":"Hidden three-letter word","type":"mcq","stem":"I introduced my STEPHER.","opts":["FAT","MOW","VAN","CAP","RAT"]},{"n":57,"section":"Hidden three-letter word","type":"mcq","stem":"They were OVERED at the news.","opts":["GAP","NIL","JOY","TON","POT"]},{"n":58,"section":"Hidden three-letter word","type":"mcq","stem":"He gave his final JUDENT.","opts":["HUM","GEM","ACE","TEN","TRY"]},{"n":59,"section":"Hidden three-letter word","type":"mcq","stem":"Teabags have lots of PERATIONS.","opts":["SET","HIP","FOR","COT","LET"]},{"n":60,"section":"complete the sentence","type":"mcq2g","stem":"Look is to (...) as listen is to (...)","g1":["eye","blink","see"],"g2":["hear","tone","noise"]},{"n":61,"section":"complete the sentence","type":"mcq2g","stem":"High is to (...) as deep is to (...)","g1":["low","far","big"],"g2":["fall","shallow","water"]},{"n":62,"section":"complete the sentence","type":"mcq2g","stem":"Bus is to (...) as plane is to (...)","g1":["driver","passengers","road"],"g2":["airline","cloud","pilot"]},{"n":63,"section":"complete the sentence","type":"mcq2g","stem":"Plug is to (...) as cork is to (...)","g1":["sink","stopper","block"],"g2":["bottle","float","screw"]},{"n":64,"section":"complete the sentence","type":"mcq2g","stem":"Fly is to (...) as run is to (...)","g1":["insect","wings","feathers"],"g2":["fast","person","legs"]},{"n":65,"section":"complete the sentence","type":"mcq2g","stem":"Stitch is to (...) as stroke is to (...)","g1":["sew","needle","cloth"],"g2":["pat","paint","cat"]},{"n":66,"section":"complete the sentence","type":"mcq2g","stem":"Large is to (...) as small is to (...)","g1":["open","spacious","great"],"g2":["confined","close","near"]},{"n":67,"section":"Logic which must be true","type":"mcq","stem":"A cinema is open every night from 7 pm. The latest time a film begins is 11 pm. Films start at 7.15 pm, 8.15 pm and 9.15 pm on Tuesdays and Thursdays. On Mondays and Wednesdays films start on the hour, every hour. At the weekend, films start every half hour from 7 pm. If these statements are true, only one of the sentences below must be true. Which one?","opts":["No films start at 9.30 pm.","On Tuesday, a film starts at 9 pm.","Films start at 9.15 pm three days each week.","A film starts at 9 pm on Monday, Wednesday and at the weekend.","All films finish before 11 pm."]},{"n":68,"section":"Word suits both pairs","type":"mcq","stem":"(permit allow)    (rent hire)","opts":["grant","let","agree","use","loan"]},{"n":69,"section":"Word suits both pairs","type":"mcq","stem":"(wood trunk)    (howl wail)","opts":["tree","shout","cut","bark","call"]},{"n":70,"section":"Word suits both pairs","type":"mcq","stem":"(resemble similar)    (fond admire)","opts":["please","copy","enjoy","like","same"]},{"n":71,"section":"Word suits both pairs","type":"mcq","stem":"(token disc)    (worktop surface)","opts":["flat","voucher","counter","sideboard","coin"]},{"n":72,"section":"Word suits both pairs","type":"mcq","stem":"(jump leap)    (well water)","opts":["hop","flow","move","source","spring"]},{"n":73,"section":"Word suits both pairs","type":"mcq","stem":"(chapter paragraph)    (corridor alley)","opts":["book","path","walk","read","passage"]},{"n":74,"section":"Word suits both pairs","type":"mcq","stem":"(allotment patch)    (conspire plan)","opts":["plot","scheme","garden","land","conceive"]},{"n":75,"section":"Letter codes","type":"mcq","stem":"ANTS=5836 BASE=4172 LETS=8672 BLUE=missing. Find the code for the word BASE.","opts":["5836","5368","5872","5462","5426"]},{"n":76,"section":"Letter codes","type":"mcq","stem":"ANTS=5836 BASE=4172 LETS=8672 BLUE=missing. Find the code for the word EAST.","opts":["4627","6428","6472","6427","4678"]},{"n":77,"section":"Letter codes","type":"mcq","stem":"ANTS=5836 BASE=4172 LETS=8672 BLUE=missing. Find the word that has the number code 7316.","opts":["TUBS","TUNE","TUNA","TANS","TABS"]},{"n":78,"section":"Letter codes shuffled","type":"mcq","stem":"KITE INTO PAIN POET coded as 8457 5716 3512 (one code missing, codes not in order). Find the code for the word KITE.","opts":["3512","5716","8621","3421","5632"]},{"n":79,"section":"Letter codes shuffled","type":"mcq","stem":"KITE INTO PAIN POET coded as 8457 5716 3512 (one code missing, codes not in order). Find the word that has the number code 8243.","opts":["PEAT","PEAK","TEAK","TANK","PENT"]},{"n":80,"section":"Letter codes shuffled","type":"mcq","stem":"KITE INTO PAIN POET coded as 8457 5716 3512 (one code missing, codes not in order). Find the code for the word KNOT.","opts":["3751","3761","7351","7361","3851"]}];
const total=QUESTIONS.length; const answers={}; let idx=0,startTime=0;
const $=id=>document.getElementById(id);
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
$("startBtn").onclick=function(){const nm=$("nm").value.trim(),em=$("em").value.trim();
  if(!nm){alert("Please enter your name.");return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){alert("Please enter a valid email address.");return;}
  window.studentName=nm;window.studentEmail=em;$("start").style.display="none";$("quiz").style.display="block";startTime=Date.now();render();};

function setAns(n,v){answers[n]=v;$("nextBtn").disabled=!answers[n];}
function refreshSel(){document.querySelectorAll('#body label').forEach(l=>l.classList.remove('sel'));}

function render(){const q=QUESTIONS[idx];
  $("prog").style.width=Math.round(idx/total*100)+"%";
  $("sec").textContent=q.section;$("qlabel").textContent="Question "+q.n+" of "+total;
  $("stem").innerHTML=q.stem?esc(q.stem):"";
  const body=$("body");body.innerHTML="";
  const nb=$("nextBtn");nb.textContent=idx===total-1?"Finish":"Next →";

  if(q.type==="mcq"){
    const wrap=document.createElement("div");wrap.className="opts";
    q.opts.forEach((txt,i)=>{const L=LET[i];
      const lab=document.createElement("label");
      lab.innerHTML='<span class="olab">'+L+'</span><span>'+esc(txt)+'</span>';
      if(answers[q.n]===L)lab.classList.add("sel");
      lab.onclick=()=>{setAns(q.n,L);refreshSel();lab.classList.add("sel");};
      wrap.appendChild(lab);});
    body.appendChild(wrap);
    nb.disabled=!answers[q.n];
  } else if(q.type==="mcq2g"){
    const cur=(answers[q.n]||",").split(",");  // [g1,g2]
    function grp(title,letters,words,slot){
      const h=document.createElement("div");h.className="grp";h.textContent=title;body.appendChild(h);
      const wrap=document.createElement("div");wrap.className="opts";
      words.forEach((txt,i)=>{const L=letters[i];
        const lab=document.createElement("label");
        lab.innerHTML='<span class="olab">'+L+'</span><span>'+esc(txt)+'</span>';
        if(cur[slot]===L)lab.classList.add("sel");
        lab.onclick=()=>{cur[slot]=L;
          wrap.querySelectorAll('label').forEach(x=>x.classList.remove('sel'));lab.classList.add('sel');
          if(cur[0]&&cur[1])setAns(q.n,cur[0]+","+cur[1]);else nb.disabled=true;};
        wrap.appendChild(lab);});
      body.appendChild(wrap);
    }
    grp("Group 1: choose one",G1,q.g1,0);
    grp("Group 2: choose one",G2,q.g2,1);
    nb.disabled=!(cur[0]&&cur[1]);
  } else if(q.type==="mcq2of5"){
    const h=document.createElement("div");h.className="grp";h.textContent="Choose the TWO that do not belong";body.appendChild(h);
    const picked=new Set((answers[q.n]||"").split(",").filter(Boolean));
    const wrap=document.createElement("div");wrap.className="opts";
    q.opts.forEach((txt,i)=>{const L=LET[i];
      const lab=document.createElement("label");
      lab.innerHTML='<span class="olab">'+L+'</span><span>'+esc(txt)+'</span>';
      if(picked.has(L))lab.classList.add("sel");
      lab.onclick=()=>{
        if(picked.has(L)){picked.delete(L);lab.classList.remove('sel');}
        else{if(picked.size>=2)return;picked.add(L);lab.classList.add('sel');}
        if(picked.size===2){const a=[...picked].sort();setAns(q.n,a.join(","));}
        else{delete answers[q.n];nb.disabled=true;}
      };
      wrap.appendChild(lab);});
    body.appendChild(wrap);
    const hint=document.createElement("div");hint.className="hint";hint.textContent="Pick exactly two.";body.appendChild(hint);
    nb.disabled=picked.size!==2;
  }
  window.scrollTo(0,0);
}
$("nextBtn").onclick=function(){if(this.disabled)return;if(idx<total-1){idx++;render();}else submit();};

function payloadQuestions(){
  return QUESTIONS.map(q=>{
    if(q.type==="mcq")return {n:q.n,stem:q.stem,options:q.opts};
    if(q.type==="mcq2of5")return {n:q.n,stem:(q.stem?q.stem+" ":"")+"[choose the two that do not belong]",options:q.opts};
    // mcq2g: bake labelled groups into the stem, no options array
    const g1=q.g1.map((w,i)=>G1[i]+") "+w).join("  ");
    const g2=q.g2.map((w,i)=>G2[i]+") "+w).join("  ");
    return {n:q.n,stem:(q.stem?q.stem+"  ":"")+"Group 1: "+g1+"   Group 2: "+g2};
  });
}
async function submit(){const btn=$("nextBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({type:"generic",test_id:TEST_ID,bankPath:BANK_PATH,title:TITLE,name:window.studentName,email:window.studentEmail,elapsedSeconds:Math.round((Date.now()-startTime)/1000),answers:answers,questions:payloadQuestions()})});
    const data=await r.json();if(data.error)throw new Error(data.error);showResult(data);
  }catch(err){btn.disabled=false;btn.textContent="Finish";alert("Submission failed: "+err.message);}}
function showResult(data){$("quiz").style.display="none";
  $("scoreLine").textContent="Complete: "+data.total+" / "+data.max+" correct";
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Section</th><th style='padding:6px 12px'>Score</th></tr>";
  (data.sections||[]).forEach(s=>rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>");
  $("secTable").innerHTML=rows;
  let html="<h3>Review</h3>";
  (data.review||[]).forEach(rv=>{const ok=rv.your===rv.correct;
    html+='<div class="ri">Question '+rv.n+': your answer <b>'+(rv.your||"-")+'</b> &middot; correct <b>'+rv.correct+'</b> <span class="'+(ok?"ok":"no")+'">'+(ok?"✓":"✗")+'</span></div>';});
  $("review").innerHTML=html;$("result").style.display="block";window.scrollTo(0,0);}
</script></div></body></html>
