<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verbal Reasoning: Paper 2</title><style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--line:#dce3ea;--ink:#1c2733;--muted:#6b7280;--green:#1a7f37;--red:#c0392b}

.example{background:#fafbfc;border:1px dashed var(--line);border-radius:8px;padding:10px 13px;margin:8px 0;font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.5}
.example b{color:var(--navy)}
.stem{font-size:18px;font-weight:600;color:var(--navy);margin:10px 0 14px;line-height:1.4}
.grp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts label{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:10px}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts label.sel{border-color:var(--blue);background:#eaf2fb}
.olab{font-weight:700;color:var(--navy);min-width:18px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px}
button.primary:disabled{opacity:.45}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
.ri{border-top:1px solid var(--line);padding:9px 0;font-size:14px}.ok{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}

const G1=["A","B","C"], G2=["X","Y","Z"], LET=["A","B","C","D","E"];
const QUESTIONS=[{"n":1,"section":"Hidden three-letter word","type":"mcq","stem":"I wear SALS in the summer.","opts":["LAP","AND","CAN","OLD","TAR"],"instruction":"In these sentences, the word in capitals has had three letters next to each other taken out. These three letters will make one correctly-spelt word without changing their order. The sentence that you make must make sense. Mark the correct three-letter word on the answer sheet.","example":"Example: The cat scratched him with his CS.\nOptions: A LAD   B LAW   C HAD   D RAW   E RED\nAnswer: LAW\nSolution: The three-letter word that has been removed from CS is 'LAW'. If we place this three-letter word between C and S, it makes the word CLAWS and thus completes the sentence."},{"n":2,"section":"Hidden three-letter word","type":"mcq","stem":"I'm going to the BING alley for my birthday.","opts":["LIT","AIM","ONE","OWL","INK"],"instruction":"In these sentences, the word in capitals has had three letters next to each other taken out. These three letters will make one correctly-spelt word without changing their order. The sentence that you make must make sense. Mark the correct three-letter word on the answer sheet."},{"n":3,"section":"Hidden three-letter word","type":"mcq","stem":"An EXPERIT was carried out.","opts":["MEN","CAT","PEN","EAR","ANT"],"instruction":"In these sentences, the word in capitals has had three letters next to each other taken out. These three letters will make one correctly-spelt word without changing their order. The sentence that you make must make sense. Mark the correct three-letter word on the answer sheet."},{"n":4,"section":"Hidden three-letter word","type":"mcq","stem":"The hat was FLING on the water.","opts":["OFF","OAT","ATE","AID","END"],"instruction":"In these sentences, the word in capitals has had three letters next to each other taken out. These three letters will make one correctly-spelt word without changing their order. The sentence that you make must make sense. Mark the correct three-letter word on the answer sheet."},{"n":5,"section":"Hidden three-letter word","type":"mcq","stem":"The boy was taught how to WTLE.","opts":["HAS","ILL","HIS","OIL","EEL"],"instruction":"In these sentences, the word in capitals has had three letters next to each other taken out. These three letters will make one correctly-spelt word without changing their order. The sentence that you make must make sense. Mark the correct three-letter word on the answer sheet."},{"n":6,"section":"Hidden three-letter word","type":"mcq","stem":"A GUATEE came with the television.","opts":["RAN","SAT","NOT","OUR","OWE"],"instruction":"In these sentences, the word in capitals has had three letters next to each other taken out. These three letters will make one correctly-spelt word without changing their order. The sentence that you make must make sense. Mark the correct three-letter word on the answer sheet."},{"n":7,"section":"Hidden three-letter word","type":"mcq","stem":"The comedian IMITD people.","opts":["ALL","FOR","ATE","ILL","AND"],"instruction":"In these sentences, the word in capitals has had three letters next to each other taken out. These three letters will make one correctly-spelt word without changing their order. The sentence that you make must make sense. Mark the correct three-letter word on the answer sheet."},{"n":8,"section":"closest in meaning","type":"mcq2g","stem":"find two words, one from each group, that are closest in meaning","g1":["can","grease","pan"],"g2":["fry","oil","slip"],"instruction":"In these questions, find two words, one from each group, that are closest in meaning. Mark both words on the answer sheet.","example":"Example: (office shop start) | (work begin end)\nOptions: A office  B shop  C start / X work  Y begin  Z end\nAnswer: start begin\nSolution: The two words, one from each group, that are closest in meaning are 'start' from group one and 'begin' from group two."},{"n":9,"section":"closest in meaning","type":"mcq2g","stem":"find ype":"mcq","stem":"The bold monkey sat on my shoulder.","opts":["The bold","bold monkey","monkey sat","sat on","on my"],"instruction":"In these sentences, a word of four letters is hidden at the end of one word and the beginning of the next word. Find the pair of words that contains the hidden word and mark this answer on the answer sheet.","example":"Example: The film ended happily after all.\nOptions: A The film  B film ended  C ended happily  D happily after  E after all.\nAnswer: film ended\nSolution: In this sentence, the hidden four-letter word is 'mend', which is made up of the last letter of the word 'film' and the first three letters of the word 'ended'. So the pair of words that contains the hidden word is 'film ended'."},{"n":16,"section":"Hidden four-letter word","type":"mcq","stem":"It is wonderful living in the country.","opts":["It is","is wonderful","wonderful living","living in","in the"],"instruction":"In these sentences, a word of four letters is hidden at the end of one word and the beginning of the next word. Find the pair of words that contains the hidden word and mark this answer on the answer sheet."},{"n":17,"section":"Hidden four-letter word","type":"mcq","stem":"The sky was clear after days of rain.","opts":["The sky","sky was","was clear","clear after","after days"],"instruction":"In these sentences, a word of four letters is hidden at the end of one word and the beginning of the next word. Find the pair of words that contains the hidden word and mark this answer on the answer sheet."},{"n":18,"section":"Hidden four-letter word","type":"mcq","stem":"Does the paper come with envelopes?","opts":["Does the","the paper","paper come","come with","with envelopes?"],"instruction":"In these sentences, a word of four letters is hidden at the end of one word and the beginning of the next word. Find the pair of words that contains the hidden word and mark this answer on the answer sheet."},{"n":19,"section":"Hidden four-letter word","type":"mcq","stem":"The angry woman yelled at the driver.","opts":["The angry","angry woman","woman yelled","yelled at","at the"],"instruction":"In these sentences, a word of four letters is hidden at the end of one word and the beginning of the next word. Find the pair of words that contains the hidden word and mark this answer on the answer sheet."},{"n":20,"section":"Hidden four-letter word","type":"mcq","stem":"I emptied it for you last night.","opts":["I emptied","emptied it","it for","for you","you last"],"instruction":"In these sentences, a word of four letters is hidden at the end of one word and the beginning of the next word. Find the pair of words that contains the hidden word and mark this answer on the answer sheet."},{"n":21,"section":"Hidden four-letter word","type":"mcq","stem":"She ran to catch the bus.","opts":["She ran","ran to","to catch","catch the","the bus."],"instruction":"In these sentences, a word of four letters is hidden at the end of one word and the beginning of the next word. Find the pair of words that contains the hidden word and mark this answer on the answer sheet."},{"n":22,"section":"Logic problem","type":"mcq","stem":"In a block of flats, Natalie lives two floors below Michelle and one floor above Christopher. Yousuf lives one floor above Natalie. Matthew lives one floor below Michelle. Who lives on the same floor?","opts":["Yousuf and Natalie.","Yousuf and Matthew.","Matthew and Michelle.","Christopher and Matthew.","Natalie and Michelle."],"instruction":"Read the following information, then find the correct answer to the question and mark it on the answer sheet."},{"n":23,"section":"Same letter both brackets","type":"mcq","stem":"fle [?] ish    slo [?] aste","opts":["p","w","d","t","f"],"instruction":"In these questions, the same letter must fit into both sets of brackets, to complete the word in front of the brackets and begin the word after the brackets. Find this letter and mark it on the answer sheet.","example":"Example: mea [?] able | mcq","stem":"ma [?] ear    ha [?] olk","opts":["y","n","t","f","d"],"instruction":"In these questions, the same letter must fit into both sets of brackets, to complete the word in front of the brackets and begin the word after the brackets. Find this letter and mark it on the answer sheet."},{"n":30,"section":"Word analogy","type":"mcq","stem":"(search [near] lotion)    (camera [?] strong)","opts":["neat","rate","game","near","gate"],"instruction":"In these questions, the three words in the second group should go together in the same way as the three in the first group. Find the word that is missing in the second group and mark it on the answer sheet.","example":"Example: (man [mat] tip) | (bug [ ? ] dew)\nOptions: A bud   B beg   C dug   D bed   E wed\nAnswer: bud\nSolution: The first two letters of 'man' and the first letter of 'tip' are put together to make the word 'mat'. In the same way, the first two letters of the word 'bug' and the first letter of the word 'dew' are put together to make the word 'bud'."},{"n":31,"section":"Word analogy","type":"mcq","stem":"(pin [pit] lit)    (run [?] may)","opts":["ray","rum","nay","ram","pay"],"instruction":"In these questions, the three words in the second group should go together in the same way as the three in the first group. Find the word that is missing in the second group and mark it on the answer sheet."},{"n":32,"section":"Word analogy","type":"mcq","stem":"(grand [art] dealt)    (barge [?] clear)","opts":["bar","bag","rag","car","ear"],"instruction":"In these questions, the three words in the second group should go together in the same way as the three in the first group. Find the word that is missing in the second group and mark it on the answer sheet."},{"n":33,"section":"Word analogy","type":"mcq","stem":"(latch [heat] shake)    (index [?] above)","opts":["bind","bend","bean","bond","bead"],"instruction":"In these questions, the three words in the second group should go together in the same way as the three in e related in some way. Find the two words that do not go with these three and mark them both on the answer sheet."},{"n":39,"section":"Two odd ones out","type":"mcq2of5","stem":"possess get buy own have","opts":["possess","get","buy","own","have"],"instruction":"In these questions, three of the five words are related in some way. Find the two words that do not go with these three and mark them both on the answer sheet."},{"n":40,"section":"Two odd ones out","type":"mcq2of5","stem":"pollute remove take destroy seize","opts":["pollute","remove","take","destroy","seize"],"instruction":"In these questions, three of the five words are related in some way. Find the two words that do not go with these three and mark them both on the answer sheet."},{"n":41,"section":"Two odd ones out","type":"mcq2of5","stem":"grow time develop exist mature","opts":["grow","time","develop","exist","mature"],"instruction":"In these questions, three of the five words are related in some way. Find the two words that do not go with these three and mark them both on the answer sheet."},{"n":42,"section":"Two odd ones out","type":"mcq2of5","stem":"clear conclude finish terminate prevent","opts":["clear","conclude","finish","terminate","prevent"],"instruction":"In these questions, three of the five words are related in some way. Find the two words that do not go with these three and mark them both on the answer sheet."},{"n":43,"section":"Two odd ones out","type":"mcq2of5","stem":"distribute spread arrange disperse organise","opts":["distribute","spread","arrange","disperse","organise"],"instruction":"In these questions, three of the five words are related in some way. Find the two words that do not go with these three and mark them both on the answer sheet."},{"n":44,"section":"Two odd ones out","type":"mcq2of5","stem":"acquire sustain maintain gain obtain","opts":["acquire","sustain","maintain","gain","obtain"],"instruction":"In these questions, three of the five words are related in some way. Find the two words that do not go with these three and mark them both on the answer sheet."},{"n":45,"section":"Letters for numbers","type":"mcq","stem":"If A = 2, B = 3, C = 4, D = 5, E = 6, what is the answer to this sum written as a letter? B x D - E - D = [?]","opts":["A","B","C","D","E"],"instruction":"In these questions, letters stand for numbers. Work out the answer to each sum, then find its letter and mark it on the answer sheet.","example":"Example: If A = 1, B = 2, C = 3, D = 6, E = 8, what is the answer to this sum written as a letter? A + B + C = [?]\nOptions: A A   B B   C C   D D   E E\nAnswer: D\nSolution: In this question, A = 1, B = 2, C = 3, D = 6, E = 8. If we convert the letters into numbers, the answer to the sum is 6. We can see that D = 6, therefore, the answer to this sum written as a letter is D."},{"n":46,"section":"Letters for numbers","type":"mcq","stem":"If A = 2, B = 5, C = 15, D = 23, E = 27, what is the answer to this sum written as a letter? A x C - B + A = [?]","opts":["A","B","C","D","E"],"instruction":"In these questions, letters stand for numbers. Work out the answer to each sum, then find its letter and mark it on the answer sheet."},{"n":47,"section":"Letters for numbers","type":"mcq","stem":"If A = 1, B = 3, C = 5, D = 15, E = 20, what is the answer to this sum written as a letter? B x E / D + A = [?]","opts":["A","B","C","D","E"],"instruction":"In these questions, letters stand for numbers. Work out the answer to each sum, then find its letter and mark it on the answer sheet."},{"n":48,"section":"Letters for numbers","type":"mcq","stem":"If A = 3, B = 5, C = 8, D = 9, E = 15, what is the answer to this sum written as a letter? D x B / E + B = [?]","opts":["A","B","C","D","E"],"instruction":"In these questions, letters stand for numbers. Work out the answer to each sum, then find its letter and mark it on the answer sheet."},{"n":49,"section":"Letters for numbers","type":"mcq","stem":"If A = 6, B = 9, C = 12, D = 27, E = 45, w Find the code for the word FIND.","opts":["3752","5674","4689","3759","5632"],"instruction":"Three of these four words are given in code. The codes are not written in the same order as the words and one code is missing.","example":"Example: NAIL FIND LATE FIST | 3752 5674 4689\nSolution: To answer this sort of question, you have to work out which number represents which letter. Begin by focusing on one number which appears more than once. If this number appears in the same position in two of the codes, you might be able to spot the same pattern with the letters. If not, compare the positions of your chosen letter and see if this is reflected in the words. For example, the number 7 appears in 2nd position in the first code (3752) and 3rd position in the second code (5674). Looking at the 2nd letters of the words, I is the one letter that also appears in 3rd position in a word, so the letter I must be represented by the number 7 and so on. Once we've substituted these letters into the remaining number codes, we can work out what a few more numbers stand for. Knowing that 4=L (from NAIL), we can tell that 4689 stands for LATE and, therefore, that 8=T and 9=E. Looking at the third and final number code, 3752, we can conclude that 3=F because the two remaining words both begin with F. This helps to establish what other letters stand for and answer further questions on missing words or codes."},{"n":69,"section":"Word codes","type":"mcq","stem":"NAIL FIND LATE FIST = 3752 5674 4689. Find the word that has the number code 4963.","opts":["DEAL","LIFE","DEAF","LEAF","LEAD"],"instruction":"Three of these four words are given in code. The codes are not written in the same order as the words and one code is missing."},{"n":70,"section":"Word codes","type":"mcq","stem":"NAIL FIND LATE FIST = 3752 5674 4689. Find the code for the word FLINT.","opts":["53758","34762","34769","53762","34758"],"instruction":"Three of these four words are given in code. The codes are not written in the same order as the words and one code is missing."},{"n":71,"section":"Word codes","type":"mcq","stem":"TIME HEAT MELT SAIL = 4726 5163 3251. Find the code for the word SAIL.","opts":["4726","5163","4752","3726","3752"],"instruction":"Three of these four words are given in code. The codes are not written in the same order as the words and one code is missing."},{"n":72,"section":"Word codes","type":"mcq","stem":"TIME HEAT MELT SAIL = 4726 5163 3251. Find the word that has the number code 61743.","opts":["MEATS","LEAKS","LEAST","LASTS","STEAL"],"instruction":"Three of these four words are given in code. The codes are not written in the same order as the words and one code is missing."},{"n":73,"section":"Word codes","type":"mcq","stem":"TIME HEAT MELT SAIL = 4726 5163 3251. Find the code for the word SMELT.","opts":["41725","43875","34875","42176","43175"],"instruction":"Three of these four words are given in code. The codes are not written in the same order as the words and one code is missing."},{"n":74,"section":"Next letter pair","type":"mcq","stem":"JL ML PL SL VL [?]","opts":["ZL","YL","VL","XL","UL"],"instruction":"The alphabet is here to help you with these questions. Find the next pair of letters in the series and mark it on the answer sheet.","example":"Example: CQ DQ EP FP [?]\nOptions: A GP   B GO   C HO   D GR   E GQ\nAnswer: GO\nSolution: The letters are grouped into pairs. The first letter in each pair is in alphabetical order: C, D, E, F. The second letter in each pair features twice in the series, and appears in reverse alphabetical order: Q, Q, P, P. Following this pattern, the next pair of letters after FP must be GO."},{"n":75,"section":"Next letter pair","type":"mcq","stem":"BE CJ EN HQ LS [?]","opts":["QS","QT","MS","ST","MT"],"instruction":"The alphabet is here to help you with these questions. Find the next pair of letters in the series and mark it on the answer sheet."},{"n":76,"section":"Next letter pair","type":"mcq","stem":"KD XP NG VN Q const total=QUESTIONS.length; const answers={}; let idx=0,startTime=0;
const $=id=>document.getElementById(id);
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
$("startBtn").onclick=function(){const nm=$("nm").value.trim(),em=$("em").value.trim();
  if(!nm){alert("Please enter your name.");return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){alert("Please enter a valid email address.");return;}
  window.studentName=nm;window.studentEmail=em;$("start").style.display="none";$("quiz").style.display="block";startTime=Date.now();render();};

function setAns(n,v){answers[n]=v;$("nextBtn").disabled=!answers[n];}
function refreshSel(){document.querySelectorAll('#body label').forEach(l=>l.classList.remove('sel'));}

function render(){const q=QUESTIONS[idx];
  $("prog").style.width=Math.round(idx/total*100)+"%";
  $("sec").textContent=q.section;$("qlabel").textContent="Question "+q.n+" of "+total;
  if(q.instruction){$("instr").textContent=q.instruction;$("instr").style.display="block";}else{$("instr").style.display="none";}
  if(q.example){$("example").innerHTML='<b>Worked example</b>\n'+esc(q.example);$("example").style.display="block";}else{$("example").style.display="none";}
  $("stem").innerHTML=q.stem?esc(q.stem):"";
  const body=$("body");body.innerHTML="";
  const nb=$("nextBtn");nb.textContent=idx===total-1?"Finish":"Next →";

  if(q.type==="mcq"){
    const wrap=document.createElement("div");wrap.className="opts";
    q.opts.forEach((txt,i)=>{const L=LET[i];
      const lab=document.createElement("label");
      lab.innerHTML='<span class="olab">'+L+'</span><span>'+esc(txt)+'</span>';
      if(answers[q.n]===L)lab.classList.add("sel");
      lab.onclick=()=>{setAns(q.n,L);refreshSel();lab.classList.add("sel");};
      wrap.appendChild(lab);});
    body.appendChild(wrap);
    nb.disabled=!answers[q.n];
  } else if(q.type==="mcq2g"){
    const cur=(answers[q.n]||",").split(",");  // [g1,g2]
    function grp(title,letters,words,slot){
      const h=document.createElement("div");h.className="grp";h.textContent=title;body.appendChild(h);
      const wrap=document.createElement("div");wrap.className="opts";
      words.forEach((txt,i)=>{const L=letters[i];
        const lab=document.createElement("label");
        lab.innerHTML='<span class="olab">'+L+'</span><span>'+esc(txt)+'</span>';
        if(cur[slot]===L)lab.classList.add("sel");
        lab.onclick=()=>{cur[slot]=L;
          wrap.querySelectorAll('label').forEach(x=>x.classList.remove('sel'));lab.classList.add('sel');
          if(cur[0]&&cur[1])setAns(q.n,cur[0]+","+cur[1]);else nb.disabled=true;};
        wrap.appendChild(lab);});
      body.appendChild(wrap);
    }
    grp("Group 1: choose one",G1,q.g1,0);
    grp("Group 2: choose one",G2,q.g2,1);
    nb.disabled=!(cur[0]&&cur[1]);
  } else if(q.type==="mcq2of5"){
    const h=document.createElement("div");h.className="grp";h.textContent="Choose the TWO that do not belong";body.appendChild(h);
    const picked=new Set((answers[q.n]||"").split(",").filter(Boolean));
    const wrap=document.createElement("div");wrap.className="opts";
    q.opts.forEach((txt,i)=>{const L=LET[i];
      const lab=document.createElement("label");
      lab.innerHTML='<span class="olab">'+L+'</span><span>'+esc(txt)+'</span>';
      if(picked.has(L))lab.classList.add("sel");
      lab.onclick=()=>{
        if(picked.has(L)){picked.delete(L);lab.classList.remove('sel');}
        else{if(picked.size>=2)return;picked.add(L);lab.classList.add('sel');}
        if(picked.size===2){const a=[...picked].sort();setAns(q.n,a.join(","));}
        else{delete answers[q.n];nb.disabled=true;}
      };
      wrap.appendChild(lab);});
    body.appendChild(wrap);
    const hint=document.createElement("div");hint.className="hint";hint.textContent="Pick exactly two.";body.appendChild(hint);
    nb.disabled=picked.size!==2;
  }
  window.scrollTo(0,0);
}
$("nextBtn").onclick=function(){if(this.disabled)return;if(idx<total-1){idx++;render();}else submit();};

function payloadQuestions(){
  return QUESTIONS.map(q=>{
    if(q.type==="mcq")return {n:q.n,stem:q.stem,options:q.opts};
    if(q.type==="mcq2of5")return {n:q.n,stem:(q.stem?q.stem+" ":"")+"[choose the two that do not belong]",options:q.opts};
    // mcq2g: bake labelled groups into the stem, no options array
    const g1=q.g1.map((w,i)=>G1[i]+") "+w).join("  ");
    const g2=q.g2.map((w,i)=>G2[i]+") "+w).join("  ");
    return {n:q.n,stem:(q.stem?q.stem+"  ":"")+"Group 1: "+g1+"   Group 2: "+g2};
  });
}
async function submit(){const btn=$("nextBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({type:"generic",test_id:TEST_ID,bankPath:BANK_PATH,title:TITLE,name:window.studentName,email:window.studentEmail,elapsedSeconds:Math.round((Date.now()-startTime)/1000),answers:answers,questions:payloadQuestions()})});
    const data=await r.json();if(data.error)throw new Error(data.error);showResult(data);
  }catch(err){btn.disabled=false;btn.textContent="Finish";alert("Submission failed: "+err.message);}}
function showResult(data){$("quiz").style.display="none";
  $("scoreLine").textContent="Complete: "+data.total+" / "+data.max+" correct";
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Section</th><th style='padding:6px 12px'>Score</th></tr>";
  (data.sections||[]).forEach(s=>rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>");
  $("secTable").innerHTML=rows;
  let html="<h3>Review</h3>";
  (data.review||[]).forEach(rv=>{const ok=rv.your===rv.correct;
    html+='<div class="ri">Question '+rv.n+': your answer <b>'+(rv.your||"-")+'</b> &middot; correct <b>'+rv.correct+'</b> <span class="'+(ok?"ok":"no")+'">'+(ok?"✓":"✗")+'</span></div>';});
  $("review").innerHTML=html;$("result").style.display="block";window.scrollTo(0,0);}
</script></div></body></html>
