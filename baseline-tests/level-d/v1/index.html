<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKS Baseline Assessment · Level D (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;--amber:#b7791f;--red:#c0392b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:600}
  .timer.warn{color:var(--amber)}
  .timer.crit{color:var(--red)}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .emo{font-size:56px;line-height:1.3;margin:0 8px;vertical-align:middle}
  .opt .emo{font-size:34px;margin:0 6px}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:Georgia,serif;resize:vertical;line-height:1.6}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .toggle{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0;cursor:pointer}
  .toggle input{margin-top:3px}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:var(--red);font-size:14px;margin-top:10px}
  .secplan{width:100%;border-collapse:collapse;margin:14px 0}
  .secplan td{border:1px solid var(--line);padding:8px 12px;font-size:14px}
  .secplan td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
  .recwrap{text-align:center;padding:18px 0}
  .recbtn{background:var(--red);color:#fff;font-weight:700;border-radius:999px;padding:14px 30px;font-size:16px}
  .recbtn.stop{background:var(--brand)}
  .recstate{font-size:14px;color:var(--muted);margin:12px 0}
  .recstate b{color:var(--red)}
  audio{width:100%;margin:10px 0}
  .fig{margin:0 0 14px;overflow-x:auto}
  .lgtitle{font-size:18px;font-weight:700;color:var(--brand);margin:0 0 10px}
  .playwrap{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
  .playbtn{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;font-size:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
  .playbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  .playinfo{font-size:14px;color:var(--muted);line-height:1.5}
  .playinfo b{color:var(--ink)}
  .lgq{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
  .lgq .stem{font-size:16px}
  .zhblk{margin:0 0 12px}
  .zhh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin:0 0 4px}
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfCt2VVoQw-6OxkAPw66IivM5BZ8pukZGzi0aOI6vAFx7wfbX8UoMNxh6cZiE_hsGNXg/exec";
const BAND = "level-d", BAND_LABEL = "Level D", VERSION = "1";
const YEAR_SPAN = "Years 9-10";
const YEARS = ["Year 9", "Year 10"];             // the two year groups this level serves
const SECTIONS = [{"name": "Verbal Reasoning", "minutes": 13}, {"name": "Non-Verbal Reasoning", "minutes": 10}, {"name": "Mathematics", "minutes": 17}, {"name": "Reading Comprehension", "minutes": 13}, {"name": "Listening", "minutes": 6}, {"name": "Writing", "minutes": 12}, {"name": "Speaking", "minutes": 4}];       // [{name, minutes, chinese?}] in test order
const QUESTIONS = [{"n": "i1", "type": "info", "section": "Verbal Reasoning", "title": "Verbal Reasoning", "body": "This section tests advanced vocabulary, word relationships, sentence completion, grammar and logical deduction. Work quickly; you have about half a minute per question."}, {"n": "1", "type": "mcq", "section": "Verbal Reasoning", "qnum": "1", "stem": "Choose the word that is closest in meaning to the word in capitals.\n\nMETICULOUS", "options": {"A": "careless", "B": "painstaking", "C": "rapid", "D": "generous"}, "fig": "", "passage": ""}, {"n": "2", "type": "mcq", "section": "Verbal Reasoning", "qnum": "2", "stem": "Choose the word that is closest in meaning to the word in capitals.\n\nAMBIGUOUS", "options": {"A": "unclear", "B": "obvious", "C": "ambitious", "D": "generous"}, "fig": "", "passage": ""}, {"n": "3", "type": "mcq", "section": "Verbal Reasoning", "qnum": "3", "stem": "Choose the word that is closest in meaning to the word in capitals.\n\nTENACIOUS", "options": {"A": "fragile", "B": "temporary", "C": "persistent", "D": "cautious"}, "fig": "", "passage": ""}, {"n": "4", "type": "mcq", "section": "Verbal Reasoning", "qnum": "4", "stem": "Choose the word that is closest in meaning to the word in capitals.\n\nBENEVOLENT", "options": {"A": "wealthy", "B": "ancient", "C": "violent", "D": "kind-hearted"}, "fig": "", "passage": ""}, {"n": "5", "type": "mcq", "section": "Verbal Reasoning", "qnum": "5", "stem": "Choose the word that is most nearly OPPOSITE in meaning to the word in capitals.\n\nFRUGAL", "options": {"A": "thrifty", "B": "extravagant", "C": "hungry", "D": "modest"}, "fig": "", "passage": ""}, {"n": "6", "type": "mcq", "section": "Verbal Reasoning", "qnum": "6", "stem": "Choose the word that is most nearly OPPOSITE in meaning to the word in capitals.\n\nPROFOUND", "options": {"A": "deep", "B": "serious", "C": "superficial", "D": "mysterious"}, "fig": "", "passage": ""}, {"n": "7", "type": "mcq", "section": "Verbal Reasoning", "qnum": "7", "stem": "Choose the word that is most nearly OPPOSITE in meaning to the word in capitals.\n\nCANDID", "options": {"A": "evasive", "B": "honest", "C": "cheerful", "D": "rude"}, "fig": "", "passage": ""}, {"n": "8", "type": "mcq", "section": "Verbal Reasoning", "qnum": "8", "stem": "Choose the word that is most nearly OPPOSITE in meaning to the word in capitals.\n\nAMPLIFY", "options": {"A": "enlarge", "B": "broadcast", "C": "repeat", "D": "diminish"}, "fig": "", "passage": ""}, {"n": "9", "type": "mcq", "section": "Verbal Reasoning", "qnum": "9", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nArchipelago is to islands as constellation is to ______.", "options": {"A": "planets", "B": "stars", "C": "telescopes", "D": "clouds"}, "fig": "", "passage": ""}, {"n": "10", "type": "mcq", "section": "Verbal Reasoning", "qnum": "10", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nScalpel is to surgeon as chisel is to ______.", "options": {"A": "sculptor", "B": "hammer", "C": "stone", "D": "hospital"}, "fig": "", "passage": ""}, {"n": "11", "type": "mcq", "section": "Verbal Reasoning", "qnum": "11", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nEphemeral is to permanent as transparent is to ______.", "options": {"A": "invisible", "B": "clear", "C": "fragile", "D": "opaque"}, "fig": "", "passage": ""}, {"n": "12", "type": "mcq", "section": "Verbal Reasoning", "qnum": "12", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nFamished is to hungry as elated is to ______.", "options": {"A": "exhausted", "B": "surprised", "C": "happy", "D": "proud"}, "fig": "", "passage": ""}, {"n": "13", "type": "mcq", "section": "Verbal Reasoning", "qnum": "13", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nDrought is to water as vacuum is to ______.", "options": {"A": "cleanliness", "B": "space", "C": "sound", "D": "matter"}, "fig": "", "passage": ""}, {"n": "14", "type": "mcq", "section": "Verbal Reasoning", "qnum": "14", "stem": "Choose the word that best completes the sentence.\n\nHer argument was so ______ that even her fiercest critics conceded the point.", "options": {"A": "persuasive", "B": "lengthy", "C": "hesitant", "D": "familiar"}, "fig": "", "passage": ""}, {"n": "15", "type": "mcq", "section": "Verbal Reasoning", "qnum": "15", "stem": "Choose the word that best completes the sentence.\n\nThe results of the experiment were ______, offering clear support to neither theory.", "options": {"A": "decisive", "B": "inconclusive", "C": "fraudulent", "D": "predictable"}, "fig": "", "passage": ""}, {"n": "16", "type": "mcq", "section": "Verbal Reasoning", "qnum": "16", "stem": "Choose the pair of words that best completes the sentence.\n\nFar from being ______, the review was so ______ that the author considered abandoning the sequel altogether.", "options": {"A": "harsh … encouraging", "B": "brief … detailed", "C": "gentle … scathing", "D": "late … punctual"}, "fig": "", "passage": ""}, {"n": "17", "type": "mcq", "section": "Verbal Reasoning", "qnum": "17", "stem": "Choose the pair of words that best completes the sentence.\n\nThe scientist remained ______ about the early results, insisting that further trials were needed before any ______ conclusions could be drawn.", "options": {"A": "ecstatic … cautious", "B": "skeptical … firm", "C": "confident … tentative", "D": "indifferent … hasty"}, "fig": "", "passage": ""}, {"n": "18", "type": "mcq", "section": "Verbal Reasoning", "qnum": "18", "stem": "Choose the pair of words that best completes the sentence.\n\nAlthough the village appeared ______ at first glance, closer inspection revealed a community ______ with quiet activity.", "options": {"A": "deserted … humming", "B": "crowded … bursting", "C": "ancient … crumbling", "D": "prosperous … thriving"}, "fig": "", "passage": ""}, {"n": "19", "type": "mcq", "section": "Verbal Reasoning", "qnum": "19", "stem": "Choose the word or phrase that best completes the sentence.\n\nNeither the students nor the teacher ______ aware of the timetable change.", "options": {"A": "were", "B": "are", "C": "was", "D": "have been"}, "fig": "", "passage": ""}, {"n": "20", "type": "mcq", "section": "Verbal Reasoning", "qnum": "20", "stem": "Choose the word or phrase that best completes the sentence.\n\n______ the rain had stopped hours earlier, the pitch remained waterlogged.", "options": {"A": "Because", "B": "Although", "C": "Unless", "D": "Whenever"}, "fig": "", "passage": ""}, {"n": "21", "type": "mcq", "section": "Verbal Reasoning", "qnum": "21", "stem": "Choose the word or phrase that best completes the sentence.\n\nIf she ______ harder last term, she would have passed the examination.", "options": {"A": "studied", "B": "studies", "C": "would study", "D": "had studied"}, "fig": "", "passage": ""}, {"n": "22", "type": "mcq", "section": "Verbal Reasoning", "qnum": "22", "stem": "Read the information carefully, then answer the question.\n\nNo reptiles are warm-blooded. All snakes are reptiles. Which statement MUST be true?", "options": {"A": "All reptiles are snakes", "B": "Some snakes are warm-blooded", "C": "No snakes are warm-blooded", "D": "All warm-blooded animals are mammals"}, "fig": "", "passage": ""}, {"n": "23", "type": "mcq", "section": "Verbal Reasoning", "qnum": "23", "stem": "Read the information carefully, then answer the question.\n\nFour classes P, Q, R and S each use the hall in a different period, 1 to 4. Q is immediately after P. R is not in period 1. S is in period 4. In which period is R?", "options": {"A": "Period 1", "B": "Period 2", "C": "Period 3", "D": "It cannot be determined"}, "fig": "", "passage": ""}, {"n": "24", "type": "mcq", "section": "Verbal Reasoning", "qnum": "24", "stem": "Read the information carefully, then answer the question.\n\nSome athletes are musicians. All musician 1c2733\">0</text><circle cx=\"156.0\" cy=\"106.0\" r=\"4\" fill=\"#1c2733\" stroke=\"#1c2733\" stroke-width=\"2\"/><text x=\"156.0\" y=\"214\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"11\" fill=\"#1c2733\">1</text><circle cx=\"256.0\" cy=\"106.0\" r=\"4\" fill=\"#1c2733\" stroke=\"#1c2733\" stroke-width=\"2\"/><text x=\"256.0\" y=\"214\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"11\" fill=\"#1c2733\">2</text><circle cx=\"356.0\" cy=\"16.0\" r=\"4\" fill=\"#1c2733\" stroke=\"#1c2733\" stroke-width=\"2\"/><text x=\"356.0\" y=\"214\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"11\" fill=\"#1c2733\">3</text><polyline points=\"56.0,196.0 156.0,106.0 256.0,106.0 356.0,16.0\" fill=\"none\" stroke=\"#14213A\" stroke-width=\"2.2\"/><text x=\"8\" y=\"214\" text-anchor=\"start\" font-family=\"Arial\" font-size=\"11\" fill=\"#5b6b7a\">km</text></svg>", "passage": ""}, {"n": "i4", "type": "info", "section": "Reading Comprehension", "title": "Reading Comprehension", "body": "Read each passage carefully, then answer the questions. The passage is shown with every question, so you can always re-read it."}, {"n": "61", "type": "mcq", "section": "Reading Comprehension", "qnum": "1", "stem": "What does the “blue dot” in the opening line represent?", "options": {"A": "The grandfather's drawing style", "B": "GPS navigation on a smartphone", "C": "A landmark on the harbour", "D": "The narrator's school badge"}, "fig": "", "passage": "<strong>The Map Collector</strong><br><br>My grandfather never trusted the blue dot. Long after everyone else had surrendered their sense of direction to a glowing screen, he continued to draw his own maps: bus routes inked in red, noodle shops marked with tiny stars, the steep ladder streets of Sheung Wan rendered in careful cross-hatching. His desk drawer held forty years of Hong Kong, folded into squares.<br><br>As a child I found the habit charming. As a teenager, I found it faintly embarrassing. “The phone knows where everything is,” I told him once, waving my screen at him like a winning card. He looked at it politely, the way you might look at a stranger's holiday photos. “The phone knows,” he agreed. “You don't.”<br><br>I understood him, finally, the summer he was ill. Sent to collect his medicine, I plotted the fastest route and followed my dot faithfully through streets I had walked a hundred times and could not have described to save my life. Waiting at the dispensary, I realised I did not know the name of a single shop I had passed. I had travelled like a parcel: delivered, but absent.<br><br>That evening I asked him to show me the drawer. He spread the maps across his bed like a dealer fanning cards, and talked for two hours: about the pier that became a highway, the theatre that became a bank, the alley where he had first held my grandmother's hand in the rain. None of it was on my phone. The city the phone showed me was accurate, up to date, and utterly without memory.<br><br>He is gone now, and the maps are mine. I have started adding to them, badly, in pencil: my school, my own noodle shop, the corner where my friends wait on Saturday mornings. My hand is clumsy and my stars are lopsided, but I am learning what he knew all along: that a place is not truly yours until you have paid it the compliment of attention."}, {"n": "62", "type": "mcq", "section": "Reading Comprehension", "qnum": "2", "stem": "“You don't.” What point is the grandfather making with these two words?", "options": {"A": "The narrator is too young to travel alone", "B": "The phone's maps contain mistakes", "C": "Relying on the phone means the narrator has no knowledge of their own", "D": "He refuses to learn how to use new technology"}, "fig": "", "passage": "<strong>The Map Collector</strong><br><br>My grandfather never trusted the blue dot. Long after everyone else had surrendered their sense of direction to a glowing screen, he continued to draw his own maps: bus routes inked in red, noodle g what he knew all along: that a place is not truly yours until you have paid it the compliment of attention."}, {"n": "65", "type": "mcq", "section": "Reading Comprehension", "qnum": "5", "stem": "Why does the narrator describe their own additions to the maps as “badly, in pencil”?", "options": {"A": "To show they regret inheriting the maps", "B": "To show they are a humble beginner continuing the tradition", "C": "To show pencil is better than ink for maps", "D": "To show the maps are no longer useful"}, "fig": "", "passage": "<strong>The Map Collector</strong><br><br>My grandfather never trusted the blue dot. Long after everyone else had surrendered their sense of direction to a glowing screen, he continued to draw his own maps: bus routes inked in red, noodle shops marked with tiny stars, the steep ladder streets of Sheung Wan rendered in careful cross-hatching. His desk drawer held forty years of Hong Kong, folded into squares.<br><br>As a child I found the habit charming. As a teenager, I found it faintly embarrassing. “The phone knows where everything is,” I told him once, waving my screen at him like a winning card. He looked at it politely, the way you might look at a stranger's holiday photos. “The phone knows,” he agreed. “You don't.”<br><br>I understood him, finally, the summer he was ill. Sent to collect his medicine, I plotted the fastest route and followed my dot faithfully through streets I had walked a hundred times and could not have described to save my life. Waiting at the dispensary, I realised I did not know the name of a single shop I had passed. I had travelled like a parcel: delivered, but absent.<br><br>That evening I asked him to show me the drawer. He spread the maps across his bed like a dealer fanning cards, and talked for two hours: about the pier that became a highway, the theatre that became a bank, the alley where he had first held my grandmother's hand in the rain. None of it was on my phone. The city the phone showed me was accurate, up to date, and utterly without memory.<br><br>He is gone now, and the maps are mine. I have started adding to them, badly, in pencil: my school, my own noodle shop, the corner where my friends wait on Saturday mornings. My hand is clumsy and my stars are lopsided, but I am learning what he knew all along: that a place is not truly yours until you have paid it the compliment of attention."}, {"n": "66", "type": "mcq", "section": "Reading Comprehension", "qnum": "6", "stem": "Which statement best expresses the passage's central idea?", "options": {"A": "Technology should be banned for young people", "B": "Old maps are more accurate than digital ones", "C": "Truly knowing a place requires paying it real attention", "D": "Grandparents and grandchildren rarely understand each other"}, "fig": "", "passage": "<strong>The Map Collector</strong><br><br>My grandfather never trusted the blue dot. Long after everyone else had surrendered their sense of direction to a glowing screen, he continued to draw his own maps: bus routes inked in red, noodle shops marked with tiny stars, the steep ladder streets of Sheung Wan rendered in careful cross-hatching. His desk drawer held forty years of Hong Kong, folded into squares.<br><br>As a child I found the habit charming. As a teenager, I found it faintly embarrassing. “The phone knows where everything is,” I told him once, waving my screen at him like a winning card. He looked at it politely, the way you might look at a stranger's holiday photos. “The phone knows,” he agreed. “You don't.”<br><br>I understood him, finally, the summer he was ill. Sent to collect his medicine, I plotted the fastest route and followed my dot faithfully through streets I had walked a hundred times and could not have described to save my life. Waiting at the dispensary, I realised I did not know the name of a single shop I had passed. I had travelled like a parcel: delivered, but absent.<br><br>That evening I asked him to show me the drawer. He spread the maps across his bed like a dealer fanning cards, and talked for two hours: about the pier that became a highway, the theatre that became a bank, the alley where he had first held my grandmother's hand in the rain. None of it was on my phone. The city the phone showed me was accurate, up to date, and utterly without memory.<br><br>He is gone now, and the maps are mine. I have started adding to them, badly, in pencil: my school, my own noodle shop, the corner where my friends wait on Saturday mornings. My hand is clumsy and my stars are lopsided, but I am learning what he knew all along: that a place is not truly yours until you have paid it the compliment of attention."}, {"n": "67", "type": "mcq", "section": "Reading Comprehension", "qnum": "7", "stem": "What is the writer's main argument?", "options": {"A": "Boredom is valuable and worth deliberately protecting", "B": "Smartphones should be banned in schools", "C": "Teenagers today are lazier than previous generations", "D": "Entertainment is harmful to creativity"}, "fig": "", "passage": "<strong>In Praise of Boredom</strong><br><br>It has never been easier to avoid boredom. The moment a queue lengthens or a lesson drags, a universe of entertainment sits one thumb-swipe away. In an average day, many teenagers do not experience a single unfilled minute between waking and sleeping. This might sound like progress. A growing number of psychologists suspect it is quietly costing us something valuable.<br><br>Boredom, they argue, is not an absence but a signal: the mind announcing that it is under-occupied and ready to wander. And wandering minds do remarkable work. In studies where volunteers were given deliberately dull tasks, such as copying numbers from a telephone directory, they later produced markedly more creative ideas than volunteers who had been kept busy. The bored brain, starved of stimulation, begins to generate its own: daydreams, connections, plans, questions. Many writers and scientists have described their best ideas arriving not at the desk but in the shower, on a long walk, or staring out of a bus window: precisely the empty moments a smartphone now colonises.<br><br>None of this means screens are villains. The problem is not that entertainment exists, but that it has become the automatic response to the first flicker of restlessness, so the mind never reaches the productive stage of boredom at all. It is rescued too soon, like a muscle never allowed to tire and therefore never allowed to grow.<br><br>The remedy proposed is modest: not a digital detox or a return to some imagined simpler age, but the deliberate protection of small pockets of emptiness. A journey without headphones. A queue without a phone. Ten minutes on the sofa with nothing at all. In an economy that competes ferociously for every spare second of our attention, choosing occasionally to be bored may be less a failure of imagination than an act of quiet rebellion, and one of the cheapest investments a student can make in their own mind."}, {"n": "68", "type": "mcq", "section": "Reading Comprehension", "qnum": "8", "stem": "The writer includes the telephone-directory study in order to:", "options": {"A": "show how boring life was before smartphones", "B": "prove that copying tasks improve handwriting", "C": "criticise psychologists' research methods", "D": "provide research evidence that boredom boosts creative thinking"}, "fig": "", "passage": "<strong>In Praise of Boredom</strong><br><br>It has never been easier to avoid boredom. The moment a queue lengthens or a lesson drags, a universe of entertainment sits one thumb-swipe away. In an average day, many teenagers do not experience a single unfilled minute between waking and sleeping. This might sound like progress. A growing number of psychologists suspect it is quietly costing us something valuable.<br><br>Boredom, they argue, is not an absence but a signal: the mind announcing that it is under-occupied and ready to wander. And wandering minds do remarkable work. In studies where volunteers were given deliberately dull tasks, such as copying numbers from a telephone directory, they later produced markedly more creative ideas than volunteers who had been kept busy. The bored brain, starved of stimulation, begins to generate its own: daydreams, connections, plans, questions. Many writers and scientists have described their best ideas arriving not at the desk but in the shower, on a long walk, or staring out of a bus window: precisely the empty moments a smartphone now colonises.<br><br>None of this means screens are villains. The problem is not that entertainment exists, but that it has become the automatic response to the first flicker of restlessness, so the mind never reaches the productive stage of boredom at all. It is rescued too soon, like a muscle never allowed to tire and therefore never allowed to grow.<br><br>The remedy proposed is modest: not a digital detox or a return to some imagined simpler age, but the deliberate protection of small pockets of emptiness. A journey without headphones. A queue without a phone. Ten minutes on the sofa with nothing at all. In an economy that competes ferociously for every spare second of our attention, choosing occasionally to be bored may be less a failure of imagination than an act of quiet rebellion, and one of the cheapest investments a student can make in their own mind."}, {"n": "69", "type": "mcq", "section": "Reading Comprehension", "qnum": "9", "stem": "In paragraph 2, “colonises” suggests that the smartphone:", "options": {"A": "politely shares the empty moments", "B": "makes the empty moments more enjoyable", "C": "takes over territory that once belonged to daydreaming", "D": "creates new empty moments"}, "fig": "", "passage": "<strong>In Praise of Boredom</strong><br><br>It has never been easier to avoid boredom. The moment a queue lengthens or a lesson drags, a universe of entertainment sits one thumb-swipe away. In an average day, many teena const STORE_KEY = "hksbl-level-d-v1";
const RECORD_MAX_S = 120;

let idx = -1;                  // -1 = start screen; index into FLOW
let FLOW = [];                 // active questions (Chinese removed unless opted in)
let secStarts = {};            // section name -> first FLOW index
let answers = {};              // n -> letter
let texts = {};                // n -> string
let student = {name:"",email:"",school:"",dob:"",year:""};

/* UK/HK-international year group from DOB: age on 1 September of the current
   school year, minus 4 (Year 1 = age 5-6, September cut-off). */
function yearFromDob(dobStr){
  const d=new Date(dobStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const now=new Date();
  const sy = now.getMonth()>=8 ? now.getFullYear() : now.getFullYear()-1;
  let age = sy - d.getFullYear();
  if(d.getMonth()>8 || (d.getMonth()===8 && d.getDate()>1)) age--;   // birthday after 1 Sep
  const yr = age - 4;
  return (yr>=1 && yr<=13) ? yr : null;
}
let startTs = null;
let secEnd = null;             // epoch ms deadline of the CURRENT section
let curSec = null;             // current section name
let recs = {};                 // question n -> {b64, mime, secs, left}
let submitted = false;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(s/60),ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function secConf(name){ for(const s of SECTIONS){ if(s.name===name) return s; } return null; }
function activeSections(){ return SECTIONS; }

function buildFlow(){
  const names = activeSections().map(s=>s.name);
  FLOW = QUESTIONS.filter(q=>names.indexOf(q.section)>=0);
  secStarts = {};
  FLOW.forEach((q,i)=>{ if(!(q.section in secStarts)) secStarts[q.section]=i; });
}
function sectionOf(i){ return FLOW[i] ? FLOW[i].section : null; }
function nextSectionStart(i){
  const cur = sectionOf(i);
  for(let j=i+1;j<FLOW.length;j++){ if(FLOW[j].section!==cur) return j; }
  return -1;
}

/* ---------- persistence (refresh cannot reset the clock) ---------- */
function persist(){
  if(submitted) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({
    student, idx, secEnd, curSec, answers, texts, startTs
  })); }catch(e){}
}
function restore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !s.startTs || s.idx==null || s.idx<0) return false;
    student=s.student||student; idx=s.idx;
    secEnd=s.secEnd; curSec=s.curSec; answers=s.answers||{}; texts=s.texts||{};
    startTs=s.startTs;
    buildFlow();
    // deadline passed while the tab was closed: advance until inside a live section
    while(secEnd!=null && Date.now()>secEnd){
      const nx=nextSectionStart(idx);
      if(nx<0){ submit(true); return true; }
      idx=nx; enterSection(sectionOf(idx));
    }
    return true;
  }catch(e){ return false; }
}
function clearStore(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

/* ---------- timer ---------- */
function enterSection(name){
  const c=secConf(name);
  curSec=name;
  secEnd=Date.now()+(c?c.minutes:5)*60000;
  persist();
}
function tick(){
  if(idx<0||submitted||secEnd==null){ timerEl.textContent=''; return; }
  const rem=secEnd-Date.now();
  timerEl.textContent=(curSec?curSec+' · ':'')+fmtTime(rem);
  timerEl.className='timer'+(rem<30000?' crit':(rem<120000?' warn':''));
  if(rem<=0) advanceSection(true);
}
setInterval(tick,500);

function stopAllAudio(){
  Object.values(players).forEach(st=>{ if(st.el){ try{st.el.pause();}catch(e){} st.el=null; } st.playing=false; });
}
function advanceSection(timedOut){
  stopRecorderIfRunning(); stopAllAudio();
  const q=FLOW[idx]; if(q) saveText(q);
  const nx=nextSectionStart(idx);
  if(nx<0){ submit(true); return; }
  idx=nx;
  enterSection(sectionOf(idx));
  render();
}

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/FLOW.length)*100); prog.style.width=pct+'%'; }

/* ---------- start gate ---------- */
function planRows(){
  return activeSections().map(s=>`<tr><td>${esc(s.name)}</td><td>${s.minutes} min</td></tr>`).join('');
}
function renderStart(){
  setProg();
  const total = activeSections().reduce((a,s)=>a+s.minutes,0);
  card.innerHTML = `
    <h1>HKS Baseline Assessment · Level D (V1)</h1>
    <p class="info-body">This assessment is <b>timed</b>. Each section has its own time limit and moves on automatically when time is up. You can go back to questions <b>within</b> the current section, but you cannot return to a finished section. Some sections ask you to <b>listen to recordings</b> or to <b>record your voice</b>, so please use a device with a speaker and a microphone.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="field"><label>Current school <span style="color:#c0392b">*</span></label><input id="sch" placeholder="e.g. St Joseph's Primary School" value="${esc(student.school||'')}"></div>
    <div class="field"><label>Student's date of birth <span style="color:#c0392b">*</span></label>
      <input id="dob" type="date" min="2005-01-01" max="2023-12-31" value="${esc(student.dob||'')}"></div>
    <div class="field"><label>Current year / grade level <span style="color:#c0392b">*</span></label>
      <input id="yr" placeholder="e.g. Year 5, Grade 4 or P5" value="${esc(student.year||'')}">
      <div class="hint">${BAND_LABEL} is designed for students currently in ${YEAR_SPAN}.</div></div>
    <table class="secplan" id="plan">${planRows()}</table>
    <p class="info-body" style="color:var(--muted);font-size:13px">Total: <b id="tot">${total}</b> minutes. The timer starts as soon as you press Begin.</p>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  const dobEl=document.getElementById('dob');
  const yrEl=document.getElementById('yr');
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    student.school=(document.getElementById('sch').value||'').trim();
    student.dob=(dobEl.value||'').trim();
    student.year=(yrEl.value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    if(!student.school){ err.textContent="Please enter the student's current school."; document.getElementById('sch').focus(); return; }
    if(!student.dob){
      err.textContent="Please enter the student's date of birth."; dobEl.focus(); return;
    }
    if(!student.year){ err.textContent='Please enter the current year / grade level.'; yrEl.focus(); return; }
    buildFlow();
    startTs=Date.now(); idx=0;
    enterSection(sectionOf(0));
    render();
  };
}

/* ---------- question rendering ---------- */
function render(){
  if(idx<0){ renderStart(); return; }
  if(submitted) return;
  setProg();
  const q=FLOW[idx];
  let body='';
  const secLabel = q.section? `<span class="sec">${esc(q.section)}</span>`:'<span></span>';
  if(q.type==='info'){
    const c=secConf(q.section);
    body=`<div class="sec">Section · ${c?c.minutes+' minutes':''}</div><h1>${esc(q.title)}</h1><div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`<div class="qhead">${secLabel}</div>`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.body?`<div class="wbody">${esc(q.body)}</div>`:'')
      + `<textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else if(q.type==='speaking'){
    body=renderSpeaking(q);
  } else if(q.type==='lgroup'){
    const subs = q.items.map(it=>{
      const opts = Object.keys(it.options).map(k=>{
        const seld = answers[it.n]===k?' sel':'';
        return `<div class="opt${seld}" data-n="${it.n}" data-k="${k}"><span class="l">${k}</span>${esc(it.options[k])}</div>`;
      }).join('');
      return `<div class="lgq"><div class="qhead"><span></span><span class="qnum">Question ${it.qnum}</span></div>
        <div class="stem">${esc(it.stem)}</div>${opts}</div>`;
    }).join('');
    body=`<div class="qhead"><span class="sec">${esc(q.section)}</span></div>
      <div class="lgtitle">${esc(q.title||'Listening')}</div>
      ${playerHtml(q.audio)}
      ${subs}`;
  } else { // mcq
    const audio = q.audio? playerHtml(q.audio):'';
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const head = `<div class="qhead">${secLabel}${q.qnum?`<span class="qnum">Question ${q.qnum}</span>`:''}</div>`;
    body=`${head}${audio}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div class="fig">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===FLOW.length-1;
  const secFirst = secStarts[q.section];
  const lastInSec = (nextSectionStart(idx)===idx+1) || isLast;
  const nextLabel = isLast?'Finish &amp; submit':(lastInSec?'Finish section':'Next');
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx<=secFirst?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${nextLabel}</button>
    </div>`;
  if(q.type==='mcq'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      persist();
    });
  }
  if(q.type==='lgroup'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      const n=el.dataset.n;
      answers[n]=el.dataset.k;
      el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      persist();
    });
    wirePlayer(q.audio);
  }
  if(q.type==='mcq' && q.audio) wirePlayer(q.audio);
  if(q.type==='speaking') wireSpeaking(q);
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{
    saveText(q);
    if(isLast){ submit(false); }
    else if(lastInSec){ advanceSection(false); }
    else { idx++; render(); }
  };
  persist();
}
function saveText(q){ if(q.type==='writing'){ const t=document.getElementById('ta'); if(t) texts[q.n]=t.value; persist(); } }

/* ---------- limited listening player (big play/pause, 2 plays, no seeking) ---------- */
const players = {};   // audio file -> {el, playsLeft, playing}
function playerState(src){ if(!players[src]) players[src]={el:null, playsLeft:2, playing:false}; return players[src]; }
function playerHtml(src){
  const st=playerState(src);
  return `<div class="playwrap">
    <button class="playbtn" id="playBtn" ${st.playsLeft<=0&&!st.playing?'disabled':''}>${st.playing?'&#10074;&#10074;':'&#9654;'}</button>
    <div class="playinfo"><b>${st.playing?'Playing…':'Press play and listen carefully.'}</b><br>
      <span id="playsLeft">${st.playsLeft>0?`You can play this recording ${st.playsLeft} more time${st.playsLeft===1?'':'s'}.`:'No plays left.'}</span></div>
  </div>`;
}
function wirePlayer(src){
  const btn=document.getElementById('playBtn');
  if(!btn) return;
  const st=playerState(src);
  btn.onclick=()=>{
    if(st.playing){ if(st.el) st.el.pause(); st.playing=false; render(); return; }
    if(!st.el || st.el.ended || st.el.currentTime===0){
      if(st.playsLeft<=0) return;
      st.playsLeft--;
      st.el=new Audio(src);
      st.el.onended=()=>{ st.playing=false; st.el=null; if(FLOW[idx]&&(FLOW[idx].audio===src)) render(); };
    }
    st.el.play();
    st.playing=true;
    render();
  };
}

let mediaStream=null, recorder=null, chunks=[], recTimer=null, recStart=0, recN=null;
function recOf(n){ if(!recs[n]) recs[n]={b64:"",mime:"",secs:0,left:1}; return recs[n]; }
function renderSpeaking(q){
  const r=recOf(q.n);
  const maxS=q.maxSeconds||RECORD_MAX_S;
  return `<div class="qhead"><span class="sec">${esc(q.section)}</span></div>
    <div class="stem">${esc(q.stem)}</div>
    ${q.body?`<div class="wbody">${esc(q.body)}</div>`:''}
    <div class="recwrap" id="recwrap">
      ${r.b64
        ? `<div class="recstate ok" style="color:#1e7a46;font-weight:700">✓ Recording saved (${r.secs}s)</div>
           <audio controls src="${r.b64}"></audio>
           ${r.left>0?`<button class="prev" id="reRecBtn">Record again (${r.left} left)</button>`:''}`
        : `<button class="recbtn" id="recBtn">● Start recording</button>
           <div class="recstate" id="recState">Press the button and speak clearly. Up to ${maxS} seconds.</div>`}
      <div class="err" id="recErr"></div>
    </div>
    <p class="hint">If your microphone is blocked or unavailable, you can continue; your tutor will arrange this part separately.</p>`;
}
function wireSpeaking(q){
  const r=recOf(q.n);
  const maxS=q.maxSeconds||RECORD_MAX_S;
  const btn=document.getElementById('recBtn');
  const reBtn=document.getElementById('reRecBtn');
  if(reBtn) reBtn.onclick=()=>{ r.left--; r.b64=''; r.mime=''; r.secs=0; render(); };
  if(!btn) return;
  btn.onclick=async()=>{
    if(recorder && recorder.state==='recording'){ stopRecorderIfRunning(); return; }
    const errEl=document.getElementById('recErr');
    try{
      mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){ errEl.textContent='Microphone unavailable ('+(e.name||'error')+'). You can continue to the next step.'; return; }
    chunks=[]; recN=q.n;
    const mime = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus'
               : (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : '';
    try{ recorder = mime? new MediaRecorder(mediaStream,{mimeType:mime}) : new MediaRecorder(mediaStream); }
    catch(e){ errEl.textContent='Recording is not supported in this browser. You can continue.'; return; }
    recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      const rr=recOf(recN);
      rr.mime=blob.type; rr.secs=Math.round((Date.now()-recStart)/1000);
      const fr=new FileReader();
      fr.onload=()=>{ rr.b64=String(fr.result||''); render(); };
      fr.readAsDataURL(blob);
      if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
    };
    recStart=Date.now();
    recorder.start();
    btn.textContent='■ Stop recording'; btn.classList.add('stop');
    const st=document.getElementById('recState');
    recTimer=setInterval(()=>{
      const sElapsed=Math.round((Date.now()-recStart)/1000);
      if(st) st.innerHTML='<b>● Recording…</b> '+sElapsed+'s / '+maxS+'s';
      if(sElapsed>=maxS) stopRecorderIfRunning();
    },250);
  };
}
function stopRecorderIfRunning(){
  if(recTimer){ clearInterval(recTimer); recTimer=null; }
  if(recorder && recorder.state==='recording'){ try{ recorder.stop(); }catch(e){} }
  else if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
}

/* ---------- figures to PNG for the review PDF ---------- */
function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<FLOW.length;i++){ var q=FLOW[i];
  if(!q.fig) continue;
  var m=q.fig.match(/src="(data:image\/[^"]+)"/);          // engine PNGs pass straight through
  if(m){ figs[q.n]=m[1]; continue; }
  if(/<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

/* ---------- submit (awaited, with retry) ---------- */
async function submit(auto){
  if(submitted) return;
  submitted=true; secEnd=null; stopRecorderIfRunning();
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">${auto?'Time is up, submitting':'Submitting'} your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = [];
  FLOW.forEach(function(q){
    if(q.type==='lgroup'){
      q.items.forEach(function(it){ qslim.push({n:it.n,type:'mcq',section:q.section,stem:it.stem,options:it.options,qnum:it.qnum}); });
    } else {
      qslim.push({n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,intro:q.intro,body:(q.type==='writing'||q.type==='speaking')?q.body:undefined});
    }
  });
  const audios = FLOW.filter(q=>q.type==='speaking').map(q=>{
    const r=recs[q.n]||{};
    return {n:q.n, section:q.section, b64:r.b64||'', mime:r.mime||'', seconds:r.secs||0};
  });
  const payload={ type:"baseline", band:BAND, bandLabel:BAND_LABEL, version:VERSION,
    name:student.name, email:student.email, school:student.school,
    dob:student.dob, dobYear:(yearFromDob(student.dob)!=null?'Year '+yearFromDob(student.dob):''),
    yearGroup:student.year,
    allowedMinutes: activeSections().reduce((a,s)=>a+s.minutes,0),
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0,
    answers, texts, questions:qslim, figs, audios };
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    await res.text();
    clearStore();
    card.innerHTML = `<div class="center">
      <div class="big ok">✓</div>
      <h1>Submitted</h1>
      <p class="info-body">Thank you, ${esc(student.name)}. Your responses${audios.some(a=>a.b64)?' and recordings':''} have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
    </div>`;
    prog.style.width='100%';
  }catch(e){
    card.innerHTML = `<div class="center">
      <div class="big" style="color:var(--red)">!</div>
      <h1>Submission failed</h1>
      <p class="info-body">Your answers are safe on this page. Please check your internet connection, then press Retry.</p>
      <div class="nav" style="justify-content:center"><button class="submit" id="retryBtn">Retry submission</button></div>
    </div>`;
    document.getElementById('retryBtn').onclick=()=>{ submitted=false; submit(auto); };
  }
}

/* ---------- boot: explicit resume screen ---------- */
buildFlow();
if(restore() && !submitted && idx>=0){
  card.innerHTML = `<div class="center">
    <h1>Welcome back${student.name?', '+esc(student.name):''}</h1>
    <p class="info-body">You have a test in progress on this device. The section timer continued while you were away.</p>
    <div class="nav" style="justify-content:center;gap:14px">
      <button class="prev" id="restartBtn">Start again</button>
      <button class="submit" id="resumeBtn">Continue my test</button>
    </div></div>`;
  document.getElementById('resumeBtn').onclick=()=>{ render(); };
  document.getElementById('restartBtn').onclick=()=>{
    clearStore();
    idx=-1; secEnd=null; curSec=null; startTs=null;
    for(const k in answers) delete answers[k];
    for(const k in texts) delete texts[k];
    render();
  };
} else { render(); }
</script>
