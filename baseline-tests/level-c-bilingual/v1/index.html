<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKS Baseline Assessment · Level C Bilingual (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;--amber:#b7791f;--red:#c0392b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:600}
  .timer.warn{color:var(--amber)}
  .timer.crit{color:var(--red)}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .emo{font-size:56px;line-height:1.3;margin:0 8px;vertical-align:middle}
  .opt .emo{font-size:34px;margin:0 6px}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:Georgia,serif;resize:vertical;line-height:1.6}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .toggle{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0;cursor:pointer}
  .toggle input{margin-top:3px}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:var(--red);font-size:14px;margin-top:10px}
  .secplan{width:100%;border-collapse:collapse;margin:14px 0}
  .secplan td{border:1px solid var(--line);padding:8px 12px;font-size:14px}
  .secplan td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
  .recwrap{text-align:center;padding:18px 0}
  .recbtn{background:var(--red);color:#fff;font-weight:700;border-radius:999px;padding:14px 30px;font-size:16px}
  .recbtn.stop{background:var(--brand)}
  .recstate{font-size:14px;color:var(--muted);margin:12px 0}
  .recstate b{color:var(--red)}
  audio{width:100%;margin:10px 0}
  .fig{margin:0 0 14px;overflow-x:auto}
  .lgtitle{font-size:18px;font-weight:700;color:var(--brand);margin:0 0 10px}
  .playwrap{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
  .playbtn{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;font-size:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
  .playbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  .playinfo{font-size:14px;color:var(--muted);line-height:1.5}
  .playinfo b{color:var(--ink)}
  .lgq{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
  .lgq .stem{font-size:16px}
  .zhblk{margin:0 0 12px}
  .zhh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin:0 0 4px}
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfCt2VVoQw-6OxkAPw66IivM5BZ8pukZGzi0aOI6vAFx7wfbX8UoMNxh6cZiE_hsGNXg/exec";
const BAND = "level-c-bilingual", BAND_LABEL = "Level C Bilingual", VERSION = "1";
const YEAR_SPAN = "Years 7-8";
const YEARS = ["Year 7", "Year 8"];             // the two year groups this level serves
const SECTIONS = [{"name": "Verbal Reasoning", "minutes": 10}, {"name": "Non-Verbal Reasoning", "minutes": 8}, {"name": "Mathematics", "minutes": 15}, {"name": "Reading Comprehension", "minutes": 10}, {"name": "Listening", "minutes": 6}, {"name": "Writing", "minutes": 7}, {"name": "Speaking", "minutes": 4}, {"name": "中文閱讀 Chinese Reading", "minutes": 8}, {"name": "中文聆聽 Chinese Listening", "minutes": 4}, {"name": "中文口語 Chinese Speaking", "minutes": 3}];       // [{name, minutes, chinese?}] in test order
const QUESTIONS = [{"n": "i1", "type": "info", "section": "Verbal Reasoning", "title": "Verbal Reasoning", "body": "This section tests vocabulary, word relationships, sentence completion, grammar and verbal logic. Work quickly; you have about half a minute per question."}, {"n": "1", "type": "mcq", "section": "Verbal Reasoning", "qnum": "1", "stem": "Choose the word that is closest in meaning to the word in capitals.\n\nHASTY", "options": {"A": "careful", "B": "hurried", "C": "clumsy", "D": "brave"}, "fig": "", "passage": ""}, {"n": "2", "type": "mcq", "section": "Verbal Reasoning", "qnum": "2", "stem": "Choose the word that is closest in meaning to the word in capitals.\n\nVIGILANT", "options": {"A": "sleepy", "B": "violent", "C": "brave", "D": "watchful"}, "fig": "", "passage": ""}, {"n": "3", "type": "mcq", "section": "Verbal Reasoning", "qnum": "3", "stem": "Choose the word that is closest in meaning to the word in capitals.\n\nVIVID", "options": {"A": "dull", "B": "faint", "C": "striking", "D": "ordinary"}, "fig": "", "passage": ""}, {"n": "4", "type": "mcq", "section": "Verbal Reasoning", "qnum": "4", "stem": "Choose the word that is most nearly OPPOSITE in meaning to the word in capitals.\n\nTIMID", "options": {"A": "bold", "B": "shy", "C": "quiet", "D": "small"}, "fig": "", "passage": ""}, {"n": "5", "type": "mcq", "section": "Verbal Reasoning", "qnum": "5", "stem": "Choose the word that is most nearly OPPOSITE in meaning to the word in capitals.\n\nTRANSPARENT", "options": {"A": "clear", "B": "shiny", "C": "opaque", "D": "fragile"}, "fig": "", "passage": ""}, {"n": "6", "type": "mcq", "section": "Verbal Reasoning", "qnum": "6", "stem": "Choose the word that is most nearly OPPOSITE in meaning to the word in capitals.\n\nHOSTILE", "options": {"A": "fierce", "B": "friendly", "C": "angry", "D": "distant"}, "fig": "", "passage": ""}, {"n": "7", "type": "mcq", "section": "Verbal Reasoning", "qnum": "7", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nDrought is to rain as famine is to ______.", "options": {"A": "water", "B": "crops", "C": "hunger", "D": "food"}, "fig": "", "passage": ""}, {"n": "8", "type": "mcq", "section": "Verbal Reasoning", "qnum": "8", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nSculptor is to statue as playwright is to ______.", "options": {"A": "play", "B": "theatre", "C": "actor", "D": "poem"}, "fig": "", "passage": ""}, {"n": "9", "type": "mcq", "section": "Verbal Reasoning", "qnum": "9", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nReluctant is to eager as scarce is to ______.", "options": {"A": "rare", "B": "empty", "C": "abundant", "D": "tiny"}, "fig": "", "passage": ""}, {"n": "10", "type": "mcq", "section": "Verbal Reasoning", "qnum": "10", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nGill is to fish as lung is to ______.", "options": {"A": "mammal", "B": "air", "C": "water", "D": "heart"}, "fig": "", "passage": ""}, {"n": "11", "type": "mcq", "section": "Verbal Reasoning", "qnum": "11", "stem": "Choose the word that best completes the sentence.\n\nDespite hours of rehearsal, the actor still felt ______ about performing in front of such a large audience.", "options": {"A": "confident", "B": "apprehensive", "C": "indifferent", "D": "prepared"}, "fig": "", "passage": ""}, {"n": "12", "type": "mcq", "section": "Verbal Reasoning", "qnum": "12", "stem": "Choose the word that best completes the sentence.\n\nThe judge's decision was completely ______: she favoured neither one side nor the other.", "options": {"A": "harsh", "B": "sudden", "C": "popular", "D": "impartial"}, "fig": "", "passage": ""}, {"n": "13", "type": "mcq", "section": "Verbal Reasoning", "qnum": "13", "stem": "Choose the pair of words that best completes the sentence.\n\nThe hikers were ______ by the sudden fog, and their ______ only grew when the path disappeared entirely.", "options": {"A": "reassured … calm", "B": "bewildered … anxiety", "C": "delighted … joy", "D": "exhausted … strength"}, "fig": "", "passage": ""}, {"n": "14", "type": "mcq", "section": "Verbal Reasoning", "qnum": "14", "stem": "Choose the pair of words that best completes the sentence.\n\nAlthough the essay was ______, the teacher praised its ______ argument.", "options": {"A": "brief … persuasive", "B": "lengthy … rambling", "C": "polished … weak", "D": "careless … sloppy"}, "fig": "", "passage": ""}, {"n": "15", "type": "mcq", "section": "Verbal Reasoning", "qnum": "15", "stem": "Choose the word or phrase that best completes the sentence.\n\nBy the time we arrived at the stadium, the match ______.", "options": {"A": "had already started", "B": "has already started", "C": "already starts", "D": "will already start"}, "fig": "", "passage": ""}, {"n": "16", "type": "mcq", "section": "Verbal Reasoning", "qnum": "16", "stem": "Choose the word or phrase that best completes the sentence.\n\nThe number of visitors to the museum ______ growing every year.", "options": {"A": "are", "B": "is", "C": "were", "D": "be"}, "fig": "", "passage": ""}, {"n": "17", "type": "mcq", "section": "Verbal Reasoning", "qnum": "17", "stem": "Choose the word or phrase that best completes the sentence.\n\nThe service at the restaurant was slow; ______, the food was disappointing.", "options": {"A": "however", "B": "instead", "C": "moreover", "D": "otherwise"}, "fig": "", "passage": ""}, {"n": "18", "type": "mcq", "section": "Verbal Reasoning", "qnum": "18", "stem": "Choose the word or phrase that best completes the sentence.\n\nShe spoke so ______ that everyone in the hall could hear her.", "options": {"A": "clear", "B": "clearest", "C": "clearly", "D": "clearness"}, "fig": "", "passage": ""}, {"n": "19", "type": "mcq", "section": "Verbal Reasoning", "qnum": "19", "stem": "Read the information carefully, then answer the question.\n\nAll members of the chess club are students. Some members of the chess club wear glasses. Which statement MUST be true?", "options": {"A": "All students play chess", "B": "All chess club members wear glasses", "C": "No teachers wear glasses", "D": "Some students wear glasses"}, "fig": "", "passage": ""}, {"n": "20", "type": "mcq", "section": "Verbal Reasoning", "qnum": "20", "stem": "Read the information carefully, then answer the question.\n\nFive runners finish a race. Kim finishes before Lee but after Maya. Noah finishes last. Oscar finishes before Maya. Who finishes SECOND?", "options": {"A": "Kim", "B": "Oscar", "C": "Lee", "D": "Maya"}, "fig": "", "passage": ""}, {"n": "i2", "type": "info", "section": "Non-Verbal Reasoning", "title": "Non-Verbal Reasoning", "body": "This section uses figures. In classification questions, three figures share a rule: choose the answer figure that follows the same rule. In matrix questions, work out how the figures change across the grid and choose the one that completes it. About half a minute per question."}, {"n": "21", "type": "mcq", "section": "Non-Verbal Reasoning", "qnum": "1", "stem": "Choose the answer which shares the same connection/characteristic as the three given images.", "options": {"A": "", "B": "", "C": "", "D": "", "E": ""}, "fig": "<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAB1wAAAF4CAIAAAB//BwYAAAABmJLR0QA/wD/AP+gvaeTAAAgAElEQVR4nOzdd2Ac9Z3//5nZ3pu63GRjU22DCz1gwPQECDmSQJKDtLsjl8vlvr/vXZJLuYTUSy5HviShJIAJYDt2MMUV927LvctYcpOsaqtt0/bd3x8Su6u1LMuypNndeT7+0mcYW2+Lj3ZnX/OZ90dMJBICAAAAAAAAAEAZJLkLAAAAAAAAAACMHEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAAAAAABQEEJhAAAAAAAAAFAQQmEAAAAAAAAAUBBCYQAAAA 333643512633 A 58 58 0 0 1 228.0 128.0\" fill=\"none\" stroke=\"#1c2733\" stroke-width=\"1.4\"/><text x=\"231.3487803690731\" y=\"90.61972514316473\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"14\" font-weight=\"bold\" fill=\"#1c2733\">x°</text></svg>", "passage": ""}, {"n": "51", "type": "mcq", "section": "Mathematics", "qnum": "15", "stem": "A tap fills a paddling pool at 4 litres per minute. The pool holds 600 litres and already contains 120 litres. How many minutes will it take to fill the pool completely?", "options": {"A": "105", "B": "110", "C": "115", "D": "120"}, "fig": "", "passage": ""}, {"n": "i4", "type": "info", "section": "Reading Comprehension", "title": "Reading Comprehension", "body": "Read each passage carefully, then answer the questions. The passage is shown with every question, so you can always re-read it."}, {"n": "52", "type": "mcq", "section": "Reading Comprehension", "qnum": "1", "stem": "Why did the gym seem “suddenly very loud and very small” to Jonah?", "options": {"A": "The crowd had started cheering for the new squad", "B": "He was overwhelmed by disappointment when his name was not read out", "C": "The try-out had moved to a smaller hall", "D": "Coach Fung was shouting the names too loudly"}, "fig": "", "passage": "<strong>The Try-Out</strong><br><br>Jonah had been first in line when the basketball try-out list went up, and last to leave every practice since. So when Coach Fung read out the final squad on Friday afternoon and Jonah's name was not on it, the gym seemed suddenly very loud and very small at the same time.<br><br>He took the long way home, past the harbour, where the evening ferries were stitching their white lines across the water. His phone buzzed with messages from his friends: bad luck, so unfair, the coach is blind. Jonah did not answer any of them. Deep down, in the honest part of himself that he usually kept for emergencies, he knew the truth. Marcus was quicker. Dev read the game better. Jonah had wanted a place on the squad; the others had earned one.<br><br>On Saturday morning he was back at the outdoor court by the estate, alone, before the sun had cleared the rooftops. He set up his phone against his water bottle and filmed his own free throws: fifty of them, then fifty more. That evening he watched the videos twice, wincing at his footwork, and wrote two words on a sticky note that he pressed onto his desk lamp: <em>next year</em>.<br><br>When his mother asked at dinner whether he was disappointed, Jonah surprised himself. “I was,” he said, reaching for the rice. “Now I'm busy.”"}, {"n": "53", "type": "mcq", "section": "Reading Comprehension", "qnum": "2", "stem": "Why did Jonah not reply to his friends' messages?", "options": {"A": "His phone battery had died", "B": "He was angry with his friends", "C": "He privately knew the coach's decision was fair", "D": "He had already forgotten about the try-out"}, "fig": "", "passage": "<strong>The Try-Out</strong><br><br>Jonah had been first in line when the basketball try-out list went up, and last to leave every practice since. So when Coach Fung read out the final squad on Friday afternoon and Jonah's name was not on it, the gym seemed suddenly very loud and very small at the same time.<br><br>He took the long way home, past the harbour, where the evening ferries were stitching their white lines across the water. His phone buzzed with messages from his friends: bad luck, so unfair, the coach is blind. Jonah did not answer any of them. Deep down, in the honest part of himself that he usually kept for emergencies, he knew the truth. Marcus was quicker. Dev read the game better. Jonah had wanted a place on the squad; the others had earned one.<br><br>On Saturday morning he was back at the outdoor court by the estate, alone, before the sun had cleared the rooftops. He set up his phone against his water bottle and filmed his own free throws: fifty of them, then fifty more. That evening he watched the videos twice, wincing at his footwork, and wrote two words on a sticky note that he pressed onto his desk lamp: <em>next year</em>.<br><br>When his mother asked at dinner whether he was disappointed, Jonah surprised himself. “I was,” he said, reaching for the rice. “Now I'm busy.”"}, {"n": "54", "type": "mcq", "section": "Reading Comprehension", "qnum": "3", "stem": "What does the sticky note saying “next year” tell us about Jonah?", "options": {"A": "He plans to try again and is turning disappointment into a goal", "B": "He has decided to give up basketball until next year", "C": "He is reminding himself when the squad list will be published", "D": "He wants to change schools next year"}, "fig": "", "passage": "<strong>The Try-Out</strong><br><br>Jonah had been first in line when the basketball try-out list went up, and last to leave every practice since. So when Coach Fung read out the final squad on Friday afternoon and Jonah's name was not on it, the gym seemed suddenly very loud and very small at the same time.<br><br>He took the long way home, past the harbour, where the evening ferries were stitching their white lines across the water. His phone buzzed with messages from his friends: bad luck, so unfair, the coach is blind. Jonah did not answer any of them. Deep down, in the honest part of himself that he usually kept for emergencies, he knew the truth. Marcus was quicker. Dev read the game better. Jonah had wanted a place on the squad; the others had earned one.<br><br>On Saturday morning he was back at the outdoor court by the estate, alone, before the sun had cleared the rooftops. He set up his phone against his water bottle and filmed his own free throws: fifty of them, then fifty more. That evening he watched the videos twice, wincing at his footwork, and wrote two words on a sticky note that he pressed onto his desk lamp: <em>next year</em>.<br><br>When his mother asked at dinner whether he was disappointed, Jonah surprised himself. “I was,” he said, reaching for the rice. “Now I'm busy.”"}, {"n": "55", "type": "mcq", "section": "Reading Comprehension", "qnum": "4", "stem": "“I was,” he said. “Now I'm busy.” What does Jonah mean?", "options": {"A": "He is too busy with homework to feel anything", "B": "He no longer cares about basketball", "C": "He is pretending to be fine so his mother will not worry", "D": "He has replaced feeling sorry for himself with working to improve"}, "fig": "", "passage": "<strong>The Try-Out</strong><br><br>Jonah had been first in line when the basketball try-out list went up, and last to leave every practice since. So when Coach Fung read out the final squad on Friday afternoon and Jonah's name was not on it, the gym seemed suddenly very loud and very small at the same time.<br><br>He took the long way home, past the harbour, where the evening ferries were stitching their white lines across the water. His phone buzzed with messages from his friends: bad luck, so unfair, the coach is blind. Jonah did not answer any of them. Deep down, in the honest part of himself that he usually kept for emergencies, he knew the truth. Marcus was quicker. Dev read the game better. Jonah had wanted a place on the squad; the others had earned one.<br><br>On Saturday morning he was back at the outdoor court by the estate, alone, before the sun had cleared the rooftops. He set up his phone against his water bottle and filmed his own free throws: fifty of them, then fifty more. That evening he watched the videos twice, wincing at his footwork, and wrote two words on a sticky note that he pressed onto his desk lamp: <em>next year</em>.<br><br>When his mother asked at dinner whether he was disappointed, Jonah surprised himself. “I was,” he said, reaching for the rice. “Now I'm busy.”"}, {"n": "56", "type": "mcq", "section": "Reading Comprehension", "qnum": "5", "stem": "Which word best describes how Jonah deals with his setback by the end of the story?", "options": {"A": "resentful", "B": "carefree", "C": "resilient", "D": "boastful"}, "fig": "", "passage": "<strong>The Try-Out</strong><br><br>Jonah had been first in line when the basketball try-out list went up, and last to leave every practice since. So when Coach Fung read out the final squad on Friday afternoon and Jonah's name was not on it, the gym seemed suddenly very loud and very small at the same time.<br><br>He took the long way home, past the harbour, where the evening ferries were stitching their white lines across the water. His phone buzzed with messages from his friends: bad luck, so unfair, the coach is blind. Jonah did not answer any of them. Deep down, in the honest part of himself that he usually kept for emergencies, he knew the truth. Marcus was quicker. Dev read the game better. Jonah had wanted a place on the squad; the others had earned one.<br><br>On Saturday morning he was back at the outdoor court by the estate, alone, before the sun had cleared the rooftops. He set up his phone against his water bottle and filmed his own free throws: fifty of them, then fifty more. That evening he watched the videos twice, wincing at his footwork, and wrote two words on a sticky note that he pressed onto his desk lamp: <em>next year</em>.<br><br>When his mother asked at dinner whether he was disappointed, Jonah surprised himself. “I was,” he said, reaching for the rice. “Now I'm busy.”"}, {"n": "57", "type": "mcq", "section": "Reading Comprehension", "qnum": "6", "stem": "What is the main purpose of this passage?", "options": {"A": "To warn readers about the dangers of typhoons", "B": "To explain Hong Kong's typhoon signal system and its history", "C": "To argue that the signal numbers should be changed", "D": "To describe one famous typhoon in detail"}, "fig": "", "passage": "<strong>Signals in the Sky</strong><br><br>Every child in Hong Kong learns to read one particular set of numbers long before any maths lesson: the typhoon warning signals. When the Observatory raises Signal No. 1, a tropical cyclone is centred within about 800 kilometres of the city: a distant watchfulness, nothing more. Signal No. 3 warns of strong winds, and kindergartens close their doors. But the number every student secretly hopes for is 8. When Signal No. 8 is hoisted, gale-force winds are expected, offices empty, ferries return to their moorings, and schools across the city fall silent.<br><br>The system is more than a century old. In its early days, before radio was widespread, the Observatory really did hoist physical signals: black symbols of bamboo and canvas raised on harbourside masts, with cannon and, later, explosive bombs fired to announce the strongest winds. The word “hoisted” survives in Hong Kong English to this day, long after the last mast was retired: people still say a signal is hoisted, even though it now travels by app and television rather than up a pole.<br><br>Visitors sometimes ask why the numbers jump from 3 straight to 8. The answer is history: signals 5, 6 and 7 once marked gales from different directions, and were replaced in 1973 by the single Signal No. 8 to avoid confusion. The gaps in the sequence are fossils, left behind by an older system.<br><br>For all its age, the system endures because it does one thing supremely well: it turns a complicated storm into a single number that a whole city, in any language, can understand at a glance."}, {"n": "58", "type": "mcq", "section": "Reading Comprehension", "qnum": "7", "stem": "According to the passage, what happens when Signal No. 8 is issued?", "options": {"A": "Only kindergartens close", "B": "A cyclone is within 800 km of Hong Kong", "C": "Cannon are fired across the harbour", "D": "Schools close and ferries stop running"}, "fig": "", "passage": "<strong>Signals in the Sky</strong><br><br>Every child in Hong Kong learns to read one particular set of numbers long before any maths lesson: the typhoon warning signals. When the Observatory raises Signal No. 1, a tropical cyclone is centred within about 800 kilometres of the cit  "To recruit members for the Green Committee"}}, {"n": "63", "qnum": "2", "stem": "Where are the new filling stations?", "options": {"A": "Beside the library and the gym", "B": "In the canteen and the office", "C": "Beside the hall and the pool", "D": "In every classroom"}}, {"n": "64", "qnum": "3", "stem": "What did the Green Committee's survey find?", "options": {"A": "Fresh juice was unpopular", "B": "Over two thousand plastic bottles were thrown away each month", "C": "The water fountains were broken", "D": "The pool filters needed replacing"}}, {"n": "65", "qnum": "4", "stem": "What should a student do if they lose their steel bottle?", "options": {"A": "Ask the canteen for a free one", "B": "Bring their own cup instead", "C": "Report it to the Green Committee", "D": "Buy a replacement at the school office"}}]}, {"n": "g2", "type": "lgroup", "section": "Listening", "audio": "listening2.m4a", "title": "Planning the Project", "items": [{"n": "66", "qnum": "5", "stem": "Which topic do the students choose for their project?", "options": {"A": "The Kowloon Walled City", "B": "The history of the trams", "C": "The tram depot workers", "D": "The history of the museum"}}, {"n": "67", "qnum": "6", "stem": "What makes the tram topic attractive to Ben?", "options": {"A": "The museum's photo archive will strengthen their display", "B": "It needs no research", "C": "The teacher suggested it", "D": "He rides the tram to school"}}, {"n": "68", "qnum": "7", "stem": "When will the students meet?", "options": {"A": "Monday after school", "B": "Tuesday lunchtime", "C": "Thursday after school", "D": "Thursday lunchtime"}}]}, {"n": "g3", "type": "lgroup", "section": "Listening", "audio": "listening3.m4a", "title": "This Week's Sports Report", "items": [{"n": "69", "qnum": "8", "stem": "Where did the swimming team finish at the championships?", "options": {"A": "First", "B": "Second", "C": "Third", "D": "Fourth"}}, {"n": "70", "qnum": "9", "stem": "In which event did the captain break the school record?", "options": {"A": "100 m freestyle", "B": "200 m backstroke", "C": "100 m butterfly", "D": "the relay"}}, {"n": "71", "qnum": "10", "stem": "What does Coach Fung credit for the team's success?", "options": {"A": "Early-morning training three times a week", "B": "A new training pool", "C": "A change of diet", "D": "Luck on the day"}}]}, {"n": "i6", "type": "info", "section": "Writing", "title": "Writing", "body": "You will see two writing tasks. Choose ONE and type your answer. Aim for about 130-180 words: plan briefly, organise your ideas into paragraphs, and check your accuracy."}, {"n": "72", "type": "writing", "section": "Writing", "intro": "Choose ONE of the two tasks below and type your answer in the box. Aim for about 130-180 words.", "body": "Task 1: Write about a time you failed at something that mattered to you, and what you did next. Describe what happened and reflect honestly on what it taught you.\n\nTask 2: Some people believe students should be allowed to use their phones at school; others believe phones should be banned during the school day. What is your view? Support your opinion with clear reasons and examples.", "hint": "Start by saying which task you chose. Plan for a minute, organise your ideas into paragraphs, and leave time to check your accuracy.", "placeholder": "Type your answer here; it will be saved for review…"}, {"n": "i7", "type": "info", "section": "Speaking", "title": "Speaking", "body": "In this final section you will record a short audio response. Find a quiet spot, allow microphone access when your browser asks, and speak clearly and naturally."}, {"n": "73", "type": "speaking", "section": "Speaking", "stem": "Record a short spoken response (about 90-120 seconds).", "body": "Speak about:\n• Your name, your current school and year group\n• A subject you find genuinely interesting, and what makes it interesting to you\n• A challenge you have faced, in or out of school, and how you dealt with it\n• What you hope to contribute to your next school\n\nSpeak naturally; this is a chance for your future school to hear how you think, not a memory test."}, {"n": "i8", "type": "info", "section": "中文閱讀 Chinese Reading", "title": "中文閱讀 Chinese Reading", "body": "<div class=\"zhblk\"><div class=\"zhh\">繁體中文</div><div>細心閱讀下面的文章，然後回答問題。文章和題目以繁體為主，附簡體對照。</div></div><div class=\"zhblk\"><div class=\"zhh\">簡體中文</div><div>细心阅读下面的文章，然后回答问题。文章和题目以繁体为主，附简体对照。</div></div>"}, {"n": "74", "type": "mcq", "section": "中文閱讀 Chinese Reading", "qnum": "1", "stem": "梁姨往往不用客人開口，便知道對方要甚麼，這說明她：<br><i>梁姨往往不用客人开口，便知道对方要什么，这说明她：</i>", "options": {"A": "記性比別人好<br><i>记性比别人好</i>", "B": "與街坊相熟，了解每位客人<br><i>与街坊相熟，了解每位客人</i>", "C": "只賣一種涼茶<br><i>只卖一种凉茶</i>", "D": "不喜歡與客人交談<br><i>不喜欢与客人交谈</i>"}, "fig": "", "passage": "<div class=\"zhblk\"><div class=\"zhh\">繁體中文</div><div>香港的夏天，總離不開一碗涼茶。放學路上，我常常經過街角那間老涼茶舖。深褐色的木櫃檯後面，一排黃銅大壺終日冒着熱氣，空氣裏混着廿四味的苦香。老闆娘梁姨在這裏站了三十多年，客人一推門，她往往不用開口，便知道對方要甚麼：熬夜的上班族來一碗夏枯草，喉嚨沙啞的老師來一碗羅漢果，貪吃煎炸食物的學生，自然是一碗廿四味。<br><br>有人說，涼茶舖遲早會被連鎖飲品店取代。梁姨卻不太擔心。她說，涼茶賣的從來不只是那碗茶，還有一句「最近睡得好嗎」的問候。飲品店的餐牌再長，也印不下這一句。<br><br>上星期經過，我看見梁姨的兒子辭了寫字樓的工作，回來學熬茶。他把每一種藥材的名字、分量和火候，一筆一筆記在小本子上，就像小學生抄生字一樣認真。爐火映在兩代人的臉上，我忽然覺得，這間小小的舖頭，大概還會一直開下去。</div></div><div class=\"zhblk\"><div class=\"zhh\">簡體中文</div><div>香港的夏天，总离不开一碗凉茶。放学路上，我常常经过街角那间老凉茶铺。深褐色的木柜台后面，一排黄铜大壶终日冒着热气，空气里混着廿四味的苦香。老板娘梁姨在这里站了三十多年，客人一推门，她往往不用开口，便知道对方要什么：熬夜的上班族来一碗夏枯草，喉咙沙哑的老师来一碗罗汉果，贪吃煎炸食物的学生，自然是一碗廿四味。<br><br>有人说，凉茶铺迟早会被连锁饮品店取代。梁姨却不太担心。她说，凉茶卖的从来不只是那碗茶，还有一句“最近睡得好吗”的问候。饮品店的餐牌再长，也印不下这一句。<br><br>上星期经过，我看见梁姨的儿子辞了写字楼的工作，回来学熬茶。他把每一种药材的名字、分量和火候，一笔一笔记在小本子上，就像小学生抄生字一样认真。炉火映在两代人的脸上，我忽然觉得，这间小小的铺头，大概还会一直开下去。</div></div>"}, {"n": "75", "type": "mcq", "section": "中文閱讀 Chinese Reading", "qnum": "2", "stem": "文中「餐牌再長，也印不下這一句」中的「這一句」是指：<br><i>文中“餐牌再长，也印不下这一句”中的“这一句”是指：</i>", "options": {"A": "涼茶的價錢<br><i>凉茶的价钱</i>", "B": "藥材的名字<br><i>药材的名字</i>", "C": "「最近睡得好嗎」的問候<br><i>“最近睡得好吗”的问候</i>", "D": "涼茶舖的地址<br><i>凉茶铺的地址</i>"}, "fig": "", "passage": "<div class=\"zhblk\"><div class=\"zhh\">繁體中文</div><div>香港的夏天，總離 let answers = {};              // n -> letter
let texts = {};                // n -> string
let student = {name:"",email:"",school:"",dob:"",year:""};

/* UK/HK-international year group from DOB: age on 1 September of the current
   school year, minus 4 (Year 1 = age 5-6, September cut-off). */
function yearFromDob(dobStr){
  const d=new Date(dobStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const now=new Date();
  const sy = now.getMonth()>=8 ? now.getFullYear() : now.getFullYear()-1;
  let age = sy - d.getFullYear();
  if(d.getMonth()>8 || (d.getMonth()===8 && d.getDate()>1)) age--;   // birthday after 1 Sep
  const yr = age - 4;
  return (yr>=1 && yr<=13) ? yr : null;
}
let startTs = null;
let secEnd = null;             // epoch ms deadline of the CURRENT section
let curSec = null;             // current section name
let recs = {};                 // question n -> {b64, mime, secs, left}
let submitted = false;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(s/60),ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function secConf(name){ for(const s of SECTIONS){ if(s.name===name) return s; } return null; }
function activeSections(){ return SECTIONS; }

function buildFlow(){
  const names = activeSections().map(s=>s.name);
  FLOW = QUESTIONS.filter(q=>names.indexOf(q.section)>=0);
  secStarts = {};
  FLOW.forEach((q,i)=>{ if(!(q.section in secStarts)) secStarts[q.section]=i; });
}
function sectionOf(i){ return FLOW[i] ? FLOW[i].section : null; }
function nextSectionStart(i){
  const cur = sectionOf(i);
  for(let j=i+1;j<FLOW.length;j++){ if(FLOW[j].section!==cur) return j; }
  return -1;
}

/* ---------- persistence (refresh cannot reset the clock) ---------- */
function persist(){
  if(submitted) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({
    student, idx, secEnd, curSec, answers, texts, startTs
  })); }catch(e){}
}
function restore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !s.startTs || s.idx==null || s.idx<0) return false;
    student=s.student||student; idx=s.idx;
    secEnd=s.secEnd; curSec=s.curSec; answers=s.answers||{}; texts=s.texts||{};
    startTs=s.startTs;
    buildFlow();
    // deadline passed while the tab was closed: advance until inside a live section
    while(secEnd!=null && Date.now()>secEnd){
      const nx=nextSectionStart(idx);
      if(nx<0){ submit(true); return true; }
      idx=nx; enterSection(sectionOf(idx));
    }
    return true;
  }catch(e){ return false; }
}
function clearStore(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

/* ---------- timer ---------- */
function enterSection(name){
  const c=secConf(name);
  curSec=name;
  secEnd=Date.now()+(c?c.minutes:5)*60000;
  persist();
}
function tick(){
  if(idx<0||submitted||secEnd==null){ timerEl.textContent=''; return; }
  const rem=secEnd-Date.now();
  timerEl.textContent=(curSec?curSec+' · ':'')+fmtTime(rem);
  timerEl.className='timer'+(rem<30000?' crit':(rem<120000?' warn':''));
  if(rem<=0) advanceSection(true);
}
setInterval(tick,500);

function stopAllAudio(){
  Object.values(players).forEach(st=>{ if(st.el){ try{st.el.pause();}catch(e){} st.el=null; } st.playing=false; });
}
function advanceSection(timedOut){
  stopRecorderIfRunning(); stopAllAudio();
  const q=FLOW[idx]; if(q) saveText(q);
  const nx=nextSectionStart(idx);
  if(nx<0){ submit(true); return; }
  idx=nx;
  enterSection(sectionOf(idx));
  render();
}

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/FLOW.length)*100); prog.style.width=pct+'%'; }

/* ---------- start gate ---------- */
function planRows(){
  return activeSections().map(s=>`<tr><td>${esc(s.name)}</td><td>${s.minutes} min</td></tr>`).join('');
}
function renderStart(){
  setProg();
  const total = activeSections().reduce((a,s)=>a+s.minutes,0);
  card.innerHTML = `
    <h1>HKS Baseline Assessment · Level C Bilingual (V1)</h1>
    <p class="info-body">This assessment is <b>timed</b>. Each section has its own time limit and moves on automatically when time is up. You can go back to questions <b>within</b> the current section, but you cannot return to a finished section. Some sections ask you to <b>listen to recordings</b> or to <b>record your voice</b>, so please use a device with a speaker and a microphone.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="field"><label>Current school <span style="color:#c0392b">*</span></label><input id="sch" placeholder="e.g. St Joseph's Primary School" value="${esc(student.school||'')}"></div>
    <div class="field"><label>Student's date of birth <span style="color:#c0392b">*</span></label>
      <input id="dob" type="date" min="2005-01-01" max="2023-12-31" value="${esc(student.dob||'')}"></div>
    <div class="field"><label>Current year / grade level <span style="color:#c0392b">*</span></label>
      <input id="yr" placeholder="e.g. Year 5, Grade 4 or P5" value="${esc(student.year||'')}">
      <div class="hint">${BAND_LABEL} is designed for students currently in ${YEAR_SPAN}.</div></div>
    <table class="secplan" id="plan">${planRows()}</table>
    <p class="info-body" style="color:var(--muted);font-size:13px">Total: <b id="tot">${total}</b> minutes. The timer starts as soon as you press Begin.</p>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  const dobEl=document.getElementById('dob');
  const yrEl=document.getElementById('yr');
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    student.school=(document.getElementById('sch').value||'').trim();
    student.dob=(dobEl.value||'').trim();
    student.year=(yrEl.value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    if(!student.school){ err.textContent="Please enter the student's current school."; document.getElementById('sch').focus(); return; }
    if(!student.dob){
      err.textContent="Please enter the student's date of birth."; dobEl.focus(); return;
    }
    if(!student.year){ err.textContent='Please enter the current year / grade level.'; yrEl.focus(); return; }
    buildFlow();
    startTs=Date.now(); idx=0;
    enterSection(sectionOf(0));
    render();
  };
}

/* ---------- question rendering ---------- */
function render(){
  if(idx<0){ renderStart(); return; }
  if(submitted) return;
  setProg();
  const q=FLOW[idx];
  let body='';
  const secLabel = q.section? `<span class="sec">${esc(q.section)}</span>`:'<span></span>';
  if(q.type==='info'){
    const c=secConf(q.section);
    body=`<div class="sec">Section · ${c?c.minutes+' minutes':''}</div><h1>${esc(q.title)}</h1><div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`<div class="qhead">${secLabel}</div>`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.body?`<div class="wbody">${esc(q.body)}</div>`:'')
      + `<textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else if(q.type==='speaking'){
    body=renderSpeaking(q);
  } else if(q.type==='lgroup'){
    const subs = q.items.map(it=>{
      const opts = Object.keys(it.options).map(k=>{
        const seld = answers[it.n]===k?' sel':'';
        return `<div class="opt${seld}" data-n="${it.n}" data-k="${k}"><span class="l">${k}</span>${esc(it.options[k])}</div>`;
      }).join('');
      return `<div class="lgq"><div class="qhead"><span></span><span class="qnum">Question ${it.qnum}</span></div>
        <div class="stem">${esc(it.stem)}</div>${opts}</div>`;
    }).join('');
    body=`<div class="qhead"><span class="sec">${esc(q.section)}</span></div>
      <div class="lgtitle">${esc(q.title||'Listening')}</div>
      ${playerHtml(q.audio)}
      ${subs}`;
  } else { // mcq
    const audio = q.audio? playerHtml(q.audio):'';
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const head = `<div class="qhead">${secLabel}${q.qnum?`<span class="qnum">Question ${q.qnum}</span>`:''}</div>`;
    body=`${head}${audio}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div class="fig">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===FLOW.length-1;
  const secFirst = secStarts[q.section];
  const lastInSec = (nextSectionStart(idx)===idx+1) || isLast;
  const nextLabel = isLast?'Finish &amp; submit':(lastInSec?'Finish section':'Next');
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx<=secFirst?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${nextLabel}</button>
    </div>`;
  if(q.type==='mcq'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      persist();
    });
  }
  if(q.type==='lgroup'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      const n=el.dataset.n;
      answers[n]=el.dataset.k;
      el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      persist();
    });
    wirePlayer(q.audio);
  }
  if(q.type==='mcq' && q.audio) wirePlayer(q.audio);
  if(q.type==='speaking') wireSpeaking(q);
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{
    saveText(q);
    if(isLast){ submit(false); }
    else if(lastInSec){ advanceSection(false); }
    else { idx++; render(); }
  };
  persist();
}
function saveText(q){ if(q.type==='writing'){ const t=document.getElementById('ta'); if(t) texts[q.n]=t.value; persist(); } }

/* ---------- limited listening player (big play/pause, 2 plays, no seeking) ---------- */
const players = {};   // audio file -> {el, playsLeft, playing}
function playerState(src){ if(!players[src]) players[src]={el:null, playsLeft:2, playing:false}; return players[src]; }
function playerHtml(src){
  const st=playerState(src);
  return `<div class="playwrap">
    <button class="playbtn" id="playBtn" ${st.playsLeft<=0&&!st.playing?'disabled':''}>${st.playing?'&#10074;&#10074;':'&#9654;'}</button>
    <div class="playinfo"><b>${st.playing?'Playing…':'Press play and listen carefully.'}</b><br>
      <span id="playsLeft">${st.playsLeft>0?`You can play this recording ${st.playsLeft} more time${st.playsLeft===1?'':'s'}.`:'No plays left.'}</span></div>
  </div>`;
}
function wirePlayer(src){
  const btn=document.getElementById('playBtn');
  if(!btn) return;
  const st=playerState(src);
  btn.onclick=()=>{
    if(st.playing){ if(st.el) st.el.pause(); st.playing=false; render(); return; }
    if(!st.el || st.el.ended || st.el.currentTime===0){
      if(st.playsLeft<=0) return;
      st.playsLeft--;
      st.el=new Audio(src);
      st.el.onended=()=>{ st.playing=false; st.el=null; if(FLOW[idx]&&(FLOW[idx].audio===src)) render(); };
    }
    st.el.play();
    st.playing=true;
    render();
  };
}

/* ---------- audio recorder (per-question; a paper can have several) ---------- */
let mediaStream=null, recorder=null, chunks=[], recTimer=null, recStart=0, recN=null;
function recOf(n){ if(!recs[n]) recs[n]={b64:"",mime:"",secs:0,left:1}; return recs[n]; }
function renderSpeaking(q){
  const r=recOf(q.n);
  const maxS=q.maxSeconds||RECORD_MAX_S;
  return `<div class="qhead"><span class="sec">${esc(q.section)}</span></div>
    <div class="stem">${esc(q.stem)}</div>
    ${q.body?`<div class="wbody">${esc(q.body)}</div>`:''}
    <div class="recwrap" id="recwrap">
      ${r.b64
        ? `<div class="recstate ok" style="color:#1e7a46;font-weight:700">✓ Recording saved (${r.secs}s)</div>
           <audio controls src="${r.b64}"></audio>
           ${r.left>0?`<button class="prev" id="reRecBtn">Record again (${r.left} left)</button>`:''}`
        : `<button class="recbtn" id="recBtn">● Start recording</button>
           <div class="recstate" id="recState">Press the button and speak clearly. Up to ${maxS} seconds.</div>`}
      <div class="err" id="recErr"></div>
    </div>
    <p class="hint">If your microphone is blocked or unavailable, you can continue; your tutor will arrange this part separately.</p>`;
}
function wireSpeaking(q){
  const r=recOf(q.n);
  const maxS=q.maxSeconds||RECORD_MAX_S;
  const btn=document.getElementById('recBtn');
  const reBtn=document.getElementById('reRecBtn');
  if(reBtn) reBtn.onclick=()=>{ r.left--; r.b64=''; r.mime=''; r.secs=0; render(); };
  if(!btn) return;
  btn.onclick=async()=>{
    if(recorder && recorder.state==='recording'){ stopRecorderIfRunning(); return; }
    const errEl=document.getElementById('recErr');
    try{
      mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){ errEl.textContent='Microphone unavailable ('+(e.name||'error')+'). You can continue to the next step.'; return; }
    chunks=[]; recN=q.n;
    const mime = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus'
               : (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : '';
    try{ recorder = mime? new MediaRecorder(mediaStream,{mimeType:mime}) : new MediaRecorder(mediaStream); }
    catch(e){ errEl.textContent='Recording is not supported in this browser. You can continue.'; return; }
    recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      const rr=recOf(recN);
      rr.mime=blob.type; rr.secs=Math.round((Date.now()-recStart)/1000);
      const fr=new FileReader();
      fr.onload=()=>{ rr.b64=String(fr.result||''); render(); };
      fr.readAsDataURL(blob);
      if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
    };
    recStart=Date.now();
    recorder.start();
    btn.textContent='■ Stop recording'; btn.classList.add('stop');
    const st=document.getElementById('recState');
    recTimer=setInterval(()=>{
      const sElapsed=Math.round((Date.now()-recStart)/1000);
      if(st) st.innerHTML='<b>● Recording…</b> '+sElapsed+'s / '+maxS+'s';
      if(sElapsed>=maxS) stopRecorderIfRunning();
    },250);
  };
}
function stopRecorderIfRunning(){
  if(recTimer){ clearInterval(recTimer); recTimer=null; }
  if(recorder && recorder.state==='recording'){ try{ recorder.stop(); }catch(e){} }
  else if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
}

/* ---------- figures to PNG for the review PDF ---------- */
function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<FLOW.length;i++){ var q=FLOW[i];
  if(!q.fig) continue;
  var m=q.fig.match(/src="(data:image\/[^"]+)"/);          // engine PNGs pass straight through
  if(m){ figs[q.n]=m[1]; continue; }
  if(/<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

/* ---------- submit (awaited, with retry) ---------- */
async function submit(auto){
  if(submitted) return;
  submitted=true; secEnd=null; stopRecorderIfRunning();
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">${auto?'Time is up, submitting':'Submitting'} your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = [];
  FLOW.forEach(function(q){
    if(q.type==='lgroup'){
      q.items.forEach(function(it){ qslim.push({n:it.n,type:'mcq',section:q.section,stem:it.stem,options:it.options,qnum:it.qnum}); });
    } else {
      qslim.push({n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,intro:q.intro,body:(q.type==='writing'||q.type==='speaking')?q.body:undefined});
    }
  });
  const audios = FLOW.filter(q=>q.type==='speaking').map(q=>{
    const r=recs[q.n]||{};
    return {n:q.n, section:q.section, b64:r.b64||'', mime:r.mime||'', seconds:r.secs||0};
  });
  const payload={ type:"baseline", band:BAND, bandLabel:BAND_LABEL, version:VERSION,
    name:student.name, email:student.email, school:student.school,
    dob:student.dob, dobYear:(yearFromDob(student.dob)!=null?'Year '+yearFromDob(student.dob):''),
    yearGroup:student.year,
    allowedMinutes: activeSections().reduce((a,s)=>a+s.minutes,0),
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0,
    answers, texts, questions:qslim, figs, audios };
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    await res.text();
    clearStore();
    card.innerHTML = `<div class="center">
      <div class="big ok">✓</div>
      <h1>Submitted</h1>
      <p class="info-body">Thank you, ${esc(student.name)}. Your responses${audios.some(a=>a.b64)?' and recordings':''} have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
    </div>`;
    prog.style.width='100%';
  }catch(e){
    card.innerHTML = `<div class="center">
      <div class="big" style="color:var(--red)">!</div>
      <h1>Submission failed</h1>
      <p class="info-body">Your answers are safe on this page. Please check your internet connection, then press Retry.</p>
      <div class="nav" style="justify-content:center"><button class="submit" id="retryBtn">Retry submission</button></div>
    </div>`;
    document.getElementById('retryBtn').onclick=()=>{ submitted=false; submit(auto); };
  }
}

/* ---------- boot: explicit resume screen ---------- */
buildFlow();
if(restore() && !submitted && idx>=0){
  card.innerHTML = `<div class="center">
    <h1>Welcome back${student.name?', '+esc(student.name):''}</h1>
    <p class="info-body">You have a test in progress on this device. The section timer continued while you were away.</p>
    <div class="nav" style="justify-content:center;gap:14px">
      <button class="prev" id="restartBtn">Start again</button>
      <button class="submit" id="resumeBtn">Continue my test</button>
    </div></div>`;
  document.getElementById('resumeBtn').onclick=()=>{ render(); };
  document.getElementById('restartBtn').onclick=()=>{
    clearStore();
    idx=-1; secEnd=null; curSec=null; startTs=null;
    for(const k in answers) delete answers[k];
    for(const k in texts) delete texts[k];
    render();
  };
} else { render(); }
</script>
</body>
