<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKS Baseline Assessment · Level B Bilingual (V3)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;--amber:#b7791f;--red:#c0392b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:600}
  .timer.warn{color:var(--amber)}
  .timer.crit{color:var(--red)}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .emo{font-size:56px;line-height:1.3;margin:0 8px;vertical-align:middle}
  .opt .emo{font-size:34px;margin:0 6px}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:Georgia,serif;resize:vertical;line-height:1.6}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .toggle{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0;cursor:pointer}
  .toggle input{margin-top:3px}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:var(--red);font-size:14px;margin-top:10px}
  .secplan{width:100%;border-collapse:collapse;margin:14px 0}
  .secplan td{border:1px solid var(--line);padding:8px 12px;font-size:14px}
  .secplan td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
  .recwrap{text-align:center;padding:18px 0}
  .recbtn{background:var(--red);color:#fff;font-weight:700;border-radius:999px;padding:14px 30px;font-size:16px}
  .recbtn.stop{background:var(--brand)}
  .recstate{font-size:14px;color:var(--muted);margin:12px 0}
  .recstate b{color:var(--red)}
  audio{width:100%;margin:10px 0}
  .fig{margin:0 0 14px;overflow-x:auto}
  .lgtitle{font-size:18px;font-weight:700;color:var(--brand);margin:0 0 10px}
  .playwrap{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
  .playbtn{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;font-size:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
  .playbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  .playinfo{font-size:14px;color:var(--muted);line-height:1.5}
  .playinfo b{color:var(--ink)}
  .lgq{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
  .lgq .stem{font-size:16px}
  .zhblk{margin:0 0 12px}
  .zhh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin:0 0 4px}
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfCt2VVoQw-6OxkAPw66IivM5BZ8pukZGzi0aOI6vAFx7wfbX8UoMNxh6cZiE_hsGNXg/exec";
const BAND = "level-b-bilingual", BAND_LABEL = "Level B Bilingual", VERSION = "3";

 "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nDoctor is to hospital as chef is to ______.", "options": {"A": "menu", "B": "kitchen", "C": "waiter", "D": "food"}, "fig": "", "passage": ""}, {"n": "8", "type": "mcq", "section": "Verbal Reasoning", "qnum": "8", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nTadpole is to frog as caterpillar is to ______.", "options": {"A": "cocoon", "B": "leaf", "C": "butterfly", "D": "worm"}, "fig": "", "passage": ""}, {"n": "9", "type": "mcq", "section": "Verbal Reasoning", "qnum": "9", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nIsland is to water as oasis is to ______.", "options": {"A": "desert", "B": "palm tree", "C": "ocean", "D": "camel"}, "fig": "", "passage": ""}, {"n": "10", "type": "mcq", "section": "Verbal Reasoning", "qnum": "10", "stem": "Work out how the first pair of words go together, then complete the second pair.\n\nHelmet is to head as glove is to ______.", "options": {"A": "finger", "B": "arm", "C": "warmth", "D": "hand"}, "fig": "", "passage": ""}, {"n": "11", "type": "mcq", "section": "Verbal Reasoning", "qnum": "11", "stem": "Choose the word that best completes the sentence.\n\nThe old bridge was declared ______, so heavy lorries were no longer allowed to cross it.", "options": {"A": "spotless", "B": "spacious", "C": "unsafe", "D": "valuable"}, "fig": "", "passage": ""}, {"n": "12", "type": "mcq", "section": "Verbal Reasoning", "qnum": "12", "stem": "Choose the word that best completes the sentence.\n\nRavi is usually talkative, but he became strangely ______ whenever the missing library book was mentioned.", "options": {"A": "cheerful", "B": "silent", "C": "noisy", "D": "honest"}, "fig": "", "passage": ""}, {"n": "13", "type": "mcq", "section": "Verbal Reasoning", "qnum": "13", "stem": "Choose the word that best completes the sentence.\n\nThe explorers' supplies were nearly ______, so they turned back before crossing the glacier.", "options": {"A": "exhausted", "B": "delicious", "C": "replaced", "D": "invisible"}, "fig": "", "passage": ""}, {"n": "14", "type": "mcq", "section": "Verbal Reasoning", "qnum": "14", "stem": "Choose the word or phrase that best completes the sentence.\n\nBy the time the bell rang, the children ______ their projects.", "options": {"A": "finish", "B": "had finished", "C": "will finish", "D": "finishing"}, "fig": "", "passage": ""}, {"n": "15", "type": "mcq", "section": "Verbal Reasoning", "qnum": "15", "stem": "Choose the word or phrase that best completes the sentence.\n\nThe author ______ novel won the prize will visit our school in March.", "options": {"A": "who", "B": "which", "C": "whose", "D": "whom"}, "fig": "", "passage": ""}, {"n": "16", "type": "mcq", "section": "Verbal Reasoning", "qnum": "16", "stem": "Choose the word or phrase that best completes the sentence.\n\nTake a raincoat with you ______ the weather changes suddenly.", "options": {"A": "unless", "B": "so that", "C": "although", "D": "in case"}, "fig": "", "passage": ""}, {"n": "i2", "type": "info", "section": "Non-Verbal Reasoning", "title": "Non-Verbal Reasoning", "body": "This section uses figures instead of words. In some questions, three pictures share a rule: choose the answer picture that follows the same rule. In others, a grid changes across the row: choose the picture that completes it. Work quickly; about half a minute per question."}, {"n": "17", "type": "mcq", "section": "Non-Verbal Reasoning", "qnum": "1", "stem": "Choose the answer which shares the same connection/characteristic as the three given images.", "options": {"A": "", "B": "", "C": "", "D": "", "E": ""}, "fig": "<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAB1wAAAF4CAIAAAB//BwYAAAABmJLR0QA/wD/AP+gvaeTAAAgAElEQVR4nOzdd3xb933v/zOwNwGSALcoedtJvG7S3DRDaZomadp7f2kfaZvdpG1uc9v7S9JmOMuSp5w4tm8cx43j2PGQZMsalm1JliWbkrVsWcuSSW1Rg1MiKW6QWOf+AQc4ACmKIgEcHJzX8y9+v  "qnum": "7", "stem": "At the swimming gala, the first heat starts at 10:20 am, and each heat lasts 8 minutes, one straight after another. Ella swims in the FOURTH heat. At what time does her heat start?", "options": {"A": "10:52 am", "B": "10:28 am", "C": "10:44 am", "D": "10:36 am"}, "fig": "", "passage": ""}, {"n": "36", "type": "mcq", "section": "Mathematics", "qnum": "8", "stem": "Cinema tickets cost HK$65 for an adult and HK$40 for a child. A family of 2 adults and 3 children pays with HK$300. How much change do they receive?", "options": {"A": "HK$50", "B": "HK$250", "C": "HK$90", "D": "HK$130"}, "fig": "", "passage": ""}, {"n": "37", "type": "mcq", "section": "Mathematics", "qnum": "9", "stem": "265 pupils are travelling to sports day by coach. Each coach seats 42 pupils. How many coaches does the school need?", "options": {"A": "6", "B": "5", "C": "7", "D": "8"}, "fig": "", "passage": ""}, {"n": "38", "type": "mcq", "section": "Mathematics", "qnum": "10", "stem": "A camera costs HK$430. Anna has already saved HK$180, and from now on she saves HK$25 each week. How many MORE weeks will it take her to afford the camera?", "options": {"A": "18", "B": "10", "C": "8", "D": "11"}, "fig": "", "passage": ""}, {"n": "i4", "type": "info", "section": "Reading Comprehension", "title": "Reading Comprehension", "body": "Read each passage carefully, then answer the questions about it. The passage is shown with every question, so you can always re-read it."}, {"n": "39", "type": "mcq", "section": "Reading Comprehension", "qnum": "1", "stem": "How did Maya feel during the first cloudy nights?", "options": {"A": "Afraid of the dark roof", "B": "Proud of Grandpa's telescope", "C": "Impatient and frustrated", "D": "Too tired to care"}, "fig": "", "passage": "<strong>Grandpa's Telescope</strong><br><br>When Maya's family moved to the village house where Grandpa lived, the thing she liked best stood under a dust sheet on the roof: a long brass telescope on a wooden tripod.<br><br>“Tonight we will look at Saturn,” Grandpa promised on her first evening. But when darkness fell, clouds rolled in from the sea and covered every star. The same thing happened the next night, and the night after that. “This is pointless,” Maya muttered, stamping back downstairs.<br><br>Grandpa did not argue. Instead, he showed her a battered notebook, its pages filled with dates and small sketches. “Every clear night I have ever had,” he said, “and every cloudy one too. Some of the best things in the sky made me wait for weeks. Waiting is part of looking.”<br><br>After that, Maya climbed to the roof with him anyway. On cloudy nights, Grandpa taught her the names of the constellations they would see one day, and how to line up the finder scope on a distant lamp post.<br><br>On the twelfth night, the clouds finally drew back like curtains. Grandpa aimed the telescope, made one tiny adjustment, and stepped aside without a word. Maya pressed her eye to the lens. Hanging in the darkness was a small golden globe, wrapped in perfect, impossible rings.<br><br>She did not shout. She simply watched, and understood why an old man would keep a notebook full of cloudy nights, and wait his whole life for skies like this."}, {"n": "40", "type": "mcq", "section": "Reading Comprehension", "qnum": "2", "stem": "The writer says “the clouds finally drew back like curtains”. What does this suggest?", "options": {"A": "The sky slowly opened up, like a stage being revealed before a show", "B": "Somebody closed the windows of the house", "C": "The clouds were made of cloth", "D": "It was about to start raining"}, "fig": "", "passage": "<strong>Grandpa's Telescope</strong><br><br>When Maya's family moved to the village house where Grandpa lived, the thing she liked best stood under a dust sheet on the roof: a long brass telescope on a wooden tripod.<br><br>“Tonight we will look at Saturn,” Grandpa promised on her first evening. But when darkness fell, clouds rolled in from the sea and covered every star. The same thing happened the next night, and the night after that. “This is pointless,” Maya muttered, stamping back downstairs.<br><br>Grandpa did not argue. Instead, he showed her a battered notebook, its pages filled with dates and small sketches. “Every clear night I have ever had,” he said, “and every cloudy one too. Some of the best things in the sky made me wait for weeks. Waiting is part of looking.”<br><br>After that, Maya climbed to the roof with him anyway. On cloudy nights, Grandpa taught her the names of the constellations they would see one day, and how to line up the finder scope on a distant lamp post.<br><br>On the twelfth night, the clouds finally drew back like curtains. Grandpa aimed the telescope, made one tiny adjustment, and stepped aside without a word. Maya pressed her eye to the lens. Hanging in the darkness was a small golden globe, wrapped in perfect, impossible rings.<br><br>She did not shout. She simply watched, and understood why an old man would keep a notebook full of cloudy nights, and wait his whole life for skies like this."}, {"n": "41", "type": "mcq", "section": "Reading Comprehension", "qnum": "3", "stem": "What does Grandpa's notebook tell us about him?", "options": {"A": "He is forgetful and needs to write everything down", "B": "He prefers drawing to stargazing", "C": "He is planning to sell the telescope", "D": "He is patient and has watched the sky for many years"}, "fig": "", "passage": "<strong>Grandpa's Telescope</strong><br><br>When Maya's family moved to the village house where Grandpa lived, the thing she liked best stood under a dust sheet on the roof: a long brass telescope on a wooden tripod.<br><br>“Tonight we will look at Saturn,” Grandpa promised on her first evening. But when darkness fell, clouds rolled in from the sea and covered every star. The same thing happened the next night, and the night after that. “This is pointless,” Maya muttered, stamping back downstairs.<br><br>Grandpa did not argue. Instead, he showed her a battered notebook, its pages filled with dates and small sketches. “Every clear night I have ever had,” he said, “and every cloudy one too. Some of the best things in the sky made me wait for weeks. Waiting is part of looking.”<br><br>After that, Maya climbed to the roof with him anyway. On cloudy nights, Grandpa taught her the names of the constellations they would see one day, and how to line up the finder scope on a distant lamp post.<br><br>On the twelfth night, the clouds finally drew back like curtains. Grandpa aimed the telescope, made one tiny adjustment, and stepped aside without a word. Maya pressed her eye to the lens. Hanging in the darkness was a small golden globe, wrapped in perfect, impossible rings.<br><br>She did not shout. She simply watched, and understood why an old man would keep a notebook full of cloudy nights, and wait his whole life for skies like this."}, {"n": "42", "type": "mcq", "section": "Reading Comprehension", "qnum": "4", "stem": "What did Maya finally see through the telescope?", "options": {"A": "The Moon", "B": "A golden planet with rings", "C": "A comet with a long tail", "D": "A distant lamp post"}, "fig": "", "passage": "<strong>Grandpa's Telescope</strong><br><br>When Maya's family moved to the village house where Grandpa lived, the thing she liked best stood under a dust sheet on the roof: a long brass telescope on a wooden tripod.<br><br>“Tonight we will look at Saturn,” Grandpa promised on her first evening. But when darkness fell, clouds rolled in from the sea and covered every star. The same thing happened the next night, and the night after that. “This is pointless,” Maya muttered, stamping back downstairs.<br><br>Grandpa did not argue. Instead, he showed her a battered notebook, its pages filled with dates and small sketches. “Every clear night I have ever had,” he said, “and every cloudy one too. Some of the best things in the sky made me wait for weeks. Waiting is part of looking.”<br><br>After that, Maya climbed to the roof with him anyway. On cloudy nights, Grandpa taught her the names of the constellations they would see one day, and how to line up the finder scope on a distant lamp post.<br><br>On the twelfth night, the clouds finally drew back like curtains. Grandpa aimed the telescope, made one tiny adjustment, and stepped aside without a word. Maya pressed her eye to the lens. Hanging in the darkness was a small golden globe, wrapped in perfect, impossible rings.<br><br>She did not shout. She simply watched, and understood why an old man would keep a notebook full of cloudy nights, and wait his whole life for skies like this."}, {"n": "43", "type": "mcq", "section": "Reading Comprehension", "qnum": "5", "stem": "What lesson does the story teach us?", "options": {"A": "The most wonderful things are worth waiting for", "B": "Old telescopes work better than new ones", "C": "Children should not stay up late", "D": "Cloudy nights are a waste of time"}, "fig": "", "passage": "<strong>Grandpa's Telescope</strong><br><br>When Maya's family moved to the village house where Grandpa lived, the thing she liked best stood under a dust sheet on the roof: a long brass telescope on a wooden tripod.<br><br>“Tonight we will look at Saturn,” Grandpa promised on her first evening. But when darkness fell, clouds rolled in from the sea and covered every star. The same thing happened the next night, and the night after that. “This is pointless,” Maya muttered, stamping back downstairs.<br><br>Grandpa did not argue. Instead, he showed her a battered notebook, its pages filled with dates and small sketches. “Every clear night I have ever had,” he said, “and every cloudy one too. Some of the best things in the sky made me wait for weeks. Waiting is part of looking.”<br><br>After that, Maya climbed to the roof with him anyway. On cloudy nights, Grandpa taught her the names of the constellations they would see one day, and how to line up the finder scope on a distant lamp post.<br><br>On the twelfth night, the clouds finally drew back like curtains. Grandpa aimed the telescope, made one tiny adjustment, and stepped aside without a word. Maya pressed her eye to the lens. Hanging in the darkness was a small golden globe, wrapped in perfect, impossible rings.<br><br>She did not shout. She simply watched, and understood why an old man would keep a notebook full of cloudy nights, and wait his whole life for skies like this."}, {"n": "44", "type": "mcq", "section": "Reading Comprehension", "qnum": "6", "stem": "Why did the writer most likely write this passage?", "options": {"A": "To persuade readers to plant more trees", "B": "To describe the life cycle of a fungus", "C": "To explain how to find your way in a forest", "D": "To explain how trees are connected and share things underground"}, "fig": "", "passage": "<strong>The Hidden Network of the Forest</strong><br><br>Walk through a forest and the trees seem to stand alone, each one silent and separate. Underground, however, something surprising is going on. The roots of neighbouring trees are joined by threads of fungus so fine that a single pinch of soil can hold several kilometres of them.<br><br>The fungus and the trees trade with each other. The fungal threads gather water and minerals from the soil and pass them to the tree roots; in return, the trees send down sugar, which they make in their leaves using sunlight. As much as a quarter of a tree's sugar may go to feed its fungal partners.<br><br>The network does more than trade. Through it, a large old tree, sometimes called a mother tree, can pass sugar to young seedlings growing in deep shade, where there is too little light for them to make enough food of their own. Trees can even send signals through the network: when insects attack one tree, its neighbours may receive a chemical warning and begin making bitter substances in their leaves before a single insect has reached them.<br><br>Researchers who study forests now argue that a wood is less like a crowd of separate plants and more like a single community, sharing food and information underground. Protecting a forest, they say, means protecting not only the trees we can see, but also the hidden network beneath them."}, {"n": "45", "type": "mcq", "section": "Reading Comprehension", "qnum": "7", "stem": "What do the fungal threads pass to the tree roots?", "options": {"A": "Sugar and sunlight", "B": "Water and minerals", "C": "Bitter substances", "D": "Seeds and leaves"}, "fig": "", "passage": "<strong>The Hidden Network of the Forest</strong><br><br>Walk through a forest and the trees seem to stand alone, each one silent and separate. Underground, however, something surprising is going on. The roots of neighbouring trees are joined by threads of fungus so fine that a single pinch of soil can hold several kilometres of them.<br><br>The fungus and the trees trade with each other. The fungal threads gather water and minerals from the soil and pass them to the tree roots; in return, the trees send down sugar, which they make in their leaves using sunlight. As much as a quarter of a tree's sugar may go to feed its fungal partners.<br><br>The network does more than trade. Through it, a large old tree, sometimes called a mother tree, can pass sugar to young seedlings growing in deep shade, where there is too little light for them to make enough food of their own. Trees can even send signals through the network: when insects attack one tree, its neighbours may receive a chemical warning and begin making bitter substances in their leaves before a single insect has reached them.<br><br>Researchers who study forests now argue that a wood is less like a crowd of separate plants and more like a single community, sharing food and information underground. Protecting a forest, they say, means protecting not only the trees we can see, but also the hidden network beneath them."}, {"n": "46", "type": "mcq", "section": "Reading Comprehension", "qnum": "8" The roots of neighbouring trees are joined by threads of fungus so fine that a single pinch of soil can hold several kilometres of them.<br><br>The fungus and the trees trade with each other. The fungal threads gather water and minerals from the soil and pass them to the tree roots; in return, the trees send down sugar, which they make in their leaves using sunlight. As much as a quarter of a tree's sugar may go to feed its fungal partners.<br><br>The network does more than trade. Through it, a large old tree, sometimes called a mother tree, can pass sugar to young seedlings growing in deep shade, where there is too little light for them to make enough food of their own. Trees can even send signals through the network: when insects attack one tree, its neighbours may receive a chemical warning and begin making bitter substances in their leaves before a single insect has reached them.<br><br>Researchers who study forests now argue that a wood is less like a crowd of separate plants and more like a single community, sharing food and information underground. Protecting a forest, they say, means protecting not only the trees we can see, but also the hidden network beneath them."}, {"n": "i5", "type": "info", "section": "Listening", "title": "Listening", "body": "There are three short recordings: a conversation, an announcement and a phone message. You may play each one up to two times. Answer the questions about each recording before moving on."}, {"n": "g1", "type": "lgroup", "section": "Listening", "audio": "listening1.m4a", "title": "News from School", "items": [{"n": "49", "qnum": "1", "stem": "Why has the bake sale been moved to Thursday?", "options": {"A": "The hall is booked on Friday", "B": "Heavy rain is forecast for Friday", "C": "The head teacher is away", "D": "Not enough cakes were ready"}}, {"n": "50", "qnum": "2", "stem": "Where will the bake sale be held now?", "options": {"A": "In the playground", "B": "In the canteen", "C": "At the school gate", "D": "In the school hall"}}, {"n": "51", "qnum": "3", "stem": "Where should pupils take their cakes on Thursday morning?", "options": {"A": "To the staff room, before half past eight", "B": "Straight to the hall", "C": "To their classroom", "D": "To the playground"}}, {"n": "52", "qnum": "4", "stem": "Why is Katie pleased that the date has changed?", "options": {"A": "She prefers baking on Wednesdays", "B": "She wants it to rain", "C": "She is at the dentist on Friday, so now she will not miss the sale", "D": "She needs more time to bake"}}]}, {"n": "g2", "type": "lgroup", "section": "Listening", "audio": "listening2.m4a", "title": "An Announcement", "items": [{"n": "53", "qnum": "5", "stem": "When is school photo day?", "options": {"A": "Next Tuesday", "B": "Next Thursday", "C": "Tomorrow", "D": "Next Monday"}}, {"n": "54", "qnum": "6", "stem": "What should pupils wear on photo day?", "options": {"A": "PE kit", "B": "Their house T-shirt", "C": "Full winter uniform", "D": "Their own clothes"}}, {"n": "55", "qnum": "7", "stem": "Where will the photos be taken this year?", "options": {"A": "In the hall, as usual", "B": "In each classroom", "C": "On the playground", "D": "In the library"}}]}, {"n": "g3", "type": "lgroup", "section": "Listening", "audio": "listening3.m4a", "title": "A Phone Message", "items": [{"n": "56", "qnum": "8", "stem": "What is the theme of the painting competition?", "options": {"A": "My School", "B": "My Hong Kong", "C": "My Family", "D": "The Four Seasons"}}, {"n": "57", "qnum": "9", "stem": "By when must paintings reach the art room?", "options": {"A": "Monday's assembly", "B": "Next Wednesday", "C": "Friday after school", "D": "Friday lunchtime"}}, {"n": "58", "qnum": "10", "stem": "Where should pupils write their name and class?", "options": {"A": "On the back of the painting", "B": "On the front, at the bottom", "C": "On a separate card", "D": "On the envelope"}}]}, {"n": "i6", "type": "info", "section": "Writing", "title": "Writing", "body": "You will see two writing tasks. Choose ONE and type your answer in the box. Aim for about 80-130 words: plan briefly, write in clear paragraphs, and check your spelling and punctuation."}, {"n": "59", "type": "writing", "section": "Writing", "intro": "Choose ONE of the two tasks below and type your answer in the box. Aim for about 80-130 words.", "body": "Task 1: Describe a festival or celebration that you enjoy with your family. Describe what you see, hear and taste, and explain what makes it special for your family.\n\nTask 2: Some schools want to replace printed textbooks with tablets. Do you think this is a good idea? Give reasons and examples to support your opinion.", "hint": "Start by saying which task you chose. Plan briefly, write in clear paragraphs, and leave a minute to check your spelling and punctuation.", "placeholder": "Type your answer here; it will be saved for review…"}, {"n": "i7", "type": "info", "section": "Speaking", "title": "Speaking", "body": "In this final section you will record a short audio introduction of yourself. Find a quiet spot, allow microphone access when your browser asks, and speak clearly and naturally."}, {"n": "60", "type": "speaking", "section": "Speaking", "stem": "Record a short spoken introduction of yourself (about 60-90 seconds).", "body": "Speak about:\n• Your name, your age and your current school\n• A place you would love to visit one day, and why\n• A time you helped someone, and how it made you feel\n• One question you would like to ask the teachers at your new school\n\nSpeak naturally; this is a chance for your future school to hear you, not a memory test."}, {"n": "i8", "type": "info", "section": "中文閱讀 Chinese Reading", "title": "中文閱讀 Chinese Reading", "body": "<div class=\"zhblk\"><div class=\"zhh\">繁體中文</div><div>細心閱讀下面的文章，然後回答問題。文章和題目以繁體為主，附簡體對照。</div></div><div class=\"zhblk\"><div class=\"zhh\">簡體中文</div><div>细心阅读下面的文章，然后回答问题。文章和题目以繁体为主，附简体对照。</div></div>"}, {"n": "61", "type": "mcq", "section": "中文閱讀 Chinese Reading", "qnum": "1", "stem": "「我」為什麼開始在陽台上種番茄？<br><i>“我”为什么开始在阳台上种番茄？</i>", "options": {"A": "因為老師佈置的作業<br><i>因为老师布置的作业</i>", "B": "因為爸爸帶回番茄苗讓「我」種<br><i>因为爸爸带回番茄苗让“我”种</i>", "C": "因為「我」想吃番茄<br><i>因为“我”想吃番茄</i>", "D": "因為陳婆婆送來種子<br><i>因为陈婆婆送来种子</i>"}, "fig": "", "passage": "<div class=\"zhblk\"><div class=\"zhh\">繁體中文</div><div>今年春天，爸爸帶回幾棵番茄苗，讓我在陽台上種。起初我覺得很麻煩：每天放學要澆水、鬆土，星期天還要施肥。有一次我偷懶，兩天沒有澆水，葉子便垂了下來，我嚇得連忙補救。<br><br>從那天起，我每天都認真照顧它們，還把觀察到的變化記在小本子上：先開出小黃花，然後結出綠色的小果子，最後果子慢慢變紅。<br><br>摘下第一批番茄那天，我送了幾個給隔壁的陳婆婆。她笑着說：「自己種的，一定特別甜。」我點點頭。原來耐心付出以後，收穫的不只是果實，還有分享的快樂。</div></div><div class=\"zhblk\"><div class=\"zhh\">簡體中文</div><div>今年春天，爸爸带回几棵番茄苗，让我在阳台上种。起初我觉得很麻烦：每天放学要浇水、松土，星期天还要施肥。有一次我偷懒，两天没有浇水，叶子便垂了下来，我吓得连忙补救。<br><br>从那天起，我每天都认真照顾它们，还把观察到的变化记在小本子上：先开出小黄花，然后结出绿色的小果子，最后果子慢慢变红。<br><br>摘下第一批番茄那天，我送了几个给隔壁的陈婆婆。她笑着说：“自己种的，一定特别甜。”我点点头。原来耐心付出以后，收获的不只是果实，还有分享的快乐。</div></div>"}, {"n": "62", "type": "mcq", "section": "中文閱讀 Chinese Reading", "qnum": "2", "stem": "「我」偷懶兩天沒澆水，番茄苗變得怎樣？<br><i>“我”偷懒两天没浇水，番茄苗变得怎样？</i>", "options": {"A": "開出了小黃花<br><i>开出了小黄花</i>", "B": "長得更高了<br><i>长得更高了</i>", "C": "果子變紅了<br><i>果子变红了</i>", "D": "葉子垂了下來<br><i>叶子垂了下来</i>"}, "fig": "", "passage": "<div class=\"zhblk\"><div class=\"zhh\">繁體中文</div><div>今年春天，爸爸帶回幾棵番茄苗，讓我在陽台上種。起初我覺得很麻煩：每天放學要澆水、鬆土，星期天還要施肥。有一次我偷懶，兩天沒有澆水，葉子便垂了下來，我嚇得連忙補救。<br><br>從那天起，我每天都認真照顧它們，還把觀察到的變化記在小本子上：先開出小黃花，然後結出綠色的小果子，最後果子慢慢變紅。<br><br>摘下第一批番茄那天，我送了幾個給隔壁的陳婆婆。她笑着說：「自己種的，一定特別甜。」我點點頭。原來耐心付出以後，收穫的不只是果實，還有分享的快樂。</div></div><div class=\"zhblk\"><div class=\"zhh\">簡體中文</div><div>今年春天，爸爸带回几棵番茄苗，让我在阳台上种。起初我觉得很麻烦：每天放学要浇水、松土，星期天还要施肥。有一次我偷懒，两天没有浇水，叶子便垂了下来，我吓得连忙补救。<br><br>从那天起，我每天都认真照顾它们，还把观察到的变化记在小本子上：先开出小黄花，然后结出绿色的小果子，最后果子慢慢变红。<br><br>摘下第一批番茄那天，我送了几个给隔壁的陈婆婆。她笑着说：“自己种的，一定特别甜。”我点点头。原来耐心付出以后，收获的不只是果实，还有分享的快乐。</div></div>"}, {"n": "63", "type": "mcq", "section": "中文閱讀 Chinese Reading", "qnum": "3", "stem": "文中「補救」的意思最接近：<br><i>文中“补救”的意思最接近：</i>", "options": {"A": "設法把出了問題的事糾正過來<br><i>设法把出了问题的事纠正过来</i>", "B": "把植物拔掉重新再種<br><i>把植物拔掉重新再种</i>", "C": "向別人道歉<br><i>向别 /* UK/HK-international year group from DOB: age on 1 September of the current
   school year, minus 4 (Year 1 = age 5-6, September cut-off). */
function yearFromDob(dobStr){
  const d=new Date(dobStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const now=new Date();
  const sy = now.getMonth()>=8 ? now.getFullYear() : now.getFullYear()-1;
  let age = sy - d.getFullYear();
  if(d.getMonth()>8 || (d.getMonth()===8 && d.getDate()>1)) age--;   // birthday after 1 Sep
  const yr = age - 4;
  return (yr>=1 && yr<=13) ? yr : null;
}
let startTs = null;
let secEnd = null;             // epoch ms deadline of the CURRENT section
let curSec = null;             // current section name
let recs = {};                 // question n -> {b64, mime, secs, left}
let submitted = false;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(s/60),ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function secConf(name){ for(const s of SECTIONS){ if(s.name===name) return s; } return null; }
function activeSections(){ return SECTIONS; }

function buildFlow(){
  const names = activeSections().map(s=>s.name);
  FLOW = QUESTIONS.filter(q=>names.indexOf(q.section)>=0);
  secStarts = {};
  FLOW.forEach((q,i)=>{ if(!(q.section in secStarts)) secStarts[q.section]=i; });
}
function sectionOf(i){ return FLOW[i] ? FLOW[i].section : null; }
function nextSectionStart(i){
  const cur = sectionOf(i);
  for(let j=i+1;j<FLOW.length;j++){ if(FLOW[j].section!==cur) return j; }
  return -1;
}

/* ---------- persistence (refresh cannot reset the clock) ---------- */
function persist(){
  if(submitted) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({
    student, idx, secEnd, curSec, answers, texts, startTs
  })); }catch(e){}
}
function restore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !s.startTs || s.idx==null || s.idx<0) return false;
    student=s.student||student; idx=s.idx;
    secEnd=s.secEnd; curSec=s.curSec; answers=s.answers||{}; texts=s.texts||{};
    startTs=s.startTs;
    buildFlow();
    // deadline passed while the tab was closed: advance until inside a live section
    while(secEnd!=null && Date.now()>secEnd){
      const nx=nextSectionStart(idx);
      if(nx<0){ submit(true); return true; }
      idx=nx; enterSection(sectionOf(idx));
    }
    return true;
  }catch(e){ return false; }
}
function clearStore(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

/* ---------- timer ---------- */
function enterSection(name){
  const c=secConf(name);
  curSec=name;
  secEnd=Date.now()+(c?c.minutes:5)*60000;
  persist();
}
function tick(){
  if(idx<0||submitted||secEnd==null){ timerEl.textContent=''; return; }
  const rem=secEnd-Date.now();
  timerEl.textContent=(curSec?curSec+' · ':'')+fmtTime(rem);
  timerEl.className='timer'+(rem<30000?' crit':(rem<120000?' warn':''));
  if(rem<=0) advanceSection(true);
}
setInterval(tick,500);

function stopAllAudio(){
  Object.values(players).forEach(st=>{ if(st.el){ try{st.el.pause();}catch(e){} st.el=null; } st.playing=false; });
}
function advanceSection(timedOut){
  stopRecorderIfRunning(); stopAllAudio();
  const q=FLOW[idx]; if(q) saveText(q);
  const nx=nextSectionStart(idx);
  if(nx<0){ submit(true); return; }
  idx=nx;
  enterSection(sectionOf(idx));
  render();
}

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/FLOW.length)*100); prog.style.width=pct+'%'; }

/* ---------- start gate ---------- */
function planRows(){
  return activeSections().map(s=>`<tr><td>${esc(s.name)}</td><td>${s.minutes} min</td></tr>`).join('');
}
function renderStart(){
  setProg();
  const total = activeSections().reduce((a,s)=>a+s.minutes,0);
  card.innerHTML = `
    <h1>HKS Baseline Assessment · Level B Bilingual (V3)</h1>
    <p class="info-body">This assessment is <b>timed</b>. Each section has its own time limit and moves on automatically when time is up. You can go back to questions <b>within</b> the current section, but you cannot return to a finished section. Some sections ask you to <b>listen to recordings</b> or to <b>record your voice</b>, so please use a device with a speaker and a microphone.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="field"><label>Current school <span style="color:#c0392b">*</span></label><input id="sch" placeholder="e.g. St Joseph's Primary School" value="${esc(student.school||'')}"></div>
    <div class="field"><label>Student's date of birth <span style="color:#c0392b">*</span></label>
      <input id="dob" type="date" min="2005-01-01" max="2023-12-31" value="${esc(student.dob||'')}"></div>
    <div class="field"><label>Current year / grade level <span style="color:#c0392b">*</span></label>
      <input id="yr" placeholder="e.g. Year 5, Grade 4 or P5" value="${esc(student.year||'')}">
      <div class="hint">${BAND_LABEL} is designed for students currently in ${YEAR_SPAN}.</div></div>
    <table class="secplan" id="plan">${planRows()}</table>
    <p class="info-body" style="color:var(--muted);font-size:13px">Total: <b id="tot">${total}</b> minutes. The timer starts as soon as you press Begin.</p>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  const dobEl=document.getElementById('dob');
  const yrEl=document.getElementById('yr');
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    student.school=(document.getElementById('sch').value||'').trim();
    student.dob=(dobEl.value||'').trim();
    student.year=(yrEl.value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    if(!student.school){ err.textContent="Please enter the student's current school."; document.getElementById('sch').focus(); return; }
    if(!student.dob){
      err.textContent="Please enter the student's date of birth."; dobEl.focus(); return;
    }
    if(!student.year){ err.textContent='Please enter the current year / grade level.'; yrEl.focus(); return; }
    buildFlow();
    startTs=Date.now(); idx=0;
    enterSection(sectionOf(0));
    render();
  };
}

/* ---------- question rendering ---------- */
function render(){
  if(idx<0){ renderStart(); return; }
  if(submitted) return;
  setProg();
  const q=FLOW[idx];
  let body='';
  const secLabel = q.section? `<span class="sec">${esc(q.section)}</span>`:'<span></span>';
  if(q.type==='info'){
    const c=secConf(q.section);
    body=`<div class="sec">Section · ${c?c.minutes+' minutes':''}</div><h1>${esc(q.title)}</h1><div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`<div class="qhead">${secLabel}</div>`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.body?`<div class="wbody">${esc(q.body)}</div>`:'')
      + `<textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else if(q.type==='speaking'){
    body=renderSpeaking(q);
  } else if(q.type==='lgroup'){
    const subs = q.items.map(it=>{
      const opts = Object.keys(it.options).map(k=>{
        const seld = answers[it.n]===k?' sel':'';
        return `<div class="opt${seld}" data-n="${it.n}" data-k="${k}"><span class="l">${k}</span>${esc(it.options[k])}</div>`;
      }).join('');
      return `<div class="lgq"><div class="qhead"><span></span><span class="qnum">Question ${it.qnum}</span></div>
        <div class="stem">${esc(it.stem)}</div>${opts}</div>`;
    }).join('');
    body=`<div class="qhead"><span class="sec">${esc(q.section)}</span></div>
      <div class="lgtitle">${esc(q.title||'Listening')}</div>
      ${playerHtml(q.audio)}
      ${subs}`;
  } else { // mcq
    const audio = q.audio? playerHtml(q.audio):'';
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const head = `<div class="qhead">${secLabel}${q.qnum?`<span class="qnum">Question ${q.qnum}</span>`:''}</div>`;
    body=`${head}${audio}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div class="fig">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===FLOW.length-1;
  const secFirst = secStarts[q.section];
  const lastInSec = (nextSectionStart(idx)===idx+1) || isLast;
  const nextLabel = isLast?'Finish &amp; submit':(lastInSec?'Finish section':'Next');
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx<=secFirst?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${nextLabel}</button>
    </div>`;
  if(q.type==='mcq'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      persist();
    });
  }
  if(q.type==='lgroup'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      const n=el.dataset.n;
      answers[n]=el.dataset.k;
      el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
      persist();
    });
    wirePlayer(q.audio);
  }
  if(q.type==='mcq' && q.audio) wirePlayer(q.audio);
  if(q.type==='speaking') wireSpeaking(q);
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{
    saveText(q);
    if(isLast){ submit(false); }
    else if(lastInSec){ advanceSection(false); }
    else { idx++; render(); }
  };
  persist();
}
function saveText(q){ if(q.type==='writing'){ const t=document.getElementById('ta'); if(t) texts[q.n]=t.value; persist(); } }

/* ---------- limited listening player (big play/pause, 2 plays, no seeking) ---------- */
const players = {};   // audio file -> {el, playsLeft, playing}
function playerState(src){ if(!players[src]) players[src]={el:null, playsLeft:2, playing:false}; return players[src]; }
function playerHtml(src){
  const st=playerState(src);
  return `<div class="playwrap">
    <button class="playbtn" id="playBtn" ${st.playsLeft<=0&&!st.playing?'disabled':''}>${st.playing?'&#10074;&#10074;':'&#9654;'}</button>
    <div class="playinfo"><b>${st.playing?'Playing…':'Press play and listen carefully.'}</b><br>
      <span id="playsLeft">${st.playsLeft>0?`You can play this recording ${st.playsLeft} more time${st.playsLeft===1?'':'s'}.`:'No plays left.'}</span></div>
  </div>`;
}
function wirePlayer(src){
  const btn=document.getElementById('playBtn');
  if(!btn) return;
  const st=playerState(src);
  btn.onclick=()=>{
    if(st.playing){ if(st.el) st.el.pause(); st.playing=false; render(); return; }
    if(!st.el || st.el.ended || st.el.currentTime===0){
      if(st.playsLeft<=0) return;
      st.playsLeft--;
      st.el=new Audio(src);
      st.el.onended=()=>{ st.playing=false; st.el=null; if(FLOW[idx]&&(FLOW[idx].audio===src)) render(); };
    }
    st.el.play();
    st.playing=true;
    render();
  };
}

/* ---------- audio recorder (per-question; a paper can have several) ---------- */
let mediaStream=null, recorder=null, chunks=[], recTimer=null, recStart=0, recN=null;
function recOf(n){ if(!recs[n]) recs[n]={b64:"",mime:"",secs:0,left:1}; return recs[n]; }
function renderSpeaking(q){
  const r=recOf(q.n);
  const maxS=q.maxSeconds||RECORD_MAX_S;
  return `<div class="qhead"><span class="sec">${esc(q.section)}</span></div>
    <div class="stem">${esc(q.stem)}</div>
    ${q.body?`<div class="wbody">${esc(q.body)}</div>`:''}
    <div class="recwrap" id="recwrap">
      ${r.b64
        ? `<div class="recstate ok" style="color:#1e7a46;font-weight:700">✓ Recording saved (${r.secs}s)</div>
           <audio controls src="${r.b64}"></audio>
           ${r.left>0?`<button class="prev" id="reRecBtn">Record again (${r.left} left)</button>`:''}`
        : `<button class="recbtn" id="recBtn">● Start recording</button>
           <div class="recstate" id="recState">Press the button and speak clearly. Up to ${maxS} seconds.</div>`}
      <div class="err" id="recErr"></div>
    </div>
    <p class="hint">If your microphone is blocked or unavailable, you can continue; your tutor will arrange this part separately.</p>`;
}
function wireSpeaking(q){
  const r=recOf(q.n);
  const maxS=q.maxSeconds||RECORD_MAX_S;
  const btn=document.getElementById('recBtn');
  const reBtn=document.getElementById('reRecBtn');
  if(reBtn) reBtn.onclick=()=>{ r.left--; r.b64=''; r.mime=''; r.secs=0; render(); };
  if(!btn) return;
  btn.onclick=async()=>{
    if(recorder && recorder.state==='recording'){ stopRecorderIfRunning(); return; }
    const errEl=document.getElementById('recErr');
    try{
      mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){ errEl.textContent='Microphone unavailable ('+(e.name||'error')+'). You can continue to the next step.'; return; }
    chunks=[]; recN=q.n;
    const mime = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus'
               : (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : '';
    try{ recorder = mime? new MediaRecorder(mediaStream,{mimeType:mime}) : new MediaRecorder(mediaStream); }
    catch(e){ errEl.textContent='Recording is not supported in this browser. You can continue.'; return; }
    recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      const rr=recOf(recN);
      rr.mime=blob.type; rr.secs=Math.round((Date.now()-recStart)/1000);
      const fr=new FileReader();
      fr.onload=()=>{ rr.b64=String(fr.result||''); render(); };
      fr.readAsDataURL(blob);
      if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
    };
    recStart=Date.now();
    recorder.start();
    btn.textContent='■ Stop recording'; btn.classList.add('stop');
    const st=document.getElementById('recState');
    recTimer=setInterval(()=>{
      const sElapsed=Math.round((Date.now()-recStart)/1000);
      if(st) st.innerHTML='<b>● Recording…</b> '+sElapsed+'s / '+maxS+'s';
      if(sElapsed>=maxS) stopRecorderIfRunning();
    },250);
  };
}
function stopRecorderIfRunning(){
  if(recTimer){ clearInterval(recTimer); recTimer=null; }
  if(recorder && recorder.state==='recording'){ try{ recorder.stop(); }catch(e){} }
  else if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
}

/* ---------- figures to PNG for the review PDF ---------- */
function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<FLOW.length;i++){ var q=FLOW[i];
  if(!q.fig) continue;
  var m=q.fig.match(/src="(data:image\/[^"]+)"/);          // engine PNGs pass straight through
  if(m){ figs[q.n]=m[1]; continue; }
  if(/<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

/* ---------- submit (awaited, with retry) ---------- */
async function submit(auto){
  if(submitted) return;
  submitted=true; secEnd=null; stopRecorderIfRunning();
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">${auto?'Time is up, submitting':'Submitting'} your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = [];
  FLOW.forEach(function(q){
    if(q.type==='lgroup'){
      q.items.forEach(function(it){ qslim.push({n:it.n,type:'mcq',section:q.section,stem:it.stem,options:it.options,qnum:it.qnum}); });
    } else {
      qslim.push({n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,intro:q.intro,body:(q.type==='writing'||q.type==='speaking')?q.body:undefined});
    }
  });
  const audios = FLOW.filter(q=>q.type==='speaking').map(q=>{
    const r=recs[q.n]||{};
    return {n:q.n, section:q.section, b64:r.b64||'', mime:r.mime||'', seconds:r.secs||0};
  });
  const payload={ type:"baseline", band:BAND, bandLabel:BAND_LABEL, version:VERSION,
    name:student.name, email:student.email, school:student.school,
    dob:student.dob, dobYear:(yearFromDob(student.dob)!=null?'Year '+yearFromDob(student.dob):''),
    yearGroup:student.year,
    allowedMinutes: activeSections().reduce((a,s)=>a+s.minutes,0),
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0,
    answers, texts, questions:qslim, figs, audios };
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    await res.text();
    clearStore();
    card.innerHTML = `<div class="center">
      <div class="big ok">✓</div>
      <h1>Submitted</h1>
      <p class="info-body">Thank you, ${esc(student.name)}. Your responses${audios.some(a=>a.b64)?' and recordings':''} have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
    </div>`;
    prog.style.width='100%';
  }catch(e){
    card.innerHTML = `<div class="center">
      <div class="big" style="color:var(--red)">!</div>
      <h1>Submission failed</h1>
      <p class="info-body">Your answers are safe on this page. Please check your internet connection, then press Retry.</p>
      <div class="nav" style="justify-content:center"><button class="submit" id="retryBtn">Retry submission</button></div>
    </div>`;
    document.getElementById('retryBtn').onclick=()=>{ submitted=false; submit(auto); };
  }
}

/* ---------- boot: explicit resume screen ---------- */
buildFlow();
if(restore() && !submitted && idx>=0){
  card.innerHTML = `<div class="center">
    <h1>Welcome back${student.name?', '+esc(student.name):''}</h1>
    <p class="info-body">You have a test in progress on this device. The section timer continued while you were away.</p>
    <div class="nav" style="justify-content:center;gap:14px">
      <button class="prev" id="restartBtn">Start again</button>
      <button class="submit" id="resumeBtn">Continue my test</button>
    </div></div>`;
  document.getElementById('resumeBtn').onclick=()=>{ render(); };
  document.getElementById('restartBtn').onclick=()=>{
    clearStore();
    idx=-1; secEnd=null; curSec=null; startTs=null;
    for(const k in answers) delete answers[k];
    for(const k in texts) delete texts[k];
    render();
  };
} else { render(); }
</script>
</body>
</html>
