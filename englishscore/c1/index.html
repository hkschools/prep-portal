<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishScore Practice Test C1</title>
<script src="../config.js"></script>
<style>
:root{--teal:#14746b;--navy:#2d0a54;--ink:#1c2733;--line:#e3e6ea;--ok:#1a9e6b;--no:#d23a3a;--lvl:#19c6a6;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f6f8;line-height:1.55}
header{background:var(--teal);color:#fff;padding:16px 20px}
header .wrap{max-width:720px;margin:0 auto}
header .crumb{font-size:13px;opacity:.85}
header .crumb a{color:#fff}
header h1{margin:5px 0 0;font-size:20px}
.chip{display:inline-block;background:var(--lvl);color:#fff;font-weight:700;border-radius:5px;padding:2px 9px;font-size:14px;vertical-align:middle}
.progwrap{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:12px;overflow:hidden}
.progbar{height:100%;width:0;background:#fff;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:22px 16px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 22px;margin:0 0 14px}
.field{margin:0 0 16px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:16px}
.field input:focus{outline:none;border-color:var(--teal)}
.field .err{color:var(--no);font-size:13px;margin-top:5px;display:none}
.field.bad input{border-color:var(--no)}
.field.bad .err{display:block}
.meta{font-size:12px;color:#8a94a0;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.title{font-weight:700;font-size:18px;margin:4px 0 12px}
.body{white-space:pre-wrap;margin:6px 0 12px;font-size:15.5px}
.passage{background:#f7f8fa;border-left:3px solid var(--teal);border-radius:6px;padding:12px 15px;margin:6px 0 14px;font-size:15px;white-space:pre-wrap}
.prompt{font-weight:600;margin:10px 0 10px}
audio{width:100%;margin:4px 0 14px}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:9px 0;cursor:pointer;font-size:16px}
.opt:hover{border-color:#9aa4af}
.opt.sel{border-color:var(--teal);background:#eef7f5}
.opt input{margin-right:10px}
.opt.correct{border-color:var(--ok);background:#eafaf2}
.opt.wrong{border-color:var(--no);background:#fdeced}
.order .sent{border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin:7px 0;font-size:15px}
.order .sent b{color:var(--navy)}
.order .picks{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.order .picks label{font-size:13px;font-weight:600}
.order select{display:block;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.note{font-size:14px;color:#5a6573}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px}
.bar .inner{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .count{font-size:13px;color:#6b7682;font-weight:600;margin-right:auto}
button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:12px 22px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--teal);color:#fff}
.btn-ghost{background:#eef1f4;color:var(--ink)}
.result{background:var(--navy);color:#fff;border-radius:14px;padding:22px 24px;margin:0 0 16px}
.result .pct{font-size:36px;font-weight:800}
.result .sub{font-size:15px;opacity:.92;margin-top:6px}
.sent-note{background:#eafaf2;border:1px solid #bfe9d4;border-radius:10px;padding:12px 15px;font-size:14px;margin:0 0 16px}
.rev .meta2{font-size:12px;color:#8a94a0;font-weight:600}
.fb{margin-top:10px;font-size:14px;border-radius:8px;padding:10px 12px}
.fb.right{background:#eafaf2;border:1px solid #bfe9d4}
.fb.wrong{background:#fdeced;border:1px solid #f3c6c6}
.fb .tag{font-weight:700}
.fb details{margin-top:7px}
.fb summary{cursor:pointer;color:var(--teal);font-weight:600}
.fb .tr{white-space:pre-wrap;font-size:13.5px;margin-top:6px;color:#42505e}
.footer{font-size:12px;color:#8a94a0;margin-top:24px;text-align:center}
.footer a{color:#6b7682}
</style>
</head>

<script>
const DATA = [{"id": "C1-G-01", "skill": "grammar", "num": 1, "format": "mcq", "title": "Celebrating a workplace deal", "body": "A: Congratulations! I hear you've managed to obtain a new contract. / B: Yes, not only _____ a new contract, but the customer has also recommended us to another large organisation.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "we didn't get", "B": "did we get", "C": "we did get"}, "answer": "B", "explanation": "After a negative or limiting phrase like 'not only' at the start, we use inversion: auxiliary before subject ('did we get'). 'we did get' keeps normal order, so it is wrong after 'not only'.", "audio_url": "", "transcript": ""}, {"id": "C1-G-02", "skill": "grammar", "num": 2, "format": "mcq", "title": "A new employee", "body": "A: What shall I have Agata do? It's her first day. / B: Let's get her _____ the email to send out to prospective buyers. I'll check it once she's done.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "drafted", "B": "draft", "C": "drafting"}, "answer": "C", "explanation": "The causative 'get someone doing something' uses the '-ing' form ('get her drafting') to mean start her doing the task. 'draft' (bare infinitive) is used after 'have' or 'make', not after 'get'.", "audio_url": "", "transcript": ""}, {"id": "C1-G-03", "skill": "grammar", "num": 3, "format": "mcq", "title": "Regrets about a choice", "body": "A: I can't believe you booked a flight with them. They're notorious for terrible customer service. / B: Well, I didn't know that, did I? _____ , I would have flown with someone else.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "Had I known", "B": "Unless I knew", "C": "If knowing"}, "answer": "A", "explanation": "This is inverted third conditional: 'Had I known' replaces 'If I had known' to express past regret. 'Unless I knew' changes the meaning and uses the wrong tense for an unreal past situation.", "audio_url": "", "transcript": ""}, {"id": "C1-G-04", "skill": "grammar", "num": 4, "format": "mcq", "title": "Conversation about clinic visit", "body": "A: Your appointment at the blood clinic isn't while we're away, is it? / B: Not sure. That's something I'd better _____ straight away.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "check it up on", "B": "check up on", "C": "check up on it"}, "answer": "B", "explanation": "With the three-part phrasal verb 'check up on', the object is the relative pronoun 'that/something' already at the front, so no extra 'it' is added ('something I'd better check up on'). Options A and C wrongly insert 'it' when the object is already mentioned.", "audio_url": "", "transcript": ""}, {"id": "C1-G-05", "skill": "grammar", "num": 5, "format": "mcq", "title": "Project manager's announcement", "body": "It will be difficult to keep within the budget. _____ for further finances to finish the project.", "question": "Choose the correct word to complete the text.", "options": {"A": "Inevitably we will have to apply", "B": "We will have to apply inevitably", "C": "We will have inevitably to apply"}, "answer": "A", "explanation": "A sentence adverb like 'inevitably' naturally goes at the front of the sentence to comment on the whole idea. Option C wrongly splits 'have to', and option B puts the adverb in an awkward end position.", "audio_url": "", "transcript": ""}, {"id": "C1-G-06", "skill": "grammar", "num": 6, "format": "mcq", "title": "Response to customer email", "body": "Thank you for getting in touch. _____ during our phone call earlier today, our company can cover your event. We will just need a 50% deposit.", "question": "Choose the correct word to complete the text.", "options": {"A": "As it was mentioned", "B": "As mentioned", "C": "As it mentioned"}, "answer": "B", "explanation": "'As mentioned' is a reduced passive clause, the standard fixed phrase for referring to something said before. Adding 'it' ('As it was mentioned') is unnecessary and not idiomatic here.", "audio_url": "", "transcript": ""}, {"id": "C1-G-07", "skill": "grammar", "num": 7, "format": "mcq", "title": "Bad cat", "body": "My neighbour's cat is always coming into my garden, and even my house. There _____ to be a law preventing it.", "question": "Choose the correct word to complete the text.", "options": {"A": "had", "B": "need", "C": "ought"}, "answer": "C", "explanation": "'ought to' is a modal expressing what is right or desirable ('there ought to be a law'). 'need' and 'had' do not combine with 'to be' in this fixed 'ought to' structure to give this meaning.", "audio_url": "", "transcript": ""}, {"id": "C1-G-08", "skill": "grammar", "num": 8, "format": "mcq", "title": "Font suggestion", "body": "I really like the presentation so far, but _____ I suggest we steer clear of vibrant colours for the font? They tend to distract, so I think black is better.", "question": "Choose the correct word to complete the text.", "options": {"A": "might", "B": "should", "C": "would"}, "answer": "A", "explanation": "'might I suggest' is a very polite, tentative way to make a suggestion. 'should I' asks for advice and 'would I' is not a natural way to open a polite suggestion here.", "audio_url": "", "transcript": ""}, {"id": "C1-G-09", "skill": "grammar", "num": 9, "format": "mcq", "title": "Car insurance", "body": "You need to be especially careful _____ a car on holiday in a foreign country. What is covered by insurance may vary from country to country.", "question": "Choose the correct word to complete the text.", "options": {"A": "to rent", "B": "if renting", "C": "when rented"}, "answer": "B", "explanation": "'if renting' is a reduced conditional clause meaning 'if you rent', which fits the active sense (you do the renting). 'when rented' is passive and wrongly suggests the person is rented, not the car.", "audio_url": "", "transcript": ""}, {"id": "C1-G-10", "skill": "grammar", "num": 10, "format": "mcq", "title": "Report for management", "body": "_____ in the conclusion are the three main action points that need to be addressed by senior management as soon as possible.", "question": "Choose the correct word to complete the text.", "options": {"A": "Highlight", "B": "Highlighting", "C": "Highlighted"}, "answer": "C", "explanation": "This is a fronted past participle in a passive inversion ('Highlighted ... are the three points'), meaning the points have been highlighted. 'Highlighting' (active '-ing') would wrongly mean the points are doing the highlighting.", "audio_url": "", "transcript": ""}, {"id": "C1-G-11", "skill": "grammar", "num": 11, "format": "mcq", "title": "Successful project", "body": "The statistical analysis project is now almost finished, which is fantastic news. It _____ much less time to complete than anticipated.", "question": "Choose the correct word to complete the text.", "options": {"A": "takes", "B": "will have taken", "C": "will have been taking"}, "answer": "B", "explanation": "The future perfect ('will have taken') looks back from the point of completion to view the whole finished time period. 'takes' (present simple) cannot express this completed-by-a-future-point meaning.", "audio_url": "", "transcript": ""}, {"id": "C1-G-12", "skill": "grammar", "num": 12, "format": "mcq", "title": "Fashion talk", "body": "Mr Glover mentioned he was a fan of the latest fashions. Well, of course! After all, in the entertainment business, _____ ?", "question": "Choose the correct word to complete the text.", "options": {"A": "who wouldn't", "B": "who doesn't", "C": "who isn't"}, "answer": "C", "explanation": "The rhetorical question uses 'be' to match 'he was a fan' ('who isn't a fan?'). Options with 'wouldn't' or 'doesn't' need a different verb and do not agree with the linking verb 'is/was' used here.", "audio_url": "", "transcript": ""}, {"id": "C1-V-01", "skill": "vocabulary", "num": 1, "format": "mcq", "title": "A new deal", "body": "They’re accepting _____ for the new stadium contract.\nReally? Let’s put one in. It would be great for us if we get accepted.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "pacts", "B": "bids", "C": "bonds"}, "answer": "B", "explanation": "A 'bid' is a formal offer to do work for a stated price, so companies 'put in a bid' to win a contract. A 'pact' is an agreement between two sides and is not something you submit to compete for a contract.", "audio_url": "", "transcript": ""}, {"id": "C1-V-02", "skill": "vocabulary", "num": 2, "format": "mcq", "title": "A true talent", "body": "How is it Frank never gets these amounts mixed up? It’s so confusing!\nI know what you mean. I just think he’s got a real _____ for this kind of thing.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "gift", "B": "power", "C": "faculty"}, "answer": "A", "explanation": "A 'gift' here means a natural talent or special ability, and 'a gift for something' is a common phrase for being naturally good at it. 'Power' means strength or control, not a natural skill, so it does not fit 'a real _____ for this kind of thing'.", "audio_url": "", "transcript": ""}, {"id": "C1-V-03", "skill": "vocabulary", "num": 3, "format": "mcq", "title": "Partnership agreement", "body": "Are you ready to sign the contract for our partnership agreement?\nNo, we can’t accept this _____ allowing you to use our logo on your website.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "query", "B": "clause", "C": "legislation"}, "answer": "B", "explanation": "A 'clause' is a single section or condition within a contract, so refusing one particular clause about the logo makes sense. 'Legislation' means laws made by a government, not a part of a private contract, so it does not fit.", "audio_url": "", "transcript": ""}, {"id": "C1-V-04", "skill": "vocabulary", "num": 4, "format": "mcq", "title": "Impossible to meet", "body": "We need to have a meeting to make a final decision. Have you managed to organise one?\nI’ve tried, but Jorge just doesn’t have any spare _____ in his schedule!", "question": "Choose the correct word to complete the conversation.", "options": {"A": "gaps", "B": "pauses", "C": "slots"}, "answer": "C", "explanation": "A 'slot' is a free period of time set aside in a schedule, so 'a spare slot in his schedule' means free time for the meeting. 'Pauses' are short breaks in an activity, not bookable periods of free time in a timetable.", "audio_url": "", "transcript": ""}, {"id": "C1-V-05", "skill": "vocabulary", "num": 5, "format": "mcq", "title": "A wonderful worker", "body": "I’m so glad we hired Yvie. She’s doing such a great job.\nI agree. I think she’s going to be a huge _____ to the team.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "counterpart", "B": "initiative", "C": "asset"}, "answer": "C", "explanation": "An 'asset' is a valuable person or thing that brings benefit, so 'a huge asset to the team' means someone very useful. A 'counterpart' is a person with the same role in another organisation, which does not describe a helpful team member.", "audio_url": "", "transcript": ""}, {"id": "C1-V-06", "skill": "vocabulary", "num": 6, "format": "mcq", "title": "A new colleague", "body": "What did you think of the new guy?\nI liked him. He’s a bit _____ , but that’s better than not talking at all!", "question": "Choose the correct word to complete the conversation.", "options": {"A": "communicative", "B": "chatty", "C": "conversational"}, "answer": "B", "explanation": "'Chatty' means someone who likes to talk a lot in a friendly, informal way, which suits this casual remark and contrasts with 'not talking at all'. 'Communicative' is more formal and means willing to share information, so it sounds less natural in this relaxed comment.", "audio_url": "", "transcript": ""}, {"id": "C1-V-07", "skill": "vocabulary", "num": 7, "format": "mcq", "title": "More difficult than it seems", "body": "We’ve got the paperwork and it looks like it’s _____ a matter of getting enough signatures.\nIt can’t be that easy, surely. Nothing ever is.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "partially", "B": "presently", "C": "purely"}, "answer": "C", "explanation": "'Purely' means only or simply, so 'purely a matter of getting enough signatures' means nothing else is needed, which fits the idea that it seems easy. 'Presently' means soon or currently and does not give the meaning of 'only'.", "audio_url": "", "transcript": ""}, {"id": "C1-V-08", "skill": "vocabulary", "num": 8, "format": "mcq", "title": "University costs", "body": "Despite protests, university fees are increasing as governments cut _____ for higher education. It is expected that students will have to pay double as of September.", "question": "Choose the correct word to complete the text.", "options": {"A": "supplies", "B": "income", "C": "funding"}, "answer": "C", "explanation": "'Funding' means money provided for a purpose, so cutting funding for education means giving less money, which is why fees rise. 'Income' is money a person or organisation receives, not money the government gives out, so it does not fit 'governments cut _____'.", "audio_url": "", "transcript": ""}, {"id": "C1-V-09", "skill": "vocabulary", "num": 9, "format": "mcq", "title": "After the doctor’s appointment", "body": "According to the consultant, the _____ is quite positive, but I have a muscle injury that will require some time and ample rest to heal.", "question": "Choose the correct word to complete the text.", "options": {"A": "forecast", "B": "perspective", "C": "outlook"}, "answer": "C", "explanation": "'Outlook' means the likely future situation or how things are expected to develop, so 'a positive outlook' fits a prediction about recovery. 'Forecast' is normally used for the weather or economic predictions, not usually for a patient's recovery from a doctor.", "audio_url": "", "transcript": ""}, {"id": "C1-V-10", "skill": "vocabulary", "num": 10, "format": "mcq", "title": "Reading a document", "body": "There was only half an hour to go before the meeting, so Akio quickly _____ through the contract to check the deadlines she had to meet.", "question": "Choose the correct word to complete the text.", "options": {"A": "studied", "B": "scanned", "C": "inspected"}, "answer": "B", "explanation": "To 'scan' means to read quickly to find specific information, which matches reading fast with little time to check the deadlines. 'Studied' means to read slowly and carefully, which is the opposite of 'quickly' with only half an hour left.", "audio_url": "", "transcript": ""}, {"id": "C1-V-11", "skill": "vocabulary", "num": 11, "format": "mcq", "title": "Online news reporting", "body": "News corporations have come under criticism for the number of _____ in their online pieces. It is essential that journalists verify the facts irrespective of the medium they communicate in.", "question": "Choose the correct word to complete the text.", "options": {"A": "inaccuracies", "B": "insecurities", "C": "uncertainties"}, "answer": "A", "explanation": "'Inaccuracies' are mistakes or things that are not correct, which fits the point that journalists must verify the facts. 'Insecurities' are feelings of self-doubt, which makes no sense in news articles, so it does not fit.", "audio_url": "", "transcript": ""}, {"id": "C1-V-12", "skill": "vocabulary", "num": 12, "format": "mcq", "title": "Changes to the neighbourhood", "body": "The local council is building a school next to the new housing development on the _____ that there will be lots of families moving to the area.", "question": "Choose the correct word to complete the text.", "options": {"A": "assumption", "B": "establishment", "C": "occasion"}, "answer": "A", "explanation": "An 'assumption' is something you believe to be true without proof, and 'on the assumption that' means basing a decision on that belief, which fits building a school because families are expected. 'Occasion' means a particular time or event and does not work in the phrase 'on the _____ that'.", "audio_url": "", "transcript": ""}, {"id": "C1-R-01", "skill": "reading", "num": 1, "format": "passageq", "title": "Finding happiness at work", "body": "Throughout their lives, most people are engaged in the pursuit of happiness, both in their personal lives as well as at work. The question of what workplace happiness looks like, however, has puzzled psychologists and career advisors. According to recent research, and contrary to popular belief, being offered a better salary can only help so much. Indeed, there is a host of other factors that can affect workplace happiness, such as the field a person works in, their company or their role. Studies have shown that some fields, such as those involving the care of animals, can make people content in ways other fields simply can’t. Likewise, a sense of community and a cohesive team of co-workers can lift spirits in ways other perks can’t. This will probably come as a surprise to poorly skilled managers, but among most employees, it is common knowledge.", "question": "What is a common misconception according to the text?", "options": {"A": "That offering workers more money makes them happy", "B": "That work benefits are less important than a close-knit team", "C": "That it’s impossible to make people happy in most fields"}, "answer": "A", "explanation": "The phrase 'contrary to popular belief, being offered a better salary can only help so much' identifies the misconception as the idea that more money brings happiness, supporting A. B and C are points the text actually endorses or implies, not beliefs it labels as mistaken.", "audio_url": "", "transcript": ""}, {"id": "C1-R-02", "skill": "reading", "num": 2, "format": "passageq", "title": "Pollution from ships", "body": "Most people are surprised to learn that ships are significant sources of air pollution globally. This is predominantly due to their fuel. Thick, black and scary-looking, “bunker” fuel is made from the remains of the fuel production process and contains high amounts of sulphur. This produces poisonous gases and fine particles that can harm human health and the environment, especially in coastal areas with high levels of traffic. As more evidence points to the risks of burning bunker fuel, the global industry is launching a major change in its fuel supply. Starting in January, the International Maritime Organization will require that all fuels used in ships contain no more than 0.5 per cent sulphur. The cap is a significant reduction from the existing limit of 3.5 per cent. Public health experts estimate that once the sulphur cap takes effect, it would prevent roughly 150,000 early deaths and 7.6 million childhood asthma cases globally each year.", "question": "Why is the change in fuel happening now?", "options": {"A": "There is now enough proof of the harm caused", "B": "There has been enough development in the area", "C": "There is a need for ships to be closer to land"}, "answer": "A", "explanation": "The line 'As more evidence points to the risks of burning bunker fuel, the global industry is launching a major change' shows the change is driven by mounting proof of harm, justifying A. B is unsupported, and C misreads the mention of coastal areas, which describes where pollution is worst, not a reason for the change.", "audio_url": "", "transcript": ""}, {"id": "C1-R-03", "skill": "reading", "num": 3, "format": "passageq", "title": "Job interviews", "body": "While job candidates often focus on preparing for the possible interview questions they’ll be asked, body language is rarely given a thought. However, initial judgements about a person are formed in as little as 20 seconds and are based almost entirely on body language. So how can a candidate ensure they leave a positive impression? Good eye contact communicates confidence, though getting the balance right without coming off as threatening can be tricky. A slight tilt of the head as the interviewer talks shows that the applicant is listening carefully, while leaning in slightly also indicates interest. Finally, avoiding excessive use of gestures while talking encourages interviewers to focus on the words, instead of the body language. All of this may seem obvious, but most candidates get at least one thing wrong, so remember: practice makes perfect.", "question": "What advice does the text give to job candidates?", "options": {"A": "Maintain eye contact throughout the interview", "B": "Rehearse to improve your body language", "C": "Focus on listening carefully instead of talking"}, "answer": "B", "explanation": "The closing advice 'most candidates get at least one thing wrong, so remember: practice makes perfect' tells candidates to rehearse their body language, supporting B. A overstates the eye-contact point, which the text warns must be balanced, and C confuses a single body-language signal with the text's overall recommendation.", "audio_url": "", "transcript": ""}, {"id": "C1-R-04", "skill": "reading", "num": 4, "format": "passageq", "title": "Supermarket activities", "body": "A small chain of food stores in Finland has just celebrated its tenth anniversary, and we have spoken to Managing Director Saara Martinen to find out the key to their success, especially in the face of fierce competition from massive retailers. As she explained, a common customer complaint was always that, even in a recession, many essential foodstuffs were still beyond most budgets: “If I could find a way of dropping those prices and get the message out, then I felt sure those on strict budgets would be interested. We set about a social media campaign and very shortly we had thousands of followers”. So how did Martinen manage to maintain her low prices while keeping the business going? “We came up with the notion of making products available that are close to their so-called best-before dates. This still allows a few more days before they have to be consumed or discarded.”", "question": "To what does Saara Martinen credit the success of her company?", "options": {"A": "Finding a way to source products during a recession", "B": "Identifying and exploiting a gap in the market", "C": "Determining the best approach to social media marketing"}, "answer": "B", "explanation": "Martinen spotted an unmet customer need for affordable essentials and met it by selling near best-before-date goods cheaply, which is identifying and exploiting a gap in the market, supporting B. A and C describe how she delivered and promoted the idea, not the underlying reason she credits for success.", "audio_url": "", "transcript": ""}, {"id": "C1-R-05", "skill": "reading", "num": 5, "format": "passageq", "title": "Rhodes", "body": "In the third century BC, a massive statue was erected on the Mediterranean island of Rhodes. After surviving a long siege, the inhabitants of Rhodes decided to build this extraordinary statue in honour of Helios, one of the gods who ruled over Greece. The statue was said to have needed 12 tons of bronze for its construction. It became known as the ‘Colossus’ for its size, and it took 12 years to complete. Little is known about its manufacture or even its exact size; the Roman writer Pliny the Younger put its height at ‘70 cubits’, around 110 feet. However, we have no idea what the statue looked like or where it was erected. Sadly, the statue was not destined to last. Only fifty years later, an earthquake destroyed most of the city of Rhodes, including the Colossus. The bronze remains were eventually carried away by Syrian scrap merchants several centuries later.", "question": "What do we know for sure about the statue?", "options": {"A": "It was built by a small number of metal workers", "B": "It was erected in the harbour at Rhodes", "C": "Its name reflects an aspect of its appearance"}, "answer": "C", "explanation": "The text states 'It became known as the Colossus for its size', so its name reflects its appearance, which we know for certain, supporting C. A is never mentioned, and B is explicitly unknown since the text says 'we have no idea... where it was erected'.", "audio_url": "", "transcript": ""}, {"id": "C1-R-06", "skill": "reading", "num": 6, "format": "passageq", "title": "What is leadership?", "body": "These days, leadership is a common term in business. A quick search online will reveal thousands of videos and blogs on how to be an inspirational leader. Sadly, however, being inspirational at work is harder than listening to an online talk. This is because leadership is considered distinct from management insofar as the former is more strategic and about communicating values and aspirations, while the latter concerns efficiency and being effective. One of the mistakes that many aspiring leaders, especially those who are new to leadership roles, make is confusing these two concepts. As such, they tend to pay more attention to what people in the company are doing rather than where the company itself is going. The result of this, which is all too frequent nowadays, is an organisation which lacks leadership, and such organisations run the risk of becoming disorganised quite quickly.", "question": "What does the writer say the main problem with leadership in business is?", "options": {"A": "That the qualities necessary for leaders aren’t clear", "B": "That the writing on the subject is largely unhelpful", "C": "That people wish to achieve it but can rarely realise it"}, "answer": "C", "explanation": "The text says many want to be inspirational leaders but 'being inspirational at work is harder than listening to an online talk', and aspiring leaders commonly fail by confusing leadership with management, supporting C. A is contradicted since the writer does define the qualities, and B targets only the online content rather than naming the central problem.", "audio_url": "", "transcript": ""}, {"id": "C1-R-07", "skill": "reading", "num": 7, "format": "passageq", "title": "The new face of news", "body": "Social media has revolutionised how rapidly events can be shared. Traditional news outlets stand no chance of competing, so they often end up picking up stories from social media to publish. However, these companies need to be cautious as they don’t know what the original source is trying to convey. Another issue is that the original author of the content is its owner and has a say in how it is used and is likely to be reluctant to allow media outlets to use it. Because of this, it is increasingly important that people should be critical and take everything they read with a pinch of salt. Mainstream media may favour one viewpoint or another, but at least they try to ensure that only the truth is printed. The same cannot be said for every single user of social media.", "question": "What does the text suggest about people posting content on social media?", "options": {"A": "They may be aware that what they’re posting is based on lies", "B": "They are doing so to make news outlets go out of business", "C": "They are impartial and write about a range of opinions"}, "answer": "A", "explanation": "Unlike mainstream media, which 'try to ensure that only the truth is printed', the text says 'the same cannot be said for every single user of social media', implying some may knowingly post untruths, supporting A. B invents a motive the text never gives, and C is the opposite of what the closing contrast suggests.", "audio_url": "", "transcript": ""}, {"id": "C1-R-08", "skill": "reading", "num": 8, "format": "passageq", "title": "Creating good passwords", "body": "The number of online accounts that the average person uses has increased rapidly in recent years, with each one requiring a password. As it’s near impossible to remember multiple unique passwords by heart, a lot of us end up reusing the same passwords across different accounts. Unfortunately, this makes us vulnerable to ‘hackers’, computer experts who try to access our accounts to steal our personal information. So how can we ensure that our sensitive data is safe? To begin with, experts agree that we must never use passwords based on things about us that a stranger could find out in a conversation or by looking around our house. A combination of lowercase and uppercase letters, numbers and symbols is advised, but avoid common tricks, such as replacing “a” with “@” and “l” with “1” or always capitalising the second letter. Finally, never reuse a password, though that’s probably easier said than done!", "question": "Which of the following bad habits related to passwords does the text mention?", "options": {"A": "Trying to remember multiple different passwords for all our online accounts", "B": "Basing our passwords on things that are important to us and that others can guess", "C": "Forgetting to use tricks to make passwords complicated, such as changing “l” to “1”"}, "answer": "B", "explanation": "The text warns we 'must never use passwords based on things about us that a stranger could find out', which matches B's habit of using guessable personal details. A is not a bad habit but a sensible aim, and C reverses the advice, since the text says to avoid such predictable tricks, not to use them.", "audio_url": "", "transcript": ""}, {"id": "C1-R-09", "skill": "reading", "num": 9, "format": "passageq", "title": "Using technology for nature research", "body": "Drones are small cameras that can be flown into the sky using a remote control and have become an increasingly important component of wildlife ecology research, by being used to spy on animals in the wild. Observing animals in their natural habitat can help us to understand how they behave and interact with their environment. It has enhanced our ability to track the location of nests, determine the size of bird groups and assess different types of habitats. It has even helped governments to protect animals from poachers, who can no longer steal animals in the wild without being identified. Despite these benefits, scientists have also posed serious questions about whether drones can disrupt nature. However, they have not provided solutions that are safer than drones or, indeed, the methods we relied on in the past to observe wildlife. One thing is for certain: drones are here to stay.", "question": "Which of the following benefits of drone use does the author mention?", "options": {"A": "It has helped to explain why birds live so close to each other", "B": "It has helped to determine the size of different habitats", "C": "It has made it easier to catch criminals who target wildlife"}, "answer": "C", "explanation": "The text says drones help governments 'protect animals from poachers, who can no longer steal animals in the wild without being identified', which matches catching wildlife criminals, supporting C. A and B distort the text, which mentions the size of bird groups (not why birds live close) and assessing habitat types (not measuring their size).", "audio_url": "", "transcript": ""}, {"id": "C1-R-10", "skill": "reading", "num": 10, "format": "passageq", "title": "Teaching philosophy in schools", "body": "It has been argued that philosophy is a subject better suited for university-level studies, but this couldn’t be further from the truth. It’s something we need on a daily basis to solve problems and make better decisions. The question, then, is why philosophy isn’t more present in many education systems. Without philosophy, there’d be no original thought or new ideas. We’d be stuck in the past because no one would have the initiative to try and improve society. We wouldn’t worry about anything other than the present, either. This is dangerous because failing to link present experiences to those in the past and future means that individuals don’t create meaning from them and therefore cannot understand what these experiences can teach them. It is this understanding, though, that helps individuals find their voice and create new paths. Studying philosophy, therefore, creates individuals who can identify problems and build a better society for everyone.", "question": "What does the writer say individuals need to do to learn from their experiences?", "options": {"A": "Relate their experiences to other events in their lives", "B": "Be more creative when coming up with solutions to old problems", "C": "Focus more on their own problems instead of helping others"}, "answer": "A", "explanation": "The text states that 'failing to link present experiences to those in the past and future' stops people learning from them, so the remedy is to relate experiences to other events across time, supporting A. B and C are not presented as ways to learn from experience and run against the text's emphasis on connection and wider benefit.", "audio_url": "", "transcript": ""}, {"id": "C1-R-11", "skill": "reading", "num": 11, "format": "passageq", "title": "The future of recruitment", "body": "It could soon be commonplace that a computer, instead of a human, asks the first series of questions for those who are applying for jobs via recruitment agencies. Many recruiters say that automation could be helpful for handling the more routine, yet time-consuming, areas of recruitment. For example, some technical companies are starting to develop systems that can manage recruiters’ initial duties, such as matching the most relevant CVs to a position, asking applicants where they would like to work and so on. This enables preliminary, basic questions to be dealt with by automated technology since that is not a key task for a human recruiter. Unfortunately, this could eventually mean fewer human recruiting positions. The human recruiters who survive will need to focus on the tasks that computers are unable to perform, such as conducting a live interview or judging personality and values.", "question": "How does the writer feel about automated recruitment?", "options": {"A": "It is a welcome development for all involved", "B": "It is endangering future human employment", "C": "It is an unnecessary feature of recruitment activity"}, "answer": "B", "explanation": "The word 'Unfortunately, this could eventually mean fewer human recruiting positions', plus talk of recruiters who 'survive', shows the writer sees automation as a threat to jobs, supporting B. A ignores this negative tone, and C is contradicted because the writer accepts automation is useful for routine tasks.", "audio_url": "", "transcript": ""}, {"id": "C1-R-12", "skill": "reading", "num": 12, "format": "passageq", "title": "Extreme sports", "body": "Evolution has programmed our genes to perform activities that will enhance the probability of survival in dangerous situations. This means that particpating in extreme sports, such as skydiving and climbing, doesn’t always seem logical. In fact, extreme sports is often viewed as abnormal, as it involves taking unnecessary risks that may lead to death. However, our body also has reward mechanisms that are stimulated when we experience risky activities. One such ‘reward’ is the chemical dopamine. High levels of dopamine affect our mental processes and lead to feelings of well-being, and so, this “natural high” becomes the reason to particpate in such sports. These positive effects are so strong and desired that they outweigh the high risk of serious injury or death. Additionally, repeated exposure to fearful situations may lead to familiarity towards the danger and, gradually, a more positive emotional response. This leads some people to seek new and bigger thrills.", "question": "What is the main purpose of this text?", "options": {"A": "To challenge the psychology behind extreme sport participation", "B": "To outline the brain’s role in motivation to do extreme sports", "C": "To evaluate the mental health of extreme sports participants"}, "answer": "B", "explanation": "The text explains how reward mechanisms and dopamine create a 'natural high' that motivates people to take part in extreme sports, so its purpose is to outline the brain's role in that motivation, supporting B. A is wrong because the text explains rather than challenges this behaviour, and C overreaches since it never assesses participants' mental health.", "audio_url": "", "transcript": ""}, {"id": "C1-L-01", "skill": "listening", "num": 1, "format": "mcq", "title": "News interview", "body": "", "question": "Why does the government official expect a reduction in output?", "options": {"A": "Because of government measures.", "B": "Because of global economic trends.", "C": "Because of media expectations."}, "answer": "B", "explanation": "She attributes the expected drop to wider conditions: a slight fall \"mirroring the general world economy\" (B). A is a trap because the government's own measures (tax cuts, incentives) are presented as a remedy to boost activity, not the cause of the decline, and the media figures (C) are precisely what she declines to comment on.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/1_L_C1_News+interview.mp3", "transcript": "Male: Thank you for talking to us today.\nFemale: Thanks for inviting me.\nMale: Economic figures for the last quarter will be published later today, and there are rumours that they won't be good. Can you comment on that?\nFemale: You'll forgive me if I don't comment on specific numbers that have been mentioned in the media.\nMale: I realise that.\nFemale: But the government expects economic performance to be broadly in line with expectations for the last quarter. That would suggest a slight drop in output, mirroring the general world economy.\nMale: I understand that the world economic outlook is not positive but we seem to be doing worse than similar countries around the world.\nFemale: Well, we have put measures in place that will boost economic activity, such as tax cuts and other incentives."}, {"id": "C1-L-02", "skill": "listening", "num": 2, "format": "mcq", "title": "Recycling issues", "body": "", "question": "What is the opinion of the man about recycling?", "options": {"A": "Not enough is being done.", "B": "Recycling is too expensive.", "C": "People talk too much about recycling."}, "answer": "A", "explanation": "He doubts that waste is even recycled \"properly\" and insists cost \"shouldn't be a matter\" given our limited resources, implying current efforts fall short (A). B inverts him: he says there is too much focus on cost, not that recycling is too expensive; C twists \"too much talk about the cost\" into a complaint about people discussing recycling in general.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/2_L_C1_Recycling+issues.mp3", "transcript": "Female: Is this plastic container recyclable, or not?\nMale: They wouldn't be recycled where I live, but here at the company I have no idea.\nFemale: They haven't provided any receptacles for that kind of recycling anyway.\nMale: I know what you're saying, but on the other hand, I'm not absolutely convinced that simply putting it in the correct container leads to it getting recycled properly.\nFemale: Really, you don't think they just bury it or incinerate it, do you?\nMale: I'm not convinced, there's still too much talk about the cost of recycling, and that's missing the point in my opinion.\nFemale: What do you mean?\nMale: Well, with the limited resources on this little planet of ours, it shouldn't be a matter of how much it costs financially."}, {"id": "C1-L-03", "skill": "listening", "num": 3, "format": "mcq", "title": "Language death", "body": "", "question": "How does the man feel about government attempts to save endangered languages?", "options": {"A": "Uninterested.", "B": "Supportive.", "C": "Frustrated."}, "answer": "C", "explanation": "His exasperation shows in \"they're going about it all wrong\" and \"I can't believe that they don't understand\", marking frustration (C). A is contradicted by his evident engagement (\"quite an interesting read\"), and B is the woman's optimistic stance, not his.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/3_L_C1_Language+death.mp3", "transcript": "Female: Did you see that report on how languages are dying out at an astonishing rate?\nMale: I did, it was quite an interesting read actually, but I think they're going about it all wrong. By focusing solely on education they're missing the bigger picture.\nFemale: But isn't that the best way? The languages gain prestige and younger generations feel a sense of pride when speaking them. It's a win-win.\nMale: Usefulness beats pride I'm afraid, I can't believe that they don't understand that you wouldn't learn something that you hardly ever use, these languages need to be relevant to the 21st Century with strong online representation. Without that, young people won't care will they? It will all have being in vain once the older generation disappears."}, {"id": "C1-L-04", "skill": "listening", "num": 4, "format": "mcq", "title": "Changes at work", "body": "", "question": "What does the woman think about the changes?", "options": {"A": "They'll be too drastic for the company to survive.", "B": "They'll have a negative effect on employees.", "C": "They'll help the company in the long run."}, "answer": "C", "explanation": "Despite acknowledging short-term pain, she concludes \"we have to keep pushing forward\" or \"risk not being a player\", a net belief the changes help long term (C). A and B are traps drawn from the downsides she concedes in passing (excessive restructuring, redundancies, falling share value), but she frames these as worthwhile short-term costs, not reasons to oppose the changes.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/4_L_C1_Changes+at+work.mp3", "transcript": "Female: Well, we're getting rid of the image that we're a dying company, aren't we, so it's not exactly a bad thing to be doing, is it? And yeah, perhaps the amount of restructuring seems a bit excessive, but it will help us get rid of a bit of dead weight. Of course they'll be loads of redundancies, but just think of how future new highs will change staff outlook for the better. They'll come with new energy and new ideas. Current staff will fight it every step of the way, the value of our stocks and shares will decrease in the short term, but we have to keep pushing forward, don't we? Without this move, we'll risk not being a player in today's market."}, {"id": "C1-L-05", "skill": "listening", "num": 5, "format": "mcq", "title": "Drone threat", "body": "", "question": "What is the man's opinion?", "options": {"A": "Drones could do a lot of damage to aircraft.", "B": "Drones should not be banned.", "C": "Drones could not make an aircraft crash."}, "answer": "A", "explanation": "He warns that professional drones are large and cites test videos where they \"make a big hole\" in a wing on impact, supporting A. C is the opposite of his view, and B is the woman's remark (\"They can hardly ban them\"), which he actually challenges with \"Why not\".", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/5_L_C1_Drone+threat.mp3", "transcript": "Male: I was getting our drinks when I saw a man over there reading a newspaper article about another drone sighting at an airport.\nFemale: How can a little radio controlled flying vehicle close down an airport?\nMale: Well, they aren't so little these days, at least not the professional ones. The drones used commercially by photographers for example are pretty big.\nFemale: Big enough to bring down a passenger aircraft?\nMale: Possibly, search online and you'll find test videos flying them into wing sections of aircraft and they make a big hole when they impact.\nFemale: What can they do about it? They can hardly ban them.\nMale: Why not, they could become a massive security concern.\nFemale: True enough I suppose, but that would upset people who had already bought one."}, {"id": "C1-L-06", "skill": "listening", "num": 6, "format": "mcq", "title": "Survey results", "body": "", "question": "What does the company hope to improve?", "options": {"A": "Feedback on the company's products.", "B": "Popular opinion of the company.", "C": "Efficacy of online marketing attempts."}, "answer": "B", "explanation": "The stated problem is \"the public's perception of us\", which the PR campaign aims to fix, i.e. popular opinion of the company (B). A is a trap from \"survey results\", but the surveys measure perception, not product feedback; C latches onto \"ad campaigns\" yet the goal is reputation overall, not online-marketing effectiveness specifically.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/6_L_C1_Survey+results.mp3", "transcript": "Female: We've got the results of the surveys back, one thing stands out, we have a problem with the public's perception of us. Despite our best efforts to modernise and meet the demands of the 21st Century, it seems it's just not enough, but we can work on it. We've called in sustainability experts, they're going to be taking a good look at our operations to see where we can make the necessary changes. Working in parallel, our public relations team are going to be putting out press releases, ad campaigns, you name it. Anything that shows that we're socially conscious and taking responsibility. I mean obviously this is an ongoing process, but we should start to see the positive effects within six months."}, {"id": "C1-L-07", "skill": "listening", "num": 7, "format": "mcq", "title": "Buying experiences", "body": "", "question": "What does the speaker suggest about the amount of money spent on experiences?", "options": {"A": "The thrill of an expensive experience lasts longer.", "B": "Cost is not important when buying an experience.", "C": "Cheap experiences have to be repeated to be effective."}, "answer": "B", "explanation": "She states it plainly: \"it doesn't matter if the experience is cheap or expensive\" (B). A is the opposite of her point, since the thrill of the expensive car \"soon fades\"; C distorts the cinema example, which shows a cheap experience can be repeated, not that it must be to work at all.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/7_L_C1_Buying+experiences.mp3", "transcript": "Female: For a large part of the population in the richer countries in the world, the people have no need for more stuff. Tthere is probably a strong connection with this in the expanding volume of research linking experiences to happiness. Apparently happiness comes more from buying experiences rather than things. However, this only applies if you are spending spare money. The difference between them is that it doesn't matter if the experience is cheap or expensive. Buying an expensive car might be more exciting than going to the cinema with friends, however the thrill of a new car soon fades, while the relatively low cost of the cinema means you can keep going and it remains effective at giving you happiness."}, {"id": "C1-L-08", "skill": "listening", "num": 8, "format": "mcq", "title": "Languages", "body": "", "question": "Why does the woman want to learn Arabic?", "options": {"A": "Because of the origins of Swahili.", "B": "Because it reflects her heritage.", "C": "Because it is the official language of Rwanda."}, "answer": "A", "explanation": "She gives her reason directly: Arabic \"because of its influence on Swahili\" (A). B and C are traps built from earlier details: her name and Swahili reflect her heritage, and French (not Arabic) is the official Rwandan language she mentions, but neither is her reason for wanting Arabic.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/8_L_C1_Languages.mp3", "transcript": "Male: What does your name mean, Saba?\nFemale: Well, it means seven in Swahili, my parents are from Rwanda, so they wanted to name me something that reflected our heritage.\nMale: Do you speak Swahili with them?\nFemale: Yes, and sometimes French, it's one of the official languages in Rwanda, so my parent's generation all had to learn it and they wanted me to speak it too.\nMale: Wow, I only did French and Spanish at school. I can get by in French but my Spanish is pretty rusty now. I started learning Arabic about three years ago but it's slow progress.\nFemale: I've always wanted to learn Arabic because of its influence on Swahili. I haven't had the chance yet, but hopefully soon."}, {"id": "C1-L-09", "skill": "listening", "num": 9, "format": "mcq", "title": "Wrong facts", "body": "", "question": "What has been a significant development in social media lately?", "options": {"A": "Its automated function to make up stories.", "B": "Its ability to distinguish between true and fake news.", "C": "Its capacity to distribute news quickly."}, "answer": "C", "explanation": "The key development he highlights is \"the ability to spread news at lightning speed\" (C). A is a trap from the discussion of fake news, but the false stories are spread by people, not generated automatically by the platform; B is the reverse of his point, since social media enables the spread of untrue news rather than filtering it out.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/9_L_C1_Wrong+facts.mp3", "transcript": "Male: It is generally agreed that the modern concept of social media began in 1996 with SixDegrees.com. My own first contact with this world was Myspace, which started in 2003. The rest as they say, is history. Part of that history that has become increasingly important in recent years has been the ability to spread news at lightning speed. Unfortunately, this has proved to be easier to abuse, with people spreading so-called news that is untrue. This can be done due to an honest belief that it is true or it can be the result of people or organisations intentionally spreading misleading information for their own purposes. In the next part, we will look at how this happens."}, {"id": "C1-L-10", "skill": "listening", "num": 10, "format": "mcq", "title": "Types of sports", "body": "", "question": "Which of these statements best matches what the woman says?", "options": {"A": "Individual sports do not develop social skills.", "B": "Team sports can encourage a spirit of loyalty.", "C": "All kinds of sport can sometimes become monotonous."}, "answer": "B", "explanation": "Her point that in a team \"you can't let people down\" and feel committed to teammates captures a spirit of loyalty (B). C overgeneralises: she says only solo sport \"can be boring\", not all sport; A is never claimed, since she credits team (not individual) sport with building social and life skills.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/10_L_C1_Types+of+sports.mp3", "transcript": "Male: Okay everyone, so we're debating the topic, what's better for school children, individual sports or team sports?\nFemale: Well, I think they've both got a bunch of advantages, but overall team games are much better.\nMale: Any particular reason for that?\nFemale: Yes, well if you're in a team you have this feeling, this obligation that you can't let people down. So, that makes you more committed to what you're doing, to help fellow team members and all that. And sometimes doing sport just by yourself can be boring, can't it?\nMale: I agree, and you can develop communication and negotiation skills too, right?\nFemale: Yes, and all these skills come in handy in other areas of life, as well as in sport, we could call them life skills, couldn't we?"}, {"id": "C1-L-11", "skill": "listening", "num": 11, "format": "mcq", "title": "Bilingualism", "body": "", "question": "What is the man's main point?", "options": {"A": "We have progressively learned more and more about bilingualism.", "B": "Speech therapists still know little about bilingualism.", "C": "Some attitudes have inhibited our knowledge of bilingualism."}, "answer": "A", "explanation": "He traces a movement from a past \"barrier\" of scarce information to the present, where therapists \"no longer need to work from a blank slate\", i.e. steadily growing knowledge (A). B is a trap from \"Much is still to be done\", but that concedes there is more to learn, not that little is known; the closing line on attitudes (C) concerns how families value their home language, not a brake on research.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/11_L_C1_Bilingualism.mp3", "transcript": "Male: In the past a serious barrier to working with bilingual clients was the scarce availability of information about other languages, regarding phonological issues, descriptions of syntax, morphology and cultural knowledge. A great deal of research has been carried out in these areas in recent years, and data are now available for many languages. These data include specific resources for speech and language therapists working in languages other than English. Much is still to be done in this area, but for most families resident in the UK, therapists no longer need to work from a blank slate. Attitudes towards bilingualism of both the individual and of societies in general can often be critical factors in determining the value that clients and families give their home language."}, {"id": "C1-L-12", "skill": "listening", "num": 12, "format": "mcq", "title": "Retail problems", "body": "", "question": "Why are there fewer high-street shops?", "options": {"A": "Reduced demand due to an economic crisis.", "B": "Higher costs for shops.", "C": "Increasing use of online shops."}, "answer": "C", "explanation": "She names the cause explicitly: \"the continued rise in online shopping\" has \"led to a decline in the number of retail shops\" (C). B is a trap, since rising energy prices, taxes and pensions are mentioned but said to have had \"no obvious impact\"; A misattributes the decline to an economic crisis, whereas reduced demand is a consequence, not the stated reason.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/12_L_C1_Retail+problems.mp3", "transcript": "Female: As we sell 60% of our products to high street retail outlets, it is important to understand the trends in this important business sector. It is a sector that is very sensitive to economic variations. While rises in energy prices, local taxes and pension payments for its workers have not really had any obvious impact, a significant factor is the continued rise in online shopping. This factor has led to a decline in the number of retail shops. We need to keep this in mind when planning for the future. This presentation will look at ways we could continue to provide cost effective products for this sector, in a period of reduced demand whilst also diversifying into other business areas."}, {"id": "C1-L-13", "skill": "listening", "num": 13, "format": "mcq", "title": "Problems with plastic", "body": "", "question": "What's the woman's opinion?", "options": {"A": "The government has taken positive steps to help the planet.", "B": "Urgent action needs to be taken to protect the environment.", "C": "Natural material should be used instead of plastic."}, "answer": "B", "explanation": "Her central message is urgency: \"that's one thing we don't have, we need to act now\" (B). A overstates a passing remark (she only says the government is \"finally doing something\"), and C is a trap from \"a good place to start\", which she immediately qualifies as insufficient, favouring using less plastic overall.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/13_L_C1_Problems+with+plastic.mp3", "transcript": "Male: Banning plastic straws, seriously, pretty soon any type of plastic is going to be illegal.\nFemale: But isn't that the whole point? There's already far too much plastic floating around in places where it shouldn't be, at least the government is finally doing something about it.\nMale: Don't tell me you expect everyone to stop using plastic, just like that? These things take time.\nFemale: And that's one thing we don't have, we need to act now.\nMale: So, what do you suggest, suddenly go back to using natural materials, like in the good old days?\nFemale: Well, that's a good place to start, but it's hardly going to put an end to all our problems. New ones will just crop up, better to just stop using so much in the first place."}];
window.DATA = DATA;
const LEVEL = "C1";
const TITLE = "EnglishScore Practice Test " + LEVEL;
const N = DATA.length;
const SKILL_LABEL = {grammar:"Grammar",vocabulary:"Vocabulary",reading:"Reading",listening:"Listening"};
const esc = s => (s===undefined||s===null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ans = {};            // i -> "B" or ["A","C","B"]
const stu = {name:"", email:""};
let idx = 0;               // 0 start, 1..N questions, N+1 results
const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const prog = document.getElementById("prog");
const validEmail = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);

function setProgress(){ prog.style.width = (idx===0?0 : idx>N?100 : Math.round((idx-1)/N*100)) + "%"; }
function answeredCount(){ let n=0; for(let i=0;i<N;i++){ const a=ans[i]; if(Array.isArray(a)){ if(a.length===3 && a.every(Boolean)) n++; } else if(a) n++; } return n; }

function render(){
  setProgress();
  if(idx===0) return renderStart();
  if(idx>N) return renderResults();
  renderQuestion(idx-1);
}

function renderStart(){
  screen.innerHTML =
    `<div class="card">
      <h2 style="margin:0 0 6px">Before you start</h2>
      <p class="note" style="margin:0 0 18px">Advanced level. ${N} questions covering Grammar, Vocabulary, Reading and Listening. Your name and email are required so we can send your result to your tutor and a confirmation to you.</p>
      <div class="field" id="f-name"><label>Full name</label><input id="in-name" autocomplete="name" placeholder="e.g. Jane Lee"><div class="err">Please enter your name.</div></div>
      <div class="field" id="f-email"><label>Email address</label><input id="in-email" type="email" autocomplete="email" placeholder="you@example.com"><div class="err">Please enter a valid email address.</div></div>
    </div>`;
  bar.innerHTML = `<span class="count">Step 1 of ${N+1}</span><button class="btn-go" id="start">Start test &rarr;</button>`;
  const nm=document.getElementById("in-name"), em=document.getElementById("in-email");
  nm.value=stu.name; em.value=stu.email;
  document.getElementById("start").onclick = () => {
    stu.name=nm.value.trim(); stu.email=em.value.trim();
    let bad=false;
    document.getElementById("f-name").classList.toggle("bad", !stu.name); if(!stu.name) bad=true;
    const eok=validEmail(stu.email); document.getElementById("f-email").classList.toggle("bad", !eok); if(!eok) bad=true;
    if(bad) return;
    idx=1; render(); window.scrollTo(0,0);
  };
}

function questionInner(q,i){
  let h = `<div class="meta">${SKILL_LABEL[q.skill]} &middot; Question ${q.num}</div>`;
  if(q.title) h += `<div class="title">${esc(q.title)}</div>`;
  if(q.audio_url) h += `<audio controls preload="none" src="${q.audio_url}"></audio>`;
  if(q.format==="passageq") h += `<div class="passage">${esc(q.body)}</div>`;
  else if(q.body) h += `<div class="body">${esc(q.body)}</div>`;
  const saved = ans[i];
  if(q.format==="order"){
    h += `<div class="prompt">${esc(q.question)}</div><div class="order">`;
    ["A","B","C"].forEach(L => h += `<div class="sent"><b>${L}.</b> ${esc(q.options[L])}</div>`);
    h += `<div class="picks">`;
    [0,1,2].forEach(p => {
      const v = Array.isArray(saved)?saved[p]:"";
      h += `<label>Position ${p+1}<select data-pos="${p}">`+
           `<option value="">--</option>`+
           ["A","B","C"].map(L=>`<option ${v===L?"selected":""}>${L}</option>`).join("")+
           `</select></label>`;
    });
    h += `</div></div>`;
  } else {
    if(q.question) h += `<div class="prompt">${esc(q.question)}</div>`;
    ["A","B","C"].forEach(L => {
      const on = saved===L;
      h += `<label class="opt${on?" sel":""}" data-opt="${L}"><input type="radio" name="opt" value="${L}" ${on?"checked":""}>${L}. ${esc(q.options[L])}</label>`;
    });
  }
  return h;
}

function saveCurrent(i){
  const q=DATA[i];
  if(q.format==="order"){
    ans[i] = [...document.querySelectorAll('select[data-pos]')].map(s=>s.value);
  } else {
    const sel=document.querySelector('input[name="opt"]:checked');
    ans[i] = sel?sel.value:undefined;
  }
}

function renderQuestion(i){
  const q=DATA[i];
  screen.innerHTML = `<div class="card">${questionInner(q,i)}</div>`;
  // live highlight for radio selection
  screen.querySelectorAll('.opt').forEach(o => o.addEventListener('change', ()=>{
    screen.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');
  }));
  const last = (i === N-1);
  bar.innerHTML =
    `<span class="count">Question ${i+1} of ${N}</span>`+
    `<button class="btn-ghost" id="back">&larr; Back</button>`+
    (last ? `<button class="btn-go" id="finish">Finish &amp; submit</button>`
          : `<button class="btn-go" id="next">Next &rarr;</button>`);
  document.getElementById("back").onclick = ()=>{ saveCurrent(i); idx--; render(); window.scrollTo(0,0); };
  const adv = document.getElementById(last?"finish":"next");
  adv.onclick = ()=>{
    saveCurrent(i);
    if(last){
      const miss = N - answeredCount();
      if(miss>0 && !confirm(miss+" question(s) are unanswered. Submit anyway?")) return;
      idx=N+1; render(); window.scrollTo(0,0);
    } else { idx++; render(); window.scrollTo(0,0); }
  };
}

function grade(){
  const items=[]; let points=0;
  DATA.forEach((q,i)=>{
    const a=ans[i];
    let your, ok;
    if(q.format==="order"){
      const got = Array.isArray(a)?a.join(","):"";
      ok = got===q.answer;
      your = Array.isArray(a)&&a.every(Boolean) ? a.join(",") : "(blank)";
    } else {
      ok = a===q.answer;
      your = a ? (a+". "+q.options[a]) : "(blank)";
    }
    if(ok) points++;
    const correct = q.format==="order" ? q.answer : (q.answer+". "+q.options[q.answer]);
    items.push({n:i+1, skill:SKILL_LABEL[q.skill], title:q.title||"", your, correct, ok});
  });
  return {points, total:N, pct:Math.round(points/N*100), items};
}

function sendResult(g){
  const date = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const payload = {name:stu.name, email:stu.email, level:LEVEL, title:TITLE, date,
                   points:g.points, total:g.total, pct:g.pct, items:g.items};
  const url = window.ES_ENDPOINT;
  if(url && /^https?:\/\//.test(url)){
    try{
      fetch(url, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
      return true;
    }catch(e){ return false; }
  }
  return false;
}

function renderResults(){
  const g = grade();
  const sent = sendResult(g);
  let html =
    `<div class="result"><div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7">Your score</div>`+
    `<div class="pct">${g.points} / ${g.total} &nbsp;(${g.pct}%)</div>`+
    `<div class="sub">${esc(stu.name)} &middot; ${TITLE}</div></div>`;
  html += sent
    ? `<div class="sent-note">Your result has been sent to your tutor at HK-Schools.com, and a confirmation email has been sent to <b>${esc(stu.email)}</b>.</div>`
    : `<div class="sent-note">Your result has been recorded. Review every question below.</div>`;
  html += `<div class="rev">`;
  let lastSkill=null;
  DATA.forEach((q,i)=>{
    if(q.skill!==lastSkill){ lastSkill=q.skill; html += `<div class="meta" style="margin:18px 4px 4px">${SKILL_LABEL[q.skill]}</div>`; }
    const it=g.items[i];
    html += `<div class="card"><div class="meta2">${SKILL_LABEL[q.skill]} &middot; Question ${q.num}</div>`;
    if(q.title) html += `<div class="title" style="font-size:16px">${esc(q.title)}</div>`;
    if(q.format==="passageq" && q.body) html += `<div class="passage">${esc(q.body)}</div>`;
    else if(q.body) html += `<div class="body" style="font-size:14.5px">${esc(q.body)}</div>`;
    if(q.question) html += `<div class="prompt" style="font-weight:600">${esc(q.question)}</div>`;
    const ansTxt = q.format==="order" ? `Correct order: ${q.answer.replace(/,/g," , ")}` : `Correct answer: ${esc(it.correct)}`;
    html += `<div class="fb ${it.ok?"right":"wrong"}"><span class="tag">${it.ok?"Correct":"Not quite"}</span> &middot; Your answer: ${esc(it.your)}<br>${ansTxt}`;
    if(q.explanation) html += `<div style="margin-top:6px">${esc(q.explanation)}</div>`;
    if(q.transcript) html += `<details><summary>Show transcript</summary><div class="tr">${esc(q.transcript)}</div></details>`;
    html += `</div></div>`;
  });
  html += `</div><div class="footer">Questions and audio &copy; British Council EnglishScore, used for practice by HK-Schools.com.</div>`;
  screen.innerHTML = html;
  bar.innerHTML = `<span class="count">Finished &middot; ${g.points}/${g.total}</span><button class="btn-ghost" id="again">Take again</button>`;
  document.getElementById("again").onclick = ()=>location.reload();
}

render();
</script>
</body>
</html>
