<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishScore Practice Test B1</title>
<script src="../config.js"></script>
<style>
:root{--teal:#14746b;--navy:#2d0a54;--ink:#1c2733;--line:#e3e6ea;--ok:#1a9e6b;--no:#d23a3a;--lvl:#7b3fe4;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f6f8;line-height:1.55}
header{background:var(--teal);color:#fff;padding:16px 20px}
header .wrap{max-width:720px;margin:0 auto}
header .crumb{font-size:13px;opacity:.85}
header .crumb a{color:#fff}
header h1{margin:5px 0 0;font-size:20px}
.chip{display:inline-block;background:var(--lvl);color:#fff;font-weight:700;border-radius:5px;padding:2px 9px;font-size:14px;vertical-align:middle}
.progwrap{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:12px;overflow:hidden}
.progbar{height:100%;width:0;background:#fff;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:22px 16px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 22px;margin:0 0 14px}
.field{margin:0 0 16px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:16px}
.field input:focus{outline:none;border-color:var(--teal)}
.field .err{color:var(--no);font-size:13px;margin-top:5px;display:none}
.field.bad input{border-color:var(--no)}
.field.bad .err{display:block}
.meta{font-size:12px;color:#8a94a0;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.title{font-weight:700;font-size:18px;margin:4px 0 12px}
.body{white-space:pre-wrap;margin:6px 0 12px;font-size:15.5px}
.passage{background:#f7f8fa;border-left:3px solid var(--teal);border-radius:6px;padding:12px 15px;margin:6px 0 14px;font-size:15px;white-space:pre-wrap}
.prompt{font-weight:600;margin:10px 0 10px}
audio{width:100%;margin:4px 0 14px}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:9px 0;cursor:pointer;font-size:16px}
.opt:hover{border-color:#9aa4af}
.opt.sel{border-color:var(--teal);background:#eef7f5}
.opt input{margin-right:10px}
.opt.correct{border-color:var(--ok);background:#eafaf2}
.opt.wrong{border-color:var(--no);background:#fdeced}
.order .sent{border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin:7px 0;font-size:15px}
.order .sent b{color:var(--navy)}
.order .picks{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.order .picks label{font-size:13px;font-weight:600}
.order select{display:block;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.note{font-size:14px;color:#5a6573}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px}
.bar .inner{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .count{font-size:13px;color:#6b7682;font-weight:600;margin-right:auto}
button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:12px 22px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--teal);color:#fff}
.btn-ghost{background:#eef1f4;color:var(--ink)}
.result{background:var(--navy);color:#fff;border-radius:14px;padding:22px 24px;margin:0 0 16px}
.result .pct{font-size:36px;font-weight:800}
.result .sub{font-size:15px;opacity:.92;margin-top:6px}
.sent-note{background:#eafaf2;border:1px solid #bfe9d4;border-radius:10px;padding:12px 15px;font-size:14px;margin:0 0 16px}
.rev .meta2{font-size:12px;color:#8a94a0;font-weight:600}
.fb{margin-top:10px;font-size:14px;border-radius:8px;padding:10px 12px}
.fb.right{background:#eafaf2;border:1px solid #bfe9d4}
.fb.wrong{background:#fdeced;border:1px solid #f3c6c6}
.fb .tag{font-weight:700}
.fb details{margin-top:7px}
.fb summary{cursor:pointer;color:var(--teal);font-weight:600}
.fb .tr{white-space:pre-wrap;font-size:13.5px;margin-top:6px;color:#42505e}
.footer{font-size:12px;color:#8a94a0;margin-top:24px;text-align:center}
.footer a{color:#6b7682}
</style>
</head>

<header><div class="wrap">

<script>
const DATA = [{"id": "B1-G-01", "skill": "grammar", "num": 1, "format": "mcq", "title": "No answer", "body": "A: Have you heard from them yet? / B: No! It's been two weeks and they still haven't said _____ . I can't believe they're taking so long!", "question": "Choose the correct word to complete the conversation.", "options": {"A": "nothing", "B": "anything", "C": "something"}, "answer": "B", "explanation": "After a negative verb ('haven't said') we use 'anything', not 'nothing', to avoid a double negative. 'nothing' would create two negatives in one clause, which is incorrect in standard English.", "audio_url": "", "transcript": ""}, {"id": "B1-G-02", "skill": "grammar", "num": 2, "format": "mcq", "title": "Expensive gift", "body": "A: You _____ have bought such an expensive watch. But I love it, thanks! / B: I'm so happy you like it.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "shouldn't", "B": "couldn't", "C": "mightn't"}, "answer": "A", "explanation": "'shouldn't have + past participle' expresses mild criticism or that an action was not necessary (it was too expensive). 'couldn't have' would mean it was impossible, which does not fit a gift that was actually bought.", "audio_url": "", "transcript": ""}, {"id": "B1-G-03", "skill": "grammar", "num": 3, "format": "mcq", "title": "Are you free?", "body": "A: Are you free tomorrow for the meeting? / B: I'm afraid not. I _____ on a business trip for two days. I leave in the morning.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "have gone", "B": "go", "C": "am going"}, "answer": "C", "explanation": "The present continuous ('am going') is used for a fixed future plan ('I leave in the morning'). 'go' is a simple present for habits or timetables, which does not show this personal arrangement.", "audio_url": "", "transcript": ""}, {"id": "B1-G-04", "skill": "grammar", "num": 4, "format": "mcq", "title": "Staff meeting", "body": "A: Sam told me _____ all the staff to the planning meeting on Friday. / B: That's a good idea. I think everyone should attend.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "invite", "B": "to invite", "C": "inviting"}, "answer": "B", "explanation": "After 'tell someone' we use the 'to + infinitive' to report an instruction ('told me to invite'). The bare 'invite' and the '-ing' form do not follow this 'tell + object + to-infinitive' pattern.", "audio_url": "", "transcript": ""}, {"id": "B1-G-05", "skill": "grammar", "num": 5, "format": "mcq", "title": "Business meeting", "body": "A: We really don't have enough money to develop this new product. / B: _____ , we do. We just won't want the business to move in this direction.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "Actually", "B": "Besides", "C": "Furthermore"}, "answer": "A", "explanation": "'Actually' is a linking word used to correct what someone just said ('we do' have the money). 'Besides' and 'Furthermore' add extra information rather than contradicting, so they do not fit.", "audio_url": "", "transcript": ""}, {"id": "B1-G-06", "skill": "grammar", "num": 6, "format": "mcq", "title": "Asking the boss", "body": "A: I have a dentist appointment tomorrow morning. _____ I take the whole day off? / B: No problem. Hope it all goes OK.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "Will", "B": "Could", "C": "Would rather"}, "answer": "B", "explanation": "'Could' is the polite modal for asking permission ('Could I take the day off?'). 'Would rather' is wrong because it expresses preference and cannot be followed directly by 'I take' in a question.", "audio_url": "", "transcript": ""}, {"id": "B1-G-07", "skill": "grammar", "num": 7, "format": "mcq", "title": "Job application help", "body": "A: Have you sent in your job application yet? / B: No, not yet. Philippe's good at writing CVs and he said he _____ me with mine before I sent it.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "was helping", "B": "is helping", "C": "would help"}, "answer": "C", "explanation": "'would help' is the future-in-the-past, used in reported speech to report a promise ('he said he would help'). 'is helping' is wrong because the main verb 'said' is in the past, so the reported verb must also shift back.", "audio_url": "", "transcript": ""}, {"id": "B1-G-08", "skill": "grammar", "num": 8, "format": "mcq", "title": "Online customer question", "body": "A: I _____ for the tickets I bought online to arrive, but they haven't. / B: We will send your tickets by email tomorrow.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "have been waiting", "B": "waited", "C": "had waited"}, "answer": "A", "explanation": "The present perfect continuous ('have been waiting') shows an action that started in the past and is still continuing now (the tickets still haven't arrived). 'waited' is a finished past action, so it does not show the ongoing wait.", "audio_url": "", "transcript": ""}, {"id": "B1-G-09", "skill": "grammar", "num": 9, "format": "mcq", "title": "The lecture", "body": "Please do not ask questions _____ the talk. Wait until the speaker has finished, and he will be happy to answer them.", "question": "Choose the correct word to complete the text.", "options": {"A": "along", "B": "for", "C": "during"}, "answer": "C", "explanation": "'during' is a preposition meaning 'throughout a period of time' ('during the talk'). 'for' is used with a length of time (for an hour), not with an event like 'the talk'.", "audio_url": "", "transcript": ""}, {"id": "B1-G-10", "skill": "grammar", "num": 10, "format": "mcq", "title": "Star athletes", "body": "Very _____ people in the world can run a mile in less than four minutes.", "question": "Choose the correct word to complete the text.", "options": {"A": "little", "B": "few", "C": "some"}, "answer": "B", "explanation": "'few' is used with countable plural nouns ('few people'). 'little' is used only with uncountable nouns, so it cannot describe 'people'.", "audio_url": "", "transcript": ""}, {"id": "B1-G-11", "skill": "grammar", "num": 11, "format": "mcq", "title": "Old friend", "body": "It's Jenny, _____ ? We used to play badminton together at the sports centre about three years ago! How are you?", "question": "Choose the correct word to complete the text.", "options": {"A": "isn't it", "B": "is it", "C": "wasn't it"}, "answer": "A", "explanation": "This is a question tag: a positive present statement ('It's Jenny') takes a negative present tag ('isn't it'). 'wasn't it' is wrong because the main verb 'is' is present, not past.", "audio_url": "", "transcript": ""}, {"id": "B1-G-12", "skill": "grammar", "num": 12, "format": "mcq", "title": "Create your own t-shirt", "body": "Do you want to put your own picture onto a t-shirt? Just send us your design and we'll do the _____ .", "question": "Choose the correct word to complete the text.", "options": {"A": "most", "B": "other", "C": "rest"}, "answer": "C", "explanation": "'the rest' means 'everything that remains' (all the other work). 'the other' needs a noun after it or a clear pair, so it does not fit alone here.", "audio_url": "", "transcript": ""}, {"id": "B1-V-01", "skill": "vocabulary", "num": 1, "format": "mcq", "title": "Wrong way", "body": "What was the meeting with your boss about?\nWell, I’m not sending out orders in the _____ way, apparently!", "question": "Choose the correct word to complete the conversation.", "options": {"A": "true", "B": "real", "C": "proper"}, "answer": "C", "explanation": "'Proper' means correct or suitable for the situation, so 'the proper way' means the right or accepted way of doing something. 'True' and 'real' describe whether something is genuine, not whether a method is correct.", "audio_url": "", "transcript": ""}, {"id": "B1-V-02", "skill": "vocabulary", "num": 2, "format": "mcq", "title": "New office", "body": "How do you know we’re moving to a new office?\nThe boss made _____ yesterday.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "an announcement", "B": "a notice", "C": "an interview"}, "answer": "A", "explanation": "We 'make an announcement', which means to tell news to a group of people, and this is how everyone learned about the move. We do not say 'make a notice', so option B is grammatically wrong as a collocation.", "audio_url": "", "transcript": ""}, {"id": "B1-V-03", "skill": "vocabulary", "num": 3, "format": "mcq", "title": "Working with others", "body": "How do you keep a good working _____ with colleagues?\nIt’s about communication and being patient with each other.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "partner", "B": "communication", "C": "relationship"}, "answer": "C", "explanation": "A 'relationship' is the way two people connect and behave towards each other, so 'a good working relationship' is a common phrase about getting along at work. 'Communication' is only one part of a relationship and does not fit 'a good working _____ with colleagues'.", "audio_url": "", "transcript": ""}, {"id": "B1-V-04", "skill": "vocabulary", "num": 4, "format": "mcq", "title": "An important letter", "body": "I need to send this letter to Spain. It’s quite _____ .\nIt’ll take two days. Is that fast enough?", "question": "Choose the correct word to complete the conversation.", "options": {"A": "useless", "B": "rapid", "C": "urgent"}, "answer": "C", "explanation": "'Urgent' means needing to be done quickly, which explains the worry about how fast the letter will arrive. 'Rapid' describes something that moves fast itself, but a letter is not rapid, so it does not fit.", "audio_url": "", "transcript": ""}, {"id": "B1-V-05", "skill": "vocabulary", "num": 5, "format": "mcq", "title": "No information", "body": "Jake told the police that he didn’t have any _____ of where his friend had gone after school.", "question": "Choose the correct word to complete the text.", "options": {"A": "experience", "B": "understanding", "C": "knowledge"}, "answer": "C", "explanation": "'Knowledge' means information you have in your mind, so 'no knowledge of where his friend had gone' means he did not know. 'Experience' means skill gained by doing something, which does not fit knowing a fact.", "audio_url": "", "transcript": ""}, {"id": "B1-V-06", "skill": "vocabulary", "num": 6, "format": "mcq", "title": "Bad restaurant", "body": "As your restaurant refused to apologise for the poor _____ yesterday, we had no choice but to make a formal complaint.", "question": "Choose the correct word to complete the text.", "options": {"A": "service", "B": "custom", "C": "assistance"}, "answer": "A", "explanation": "'Service' is the way staff treat and help customers in a restaurant, so 'poor service' is a common complaint. 'Custom' means a tradition or regular shopping, not the help you receive, so it does not fit here.", "audio_url": "", "transcript": ""}, {"id": "B1-V-07", "skill": "vocabulary", "num": 7, "format": "mcq", "title": "Good study practices", "body": "Zheng likes knowing a lot about a topic before writing an essay. That’s why he goes to the library to do some _____ before he starts.", "question": "Choose the correct word to complete the text.", "options": {"A": "review", "B": "research", "C": "revision"}, "answer": "B", "explanation": "'Research' means looking for information to learn about a topic, which is what you do in a library before writing. 'Revision' means studying again before an exam, not gathering new information for an essay.", "audio_url": "", "transcript": ""}, {"id": "B1-V-08", "skill": "vocabulary", "num": 8, "format": "mcq", "title": "Banking services", "body": "We understand each customer’s _____ banking needs. We always make sure our products are perfect for you.", "question": "Choose the correct word to complete the text.", "options": {"A": "individual", "B": "limited", "C": "general"}, "answer": "A", "explanation": "'Individual' means belonging to one particular person, which fits 'each customer' and 'perfect for you'. 'General' means the same for everyone, which is the opposite of treating each customer personally.", "audio_url": "", "transcript": ""}, {"id": "B1-V-09", "skill": "vocabulary", "num": 9, "format": "mcq", "title": "Football score", "body": "China’s women’s team _____ South Korea 5-2 in last night’s football match to go into the final next week.", "question": "Choose the correct word to complete the text.", "options": {"A": "won", "B": "defeated", "C": "scored"}, "answer": "B", "explanation": "'Defeated' means beat an opponent, so 'defeated South Korea 5-2' is correct because it takes the other team as its object. 'Won' cannot be followed directly by the team's name: you win a match or win against a team, not 'won South Korea'.", "audio_url": "", "transcript": ""}, {"id": "B1-V-10", "skill": "vocabulary", "num": 10, "format": "mcq", "title": "Your opinions wanted", "body": "Please write a message and tell us why you like our products. We will _____ the best ones in our next newsletter.", "question": "Choose the correct word to complete the text.", "options": {"A": "bring", "B": "publish", "C": "advertise"}, "answer": "B", "explanation": "To 'publish' means to print or share writing for people to read, which fits putting the best messages in a newsletter. 'Advertise' means to promote a product for sale, but here they are sharing customers' messages, not selling anything.", "audio_url": "", "transcript": ""}, {"id": "B1-V-11", "skill": "vocabulary", "num": 11, "format": "mcq", "title": "Registration appointment", "body": "It is _____ that you bring your identity documents with you for your appointment. Without them, your request will not be dealt with.", "question": "Choose the correct word to complete the text.", "options": {"A": "essential", "B": "urgent", "C": "serious"}, "answer": "A", "explanation": "'Essential' means absolutely necessary, which matches 'without them, your request will not be dealt with'. 'Urgent' means needing to be done quickly, but the sentence is about something being required, not about speed.", "audio_url": "", "transcript": ""}, {"id": "B1-V-12", "skill": "vocabulary", "num": 12, "format": "mcq", "title": "Bad weather", "body": "It started snowing as soon as we left the house. We were _____ freezing by the time we arrived.", "question": "Choose the correct word to complete the text.", "options": {"A": "hardly", "B": "regularly", "C": "absolutely"}, "answer": "C", "explanation": "'Absolutely' means completely or totally, and it is used to make strong words like 'freezing' even stronger. 'Hardly' means almost not at all, which gives the opposite meaning and does not fit being very cold.", "audio_url": "", "transcript": ""}, {"id": "B1-R-01", "skill": "reading", "num": 1, "format": "order", "title": "Online shopping", "body": "Don't you think it's great being able to buy everything you want online, from clothes to food?", "question": "Put the sentences in the correct order.", "options": {"A": "It's so easy! All you need is just a few clicks, and your order is soon on its way.", "B": "But all those delivery lorries driving around are doing some serious damage to the environment.", "C": "So, that's why it's better to try and place larger orders instead of lots of little ones."}, "answer": "A,B,C", "explanation": "A continues the positive idea from the stimulus (how easy online shopping is). B uses 'But' to introduce the problem of delivery lorries, and C begins with 'So' to give the advice that results from that problem.", "audio_url": "", "transcript": ""}, {"id": "B1-R-02", "skill": "reading", "num": 2, "format": "order", "title": "Making Suzhou more beautiful", "body": "Suzhou is a beautiful city in China, west of Shanghai, which has a lot of canals.", "question": "Put the sentences in the correct order.", "options": {"A": "So, the government has decided to fix all the walls and make sure the water is clean.", "B": "But the canal walls were built a very long time ago, and they have started breaking.", "C": "They hope that this will encourage more tourists to visit the city in the future."}, "answer": "B,A,C", "explanation": "B uses 'But' to introduce the problem of the breaking canal walls mentioned in the stimulus. A starts with 'So' to give the government's solution, and C ('They hope') describes the hoped-for result of that action.", "audio_url": "", "transcript": ""}, {"id": "B1-R-03", "skill": "reading", "num": 3, "format": "order", "title": "The Globe Theatre", "body": "William Shakespeare was an English writer who was famous for his plays for the theatre.", "question": "Put the sentences in the correct order.", "options": {"A": "This meant that both rich and poor people could watch plays there, but the rich had more comfortable seats.", "B": "This was a large, open-air theatre and had space for people from all walks of life.", "C": "Many of his plays were first performed in a large wooden theatre called the Globe."}, "answer": "C,B,A", "explanation": "C introduces the Globe theatre for the first time. B then says 'This was' to describe that theatre, and A starts with 'This meant', explaining the result of having space for all kinds of people.", "audio_url": "", "transcript": ""}, {"id": "B1-R-04", "skill": "reading", "num": 4, "format": "order", "title": "Trip to the city", "body": "If you're ever in this part of the world, then you must definitely visit Barcelona.", "question": "Put the sentences in the correct order.", "options": {"A": "We loved everything about it, from the amazing architecture to the delicious food, especially the potato dishes.", "B": "So, we're planning on going back next year to explore more of that wonderful city.", "C": "Sadly, we didn't have time to visit everything because we were only there for three days."}, "answer": "A,C,B", "explanation": "A explains why you should visit (they loved everything). C adds 'Sadly' to show what they missed, and B starts with 'So' to give the plan to return that results from missing things.", "audio_url": "", "transcript": ""}, {"id": "B1-R-05", "skill": "reading", "num": 5, "format": "order", "title": "Letter about a past employee", "body": "Omar Noor worked for our company on a temporary contract for one year and six months.", "question": "Put the sentences in the correct order.", "options": {"A": "During this period, he was responsible for finding, and working with, new customers from Asian countries.", "B": "He also greatly improved our methods of dealing with all types of customer enquiries from there.", "C": "It is for these reasons that I recommend Omar Noor for the job of Customer Services Manager."}, "answer": "A,B,C", "explanation": "A starts with 'During this period', referring back to the time in the stimulus, and describes his first duty. B adds a second point with 'also', and C concludes with 'for these reasons', recommending him based on the points before.", "audio_url": "", "transcript": ""}, {"id": "B1-R-06", "skill": "reading", "num": 6, "format": "order", "title": "Writing programme", "body": "There is only one week left to apply to our 2021 Young Book Writers programme.", "question": "Put the sentences in the correct order.", "options": {"A": "For more information on any of the above and to apply, please click on the link below.", "B": "However, it also includes lessons on how to write newspaper articles and how to apply for jobs in publishing.", "C": "This programme is designed to teach people aged 16-25 how to write books, short stories and poems."}, "answer": "C,B,A", "explanation": "C explains what the programme teaches, following 'This programme' from the stimulus. B adds more content with 'However, it also includes', and A closes by telling readers to click the link for 'any of the above'.", "audio_url": "", "transcript": ""}, {"id": "B1-R-07", "skill": "reading", "num": 7, "format": "order", "title": "Working from home", "body": "I believe that being able to work from home offers workers a lot of advantages.", "question": "Put the sentences in the correct order.", "options": {"A": "This also usually saves you money because you are not paying for tickets or fuel.", "B": "One of the most obvious ones is the time you save by not travelling to work.", "C": "However, in the end, you may spend what you save on your electricity or internet bills!"}, "answer": "B,A,C", "explanation": "B gives the first advantage ('One of the most obvious ones'), following the 'advantages' in the stimulus. A adds a second one with 'This also', and C uses 'However' to give the downside at the end.", "audio_url": "", "transcript": ""}, {"id": "B1-R-08", "skill": "reading", "num": 8, "format": "order", "title": "Online registration", "body": "Before registering on our website, we would like to ask you to please take a minute to read the following:", "question": "Put the sentences in the correct order.", "options": {"A": "After entering the code from the text message, you will be able to use the website.", "B": "You will need to know your tax number and social security number and provide an email address.", "C": "After entering these details, you will be sent a confirmation email, as well as a text message with a code."}, "answer": "C,A,B", "explanation": "The steps follow each other by the linking phrases: 'these details' in C points to the tax number and email in B, and 'the code' in A points to the code sent in C. So the natural order of the actions is B (enter details), then C (receive the code), then A (enter the code and use the site).", "audio_url": "", "transcript": ""}, {"id": "B1-R-09", "skill": "reading", "num": 9, "format": "order", "title": "Typical interview questions", "body": "When you go to an interview, there are typical questions that the interviewers ask you.", "question": "Put the sentences in the correct order.", "options": {"A": "But don't think that pausing will look bad because you're probably the only one who notices!", "B": "They usually start with easy ones, such as about your previous work experience and your studies.", "C": "Then, the questions get harder, and it takes a bit longer to think about what you should say."}, "answer": "C,A,B", "explanation": "B describes the easy first questions ('They usually start'), C uses 'Then' to show the questions get harder and need more thinking, and A follows with 'But' to reassure you about pausing while you think.", "audio_url": "", "transcript": ""}, {"id": "B1-R-10", "skill": "reading", "num": 10, "format": "order", "title": "TV interview with graduate", "body": "On the programme today we have Malik, a 25-year-old university graduate who used an interesting method to find a job.", "question": "Put the sentences in the correct order.", "options": {"A": "Malik had been looking for a job for months after finishing university, but with very little success.", "B": "He then had the brilliant idea to stand outside a central train station and give everyone his CV.", "C": "It was there that he met Freya Williams, a business expert, who helped him get a job at her company!"}, "answer": "A,B,C", "explanation": "A sets up the background (Malik searching without success). B uses 'then' to give his new idea at the station, and C says 'It was there' to refer to that station and tell the happy result.", "audio_url": "", "transcript": ""}, {"id": "B1-R-11", "skill": "reading", "num": 11, "format": "order", "title": "Staying active is important", "body": "Most of us spend the day working very hard to finish all of our work.", "question": "Put the sentences in the correct order.", "options": {"A": "When we can finally go home after, we might not feel like doing very much.", "B": "This can help you stay healthy and not have serious health problems in the future.", "C": "However, although you'd love to relax and watch TV, it's important to do some exercise."}, "answer": "A,C,B", "explanation": "A follows the hard day in the stimulus, saying we feel tired at home. C uses 'However' to argue we should still exercise, and B explains the benefit with 'This can help you stay healthy'.", "audio_url": "", "transcript": ""}, {"id": "B1-R-12", "skill": "reading", "num": 12, "format": "order", "title": "Job application", "body": "Dear Ms Summers, I am writing to apply for the role of Store Manager advertised on your website.", "question": "Put the sentences in the correct order.", "options": {"A": "For the above reasons, I believe I would be perfect for this position and look forward to hearing from you.", "B": "I also have significant experience as a manager, including five years managing a large supermarket.", "C": "As you can see from my CV, I have a range of skills that would be useful in this role."}, "answer": "C,B,A", "explanation": "C introduces the writer's skills first. B adds more with 'I also have', and A closes the letter with 'For the above reasons', summing up the points before it.", "audio_url": "", "transcript": ""}, {"id": "B1-L-01", "skill": "listening", "num": 1, "format": "mcq", "title": "Swimming lessons", "body": "", "question": "What lesson does the man decide on?", "options": {"A": "Wednesday at 4:30.", "B": "Thursday at 4:00.", "C": "Thursday at 4:30."}, "answer": "C", "explanation": "Wednesday is ruled out (only one space), so he picks Thursday, and \"the later one\" of 16:00 / 16:30 is 16:30, which is 4:30 (C). Wednesday is full, so A is a trap, and he chooses the later time, not 4:00 (B).", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/1_L_B1_Swimming+lessons.mp3", "transcript": "Male: Hi, I'd like to enroll my children for swimming lessons.\nFemale: Okay, right, let's see. What proficiency level are they?\nMale: I think they're both intermediate.\nFemale: Great, now the intermediate lessons are at 16:00 or 16:30, and they last for 30 minutes.\nMale: How is the availability on Wednesdays?\nFemale: Oh, I'm sorry, there is only one space available on Wednesdays, can you do another day?\nMale: Thursday is a possibility, can we book the later one?\nFemale: It looks like we have space then, so let me take some details."}, {"id": "B1-L-02", "skill": "listening", "num": 2, "format": "mcq", "title": "A shopping list", "body": "", "question": "What do the man and the woman need to buy?", "options": {"A": "Onions and garlic.", "B": "Pasta and tomatoes.", "C": "Tomatoes and garlic."}, "answer": "C", "explanation": "She says \"we need a sauce, so get some tomatoes and garlic\", so the answer is C. They already have enough pasta and they still have onions from last week, so A and B are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/2_L_B1_A+shopping+list.mp3", "transcript": "Male: I'm going to the supermarket, what do we need?\nFemale: Oh, um, I don't know, let's look. We have lots of potatoes, some rice and peppers.\nMale: Oh okay, don't forget your whole family is coming around for dinner tomorrow, do we have enough pasta for everyone?\nFemale: Um, for six people, yes, I think so, but we need a sauce, so get some tomatoes and garlic.\nMale: Do we still have onions from last week?\nFemale: Err, yes we do, so that's everything then."}, {"id": "B1-L-03", "skill": "listening", "num": 3, "format": "mcq", "title": "Dangerous weather", "body": "", "question": "When are people allowed to leave home?", "options": {"A": "If it is necessary.", "B": "To contact the police.", "C": "To obtain information."}, "answer": "A", "explanation": "She says \"do not leave your home unless it is absolutely necessary\", so people may only leave if it is necessary (A). The police are only for a real emergency (you call, not visit), and information comes from radio and TV at home, so B and C are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/3_L_B1_Dangerous+weather.mp3", "transcript": "Female: The government has repeated its warnings about the weather for the next few days. The entire country is expecting heavy rain and strong winds. There are already flood warnings in place for much of Wales and the South West. All trains in these areas have been suspended. During this time, do not leave your home unless it is absolutely necessary, and do not call the police unless it is a real emergency. Regular updates will be made on radio, television, Internet and via text message."}, {"id": "B1-L-04", "skill": "listening", "num": 4, "format": "mcq", "title": "Bank problems", "body": "", "question": "What happened with the woman's bank account?", "options": {"A": "The account was closed.", "B": "A payment was rejected.", "C": "Money was stolen."}, "answer": "B", "explanation": "She says the bank \"noticed an unusual payment and stopped it\", so a payment was rejected (B). Her card details were stolen but she answers \"No\" when asked if money was stolen, and the account was not closed, so C and A are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/4_L_B1_Bank+problems.mp3", "transcript": "Female: I think somebody stole my bank card details yesterday.\nMale: Oh no, how could that happen?\nFemale: Well, the bank said it was probably when I paid for the taxi from the airport, returning from holiday.\nMale: Has any money been stolen from your account?\nFemale: No, the bank was fantastic, they noticed an unusual payment and stopped it.\nMale: Then what happened?\nFemale: I did some shopping this morning, but my bank card didn't work, so I had to phone the bank and that was when I found out.\nMale: Thank goodness the bank acted quickly."}, {"id": "B1-L-05", "skill": "listening", "num": 5, "format": "mcq", "title": "Radio guest", "body": "", "question": "What is today's guest famous for?", "options": {"A": "TV acting.", "B": "Book author.", "C": "Radio presenting."}, "answer": "B", "explanation": "The host introduces her as \"award-winning author Aisha Ali\", so she is famous as a book author (B). The TV show is a new project (and she won't act in it), and she is only a guest on the radio, not the presenter, so A and C are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/5_L_B1_Radio+guest.mp3", "transcript": "Male: And now it's time to welcome today's guest on the show. Good morning to award-winning author Aisha Ali. Hi Aisha.\nFemale: Hi David, thanks for having me, I've always wanted to be on the radio.\nMale: Excellent, so tell us more about your latest project.\nFemale: Well, I was contacted by a media company who wants to turn my most recent book into a TV show. So, I'm busy working on the adaptation.\nMale: Excellent stuff, will you have an acting part?\nFemale: I doubt it, they get professionals to do the acting."}, {"id": "B1-L-06", "skill": "listening", "num": 6, "format": "mcq", "title": "Hard work", "body": "", "question": "What does the man offer to do for the woman?", "options": {"A": "Some work at the weekend.", "B": "Some of her work tomorrow.", "C": "Two jobs tomorrow."}, "answer": "B", "explanation": "He agrees to do \"some of the statistical analysis for one of the jobs\" and will \"start in the morning\", so he offers some of her work tomorrow (B). She has two jobs (not him), and the weekend is when she is away, so C and A are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/6_L_B1_Hard+work.mp3", "transcript": "Male: I'll be glad when the weekend comes, I've had so much work this week.\nFemale: Me too, I have two jobs to finish by tomorrow.\nMale: Really, I managed to finish most of mine, do you need any help with anything?\nFemale: That's so nice, um, could you possibly do some of the statistical analysis for one of the jobs?\nMale: I'm sure I can manage that, if you send me the data, I will start in the morning.\nFemale: Fantastic, I can't do it at the weekend, as I'm going away."}, {"id": "B1-L-07", "skill": "listening", "num": 7, "format": "mcq", "title": "Buying a newspaper", "body": "", "question": "Where will the woman go?", "options": {"A": "The gardens.", "B": "The swimming baths.", "C": "The railway station."}, "answer": "C", "explanation": "She wants a newspaper, and he says \"you can get one at Piccadilly Train Station\", so she goes to the railway station (C). The gardens and swimming baths are just landmarks used to give directions, so both are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/7_L_B1_Buying+a+newspaper.mp3", "transcript": "Female: Excuse me, do you know where I can buy a newspaper?\nMale: Let me think, oh yes, you can get one at Piccadilly Train Station.\nFemale: Thanks, how do I get there? I'm not from around here.\nMale: Can you see that large yellow building over there, the one with the gardens?\nFemale: Yes.\nMale: That's the swimming baths, if you turn right there and walk about 100 yards, you'll see the station on the left, you can't miss it, it's opposite the library.\nFemale: Thanks, I'll do that."}, {"id": "B1-L-08", "skill": "listening", "num": 8, "format": "mcq", "title": "Sharing a flat", "body": "", "question": "Why did the man tell his friend to leave?", "options": {"A": "He didn't return the games.", "B": "He didn't clean his room.", "C": "He didn't pay his rent."}, "answer": "C", "explanation": "He says \"last month he didn't pay his rent, that was it, I told him to leave\", so the answer is C. The messy kitchen annoyed him but wasn't the final reason, and the games were just lent, so A and B are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/8_L_B1_Sharing+a+flat.mp3", "transcript": "Male: I used to share my apartment with a friend, but not anymore. At the start we got on really well, we both liked the same sort of computer games and I often lent him my games, but after awhile I realised that every time I went into the kitchen, there were dirty plates in the sink and the cooker was a mess. I usually had to clean it all up. then last month he didn't pay his rent, that was it, I told him to leave."}, {"id": "B1-L-09", "skill": "listening", "num": 9, "format": "mcq", "title": "Looking for Daniela", "body": "", "question": "Where was the man going to meet Daniela?", "options": {"A": "At the staff meeting.", "B": "At the reception.", "C": "At the gym."}, "answer": "C", "explanation": "He says \"I was supposed to see her at the gym at 10:00\", so the answer is C. He wasn't at the staff meeting, and the reception is just where she gave him her number yesterday, so A and B are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/9_L_B1_Looking+for+Daniela.mp3", "transcript": "Male: Oh hi Jules, have you seen Daniela anywhere?\nFemale: No, not since early this morning, she was at the staff meeting we had earlier.\nMale: I wasn't at that meeting, I was supposed to see her at the gym at 10:00, but she never turned up.\nFemale: Do you have her mobile number?\nMale: Yes, she gave it to me yesterday at the reception, I'll give her a call now, thanks."}, {"id": "B1-L-10", "skill": "listening", "num": 10, "format": "mcq", "title": "At the airport", "body": "", "question": "When is the man's birthday?", "options": {"A": "January.", "B": "February.", "C": "March."}, "answer": "B", "explanation": "He says \"I put March instead of February for my birthday\", so his real birthday is in February (B). March is the wrong month he typed, and January is just another option the system offers for the 29th, so both are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/10_L_B1_At+the+airport.mp3", "transcript": "Male: It was a complete nightmare actually, they almost didn't let me board the plane because I filled out the passport information on the website with the wrong information. Everything else was okay, then I put March instead of February for my birthday, it's on 29th you see, and most systems only let you put 29th January or March. I'm usually so careful, they let me through in the end, but it was a very stressful start to the holiday."}, {"id": "B1-L-11", "skill": "listening", "num": 11, "format": "mcq", "title": "Homework problems", "body": "", "question": "What is the problem with the homework?", "options": {"A": "There isn't enough feedback.", "B": "It isn't challenging.", "C": "There is too much of it."}, "answer": "A", "explanation": "She says it \"isn't give a mark or there isn't any feedback, so he has no idea whether he did it properly\", so the problem is too little feedback (A). She directly says the challenge level \"isn't the issue\", and amount is never mentioned, so B and C are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/11_L_B1_Homework+problems.mp3", "transcript": "Female: I'm getting pretty annoyed about Sam's homework.\nMale: Why, isn't it challenging enough?\nFemale: No, that isn't the issue, sometimes it doesn't make any sense and even if it does, it often isn't give a mark or there isn't any feedback, so he has no idea whether he did it properly or not. I'm getting more and more annoyed and he's becoming more and more upset.\nMale: Sounds like the pair of us need to talk to his teacher, have you contacted him?"}, {"id": "B1-L-12", "skill": "listening", "num": 12, "format": "mcq", "title": "Identity card", "body": "", "question": "What information is on the identity card?", "options": {"A": "Institutional email address.", "B": "Emergency phone number.", "C": "Name of the course."}, "answer": "A", "explanation": "She says the card shows \"your name, student number and college email address\", so the answer is A (the institutional/college email). No phone number or course name is listed on the card, so B and C are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/12_L_B1_Identity+card.mp3", "transcript": "Female: Hello everybody, and welcome to Clifton College, I am your course director. Now, please put your mobile phones away for a moment and listen, because I have some important information for you. But first of all, I have a question, does everyone here have a student identity card, and a college Internet account? On the card if you have one, you should see your name, student number and college email address. If you don't have a student card, please put your hand up so I can see you."}, {"id": "B1-L-13", "skill": "listening", "num": 13, "format": "mcq", "title": "A home visitor", "body": "", "question": "What is the relationship between the two speakers?", "options": {"A": "They are neighbours.", "B": "They don't know each other.", "C": "They are colleagues."}, "answer": "B", "explanation": "He introduces himself (\"I'm Antonio\") and she asks for ID, which shows they are strangers, so the answer is B. The \"family next door\" are the neighbours (not these two), and he is a repair worker visiting, not her colleague, so A and C are traps.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/13_L-B1_Home+visitor.mp3", "transcript": "Female: Good morning, can I help you?\nMale: Yes, I understand you're having problems with your dishwasher?\nFemale: No, not us. Maybe it's the family next door? We're having problems with our washing machine.\nMale: Oh, my mistake, yes, on my list it's a washing machine, sorry. I'm Antonio and I work for Horlicks.\nFemale: Do you have any identification with you?\nMale: Yes, of course, here's official ID and the company card. You can call the office if you'd like to confirm.\nFemale: No, that seems fine, okay, come in."}];
window.DATA = DATA;
const LEVEL = "B1";
const TITLE = "EnglishScore Practice Test " + LEVEL;
const N = DATA.length;
const SKILL_LABEL = {grammar:"Grammar",vocabulary:"Vocabulary",reading:"Reading",listening:"Listening"};
const esc = s => (s===undefined||s===null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ans = {};            // i -> "B" or ["A","C","B"]
const stu = {name:"", email:""};
let idx = 0;               // 0 start, 1..N questions, N+1 results
let startTime = 0;
const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const prog = document.getElementById("prog");
const validEmail = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);

function setProgress(){ prog.style.width = (idx===0?0 : idx>N?100 : Math.round((idx-1)/N*100)) + "%"; }
function answeredCount(){ let n=0; for(let i=0;i<N;i++){ const a=ans[i]; if(Array.isArray(a)){ if(a.length===3 && a.every(Boolean)) n++; } else if(a) n++; } return n; }

function render(){
  setProgress();
  if(idx===0) return renderStart();
  if(idx>N) return renderResults();
  renderQuestion(idx-1);
}

function renderStart(){
  screen.innerHTML =
    `<div class="card">
      <h2 style="margin:0 0 6px">Before you start</h2>
      <p class="note" style="margin:0 0 18px">Intermediate level. ${N} questions covering Grammar, Vocabulary, Reading and Listening. Your name and email are required so we can send your result to your tutor and a confirmation to you.</p>
      <div class="field" id="f-name"><label>Full name</label><input id="in-name" autocomplete="name" placeholder="e.g. Jane Lee"><div class="err">Please enter your name.</div></div>
      <div class="field" id="f-email"><label>Email address</label><input id="in-email" type="email" autocomplete="email" placeholder="you@example.com"><div class="err">Please enter a valid email address.</div></div>
    </div>`;
  bar.innerHTML = `<span class="count">Step 1 of ${N+1}</span><button class="btn-go" id="start">Start test &rarr;</button>`;
  const nm=document.getElementById("in-name"), em=document.getElementById("in-email");
  nm.value=stu.name; em.value=stu.email;
  document.getElementById("start").onclick = () => {
    stu.name=nm.value.trim(); stu.email=em.value.trim();
    let bad=false;
    document.getElementById("f-name").classList.toggle("bad", !stu.name); if(!stu.name) bad=true;
    const eok=validEmail(stu.email); document.getElementById("f-email").classList.toggle("bad", !eok); if(!eok) bad=true;
    if(bad) return;
    startTime=Date.now();
    idx=1; render(); window.scrollTo(0,0);
  };
}

function questionInner(q,i){
  let h = `<div class="meta">${SKILL_LABEL[q.skill]} &middot; Question ${q.num}</div>`;
  if(q.title) h += `<div class="title">${esc(q.title)}</div>`;
  if(q.audio_url) h += `<audio controls preload="none" src="${q.audio_url}"></audio>`;
  if(q.format==="passageq") h += `<div class="passage">${esc(q.body)}</div>`;
  else if(q.body) h += `<div class="body">${esc(q.body)}</div>`;
  const saved = ans[i];
  if(q.format==="order"){
    h += `<div class="prompt">${esc(q.question)}</div><div class="order">`;
    ["A","B","C"].forEach(L => h += `<div class="sent"><b>${L}.</b> ${esc(q.options[L])}</div>`);
    h += `<div class="picks">`;
    [0,1,2].forEach(p => {
      const v = Array.isArray(saved)?saved[p]:"";
      h += `<label>Position ${p+1}<select data-pos="${p}">`+
           `<option value="">--</option>`+
           ["A","B","C"].map(L=>`<option ${v===L?"selected":""}>${L}</option>`).join("")+
           `</select></label>`;
    });
    h += `</div></div>`;
  } else {
    if(q.question) h += `<div class="prompt">${esc(q.question)}</div>`;
    ["A","B","C"].forEach(L => {
      const on = saved===L;
      h += `<label class="opt${on?" sel":""}" data-opt="${L}"><input type="radio" name="opt" value="${L}" ${on?"checked":""}>${L}. ${esc(q.options[L])}</label>`;
    });
  }
  return h;
}

function saveCurrent(i){
  const q=DATA[i];
  if(q.format==="order"){
    ans[i] = [...document.querySelectorAll('select[data-pos]')].map(s=>s.value);
  } else {
    const sel=document.querySelector('input[name="opt"]:checked');
    ans[i] = sel?sel.value:undefined;
  }
}

function renderQuestion(i){
  const q=DATA[i];
  screen.innerHTML = `<div class="card">${questionInner(q,i)}</div>`;
  // live highlight for radio selection
  screen.querySelectorAll('.opt').forEach(o => o.addEventListener('change', ()=>{
    screen.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');
  }));
  const last = (i === N-1);
  bar.innerHTML =
    `<span class="count">Question ${i+1} of ${N}</span>`+
    `<button class="btn-ghost" id="back">&larr; Back</button>`+
    (last ? `<button class="btn-go" id="finish">Finish &amp; submit</button>`
          : `<button class="btn-go" id="next">Next &rarr;</button>`);
  document.getElementById("back").onclick = ()=>{ saveCurrent(i); idx--; render(); window.scrollTo(0,0); };
  const adv = document.getElementById(last?"finish":"next");
  adv.onclick = ()=>{
    saveCurrent(i);
    if(last){
      const miss = N - answeredCount();
      if(miss>0 && !confirm(miss+" question(s) are unanswered. Submit anyway?")) return;
      idx=N+1; render(); window.scrollTo(0,0);
    } else { idx++; render(); window.scrollTo(0,0); }
  };
}

function grade(){
  const items=[]; let points=0;
  DATA.forEach((q,i)=>{
    const a=ans[i];
    let your, ok;
    if(q.format==="order"){
      const got = Array.isArray(a)?a.join(","):"";
      ok = got===q.answer;
      your = Array.isArray(a)&&a.every(Boolean) ? a.join(",") : "(blank)";
    } else {
      ok = a===q.answer;
      your = a ? (a+". "+q.options[a]) : "(blank)";
    }
    if(ok) points++;
    const correct = q.format==="order" ? q.answer : (q.answer+". "+q.options[q.answer]);
    items.push({n:i+1, skill:SKILL_LABEL[q.skill], title:q.title||"", body:q.body||"", format:q.format, question:q.question||"", explanation:q.explanation||"", your, correct, ok});
  });
  return {points, total:N, pct:Math.round(points/N*100), items};
}

function sendResult(g){
  const date = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const payload = {name:stu.name, email:stu.email, level:LEVEL, title:TITLE, date,
                   elapsedSeconds: startTime ? Math.round((Date.now()-startTime)/1000) : 0,
                   points:g.points, total:g.total, pct:g.pct, items:g.items};
  const url = window.ES_ENDPOINT;
  if(url && /^https?:\/\//.test(url)){
    try{
      fetch(url, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
      return true;
    }catch(e){ return false; }
  }
  return false;
}

function renderResults(){
  const g = grade();           // graded for the tutor; the student does not see it
  const sent = sendResult(g);
  screen.innerHTML =
    `<div class="card" style="text-align:center;padding:44px 26px">`+
      `<div style="width:60px;height:60px;border-radius:50%;background:#eafaf2;color:#1a9e6b;font-size:32px;line-height:60px;margin:0 auto 16px;font-weight:800">&#10003;</div>`+
      `<h2 style="margin:0 0 12px">Test submitted</h2>`+
      `<p class="note" style="font-size:15px;max-width:460px;margin:0 auto;line-height:1.6">Thank you, ${esc(stu.name)}. Your responses have been sent to HK-Schools.com for review.`+
        (sent?` A confirmation has been emailed to <b>${esc(stu.email)}</b>.`:``)+
        ` Your teacher will go through the results with you.</p>`+
    `</div>`+
    `<div class="footer">Questions and audio &copy; British Council EnglishScore, used for practice by HK-Schools.com.</div>`;
  bar.innerHTML = `<span class="count" style="margin:0 auto">Submitted</span>`;
}

render();
</script>
