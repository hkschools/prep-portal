<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishScore Practice Test B2</title>
<script src="../config.js"></script>
<style>
:root{--teal:#14746b;--navy:#2d0a54;--ink:#1c2733;--line:#e3e6ea;--ok:#1a9e6b;--no:#d23a3a;--lvl:#ff5a3c;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f6f8;line-height:1.55}
header{background:var(--teal);color:#fff;padding:16px 20px}
header .wrap{max-width:720px;margin:0 auto}
header .crumb{font-size:13px;opacity:.85}
header .crumb a{color:#fff}
header h1{margin:5px 0 0;font-size:20px}
.chip{display:inline-block;background:var(--lvl);color:#fff;font-weight:700;border-radius:5px;padding:2px 9px;font-size:14px;vertical-align:middle}
.progwrap{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:12px;overflow:hidden}
.progbar{height:100%;width:0;background:#fff;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:22px 16px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 22px;margin:0 0 14px}
.field{margin:0 0 16px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:16px}
.field input:focus{outline:none;border-color:var(--teal)}
.field .err{color:var(--no);font-size:13px;margin-top:5px;display:none}
.field.bad input{border-color:var(--no)}
.field.bad .err{display:block}
.meta{font-size:12px;color:#8a94a0;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.title{font-weight:700;font-size:18px;margin:4px 0 12px}
.body{white-space:pre-wrap;margin:6px 0 12px;font-size:15.5px}
.passage{background:#f7f8fa;border-left:3px solid var(--teal);border-radius:6px;padding:12px 15px;margin:6px 0 14px;font-size:15px;white-space:pre-wrap}
.prompt{font-weight:600;margin:10px 0 10px}
audio{width:100%;margin:4px 0 14px}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:9px 0;cursor:pointer;font-size:16px}
.opt:hover{border-color:#9aa4af}
.opt.sel{border-color:var(--teal);background:#eef7f5}
.opt input{margin-right:10px}
.opt.correct{border-color:var(--ok);background:#eafaf2}
.opt.wrong{border-color:var(--no);background:#fdeced}
.order .sent{border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin:7px 0;font-size:15px}
.order .sent b{color:var(--navy)}
.order .picks{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.order .picks label{font-size:13px;font-weight:600}
.order select{display:block;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.note{font-size:14px;color:#5a6573}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px}
.bar .inner{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .count{font-size:13px;color:#6b7682;font-weight:600;margin-right:auto}
button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:12px 22px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--teal);color:#fff}
.btn-ghost{background:#eef1f4;color:var(--ink)}
.result{background:var(--navy);color:#fff;border-radius:14px;padding:22px 24px;margin:0 0 16px}
.result .pct{font-size:36px;font-weight:800}
.result .sub{font-size:15px;opacity:.92;margin-top:6px}
.sent-note{background:#eafaf2;border:1px solid #bfe9d4;border-radius:10px;padding:12px 15px;font-size:14px;margin:0 0 16px}
.rev .meta2{font-size:12px;color:#8a94a0;font-weight:600}
.fb{margin-top:10px;font-size:14px;border-radius:8px;padding:10px 12px}
.fb.right{background:#eafaf2;border:1px solid #bfe9d4}
.fb.wrong{background:#fdeced;border:1px solid #f3c6c6}
.fb .tag{font-weight:700}
.fb details{margin-top:7px}
.fb summary{cursor:pointer;color:var(--teal);font-weight:600}
.fb .tr{white-space:pre-wrap;font-size:13.5px;margin-top:6px;color:#42505e}
.footer{font-size:12px;color:#8a94a0;margin-top:24px;text-align:center}
.footer a{color:#6b7682}
</style>
</head>

<header><div class="wrap">

<script>
const DATA = [{"id": "B2-G-01", "skill": "grammar", "num": 1, "format": "mcq", "title": "Great concert", "body": "A: I heard the concert was amazing. It's a pity we couldn't go. / B: If only _____ bought a ticket in advance!", "question": "Choose the correct word to complete the conversation.", "options": {"A": "I've", "B": "I", "C": "I'd"}, "answer": "C", "explanation": "'If only' + past perfect ('I'd' = I had bought) expresses a regret about the past. 'I've' (present perfect) is wrong because regrets about the past use the past perfect, not the present perfect.", "audio_url": "", "transcript": ""}, {"id": "B2-G-02", "skill": "grammar", "num": 2, "format": "mcq", "title": "With conditions", "body": "We can renegotiate your contract _____ your deal with the buyers goes through. Unfortunately, if there's no deal, you'll have to wait until your next performance meeting.", "question": "Choose the correct word to complete the text.", "options": {"A": "as if", "B": "as long as", "C": "in order that"}, "answer": "B", "explanation": "'as long as' introduces a condition meaning 'only if' (only if the deal goes through). 'as if' describes a manner or comparison, so it does not express this condition.", "audio_url": "", "transcript": ""}, {"id": "B2-G-03", "skill": "grammar", "num": 3, "format": "mcq", "title": "Crowded city", "body": "When he took me to the city centre I couldn't believe how busy it was. I was _____ .", "question": "Choose the correct word to complete the text.", "options": {"A": "amazing", "B": "amazed", "C": "amazement"}, "answer": "B", "explanation": "An '-ed' adjective ('amazed') describes how a person feels. The '-ing' adjective 'amazing' describes the thing that causes the feeling, so it cannot describe how 'I' felt.", "audio_url": "", "transcript": ""}, {"id": "B2-G-04", "skill": "grammar", "num": 4, "format": "mcq", "title": "Party invitation", "body": "I'm doing my best to persuade John _____ to the party at the Town Hall. However, I'm afraid he hasn't confirmed yet.", "question": "Choose the correct word to complete the text.", "options": {"A": "that he comes", "B": "coming", "C": "to come"}, "answer": "C", "explanation": "After 'persuade someone' we use the 'to + infinitive' ('persuade John to come'). The '-ing' form and the 'that' clause do not follow the 'persuade + object + to-infinitive' pattern.", "audio_url": "", "transcript": ""}, {"id": "B2-G-05", "skill": "grammar", "num": 5, "format": "mcq", "title": "A polite request", "body": "Glenda, turn off the lights for us, _____ ? We'll be able to see the presentation a bit better that way.", "question": "Choose the correct word to complete the text.", "options": {"A": "will you", "B": "don't you", "C": "shall you"}, "answer": "A", "explanation": "After an imperative (a command like 'turn off the lights'), the usual question tag is 'will you?'. 'don't you' and 'shall you' are not used as tags after a command.", "audio_url": "", "transcript": ""}, {"id": "B2-G-06", "skill": "grammar", "num": 6, "format": "mcq", "title": "Winner", "body": "You think Fittipaldi will win the Grand Prix? Well, I suppose he _____ . It all depends on the weather, really.", "question": "Choose the correct word to complete the text.", "options": {"A": "shall", "B": "would", "C": "might"}, "answer": "C", "explanation": "'might' is the modal of possibility, fitting 'it all depends on the weather' (it is not certain). 'shall' expresses a strong intention or offer, not uncertainty, so it does not fit.", "audio_url": "", "transcript": ""}, {"id": "B2-G-07", "skill": "grammar", "num": 7, "format": "mcq", "title": "Best new product", "body": "If the chief engineer _____ his design a few years ago, he wouldn't be receiving that award now.", "question": "Choose the correct word to complete the text.", "options": {"A": "hadn't developed", "B": "didn't develop", "C": "hasn't developed"}, "answer": "A", "explanation": "This is a mixed conditional: a past 'if' clause uses the past perfect ('hadn't developed') to talk about an unreal past condition with a present result. 'didn't develop' is simple past and cannot show this unreal past situation.", "audio_url": "", "transcript": ""}, {"id": "B2-G-08", "skill": "grammar", "num": 8, "format": "mcq", "title": "A great employee", "body": "_____ in the restaurant for so many years, Helena had become an expert in knowing how to deal with difficult customers.", "question": "Choose the correct word to complete the text.", "options": {"A": "After having worked", "B": "Because of work", "C": "Since working"}, "answer": "A", "explanation": "'After having worked' is a perfect participle clause that correctly shows one action finished before another ('had become'). 'Since working' wrongly suggests a continuing action rather than a completed period before the result.", "audio_url": "", "transcript": ""}, {"id": "B2-G-09", "skill": "grammar", "num": 9, "format": "mcq", "title": "Good feelings", "body": "As I lay in the sunshine, a feeling of _____ came over me, and I felt sure that everything would be OK.", "question": "Choose the correct word to complete the text.", "options": {"A": "a great calm", "B": "great calm", "C": "the great calm"}, "answer": "B", "explanation": "Here 'calm' is used as an uncountable abstract noun, so it takes no article ('great calm'). 'a great calm' is wrong because uncountable feelings like this do not normally take 'a'.", "audio_url": "", "transcript": ""}, {"id": "B2-G-10", "skill": "grammar", "num": 10, "format": "mcq", "title": "Handheld devices", "body": "In the long term, I think mobile phones and tablets _____ have a lasting effect on the way we work.", "question": "Choose the correct word to complete the text.", "options": {"A": "might obviously", "B": "certainly can", "C": "will definitely"}, "answer": "C", "explanation": "Adverb word order: the adverb 'definitely' goes between the modal 'will' and the main verb ('will definitely have'). 'might obviously' mixes a weak possibility with a strong adverb, which does not fit naturally.", "audio_url": "", "transcript": ""}, {"id": "B2-G-11", "skill": "grammar", "num": 11, "format": "mcq", "title": "Talks collapse", "body": "The negotiations failed because the president seemed to be ignorant of the rules the committee had all agreed _____ beforehand.", "question": "Choose the correct word to complete the text.", "options": {"A": "through", "B": "upon", "C": "at"}, "answer": "B", "explanation": "The fixed phrase 'agree upon (something)' means to reach a decision together about rules. 'agree at' and 'agree through' are not correct prepositions with 'agree'.", "audio_url": "", "transcript": ""}, {"id": "B2-G-12", "skill": "grammar", "num": 12, "format": "mcq", "title": "Annual holiday", "body": "The highlight of the year was my cruise holiday. _____ that was particularly enjoyable was the opportunity to experience different cities and cultures.", "question": "Choose the correct word to complete the text.", "options": {"A": "Something", "B": "Anything", "C": "Everything"}, "answer": "A", "explanation": "'Something' is the right indefinite pronoun for one positive specific thing in a statement. 'Anything' is normally used in questions or negatives, so it does not fit this positive sentence.", "audio_url": "", "transcript": ""}, {"id": "B2-G-13", "skill": "grammar", "num": 13, "format": "mcq", "title": "Action film", "body": "In the opening scene of the movie, a mysterious masked figure _____ down the door of a New York apartment and starts looking for something.", "question": "Choose the correct word to complete the text.", "options": {"A": "kicked", "B": "has kicked", "C": "kicks"}, "answer": "C", "explanation": "We use the present simple ('kicks') to narrate the events of a film or story, and it matches 'starts' later in the sentence. 'kicked' is past simple, which breaks the present-tense narration.", "audio_url": "", "transcript": ""}, {"id": "B2-V-01", "skill": "vocabulary", "num": 1, "format": "mcq", "title": "Finding a bargain", "body": "This belt was so cheap! I can’t believe it’s _____ Dolce & Gabbana.\nIt probably isn’t for that price!", "question": "Choose the correct word to complete the conversation.", "options": {"A": "a true", "B": "a genuine", "C": "a valid"}, "answer": "B", "explanation": "'Genuine' means real and not a fake copy, which fits doubting whether a cheap belt is really a designer brand. 'Valid' is used for tickets, documents or arguments, not for whether a product is authentic.", "audio_url": "", "transcript": ""}, {"id": "B2-V-02", "skill": "vocabulary", "num": 2, "format": "mcq", "title": "A job interview", "body": "What makes you suitable for this _____ ?\nWell, I graduated top of my class and have experience in some of the most respected firms in the industry.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "advert", "B": "function", "C": "role"}, "answer": "C", "explanation": "A 'role' means a job or position, so 'suitable for this role' is natural in a job interview. An 'advert' is the advertisement for the job, not the job itself, so being 'suitable for this advert' does not make sense.", "audio_url": "", "transcript": ""}, {"id": "B2-V-03", "skill": "vocabulary", "num": 3, "format": "mcq", "title": "Job evaluation", "body": "Do you think Gabriela is a competent lawyer?\nYes, I think she showed herself to be extremely _____ in her last case.", "question": "Choose the correct word to complete the conversation.", "options": {"A": "capacious", "B": "capable", "C": "brilliant"}, "answer": "B", "explanation": "'Capable' means able to do something well, and it matches 'competent' in the question. 'Capacious' looks similar but means having a lot of space (a capacious bag), so it does not describe a person's ability.", "audio_url": "", "transcript": ""}, {"id": "B2-V-04", "skill": "vocabulary", "num": 4, "format": "mcq", "title": "Singing in a choir", "body": "I’m going to join the new choir. Do you want to come?\nI’m far too _____ to be singing in public. Let me practise first!", "question": "Choose the correct word to complete the conversation.", "options": {"A": "rusty", "B": "rotten", "C": "rough"}, "answer": "A", "explanation": "'Rusty' means out of practice, so your skill is weak because you have not done it for a long time, which fits 'let me practise first'. 'Rotten' means bad or decayed and is not used for a skill that needs practice.", "audio_url": "", "transcript": ""}, {"id": "B2-V-05", "skill": "vocabulary", "num": 5, "format": "mcq", "title": "Employee of the year", "body": "Hardworking, cheerful, patient, these are just a few examples of Gill’s many admirable _____ . This award is very much deserved.", "question": "Choose the correct word to complete the text.", "options": {"A": "achievements", "B": "qualities", "C": "assets"}, "answer": "B", "explanation": "'Qualities' are the good features of a person's character, which matches 'hardworking, cheerful, patient'. 'Achievements' are things you have done or completed, not personality features, so they do not fit the listed adjectives.", "audio_url": "", "transcript": ""}, {"id": "B2-V-06", "skill": "vocabulary", "num": 6, "format": "mcq", "title": "Your new phone", "body": "The system will monitor the equipment’s health and alert you only when _____ is really necessary.", "question": "Choose the correct word to complete the text.", "options": {"A": "requirement", "B": "maintenance", "C": "regulation"}, "answer": "B", "explanation": "'Maintenance' means the work of repairing and looking after equipment to keep it working, which fits monitoring the equipment's health. 'Regulation' means an official rule, which has nothing to do with fixing equipment.", "audio_url": "", "transcript": ""}, {"id": "B2-V-07", "skill": "vocabulary", "num": 7, "format": "mcq", "title": "Be prepared for weather", "body": "Weather conditions in this part of the world can be very unpredictable. Ensure you _____ yourselves properly with warm, waterproof clothing.", "question": "Choose the correct word to complete the text.", "options": {"A": "equip", "B": "supply", "C": "provide"}, "answer": "A", "explanation": "'Equip yourself with something' means to get the things you need ready to use, which fits getting warm clothing for bad weather. 'Provide' and 'supply' mean to give things to other people, and they are not normally used with 'yourselves' in this way.", "audio_url": "", "transcript": ""}, {"id": "B2-V-08", "skill": "vocabulary", "num": 8, "format": "mcq", "title": "Bad day for business", "body": "Sahar was having a _____ day in the shop. There’d only been three customers all day, so she decided to close up early and go home.", "question": "Choose the correct word to complete the text.", "options": {"A": "slim", "B": "slight", "C": "slow"}, "answer": "C", "explanation": "A 'slow' day means a day with little business or few customers, which matches 'only three customers all day'. 'Slim' and 'slight' mean thin or small in amount and are not used to describe a quiet business day.", "audio_url": "", "transcript": ""}, {"id": "B2-V-09", "skill": "vocabulary", "num": 9, "format": "mcq", "title": "Skin treatment", "body": "The treatment helps to prevent skin from ageing and to keep _____ look.", "question": "Choose the correct word to complete the text.", "options": {"A": "a youthful", "B": "a modern", "C": "an in-depth"}, "answer": "A", "explanation": "'Youthful' means looking young and fresh, which is the opposite of ageing, so it fits a skin treatment. 'Modern' means up to date in style and is used for things like design, not for how young skin looks.", "audio_url": "", "transcript": ""}, {"id": "B2-V-10", "skill": "vocabulary", "num": 10, "format": "mcq", "title": "Protest", "body": "The government is asking the workers to _____ the strike and return to work.", "question": "Choose the correct word to complete the text.", "options": {"A": "call off", "B": "take down", "C": "pull up"}, "answer": "A", "explanation": "'Call off' is a phrasal verb meaning to cancel or stop a planned event, so 'call off the strike' means to end it, which matches 'return to work'. 'Take down' means to remove or write down something and does not mean cancelling an event.", "audio_url": "", "transcript": ""}, {"id": "B2-V-11", "skill": "vocabulary", "num": 11, "format": "mcq", "title": "Employee review", "body": "Well done! You have _____ that you are a capable worker and a real team player this year. It’s great to have you in the department.", "question": "Choose the correct word to complete the text.", "options": {"A": "praised", "B": "claimed", "C": "demonstrated"}, "answer": "C", "explanation": "'Demonstrated' means shown clearly through your actions that something is true, which fits proving you are a capable worker. 'Claimed' means said something is true without proof, but the praise here shows it has actually been proven.", "audio_url": "", "transcript": ""}, {"id": "B2-V-12", "skill": "vocabulary", "num": 12, "format": "mcq", "title": "Nature magazine", "body": "New farming methods are affecting wildlife. For example, there has been a large _____ in the numbers of birds spotted in rural areas.", "question": "Choose the correct word to complete the text.", "options": {"A": "scale", "B": "drop", "C": "shade"}, "answer": "B", "explanation": "A 'drop' means a fall or decrease, so 'a large drop in the numbers of birds' means fewer birds, which fits the harm to wildlife. 'Scale' means size or level, but 'a large scale in the numbers' does not express a decrease.", "audio_url": "", "transcript": ""}, {"id": "B2-V-13", "skill": "vocabulary", "num": 13, "format": "mcq", "title": "Making a complaint", "body": "Merve suggested I should follow the _____ procedures to complain about my ill-treatment by the management.", "question": "Choose the correct word to complete the text.", "options": {"A": "maintenance", "B": "grievance", "C": "accounting"}, "answer": "B", "explanation": "A 'grievance' is an official complaint about unfair treatment at work, so 'grievance procedures' are the steps for making such a complaint. 'Maintenance' is about repairing equipment and has nothing to do with complaining about management.", "audio_url": "", "transcript": ""}, {"id": "B2-R-01", "skill": "reading", "num": 1, "format": "heading", "title": "", "body": "When the economy isn't going too well, most people would do anything to keep their jobs. But companies sometimes take advantage of this and become more demanding. The result is that we end up giving them more of our time than we should. So, we need to take a step back and consider just how much of our lives we want to dedicate to work. After all, if we are always working, when can we possibly have time to ourselves? We need to be able to relax for a while. Taking time to unwind is what keeps us healthy.", "question": "Choose the best heading for the text.", "options": {"A": "Not everything is about work", "B": "Hard work is the key to success", "C": "Making sure your job is safe"}, "answer": "A", "explanation": "The paragraph's main idea is that we should limit how much of our lives we give to work and keep time to relax, which 'Not everything is about work' captures. B is off-topic, even contradicting the warning against overwork, and C only picks up the opening line about keeping a job rather than the whole point.", "audio_url": "", "transcript": ""}, {"id": "B2-R-02", "skill": "reading", "num": 2, "format": "heading", "title": "", "body": "Everyone's looked at the green spots, called 'mould', on bread, trying to decide whether to eat it or put it in the bin. With an estimated 6.6 million tonnes of food discarded by households every year, many unnecessarily, how can we know what's safe to eat? Any food can be contaminated as mould likes warm, moist conditions, but although not all mould is bad for us, we have no way of knowing which is which. Instead, we need to be better at planning our meals and should always cut mould out and save the rest of the food to prevent further waste.", "question": "Choose the best heading for the text.", "options": {"A": "The environmental impact of food waste", "B": "Food safety is critical in the home", "C": "How we can avoid throwing food away"}, "answer": "C", "explanation": "The text ends by urging us to plan meals and cut mould out to 'prevent further waste', so the overall point is reducing how much food we throw away. A is too narrow, focusing only on the environment, and B fixes on the mould-safety detail rather than the main message about avoiding waste.", "audio_url": "", "transcript": ""}, {"id": "B2-R-03", "skill": "reading", "num": 3, "format": "heading", "title": "", "body": "The mystery of why Neanderthals died out may have been solved. Scientists say it could have been something as simple as a common childhood illness. A new study has suggested that ear infections were responsible for their disappearance. Today, they can be simply treated with modern medicines like antibiotics. But the Neanderthals contracted many complications from ear infections, including breathing infections, hearing loss and pneumonia. The study published in The Anatomical Record journal found that the ears of Neanderthals were comparable to those of human children and did not change with age, as children's do.", "question": "Choose the best heading for the text.", "options": {"A": "Were Neanderthal children born with hearing difficulties?", "B": "Neanderthals may have been allergic to antibiotic treatments", "C": "Common childhood illness may have killed off Neanderthals"}, "answer": "C", "explanation": "The whole paragraph builds the claim that ear infections, a common childhood illness, may explain why Neanderthals died out, which C states directly. A is too narrow, picking up only the ear detail, and B is off-topic since the text never says they were allergic to antibiotics.", "audio_url": "", "transcript": ""}, {"id": "B2-R-04", "skill": "reading", "num": 4, "format": "heading", "title": "", "body": "The combination of a growing population and an increased number of migrant workers means that there is a shortage of places to live in most major cities. The usual response to this is to simply build more houses and blocks of flats. But there is little space in the city itself to build, so construction usually takes place on green areas in the outskirts. In some areas, forests are even being cleared to build new houses. This is a worrying trend for the future and one that must be stopped if we want to do anything about protecting nature.", "question": "Choose the best heading for the text.", "options": {"A": "Effective solutions for current problems in cities", "B": "Solving one problem but making another one worse", "C": "Imaginative ways to solve the housing crisis"}, "answer": "B", "explanation": "The text shows that building houses solves the housing shortage but harms nature by clearing green areas and forests, exactly the trade-off in 'Solving one problem but making another one worse'. A and C are off-topic because the text criticises the solution rather than praising it as effective or imaginative.", "audio_url": "", "transcript": ""}, {"id": "B2-R-05", "skill": "reading", "num": 5, "format": "heading", "title": "", "body": "You will be in charge of new products for the length of their development. You will supervise all aspects of product creation, marketing and evolution. You will also ensure the product and the marketing efforts to support it match the company's goals and strategies. Among other things, this will include researching customer demand for products and managing the development of marketing activities and advertising strategies. Finally, you will also be required to submit regular reports about product income predictions and results. This will help us as a company to stay up to date with our competitors and competing products.", "question": "Choose the best heading for the text.", "options": {"A": "Job description", "B": "Job application", "C": "Annual review report"}, "answer": "A", "explanation": "The repeated 'You will' duties listing what the role involves make this a job description. B is off-topic since the text is addressed to a candidate rather than written by one, and C is wrong because it sets out future responsibilities, not a review of past performance.", "audio_url": "", "transcript": ""}, {"id": "B2-R-06", "skill": "reading", "num": 6, "format": "heading", "title": "", "body": "The first moon landing was in 1969, and now it has been suggested that we should go back. However, this time, the plan is to stay for a while longer. Scientists argue that a base on the moon can be used to test out some of the difficulties that people going to Mars will have to deal with. But first, they will need to develop all the equipment, from a spacecraft to get there to accommodation once they arrive and a means of transport for the surface. So, they won't be living on the moon just yet.", "question": "Choose the best heading for the text.", "options": {"A": "Early plans to go back to the moon", "B": "Mars mission plans are revealed", "C": "Moon vehicle to be built"}, "answer": "A", "explanation": "The paragraph is about a fresh suggestion to return to the moon and the equipment still needed, with 'not just yet' signalling these are early plans. B is too broad and shifts the focus to Mars, while C is too narrow, naming only the surface transport detail.", "audio_url": "", "transcript": ""}, {"id": "B2-R-07", "skill": "reading", "num": 7, "format": "heading", "title": "", "body": "Hi Akram. You asked about the new booking policy. It seems to be operating quite effectively after a few issues at the beginning, so I'm grateful you allowed me to make those changes as things are definitely moving faster now. Accounts have reported that they are able to track money from bookings with less difficulty, and the reservations staff have been quite positive about it. Jack from IT has made some changes on the system that make life easier. I've got some figures on how this has affected company finances. If you like, I can send them to you. Paula.", "question": "Choose the best heading for the text.", "options": {"A": "Financial benefits of the new booking system", "B": "Feedback on the new booking system", "C": "Operating the new booking system"}, "answer": "B", "explanation": "Paula reports how the new system is going, gathering responses from Accounts, reservations staff and IT, which makes this feedback. A is too narrow, since the finance figures are only offered for later, and C is off-topic because she reviews the system rather than explaining how to operate it.", "audio_url": "", "transcript": ""}, {"id": "B2-R-08", "skill": "reading", "num": 8, "format": "heading", "title": "", "body": "To provide you with the best possible service, we must process information about you. This includes your full name, home address and telephone number, as well as your email address. We do not share this information with third parties, nor do we allow users to access information on other users. We may, however, occasionally be forced to share information with law enforcement depending on the regulations of your country of residence. You can send a request to delete all the information we hold on you at any time, but please note that this will result in your account no longer being accessible.", "question": "Choose the best heading for the text.", "options": {"A": "Company guidance on how to close a user account", "B": "Company notice regarding privacy rules", "C": "Company use of personal information for legal purposes"}, "answer": "B", "explanation": "The text explains what personal data is collected, who it is and isn't shared with, and the right to deletion, which together form a privacy notice. A is too narrow, covering only the closing line about account deletion, and C is too narrow, picking up only the law-enforcement exception.", "audio_url": "", "transcript": ""}, {"id": "B2-R-09", "skill": "reading", "num": 9, "format": "heading", "title": "", "body": "The statues of Easter Island are best known for their deep-set eyes and long ears. They also have impressive multitonne hats, made from a different kind of rock. Quite how these pukao, as the hats are known, were transported and placed on top of the statues has long been a puzzle. But now American archaeologists believe they have a clearer understanding. The giant hats were moved with minimal effort and resources using a slope and rope technique, they say. The fact that they successfully assembled these monuments is a clear signal of the engineering skills of the ancient Rapanui people.", "question": "Choose the best heading for the text.", "options": {"A": "How hats got onto the Easter Island statues", "B": "New statues discovered on Easter Island", "C": "Engineers duplicate lost building skills"}, "answer": "A", "explanation": "The paragraph centres on the long-standing puzzle of how the heavy hats were transported and placed, now explained by a slope and rope technique. B is off-topic since no new statues are found, and C is off-topic because modern engineers do not recreate the skills, they merely explain the original method.", "audio_url": "", "transcript": ""}, {"id": "B2-R-10", "skill": "reading", "num": 10, "format": "heading", "title": "", "body": "Home working has become more popular in recent years. This is the result of the demands of the modern lifestyle and people's desire to improve their work-life balance. It is also beneficial for employers. This is because it reduces costs in several ways, including removing the need for large offices. However, home working is actually not a specifically modern concept. Throughout much of history, highly skilled jobs such as metal work and sewing were done at home, and it wasn't until the growth of corporations that large groups of people started to work together in a single office building.", "question": "Choose the best heading for the text.", "options": {"A": "How companies can decrease spending", "B": "Why home working is good for most people", "C": "How work locations have changed over time"}, "answer": "C", "explanation": "The text traces work from historic home-based trades to office buildings and back to today's home working, so it is about how work locations have shifted over time. A is too narrow, focusing only on cost savings, and B is too narrow, ignoring the historical and employer angles.", "audio_url": "", "transcript": ""}, {"id": "B2-R-11", "skill": "reading", "num": 11, "format": "heading", "title": "", "body": "Every job advert attracts so many applications. That's why it's no surprise that companies are trying new ways to choose their staff. One of the most fashionable ways is using personality tests. The candidate simply answers a series of questions, and if their answers match what the company is looking for, they pass to the next round. However, it is extremely difficult to judge if someone is a good match for the role from such methods. Perhaps companies should just invite the candidate for an interview and then decide whether they're suitable or not.", "question": "Choose the best heading for the text.", "options": {"A": "An easy way to pick extra staff", "B": "A popular but unsuitable system", "C": "An impossible decision for bosses"}, "answer": "B", "explanation": "The text calls personality tests 'fashionable' yet argues they make it hard to judge a good match, which is exactly 'popular but unsuitable'. A misses the criticism by calling the method easy, and C is too broad, overstating the difficulty as an impossible decision rather than a flaw in one method.", "audio_url": "", "transcript": ""}, {"id": "B2-R-12", "skill": "reading", "num": 12, "format": "heading", "title": "", "body": "During the past year, we began to expand our product range beyond just the mobile phone market. Our new anti-theft devices launched during this year, with a total of six new products in these areas. In addition, we began working with app company 'Apptivate' to improve the quality of our present apps. We hope this will help us to compete with the biggest names in our industry. We have invested a large amount of money in developing and launching these areas and expect to see a rapid sales growth, especially in Asia. We also predict a large return on investment next year.", "question": "Choose the best heading for the text.", "options": {"A": "Recent product developments", "B": "Profits made from new products", "C": "Moving away from traditional mobiles"}, "answer": "A", "explanation": "The text lists this year's new launches and app work, making it a summary of recent product developments. B is off-topic because profits are only predicted for next year, not made, and C is too narrow, naming only the move from mobiles while ignoring the apps and other products.", "audio_url": "", "transcript": ""}, {"id": "B2-R-13", "skill": "reading", "num": 13, "format": "heading", "title": "", "body": "Businesses often face huge challenges, and they don't always have the talent internally to be able to solve them. Areas such as performance, following regulations, tech support and brand image all require expert knowledge. This is where consultants come in useful. They are skilled at addressing particular problems at particular times and guiding companies towards the best possible outcome. They're expensive, but they're often worth it. If they do a good job, the company's problems are solved, and as they rely on being recommended by others to get work, they are usually motivated to do well.", "question": "Choose the best heading for the text.", "options": {"A": "Finding the best consultant for your company's needs", "B": "The hidden costs of hiring a consultant", "C": "Why hiring a consultant is in a company's best interests"}, "answer": "C", "explanation": "The text argues consultants bring expert knowledge, are usually worth the cost and are motivated to do well, making the case for why hiring one benefits a company. A is off-topic because it never advises how to choose between consultants, and B is too narrow and misleading since the cost is openly stated as worth it, not hidden.", "audio_url": "", "transcript": ""}, {"id": "B2-L-01", "skill": "listening", "num": 1, "format": "mcq", "title": "Film review", "body": "", "question": "What do the man and woman agree on?", "options": {"A": "The special effects were realistic.", "B": "The action sequences were natural.", "C": "The acting wasn't good."}, "answer": "C", "explanation": "The man calls the acting \"painful to watch\" and the woman concedes \"perhaps it wasn't his best film\", so both criticise it. A and B are traps: she finds the special effects \"poor\" and he thinks the fight scenes were \"forced\", so neither praises them, they only differ on whether the film was enjoyable.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/1_L_B2_Film+review.mp3", "transcript": "Female: Oh wow, I love that film, those fight scenes were fantastic.\nMale: Really, they didn't seem a little forced to you? And at times it seemed like they ignored the rules of physics.\nFemale: That was just down to poor special effects. It's a safe bet to say that they're not winning any awards for that one.\nMale: Well, they won't win anything for the acting either, it was painful to watch Johnny White at times.\nFemale: I'll admit that perhaps it wasn't his best film, but you have to expect that sometimes actors accept roles that they're not suitable for.\nMale: Well, maybe he should've waited for something more suitable then."}, {"id": "B2-L-02", "skill": "listening", "num": 2, "format": "mcq", "title": "Job interview", "body": "", "question": "Why does the woman think she is a good candidate for the job?", "options": {"A": "She's a heart disease specialist.", "B": "She enjoys working in sales.", "C": "She has a wide range of expertise."}, "answer": "C", "explanation": "She stresses that she \"moved around different areas and departments\", i.e. broad, varied experience, which matches C. A misreads the placement: the company specialised in heart medication, but she is not herself a specialist; B confuses an aside (\"Sales was very interesting\") with her actual passion, which is research.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/2_L_B2_Job+interview.mp3", "transcript": "Male: So, can you tell us a bit about yourself and why you're suitable for this role?\nFemale: I've got a strong background in the industry because I did pharmacology at university, I was even lucky enough to get a six month work placement in a company which specialises in heart medication. While I was there, I was on rotation so to speak, I moved around different areas and departments getting some amazing hands-on experience along the way.\nMale: Which area did you like the most?\nFemale: Sales was very interesting but I had a real passion for the research side and I hope that that's what I can work on here."}, {"id": "B2-L-03", "skill": "listening", "num": 3, "format": "mcq", "title": "Holiday choices", "body": "", "question": "What kind of holiday activity would the man's wife prefer this year?", "options": {"A": "Walking and camping.", "B": "Swimming in the sea.", "C": "Exploring ancient ruins."}, "answer": "A", "explanation": "This year the wife wants \"a more active holiday\", which the man translates into \"backpacking in Patagonia\", i.e. walking and camping (A). B and C describe what they reject or did previously: she \"can't stand the sand\", and the historical city breaks (Rome, Athens) were the last couple of years, not this year's preference.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/3_L_B2_Holiday+choices.mp3", "transcript": "Female: Where are you going on holiday this year Simon?\nMale: I haven't really decided yet, somewhere quiet I guess, with some decent weather, get away from all this rain.\nFemale: Like, a holiday on a sunny tropical beach?\nMale: That would be great, but my wife doesn't like the seaside, she can't stand the sand.\nFemale: So, where do you usually go?\nMale: Well, for the last couple of years we've been going to places with a bit of history, Rome, Athens, places like that, but this year my wife has said she'd like a more active holiday. So, I think we may go backpacking in Patagonia, if we can afford it."}, {"id": "B2-L-04", "skill": "listening", "num": 4, "format": "mcq", "title": "Marketing", "body": "", "question": "What is the relationship between the two speakers?", "options": {"A": "The man is an independent consultant.", "B": "The woman does research for the man.", "C": "They are colleagues in the same company."}, "answer": "A", "explanation": "She is the CEO welcoming him as an outside visitor (\"nice place you have here\") who advises on campaign materials but leaves budgets to others, signalling an external adviser, so A fits. C is wrong because he is clearly not part of the company, and B is unsupported: there is no mention of the woman doing research for him.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/4_L_B2_Marketing.mp3", "transcript": "Female: Good morning Mr Schmitt, I'm Maggie Harman, CEO of Mars Holdings, please take a seat.\nMale: Thank you, nice place you have here.\nFemale: Thanks, I understand you're here to discuss our new marketing plans?\nMale: Yes, that's the idea, you'll have to leave the budgets and schedules to someone else, but I do have a few ideas about the campaign materials.\nFemale: We invested quite a lot of money in the creative side, are you suggesting you can do better?\nMale: Well, given the sensitivity of your markets, I think some of your current video clips run the risk of upsetting potential clients.\nFemale: I see, perhaps you could give me some examples?"}, {"id": "B2-L-05", "skill": "listening", "num": 5, "format": "mcq", "title": "Delays at work", "body": "", "question": "How would you describe the woman's attitude?", "options": {"A": "Angry.", "B": "Sympathetic.", "C": "Satisfied."}, "answer": "B", "explanation": "Although she starts firmly, once she learns the cause she softens and offers \"I'll see if I can lighten your load\", which is sympathetic (B). A is a trap set by her initial sharp tone about the missed deadline, but she does not stay angry; C makes no sense as she is not satisfied with the delay.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/5_L_B2_Delays+at+work.mp3", "transcript": "Female: Have you got those sales projections yet, Daniel?\nMale: No Mrs Castro, I'm, I'm still working on them.\nFemale: They were supposed to be with me yesterday, Daniel.\nMale: I know Mrs Castro, you, you'll have them tomorrow morning, I promise.\nFemale: It's not like you to get behind with your work Daniel, is everything alright?\nMale: Yes, thank you Mrs Castro, well no, not really. My mum has not been very well recently and I, I've been having to look after her and my little sister. I get very tired.\nFemale: I see, I'll see if I can lighten your load for a couple of weeks, come back and see me in a couple of hours, will you?"}, {"id": "B2-L-06", "skill": "listening", "num": 6, "format": "mcq", "title": "Beginning of the day", "body": "", "question": "Why is the man explaining this information to the people?", "options": {"A": "They need to finish training.", "B": "They are on a guided tour.", "C": "They are new employees starting work."}, "answer": "C", "explanation": "\"Welcome to the company\", \"doing the introduction\", and handing out \"protective equipment\" mark this as an induction for new staff (C). B is the trap, since he is showing them around the facility, but a tour of one's own workplace as a new hire is an induction, not a visitor tour; A is unsupported as no prior training is mentioned.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/6_L_B2_Beginning+of+the+day.mp3", "transcript": "Male: Welcome to the company, my name's Jake and I'll be doing the introduction this morning. I'm sure you're aware that this is a fully functional location and therefore we have some rules we have to follow. Although we have an excellent safety record at this facility, we may be obliged to clear the area for a variety of reasons. If the alarm sounds, simply follow me and I'll lead you to a safe area. It's vital that you don't touch anything while I'm showing you around. Some pipes may be dangerously hot, other containers might be below freezing. Okay, let's get your protective equipment."}, {"id": "B2-L-07", "skill": "listening", "num": 7, "format": "mcq", "title": "Business idea", "body": "", "question": "What type of company does the man work for?", "options": {"A": "Health services.", "B": "Telecommunications.", "C": "Transport."}, "answer": "C", "explanation": "\"Services running on time\", \"drivers\", and the goal of getting people to \"give up using their cars and use us instead\" all point to public transport (C). The word \"network\" might suggest telecommunications (B), but here it refers to a transport network in the metropolitan area.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/7_L_B2_Business+idea.mp3", "transcript": "Male: Okay, so looking back, 2018 was a great year for us. We managed to get 99% of all our services running on time, which is far better than any other network in the metropolitan area. Our drivers managed to keep our accident record spotless for the third year running, but we can still improve. I feel the key is appealing to environmentally conscious individuals who want to reduce their carbon footprint. We need a strong advertising campaign, ideally digital, directed at young people. They're the ones more likely to give up using their cars and use us instead."}, {"id": "B2-L-08", "skill": "listening", "num": 8, "format": "mcq", "title": "Company training", "body": "", "question": "What is the training about?", "options": {"A": "How to write emails.", "B": "The company image.", "C": "The new logo."}, "answer": "B", "explanation": "She states the topic directly: \"Company image or something\" (B). A and C are distractors drawn from their guesses about what the session might cover: making the right impression in e-mails and the rumoured new logo are speculation about details, not the stated subject.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/8_L_B2_Company+training.mp3", "transcript": "Female: Are you going to this training session later?\nMale: Yes, I think so, what's it on?\nFemale: Company image or something, sounds like a waste of time to me.\nMale: I agree, what do they expect us to learn?\nFemale: No idea, probably how to make the right impression in e-mails and in meetings with customers, I really can't spare the time, but we have to go.\nMale: I heard that they're going to launch a new logo, so maybe it has something to do with that?\nFemale: You could be right, hopefully it won't be too boring. Do you fancy a drink afterwards?"}, {"id": "B2-L-09", "skill": "listening", "num": 9, "format": "mcq", "title": "Teenagers and phones", "body": "", "question": "What is the woman's main point about mobile phones?", "options": {"A": "They should be used in education.", "B": "They should replace books.", "C": "They are used too much."}, "answer": "A", "explanation": "Her core argument is \"why not learning?\", i.e. phones should be harnessed for education (A). B is explicitly rejected (\"I'm not saying we should get rid of books, far from it\"), and although she notes teens use phones for \"everything\", her point is to exploit that, not to complain that phones are overused (C).", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/9_L_B2_Teenagers+and+phones.mp3", "transcript": "Female: Are your kids allowed to use their phones in class?, Mine aren't. In fact, my kid's school has a no phone policy, and that's great, at least I know they're not spending all day on social networks. But do you know what teens nowadays use their phones for? Everything. So, why not learning? I'm not saying we should get rid of books, far from it, but if kids are so hooked on these things, it might be a good idea to take advantage of that. New technologies can make learning fun, or at least a little less boring, and then kids will want to learn."}, {"id": "B2-L-10", "skill": "listening", "num": 10, "format": "mcq", "title": "Work schedules", "body": "", "question": "What does the man think of the new system?", "options": {"A": "It will affect the quality of his work.", "B": "It will make going to work boring.", "C": "It will still be quite limiting."}, "answer": "C", "explanation": "His complaint is that the boss choosing the days \"stops it being a flexible system\" and you are \"still having to ask for permission every week\", i.e. it remains limiting (C). B is a trap: he actually says being in the same space is \"part of the fun\", and A is never raised, as he says nothing about work quality.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/10_L_B2_Work+schedules.mp3", "transcript": "Female: Have you seen the e-mail from Chris? Isn't it great that we can work from home two days a week?\nMale: Yeah, but did you notice that your boss decides when?\nFemale: I did, I suppose it's for making sure that people are around for meetings, and that we still work as a team. After all, if you never see someone, how can you work well together?\nMale: That's true, and working in the same space is all part of the fun. I just think that your boss making decisions stops it being a flexible system, doesn't it? You're still having to ask for permission every week."}, {"id": "B2-L-11", "skill": "listening", "num": 11, "format": "mcq", "title": "Angry boss", "body": "", "question": "What is the story about?", "options": {"A": "Not showing enough attention to detail.", "B": "Being blamed unfairly for something.", "C": "Doing something uncharacteristic."}, "answer": "B", "explanation": "The twist is that she \"was off sick on the day the arrangements were made\", so she was accused of a mistake she could not have made, the essence of being blamed unfairly (B). A and C invert her actual character: she insists she \"always\" pays attention to detail, which is why the accusation seemed so out of character to her, but the story's point is the false blame, not a real lapse.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/11_L_B2_Angry+boss.mp3", "transcript": "Female: So, I got called in by my line manager the other day and she was fuming. She launched into a long speech about how I'd messed up all the travel arrangements for one of her business trips to India, I thought this was so unlike me. I always pride myself in paying attention to detail, I was getting more and more panicky and I thought that I'd be fired. Then I glanced at a bit of paper in front of her, and I realised that I was off sick on the day the arrangements were made. It was difficult to keep a straight face after that."}, {"id": "B2-L-12", "skill": "listening", "num": 12, "format": "mcq", "title": "The car", "body": "", "question": "What is the story about?", "options": {"A": "A pedestrian who had an accident.", "B": "A silly mistake the speaker made.", "C": "Mechanical problems with a car."}, "answer": "B", "explanation": "The punchline reveals his blunder: \"I was trying to open a car that looked just like mine, but it wasn't\", an embarrassing personal mistake (B). C is a trap built on \"it wouldn't open\", but the door would not open because it was the wrong car, not because of a fault; A misreads the terrified man, who was a startled occupant, not an accident victim.", "audio_url": "https://es-test-prep.s3.eu-west-2.amazonaws.com/12_L_B2_The+car.mp3", "transcript": "Male: I went to town in the car to buy some food for the cats, it was raining hard when I came out of the store and I ran to the car. I pulled hard at the door handle, but it wouldn't open. I pulled and pulled and suddenly I heard a scream, I looked through the car window and saw an elderly man in the front passenger seat, he looked terrified. I was trying to open a car that looked just like mine, but it wasn't. I didn't know where to look or what to do."}];
window.DATA = DATA;
const LEVEL = "B2";
const TITLE = "EnglishScore Practice Test " + LEVEL;
const N = DATA.length;
const SKILL_LABEL = {grammar:"Grammar",vocabulary:"Vocabulary",reading:"Reading",listening:"Listening"};
const esc = s => (s===undefined||s===null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ans = {};            // i -> "B" or ["A","C","B"]
const stu = {name:"", email:""};
let idx = 0;               // 0 start, 1..N questions, N+1 results
let startTime = 0;
const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const prog = document.getElementById("prog");
const validEmail = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);

function setProgress(){ prog.style.width = (idx===0?0 : idx>N?100 : Math.round((idx-1)/N*100)) + "%"; }
function answeredCount(){ let n=0; for(let i=0;i<N;i++){ const a=ans[i]; if(Array.isArray(a)){ if(a.length===3 && a.every(Boolean)) n++; } else if(a) n++; } return n; }

function render(){
  setProgress();
  if(idx===0) return renderStart();
  if(idx>N) return renderResults();
  renderQuestion(idx-1);
}

function renderStart(){
  screen.innerHTML =
    `<div class="card">
      <h2 style="margin:0 0 6px">Before you start</h2>
      <p class="note" style="margin:0 0 18px">Upper intermediate level. ${N} questions covering Grammar, Vocabulary, Reading and Listening. Your name and email are required so we can send your result to your tutor and a confirmation to you.</p>
      <div class="field" id="f-name"><label>Full name</label><input id="in-name" autocomplete="name" placeholder="e.g. Jane Lee"><div class="err">Please enter your name.</div></div>
      <div class="field" id="f-email"><label>Email address</label><input id="in-email" type="email" autocomplete="email" placeholder="you@example.com"><div class="err">Please enter a valid email address.</div></div>
    </div>`;
  bar.innerHTML = `<span class="count">Step 1 of ${N+1}</span><button class="btn-go" id="start">Start test &rarr;</button>`;
  const nm=document.getElementById("in-name"), em=document.getElementById("in-email");
  nm.value=stu.name; em.value=stu.email;
  document.getElementById("start").onclick = () => {
    stu.name=nm.value.trim(); stu.email=em.value.trim();
    let bad=false;
    document.getElementById("f-name").classList.toggle("bad", !stu.name); if(!stu.name) bad=true;
    const eok=validEmail(stu.email); document.getElementById("f-email").classList.toggle("bad", !eok); if(!eok) bad=true;
    if(bad) return;
    startTime=Date.now();
    idx=1; render(); window.scrollTo(0,0);
  };
}

function questionInner(q,i){
  let h = `<div class="meta">${SKILL_LABEL[q.skill]} &middot; Question ${q.num}</div>`;
  if(q.title) h += `<div class="title">${esc(q.title)}</div>`;
  if(q.audio_url) h += `<audio controls preload="none" src="${q.audio_url}"></audio>`;
  if(q.format==="passageq") h += `<div class="passage">${esc(q.body)}</div>`;
  else if(q.body) h += `<div class="body">${esc(q.body)}</div>`;
  const saved = ans[i];
  if(q.format==="order"){
    h += `<div class="prompt">${esc(q.question)}</div><div class="order">`;
    ["A","B","C"].forEach(L => h += `<div class="sent"><b>${L}.</b> ${esc(q.options[L])}</div>`);
    h += `<div class="picks">`;
    [0,1,2].forEach(p => {
      const v = Array.isArray(saved)?saved[p]:"";
      h += `<label>Position ${p+1}<select data-pos="${p}">`+
           `<option value="">--</option>`+
           ["A","B","C"].map(L=>`<option ${v===L?"selected":""}>${L}</option>`).join("")+
           `</select></label>`;
    });
    h += `</div></div>`;
  } else {
    if(q.question) h += `<div class="prompt">${esc(q.question)}</div>`;
    ["A","B","C"].forEach(L => {
      const on = saved===L;
      h += `<label class="opt${on?" sel":""}" data-opt="${L}"><input type="radio" name="opt" value="${L}" ${on?"checked":""}>${L}. ${esc(q.options[L])}</label>`;
    });
  }
  return h;
}

function saveCurrent(i){
  const q=DATA[i];
  if(q.format==="order"){
    ans[i] = [...document.querySelectorAll('select[data-pos]')].map(s=>s.value);
  } else {
    const sel=document.querySelector('input[name="opt"]:checked');
    ans[i] = sel?sel.value:undefined;
  }
}

function renderQuestion(i){
  const q=DATA[i];
  screen.innerHTML = `<div class="card">${questionInner(q,i)}</div>`;
  // live highlight for radio selection
  screen.querySelectorAll('.opt').forEach(o => o.addEventListener('change', ()=>{
    screen.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');
  }));
  const last = (i === N-1);
  bar.innerHTML =
    `<span class="count">Question ${i+1} of ${N}</span>`+
    `<button class="btn-ghost" id="back">&larr; Back</button>`+
    (last ? `<button class="btn-go" id="finish">Finish &amp; submit</button>`
          : `<button class="btn-go" id="next">Next &rarr;</button>`);
  document.getElementById("back").onclick = ()=>{ saveCurrent(i); idx--; render(); window.scrollTo(0,0); };
  const adv = document.getElementById(last?"finish":"next");
  adv.onclick = ()=>{
    saveCurrent(i);
    if(last){
      const miss = N - answeredCount();
      if(miss>0 && !confirm(miss+" question(s) are unanswered. Submit anyway?")) return;
      idx=N+1; render(); window.scrollTo(0,0);
    } else { idx++; render(); window.scrollTo(0,0); }
  };
}

function grade(){
  const items=[]; let points=0;
  DATA.forEach((q,i)=>{
    const a=ans[i];
    let your, ok;
    if(q.format==="order"){
      const got = Array.isArray(a)?a.join(","):"";
      ok = got===q.answer;
      your = Array.isArray(a)&&a.every(Boolean) ? a.join(",") : "(blank)";
    } else {
      ok = a===q.answer;
      your = a ? (a+". "+q.options[a]) : "(blank)";
    }
    if(ok) points++;
    const correct = q.format==="order" ? q.answer : (q.answer+". "+q.options[q.answer]);
    items.push({n:i+1, skill:SKILL_LABEL[q.skill], title:q.title||"", question:q.question||"", explanation:q.explanation||"", your, correct, ok});
  });
  return {points, total:N, pct:Math.round(points/N*100), items};
}

function sendResult(g){
  const date = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const payload = {name:stu.name, email:stu.email, level:LEVEL, title:TITLE, date,
                   elapsedSeconds: startTime ? Math.round((Date.now()-startTime)/1000) : 0,
                   points:g.points, total:g.total, pct:g.pct, items:g.items};
  const url = window.ES_ENDPOINT;
  if(url && /^https?:\/\//.test(url)){
    try{
      fetch(url, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
      return true;
    }catch(e){ return false; }
  }
  return false;
}

function renderResults(){
  const g = grade();
  const sent = sendResult(g);
  let html =
    `<div class="result"><div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7">Your score</div>`+
    `<div class="pct">${g.points} / ${g.total} &nbsp;(${g.pct}%)</div>`+
    `<div class="sub">${esc(stu.name)} &middot; ${TITLE}</div></div>`;
  html += sent
    ? `<div class="sent-note">Your result has been sent to your tutor at HK-Schools.com, and a confirmation email has been sent to <b>${esc(stu.email)}</b>.</div>`
    : `<div class="sent-note">Your result has been recorded. Review every question below.</div>`;
  html += `<div class="rev">`;
  let lastSkill=null;
  DATA.forEach((q,i)=>{
    if(q.skill!==lastSkill){ lastSkill=q.skill; html += `<div class="meta" style="margin:18px 4px 4px">${SKILL_LABEL[q.skill]}</div>`; }
    const it=g.items[i];
    html += `<div class="card"><div class="meta2">${SKILL_LABEL[q.skill]} &middot; Question ${q.num}</div>`;
    if(q.title) html += `<div class="title" style="font-size:16px">${esc(q.title)}</div>`;
    if(q.format==="passageq" && q.body) html += `<div class="passage">${esc(q.body)}</div>`;
    else if(q.body) html += `<div class="body" style="font-size:14.5px">${esc(q.body)}</div>`;
    if(q.question) html += `<div class="prompt" style="font-weight:600">${esc(q.question)}</div>`;
    const ansTxt = q.format==="order" ? `Correct order: ${q.answer.replace(/,/g," , ")}` : `Correct answer: ${esc(it.correct)}`;
    html += `<div class="fb ${it.ok?"right":"wrong"}"><span class="tag">${it.ok?"Correct":"Not quite"}</span> &middot; Your answer: ${esc(it.your)}<br>${ansTxt}`;
    if(q.explanation) html += `<div style="margin-top:6px">${esc(q.explanation)}</div>`;
    if(q.transcript) html += `<details><summary>Show transcript</summary><div class="tr">${esc(q.transcript)}</div></details>`;
    html += `</div></div>`;
  });
  html += `</div><div class="footer">Questions and audio &copy; British Council EnglishScore, used for practice by HK-Schools.com.</div>`;
  screen.innerHTML = html;
  bar.innerHTML = `<span class="count">Finished &middot; ${g.points}/${g.total}</span><button class="btn-ghost" id="again">Take again</button>`;
  document.getElementById("again").onclick = ()=>location.reload();
}

render();
</script>
</body>
</html>
