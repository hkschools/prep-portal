<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 3 Language Usage: Full-Length Practice Test</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 3 Language Usage: Full-Length Practice Test</div>
  <h2>MAP Grade 3 Language Usage</h2>
  <p class="muted">53 questions. Read each item carefully, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 3 Language Usage: Full-Length Practice Test</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 3 Language Usage: Full-Length Practice Test</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G3-LANG-FULL";
const BANK_PATH = "map-tests/grade-3/language-usage/full-length/bank.csv";
const TITLE = "MAP Grade 3 Language Usage: Full-Length Practice Test";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Language Usage","stem":"Which of the sentences is written in future tense?","options":["Jose and his brother are watching a movie.","The movie premiered only two days ago.","Chris will buy popcorn and nachos at the movie theater.","Jordan managed to buy the last tickets for the movie."]},{"n":2,"type":"text","section":"Language Usage","stem":"Read the sentence: There was a thunderstorm yesterday. Which of the following sentences does not support the topic of the sentence?","options":["The lights went out several times.","The kids were playing soccer outside.","My dog was hiding under the table, shivering.","It was rainy and cold outside."]},{"n":3,"type":"text","section":"Language Usage","stem":"Which of the following sentences is grammatically correct?","options":["The herd follows its leader to the nearest watering hole.","The pack of brownies were empty when I opened it.","The team usually eat in a restaurant after winning a game.","The school present an exhibition of students' paintings."]},{"n":4,"type":"text","section":"Language Usage","stem":"Which of the following is an appropriate topic for a business letter?","options":["Recipe for chocolate chip cookies","Invitation to a friend's birthday party","Complaint about a product purchased","A research paper about the Solar System"]},{"n":5,"type":"text","section":"Language Usage","stem":"Read the sentence: She had already ___ to eat the sandwich when they sat at the table. Which word correctly completes the sentence?","options":["begun","began","begin","begins"]},{"n":6,"type":"text","section":"Language Usage","stem":"Read the sentences: The middle ages lasted from the 5th to the 15th century. During this time, poor hygiene was partly responsible for the spreading of many plagues and diseases. Which words in the sentences should begin with a capital letter?","options":["plagues, diseases","middle, century","ages, century","middle, ages"]},{"n":7,"type":"text","section":"Language Usage","stem":"Which of the following are examples of Personal Writing?","options":["News report, review, article","Greeting card, to-do list, notes","Lab report, textbook, song lyrics","Brochure, restaurant menu, travel book"]},{"n":8,"type":"text","section":"Language Usage","stem":"Read the sentence: Ethan almost left his white socks on his bed as he was in a hurry. What is the subject in the sentence?","options":["White socks","His","Left","Ethan"]},{"n":9,"type":"text","section":"Language Usage","stem":"Read the sentence: The football game will take place at the town's stadium, near Addison Elementary school. Which word in the sentence should begin with a capital letter?","options":["stadium","school","football","town"]},{"n":10,"type":"text","section":"Language Usage","stem":"Read the sentence: The football game will take place at the town's stadium, near Addison Elementary school. Which word in the sentence should begin with a capital letter?","options":["stadium","school","football","town"]},{"n":11,"type":"text","section":"Language Usage","stem":"Read the sentence: It went ___ than I thought it would, but next time it will be better. Which word correctly completes the sentence?","options":["bad","more bad","worst","worse"]},{"n":12,"type":"text","section":"Language Usage","stem":"Read the sentences: The Dead sea is a big salt lake. Due to the salt, it is very easy to float on the water. The Dead sea is also famous for being the lowest point in the world. Which word in the sentences should begin with a capital letter?","options":["sea","salt","lake","world"]},{"n":13,"type":"text","section":"Language Usage","stem":"Read the sentence: It went ___ than I thought it would, but next time it will be better. Which word correctly completes the sentence?","options":["bad","more bad","worst","worse"]},{"n":14,"type":"text","section":"Language Usage","stem":"What is the appropriate style for a summary of an informational text?","options":["It contains personal thoughts and opinions about a text.","It contains background and personal information.","It contains the main ideas and key points of a text.","It contains a review and interpretation of a text."]},{"n":15,"type":"text","section":"Language Usage","stem":"Which of the following sentences is a compound sentence?","options":["Dana and Ron walk to school together every day.","The audience applauded and cheered the players.","It was hot yesterday, so I wore short pants and a T-shirt.","During the production of the film, there was a snowstorm."]},{"n":16,"type":"text","section":"Language Usage","stem":"In which sentence is the underlined word spelled correctly?","options":["Many products around us are made of steel.","There are too people waiting at the bus stop.","The red dress I bought was on sail yesterday.","I could smell the cent of the chicken soup."]},{"n":17,"type":"text","section":"Language Usage","stem":"Read the paragraph: The blue whale is the biggest animal in the world. Blue whales can grow to 100 feet long and weigh about 400,000 pounds. The heart of a blue whale is about the size of a small car. They consume millions of krill each day, and they can dive to a depth of 328 feet. What is the topic sentence of the paragraph?","options":["Blue whales can grow to 100 feet long.","They consume millions of krill each day, and they can dive to a depth of 328 feet.","The heart of a blue whale is about the size of a small car.","Blue whale is the biggest animal in the world."]},{"n":18,"type":"text","section":"Language Usage","stem":"Which of the following sentences is structured correctly?","options":["The members of the school's football team were very competitive.","The very competitive members were of the school's football team.","The very competitive of the school's football team were the members.","Of the school's football team, the members were very competitive."]},{"n":19,"type":"text","section":"Language Usage","stem":"Read the sentences: We went to the new Star trek movie yesterday. A new movie theater opened in our neighborhood, and in honor of the opening the workers handed out free popcorn! Which word from the sentences should begin with a capital letter?","options":["theater","movie","popcorn","trek"]},{"n":20,"type":"text","section":"Language Usage","stem":"Read the paragraph: There are fewer than 60 Javan rhinoceros remaining in the world. There is only one known population of the Javan rhinoceros in the wild, located on the island of Java, Indonesia. Loss of habitats and trophy hunting for its horns are the main causes for the serious decline in its numbers. Which of the following sentences could be a strong concluding sentence for the paragraph?","options":["Lastly, there are also fewer than 600 Sumatran tigers remaining in the world.","Therefore, the main factor in the continued decline of the Javan rhinoceros' population has been poaching for horns.","These factors have left the Javan rhinoceros one of the rarest animals on the planet.","The Javan rhino can live around 30-45 years in the wild."]},{"n":21,"type":"text","section":"Language Usage","stem":"Which of the sentences has the subject and predicate divided correctly (shown by the | mark)?","options":["Cocoa trees grow | in a limited geographical zone.","Cocoa | trees grow in a limited geographical zone.","Cocoa trees | grow in a limited geographical zone.","Cocoa trees grow in a limited | geographical zone."]},{"n":22,"type":"text","section":"Language Usage","stem":"In which sentence is the underlined word spelled correctly?","options":["There are high cliffes in the coasts of South Africa.","My father and my grandfather were sheriffs.","We all had experience with curfewes.","He found two pairs of earmuffes on the street."]},{"n":23,"type":"text","section":"Language Usage","stem":"Which of the sentences is the most appropriate to convey imagery?","options":["His face blossomed when he caught a glance of her.","Neil Armstrong was the first astronaut to walk on the moon.","Kuwait City is one of the hottest cities in the world.","Some cities have serious pollution problems."]},{"n":24,"type":"text","section":"Language Usage","stem":"Read the sentences: Judy is a very (nosy, curious) person. She also has (unusual, weird) problem-solving methods and her ideas are usually (crazy, original). Which words suggest a positive meaning?","options":["nosy, unusual, crazy","curious, unusual, original","curious, weird, original","nosy, weird, crazy"]},{"n":25,"type":"text","section":"Language Usage","stem":"Which of the sentences is grammatically correct?","options":["His was the youngest competitor in the competition.","They live in a small and lovely town in Wisconsin.","Us have a favorite Mexican restaurant in town.","Her was the tallest student in her class."]},{"n":26,"type":"text","section":"Language Usage","stem":"Which sentence is punctuated correctly?","options":["Yes, I would like to have dinner with you.","Well. I have to think about that","Suddenly! I heard a noise from upstairs","Hey? Did you see what just happened?"]},{"n":27,"type":"text","section":"Language Usage","stem":"Read the sentence: You are asked by your teacher to write a story for preschoolers about their first trip to the dentist. Which group of words is appropriate for your story?","options":["diagnosis, floss, brush","healthy teeth, friendly dentist, tooth fairy","tooth extraction, pain, fluorides","mouth wash, gum disease, orthodontics"]},{"n":28,"type":"text","section":"Language Usage","stem":"Which of the following is not a sentence fragment?","options":["Should start right after class.","Some boys in the school","He opened the window.","From dusk until dawn."]},{"n":29,"type":"text","section":"Language Usage","stem":"Which sentence is punctuated correctly with exclamation marks?","options":["Wow! Did you see how far it went!","I have two brothers and one sister'","Stop! You are spilling all the milk!","Bring me the towel from the kitchen, please'"]},{"n":30,"type":"text","section":"Language Usage","stem":"Read the paragraph: Begin by cracking open two eggs and putting them in a bowl. ___ , add salt and milk to the bowl and beat the mixture until the eggs are completely mixed into the milk. Next, pour the mixture into a heated frying pan with some butter and wait a few minutes. Flip the omelet to the other side and let it cook some more. ___ enjoy your omelet. Which pair of words best completes the paragraph?","options":["First, Then","Then, Finally","Later, Next","Then, First"]},{"n":31,"type":"text","section":"Language Usage","stem":"Which of the sentences is not grammatically correct?","options":["Kareem had already gone out when I arrived.","He has saw that movie twenty times.","Someone has eaten my cupcake.","I had worn this watch for many years before it was lost."]},{"n":32,"type":"text","section":"Language Usage","stem":"Which of the sentences is punctuated correctly?","options":["Ladies and gentlemen may I have your attention, please?","It was nice, to meet you Sir.","Rachel can you bring me a glass of water?","Thank you, Manuel, for your help yesterday."]},{"n":33,"type":"text","section":"Language Usage","stem":"Which of the following is required in research writing?","options":["sense of humor","personal experiences","a list of references","imaginary story"]},{"n":34,"type":"text","section":"Language Usage","stem":"Which sentence shows a correct subject-verb agreement?","options":["My grandma have her hair done every Friday.","She also like getting a manicure then.","My grandma call me on the phone every Monday.","She always asks what I'm learning in school."]},{"n":35,"type":"text","section":"Language Usage","stem":"Read the sentence: He will not go to the concert unless you go. Which of the sentences has the same meaning as the sentence above?","options":["He will not go to the concert even if you go.","He will not go to the concert when you go.","He will not go to the concert if you do not go.","He will not go to the concert since you go."]},{"n":36,"type":"text","section":"Language Usage","stem":"In which sentence is the underlined word spelled correctly?","options":["The old tree has long branches.","My dad bought two new toolboxs.","There were a lot of menarches in the Roman Empire.","The teacher gave us three guizes last week."]},{"n":37,"type":"text","section":"Language Usage","stem":"Read the paragraph: The Statue of Liberty is a sculpture made of copper, located on Liberty Island in New York Harbor. The statue was built by Gustave Eiffel and dedicated on October 28, 1886. The Eiffel Tower was opened for visitors in 1889. The Statue of Liberty was a gift to the United States from the people of France. Which detail does not support the main topic of the paragraph?","options":["The Statue of Liberty is a sculpture made of copper.","The Eiffel Tower was opened for visitors in 1889.","The statue was built by Gustave Eiffel.","The Statue of Liberty was a gift to the United States."]},{"n":38,"type":"text","section":"Language Usage","stem":"Which of the sentences is grammatically correct?","options":["Laura watched her cats with amusement as it played with each other.","He tried to open his window but he was stuck.","Lucas hurt his leg during the game, so the coach had to replace him.","She invited its brother to watch the game with her."]},{"n":39,"type":"text","section":"Language Usage","stem":"Read the sentences: Yosemite National park is widely known for the giant grizzly bears that live there. last year, my family and I saw a baby grizzly bear when we visited it. Which words in the sentences should begin with a capital letter?","options":["park, grizzly","baby, giant","bears, bear","park, last"]},{"n":40,"type":"text","section":"Language Usage","stem":"You read a short booklet that discusses the main clauses of the United States Constitution. What is the author's purpose in this booklet?","options":["To persuade","To guide","To entertain","To inform"]},{"n":41,"type":"text","section":"Language Usage","stem":"Which of the words is spelled correctly?","options":["teleskope","graveety","tishoe","molecule"]},{"n":42,"type":"text","section":"Language Usage","stem":"Which of the words is spelled correctly?","options":["teleskope","graveety","tishoe","molecule"]},{"n":43,"type":"text","section":"Language Usage","stem":"Which sentence does NOT describe a use of coconut oil?","options":["Coconut oil is commonly used in cooking.","Coconut oil is a great source for healthy fats.","Coconut oil can be added to smoothies.","You can remove makeup with coconut oil."]},{"n":44,"type":"text","section":"Language Usage","stem":"In which of the following writings would you use formal language?","options":["informational essay, review article, research report","thank you note, friendly letter, grocery list","personal email, prescription, scrap paper","letter to a friend, diary entry, personal narrative"]},{"n":45,"type":"text","section":"Language Usage","stem":"Read the sentences: I like visiting uncle Harvey's apartment in Florida. He has a nice, green garden around his house where we sit and play. In his free time, he likes to play golf and go to the gym. Which word in the sentences should begin with a capital letter?","options":["gym","uncle","golf","apartment"]},{"n":46,"type":"text","section":"Language Usage","stem":"Read the sentence: Mia really likes animals. She owns two dogs, a parrot, and even a pet mouse! What is the plural of the word \"mouse\"?","options":["Mouses","Mousses","Mice","Mices"]},{"n":47,"type":"text","section":"Language Usage","stem":"Read the following topics: Gymnastics, Track and Field, Team Games, Physical Education, Coordination. Which would be the main topic in an outline?","options":["Gymnastics","Track and Field","Coordination","Physical Education"]},{"n":48,"type":"text","section":"Language Usage","stem":"Read the sentence: The sweater my aunt bought for me wasn't the right size. What is the subject in the sentence?","options":["my aunt","bought","the sweater","me"]},{"n":49,"type":"text","section":"Language Usage","stem":"Which of the following sentences is an imperative sentence?","options":["Did you get to work on time?","My birthday is next week.","Pick the books off the table.","I scored another goal."]},{"n":50,"type":"text","section":"Language Usage","stem":"Read the sentences: I like visiting uncle Harvey's apartment in Florida. He has a nice, green garden around his house where we sit and play. In his free time, he likes to play golf and go to the gym. Which word in the sentences should begin with a capital letter?","options":["gym","uncle","golf","apartment"]},{"n":51,"type":"text","section":"Language Usage","stem":"Read the paragraph: Students born from the mid-1990s to 2014 are considered part of Generation Z. They are the youngest generation and constitute about 25% of the population in the U.S. Members of Generation Z are typically thought of as being comfortable with technology, and they interact on social media websites for a significant portion of their socializing. Which of the following is not a supporting detail in this paragraph?","options":["Members of Generation Z constitute about a quarter of the population in the US.","Members of Generation Z can quickly and efficiently shift between work and play.","Members of Generation Z are typically thought of as being comfortable with technology.","Members of Generation Z interact on social media websites for a significant portion of their socializing."]},{"n":52,"type":"text","section":"Language Usage","stem":"Which sentence is grammatically correct?","options":["The dogs was barking all night so I couldn't sleep.","He always feel tired after eating a big lunch.","It seem hard to learn to speak a new language.","I usually become sick during cruises on the sea."]},{"n":53,"type":"text","section":"Language Usage","stem":"Read the sentence: There was a thunderstorm yesterday. Which of the following sentences does not support the topic of the sentence?","options":["The lights went out several times.","The kids were playing soccer outside.","My dog was hiding under the table, shivering.","It was rainy and cold outside."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
