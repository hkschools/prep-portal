<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 3 Language Usage (Level 2): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 3 Language Usage (Level 2): Drill 2</div>
  <h2>MAP Grade 3 Language Usage</h2>
  <p class="muted">15 questions. Read each question, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 3 Language Usage (Level 2): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 3 Language Usage (Level 2): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G3-LANG-L2-D2";
const BANK_PATH = "map-tests/grade-3/language-usage/level-2/drill-2/bank.csv";
const TITLE = "MAP Grade 3 Language Usage (Level 2): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Language Usage", "stem": "What is the order of the parts of a friendly letter?", "options": ["heading, greeting, body, closing, signature", "heading, signature, body, greeting, closing", "signature, heading, body, closing, greeting", "heading, body, closing, greeting, signature"]}, {"n": 2, "type": "text", "section": "Language Usage", "stem": "In which of the sentences are all the words spelled correctly?", "options": ["A very weird sequense of events happened to me yesterday.", "The coach's startegy was very clear to us.", "I always wear my lucky mittens before a football game.", "His unusual appearence got a lot of attention."]}, {"n": 3, "type": "text", "section": "Language Usage", "stem": "Read the paragraph. David had an important meeting this morning and was in a rush. When he reached his car, he realized he had a flat tire. He had to replace the tire. He couldn't make it in time to the meeting. Which revision of the sentence best shows a cause-effect relationship between the ideas in the paragraph?", "options": ["Since David had a flat tire, he had to replace it so he could get to the meeting. He couldn't make it in time to the meeting because he wasted time replacing the tire.", "David couldn't make it in time to the meeting. Before that, he realized he had a flat tire. Before that, he was in a rush since he had an important meeting.", "First, David was in a rush this morning. Then, he had a flat tire. Next, he had to replace the flat tire. Finally, he couldn't make it in time to the meeting.", "If David had a flat tire, he might have needed to replace it. If he had to replace the tire, it might take him time. If it takes him time, he might be late to the meeting."]}, {"n": 4, "type": "text", "section": "Language Usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["Max and I are going out for lunch later.", "The cat followed Sean and I to our car.", "Me am going to the grocery store now.", "Roni and me are driving to the festival."]}, {"n": 5, "type": "text", "section": "Language Usage", "stem": "Read the sentences. The biggest state in the US is alaska. It is home to a wide variety of wildlife and is also a very cold place. Which word in the sentences should begin with a capital letter?", "options": ["state", "alaska", "home", "wildlife"]}, {"n": 6, "type": "text", "section": "Language Usage", "stem": "You are writing a story about a trip to an amusement park. You want the story to show the excitement of the trip. How would you best describe the events during the trip to make them sound exciting?", "options": ["We drove for three hours and I fell asleep during the trip.", "The line to the roller coaster was long and it seemed like it would never end.", "We ate some delicious cotton candy and went on my favorite amusement ride!", "Before we went back home, we all sat at a nearby restaurant and ate lunch."]}, {"n": 7, "type": "text", "section": "Language Usage", "stem": "You are writing about your first day at a new school. You want the writing to show that you felt nervous. Which sentence best shows this?", "options": ["The school building was made of red brick and had two floors.", "My hands felt cold and I kept checking the room number again and again.", "At lunchtime we were given sandwiches, fruit and a carton of milk.", "My new teacher has taught at the school for eleven years."]}, {"n": 8, "type": "text", "section": "Language Usage", "stem": "What is the correct spelling for more than one wolf?", "options": ["Wolfs", "Wolvs", "Wolves", "Wolfes"]}, {"n": 9, "type": "text", "section": "Language Usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["Does anybody have a key for Jim's room?", "Somebody have to know where can I find him.", "Everyone say it is true, but I do not believe it.", "Many has seen it but could not tell."]}, {"n": 10, "type": "text", "section": "Language Usage", "stem": "Which of the following sentences is punctuated correctly?", "options": ["Our senator, John Johnson was born in Texas.", "John Johnson our senator was born in Texas.", "Our senator, John Johnson, was born in Texas.", "John Johnson our senator, was born in Texas."]}, {"n": 11, "type": "text", "section": "Language Usage", "stem": "Louis decided to write a biography on the life of George Washington. What is the best way to represent the data he collected?", "options": ["a timeline", "a line graph", "a pie chart", "a pictograph"]}, {"n": 12, "type": "text", "section": "Language Usage", "stem": "Which one of the sentences is correctly written in future perfect tense?", "options": ["I will probably see you tomorrow at the party.", "By the time you finish it, I will have left.", "He will has been here for two months next week.", "They have been planning this for a long time."]}, {"n": 13, "type": "text", "section": "Language Usage", "stem": "Which sentence is written in the future perfect tense?", "options": ["We will meet at the library after school.", "She has finished all of her homework.", "By Friday, they will have painted the whole fence.", "He was walking home when it started to rain."]}, {"n": 14, "type": "text", "section": "Language Usage", "stem": "You were asked to write a review. Which of the following is appropriate for a review?", "options": ["A newspaper report you read", "A new movie you watched", "A recipe for pasta you found", "A letter your cousin sent you"]}, {"n": 15, "type": "text", "section": "Language Usage", "stem": "Read the sentences. The boy shot some hoops at the basketball court. He was a tall boy. The basketball court was small. Which is the best way to combine the three sentences listed above?", "options": ["The small boy shot some hoops at the tall basketball court.", "The small basketball court is where the boy shot some hoops.", "The tall boy shot some hoops at the small basketball court.", "The tall boy used to shoot some hoops at the basketball court."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
