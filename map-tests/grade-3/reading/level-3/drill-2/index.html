<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 3 Reading (Level 3): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 3 Reading (Level 3): Drill 2</div>
  <h2>MAP Grade 3 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 3 Reading (Level 3): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 3 Reading (Level 3): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G3-READ-L3-D2";
const BANK_PATH = "map-tests/grade-3/reading/level-3/drill-2/bank.csv";
const TITLE = "MAP Grade 3 Reading (Level 3): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Which step in the directions suggests that the string may be snapped by tightening too far?","options":["Strike the key firmly to hear the sound.","Tune the keys at the center of the piano first.","Tighten the string by turning the pins with a tuning hammer just a little at a time.","With the pedal pressed, place the mutes next to the string you want to tune."],"passage":"<strong>The following directions tell how to tune a piano</strong><br>Which step in the directions suggests that the string may be snapped by tightening too far?"},{"n":2,"type":"text","section":"Reading","stem":"Which word fits the definition \"something that is extremely surprising\"?","options":["unsurprisingly","unbelievable","indefinitely","uneventful"],"passage":"<strong>Read the definition</strong><br>Something that is extremely surprising.<br><br>Use a prefix (a group of letters that can be added to the beginning of a word), a suffix (a group of letters that can be added to the end of a word), and a root word (the form of a word after all prefixes and suffixes are removed) to construct a word with the given definition."},{"n":3,"type":"text","section":"Reading","stem":"Which description best defines the characteristics of advertisements?","options":["a collection of information about one or many subjects, often arranged alphabetically","a paid notice that tries to persuade people to buy a product or service","a periodical publication consisting of articles about current events","a type of writing that deals with facts about real people or events, not imaginary stories"]},{"n":4,"type":"text","section":"Reading","stem":"How long is Edgar meant to stay in Paris?","options":["one month","one week","as long as he likes","until the end of summer vacation"],"passage":"<strong>Read the passage</strong><br>Two weeks after the beginning of the school summer vacation, Edgar was preparing to board his first flight to Paris on his own. He was supposed to meet his older sister, who works at the French embassy, and together they planned to tour the city. Edgar had his boarding pass and passport clutched in his left hand. His mother hugged him tightly and said she would miss him, but would meet him at this same spot in a week. Edgar then boarded the plane. The flight attendants were very nice and brought him a sandwich and a hot cup of chocolate during the flight. When he was finished eating, he read his book for a while and then immediately fell asleep. Several hours later, he landed. He was excited to meet his sister and tour the city."},{"n":5,"type":"text","section":"Reading","stem":"Which of the following details cannot be found in the passage?","options":["the total number of Michael Phelps's Olympic medals","the reasons Michael Phelps began swimming","the number of Olympic gold medals Michael Phelps won","the year Michael Phelps first qualified for the Olympics"],"passage":"<strong>Read the passage</strong><br>Michael Phelps is an American former competitive swimmer and the most decorated Olympian of all time, with a total of 28 medals. After the 2012 Olympics, Phelps retired from swimming. In 2014, Phelps came out of retirement, winning an additional six medals in the 2016 Summer Olympics. The 2016 Olympics was his last one, as he announced before the beginning of the Olympic Games that he would retire from swimming, and this time for good.<br><br>Michael Phelps was born on June 30, 1985, in Baltimore, Maryland. Phelps began swimming at the age of seven, partly because of the influence of his sisters and partly to provide himself with an outlet for his energy. Phelps&#x27; rapid improvement culminated in his qualifying for the 2000 Summer Olympics at the age of 15 and becoming the youngest male to make a U.S. Olympic swim team in 68 years."},{"n":6,"type":"text","section":"Reading","stem":"What is the underlying assumption in this paragraph?","options":["People should love and appreciate summer.","Summer is not too hot.","People are not engaging in activities outside.","Summer is a better season than winter."],"passage":"<strong>Read the paragraph</strong><br>Some people don&#x27;t enjoy summer. They think it gets too hot and humid, and they are unable to engage in activities outside. Don&#x27;t they realize that summer is the best season for traveling and spending time at the beach? Surely, people who don&#x27;t like summer are confused."},{"n":7,"type":"text","section":"Reading","stem":"What is the reason the Greenland shark lives so many years?","options":["because it does not stop growing until it reaches maturity","because it is the largest living species of shark","because its growth rate is slow, less than an inch a year","because it is very rare, making it difficult to track its growth"],"passage":"<strong>Read the passage</strong><br>The Greenland shark is one of the largest living species of shark, with dimensions similar to those of the great white shark. The Greenland shark has the longest known lifespan of all vertebrate species. These sharks can reach ages of 200 years old, although one shark found was 400 years old. They live so long because they grow very slowly:about 0.4 inches a year. The Greenland shark reaches maturity at about 100 years old. These sharks are rarely observed. The first underwater photos of a live Greenland shark were only taken in 1995, while the first video of a Greenland shark was obtained in 2003."},{"n":8,"type":"text","section":"Reading","stem":"Which of the following would NOT be considered a strike?","options":["a pitch that was thrown outside the strike zone","a pitch that the batter swung at and missed","a pitch that was thrown inside the strike zone","a ball that the batter hit into foul territory"],"passage":"<strong>Read the paragraph</strong><br>Baseball is a sport played by two teams. Each team has nine players. In baseball, one team throws a small round ball, called a baseball, and the other team tries to hit it with a club, called a bat. Teams score points by running and touching markers on the ground, called bases, until they reach the last one, called home plate.<br><br>:::<br><br>Glossary:<br>baseline: the line between each of the bases in order. For example, from home plate to first base, from first base to second base, and so on.<br>base path: the area along the baseline where the players run from base to base.<br>ball: a pitch that was thrown outside the strike zone and that the batter did not swing at.<br>strike: a pitch that was thrown inside the strike zone and that the batter did not swing at, a pitch that the batter swung at and missed, or a ball that the batter hit into foul territory."},{"n":9,"type":"text","section":"Reading","stem":"Which detail from the story BEST supports the main idea that Aria is excited about ballet class?","options":["She counts down the minutes.","She follows the teacher's instructions.","She thinks of all her friends look happy.","She looks at the other girls getting ready."],"passage":"<strong>Read the story</strong><br>Aria was sitting on a bench in the ballet classroom. She looked at the other girls walking in, arranging their belongings in the corner, and getting ready. She closed her eyes and could almost hear a distant echo of her favorite classical music piece. She pictured herself and her classmates dancing with this song playing in the background.<br><br>The ballet teacher opened the classroom door and asked the students to take their positions. Aria ran to the left side of the class. As she was following the teacher&#x27;s instructions, she looked around at her friends. &quot;They all seem so happy!&quot; she thought. &quot;Ballet class is truly a magical pastime.&quot;"},{"n":10,"type":"text","section":"Reading","stem":"What is the synonym (a word that shares the same meaning with another) of the word \"remarkable\" in this short passage?","options":["flawed","impressive","average","grateful"],"passage":"<strong>Read the sentences</strong><br>Malala Yousafzai is a remarkable young Pakistani activist for female education. She had an undefeated spirit to continue fighting for her cause, even in the face of many obstacles. Her determination inspired world leaders, organizations, and millions of people to take action to improve education accessibility for girls."},{"n":11,"type":"text","section":"Reading","stem":"This passage is an example of which type of text?","options":["a myth","a play","a fable","a poem"],"passage":"<strong>Read the passage</strong><br>A Lion was sleeping. A Mouse ran over his body. He awoke and caught her. The Mouse begged him to let her go. She said, &quot;Let me go, and I will do you a favor.&quot; The Lion laughed at the Mouse for promising him a favor, and he let her go.<br><br>Then, the hunters caught the Lion and tied him with a rope to a tree. The Mouse heard the lion&#x27;s roar, ran up, gnawed the rope through and said, &quot;Do you remember? You laughed, not thinking that I could repay you, but now you see that a favor may also come from a Mouse.&quot;"},{"n":12,"type":"text","section":"Reading","stem":"Who most likely locked the door in this story?","options":["the trapeze artist","Rubber Girl","the clown","Fiona"],"passage":"<strong>Read the story</strong><br>The flying trapeze artist tried to open the door to the stage, but it was stuck. Everyone backstage of the circus show stopped what they were doing. Rubber Girl cried, &quot;Someone locked the door!&quot; All the performers looked around suspiciously and started throwing accusations at one another. &quot;We have an audience waiting for us outside. We have to find a way to open the door!&quot; called Fiona. Everyone ran to the door and tried to push it open. The clown announced, &quot;Coming through! I&#x27;ll open the door!&quot; He asked everyone to move away and they obeyed. He pushed the door again and again, but it did not open. He secretly pulled a shiny little object out of his ridiculously big shoe. The door opened when he pushed it next. Everyone cheered and hugged the clown. They all thanked him for saving the day."},{"n":13,"type":"text","section":"Reading","stem":"Which sentence from the passage is an opinion about the Galápagos penguin?","options":["\"The Galápagos penguin is an endangered species.\"","\"The female penguins are smaller than the males.\"","\"They face many dangers due to humans.\"","\"Snorkeling with penguins is an incredible experience.\""],"passage":"<strong>Read the passage about the Galápagos penguin</strong><br>The Galápagos penguin<br><br>1. The Galápagos penguin is a penguin that lives in the Galápagos Islands. It can survive due to the cool temperatures in the area. The Galápagos penguin is one of the banded penguins. The other species live mostly on the coasts of Africa and mainland South America.<br><br>What They Look Like<br>2. The average Galápagos penguin is 19 inches long and 5.5 lb in weight. Galápagos penguins have black heads with a white border running from behind the eye to join on the throat. They have black-grey upperparts and whitish underparts. The female penguins are smaller than the males.<br><br>Where They Live<br>3. The Galápagos penguin is found primarily on Fernandina Island and the west coast of Isabela Island. Small groups can be found on other islands in the Galápagos area.<br><br>What They Eat<br>4. Galápagos penguins eat small fish, mainly mullet and sardines. They search for food only during the day and normally within a few miles of their breeding site. They depend on the cold currents to bring them food.<br><br>Breeding and Predators<br>5. Galápagos penguins typically breed only when food becomes less scarce. They usually raise only one chick at a time, as they cannot always provide enough food for more."},{"n":14,"type":"text","section":"Reading","stem":"How does the formation of the passage help the reader?","options":["The numbering of the passages organizes the information in order of importance.","The numbering of the passages organizes the information in a time order.","The subheadings direct to specific information."]},{"n":15,"type":"text","section":"Reading","stem":"What is the MOST likely reason Galápagos penguins usually raise one child?","options":["The Galápagos penguin searches for food only during the day.","The Galápagos penguin is unable to provide food for the young at certain times.","The Galápagos penguin has to handle the danger of many predators.","The Galápagos penguin is an endangered species."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
