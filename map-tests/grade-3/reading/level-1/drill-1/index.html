<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 3 Reading (Level 1): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 3 Reading (Level 1): Drill 1</div>
  <h2>MAP Grade 3 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 3 Reading (Level 1): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 3 Reading (Level 1): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G3-READ-L1-D1";
const BANK_PATH = "map-tests/grade-3/reading/level-1/drill-1/bank.csv";
const TITLE = "MAP Grade 3 Reading (Level 1): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Based on the information in the paragraph, what is the meaning of the word \"chemical\"?","options":["yellow cheese","type of material","leaves of plants","body scan"],"passage":"<strong>Read the paragraph and the dictionary definitions</strong><br>Mr. Garcia handed his students several test tubes with liquid chemicals during science class. He told his students to pour the contents of the test tubes into a large bowl and watch how the mixture changed its color from transparent to yellow.<br><br><strong>Dictionary:</strong><br>checkup (chek-uhp) n. a comprehensive physical examination<br>cheddar (ched-er) n. a hard, smooth-textured cheese, varying in color from white to deep yellow<br>chemical (kem-i-kuh l) n. a substance produced by or used in a chemical process<br>cherimoya (cher-uh-moi-uh) n. a tropical American tree, having leaves with velvety, hairy undersides"},{"n":2,"type":"text","section":"Reading","stem":"What is the setting of this passage?","options":["a hiking path","a narrow mountain road","a limb over a river","a wide bridge over a river"],"passage":"<strong>Read the story</strong><br>One morning, two mountain goats started to cross a very narrow log over a river. They started on opposite sides and met in the middle. They both thought they had the right of way.<br><br>The first goat said to the second goat, \"You have to return to your side so I can cross. There is not enough room for both of us to cross each other!\" There would not have been enough room for even two little chipmunks to cross the log.<br><br>The second goat was just as stubborn, and said, \"Why should I have to go back? You go back!\" The first goat said, \"If you don't go back then I will fight you!\" Risking both their lives, they started to fight, and they both fell into the river and were swept away by the current."},{"n":3,"type":"text","section":"Reading","stem":"What does the author want you to think about Sophia?","options":["She is bored.","She is tired.","She is friendly.","She is lonely."],"passage":"<strong>Read the sentences</strong><br>Sophia was standing alone at the corner of the classroom. She looked around at her classmates playing games and talking to each other excitedly. She was too shy to join the nice group of girls across the room. She just wished someone would come over and talk to her."},{"n":4,"type":"text","section":"Reading","stem":"Why is the polar bear classified as a marine mammal?","options":["It is the largest predator that lives in water.","Its preferred food lives in water.","It is the only mammal that lives in water.","It relies on sea ice for its existence."],"passage":"<strong>Read the paragraph</strong><br>Polar bears are the largest land predators in the world. Polar bears hunt their preferred food of seals from the edge of sea ice. Polar bears are classified as marine mammals because they spend most of their lives in and depend on the sea ice of the Arctic Ocean. There is a high estimated risk of future decline in the polar bears' population due to climate change."},{"n":5,"type":"text","section":"Reading","stem":"What is the purpose of this passage?","options":["discussing a problem","advertising a product","introducing a solution","providing information"],"passage":"<strong>Read the passage</strong><br>Neris is only number three in the toys market. So why visit our stores?<br>We try harder (when you're not the biggest, you have to.) We simply cannot afford to provide you with anything less than the best toys available. Obviously, the thing we aim for hardest is just to be nice. Why? Because we can't afford to take you for granted. Come to our stores next time. The lines at our counters are shorter."},{"n":6,"type":"text","section":"Reading","stem":"Which word will fit in BOTH places?","options":["paddle","hat","mitten","bat"],"passage":"<strong>Read the sentences</strong><br>I found my new ______ in the basement.<br>A ______ flew over my head when I walked down the street."},{"n":7,"type":"text","section":"Reading","stem":"What recently happened to their mother?","options":["She had an accident.","She was sick.","She gave birth.","She came back from a vacation."],"passage":"<strong>Read the story</strong><br>One day, Brianna and Tony were walking home from school. They stopped at their favorite candy store to purchase some gum. Brianna has her own money because she babysits, and she likes to share with Tony.<br>\"I'm delighted to see you both today,\" said Mr. Finn. \"How is your mother feeling?\"<br>\"Much better, thanks,\" said Brianna. \"She still can't cook for us, and we have to help out more around the house right now.\"<br>Brianna chose the pink gum ball and Tony chose the green one. Brianna paid Mr. Finn.<br>\"Come back soon,\" said Mr. Finn, \"and congratulations on your new baby brother!\"<br>\"Thanks,\" said Brianna and Tony together, as they walked out of the store toward home, popping the gum."},{"n":8,"type":"text","section":"Reading","stem":"This passage is an example of which type of text?","options":["a play","a story","a poem","a memoir"],"passage":"<strong>Read the passage</strong><br>I'm sure I did not break this cup;<br>It just fell down, I know it did<br>For I was only climbing up,<br>Why do they keep the cake-box hid?<br>I wanted such a little bit!<br>And then I heard that creaking door,<br>I can't tell what it was I hit,<br>Nor how that cup got on the floor."},{"n":9,"type":"text","section":"Reading","stem":"After the molten glass is removed from the furnace,","options":["it turns to sand.","it melts again.","it is cooled and hardened.","it is broken into pieces."],"passage":"<strong>Read the paragraph</strong><br>Making glass is an interesting process. First, you make a mixture of sand, lime, and soda. Then, you put the combined ingredients in a furnace that was heated to 2,850 degrees Fahrenheit, creating molten glass. Then, you remove the molten glass from the furnace."},{"n":10,"type":"text","section":"Reading","stem":"Which organization structure is used in this passage?","options":["problem and solution","cause and effect","sequence of events","compare and contrast"],"passage":"<strong>Read the passage</strong><br>There are several differences and similarities between American football and soccer. During both football and soccer games, there are 11 players per team on the field at any point in time. In both types of games, there are also at least three referees. Football requires helmets and padding to be worn, while soccer only requires shin guards. A football match is divided into four 15-minute quarters, while a soccer game lasts 90 minutes, 45 minutes for each half of the game."},{"n":11,"type":"text","section":"Reading","stem":"Which is the meaning of the word \"revolutionized\" in the story?","options":["transformed","wrecked","preserved","worsened"],"passage":"<strong>Read the passage</strong><br>Eli Whitney was a young boy who lived on a farm, but he wanted to be an inventor. When he was only a teenager, he made and sold nails in his father's workshop. He grew up and became a teacher and a farmer.<br><br>He wanted more out of life, so he moved to the South. There he noticed that the farmers were spending a very long time picking cotton every day. He invented a machine called the \"cotton gin.\" It picked cotton quickly and separated the sharp parts from the soft part of the cotton plant. This revolutionized the way that cotton was picked and increased the speed of the harvest, as well as cotton sales."},{"n":12,"type":"text","section":"Reading","stem":"Based on the passage, what is most likely the reason the butterfly did not answer the kitten?","options":["The butterfly did not hear the kitten's question.","The butterfly did not understand what the kitten asked.","The butterfly did not have the ability to speak.","The butterfly did not want to help the kitten."],"passage":"<strong>Read the passage (from \"The Little Gray Kitten\" by Mary Lawrence Tumbull)</strong><br>Once upon a time there was a little gray kitten, who had wandered far away from home. At first she liked all the strange sights she saw, but by and by she began to feel very homesick, and wished she was once more cuddled up with her brothers and sisters.<br><br>Now the only word this little gray kitten knew was \"Mew, mew!\" So when she was lonely she would say \"Mew\" when she was hungry, \"Mew;\" when she was cold or tired, glad or sad, it was always \"Mew.\" At home they knew what she meant when she said \"Mew\" but out in the wide, wide world, nobody seemed to know.<br><br>Wandering along the street, she came upon a little squirming earthworm. \"Mew,\" said she, meaning, \"Where is my home?\" The earthworm, however, did not notice little gray kitten, but crawled away across the street.<br><br>Next, the little gray kitten met a butterfly on the top of a dandelion. \"Mew,\" said the little gray kitten, meaning, \"Can you tell me where my home is?\" But the butterfly did not say anything, and flew away."},{"n":13,"type":"text","section":"Reading","stem":"How do readers learn about Sebastian?","options":["from descriptions of his feelings","from what other characters say","from what he says to others","from what he looks like"],"passage":"<strong>Read the passage</strong><br>Coach Clarke named two students as team captains and asked them to pick students for their dodgeball teams. When there were only a dozen students left, Sebastian cried, \"If you don't pick me next, I'm not going to play at all!\" Jill named Sebastian next and he joined her team, cheering.<br><br>Ten minutes into the game, Steve accidentally stepped on Sebastian's toes trying to catch the ball before it rolled over to the other team's field. \"Foul!\" yelled Sebastian, even though Steve was on his team. \"Steve shouldn't play anymore, Coach!\" he demanded of Coach Clarke. \"He stepped on my toes on purpose!\" Steve apologized to Sebastian repeatedly and promised Coach Clarke it was an accident. Coach Clarke told Sebastian she would allow Steve to keep playing. Sebastian stomped his foot and turned to Steve. \"I don't like playing with you! I wish you knew how to play fair and not ruin the game for everybody else.\""},{"n":14,"type":"text","section":"Reading","stem":"How do giraffes protect themselves from predators?","options":["They move only in groups.","They are always awake.","They sleep for very short naps.","They have very interesting coat patterns."],"passage":"<strong>Read the passage</strong><br>Giraffes are herbivores, which means they only eat plants and flowers, mostly from high up in the trees. Giraffes eat hundreds of pounds of food per week, but they do not need to drink a lot. They get most of the moisture they need from the leaves and branches they eat.<br><br>Giraffes sleep for only 20 minutes a day because they need to stay alert for other animals that might attack them. They sleep in two- to three-minute naps so that they can always be on the lookout for predators.<br><br>Giraffes have very long legs and have only two gaits: walking and galloping. Giraffes have very interesting coat patterns, and every giraffe has a different one, much like humans' fingerprints."},{"n":15,"type":"text","section":"Reading","stem":"Which of the following characteristics belongs to an encyclopedia?","options":["describes weather conditions over a short period of time","includes only a collection of maps","lists words grouped together according to similarity of meaning","needs to be constantly updated"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
