<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G3-READ-FULL";
const BANK_PATH = "map-tests/grade-3/reading/full-length/bank.csv";
const TITLE = "MAP Grade 3 Reading: Full-Length Practice Test";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Which of the sentences shows something they both AGREE on and something they both DISAGREE on?","options":["Agree: Geometry is the best math subject. Disagree: It is hard to solve math problems.","Agree: It feels good after you finish solving math problems. Disagree: It is fun to solve math problems.","Agree: It takes only one hour to finish math homework. Disagree: It is hard work to solve math problems.","Agree: Computation is a subject in math. Disagree: Solving math problems is easy."],"passage":"<strong>Q1: Read the two paragraphs</strong><br>Joey's paragraph<br>Solving math problems is fun. It is not so hard for me to solve math problems. My favorite math subject is Geometry. Math problems are challenging, but it feels good when I manage to solve them.<br><br>Dave's paragraph<br>Solving math problems is hard work. My least favorite math subject is Geometry. It took me all day to finish my math homework. It felt good when I managed to finally finish my math homework.<br><br>Joey and Dave agree on some things about math problems. They disagree on other things."},{"n":2,"type":"text","section":"Reading","stem":"Which prefix should be added to the word \"accessible\" so it will mean \"unable to be reached\"?","options":["mis-","sub-","in-","co-"],"passage":""},{"n":3,"type":"text","section":"Reading","stem":"What do all these animals have in common?","options":["They all live at the Arctic.","They are all predators.","They are all able to mask themselves.","They all share similar fur colors."],"passage":"<strong>Q3: Read the sentences about four animals</strong><br>1. Polar bears have white fur coats that can blend into the blindingly white snow of the Arctic.<br>2. Whether their coats are spotted or black, leopards can mask themselves in order to attack their prey by surprise.<br>3. In order to hide in the middle of nature's birdhouses, bark bugs appear to be part of the tree itself.<br>4. Chameleons only change color when in imminent danger."},{"n":4,"type":"text","section":"Reading","stem":"Which of the following is an example of a CAUSE AND EFFECT relationship?","options":["Dylan picked vegetables for dinner, so the neighbors complimented him and Mrs. Price on the excellent meal.","Dylan picked vegetables for dinner, so he put the vegetables in a large bowl in the kitchen.","There were not enough vegetables left in the garden, so the neighbors arrived at a quarter to seven.","There were not enough vegetables left in the garden, so Mrs. Price had to cook a different dish."],"passage":"<strong>Q4: Read the passage</strong><br>A variety of vegetables grows in the Prices' garden. Mrs. Price, Dylan's mother, loves to plant vegetables in the garden and cook them once they are ripe. Today she sent Dylan to pick some vegetables for a dinner party with the neighbors next door. She asked him to get four carrots, four tomatoes, three cucumbers, and an onion. But when Dylan arrived at the garden, he was surprised to see that there were only five tomatoes and two carrots left. He picked all the vegetables, returned to the house, and put the vegetables in a large bowl in the kitchen. Mrs. Price was a little disappointed there were not enough vegetables, but thanked Dylan for his effort. She consulted with Dylan and together they decided to cook a slightly different dish than planned. Mrs. Price and Dylan cooked, baked, and set the table together. The neighbors arrived at a quarter to seven, as planned. They enjoyed the food and complimented Dylan and Mrs. Price on the excellent meal."},{"n":5,"type":"text","section":"Reading","stem":"Which of the following details cannot be found in the passage?","options":["the University Jesse Owens attended","the number of siblings Jesse Owens had","the date in which Jesse Owens was born","the number of world records Jesse Owens set"],"passage":"<strong>Q5: Read the passage</strong><br>Jesse Owens was an American track and field athlete who won the Olympic gold medal four times. Owens specialized in the sprints and the long jump and was recognized in his lifetime as \"perhaps the greatest and most famous athlete in track and field history.\" He set all five of his world records in less than an hour at one of the biggest sports events in 1935. This achievement has never been called \"the greatest 45 minutes ever in sport\" and has never been equalled.<br><br>Jesse Owens was born in Oakville, Alabama, on September 12, 1913. He was the youngest of ten children, three girls and seven boys. Owens once said that the secret behind his success was: \"I let my feet spend as little time on the ground as possible. From the air, fast down, and from the ground, fast up.\""},{"n":6,"type":"text","section":"Reading","stem":"Which of the following sentences is the BEST example of alliteration?","options":["Paul was tense, which made no sense.","Scarlett's skirt was soaked with split soy sauce.","The birthday party was entertaining.","The kids in our neighborhood enjoy flying kites."],"passage":"<strong>Q6: Alliteration</strong><br>Alliteration is the repetition of the same initial consonant sound in nearby words."},{"n":7,"type":"text","section":"Reading","stem":"What is the meaning of the word \"company\" based on the context of this sentence?","options":["an organization that sells goods or services","the person or people who are with you","a group of people who work or perform together","a guest or guests in one's house"],"passage":"<strong>Q7: Read the sentence</strong><br>The walk from the train station to her house was long, so Madison was grateful for David's company."},{"n":8,"type":"text","section":"Reading","stem":"Which of the following characteristics belongs to an informational magazine?","options":["consists of articles about current news and events","publishes literary criticism and book reviews","produced by a business as a means of communicating to its customers","consists of a short series of amusing drawings with a small amount of writing"],"passage":""},{"n":9,"type":"text","section":"Reading","stem":"What is MOST likely the reason there are only temporary residents in Antarctica throughout the year?","options":["It is earth's southernmost continent.","Its weather is harsh and extremely cold.","It was first sighted by humans only in 1820.","Its climate does not allow people to survive there at all."],"passage":"<strong>Q9: Read the passage</strong><br>Antarctica is the earth's southernmost continent. On average, it is the coldest, driest, and windiest place on earth. The average temperature during the coldest part of the year there is -81 °F.<br>Antarctica was first sighted only in 1820 by a Russian expedition, and there is no evidence that it was seen by humans until then. In 1895, the first confirmed landing was conducted by a team of Norwegians. Nowadays, there are only 1000 to 5000 temporary residents in Antarctica throughout the year. These are mainly scientists and tourists."},{"n":10,"type":"text","section":"Reading","stem":"What is Lindsay and Gretchen's problem?","options":["They do not look alike.","They prefer different pets.","They are not mature enough.","They do not want a rabbit."],"passage":"<strong>Q10: Read the story</strong><br>Lindsay and Gretchen are twins, but they do not look even remotely similar. Lindsay has bushy brown hair and hazel eyes and Gretchen has silky red hair and green eyes. They both wish they had a pet at home. They almost managed to convince their mother to buy them a pet for their birthday, but the purchase was delayed since each of them prefers a different pet. Lindsay thinks that a dog is the best choice, while Gretchen thinks that a hamster is the best choice.<br><br>Lindsay and Gretchen's mother told them during dinner that they had to make a joint decision. \"Raising a pet requires a lot of responsibility. I want to make sure you are both mature enough.\" Lindsay and Gretchen went to the pet store after school. Eventually, they decided to take a rabbit. When Lindsay and Gretchen came back home with the new member of the family, their mother looked at it surprised. Lindsay and Gretchen explained that this cute rabbit looked at them with sad eyes and they immediately knew that it was the right pet for all the love they are ready to give."},{"n":11,"type":"text","section":"Reading","stem":"Which of the following sentences summarizes the passage BEST?","options":["Leonardo da Vinci was trained to be an artist by the sculptor and painter Verrocchio. He lived in a beautiful home given to him by the King of France.","Leonardo da Vinci wanted to know how everything worked in nature. Two of his best-known paintings are the Mona Lisa and The Last Supper.","Leonardo da Vinci was a talented artist and inventor. He is mostly known for his paintings, but his creative ideas as an inventor should not be overlooked.","Leonardo da Vinci was often thinking of new inventions: a helicopter, a tank, a calculator, a parachute, a robot, and a telephone."],"passage":"<strong>Q11: Read the passage</strong><br>Leonardo da Vinci was an Italian artist who lived in the time of the Renaissance. He is famous for his paintings, but he was also a scientist, mathematician, engineer, inventor, anatomist, sculptor, architect, botanist, musician, and writer. Leonardo wanted to know how everything worked in nature. He was very good at studying, designing, and making all sorts of interesting things.<br><br>Leonardo was born in Vinci, a small town near Florence, Italy. He was trained to be an artist by the sculptor and painter Verrocchio. He spent most of his working life for rich Italian noblemen. In his last years, he lived in a beautiful home given to him by the King of France.<br><br>Two of his paintings are among the best-known works of art in the world: the Mona Lisa and The Last Supper. Leonardo was often thinking of new inventions. He kept scrapbooks with notes and drawings of these ideas. While most of his inventions were never made, some of his ideas include a helicopter, a tank, a calculator, a parachute, a robot, and a telephone."},{"n":12,"type":"text","section":"Reading","stem":"What is the BEST title for this passage?","options":["The Lighthouse Keeper","A Successful Journey","One Rainy Night","A Sailor's Life"],"passage":"<strong>Q12: Read the passage</strong><br>The pouring rain finally stopped, and the sailor spotted the lighthouse in the distance. The terrible weather conditions turned her journey into a dangerous experience. Her rocky boat stopped shaking as the wind settled. She wrapped another wool blanket around her soaked clothes, hoping it would keep her warm. She was getting closer to the lighthouse. The sailor was pleased to find that the lighthouse emitted two flashes of light every three seconds. This meant that she was on her way to the right lighthouse. She was not lost. A half an hour later she reached the shore. The lighthouse keeper was waiting for her there to guide her to his cabin, where a burning fireplace and a cup of tea were meant to keep her warm."},{"n":13,"type":"text","section":"Reading","stem":"What is the author's BIAS in this passage?","options":["Ice cream is usually sweetened with sugar.","Ice cream's origins are known to reach back to Ancient Greece.","Chocolate is without a doubt the best flavor of ice cream.","Ice cream is made from dairy products, such as milk and cream."],"passage":"<strong>Q13: Read the passage</strong><br>Ice cream is a sweetened frozen food made from dairy products, such as milk and cream. It is often combined with fruits or other ingredients and flavors. Vanilla and chocolate are the most popular ice cream flavors in the U.S. Chocolate is without a doubt the best ice cream flavor. Ice cream is usually sweetened with sugar or sugar substitutes. Ice cream's origins are known to reach as far back as the fifth century B.C. in Ancient Greece."},{"n":14,"type":"text","section":"Reading","stem":"Choose the pair of words that are SYNONYMS (two words that share the same meaning):","options":["lazy, tired","exceptional, common","precise, specific","polite, outgoing"],"passage":""},{"n":15,"type":"text","section":"Reading","stem":"What word BEST describes how Shana feels at the end of the passage?","options":["proud","tired","excited","disappointed"],"passage":"<strong>Q15: Read the passage</strong><br>Shana spent all of her weekend studying for her English test. She asked her brother to help her solve the practice test that was handed out on Thursday. She invited a friend over to review all the homework assignments they completed during the semester. She even read all of the punctuation rules in the textbook twice. When the teacher handed the marked tests back, she smiled at Shana and said, \"I am so proud of you! The progress you made in the last couple of months is really impressive.\" Shana looked at her test. She was hoping for a higher mark."},{"n":16,"type":"text","section":"Reading","stem":"In the passage, the phrase \"low-maintenance\" means","options":["can survive cold climates.","can survive without sunlight.","requires a lot of attention.","requires little attention."],"passage":"<strong>Q16: Read the passage</strong><br>The desert rose can survive in drier climates, and it can go long periods of time without water. In terms of upkeep, this popular houseplant needs plenty of sunlight and cannot survive cold climates, but otherwise it is very low-maintenance. The most important thing about the desert rose, though, is that its sap is poisonous. Make sure to keep it out of reach of pets and children, as well as to wash your hands if you get sap on them."},{"n":17,"type":"text","section":"Reading","stem":"What is the author's attitude toward pizza?","options":["The author thinks it is an unhealthy food.","The author thinks it is one of the best foods.","The author thinks that Italian pizza is better.","The author thinks people should not consume pizza at all."],"passage":"<strong>Q17: Read the passage</strong><br>Pizza is a flatbread generally topped with tomato sauce and cheese and baked in an oven. It is commonly topped with a selection of meats, vegetables, and condiments. Records of people adding other ingredients to bread to make it more flavorful can be found throughout ancient history. For example, the ancient Greeks covered their bread with oils, herbs, and cheese. The modern pizza was invented in Naples, Italy. The first known pizzeria, Antica Pizzeria, opened in Naples in 1738.<br><br>Pizza is one of the most popular fast food dishes in the United States, but it is generally unhealthy. Pizza can be high in salt, fat, and calories. Therefore, it is not recommended to consume it on a regular basis. Since 1987, October has been officially designated National Pizza Month in the United States. Approximately three billion fresh pizzas are sold in the United States every year, plus an additional one billion frozen pizzas."},{"n":18,"type":"text","section":"Reading","stem":"What is the theme of this poem?","options":["the origin of the Camel's hump","a cure for an illness","creativeness and its advantages","laziness and its consequences"],"passage":"<strong>Q18: Read the poem \"The Camel's Hump\" by Rudyard Kipling</strong><br>The Camel's hump is an ugly lump<br>Which well you may see at the Zoo;<br>But uglier yet is the hump we get<br>From having too little to do.<br><br>Kiddies and grown-ups too-oo-oo,<br>If we haven't enough to do-oo-oo,<br>We get the hump:<br>Cameelious hump:<br>The hump that is black and blue!<br><br>We climb out of bed with a frouzly head,<br>And a snarly-yarly voice.<br>We shiver and scowl and we grunt and we growl<br>At our bath and our boots and our toys;<br><br>The cure for this ill is not to sit still,<br>Or frowst with a book by the fire;<br>But to take a large hoe and a shovel also,<br>And dig till you gently perspire;<br><br>And then you will find that the sun and the wind,<br>And the Djinn of the Garden too,<br>Have lifted the hump:<br>The horrible hump:<br>The hump that is black and blue!"},{"n":19,"type":"text","section":"Reading","stem":"This passage is an example of which type of text?","options":["A play","A story","A poem","A memoir"],"passage":"<strong>Q19: Read the passage</strong><br>Maid [in the doorway]: A lady to see you, ma'am, a stranger.<br>Nora: Ask her to come in."},{"n":20,"type":"text","section":"Reading","stem":"What was Lilly's problem here?","options":["She did not score any points during the game.","She is not a good basketball player.","Isabel did not let her play throughout the game.","Isabel's action may lead to the team's defeat."],"passage":"<strong>Q20: Read the passage</strong><br>Isabel was aching to try and shoot the hoop herself for once. Would Lilly ever let go of the ball and let anyone else play?<br>\"Three points!\" Lilly panted as the ball shot through the hoop once again. \"I scored 24 points in total!\"<br>\"Switch!\" yelled Isabel, lunging at Lilly, making her trip and lose the ball.<br>\"We are on the same team!\" Lilly complained. \"Now the other team will beat us!\""},{"n":21,"type":"text","section":"Reading","stem":"Which of the following definitions is the BEST definition for a fable?","options":["A story that is intended to be acted out in front of people who have come to see it.","A traditional story, especially one which explains the early history or a cultural belief of a group of people.","A short story that tells a moral truth, often using animals or inanimate objects as characters.","A type of writing that deals with facts about real people or events, not imaginary stories."],"passage":""},{"n":22,"type":"text","section":"Reading","stem":"Which sentence from the passage is an OPINION about oceanic dolphins?","options":["\"The eye of the oceanic dolphin is small for an animal of its size.\"","\"Swimming with dolphins is a once-in-a-lifetime experience.\"","\"There are signs that suggest oceanic dolphins have no sense of smell.\"","\"Hundreds of dolphins live in captivity across the world.\""],"passage":"<strong>Q22-Q24: Read the passage about the Oceanic Dolphin</strong><br>The Oceanic Dolphin<br><br>1. Dolphins are a diverse group of aquatic mammals. They live in all the oceans and even in some rivers. Most dolphins prefer the warmer waters of the tropic zones, but some prefer colder climates. Oceanic dolphins are one family of dolphins.<br><br>What They Look Like<br>2. Oceanic dolphins range in size. In some of the species, the males are larger than the females. They have two limbs that can be changed into flippers. They typically have \"beaks\" in the front of their heads, although there are exceptions to this rule. Their skin has a wide range of colors and patterns.<br><br>What They Eat<br>3. Most oceanic dolphins eat fish, along with a smaller number of squid and small crustaceans. Some of these dolphins also eat marine mammals and birds. They all only eat other animals. They typically have between 100 and 200 teeth. There are several ways of feeding among oceanic species. Corralling is a method in which dolphins chase fish into shallow water to catch them more easily.<br><br>Senses<br>4. Oceanic dolphins can make a broad range of sounds and whistles to communicate with other dolphins. The eye of an oceanic dolphin is small for an animal of its size, yet it does have a good eyesight. There are signs that suggest oceanic dolphins have no sense of smell. Oceanic dolphins are not thought to have a good sense of taste, as their taste buds are usually missing.<br><br>In Captivity<br>5. Several species of dolphins are kept in captivity. They are kept in theme parks, commonly known as a dolphinarium. Hundreds of dolphins live in captivity across the world, though exact numbers are unknown."},{"n":23,"type":"text","section":"Reading","stem":"Based on the passage, what is corralling?","options":["chasing fish into shallow water","keeping dolphins in captivity","swimming with dolphins in the wild","feeding on other fish"],"passage":""},{"n":24,"type":"text","section":"Reading","stem":"What is the purpose of the subheadings?","options":["to hint about what will happen in the last paragraph","to teach the reader new words","to make it easier to locate information"],"passage":""},{"n":25,"type":"text","section":"Reading","stem":"How did Thomas feel when he first looked at his popsicle right after he finished talking with Coach Maggie?","options":["excited","tired","angry","disappointed"],"passage":"<strong>Q25: Read the passage</strong><br>Thomas plays baseball every Friday. The weather is often very hot and humid when he plays. Every week, one of the team parents brings popsicles at the end of the game. Last Friday, Thomas' coach wanted to talk to him for a few minutes. His popsicle was already in his hand when she called him over.<br><br>Coach Maggie said that he needed to follow through more in his pitches and showed him how. She held the ball and touched her fingers to the stitches like she had taught him a few weeks before. Coach Maggie had been Thomas' brother's coach too, and he was an excellent pitcher. \"Make sure your arm follows this motion,\" she said, moving her arm down. \"You can't just stop when you release the ball.\"<br><br>Thomas thanked his coach and looked at the popsicle in his hand. \"Oh, no,\" he thought. \"Well, I suppose there's always next week.\""},{"n":26,"type":"text","section":"Reading","stem":"Based on the passage, which of the following statements is TRUE?","options":["The Pilgrims taught the residents of Plymouth Colony new skills.","The Mayflower was not crowded for the Pilgrims.","There were 102 crew members on The Mayflower.","The Pilgrims traveled from Massachusetts to England."],"passage":"<strong>Q26: Read the passage</strong><br>The Pilgrims were early settlers of Plymouth Colony, which is now known as Plymouth, Massachusetts. They traveled from England on a ship called The Mayflower. There were 102 people on the ship, including crew members. The Mayflower was a cargo ship and was not meant for passengers. It was uncomfortable and small. Many Pilgrims got sick on the journey or soon after they arrived. One child was born on The Mayflower. When they arrived in America, they built homes and farms. They received help from the residents of Plymouth Colony. The residents taught the Pilgrims how to plant, hunt, and fish in the new land."},{"n":27,"type":"text","section":"Reading","stem":"What is the author's purpose in using the first person in this story?","options":["to create interest","to provide several points of view","to present the story through mom's eyes","to share the drink's recipe"],"passage":"<strong>Q27: Read the story</strong><br>My mom says that breakfast is the most important meal of the day. I don't usually feel like eating until about 10 am, but I don't mind having a drink earlier in the morning. To solve this problem, my mom invented a breakfast drink for me. She takes milk, a banana, strawberries, and granola and puts them all into a blender with ice. Then she blends it and pours it into a cup. I drink it up on the bus, and when I get to school, my stomach is full and happy. The only bad thing about it is that I have to wash out the cup in the boys' bathroom at school. My friends all wish their moms would invent a breakfast drink for them, too."},{"n":28,"type":"text","section":"Reading","stem":"Based on the meaning of \"universe,\" what does UNIVERSAL mean?","options":["human","relating to space","expanding","understood by all"],"passage":"<strong>Q28: Read the paragraph</strong><br>Traffic lights are signaling devices that control the flow of vehicles and pedestrians. Traffic lights have been installed in most cities around the world. They assign the right of way to road users by the use of lights in standard colors:red, yellow, and green:using a universal color code."},{"n":29,"type":"text","section":"Reading","stem":"According to this passage, one may INFER that","options":["Pierre Curie was the lead scientist in the laboratory.","Marie Curie won her first Nobel Prize before Gerty Theresa Cory, another famous female scientist who won the Nobel Prize.","Marie Curie invented radium.","It was common for women in the 20th century to be scientists."],"passage":"<strong>Q29: Read the paragraph</strong><br>Marie Curie was a Polish and French scientist who conducted groundbreaking research on radioactivity. She was the first woman to win a Nobel Prize and was the first person and only woman to win twice. She shared the 1903 Nobel Prize in Physics with her husband Pierre Curie and with physicist Henri Becquerel, and then she won the 1911 Nobel Prize in Chemistry. Her achievements included the discovery of two elements: polonium and radium."},{"n":30,"type":"text","section":"Reading","stem":"What does the suffix -PHOBIA mean?","options":["love","envy","fear","respect"],"passage":"<strong>Q30: Read the sentence</strong><br>Ron cannot go to Luke's birthday party at his uncle's farm due to his zoophobia."},{"n":31,"type":"text","section":"Reading","stem":"A suitable title for the passage could be:","options":["The Difference between Remembering and Forgetting","Writing down Our Dreams","What Do We Know about Our Dreams?","The Mysteries of the Human Mind"],"passage":"<strong>Q31: Read the passage</strong><br>A dream is a state where we have absolutely no control over our thoughts and expressions. Most people spend six years or more of their lifetime dreaming. Research also proves that all of us dream at least twice or more in our sleep, though we may not remember those dreams when we wake up. In fact, within five minutes of waking, half of our dream content is forgotten. Within 10 minutes, almost all dreams are forgotten.<br><br>Remembering a dream, however, is not impossible. Some experts have shown that taking an active interest in your dreams, like focusing on the content of a dream or talking about it, helps you to remember it. Some therapists that interpret dreams as part of therapy encourage patients to put a pen and paper next to their beds and to write down their dreams as soon as they wake up.<br><br>Our knowledge of dreams is limited, considering the amount of time dedicated to this activity and the great importance many of us give to it. Perhaps future research will shed new light on age old questions, like the influence dreams have on our personality and behavior."},{"n":32,"type":"text","section":"Reading","stem":"Which of the following sentences describes the narrator's feelings?","options":["My dad and I went to the computer store.","It sure is fun having a new computer.","I went online and called my grandparents.","I went to play a video game."],"passage":"<strong>Q32: Read the story</strong><br>We got a new computer last weekend. Our old one was very slow and couldn't do some of the things we wanted it to do. My dad and I went to the computer store and talked to the saleslady. She told us all about the hard drive, the memory, and the graphics card. I had no idea what they were talking about. I went to play a video game. When it was time to pay, my dad called me over to the checkout so I could pay with his credit card.<br><br>When we got home, my dad spent an hour setting up the computer. He even attached the monitor and printer. I was excited when I finally got to use the computer. I went online and called my grandparents on the new video phone. It sure is fun having a new computer."},{"n":33,"type":"text","section":"Reading","stem":"What are the HOTTEST months of the year in London?","options":["June and July","August and September","July and August","September and May"],"passage":"<strong>Q33: Read the paragraph and the graph</strong><br>London has a temperate oceanic climate, similar to all of southern England. Summers are generally warm and sometimes hot. On average, London will see 31 days above 25 °C each year, and four days above 30. ow two specific rules. The first one is sticking to a routine. Once you go to sleep every night at a fixed time, your body gets used to it and it is easier to fall asleep. The second one is exercising during the day. Playing ball, swimming, or riding a bicycle can help you fall asleep faster. If you follow these two rules, you are likely to be more active and concentrated during the day."},{"n":35,"type":"text","section":"Reading","stem":"Which is the meaning of the word \"hewed\" in the story?","options":["carved","combined","built","burned"],"passage":"<strong>Q35: Read the story</strong><br>Since we live in California, my family goes to a different national park every winter vacation. Last winter, my family visited Sequoia National Park. We camped out in tents. On the second day, we went hiking to the General Sherman tree. There we saw giant sequoia trees. On the third day, we went to the Giant Forest Museum.<br><br>On the fourth day, we visited Tokopah Falls, which is a beautiful waterfall. On the last day, we saw many different animals, like bobcats and foxes. On the last day, my family's car drove through the Tunnel Log, which is a giant tree that fell across the road in 1937. In 1940, workers hewed a big hole in it, and now cars can drive right through it. I can't wait to go to another national park next year."},{"n":36,"type":"text","section":"Reading","stem":"Why did the author write this passage?","options":["to give facts about the recycling process","to persuade the readers to recycle","to tell the history of recycling","to explain how to recycle different materials"],"passage":"<strong>Q36: Read the passage</strong><br>Recycling is the process of converting waste materials into new materials and objects. Recycling can prevent the waste of potentially useful materials and reduce the consumption of fresh raw materials, thereby reducing energy usage, air pollution, and water pollution. Recycling has been a common practice for most of human history.<br><br>A wide variety of different materials can be recycled, including paper, plastic, glass, metal, textiles, and electronic equipment. For example, aluminum can be recycled from cans, computers, cookware, wires, cars, planes, and other sources. Recycling old aluminum uses only 5% of the energy used to make new aluminum.<br><br>Recycling can also save you money. Items packaged in recyclable materials usually cost less than items packed in packages that cannot be recycled."},{"n":37,"type":"text","section":"Reading","stem":"Which sentence does NOT support the main idea of the passage?","options":["NBA Playoffs begin in late April, with eight teams in each conference competing for the championship.","The National Basketball Association (NBA) is the major men's professional basketball league in North America.","It has 30 teams, which are divided into the Eastern Conference and the Western Conference.","The National Football League (NFL) is a professional American football league."],"passage":"<strong>Q37: Read the passage</strong><br>The National Basketball Association (NBA) is the major men's professional basketball league in North America, and it is widely considered to be the premier men's professional basketball league in the world. It was founded on June 6, 1946. It has 30 teams, which are divided into the Eastern Conference and the Western Conference. The National Football League (NFL) is a professional American football league. NBA Playoffs begin in late April, with eight teams in each conference competing for the championship. As of 2017, the Boston Celtics have won the most championships with 17 NBA Finals wins."},{"n":38,"type":"text","section":"Reading","stem":"Which of the words is the OPPOSITE of the underlined word?","options":["uncertain","harmless","courageous","fearful"],"passage":"<strong>Q38: Read the sentence</strong><br>The intrepid explorer was not afraid to be the first man to explore the dangerous jungle."},{"n":39,"type":"text","section":"Reading","stem":"According to the passage, why are diamonds used in industry?","options":["They are mainly used for gemstones.","They can be formed into synthetic diamonds.","They are thought to date as far back as three billion years.","They are the hardest materials on earth."],"passage":"<strong>Q39: Read the passage</strong><br>Diamond is one of the hardest known substances on earth. The word \"diamond\" derives from the Greek word \"adamas,\" which means \"unbreakable\" or \"indestructible.\" Diamonds are billions of years old:in some cases more than three billion years old. Diamonds are found deep inside the earth, at depths of 87 to 118 miles, and are naturally formed at high temperatures and pressure. They are thought to have been first recognized and mined in India. Diamonds are not only used for gemstones, but they also have industrial use. Diamonds are useful for cutting and drilling because they are so hard. Synthetic* diamonds can also be found. These diamonds are expensive to produce, but they are almost identical to and have the same qualities as natural diamonds.<br><br>*Synthetic: relating to products made from artificial substances, often copying a natural product"},{"n":40,"type":"text","section":"Reading","stem":"This passage is an example of which type of text?","options":["fiction","memoir","review","biography"],"passage":"<strong>Q40: Read the passage</strong><br>Albert Einstein was born on March 14, 1879, in Ulm, Germany. He spent most of his childhood in Munich, but finished his schooling in Switzerland. He became a scientist in the early years of the 20th century. He had many important discoveries and theories as a scientist. His most famous theory is the Theory of Relativity. This theory changed the way scientists looked at the world, and many inventions that came afterwards were based on this theory. Albert Einstein immigrated to the US in 1933 and became a US citizen in 1940. He died on April 18, 1955, in New Jersey."},{"n":41,"type":"text","section":"Reading","stem":"The MAIN purpose of the passage is to","options":["present information about the hibernation of animals.","discuss the effects of the weather on animal hibernation.","describe the effect of winter hibernation on animals' bodies.","compare warm-blooded animals to cold-blooded animals."],"passage":"<strong>Q41: Read the passage</strong><br>In Northern Europe the animals stay put in winter, but you will not see them because they hibernate. Red squirrels disappear inside trees, bears use caves, and frogs go deep under the mud. Many animals sleep under the snow; there is a lot of air in loose snow, and this helps to keep the cold out.<br><br>Some warm-blooded animals, like cats, dogs, or wolves, lead active lives, which helps to keep up their usual body temperature even in very cold weather. But a cold-blooded creature's body temperature drops along with the air temperature. In below-freezing weather, it cannot move about and has no choice but to lie down and sleep. To do that, it must find a place where it can keep fairly warm, as well as a place where its enemies cannot find it.<br><br>When hibernating, the animal's temperature drops to just over zero degrees, its heart beats very slowly, and it seems dead: the body feels so cold and the creature may breathe only once every five minutes. A hibernating animal cannot feel pain. How does the animal manage to live without eating for so many months? First, it has stored supplies of fat in its body during the summer. Second, since the hibernating animal reduces movement to a minimum:even the movement of the heart and lungs is greatly reduced:it does not need food to supply it with energy."},{"n":42,"type":"text","section":"Reading","stem":"What is the meaning of the Latin root PORT- in the word \"transportation\"?","options":["to approach","to make","to continue","to carry"],"passage":"<strong>Q42: Read the sentence</strong><br>The public transportation in the city is very efficient."},{"n":43,"type":"text","section":"Reading","stem":"One may conclude from the information in this passage that \"Platform 9¾\"","options":["can be found in a work of fiction.","is a genuine, secret platform.","is where the Hogwarts School of Witchcraft and Wizardry is.","is not very popular."],"passage":"<strong>Q43: Read the passage</strong><br>King's Cross train station, a major London railway terminal located in central London, is featured in J. K. Rowling's series of fictional books Harry Potter. It is the starting point of the Hogwarts Express train to the Hogwarts School of Witchcraft and Wizardry. In the series, the train uses a secret platform:\"9¾\":accessed through the brick wall between platforms 9 and 10.<br><br>At King's Cross station, a \"Platform 9¾\" plaque was presented in 1999 to mark the location of the fictional platform. Part of a luggage trolley was installed below the sign: the rear ends of the trolley is visible, but the rest seems to have disappeared into the wall. The location quickly became a popular tourist spot among Harry Potter fans."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
