const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"What is the meaning of the word \"sign\" based on the context of these sentences?","options":["a written or printed mark that has a standard meaning","a device that gives information to people who see it","a motion or gesture that gives information or an instruction","a signal that something exists or that shows what might happen in the future"],"passage":"<strong>Q1: Read the sentences</strong><br>He stood up and nodded. It was a sign to me that it was time to leave."},{"n":2,"type":"text","section":"Reading","stem":"Which of the following statements contrasts with another statement in the passage?","options":["\"The second wonder is the Hanging Gardens of Babylon.\"","\"To this day, 'pharos' is the name for lighthouse in several European languages.\"","\"Most of the wonders were built by the Greeks.\"","\"Out of those structures, only the Temple of Artemis still exists today.\""],"passage":"<strong>Q2: Read the passage</strong><br>The Seven Wonders of the World is a widely-known list of seven great buildings or structures from the classical time period. Most of the wonders were built by the Greeks. The first wonder is the Great Pyramid of Giza. This is the oldest of the wonders and the only one still standing. The second wonder is the Hanging Gardens of Babylon. The exact location of this monument is unknown. The third wonder is the Statue of Zeus at Olympia. It was a gigantic statue made of marble and ivory. The fourth and fifth wonders are the Temple of Artemis and the Mausoleum of Mausollos. The sixth wonder is the Colossus of Rhodes. At 30 meters, it was the tallest statue in the ancient world. The seventh wonder is the Lighthouse of Alexandria. It was called the Pharos. To this day, &quot;pharos&quot; is the name for lighthouse in several European languages. Out of those structures, only the Temple of Artemis still exists today."},{"n":3,"type":"text","section":"Reading","stem":"What is the main idea of this poem?","options":["It gets dark earlier in the winter.","The narrator does not like to go to bed in the summer.","The narrator likes to play outside in the winter.","It gets dark later in the summer."],"passage":"<strong>Q3: Read the poem</strong><br>BED IN SUMMER<br>by Robert Louis Stevenson<br><br>In winter I get up at night<br>And dress by yellow candlelight<br>In summer, quite the other way,<br>I have to go to bed by day.<br><br>I have to go to bed and see<br>The birds still hopping on the tree,<br>Or hear the grown-up people&#x27;s feet<br>Still going past me in the street.<br><br>And does it not seem hard to you,<br>When all the sky is clear and blue,<br>And I should like so much to play,<br>To have to go to bed by day?"},{"n":4,"type":"text","section":"Reading","stem":"Helen Keller is famous for all of the following except","options":["writing.","researching.","campaigning.","lecturing."],"passage":"<strong>Q4: Read the passage</strong><br>Helen Keller was an American author, lecturer, and political activist. The story of how she achieved all of this is very unusual. Born in Alabama in 1880, Keller was both deaf and blind. Despite these obvious difficulties, Keller was fortunate enough to find Anne Sullivan, a teacher who became her lifelong companion. Sullivan developed methods of communication with her deaf-blind student, who went on to become a famous writer, speaker, and campaigner for many different causes."},{"n":5,"type":"text","section":"Reading","stem":"Which of the following tests is held after the day of the Reading test?","options":["Mathematics","Writing","Spanish","Science"],"passage":"<strong>Q5: Read the testing schedule</strong><br>This is a testing schedule of an elementary school. The subjects are listed in alphabetical order.<br><br>Language Arts: February 28th, 2017<br>Mathematics: February 12th, 2017<br>Reading: March 15th, 2017<br>Science: April 2nd, 2017<br>Social Studies: April 12th, 2017<br>Spanish: March 10th, 2017<br>Writing: March 5th, 2017"},{"n":6,"type":"text","section":"Reading","stem":"What is the antonym (a word of opposite meaning) of \"praised\"?","options":["helped","criticized","complimented","argued"],"passage":"<strong>Q6: Read the sentence</strong><br>The teacher praised Dana&#x27;s hard work throughout the semester in front of the whole class."},{"n":7,"type":"text","section":"Reading","stem":"What is the main idea of both paragraphs?","options":["pets saving their owners","pets pulling Ryan to shore","pets smelling smoke","pets saving a person's life"],"passage":"<strong>Q7: Read the passages</strong><br>A Clever Dog<br><br>Rocky is a Labrador Retriever (a type of dog). One day, Rocky was swimming in Roaring Fork River in Colorado. He was trying to catch a stick when Ryan Regan, an eighth-year-old boy, floated by. The river was full of melted snow, and Ryan was so cold he could not talk. The young boy&#x27;s life was in danger; Ryan had been kayaking with his father when their boat turned over. Ryan&#x27;s father swam to shore, but the fast-moving waters quickly took Ryan down the river to where Carol Baron, a girl of 13, was playing with her dog Rocky.<br>&quot;Rocky knew the boy was in trouble and needed help,&quot; says Carol. &quot;Ryan grabbed onto the dog&#x27;s collar, and Rocky pulled Ryan to shore.&quot; Now Ryan and Rocky are friends for life, and Ryan visits Rocky whenever he can.<br><br>A Very Brave Cat<br><br>Normally, Chester is a quiet cat who enjoys sitting in people&#x27;s laps. But last summer, this cat suddenly became very noisy. &quot;I was sleeping in my bedroom, and I woke up to Chester scratching and running back and forth,&quot; says Bernice Wells, who lives in North Dakota, USA. Bernice opened her eyes and found her home filled with smoke. With Chester the cat running at her side, she made her way through the living room, kitchen, and then out the door. By then, fire was coming from the basement. As Bernice and her clever cat Chester watched from the safety of the sheriff&#x27;s car, the firefighters whom she called managed to put out the fire.<br>&quot;I feel very lucky,&quot; says Bernice. &quot;Without Chester I probably would have died in the smoke. Chester saved me and my home.&quot;"},{"n":8,"type":"text","section":"Reading","stem":"How does the writer arrange the ideas in the paragraph?","options":["by describing several solutions to a problem","by telling how things are the same or different","by putting events in time order","by showing the difference between facts and opinions"],"passage":"<strong>Q8: Read the paragraph</strong><br>Whenever you have some free time, you should play a hilarious game called &quot;To Be Continued&quot; with your friends. First, get a piece of paper and a pencil. Then, write any sentence that comes to mind at the top of the page and fold it so the sentence cannot be seen. It is best to write a funny or a silly sentence in order to get the best result. For example, you could write, &quot;The unicorn spent the day dancing inside!&quot; Next, pass the folded piece of paper to a friend and ask him or her to write an extension sentence and fold the paper too. Keep passing the paper between your friends until the page is full of your words. Enjoy gathering around, unfolding the page, and reading the ridiculous story you all wrote together!"},{"n":9,"type":"text","section":"Reading","stem":"According to this passage,","options":["a sweet potato is very much like a potato.","sweet potatoes with colorful flesh are sweeter.","only the sweet potato's root is eaten.","a sweet potato's skin can be pink."],"passage":"<strong>Q9: Read the paragraph</strong><br>The sweet potato is a root vegetable, but its young leaves are sometimes eaten as greens. It is only distantly related to the potato. The edible root is long and narrow. Its smooth skin ranges in color: it can be yellow, orange, red, purple, brown, or beige. Its flesh color also varies, and can be beige, white, red, pink, violet, yellow, orange, or purple. Sweet potatoes with white or pale yellow flesh are less sweet and moist than those with red, pink, or orange flesh."},{"n":10,"type":"text","section":"Reading","stem":"In which month were the most books read in Parolina?","options":["September","August","July","May"],"passage":"<strong>Q10: Look at the paragraph and graph</strong><br>Parolina is a small island on the border of the Indian Ocean. One of the favorite leisure time activities of the people of Parolina is reading books. When strolling around the island, one is sure to encounter many residents and tourists reading. The beach, restaurants, and parks in Parolina are always swarming with people who are lost in faraway worlds.","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjAAAAFoCAIAAADGplY/AAAABmJLR0QA/wD/AP+gvaeTAAAgAElEQVR4nOzdZ1wU19cH8LNLLwoIgmBBsQvGtaJiRRFFwYIFpNlLNGKLJRrRKHYj9mg02EWNgBWkiFIF7FIVRKRLW3rffV6MbvhTfFhlwxp+3w8vdu/M3jkzOzNn7p27A4vP5xMAAEBTYzd1AAAAAERISAAAICaQkAAAQCwgIQEAgFhAQgIAALGAhAQAAGIBCQkAAMQCEhIAAIgFJCQAABALSEgAACAWkJAAAEAsICEBAIBYQEICAACxgIQEAABiAQkJAADEguTXfezR4xdPX8W202w909RQUOjm4Z+QlNa7h47RiIGNFJ44Ss/MuezmzWazVy6Y0bg1n75yJ7+gyGycQZeO7Rq35u9XRmbOJTdvFou1auHM/3dmp9PXeTze7KlGbVq3EnZB9x+FRcYm9NXrOnpov6+KtF4VlZV8PklLSRLRGZe7efmFpkYGXTt9N19x2IvowLBXHdu1mWYy8hurKiktk5GWZrNZRHTsrGtZecX0iaM6tNVojDD/JT4BT15FxzfuWa6qinf+hmf4i2hVFSXjkYOGDfpBMCk5LfPa7QfMa0lJCaUWikotFHr30OncsW1jLV3glldg3PuUIf11h/TXY5YrLSW1fO60Rl/Ql/C/yoadfyh0NRo3e3X1wmkLNil0Nfpp88Gvq/N7Ef4yRqGrkVKP8Y1ec69R1gpdjW7eD2j0mr9fT1/HKnQ1atF9XENmVuoxXqGrUfjLmK9Y0OL1+xS6Gq3dfuwrPvsF9x+FccbN/ZCSwbzVM7RV6Grk5uHfuEsRqf1/XFHoamQ2d8M31uPm4d9rlHVhUTHzVqv/VIWuRg9Dnn9zgP8q+y2HGv0st/fEZYWuRszfoTPXq08KDHslmCT4U+w2zvHw+UYMgGGx1EGhq9GOQ+cEy1XvY9boS/myr2whAfzHDBv0g7SU5OB+uo1YZ1ZO3rQFmxqxwu/X24Rk6xXbmzoKMfX0VSwRWUwes2vDYnl52Trn2bjcmsViFZeUeviFxsZ/2HX0oonhEI5uFxGF1KZ1q3mzTKSlpUVUf31Em5AqKit9Ap7GvU+Wk5UxHNpPR1uLiHK4+S+j4uRkZQf360VE3LzC55FvJCUkhuv3IaKi4pKwF9EsFmvUkL7Vq3qXmJqYkt6xvaaivNxtn+CysvLxo/U7tddMzci64 rm","because they are on a vacation there","because spring will arrive soon","because they want to watch Punxsutawney Phil"],"passage":"<strong>Q12: Read the passage</strong><br>Groundhog Day is celebrated every year on February 2 in Punxsutawney, Pennsylvania. If the groundhog, Punxsutawney Phil, sees his shadow, he runs back to his burrow underground due to his fear. If he sees his shadow, winter will continue on for at least six more weeks. If the groundhog cannot see his shadow, he will stay above ground. This means that spring will arrive soon.<br><br>The town of Punxsutawney, Pennsylvania is usually very crowded with tourists and news reporters at the beginning of February."},{"n":13,"type":"text","section":"Reading","stem":"According to the passage, the Galápagos Islands are not","options":["a province of Ecuador.","a World Heritage Site.","a national park of Ecuador.","a popular tourist destination."],"passage":"<strong>Q13: Read the passage</strong><br>The Galápagos Islands are a group of islands located in the Pacific Ocean near the equator. Made up of 19 major islands and two smaller islets, the group is a province of Ecuador and is classified as both an Ecuadorian national park and a World Heritage Site. The Galápagos Islands&#x27; most famous feature is its wildlife, as a large number of these species are unique to the Galápagos."},{"n":14,"type":"text","section":"Reading","stem":"Based on the descriptions in the two reviews, on which topic are the two reviewers most likely to agree?","options":["the overall quality of the book","the author's craft","the characters' personalities","the details of the setting"],"passage":"<strong>Q14: Read the paragraphs</strong><br>Review 1<br><br>Feeling Sorry for Celia is a captivating book. It is a cleverly written novel that combines mystery and humor. The story revolves around Elizabeth, who lives in a suburb of Sydney, Australia, with her mother and her dog. Elizabeth&#x27;s best friend, Celia, keeps disappearing, her father comes back from a business trip, and her communication with her mother is only through notes left on the fridge. The author does a magnificent job of creating characters that have depth and complexity. This makes them very relatable. It also makes them seem like real human beings.<br><br>Review 2<br><br>Feeling Sorry for Celia was okay. I probably won&#x27;t be compelled to read anything by this author anytime soon, though. I thought that the storyline, set in Sydney, Australia, was ridiculous because Elizabeth&#x27;s problems seemed real but the parents were utterly fantastical. What sort of mother waits several weeks after her child&#x27;s disappearance and is still not worried about her? What sort of mother is absent except in notes she exchanges with her daughter? I like fiction, but this was just an odd mix. I could not relate to many of the characters and that says a lot about the quality of the book."},{"n":15,"type":"text","section":"Reading","stem":"Which of the following words is a synonym (a word having the same meaning) of \"pride\"?","options":["leader","pack","ranking","wild"],"passage":"<strong>Q15: Read the paragraph</strong><br>In the wild, packs of animals are usually arranged in a strict order. In most animal species, the young are usually found to be at the lower levels. They are followed by the females, while the males are highest up. Yet, within the males, there are also clear ranks. For instance, when observing a pride of lions, it becomes clear that one male is feared by all the others. Furthermore, among the other males in the group, there are ones considered &quot;higher up&quot; and ones that are lower in rank."}];

  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
