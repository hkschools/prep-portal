<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Reading (Level 1): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Reading (Level 1): Drill 2</div>
  <h2>MAP Grade 5 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 1): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 1): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-READ-L1-D2";
const BANK_PATH = "map-tests/grade-5/reading/level-1/drill-2/bank.csv";
const TITLE = "MAP Grade 5 Reading (Level 1): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Author's craft & structure", "stem": "Which one of the following statements in the passage includes an opinion?", "options": ["Organisms need food to be able to keep their bodies working properly.", "Malnutrition can happen when a person does not eat the right amount of nutrients.", "The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water.", "Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty."], "passage": "<strong>Read the passage</strong><br><br>Nutrition provides the cells of an organism with food. Organisms need food to be able to keep their bodies working properly. Malnutrition can happen when a person does not eat the right amount of nutrients. The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water. Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty. They take longer to digest, so they leave the person feeling fuller for longer. Protein is needed for building cells. Fat is found naturally in some foods. Many people think that fat is bad, but there are various opinions on this subject."}, {"n": 2, "type": "text", "section": "Text structure", "stem": "Giraffes need to always be alert and on the lookout for predators. Which sentence from the passage explains what happens because of this fact?", "options": ["They only eat plants and flowers.", "They do not need to drink a lot.", "Giraffes sleep for only 20 minutes a day.", "Giraffes have very interesting coat patterns."], "passage": "<strong>Read the passage</strong><br><br>Giraffes are herbivores, which means they only eat plants and flowers, mostly from trees. Giraffes eat hundreds of pounds of food per week, but they do not need to drink a lot. Giraffes sleep for only 20 minutes a day, in two- to three-minute naps, so that they can always be on the lookout. Giraffes have very long legs and have only two gaits—walking and galloping. Giraffes have very interesting coat patterns, and every giraffe has a different one, much like humans' fingerprints."}, {"n": 3, "type": "text", "section": "Vocabulary in context", "stem": "The meaning of the suffix \"-ible\" is \"capable of.\" Which of the following words means \"something you can make longer\"?", "options": ["extendible", "accessible", "divisible", "reversible"]}, {"n": 4, "type": "text", "section": "Author's craft & structure", "stem": "What is the author's viewpoint on Tolkien in the passage?", "options": ["Tolkien was a noble man.", "Tolkien was very religious.", "Tolkien was a brilliant man.", "Tolkien is the most successful author in the world."], "passage": "<strong>Read the passage</strong><br><br>J. R. R. Tolkien, author of The Lord of the Rings, was not only a successful author but also a master linguist and philologist. A professor in college, he specialized in studying Old English, but was fond of many other languages, especially Finnish and Welsh. While writing The Lord of the Rings, and for many years after, he created his own languages for the creatures in his stories. He created a whole family of languages for the Elves in the story, called the Elvish languages, and continued to develop their grammar and history until he died."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "What is the mood in the passage?", "options": ["positive", "negative", "neutral", "impossible to tell"], "passage": "<strong>Read the passage</strong><br><br>Elsa was looking out the window. It was a very cold, dark, and stormy night. The windowsill was freezing as she tried to lean on it to see outside the window. She gave up trying and decided to go and play with her little sister. It had been a long time since they had last played. She thought it might make her feel a bit better."}, {"n": 6, "type": "text", "section": "Author's craft & structure", "stem": "Which advertising technique is used in the text?", "options": ["promising customers a better lifestyle if they use the product", "announcing a big sale", "using humor", "using a famous icon"], "passage": "<strong>Read the passage</strong><br><br>One of the most attractive and popular bracelet types in our shop is called a tennis bracelet. But where did it get its name? Chris Evert is a famous American tennis player who was ranked World No. 1. This fantastic tennis player's signature accessory was a thin, flexible diamond bracelet. During the 1987 Grand Slam, Evert's bracelet snapped open mid-game and fell, and she asked the officials to halt the game until she found it. The elegant bracelet gained popularity immediately and we marketed it as a \"tennis bracelet.\" Over thirty years later, this attractive tennis bracelet is still one of the most popular models in our shop. Customers who know the origin of its name receive a 5% discount."}, {"n": 7, "type": "text", "section": "Vocabulary in context", "stem": "What does the narrator's cousin need to do once the experiment is finished?", "options": ["decide what the results are", "evaluate the results", "find the results", "think about the results"], "passage": "<strong>Read the sentences</strong><br><br>My cousin is a scientist and she does all kinds of experiments, trying to find a cure for the common cold. Every time she finishes an experiment, I ask her how it went. She always answers, \"The experiment seems to have been a success, but we must do a lot of calculations and tests to determine how good the results are.\""}, {"n": 8, "type": "text", "section": "Vocabulary in context", "stem": "What does the prefix \"mis-\" mean?", "options": ["not", "without", "wrongly", "against"], "passage": "<strong>Read the sentences</strong><br><br>I misread my lines at school.<br>She misunderstood what I was saying."}, {"n": 9, "type": "text", "section": "Author's craft & structure", "stem": "Why does the author use the phrase \"busy as a bee\"?", "options": ["to emphasize why the aunt is so impressive", "to explain why the aunt likes bees", "to show why speaking a lot of languages is impressive", "to explain why the aunt does not have time for her nephews"], "passage": "<strong>Read the passage</strong><br><br>My aunt is the most impressive woman I have ever met. She is a widow and she takes care of her three children on her own. She also works as an executive in a big company, speaks four languages, and has a lot of hobbies. Whenever I see her, even though she is always busy as a bee, she still always has time to kiss me and my brother, and ask us how things are going at school."}, {"n": 10, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct according to the passage?", "options": ["Nancy Johnson marketed her invention as the \"Johnson Patent Ice Cream Freezer.\"", "The new machine was the most complex machine ever made.", "Someone else made a fortune because of Johnson's invention.", "Nancy Johnson always wanted to receive a patent and become famous."], "passage": "<strong>Read the passage</strong><br><br>The first ice cream maker was invented by Nancy Johnson. She received a patent in 1843 for her invention, a small-scale ice cream freezer. This invention made ice cream making far easier than it had been, and ensured a more uniform texture. After Nancy Johnson received her patent, she did not have enough money and resources to manufacture and market her machine. Therefore, she sold the patent to William Young for $200. Young marketed the machine as the \"Johnson Patent Ice Cream Freezer.\" The mechanism was used in ice cream makers around the world for many years, and William Young made a fortune."}, {"n": 11, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following meanings of the word \"jam\" is used in the sentence?", "options": ["very crowded and slow", "blocked", "a difficult situation", "a sweet food"], "passage": "<strong>Read the passage</strong><br><br>I was so busy all day that I barely had a spare second to breathe, and I still wasn't finished when I joined my family at the dinner table. During dinner I talked only about the jam I was going to be in if I didn't finish soon, and as soon as dinner was over I ran back to my desk to keep working."}, {"n": 12, "type": "text", "section": "Vocabulary in context", "stem": "\"Rich\" and \"wealthy\" are two words with a relationship between them. Which pair of words from the passage has the same relationship?", "options": ["popular - symbolic", "tasty - delicious", "healthy - unhealthy", "cultures - religions"], "passage": "<strong>Read the passage</strong><br><br>The pomegranate is a very popular fruit because it is so tasty. Pomegranates are grown today all over the Mediterranean area, Southeast Asia, and North America. Pomegranates are not just delicious and healthy, but are also symbolic in many cultures and religions around the world. However, some people believe them to be unhealthy."}, {"n": 13, "type": "text", "section": "Author's craft & structure", "stem": "What is the descriptive language in the text used for?", "options": ["to show the reader that the food in India is delicious", "to show the reader that New Delhi is the capital of India", "to show the reader that the author dislikes India", "to show the reader that the author likes India"], "passage": "<strong>Read the passage</strong><br><br>I remember my first trip to India last summer as if it were yesterday. I landed in New Delhi and was amazed by the amount of people, sounds, and colors on the streets. Through the eyes of a tourist, it might look completely disordered, but after you get used to it, you realize there is an order. The people were extremely friendly, the food was delicious, and I saw the most beautiful sights in the world."}, {"n": 14, "type": "text", "section": "Main idea & theme", "stem": "Which of the following is the best summary for the passage?", "options": ["Rubber ducks that fell into the ocean in 1992 have helped to identify the North Pacific Gyre but have also contributed to the plastic pollution of the ocean.", "It is important to make sure shipping crates do not fall overboard, because they might contribute to plastic pollution, as the rubber ducks have done.", "Rubber ducks that fell overboard in 1992 have been found on shores all around the world, and some made it to the North Pacific Gyre.", "Rubber ducks found in Hawaii have made their way to the North Pacific Gyre, where they have helped to study it but have also contributed to the plastic pollution of the ocean."], "passage": "<strong>Read the passage</strong><br><br>In 1992, a shipping crate containing 28,000 rubber ducks fell overboard into the Pacific Ocean. The crate was lost, but the ducks did not disappear: they have been traveling around the world for the last twenty-five years. Some have washed up on shores in places such as Hawaii, South America, Australia, and Scotland; others have been found frozen in Arctic ice. About 2,000 of the ducks still circulate in the North Pacific Gyre, and the ducks helped to identify the exact whereabouts of the gyre and how long it takes to complete a circuit. However, the rubber ducks have also contributed to the plastic pollution that endangers animals and plants living in the ocean."}, {"n": 15, "type": "text", "section": "Detail & inference", "stem": "What is most likely the reason Martin did all the things that made Andrea so angry?", "options": ["because he liked following people", "because he wanted to be more like her", "because he thought their parents loved her more than they loved him", "because he wanted to make her angry"], "passage": "<strong>Read the passage</strong><br><br>Andrea's six-year-old brother, Martin, was always irritating her. He would follow her around the house, ask her what she was doing several times a minute, and copy whatever she ate. He took clothes from her closet without permission and begged to come along when she met her friends. One day, Andrea came home to find her geography book destroyed: Martin had written his name on every page in red paint. \"This is the last straw, Martin!\" she shrieked, and decided never to talk to him again. A few hours later, Andrea came downstairs to find the kitchen decorated with balloons and a chocolate cake with her name on it. \"I'm sorry about your book,\" Martin said. \"I only did it because I wanted you to remember me when you're in class.\" Andrea hugged him, and they made up at once."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
