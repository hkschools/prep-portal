<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Reading (Level 1): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Reading (Level 1): Drill 1</div>
  <h2>MAP Grade 5 Reading</h2>
  <p class="muted">14 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 1): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 1): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-READ-L1-D1";
const BANK_PATH = "map-tests/grade-5/reading/level-1/drill-1/bank.csv";
const TITLE = "MAP Grade 5 Reading (Level 1): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Detail & inference", "stem": "How does the author compare woolly mammoths and elephants?", "options": ["According to the passage, woolly mammoths were about the same size as elephants and their behavior was similar.", "According to the passage, woolly mammoths and elephants lived at the same time and place.", "According to the passage, woolly mammoths looked exactly like elephants.", "According to the passage, woolly mammoths had the same diet as elephants."], "passage": "<strong>Read the passage</strong><br><br>It is said that from about 400,000 until 4,000 years ago, woolly mammoths roamed the earth; more specifically, they lived in Africa, Europe, Asia, and North America. Woolly mammoths were covered in fur, which varied in color from dark to light, and they were approximately the same size as modern-day African elephants. Their ears and tail were short, and they had long tusks and four molars. Their behavior was similar to that of modern elephants—they used their tusks and trunks for fighting and foraging for food. Woolly mammoths ate grass and plants. They could reach the age of 60."}, {"n": 2, "type": "text", "section": "Text structure", "stem": "Which chapter should you read if you need information about mirrors?", "options": ["Chapter Four", "Chapter Five", "Chapter Six", "Chapter Seven"], "passage": "<strong>Read the table of contents</strong><br><br>Introduction<br>Chapter I: You and Your Car<br>Chapter II: Changing Oil<br>Chapter III: Checking the Tires<br>Chapter IV: Changing a Tire<br>Chapter V: Brakes<br>Chapter VI: Mirrors<br>Chapter VII: Checking the Headlights<br>Chapter VIII: Changing the Air Filter<br>Conclusion"}, {"n": 3, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following are opposites of \"beneath\"?", "options": ["above, over", "under, below", "at, in", "from, of"]}, {"n": 4, "type": "text", "section": "Detail & inference", "stem": "Why did Saroo's mother stay in the same city for twenty-five years?", "options": ["because Guddu needed the job in the city", "because the trains were efficient and convenient", "because the development of Google Earth meant Saroo could find the city more easily", "because she wanted Saroo to be able to find her if he came back"], "passage": "<strong>Read the passage</strong><br><br>Saroo Brierley, an Australian businessman, was born in 1981 in Khandwa, India. His family was very poor and his older brother Guddu had to work to support the family. One evening, when Saroo was five years old, Guddu and Saroo took a train to another city where Guddu had a job. Guddu told him to wait, but when Guddu did not come back, Saroo boarded an empty carriage and fell asleep; when he woke up, the train was traveling across unfamiliar country, ending about 930 miles from home. He was taken to a government center for lost children and eventually adopted by a loving Australian couple. Meanwhile, Saroo's real mother stayed in the same city for twenty-five years, waiting for him to return. As an adult, Saroo used Google Earth to locate his hometown and was reunited with his mother."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "What is the purpose of the descriptive language in the paragraph?", "options": ["to add interest to the story", "to teach the reader how to sail a boat", "to explain why the heroine chose her profession", "to make the reader understand what the waves looked like"], "passage": "<strong>Read the paragraph</strong><br><br>The pouring rain finally stopped, and the sailor spotted the lighthouse in the distance. The terrible weather conditions turned her journey into a dangerous experience. The waves that had surrounded her, as high as buildings, as intimidating as lions, had finally gone. Her rocky boat stopped shaking as the wind settled. She had made the boat herself; longing thoughts of joyous days in the warm summer sun with her father, the old, experienced sailor, flowed through her mind. His voice rang in her ears: \"Someday, my child, you will conquer the seven seas.\" Shivering, her teeth chattering, she wrapped another thick blanket around her soaked clothes.<br><br>At last, the sailor was getting closer to the lighthouse, which emitted two flashes of light every three seconds, meaning she was on her way to the right one. A half an hour later, she finally reached the shore, where the lighthouse keeper was waiting to guide her to his cabin."}, {"n": 6, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the passage is persuasive?", "options": ["While we sleep, our muscles rest and the information we absorbed during the day is processed in our brains.", "The first one is sticking to a routine.", "Playing ball, swimming, or riding a bicycle can help you fall asleep faster.", "If you follow these two rules, you are likely to be more active and focused during the day."], "passage": "<strong>Read the passage</strong><br><br>Sleep is one of the most important processes in our bodies. While we sleep, our muscles rest and the information we absorbed during the day is processed in our brains. Lack of sleep may lead to restlessness, stubbornness, and mood swings.<br><br>In order to be healthy and stay focused in school, it is recommended to follow two specific rules. The first one is sticking to a routine. Once you go to sleep every night at a fixed time, your body gets used to it and it is easier to fall asleep. The second one is exercising during the day. Playing ball, swimming, or riding a bicycle can help you fall asleep faster. If you follow these two rules, you are likely to be more active and focused during the day."}, {"n": 7, "type": "text", "section": "Author's craft & structure", "stem": "This passage is an example of which type of text?", "options": ["a play", "a poem", "historical fiction", "romantic fiction"], "passage": "<strong>Read the passage</strong><br><br>In the morning, after milking the cow and churning some butter, Elizabeth felt thirsty. She went over to the well, dropped the bucket inside, and then pulled and pulled until it came back up, full to the brim with water. As she put her lips to the bucket and drank the sweet, cold water, she felt much more energetic, and she knew it was going to be a good day."}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "Which of the following might be a conclusion from the text?", "options": ["Sea otters are friendly to people and other animals.", "Sea otters live all over the world.", "Sea otters spend a lot of time in water.", "Sea otters live alone."], "passage": "<strong>Read the passage</strong><br><br>Sea otters are mammals from the weasel family. Their thick, dense fur, the densest fur in the animal kingdom, repels water; they have webbed feet; and their ears close when they are in the water. They sleep floating on their backs using kelp to keep them from drifting.<br><br>They are social animals and like to be with other sea otters. They live in groups. It looks like they are \"holding hands\" when they are floating because they stay near each other all the time. In Alaska, sea otters can live in a group with over 2,000 other otters."}, {"n": 9, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the text is an opinion?", "options": ["Vincent van Gogh was one of the greatest painters of all time.", "His works include Sunflowers and The Starry Night, both created in the nineteenth century.", "Van Gogh was born and raised in the Netherlands, but when he grew up, he moved to France.", "He was poor and his work was not successful while he was still alive."], "passage": "<strong>Read the passage</strong><br><br>Vincent van Gogh was one of the greatest painters of all time. His works include Sunflowers and The Starry Night, both created in the nineteenth century. Van Gogh was born and raised in the Netherlands, but when he grew up, he moved to France. He was poor and his work was not successful while he was still alive. It was only after Van Gogh died that his paintings became a huge success and were sold for millions."}, {"n": 10, "type": "text", "section": "Detail & inference", "stem": "What is Monica's problem?", "options": ["She does not want to talk to Pam, but she is afraid that her friends will want to.", "She wants to buy ice cream with all her friends.", "She wants to find another group of friends because her friends do not talk to Pam.", "She wants to talk to Pam, but she is afraid the other children will be upset with her."], "passage": "<strong>Read the passage</strong><br><br>Monica's friends gathered around the school yard to play softball and called Monica over to join them. Monica noticed Pam, who was also in their class, sitting alone and looking glum. Monica was about to invite her to join the game when her friend Iris grabbed her hand and pulled her back. \"What are you doing?\" she hissed. \"We're not talking to her! We had a fight three days ago and she was horrible. None of the other kids are talking to her.\"<br><br>Iris strode back to the group. Monica remained in her place, thinking. She looked at the group, then at Pam, then crossed the yard and sat next to Pam. \"Monica!\" Iris yelled, but Monica ignored her and started talking to Pam, who instantly looked much happier.<br><br>After the game, Monica asked Pam to come eat ice cream with her. Eventually the whole group—even Iris—went to the ice cream parlor together."}, {"n": 11, "type": "text", "section": "Main idea & theme", "stem": "Which of the following is the best summary of the story?", "options": ["Leslie wanted to text her friend but couldn't find her phone; other passengers helped her and the phone was eventually found.", "Leslie wanted to text her friend but could not find her phone anywhere.", "Leslie lost her phone on the bus and found it all by herself.", "Leslie decided to text her friend, but her phone was nowhere to be found. Eventually she found it."], "passage": "<strong>Read the passage</strong><br><br>Leslie was sitting on the bus thinking about summer vacation when she decided to text her friend Rachel. She reached into her bag for her phone, but it wasn't there. She opened the bag and looked inside, but there was nothing.<br><br>Leslie started to panic. She looked all around her seat, but when she still couldn't find her phone, she started to cry. \"What's wrong?\" asked the woman sitting behind her. \"I lost my phone,\" Leslie answered. The woman got up and started looking around Leslie's seat, and Leslie joined her. Then a young man behind them said: \"Here it is!\" The phone had fallen out of her bag and traveled around the bus. Grateful and relieved, Leslie thanked the people who had helped her."}, {"n": 12, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following meanings of the verb \"made up\" is used in the sentence?", "options": ["used cosmetics", "invented a story", "restored a relationship", "compensated for something bad"], "passage": "<strong>Read the sentence</strong><br><br>They weren't speaking all week, but today they finally made up."}, {"n": 13, "type": "text", "section": "Author's craft & structure", "stem": "Laurel turning off the television is an example of which literary element?", "options": ["alliteration", "rising action", "imagery", "irony"], "passage": "<strong>Read the passage</strong><br><br>Eugene thought he and his little sister were too old to have a babysitter, but their parents insisted, and they had endured some horrific babysitters in the past. But this one, their parents promised, was different. The babysitter was about seventeen years old, and her name was Laurel. As soon as their parents left, she asked Eugene and his sister Kathleen what they wanted to do. They wanted to watch television. Laurel joined them, but after about twenty minutes, she turned it off.<br><br>\"Hey, we were watching that!\" Eugene protested. \"Oh, but I've got something much more interesting for us to do,\" Laurel replied. \"I'm going to tell you a story.\" Eugene and Kathleen exchanged gloomy looks, but Laurel seemed so determined that they kept quiet. She took a chair, sat in front of them, and began to tell them about something that had happened to her two days ago."}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "Click on all the characteristics of a play.", "options": ["consists of extensive dialogue", "contains stage directions", "uses rhymes", "is told in first person"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
