const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"This passage is mainly about","options":["itchiness, sneezing, and asthma.","how the body reacts to severe allergies.","peanut allergies.","why peanut allergies are worse than any other food allergies."],"passage":"<strong>Read the paragraph</strong><p>Peanuts may cause allergic reactions such as itchiness, sneezing, and asthma. The allergy to peanuts causes the immune system to overreact, which is the body&#x27;s method of self-defense against potential harm. It is recognized as one of the most severe food allergies because of how common, persistent, and severe the reaction it can be.</p>"},{"n":2,"type":"text","section":"Reading","stem":"According to the passage, the Galápagos Islands are not","options":["a province of Ecuador.","a World Heritage Site.","a national park of Ecuador.","a popular tourist destination."],"passage":"<strong>Read the passage</strong><p>The Galápagos Islands are a group of islands located in the Pacific Ocean near the equator. Made up of 19 major islands and two smaller islets, the group is a province of Ecuador and is classified as both an Ecuadorian national park and a World Heritage Site. The Galápagos Islands&#x27; most famous feature is its wildlife, as a large number of these species are unique to the Galápagos.</p>"},{"n":3,"type":"text","section":"Reading","stem":"How does the writer arrange the ideas in the paragraph?","options":["by describing several solutions to a problem","by telling how things are the same or different","by putting events in time order","by showing the difference between facts and opinions"],"passage":"<strong>Read the paragraph</strong><p>Whenever you have some free time, you should play a hilarious game called &quot;To Be Continued&quot; with your friends. First, get a piece of paper and a pencil. Then, write any sentence that comes to mind at the top of the page and fold it so the sentence cannot be seen. It is best to write a funny or a silly sentence in order to get the best result. For example, you could write, &quot;The unicorn spent the day dancing inside!&quot; Next, pass the folded piece of paper to a friend and ask him or her to write an extension sentence and fold the paper too. Keep passing the paper between your friends until the page is full of your words. Enjoy gathering around, unfolding the page, and reading the ridiculous story you all wrote together!</p>"},{"n":4,"type":"text","section":"Reading","stem":"Which of the following words is a synonym (a word that shares the same meaning with another) of the word \"omniscient\"?","options":["powerful","alienated","all-knowing","thoughtful"],"passage":"<strong>Read the sentence</strong><p>Despite the fact that he always thinks he knows everything, he is not omniscient.</p>"},{"n":5,"type":"text","section":"Reading","stem":"Which of the following is used in the passage to create a mental image of La Pedrera?","options":["irony","simile","alliteration","rhyme"],"passage":"<strong>Read the passage</strong><p>La Pedrera (Spanish: The Quarry) is a modernist building in Barcelona, Spain, designed by Antoni Gaudí and built in the beginning of the twentieth century. It has a unique appearance: from outside, the building is curved, which makes the viewer think of ocean waves flowing quietly. Wrought iron balconies decorate the façade. The roof is one of the most impressive parts: no less than twenty-eight chimneys can be found on the roof. Each chimney is a big sculpture, as big as a human or even bigger, and the groups of chimneys remind people of sentinels with giant helmets, protecting the sky. Some have mosaic applied to their surfaces.</p>"},{"n":6,"type":"text","section":"Reading","stem":"Which of the following sentences is an example that the author is biased?","options":["It is a recessive trait, which means you have to get the trait from both your parents in order to have it.","If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world.","You might be interested to know that red hair used to be considered an evil trait.","Red-haired people were persecuted because they were believed to be vampires."],"passage":"<strong>Read the passage</strong><p>Red hair is uncommon, occurring in about 1%-2% of people. It is a recessive trait, which means you have to get the trait from both your parents in order to have it. If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world. Then again, you still may not have red hair. You might be interested to know that red hair used to be considered an evil trait. Red-haired people were persecuted by people who believed they were vampires.</p>"},{"n":7,"type":"text","section":"Reading","stem":"Which sentence from the passage is an opinion about oceanic dolphins?","options":["\"The eye of the oceanic dolphin is small for an animal of its size.\"","\"Swimming with dolphins is a once-in-a-lifetime experience.\"","\"There are signs that suggest oceanic dolphins have no sense of smell.\"","\"Hundreds of dolphins live in captivity across the world.\""],"passage":"<strong>Read the passage</strong><p>The Oceanic Dolphin</p><p>1   Dolphins are a diverse group of aquatic mammals. They live in all the oceans and even in some rivers. Most dolphins prefer the warmer waters of the tropic zones, but some prefer colder climates. Oceanic dolphins are one family of dolphins.</p><p>What They Look Like</p><p>2   Oceanic dolphins range in size. In some of the species, the males are larger than the females. They have two limbs that can be changed into flippers. They typically have &quot;beaks&quot; at the front of their heads, although there are exceptions to this rule. Their skin has a wide range of colors and patterns.</p><p>What They Eat</p><p>3   Most oceanic dolphins eat fish, along with a smaller number of squid and small crustaceans. Some of these dolphins also eat marine mammals and birds. They all only eat other animals. They typically have between 100 and 200 teeth. There are several ways of feeding among oceanic dolphins. Corralling is a method in which dolphins chase fish into shallow water to catch them more easily.</p><p>Senses</p><p>4   Oceanic dolphins can make a broad range of sounds and whistles to communicate with other dolphins. The eye of an oceanic dolphin is small for an animal of its size, yet it does have a good eyesight. There are signs that suggest oceanic dolphins have no sense of smell. Oceanic dolphins are not thought to have a good sense of taste, as their taste buds are usually missing.</p><p>In Captivity</p><p>5   Several species of dolphins are kept in captivity. They are kept in theme parks, commonly known as a dolphinarium. Hundreds of dolphins live in captivity across the world, though exact numbers are unknown.</p>"},{"n":8,"type":"text","section":"Reading","stem":"Which of the answers best summarizes the passage?","options":["The name of the Nile river derives from a Greek name. The source of the Nile river is in an African country south of the equator.","The ancient civilizations of Egypt and Sudan relied on the Nile as a primary source for water and food, and most of the ancient Egyptians lived near the Nile.","The longest river in the world is the Nile, which is drained into the Mediterranean Sea and starts from a country south of the equator.","The Nile river, which is located in Africa and is the longest river in the world, has been the main source of reliance for Egypt and Sudan since ancient times."],"passage":"<strong>Read the passage</strong><p>The Nile River is located in Africa and is the longest river in the world. It originates in Burundi, south of the equator, and flows northward through northeastern Africa, eventually flowing through Egypt and finally draining into the Mediterranean Sea. The name Nile comes from the Greek &quot;neilos,&quot; which means &quot;valley.&quot;</p><p>Egyptian civilization and Sudanese kingdoms have depended on the river since ancient times. Most ancient Egyptians lived near the Nile as it provided water, food, transportation, and excellent soil for growing food. Nowadays, the Nile is the primary water source of Egypt and Sudan.</p>"},{"n":9,"type":"text","section":"Reading","stem":"How did Sebastian's character develop in the story?","options":["He learned to play dodgeball.","He apologized for stepping on another child's toes.","He learned to play fair.","He stopped yelling."],"passage":"<strong>Read the passage</strong><p>Coach Clarke named two students as team captains and asked them to pick students for their dodgeball teams. When there were only a dozen students left, Sebastian cried, &quot;If you don&#x27;t pick me next, I&#x27;m not going to play at all!&quot; Jill named Sebastian next and he joined her team, cheering.</p><p>Ten minutes into the game, Steve accidentally stepped on Sebastian&#x27;s toes while trying to catch the ball before it rolled over to the other team&#x27;s field. &quot;Foul!&quot; yelled Sebastian, even though Steve was on his team. &quot;Steve shouldn&#x27;t play anymore, Coach!&quot; he demanded of Coach Clarke. &quot;He stepped on my toes on purpose!&quot; Steve apologized to Sebastian repeatedly and promised Coach Clarke it was an accident. Coach Clarke told Sebastian she would allow Steve to keep playing. Sebastian stomped his foot and turned to Steve. &quot;I don&#x27;t like playing with you!&quot; Coach Clarke said, &quot;If you don&#x27;t start playing fair and stop ruining the game for everybody else, Sebastian, I won&#x27;t let you play anymore.&quot; Sebastian looked at Coach Clarke, and said, &quot;All right.&quot; For the rest of the game Sebastian was quiet, and at the end of the game he went to Jill and Steve and apologized. They all shook hands.</p>"},{"n":10,"type":"text","section":"Reading","stem":"What is the meaning of the word \"pupils\" in this text?","options":["students","black holes in the center of the eyes","loud noises used to scare mice","chairs"],"passage":"<strong>Read the passage</strong><p>The classroom was full; the bell was about to ring. Alicia was sitting and talking to her friends when suddenly they all noticed a mouse on the floor next to them. Alicia&#x27;s friends started screaming, but Alicia did not scream:she stood up and walked over to the mouse. Her pupils were dilated with fear, but nonetheless she stomped her feet as hard as she could, trying to scare the mouse away. It worked. Before she could come any closer, the mouse turned around and ran out of the classroom. Alicia and her friends all exhaled with relief.</p>"},{"n":11,"type":"text","section":"Reading","stem":"Which of the following words is a synonym (a word that shares the same meaning with another) of the word \"consequence\"?","options":["ramification","publication","revelation","finalization"],"passage":"<strong>Read the passage</strong><p>The classroom was full; the bell was about to ring. Alicia was sitting and talking to her friends when suddenly they all noticed a mouse on the floor next to them. Alicia&#x27;s friends started screaming, but Alicia did not scream:she stood up and walked over to the mouse. Her pupils were dilated with fear, but nonetheless she stomped her feet as hard as she could, trying to scare the mouse away. It worked. Before she could come any closer, the mouse turned around and ran out of the classroom. Alicia and her friends all exhaled with relief.</p>"},{"n":12,"type":"text","section":"Reading","stem":"According to the story, which of the following is a quality of the narrator?","options":["good listener","reliable","likes parties","brave"],"passage":"<strong>Read the passage</strong><p>I had been an admirer of Amy Greenhouse&#x27;s music for years and years before I finally got the chance to meet her. I had gone to all her concerts. Every day, I listened to all her songs on my iPod. When I listened to her voice, I felt like the sky had opened and I was entering heaven. It was so good. I read every single article about her; I watched interviews with her. I hung her posters in my room. I would have liked nothing better than to meet her and tell her how much I loved her and her voice.</p><p>Last August was my best friend Annie&#x27;s birthday. She had planned a big party and invited all our friends. I had already bought her a present and promised to be in charge of the music during the party, when I found out that Amy Greenhouse was coming to town and giving a concert on the very same night.</p><p>I begged Annie to change the date of the party, but unfortunately, the parents had already booked a caterer and it was impossible. Amy Greenhouse was my hero and I wanted to see her more than anything, but I knew that if I wouldn&#x27;t go to the party, no one would help with the music and the party would be ruined. It was a very difficult decision, but eventually I decided that friendship was more important and I would go to Annie&#x27;s party instead of the concert.</p>"},{"n":13,"type":"text","section":"Reading","stem":"Which of the following can describe the author's feelings according to the passage?","options":["The author feels that Harvard is the most notable school in Boston.","The author feels that Boston is a good city for students.","The author feels that Boston offers the biggest variety of universities in the United States.","The author feels that Boston was founded in the seventeenth century."],"passage":"<strong>Read the passage</strong><p>Founded in the seventeenth century, the city of Boston is considered an international center of higher education. Students from all over the world flock to Boston to enjoy its excellent schools and multicultural character. There are over one hundred universities and colleges in Greater Boston, the most notable of which include Massachusetts Institute of Technology, Harvard University, Boston University, Northeastern University, and Tufts University.</p><p>Most of the universities and colleges in Boston are private; there are only two community colleges and only one public university. Boston&#x27;s colleges and universities employ over 42,000 people, accounting for nearly seven percent of the city&#x27;s workforce.</p>"},{"n":14,"type":"text","section":"Reading","stem":"Which of the following sentences from the passage expresses an opinion?","options":["The more melanin a person has, the darker his or her skin will be.","They have white skin and hair and strikingly appealing blue or red eyes.","Redheads typically have pheomelanin in other areas of their skin, creating a pinkish hue.","They also have pheomelanin in their hair, which creates the red color."],"passage":"<strong>Read the passage</strong><p>The primary determinant of our skin color is melanin : a material that absorbs light. It is found in our skin, hair, and eyes. The more melanin a person has, the darker his or her skin will be. Melanin protects the skin from dangerous UV radiation, reducing the risk of cancer. People whose skin cannot produce melanin suffer from albinism. They have white skin and hair and strikingly appealing blue or red eyes. Albino people have been persecuted in some parts of the world, because other people think their bodies possess magical powers.</p><p>There are two types of melanin: eumelanin, which can be brown or black, and pheomelanin, which is found in red hair. Pheomelanins are concentrated in some body parts such as the lips. Redheads typically have pheomelanin in other areas of their skin, creating a pinkish hue. They also have pheomelanin in their hair, which creates the red color.</p>"},{"n":15,"type":"text","section":"Reading","stem":"What do both Kings of Conquest and Flight with Pharaoh have in common?","options":["They are both about wars.","Neither of the plots takes place at present time.","They both contain a metaphor.","They both contain an alliteration."],"passage":"<strong>Read the passage</strong><p>Jeremy waited anxiously for the whole afternoon, until he finally heard a key in the lock. He sprinted full speed to the door, slipping slightly on the linoleum floor because he was in such hurry. His father was back from a business trip after having left over two weeks ago! Jeremy&#x27;s father was wearing a long black coat and Jeremy saw snowflakes in his black hair, but at the moment he only cared about one thing. &quot;Did you bring me Kings of Conquest?&quot; he asked as soon as he finished hugging his father.</p><p>&quot;Hang on, Jeremy. I&#x27;ve just come home!&quot; laughed his father. His mother emerged from upstairs, toweling her wet hair. &quot;Welcome back, Harry. How was your trip? I&#x27;ve missed you!&quot;</p><p>&quot;Thank you dear, it was good.&quot; Jeremy&#x27;s father smiled at his wife, then grinned at his son. &quot;Haven&#x27;t you missed me, boy?&quot;</p><p>&quot;Of course, I have!&quot; said Jeremy impatiently. &quot;But I still want to know if you brought me Kings of Conquest.&quot;</p><p>&quot;Well, evidently, I can&#x27;t keep you waiting. I brought you something even better.&quot; His father took him to the sofa and after sitting down, he gave him a package, which Jeremy tore open eagerly. Inside was a book.</p><p>&quot;A book?&quot; said Jeremy, stunned and disappointed.</p><p>&quot;Not just any book,&quot; said his father. &quot;Flight with Pharaoh was my favorite book when I was your age. It&#x27;s limited edition, too. I saw it in an old bookstore and I immediately thought of you.&quot;</p><p>&quot;Thank you, Dad,&quot; said Jeremy politely, but that night, when he got into bed, he was still disappointed. He had wished for something that his friends had told him about. He opened the book half-heartedly and started to read. Little did he know he was about to read the most interesting story he had ever read in his life.</p>"},{"n":16,"type":"text","section":"Reading","stem":"How many syllables are in the word \"profitable\"?","options":["2","3","4","5"],"passage":"<strong>Read the sentence</strong><p>The business was shut down last year, since it was not profitable.</p>"},{"n":17,"type":"text","section":"Reading","stem":"Which of the following words is a synonym (a word that shares the same meaning with another) of the word ardent?","options":["enthusiastic","fascinated","indifferent","confused"],"passage":"<strong>Read the sentence</strong><p>The business was shut down last year, since it was not profitable.</p>"},{"n":18,"type":"text","section":"Reading","stem":"This passage is an example for which type of text?","options":["book review","autobiography","memoir","biography"],"passage":"<strong>Read the passage</strong><p>My name is Rita Brown. I was born in London in 1950. My father worked as a lawyer, and my mother was a dentist. When I was four years old, my parents decided to immigrate to the United States.</p><p>After high school, I went to Harvard Law School and then joined my father&#x27;s law firm. I spent all my adult life working there, and when my father retired, I took over as senior partner. I married one of the other partners and we have three children. I continued to work at the same firm until I retired a few years ago to spend more time with my family and my new grandchildren.</p>"},{"n":19,"type":"text","section":"Reading","stem":"Which of the following sentences describes the sequence of events in the passage?","options":["Dutch settlers hunted all the dodos, leading to their extinction.","The dodo went extinct because it could not fly.","The dodo went extinct before the Dutch settlers came to Mauritius.","The dodo went extinct because of hunting and predators eating its eggs."],"passage":"<strong>Read the passage</strong><p>The dodo was a bird that lived on the island of Mauritius until the seventeenth century. Nowadays, it is extinct. It was a large, flightless bird, with a long beak and gray plumage. It had no natural predators on the island.</p><p>When Dutch settlers came to Mauritius in the sixteenth century, they hunted numerous dodos and ate their meat. They also introduced animals that were new to the island, including dogs, cats, macaques, and pigs. Some of those animals escaped captivity and became feral, and they began plundering dodo nests and eating their eggs. Since the dodo only laid one egg per season, the number of eggs decreased quickly and the dodo population declined drastically, until the dodo went extinct in the middle of the seventeenth century.</p>"},{"n":20,"type":"text","section":"Reading","stem":"Which possible meanings does the word \"terrific\" have in the sentence?","options":["long or short","worrying or relaxing","marvelous or delicious","intense or frightful"],"passage":"<strong>Read the sentence</strong><p>Owing to a terrific storm, the captain of the ship had to postpone his departure.</p>"},{"n":21,"type":"text","section":"Reading","stem":"Which of the following can be concluded from the passage?","options":["If you are right-handed, you also fold your right arm over your left forearm.","It is possible to fold your arms in a different manner than usual.","L-type hand clasping might change throughout a person's lifetime.","There is one per cent of the population without a dominant hand."],"passage":"<strong>Read the passage</strong><p>There are two ways to fold your arms: with the right arm above the left forearm, which is characterized as R-type, or with the left arm above the right forearm, which is characterized as L-type. This is independent of whether the person is right-handed or left-handed. About 70% of the population is R-type. When attempting to fold arms in the opposite configuration than usual, the person may feel something is out of the ordinary. The manner of arm folding across the chest does not change throughout a person&#x27;s lifetime.</p><p>Hand clasping is another common gesture that can be done in two ways. When interlacing the fingers, people who hold the thumb of the right hand above the thumb of the left arm are R-type, while people who hold the left thumb over the right thumb are L-type. About 70% of the population is R-type. There is also one per cent of the population without a preference.</p>"},{"n":22,"type":"text","section":"Reading","stem":"What is one reason to choose a capsule hotel over a regular hotel?","options":["It is a lot cheaper.","It offers a restaurant and a pool.","It is a traditional part of trips to Japan.","It includes a wi-fi connection."],"passage":"<strong>Read the passage</strong><p>A capsule hotel is a type of hotel developed in Japan. What makes it so special is the fact that it doesn&#x27;t have rooms: the guests sleep in tiny box-shaped &quot;rooms,&quot; called capsules, that have room only for a bed. The bed takes up the entire capsule and the guest cannot sit upright inside the capsule, but only lie down. The capsule is typically made of plastic or fiberglass. The capsules are stacked side by side, two units high.</p><p>Most capsules include a television and a wi-fi connection, and the hotel provides vending machines and sometimes a restaurant and a pool. This style of hotel can be found primarily in Japan, but can also be found in Hong Kong, the Philippines, and Belgium. These hotels are very popular among people without a lot of money and only wish to stay one night. A capsule hotel might have as few as fifty or as many as seven hundred capsules.</p>"},{"n":23,"type":"text","section":"Reading","stem":"According to the story, which of the following is true about Chloe?","options":["She grew to love hard work.","She found a goal in life.","She discovered the piano.","She became a fan of Martha Aldwich."],"passage":"<strong>Read the passage</strong><p>Chloe Williams did not like to play the piano. The only times she enjoyed it were during concerts, when all eyes were on her and everyone was clapping and cheering. But the concerts seemed to go by extremely quickly, and then she was again, sitting at home in front of the piano and complaining about how she wanted to quit.</p><p>&quot;If you quit, you will never be a pianist,&quot; her father told her sternly. &quot;It will only be possible if you practice, Chloe.&quot;</p><p>But Chloe could not think of being a pianist when all her friends went to the park and she had to stay and take another piano lesson then practice for two hours a day. She had been playing for six years, and she liked the sound of the piano, but the hours and hours of practice were exhausting. &quot;That&#x27;s it! I&#x27;m quitting!&quot; she announced, stomping to her room and slamming the door.</p><p>The following week, Chloe&#x27;s family went to Amy Greenhouse&#x27;s concert. Amy Greenhouse was a very famous singer, and Chloe loved her music. Amy had a wonderful band of musicians, and Chloe felt a pang as she watched the famous pianist, Martha Aldwich. As the night came to a close, Amy Greenhouse introduced her band members one by one, and each gave a short solo. Martha was the last to be introduced, and as the crowd whooped and cheered, she gave a particularly long solo, her body moving to the music, her entire being seeming to melt into the piano; it was like they were one and the same.</p><p>Chloe went home that night, her head full of piano music. Imagining Amy Greenhouse&#x27;s voice: &quot;Introducing... Chloe Williams!&quot; She imagined the eyes of the crowd, the awe as she started to play, the wild applause when she finished.</p><p>The following morning, she knew what she wanted to do and who she wanted to become. Before her parents even got out of bed, they heard her playing the piano; she played all day and kept playing until her fingers were sore. She played the next day, and the next one, and the next.</p>"},{"n":24,"type":"text","section":"Reading","stem":"What is the main idea of the passage?","options":["It was a beautiful summer day.","The sand was warm.","The laughter of the children and the cries of the seagulls were in our ears.","The sky was a deep shade of blue."],"passage":"<strong>Read the passage</strong><p>It was such a beautiful summer day! The sand was warm on my feet as I lay in the sun watching the ocean waves. My brother and sister were in the water, and the sound of their laughter filled my ears. The sky was a deep shade of blue. Suddenly we all heard the cries of the seagulls above us; everybody looked up to see them flying, flying, flying to the horizon.</p>"},{"n":25,"type":"text","section":"Reading","stem":"What is the author's purpose in this passage?","options":["to inform","to entertain","to persuade","to instruct"],"passage":"<strong>Read the passage</strong><p>Studies have found that bilingualism is a great asset to the cognitive process, and therefore, it is very advisable. People who speak more than one language have several cognitive advantages: they score better on different tests; their memory, concentration, and multitasking skills are better; and they are less prone to diseases such as Alzheimer&#x27;s and dementia when they get older.</p><p>It is estimated that more than 427 million people speak Spanish as a native language. Spanish is considered one of the easiest languages for a native English speaker to learn, because even though the grammar and pronunciation are different from English, they are simpler and more consistent; so learning Spanish might be very easy for you. Spanish is the most popular second language learned in the United States, and even elementary schools have adopted it into their curriculums.</p>"},{"n":26,"type":"text","section":"Reading","stem":"How had Eli changed over the years?","options":["He started to break fences.","He stopped watching short, funny movies on the Internet and playing video games.","He wanted to go outside.","He started vandalizing the neighborhood and playing offensive tricks on his neighbors."],"passage":"<strong>Read the passage</strong><p>James was exhilarated. He was on his way to meet Eli, a friend he hadn&#x27;t seen since they had entered elementary school five years ago. Eli had moved away with his parents and the two of them only kept in touch over the Internet.</p><p>James was now finally old enough to take the train by himself, and his parents had finally allowed him to go. On his way, he thought longingly of the days he and Eli had spent together; they had always liked to play video games and watch short, funny movies on the Internet. He was looking forward to doing that today.</p><p>When James got off the train and met Eli and his parents, they were all thrilled to see each other, and a short while later they arrived at Eli&#x27;s house.</p><p>James wanted to play a video game, but Eli said he didn&#x27;t have any video games anymore. He wanted to go outside and meet his friends and James reluctantly agreed. Eli and his friends ran around the backyards of the neighborhood, breaking fences and leaving insulting letters in mailboxes. When James saw what they were doing, he pretended to be feeling ill so he could go back to the house and ask Eli&#x27;s parents to take him back to the train station. He knew he would probably never see Eli again, and he was happy about it.</p>"},{"n":27,"type":"text","section":"Reading","stem":"What is the meaning of the word \"candid\"?","options":["fake","honest","unhappy","truth"],"passage":"<strong>Read the paragraph</strong><p>Jane looked very uncomfortable when she said to me, &quot;I know Clayton is your friend, so you may not like what I have to say, but I must be candid and tell you what he did last week.&quot;</p>"},{"n":28,"type":"text","section":"Reading","stem":"Which of the following is the best title for the passage?","options":["Natural Water Lakes","Soda Lakes","Soap Lake","The Soapy Water of Soap Lake"],"passage":"<strong>Read the passage</strong><p>Many people think natural water lakes, ponds, and rivers contain either freshwater or saltwater. However, there are several lakes in the world naturally filled with soda. Such lakes contain mostly natural soda, which is also known as soda ash. Soda lakes are usually located in arid or semi-arid areas. Many animals and plants live in or around soda lakes; it is a highly productive ecosystem.</p><p>There are several soda lakes in the United States; Soap Lake in Washington State is an example. It gets its name from the foam in the lake, which gives the water its soapy appearance, and from the water of the lake that is very rich in minerals and therefore has a slick, soapy feel.</p>"},{"n":29,"type":"text","section":"Reading","stem":"Why was Paul angry?","options":["because he did not want to play basketball","because the bus was late","because he did not want to take the bus","because he was late for practice"],"passage":"<strong>Read the passage</strong><p>Paul had basketball practice. His father had promised to pick him up and give him a ride, but he called half an hour before the practice to say he wouldn&#x27;t make it in time. &quot;Take the bus,&quot; his father said. Paul went to the bus stop very angry. The bus was late, but he was still on time for the practice.</p>"},{"n":30,"type":"text","section":"Reading","stem":"Why does Tom act like he enjoys whitewashing the fence?","options":["because he likes to do it himself","because his aunt is very particular about the way it is done","because he wants Ben to think it is a desired job","because he does not trust Ben to do it properly"],"passage":"<strong>Read the passage</strong><p>Tom, who was whitewashing the fence, surveyed his last touch with the eye of an artist, then he sighed. Ben ran up alongside of him, eating an apple. Tom&#x27;s mouth watered for the apple, but he stuck to his work.</p><p>Ben said: &quot;Say:I&#x27;m going swimming, I am. Don&#x27;t you wish you could? But of course you&#x27;d rather work:wouldn&#x27;t you?&quot;</p><p>Tom contemplated the boy a bit, and said: &quot;What do you call work?&quot;</p><p>&quot;Why, isn&#x27;t that work?&quot;</p><p>Tom resumed his whitewashing, and answered carelessly: &quot;Well, maybe it is, and maybe it isn&#x27;t. All I know is, it suits Tom Sawyer.&quot;</p><p>&quot;Oh come, now, you don&#x27;t mean to let on that you like it?&quot;</p><p>The brush continued to move.</p><p>&quot;Like it? Well, I don&#x27;t see why I oughtn&#x27;t to like it. Does a boy get a chance to whitewash a fence every day?&quot;</p><p>That put the thing in a new light. Ben stopped nibbling his apple, watching every move and getting more and more interested, more and more absorbed. Presently he said: &quot;Say, Tom, let me whitewash a little.&quot;</p><p>Tom considered, was about to consent; but he altered his mind: &quot;No:no:I reckon it wouldn&#x27;t hardly do, Ben. You see, Aunt Polly&#x27;s awful particular about this fence:right here on the street, you know:but if it was the back fence I wouldn&#x27;t mind and she wouldn&#x27;t. Yes, she&#x27;s awfully particular about this fence; it&#x27;s got to be done very carefully; I reckon there isn&#x27;t one boy in a thousand, maybe two thousand, that can do it the way it&#x27;s got to be done.&quot;</p>"},{"n":31,"type":"text","section":"Reading","stem":"Which of the following is correct, according to the passage?","options":["McDaniel was a successful actress from the moment she started her career.","McDaniel was accepted to a minstrel show because of her career as a professional singer.","McDaniel lost several acting parts because she was better known as a singer and comedian.","McDaniel won an Oscar for a part she had not believed she would get."],"passage":"<strong>Read the passage</strong><p>Hattie McDaniel (1895-1952) was an American stage actress, singer-songwriter, and comedian. Born in Kansas, she was the youngest of thirteen children, and several of her family members had performing arts careers. At first, Hattie worked with her brother&#x27;s minstrel show, writing and performing songs, and later, she embarked on a radio career as a professional singer. She recorded many songs before the Great Depression in 1929, which was a big economic crisis, and many people, including McDaniel, lost their jobs.</p><p>In 1931, McDaniel moved to Los Angeles and started working as an actress in films. She had several small roles in various films throughout the 1930s, many uncredited. However, towards the end of the 1930s, she was chosen to play a supporting part in Gone with the Wind, a very famous and successful movie at the time, and played the slave of the house. The competition for the role had been fierce: Eleanor Roosevelt, who was First Lady, wrote to the producer of the film and asked that her own maid be given the role. McDaniel did not believe she could win, but she still went to the audition wearing an authentic maid&#x27;s uniform and won the part. Gone with the Wind is the most successful film in box-office history and is still regarded as one of the greatest films of all time.</p><p>The role of the slave in Gone with the Wind was extremely popular, and McDaniel won the 1939 Academy Award for Best Supporting Actress, the first Afro-American to win an Oscar. She was also the first Afro-American to be nominated for an Oscar. She played in over 300 movies over the years. Nowadays, she has her name on the Hollywood Walk of Fame.</p>"},{"n":32,"type":"text","section":"Reading","stem":"What is the phrase \"deafeningly silent\" used for in the paragraph?","options":["to emphasize that silence is the solution to the problem","to create a dramatic effect","to explain that the storm was loud","to emphasize how confusing the situation was"],"passage":"<strong>Read the passage</strong><p>Louisa and Aidan were sprawled on chairs in the attic, their hands behind their heads and their feet dangling, when all of a sudden, a storm started. Heavy rain pounded on the roof, and they heard the strong wind whistling outside. The only lamp in the room went out, and the children could barely see anything around them. Lightning after lightning struck the sky outside, and the children held each other&#x27;s hands as a sharp roar of thunder shook the house. It sounded as though the storm was right in their own backyard. However, a few minutes later, the storm stopped suddenly. Everything around was deafeningly silent as Louisa and Aidan got up quietly and attempted to find the door in the dark. Fortunately, the lights came back on before they had gotten to the door, and they both breathed out in relief and smiled.</p>"},{"n":33,"type":"text","section":"Reading","stem":"What is the purpose of the text?","options":["to persuade","to instruct","to describe","to inform"],"passage":"<strong>Read the passage</strong><p>The Yangtze, a Chinese river, is the longest river in Asia and the third-longest river in the world. Despite its length, it only flows inside one country. Some areas around the river flood every summer, but are protected by river dikes. Many people live in these areas, and this is why the dikes are so important.</p>"},{"n":34,"type":"text","section":"Reading","stem":"Which word has a positive connotation?","options":["rose","always","knows","frowning"],"passage":"<strong>Read the sentences</strong><p>My lady&#x27;s scent reminds me of a rose</p><p>And every answer she always knows.</p><p>She walks along the river, frowning deep in thought</p><p>She comes back and recites the poem she just wrote.</p>"},{"n":35,"type":"text","section":"Reading","stem":"The words of the education expert are an example of which kind of propaganda?","options":["loaded words","generalizations","red herring","bandwagon"],"passage":"<strong>Read the passage</strong><p>Using tablets in public schools is subject to an ongoing debate nowadays. Some schools already use them instead of textbooks, and in the near future, tablets may replace textbooks altogether. Tablets are a big industry, with 42% of US adults owning a tablet, nearly two-thirds of 2- to 10-year-olds have access to a tablet, and a third of children under five having their own tablet. Tablets are indeed lighter than textbooks, and a single tablet can hold hundreds of textbooks, plus homework, quizzes, and other files.</p><p>However, not everyone approves of this change. It has been claimed that tablets cause too many distractions in class, allowing students to enter their e-mail and other websites, instead of listening to the teacher. Tablets have also been associated with a range of health problems, including eyestrain, headaches, and neck pain. In addition, it is worth mentioning that not everyone can afford their own tablet or even an Internet connection at home. Also, tablets can crash or freeze in the middle of a lesson, unlike textbooks. It is yet unclear whether the education system will switch from print textbooks to digital textbooks on tablets in the near future. When asked to comment on the topic, an education expert recently stated, &quot;While many parents may have concerns on the subject, I can assure you that an open mind is necessary. The use of tablets has indeed increased in recent years, and it is a change. However, let us consider the fact that the weather has changed as well. Things change over time. Sometimes they are linked, sometimes they are not, but only time will tell.&quot;</p>"},{"n":36,"type":"text","section":"Reading","stem":"Which of the following is the climax of the story?","options":["Regina's skin tingling with excitement","The boy announcing: \"She's coming!\"","The teacher walking in and the children starting to sing","The teacher telling the children they have made her birthday the most special day of her life"],"passage":"<strong>Read the passage</strong><p>Regina and Lana were walking around the classroom, laughing and chatting while they put up another &quot;Happy Birthday!&quot; sign and hung up a flower garland. A few other children were blowing up balloons and hanging them on the walls. Two girls were in charge of the music and were arguing loudly over which song should be played first. Regina felt her skin tingling with excitement. Then a boy broke into the room and announced breathlessly: &quot;She&#x27;s coming!&quot;</p><p>&quot;Everyone be quiet!&quot; said Regina in a loud whisper and everyone fell silent. Regina took a quick scan of the room. It was beautifully decorated; one balloon had fallen but that barely made a difference. She would pick it up later. The children were all huddling by the door, as quiet as mice, hardly daring to breathe. Lana quickly turned off the lights. They waited a little while longer, and then, finally, the door opened and they all started singing &quot;Happy Birthday&quot; at the top of their lungs. Standing at the doorstep, staring at them with great surprise, was their homeroom teacher, Ms. Nolan. Then she smiled and thanked them, telling them no one had ever thrown her a surprise party before, and they had made this birthday the most special day of her life.</p>"},{"n":37,"type":"text","section":"Reading","stem":"What form does the poem have?","options":["sonnet","limerick","haiku","free verse"],"passage":"<strong>Read the poem</strong><p>I do not look for love that is a dream:</p><p>I only seek for courage to be still;</p><p>To bear my grief with an unbending will,</p><p>And when I am a-weary not to seem.</p><p>Let the round world roll on; let the sun beam;</p><p>Let the wind blow, and let the rivers fill</p><p>The everlasting sea, and on the hill</p><p>The palms almost touch heaven, as children deem;</p><p>And, though young spring and summer pass away,</p><p>And autumn and cold winter come again,</p><p>And though my soul, being tired of its pain,</p><p>Pass from the ancient earth, and through my clay</p><p>Return to dust, my tongue shall not complain;:</p><p>No man will mock me after this my day.</p><p>(Lady Moonway) by Christina Rossetti</p>"},{"n":38,"type":"text","section":"Reading","stem":"Which of the following is correct, according to the story?","options":["Quinn took a risk to help the tiny man.","Quinn fixed the engine of the spaceship, so the tiny man could go home.","The tiny man was a prank Quinn's friends played on him.","The man tried to explain to Quinn who he was and where he was from."],"passage":"<strong>Read the passage</strong><p>Quinn was in his backyard when he heard a small cry from somewhere below him in the grass. He bent down on his knees and looked, thinking perhaps it was a kitten. But to his shock, he saw a tiny man, about as big as his thumbnail, standing there and waving at him.</p><p>&quot;Who are you?&quot; cried Quinn.</p><p>The man covered his ears; Quinn&#x27;s voice was evidently too loud for his tiny ears. Quinn lowered his voice and spoke in a whisper, but the man didn&#x27;t seem to understand what he was saying. The man motioned Quinn over to a different area of the yard. Quinn followed him cautiously and saw a small spaceship, about the size of a pomegranate. The man rushed up to the spaceship and pointed at it, then pointed at Quinn, then back to the spaceship. Then he made peculiar gestures with his hands.</p><p>Quinn touched the spaceship gently. The man was squeaking excitedly in his own language and pointing at the wing. Looking closely, Quinn saw the wing was bent; it must have been damaged when the spaceship landed in his backyard.</p><p>Quinn lingered near the spaceship and thought for a moment. Then he motioned the tiny man to wait the wasn&#x27;t sure if the man understood, but he had no choice), ran to the garage and brought his father&#x27;s tools. He knew his father did not like anyone touching his tools, but this was an exception. He fixed the spaceship, working slowly and carefully. He was done in about half an hour. The man bowed to him in gratitude, then went inside the spaceship, and the spaceship soared upwards, above Quinn&#x27;s head, above his house, into the sky and disappeared.</p>"},{"n":39,"type":"text","section":"Reading","stem":"What is the meaning of the prefix \"centi-\"?","options":["a quarter","two hundred","a hundredth","a thousandth"],"passage":"<strong>Read the paragraph</strong><p>This bottle has about a quarter of a gallon, or one liter of milk. I have a collection of one hundred small bottles at home, each containing one centiliter. If I pour all the milk from the big bottle into my small bottles, they will all be full.</p>"},{"n":40,"type":"text","section":"Reading","stem":"What is the difference between Cornelia's character and Courtney's character, as far as the story shows?","options":["Cornelia likes to sing and Courtney does not","Courtney is more impressed by Ariana's talent","Cornelia is more easily stressed","Courtney is less afraid of tests than Cornelia"],"passage":"<strong>Read the passage</strong><p>Cornelia was standing behind the stage, breathing hard. Her parents came to wish her good luck. &quot;You&#x27;ll do great, sweetheart!&quot; they both said airily, apparently not grasping the situation. Cornelia, the most talented girl in school, went up next. She waved meekly to everyone behind the stage and disappeared. They heard the crowd cheer and applaud as Ariana sang at the top of her voice and did a beautiful job.</p><p>Cornelia&#x27;s hands were shaking. She felt she had to sit down, but looking around, she couldn&#x27;t spot a chair among the twenty children standing around, waiting to be called. No one noticed Cornelia&#x27;s mood, except her best friend Courtney, who quietly approached her and brought her a chair. Cornelia thanked her and sat down; it helped her feel more relaxed.</p><p>&quot;There&#x27;s nothing to worry about, Cornelia!&quot; said Courtney. &quot;It&#x27;s not a test! It&#x27;s only a singing contest for the spring festival; worst case scenario, you won&#x27;t get a solo. But I know you will, because you&#x27;re such a good singer.&quot;</p><p>&quot;I&#x27;m not Ariana,&quot; Cornelia mumbled.</p><p>&quot;Only Ariana can be Ariana,&quot; said Courtney. &quot;You&#x27;re Cornelia. And you&#x27;re a great singer, and I know we&#x27;ll sing together in the festival no matter what.&quot;</p><p>Cornelia smiled. She felt better. Then her name was called, and she thanked Courtney again and went up on the stage.</p>"},{"n":41,"type":"text","section":"Reading","stem":"Which of the following is an example of personification?","options":["Trees all around were blooming.","My feet were soaked.","The breeze made the flowers dance.","It only made me shiver with joy."],"passage":"<strong>Read the passage</strong><p>It was a fine day and the sky was clear above Lake Moore. Trees all around were blooming. The air itself seemed easier to breathe than usual as I stood there, taking in the magnificent view. I had just stepped out of the lake. My feet were still soaked in the gentle water of the lake and I myself was completely drenched, but the gentle breeze, which made the flowers around dance ever so slightly, only made me shiver with joy.</p>"},{"n":42,"type":"text","section":"Reading","stem":"Which of the following sentences is an example of hyperbole?","options":["I have a million things to do.","She was shaking like a leaf.","She was busy from the moment we arrived until the moment we left.","Time is money."],"passage":"<strong>Read the passage</strong><p>Last week I visited my mother&#x27;s office. She works as a CEO of a big company. She was busy from the moment we arrived until the moment we left. She ran from meeting to meeting, wrote dozens of e-mails, and answered more phone calls than I could possibly count. The other workers kept going in and out of her office and asking her questions. One of the workers had lost an important file and came to apologize, shaking like a leaf. My mother said quietly, &quot;I have a million things to do now and I have no time to find a solution. Please ask your colleagues for assistance.&quot; After the next meeting, the worker came in again to announce the file had been found. My mother exhaled in relief. Then she explained to me just how important that file was. &quot;How did you manage to keep calm when it was missing?&quot; I asked. &quot;Panicking would not have helped,&quot; my mother replied. &quot;I was calm so they could keep calm and look for the file in peace. To be useful when you&#x27;re panicking.&quot; &quot;But weren&#x27;t you worried?&quot; I asked her. &quot;Of course I was,&quot; my mother answered. &quot;But time is money and I don&#x27;t allow myself to get emotional.&quot;</p>"},{"n":43,"type":"text","section":"Reading","stem":"Based on the sentences, what is the meaning of the word \"eclectic\"?","options":["funny and amusing","of very high quality","made up of various sources and styles","extremely loud and boisterous"],"passage":"<strong>Read the sentences</strong><p>I was so disappointed in that art museum. I was sure it was going to be eclectic, but there were only paintings and they were all from the medieval era. That was not what I was looking forward to.</p>"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
