<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Reading (Level 3): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Reading (Level 3): Drill 2</div>
  <h2>MAP Grade 5 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 3): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 3): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-READ-L3-D2";
const BANK_PATH = "map-tests/grade-5/reading/level-3/drill-2/bank.csv";
const TITLE = "MAP Grade 5 Reading (Level 3): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the prefix \"anti-\"?", "options": ["former", "between", "against", "without"], "passage": "<strong>Read the sentences</strong><br><br>Remember that you don't want germs on your hands when you eat. This is why it's so important to wash them with antibacterial soap."}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "What is the setting of the story?", "options": ["wild plants", "deer and fawn", "late evening", "the forest"], "passage": "<strong>Read the passage</strong><br><br>The boy was wandering around the forest, looking curiously at the wild animals and plants around him. There were huge elm trees, beautiful red and yellow flowers, squirrels, chipmunks, and occasionally he even saw a few deer. Suddenly he let out a cry of excitement—he saw a female deer and her young fawn. The fawn was the most adorable thing the boy had ever seen."}, {"n": 3, "type": "text", "section": "Text structure", "stem": "When should the dry ingredients be added to the wet mixture?", "options": ["in the beginning, when they are all mixed together", "after the butter comes to a boil", "after the wet mixture becomes shiny and smooth", "just before the mixture is stirred and scraped into the pan"], "passage": "<strong>Read the passage</strong><br><br>Brownie cake recipe instructions:<br><br>1. Preheat the oven to 350°F. Whisk together all the dry ingredients—the flour, cocoa powder, salt, and baking powder—in a small bowl, and set it aside.<br>2. Cube the butter and place it in a saucepan over medium-low heat. Add the sugar and stir until it melts.<br>3. Before the mixture comes to a boil, remove the pan from the heat and let it cool. Once cooled, add one egg at a time, whisking well. Add the vanilla and whisk again. Now add the ingredients from the bowl you set aside earlier and stir them in with a spatula.<br>4. Scrape the brownie batter into the prepared pan and bake for 24 minutes."}, {"n": 4, "type": "text", "section": "Author's craft & structure", "stem": "How does the author pull the reader into the text?", "options": ["by discussing a topic that everyone is familiar with", "by writing in second person", "by stating that fleas can live on human bodies", "by describing fleas"], "passage": "<strong>Read the passage</strong><br><br>Fleas are small flightless insects that live as parasites on animals' bodies. They feed on the blood of their host, but a flea can live more than a hundred days without eating. Imagine not eating for a hundred days! The female flea consumes 15 times her own body weight in blood every day; imagine eating 1300 pounds of pasta in one day! One final and amazing fact is that fleas can jump up to eight inches, which is approximately 200 times their own height. That is the same as you jumping to the top of the Empire State Building."}, {"n": 5, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the story?", "options": ["Landon does not like math.", "Landon gets help from an unexpected source.", "Robin comes to a decision.", "Robin sacrifices his only free time to help Landon."], "passage": "<strong>Read the passage</strong><br><br>Landon had a very important math test. He usually got decent grades, but in the last few months it was getting more difficult, and he realized he wouldn't be able to manage on his own. Three days before the test, Landon went to the playground and saw his friend Robin, who attended another school. Robin asked why he looked glum, and Landon told him about the test. \"Not to worry,\" said Robin. \"Let's go to your house, and I'll teach you. I got an A on a test about these things.\" Robin proved a marvelous teacher and returned the next two days as well. By the day of the test, Landon felt ready and relaxed, grateful for Robin's help."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "What is the stereotype found in the passage?", "options": ["Morbid obesity is becoming more prevalent over time.", "Adults like vegetables.", "Teenagers are rebels.", "Children do not like healthy food."], "passage": "<strong>Read the passage</strong><br><br>Clinically severe or morbid obesity entails serious health consequences. Between 2000 and 2010, the prevalence of morbid obesity in the United States increased by over 70%. The most effective way to prevent the risks is to keep a healthy lifestyle. There are healthy food options that even children like. If parents make sure there are as few unhealthy food options available as possible, even children will eat healthy food. The main tip nutritionists give parents is to keep a healthy lifestyle themselves, and their children will follow."}, {"n": 7, "type": "text", "section": "Author's craft & structure", "stem": "This passage is an example of which type of text?", "options": ["biography", "book review", "memoir", "fiction"], "passage": "<strong>Read the passage</strong><br><br>Frances Spence was born in Philadelphia in 1922. She studied mathematics and physics, married, and had three sons. She was one of the first female computer programmers in the world and one of the original programmers of the ENIAC—the first digital computer, a project of the US Army. Due to the stigma that women were not interested in technology, Spence and the other female programmers did not receive credit in publications. However, in 1997, Spence was inducted into the Women in Technology International Hall of Fame. Spence passed away in 2012 at age 90."}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "What is the conflict in the story?", "options": ["Liam's brother is upset with the boys for interrupting his driving.", "Liam is upset with his friends for not protecting him.", "Tyler is upset with Liam for protecting Theo but not him.", "Tyler is upset with Liam and Theo for throwing a frisbee."], "passage": "<strong>Read the passage</strong><br><br>The three boys were sitting in the back seat of the car on the way to the beach. Suddenly they heard a very loud noise and their ears rang. The three boys screamed and threw themselves under the seat, and as they did, Liam wrapped his arm around Theo, protecting him. \"Everything is fine!\" Liam's brother said. \"It was just a car that backfired!\" Tyler looked at the other two and saw Liam with his arm around Theo. Tyler was very quiet at the beach. After swimming, Liam asked his friends to throw a frisbee. Theo agreed, but Tyler said he would rather be on his own."}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following is the most logical, according to the passage?", "options": ["It is impossible to use a hot air balloon to get from one place to a specific destination.", "Sky lanterns are typically made of paper because it is flammable and causes fire hazards.", "When the source of heat under the balloon goes out, the balloon sinks back to the ground.", "A hot air balloon flies because air passes through its envelope."], "passage": "<strong>Read the passage</strong><br><br>The hot air balloon was the first successful flight technology that carried a human. A hot air balloon consists of a fabric bag called an envelope. Since warm air is lighter than cold air, it rises above cold air; this is why the envelope is filled with a gas warmer than the air outside, which enables the balloon to float. Attached underneath is a basket that carries passengers and a source of heat, like a burner, that fills the envelope with warm gas and keeps it warm throughout the flight. It is possible to propel the hot air balloon in the desired direction."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "What point of view is used in the passage?", "options": ["first person", "second person", "third person omniscient", "third person limited"], "passage": "<strong>Read the passage</strong><br><br>Anne's cup of happiness was full, and Matthew caused it to overflow. He produced a small parcel and handed it to Anne. \"I heard you say you liked chocolate sweeties, so I got you some,\" he said. \"Humph,\" sniffed Marilla. \"It'll ruin her teeth.\" \"Oh, no, I won't,\" said Anne eagerly. \"I'll just eat one tonight. And I can give Diana half of them, can't I?\" \"I will say it for the child,\" said Marilla when Anne had gone, \"she isn't stingy. I'm getting fond of her, but don't you rub it in, Matthew Cuthbert.\"<br><br>(Adapted from Anne of Green Gables)"}, {"n": 11, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an idiom?", "options": ["The neighbors cornered him.", "This is the final straw.", "He was drowning in paperwork.", "Arthur was as happy as a king."], "passage": "<strong>Read the passage</strong><br><br>Quentin owns an apartment in the city. He sublets it to young couples but has been having bad luck with tenants. The first couple broke the bathtub, the second painted all the walls black, and the third had a dog that destroyed the sofa. When Quentin visited last week, the neighbors cornered him to complain about the current couple leaving their trash in the corridor. \"This is the final straw!\" Quentin cried. \"I will never sublet the apartment again!\" He came home to find his son, Arthur, drowning in paperwork. \"How would you like to live in the apartment instead?\" Quentin asked. Arthur was as pleased as punch to accept."}, {"n": 12, "type": "text", "section": "Text structure", "stem": "Which of the following statements can be concluded from the table?", "options": ["Most days, the difference between the number of trains going through station A and station C is 10 or less.", "Most days, the difference between the number of trains going through station B and station C is 10 or less.", "Most days, the number of trains going through stations B and C is equal.", "Most days, the number of trains going through stations A and C is equal."], "passage": "<strong>Read the passage</strong><br><br>The table shows the number of trains going through three different stations (A, B, and C) on each weekday (Monday through Friday)."}, {"n": 13, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the phrase \"play devil's advocate\"?", "options": ["teach a class", "give someone courage to speak in front of many people", "present counter arguments when strongly disagreeing with a cause", "present counter arguments to a cause, even while agreeing with it"], "passage": "<strong>Read the paragraph</strong><br><br>My friends and I organized a petition for a Black History class at our school. The principal invited me to argue our cause in front of the school board. I was nervous and asked my friend Laura, who had organized the petition with me, to help me practice. She played devil's advocate and I answered her flawlessly. Thanks to her, I was much less nervous when I stood in front of the board."}, {"n": 14, "type": "text", "section": "Detail & inference", "stem": "Which of the following is a conclusion that can be made from the passage?", "options": ["Eyespots are the best way to avoid deathly attacks by predators.", "Predators can never distinguish between eyespots and true eyes.", "Eyespots are more efficient if found on both the left and right sides of the body.", "All fish have eyespots, but in some fish species, they cannot be seen."], "passage": "<strong>Read the passage</strong><br><br>When a predator attacks, it usually looks for the head first, because it can cause more harm there. When the attack is quick, the predator looks for the eyes, which are prominent and found on the head. Many prey animals have diversion mechanisms to deceive the predator. The most efficient way is showing an eyespot—a marking that looks like an eye but isn't. Eyespots are common among fish such as the butterflyfish, which has an eyespot near its tail larger than its true eye. Butterflies also have eyespots on their wings; birds are deceived and attack the wing instead of the head, letting the butterfly fly away."}, {"n": 15, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is true about the two poems?", "options": ["Both poems use snow as a motif but use it to express different emotions.", "Both poems contrast fire with snow.", "Both poems express sorrow for losing a loved one.", "Both poems use snow as a motif, but the first poem has a more negative mood than the second poem."], "passage": "<strong>Read the two poems</strong><br><br>Over valley, over hill,<br>Hark, the shepherd piping shrill!<br>Driving all the white flocks forth<br>From the far folds of the North.<br>Blow, Wind, blow<br>Weird melodies you play,<br>Following your flocks that go<br>Across the world to-day.<br><br>Blow, Wind, blow<br>Upon your pipes of joy:<br>All your sheep the flakes of snow<br>And you their shepherd boy!<br><br>(\"Snow Song\" by Frank Dempster Sherman)"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
