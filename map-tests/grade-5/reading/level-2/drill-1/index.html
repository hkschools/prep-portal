<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Reading (Level 2): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Reading (Level 2): Drill 1</div>
  <h2>MAP Grade 5 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 2): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 2): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-READ-L2-D1";
const BANK_PATH = "map-tests/grade-5/reading/level-2/drill-1/bank.csv";
const TITLE = "MAP Grade 5 Reading (Level 2): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following definitions is the best definition for a simile?", "options": ["a series of two or more words that begin with the same sound", "an expression whose meaning cannot be understood from the meaning of each separate word", "a figure of speech used to compare two things using words such as \"like\" or \"as\"", "a figure of speech used to compare two things without using words such as \"like\" or \"as\""]}, {"n": 2, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words means \"faulty structure\"?", "options": ["misinterpretation", "ungraceful", "unaccountable", "malformation"]}, {"n": 3, "type": "text", "section": "Main idea & theme", "stem": "What is the hidden message in the story?", "options": ["It is more important that you marry the person you love than where or how you do it.", "Getting married near a hospital bed is a wonderful idea.", "Big weddings are a waste of time and money.", "Even when you dream about something, sometimes it is necessary to give up on your dream."], "passage": "<strong>Read the passage</strong><br><br>\"What can I write about?\" Sabrina asked her father about her school assignment to write about an important family event. Her father suggested she ask her grandmother about her wedding. Sabrina's grandmother said it was a special day: a big wedding with four hundred guests, with everything ready. \"I was all dressed in a gorgeous white dress, and I was so happy... then his best friend came running to tell me he had been hurt in a car accident.\" Instead of going to the chapel, the grandmother went to the hospital, where she barely left his side for three days until he woke up. \"The doctors said he would recover but couldn't leave the bed for a week, so I had the minister on hold. He came as soon as I let him know, and married us right then and there, at the hospital. It was the best day of my life, just as I had dreamed it would be. That was all I needed.\""}, {"n": 4, "type": "text", "section": "Main idea & theme", "stem": "What is the moral of the story?", "options": ["Every trickster might be caught.", "Be respectful of others.", "Appearances may be deceiving.", "Twins whose mother is a teacher must study hard."], "passage": "<strong>Read the passage</strong><br><br>Dylan and Connor were twelve-year-old identical twins who liked to play tricks. Their favorite trick was switching places to take exams for each other—Dylan would take Connor's math exams while Connor took Dylan's English exams. On the day of Connor's math final, they came to school ready to switch, but as Connor walked into the classroom, his mouth dropped in horror: his mother was standing there. \"I am your substitute teacher today, Connor,\" she said. Connor sat, more anxious than ever; he hadn't studied, but there was no way they could fool their own mother, who was strict and observant and would never fall for a switching trick."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "The passage above is an example of which kind of text?", "options": ["advertisement", "book review", "fiction", "nonfiction"], "passage": "<strong>Read the passage</strong><br><br>\"My name is Abdul,\" he said, turning to Chuskit. \"I have often wondered why you don't come to school.\" \"I have never been to school,\" said Chuskit. \"The path to the school is too uneven and pebbly and my wheelchair will get stuck. Besides, I cannot cross the little stream in front of the school.\" \"But would you like to come to school?\" asked Abdul. \"Of course!\" replied Chuskit. \"I want to study like all of you, make friends, play games, wear a uniform, and even write exams.\" \"Enough!\" interrupted her grandfather. \"Stop dreaming, Chuskit. You know you cannot go to school.\"<br><br>(adapted from Chuskit Goes to School)"}, {"n": 6, "type": "text", "section": "Author's craft & structure", "stem": "What is the purpose of the text?", "options": ["to entertain", "to persuade", "to inform", "to instruct"], "passage": "<strong>Read the passage</strong><br><br>There is a forest near the city of Kaliningrad in Russia called the Dancing Forest. The name was given because of its trees, which are unusually twisted and look like they are dancing. It is possible to find twisted trees in areas with very strong wind, but in those areas the trees are usually all bent in the same direction. In the Dancing Forest, the trees are twisted in different ways and directions. There is no explanation why the trees look like they do. If wind were the explanation, one would expect to find broken trees, but there are none."}, {"n": 7, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the word \"vindictively\"?", "options": ["in a happy manner", "in a revengeful manner", "in an embarrassed manner", "in a depressed manner"], "passage": "<strong>Read the sentence</strong><br><br>Julie and I had a fight last year and I thought we could let it go, but today I saw her grin quite vindictively when I got a D on my math test."}, {"n": 8, "type": "text", "section": "Vocabulary in context", "stem": "\"Foal\" and \"horse\" are two words with a certain relationship between them. Which pair of words from the passage has the same relationship?", "options": ["hare - rabbit", "lamb - sheep", "stealing - scavenging", "fish - prey"], "passage": "<strong>Read the passage</strong><br><br>Contrary to its name, the bald eagle is not actually bald; \"bald\" once meant \"white-headed.\" Native to North America, the bald eagle is one of the largest birds on the continent. It is a predator and subsists mainly on fish, but also eats rabbits, hares, squirrels, raccoons, turtles, lambs, and sometimes even adult sheep. Although bald eagles can catch prey on their own, much of their food is obtained via stealing and scavenging."}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following is not mentioned in the passage?", "options": ["Phil Collins is a famous English musician.", "Brother Bear was the last Disney soundtrack that Collins composed.", "One song Collins composed won two awards.", "Phil Collins's native language is English."], "passage": "<strong>Read the passage</strong><br><br>Tarzan, the 1999 Disney animated film, had a rich soundtrack composed and recorded by Phil Collins, the famous English musician. Collins recorded the songs not only in his native English, but also in French, Italian, Spanish, and German. It was the first Disney soundtrack to be recorded in multiple languages by the same musician. One of the famous songs, \"You'll Be in My Heart,\" won both the Academy Award and the Golden Globe Award for Best Original Song. The success was so big that Collins wrote and composed the soundtrack for Disney's 2003 film Brother Bear."}, {"n": 10, "type": "text", "section": "Detail & inference", "stem": "Which of the following is most likely to happen in the future?", "options": ["Yuri Averbakh will become world champion in chess.", "Misha Osipov will become world champion in chess.", "Misha Osipov will lose in his next game against a chess grandmaster.", "Misha Osipov will win in his next game against Karpov."], "passage": "<strong>Read the passage</strong><br><br>Mikhail (Misha) Osipov, a young Russian chess star, is only four years old, and he has already beaten Yuri Averbakh, the world's oldest chess grandmaster. In 2016, Misha appeared on a television show where he played fast chess against Anatoly Karpov, considered one of the greatest players of all time. Misha, only three, played well at first but lost his concentration and eventually lost. In August 2017, Misha played against 95-year-old Yuri Averbakh, who made a grave mistake, and young Misha won."}, {"n": 11, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct, according to the passage?", "options": ["A full circle rainbow might be seen from an airplane.", "Cloud iridescence occurs only at sunrise or sunset.", "A red rainbow occurs when the longer rays of light are scattered.", "The phenomenon of two rainbows is very rare."], "passage": "<strong>Read the passage</strong><br><br>The light we see contains all colors, but when they blend, we see the light as white. When sunlight strikes a raindrop at a certain angle, it separates into the colors of the rainbow. Sometimes variations occur: two rainbows might be seen at once, one above the other. A rainbow might form a full circle instead of the normal arc; a full circle rainbow is typically only seen from a high viewpoint. When the sky is cloudy and the clouds are thin, cloud iridescence can occur. A rare variation is a red rainbow, which only occurs at sunrise or sunset, when the shorter blue, green, and yellow rays are scattered, leaving primarily red."}, {"n": 12, "type": "text", "section": "Text structure", "stem": "What is the correct chronological sequence of events?", "options": ["Tetris was released; Tetris came bundled with every Game Boy; The Tetris Company was founded; Tetris was announced as the best-selling video game of all time.", "Tetris was announced as the best-selling video game of all time; Tetris was released; Tetris came bundled with every Game Boy; The Tetris Company was founded.", "The Tetris Company was founded; Tetris was released; Tetris came bundled with every Game Boy; Tetris was announced as the best-selling video game of all time.", "The Tetris Company was founded; Tetris was released; Tetris was announced as the best-selling video game of all time; Tetris came bundled with every Game Boy."], "passage": "<strong>Read the passage</strong><br><br>The popular video game Tetris, announced in 2010 as the best-selling video game of all time, was released in 1984 in Moscow, Russia, by Russian designer Alexey Pajitnov. By 1989, it was bundled with every Game Boy. In 1996, the rights to the game reverted to Pajitnov, and The Tetris Company was founded."}, {"n": 13, "type": "text", "section": "Detail & inference", "stem": "Which of the following is definitely correct?", "options": ["It was a good idea to go outside to get the groceries.", "Lynn did not know her mother had gone grocery shopping.", "Lynn had no way to know her mother had gone grocery shopping.", "Lynn's mother did not usually ask Lynn to go grocery shopping."], "passage": "<strong>Read the passage</strong><br><br>It was pouring rain when Lynn suddenly realized she had forgotten to buy the groceries her mother had asked for; her mother would be furious! Without thinking, Lynn ran outside and immediately got soaked, but she was determined to get the groceries as she had promised. When her mother came home two hours later, Lynn was sitting wrapped in a blanket with her teeth chattering. \"Why didn't you answer your phone, Lynn?\" her mother asked. \"I tried to tell you I had some extra time this morning and I already got all the groceries.\""}, {"n": 14, "type": "text", "section": "Vocabulary in context", "stem": "What does the phrase \"a roller coaster of emotions\" mean?", "options": ["the name of a ride in theme parks", "extreme mood swings", "challenging sports exercises", "being very nervous"], "passage": "<strong>Read the passage</strong><br><br>My parents recently moved to Chicago, and it was my first day in a new school. My heart was thumping furiously as I entered the unfamiliar building. One moment, I felt calm and optimistic, and the next, I felt like I was about to faint with nerves. I tried to hope for the best, but it felt like my stomach was doing somersaults. Through the roller coaster of emotions inside me, I entered the classroom. A girl my age came in and said, \"Hi, what's your name?\" We talked until the bell rang, and I couldn't wipe the smile off my face. I had made a friend!"}, {"n": 15, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words means \"to make comprehensible\"?", "options": ["clarify", "clarity", "clarification", "clearly"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
