<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Reading (Level 2): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Reading (Level 2): Drill 2</div>
  <h2>MAP Grade 5 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 2): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Reading (Level 2): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-READ-L2-D2";
const BANK_PATH = "map-tests/grade-5/reading/level-2/drill-2/bank.csv";
const TITLE = "MAP Grade 5 Reading (Level 2): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Main idea & theme", "stem": "Which of the following is the main idea of the passage?", "options": ["Chinese can be a difficult language to learn because it is a tonal language, but it is still worth learning.", "Chinese is a fascinating language.", "Learning Chinese might be difficult for an English speaker because of how different the two languages are, but it is still worth learning.", "Chinese is a useful language - about 1.2 billion people speak it."], "passage": "<strong>Read the passage</strong><br><br>Why is it often said that Chinese is a difficult language to learn if your first language is English? There are several reasons. First, Chinese writing does not use letters; it uses characters, and there are over 80,000 Chinese characters, though only 3,500 are used in Standard Chinese. Another difference is that Chinese is a tonal language, which means it uses tones to differentiate between words that would otherwise sound the same. This information should in no way prevent you from learning Chinese. It is a beautiful language and a useful one—about 1.2 billion people speak it—and despite the differences from English, it is possible to master."}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "What is the main conflict in the story?", "options": ["Carmen teasing Corinna about her jeans and shoes and not inviting her to her parties", "Corinna having a lot of work to do", "Carmen's parents leaving her in charge of her sisters despite her incompetency", "Corinna having to decide whether or not to help Carmen"], "passage": "<strong>Read the passage</strong><br><br>Corinna was riding her bike, thinking of her science test the next day, which she had barely studied for. Suddenly she heard someone scream from a nearby house, and Carmen—a girl in her grade whom she greatly disliked, who had teased her and never invited her to parties—came running out. \"Corinna, can you please help me? My little sisters are crying and I don't know what to do. My parents left me in charge... please?\" Corinna sighed, but something in Carmen's eyes made her unable to say no. She thought for a moment, then followed Carmen and calmed the little girls down. She left three hours later with Carmen thanking her repeatedly."}, {"n": 3, "type": "text", "section": "Author's craft & structure", "stem": "What is the author's viewpoint on babies?", "options": ["The writer thinks babies are boring.", "The writer thinks babies mainly cry and sleep.", "The writer thinks babies are fascinating.", "The writer thinks babies have accents when they cry."], "passage": "<strong>Read the passage</strong><br><br>Many people think babies' bodies are incapable of doing anything except crying and sleeping, but nothing could be farther from the truth! Babies are born with a set of skills and knowledge. A newborn can recognize his or her mother's voice at birth. Babies also recognize the music their mother heard when they were in the womb. They breathe 40 times a minute, and unlike adults, they can breathe and swallow simultaneously. But the most amazing fact is that newborns have accents when they cry: French babies wail on a rising melody, while German babies cry with a falling melody."}, {"n": 4, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words can replace \"gone down drastically\"?", "options": ["plummeted", "surfaced", "elevated", "vanished"], "passage": "<strong>Read the paragraph</strong><br><br>Last night, I was watching the news, and the anchorwoman said that since the number of deer in our area has gone down drastically, deer hunting has been temporarily banned. I hope their number will go back up soon."}, {"n": 5, "type": "text", "section": "Detail & inference", "stem": "Which of the following events is the most likely, according to the story?", "options": ["Penelope went back to playing tic-tac-toe during Mrs. Altman's story.", "Mrs. Altman's story was about aliens.", "The children were all disappointed when Mrs. Jenkins returned the next day.", "Mrs. Altman taught the class more than any teacher had done before her."], "passage": "<strong>Read the passage</strong><br><br>Penelope burst into the classroom. \"Mrs. Jenkins is sick! We've got a substitute teacher today!\" The children were excited, but the substitute looked different from past ones, and the children fell silent. \"My name is Mrs. Altman. Today, we will work on decimals.\" It was just like a normal lesson, and Penelope, disappointed the substitute was strict, played tic-tac-toe quietly. After half an hour, Mrs. Altman smiled and offered to tell a story. Penelope stopped playing to listen. The children all listened intently, holding their breath. No one even left when the bell rang. Strict Mrs. Altman's lesson turned out to be the most interesting lesson they had had all year."}, {"n": 6, "type": "text", "section": "Text structure", "stem": "What is the purpose of the bold print in some phrases in the text?", "options": ["emphasizing the important events", "introducing new vocabulary", "emphasizing the theories regarding the origin of the zebra", "emphasizing the main points"], "passage": "<strong>Read the passage</strong><br><br>Why do zebras have stripes? Surprisingly, the answer is still unclear. There are several theories, but none is very convincing on its own. It has long been believed that the stripes help the zebra camouflage; however, zebras are easily spotted and never hide. Another theory says the stripes confuse predators by creating a motion dazzle; however, lions catch zebras easily. Other researchers suggest the stripes help zebras recognize each other, but there is no evidence. Another theory suggests the stripes help zebras cool in hot weather. Some researchers believe the stripes repel flies. It is possible a combination of these theories caused the stripes. There is no clear answer yet."}, {"n": 7, "type": "text", "section": "Author's craft & structure", "stem": "Click on all the characteristics of a myth.", "options": ["contains non-human characters", "consists of events that are seemingly historical", "records a true event", "ends with a clearly laid out moral"]}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "How long did it take for the sandwich to become popular?", "options": ["less than 2 years", "less than 40 years", "about 100 years", "about 200 years"], "passage": "<strong>Read the passage</strong><br><br>Stories have it that, in 1762, John Montagu, fourth Earl of Sandwich, was hungry during a card game and instructed his cook to prepare food he could eat with one hand. Literary references to sandwiches first appeared in England in the 1760s. At first they were only restaurant fare in England, and in America they were seen as a British trend cooks did not want to imitate. However, toward the end of the 1700s, the sandwich became a popular supper food for late night balls, and recipes appeared in cookbooks. In the 1800s, the sandwich became a regular part of evening suppers and picnics."}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following emotions can be attributed to Mrs. Rogers?", "options": ["disdain", "displeasure", "gratefulness", "pity"], "passage": "<strong>Read the passage</strong><br><br>Brandon had worked as a clown at children's birthday parties for two months when one of his parties went very wrong: balloons exploded in the children's faces, two children got their fingers stuck in a treasure chest, and one pricked his finger on a pin. Too many children were crying and the party was over. Mrs. Rogers, the birthday boy's mother, said, \"I've enjoyed your previous parties, Brandon, and that is why I asked you. However, I wish you had been more well-prepared this time. Next time you should make sure everything is working before the party.\" She paid Brandon and saw him out, and Brandon went home with a heavy heart."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "What does December symbolize in the poem?", "options": ["regret", "death", "soul", "freedom"], "passage": "<strong>Read the poem</strong><br><br>Once upon a midnight dreary, while I pondered, weak and weary,<br>Over many a quaint and curious volume of forgotten lore—<br>While I nodded, nearly napping, suddenly there came a tapping,<br>As of some one gently rapping, rapping at my chamber door.<br><br>Ah, distinctly I remember it was in the bleak December;<br>And each separate dying ember wrought its ghost upon the floor.<br>Eagerly I wished the morrow;—vainly I had sought to borrow<br>From my books surcease of sorrow—sorrow for the lost Lenore—<br>For the rare and radiant maiden whom the angels name Lenore—<br>Nameless here for evermore.<br><br>(from \"The Raven\" by Edgar Allan Poe)"}, {"n": 11, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the prefix \"en-\"?", "options": ["to force", "to be loved", "to cause", "to think"], "passage": "<strong>Read the sentence</strong><br><br>Princess Diana was a social activist who worked tirelessly for underprivileged people. She raised awareness of diseases, visited hospitals, and organized fundraisers. These actions endeared her in the eyes of her people, and when she passed away, it was said that no one could fill her shoes."}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "The passage is an example of which type of text?", "options": ["biography", "memoir", "fiction", "book review"], "passage": "<strong>Read the passage</strong><br><br>Holes, by Louis Sachar, is about a boy named Stanley Yelnats, who gets sent to Camp Green Lake as a punishment for a crime he did not commit. At camp, the boys must dig big holes every day. He makes a friend at camp, but his friend runs away and Stanley must decide whether to look for him. It is a beautiful story, full of plot twists and clever jokes, and it is so captivating that you will likely finish it in one read. I couldn't put it down. I especially liked the song Stanley's mother used to sing and the flashbacks to his great-great-grandfather's life story."}, {"n": 13, "type": "text", "section": "Detail & inference", "stem": "Why did Rowling not sign her full name on the Harry Potter books?", "options": ["because she wanted to become a billionaire", "because her publisher thought it was important to donate a lot of money to charity", "because she had a low self-esteem at the time", "because her publisher thought the book would be less successful if she did"], "passage": "<strong>Read the passage</strong><br><br>English author J. K. Rowling's life is a rags-to-riches story. Her mother was ill for many years and passed away when Rowling was twenty-five. She moved to Portugal, married, and gave birth to a daughter, but had to leave her husband and return to the UK. She started writing Harry Potter while unemployed and living in a small apartment. When she finished Harry Potter and the Sorcerer's Stone, several publishers rejected it. At last, Bloomsbury agreed to publish it, requesting that she use her initials in her pen name, because the publisher believed female authors' names were less appealing to young boys. Once published, the books became an instant success, and Rowling became a self-made billionaire."}, {"n": 14, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the word \"exploit\" as used in the paragraph?", "options": ["trick people by pretending to be someone else", "showing one's true face", "confronting someone", "gain an advantage by doing something unfair"], "passage": "<strong>Read the paragraph</strong><br><br>Lorcan might seem like a nice man, but I know better. He is in fact extremely manipulative and will not hesitate to exploit anyone if he can achieve something out of it. For instance, one of his workers, Ellen, came up with a wonderful idea for a campaign, and Lorcan took her idea and presented it as his own in the next board meeting."}, {"n": 15, "type": "text", "section": "Author's craft & structure", "stem": "What is the author's viewpoint?", "options": ["A strong hero makes a movie.", "Animated movies with water that looks real are good.", "Moana is one of the best films Disney has ever made.", "It is a good idea to have more movies with strong heroines."], "passage": "<strong>Read the passage</strong><br><br>My friend Sophie came over to play video games. When we finished, Sophie got a text and I asked what the song was. \"'You're Welcome', from Moana,\" she replied. \"I watched it too!\" I interrupted. \"I loved that movie! I loved how the water looked so real.\" \"But what I really loved,\" I continued, \"was Moana's character. She's the daughter of the village chief and will be the chief after him. She's so independent and strong, and no one questions that she can rule on her own.\" \"You're right,\" said Sophie. \"And in most films, the girl is saved by the boy, but Moana saves the day herself.\" \"It's very refreshing to see a heroine like Moana,\" I agreed."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
