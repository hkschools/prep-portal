<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Language Usage (Level 3): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Language Usage (Level 3): Drill 1</div>
  <h2>MAP Grade 5 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Language Usage (Level 3): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Language Usage (Level 3): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-LANG-L3-D1";
const BANK_PATH = "map-tests/grade-5/language-usage/level-3/drill-1/bank.csv";
const TITLE = "MAP Grade 5 Language Usage (Level 3): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Composition & writing", "stem": "You are asked to write a paper that describes two of the largest land animals in our planet, the African elephant and the hippopotamus. Which method of organization would be the most effective in writing this paper?", "options": ["sequence", "cause and effect", "problem and solution", "comparison-contrast"]}, {"n": 2, "type": "text", "section": "Grammar: usage", "stem": "Which sentence is not grammatically correct?", "options": ["They lie on their bed and watched a comedy show yesterday.", "He lay on his back and did sit-ups at the local gym.", "I had lain on the sofa all morning until the phone rang.", "I saw that the mechanic was lying on his back and fixing my father's car."]}, {"n": 3, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["That explanation as I have said before, is not sufficient.", "The experiment, which was performed by the teacher, was successful.", "My brother who has black hair and green eyes is taller than me.", "You should, nevertheless continue training despite this recent disappointment."]}, {"n": 4, "type": "text", "section": "Word choice & vocabulary", "stem": "Read the poem ELETELEPHONY by Laura Elizabeth Richards. Which of the following words shows an onomatopoeia?", "options": ["telephant", "trunk", "buzzed", "elephop"], "passage": "<strong>Read the poem.</strong><br><br>ELETELEPHONY by Laura Elizabeth Richards<br><br>Once there was an elephant, / Who tried to use the telephant— / No! No! I mean an elephone / Who tried to use the telephone— / (Dear me! I am not certain quite / That even now I've got it right.) / Howe'er it was, he got his trunk / Entangled in the telephunk; / The more he tried to get it free, / The louder buzzed the telephee— / (I fear I'd better drop the song / Of elephop and telephong!)"}, {"n": 5, "type": "text", "section": "Sentence structure", "stem": "After the Great Fire in 1666 destroyed London, the capital city of England, architect Sir Christopher Wren led the process of rebuilding the city. What is the main clause in this sentence?", "options": ["After the Great Fire in 1666 destroyed London", "the capital city of England", "architect Sir Christopher Wren led the process of rebuilding the city", "led the process of rebuilding the city"]}, {"n": 6, "type": "text", "section": "Spelling", "stem": "In which of the sentences is the underlined word spelled correctly?", "options": ["My grandma has two very old pianoes in her house.", "I like to read poems from poetry anthologys before I go to bed.", "The last mammothes were extinct over ten thousand years ago.", "There are several kindergartens in my neighborhood."]}, {"n": 7, "type": "text", "section": "Composition & writing", "stem": "Which is the best thesis for a persuasive essay on the first time people landed on the moon?", "options": ["The moon landing is an event known by everyone in the United States.", "The moon landing was part of NASA's Apollo program.", "The moon landing is an achievement that humanity would have certainly reached at some point in one way or another.", "A famous sentence said by Neil Armstrong during the landing was, \"That's one small step for a man, one giant leap for mankind.\""]}, {"n": 8, "type": "text", "section": "Grammar: parts of speech", "stem": "The two of you are going to spend long hours on the bus, so I recommend you prepare ___ and get some food beforehand. Which word correctly completes the sentence?", "options": ["ourselves", "yourself", "itself", "yourselves"]}, {"n": 9, "type": "text", "section": "Capitalization", "stem": "Proofread Charlie's paragraph. Which one of the underlined words in the text should be capitalized?", "options": ["northwest", "northwestern", "west", "southeast"], "passage": "<strong>Proofread Charlie's paragraph.</strong><br><br>I have a friend who lives in the Pacific northwest, which is a geographical region in the northwestern part of the United States. What determines the boundary of this region is the Pacific Ocean to the west. This is a beautiful area, abundant with glaciers, high mountains, and wild shores. A main point of interest is Crater Lake National Park, which is located about 200 miles southeast of Portland, one of the biggest cities in this region."}, {"n": 10, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is grammatically correct and uses parallel structure?", "options": ["Jerry likes to play baseball, to play the guitar, and swimming.", "Tom will help us prepare lunch, arrange the table, and might help us with the dishes.", "In my living room, you can find the following: a sofa, a television, and a table.", "Don't forget to shut down the computer and locking the door after you leave."]}, {"n": 11, "type": "text", "section": "Punctuation", "stem": "The Wright brothers, Orville and Wilbur, are generally known for their success in building and flying the first airplane in the history of the world. Their first flight took place in 1903 in the state of North Carolina. Choose the answer choice that correctly uses the ellipsis:", "options": ["...Their first flight... North Carolina.", "The Wright brothers, Orville and Wilbur, are generally known for their success... Their first flight took place in 1903 in the state of North Carolina.", "The Wright brothers, Orville and Wilbur ... Their first flight took place in 1903 in the state of North Carolina.", "The Wright brothers... are generally known for their success in building and flying the first airplane in the history of the world. Their first flight took place in 1903 in the state of North Carolina."]}, {"n": 12, "type": "text", "section": "Composition & writing", "stem": "Read the text about the Rock of Gibraltar. Where would you expect this text to be shown?", "options": ["An advertisement for vacation in Gibraltar", "A research paper about tourism in Gibraltar", "A diary describing the experience of a tourist who visited Gibraltar", "An adventure book whose plot takes place during a vacation in Gibraltar"], "passage": "<strong>Read the text.</strong><br><br>The Rock of Gibraltar is a 426-meter high mountain located south of Spain, in between Europe and Africa. Although located far from Britain, this is a British territory and is a Crown property. The Rock of Gibraltar is a famous tourist spot, and tourism serves as the main income source for the government of Gibraltar. For example, in 2011, over 11 million tourists visited Gibraltar. Most of the visitors arrive in Gibraltar from neighboring Spain, and usually spend only a night or two there. The busiest month with the largest number of visitors is August."}, {"n": 13, "type": "text", "section": "Grammar: parts of speech", "stem": "Our neighbors really tried to help us yesterday with the school assignment ___ got, when ___ brought us books about the history of the world. Choose the words that correctly complete the sentence.", "options": ["we, he", "I, they", "we, they", "they, she"]}, {"n": 14, "type": "text", "section": "Capitalization", "stem": "I met aunt Marie yesterday. She gave me a usb stick with photos from her honeymoon in the Caribbean region. Which words should be capitalized?", "options": ["honeymoon, region", "aunt, region", "aunt, usb", "usb, stick"]}, {"n": 15, "type": "text", "section": "Composition & writing", "stem": "You are asked to write a paper that describes events. (Reflexive/organization item.) Which method of organization is most effective?", "options": ["sequence", "cause and effect", "problem and solution", "comparison-contrast"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
