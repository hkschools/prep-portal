<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Language Usage: Full-Length Practice Test</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Language Usage: Full-Length Practice Test</div>
  <h2>MAP Grade 5 Language Usage</h2>
  <p class="muted">52 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>

  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Language Usage: Full-Length Practice Test</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Language Usage: Full-Length Practice Test</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-LANG-FULL";
const BANK_PATH = "map-tests/grade-5/language-usage/full-length/bank.csv";
const TITLE = "MAP Grade 5 Language Usage: Full-Length Practice Test";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Composition & writing", "stem": "If you were asked to write a story about a personal experience you had in your life, the best point of view to use would be:", "options": ["Second person", "Third person", "First person", "Third person omniscient"]}, {"n": 2, "type": "text", "section": "Grammar: usage", "stem": "Which of the sentences is not grammatically correct?", "options": ["Kareem had already gone out when I arrived.", "He has saw that movie twenty times.", "Someone has eaten my cupcake.", "I had worn this watch for many years before it was lost."]}, {"n": 3, "type": "text", "section": "Capitalization", "stem": "Read the sentences. Which word should begin with a capital letter?", "options": ["myrtle", "finnish", "puppy", "spitz"], "passage": "<strong>Read the sentences.</strong><br><br>My new puppy, a finnish spitz, is very energetic and causes a lot of mess in my garden. It ruined one of the myrtle shrubs I planted just last week."}, {"n": 4, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. Which transitional words and phrases are found in the paragraph?", "options": ["yesterday, as well, consequently, nevertheless", "not to mention, consequently, nevertheless, after", "not to mention, as well, at all, after", "yesterday, that, consequently, so"], "passage": "<strong>Read the paragraph.</strong><br><br>Yesterday was my birthday party. I wasn't expecting so many people to arrive, not to mention that some people I didn't invite at all came as well. Consequently, we ran out of food and snacks. Nevertheless, everyone had great fun. After they all had left, my friend helped me clean the place."}, {"n": 5, "type": "text", "section": "Grammar: usage", "stem": "Read the paragraph. Which of the sentences are written in active voice?", "options": ["(1), (2), (4)", "(1), (3), (4)", "(2), (4), (5)", "(2), (3), (5)"], "passage": "<strong>Read the paragraph.</strong><br><br>(1) Adriana has found an old recipe for a cake in the basement. (2) The recipe was written by her grandmother many years ago. (3) Adriana stayed in her grandmother's house during school vacations and holidays. (4) She enjoyed watching her grandmother cook. (5) Her grandmother was taught cooking by one of the greatest chefs in the US."}, {"n": 6, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["\"My favorite fairy tale is \"The Adventures of Pinocchio,\" said Matt.", "\"Alex told me, 'Our training is on Sunday this week,'\" said Manuel.", "\"Her friends sang \"Happy Birthday' to Emma,\" told Christina.", "\"The coach always tells us, \"The best defense is offence,\" said Garry."]}, {"n": 7, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the sentences is the most appropriate to convey imagery?", "options": ["He closed the door silently so he wouldn't wake her up.", "She felt very sad when she came home and saw her fish was missing.", "Kuwait City is one of the hottest cities in the world.", "His face blossomed when his classmate flattered him."]}, {"n": 8, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a run-on sentence?", "options": ["I baked a cake yesterday. It was delicious.", "I ate a lollipop it was sweet and tasty.", "We went to the park and played soccer.", "I turned on the air conditioner, so it was cool."]}, {"n": 9, "type": "text", "section": "Punctuation", "stem": "The famous singer lives at 743 Morgan Rd, which is a very wide and busy street. Which of the following punctuation marks is missing from this sentence?", "options": ["a period", "a comma", "a colon", "a semicolon"]}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which of the following characteristics describes fictional writing?", "options": ["It deals with concrete facts about real people or events.", "The expression of feelings in the writing is given using distinctive style and rhythm.", "It gives basic instructions and directions for doing or making something.", "It deals with imaginary characters and does not describe real people."]}, {"n": 11, "type": "text", "section": "Grammar: parts of speech", "stem": "Despite being very tired, my friends and I visited the new exhibition in the art museum. The exhibition included some paintings drawn by a famous Italian artist. Which of the following is an active verb?", "options": ["drawn", "tired", "visited", "famous"]}, {"n": 12, "type": "text", "section": "Spelling", "stem": "Which of the words is spelled incorrectly?", "options": ["sluggish", "industrios", "reliable", "guardian"]}, {"n": 13, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences uses alliteration?", "options": ["Liz has found a new way to get to school.", "Kelly claims her clothes are clean.", "My tap does not stop leaking.", "The bright balloon bounced by."]}, {"n": 14, "type": "text", "section": "Word choice & vocabulary", "stem": "Today the stuff in my room is well organized, as opposed to past times when ___ was left in a complete mess. Complete the sentence.", "options": ["many", "nothing", "few", "everything"]}, {"n": 15, "type": "text", "section": "Punctuation", "stem": "Choose the sentence that is correctly punctuated.", "options": ["\"What a pleasant surprise,\" shouted Jade.", "\"How big this city is!\" called Josh.", "\"What is your current job!\" asked Mya.", "\"How generous of you.\" exclaimed Bruce."]}, {"n": 16, "type": "text", "section": "Composition & writing", "stem": "You are writing an advertisement for a pair of running shoes you want to sell, designed specifically for long-distance runs and professional runners. Who is the audience this advertisement should be written for?", "options": ["Short-distance runners", "People who want to sell shoes", "Professional runners", "People who look for shoes under $100"]}, {"n": 17, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a compound sentence?", "options": ["Dana and Ron walk to school together every day.", "The audience applauded and cheered the players.", "It was hot yesterday, so I wore short pants and a t-shirt.", "During the production of the film, there was a snowstorm."]}, {"n": 18, "type": "text", "section": "Capitalization", "stem": "In which of these sentences is the name of the governmental department capitalized correctly?", "options": ["This project is run by the Department of Justice.", "I will work in the United States department of agriculture.", "It is a Governmental department dedicated to education.", "The office of peace Affairs has sent out a message."]}, {"n": 19, "type": "text", "section": "Composition & writing", "stem": "Which of the following is an example of narrative writing?", "options": ["Biography", "Play", "Poem", "Recipe"]}, {"n": 20, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the paragraph. Which of the nouns in the paragraph can be classified as abstract?", "options": ["childhood, parents, imagination", "book, reading, knowledge", "childhood, knowledge, imagination", "book, parents, reading"], "passage": "<strong>Read the paragraph.</strong><br><br>During my childhood, I really enjoyed reading books. My parents bought me my first book when I was eight years old. Reading can be very beneficial for you. It can expand your knowledge and help you develop a rich imagination."}, {"n": 21, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["On July 1, 1991, my parents visited the White House.", "The meeting is scheduled for Tuesday, May 15 at 7 p.m.", "Her flight should arrive on September 3 if there are no delays.", "November 19, 1863 is an important date in U.S. history."]}, {"n": 22, "type": "text", "section": "Composition & writing", "stem": "Read the following topics: Gymnastics, Track and Field, Team Games, Physical Education, Coordination. Which would be the main topic in an outline?", "options": ["Gymnastics", "Track and Field", "Coordination", "Physical Education"]}, {"n": 23, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["The herd follows its leader to the nearest watering hole.", "The pack of brownies were empty when I opened it.", "The team usually eat in a restaurant after winning a game.", "The school present an exhibition of students' paintings."]}, {"n": 24, "type": "text", "section": "Spelling", "stem": "Which is the correct spelling for more than one monarch?", "options": ["monarchs", "monarches", "monarchses", "monarchies"]}, {"n": 25, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. Which pattern of organization is used in this writing sample?", "options": ["compare and contrast", "order of importance", "cause and effect", "sequence"], "passage": "<strong>Read the paragraph.</strong><br><br>How do you become a scientist? You should start by completing your school studies. Then, you can think about the field that interests you the most. Once you make a decision regarding your favorite field of study, you need to either go to college or university in order to learn this field of study thoroughly."}, {"n": 26, "type": "text", "section": "Grammar: usage", "stem": "Which of the following is grammatically correct?", "options": ["The pizza with pepperoni you ordered yesterday were great.", "The best time for buying electronic devices is now.", "The jar that contains all the cookies I made have disappeared.", "The bookcase with all my books are in my old room."]}, {"n": 27, "type": "text", "section": "Capitalization", "stem": "Click on all the titles of songs that are correctly capitalized.", "options": ["\"Down by the station\"", "\"In A Cottage In A Wood\"", "\"The duck Song\"", "\"Shake Your Sillies Out\""]}, {"n": 28, "type": "text", "section": "Composition & writing", "stem": "Louis decided to write a biography on the life of George Washington. What is the best way to represent the data he collected?", "options": ["a timeline", "a line graph", "a pie chart", "a pictograph"]}, {"n": 29, "type": "text", "section": "Grammar: usage", "stem": "The choir ___ finished the preparations for the ceremony by next Monday. Read the sentence and complete it with the correct verb or helping verb:", "options": ["will", "has", "was", "will have"]}, {"n": 30, "type": "text", "section": "Spelling", "stem": "What is the correct spelling for more than one wolf?", "options": ["Wolfs", "Wolvs", "Wolves", "Wolfes"]}, {"n": 31, "type": "text", "section": "Composition & writing", "stem": "You want to write a short paragraph that would allow the reader to have a taste of the sunset you watched yesterday. Choose the most suitable paragraph for this purpose.", "options": ["To watch the sunset, you need to take precautions and do not look directly at the sun. Put on your sunglasses, and only when the sun starts disappearing can you look in its direction.", "Watching the sunset was a great experience. I really recommend everyone take a few minutes every day to look at it!", "Yesterday, my father and I went together to the beach to watch the sunset. We stood and watched the sun going down. After the sun disappeared, we took a taxi back home.", "When the sun was getting closer to the water, it became red like a huge grapefruit hanging in the sky, and the clouds around it looked like they were on fire."]}, {"n": 32, "type": "text", "section": "Sentence structure", "stem": "If he ever gets a chance, Justin would like to visit his cousin who lives in New Zealand. Which type of sentence is this?", "options": ["compound sentence", "incomplete sentence", "complex sentence", "simple sentence"]}, {"n": 33, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. What is the author's purpose in this paragraph?", "options": ["To inform", "To persuade", "To describe", "To entertain"], "passage": "<strong>Read the paragraph.</strong><br><br>Once upon a time, there was a squirrel that lived near a large and dense forest. The squirrel was running out of food, and to find more food he had to go deeper and deeper into the dark forest. He was afraid he would not find his way back home, but, luckily, he managed to come up with a wise idea. He would leave a trail of small stones while he was looking for food in the forest. Doing this, he managed to find his way back home safely."}, {"n": 34, "type": "text", "section": "Grammar: usage", "stem": "We ___ visit our classmate Bryan at his house tomorrow. He will wait for us in his garden. Which word is most likely missing from the sentence?", "options": ["will", "might", "could", "should"]}, {"n": 35, "type": "text", "section": "Punctuation", "stem": "Which of the sentences is punctuated correctly?", "options": ["Ladies and gentlemen may I have your attention, please?", "It was nice, to meet you Sir.", "Rachel can you bring me a glass of water?", "Thank you, Manuel, for your help yesterday."]}, {"n": 36, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following includes a metaphor?", "options": ["The police officer listened to her story with a poker face.", "My heart was beating fast as it was my turn to go on stage.", "It was freezing outside. My hands were as cold as ice.", "I was very surprised by her news as I was not expecting it."]}, {"n": 37, "type": "text", "section": "Sentence structure", "stem": "What is the complete predicate of the following sentence? The doctor in the neighborhood clinic is always friendly and welcoming.", "options": ["is always friendly and welcoming", "The doctor", "in the neighborhood clinic", "The doctor in the neighborhood clinic"]}, {"n": 38, "type": "text", "section": "Capitalization", "stem": "Which sentence is capitalized correctly?", "options": ["\"Did you know,\" asked the teacher, \"There are some fish that can live out of water?\"", "\"Please tell your sister,\" said the girl on the phone, \"sharon will be there at 7:00.\"", "\"Students,\" Mr. Hernandez instructed, \"please bring your history books tomorrow.\"", "\"this cake,\" Dana told her friend, \"is one of the best cakes I have ever tasted.\""]}, {"n": 39, "type": "text", "section": "Composition & writing", "stem": "Your teacher assigns the topic \"Advancements in the building of skyscrapers in the world\" for a research paper. Which statement best describes the content of the paper?", "options": ["History of concrete and steel", "Advances in modern elevators", "The tallest building in the world", "High urban density demands taller buildings"]}, {"n": 40, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a declarative sentence?", "options": ["Do you have any idea what caused the dinosaurs to disappear 65 million years ago?", "Basketball is one of the most interesting games in the world, isn't it?", "The Gulf Stream is a warm current in the Atlantic Ocean that originates at America's shores and ends up in Europe.", "What an excellent movie I watched yesterday! It is absolutely the best movie I've ever seen!"]}, {"n": 41, "type": "text", "section": "Punctuation", "stem": "Sleeping until late during holidays is to be honest the thing my brothers and I like the most. In order to correctly punctuate this sentence, where would you put a comma?", "options": ["after \"sleeping\"", "before and after \"to be honest\"", "after \"to be honest\"", "before and after \"my brothers and I\""]}, {"n": 42, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. What is the main idea of the paragraph?", "options": ["Chimpanzees and humans are part of the great ape family.", "Both humans and chimpanzees eat plants and meat.", "Chimpanzees and humans have great resemblance.", "Humans and chimpanzees share between 85% to 95% of the same DNA."], "passage": "<strong>Read the paragraph.</strong><br><br>Chimpanzees are part of the great ape family, just like humans. Chimpanzees are our closest living relatives, and it is estimated that humans and chimpanzees share between 85% to 95% of the same DNA. Chimpanzees have complex greetings and communications and they are omnivorous (eat plants and meat), like us. Both chimpanzees and humans can see in color and create and use tools to help them with daily challenges."}, {"n": 43, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["There is several new houses in my neighborhood.", "There has not been many competitors in the last competition.", "There was a problem with my new computer.", "There are a new student from Argentina in my class."]}, {"n": 44, "type": "text", "section": "Capitalization", "stem": "Choose the sentence that uses correct rules of capitalization.", "options": ["The student has been studying at Burlington high school for more than three years.", "My friend Emily volunteers every monday in the community center near her home.", "Ferdinand Hayden was an American scientist who convinced Congress to turn Yellowstone into a national park.", "Unfortunately, Panda bears are vulnerable animals. They mainly live in the southern area of China."]}, {"n": 45, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following answer choices includes a rhetorical question?", "options": ["Don't you want to stop suffering from stomachaches? Try our new medication - it will alleviate your pain within 30 minutes!", "What is your name? I'll check to see if you are already a member in our club.", "I have been looking for my friend in the last three hours. Is there a chance you have seen him?", "Tomorrow I am going to take the train and visit the small villages near my town. There are lots of things to see and do over there. Do you want to join me?"]}, {"n": 46, "type": "text", "section": "Word choice & vocabulary", "stem": "He doesn't really care which of the two chocolate bars you will pick; he will eat either of them. Which of the following sentences has the same meaning as the sentence above?", "options": ["He doesn't really care which of the two chocolate bars you will pick; he will eat the first or the second one.", "He doesn't really care which of the two chocolate bars you will pick; he will eat them both.", "He doesn't really care which of the two chocolate bars you will pick; he will eat neither of them.", "He doesn't really care which of the two chocolate bars you will pick; otherwise he will eat them."]}, {"n": 47, "type": "text", "section": "Capitalization", "stem": "Jake Robinson elementary has received many awards from the State board of education for its students' achievements in math and chemistry. Which words should be capitalized?", "options": ["elementary, math, chemistry", "elementary, board, education", "board, of, education", "education, math, chemistry"]}, {"n": 48, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. Which of the following sentences could be a strong concluding sentence for the paragraph?", "options": ["Lastly, there are also fewer than 600 Sumatran tigers remaining in the world.", "Therefore, the main factor in the continued decline of the Javan rhinoceros' population has been poaching for horns.", "These factors have left the Javan rhinoceros one of the rarest animals on the planet.", "The Javan rhino can live around 30-45 years in the wild."], "passage": "<strong>Read the paragraph.</strong><br><br>There are fewer than 60 Javan rhinoceros remaining in the world. There is only one known population of the Javan rhinoceros in the wild, located in the island of Java, Indonesia. Loss of habitats and trophy hunting for its horns are the main causes for the serious decline in its numbers."}, {"n": 49, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["The old house in my neighborhood is built 100 years ago.", "Take your shoes off; the house was cleaned yesterday.", "The new action movie were directed by Richard, my brother.", "The fence around the backyard painted green last week."]}, {"n": 50, "type": "text", "section": "Spelling", "stem": "Read the paragraph. Which three words in the paragraph are misspelled?", "options": ["evidence, kitchen, texture", "exicting, fosil, predetors", "kitchen, predetors, creature", "fosil, creature, exicting"], "passage": "<strong>Read the paragraph.</strong><br><br>The sea sponge is considered to be the longest-exicting creature in our planet. The oldest evidence of a sea sponge found was a fosil discovered in a 760-million-year-old rock. Its body texture looks similar to the texture of a kitchen sponge. Some types of sea sponges have been found to live over 200 years, as they have almost no predetors."}, {"n": 51, "type": "text", "section": "Composition & writing", "stem": "Read the passage. Which of the following is the best paraphrase for the above passage?", "options": ["Trips in the United States must include the Golden Gate Bridge. This is because this bridge is the tallest in the country and because it connects the city of San Francisco to Marin County.", "It is more than recommended to visit the Golden Gate Bridge when you travel to the United States, for its extraordinary dimensions and for being a main corridor of traffic between two main locations.", "Most of the trips to the United States include a visit to the Golden Gate Bridge, which is the tallest bridge in the U.S. and a main route connecting the city of San Francisco and Marin County.", "The Golden Gate Bridge is the most beautiful site in the United States which every tourist should visit. It is very tall and connects two main places."], "passage": "<strong>Read the passage.</strong><br><br>Any tour in the United States should include the Golden Gate Bridge, as it is the tallest bridge in the country. Another reason for visiting is its huge importance in connecting the city of San Francisco to Marin County."}, {"n": 52, "type": "text", "section": "Grammar: usage", "stem": "Which sentence shows clear pronoun-antecedent agreement?", "options": ["After I finished collecting the plates from the tables, my friend helped me to return them back to their place.", "After many preparations, Chris and Rick organized a tennis competition in their school.", "If somebody wants to save some money, you first need to think about how much you usually spend each day.", "Alexandra took her wallet out of the drawer and then emptied it completely."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
