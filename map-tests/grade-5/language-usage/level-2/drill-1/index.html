<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 5 Language Usage (Level 2): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 5 Language Usage (Level 2): Drill 1</div>
  <h2>MAP Grade 5 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 5 Language Usage (Level 2): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 5 Language Usage (Level 2): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G5-LANG-L2-D1";
const BANK_PATH = "map-tests/grade-5/language-usage/level-2/drill-1/bank.csv";
const TITLE = "MAP Grade 5 Language Usage (Level 2): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Composition & writing", "stem": "Read the sentences. This writing most likely would be found in:", "options": ["A research paper", "A book report", "A poem", "A diary"], "passage": "<strong>Read the sentences.</strong><br><br>Today there were track and field competitions in my school. I managed to advance to the finals in both 100-meter and 200-meter sprint races, but I didn't win any medals."}, {"n": 2, "type": "text", "section": "Sentence structure", "stem": "Which one of the following sentences is not an interrogative sentence?", "options": ["Can your brother let me use his guitar for a minute?", "We are going to the party in town later?", "Are the kids prepared for the upcoming exam?", "The president is about to give a speech to the nation in an hour, isn't he?"]}, {"n": 3, "type": "text", "section": "Punctuation", "stem": "Choose the sentence that is correctly punctuated:", "options": ["My parents went to the city market yesterday and bought some fruit, bananas, apples, watermelons, peaches, and oranges.", "I have visited five big capital cities in my life: London, Moscow, Copenhagen, Ankara, and New Delhi.", "My friend Bill has a lot of books from various genres, including: drama, comedy, action, and adventure.", "Next summer, my family plans to travel to: Arizona and Nevada."]}, {"n": 4, "type": "text", "section": "Composition & writing", "stem": "Which is the correct definition of \"plagiarism\"?", "options": ["The act of taking the work or the ideas of others and presenting them as if they were yours.", "The way in which a plague is spreading among people.", "The act of using the school's equipment without permission from the principal.", "The act of writing an academic assignment and submitting it on time."]}, {"n": 5, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the paragraph. Which of the words in the paragraph are conjunctions?", "options": ["to, not, although, on, and", "since, although, but, after, and", "since, not, but, on, to", "have, after, our, the, but"], "passage": "<strong>Read the paragraph.</strong><br><br>Yesterday, I went to a movie with my brother. We thought we would not make it on time since we could not find the keys to my car. Although we usually have the same taste in movies, this time I liked the movie, but my brother did not. After the movie was over, we went to our favorite diner and ordered two tasty smoothies."}, {"n": 6, "type": "text", "section": "Spelling", "stem": "In which sentence is the underlined word spelled correctly?", "options": ["There are high cliffes in the coasts of South Africa.", "My father and my grandfather were sheriffs.", "We all had experience with curfewes.", "He found two pairs of earmuffes on the street."]}, {"n": 7, "type": "text", "section": "Composition & writing", "stem": "Which of the following is a characteristic of descriptive writing?", "options": ["focuses on providing the readers with facts", "presents a conflict between two characters", "states the author's opinion regarding a certain issue", "appeals to the five senses and creates a vivid picture of a certain situation"]}, {"n": 8, "type": "text", "section": "Sentence structure", "stem": "Jacob reads about distant stars and galaxies in the library every day. He really enjoys it. Steph reads about distant stars and galaxies in the library every day. She enjoys it very much. What is the best way to combine these sentences into one sentence?", "options": ["Reading about distant galaxies and stars in the library every day is an activity both Jacob and Steph do and enjoy very much.", "Sitting in the library every day, Jacob and Steph read together about distant galaxies and stars and enjoy it very much.", "Jacob and Steph sit together in the library every day reading about galaxies.", "In the library, Jacob reads while Steph enjoys distant stars."]}, {"n": 9, "type": "text", "section": "Capitalization", "stem": "Which sentence is not capitalized correctly?", "options": ["There are over 2,000 languages spoken natively in Africa.", "It is one of the most diverse continents in terms of animal and plant life.", "The Sahara is the hottest desert on earth, and one of the driest.", "Africa hosts a large diversity of ethnicities, nationalities, and cultures."]}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. Which transition word or phrase best completes the paragraph?", "options": ["suddenly", "in fact", "otherwise", "as a result"], "passage": "<strong>Read the paragraph.</strong><br><br>David was in a rush this morning. He left his house at the last minute, hurrying to an important meeting. When he reached his car, David noticed he had a flat tire. In order to drive his car, he had to replace the tire. He wasted a lot of time replacing the tire, and, ___ , he was late for his meeting."}, {"n": 11, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is written in inverted order?", "options": ["African elephants usually drink almost 200 liters per day.", "Never will Steph watch this comedy movie again.", "Two notebooks have been left on my desk.", "Only he knows what his abilities are."]}, {"n": 12, "type": "text", "section": "Word choice & vocabulary", "stem": "In which of the sentences is the underlined word used correctly?", "options": ["I excepted his offer to buy the tickets.", "All the players accept for the goalie wore long-sleeved shirts.", "Except for Jonathan, nobody liked the new play.", "Camilla likes all colors accept purple."]}, {"n": 13, "type": "text", "section": "Word choice & vocabulary", "stem": "What does it mean when a poem has an end rhyme?", "options": ["that the poem does not have a rhyme pattern", "that the poem's rhymes appear at the end of its lines", "that there is only one rhyme at the end of the poem", "that the rhymes start towards the end of the poem"]}, {"n": 14, "type": "text", "section": "Word choice & vocabulary", "stem": "The weather next week is going to be much colder ___ this week. Choose the word that correctly completes the sentence.", "options": ["than", "then", "that", "thane"]}, {"n": 15, "type": "text", "section": "Punctuation", "stem": "Which sentence is incorrectly punctuated with a hyphen?", "options": ["You should read the user-friendly guide before using the software.", "I have only three favorite colors- black, blue, and grey.", "Two-thirds of the students in school arrive with the school bus.", "There are twenty-seven students in the classroom."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
