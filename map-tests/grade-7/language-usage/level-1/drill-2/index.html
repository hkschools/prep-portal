<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Language Usage (Level 1): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 1): Drill 2</div>
  <h2>MAP Grade 7 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 1): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 1): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-LANG-L1-D2";
const BANK_PATH = "map-tests/grade-7/language-usage/level-1/drill-2/bank.csv";
const TITLE = "MAP Grade 7 Language Usage (Level 1): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Punctuation", "stem": "Which of the following short story titles is punctuated correctly?", "options": ["\"The Necklace\"", "Everything that Rises Must Converge", "A Little Cloud", "Emerald Bay"]}, {"n": 2, "type": "text", "section": "Word choice & vocabulary", "stem": "Choose the word that best fills the blank.", "options": ["theyre", "they're", "their", "there"], "passage": "<strong>Read the sentence</strong><br><br>The artists have ___ paintings on display at the art gallery."}, {"n": 3, "type": "text", "section": "Grammar: parts of speech", "stem": "What is the direct object of the verb \"gave?\"", "options": ["friend", "coin", "her", "collection"], "passage": "<strong>Read the sentences</strong><br><br>Juan gave a new coin to his friend for her collection. The coin was special because of a printing error. Both sides of the coin looked the same."}, {"n": 4, "type": "text", "section": "Sentence structure", "stem": "What is the complete predicate of the sentence?", "options": ["Tuvan people", "are famous", "are famous for their singing", "are famous for their singing and wrestling"], "passage": "<strong>Read the sentence</strong><br><br>The Tuvan people are famous for their singing and wrestling."}, {"n": 5, "type": "text", "section": "Composition & writing", "stem": "During which step of the writing process is it most useful to create a graphic organizer?", "options": ["pre-writing", "publishing", "revising", "drafting"]}, {"n": 6, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following words shows an onomatopoeia?", "options": ["telephant", "trunk", "buzzed", "elephop"], "passage": "<strong>Read the poem</strong><br><br>ELETELEPHONY<br>by Laura Elizabeth Richards<br><br>Once there was an elephant, Who tried to use the telephant- No! No! I mean an elephone Who tried to use the telephone- (Dear me! I am not certain quite That even now I've got it right.) Howe'er it was, he got his trunk Entangled in the telephunk; The more he tried to get it free, The louder buzzed the telephee- (I fear I'd better drop the song Of elephop and telephong!)"}, {"n": 7, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences is not punctuated correctly?", "options": ["My pet hamster, Fuzzy, loves to play inside of a wheel.", "The jazz musician Louis Armstrong was known for his trumpet solos.", "Mercury, the planet closest to the sun is covered in craters.", "We learned how to dance the Mazurka, a Polish folk dance."]}, {"n": 8, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words from the sentences above is a comparative adjective?", "options": ["several", "between", "smaller", "external"], "passage": "<strong>Read the sentences</strong><br><br>There are several differences between seals and sea lions. For example, seals are usually smaller than sea lions and are also better swimmers. Seals don't have external ears, but sea lions do."}, {"n": 9, "type": "text", "section": "Sentence structure", "stem": "What is the simple subject of the sentence?", "options": ["Eduardo", "Beach", "Yasmine", "Tour"], "passage": "<strong>Read the sentence</strong><br><br>Though Eduardo prefers the beach, Yasmine would rather tour the mountains."}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which pattern of organization is used in this writing sample?", "options": ["compare and contrast", "order of importance", "cause and effect", "sequence"], "passage": "<strong>Read the paragraph</strong><br><br>How do you become a scientist? You should start by completing your school studies. Then, you can think about the field that interests you the most. Once you make a decision regarding your favorite field of study, you need to either go to college or university in order to learn this field of study thoroughly."}, {"n": 11, "type": "text", "section": "Spelling", "stem": "What is the correct spelling for more than one wolf?", "options": ["Wolfs", "Wolvs", "Wolves", "Wolfes"]}, {"n": 12, "type": "text", "section": "Word choice & vocabulary", "stem": "Which rhetorical device is underlined in the sentence?", "options": ["inversion", "simile", "metaphor", "hyperbole"], "passage": "<strong>Read the sentence</strong><br><br>Never have I forgotten about my mother's birthday."}, {"n": 13, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following answer choices includes a rhetorical question?", "options": ["Don't you want to stop suffering from stomachaches? Try our new medication - it will alleviate your pain within 30 minutes!", "What is your name? I'll check to see if you are already a member in our club.", "I have been looking for my friend in the last three hours. Is there a chance you have seen him?", "Tomorrow I am going to take the train and visit the small villages near my town. There are lots of things to see and do over there. Do you want to join me?"]}, {"n": 14, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a compound sentence?", "options": ["Dana and Ron walk to school together every day.", "The audience applauded and cheered the players.", "It was hot yesterday, so I wore short pants and a t-shirt.", "During the production of the film, there was a snowstorm."]}, {"n": 15, "type": "text", "section": "Grammar: usage", "stem": "Choose the words that correctly complete the sentence:", "options": ["had, sell", "has, sold", "had, sold", "has, sell"], "passage": "<strong>Read the sentence</strong><br><br>By the time Phil arrived at the office, the sandwich vendor ___ already ___ all his sandwiches."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
