<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Language Usage (Level 2): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 2): Drill 2</div>
  <h2>MAP Grade 7 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 2): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 2): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-LANG-L2-D2";
const BANK_PATH = "map-tests/grade-7/language-usage/level-2/drill-2/bank.csv";
const TITLE = "MAP Grade 7 Language Usage (Level 2): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a compound sentence?", "options": ["If John discovers where the lost treasure is, he will go to any lengths to find it.", "Let's go back to the restaurant where we had that wonderful meal last week.", "Although the acting was good, I couldn't enjoy the movie because it was too different from the book.", "Jake was sure he was going to be late for school, yet he arrived with plenty of time to spare."]}, {"n": 2, "type": "text", "section": "Punctuation", "stem": "Which of the following titles of a magazine is punctuated correctly?", "options": ["Automobile", "\"Bloomberg Businessweek\"", "Entertainment Weekly", "Time (underlined)"]}, {"n": 3, "type": "text", "section": "Spelling", "stem": "Which of the following words is the correct plural form of \"analysis\"?", "options": ["analyze", "analysiss", "analysisses", "analyses"]}, {"n": 4, "type": "text", "section": "Spelling", "stem": "In which sentence is the underlined word spelled correctly?", "options": ["Some drivers disobeyd the driving rules in the city.", "My father went on several journeyes to Japan.", "Chandler's dog is always obeying his orders.", "He works at a company that surveyes people's opinions."]}, {"n": 5, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words is a preposition?", "options": ["on", "thus", "quite", "low"]}, {"n": 6, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following options to complete the sentence creates a mysterious mood?", "options": ["she demanded impatiently, \"My brother is in there and he needs a doctor.\"", "she asked sadly, wondering if Mark would be able to fix the broken equipment.", "she asked in a low, trembling voice, as Mark stared back, bewildered.", "she asked, tapping her fingers on the chair. \"I need to get to the train station as soon as possible.\""], "passage": "<strong>Read the sentence.</strong><br><br>Maureen stared at Mark; \"Could you please help me?\" ___"}, {"n": 7, "type": "text", "section": "Sentence structure", "stem": "Which of the following is the simple predicate of the sentence?", "options": ["Everyone", "loves", "to watch", "perform"], "passage": "<strong>Read the sentence.</strong><br><br>Everyone loves to watch Eliza perform her favorite magic trick."}, {"n": 8, "type": "text", "section": "Grammar: usage", "stem": "Which of the underlined pronouns is used vaguely?", "options": ["her", "she", "they", "your"], "passage": "<strong>Read the sentences.</strong><br><br>Millie was invited to her friend Dawn's house. As she was about to leave her house, her dog, Shookshanks, came up to her and begged to go for a walk. Millie knew Shookshanks needed her walk and decided to take the dog along to Dawn's house. Why not? It would be so nice to play with her in the big back yard. She would really enjoy the sun. However, when they arrived at Dawn's house, Dawn gasped the moment she saw Shookshanks. \"You cannot bring your dog here! My cat Brabbers will be in mortal danger!\""}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Which of the following is an appropriate sentence in a passage about the nutrition of blue jays, directed at 3rd graders and meant to inform?", "options": ["Blue jays seek food on the ground and are chiefly vegetarian, although they have been known to eat eggs or nestlings of other birds.", "If you decide to feed blue jays in your backyard, remember to put mainly seeds, nuts, and acorns in your birdfeeder.", "Blue jays are noisy and aggressive and might attack other smaller birds, sleeping bats, and even large birds that threaten them.", "Although blue jays sometimes eat small animals such as caterpillars or beetles, they usually eat seeds and nuts."]}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "What does it mean when a poem has an end rhyme?", "options": ["that the poem does not have a rhyme pattern", "that the poem's rhymes appear at the end of its lines", "that there is only one rhyme at the end of the poem", "that the rhymes start towards the end of the poem"]}, {"n": 11, "type": "text", "section": "Grammar: parts of speech", "stem": "What is an interjection used for?", "options": ["to link words, phrases, or clauses together", "to express emotion", "to explain how an action is done", "to specify a relationship in time, space, or purpose"]}, {"n": 12, "type": "text", "section": "Sentence structure", "stem": "Which of the following is the best way to revise the sentence?", "options": ["The next issue is much anticipated, having read the article in question.", "I read the article in question, and I want the next issue to be much anticipated.", "Reading the article in question was much anticipated in the next issue.", "Having read the article in question, I very much anticipate the next issue."], "passage": "<strong>Read the following sentence.</strong><br><br>Having read the article in question, the next issue is much anticipated."}, {"n": 13, "type": "text", "section": "Punctuation", "stem": "Which of the following revisions of the passage is punctuated correctly?", "options": ["Born in 1846 Grace Neill's wish was to study medicine: her father disapproved, so she studied nursing instead, and became a paying probationer nurse...", "Born in 1846 Grace Neill's wish was to study medicine, her father disapproved, so she studied nursing instead, and became: a paying probationer nurse...", "Born in 1846, Grace Neill's wish was to study medicine; her father disapproved so she studied nursing instead, and became a paying probationer nurse... New Zealand was the first country to require nurses and midwives to have training and be registered.", "Born in 1846, Grace Neill's wish was to study medicine, her father disapproved, so she studied nursing instead, and became a paying probationer nurse... New Zealand was the first country to require nurses and midwives to have training and be registered."], "passage": "<strong>Read the passage.</strong><br><br>Born in 1846 Grace Neill's wish was to study medicine, her father disapproved, so she studied nursing instead, and became: a paying probationer nurse. Neill was the first female factory inspector in New Zealand, and later became an assistant inspector in charge of hospitals. She greatly influenced the health care practice in New Zealand. Thanks to her work, New Zealand was the first country to require nurses, and midwives to have training and be registered."}, {"n": 14, "type": "text", "section": "Composition & writing", "stem": "Which of the following would be the best concluding sentence to the paragraph?", "options": ["It is clear that Machu Picchu is the best example of the Inca's spectacular architecture.", "The Incas were polytheists and worshipped many gods; they also believed in reincarnation.", "These structures, like Machu Picchu, reflect the Inca's mastery of architecture.", "Not all was beautiful in the Inca civilization: in important events, the Incas used to abuse and kill people."], "passage": "<strong>Read the following paragraph.</strong><br><br>Built in the mid-15th century, Machu Picchu is the most famous icon of the Inca civilization and one of the most famous citadels in the world. The Incas used it as a royal estate, grew maize on its hundreds of man-made terraces, and worshipped their gods there. Machu Picchu was also connected to the Inca Road System, an extremely extensive and complex network of roads, planned, engineered and built by the Incas and used for long-distance trade. Many road systems nowadays may only hope to achieve this level of complexity. Incan engineers and architects also constructed many other structures that have survived to this day, and are still an example of unique work in many ways; for example, they knew how to cut stones to fit together tightly without mortar, which is used nowadays in construction as a bond."}, {"n": 15, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a run-on sentence?", "options": ["My elder sister Tina decided to purchase the sapphire ring she had wanted for a long time.", "I am going to the store later, I need to buy some milk.", "She finished the exam early but stayed behind to ask the teacher some questions.", "Due to inconclusive results, my research team had to restart the experiment."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
