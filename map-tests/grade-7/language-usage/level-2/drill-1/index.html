<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Language Usage (Level 2): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 2): Drill 1</div>
  <h2>MAP Grade 7 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 2): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 2): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-LANG-L2-D1";
const BANK_PATH = "map-tests/grade-7/language-usage/level-2/drill-1/bank.csv";
const TITLE = "MAP Grade 7 Language Usage (Level 2): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Composition & writing", "stem": "Which of the following is the best paraphrase for the above passage?", "options": ["Trips in the United States must include the Golden Gate Bridge. This is because this bridge is the tallest in the country and because it connects the city of San Francisco to Marin County.", "It is more than recommended to visit the Golden Gate Bridge when you travel to the United States, for its extraordinary dimensions and for being a main corridor of traffic between two main locations.", "Most of the trips to the United States include a visit to the Golden Gate Bridge, which is the tallest bridge in the U.S. and a main route connecting the city of San Francisco and Marin County.", "The Golden Gate Bridge is the most beautiful site in the United States which every tourist should visit. It is very tall and connects two main places."], "passage": "<strong>Read the passage.</strong><br><br>Any tour in the United States should include the Golden Gate Bridge, as it is the tallest bridge in the country. Another reason for visiting is its huge importance in connecting the city of San Francisco to Marin County."}, {"n": 2, "type": "text", "section": "Word choice & vocabulary", "stem": "In which of the sentences is the underlined word used correctly?", "options": ["I excepted his offer to buy the tickets.", "All the players accept for the goalie wore long-sleeved shirts.", "Except for Jonathan, nobody liked the new play.", "Camilla likes all colors accept purple."]}, {"n": 3, "type": "text", "section": "Composition & writing", "stem": "Which of the following types of passages would be best organized in a spatial order?", "options": ["a description of Eva's new room in her new house", "a timeline of Eva's morning schedule", "an examination of how Eva and her sister are similar and how they differ", "an explanation of the reasons Eva chose to attend a special art school"]}, {"n": 4, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["The old house in my neighborhood is built 100 years ago.", "Take your shoes off, the house was cleaned yesterday.", "The new action movie were directed by Richard, my brother.", "The fence around the backyard painted green last week."]}, {"n": 5, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is grammatically correct and uses parallel structure?", "options": ["Jerry likes to play baseball, to play the guitar, and swimming.", "Tom will help us prepare lunch, arrange the table, and might help us with the dishes.", "In my living room, you can find the following: a sofa, a television, and a table.", "Don't forget to shut down the computer and locking the door after you leave."]}, {"n": 6, "type": "text", "section": "Grammar: parts of speech", "stem": "What is the object of the word \"about\"?", "options": ["talked", "how", "train her new dog, which is not housebroken yet", "how to train her new dog, which is not housebroken yet"], "passage": "<strong>Read the sentence.</strong><br><br>When Mary came to visit me today, we drank a lot of chocolate milk and talked about how to train her new dog, which is not housebroken yet."}, {"n": 7, "type": "text", "section": "Capitalization", "stem": "Choose the sentence that uses correct rules of capitalization.", "options": ["The student has been studying at Burlington high school for more than three years.", "My friend Emily volunteers every monday in the community center near her home.", "Ferdinand Hayden was an American scientist who convinced Congress to turn Yellowstone into a national park.", "Unfortunately, Panda bears are vulnerable animals. They mainly live in the southern area of China."]}, {"n": 8, "type": "text", "section": "Sentence structure", "stem": "Which of the following effectively combines the two sentences above?", "options": ["Although Jackson has been debating whether to start working in the family business for a while, it has been over a year now.", "It has been over a year now before Jackson has been debating whether to start working in the family business for a while.", "Jackson has been debating whether to start working in the family business for a while; in fact, it has been over a year now.", "Jackson has been debating whether to start working in the family business for a while; however, it has been over a year now."], "passage": "<strong>Read the following two sentences.</strong><br><br>Jackson has been debating whether to start working in the family business for a while.<br><br>It has been over a year now."}, {"n": 9, "type": "text", "section": "Grammar: parts of speech", "stem": "What part of speech is the word \"very\" in this passage?", "options": ["noun", "verb", "adjective", "adverb"], "passage": "<strong>Read the passage.</strong><br><br>The cat's eyes gleamed as he moved slowly and silently through the high grass, his bushy tail flicking as he kept his gaze steady on the bird. Then he froze, staring fixedly at the bird, and suddenly, very fast, he leapt with his claws out."}, {"n": 10, "type": "text", "section": "Capitalization", "stem": "Which of the following sentences is grammatically correct?", "options": ["\"Please stop interrupting me,\" said the teacher. \"otherwise, we will never be able to finish this on time.\"", "\"It was him,\" Matthew explained, \"the doctor who saved my grandfather's life made me want to become a doctor myself.\"", "Logan said, \"it was all my fault. Can you find it in your heart to forgive me?\"", "\"My younger sister Tina,\" said Mark, \"Is about to graduate, and has yet to decide what to do next.\""]}, {"n": 11, "type": "text", "section": "Sentence structure", "stem": "What type of sentence is it?", "options": ["declarative", "interrogative", "imperative", "exclamatory"], "passage": "<strong>Read the following sentence:</strong><br><br>Just try to get to my house before 8 o'clock."}, {"n": 12, "type": "text", "section": "Sentence structure", "stem": "Which is the best way to combine the sentences above?", "options": ["Julia Smith, who turned thirteen last week, is too young to attend the local arts school, which only accepts 14-year-olds or older.", "Julia Smith, who is too young to attend the local arts school but only accepts 14-year-olds or older, turned thirteen last week.", "Julia Smith would like to go to the local arts school, but it only accepts 14-year-olds or older and she is too young, because she is only thirteen.", "Julia, whose last name is Smith, is too young to attend the local arts school which only accepts 14-year-olds or older."], "passage": "<strong>Read the sentences.</strong><br><br>Julia was thirteen years old last week. Julia is too young to attend the local arts school. The school only accepts 14-year-olds or older. Julia's last name is Smith."}, {"n": 13, "type": "text", "section": "Composition & writing", "stem": "Which of the following topics can be used for an expository paragraph?", "options": ["Linda's new puppy", "the funniest puppy I have ever encountered in an adoption center", "how Alice's dream about dogs affected her decision to adopt a puppy", "why puppies are so helpless in the first few months of their lives"]}, {"n": 14, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words functions as a preposition in the sentence?", "options": ["already", "the", "but", "very"], "passage": "<strong>Read the passage.</strong><br><br>The journalist has already written the whole article but the very last sentence."}, {"n": 15, "type": "text", "section": "Spelling", "stem": "Which of the following words is spelled correctly?", "options": ["proffesor", "intermittent", "aggresive", "aparatus"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
