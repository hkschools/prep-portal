<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Language Usage: Full-Length Practice Test</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Language Usage: Full-Length Practice Test</div>
  <h2>MAP Grade 7 Language Usage</h2>
  <p class="muted">42 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage: Full-Length Practice Test</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage: Full-Length Practice Test</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-LANG-FULL";
const BANK_PATH = "map-tests/grade-7/language-usage/full-length/bank.csv";
const TITLE = "MAP Grade 7 Language Usage: Full-Length Practice Test";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Composition & writing", "stem": "Which is the best way for you to revise your draft?", "options": ["Stay on the subject. Omit the sentence about wanting to be a doctor.", "Further explain why you wanted to be the fastest runner.", "Change some of the words so they sound more like something a doctor would say.", "Add a sentence at the beginning of the paragraph that explains why it is important to be in shape."], "passage": "<strong>You are writing a short paragraph about how you felt one time when you were jogging.</strong><br><br>One time I was jogging because I felt sad. I ran as fast as I could, but I was still sad. In the past, I used to run to be the fastest, but not anymore. Now I run to be healthy and in shape. I want to be a doctor because they cure people and help them feel better. By jogging, you can improve your fitness, both physical and mental."}, {"n": 2, "type": "text", "section": "Grammar: parts of speech", "stem": "Complete the sentence.", "options": ["many", "nothing", "few", "everything"], "passage": "<strong>Complete the sentence.</strong><br><br>Today the stuff in my room is well organized, as opposed to past times when ___ was left in a complete mess."}, {"n": 3, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences is grammatically correct?", "options": ["I'll never forget when my mother told me, 'Never forget where you came from.", "Meredith told him, \"Talia said, 'I made a discovery!' and then explained her research.\"", "He told her, \"This morning John said, 'I have excellent news!' and then walked away.\"", "My uncle told me, \"Your grandfather always used to say, 'None of your business!'\""]}, {"n": 4, "type": "text", "section": "Sentence structure", "stem": "Which one of the following sentences is not an interrogative sentence?", "options": ["Can your brother let me use his guitar for a minute?", "We are going to the party in town later?", "Are the kids prepared for the upcoming exam?", "The president is about to give a speech to the nation in an hour, isn't he?"]}, {"n": 5, "type": "text", "section": "Composition & writing", "stem": "Which of the following forms of poetry is characterized by praise for a person, place, thing, or idea?", "options": ["Elegy", "Ode", "Free Verse", "Haiku"]}, {"n": 6, "type": "text", "section": "Sentence structure", "stem": "Which of the following is the best revision of the first sentence?", "options": ["People wear hats for many reasons, including to express themselves, to protect themselves from the sun, and practicing their religion.", "People wear hats for many reasons, including self-expression, protection from the sun, and to practice their religion.", "People wear hats for many reasons, including expressing themselves, protecting themselves from the sun, and to practice their religion.", "People wear hats for many reasons, including self-expression, protection from the sun, and religious practice."], "passage": "<strong>Read the sentences.</strong><br><br>People wear hats for many reasons, including to express themselves, protection from the sun, wearing a uniform, and as part of their religion. Different cultures have a variety of traditions of hat-wearing, including countless styles for both men and women. Do you like to wear hats?"}, {"n": 7, "type": "text", "section": "Punctuation", "stem": "Which of the following revisions of the sentences above is punctuated correctly?", "options": ["...The Pueblo: are known for their architecture... live together-in a building...", "The Pueblo people live in Arizona and New Mexico. The Pueblo are known for their architecture. Traditional Pueblo buildings are made from adobe: a kind of clay. Typically, three generations of a family live together in a building that has up to five levels...", "...The Pueblo, are known for their architecture... openings in the roof, of each level.", "The Pueblo people live in Arizona, and New Mexico! ...adobe...a kind of clay... move between levels; using ladders..."], "passage": "<strong>Read the sentences and answer the question that follows.</strong><br><br>The Pueblo people live in Arizona, and New Mexico. The Pueblo people are known for their architecture. Traditional Pueblo buildings are made from adobe: a kind of clay. Typically, three generations of a family live together; in a building that has up to five levels. The roof of each level is also a terrace for the level above it. People can move between levels using ladders that go through openings in the roof of each level."}, {"n": 8, "type": "text", "section": "Punctuation", "stem": "Which punctuation is correct for all of the blank spaces?", "options": ["commas", "semicolons", "colons", "dashes"], "passage": "<strong>Read the sentence.</strong><br><br>Our company has offices in Florence, Italy ___ Nairobi, Kenya ___ Montevideo, Uruguay, and New Delhi, India."}, {"n": 9, "type": "text", "section": "Sentence structure", "stem": "Choose the sentence that uses parallelism.", "options": ["Breakfast is considered by many the most important meal of the day.", "Mount Vesuvius, which is located in Italy, is one of the most active volcanoes in the world.", "Jenny is an extraordinary athlete, as she practices swimming, dancing, and running.", "Bob did his best to get a high score on the test."]}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which of the following writing samples is an example of expository text?", "options": ["On a Sunday morning, you can hear the birds chirping... it can also feel like a different place.", "Do yourself and our community a favor by volunteering at the zoo... make some new human and animal friends.", "One day, Jerry and Sue started a journey to find the end of the rainbow... the journey is more important than the destination.", "The Tang Dynasty period (618-907 CE) was a time full of many great achievements of Chinese culture. Poetry, painting, and sculpture flourished, and technological innovations included the printing press and fireworks. The time also saw many achievements in government and administration."]}, {"n": 11, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following includes a metaphor?", "options": ["The police officer listened to her story with a poker face.", "My heart was beating fast as it was my turn to go on stage.", "It was freezing outside. My hands were as cold as ice.", "I was very surprised by her news as I was not expecting it."]}, {"n": 12, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences contains a misplaced modifier?", "options": ["The blue shirt on the brown hanger belongs to Ajay.", "Only four people at a time can fit into the elevator.", "The silver woman's necklace complements her outfit.", "A velodrome is an oval-shaped track with steep sides that is used for bicycle racing."]}, {"n": 13, "type": "text", "section": "Grammar: parts of speech", "stem": "Which word is modified by the adjective \"smaller\"?", "options": ["molecule", "is", "times", "grain"], "passage": "<strong>Read the sentence.</strong><br><br>A molecule is approximately one million times smaller than a grain of sand."}, {"n": 14, "type": "text", "section": "Sentence structure", "stem": "Which underlined section of the passage is an independent clause?", "options": ["the daughter of the famous poet Lord Byron", "she met Charles Babbage", "proposing that computers could perform many tasks besides calculations", "Though Lovelace didn't live long enough to see her ideas put into practice"], "passage": "<strong>Read the passage.</strong><br><br>Long before computers existed, Ada Lovelace was already thinking of innovative ways they could be used. Lovelace, the daughter of the famous poet Lord Byron [A], was born in England in 1815. In 1833, she met Charles Babbage [B], who was creating a design for a mechanical computer that could perform calculations. Lovelace added to Babbage's ideas by proposing that computers could perform many tasks besides calculations [C]. Though Lovelace didn't live long enough to see her ideas put into practice [D], she is widely considered one of the first and most influential computer scientists in history."}, {"n": 15, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is the most correct grammatically?", "options": ["...feeding them daily, making sure their tank was always spick and span, and regular check-ups of the water temperature.", "...feed them daily, making sure their tank was always spick and span, and regular check-ups of the water temperature.", "...feeding them daily, making sure their tank was always spick and span, and checking the water temperature regularly.", "...to feed them daily, to make sure their tank was always spick and span, and regular check-ups of the water temperature."], "passage": "<strong>The shop assistant explained how to take good care of my new tropical fish tank: ___</strong>"}, {"n": 16, "type": "text", "section": "Grammar: parts of speech", "stem": "Which phrase of the following sentence functions as an adverb?", "options": ["to end that ridiculous quarrel between you two", "each one of you is going to sit at a different desk", "why quarreling in my class is a bad idea", "said Mr. Thomas angrily"], "passage": "<strong>\"To end that ridiculous quarrel between you two, each one of you is going to sit at a different desk and write a two-hundred-word essay about why quarreling in my class is a bad idea,\" said Mr. Thomas angrily.</strong>"}, {"n": 17, "type": "text", "section": "Capitalization", "stem": "Which sentence is capitalized correctly?", "options": ["\"Did you know,\" asked the teacher, \"There are some fish that can live out of water?\"", "\"Please tell your sister,\" said the girl on the phone, \"sharon will be there at 7:00.\"", "\"Students,\" Mr. Hernandez instructed, \"please bring your history books tomorrow.\"", "\"this cake,\" Dana told her friend, \"is one of the best cakes I have ever tasted.\""]}, {"n": 18, "type": "text", "section": "Punctuation", "stem": "Choose the answer choice that correctly uses the ellipsis:", "options": ["...Their first flight... North Carolina.", "...are generally known for their success... Their first flight took place in 1903 in the state of North Carolina.", "The Wright brothers, Orville and Wilbur ... Their first flight took place in 1903 in the state of North Carolina.", "The Wright brothers... are generally known for their success in building and flying the first airplane in the history of the world. Their first flight took place in 1903 in the state of North Carolina."], "passage": "<strong>Read the following sentence.</strong><br><br>The Wright brothers, Orville and Wilbur, are generally known for their success in building and flying the first airplane in the history of the world. Their first flight took place in 1903 in the state of North Carolina."}, {"n": 19, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences has an independent clause underlined?", "options": ["Despite the storm, the ship stayed on course.", "Though they can swim quickly, penguins walk slowly.", "Miriam has seen the new movie, but I haven't.", "In order to reserve your place on the bus, please order your tickets before the deadline."]}, {"n": 20, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["Me and my friends love to play soccer.", "Everyone except for I takes the bus to school.", "My parents ask my sister and me to help with chores.", "You and me are in the same music class."]}, {"n": 21, "type": "text", "section": "Composition & writing", "stem": "Which secondary source should Joey use for writing his paper?", "options": ["A documentary film made in the 20th century which describes the daily routine in a textile factory in the 19th century.", "A diary of an iron factory laborer from the 19th century.", "Photos of a factory from the 19th century.", "A novel which tells the story of a laborer's family back in the early days of the Industrial Revolution."], "passage": "<strong>Joey wants to write a research paper about the early days of the Industrial Revolution during the 19th century.</strong>"}, {"n": 22, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences is incorrectly punctuated with a colon?", "options": ["When Terry has free time, he only wants to do three things, namely: eat, sleep, and watch TV.", "I need you to do the following: write a new draft, train the new workers, and finish working on that short movie.", "You know exactly what to do: try again.", "The student stood up and said, \"I would like to finish these things before the weekend: exercise, get enough sleep, and make dinner for me and my brother.\""]}, {"n": 23, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences uses brackets incorrectly?", "options": ["That suit was the most expensive suit I had ever bought (it cost $700) and I'm not sure it was worth it.", "If it hadn't been for my dog Rainbow (thus named for the rainbow I saw just before I found her) I might have not met my best friend.", "Some of the neighbors (Mrs. Young and Mr. Scott, for example) refused to join the neighborhood watch.", "Your sister (is always eavesdropping on us) and now here she comes to do it again!"]}, {"n": 24, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a simple sentence?", "options": ["He returned the tablet after he noticed it was damaged.", "I'm going on a ski vacation next month with my father.", "I wanted to order a pizza, but my mom already made dinner.", "She brushed her teeth quickly, and she went straight to bed."]}, {"n": 25, "type": "text", "section": "Sentence structure", "stem": "Which underlined section is an adverb clause?", "options": ["Since the main road is closed", "we will take a detour", "which will take us ten miles out of our way", "passes through a scenic area."], "passage": "<strong>Read the sentences.</strong><br><br>Since the main road is closed, we will take a detour. The detour, which will take us ten miles out of our way, passes through a scenic area."}, {"n": 26, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is not grammatically correct?", "options": ["Either a flathead or a Phillips-head screwdriver can be used to assemble the table.", "Neither checks nor credit cards are accepted by the corner store.", "Neither Oklahoma nor Arkansas borders the Gulf of Mexico.", "Either Ron or Sue know how to get home from here."]}, {"n": 27, "type": "text", "section": "Composition & writing", "stem": "When giving a citation, which of the following should not be included?", "options": ["The name of the book, journal, or website the information is taken from", "How many times the information has been published", "The writer's name", "The date of publication"]}, {"n": 28, "type": "text", "section": "Composition & writing", "stem": "What information would not be appropriate to include in a pamphlet meant to describe a neighborhood for people who were unfamiliar with it?", "options": ["The main road is Highway 6.", "The Morgan family lives on Elm Street.", "There are both apartment buildings and private houses.", "Suzy's Diner is a popular restaurant."]}, {"n": 29, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following words or phrases will complete the sentence in the best way?", "options": ["finally", "nonetheless", "consequently", "likewise"], "passage": "<strong>Read the sentence.</strong><br><br>At Emma's first attempt at archery, assisted by her cousin Susan, her results exceeded her expectations; her second attempt was a success as well, ___ at which she struck the target three times in a row."}, {"n": 30, "type": "text", "section": "Punctuation", "stem": "Where in the above passage should quotation marks be used to mark the beginning of a dialogue?", "options": ["(A)", "(B)", "(C)", "(D)"], "passage": "<strong>Read the passage.</strong><br><br>My experiment was not going well. After three long hours I was still nowhere near the finish line. My lab partner Philip came in wanting to help, but ran away after a few minutes telling me (A) I was completely out of my league, and really, I was deluding myself. (B) I was not going to give up! My head of laboratory, likewise, came in to take a look at my work. (C) I wanted to be Louis Pasteur too, when I was young, he said. But I went on relentlessly. Finally, at six P.M., after nearly ten hours of work, with beads of sweat on my forehead, I knew I had struck gold. (D) My experiment was a brilliant success! The ever-burning candle had been invented!"}, {"n": 31, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following words or phrases will complete the sentence in the best way?", "options": ["above all", "moreover", "all in all", "nonetheless"], "passage": "<strong>Read the sentence.</strong><br><br>As her eyes slowly closed, she was still thinking about the woes of that day; ___ it hadn't been one of the best ones she'd had lately."}, {"n": 32, "type": "text", "section": "Composition & writing", "stem": "Which of the following cannot describe a satire?", "options": ["the writing attacks institutions or individuals that are unethical or corrupt", "the writing includes speeches about the morals the writer intends to convey", "the writing expresses criticism through means such as sarcasm, irony, and incongruity", "the writing pushes conventions to illogical extremes through understatement and diminution"]}, {"n": 33, "type": "text", "section": "Grammar: usage", "stem": "Which sentence shows clear pronoun-antecedent agreement?", "options": ["After I finished collecting the plates from the tables, my friend helped me to return them back to their place.", "After many preparations, Chris and Rick organized a tennis competition in their school.", "If somebody wants to save some money, you first need to think about how much you usually spend each day.", "Alexandra took her wallet out of the drawer and then emptied it completely."]}, {"n": 34, "type": "text", "section": "Word choice & vocabulary", "stem": "Which word best replaces the underlined phrase while keeping the same meaning?", "options": ["will conclude", "will stop", "will be completed", "will be finished"], "passage": "<strong>Read the sentence.</strong><br><br>The show will be over at 4:30."}, {"n": 35, "type": "text", "section": "Grammar: parts of speech", "stem": "In which of the following sentences is a relative pronoun underlined?", "options": ["The apple trees that we planted are starting to produce fruit.", "My cousins and their friends will meet us at the movie theater.", "I must reply to several important emails this morning.", "Abigail is preparing herself for an audition."]}, {"n": 36, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences contains a misplaced modifier?", "options": ["Our company has experienced sustained robust growth this year.", "A silver woman's bracelet was reported missing.", "The phoenix rose from its ashes in a triumphant blaze of glory.", "Sublime and awe-inspiring, the Northern Lights attract thousands of tourists each year."]}, {"n": 37, "type": "text", "section": "Spelling", "stem": "Which of the following words is spelled correctly?", "options": ["receipt", "somersolte", "fassinate", "rythm"]}, {"n": 38, "type": "text", "section": "Grammar: usage", "stem": "Which of the following words will complete the passage in the best way?", "options": ["slowest, more slowly", "better, best", "more terrible, very", "worse, worst"], "passage": "<strong>Read the passage.</strong><br><br>Anita's day could not have gone ___. She woke up twenty minutes late; then, when she finally got to class, she realized she had forgotten to study for the math test. Strangely enough, however, her mood was ___ affected by her orange juice spilling all over the floor during lunch."}, {"n": 39, "type": "text", "section": "Punctuation", "stem": "Choose the sentence that is correctly punctuated:", "options": ["My parents went to the city market yesterday and bought some fruit, bananas, apples, watermelons, peaches, and oranges.", "I have visited five big capital cities in my life: London, Moscow, Copenhagen, Ankara, and New Delhi.", "My friend Bill has a lot of books from various genres, including: drama, comedy, action, and adventure.", "Next summer, my family plans to travel to: Arizona and Nevada."]}, {"n": 40, "type": "text", "section": "Grammar: usage", "stem": "Which of the following pronouns correctly completes the sentence above?", "options": ["which", "who", "whom", "that"], "passage": "<strong>Into the room came Laurie, ___ we caught by surprise as we started singing \"Happy Birthday\" and turned all the lights on.</strong>"}, {"n": 41, "type": "text", "section": "Punctuation", "stem": "Which of these sentences does not use ellipsis (...) correctly?", "options": ["I'm not sure... I'll have to check again... but let's just make an estimate.", "He paid $25,000 for the car... using one-dollar bills.", "I will prepare my presentation... before Tuesday.", "According to Professor Gomez, \"the behavior of mice... is largely predictable.\""]}, {"n": 42, "type": "text", "section": "Composition & writing", "stem": "Which source would best help you address this counterargument?", "options": ["historical evidence that lower taxes encourage economic activity", "a government budget proposal for lowering taxes and hiring more teachers", "a paper by an economist arguing that when taxes are lower companies hire more workers", "a case study showing lower taxes would improve a typical family's financial situation"], "passage": "<strong>You are writing an essay with the following thesis:</strong><br><br>\"The government should significantly reduce taxes in order to improve the economy.\"<br><br>You anticipate the counterargument that a reduction in taxes would require cuts in education programs."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
