<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Language Usage (Level 3): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 3): Drill 1</div>
  <h2>MAP Grade 7 Language Usage</h2>
  <p class="muted">14 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 3): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 3): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-LANG-L3-D1";
const BANK_PATH = "map-tests/grade-7/language-usage/level-3/drill-1/bank.csv";
const TITLE = "MAP Grade 7 Language Usage (Level 3): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences uses vivid imagery?", "options": ["Sometimes loud planes fly over our house and annoy us.", "Plankton are tiny creatures that play an essential role in ocean ecosystems.", "The National Mall in Washington, D.C. is a park, not a shopping mall.", "Smooth, flat stones are perfect for skipping on a lake to make rippling patterns."]}, {"n": 2, "type": "text", "section": "Punctuation", "stem": "Which of the following titles of a play is punctuated correctly?", "options": ["\"Cats\"", "A Streetcar Named Desire", "Pygmalion (underlined)", "The Merry Wives of Windsor"]}, {"n": 3, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following is the infinitive in this sentence?", "options": ["the first spring rain", "falls", "turns", "to absorb"], "passage": "<strong>Read the sentence.</strong><br><br>After the first spring rain falls, the field near my house turns green and many people visit it to absorb some fresh air and beautiful views."}, {"n": 4, "type": "text", "section": "Capitalization", "stem": "Which of the following sentences follows the rules of capitalization?", "options": ["She said, \"We live in North Carolina now, but we used to live in Western Europe.\"", "She said, \"we live in north Carolina now, but we used to live in western Europe.\"", "She said, \"we live in North Carolina now, but we used to live in Western Europe.\"", "She said, \"We live in North Carolina now, but we used to live in western Europe.\""]}, {"n": 5, "type": "text", "section": "Grammar: parts of speech", "stem": "The underlined phrase is functioning as what part of speech?", "options": ["noun", "pronoun", "adjective", "adverb"], "passage": "<strong>Read the sentence.</strong><br><br>It can be difficult to acknowledge one's shortcomings in a dignified manner."}, {"n": 6, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a compound-complex sentence?", "options": ["We decided to go to a rock concert as a family, but my wife, who dislikes crowded places, did not join us.", "My friend is now reading the most fascinating and well-written book I have ever read.", "My dentist, who had moved to another state a long time ago, came back last week.", "The child searched the busy, noisy street for hours, yet his ball was nowhere to be seen, and finally he was forced to give up."]}, {"n": 7, "type": "text", "section": "Grammar: usage", "stem": "Which word correctly fills the blank?", "options": ["she", "I", "they", "me"], "passage": "<strong>Read the sentences.</strong><br><br>Jessica invited my friends and ___ to a picnic at the park on Sunday. Each of us will bring food to share. In case of bad weather, we will have lunch indoors instead of going to the park."}, {"n": 8, "type": "text", "section": "Composition & writing", "stem": "Which is the best thesis for a persuasive essay on the first time people landed on the moon?", "options": ["The moon landing is an event known by everyone in the United States.", "The moon landing was part of NASA's Apollo program.", "The moon landing is an achievement that humanity would have certainly reached at some point in one way or another.", "A famous sentence said by Neil Armstrong during the landing was, \"That's one small step for a man, one giant leap for mankind.\""]}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Choose the most suitable paragraph for this purpose.", "options": ["To watch the sunset, you need to take precautions and do not look directly at the sun. Put on your sunglasses, and only when the sun starts disappearing can you look in its direction.", "Watching the sunset was a great experience. I really recommend everyone take a few minutes every day to look at it!", "Yesterday, my father and I went together to the beach to watch the sunset. We stood and watched the sun going down. After the sun disappeared, we took a taxi back home.", "When the sun was getting closer to the water, it became red like a huge grapefruit hanging in the sky, and the clouds around it looked like they were on fire."], "passage": "<strong>You want to write a short paragraph that would allow the reader to have a taste of the sunset you watched yesterday. Choose the most suitable paragraph for this purpose.</strong>"}, {"n": 10, "type": "text", "section": "Grammar: usage", "stem": "Which of the following is the best way to revise the sentence?", "options": ["Neither my grandparents nor my older brother was able to attend the concert.", "Neither my grandparents or my older brother were able to attend the wedding.", "Either my grandparents or my older brother were unable to attend the concert.", "Either my grandparents or my older brother was unable to attend the concert."], "passage": "<strong>Read the following sentence.</strong><br><br>Neither my grandparents nor my older brother were able to attend the concert."}, {"n": 11, "type": "text", "section": "Grammar: usage", "stem": "Which of the following is grammatically incorrect?", "options": ["Whom are you planning to add to your team when the new season starts?", "Ginger is one of those dogs which are always jumping around and wagging their tails.", "Never go to a dentist whose teeth are rotting.", "Logan made a heartfelt apology for his rudeness, whom Stanley gracefully accepted."]}, {"n": 12, "type": "text", "section": "Grammar: usage", "stem": "Which of the following is the best way to revise the sentence?", "options": ["Without having listened to the guard's explanation, the crowd were going wild, yelling and pushing to get through into the factory.", "Without even listening to the guard's explanation, the crowd were going wild, and they yelled and pushed to get through into the factory.", "Without even listening to the guard's explanation, the crowd was going wild, yelling and pushing to get through into the factory.", "The crowd is going wild, yelling and pushing to get through into the factory without even listening to the guard's explanation."], "passage": "<strong>Read the following sentence.</strong><br><br>Without even listening to the guard's explanation, the crowd were going wild, yelling and pushing to get through into the factory."}, {"n": 13, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences can be correctly punctuated with a semicolon?", "options": ["The most beautiful horse I have ever seen was called Flicka ___ she was a bay mare, with a long, slender neck and two eyes that glowed like stars.", "My geography teacher in high school had a very sad personal story ___ he was the best teacher we had throughout high school.", "The shopping list my parents gave me contained over twenty items from the grocery store ___ they would never let me go to the park alone at night.", "The movie theater had been closed for nearly ten years ___ the new mayor announced he was going to renovate the entire area."]}, {"n": 14, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically incorrect?", "options": ["Sharon's new shoes were too small for her, so she decided to take them back to the store.", "Either Sharon or Ellen will buy her new shoes at the mall, but the shoes will probably not be suitable anyway.", "Each dress and hat that Sharon bought did not eventually fill their purpose.", "Sharon and Ellen bought several pairs of shoes, but by the time they tried to return them, it was too late."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
