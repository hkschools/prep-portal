<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Language Usage (Level 3): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 3): Drill 2</div>
  <h2>MAP Grade 7 Language Usage</h2>
  <p class="muted">12 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 3): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Language Usage (Level 3): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-LANG-L3-D2";
const BANK_PATH = "map-tests/grade-7/language-usage/level-3/drill-2/bank.csv";
const TITLE = "MAP Grade 7 Language Usage (Level 3): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Punctuation", "stem": "Which punctuation correctly fills the two blanks, in order?", "options": ["semicolon, comma", "comma, comma", "colon, colon", "colon, comma"], "passage": "<strong>Read the sentences with missing punctuation.</strong><br><br>There are three main types of rock ___ igneous, sedimentary, and metamorphic. Each kind of rock is formed in a different process. Igneous rock forms when magma (molten rock) cools. Sedimentary rock forms when grains of sand or other small particles stick together. Metamorphic rock ___ the rarest type of rock, forms when an already-existing rock is transformed by heat, pressure, or chemical reactions."}, {"n": 2, "type": "text", "section": "Capitalization", "stem": "Which sentence uses capitalization correctly?", "options": ["\"I enjoy running,\" said Albert, \"But I prefer swimming.\"", "\"Do you know,\" asked Maureen, \"How to make a birdhouse?\"", "\"South Africa has three capitals,\" Answered Yasmine, \"Cape Town, Pretoria, and Bloemfontein.\"", "\"If we get up early tomorrow,\" suggested Tom, \"we can finish our work by noon.\""]}, {"n": 3, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words from the passage is functioning as a past participle?", "options": ["permission", "received", "brought", "submit"], "passage": "<strong>Read the sentences.</strong><br><br>Completed permission forms are required from every student who is going on the class trip. Every student received a form last week. Forms should be brought to the principal's office no later than Thursday. Please submit your forms on time!"}, {"n": 4, "type": "text", "section": "Composition & writing", "stem": "Which of the following would not be an appropriate topic for an expository paragraph of your essay?", "options": ["Technologies first developed for space exploration that have other uses", "The value of scientific knowledge about outer space to society", "The advantages of robotic over human space exploration", "The size of the government's space exploration budget"], "passage": "<strong>Imagine you are writing an essay about space exploration. Your thesis is the following:</strong><br><br>\"The benefits of space exploration are worth the costs.\""}, {"n": 5, "type": "text", "section": "Grammar: usage", "stem": "Which of the following options correctly completes the sentence above?", "options": ["have been", "has been", "are", "is"], "passage": "<strong>Read the sentence.</strong><br><br>Lately, neither my friends nor your girlfriend ___ taking part in the project."}, {"n": 6, "type": "text", "section": "Grammar: parts of speech", "stem": "In which of the following sentences is a participial phrase underlined?", "options": ["Riding a unicycle requires excellent balance.", "A piñata is a colorful hollow container stuffed with toys and candy.", "How long did it take you to finish the puzzle?", "The highest elevation where trees can grow is called the tree line."]}, {"n": 7, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences has an adverb clause underlined?", "options": ["The pirates buried their treasure under the palm tree.", "The U.S. Constitution was signed in 1787 but didn't come into effect until 1789.", "After the party's over we'll have to clean the house.", "The painting that was sold for $5 million was a fake!"]}, {"n": 8, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following forms a metaphor?", "options": ["comparing two words with \"like\" or \"as\"", "connecting two unrelated words without \"like\" or \"as\"", "replacing a word with a logically related word", "describing a part of something to represent the whole"]}, {"n": 9, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences does not use a semicolon correctly?", "options": ["The Summer Solstice is the longest day of the year; a tandem bicycle has two seats.", "Some birds can fly, others can't.", "Alexander Fleming noticed that mold stopped bacteria from growing; as a result, he discovered penicillin.", "Interstate highways with north-south routes have odd numbers; those with east-west routes have even numbers."]}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which of the following details can the journalist include in the article to rebuff that counterargument?", "options": ["Most standardized tests consist of multiple choice questions and the answers are graded by machines. Therefore, the grades are not subject to bias.", "Standardized tests have been used in Singapore for many years and Singapore's educational system is ranked the highest in the world.", "The cost of standardized tests is a very low percentage of the budget of education.", "According to surveys, most parents believe that standardized tests are a good measure of the children's abilities and the quality of the school."], "passage": "<strong>A journalist is writing an article about standardized tests with the purpose of persuading the readers that those tests are reliable measures of student achievement. The journalist anticipates the counterargument that standardized tests do not improve student achievement and are therefore a waste of tax money.</strong>"}, {"n": 11, "type": "text", "section": "Punctuation", "stem": "What is the purpose of the three dots in the passage?", "options": ["to express deep emotion", "to emphasize how good the teacher was", "to convey a time jump", "to express hesitation"], "passage": "<strong>Read the passage.</strong><br><br>My English teacher in junior high was one of the most unusual people I have ever met. He would enter the class with a different song every morning. He would assign us essays about things such as folding paper cranes or why some unknown museum in a faraway city we'd never even heard of was worth a visit. He was a wonderful teacher. I remember one day when he saw I was looking sad he asked me to help him carry some books to the staff room... That day when I came home from school, I couldn't stop thinking about how nice he had been to me and the good advice he had given me."}, {"n": 12, "type": "text", "section": "Composition & writing", "stem": "Choose the best revision for the following passage.", "options": ["Lucille staggered in shock when she learned that her brother had invited the whole family to his house and made them dinner. Card games had been played and tea had been drunk until late at night, but nobody had invited Lucille.", "Lucille was completely shocked to learn that her whole family had been invited by her brother to his house and had been made dinner by him. Card games had been played and tea had been drunk until late at night, but Lucille had not been invited.", "Lucille was completely shocked to learn that her brother had invited the whole family to his house and made them dinner. They had played card games and drunk tea until late at night, but nobody invited Lucille.", "Lucille staggered in shock when she learned that her brother had invited the whole family to his house and made them dinner. They had played card games and drunk tea until late at night, but Lucille had not been invited."], "passage": "<strong>Lucille was completely shocked to learn that her brother had invited the whole family to his house and made them dinner. They had played card games and drunk tea until late at night, but Lucille had not been invited.</strong>"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
