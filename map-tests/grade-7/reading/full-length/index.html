believing in it and never gave up for a moment. On December 21, 1937, Snow White and the Seven Dwarfs premiered... The film received a standing ovation... it became a major box-office success... Adjusted for inflation, this movie has made over $1.8 billion dollars, making it the highest-grossing Disney movie in history."}, {"n": 3, "type": "text", "section": "Author's craft & structure", "stem": "What is the purpose of the passage?", "options": ["to explain what to consider when choosing between a cat and a dog", "to persuade the reader that cats make better pets than dogs", "to inform the reader about the difference between adopting and buying a pet", "to persuade the reader to get a cat"], "passage": "<strong>Read the passage</strong><br><br>Cats are the most popular pets in America (apart from fish)... Deciding between raising a cat or a dog is all about personal taste... Contrary to popular belief, cats are very affectionate and require a lot of attention from their owners. Dogs live up to their reputation as loving pets. However, cats and dogs have very different needs. Cats are more independent... Dogs, on the other hand, are a lot more dependent on their owners, as they require a walk a few times a day. Imagine the following situation: you come home after a long day, it's freezing cold outside and all you want is to get into bed and get warm. But alas, you must take your dog out for a walk first-it hasn't been out all day! This bit is a deal breaker for many people. One advantage dogs have is that they are much easier to train... but how important are these abilities when choosing a companion? At the end of the day, most people still choose what pet to raise based on their personal preference rather than on rational reasons."}, {"n": 4, "type": "text", "section": "Author's craft & structure", "stem": "Lucy's words are an example for which literary device?", "options": ["metaphor", "irony", "alliteration", "personification"], "passage": "<strong>Read the passage</strong><br><br>Edmund's little sister, Lucy, suddenly started telling the entire family about a magical land she had found inside the closet. Edmund did not believe her, and he constantly made fun of her. A few days later, Edmund found out that Lucy hadn't been lying-the magical land was real! However, he didn't want the other family members to think he was insane like Lucy, so when they asked him about it, he lied, saying that he and Lucy had only been pretending that her land was real. \"Thank you very much, Edmund,\" said Lucy."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an idiom?", "options": ["The neighbors cornered him.", "This is the final straw.", "He was drowning in paperwork.", "Arthur was as happy as a king."], "passage": "<strong>Read the passage</strong><br><br>Quentin owns an apartment in the city. He sublets it to young couples, but he's been having bad luck with tenants for a long time. The first couple who lived in the apartment broke the bathtub. The second couple painted all the walls black without permission. The third couple had a dog that completely destroyed the sofa. When Quentin visited the apartment last week, the neighbors cornered him to complain about the current couple leaving their trash in the corridor instead of throwing it in the trash chute. \"This is the final straw!\" Quentin cried. \"I will never sublet the apartment again!\" He came back home to find his son, Arthur, sitting at his desk and drowning in paperwork. \"How would you like to live in the apartment instead of here with us?\" Quentin asked him. Arthur was as pleased as punch to accept the offer."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "How had Eli changed over the years?", "options": ["He started to break fences.", "He stopped watching short, funny movies on the internet and playing video games.", "He wanted to go outside.", "He started vandalizing the neighborhood and playing offensive tricks on his neighbors."], "passage": "<strong>Read the passage</strong><br><br>James was exhilarated. He was on his way to meet Eli, a friend he hadn't seen since they had entered elementary school five years ago. Eli had moved away with his parents and the two of them only kept in touch over the internet... On his way, he thought longingly of the days he and Eli had spent together; they had always liked to play video games and watch short, funny movies on the internet... James wanted to play a video game, but Eli said he didn't have any video games anymore. Eli wanted to go outside and meet his friends and James reluctantly agreed. Eli and his friends ran around the backyards of the neighborhood, breaking fences and leaving insulting letters in mailboxes. When James saw what they were doing, he pretended to be feeling ill so he could go back to the house... He knew he would probably never see Eli again, and he was happy about it."}, {"n": 7, "type": "text", "section": "Text structure", "stem": "Which of the following statements can be concluded from the table?", "options": ["Most days, the difference between the number of trains going through station A and station B is 10 or less.", "Most days, the difference between the number of trains going through station B and station C is 10 or less.", "Most days, the number of trains going through stations B and C is equal.", "Most days, the number of trains going through stations A and C is equal."], "passage": "<strong>Read the table of the number of trains going through three different stations on weekdays.</strong><br><br>Station A: Monday 90, Tuesday 70, Wednesday 100, Thursday 90, Friday 100. Station B: Monday 90, Tuesday 50, Wednesday 100, Thursday 100, Friday 100. Station C: Monday 100, Tuesday 90, Wednesday 100, Thursday 50, Friday 50."}, {"n": 8, "type": "text", "section": "Vocabulary in context", "stem": "Based on the sentences, what is the meaning of the word eclectic?", "options": ["funny and amusing", "of very high quality", "made up of various sources and styles", "extremely loud and boisterous"], "passage": "<strong>Read the sentences</strong><br><br>I was so disappointed in that art museum. I was sure it was going to be eclectic, but there were only paintings and they were all from the medieval era. That was not what I was looking forward to."}, {"n": 9, "type": "text", "section": "Main idea & theme", "stem": "The primary purpose of the passage is to", "options": ["provide a glimpse into the nesting habits of wild barn owls in America", "explain how to turn entertaining content into a viral internet phenomenon", "tell the story of the owl box and highlight the power of enthusiasm and care", "analyze how creative initiatives can be awakened in large crowds"], "passage": "<strong>Read the passage</strong><br><br>The Owl Box Channel. When Carlos and Donna Royal, a retired couple from San Marcos, California, decided to install an owl box in their eco-friendly yard, little did they know this spontaneous decision would affect millions... The box was occupied by a beautiful female barn owl... Carlos, eager to share the experience with his 94-year-old mother, asked his grandson's assistance in streaming live video from the box across the Web... The Owl Box YouTube channel... became an internet sensation... A sense of community formed among the self-described MODs... the excitement kindled surprising initiatives... How interesting, some of them mused as the phenomenon drew to a close, that simple deeds sparked by enthusiasm and care ended up touching so many. How interesting, indeed."}, {"n": 10, "type": "text", "section": "Text structure", "stem": "According to the map, which current U.S. state does not contain territory that once belonged to Great Britain/United Kingdom?", "options": ["Washington", "Missouri", "North Dakota", "Alabama"], "passage": "<strong>Read the map.</strong><br><br>U.S. TERRITORIAL ACQUISITIONS - showing regions such as the Oregon Territory 1846 (Treaty with the United Kingdom), Louisiana Purchase 1803 (from France), the Territory of the Original Thirteen States (Ceded by Great Britain) 1783, and other acquisitions."}, {"n": 11, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is a synonym of the word ardent?", "options": ["enthusiastic", "fascinated", "indifferent", "confused"]}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "How does the author develop the idea that Plato merely invented Atlantis as a plot device, rather than telling of a true place?", "options": ["The author first tells the readers of Plato's fable, then explains why it is very unlikely.", "The author first disproves the theory that Atlantis was real, then explains why it is scientifically impossible.", "The author first explains why Atlantis was a utopia, then why it is unlikely to have ever existed.", "The author first gives evidence that Atlantis was real, then disproves it."], "passage": "<strong>Read the passage</strong><br><br>The famous Greek philosopher Plato was the first to tell the legend of Atlantis-an island subcontinent with a very advanced civilization-in 330 B.C... The Atlanteans attacked Greece, a powerful attack which Greece managed to repel; then Atlantis fell out of favor with the gods and sank into the ocean, never to be heard from again. There is no other evidence, except for Plato's writings, that a place such as Atlantis has ever existed... most scholars assume Atlantis is a legendary place... According to Plato's writings, Atlantis was located in the Atlantic Ocean close to the Mediterranean Sea, but it has never been found. Furthermore, it is scientifically impossible that a large land surface such as Atlantis sank into the ocean the way Plato describes it."}, {"n": 13, "type": "text", "section": "Main idea & theme", "stem": "What is the main point the author makes in the passage?", "options": ["It is unnecessary to fight over eggs.", "You can never count on history to be accurate.", "Nations go to war over small, insignificant issues.", "When people resent the emperor's law, the law is obviously ridiculous."], "passage": "<strong>Read the passage</strong><br><br>The animosities between these two parties run so high, that they will neither eat, nor drink, nor talk with each other... It is allowed on all hands, that the primitive way of breaking eggs, before we eat them, was upon the larger end; but his present majesty's grandfather, while he was a boy, going to eat an egg, and breaking it according to the ancient practice, happened to cut one of his fingers. Whereupon the emperor his father published an edict, commanding all his subjects, upon great penalties, to break the smaller end of their eggs. The people so highly resented this law, that... there have been six rebellions raised on that account... It is computed that eleven thousand persons have at several times suffered death, rather than submit to break their eggs at the smaller end. (\"Gulliver's Travels\" by Jonathan Swift)"}, {"n": 14, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the Greek root phil?", "options": ["new", "many", "love", "opinion"], "passage": "<strong>Read the sentence</strong><br><br>Hydrophilic substances are attracted to water."}, {"n": 15, "type": "text", "section": "Text structure", "stem": "How does the structure of the paragraph support its meaning?", "options": ["It helps the reader imagine what it might be like to meet a dragon.", "It emphasizes the differences in how dragons are viewed in different cultures.", "It compares and contrasts the different appearances of various kinds of dragons.", "It compares dragons that live in mountains with dragons that live in water."], "passage": "<strong>Read the paragraph</strong><br><br>How would you feel if you were walking along and came across a dragon?... Dragons have a different significance in Eastern cultures than they do in Western cultures. In China, dragons are called loong, and are considered majestic, benevolent creatures that protect people and bring them good fortune. Eastern dragons are usually associated with water such as lakes and the ocean, usually do not have wings, and do not breathe fire. In Europe, dragons are regarded ferocious flying fire-breathing monsters that usually live in the mountains. In European myths and stories, heroes protect people from dragons. Dragons are an excellent example of how the same or similar symbols can have different meanings in different cultures."}, {"n": 16, "type": "text", "section": "Author's craft & structure", "stem": "Which literary device is used in the sentence?", "options": ["simile", "metaphor", "onomatopoeia", "oxymoron"], "passage": "<strong>Read the sentence</strong><br><br>The clang of the school bell could be heard throughout the neighborhood."}, {"n": 17, "type": "text", "section": "Author's craft & structure", "stem": "What is the main effect of the words \"a loud silence?\"", "options": ["To show the feeling of anticipation in the arena.", "To describe how quiet it was in the arena.", "To persuade the reader to become interested in figure skating.", "To emphasize that there was a large crowd in the arena."], "passage": "<strong>Read the sentences</strong><br><br>You could hear a loud silence fill the arena as the competitors and audience waited for the judges to announce the winner of the figure skating competition. All the finalists had performed very impressive routines, so it felt like anyone could be the winner."}, {"n": 18, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the passage shows evidence of bias?", "options": ["Come to Way Out Escape Room Center!", "An escape room can be a great activity for any kind of group or occasion: families, friends, birthday parties, corporate outings, you name it!", "We have four different escape rooms, each designed around its own theme: Pirates, Mission to Mars, Wild West, and Jewel Theft Mystery.", "Way Out Escape Room Center provides the best escape room experience in the region."], "passage": "<strong>Read the advertisement</strong><br><br>Looking for a fun challenge? Come to Way Out Escape Room Center! An escape room is a new kind of game becoming popular all over the world... An escape room can be a great activity for any kind of group or occasion: families, friends, birthday parties, corporate outings, you name it!... We have four different escape rooms, each with its own theme: Pirates, Mission to Mars, Wild West, and Jewel Theft Mystery... Way Out Escape Room Center provides the best escape room experience in the region. Our facility was the first established in our area."}, {"n": 19, "type": "text", "section": "Detail & inference", "stem": "Who is the antagonist in the passage?", "options": ["the master", "the groom", "the farmer", "the horse"], "passage": "<strong>Read the passage</strong><br><br>Note: the narrator in the following passage is a horse.<br><br>My new master was an unmarried man... His doctor advised him to take horse exercise, and for this purpose he bought me. He hired a stable... and engaged a man named Filcher as groom... He ordered the best hay with plenty of oats, crushed beans, and bran... For a few days all went on well... After a while it seemed to me that my oats came very short... However, one afternoon he rode out into the country to see a friend of his, a gentleman farmer... \"It seems to me, Barry, that your horse does not look so well as he did when you first had him; has he been well?\"... \"I can't say who eats your corn, my dear fellow, but I am much mistaken if your horse gets it.\" (from Black Beauty by Anna Sewell)"}, {"n": 20, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following is an antonym of the word indolent?", "options": ["lazy", "active", "passive", "immersed"]}, {"n": 21, "type": "text", "section": "Vocabulary in context", "stem": "Based on the sentences, what is the meaning of the word meticulously?", "options": ["happily", "unwillingly", "with attention to detail", "in a hurried or hasty manner"], "passage": "<strong>Read the sentences</strong><br><br>Ever since I was a little child, it has always been important to me to keep my environment as clean and tidy as possible. I clean meticulously every day and always receive compliments on my spotless house."}, {"n": 22, "type": "text", "section": "Detail & inference", "stem": "What is one logical reason, according to the passage, for the knocker-uppers to knock on the windows instead of the doors of the customers?", "options": ["They thought it was an easier way to wake people up.", "They decided knocking on doors was too old-fashioned.", "They wanted to wake up only the customers.", "They thought it made the job seem more desirable."], "passage": "<strong>Read the passage</strong><br><br>Technological advancements are all around us, but we rarely stop to appreciate them... Another technological advancement people take for granted is the alarm clock... In the past, alarm clocks were not available, and even when they became available, they were not always reliable and not everyone could afford them. Some people, such as people who worked shifts, still had to get to work on time. So, they used the service of a knocker-upper... A knocker-upper walked around the street carrying a long pole and knocked on the customers' windows to wake them up... In the beginning, knocker-uppers used to ring the doorbell or knock loudly on the door, and later they started using the long sticks to knock on windows from the outside, knocking loudly enough to wake up the people inside the house, but softly enough not to wake the neighbors."}, {"n": 23, "type": "text", "section": "Main idea & theme", "stem": "The main theme of the poem is", "options": ["cheerfulness", "loyalty", "generosity", "persistence"], "passage": "<strong>Read the poem</strong><br><br>See it Through, by Edgar A. Guest. When you're up against a trouble, / Meet it squarely, face to face; / Lift your chin and set your shoulders, / Plant your feet and take a brace. / When it's vain to try to dodge it, / Do the best that you can do: / You may fail, but you may conquer, / See it through! / Black may be the clouds about you / And your future may seem grim, / But don't let your nerve desert you; / Keep yourself in fighting trim..."}, {"n": 24, "type": "text", "section": "Vocabulary in context", "stem": "In paragraph 5, the word biodiversity most nearly means", "options": ["the disappearance of an animal species", "a biological fuel extracted from plants", "the existence of many kinds of animals", "the damage caused by clearing forests"], "passage": "<strong>Read the passage</strong><br><br>Deforestation. 1 Deforestation is a term used to describe the process by which an area that was once covered in forest is cleared and becomes open land. People clear forests for numerous reasons... 2 When deforestation is caused by people clearing land, it typically takes place in stages... 3 Tree diseases and insects are also major factors in deforestation... (Paragraph 5 states: \"The foremost effect of the phenomenon is the loss of habitat for forest-dwelling animals, which in turn leads to loss of biodiversity, a situation that can eventually result in extinction of species.\")"}, {"n": 25, "type": "text", "section": "Main idea & theme", "stem": "Which of the following is correct paraphrasing of the above paragraph?", "options": ["In winter, when it is very cold and there is not much food, some animals find it very difficult to live. Therefore, they go into hibernation-a very deep sleep in which they consume less energy than usual because their internal processes are slower and their body temperature is lower, and therefore, they need less energy.", "Some animals have a very difficult time in winter because of the cold and lack of food. Hibernation is one method to solve this problem. Animals that hibernate lower their body temperature and reduce the rate of internal processes, so they require much less energy than normal.", "Winter is a difficult season for some animal species because of the cold and lack of food. Some animals hibernate, which requires much less energy than usual, so their energy requirements are lower than usual.", "Hibernation is one method to deal with the extremes of winter. While hibernating, animals need less energy than usual because their body temperature is lower and their internal processes are slower."], "passage": "<strong>Read the paragraph</strong><br><br>For some animal species, extreme winter conditions might make it nearly impossible to survive when food is scarce and temperatures drop too low. One solution is hibernation. Hibernating animals go into an extended deep sleep phase in which they lower their body temperature and reduce the rate of internal processes, so they require much less energy than normal."}, {"n": 26, "type": "text", "section": "Text structure", "stem": "What is the structure of the poem?", "options": ["limerick", "haiku", "free verse", "sonnet"], "passage": "<strong>Read the poem</strong><br><br>Ozymandias, by Percy Bysshe Shelley. I met a traveller from an antique land, / Who said \"Two vast and trunkless legs of stone / Stand in the desert.... Near them, on the sand, / Half sunk a shattered visage lies... My name is Ozymandias, King of Kings; / Look on my Works, ye Mighty, and despair! / Nothing beside remains...\" (fourteen lines, with a rhyming pattern)."}, {"n": 27, "type": "text", "section": "Text structure", "stem": "What is the function of the first paragraph of the selection?", "options": ["symbolism", "exposition", "falling action", "personification"], "passage": "<strong>Read the excerpt</strong><br><br>From Rebecca of Sunnybrook Farm, by Kate Douglas Wiggin. The days flew by: as summer had melted into autumn so autumn had given place to winter. Life in the brick house had gone on more placidly of late, for Rebecca was honestly trying to be more careful in the performance of her tasks and duties as well as more quiet in her plays, and she was slowly learning the power of the soft answer in turning away wrath... On a certain Friday afternoon she asked her aunt Miranda if she might take half her bread and milk upstairs to a friend. \"What friend have you got up there, for pity's sake?\" demanded aunt Miranda. \"The Simpson baby...\""}, {"n": 28, "type": "text", "section": "Detail & inference", "stem": "Which of the following answers includes some of the differences between Sirmen and Szymanowska, according to the passages?", "options": ["Sirmen was Italian and Szymanowska was Russian; Sirmen's compositions influenced some famous composers and Szymanowska was more successful as a performer.", "Sirmen was born earlier than Szymanowska; Sirmen was a pianist and Szymanowska was a violinist; Szymanowska was one of the first musicians to perform without notes.", "Sirmen played the violin and Szymanowska the piano; Sirmen was Italian and Szymanowska Polish; Sirmen only performed with her husband while Szymanowska was a successful performer on her own.", "Sirmen was an Italian violinist and Szymanowska a Polish pianist; Szymanowska was one of the first musicians to perform without notes."], "passage": "<strong>Read the passages</strong><br><br>Maddalena Laura Sirmen was an Italian violinist and composer. She was born in 1745 in Venice, Italy... The couple performed together, which allowed Maddalena to build a reputation, and later a solo career. She was a successful performer and an even more successful composer; her violin compositions were considered \"brilliant.\"<br><br>Maria Szymanowska was a Polish composer. Born in 1789, she was a brilliant pianist and performed in several countries in Europe... she was one of the first pianists to perform memorized repertoire in public, without the notes to help her. She moved to Russia in 1828 and became a court pianist to the Russian Empress... Szymanowska composed around 100 piano pieces, which were said to influence Frederic Chopin."}, {"n": 29, "type": "text", "section": "Text structure", "stem": "This is a narrative poem because it", "options": ["uses the word \"I\"", "includes vivid imagery", "addresses a theme", "tells a story"], "passage": "<strong>Read the poem</strong><br><br>The Road Not Taken, by Robert Frost. Two roads diverged in a yellow wood, / And sorry I could not travel both / And be one traveler, long I stood / And looked down one as far as I could / To where it bent in the undergrowth... I shall be telling this with a sigh / Somewhere ages and ages hence: / Two roads diverged in a wood, and I- / I took the one less traveled by, / And that has made all the difference."}];

function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";

  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
