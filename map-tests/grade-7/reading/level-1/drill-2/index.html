<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Reading (Level 1): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Reading (Level 1): Drill 2</div>
  <h2>MAP Grade 7 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 1): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 1): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-READ-L1-D2";
const BANK_PATH = "map-tests/grade-7/reading/level-1/drill-2/bank.csv";
const TITLE = "MAP Grade 7 Reading (Level 1): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Detail & inference", "stem": "What is most likely the reason that Martin did all the things that made Andrea so angry, such as following her around and wearing her clothes?", "options": ["because he liked following people", "because he wanted to be more like her", "because he thought their parents loved her more than they loved him", "because he wanted to make her angry"], "passage": "<strong>Read the passage</strong><br><br>Andrea's six-year-old brother, Martin, was always irritating her. He would follow her around the house wherever she went. He would ask her what she was doing several times a minute, even when she was only sitting and reading a book or playing with her phone. If Andrea asked for spaghetti at dinner, Martin had to have the same food. He took clothes from her closet without permission, tried them on, and wanted to wear them to school before their mother stopped him. He begged Andrea to take him when she went to meet her friends, but even though she repeatedly refused, he was so persistent that their mother made Andrea take him with her. One day, Andrea came back home to find her geography book had been destroyed: Martin had taken it and written his name on every page in red paint, so the book was so wet and sticky with paint it could no longer be used. \"That's it!\" Andrea shrieked. \"This is the last straw, Martin! You are never coming anywhere near me or my things again!\" Martin stood and stared at her with tears in his eyes... A few hours later, when Andrea came downstairs for dinner, she was shocked to find the kitchen had been decorated with balloons, and there was a chocolate cake on the table with her name on it. \"Mom helped me to do it for you,\" said Martin. \"I'm sorry about your book,\" he said, with tears in his eyes again. \"I only did it because I wanted you to remember me when you're in class. I'm sorry.\" Andrea hugged him, and they made up at once."}, {"n": 2, "type": "text", "section": "Main idea & theme", "stem": "What is the moral of the story?", "options": ["Every trickster might be caught.", "Be respectful of others.", "Appearances may be deceiving.", "Twins whose mother is a teacher must study hard."], "passage": "<strong>Read the passage</strong><br><br>Dylan and Connor were twelve-year-old identical twins who liked to play tricks and pranks on everybody. They constantly switched the sugar with the salt at the dinner table, so their father's coffee was undrinkable. They would crank call the neighbors, no matter how often their parents made them apologize. Their favorite trick, though, was switching places. At school, they would always switch places, each making his friends believe he was his own brother, then burst out laughing. They always confessed after a while, unless they used this trick for tests. For Dylan and Connor had a secret: they would switch places and take exams for each other. Since Dylan was more mathematical than Connor, and Connor was more gifted at English, Dylan would take Connor's math exams while Connor would take Dylan's English exams. Therefore, on the day of Connor's math final, they came to school as usual, ready to switch places at the right moment. However, as Connor walked into the classroom in the morning, his mouth dropped open in horror: his mother was standing there, eyeing him sternly. \"W-what are you doing here?\" Connor stammered. \"I am your substitute teacher today, Connor,\" said his mother. \"Please take your seat.\" Connor sat, more anxious than he had ever been before... there was no way they could fool their own mother, who was strict and observant and would never fall for a switching trick."}, {"n": 3, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following can replace the word \"admonished\"?", "options": ["reprimanded", "investigated", "requested", "fired"], "passage": "<strong>Read the paragraph</strong><br><br>This boy always crosses the line. Last week he came to school with blue hair! He was admonished by the principal, but you can be sure he'll come up with something new this week."}, {"n": 4, "type": "text", "section": "Detail & inference", "stem": "What is the author's viewpoint on Tolkien in the passage?", "options": ["Tolkien was a noble man.", "Tolkien was very religious.", "Tolkien was a brilliant man.", "Tolkien is the most successful author in the world."], "passage": "<strong>Read the passage</strong><br><br>J. R. R. Tolkien, author of The Lord of the Rings, was not only a successful author but also a master linguist and philologist. A professor in college, he specialized in studying Old English, but was fond of many other languages, especially Finnish and Welsh. While writing The Lord of the Rings, and for many years after, he created his own languages for the creatures in his stories. He created a whole family of languages for the Elves in the story, called the Elvish languages, and continued to develop their grammar and history until he died. Some of those Elvish languages had traces of Finnish, Welsh, and other European languages."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "What is the author's purpose in this passage?", "options": ["to inform", "to entertain", "to persuade", "to instruct"], "passage": "<strong>Read the passage</strong><br><br>Studies have found that bilingualism is a great asset to the cognitive process, and therefore, it is very advisable. People who speak more than one language have several cognitive advantages: they score better on different tests; their memory, concentration, and multitasking skills are better; and they are less prone to diseases such as Alzheimer's and dementia when they get older. It is estimated that more than 427 million people speak Spanish as a native language. Spanish is considered one of the easiest languages for a native English speaker to learn, because even though the grammar and pronunciation are different from English, they are simpler and more consistent; so learning Spanish might be very easy for you. Spanish is the most popular second language learned in the United States, and even elementary schools have adopted it into their curriculums."}, {"n": 6, "type": "text", "section": "Vocabulary in context", "stem": "If the meaning of the prefix \"iso-\" is \"equal\", which of the following might be described as \"isomagnetic\"?", "options": ["something with a big magnetic force", "something with insignificant magnetic force", "something with the same magnetic force", "something without any magnetic force"]}, {"n": 7, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct, according to the directions?", "options": ["To tie both a Half Windsor Knot and a Full Windsor Knot, the wide end of the tie must go through the loop once.", "The first difference between a Half Windsor Knot and a Full Windsor Knot is the side on which the wide end of the tie starts.", "Pulling down on the knot to adjust it is the most important part, which gives the knot its final, formal look.", "Bringing the wide end through the loop must always be done from above."], "passage": "<strong>Read the passage</strong><br><br>There are several ways to tie a necktie. Although the result might look similar, the way to get to that result differs. Many people have to wear ties to work, formal events, and even casual get-togethers. To tie a Half Windsor Knot: 1. Keep the wide end of the tie on the right-hand side and about a foot below the slim end. 2. Cross the wide end over the slim end and bring the wide end under the loop, then through it. 3. Bring the wide end across the front to the right-hand side and up into the loop from underneath. 4. Bring the wide end through the knot. 5. Pull down on the knot to make it tighter and adjust it with your fingers. To tie a Full Windsor Knot: The Full Windsor knot is considered the most elegant of all knots. It is wider and more symmetrical compared to the Half Windsor Knot. 1. Keep the wide end of the tie on the left-hand side and about a foot below the slim end. 2. Cross the wide end over the slim end and bring the wide end under the loop, then through it. Bring it out on the right-hand side. 3. Bring the wide end under the knot and through the loop from outside to your left-hand side. 4. From left to right, wrap the wide end of the tie over the knot. Bring it under the knot, through the loop, then through the knot. 5. Pull down on the knot to make it tighter and adjust it with your fingers."}, {"n": 8, "type": "text", "section": "Text structure", "stem": "The passage is an example for which type of text?", "options": ["memoir", "autobiography", "fiction", "biography"], "passage": "<strong>Read the passage</strong><br><br>How often do we see everyday objects around us and ask ourselves who invented them? One such invention is the flat-bottomed paper bag, which people nowadays take for granted, but in the 1860s it was completely unheard of. Margaret Eloise Knight was born in Maine in 1838. Her family moved to New Hampshire after her father's death, and Margaret and her siblings had to leave school at a young age to work at a cotton mill. When she was twelve years old, Knight witnessed an accident at the mill in which a worker was injured by one of the machines. A few weeks later she had developed a safety device for those machines, which was adopted by mills around the city. Knight moved to Massachusetts in 1867 and began to work for the Columbia Paper Bag Company. The following year she invented and built a machine that was able to fold and glue paper to make flat-bottomed paper bags. The design of the machine was stolen from her by a man who was present when her machine was being built, and he patented the device as his own. This meant that Knight would not receive royalties from her invention. She filed a lawsuit against him and won, making her the first woman to be awarded a U.S. patent. She later established the Eastern Paper Bag Co. and went on to hold 86 more patents... Knight never married, and died in 1914. She was inducted into the National Inventors Hall of Fame in 2006."}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct, according to the passage?", "options": ["Tourism does not make a significant part of the income of the Galapagos.", "Humans live on every island in the Galapagos.", "Some new species on the islands have caused damage.", "Galapagos is a province of Ecuador but is located closer to California than to the Ecuadorian mainland."], "passage": "<strong>Read the passage</strong><br><br>The Galapagos Islands are a group of islands located in the Pacific Ocean near the equator. Made up of 19 major islands and two smaller islands, the group is a province of Ecuador and is classified as both an Ecuadorian national park and a World Heritage Site. The Galapagos Islands' most famous feature is their wildlife. A large number of species are unique to the Galapagos, including many species of tortoises, birds, and giant iguanas. Some of those species resemble other species from different places, such as California, Australia, South Africa, and the Atlantic Ocean. Five of the nineteen islands are inhabited: Isabela, Santa Cruz, Baltra, Floreana, and San Cristobal, with over 25,000 people living on them. The inhabitants typically work in agriculture and cattle raising, but many work in tourism, as there are several small hotels and visitor sites, most of which are scuba-diving or snorkeling sites. Due to the uniqueness of many animal species in the Galapagos, many of which have been endangered over the years due to human hunting and non-native animals brought to the islands by humans, it has been declared a protected area."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences is grammatically incorrect?", "options": ["Looking into her face, I could easily tell she was lying to me.", "When laying floor tiles, it is important to start from the center point.", "I kept one eye on the television while laying the table for dinner.", "I was laying on my bed and reading a book when the phone rang."]}, {"n": 11, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an example of symbolism?", "options": ["people saying the Princess would never be smart", "the Queen giving Princess Anne textbooks as birthday presents", "Prince Leopold leaving Princess Anne a red rose", "Princess Anne inheriting the throne"], "passage": "<strong>Read the passage</strong><br><br>Princess Anne was the daughter of a king who was known for his stupidity. People always said she would never be smart because of her father, and that she would be just as bad a ruler as he was. Her father had passed away when she was very young, and Princess Anne's mother, the Queen, encouraged her daughter to read books and study hard. \"When you are queen, you are going to need to know so much,\" she told her. On every single birthday, the Queen gave her daughter a textbook as a birthday present. The Princess met her true love, Prince Leopold, in the grand ball on her eighteenth birthday, and from then on, they were inseparable. When Prince Leopold was about to leave on a long journey, he came to bid Anne farewell and leave her a single red rose. \"Know that I will always love you,\" he said. As soon as Prince Leopold left, the Queen suddenly fell ill and her life was in danger. In her absence, Princess Anne was required to attend to the needs of the Kingdom. Fortunately, thanks to everything she had learned, she managed to run the Kingdom as well as attend to her mother's sickbed. A few months later, Anne's true love returned and asked Anne to marry him. The Queen recovered, and Princess Anne soon became Queen, known as a clever and just ruler, beloved by all."}, {"n": 12, "type": "text", "section": "Main idea & theme", "stem": "Which of the following is the best summary of the speech?", "options": ["Education should be at top of the political priority. Children in this country are currently not doing well on tests. I intend to improve that by enforcing a bonus system for the teachers that will benefit teachers with students who do better on national tests, and focusing my efforts on the math and science test scores.", "Thank you for coming. It is very important to me that you are here today. This country has several problems, the most important of which is our education and the fact that children are receiving low scores on national tests. I intend to work on that problem and my main suggestion is implementing a merit-based bonus system for the teachers.", "What does the phrase \"children of our future\" mean? It means that with a lot of hard work, our children can do much better on national tests. I intend to make sure this will happen.", "Our tax dollars have not been used to change the problem with the education system, and this is what I intend to change. I will work hard to ensure that all children do better on national tests, especially math and science which will help the future generations run this country better."], "passage": "<strong>Read the speech</strong><br><br>My friends, thank you for joining us today. I feel pride and gratitude for the children of our country; it pains me to see how many of them have stopped believing in themselves. It is my job to bring back the self-confidence of our youth. Like any other country, this country has several issues to deal with. There is the energy crisis. There is a financial crisis. But how can we ever hope to overcome these crises, I ask you, without investing our best efforts into educating future generations and hope they will be able to do a better job than us running this country? We often hear the phrase \"children of our future,\" but what does it truly mean? Our children's test scores are very low in comparison with other first-world countries. This was not always the case; it is a phenomenon that stems from the neglect of the last generation. It is my belief that thus far, the tax dollars have not been used to change that. For example, I have pushed for a merit-based bonus system for the teachers: a teacher whose students do better on national tests will receive a higher bonus. If elected, I intend to enforce that bonus system and put a special emphasis on ensuring the math and science test scores are improved."}, {"n": 13, "type": "text", "section": "Detail & inference", "stem": "Which of the following answers includes some of the differences between Sirmen and Szymanowska, according to the passages?", "options": ["Sirmen was Italian and Szymanowska was Russian; Sirmen's compositions influenced some famous composers and Szymanowska was more successful as a performer.", "Sirmen was born earlier than Szymanowska; Sirmen was a pianist and Szymanowska was a violinist; Szymanowska was one of the first musicians to perform without notes.", "Sirmen played the violin and Szymanowska the piano; Sirmen was Italian and Szymanowska Polish; Sirmen only performed with her husband while Szymanowska was a successful performer on her own.", "Sirmen was an Italian violinist and Szymanowska a Polish pianist; Szymanowska was one of the first musicians to perform without notes."], "passage": "<strong>Read the passages</strong><br><br>Maddalena Laura Sirmen was an Italian violinist and composer. She was born in 1745 in Venice, Italy. It was difficult for women to succeed as musicians at that time, and Sirmen only became successful after her marriage to a renowned violinist, Ludovico Sirmen. The couple performed together, which allowed Maddalena to build a reputation, and later a solo career. She was a successful performer and an even more successful composer; her violin compositions were considered \"brilliant.\"<br><br>Maria Szymanowska was a Polish composer. Born in 1789, she was a brilliant pianist and performed in several countries in Europe, including France, England, Germany, and Italy. Her playing was very well received by critics and audiences, and she was one of the first pianists to perform memorized repertoire in public, without the notes to help her. She moved to Russia in 1828 and became a court pianist to the Russian Empress, Alexandra Feodorovna. Szymanowska composed around 100 piano pieces, which were said to influence Frederic Chopin, one of the most famous Polish composers of all time."}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "Lydia's words are an example for which literary device?", "options": ["simile", "irony", "oxymoron", "hyperbole"], "passage": "<strong>Read the passage</strong><br><br>Upon moving to a new neighborhood with a big park in front of their house, Lydia suggested to her parents that they go for a picnic on Saturday. Her parents, very busy and stressed with the move and all the unpacking they had to do agreed to take a break for the picnic, but told Lydia she would have to plan the entire thing by herself. Mostly to get out of unpacking, Lydia went to the store and bought bread, jam and butter, cheese, jars of pickles and olives, eggs, some fresh vegetables, and plastic plates and utensils. She even bought a lovely straw basket in which to put all the food, and a blanket to sit on. On Friday night she made some hard-boiled eggs, happily thinking about the following morning which they would be spending in the sun at the park. On Saturday morning she woke up to a loud noise coming from above her head. She hurried to the window and stared outside in disbelief, it was raining. \"Wonderful,\" Lydia said. \"Just... wonderful.\""}, {"n": 15, "type": "text", "section": "Main idea & theme", "stem": "What is the moral of the fable?", "options": ["It is always good to pity the weak.", "Little friends may prove great friends.", "Mice are very useful animals.", "If you help someone, he or she will always help you back."], "passage": "<strong>Read the fable</strong><br><br>Once when a Lion was asleep a little Mouse began running up and down upon him; this soon wakened the Lion, who placed his huge paw upon him, and opened his big jaws to swallow him. \"Pardon, O King,\" cried the little Mouse: \"forgive me this time, I shall never forget it: who knows if I may be able to do you a turn some of these days?\" The Lion was so tickled at the idea of the Mouse being able to help him, that he lifted up his paw and let him go. Some time after the Lion was caught in a trap, and the hunters who desired to carry him alive to the King, tied him to a tree while they went in search of a wagon to carry him on. Just then the little Mouse happened to pass by, and seeing the sad plight in which the Lion was, went up to him and soon gnawed away the ropes that bound the King of the Beasts. \"Was I not right?\" said the little Mouse. (Aesop)"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
