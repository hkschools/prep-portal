<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Reading (Level 1): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Reading (Level 1): Drill 1</div>
  <h2>MAP Grade 7 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 1): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 1): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-READ-L1-D1";
const BANK_PATH = "map-tests/grade-7/reading/level-1/drill-1/bank.csv";
const TITLE = "MAP Grade 7 Reading (Level 1): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following definitions is the best definition for a simile?", "options": ["a series of two or more words that begin with the same sound", "an expression whose meaning cannot be understood from the meaning of each separate word", "a figure of speech used to compare two things using words such as \"like\" or \"as\"", "a figure of speech used to compare two things without using words such as \"like\" or \"as\""]}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "Why did Rowling not sign her full name on the Harry Potter books?", "options": ["because she wanted to become a billionaire", "because her publisher thought it was important to donate a lot of money to charity", "because she had a low self-esteem at the time", "because her publisher thought the book would be less successful if she did"], "passage": "<strong>Read the passage</strong><br><br>English author J. K. Rowling's life is a rags-to-riches story: her mother was ill for many years and passed away when Rowling was twenty-five years old. Then she moved to Portugal, taught English as a foreign language, and she got married and gave birth to a daughter. Due to the aggression of her husband, she had to leave him and return to the UK a year later. She had started writing Harry Potter, but she was unemployed and lived in a small apartment with her baby daughter. She had a low self-esteem at the time. When she finished writing Harry Potter and the Sorcerer's Stone, several publishers rejected the book. At last, Bloomsbury Publishing, a British publishing house, agreed to publish it, requesting that she use her initials in her pen name, because the publisher believed female authors' names were less appealing to young boys.<br><br>Once the Harry Potter books were published, they became an instant success. Their popularity only grew as the series progressed, and they have now sold hundreds of millions of copies and have been translated into over 80 different languages. Rowling has now made a fortune from her books; she became a self-made billionaire and the first person to lose the billionaire title due to donations to charity. She is now worth about $860 million and is the highest paid author in the world."}, {"n": 3, "type": "text", "section": "Detail & inference", "stem": "What is one reason to choose a capsule hotel over a regular hotel?", "options": ["It is a lot cheaper.", "It offers a restaurant and a pool.", "It is a traditional part of trips to Japan.", "It includes a wi-fi connection."], "passage": "<strong>Read the passage</strong><br><br>A capsule hotel is a type of hotel developed in Japan. What makes it so special is the fact that it doesn't have rooms: the guests sleep in tiny box-shaped \"rooms,\" called capsules, that have room only for a bed. The bed takes up the entire capsule and the guest cannot sit upright inside the capsule, but only lie down. The capsule is typically made of plastic or fiberglass. The capsules are stacked side by side, two units high.<br><br>Most capsules include a television and a wi-fi connection, and the hotel provides vending machines and sometimes a restaurant and a pool. This style of hotel can be found primarily in Japan, but can also be found in Hong Kong, the Philippines, and Belgium. These hotels are very popular among people without a lot of money and only wish to stay one night. A capsule hotel might have as few as fifty or as many as seven hundred capsules."}, {"n": 4, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct according to the passage?", "options": ["Nancy Johnson marketed her invention as the \"Johnson Patent Ice Cream Freezer.\"", "The new machine was the most complex machine ever made.", "Someone else made a fortune because of Johnson's invention.", "Nancy Johnson always wanted to receive a patent and become famous."], "passage": "<strong>Read the passage</strong><br><br>The first ice cream maker was invented by Nancy Johnson. She received a patent in 1843 for her invention, a small-scale ice cream freezer, which comprised two spatulas that fit tightly into a long cylindrical barrel. The spatulas contained holes and were attached to a shaft that could be rotated with a crank, while the cylinder was cooled from the outside with a salt and ice mixture. The spatulas could be rotated in the mix and scrape ice crystals off the inner wall of the cylinder simultaneously. This invention made ice cream making far easier than it had been, and ensured a more uniform texture than had been possible before. It was even possible to produce two flavors of ice cream simultaneously.<br><br>After Nancy Johnson received her patent, she did not have enough money and resources to manufacture her machine and market it. Therefore, she sold the patent to William Young for $200. Young, in his turn, marketed the machine as the \"Johnson Patent Ice Cream Freezer.\" The mechanism of Johnson's machine was used in ice cream makers around the world for many years, and William Young made a fortune."}, {"n": 5, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is a synonym of the word omniscient?", "options": ["powerful", "alienated", "all-knowing", "thoughtful"], "passage": "<strong>Read the sentence</strong><br><br>Despite the fact that he always thinks he knows everything, he is not omniscient."}, {"n": 6, "type": "text", "section": "Main idea & theme", "stem": "What is the author's viewpoint?", "options": ["A strong hero makes a movie.", "Animated movies with water that looks real are good.", "Moana is one of the best films Disney has ever made.", "It is a good idea to have more movies with strong heroines."], "passage": "<strong>Read the passage</strong><br><br>My friend Sophie came over to my house to play video games. Sophie usually won these games, and this time was no exception. When we finished the game, Sophie received a text message. The sound was familiar. \"What song is that?\" I asked. \"You're Welcome', from Moana,\" Sophie replied. \"It's a new Disney movie...\" \"I watched it too!\" I interrupted. \"I loved that movie! I loved how the water looked so real.\" \"I loved the songs!\" said Sophie. \"But what I really loved,\" I continued, \"was Moana's character. She's the daughter of the village chief, and she will be the chief after him. She's so independent and strong. She does what she thinks is right, fights the bad guys, and saves her people. And above all, I loved how it's clear to everyone that she's going to be the chief. Usually in films you see that girls can only rule if they get married, but in Moana, no one questions the fact that she can rule on her own.\" \"You're right,\" said Sophie. \"And in most films, the girl is saved by the boy, but Moana saves the day herself.\" \"It's very refreshing to see a heroine like Moana,\" I agreed."}, {"n": 7, "type": "text", "section": "Detail & inference", "stem": "What is the main conflict in the story?", "options": ["Carmen teasing Corinna about her jeans and shoes and not inviting her to her parties", "Corinna having a lot of work to do", "Carmen's parents leaving her in charge of her sisters despite her incompetency", "Corinna having to decide whether or not to help Carmen"], "passage": "<strong>Read the passage</strong><br><br>Corinna was riding her bike along Wisteria Lane, thinking of her science test the next day. She liked science, but this week she had been busy and had barely studied. She would have to work hard tonight. As she kept riding, she suddenly heard someone scream from inside the nearest house and stopped her bike. Before she could do anything else, a girl came running out of the house and up to her, calling her name. Corinna knew the girl. It was Carmen, who was in her grade and whom she greatly disliked. Carmen had never invited Corinna to her birthday parties and had always made fun of Corinna's jeans and shoes, which were not trendy enough for her taste. \"Corinna,\" said Carmen, her eyes full of tears, \"can you please help me? My little sisters are crying, and I don't know what to do. None of the neighbors are home... My parents went on a day trip and left me in charge, and I don't know what to do... please?\" Corinna sighed, but something in Carmen's eyes made her unable to say no. She thought for a moment, then nodded and followed Carmen to the house. Carmen's little sisters were screaming and crying at the top of their lungs, but Corinna had four little brothers and sisters of her own and knew exactly what to do and how to calm them down. She left Carmen's house three hours later, with the girls fast asleep and Carmen thanking her repeatedly. \"You're the best, Corinna. I'll never forget what you did for me! Thank you so much!\""}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "What is the author's assumption in the passage?", "options": ["Clowns are amusing.", "Clowns are an inseparable part of any child's party.", "Everyone experiences clowns as scary.", "It does not make sense to fear clowns."], "passage": "<strong>Read the passage</strong><br><br>Scientists have been trying to figure out why clowns, who are meant to make us laugh, are so scary, and have recently come up with a new theory. Clowns have exaggerated facial features and body parts, including hands, feet, and noses. However, the scariest part is, evidently, the smile. Clowns typically have a red, painted smile, which our brains perceive as a regular smile; however, unlike a natural smile, a clown's smile never falters. Clowns keep smiling, whether they are happy, sad, or upset. No matter the situation, clowns keep smiling. Our brains might recognize that the clown's smile is independent of the situation, and therefore, interpret it as unnatural and scary."}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following is not mentioned in the passage?", "options": ["Phil Collins is a famous English musician.", "Brother Bear was the last Disney soundtrack that Collins composed.", "One song Collins composed won two awards.", "Phil Collins's native language is English."], "passage": "<strong>Read the passage</strong><br><br>Tarzan, the 1999 Disney animated film, had a rich soundtrack composed and recorded by Phil Collins, the famous English musician. Collins recorded the songs not only in his native English, but also in French, Italian, Spanish, and German. It was the first Disney soundtrack to be recorded in multiple languages by the same musician. One of the famous songs from the soundtrack, \"You'll Be in My Heart,\" won both the Academy Award and the Golden Globe Award for Best Original Song. The success was so big that Collins wrote and composed the soundtrack for Disney's 2003 animated film Brother Bear, and once again recorded some of the songs himself."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "Which literary device is illustrated by Laurel turning off the television?", "options": ["alliteration", "rising action", "imagery", "irony"], "passage": "<strong>Read the passage</strong><br><br>Eugene thought he and his little sister were too old to have a babysitter, but their parents, evidently, thought otherwise and insisted on bringing one every time they went out. They have endured some horrific babysitters, including one that sent them to bed at seven o'clock, and another who broke the DVD and then blamed it on them. But this one, their parents promised, was different. Even though Eugene doubted it, he had promised his parents to give her a chance. The babysitter was about seventeen years old, and her name was Laurel. As soon as their parents left, she asked Eugene and his sister Kathleen what they wanted to do. They wanted to watch television. Laurel joined them, but after about twenty minutes, she turned it off. \"Hey, we were watching that!\" Eugene protested. \"Oh, but I've got something much more interesting for us to do,\" Laurel replied. \"I'm going to tell you a story.\" Eugene and Kathleen exchanged gloomy looks. They were not in the mood for a story. They wanted to watch TV. But Laurel seemed so determined that they kept quiet. Laurel took a chair and sat in front of them. \"I want to tell you about something that happened to me two days ago,\" Laurel began... Laurel grinned and went on. She kept telling them stories until their parents came back. As soon as she left, Eugene and Kathleen told their parents they would never agree to have another babysitter except for Laurel."}, {"n": 11, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words means \"faulty structure\"?", "options": ["misinterpretation", "ungraceful", "unaccountable", "malformation"]}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an example of alliteration?", "options": ["lonely lasses, lazy lads", "cherubs in clouds and cinnamon bread", "they weep and sweep and fall asleep", "muttering indistinctly under his breath"], "passage": "<strong>Read the passage</strong><br><br>Frederick was walking down the long avenue that led from school to his house when he saw an old beggar sitting on the sidewalk leaning against a wall, his eyes closed and his hand outstretched. Frederick knew it was rude to stare, but decided to give the man a little money in case he was hungry. As Frederick drew closer, he noticed the old beggar was rocking back and forth, muttering indistinctly under his breath. Frederick leaned in to listen and realized the beggar was, in fact, singing: \"Lonely lasses, lazy lads, / Cherubs in clouds and cinnamon bread. / They weep and sweep and fall asleep. / I turn to gaze at the red sky instead.\" Although Frederick could not perceive the meaning of the song, he was still impressed and put twice as much money as he had intended in the beggar's outstretched hand."}, {"n": 13, "type": "text", "section": "Text structure", "stem": "What is the structure of the passage?", "options": ["cause and effect", "order of importance", "compare and contrast", "chronology"], "passage": "<strong>Read the passage</strong><br><br>Singapore is the only country in the world in which chewing gum is completely banned. The idea to ban gum completely was first brought to the Prime Minister of Singapore in 1983. It had been reported for several years that gum was causing maintenance and cleaning problems: vandals were leaving spent gum in mailboxes, inside keyholes and on elevator buttons, which were all difficult to get rid of and sometimes caused damage. Chewing gum left on floors and bus seats proved hard to clean and damaged cleaning equipment. In 1987 the railway system started running. The Singapore government had invested several billions in that railway system, and it was soon reported that vandals had started sticking chewing gum on train door sensors, preventing the doors from functioning well and disrupting the train movement. When Goh Chok Tong was elected as the new prime minister in 1992, he decided to restrict the distribution of gum and after a short transition period in which stores were allowed to clear existing stock, the sale of chewing gum was banned, except for medical reasons."}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is a paradox?", "options": ["the sun was like a big ball of fire", "stopped running and stood there", "seven dancing dogs", "less is more"], "passage": "<strong>Read the passage</strong><br><br>Minnie was reading a book when her younger brother Chuck came home and walked past her bedroom. \"What are you doing?\" he asked, poking his head inside. \"As you can see, I'm reading,\" said Minnie without looking up. \"So, nothing important then. Listen, a new family has just moved into the old Miller house. You have to see what they've done with their front yard!\" Minnie put the book aside and ran out with Chuck. The sun was like a big ball of fire in the sky and both children were sweating, but they kept running all the way down the street until they reached the old Miller house. There, Minnie stopped running and stood there, aghast. The front yard of the large house she had known her whole life had been filled with garden gnomes-small, ugly lawn ornaments, at least twenty of them... \"I think, as far as lawn ornaments are concerned, maybe less is more,\" she whispered to Chuck."}, {"n": 15, "type": "text", "section": "Detail & inference", "stem": "According to the passage, it is likely that:", "options": ["The same musical piece will make everyone feel frisson, as long as they are able to experience it.", "Goosebumps is one of the symptoms of frisson.", "Frisson is meant to keep humans warm.", "High levels of imagination might stop a person from feeling frisson."], "passage": "<strong>Read the passage</strong><br><br>\"Frisson\" is a French term for chills of pleasure, which many people get while listening to certain musical pieces, looking at beautiful artwork, or watching a moving scene from a movie. About two-thirds of the population occasionally experience frisson. The more engaged a person is in a piece of music or art, the more likely he or she is to experience frisson. Typically, frisson causes goosebumps, and scientists have been trying to discover why. Goosebumps is a skin reaction which typically occurs after a rapid change in temperature. The hairs on our skin are raised, then lowered, which creates a layer of warmth. However, since this is a physiological reaction, and frisson is psychological, science has yet to explain why frisson may cause goosebumps. Studies have tried to explain why some people experience frisson while others do not. It has been shown that people who experience frisson also score high for a personality trait called \"openness to experience,\" and are more imaginative and curious than other people."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
