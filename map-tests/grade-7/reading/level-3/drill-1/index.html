<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Reading (Level 3): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Reading (Level 3): Drill 1</div>
  <h2>MAP Grade 7 Reading</h2>
  <p class="muted">10 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 3): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 3): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-READ-L3-D1";
const BANK_PATH = "map-tests/grade-7/reading/level-3/drill-1/bank.csv";
const TITLE = "MAP Grade 7 Reading (Level 3): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Text structure", "stem": "Based on the stage directions, which of the following is NOT required to perform the play?", "options": ["a spotlight", "a loudspeaker", "sand", "batteries"], "passage": "<strong>Read the dramatic scene</strong><br><br>The stage looks like a deserted island: covered in sand, a palm tree in the center, coconuts scattered about in the sand, the stage covered in bright yellow light suggesting strong tropical sunlight. The sound of crashing waves is heard in the background. The beeping sound of a metal detector can be heard from a distance, and gradually gets louder as WOMAN and MAN enter. The beeping sound is slow and steady. WOMAN and MAN are dressed as explorers. WOMAN is carrying a metal detector, using it to scan the ground. MAN is carrying two shovels. WOMAN: It must be close. This is the last section of the island. I can smell the treasure already! ... WOMAN: Look at this! It must be 50 years old! I wonder if it still works! [Checks the batteries]. It even uses the same kind of batteries! MAN takes the metal detector, puts batteries into it, runs it over the other metal detector. There's a fast beeping sound."}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct, according to the passage?", "options": ["Mrs. Chester wanted Amy at the flower table because her own daughter wanted Amy's table.", "Mrs. Chester and her daughter thought Amy's design of the table was unfitting to the fair.", "Mrs. Chester was sure Amy would not mind, since she was deeply interested in the cause of the fair.", "Mrs. Chester's daughter was jealous of Amy because of a man or some men and asked her mother to do so."], "passage": "<strong>Read the passage</strong><br><br>Amy's dismay can be imagined, when, the very evening before the fair, as she was putting the last touches to her pretty table, Mrs. Chester, who, of course, resented the supposed ridicule of her daughter, said, in a bland tone, but with a cold look, \"I find, dear, that there is some feeling among the young ladies about my giving this table to anyone but my girls...\" ... \"Wouldn't you like the flower table? ... You could make a charming thing of it, and the flower table is always attractive, you know.\" \"Especially to gentlemen,\" added May, with a look which enlightened Amy as to one cause of her sudden fall from favor... \"Now she's mad. Oh, dear, I wish I hadn't asked you to speak, Mama,\" said May, looking disconsolately at the empty spaces."}, {"n": 3, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the passage?", "options": ["In the future, humanity will not be able to thrive only on Earth anymore.", "Living on Mars will require a lot of effort and might even be impossible.", "Do not believe everything you see in movies.", "Mars is the best hope for the future of humanity."], "passage": "<strong>Read the passage</strong><br><br>For many years, people have wondered whether humanity will ever be able to live on Mars... Out of all the planets in our Solar System, Mars is the most habitable... However, once humanity reaches Mars, it will have to find a way to survive, and the most important question is: is it even possible? Although there is no liquid water on Mars, there is ice, which means it is possible to produce liquid water. However, this will require a lot of work... The soil on Mars does not contain all the materials that plants need... Until the planet is able to provide humans with everything they need, regular transports will have to be made from Earth, which will be both expensive and time-consuming. However, the biggest problem might be the low gravity on Mars... low gravity might have a negative effect on our bones, muscles, and cells... What may seem like an attractively mysterious adventure on television might simply turn out to be impractical."}, {"n": 4, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the first subsection?", "options": ["where you might look to find a sea otter", "sea otters", "what distinguishes sea otters from other mammals and marine animals", "the adaptations of sea otters to their habitat"], "passage": "<strong>Read the passage</strong><br><br>Sea Otters. Sea otters are mammals from the weasel family. Their thick, dense fur, the densest fur in the animal kingdom, repels water; they have webbed hind feet with a long fifth digit, facilitating swimming while on their back; and their ears and nostrils close when they are in the water. In order to float effectively, sea otters must be very buoyant; they achieve this because of the air trapped in their fur and their extremely large lung capacity. Sea otters are hunters; they feed on marine invertebrates such as snails, mussels, sea urchins, and mollusks. To hunt their prey, sea otters must dive underwater for long periods of time. They can hold their breath for up to five minutes. They also have pouches of skin under their forelegs, where they store food to bring to the surface. They are the only marine animals capable of lifting and turning over rocks, which they often do to search for prey."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following arguments uses the LEAST valid reasoning?", "options": ["Choosing clothes is one of the main ways people express their personalities.", "When uniforms are required, the students' parents must buy them clothes that can only be worn to school, which is an inefficient use of money.", "If teachers and administrators want to ensure that students wear appropriate clothes to school, a dress code can be enforced.", "Wearing uniforms does not help students learn any better, and instead makes school more boring."], "passage": "<strong>Read the paragraph</strong><br><br>Students should not be required to wear uniforms to school. Choosing clothes is one of the main ways people express their personalities. Wearing uniforms does not help students learn any better and, instead, just makes school more boring. When uniforms are required, the students' parents must buy them clothes that can only be worn to school, which is an inefficient use of money. It is much more cost-effective to buy everyday clothes that can be worn almost anywhere. If teachers and administrators want to ensure that students wear appropriate clothes to school, a dress code can be enforced. Students could then choose what to wear to school within a range of acceptable styles. I recently switched schools. My old school did not require uniforms, but my new school does. I feel more restricted at my current school than I did at my old school, which is making it harder to adjust to the change."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct, according to the passage?", "options": ["McDaniel was a successful actress from the moment she started her career.", "McDaniel was accepted to a minstrel show because of her career as a professional singer.", "McDaniel lost several acting parts because she was better known as a singer and comedian.", "McDaniel won an Oscar for a part she had not believed she would get."], "passage": "<strong>Read the passage</strong><br><br>Hattie McDaniel (1895-1952) was an American stage actress, singer-songwriter, and comedian. Born in Kansas, she was the youngest of thirteen children... At first, Hattie worked with her brother's minstrel show, writing and performing songs, and later, she embarked on a radio career as a professional singer... In 1931, McDaniel moved to Los Angeles and started working as an actress in films. She had several small roles in various films throughout the 1930s, many uncredited. However, towards the end of the 1930s, she was chosen to play a supporting part in Gone with the Wind... The competition for the role had been fierce: Eleanor Roosevelt, who was First Lady, wrote to the producer of the film and asked that her own maid be given the part; McDaniel did not believe she could win, but she still went to the audition wearing an authentic maid's uniform and won the part... McDaniel won the 1939 Academy Award for Best Supporting Actress, the first Afro-American to win an Oscar."}, {"n": 7, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences is an example of metonymy?", "options": ["Aaron is an early bird, but Stacy is a night owl.", "The White House made an announcement.", "When you arrived it was like sunshine.", "The wind blew by, stroking my hair and telling me that everything would be okay."]}, {"n": 8, "type": "text", "section": "Vocabulary in context", "stem": "The word flushed affects the meaning of the sentence by", "options": ["Showing how Keller felt ashamed for not understanding better.", "Describing Keller's feeling of overwhelming emotion.", "Demonstrating Anne Sullivan's skill as a teacher.", "Emphasizing Keller's most important educational breakthrough."], "passage": "<strong>Read the passage</strong><br><br>The following is an excerpt from The Story of My Life, the autobiography of Helen Keller... The morning after my teacher came she led me into her room and gave me a doll... Miss Sullivan slowly spelled into my hand the word \"d-o-l-l.\" I was at once interested in this finger play and tried to imitate it. When I finally succeeded in making the letters correctly I was flushed with childish pleasure and pride. Running downstairs to my mother I held up my hand and made the letters for doll...<br><br>Read the sentence: When I finally succeeded in making the letters correctly I was flushed with childish pleasure and pride."}, {"n": 9, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the passage contains an idiom?", "options": ["It can be hard to wrap your head around the huge size of the universe and the tiny size of an atom.", "You could read thousands of science books and still not get a sense for it.", "A short video called Powers of Ten provides a guided tour of the universe in just eight minutes.", "At the end of the film the viewer feels like both an ant and a giant!"], "passage": "<strong>Read the paragraph</strong><br><br>It can be hard to wrap your head around the huge size of the universe and the tiny size of an atom. You could read hundreds of science books and still not get a sense for it. A short video called Powers of Ten provides a tour of the universe in just eight minutes. The video begins with a couple having a picnic, and then zooms out ten times further every ten seconds until the whole Earth is visible, then the Solar System, then the Milky Way Galaxy, and finally reaching the edge of the known universe. Then, the video quickly zooms back in to the couple and every 10 seconds keeps moving 10 times closer to a human hand until cells are visible, then molecules, and finally atoms. At the end of the video the viewer feels like both an ant and a giant!"}, {"n": 10, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is an antonym of the word discord?", "options": ["agreement", "conflict", "excitement", "boredom"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
