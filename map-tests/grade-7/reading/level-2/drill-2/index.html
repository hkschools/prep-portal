<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Reading (Level 2): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Reading (Level 2): Drill 2</div>
  <h2>MAP Grade 7 Reading</h2>
  <p class="muted">14 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 2): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 2): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-READ-L2-D2";
const BANK_PATH = "map-tests/grade-7/reading/level-2/drill-2/bank.csv";
const TITLE = "MAP Grade 7 Reading (Level 2): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Text structure", "stem": "What is the purpose of the words on top of the two pages (Mandarin, scandal)?", "options": ["to let the reader know the topic of the page", "to let the reader know, alphabetically, what the first word on the page is", "to let the reader know the root word the page focuses on", "to let the reader know the definition of the words"], "passage": "<strong>Read the dictionary pages</strong><br><br>Page 320 - MANDARIN: Mandarin, n. the standard Chinese language. mandate, n. 1. an authoritative order or command. 2. a command or authorization to act in a particular way on a public issue. mandator, n. a person who gives a mandate. mandatory, adj. 1. obligatory, compulsory. 2. containing a command.<br><br>Page 602 - SCANDAL: scandal, n. a disgraceful action; public disgrace. scandal sheet, n. a newspaper that emphasizes a scandal. scandalize, v. to do something immoral or improper that shocks others. scandalous, adj. 1. disgraceful, shocking, shameful. 2. associated with a scandal."}, {"n": 2, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is a synonym of the word consequence?", "options": ["ramification", "publication", "revelation", "finalization"]}, {"n": 3, "type": "text", "section": "Detail & inference", "stem": "What is the conflict in the story?", "options": ["Liam's brother is upset with the boys for interrupting his driving.", "Liam is upset with his friends for not protecting him.", "Tyler is upset with Liam for protecting Theo but not him.", "Tyler is upset with Liam and Theo for throwing a frisbee."], "passage": "<strong>Read the passage</strong><br><br>The three boys were sitting in the back seat of the car. It was mid-summer and Liam's older brother was driving them to the beach. Liam's two friends, Tyler and Theo, were sitting on either side of him. The four of them were laughing and joking when suddenly they heard a very loud noise and their ears rang. The three boys all screamed and threw themselves under the seat, and as they did, Liam wrapped his arm around Theo, protecting him. \"Everything is fine!\" Liam's brother said. \"It was just a car that backfired! Nothing to worry about!\" The three boys got back to their seat slowly, panting and trying to recover from the shock. Tyler looked at the other two and saw Liam with his arm around Theo. At that moment, Liam's brother asked them if they were fine, and when they all confirmed that they were, he started driving again. Tyler was very quiet at the beach and his two friends didn't know what the issue was. After swimming for a while, Liam asked his two friends if they would like to throw a frisbee. Theo agreed but Tyler said he would rather be on his own."}, {"n": 4, "type": "text", "section": "Detail & inference", "stem": "According to the story, which of the following is a quality of the narrator?", "options": ["good listener", "reliable", "likes parties", "brave"], "passage": "<strong>Read the passage</strong><br><br>I had been an admirer of Amy Greenhouse's music for years and years before I finally got the chance to meet her. I had gone to all her concerts. Every day, I listened to all her songs on my iPod. When I listened to her voice, I felt like the sky had opened and I was entering heaven, it was so good. I read every single article about her; I watched interviews with her; I hung her posters in my room. I would have liked nothing better than to meet her and tell her how much I loved her and her voice. Last August was my best friend Annie's birthday. She had planned a big party and invited all our friends. I had already bought her a present and promised to be in charge of the music during the party, when I found out that Amy Greenhouse was coming to town and giving a concert on the very same night. I begged Annie to change the date of the party, but unfortunately, her parents had already booked a caterer and it was impossible. Amy Greenhouse was my hero and I wanted to see her more than anything, but I knew that if I wouldn't go to the party, no one would help with the music and the party would be ruined. It was a very difficult decision, but eventually I decided that friendship was more important and I would go to Annie's party instead of the concert."}, {"n": 5, "type": "text", "section": "Vocabulary in context", "stem": "Based on context, what is the meaning of the word module?", "options": ["an individual section of a larger spacecraft", "a spacecraft used to return astronauts to Earth", "scientific experiments conducted in outer space", "a small robotic satellite used for multiple purposes"], "passage": "<strong>Read the passage</strong><br><br>The International Space Station<br><br>1 The International Space Station is a large spacecraft in orbit around Earth. It serves as a home where crews of astronauts and cosmonauts live. The space station is also a unique science laboratory. Several nations worked together to build and use the space station. The space station is made of parts that were assembled in space by astronauts. It orbits Earth at an average altitude of approximately 250 miles. It travels at 17,500 mph. This means it orbits Earth every 90 minutes.<br><br>2 The International Space Station was assembled gradually, piece-by-piece. In November 1998, a Russian rocket launched the Russian Zarya control module. About two weeks later, the space shuttle Endeavour met Zarya in orbit. The space shuttle was carrying the U.S. Unity node. The crew attached the Unity node to Zarya. Over the next two years, more modules were attached to Unity to prepare the station for its first crew.<br><br>Read the sentence: A Russian rocket launched the Russian Zarya control module."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "Which of the following is likely, according to the passage?", "options": ["Don McPherson is not color-blind.", "More men have diabetes than women.", "Don McPherson's glasses will work at night, too.", "When the rod cells are malfunctional, a person will not see colors at all."], "passage": "<strong>Read the passage</strong><br><br>The human eye has two types of cells responsible for vision: rod cells, which are responsible for night vision, and cone cells, which are responsible for color vision and function best in bright light. Therefore, it is much more difficult to see color in the darkness. There are three types of cone cells, each type responsible for a different range of colors. Color blindness is the disability to distinguish between all or specific colors... There is no cure for color blindness. However, there are special glasses that allow people with red-green color blindness to see colors in bright light. The glasses were originally developed to help surgeons see more clearly in the operating room. The fact that they could help color-blind people, as well, was discovered by chance when scientist Don McPherson was wearing the glasses while playing ultimate Frisbee with his friend. McPherson's friend asked to borrow his eyewear, and as he put them on, he was amazed by his sudden ability to see color. McPherson then went ahead to perform research on color blindness, and after some small adjustments, began to sell the glasses to the public."}, {"n": 7, "type": "text", "section": "Detail & inference", "stem": "Which of the following can be said about Emma's character, according to the story?", "options": ["She is a very good sheriff.", "She is a devoted mother.", "She appreciates good work.", "She notices small details."], "passage": "<strong>Read the passage</strong><br><br>Emma was a sheriff in a small town, and her son Henry liked to help her solve crimes. Usually, she let him help her, but sometimes she was exasperated with him. One night, Emma was working on a particularly difficult case... Henry hovered around and asked so many questions she yelled at him to go home. Upset and depressed, Henry left the police station and headed home. On the way home, he noticed he was still holding one picture. He looked closely at it. A moment later, he was running full-speed back to the police station. He burst into his mother's office... \"Mom, do you see this man's eyes? Do you see how red they are? This picture was taken at night using a flash. And do you see that building behind them? This is not the park. This is the area behind the school.\" Emma looked at the picture, then at her son. \"Thank you so much, Henry!\" she said... \"And I never would have realized it if it weren't for you!\""}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "Which of the following is the most logical, according to the passage?", "options": ["It is impossible to use a hot air balloon to get from one place to a specific destination.", "Sky lanterns are typically made of paper because it is flammable and causes fire hazards.", "When the source of heat under the balloon goes out, the balloon sinks back to the ground.", "A hot air balloon flies because air passes through its envelope."], "passage": "<strong>Read the passage</strong><br><br>The hot air balloon was the first successful flight technology that carried a human. The first hot air balloon was launched in France in 1783. A hot air balloon consists of a fabric bag called an envelope, usually made of nylon or Dacron. To make it impassable to air, the fabric is coated with a sealer, such as silicone or polyurethane. Since warm air is lighter than cold air, it rises above cold air. This is why the envelope is filled with a gas warmer than the air outside, which rises in the air and enables the balloon to float. Attached underneath the envelope is a basket that carries passengers and a source of heat, like a burner, that fills the envelope with warm gas and keeps it warm throughout the flight. It is possible to propel the hot air balloon during the flight in the desired direction. A very small hot air balloon is called a sky lantern and is usually made of paper."}, {"n": 9, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the phrase \"play devil's advocate\"?", "options": ["teach a class", "give someone courage to speak in front of many people", "present counter arguments when strongly disagreeing with a cause", "present counter arguments to a cause, even while agreeing with it"], "passage": "<strong>Read the paragraph</strong><br><br>My friends and I organized a petition for a Black History class at our school. Most students signed, and when the principal saw the petition, he invited me to argue our cause in front of the school board. I was nervous about what they would ask me and asked my friend Laura, who had organized the petition with me, to help me practice. She played devil's advocate and I answered her flawlessly. Thanks to her, I was much less nervous when I stood in front of the board; I spoke confidently and did not forget a single detail."}, {"n": 10, "type": "text", "section": "Detail & inference", "stem": "Which of the following is a conclusion that can be made from the passage?", "options": ["Eyespots are the best way to avoid deathly attacks by predators.", "Predators can never distinguish between eyespots and true eyes.", "Eyespots are more efficient if found on both the left and right sides of the body.", "All fish have eyespots, but in some fish species, they cannot be seen."], "passage": "<strong>Read the passage</strong><br><br>When a predator attacks its prey, it usually looks for the head first and starts the attack from there, because it can cause more harm by attacking the head area than the tail area. When the attack is quick, as most attacks are, the predator has little time to study its prey and see exactly where the head is, so it looks for the eyes, which are typically prominent and found on the head, and directs its attack to that area. Many animals that live in danger of getting eaten have diversion mechanisms. A diversion mechanism is a way of deceiving the predator by giving it false messages. One way to do this is to divert the attack to the tail area, instead of the more vulnerable head area. The most efficient way of doing this is showing the predator an eyespot, which is a marking that looks like an eye but isn't. Eyespots are common among different species of fish. Many of them, such as the butterflyfish, not only have an eyespot on the side of their body near their tail that is much larger than their true eye, but their true eye is also hidden under a vertical line."}, {"n": 11, "type": "text", "section": "Author's craft & structure", "stem": "Which statement is true about the two poems?", "options": ["Both poems use snow as a motif but use it to express different emotions.", "Both poems contrast fire with snow.", "Both poems express sorrow for losing a loved one.", "Both poems use snow as a motif, but the first poem has a more negative mood than the second poem."], "passage": "<strong>Read the two poems</strong><br><br>Snow Song by Frank Dempster Sherman: Over valley, over hill, / Hark, the shepherd piping shrill! ... Blow, Wind, blow: / Weird melodies you play, / Following your flocks that go / Across the world to-day. ... Blow, Wind, blow / Upon your pipes of joy: / All your sheep the flakes of snow / And you their shepherd boy! (The second poem uses snow imagery but with a melancholy mood, referring to someone in the past tense, mentioning fire and a \"melancholy sound.\")"}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "How does the setting outlined in the passage contribute to the narrator's feeling as it is described in the final paragraph?", "options": ["The red room is formidable and intimidating and therefore the narrator is afraid.", "The red room is bright and cheerful and therefore the narrator feels relaxed and happy.", "The red room is detached from the rest of the house and therefore the narrator feels lonely.", "The red room is cold and rarely visited by anyone and therefore the narrator is irritated."], "passage": "<strong>Read the passage</strong><br><br>The red-room was a square chamber, very seldom slept in... yet it was one of the largest and stateliest chambers in the mansion. A bed supported on massive pillars of mahogany, hung with curtains of deep red damask, stood out like a tabernacle in the center; the two large windows, with their blinds always drawn down, were half shrouded in festoons and falls of similar drapery, the carpet was red... This room was chill, because it seldom had a fire; it was silent, because remote from the nursery and kitchen; solemn, because it was known to be so seldom entered... Shaking my hair from my eyes, I lifted my head and tried to look boldly round the dark room; at this moment a light gleamed on the wall... I thought the swift darting beam was a herald of some coming vision from another world. My heart beat thick, my head grew hot; a sound filled my ears, which I deemed the rushing of wings; something seemed near me. (Adapted from \"Jane Eyre\" by Charlotte Bronte)"}, {"n": 13, "type": "text", "section": "Detail & inference", "stem": "Which one of the following statements in the passage states an opinion?", "options": ["Organisms need food to be able to keep their bodies working properly.", "Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty.", "The question of whether or not large amounts of fat are healthy is controversial.", "Fat is found in two main forms: saturated and unsaturated. Unsaturated fats are the healthier option."], "passage": "<strong>Read the passage</strong><br><br>Those who choose to study nutrition focus on the scientific side of the food we consume. Nutrition provides the cells of an organism with food. Organisms need food to be able to keep their bodies working properly... The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water. Carbohydrates, which are complex structures of sugar units, constitute a large part of common foods such as bread, rice, potatoes, fruit, and vegetables. Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty... Many people think consuming a lot of fat is always unhealthy. However, the question of whether or not large amounts of fat are healthy is controversial. Fat is found in two main forms: saturated and unsaturated. Unsaturated fats are the healthier option."}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "Who does the phrase \"my gunpowdery chief\" refer to?", "options": ["the speaker", "Mr. Bixby", "the speaker's father", "the speaker's brain"], "passage": "<strong>Read the passage</strong><br><br>But of course my complacency could hardly get start enough to lift my nose a trifle into the air, before Mr. Bixby would think of something to fetch it down again. One day he turned on me suddenly with this settler- \"What is the shape of Walnut Bend?\" He might as well have asked me my grandmother's opinion of protoplasm. I reflected respectfully, and then said I didn't know it had any particular shape. My gunpowdery chief went off with a bang, of course, and then went on loading and firing until he was out of adjectives. I had learned long ago that he only carried just so many rounds of ammunition, and was sure to subside into a very placable and even remorseful old smooth-bore as soon as they were all gone... By and by he said- \"My boy, you've got to know the shape of the river perfectly.\" (\"Life on the Mississippi\", Mark Twain)"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
