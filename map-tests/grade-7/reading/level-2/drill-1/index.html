<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 7 Reading (Level 2): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 7 Reading (Level 2): Drill 1</div>
  <h2>MAP Grade 7 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 2): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 7 Reading (Level 2): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G7-READ-L2-D1";
const BANK_PATH = "map-tests/grade-7/reading/level-2/drill-1/bank.csv";
const TITLE = "MAP Grade 7 Reading (Level 2): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Detail & inference", "stem": "When should the dry ingredients be added to the wet mixture?", "options": ["in the beginning, when they are all mixed together", "after the butter comes to a boil", "after the wet mixture becomes shiny and smooth", "just before the mixture is stirred and scraped into the pan"], "passage": "<strong>Read the passage</strong><br><br>Brownie cake recipe: 4 oz. unsalted butter; 3 oz. flour; 2 oz. cocoa powder; 1/2 teaspoon salt; 1/2 teaspoon baking powder; 7 oz. granulated sugar; 2 large eggs; 2 teaspoon vanilla extract. Instructions: 1. Preheat the oven to 350 F. Line a cake pan with parchment and spray well with nonstick cooking spray. Whisk together all the dry ingredients-the flour, cocoa powder, salt, and baking powder-in a small bowl, and set it aside for the moment. 2. Cube the butter and place it in a medium saucepan over medium-low heat. Stir occasionally as the butter melts. Add the sugar and stir until it all melts. 3. Before the mixture comes to a boil, remove the pan from the heat and let it cool a little. Once it has cooled, add one egg at a time, and whisk well in-between. The initially grainy mixture should become shiny and smooth as you add the eggs. Add the vanilla and whisk well once again. Now add the ingredients from the bowl you set aside earlier and stir them in with a spatula. 4. Scrape the brownie batter into the prepared pan and bake it for 24 minutes until a toothpick comes out with just a few moist crumbs attached. Cool the brownie cake completely before proceeding."}, {"n": 2, "type": "text", "section": "Author's craft & structure", "stem": "How does the author pull the reader into the text?", "options": ["by discussing a topic that everyone is familiar with", "by writing in second person", "by stating that fleas can live on human bodies", "by describing fleas"], "passage": "<strong>Read the passage</strong><br><br>Fleas are small flightless insects that live as parasites on animals' bodies. They typically live on fur or feathers, their strong claws preventing them from being dislodged. They feed on the blood of their host, which might be a dog, a cat, a bird, a reptile, or a human, but a flea can live more than a hundred days without eating. Imagine not eating for a hundred days! The female flea consumes 15 times her own body weight in blood every day; imagine eating 1300 pounds of pasta in one day! One final and amazing fact is that fleas can jump up to eight inches, which is approximately 200 times their own height. That is the same as you jumping to the top of the Empire State Building."}, {"n": 3, "type": "text", "section": "Vocabulary in context", "stem": "Which possible meanings does the word terrific have in the sentence?", "options": ["long or short", "worrying or relaxing", "marvelous or delicious", "intense or frightful"], "passage": "<strong>Read the sentence</strong><br><br>Owing to a terrific storm, the captain of the ship had to postpone his departure."}, {"n": 4, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the story?", "options": ["Landon does not like math.", "Landon gets help from an unexpected source.", "Robin comes to a decision.", "Robin sacrifices his only free time to help Landon."], "passage": "<strong>Read the passage</strong><br><br>Landon had a very important math test. He usually got decent grades in this subject; however, in the last few months it was getting more and more difficult, and this upcoming test was scary. He sat down every night and tried to understand what the teacher had done in class, but it was getting more complicated and he started to realize that he wouldn't be able to solve the problem on his own. Three days before the test, Landon went to the playground after school to watch his little sister and saw his friend Robin. Robin was a student at another school in town, and they had met at summer camp. Robin came over to talk to Landon and asked why he was looking so glum. Landon told him about his fear of the upcoming math test. \"Not to worry,\" said Robin. \"Let's go to your house, and I'll teach you. We had a test about these things last week and I got an A.\" ... Robin proved himself to be a marvelous teacher. When he went to bed that night, Landon felt more confident about the test. The next day, Landon was surprised to find Robin at his doorstep after school. \"I came because we didn't finish yesterday,\" Robin explained... They covered all the material for the test together, and when Landon sat down in class on the day of the test, he knew he was ready."}, {"n": 5, "type": "text", "section": "Detail & inference", "stem": "Which of the following sentences describes the sequence of events in the passage?", "options": ["Dutch settlers hunted all the dodos, leading to their extinction.", "The dodo went extinct because it could not fly.", "The dodo went extinct before the Dutch settlers came to Mauritius.", "The dodo went extinct because of hunting and predators eating its eggs."], "passage": "<strong>Read the passage</strong><br><br>The dodo was a bird that lived on the island of Mauritius until the seventeenth century. Nowadays, it is extinct. It was a large, flightless bird, with a long beak and gray plumage. It had no natural predators on the island. When Dutch settlers came to Mauritius in the sixteenth century, they hunted numerous dodos and ate their meat. They also introduced animals that were new to the island, including dogs, cats, macaques, and pigs. Some of those animals escaped captivity and became feral, and they began plundering dodo nests and eating their eggs. Since the dodo only laid one egg per season, the number of eggs decreased quickly and the dodo population declined drastically, until the dodo went extinct in the middle of the seventeenth century."}, {"n": 6, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences is an example of hyperbole?", "options": ["I have a million things to do.", "She was shaking like a leaf.", "She was busy from the moment we arrived until the moment we left.", "Time is money."], "passage": "<strong>Read the passage</strong><br><br>Last week I visited my mother's office. She works as a CEO of a big company. She was busy from the moment we arrived until the moment we left. She ran from meeting to meeting, wrote dozens of e-mails, and answered more phone calls than I could possibly count. The other workers kept going in and out of her office and asking her questions. One of the workers had lost an important file and came to apologize, shaking like a leaf. My mother said quietly, \"I have a million things to do now and I have no time to find a solution. Please ask your colleagues for assistance.\" ... \"Panicking would not have helped,\" my mother replied. \"I was calm so they could keep calm and look for the file in peace. You can't be useful when you're panicking.\" \"But weren't you worried?\" I asked her. \"Of course I was,\" my mother answered. \"But time is money and I don't allow myself to get emotional.\""}, {"n": 7, "type": "text", "section": "Detail & inference", "stem": "Which of the following is a difference between Beever's sidewalk drawings and Boston's sidewalk poetry, according to the passage?", "options": ["Beever's sidewalk drawings were created by an individual, while the sidewalk poetry was initiated by a collaboration.", "Beever's sidewalk drawings were created with chalks, while the sidewalk poetry was created with permanent paint.", "Beever's sidewalk drawings never feature poems.", "None of Beever's sidewalk drawings were painted on sidewalks in Boston."], "passage": "<strong>Read the passage</strong><br><br>Sidewalks exist on almost every street, and though most are plain-looking, some are decorated. Sidewalk chalk art is found in many big cities in Europe and North and South America. One famous sidewalk chalk artist is Julian Beever, who is originally from the UK and has been creating drawings on sidewalks around the world since the mid-1990s. His drawings create the illusion of three dimensions: some feature holes in the sidewalk, that look so real that pedestrians walk around them instead of crossing them. Others feature extremely realistic swimming pools, dungeons, and scenes from famous movies. Boston sidewalks, another example of sidewalk art, feature a selection of poems that can only be seen when it rains. The poems were painted with a special paint that only appears when covered by fluids. The city of Boston and Mass Poetry, a non-profit organization, formed a collaboration called \"Raining Poetry\" and began painting the poems on the sidewalks in April 2016 in honor of National Poetry Month."}, {"n": 8, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the word \"beseech\"?", "options": ["demand", "beg", "steal", "make"], "passage": "<strong>Read the paragraph</strong><br><br>Having spent all his money on a new stereo system for his car, Jonah could not pay his rent. Full of remorse, he headed to his parents' house and beseeched them to give him money for rent. \"This is the sixth time this year, Jonah,\" said his mother, \"and every time you sound sadder and sadder. Rent should be the first thing you pay, not the last. I do feel sorry for you though. Please do not cry over it; just be smarter next time.\""}, {"n": 9, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words can be used to fill the blank in the best way?", "options": ["funny", "witty", "amusing", "hilarious"], "passage": "<strong>Read the paragraph</strong><br><br>Her clever jokes and her quick tongue always get her out of trouble. She is extremely ______ and everyone who knows her talks about her puns and play-on-words."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "What does the storm in the story symbolize?", "options": ["sadness", "a surprise", "danger", "anger"], "passage": "<strong>Read the passage</strong><br><br>It was late afternoon, and three young children were walking in the forest. The high trees were full of leaves and were blocking their view of the sky, but they were able to see the way. The day was hot-so hot that beads of sweat were running down the children's foreheads and cheeks, and their clothes were sticking to their backs. Small birds were flying around and chirping, but as the children kept walking, they could hear fewer and fewer birds. The trees were growing further apart now, and they could see the sky. Suddenly, they came to a clearing. They looked around them, unsure where to go next. Then, before they could reach a decision, they heard thunder in the distance and the sky above them turned dark almost at once. They looked up and saw clouds gathering up quickly-a storm was coming. Heavy raindrops started to fall all around them and the thunder grew louder and closer."}, {"n": 11, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences is an example that the author is biased?", "options": ["It is a recessive trait, which means you have to get the trait from both your parents in order to have it.", "If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world.", "You might be interested to know that red hair used to be considered an evil trait.", "Red-haired people were persecuted because they were believed to be vampires."], "passage": "<strong>Read the passage</strong><br><br>Red hair is uncommon, occurring in about 1%-2% of people. It is a recessive trait, which means you have to get the trait from both your parents in order to have it. If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world. Then again, you still may not have red hair. You might be interested to know that red hair used to be considered an evil trait. Red-haired people were persecuted by people who believed they were vampires."}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "How does the word \"fear\" in the last paragraph help the reader understand the main idea of the passage?", "options": ["It conveys how difficult it is to own a boulangerie in France.", "It conveys how important it is to have boulangeries open in August.", "It conveys how the French take the business of boulangeries very seriously.", "It conveys how French people feel about the ingredients of French bread."], "passage": "<strong>Read the passage</strong><br><br>Owning a bakery in France, or a boulangerie, to use the French word, is no piece of cake! There are very strict laws in France regarding boulangeries and what they are allowed or not allowed to do, and for a good reason: The average Frenchman eats half a baguette a day and buys at least one baguette every day. A baguette that is fresh and crisp today will be hard as nails tomorrow. Therefore, having a boulangerie nearby is of the essence to most Frenchmen. France has the highest density of bakeries in the world. The profession of a boulanger is highly regulated. Not every bakery is a boulangerie; to be called a boulangerie, bread must be made on the premises... In the past, laws were passed to ensure that every neighborhood would have access to bread 365 days a year. A prefectural decree dating to 1790 stated that all boulangeries had to report to the authorities when they planned to take a vacation or else face a fine. The authorities allowed half of the boulangeries to close in July and half in August, thus ensuring access to bread throughout the year. However, the decree was scrapped in 2015. Nowadays, people in France fear they will not be able to get a good baguette in August, especially not a good one from a real boulangerie, as August is the most popular month of the year to go on vacation."}, {"n": 13, "type": "text", "section": "Main idea & theme", "stem": "What is the theme of the passage?", "options": ["Nature can cheer you up.", "Locking someone in a castle is wrong.", "Darkness takes over.", "Loneliness is difficult."], "passage": "<strong>Read the passage</strong><br><br>Ferdinand was sitting in the dark castle, looking outside the small window. The view, which might have been beautiful to a stranger, only depressed him. Everywhere he looked, he could only see trees and a big river. There were no birds, no houses, not a soul in sight. The castle, too, was abandoned and so silent that Ferdinand could hear his own breaths, slow and hollow. Ferdinand sighed as the sky darkened; clouds were gathering, and the air was filled with the smell of rain, which did nothing to comfort his forlorn and desperate soul. A storm began suddenly, and his vision was blurred in the heavy sheets of rain. Ferdinand cried, but there was no one to hear him."}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is used in the passage to create a mental image of the city of Genoa?", "options": ["personification", "simile", "irony", "alliteration"], "passage": "<strong>Read the paragraph</strong><br><br>The city of Genoa (Italian: Genova) is located in the north of Italy and is the sixth-largest city in Italy. Its uniqueness becomes evident when you start wandering around its streets. As you walk along the port, the smell of fresh fish surrounds you, nearly engulfing the strong smell of the ocean. The ocean is particularly beautiful in this city, with the water waltzing in the light wind and glowing in the evening sun with a unique hue. As you keep walking, you can hear the whisper of the waves on one side and the musical, loud Italian on the other; yes, the Genovese are warm, kind, and loud! Genoa is nicknamed \"The Vertical Town\" because of its many narrow, steep stairways in the middle of the street, many of which can only be climbed by one person at a time."}, {"n": 15, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following is closest in meaning to the word \"fallacy\"?", "options": ["rumor", "idea", "misconception", "belief"], "passage": "<strong>Read the paragraph</strong><br><br>Since the city hall decided to close the youth center, local parents have collected donations to keep it open and organized a marathon to raise funds. One parent told the reporters who came to the marathon, \"The notion that the youth center does not benefit our youngsters is a fallacy.\""}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
