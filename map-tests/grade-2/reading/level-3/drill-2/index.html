king to a routine. Once you go to sleep every night at a fixed time, your body gets used to it and it is easier to fall asleep. The second one is exercising during the day. Playing ball, swimming, or riding a bicycle can help you fall asleep faster. If you follow these two rules, you are likely to be more active and concentrated during the day."},{"n":7,"type":"text","section":"Reading","stem":"What is the setting of this passage?","options":["a hiking path","a narrow mountain road","a stump of tree over a river","a wide bridge over a river"],"passage":"<strong>Read the story</strong><br>One morning, two mountain goats started to cross a very narrow log over a river. They started on opposite sides and met in the middle. They both thought they had the right of way.<br><br>The first goat said to the second goat, \"You have to return to your side so I can cross. There is not enough room for both of us to cross each other!\" There would not have been enough room for even two little chipmunks to cross the log.<br><br>The second goat was just as stubborn, and said, \"Why should I have to go back? You go back!\" The first goat said, \"If you don't go back then I will fight you!\" Risking both their lives, they started to fight, and they both fell into the river and were swept away by the current."},{"n":8,"type":"text","section":"Reading","stem":"In which sentence does the writer state what HE THINKS about the Loch Ness Monster?","options":["Sentence 1","Sentence 2","Sentence 3","Sentence 4"],"passage":"<strong>Read the passage</strong><br>(1) The Loch Ness Monster, or Nessie, is a creature that is reported to live in Loch Ness, a lake in the highlands of Scotland. (2) In the last 100 years, hundreds of people claimed to have seen the monster, but it is impossible they actually saw it. (3) There have been reports of a lake monster existing in Loch Ness since 565 AD. (4) The first ever photograph of the Loch Ness Monster was taken in 1933 and was published in the Daily Express newspaper. (5) Actual evidence that proves the Monster's existence has never been found, so, in the meantime, it remains a myth."},{"n":9,"type":"text","section":"Reading","stem":"Based on the information in the paragraph, what is the meaning of the word \"chemical\"?","options":["yellow cheese","type of material","leaves of plants","body scan"],"passage":"<strong>Read the paragraph and the dictionary definitions</strong><br>Mr. Garcia handed his students several test tubes with liquid chemicals during science class. He told his students to pour the contents of the test tubes into a large bowl and watch how the mixture changed its color from transparent to yellow.<br><br>Dictionary:<br>checkup (chek-uhp) n. a comprehensive physical examination<br>cheddar (ched-er) n. a hard, smooth-textured cheese, varying in color from white to deep yellow<br>chemical (kem-i-kuh l) n. a substance produced by or used in a chemical process<br>cherimoya (cher-uh-moi-uh) n. a tropical American tree, having leaves with velvety, hairy undersides"},{"n":10,"type":"text","section":"Reading","stem":"How do readers learn about Sebastian?","options":["from descriptions of Sebastian's feelings","from what other characters say about Sebastian","from what Sebastian says to others","from descriptions of what Sebastian looks like"],"passage":"<strong>Read the passage</strong><br>Coach Clarke named two students as team captains and asked them to pick students for their dodgeball teams. When there were only a dozen students left, Sebastian cried, \"If you don't pick me next, I'm not going to play at all!\" Jill named Sebastian next and he joined her team, cheering.<br><br>Ten minutes into the game, Steve accidentally stepped on Sebastian's toes trying to catch the ball before it rolled over to the other team's field. \"Foul!\" yelled Sebastian, even though Steve was on his team. \"Steve shouldn't play anymore, Coach!\" he demanded of Coach Clarke. \"He stepped on my toes on purpose!\" Steve apologized to Sebastian repeatedly and promised Coach Clarke it was an accident. Coach Clarke told Sebastian she would allow Steve to keep playing. Sebastian stomped his foot and turned to Steve. \"I don't like playing with you! I wish you knew how to play fair and not ruin the game for everybody else.\""},{"n":11,"type":"text","section":"Reading","stem":"What word BEST describes how Shana feels at the end of the passage?","options":["proud","tired","excited","disappointed"],"passage":"<strong>Read the passage</strong><br>Shana spent all of her weekend studying for her English test. She asked her brother to help her solve the practice test that was handed out on Thursday. She invited a friend over to review all the homework assignments they completed during the semester. She even read all of the punctuation rules in the textbook twice. When the teacher handed the marked tests back, she smiled at Shana and said, \"I am so proud of you! The progress you made in the last couple of months is really impressive.\" Shana looked at her test. She was hoping for a higher mark."},{"n":12,"type":"text","section":"Reading","stem":"Which rule outlines what being late to gym class will result in?","options":["1.2","1.3","2.3","3.1"],"passage":"<strong>Review this appendix from a student handbook</strong><br>Appendix 4: Physical Education Rules<br><br>Rule 1: Attendance<br>1.1 - Students must not miss more than three classes in a semester.<br>1.2 - A student who is more than five minutes late will not be allowed to join the class and will be marked as absent.<br>1.3 - A student who is restricted from exercising under doctor's orders must present a note and remain at the gym during class.<br>1.4 - Class will take place at the court outside whenever the weather permits.<br><br>Rule 2: Equipment<br>2.1 - Students must wear athletic shoes only.<br>2.2 - Students must pull back long hair.<br>2.3 - Students must use equipment correctly and with care.<br><br>Rule 3: Behavior<br>3.1 - Students must remain seated at the beginning of the class and follow the teacher's directions.<br>3.2 - There will be no fighting or cursing during class.<br>3.3 - There will be no eating or chewing gum during class."},{"n":13,"type":"text","section":"Reading","stem":"According to the sentences, what do all these animals have in common?","options":["They all live at the Arctic.","They all eat other animals.","They are all able to hide themselves.","They all share similar fur colors."],"passage":"<strong>Read the sentences</strong><br>1. Polar bears have white fur that can blend into the white snow of the Arctic.<br>2. Whether their fur is spotted or black, leopards can mask themselves in order to attack their prey by surprise.<br>3. In order to hide, bark bugs appear to be part of the tree itself."},{"n":14,"type":"text","section":"Reading","stem":"What was Lilly's problem?","options":["She did not score any points.","She is not a good basketball player.","Isabel did not let her play.","Isabel's action may cause the team to lose."],"passage":"<strong>Read the passage</strong><br>Isabel really wanted to try and shoot for the hoop once. Would Lilly ever let go of the ball and let others play?<br>\"Three points!\" Lilly shouted as she shot through the hoop once again. \"I scored 24 points in total!\"<br>\"Switch!\" yelled Isabel, making Lilly trip and lose the ball.<br>\"We are on the same team!\" Lilly complained. \"Now the other team will beat us!\""},{"n":15,"type":"text","section":"Reading","stem":"Which of the following is the MISSING step in the sequence of events?","options":["Joel's sister swimming in the sea","Joel's parents packing the food","Joel finishing his popsicle","Joel's father returning with popsicles"],"passage":"<strong>Read the story</strong><br>Joel and his parents spent the afternoon at the beach. They spread a colorful blanket on the sand and had a picnic. After they finished eating, Joel started building sand castles. A young boy passing by asked if he could join him. Joel agreed, and they spent the next half hour turning the castles into a sand kingdom. When they were done, Joel looked up and realized that his father was not there. \"Where is Dad?\" he asked his mother. \"Thanks, Dad!\" Joel beamed, taking the popsicle with a big smile."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
