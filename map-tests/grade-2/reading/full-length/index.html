.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}

button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}

e":"text","section":"Reading","stem":"What is the internal conflict in this passage?","options":["whether to approach the group or not","whether to start a book club or a sports club","whether to move to a different seat","whether the children noticed Assaf"],"passage":"<strong>The First Day</strong><br>It was the first day of school. The first day of school can be a stressful experience to anyone, but for Assaf it was especially so. He had just moved into the neighborhood with his family, and didn't know any of the children at school.<br><br>He arrived at school a little early so he could find his classroom. When he got there, he sat in an empty seat in the corner. There was a group of children sitting together at the other end of the class. They looked like they already knew each other. They were laughing and talking, and it looked like they didn't notice him. \"Should I join them?\" Assaf wondered. \"Would they welcome me into their group? What if they aren't nice to me, or ignore me?\"<br><br>As Assaf was thinking about all this, he heard an argument start in the group.<br>\"No, I think we should start a sports club!\"<br>\"But I think a book club would be so cool!\""},{"n":5,"type":"text","section":"Reading","stem":"Based on the index, in which of the following pages would you find a Roald Dahl story?","options":["page 171","page 102","page 97","page 125"],"passage":"<strong>Index</strong><br>Burnett, Frances: pages 1-65<br>Cooper, Susan Mary: pages 125-162<br>Dahl, Roald: pages 99-124<br>Grahame, Kenneth: pages 163-195<br>Nesbit, Edith: pages 66-98"},{"n":6,"type":"text","section":"Reading","stem":"What did they say to Audrey next?","options":["\"We came to tell you the party has been cancelled.\"","\"We are thinking of holding a party and would like your help in planning it.\"","\"We came to take you to the party. We forgot to send you the invitation!\"","\"We came to ask if we can do a class project with you.\""],"passage":"<strong>Audrey's Party</strong><br>Audrey is a special girl. She doesn't walk like the other children in her class. She has a wheelchair that helps her move around. Audrey loves studying, taking her dog on walks, and playing wheelchair tennis.<br><br>One day, Audrey heard that some children in her class were organizing a party at the park. They were sending out invitations by email, but Audrey didn't get hers. She checked her email again and again, but the invitation hadn't arrived.<br><br>One time, Audrey passed by a group of children from class who were standing in the corridor talking. When they saw her, they suddenly went quiet. She was just able to hear one of them say, \"...so don't invite her!\" before they stopped talking. She knew they were talking about her, deciding not to invite her to the party, and was deeply hurt. She didn't hear one of the children say, \"I know what to do! Let's build a bridge over the stream so she can get to the party!\"<br><br>The day of the party came and Audrey's invitation still hadn't arrived. She was sitting by the window with tears in her eyes and pain in her heart. She knew the party had already started. Suddenly, she saw two of her classmates walking up the driveway! They knocked on the door and she heard her mother saying, \"Hi, come in. Audrey is in the living room.\" The children came into the room and said, \"Hi Audrey...\""},{"n":7,"type":"text","section":"Reading","stem":"What is the purpose of this passage?","options":["to inform","to entertain","to criticize","to persuade"],"passage":"<strong>The Theremin</strong><br>The theremin is an electronic musical instrument named after Russian physicist Leon Theremin, who patented it in 1928. Players can control the sound the theremin makes, and its volume, by waving their hands over the instrument without touching it. Since the theremin produces sounds that are a bit spooky, it has been used in movies to create an eerie mood."},{"n":8,"type":"text","section":"Reading","stem":"Which of these sentences is correct?","options":["There were few vegetables left, so the guests enjoyed the food.","Mrs. Price was disappointed, so Dylan brought only five tomatoes and two carrots.","There were few vegetables left, so Mrs. Price decided to cook a different dish.","Mrs. Price loved to plant vegetables, so she thanked Dylan for his effort."],"passage":"<strong>The Garden</strong><br>All kinds of vegetables grow in the Prices' garden. Mrs. Price, Dylan's mother, loves to plant vegetables there and cook them once they are ripe. Today she sent Dylan to pick some vegetables for a dinner party. She asked him to get four carrots, four tomatoes, three cucumbers, and an onion. But when Dylan came back from the garden, he brought only three tomatoes and two carrots. That was all that was left in the garden. Mrs. Price was a little disappointed, but thanked Dylan for his effort. She decided to cook a different dish than planned. Mrs. Price and Dylan cooked and set the table together. When the guests arrived, they enjoyed the food and said it was very tasty."},{"n":9,"type":"text","section":"Reading","stem":"What type of text is this?","options":["a story that could happen","a fairy tale","a fable","a poem"],"passage":"<strong>The Tooth Fairy</strong><br>\"But I don't want to go to bed yet!\" wailed Noah. \"I want to stay up and play with my new game!\" Noah was the youngest child in his family. He was already allowed to stay up later than his brother and sister did when they were his age. \"If you don't go to bed, the tooth fairy won't be able to come visit you,\" said Noah's mother. Once Noah heard that, he ran straight to bed. He checked under his pillow to make sure his tooth was still there.<br><br>Finally, Noah fell asleep. When he woke up, it was still dark outside. He saw a shadow on the wall and he felt someone reaching under his pillow. Noah shut his eyes very tightly so that the tooth fairy would still give him his present. He actually fell back to sleep before he even felt his present.<br><br>In the morning, Noah woke up very excited! He felt under his pillow, and there he found a new toy racecar! He hadn't seen the tooth fairy, but he could still smell her perfume. It smelled just like his mother's perfume."},{"n":10,"type":"text","section":"Reading","stem":"According to the passage, what changed the way scientists looked at the world?","options":["the inventions based on the Theory of Relativity","Albert Einstein's Theory of Relativity","Albert Einstein's energy formula","Albert Einstein's death in 1955"],"passage":"<strong>Albert Einstein</strong><br>Albert Einstein was born on March 14, 1879, in Germany. He became a scientist in the early years of the 20th century. Einstein had many important discoveries and theories as a scientist. He published the formula that calculates energy. His most famous theory is the Theory of Relativity. This theory changed the way scientists looked at the world, and many inventions that came afterwards were based on this theory. Einstein immigrated to the U.S. in 1933 and became a U.S. citizen in 1940. He died on April 18, 1955, in New Jersey."},{"n":11,"type":"text","section":"Reading","stem":"Who probably locked the door?","options":["the acrobat","the rubber girl","the clown","the juggler"],"passage":"<strong>The Locked Door</strong><br>The acrobat tried to open the door to the circus stage, but it was stuck. All the circus performers stopped what they were doing. The rubber girl cried, \"Someone locked the door!\" Everyone started blaming one another. The juggler said, \"We have an audience waiting for us. We have to find a way to open the door!\" Everyone ran to the door and tried to push it open.<br><br>Then, the clown said, \"Make way, make way! I'll open the door!\" Then, the clown asked everyone to move aside. He pushed the door again and again, but it did not open. Then, he secretly pulled a shiny object out of his huge shoe. The door opened when he pushed it again. Everyone cheered and hugged the clown. They thanked him for saving the day."},{"n":12,"type":"text","section":"Reading","stem":"Which is true according to the diagram?","options":["Jaden likes Frozen and Harry Potter","Gracie and Eva like Frozen","Nihal and Jeremy like Frozen","Rose likes only Harry Potter"],"passage":"<strong>Favourite Stories</strong><br>The diagram below shows which children like Frozen, which like Harry Potter, and which like both.","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbQAAAEoCAIAAAC/8pMpAABrv0lEQVR42u2ddXxU1xLH565m3bLZuLsnRLDg7la8UFoqlLpA3VtaaKGKFShOcYdAcAJEiPvGPdnNJusu74+lKa/t64M2chPO99NPP8lls3vvnHt/O3POnBnMZrMBAoFAIP4bAjIBAoFAIHFEIBAIJI4IBAKBxBGBQCCQOCIQCAQSRwQCgUDiiEAgEEgcEQgEAokjAoFAIHFEIBAIJI4IBALR3yAhE+AEmw3alPpGmU6i0MvVRrnGpNAa5RqTQmOUa0wqnclisdkAVDoTAJjMVp3RAgA0CpFMIgAAi0bGAIhEjEUjcxlkDoPCZZC5DAqHQeExyEKOg5uA5sh2wDBk6X8zRjZpu7KhWdbaJu9QqOUKjVz5238KjVKts1isNrAp1ToAMJnMOr0RAGgOFDKZBABsJg0DjEgksJk0LofBZTO4bAaPw7T/38mR4+4iEPLZGBokfIChwhO9QlO7rrxJVdWiapTpmtp1TTJtU7vOaLZ264dSSARXPs1VQHcT0Fz5ND9nVoAry4VPQ8PxlzS2yMRVTRW1LQ3NssYWWWNLe2OLzGgyd+8YkUluzgI3Z767i8DNWRDg7RLo6+oq4qPhQOLYPzFZrCX1SnGjUtyoLG9SlTer1Lq/eMY4DLKIS3NkUzkMMsuBzKaTWDQKm05i0shMGplEBABgUskAQCJhDmQiAOhNFrPZBgBqgwkAzBZQ60xqnUmpNat0RqXWrNSZFBqTTGVolesUGtOfP5RFIwe4svxdWYGurCB3drA7m0x8FCdbTGZLsbiutLKxtLJRXNUkrmpSaXR/fhmXzXB25Ar4HB6HzmbSWEw6m0VjM+kcJo3JoBFJRABg0R0AgEQiOVDJAKA3mMxmMwCotHoAsJgtao1OodYp1VqlSqdSaxUqnVypkbUrW9rkcqXmzx/KZtICfV0DfdyC/FyD/d1DAzzu3Q2IfiCOGq3+xQ9+/vPxl5+aGhXijQdDfL3lRHF5/R8ODo4LWT5/zD97Q7nGmFctz6vuyK3qKKqTG0z/5RVyGRRvZ4a3kOnMcxBxHZw4NBGPSiV37x1vMFlaOwytcl2rXN8i19dI1DWt6j8oJpVMDPPkRPvyon14Ub48Dp3cj+9+uVKTU1iVU1SdXVhZUFpnMP6XKbgchq+ns6+7k7MTTyTkOgu5zkIeldI1Bvnm5xNSmXLRjBERwZ72I7fulp6+lOHl7jRpZGyLRN4q7WiWyqvrW6vqWv+gmA5UcniQZ2y4X2y4b0y4L4dF/wcncPpS5vHktN/cVTKT4SAUcBZMG+rpJnyQP88qqBwQ4fe/fv0HPPf2ZqPpj1/eS+aMHDEwHPr3nKPZYr2dVfbn40vmjMTJc1Jc0fDnM3QScB/qTXRGS6ZYlloizRTLaiTqzu8dAoZ5OtH9Xdg+IoaPE9NLxOQyekF0qGSipxPd04n+BxGvadFUSzQ1EnV5k7KhTZtd2Z5d2Q4AGAY+ImZ8gGBoqDA+QOBA6Q/eik5vTM8R30gv as time to pay, my dad called me over to the checkout so I could pay with his credit card.<br><br>When we got home, my dad spent an hour setting up the computer. He even attached the monitor and printer. I was excited when I finally got to use the computer. I went online and called my grandparents on the new video phone. It sure is fun having a new computer."},{"n":14,"type":"text","section":"Reading","stem":"Why is the polar bear classified as a marine mammal?","options":["It is the largest predator that lives in water.","Its preferred food lives in water.","It is the only mammal that lives in water.","It relies on sea ice for its existence."],"passage":"<strong>Polar Bears</strong><br>Polar bears are the largest land predators in the world. They hunt seals from the edge of sea ice. Polar bears are classified as marine mammals because they spend most of their lives in and depend on the sea ice of the Arctic Ocean. Scientists estimate that there will be fewer polar bears in the future because their living environment is becoming warmer."},{"n":15,"type":"text","section":"Reading","stem":"How many syllables does the word \"settle\" have?","options":["1","2","3","4"],"passage":"<strong>Syllables</strong><br>Say the word \"settle\" out loud and count the beats."},{"n":16,"type":"text","section":"Reading","stem":"Out of the following events, what was the SECOND thing that happened last Friday?","options":["Thomas saw that his ice cream had melted","Coach Maggie showed Thomas how to pitch","Thomas got an ice cream cone","Coach Maggie wanted to talk to Thomas"],"passage":"<strong>Baseball Friday</strong><br>Thomas plays baseball every Friday. Every time, one of the team parents brings ice cream cake at the end of the game. Last Friday, Thomas' coach wanted to talk to him for a few minutes. The ice cream cone was already in his hand when she called him over.<br><br>Coach Maggie said he needed to follow through more in his pitches, and showed him how. \"Make sure your arm follows this motion,\" she said, moving her arm down. \"You can't just stop when you release the ball.\"<br><br>Thomas thanked his coach and looked at the ice cream in his hand. \"Oh, no,\" he thought when he saw that the ice cream had melted. \"Well, I suppose there's always next week.\""},{"n":17,"type":"text","section":"Reading","stem":"What is the main idea of the passage?","options":["the aardvark is an interesting animal","the aardvark is a relative of the elephant","the aardvark can eat 50,000 ants in a night","the aardvark lives in burrows"],"passage":"<strong>The Aardvark</strong><br>The aardvark is an interesting animal that lives in the south of Africa. Although it looks a little like a pig, it is actually a distant relative of the elephant. It mainly eats ants and termites and can eat 50,000 ants in one night! The aardvark lives in holes called burrows that it digs in the ground. The name Aardvark comes from South Africa's Afrikaans language and means \"earth pig\" or \"ground pig.\""},{"n":18,"type":"text","section":"Reading","stem":"Which pair of words both contain three syllables?","options":["Telescope and Luxury","Table and Homework","Present and Table","Homework and Present"],"passage":"<strong>Counting Syllables</strong><br>Words: Table, Homework, Telescope, Present, Luxury. Say each one and count its syllables."},{"n":19,"type":"text","section":"Reading","stem":"Choose ONE prefix and ONE root word that best complete the sentence. Which pair builds the best word?","options":["in- and attentive","extra- and greedy","mis- and shy","in- and shy"],"passage":"<strong>Build the Word</strong><br>\"Roni and Santiago, if you keep being so ____ in class I will have to ask you to not sit next to each other!\"<br><br>Prefixes: in-, extra-, mis-. Root words: attentive, greedy, shy."},{"n":20,"type":"text","section":"Reading","stem":"What is the dialogue used for in the passage? (a dialogue is a conversation between two or more people)","options":["to show how different Wendy and Peter's lives are","to show that Wendy is afraid of Peter","to show that Wendy is very rich","to give information about Wendy and Peter's fathers"],"passage":"<strong>From Peter Pan by J.M. Barrie</strong><br>\"What's your name?\" he asked.<br>\"Wendy Moira Angela Darling,\" she replied with some satisfaction. \"What is your name?\"<br>\"Peter Pan.\"<br>She was already sure that he must be Peter, but it did seem a short name. \"Is that all?\"<br>\"Yes,\" he said rather sharply. He felt for the first time that it was a shortish name.<br>\"I'm so sorry,\" said Wendy Moira Angela.<br>\"It doesn't matter,\" Peter said.<br>She asked where he lived.<br>\"Second to the right,\" said Peter, \"and then straight on till morning.\"<br>\"What a funny address!\"<br>He shook his head. \"No, it isn't,\" he said.<br>\"I mean,\" Wendy said nicely, remembering that she was hostess, \"is that what they put on the letters?\"<br>He wished she had not mentioned letters.<br>\"Don't get any letters,\" he said.<br>\"But your mother gets letters?\"<br>\"Don't have a mother,\" he said."},{"n":21,"type":"text","section":"Reading","stem":"Look at the picture. Which word BEST completes the last sentence in the passage?","options":["to","two","too"],"passage":"<strong>Counting Fingers</strong><br>I love teaching my niece new things. Yesterday, I was teaching her to count to 10. I held up fingers and asked her how many fingers I was holding up. She was so good and got the number right every time! When I held up my pointer finger and middle finger, she said, \"_____!\"","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKoAAAECCAIAAADhLNviAAAUYUlEQVR42u2dWWwj533A/3MPORyeIqmLOlbnOrveI+ukcBzHieOizuEmCOAiidEjLw3QAGmRvBbwSwsESdq0jYG4QPpSuG6dxMmmXthI2iROHC/sxe5md72WVitKK5ESKYqcITkz5NzTB262XtuSKVEURfH/e5Rmvo+cH7/r/x1DeJ4HSK9C4iNA/QjqR1A/gvoR1I+gfgT1I6gfQf0I6kcODzQ+grvxtMKKnL6kri2YtYqpSADAilHWHxKHZsITp4XE6GH6tgRO+dwRLy1cyJ5/Xpfz21zER/qH7/9cdOoMAIH6DwlGpZB+8Wk1nwYAmuPFSCIQ6WM4H8PxAGAZ ],"passage":"<strong>Adapted from Ashputtel (Cinderella), by the Grimm brothers</strong><br>The wife of a rich man fell sick. When she felt she was going to die, she called her only daughter to her bedside and said, \"Always be a good girl, and I will watch over you.\" Soon after, she died. And the little girl was always good and kind to everyone around her.<br><br>Time passed, and her father married another wife. This new wife had two daughters of her own that she brought home with her. The new stepsisters were beautiful, but bad at heart, and it was now a hard time for the poor little girl. \"You are good for nothing, and do not deserve to sit with us. Go to the kitchen and work!\" they told her. Then they took away her fine clothes and gave her an old grey dress to put on, and laughed at her.<br><br>One time, the father was going into town and asked his wife's daughters what he should bring them. \"Fine clothes and diamonds,\" answered the stepsisters. \"Now, child,\" he said to his own daughter, \"what will you have?\" \"The first branch, dear father, that brushes against your hat when you turn your face to come home,\" she said."},{"n":24,"type":"text","section":"Reading","stem":"Which is the BEST topic sentence of the paragraph?","options":["People thought it would be great for writing.","The Italians improved the sticks by adding wood around them.","But, the first modern pencil was made in 1812 by William Monroe in Massachusetts.","The history of the pencil is fascinating."],"passage":"<strong>The History of the Pencil</strong><br>The history of the pencil is fascinating. In the year 1564, a large amount of soft, dark material called \"graphite\" was discovered in England. People thought it would be great for writing. The graphite was so soft to hold and write with, so they wrapped pieces of string around it. About 100 years later, the Germans created sticks out of graphite powder. The Italians improved the sticks by adding wood around them. Then, a French scientist called Nicholas-Jacques Conte mixed graphite with clay to make it stronger. But, the first modern pencil was made in 1812 by William Monroe in Massachusetts."},{"n":25,"type":"text","section":"Reading","stem":"What is the LAST thing that happened?","options":["Peter ate cucumbers","Mr. McGregor caught Peter","Peter was looking for parsley","Peter met Mr. McGregor"],"passage":"<strong>Adapted from The Tale of Peter Rabbit by Beatrix Potter</strong><br>Once upon a time there were four little Rabbits, and their names were: Flopsy, Mopsy, Cottontail, and Peter.<br><br>They lived with their Mother underneath the root of a very big fir tree.<br><br>\"Now, my dears,\" said old Mrs. Rabbit one morning, \"you may go into the fields or down the lane, but don't go into Mr. McGregor's garden. Now run along, and don't get into mischief. I am going out.\"<br><br>Then old Mrs. Rabbit took a basket and her umbrella, and went through the wood to the baker's. She bought a loaf of brown bread and five currant buns.<br><br>Flopsy, Mopsy, and Cottontail, who were good little bunnies, went down the lane to gather blackberries. But Peter, who was very naughty, ran straight away to Mr. McGregor's garden, and squeezed under the gate!<br><br>First he ate some lettuces and some French beans; and then he ate some radishes; And then, feeling rather sick, he went to look for some parsley.<br><br>But round the end of a cucumber frame, whom should he meet but Mr. McGregor!"},{"n":26,"type":"text","section":"Reading","stem":"What do you need to do with the second aluminium strip?","options":["connect it to the penny in the lemon using a paper clip","connect it to the first strip using a paper clip","insert it into the lemon","cut it in half"],"passage":"<strong>Make a Battery at Home</strong><br>Did you know you can make a simple battery at home? It's easy!<br><br>What you will need: a penny, a lemon, a plastic-coated paper clip, and two strips of aluminium foil (1 by 8 inches)<br><br>Follow these directions:<br>1. The aluminium strips: Fold each strip into thirds along its length to get sturdy strips.<br>2. The lemon: Ask an adult to carefully make two small parallel cuts near the middle of the lemon, half an inch apart from each other.<br>3. The penny: Push the penny in one cut until only half of it is showing above the lemon skin. Part of the penny should touch the lemon juice.<br>4. The first aluminium strip: Slide the strip in the second cut until part of the aluminium is touching the lemon juice.<br>5. The second aluminium strip: With a plastic-coated paper clip, attach the strip to this penny sticking out of the lemon.<br>6. Touch the two aluminium strips, one in each hand. Can you feel the tingling sensation? A small amount of electricity is flowing from one strip to the other through your body."},{"n":27,"type":"text","section":"Reading","stem":"Which word will fit in BOTH places?","options":["paddle","hat","mitten","bat"],"passage":"<strong>One Word, Two Meanings</strong><br>I found my new ______ in the basement.<br>A ______ flew over my head when I walked down the street."},{"n":28,"type":"text","section":"Reading","stem":"Which is TRUE according to the passage?","options":["The sea sheep is a kind of fish that gets energy from the sun.","The sea sheep is a plant that uses a process called kleptoplasty.","The sea sheep is a slug that eats seaweed and gets energy from the sun.","The sea sheep is actually called Costasiella Kuroshimae and it looks like a leaf."],"passage":"<strong>The Sea Sheep</strong><br>Ever heard of the sea sheep? This tiny creature lives in the sea and looks like a sheep, but it is actually a slug. It is only a fifth of an inch long, and it lives near the coasts of Japan, Indonesia, and the Philippines. Its real name is Costasiella Kuroshimae and it is sometimes called a \"leaf slug.\" It has a white face with two red dots that look like blushing cheeks, and its body is green, like leaves.<br><br>The sea sheep has another strange similarity to leaves: it can get energy from the sun, just like plants do! The sea sheep does this by turning the seaweed it eats into a part of its body in a process called kleptoplasty. It is one of the only animals in the world that can do this. Isn't it an amazing creature? You can look it up online, it is really cute."},{"n":29,"type":"text","section":"Reading","stem":"This passage is an example of which type of text?","options":["memoir","biography","fairytale","fable"],"passage":"<strong>My First Trip to India</strong><br>I remember my first trip to India like it was yesterday. I landed in New Delhi and was amazed by the amount of people, sounds, and colors on the streets. To a tourist, the city may look completely disordered, but after you get used to it, you realize there is an order. The people were very friendly, the food was delicious, and I saw the most beautiful views in the world."},{"n":30,"type":"text","section":"Reading","stem":"What is the book probably about?","options":["plants that eat insects","traps for flies","flies that bite","insects that eat plants"],"passage":"<strong>On the Bus</strong><br>Imagine you are on the bus and you see a woman across from you reading a book. Its title is Fly Traps!: Plants that Bite Back."},{"n":31,"type":"text","section":"Reading","stem":"Which sentence in the passage is OUT OF PLACE?","options":["Pizza is a flatbread that is usually topped with tomato sauce and cheese.","History shows that people have been adding ingredients to bread to make it more flavorful for many years.","About three billion fresh pizzas are sold in the United States every year.","For example, the ancient Greeks covered their bread with herbs, onion, and garlic."],"passage":"<strong>The History of Pizza</strong><br>Pizza is a flatbread that is usually topped with tomato sauce and cheese. History shows that people have been adding ingredients to bread to make it more flavorful for many years. About three billion fresh pizzas are sold in the United States every year. For example, the ancient Greeks covered their bread with herbs, onion, and garlic. 2,500 years ago, the soldiers of King Darius baked flatbreads with cheese and dates on top of their battle shields."},{"n":32,"type":"text","section":"Reading","stem":"What are the two passages mainly about?","options":["Spanish","plants","corn","popcorn"],"passage":"<strong>Two Passages about Corn</strong><br><em>Passage 1</em><br>Corn is a type of plant. Corn was first domesticated by native peoples in Mexico about 10,000 years ago. Since the introduction of corn into Europe by Christopher Columbus and other explorers, corn has spread to all areas of the world suitable for its planting.<br><br><em>Passage 2</em><br>Corn is called maize by most countries. This comes from the Spanish word \"maiz.\" There are over 3,500 different uses for corn products, with the most popular being popcorn. Popcorn is seeds of corn that are heated until they burst, becoming light, white balls that are usually eaten with salt and butter or a sweet covering on them. As of 2012, the United States produces 40% of the world's total corn harvest."},{"n":33,"type":"text","section":"Reading","stem":"After the molten glass is removed from the oven, it probably...","options":["turns to sand.","melts.","hardens.","breaks into pieces."],"passage":"<strong>Making Glass</strong><br>Making glass is an interesting process. First, you make a mixture of sand, limestone, and soda. Then, you put the combined ingredients in an oven that was heated to 2,850 degrees Fahrenheit, creating molten glass. Then, you remove the molten glass from the oven."},{"n":34,"type":"text","section":"Reading","stem":"Which detail from the story BEST supports the main idea that Aria is excited about ballet class?","options":["She counts down the minutes.","She follows the teacher's instructions.","She thinks all of her friends look happy.","She looks at the other girls getting ready."],"passage":"<strong>Ballet Class</strong><br>Aria was sitting on a bench in the ballet classroom. She looked at the other girls walking in, arranging their belongings in the corner, and getting ready. She smiled and waved at them all, counting down the minutes until the beginning of the class. She closed her eyes and could almost hear a distant echo of her favorite classical music piece. She pictured herself and her classmates dancing with this song playing in the background.<br><br>The ballet teacher opened the classroom door and asked the students to take their positions. Aria ran to the left side of the class. As she was following the teacher's instructions, she looked around at her friends. \"They all seem so happy!\" she thought. \"Ballet class is truly magical!\""},{"n":35,"type":"text","section":"Reading","stem":"Which set of words all mean the OPPOSITE of the preposition \"above\"?","options":["under, beneath, during","below, across, underneath","beneath, under, below","over, below, beneath"],"passage":"<strong>Prepositions</strong><br>The friendly neighbors live two floors above our apartment."},{"n":36,"type":"text","section":"Reading","stem":"Which of these is a characteristic of an encyclopedia?","options":["describes current weather conditions","includes only a collection of maps","lists words grouped together by similarity of meaning","contains articles about many different subjects"],"passage":"<strong>Reference Books</strong><br>Think about what makes an encyclopedia different from an atlas, a thesaurus or a weather report."},{"n":37,"type":"text","section":"Reading","stem":"Which of these pairs of words shares the SAME meaning?","options":["modern, mill","fly, expand","hover, float","fabric, balloon"],"passage":"<strong>The Hot Air Balloon</strong><br>The hot air balloon is the oldest and simplest of all flying machines. Two brothers from France were the inventors of the modern flying balloon. As paper mill owners, the brothers tried to float bags made of paper and fabric. They turned a bag upside down so the opening was at the bottom. When they held a flame near the opening at the bottom, the bag expanded with hot air and hovered upward."},{"n":38,"type":"text","section":"Reading","stem":"Based on the passage, what is most likely the reason the butterfly did not answer the kitten?","options":["The butterfly did not hear the kitten's question.","The butterfly did not understand what the kitten asked.","The butterfly did not have the ability to speak.","The butterfly did not want to help the kitten."],"passage":"<strong>From \"The Little Gray Kitten\" by Mary Lawrence Tumbull</strong><br>Once upon a time there was a little gray kitten, who had wandered far away from home. At first she liked all the strange sights she saw, but by and by she began to feel very homesick, and wished she was once more cuddled up with her brothers and sisters.<br><br>Now the only word this little gray kitten knew was \"Mew, mew!\" So when she was lonely she would say \"Mew\" when she was hungry, \"Mew;\" when she was cold or tired, glad or sad, it was always \"Mew.\" At home they knew what she meant when she said \"Mew\" but out in the wide, wide world, nobody seemed to know.<br><br>Wandering along the street, she came upon a little squirming earthworm. \"Mew,\" said she, meaning, \"Where is my home?\" The earthworm, however, did not notice little gray kitten, but crawled away across the street.<br><br>Next, the little gray kitten met a butterfly on the top of a dandelion. \"Mew,\" said the little gray kitten, meaning, \"Can you tell me where my home is?\" But the butterfly did not say anything, and flew away."},{"n":39,"type":"text","section":"Reading","stem":"Which of the following is a hatchling?","options":["a crocodile mother","an animal of a class that includes lizards","the process of digesting food","a young animal that has recently hatched"],"passage":"<strong>Crocodiles</strong><br>Crocodiles are large reptiles found in tropical regions of Africa, Asia, the Americas, and Australia. The crocodile's diet consists mainly of fish, reptiles, birds, and mammals. To help with digestion, crocodiles swallow small stones that grind up the food in their stomachs. Crocodiles can survive for months without food. Crocodiles lay 10 to 60 eggs at a time. The hatchlings are usually carried to the water in the mouth of their crocodile mother.<br><br><em>Glossary:</em><br>reptile: an animal of a class that includes snakes, lizards, crocodiles, turtles, and tortoises<br>region: a particular area<br>hatchling: a young animal that has recently come out of its egg<br>digestion: the process of digesting food"},{"n":40,"type":"text","section":"Reading","stem":"Which answer shows something they both AGREE on, and something they both DISAGREE on?","options":["Agree: Geometry is the best math subject. Disagree: It is hard to solve math problems.","Agree: It feels good after you finish solving math problems. Disagree: It is fun to solve math problems.","Agree: It takes only one hour to finish math homework. Disagree: It is hard work to solve math problems.","Agree: Computation is a subject in math. Disagree: Solving math problems is easy."],"passage":"<strong>Two Paragraphs about Math</strong><br><em>Joey's paragraph</em><br>Solving math problems is fun. It is not so hard for me to solve math problems. My favorite math subject is Geometry. Math problems are challenging, but it feels good when I manage to solve them.<br><br><em>Dave's paragraph</em><br>Solving math problems is hard work. My least favorite math subject is Geometry. It took me all day to finish my math homework. It felt good when I managed to finally finish my math homework.<br><br>Joey and Dave agree on some things about math problems. They disagree on other things."},{"n":41,"type":"text","section":"Reading","stem":"What is the meaning of the word \"sign\" in the sentence?","options":["a printed mark that is generally understood and used instead of words","a public notice that gives information","a motion or action that gives information or an instruction","a signal that something exists"],"passage":"<strong>Word Meaning</strong><br>He stood up and nodded. It was a sign to me that it was time to leave."},{"n":42,"type":"text","section":"Reading","stem":"Which test is held AFTER the day of the Reading test?","options":["Mathematics","Writing","Spanish","Social Studies"],"passage":"<strong>Testing Schedule (in alphabetical order)</strong><br>Language Arts: February 28th<br>Mathematics: February 12th<br>Reading: April 1st<br>Science: April 2nd<br>Social Studies: April 12th<br>Spanish: March 10th<br>Writing: March 5th"},{"n":43,"type":"text","section":"Reading","stem":"Which prefix best completes the word \"connect\"?","options":["dis-","re-","un-","tri-"],"passage":"<strong>Prefixes</strong><br>The internet connection is not working. Try to ____connect the router cable to the socket."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function fmt(t){return esc(t).replace(/&lt;(\/?)(u|b|i|em|strong|sub|sup)&gt;/g,"<$1$2>");}  /* escape everything, then re-enable a fixed set of inline tags so a question can mark the word it is actually asking about */

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+fmt(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+fmt(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+fmt(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+fmt(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+fmt(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
