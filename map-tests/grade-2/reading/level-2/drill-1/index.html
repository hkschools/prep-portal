const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G2-READ-L2-D1";

const TITLE = "MAP Grade 2 Reading (Level 2): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Which word has the same short \"o\" sound as the word \"hot\"?","options":["open","stop","go","know"]},{"n":2,"type":"text","section":"Reading","stem":"Why was the mother extremely angry?","options":["because the cat had drunk all the milk","because she had told Elmer she did not want to feed the cat, but he fed it","because the cat was dangerous","because she only agreed to feed one cat, not all alley cats"],"passage":"<strong>Read the passage</strong><br><br>One cold rainy day when my father was a little boy, he met an old alley cat on his street. The cat was very drippy and uncomfortable so my father said, \"Wouldn't you like to come home with me?\"<br><br>This surprised the cat: she had never before met anyone who cared about old alley cats: but she said, \"I'd be very much obliged if I could sit by a warm fireplace, and perhaps have a bowl of milk.\"<br><br>\"We have a very nice fireplace to sit by,\" said my father, \"and I'm sure my mother has an extra bowl of milk.\"<br><br>My father and the cat became good friends, but my father's mother was very upset about the cat. She hated cats, particularly ugly old alley cats.<br><br>\"Elmer Elevator,\" she said to my father, \"if you think I'm going to give that cat a bowl of milk, you're very wrong. Once you start feeding stray cats you might as well expect to feed every stray in town, and I am not going to do it!\"<br><br>This made my father very sad, and he apologized to the cat because his mother had been so rude. He told the cat to stay anyway, and that somehow he would bring her a bowl of milk each day. My father fed the cat for three weeks, but one day his mother found the cat's bowl in the cellar and she was extremely angry at my father.<br><br><em>(adapted from My Father's Dragon by Ruth Stiles Gannett)</em>"},{"n":3,"type":"text","section":"Reading","stem":"Which of these is a function of a table of contents in an informational text?","options":["It shows who wrote the text.","It lists the topics in alphabetical order.","It includes a short summary of the whole text.","It shows on which page each chapter begins."]},{"n":4,"type":"text","section":"Reading","stem":"What does the author believe?","options":["People should appreciate both summer and winter.","Summer is too hot and humid.","People cannot do things outside in summer.","Summer is a better season than winter."],"passage":"<strong>Read the passage</strong><br><br>Some people don't like summer. They think that it gets too hot and humid, and that they are unable to do things outside. Don't they realize that summer is the best season for traveling and spending time at the beach? Surely, people who don't like summer are confused.<br><br>This is very similar to how people view winter, if you think about it. Many people don't like winter because it's snowy and cold. But this is a great excuse to stay indoors and read an interesting adventure book with a warm cup of cocoa in your hands. Another thing you could do in winter is sit on the rug with your family and do a jigsaw puzzle. There's plenty of stuff to do in winter!"},{"n":5,"type":"text","section":"Reading","stem":"Which pair of words combines to make a compound word?","options":["baby + side","home + work","any + ball","home + ball"]},{"n":6,"type":"text","section":"Reading","stem":"Which sentence from the passage is \"make-believe\"?","options":["Alex hung a flag with a pirate symbol outside the tree house.","The parents built a tree house up in its branches.","Alex, the oldest child, was in my class.","We then managed to defend the ship against terrible ghost pirates."],"passage":"<strong>Read the passage</strong><br><br>The Chang family has a lovely yard with a huge tree in the middle. The parents built a tree house up in its branches for their children to play in. Alex, the oldest child, was in my class, and he often invited me to play with him and his sister after school. I have wonderful memories from that tree house.<br><br>One time, we were playing \"Pirates.\" Alex hung a flag with a pirate symbol outside the tree house and shouted down at me, \"Ahoy there, matey! Come on board!\" When I climbed up, Sky, his sister, who was wearing a black patch over her eye and waving a plastic sword, said, \"You arrived just in time! We're about to crash into those rocks over there!\" I quickly rushed to help her steer the ship away from the rocks, and we all breathed a sigh of relief. We then managed to defend the ship against terrible ghost pirates and found amazing treasures on a desert island.<br><br>After a couple of hours we were getting really hungry, so we were lucky that Alex and Skyy's mom shouted at us from below, \"Ahoy, mighty pirates! Come down! There's tasty grub awaiting you here!\""},{"n":7,"type":"text","section":"Reading","stem":"Which title represents the main idea of the passage?","options":["How Cats Communicate","Popular Pets in North America","The Connection between Cats and Humans","Cats vs. Dogs: Which is the Better Pet?"],"passage":"<strong>Read the passage</strong><br><br>Cats are one, if not the most, popular pet in the world. There are more than 500 million cats living in homes around the world. Cats are North America's most popular pets: there are 73 million cats compared to 63 million dogs. Cats and humans have had a close relationship for nearly 10,000 years. The oldest known pet cat was recently found in a 9,500-year-old grave on the island of Cyprus. Cats rarely meow at each other; they usually only meow to draw the attention of people. When cats rub up against their owners, it is their way to mark the person as property."},{"n":8,"type":"text","section":"Reading","stem":"Based on the passage, what is the meaning of the prefix \"dis-\" in the word \"disinterest\"?","options":["not","into","very","again"],"passage":"<strong>Read the story</strong><br><br>\"How was school, honey?\" Renata's mom asked when she got home. \"Not great,\" Renata replied. \"I tried to show Khan my new drawing, but he said that maybe later would be a better time. After that, he didn't say a word to me all day. He did walk past me in class, quietly. I think he doesn't want to be my friend anymore.\"<br><br>\"Don't jump to conclusions, dear. There could be many reasons Khan showed DISINTEREST in your drawing. Maybe he's going through something, or was not feeling well. You've been good friends for a long time, so there's no reason he wouldn't want to be friends with you. How about giving him a call and saying you noticed he was quiet in class today and asking whether everything is ok, or if he wants to talk about it?\"<br><br>Renata thought about this, and said, \"You know, Mom, sometimes you have the best ideas.\" \"I know, dear. It's because I'm such a cool person. Now go call him!\" she said, and winked."},{"n":9,"type":"text","section":"Reading","stem":"In how many sizes is Happy Dog Treats available?","options":["3","4","5","100"],"passage":"<strong>Read this advertisement</strong>","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcwAAAFoCAYAAADaVst+AAAABmJLR0QA/wD/AP+gvaeTAAAgAElEQVR4nOzddXxV9f8H8NetdXd3B2Mb3Q1SIikdigX6FUHFQETwpygqBqIYlIAoSCOOHDlyPbaxHuvuuPX74+6e3XNjuxsDhr6fjwePB6c/9+yc8z6fPBx0kNfgxdZiscRfwoEzB7CRSKU6Hd0HIYQQ8qhxOZxmKVDMlSK3Sac5Kf/CvtKObM/RZiWvwYuthWLJAg7wtBQYAIDXqdQSQggh3YNYClzhAEcFPO6utEvbS9rboM2AadtjvqGuEWc5B5x3AJiqrCBtbw+EEEJIN6EpZklRx+FwvtPlcD9OufJrjabNNYY75wGLenMh/QuAUxckkxBCCOnWpEAuuHgm5/LO2+qWc9XNdOu/cDYX0khQsCSEEPIfwQGcORJcchuw6Fl1y1XqIl37L5oDDvYAEDz01BFCCCHdiwDANHOXkOTK3NhExQWsIlnXfovDwJVcAmDwKFNHCCGEdDONXKl0aOa1XTfkM5iAaT1shpFBs8FdUDEsIYQQAgA5wiZd//zb2+oBhTpM/Wb9laBgSQghhMi5CHSbVsgnOADTzzIdgPFjSxYhhBDS/VQLdZo98y/sK+UCgFAkWQgKloQQQogyEx2hznygpUiWw8Hkx5seQgghpHuSSjlPAwCnpTi2ADTcHSGEEKKOWCSS2nJFUmkgKFgSQgghmvB0+JxArlQMB0A2xB4hhBBCVEmlcOQCUgeAxlAnhBBCNJFy4MDlcDhGjzshhBBCSHfGAcdY7eDrhBBCCGGjgEkIIYRogQImIYQQogUKmIQQQogWKGASQgghWqCASQghhGiBAiYhhBCiBf7jTgABXpo7HnOmDGem1365G+evxams99Z r and how she used to take care of them","The children's life today, when they are railway children","The children's house and its modern conveniences"],"passage":"<strong>Read the passage</strong><br><br>They were not railway children to begin with. I don't suppose they had ever thought about railways except as a means of getting to places. They were just ordinary children, and they lived with their Father and Mother in an ordinary red-brick-fronted house, with coloured glass in the front door, a passage that was called a hall, a bathroom with hot and cold water, electric bells, French windows, and a good deal of white paint, and \"every modern convenience,\" as the house agents say.<br><br>There were three of them. Roberta was the eldest. Of course, Mothers never have favorites, but if their Mother HAD had a favorite, it might have been Roberta. Next came Peter, who wished to be an engineer when he grew up; and the youngest was Phyllis, who meant extremely well.<br><br>Mother did not spend all her time in making boring visits to boring ladies, or sitting at home waiting for boring ladies to visit her. She was almost always there, ready to play with the children, and read to them, and help them do their homework. Besides this she used to write stories for them while they were at school, and read them aloud after tea, and she always made up funny pieces of poetry for their birthdays and for other great occasions.<br><br><em>(adapted from The Railway Children by Edith Nesbit)</em>"},{"n":11,"type":"text","section":"Reading","stem":"Which suffix needs to be added to the base word \"interview\" to describe Jorge's role?","options":["-able","-er","-ful","-ee"],"passage":"<strong>Read the passage</strong><br><br>Danielle arrived at the TV studio with her parents. She was going to appear on a morning show because she had won first place in a chess championship. The family was greeted by Jorge. \"Thank you for coming today, Danielle,\" Jorge said. \"We are very happy to have you here. On the show, I will tell your story to all the people watching. Then, I will interview you, which means I will ask you a few questions. Are you ready?\" \"Of course,\" Danielle said, smiling. \"I'm ready for my interview.\""},{"n":12,"type":"text","section":"Reading","stem":"Why did the author write this passage?","options":["to inform about food allergies in general","to explain the difference between nut and peanut allergy","to persuade not to offer regular food to allergic children","to explain about spring allergies"],"passage":"<strong>Read the passage</strong><br><br>When a person has a food allergy, instead of treating that food like other foods, the body reacts as if that food is harmful. Trying to protect itself, the body produces special materials against that food that are meant to fight infections. These can lead to allergy symptoms. When you think of allergy symptoms, you probably imagine sneezing, red eyes, and runny noses. But unlike spring allergies, nut and peanut allergies can cause breathing difficulties and other very serious health problems.<br><br>That's why children with nut or peanut allergies cannot eat food everyone else eats at school or at parties. They must have special food that doesn't contain nuts or peanuts: not even a little. So, it is very important not to offer regular food to a child with food allergies."},{"n":13,"type":"text","section":"Reading","stem":"What type of text is this?","options":["a make-believe story","a newspaper article","a realistic story","a book report"],"passage":"<strong>Read the passage</strong><br><br>Two weeks after the beginning of the summer vacation, Edgar was preparing to board his first flight to Paris on his own. He was supposed to meet his older sister who worked at the embassy, and together they planned to tour the city. Edgar had his boarding pass and passport clutched in his hand. His mother hugged him tightly and said she would miss him, but would meet him at this same spot in a week. Edgar then boarded the plane.<br><br>The flight attendants were very nice and brought Edgar a sandwich and a hot cup of chocolate during the flight. When he was finished eating, he read his book for a while and then immediately fell asleep. Several hours later, he landed. He was excited to meet his sister and tour the city."},{"n":14,"type":"text","section":"Reading","stem":"In what year was the book by Terry Pratchett and Neil Gaiman published?","options":["1983","1985","1990","1997"],"passage":"<strong>Look at this references list</strong><br><br>Lindgren, A. (1985). Ronia, the Robber's Daughter. New York: Puffin Books.<br>Ende, M. (1983). The Neverending Story. New York: Doubleday & Company.<br>Pratchett, T. & Gaiman, N. (1990). Good Omens. New York: Workman Publishing Company, Inc.<br>Rowling, J. K. (1998). Harry Potter and the Sorcerer's Stone. New York: Scholastic."},{"n":15,"type":"text","section":"Reading","stem":"Who is the speaker in this passage?","options":["the master of the house","a young horse","a young bird","a child"],"passage":"<strong>Read the passage</strong><br><br>The first place that I can well remember was a large, pleasant, grassy field with a pond of clear water in it. Some trees leaned over it, and water-lilies grew at the deep end. Over the fence on one side we looked into a farmer's field, and on the other we looked over a gate at our master's house, which stood by the roadside.<br><br>While I was young I lived on my mother's milk, as I could not eat grass. In the daytime I ran by her side, and at night I lay down close by her. When it was hot we used to stand by the pond in the shade of the trees, and when it was cold we had a nice warm barn near the trees.<br><br><em>(adapted from Black Beauty by Anna Sewell)</em>"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
