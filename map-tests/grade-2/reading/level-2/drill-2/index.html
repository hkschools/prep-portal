<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";

const TITLE = "MAP Grade 2 Reading (Level 2): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"Which season of the year was it probably?","options":["winter","autumn","summer","spring"],"passage":"<strong>Q1: Read the story</strong><br>Oliver and Mia were playing at the playground near their houses. Mia liked rock climbing, and Oliver preferred swinging high on the swings. After a while they went on the seesaw together, and then they played hopscotch.<br><br>Soon they were hungry, so Oliver took a bag of almonds out of his pocket. They each ate a few almonds and then went bike riding. They rode over to the pond to see the ducks and the changing leaves on the trees. Just then, Mia&#x27;s aunt drove by and waved.<br><br>&quot;Mia, do you and Oliver need a ride home?&quot; she asked.<br>&quot;No thanks,&quot; Mia called. &quot;We have our bikes!&quot;<br><br>An hour later, Oliver and Mia ate more almonds and almost finished the bag. There were only three almonds left in the bag.<br>&quot;It was really fun spending time with you today, Oliver,&quot; said Mia. &quot;Let&#x27;s hang out next Saturday too!&quot;<br>Oliver answered, &quot;OK, see you in school on Monday.&quot;"},{"n":2,"type":"text","section":"Reading","stem":"What does \"aimless\" mean?","options":["direction","purpose","without aim or purpose","full of aim or purpose"],"passage":"<strong>Q2: Read the passage</strong><br>Mr. Chimes is an elderly man who lives down the street from us. Every morning he leaves his house at the same time with his tall hat and walking cane. He walks to the end of the street, turns the corner, and then we don&#x27;t see him again for hours.<br><br>Mr. Chimes looks a bit like a man I saw in a movie once, about something that happened in England many years ago: a hundred years, maybe. I was very curious about him and wanted to know where he goes every day, so my aunt suggested I just ask him. I thought her idea was brilliant. I couldn&#x27;t wait to hear about the exciting things he must be doing.<br><br>So, I waited for Mr. Chimes outside his house the next morning. But when I asked him where he goes everyday he just smiled and said, &quot;Oh, I just wander around looking at this and that. I don&#x27;t go anywhere special. Aimless walking is a wonderful thing, you should try it!&quot;"},{"n":3,"type":"text","section":"Reading","stem":"According to the passage, which of these is something Halloween and Purim DO have in common?","options":["scary pumpkins and ghosts","dressing up in costumes","honoring saints","donating to charity"],"passage":"<strong>Q3: Read the passage</strong><br>Have you ever heard of the Jewish holiday of Purim? Like Halloween, during Purim people wear costumes and give and receive treats. But the two holidays are not the same. Halloween comes from a tradition of honoring saints and remembering the dead, while Purim is about remembering a biblical story in which the Jews were saved. The symbols of Halloween are scary pumpkins, ghosts, and witches, while special cookies called hamantaschen and donating to charity are symbolic of Purim."},{"n":4,"type":"text","section":"Reading","stem":"What type of text is this?","options":["a memoir","a fairy tale","a myth","an essay"],"passage":"<strong>Q4: Read the passage</strong><br>Once, there was a young prince who was never afraid of anything. He had heard people talking about fear, but he never felt it. So, he decided to go and find someone who would teach him how to be afraid. He kissed his bride-to-be, said goodbye to his family, and set out on the road.<br><br>On his way, the prince met a witch who tried to turn him into her servant, but he did not fear her magic spells, and escaped. He met a bunch of robbers who tried to scare him into giving them all his money, but he was not afraid, and they let him go. He spent the night in an old castle that was filled with monsters, but none of them scared him. Sad that he had failed on his mission, he decided to go back home.<br><br>When the prince returned, he found out that his bride-to-be had fallen ill. The medicine people could not help her; they said she was going to die. His heart started beating fast and he became very pale. He held his bride&#x27;s hand, and in a shaking voice said, &quot;My love, don&#x27;t die! I now know what fear is! I&#x27;m so scared of losing you!&quot; Thankfully, his bride got better. They had a long and happy life together, and always took care of each other."},{"n":5,"type":"text","section":"Reading","stem":"Which is the closest in meaning to the word \"remarkable\" that appears in this passage?","options":["flawed","impressive","average","grateful"],"passage":"<strong>Q5: Read the passage</strong><br>Malala Yousafzai is a remarkable young activist for girls&#x27; education. Malala grew up in a village in Pakistan where not many girls were allowed to attend school. She believed that girls should have the same rights to education as boys, and started speaking out for this cause. Although she faced many obstacles and dangers, she continued fighting bravely for what she believed in. Malala&#x27;s determination inspired world leaders, organizations, and millions of people to take action to improve education access for girls."},{"n":6,"type":"text","section":"Reading","stem":"Anwar's friends were embarrassed because...","options":["thanks to Anwar's response they realized they could have behaved better","the old man who had fallen was insulted by their laughter and pointing","thanks to the teacher's response they realized they behaved unkindly","they did not see the man fall down so they did not help him"],"passage":"<strong>Q6: Read the passage</strong><br>Anwar was at the National Museum with his art class, on a school trip. Next to them was an elderly man who walked slowly from painting to painting with a smile on his face. Suddenly, from the corner of his eye, Anwar saw the man trip and fall down. Anwar&#x27;s classmates laughed and pointed at the man, but Anwar frowned at them and went over to help him up. When Anwar joined his class again, his friends looked at him with embarrassment."},{"n":7,"type":"text","section":"Reading","stem":"Which of the following words has the same vowel sound as the word \"field\"?","options":["piece","men","kid","spread"]},{"n":8,"type":"text","section":"Reading","stem":"Why did the author write this story?","options":["to explain","to persuade","to entertain","to inform"],"passage":"<strong>Q8: Read the passage</strong><br>The pouring rain finally stopped, and the sailor spotted the lighthouse in the distance. The terrible weather turned her journey into a dangerous one. Her boat was rocking among the waves. She wrapped another wool blanket around herself, hoping it would keep her warm. She was getting closer to the lighthouse.<br><br>The sailor was pleased to find that the lighthouse gave off two flashes of light every three seconds. This meant she was on her way to the right lighthouse. She was not lost. Half an hour later she reached the shore. The lighthouse keeper was waiting for her there to guide her to his cabin where a burning fireplace and a cup of tea were meant to keep her warm. Now, she was ready to begin her mission."},{"n":9,"type":"text","section":"Reading","stem":"Which of the following is probably true according to the passage?","options":["Museums usually only allow you to look at exhibits.","Dinosphere is scary for children who love dinosaurs.","The Children's Museum in Indianapolis has only dinosaur exhibits.","The Children's Museum is the only museum in Indianapolis."],"passage":"<strong>Q9: Read the passage</strong><br>The Children&#x27;s Museum in Indianapolis is the largest children&#x27;s museum in the world. What&#x27;s special about it is that the exhibits in the museum are about learning through active participation. For example, dinosaur lovers will go crazy for Dinosphere. At Dinosphere, children don&#x27;t just look at real dinosaur skeletons. They get to dig for bones and touch a real T-Rex bone."},{"n":10,"type":"text","section":"Reading","stem":"Which of the following words mentioned in the passage means the same as \"pride\"?","options":["leader","pack","young","wild"],"passage":"<strong>Q10: Read the passage</strong><br>In the wild, packs of animals are usually arranged in a strict order. In most animal species, the young are found at lower levels. They are followed by the females, while the males are highest up. Yet, within the males, there are also clear ranks. For example, when observing a pride of lions, it becomes clear that one male is feared by all the others in the pack."},{"n":11,"type":"text","section":"Reading","stem":"What is the main idea of this passage?","options":["The 2016 Olympics was the most memorable Olympics in history","Simone Biles made history at the 2016 Olympic Games","Simone Biles's gymnastics techniques","How to win Olympic medals"],"passage":"<strong>Q11</strong><br>Read the passage:<br><br>The 2016 Summer Olympics will always be remembered for its star: artistic gymnast Simone Biles. Strong, confident, and flashing a bright smile, Biles wowed the world when she won four Olympic gold medals. She set an American record for most gold medals in women&#x27;s gymnastics at a single Olympic Games. At the end of the Games, Biles had a total of 19 Olympic and World Championship medals. This made her the American gymnast with the highest number of medals ever.","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAggAAAEsCAIAAAApS9yJAAAABmJLR0QA/wD/AP+gvaeTAAAgAElEQVR4nOzdd0BVZRsA8OeccxeXvfcSB6goihs37tTK2fKzpVm2LRuWZTuzaVmpWZmluXLmxA0oDgQUQWXI3uNyufue9/sDQu69h+ldwPP7C957Oee5iOc5510PFThiISCEEEL/4QHA9ZgNlg4DIYSQVegTvYi2dAwIIYSsCyYGhBBCOjAxIIQQ0oGJASGEkA5MDAghhHRgYkAIIaQDEwNCCCEdmBgQQgjpwMSAEEJIByYGhBBCOjAxIIQQ0oGJASGEkA5MDAghhHRgYkAIIaQDEwNCCCEdmBgQQgjpwMSAEEJIByYGhBBCOjAxIIQQ0oGJASGEkA5MDAghhHRgYkAIIaQDEwNCCCEdmBgQQgjpwMSAEEJIByYGhBBCOjAxIIQQ0oGJASGEkA5MDAghhHRgYkAIIaQDEwNCCCEdmBgQQgjpwMSAEEJIByYGhBBCOjAxIIQQ0oGJASGEkA5M he effect was charming.<br><br>There were other things in the stocking, nuts and oranges and a toy engine, and chocolate almonds and a clockwork mouse, but the Rabbit was quite the best of all. For at least two hours the Boy loved him, and then Aunts and Uncles came to dinner, and there was a great rustling of tissue paper and unwrapping of parcels, and in the excitement of looking at all the new presents the Velveteen Rabbit was forgotten.<br><br>(from The Velveteen Rabbit by Margery Williams)"},{"n":14,"type":"text","section":"Reading","stem":"What does the author probably believe?","options":["that people should eat healthier foods","that vanilla and chocolate are the best flavors","that waffles are healthier than ice cream","that ice cream is good for you"],"passage":"<strong>Q14: Read the passage</strong><br>Ice cream is a sweetened frozen food made from dairy products such as milk and cream. It is often combined with fruits or other ingredients. Vanilla and chocolate are the most popular ice cream flavors in the U.S. Although ice cream is tasty, you should consider eating other desserts that are healthier."},{"n":15,"type":"text","section":"Reading","stem":"What does the author want you to think about Sophia?","options":["She is bored.","She is tired.","She is friendly.","She is lonely."],"passage":"<strong>Q15: Read the sentences</strong><br>Sophia was standing alone at the corner of the classroom. She looked around at her classmates playing games and talking to each other excitedly. She was too shy to join the nice group of girls across the room. She just wished someone would come over and talk to her."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
