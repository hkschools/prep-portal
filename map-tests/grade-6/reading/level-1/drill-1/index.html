<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 6 Reading (Level 1): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 6 Reading (Level 1): Drill 1</div>
  <h2>MAP Grade 6 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 6 Reading (Level 1): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 6 Reading (Level 1): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G6-READ-L1-D1";
const BANK_PATH = "map-tests/grade-6/reading/level-1/drill-1/bank.csv";
const TITLE = "MAP Grade 6 Reading (Level 1): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Vocabulary in context", "stem": "What words from the text help the reader imagine the feeling of the dog's fur?", "options": ["big, white", "black, blue", "soft, rich", "big, soft"], "passage": "<strong>Read the passage.</strong><br><br>Nate was daydreaming while walking home from school, when he suddenly realized he had almost walked into a big dog that was sitting on the sidewalk. Nate stopped and stared at the dog. The dog stared back. It had beautiful black and white fur that shone in the sunlight and looked very soft, and eyes that were as blue as the ocean on the clearest day you could imagine. The dog seemed friendly, but Nate was still a little wary as he reached out and touched its fur. The fur was soft as silk and he wanted to keep patting it. The dog stepped closer and leaned its head against Nate's leg. Nate kept patting the rich fur."}, {"n": 2, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following definitions is the best definition for a simile?", "options": ["a series of two or more words that begin with the same sound", "an expression whose meaning cannot be understood from the meaning of each separate word", "a figure of speech used to compare two things using words such as \"like\" or \"as\"", "a figure of speech used to compare two things without using words such as \"like\" or \"as\""]}, {"n": 3, "type": "text", "section": "Detail & inference", "stem": "Which of the following sentences from the passage expresses an opinion?", "options": ["The more melanin a person has, the darker his or her skin will be.", "They have white skin and hair and strikingly appealing blue or red eyes.", "Redheads typically have pheomelanin in other areas of their skin, creating a pinkish hue.", "They also have pheomelanin in their hair, which creates the red color."], "passage": "<strong>Read the passage.</strong><br><br>The primary determinant of our skin color is melanin - a material that absorbs light. It is found in our skin, hair, and eyes. The more melanin a person has, the darker his or her skin will be. Melanin protects the skin from dangerous UV radiation, reducing the risk of cancer. People whose skin cannot produce melanin suffer from albinism. They have white skin and hair and strikingly appealing blue or red eyes. Albino people have been persecuted in some parts of the world, because other people think their bodies possess magical powers.<br><br>There are two types of melanin: eumelanin, which can be brown or black, and pheomelanin, which is red. Pheomelanins are concentrated in some body parts such as the lips. Redheads typically have pheomelanin in other areas of their skin, creating a pinkish hue. They also have pheomelanin in their hair, which creates the red color."}, {"n": 4, "type": "text", "section": "Detail & inference", "stem": "How does the author compare between woolly mammoths and elephants?", "options": ["According to the passage, woolly mammoths were about the same size as elephants and their behavior was similar.", "According to the passage, woolly mammoths and elephants lived at the same time and place.", "According to the passage, woolly mammoths looked exactly like elephants.", "According to the passage, woolly mammoths had the same diet as elephants."], "passage": "<strong>Read the passage.</strong><br><br>It is said that from about 400,000 until 4,000 years ago, woolly mammoths roamed the earth; more specifically, they lived in Africa, Europe, Asia, and North America. Woolly mammoths were covered in fur, which varied in color from dark to light, and they were approximately the same size as modern-day African elephants. Their ears and tail were short, and they had long tusks and four molars. Their behavior was similar to that of modern elephants-they used their tusks and trunks for fighting and foraging for food. Woolly mammoths ate grass and plants. They could reach the age of 60."}, {"n": 5, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the prefix un-?", "options": ["before", "incorrectly", "one", "not"], "passage": "<strong>Read the sentences.</strong><br><br>My uncle hasn't worked in a few months. He doesn't like being unemployed."}, {"n": 6, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the word \"vindictively\"?", "options": ["in a happy manner", "in a revengeful manner", "in an embarrassed manner", "in a depressed manner"], "passage": "<strong>Read the sentence.</strong><br><br>Julie and I had a fight last year and I thought we could let it go, but today I saw her grin quite vindictively, when I got a D on my math test."}, {"n": 7, "type": "text", "section": "Detail & inference", "stem": "One may conclude from the information in this passage that Platform 9¾", "options": ["can be found in a work of fiction.", "is a genuine, secret platform.", "is where the Hogwarts School of Witchcraft and Wizardry is.", "is not very popular."], "passage": "<strong>Read the passage.</strong><br><br>King's Cross train station, a major London railway terminal located in central London, is featured in J. K. Rowling's series of fictional books Harry Potter. It is the starting point of the Hogwarts Express train to the Hogwarts School of Witchcraft and Wizardry. In the series, the train uses a secret platform - Platform 9¾ - accessed through the brick wall between platforms 9 and 10.<br><br>At King's Cross station, a Platform 9¾ plaque was presented in 1999 to mark the location of the fictional platform. Part of a luggage trolley was installed below the sign: the near end of the trolley is visible, but the rest seems to have disappeared into the wall. The location quickly became a popular tourist spot among Harry Potter fans."}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "Which of the following sentences is the most reliable?", "options": ["M&M's were first introduced in 1941.", "They are in fact the healthiest candy.", "They make a wonderful, healthy breakfast.", "Your breakfast will also be a very memorable one."], "passage": "<strong>Read the passage.</strong><br><br>First introduced in 1941, M&M's may look like any other candy, but they are in fact the healthiest candy! They make a wonderful, healthy breakfast! Your breakfast will also be a very memorable one! M&M's are on sale for only $2.99 at a store near you!"}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Why did Rowling not sign her full name on the Harry Potter books?", "options": ["because she wanted to become a billionaire", "because her publisher thought it was important to donate a lot of money to charity", "because she had a low self-esteem at the time", "because her publisher thought the book would be less successful if she did"], "passage": "<strong>Read the passage.</strong><br><br>English author J. K. Rowling's life is a rags-to-riches story: her mother was ill for many years and passed away when Rowling was twenty-five years old. Then she moved to Portugal, taught English as a foreign language, and she got married and gave birth to a daughter. Due to the aggression of her husband, she had to leave him and return to the UK a year later. She had started writing Harry Potter, but she was unemployed and lived in a small apartment with her baby daughter. She had a low self-esteem at the time. When she finished writing Harry Potter and the Sorcerer's Stone, several publishers rejected the book. At last, Bloomsbury Publishing, a British publishing house, agreed to publish it, requesting that she use her initials in her pen name, because the publisher believed female authors' names were less appealing to young boys.<br><br>Once the Harry Potter books were published, they became an instant success. Their popularity only grew as the series progressed, and they have now sold hundreds of millions of copies and have been translated into over 80 different languages. Rowling has now made a fortune from her books; she became a self-made billionaire and the first person to lose the billionaire title due to donations to charity. She is now worth about $860 million and is the highest paid author in the world."}, {"n": 10, "type": "text", "section": "Detail & inference", "stem": "What is one reason to choose a capsule hotel over a regular hotel?", "options": ["It is a lot cheaper.", "It offers a restaurant and a pool.", "It is a traditional part of trips to Japan.", "It includes a wi-fi connection."], "passage": "<strong>Read the passage.</strong><br><br>A capsule hotel is a type of hotel developed in Japan. What makes it so special is the fact that it doesn't have rooms: the guests sleep in tiny box-shaped \"rooms,\" called capsules, that have room only for a bed. The bed takes up the entire capsule and the guest cannot sit upright inside the capsule, but only lie down. The capsule is typically made of plastic or fiberglass. The capsules are stacked side by side, two units high.<br><br>Most capsules include a television and a wi-fi connection, and the hotel provides vending machines and sometimes a restaurant and a pool. This style of hotel can be found primarily in Japan, but can also be found in Hong Kong, the Philippines, and Belgium. These hotels are very popular among people without a lot of money and only wish to stay one night. A capsule hotel might have as few as fifty or as many as seven hundred capsules."}, {"n": 11, "type": "text", "section": "Detail & inference", "stem": "Who most likely locked the door in this story?", "options": ["the trapeze artist", "Rubber Girl", "the clown", "Fiona"], "passage": "<strong>Read the story.</strong><br><br>The flying trapeze artist tried to open the door to the stage, but it was stuck. Everyone backstage of the circus show stopped what they were doing. Rubber Girl cried, \"Someone locked the door!\" All the performers looked around suspiciously and started throwing accusations at one another. \"We have an audience waiting for us outside. We have to find a way to open the door!\" called Fiona. Everyone ran to the door and tried to push it open. The clown announced, \"Coming through! I'll open the door!\" He asked everyone to move away and they obeyed. He pushed the door again and again, but it did not open. He secretly pulled a shiny little object out of his ridiculously big shoe. The door opened when he pushed it next. Everyone cheered and hugged the clown. They all thanked him for saving the day."}, {"n": 12, "type": "text", "section": "Vocabulary in context", "stem": "Which set of words all have the same root word?", "options": ["reach, breach, preach", "puzzle, dazzle, blizzard", "misuse, useless, user", "forever, over, never"]}, {"n": 13, "type": "text", "section": "Main idea & theme", "stem": "What is the moral in this story?", "options": ["If a bear attacks you, you should try to fight him.", "If you are in danger, it is better to run away.", "Never walk through a forest all by yourself.", "Misfortune is the test of true friendship."], "passage": "<strong>Read the story.</strong><br><br>Two squirrel friends were walking through the forest when a bear jumped out at them. One started to run, climbing on a tree and hiding himself, but the other remained on the road. He had nothing to do, so he fell down on the ground and pretended he was dead. The bear went up to him and sniffed at him, but the squirrel had stopped breathing. The bear sniffed at his face; he thought the squirrel was dead, so he went away. When the bear was gone, the squirrel climbed down from the tree and, laughing, said, \"What did the bear whisper in your ear?\" \"He told me that those who are in danger and run away from their friends are not good friends,\" said the squirrel that remained on the road."}, {"n": 14, "type": "text", "section": "Detail & inference", "stem": "How did Sebastian's character develop in the story?", "options": ["He learned to play dodgeball.", "He apologized for stepping on another child's toes.", "He learned to play fair.", "He stopped yelling."], "passage": "<strong>Read the passage.</strong><br><br>Coach Clarke named two students as team captains and asked them to pick students for their dodgeball teams. When there were only a dozen students left, Sebastian cried, \"If you don't pick me next, I'm not going to play at all!\" Jill named Sebastian next and he joined her team, cheering.<br><br>Ten minutes into the game, Steve accidentally stepped on Sebastian's toes while trying to catch the ball before it rolled over to the other team's field. \"Foul!\" yelled Sebastian, even though Steve was on his team. \"Steve shouldn't play anymore, Coach!\" he demanded of Coach Clarke. \"He stepped on my toes on purpose!\" Steve apologized to Sebastian repeatedly and promised Coach Clarke it was an accident. Coach Clarke told Sebastian she would allow Steve to keep playing. Sebastian stomped his foot and turned to Steve. \"I don't like playing with you!\" Coach Clarke said, \"If you don't start playing fair and stop ruining the game for everybody else, Sebastian, I won't let you play anymore.\" Sebastian looked at Coach Clarke, and said, \"All right.\" For the rest of the game Sebastian was quiet, and at the end of the game he went to Jill and Steve and apologized. They all shook hands."}, {"n": 15, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the passage is persuasive?", "options": ["While we sleep, our muscles rest and the information we absorbed during the day is processed in our memories.", "The first one is sticking to a routine.", "Playing ball, swimming, or riding a bicycle can help you fall asleep faster.", "If you follow these two rules, you are likely to be more active and focused during the day."], "passage": "<strong>Read the passage.</strong><br><br>Sleep is one of the most important processes in our bodies. While we sleep, our muscles rest and the information we absorbed during the day is processed in our brains. Lack of sleep may lead to restlessness, stubbornness, and mood swings.<br><br>In order to be healthy and stay focused in school, it is recommended to follow two specific rules. The first one is sticking to a routine. Once you go to sleep every night at a fixed time, your body gets used to it and it is easier to fall asleep. The second one is exercising during the day. Playing ball, swimming, or riding a bicycle can help you fall asleep faster. If you follow these two rules, you are likely to be more active and focused during the day."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
