const QUESTIONS = [{"n": 1, "type": "text", "section": "Detail & inference", "stem": "What is most likely the reason that Martin did all the things that made Andrea so angry, such as following her around and wearing her clothes?", "options": ["because he liked following people", "because he wanted to be more like her", "because he thought their parents loved her more than they loved him", "because he wanted to make her angry"], "passage": "<strong>Read the passage.</strong><br><br>Andrea's six-year-old brother, Martin, was always irritating her. He would follow her around the house wherever she went. He would ask her what she was doing several times a minute, even when she was only sitting and reading a book or playing with her phone. If Andrea asked for spaghetti at dinner, Martin had to have the same food. He took clothes from her closet without permission, tried them on, and wanted to wear them to school before their mother stopped him. He begged Andrea to take him when she went to meet her friends, but even though she repeatedly refused, he was so persistent that their mother made Andrea take him with her.<br><br>One day, Andrea came back home to find her geography book had been destroyed: Martin had taken it and written his name on every page in red paint, so the book was so wet and sticky with paint it could no longer be used. \"That's it!\" Andrea shrieked. \"This is the last straw, Martin! You are never coming anywhere near me or my things again!\"<br><br>Martin stood and stared at her with tears in his eyes. He tried to say something, but Andrea's fury was so intimidating that he was too afraid to talk. She slammed her door and decided she would never talk to him again.<br><br>A few hours later, when Andrea came downstairs for dinner, she was shocked to find the kitchen had been decorated with balloons, and there was a chocolate cake on the table with her name on it.<br><br>\"It's not my birthday,\" she said, bewildered.<br><br>\"Mom helped me to do it for you,\" said Martin, stepping in from behind her. Andrea turned around to look at him. \"I'm sorry about your book,\" he said, with tears in his eyes again. \"I only did it because I wanted you to remember me when you're in class. I'm sorry.\" Andrea hugged him, and they made up at once."}, {"n": 2, "type": "text", "section": "Main idea & theme", "stem": "What is the moral of the story?", "options": ["Every trickster might be caught.", "Be respectful of others.", "Appearances may be deceiving.", "Twins whose mother is a teacher must study hard."], "passage": "<strong>Read the passage.</strong><br><br>Dylan and Connor were twelve-year-old identical twins who liked to play tricks and pranks on everybody. They constantly switched the sugar with the salt at the dinner table, so their father's coffee was undrinkable. They would crank call the neighbors, no matter how often their parents made them apologize.<br><br>Their favorite trick, though, was switching places. At school, they would always switch places, each making his friends believe he was his own brother, then burst out laughing. They always confessed after a while, unless they used this trick for tests.<br><br>For Dylan and Connor had a secret: they would switch places and take exams for each other. Since Dylan was more mathematical than Connor, and Connor was more gifted at English, Dylan would take Connor's math exams while Connor would take Dylan's English exams. Therefore, on the day of Connor's math final, they came to school as usual, ready to switch places at the right moment. However, as Connor walked into the classroom in the morning, his mouth dropped open in horror: his mother was standing there, eyeing him sternly.<br><br>\"W-what are you doing here?\" Connor stammered.<br><br>\"I am your substitute teacher today, Connor,\" said his mother. \"Please take your seat.\"<br><br>Connor sat, more anxious than he had ever been before. What was he going to do? He hadn't studied for the math test, assuming Dylan would take it for him as usual; but there was no way they could fool their own mother, who was strict and observant and would never fall for a switching trick. They never even dared switching the sugar and salt when she was around: she was too quick for them!"}, {"n": 3, "type": "text", "section": "Detail & inference", "stem": "According to the passage, it is likely that:", "options": ["The same musical piece will make everyone feel frisson, as long as they are able to experience it.", "Goosebumps is one of the symptoms of frisson.", "Frisson is meant to keep humans warm.", "High levels of imagination might stop a person from feeling frisson."], "passage": "<strong>Read the passage.</strong><br><br>\"Frisson\" is a French term for chills of pleasure, which many people get while listening to certain musical pieces, looking at beautiful artwork, or watching a moving scene from a movie. About two-thirds of the population occasionally experience frisson. The more engaged a person is in a piece of music or art, the more likely he or she is to experience frisson. Typically, frisson causes goosebumps, and scientists have been trying to discover why. Goosebumps is a skin reaction which typically occurs after a rapid change in temperature. The hairs on our skin are raised, then lowered, which creates a layer of warmth. However, since this is a physiological reaction, and frisson is psychological, science has yet to explain why frisson may cause goosebumps.<br><br>Studies have tried to explain why some people experience frisson while others do not. It has been shown that people who experience frisson also score high for a personality trait called \"openness to experience,\" and are more imaginative and curious than other people."}, {"n": 4, "type": "text", "section": "Detail & inference", "stem": "Which of the following sentences from the text contradicts the assumption that brain freeze cannot be experienced in winter?", "options": ["Every summer, millions of people experience brain freeze, typically when eating ice cream.", "Brain freeze, also known as ice cream headache, is a pain, usually a headache, that occurs when consuming cold beverages or food, such as ice cream.", "It is possible to suffer from brain freeze in both hot and cold weather, because it is the temperature of the food or beverage being consumed, not the environment.", "It has been observed that other animals, such as cats, can also experience brain freeze."], "passage": "<strong>Read the passage.</strong><br><br>Every summer, millions of people experience brain freeze, typically when eating ice cream. What is brain freeze, and what causes it?<br><br>Brain freeze, also known as ice cream headache, is a pain, usually a headache, that occurs when consuming cold beverages or food, such as ice cream. Typically, the consumption is quick, and consuming those slowly could prevent brain freeze. When something cold touches the roof of the mouth, it causes a nerve response, which leads to rapid constriction and swelling of blood vessels. It is possible to suffer from brain freeze in both hot and cold weather, because it is the temperature of the food or beverage being consumed, not the environment. It has been observed that other animals, such as cats, can also experience brain freeze. To ease the pain, it is recommended to press your tongue against the roof of your mouth to warm the area, tilt your head back for twenty seconds, drink something warm, or breathe in through your mouth and out through your nose."}, {"n": 5, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following can replace the word \"admonished\"?", "options": ["reprimanded", "investigated", "requested", "fired"], "passage": "<strong>Read the paragraph.</strong><br><br>This boy always crosses the line. Last week he came to school with blue hair! He was admonished by the principal, but you can be sure he'll come up with something new this week."}, {"n": 6, "type": "text", "section": "Text structure", "stem": "What is the correct chronological sequence of events?", "options": ["Tetris was released; Tetris came bundled with every Game Boy; The Tetris Company was founded; Tetris was announced as the best-selling video game of all time.", "Tetris was announced as the best-selling video game of all time; Tetris was released; Tetris came bundled with every Game Boy; The Tetris Company was founded.", "The Tetris Company was founded; Tetris was released; Tetris came bundled with every Game Boy; Tetris was announced as the best-selling video game of all time.", "The Tetris Company was founded; Tetris was released; Tetris was announced as the best-selling video game of all time; Tetris came bundled with every Game Boy."], "passage": "<strong>Read the passage.</strong><br><br>The popular video game Tetris, announced in 2010 as the best-selling video game of all time, was released in 1984 in Moscow, Russia, by Russian designer Alexey Pajintov. Computers were rare, but the game still gained popularity quickly. By 1989, it was bundled with every Game Boy, a handheld game console, much like a tablet for games only. In 1996, the rights to the game reverted to Pajintov, who had made very little money from the game, and The Tetris Company was founded."}, {"n": 7, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an example of symbolism?", "options": ["people saying the Princess would never be smart", "the Queen giving Princess Anne textbooks as birthday presents", "Prince Leopold leaving Princess Anne a red rose", "Princess Anne inheriting the throne"], "passage": "<strong>Read the passage.</strong><br><br>Princess Anne was the daughter of a king who was known for his stupidity. People always said she would never be smart because of her father, and that she would be just as bad a ruler as he was. Her father had passed away when she was very young, and Princess Anne's mother, the Queen, encouraged her daughter to read books and study hard. \"When you are queen, you are going to need to know so much,\" she told her. \"Now is the time to work hard on your studies, because when you are queen, you will not have the time to study. You will have a kingdom to run.\" On every single birthday, the Queen gave her daughter a textbook as a birthday present.<br><br>The Princess met her true love, Prince Leopold, in the grand ball on her eighteenth birthday, and from then on, they were inseparable. When Prince Leopold was about to leave on a long journey with his parents to the City of Periculo, also known as the Dangerous City, he came to bid Anne farewell and leave her a single red rose. \"Know that I will always love you,\" he said, \"and even though I am going on this excursion and we may not see each other again, I will cherish our love.\"<br><br>As soon as Prince Leopold left, the Queen suddenly fell ill and her life was in danger. Many people hovered over her bed night and day, and, in her absence, Princess Anne was required to attend to the needs of the Kingdom. Fortunately, thanks to everything she had learned from her mother and the books she'd read since she was young, she always had the answers she needed and managed to run the Kingdom as well as attend to her mother's sickbed, all at the same time.<br><br>A few months later, Anne's true love returned from his long journey. He had survived all the dangers on the way and had come to ask Anne to marry him. Fortunately, the Queen recovered and was able to be part of her daughter's wedding. At the request of her still-delicate mother, Princess Anne soon became Queen, and was known as a clever and just ruler, beloved by all."}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "If you play a signature whistle to a group of dolphins which includes the dolphin with that signature whistle, and all the dolphins in the group know each other, it is likely that", "options": ["all the dolphins will make the same response.", "the dolphin with that signature whistle will respond, but none of the others will.", "the dolphin with that signature whistle will respond, and some of the others will, too.", "none of the dolphins will respond."], "passage": "<strong>Read the passage.</strong><br><br>Bottlenose dolphins communicate with each other using body language and high-pitched whistles. Since sound travels faster through water than air, it is very useful for dolphins. When a dolphin hears another dolphin's whistle, it will often whistle itself or move toward the whistler.<br><br>It has also been found that each dolphin develops its own distinctive whistle, called a signature whistle, which serves as a means of individual identification, much like a name. When dolphins are in a group, many of them whistle at once. The fact that each whistle is distinctive might help them keep track of each other.<br><br>Scientists have recorded some of those signature whistles. When they played a signature whistle to the dolphin who announced it, the dolphin responded back with the same call. When the scientists played the whistles to a group of dolphins, the dolphins responded a little to whistles made by familiar dolphins from the same population, but did not respond at all to whistles made by unfamiliar dolphins.<br><br>When a member of a dolphin group is missing, the group can call that dolphin's signature whistle to signal it. When dolphins get separated, they often whistle to each other until they are reunited."}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following sentences describes the sequence of events in the passage?", "options": ["Dutch settlers hunted all the dodos, leading to their extinction.", "The dodo went extinct because it could not fly.", "The dodo went extinct before the Dutch settlers came to Mauritius.", "The dodo went extinct because of hunting and predators eating its eggs."], "passage": "<strong>Read the passage.</strong><br><br>The dodo was a bird that lived on the island of Mauritius until the seventeenth century. Nowadays, it is extinct. It was a large, flightless bird, with a long beak and gray plumage. It had no natural predators on the island.<br><br>When Dutch settlers came to Mauritius in the sixteenth century, they hunted numerous dodos and ate their meat. They also introduced animals that were new to the island, including dogs, cats, macaques, and pigs. Some of those animals escaped captivity and became feral, and they began plundering dodo nests and eating their eggs. Since the dodo only laid one egg per season, the number of eggs decreased quickly and the dodo population declined drastically, until the dodo went extinct in the middle of the seventeenth century."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "What is the author's viewpoint on Tolkien in the passage?", "options": ["Tolkien was a noble man.", "Tolkien was very religious.", "Tolkien was a brilliant man.", "Tolkien is the most successful author in the world."], "passage": "<strong>Read the passage.</strong><br><br>J. R. R. Tolkien, author of The Lord of the Rings, was not only a successful author but also a master linguist and philologist. A professor in college, he specialized in studying Old English, but was fond of many other languages, especially Finnish and Welsh. While writing The Lord of the Rings, and for many years after, he created his own languages for the creatures in his stories. He created a whole family of languages for the Elves in the story, called the Elvish languages, and continued to develop their grammar and history until he died. Some of those Elvish languages had traces of Finnish, Welsh, and other European languages.<br><br>(Linguist - a person who studies language. Philologist - a person who studies written languages in historical resources.)"}, {"n": 11, "type": "text", "section": "Main idea & theme", "stem": "Which of the following is the best summary of the speech?", "options": ["Education should be at top of the political priority. Children in this country are currently not doing well on tests. I intend to improve that by enforcing a bonus system for the teachers that will benefit teachers with students who do better on national tests, and focusing my efforts on the math and science test scores.", "Thank you for coming. It is very important to me that you are here today. This country has several problems, the most important of which is our education and the fact that children are receiving low scores on national tests. I intend to work on that problem and my main suggestion is implementing a merit-based bonus system for the teachers.", "What does the phrase \"children of our future\" mean? It means that with a lot of hard work, our children can do much better on national tests. I intend to make sure this will happen.", "Our tax dollars have not been used to change the problem with the education system, and this is what I intend to change. I will work hard to ensure that all children do better on national tests, especially math and science which will help the future generations run this country better."], "passage": "<strong>Read the speech.</strong><br><br>My friends, thank you for joining us today. I feel pride and gratitude for the children of our country; it pains me to see how many of them have stopped believing in themselves. It is my job to bring back the self-confidence of our youth.<br><br>Like any other country, this country has several issues to deal with. There is the energy crisis. There is a financial crisis. But how can we ever hope to overcome these crises, I ask you, without investing our best efforts into educating future generations and hope they will be able to do a better job than us running this country?<br><br>We often hear the phrase \"children of our future,\" but what does it truly mean? Our children's test scores are very low in comparison with other first-world countries. This was not always the case; it is a phenomenon that stems from the neglect of the last generation. It is my belief that thus far, the tax dollars have not been used to change that. For example, I have pushed for a merit-based bonus system for the teachers: a teacher whose students do better on national tests will receive a higher bonus. If elected, I intend to enforce that bonus system and put a special emphasis on ensuring the math and science test scores are improved. I believe that our children can achieve high results with a bit of hard work and a lot of encouragement."}, {"n": 12, "type": "text", "section": "Detail & inference", "stem": "Which of the following answers includes some of the differences between Sirmen and Szymanowska, according to the passages?", "options": ["Sirmen was Italian and Szymanowska was Russian; Sirmen's compositions influenced some famous composers and Szymanowska was more successful as a performer.", "Sirmen was born earlier than Szymanowska; Sirmen was a pianist and Szymanowska was a violinist; Szymanowska was one of the first musicians to perform without notes.", "Sirmen played the violin and Szymanowska the piano; Sirmen was Italian and Szymanowska Polish; Sirmen only performed with her husband while Szymanowska was a successful performer on her own.", "Sirmen was an Italian violinist and Szymanowska a Polish pianist; Szymanowska was one of the first musicians to perform without notes."], "passage": "<strong>Read the passages.</strong><br><br>Maddalena Laura Sirmen was an Italian violinist and composer. She was born in 1745 in Venice, Italy. It was difficult for women to succeed as musicians at that time, and Sirmen only became successful after her marriage to a renowned violinist, Ludovico Sirmen. The couple performed together, which allowed Maddalena to build a reputation, and later a solo career. She was a successful performer and an even more successful composer, her violin compositions were considered \"brilliant.\"<br><br>Maria Szymanowska was a Polish composer. Born in 1789, she was a brilliant pianist and performed in several countries in Europe, including France, England, Germany, and Italy. Her playing was very well received by critics and audiences, and she was one of the first pianists to perform memorized repertoire in public, without the notes to help her. She moved to Russia in 1828 and became a court pianist to the Russian Empress, Alexandra Feodorovna. Szymanowska composed around 100 piano pieces, which were said to influence Frédéric Chopin, one of the most famous Polish composers of all time."}, {"n": 13, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the story?", "options": ["Landon does not like math.", "Landon gets help from an unexpected source.", "Robin comes to a decision.", "Robin sacrifices his only free time to help Landon."], "passage": "<strong>Read the passage.</strong><br><br>Landon had a very important math test. He usually got decent grades in this subject; however, in the last few months it was getting more and more difficult, and this upcoming test was scary. He sat down every night and tried to understand what the teacher had done in class, but it was getting more complicated and he started to realize that he wouldn't be able to solve the problem on his own.<br><br>Three days before the test, Landon went to the playground after school to watch his little sister and saw his friend Robin. Robin was a student at another school in town, and they had met at summer camp. Robin came over to talk to Landon and asked why he was looking so glum. Landon told him about his fear of the upcoming math test.<br><br>\"Not to worry,\" said Robin. \"Let's go to your house, and I'll teach you. We had a test about these things last week and I got an A.\"<br><br>\"But do you have the time?\" Landon asked. \"I need a lot of help, and the test is in three days.\"<br><br>\"Don't worry about it,\" said Robin. Landon called his little sister over and they all went home together. Landon and Robin went up to Landon's room, and Robin took a sheet of paper and explained the material to Landon.<br><br>There was a lot of material to go over and Landon didn't understand everything right away. But Robin proved himself to be a marvelous teacher. When he went to bed that night, Landon felt more confident about the test. He knew it was all thanks to Robin and felt very grateful.<br><br>The next day, Landon was surprised to find Robin at his doorstep after school. \"I came because we didn't finish yesterday,\" Robin explained. He came in and they kept working, and he returned the next day as well. They covered all the material for the test together, and when Landon sat down in class on the day of the test, he knew he was ready and felt more relaxed than he had all week."}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "What does the storm in the story symbolize?", "options": ["sadness", "a surprise", "danger", "anger"], "passage": "<strong>Read the passage.</strong><br><br>It was late afternoon, and three young children were walking in the forest. The high trees were full of leaves and were blocking their view of the sky, but they were able to see the way. The day was hot - so hot that beads of sweat were running down the children's foreheads and cheeks, and their clothes were sticking to their backs. Small birds were flying around and chirping, but as the children kept walking, they could hear fewer and fewer birds. The trees were growing further apart now, and they could see the sky.<br><br>Suddenly, they came to a clearing. They looked around them, unsure where to go next. Then, before they could reach a decision, they heard thunder in the distance and the sky above them turned dark almost at once. They looked up and saw clouds gathering up quickly - a storm was coming. Heavy raindrops started to fall all around them and the thunder grew louder and closer."}, {"n": 15, "type": "text", "section": "Author's craft & structure", "stem": "Lucy's words are an example for which literary device?", "options": ["metaphor", "irony", "alliteration", "personification"], "passage": "<strong>Read the passage.</strong><br><br>Edmund's little sister, Lucy, suddenly started telling the entire family about a magical land she had found inside the closet. Edmund did not believe her, and he constantly made fun of her. A few days later, Edmund found out that Lucy hadn't been lying - the magical land was real! However, he didn't want the other family members to think he was insane like Lucy, so when they asked him about it, he lied, saying that he and Lucy had only been pretending that her land was real. \"Thank you very much, Edmund,\" said Lucy."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
