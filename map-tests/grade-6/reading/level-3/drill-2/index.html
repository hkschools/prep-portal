<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";

const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Vocabulary in context", "stem": "Which possible meanings does the word terrific have in the sentence?", "options": ["long or short", "worrying or relaxing", "marvelous or delicious", "intense or frightful"], "passage": "<strong>Read the sentence.</strong><br><br>Owing to a terrific storm, the captain of the ship had to postpone his departure."}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "According to the story, which of the following is a quality of the narrator?", "options": ["good listener", "reliable", "likes parties", "brave"], "passage": "<strong>Read the passage.</strong><br><br>I had been an admirer of Amy Greenhouse's music for years and years before I finally got the chance to meet her. I had gone to all her concerts. Every day, I listened to all her songs on my iPod. When I listened to her voice, I felt like the sky had opened and I was entering heaven, it was so good. I read every single article about her; I watched interviews with her, I hung her posters in my room. I would have liked nothing better than to meet her and tell her how much I loved her and her voice.<br><br>Last August was my best friend Annie's birthday. She had planned a big party and invited all our friends. I had already bought her a present and promised to be in charge of the music during the party, when I found out that Amy Greenhouse was coming to town and giving a concert on the very same night.<br><br>I begged Annie to change the date of the party, but unfortunately, her parents had already booked a caterer and it was impossible. Amy Greenhouse was my hero and I wanted to see her more than anything, but I knew that if I wouldn't go to the party, no one would help with the music and the party would be ruined. It was a very difficult decision, but eventually I decided that friendship was more important and I would go to Annie's party instead of the concert."}, {"n": 3, "type": "text", "section": "Detail & inference", "stem": "How had Eli changed over the years?", "options": ["He started to break fences.", "He stopped watching short, funny movies on the internet and playing video games.", "He wanted to go outside.", "He started vandalizing the neighborhood and playing offensive tricks on his neighbors."], "passage": "<strong>Read the passage.</strong><br><br>James was exhilarated. He was on his way to meet Eli, a friend he hadn't seen since they had entered elementary school five years ago. Eli had moved away with his parents and the two of them only kept in touch over the internet.<br><br>James was now finally old enough to take the train by himself, and his parents had finally allowed him to go. On his way, he thought longingly of the days he and Eli had spent together; they had always liked to play video games and watch short, funny movies on the internet. He was looking forward to doing that today.<br><br>When James got off the train and met Eli and his parents, they were all thrilled to see each other, and a short while later they arrived at Eli's house.<br><br>James wanted to play a video game, but Eli said he didn't have any video games anymore. Eli wanted to go outside and meet his friends and James reluctantly agreed. Eli and his friends ran around the backyards of the neighborhood, breaking fences and leaving insulting letters in mailboxes. When James saw what they were doing, he pretended to be feeling ill so he could go back to the house and ask Eli's parents to take him back to the train station. He knew he would probably never see Eli again, and he was happy about it."}, {"n": 4, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is a synonym of the word ardent?", "options": ["enthusiastic", "fascinated", "indifferent", "confused"]}, {"n": 5, "type": "text", "section": "Text structure", "stem": "Which of the following statements can be concluded from the table?", "options": ["Most days, the difference between the number of trains going through station A and station C is 10 or less.", "Most days, the difference between the number of trains going through station B and station C is 10 or less.", "Most days, the number of trains going through stations B and C is equal.", "Most days, the number of trains going through stations A and C is equal."], "passage": "<strong>Read the following information about the number of trains going through three different stations on weekdays.</strong><br><br>(The passage includes a data table of train counts for stations A, B, and C across Monday to Friday.)"}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "Which of the following sentences is an example that the author is biased?", "options": ["It is a recessive trait, which means you have to get the trait from both your parents in order to have it.", "If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world.", "You might be interested to know that red hair used to be considered an evil trait.", "Red-haired people were persecuted because they were believed to be vampires."], "passage": "<strong>Read the passage.</strong><br><br>Red hair is uncommon, occurring in about 1%-2% of people. It is a recessive trait, which means you have to get the trait from both your parents in order to have it. If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world. Then again, you still may not have red hair. You might be interested to know that red hair used to be considered an evil trait. Red-haired people were persecuted by people who believed they were vampires."}, {"n": 7, "type": "text", "section": "Vocabulary in context", "stem": "Based on the sentences, what is the meaning of the word eclectic?", "options": ["funny and amusing", "of very high quality", "made up of various sources and styles", "extremely loud and boisterous"], "passage": "<strong>Read the sentences.</strong><br><br>I was so disappointed in that art museum. I was sure it was going to be eclectic, but there were only paintings and they were all from the medieval era. That was not what I was looking forward to."}, {"n": 8, "type": "text", "section": "Author's craft & structure", "stem": "Why does Tom refuse to let Ben whitewash the fence at first?", "options": ["because he likes to do it himself", "because his aunt is very particular about the way it is done", "because he wants Ben to think it is a desired job", "because he does not trust Ben to do it properly"], "passage": "<strong>Read the passage.</strong><br><br>Tom, who was whitewashing the fence, surveyed his last touch with the eye of an artist, then he sighed. Ben ran up alongside of him, eating an apple. Tom's mouth watered for the apple, but he stuck to his work.<br><br>Ben said: \"Say I'm going swimming, I am. Don't you wish you could? But of course you'd rather work - wouldn't you?\"<br><br>Tom contemplated the boy a bit, and said: \"What do you call work?\"<br><br>\"Why, isn't that work?\"<br><br>Tom resumed his whitewashing, and answered carelessly: \"Well, maybe it is, and maybe it isn't. All I know, is, it suits Tom Sawyer.\"<br><br>\"Oh come, now, you don't mean to let on that you like it?\"<br><br>The brush continued to move.<br><br>\"Like it? Well, I don't see why I oughtn't to like it. Does a boy get a chance to whitewash a fence every day?\"<br><br>That put the thing in a new light. Ben stopped nibbling his apple, watching every move and getting more and more interested, more and more absorbed. Presently he said: \"Say, Tom, let me whitewash a little.\"<br><br>Tom considered, was about to consent; but he altered his mind: \"No - no - I reckon it wouldn't hardly do, Ben. You see, Aunt Polly's awful particular about this fence - right here on the street, you know - but if it was the back fence I wouldn't mind and she wouldn't. Yes, she's awfully particular about this fence; it's got to be done very carefully; I reckon there isn't one boy in a thousand that can do it the way it's got to be done.\""}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct, according to the passage?", "options": ["McDaniel was a successful actress from the moment she started her career.", "McDaniel was accepted to a minstrel show because of her career as a professional singer.", "McDaniel lost several acting parts because she was better known as a singer and comedian.", "McDaniel won an Oscar for a part she had not believed she would get."], "passage": "<strong>Read the passage.</strong><br><br>Hattie McDaniel (1895-1952) was an American stage actress, singer-songwriter, and comedian. Born in Kansas, she was the youngest of thirteen children, and several of her family members had performing skills. At first, Hattie worked with her brother's minstrel show, writing and performing songs, and later, she embarked on a radio career as a professional singer. She recorded many songs before the Great Depression in 1929, which was a big economic crisis, and many people, including McDaniel, lost their jobs.<br><br>In 1931, McDaniel moved to Los Angeles and started working as an actress in films. She had several small roles in various films throughout the 1930s, many uncredited. However, towards the end of the 1930s, she was chosen to play a supporting part in Gone with the Wind, a very famous and successful movie at the time, and played the slave of the house. The competition for the role had been fierce: Eleanor Roosevelt, who was First Lady, wrote to the producer of the film and asked that her own maid be given the part; McDaniel did not believe she could win, but she still went to the audition wearing an authentic maid's uniform and won the part. Gone with the Wind is the most successful film in box-office history and is still regarded as one of the greatest films of all time.<br><br>The role of the slave in Gone with the Wind was extremely popular, and McDaniel won the 1939 Academy Award for Best Supporting Actress, the first Afro-American to win an Oscar. She was also the first Afro-American to be nominated for an Oscar. She played in over 300 movies over the years. Nowadays, she has two stars on the Hollywood Walk of Fame."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is used in the passage to create a mental image of the city of Genoa?", "options": ["personification", "simile", "irony", "alliteration"], "passage": "<strong>Read the paragraph.</strong><br><br>The city of Genoa (Italian: Genova) is located in the north of Italy and is the sixth-largest city in Italy. Its uniqueness becomes evident when you start wandering around its streets. As you walk along the port, the smell of fresh fish surrounds you, nearly engulfing the strong smell of the ocean. The ocean is particularly beautiful in this city, with the water waltzing in the light wind and glowing in the evening sun with a unique hue. As you keep walking, you can hear the whisper of the waves on one side and the musical, loud Italian on the other; yes, the Genovese are warm, kind, and loud! Genoa is nicknamed \"The Vertical Town\" because of its many narrow, steep stairways in the middle of the street, many of which can only be climbed by one person at a time. The stairways are often the only way to get from one place to another in the streets of Genoa, so be prepared to climb quite a lot."}, {"n": 11, "type": "text", "section": "Author's craft & structure", "stem": "How does the setting affect the narrator?", "options": ["The red room is formidable and intimidating and therefore the narrator is afraid.", "The red room is bright and cheerful and therefore the narrator feels relaxed and happy.", "The red room is detached from the rest of the house and therefore the narrator feels lonely.", "The red room is cold and rarely visited by anyone and therefore the narrator is irritated."], "passage": "<strong>Read the passage.</strong><br><br>The red-room was a square chamber, very seldom slept in, I might say never, indeed, unless when a chance influx of visitors at Gateshead Hall rendered it necessary to turn to account all the accommodation it contained: yet it was one of the largest and stateliest chambers in the mansion. A bed supported on massive pillars of mahogany, hung with curtains of deep red damask, stood out like a tabernacle in the center; the two large windows, with their blinds always drawn down, were half shrouded in festoons and falls of similar drapery; the carpet was red; the table at the foot of the bed was covered with a crimson cloth; the walls were a soft fawn color with a blush of pink in it; the wardrobe, the toilet-table, the chairs were of darkly polished old mahogany. Out of these deep surrounding shades rose high, and glared white, the piled up mattresses and pillows of the bed, spread with a snowy Marseilles counterpane. Scarcely less prominent was an ample cushioned easy-chair near the head of the bed, also white, with a footstool before it; and looking, as I thought, like a pale throne.<br><br>This room was chill, because it seldom had a fire; it was silent, because remote from the nursery and kitchen; solemn, because it was known to be so seldom entered. The house-maid alone came here on Saturdays, to wipe from the mirrors and the furniture a week's quiet dust; and Mrs. Reed herself, at far intervals, visited it to review the contents of a certain secret drawer in the wardrobe, where were stored divers parchments, her jewel-casket, and a miniature of her deceased husband; and in those last words lies the secret of the red-room - the spell which kept it so lonely in spite of its grandeur.<br><br>[...]<br><br>Shaking my hair from my eyes, I lifted my head and tried to look boldly round the dark room; at this moment a light gleamed on the wall. Was it, I asked myself, a ray from the moon penetrating some aperture in the blind? No; moonlight was still, and this stirred; while I gazed, it glided up to the ceiling and quivered over my head. I can now conjecture readily that this streak of light was, in all likelihood, a gleam from a lantern carried by some one across the lawn: but then, prepared as my mind was for horror, shaken as my nerves were by agitation, I thought the swift darting beam was a herald of some coming vision from another world. My heart beat thick, my head grew hot; a sound filled my ears, which I deemed the rushing of wings; something seemed near me."}, {"n": 12, "type": "text", "section": "Detail & inference", "stem": "Which of the following sentences from the passage is an opinion?", "options": ["Organisms need food to be able to keep their bodies working properly.", "Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty.", "The question of whether or not large amounts of fat are healthy is controversial.", "Fat is found in two main forms: saturated and unsaturated. Unsaturated fats are the healthier option."], "passage": "<strong>Read the passage.</strong><br><br>Those who choose to study nutrition focus on the scientific side of the food we consume. Nutrition provides the cells of an organism with food. Organisms need food to be able to keep their bodies working properly. They also need food to be able to do certain things. Malnutrition can occur when a person does not eat the right amount of nutrients. This person can get better by changing his or her diet so it has the right amount of nutrients.<br><br>The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water.<br><br>Carbohydrates, which are complex structures of sugar units, constitute a large part of common foods such as bread, rice, potatoes, fruit, and vegetables. Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty. They take longer to digest, and because they stay in the stomach longer, they leave the person who has eaten them feeling fuller for longer.<br><br>Protein makes up every cell and organ in an organism's body, including the skin, hair, nails, etc. It also makes up enzymes, which are structures that accelerate chemical reactions in the body. Proteins consist of small units called amino acids. There are twenty amino acids the human body cannot produce internally and must therefore receive from nutrition. Protein is found in meat, eggs, dairy products, and legumes such as beans.<br><br>Fat is found in foods such as avocado, sesame, meat, butter, nuts, etc. Many people think consuming a lot of fat is always unhealthy. However, the question of whether or not large amounts of fat are healthy is controversial. Fat is found in two main forms: saturated and unsaturated. Unsaturated fats are the healthier option.<br><br>Vitamins and minerals are found in many different foods; they are essential to the body, but in small doses. Vitamin or mineral deficiency may lead to serious diseases, and excessive levels may also be dangerous.<br><br>Water, the final nutrient, makes up more than half of the human body weight. It is essential for any life form. In most countries, tap water is a safe water source to drink from. The amount of water recommended for daily consumption varies, depending on age, physical activity, outside temperature, and personal health."}, {"n": 13, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an example of metonymy?", "options": ["Judge Parmalee's office", "Mr. Lincoln", "the Yankees", "Georgia"], "passage": "<strong>Read the passage.</strong><br><br>Stuart and Brent had just been expelled from the University of Georgia, the fourth university that had thrown them out in two years; and their older brothers, Tom and Boyd, had come home with them, because they refused to remain at an institution where the twins were not welcome. Stuart and Brent considered their latest expulsion a fine joke, and Scarlett, who had not willingly opened a book since leaving the Fayetteville Female Academy the year before, thought it just as amusing as they did.<br><br>\"I know you two don't care about being expelled, or Tom either,\" she said. \"But what about Boyd? He's kind of set on getting an education, and you two have pulled him out of the University of Virginia and Alabama and South Carolina and now Georgia. He'll never get finished at this rate.\"<br><br>\"Oh, he can read law in Judge Parmalee's office over in Fayetteville,\" answered Brent carelessly. \"Besides, it don't matter much. We'd have had to come home before the term was out anyway.\"<br><br>\"Why?\"<br><br>\"The war, goose! The war's going to start any day, and you don't suppose any of us would stay in college with a war going on, do you?\"<br><br>\"You know there isn't going to be any war,\" said Scarlett, bored. \"It's all just talk. Why, Ashley Wilkes and his father told Pa just last week that our commissioners in Washington would come to - to - an - amicable agreement with Mr. Lincoln about the Confederacy. And anyway, the Yankees are too scared of us to fight. There won't be any war, and I'm tired of hearing about it.\"<br><br>\"Not going to be any war!\" cried the twins indignantly, as though they had been defrauded.<br><br>\"Why, honey, of course there's going to be a war,\" said Stuart. \"The Yankees may be scared of us, but after the way General Beauregard shelled them out of Fort Sumter day before yesterday, they'll have to fight or stand branded as cowards before the whole world.\""}, {"n": 14, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the first subsection?", "options": ["where you might look to find a sea otter", "sea otters", "what distinguishes sea otters from other mammals and marine animals", "the adaptations of sea otters to their habitat"], "passage": "<strong>Read the passage.</strong><br><br>Sea Otters<br><br>Sea otters are mammals from the weasel family. Their thick, dense fur, the densest fur in the animal kingdom, repels water; they have webbed hind feet with a long fifth digit, facilitating swimming while on their back; and their ears and nostrils close when they are in the water. In order to float effectively, sea otters must be very buoyant; they achieve this because of the air trapped in their fur and their extremely large lung capacity.<br><br>Sea otters are hunters; they feed on marine invertebrates such as snails, mussels, sea urchins, and mollusks. To hunt their prey, sea otters must dive underwater for long periods of time. They can hold their breath for up to five minutes. They also have pouches of skin under their forelegs, where they store food to bring to the surface. They are the only marine animals capable of lifting and turning over rocks, which they often do to search for prey.<br><br>Behavior and Population<br><br>Rocks have another, particularly significant use to sea otters: they often place a rock on their chest, then pound a prey with a hard shell on the rock to open it, making them one of the few mammal species to use tools.<br><br>They are social animals, spending much of their time in groups. Each group consists of either males or females only. To a bystander they may seem to be \"holding hands\" because they float in high proximity to one another.<br><br>Native to the coasts of the northern and eastern North Pacific Ocean, the largest population of sea otters resides in Russia and the second-largest in Alaska. Overall, there are about 107,000 sea otters in the world."}, {"n": 15, "type": "text", "section": "Author's craft & structure", "stem": "Who does the phrase \"my gunpowdery chief\" refer to?", "options": ["the speaker", "Mr. Bixby", "the speaker's father", "the speaker's brain"], "passage": "<strong>Read the passage.</strong><br><br>But of course my complacency could hardly get start enough to lift my nose a trifle into the air, before Mr. Bixby would think of something to fetch it down again. One day he turned on me suddenly with this settler -<br><br>\"What is the shape of Walnut Bend?\"<br><br>He might as well have asked me my grandmother's opinion of protoplasm. I reflected respectfully, and then said I didn't know it had any particular shape. My gunpowdery chief went off with a bang, of course, and then went on loading and firing until he was out of adjectives.<br><br>I had learned long ago that he only carried just so many rounds of ammunition, and was sure to subside into a very placable and even remorseful old smooth-bore as soon as they were all gone. That word \"old\" is merely affectionate; he was not more than thirty-four. I waited. By and by he said -<br><br>\"My boy, you've got to know the shape of the river perfectly. It is all there is left to steer by on a very dark night. Everything else is blotted out and gone. But mind you, it hasn't the same shape in the night that it has in the day-time.\"<br><br>(\"Life on the Mississippi\", Mark Twain)"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
