const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"What is one logical reason, according to the passage, for the knocker-uppers to knock on the windows instead of the doors of the customers?","options":["They thought it was an easier way to wake people up.","They decided knocking on doors was too old-fashioned.","They wanted to wake up only the customers.","They thought it made the job seem more desirable."],"passage":"Technological advancements are all around us, but we rarely stop to appreciate them, and particularly those advancements which have been around long enough so we take them for granted. For example, the camera: before cameras were developed, people who wanted to put up a family photo had to pose for oil paintings. Or the internet: before there was internet available, people who wanted to find information had to go through books, usually several books, to find what they were looking for. Or the telephone: before people had telephones, they had to wait for days, weeks, and even months for a letter to arrive in the mail. Or the remote control: when people first bought televisions for their homes there was no remote, and when they wanted to turn the TV on or off or change the channel, they had to walk up to it and click one of its buttons. Another technological advancement people take for granted is the alarm clock. Have you ever stopped to think how people got up for work on time before the alarm clock was invented? In the past, alarm clocks were not available, and even when they became available, they were not always reliable and not everyone could afford them. Some people, such as people who worked shifts, still had to get to work on time. So, they used the service of a knocker-upper, which was a job people could apply for until the 1970&#x27;s in the UK. A knocker-upper walked around the street carrying a long pole and knocked on the customers’ windows to wake them up. Some knocker-uppers used soft hammers, rattles, and even pea-shooters. In the beginning, knocker-uppers used to ring the doorbell or knock loudly on the door, and later they started using the long sticks to knock on windows from the outside, knocking loudly enough to wake up the people inside the house, but softly enough not to wake the neighbors. And who woke up the knocker-upper? They were usually people who were night owls anyway and slept during the day."},{"n":2,"type":"text","section":"Reading","stem":"If the meaning of the prefix \"iso-\" is \"equal\", which of the following might be described as \"isomagnetic\"?","options":["something with a big magnetic force","something with insignificant magnetic force","something with the same magnetic force","something without any magnetic force"]},{"n":3,"type":"text","section":"Reading","stem":"Which of the following might be called antisocial behavior?","options":["having many friends","lying to yourself","behaving rudely in public","preferring not to be alone"]},{"n":4,"type":"text","section":"Reading","stem":"Which of the following is correct, according to the directions?","options":["To tie both a Half Windsor Knot and a Full Windsor Knot, the wide end of the tie must go through the loop once.","The first difference between a Half Windsor Knot and a Full Windsor Knot is the side on which the wide end of the tie starts.","Pulling down on the knot to adjust it is the most important part, which gives the knot its final, formal look.","Bringing the wide end through the loop must always be done from above."],"passage":"There are several ways to tie a necktie. Although the result might look similar, the way to get to that result differs. Many people have to wear ties to work, formal events, and even casual get-togethers. To tie a Half Windsor Knot: 1. Keep the wide end of the tie on the right-hand side and about a foot below the slim end. 2. Cross the wide end over the slim end and bring the wide end under the loop, then through it. 3. Bring the wide end across the front to the right-hand side and up into the loop from underneath. 4. Bring the wide end through the knot. 5. Pull down on the knot to make it tighter and adjust it with your fingers. To tie a Full Windsor Knot: The Full Windsor Knot is considered the most elegant of all knots. It is wider and more symmetrical compared to the Half Windsor Knot. 1. Keep the wide end of the tie on the left-hand side and about a foot below the slim end. 2. Cross the wide end over the slim end and bring the wide end under the loop, then through it. Bring it out on the right-hand side. 3. Bring the wide end under the knot and through the loop from outside to your left-hand side. 4. From left to right, wrap the wide end of the tie over the knot. Bring it under the knot, through the loop, then through the knot. 5. Pull down on the knot to make it tighter and adjust it with your fingers."},{"n":5,"type":"text","section":"Reading","stem":"What is the structure of the passage?","options":["cause and effect","description","process","problem and solution"],"passage":"A little-known fact is that all modern card games originate from dominoes, which has been a pastime for centuries. The access to papermaking in China led to the creation of paper cards with domino markings in the 9th century. Over time, other card games were developed, and a few hundred years later, cards arrived in Europe. At that time, all cards were hand-illustrated and therefore considered a luxury item, but as demand increased, a method of printing was developed and cards became available to a wider public in the early 15th century. By the mid-15th century, the cards we know today were developed in France, including the court cards and suits."},{"n":6,"type":"text","section":"Reading","stem":"What is the mood in the poem?","options":["loss","dreams","angry","gloomy"],"passage":"| stand amid the roar Of a surf-tormented shore, And | hold within my hand Grains of the golden sand-- How few! yet how they creep Through my fingers to the deep, While | weep--while | weep! O God! can I not grasp Them with a tighter clasp? O God! can | not save One from the pitiless wave? Is all that we see or seem But a dream within a dream?"},{"n":7,"type":"text","section":"Reading","stem":"What can be said about Marilla's character, based on the passage?","options":["She is a no-nonsense person, but will willing to indulge Anne somewhat.","She is amused by Anne, but she has no interest in her.","She is extremely stern, but she thinks Cordelia is a prettier name than Anne.","She is firm and harsh, but she is extremely fond of Anne."],"passage":"&quot;Well, don&#x27;t cry any more,” said Marilla. &quot;We&#x27;re not going to turn you out of doors tonight. You&#x27;ll have to stay here until we investigate this affair. What’s your name?&quot; The child hesitated for a moment. &quot;Will you please call me Cordelia?&quot; she said eagerly. &quot;CALL you Cordelia? Is that your name?&quot; &quot;No-0-0, it&#x27;s not exactly my name, but | would love to be called Cordelia. It&#x27;s such a perfectly elegant name.” &quot;| don&#x27;t know what on earth you mean. If Cordelia isn’t your name, what is?&quot; &quot;Anne Shirley,” reluctantly faltered forth the owner of that name, &quot;but, oh, please do call me Cordelia. It can&#x27;t matter much to you what you call me if I&#x27;m only going to be here a little while, can it? And Anne is such an unromantic name.” &quot;Unromantic fiddlesticks!&quot; said the unsympathetic Marilla. &quot;Anne is a real good plain sensible name. You&#x27;ve no need to be ashamed of it.” &quot;Oh, I&#x27;m not ashamed of it,&quot; explained Anne, &quot;only | like Cordelia better. I&#x27;ve always imagined that my name was Cordelia:at least, | always have of late years. When | was young | used to imagine it was Geraldine, but | like Cordelia better now. But if you call me Anne please call me Anne spelled with an E.&quot; &quot;What difference does it make how it’s spelled?&quot; asked Marilla with a rusty smile as she picked up the teapot."},{"n":8,"type":"text","section":"Reading","stem":"The passage is an example for which type of text?","options":["memoir","autobiography","fiction","biography"],"passage":"How often do we see everyday objects around us and ask ourselves who invented them? One such invention is the flat-bottomed paper bag, which people nowadays take for granted, but in the 1860s it was completely unheard of. Margaret Eloise Knight was born in Maine in 1838. Her family moved to New Hampshire after her father’s death, and Margaret and her siblings had to leave school at a young age to work at a cotton mill. When she was twelve years old, Knight witnessed an accident at the mill in which a worker was injured by one of the machines. A few weeks later she had developed a safety device for those machines, which was adopted by mills around the city. Knight moved to Massachusetts in 1867 and began to work for the Columbia Paper Bag Company. The following year she invented and built a machine that was able to fold and glue paper to make flat-bottomed paper bags. The design of the machine was stolen from her by a man who was present when her machine was being built, and he patented the device as his own. This meant that Knight would not receive royalties from her invention. She filed a lawsuit against him and won, making her the first woman to be awarded a U.S. patent. She later established the Eastern Paper Bag Co. and went on to hold 86 more patents, including lid removing pliers, a window frame and sash, and several devices related to rotary engines. Knight never married, and died in 1914. She was inducted into the National Inventors Hall of Fame in 2006, and several of her inventions, especially the paper bag, are still in wide use around the world today."},{"n":9,"type":"text","section":"Reading","stem":"Which of the following is correct, according to the passage?","options":["Tourism does not make a significant part of the income of the Galapagos.","Humans live on every island in the Galapagos.","Some new species on the islands have caused damage.","Galapagos is a province of Ecuador but is located closer to California than to the Ecuadorian mainland."],"passage":"The Galapagos Islands are a group of islands located in the Pacific Ocean near the equator. Made up of 19 major islands and two smaller islands, the group is a province of Ecuador and is classified as both an Ecuadorian national park and a World Heritage Site. The Galapagos Islands’ most famous feature is their wildlife. A large number of species are unique to the Galapagos, including many species of tortoises, birds, and giant iguanas. Some of those species resemble other species from different places, such as California, Australia, South Africa, and the Atlantic Ocean. Five of the nineteen islands are inhabited: Isabela, Santa Cruz, Baltra, Floreana, and San Cristobal, with over 25,000 people living on them. The inhabitants typically work in agriculture and cattle raising, but many work in tourism, as there are several small hotels and visitor sites, most of which are scuba-diving or snorkeling sites. Due to the uniqueness of many animal species in the Galapagos, many of which have been endangered over the years due to human hunting and non-native animals brought to the islands by humans, it has been declared a protected area."},{"n":10,"type":"text","section":"Reading","stem":"Which of the following is correct paraphrasing of the above paragraph?","options":["Therefore, they go into hibernation:a very deep sleep in which they consume less energy than usual because their internal processes are slower and their body temperature is lower, and therefore, they need less energy. Some animals have a very difficult time in winter because of the cold and lack of food. Hibernation is","one method to solve this problem. Animals that hibernate lower their body temperature and reduce the rate of internal processes, so they require much less energy than normal. Winter is a difficult season for some animal species because of the cold and lack of food. Some","animals hibernate, which requires much less energy than usual, so their energy requirements are lower than isciual","Hibernation is one method to deal with the extremes of winter. While hibernating, animals need less energy than usual because their body temperature is lower and their internal processes are slower."],"passage":"For some animal species, extreme winter conditions might make it nearly impossible to survive when food is scarce and temperatures drop too low. One solution is hibernation. Hibernating animals go into an extended deep sleep phase in which they lower their body temperature and reduce the rate of internal processes, so they require much less energy than normal."},{"n":11,"type":"text","section":"Reading","stem":"Which of the following sentences is grammatically incorrect?","options":["Looking into her face, | could easily tell she was lying to me.","When laying floor tiles, it is important to start from the center point.","| kept one eye on the television while laying the table for dinner.","| was laying on my bed and reading a book when the phone rang."]},{"n":12,"type":"text","section":"Reading","stem":"Which of the following is the climax of the story?","options":["Regina's skin tingling with excitement","The boy announcing: \"She's coming!\"","The teacher walking in and the children starting to sing","The teacher telling the children they have made her birthday the most special day of her life"]},{"n":13,"type":"text","section":"Reading","stem":"(Lady Montrevor by Christina Rossetti) What form does the poem have?","options":["sonnet","limerick","haiku","free verse"],"passage":"| do not look for love that is a dream: | only seek for courage to be still; To bear my grief with an unbending will, And when | am a-weary not to seem. Let the round world roll on; let the sun beam; Let the wind blow, and let the rivers fill The everlasting sea, and on the hill The palms almost touch heaven, as children deem. And, though young spring and summer pass away, And autumn and cold winter come again, And though my soul, being tired of its pain, Pass from the ancient earth, and though my clay Return to dust, my tongue shall not complain;: No man will mock me after this my day."},{"n":14,"type":"text","section":"Reading","stem":"What is the phrase \"deafeningly silent\" used for in the paragraph?","options":["to emphasize that silence is the solution to the problem","to create a dramatic effect","to explain that the storm was loud","to emphasize how confusing the situation was"],"passage":"Louisa and Aidan were sprawled on chairs in the attic, their hands behind their heads and their feet dangling, when all of a sudden, a storm started. Heavy rain pounded on the roof, and they heard the strong wind whistling outside. The only lamp in the room went out, and the children could barely see anything around them. Lightning after lightning struck the sky outside, and the children held each other&#x27;s hands as a sharp roar of thunder shook the house. It sounded as though the storm was right in their own backyard. However, a few minutes later, the storm stopped suddenly. Everything around was deafeningly silent as Louisa and Aidan got up quietly and attempted to find the door in the dark. Fortunately, the lights came back on before they had gotten to the door, and they both breathed out in relief and smiled."},{"n":15,"type":"text","section":"Reading","stem":"You come across a story titled \"A Boy Named Lorenzo.\" What information can you draw from the title?","options":["Lorenzo is the hero of the story.","Lorenzo has a key role in the story.","The speaker in the story knows Lorenzo.","The story is centered around Lorenzo's character."]},{"n":16,"type":"text","section":"Reading","stem":"Which of the following would be the best subheading for the section about Michelangelo's first famous sculpture?","options":["The Famous Works of Michelangelo","One of the most famous artists in history, Michelangelo was born in Italy in 1475 as Michelangelo di Lodovico Buonarroti Simoni.","The First Famous Sculpture","The Pieta. The Sash Has the Phrase \"Michelangelo Made This\" Engraved in the Stone"],"passage":"The Famous Works of Michelangelo One of the most famous artists in history, Michelangelo was born in Italy in 1475 as Michelangelo di Lodovico Buonarroti Simoni. He was raised in Florence, the greatest center of art in Italy. Michelangelo&#x27;s father realized that his son had a passion for art and permitted him to leave school at the age of thirteen to study painting and sculpture at the palace of the Medici family, a very famous family who lived in Florence. The First Famous Sculpture Michelangelo was highly talented. At the age of twenty-four he completed the Pieta:a very famous religious sculpture regarded as one of the world&#x27;s greatest masterpieces, and according to many people&#x27;s opinion, the greatest work of sculpture ever created. According to legend, someone who came to see the sculpture thought it had been made by another artist, and Michelangelo overheard him. That night in a fit of rage he carved &quot;Michelangelo made this” in the stone. He later regretted this action, deciding to never again sign a work of his hands. David Michelangelo&#x27;s most famous sculpture, which is also the most famous sculpture in the world, is called David. While he was sculpting David, Florence:an independent city-state at the time:was going through some difficult times, threatened by rivals. Michelangelo used David as a symbol of courage and faith in God. The sculpture was placed in front of the Palazzo Vecchio:the town hall of Florence. Michelangelo wrote in his diary: &quot;| insisted that the figure should stand before the Palazzo Vecchio, as a symbol of our country. And this is exactly what happened. To get the sculpture there, narrow streets had to be widened and"},{"n":17,"type":"text","section":"Reading","stem":"Which of the following is the best title for the whole passage?","options":["The Famous Works of Michelangelo","One of the most famous artists in history, Michelangelo was born in Italy in 1475 as Michelangelo di Lodovico Buonarroti Simoni.","The First Famous Sculpture","The Pieta. The Sash Has the Phrase \"Michelangelo Made This\" Engraved in the Stone"]},{"n":18,"type":"text","section":"Reading","stem":"Which of the following is a correct paraphrasing of the passage above?","options":["Although Walt Disney wanted to make a movie about Snow White, he decided to put it off until he won an Academy Award.","The movie was a tremendous success, even though Walt Disney did not believe it would be profitable.","Although the audience who came to the premiere was skeptical, the movie received a standing ovation.","Even though many people did not believe the movie could succeed, it ended up being extremely successful."],"passage":"Snow White and the Seven Dwarfs was the first full-length feature animated film in history. Walt Disney had dreamed of making a movie about the legend of Snow White for years, and after building his company&#x27;s reputation with short Mickey Mouse films, he decided in 1934 that the time had come to make Snow White and the Seven Dwarfs. In those years full-length animated films were unheard of, and the movie was very expensive to make. It was originally supposed to cost $250,000, ten times as much as a short movie, but eventually it cost $1.5 million, six times its original budget. It was considered an extremely high budget for a movie in those days. Songs were recorded, then cut from the film; animators would work on a project for months, only to realize it was not in line with the rest of the movie. Nowadays, these things happen during the production of almost any movie, but at the time, nobody was used to investing so much in animation. Many people believed all the effort was in vain, because there was no demand for a full-length animated movie anyway, and throughout the entire project people tried to convince Walt Disney to give up on it, including his brother and business partner, Roy Disney. The cost of the project nearly caused the company to go bankrupt, and Walt Disney had to mortgage his house to help pay for the movie, but he kept believing in it and never gave up for a moment. On December 21, 1937, Snow White and the Seven Dwarfs premiered at the Carthay Circle Theatre in California. The audience watched the two million illustrations of the film, frame by frame, of the Evil Queen, the princess and the dwarfs. The film received a standing ovation. Six days later, Walt Disney and his seven dwarfs appeared on the cover of Time magazine. Following several more successful runs, the movie was put into general release in February 1938 and became a major box-office success, making four times more money than any other motion picture released that year. By the end of its original run, it had earned $7,846,000. It was re-released to theaters seven more times until 1993, making $418 million dollars throughout its lifetime. Adjusted for inflation, this movie has made over $1.8 billion dollars, making it the highest-grossing Disney movie in history, and also one of the top ten American film moneymakers of all time. At the 1938 Academy Awards, Snow White was nominated for an Oscar for Best Music, but lost. However, in 1939, it won an Academy Honorary Award for Walt Disney “as a significant screen innovation which has charmed millions and"},{"n":19,"type":"text","section":"Reading","stem":"On Saturday morning she woke up to a loud noise coming from above her head. She hurried to the window and stared outside in disbelief; it was raining. \"Wonderful,\" Lydia said. \"Just... wonderful.” Lydia's words are an example for which literary device?","options":["simile","irony","oxymoron","hyperbole"],"passage":"Upon moving to a new neighborhood with a big park in front of their house, Lydia suggested to her parents that they go for a picnic on Saturday. Her parents, very busy and stressed with the move and all the unpacking they had to do agreed to take a break for the picnic, but told Lydia she would have to plan the entire thing by herself. Mostly to get out of unpacking, Lydia went to the store and bought bread, jam and butter, cheese, jars of pickles and olives, eggs, some fresh vegetables, and plastic plates and utensils. She even bought a lovely straw basket in which to put all the food, and a blanket to sit on. On Friday night she made some hard-boiled eggs, happily thinking about the following morning which they would be spending in the sun at the park, talking and laughing and putting that whole long, stressful week behind them."},{"n":20,"type":"text","section":"Reading","stem":"(\"Pollyanna” by Eleanor H. Porter) Based on the given passage, how can the relationship between Miss Polly and Nancy be described?","options":["Nancy admires Miss Polly.","Nancy is angry with Miss Polly.","Miss Polly is very fond of Nancy.","Nancy is afraid of Miss Polly."],"passage":"Miss Polly Harrington entered her kitchen a little hurriedly this June morning. Miss Polly did not usually make hurried movements; she specially prided herself on her repose of manner. But today she was hurrying:actually hurrying. Nancy, washing dishes at the sink, looked up in surprise. Nancy had been working in Miss Polly&#x27;s kitchen only two months, but already she knew that her mistress did not usually hurry. &quot;Nancy!&quot; &quot;Yes, ma‘am.” Nancy answered cheerfully, but she still continued wiping the pitcher in her hand. &quot;Nancy,&quot;:Miss Polly&#x27;s voice was very stern now:&quot;when I&#x27;m talking to you, | wish you to stop your work and listen to what | have to say.&quot; Nancy flushed miserably. She set the pitcher down at once, with the cloth still about it, thereby nearly tipping it over :which did not add to her composure. &quot;Yes, ma&#x27;am; | will, ma&#x27;am,&quot; she stammered, righting the pitcher, and turning hastily. &quot;| was only keepin’ on with my work &#x27;cause you specially told me this mornin’ ter hurry with my dishes, ye know.&quot; Her mistress frowned. &quot;That will do, Nancy. | did not ask for explanations. | asked for your attention.” &quot;Yes, ma&#x27;am.&quot; Nancy stifled a sigh."},{"n":21,"type":"text","section":"Reading","stem":"Which of the following is used in the passage to create a mental image of La Pedrera?","options":["irony","simile","alliteration","rhyme"]},{"n":22,"type":"text","section":"Reading","stem":"What point of view is used in the passage?","options":["first person","second person","third person omniscient","third person limited"],"passage":"Anne&#x27;s cup of happiness was full, and Matthew caused it to overflow. He had just got home from a trip to the store at Carmody, and he sheepishly produced a small parcel from his pocket and handed it to Anne, with a cautious look at Marilla. &quot;| heard you say you liked chocolate sweeties, so | got you some,&quot; he said. &quot;Humph,&quot; sniffed Marilla. &quot;It&#x27;ll ruin her teeth and stomach. There, there, child, don&#x27;t look so dismal. You can eat those, since Matthew has gone and got them. He&#x27;d better have brought you peppermints. They&#x27;re wholesomer. Don&#x27;t sicken yourself eating all them at once now.&quot; &quot;Oh, no, indeed, | won&#x27;t,&quot; said Anne eagerly. &quot;I&#x27;ll just eat one tonight, Marilla. And | can give Diana half of them, can&#x27;t I? The other half will taste twice as sweet to me if | give some to her. It&#x27;s delightful to think | have something to give her.&quot; &quot;| will say it for the child,” said Marilla when Anne had gone to her gable, &quot;she isn&#x27;t stingy. I&#x27;m glad, for of all faults | detest stinginess in a child. Dear me, it&#x27;s only three weeks since she came, and it seems as if she&#x27;d been here always."},{"n":23,"type":"text","section":"Reading","stem":"Which of the following is an antonym of the word indolent?","options":["lazy","active","passive","immersed"]},{"n":24,"type":"text","section":"Reading","stem":"(Adapted from \"The Secret Garden” by Frances Hodgson Burnett) Which of the following is the most likely?","options":["Mary is the first person to ever see the garden.","The garden is secluded and difficult to reach.","The garden has been neglected for a long time.","Mary feels very lonely in the garden."],"passage":"It was the sweetest, most mysterious-looking garden anyone could imagine. The high walls which shut it in were covered with the leafless stems of climbing roses which were so thick that they were matted together. Mary Lennox knew they were roses because she had seen a great many roses in India. All the ground was covered with grass of a wintry brown and out of it grew clumps of bushes which were surely rosebushes if they were alive. There were numbers of standard roses which had so spread their branches that they were like little trees. There were other trees in the garden, and one of the things which made the place look strangest and loveliest was that climbing roses had run all over them and swung down long tendrils which made light swaying curtains, and here and there they had caught at each other or at a far-reaching branch and had crept from one tree to another and made lovely bridges of themselves. There were neither leaves nor roses on them now and Mary did not know whether they were dead or alive, but their thin gray or brown branches and sprays looked like a sort of hazy mantle spreading over everything, walls, and trees, and even brown grass, where they had fallen from their fastenings and run along the ground. It was this hazy tangle from tree to tree which made it all look so mysterious."},{"n":25,"type":"text","section":"Reading","stem":"Look at the following dictionary pages: What is the purpose of the words on top of the two pages (Mandrin, scandal)?","options":["to let the reader know the topic of the page","to let the reader know, alphabetically what the first word on the page is","to let the reader know the root word the page focuses on","to let the reader know the definition of the words"]},{"n":26,"type":"text","section":"Reading","stem":"Which meaning of the word \"correspond\" fits the following context? We have corresponded in the past, but at the moment we are not in touch.","options":["to be in agreement or conformity","to match","to be similar or equivalent in function, amount, etc.","to communicate in letters"]},{"n":27,"type":"text","section":"Reading","stem":"Since the city hall decided to close the youth center, local parents have collected donations to keep it open and organized a marathon to raise funds. One parent told the reporters who came to the marathon, \"The notion that the youth center does not benefit our youngsters is a fallacy.” Which of the following is closest in meaning to the word \"fallacy\"?","options":["rumor","idea","misconception","belief"]},{"n":28,"type":"text","section":"Reading","stem":"Which of the following can be said about Emma's character, according to the story?","options":["She is a very good sheriff.","She is a devoted mother.","She appreciates good work.","She notices small details."]},{"n":29,"type":"text","section":"Reading","stem":"Which of the following is the most logical, according to the passage?","options":["It is impossible to use a hot air balloon to get from one place to a specific destination.","Sky lanterns are typically made of paper because it is flammable and causes fire hazards.","When the source of heat under the balloon goes out, the balloon sinks back to the ground.","A hot air balloon flies because air passes through its envelope."],"passage":"The hot air balloon was the first successful flight technology that carried a human. The first hot air balloon was launched in France in 1783. A hot air balloon consists of a fabric bag called an envelope, usually made of nylon or Dacron. To make it impassable to air, the fabric is coated with a sealer, such as silicone or polyurethane. Since warm air is lighter than cold air, it rises above cold air. This is why the envelope is filled with a gas warmer than the air outside, which rises in the air and enables the balloon to float. Attached underneath the envelope is a basket that carries passengers and a source of heat, like a burner, that fills the envelope with warm gas and keeps it warm throughout the flight. It is possible to propel the hot air balloon during the flight in the desired direction. A very smail hot air balloon is called a sky lantern and is usually made of paper. It has an opening at the bottom, where a small fire is suspended. As with big hot air balloons, the fire keeps the air inside the sky lantern warmer than the air outside, which enables the lantern to rise in the air and float upwards. It is the oldest type of hot air balloon and was used in China as early 2200 years ago; it is still used in different countries and is popular in festivals and various celebrations. However, it has been banned in some countries due to fire hazards."},{"n":30,"type":"text","section":"Reading","stem":"What is the purpose of the passage?","options":["to explain what to consider when choosing between a cat and a dog","to persuade the reader that cats make better pets than dogs","to inform the reader about the difference between adopting and buying a pet","to persuade the reader to get a cat"],"passage":"Cats are the most popular pets in America (apart from fish), with 88.3 million cats owned by US citizens in 2007, compared with 74.8 million dogs. Some people are cat-lovers while others are dog-lovers. Many people feel their pet is more than just a beloved friend; it is a vital part of the family. After getting a pet, most people wonder how they got along before. Deciding between raising a cat or a dog is all about personal taste. However, there are several things to consider before choosing either of them. It is crucial to remember that both cats and dogs make excellent companions and will give you lots of love. Contrary to popular belief, cats are very affectionate and require a lot of attention from their owners. Dogs live up to their reputation as loving pets. However, cats and dogs have very different needs. Cats are more independent, and if given sufficient food, water, a clean litter box, and the occasional pet, will generally be happy and take care of their other needs on their own. Dogs, on the other hand, are a lot more dependent on their owners, as they require a walk a few times a day. Imagine the following situation: you come home after a long day, it&#x27;s freezing cold outside and all you want is to get into bed and get warm. But alas, you must take your dog out for a walk first:it hasn&#x27;t been out all day! This bit is a deal breaker for many people. One advantage dogs have is that they are much easier to train. While cats can be taught to respond to their name and a few other words, and some cats will even learn a few tricks such as &quot;sit,&quot; cats cannot help humans with taking down criminals, saving people from drowning, or tracking down bombs. This definitely makes dogs better at police and military work, but how important are these abilities when choosing a companion? At the end of the day, most people still choose what pet to raise based on their personal preference rather than on rational reasons."},{"n":31,"type":"text","section":"Reading","stem":"Which of the following words can be used to fill the blank in the best way?","options":["funny","witty","amusing","hilarious"],"passage":"Her clever jokes and her quick tongue always get her out of trouble. She is extremely ___ and everyone who knows her talks about her puns and play-on-words."},{"n":32,"type":"text","section":"Reading","stem":"(Aesop) What is the moral of the fable?","options":["It is always good to pity the weak.","Little friends may prove great friends.","Mice are very useful animals.","If you help someone, he or she will always help you back."],"passage":"Read the fable. Once when a Lion was asleep a little Mouse began running up and down upon him; this soon wakened the Lion, who placed his huge paw upon him, and opened his big jaws to swallow him. &quot;Pardon, O King,&quot; cried the little Mouse: &quot;forgive me this time, | shall never forget it: who knows if | may be able to do you a turn some of these days?” The Lion was so tickled at the idea of the Mouse being able to help him, that he lifted up his paw and let him go. Some time after the Lion was caught in a trap, and the hunters who desired to carry him alive to the King, tied him to a tree while they went in search of a wagon to carry him on. Just then the little Mouse happened to pass by, and seeing the sad plight in which the Lion was, went up to him and soon gnawed away the ropes that bound the King of the Beasts. &quot;Was | not right?&quot; said the little Mouse."},{"n":33,"type":"text","section":"Reading","stem":"Which literary device is used in the passage?","options":["foreshadowing","flashback","paradox","idiom"]},{"n":34,"type":"text","section":"Reading","stem":"What is the meaning of the phrase \"play devil's advocate\"?","options":["teach a class","give someone courage to speak in front of many people","present counter arguments when strongly disagreeing with a cause","present counter arguments to a cause, even while agreeing with it"],"passage":"My friends and | organized a petition for a Black History class at our school. Most students signed, and when the principal saw the petition, he invited me to argue our cause in front of the school board. | was nervous about what they would ask me and asked my friend Laura, who had organized the petition with me, to help me practice. She played devil&#x27;s advocate and | answered her flawlessly. Thanks to her, | was much less nervous when | stood in front of the board; | spoke confidently and did not forget a single detail."},{"n":35,"type":"text","section":"Reading","stem":"Which of the following is a conclusion that can be made from the passage?","options":["Eyespots are the best way to avoid deathly attacks by predators.","Predators can never distinguish between eyespots and true eyes.","Eyespots are more efficient if found on both the left and right sides of the body.","All fish have eyespots, but in some fish species, they cannot be seen."],"passage":"When a predator attacks its prey, it usually looks for the head first and starts the attack from there, because it can cause more harm by attacking the head area than the tail area. When the attack is quick, as most attacks are, the predator has little time to study its prey and see exactly where the head is, so it looks for the eyes, which are typically prominent and found on the head, and directs its attack to that area. Many animals that live in danger of getting eaten have diversion mechanisms. A diversion mechanism is a way of deceiving the predator by giving it false messages. One way to do this is to divert the attack to the tail area, instead of the more vulnerable head area. The most efficient way of doing this is showing the predator an eyespot, which is a marking that looks like an eye but isn&#x27;t. Eyespots are common among different species of fish. Many of them, such as the butterflyfish, not only have an eyespot on the side of their body near their tail that is much larger than their true eye, but their true eye is also hidden under a vertical line. The butterflyfish received its name because some butterflies present eyespots. Butterflies are very prone to bird attacks, and studies have shown that birds are deceived by eyespots on the wings of the butterfly and attack the wing instead of the head. Then the butterfly, whose head has not been harmed, can fly away, and the bird is left with no prey."},{"n":36,"type":"text","section":"Reading","stem":"Which of the following best describes the relationship between the two poems about snow?","options":["Both poems use snow as a motif but use it to express different emotions.","Both poems contrast fire with snow.","Both poems express sorrow for losing a loved one.","Both poems use snow as a motif, but the first poem has a more negative mood than the second poem."],"passage":"Read the two poems. Over valley, over hill, Hark, the shepherd piping shrill! Diving all the white flocks forth From the far folds of the North. Blow, Wind, blow ; Weird melodies you play, Following your flocks that go Across the world to-day."},{"n":37,"type":"text","section":"Reading","stem":"How does the word \"fear\" in the last paragraph help the reader understand the main idea of the passage?","options":["It conveys how difficult it is to own a boulangerie in France.","it conveys how important it is to have boulangeries open in August.","It conveys how the French take the business of boulangeries very seriously.","It conveys how French people feel about the ingredients of French bread."],"passage":"Owning a bakery in France, or a boulangerie, to use the French word, is no piece of cake! There are very strict laws in France regarding boulangeries and what they are allowed or not allowed to do, and for a good reason: The average Frenchman eats half a baguette a day and buys at least one baguette every day. A baguette that is fresh and crisp today will be hard as nails tomorrow. Therefore, having a boulangerie nearby is of the essence to most Frenchmen. France has the highest density of bakeries in the world. The profession of a boulanger is highly regulated. Not every bakery is a boulangerie; to be called a boulangerie, bread must be made on the premises. Selling bread that is made elsewhere makes the bakery a mere shop, rather than a real French boulangerie. The law also dictates the ingredients of French bread, which may only be flour, yeast, salt and water. In the past, laws were passed to ensure that every neighborhood would have access to bread 365 days a year. A prefectural decree dating to 1790 stated that all boulangeries had to report to the authorities when they planned to take a vacation or else face a fine. The authorities allowed half of the boulangeries to close in July and half in August, thus ensuring access to bread throughout the year. However, the decree was scrapped in 2015. Nowadays, people in France fear they will not be able to get a good baguette in August, especially not a good one from a real boulangerie, as August is the most popular month of the year to go on vacation."},{"n":38,"type":"text","section":"Reading","stem":"Who is the antagonist of the story?","options":["the master","the groom","the farmer","the horse"],"passage":"Note: the narrator in the following passage is a horse. My new master was an unmarried man. He lived at Bath, and was much engaged in business. His doctor advised him to take horse exercise, and for this purpose he bought me. He hired a stable a short distance from his lodgings, and engaged a man named Filcher as groom. My master knew very little about horses, but he treated me well, and | should have had a good and easy place but for circumstances of which he was ignorant. He ordered the best hay with plenty of oats, crushed beans, and bran, with vetches, or rye grass, as the man might think needful. | heard the master give the order, so | knew there was plenty of good food, and | thought | was well off. For a few days all went on well. | found that my groom understood his business. He kept the stable clean and airy, and he groomed me thoroughly; and was never otherwise than gentle. He had been an hostler in one of the great hotels in Bath. He had given that up, and now cultivated fruit and vegetables for the market, and his wife bred and fattened poultry and rabbits for sale. After awhile it seemed to me that my oats came very short; | had the beans, but bran was mixed with them instead of oats, of which there were very few; certainly not more than a quarter of what there should have been. In two or three weeks this began to tell upon my strength and spirits. The grass food, though very good, was not the thing to keep up my condition without corn. However, | could not complain, nor make known my wants. So it went on for about two months; and | wondered that my master did not see that something was the matter. However, one afternoon he rode out into the country to see a friend of his, a gentleman farmer, who lived on the road to Wells."},{"n":39,"type":"text","section":"Reading","stem":"Which of the following is likely, according the passage?","options":["Don McPherson is not color-blind.","More men have diabetes than women.","Don McPherson's glasses will work at night, too.","When the rod cells are malfunctional, a person will not see colors at all."],"passage":"The human eye has two types of cells responsible for vision: rod cells, which are responsible for night vision, and cone cells, which are responsible for color vision and function best in bright light. Therefore, it is much more difficult to see color in the darkness. There are three types of cone cells, each type responsible for a different range of colors. Color blindness is the disability to distinguish between all or specific colors. Some people are completely color blind, which means they cannot see colors at all, but this is extremely rare. Usually, only one type of the cone cells is problematic, and therefore, color blind people can usually still see some color. Among those who have a decreased ability to tell the difference between certain colors, there are two major groups: those who have difficulty distinguishing between red and green, which is the most common condition and affects about 80% of color-blind people, and those who have difficulty distinguishing between blue and yellow. Color blindness is a hereditary trait which is more common among men. Around 8% of men and 0.5% of women have this trait. Color blindness may also be non-hereditary and occur as a result of a disease, such as diabetes. There is no cure for color blindness. However, there are special glasses that allow people with red-green color blindness to see colors in bright light. The glasses were originally developed to help surgeons see more clearly in the operating room. The fact that they could help color-blind people, as well, was discovered by chance when scientist Don McPherson was wearing the glasses while playing ultimate Frisbee with his friend. McPherson&#x27;s friend asked to borrow his eyewear, and as he put them on, he was amazed by his sudden ability to see color. McPherson then went ahead to perform research on color blindness, and after some smail adjustments, began to sell the glasses to the public."},{"n":40,"type":"text","section":"Reading","stem":"What is the author's attitude in the passage?","options":["in favor of school uniforms","opposing school uniforms","neutral:the author presents both sides","neutral, but leans toward opposition"],"passage":"Are school uniforms beneficial? School uniforms have a significant advantage: they keep students focused on their schoolwork rather than their clothes. Everyone fits in; everyone belongs. We all know that people, especially teenagers, judge each other all the time, and clothes are clearly a big part of that. Take the clothing choices out and you have students who are more concerned with their grades than what their peers are wearing. However, as some people might point out, many students object to school uniforms and would rather choose their own clothes. Most education experts will tell you that, problematic though they might be, school uniforms lead to fewer behavior issues and less violence, thus reducing suspensions and expulsions. It&#x27;s not to say that everyone is for school uniforms; there are certainly people who believe that the students’ right to freedom of expression exceeds their right to safety. Currently, approximately 20 percent of all American schools require their students to wear uniforms. It is an issue the government will surely have to address at some point, and set up regulations for the entire country."},{"n":41,"type":"text","section":"Reading","stem":"How does the author develop the idea that Plato merely invented Atlantis as a plot device, rather than telling of a true place?","options":["The author first tells the readers of Plato's fable, then explains why it is very unlikely.","The author first disproves the theory that Atlantis was real, then explains why it is scientifically impossible.","The author first explains why Atlantis was a utopia, then why it is unlikely to have ever existed.","The author first gives evidence that Atlantis was real, then disproves it."],"passage":"The famous Greek philosopher Plato was the first to tell the legend of Atlantis:an island subcontinent with a very advanced civilization:in 330 B.C. Nowadays, Atlantis is often idealized as a peaceful utopia; however, in Plato&#x27;s fable, it was very militaristic and sophisticated. The Atlanteans attacked Greece, a powerful attack which Greece managed to repel; then Atlantis fell out of favor with the gods and sank into the ocean, never to be heard from again. There is no other evidence, except for Plato&#x27;s writings, that a place such as Atlantis has ever existed; it makes sense that other writers would tell of such a wondrous and remarkable place, but Plato was the only one. Therefore, most scholars assume Atlantis is a legendary place. However, this has not stopped many voyagers from trying to find the long-lost island. Many books have been written on the subject, and many people who named themselves experts have located Atlantis all around the world: the Atlantic Ocean, Malta, Antarctica, Germany, etc. According to Plato&#x27;s writings, Atlantis was located in the Atlantic Ocean close to the Mediterranean Sea, but it has never been found. Furthermore, it is scientifically impossible that a large land surface such as Atlantis sank into the ocean the way Plato describes it."},{"n":42,"type":"text","section":"Reading","stem":"Which of the following is a synonym of the word copious?","options":["amount","spotless","plentiful","lonely"]},{"n":43,"type":"text","section":"Reading","stem":"What is the moral of the passage?","options":["itis unnecessary to fight over eggs.","You can never count on history to be accurate.","Nations go to war over small, insignificant issues.","When people resent the emperor's law, the law is obviously ridiculous."],"passage":"The animosities between these two parties run so high, that they will neither eat, nor drink, nor talk with each other. We compute the &quot;Tramecksan&quot;, or high heels, to exceed us in number; but the power is wholly on our side. We apprehend his imperial highness, the heir to the crown, to have some tendency towards the high heels; at least we can plainly discover that one of his heels is higher than the other, which gives him a hobble in his gait. Now, in the midst of these intestine disquiets, we are threatened with an invasion from the island of Blefuscu, which is the other great empire of the universe, almost as large and powerful as this of his majesty. For as to what we have heard you affirm, that there are other kingdoms and states in the world inhabited by human creatures as large as yourself, our philosophers are in much doubt, and would rather conjecture that you dropped from the moon, or one of the stars; because it is certain, that a hundred mortals of your bulk would in a short time destroy all the fruits and cattle of his majesty’s dominions: besides, our histories of six thousand moons make no mention of any other regions than the two great empires of Lilliput and Blefuscu. Which two mighty powers have, as | was going to tell you, been engaged in a most obstinate war for six-and-thirty moons past. It began upon the following occasion. It is allowed on all hands, that the primitive way of breaking eggs, before we eat them, was upon the larger end; but his present majesty’s grandfather, while he was a boy, going to eat an egg, and breaking it according to the ancient practice, happened to cut one of his fingers. Whereupon the emperor his father published an edict, commanding all his subjects, upon great penalties, to break the smaller end of their eggs. The people so highly resented this law, that our histories tell us, there have been six rebellions raised on that account; wherein one emperor lost his life, and another his crown. These civil commotions were constantly fomented by the monarchs of Blefuscu; and when they were quelled, the exiles always fled for refuge to that empire. It is computed that eleven thousand persons have at several times suffered death, rather than submit to break their eggs at the smaller end. Many hundred large volumes have been published upon this controversy: but the books of the Big-endians have been long forbidden, and the whole party rendered incapable by law of holding employments. During the course of these troubles, the emperors of Blefusca did frequently expostulate by their ambassadors, accusing us of making a schism in religion, by offending against a fundamental doctrine of our great prophet Lustrog, in the fifty-fourth chapter of the Blundecral (which is their Alcoran). This, however, is thought to be a mere strain upon the text; for the words are these: ‘that all true believers break their eggs at the convenient end.’ And which is the convenient end, seems, in my humble"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
