<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 6 Language Usage (Level 1): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 1): Drill 2</div>
  <h2>MAP Grade 6 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 1): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 1): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G6-LANG-L1-D2";
const BANK_PATH = "map-tests/grade-6/language-usage/level-1/drill-2/bank.csv";
const TITLE = "MAP Grade 6 Language Usage (Level 1): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Spelling", "stem": "In which sentence is the underlined word spelled correctly?", "options": ["Jessica was the head chearleeder of her school's team.", "My brother works as a lifegard during summer vacation.", "I usually store all my sports equipment in the wearhouse.", "He is famously known for the unique scar on his forehead."]}, {"n": 2, "type": "text", "section": "Sentence structure", "stem": "Read the sentence. What is the main clause in this sentence?", "options": ["After the Great Fire in 1666 destroyed London", "the capital city of England", "architect Sir Christopher Wren led the process of rebuilding the city", "led the process of rebuilding the city"], "passage": "<strong>After the Great Fire in 1666 destroyed London, the capital city of England, architect Sir Christopher Wren led the process of rebuilding the city.</strong>"}, {"n": 3, "type": "text", "section": "Grammar: usage", "stem": "Read the sentence and complete it with the correct verb or helping verb.", "options": ["will", "has", "was", "will have"], "passage": "<strong>The choir ___ finished the preparations for the ceremony by next Monday.</strong>"}, {"n": 4, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. How does the structure of the paragraph support its meaning?", "options": ["It helps the reader imagine what it might be like to meet a dragon.", "It emphasizes the differences in how dragons are viewed in different cultures.", "It compares and contrasts the different appearances of various kinds of dragons.", "It compares dragons that live in mountains with dragons that live in water."], "passage": "<strong>How would you feel if you were walking along and came across a dragon? You'd almost certainly feel surprised and excited, but would you feel more joyful, or more afraid? It might depend on how you've been brought up to think about dragons. Dragons have a different significance in Eastern cultures than they do in Western cultures. In China, dragons are called loong, and are considered majestic, benevolent creatures that protect people and bring them good fortune. Eastern dragons are usually associated with water such as lakes and the ocean, usually do not have wings, and do not breathe fire. In Europe, dragons are regarded as ferocious flying fire-breathing monsters that usually live in the mountains. In European myths and stories, heroes protect people from dragons. Dragons are an excellent example of how the same or similar symbols can have different meanings in different cultures.</strong>"}, {"n": 5, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentences. Which adjectives correctly complete the sentences?", "options": ["difficult, easier", "more difficult, easy", "more difficult, easier", "more difficult, easiest"], "passage": "<strong>I think that French is ___ than English. However, some will say that French is ___ to learn than English.</strong>"}, {"n": 6, "type": "text", "section": "Composition & writing", "stem": "Which of the following is used as a prewriting strategy?", "options": ["Revision", "Rewriting", "Clustering", "Proofreading"]}, {"n": 7, "type": "text", "section": "Word choice & vocabulary", "stem": "Read the paragraph. Which word or phrase best completes the paragraph?", "options": ["Although", "Therefore", "Additionally", "Otherwise"], "passage": "<strong>Sam's Pizza Shop is very popular for three main reasons. First, it has a very convenient location in the center of town. ___, many people see the pizza shop on the side of the road and it is easy for them to stop there before or after they go shopping. Another reason is that Sam's Pizza Shop uses only the freshest ingredients, so their pizza is delicious. Finally, the workers at Sam's are very friendly and love to make customers smile.</strong>"}, {"n": 8, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences contains a double negative?", "options": ["I've never taught anyone to swim before.", "Nobody believes that nonsense.", "He can't see nobody in this crowd.", "No, I've never been to Timbuktu."]}, {"n": 9, "type": "text", "section": "Spelling", "stem": "Which is the correct spelling for more than one monarch?", "options": ["monarchs", "monarches", "monarchses", "monarchies"]}, {"n": 10, "type": "text", "section": "Grammar: usage", "stem": "Which sentence is not grammatically correct?", "options": ["They lie on their bed and watched a comedy show yesterday.", "He lay on his back and did sit-ups at the local gym.", "I had lain on the sofa all morning until the phone rang.", "I saw that the mechanic was lying on his back and fixing my father's car."]}, {"n": 11, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is structured correctly?", "options": ["The members of the school's football team were very competitive.", "The very competitive members were of the school's football team.", "The very competitive of the school's football team were the members.", "Of the school's football team, the members were very competitive."]}, {"n": 12, "type": "text", "section": "Word choice & vocabulary", "stem": "Read the sentence and answer the question that follows. What is the meaning of the simile in this sentence?", "options": ["The light of the lamp alternates between yellow and blue.", "The light of the lamp is very intense.", "The lamp does not work properly.", "The lamp is a source of heat."], "passage": "<strong>The light that came out of the lamp was like sunshine.</strong>"}, {"n": 13, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences does not use an apostrophe correctly?", "options": ["His friends' favorite place to get together is the skate park.", "The three store's combined sales are more than $1 million per year.", "The dog's owners' contact information is written on a tag attached to its collar.", "The water park's busiest month is August."]}, {"n": 14, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a run-on sentence?", "options": ["I baked a cake yesterday. It was delicious.", "I ate a lollipop it was sweet and tasty.", "We went to the park and played soccer.", "I turned on the air conditioner, so it was cool."]}, {"n": 15, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentence. Which word correctly completes the sentence?", "options": ["ourselves", "yourself", "itself", "yourselves"], "passage": "<strong>The two of you are going to spend long hours on the bus, so I recommend you prepare ___ and get some food beforehand.</strong>"}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
