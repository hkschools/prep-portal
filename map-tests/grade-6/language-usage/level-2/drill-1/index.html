<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 6 Language Usage (Level 2): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 2): Drill 1</div>
  <h2>MAP Grade 6 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 2): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 2): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G6-LANG-L2-D1";
const BANK_PATH = "map-tests/grade-6/language-usage/level-2/drill-1/bank.csv";
const TITLE = "MAP Grade 6 Language Usage (Level 2): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Sentence structure", "stem": "Read the passage. Which of the following is the best revision of the passage?", "options": ["When we walked inside the building, a mysterious sound was heard. It was considered a broken car or truck by me, but my sister thought it was a ghost. Eventually, it was realized that electricians making repairs made the sound.", "When we walked inside the building, we heard a mysterious sound. I thought it was a broken car or truck, but my sister thought it was a ghost. Eventually, we realized that the sound came from electricians making repairs.", "When the building was walked into, a mysterious sound was heard. I considered it a car or truck, but my sister thought it was a ghost. Eventually, we realized that the sound came from electricians making repairs.", "When we walked inside the building, a mysterious sound was heard. A broken machine considered by me, but to my sister a ghost. Eventually, electricians were realized the sound."], "passage": "<strong>When we walked inside the building, a mysterious sound was heard. It was considered a car or truck by me, but my sister thought it was a ghost. Eventually, we realized that the sound was coming from electricians making repairs.</strong>"}, {"n": 2, "type": "text", "section": "Capitalization", "stem": "Read the sentences. Which words should be capitalized?", "options": ["honeymoon, region", "aunt, region", "aunt, usb", "usb, stick"], "passage": "<strong>I met aunt Marie yesterday. She gave me a usb stick with photos from her honeymoon in the Caribbean region.</strong>"}, {"n": 3, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a compound sentence?", "options": ["Dana and Ron walk to school together every day.", "The audience applauded and cheered the players.", "It was hot yesterday, so I wore short pants and a t-shirt.", "During the production of the film, there was a snowstorm."]}, {"n": 4, "type": "text", "section": "Sentence structure", "stem": "Read the sentence. What is the simple subject of the sentence?", "options": ["Popular", "Colombia and Venezuela", "Arepas", "pastries"], "passage": "<strong>Popular in both Colombia and Venezuela, arepas are savory pastries made from corn flour.</strong>"}, {"n": 5, "type": "text", "section": "Spelling", "stem": "Which sentence has the underlined word spelled incorrectly?", "options": ["In a leap year, the month of Febuary has 29 days.", "My brother dressed up as a superhero for Halloween.", "The drama club meets every Tuesday after school.", "Would you like to come with me to the library on Wednesday?"]}, {"n": 6, "type": "text", "section": "Grammar: usage", "stem": "Which of the following verbs does not have the same form in both the present tense and the past tense?", "options": ["Get", "Put", "Fit", "Set"]}, {"n": 7, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the text. Which of the following parts from the text is a prepositional phrase?", "options": ["The Great Pyramid of Giza", "is one of the oldest structures", "among the Seven Wonders of the Ancient World", "has remained almost completely in its original condition"], "passage": "<strong>The Great Pyramid of Giza is one of the oldest structures that exist in our world and, among the Seven Wonders of the Ancient World, this is the only one that has remained almost completely in its original condition.</strong>"}, {"n": 8, "type": "text", "section": "Composition & writing", "stem": "Sarah was asked to write an essay about the advantages of owning a pet. Which sentence will best serve as a topic sentence for this subject?", "options": ["Pets are helpful in keeping their owners fit and healthy.", "Pets can bring you many benefits in different aspects of life.", "Pets are a great source of love and friendship to their owners.", "Pets bring along many educational benefits for both children and adults."]}, {"n": 9, "type": "text", "section": "Grammar: parts of speech", "stem": "Choose the words that correctly complete the sentence.", "options": ["her, she", "she, she", "she, her", "her, her"], "passage": "<strong>Many students in Jessica's class wanted to join the school trip except for ___ because ___ had a party to organize.</strong>"}, {"n": 10, "type": "text", "section": "Capitalization", "stem": "Which of the following letters is correctly capitalized?", "options": ["Dear Alex, I have received the train tickets you sent me. thank you for your assistance in this matter, Collin", "Dear Alex, I have received the train tickets you sent me. Thank you for your assistance in this matter, Colin", "Dear Alex, I have received the train tickets you sent me. Thank You for Your Assistance in This Matter, Colin", "Dear Alex, I have received the train tickets you sent me. Thank you for your Assistance in this Matter, Colin"]}, {"n": 11, "type": "text", "section": "Composition & writing", "stem": "What information would not be appropriate to include in a pamphlet meant to describe a neighborhood for people who were unfamiliar with it?", "options": ["The main road is Highway 6.", "The Morgan family lives on Elm Street.", "There are both apartment buildings and private houses.", "Suzy's Diner is a popular restaurant."]}, {"n": 12, "type": "text", "section": "Grammar: parts of speech", "stem": "Complete the sentence.", "options": ["many", "nothing", "few", "everything"], "passage": "<strong>Today the stuff in my room is well organized, as opposed to past times when ___ was left in a complete mess.</strong>"}, {"n": 13, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following phrases is a prepositional phrase?", "options": ["large white whale", "very slowly", "to build a birdhouse", "on the table"]}, {"n": 14, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words is an abstract noun?", "options": ["cloud", "honesty", "bicycle", "cheerful"]}, {"n": 15, "type": "text", "section": "Word choice & vocabulary", "stem": "In which of the sentences is the underlined word used correctly?", "options": ["I excepted his offer to buy the tickets.", "All the players accept for the goalie wore long-sleeved shirts.", "Except for Jonathan, nobody liked the new play.", "Camilla likes all colors accept purple."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
