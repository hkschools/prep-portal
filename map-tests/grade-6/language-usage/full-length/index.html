<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 6 Language Usage: Full-Length Practice Test</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 6 Language Usage: Full-Length Practice Test</div>
  <h2>MAP Grade 6 Language Usage</h2>
  <p class="muted">50 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage: Full-Length Practice Test</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage: Full-Length Practice Test</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G6-LANG-FULL";
const BANK_PATH = "map-tests/grade-6/language-usage/full-length/bank.csv";
const TITLE = "MAP Grade 6 Language Usage: Full-Length Practice Test";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Capitalization", "stem": "Which of the sentences is grammatically correct?", "options": ["My Aunt lives in a small town.", "This year we're going to Uncle Ted's barbecue.", "She has a younger Brother and an older Sister.", "We're making a present for grandma."]}, {"n": 2, "type": "text", "section": "Spelling", "stem": "What is the correct spelling for more than one wolf?", "options": ["Wolfs", "Wolvs", "Wolves", "Wolfes"]}, {"n": 3, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["Some of them are from other countries, but all speaks English well.", "The two boys who played together go to the same school.", "Here is the books you were looking for all morning.", "My favorite basketball team are the Houston Rockets."]}, {"n": 4, "type": "text", "section": "Composition & writing", "stem": "Which is the correct definition of \"plagiarism\"?", "options": ["The act of taking the work or the ideas of others and presenting them as if they were yours.", "The way in which a plague is spreading among people.", "The act of using the school's equipment without permission from the principal.", "The act of writing an academic assignment and submitting it on time."]}, {"n": 5, "type": "text", "section": "Capitalization", "stem": "Which sentence is capitalized correctly?", "options": ["\"Did you know,\" asked the teacher, \"There are some fish that can live out of water?\"", "\"Please tell your sister,\" said the girl on the phone, \"sharon will be there at 7:00\"", "\"Students,\" Mr. Hernandez instructed, \"please bring your history books tomorrow.\"", "\"this cake,\" Dana told her friend, \"is one of the best cakes I have ever tasted.\""]}, {"n": 6, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following forms a metaphor?", "options": ["comparing two words with \"like\" or \"as\"", "connecting two unrelated words without \"like\" or \"as\"", "replacing a word with a logically related word", "describing a part of something to represent the whole"]}, {"n": 7, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences is grammatically correct?", "options": ["I'll never forget when my mother told me, 'Never forget where you came from.'", "Meredith told him, \"Talia said, 'I made a discovery!' and then explained her research.\"", "He told her, \"This morning John said, 'I have excellent news!' and then walked away.\"", "My uncle told me, \"Your grandfather always used to say, 'None of your business!'\""]}, {"n": 8, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following sentences is grammatically correct?", "options": ["Carol and myself go jogging together every morning.", "He cut vegetables to make himself a salad.", "Ourselves are bringing cans to the recycling center.", "She saw yourselves yesterday at the playground."]}, {"n": 9, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences is grammatically correct?", "options": ["The redwood tree is taller then the maple tree.", "Back than, there were no electric lights.", "Jupiter has more moons than Neptune.", "Each morning I make my bed and than I brush my teeth."]}, {"n": 10, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a simple sentence?", "options": ["He returned the tablet after he noticed it was damaged.", "I'm going on a ski vacation next month with my father.", "I wanted to order a pizza, but my mom already made dinner.", "She brushed her teeth quickly, and she went straight to bed."]}, {"n": 11, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words is a preposition?", "options": ["on", "thus", "quite", "low"]}, {"n": 12, "type": "text", "section": "Composition & writing", "stem": "Read the text. Where would you expect this text to be shown?", "options": ["An advertisement for vacation in Gibraltar", "A research paper about tourism in Gibraltar", "A diary describing the experience of a tourist who visited Gibraltar", "An adventure book whose plot takes place during a vacation in Gibraltar"], "passage": "<strong>The Rock of Gibraltar is a 426-meter high mountain located south of Spain, in between Europe and Africa. Although located far from Britain, this is a British territory and is a Crown property. The Rock of Gibraltar is a famous tourist spot, and tourism serves as the main income source for the government of Gibraltar. For example, in 2011, over 11 million tourists visited Gibraltar. Most of the visitors arrive in Gibraltar from neighboring Spain, and usually spend only a night or two there. The busiest month with the largest number of visitors is August.</strong>"}, {"n": 13, "type": "text", "section": "Composition & writing", "stem": "During which step of the writing process is it most useful to create a graphic organizer?", "options": ["pre-writing", "publishing", "revising", "drafting"]}, {"n": 14, "type": "text", "section": "Spelling", "stem": "Choose the word that is spelled correctly.", "options": ["plateau", "temparature", "cataloge", "phisician"]}, {"n": 15, "type": "text", "section": "Word choice & vocabulary", "stem": "Read the poem. Which of the following words shows an onomatopoeia?", "options": ["telephant", "trunk", "buzzed", "elephop"], "passage": "<strong>ELETELEPHONY by Laura Elizabeth Richards</strong><br><br>Once there was an elephant, Who tried to use the telephant- No! No! I mean an elephone Who tried to use the telephone- (Dear me! I am not certain quite That even now I've got it right.) Howe'er it was, he got his trunk Entangled in the telephunk; The more he tried to get it free, The louder buzzed the telephee- (I fear I'd better drop the song Of elephop and telephong!)"}, {"n": 16, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words is an interjection?", "options": ["with", "the", "but", "wow"]}, {"n": 17, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is not grammatically correct?", "options": ["Either a flathead or a Phillips-head screwdriver can be used to assemble the table.", "Neither checks nor credit cards are accepted by the corner store.", "Neither Oklahoma nor Arkansas borders the Gulf of Mexico.", "Either Ron or Sue know how to get home from here."]}, {"n": 18, "type": "text", "section": "Composition & writing", "stem": "Imagine you are writing an essay about space exploration with the thesis \"The benefits of space exploration are worth the costs.\" Which of the following would not be an appropriate topic for an expository paragraph of your essay?", "options": ["Technologies first developed for space exploration that have other uses", "The value of scientific knowledge about outer space to society", "The advantages of robotic over human space exploration", "The size of the government's space exploration budget"]}, {"n": 19, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following sentences is grammatically correct?", "options": ["Me and my friends love to play soccer.", "Everyone except for I takes the bus to school.", "My parents ask my sister and me to help with chores.", "You and me are in the same music class."]}, {"n": 20, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences has an independent clause underlined?", "options": ["Despite the storm, the ship stayed on course.", "Though they can swim quickly, penguins walk slowly.", "Miriam has seen the new movie, but I haven't.", "In order to reserve your place on the bus, please order your tickets before the deadline."]}, {"n": 21, "type": "text", "section": "Spelling", "stem": "Which of the following words is spelled incorrectly?", "options": ["debt", "liesure", "comb", "dough"]}, {"n": 22, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words is a conjunction?", "options": ["never", "by", "or", "real"]}, {"n": 23, "type": "text", "section": "Sentence structure", "stem": "Which one of the following sentences is not an interrogative sentence?", "options": ["Can your brother let me use his guitar for a minute?", "We are going to the party in town later?", "Are the kids prepared for the upcoming exam?", "The president is about to give a speech to the nation in an hour, isn't he?"]}, {"n": 24, "type": "text", "section": "Composition & writing", "stem": "Read the paragraph. Which of the following sentences could be a strong concluding sentence for the paragraph?", "options": ["Lastly, there are also fewer than 600 Sumatran tigers remaining in the world.", "Therefore, the main factor in the continued decline of the Javan rhinoceros' population has been poaching for horns.", "These factors have left the Javan rhinoceros one of the rarest animals on the planet.", "The Javan rhino can live around 30-45 years in the wild."], "passage": "<strong>There are fewer than 60 Javan rhinoceros remaining in the world. There is only one known population of the Javan rhinoceros in the wild, located in the island of Java, Indonesia. Loss of habitats and trophy hunting for its horns are the main causes for the serious decline in its numbers.</strong>"}, {"n": 25, "type": "text", "section": "Punctuation", "stem": "Which of these sentences does not use ellipsis (...) correctly?", "options": ["I'm not sure... I'll have to check again... but let's just make an estimate.", "He paid $25,000 for the car... using one-dollar bills.", "I will prepare my presentation... before Tuesday.", "According to Professor Gomez, \"the behavior of mice... is largely predictable.\""]}, {"n": 26, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences has an adverb clause underlined?", "options": ["The pirates buried their treasure under the palm tree.", "The U.S. Constitution was signed in 1787 but didn't come into effect until 1789.", "After the party's over we'll have to clean the house.", "The painting that was sold for $5 million was a fake!"]}, {"n": 27, "type": "text", "section": "Sentence structure", "stem": "Read the sentences. What is the direct object of the verb \"gave\"?", "options": ["friend", "coin", "her", "collection"], "passage": "<strong>Juan gave a new coin to his friend for her collection. The coin was special because of a printing error. Both sides of the coin looked the same.</strong>"}, {"n": 28, "type": "text", "section": "Composition & writing", "stem": "You are writing a short paragraph about how you felt one time when you were jogging. Which is the best way for you to revise your draft?", "options": ["Stay on the subject. Omit the sentence about wanting to be a doctor.", "Further explain why you wanted to be the fastest runner.", "Change some of the words so they sound more like something a doctor would say.", "Add a sentence at the beginning of the paragraph that explains why it is important to be in shape."], "passage": "<strong>One time I was jogging because I felt sad. I ran as fast as I could, but I was still sad. In the past, I used to run to be the fastest, but not anymore. Now I run to be healthy and in shape. I want to be a doctor because they cure people and help them feel better. By jogging, you can improve your fitness, both physical and mental.</strong>"}, {"n": 29, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a complete sentence?", "options": ["Despite our best efforts.", "Since the highway is under construction.", "Birds chirp.", "Whoever leaves the house last."]}, {"n": 30, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentence. Which of the following words can fill the blank and be grammatically correct?", "options": ["good", "well", "great", "excellent"], "passage": "<strong>Maurice plays the trumpet ___.</strong>"}, {"n": 31, "type": "text", "section": "Capitalization", "stem": "Read the address of a letter. Which of the following could fill the blank space correctly?", "options": ["Strt", "Lan", "Blvard", "Cir"], "passage": "<strong>501 Oak ___<br><br>Buffalo, MT 59418</strong>"}, {"n": 32, "type": "text", "section": "Composition & writing", "stem": "Which of the following would be a good topic sentence for a paragraph about how to take care of a dog?", "options": ["Make sure you don't give your dog too much or too little food.", "Dog care requires both a daily routine and checkups with a veterinarian.", "It's important to protect your dog from fleas and ticks.", "It's harder to take care of dogs than it is to take care of cats."]}, {"n": 33, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentences. Which of the following words from the sentences above is a comparative adjective?", "options": ["several", "between", "smaller", "external"], "passage": "<strong>There are several differences between seals and sea lions. For example, seals are usually smaller than sea lions and are also better swimmers. Seals don't have external ears, but sea lions do.</strong>"}, {"n": 34, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentences. Which of the following words from the passage is functioning as a past participle?", "options": ["permission", "received", "brought", "submit"], "passage": "<strong>Completed permission forms are required from every student who is going on the class trip. Every student received a form last week. Forms should be brought to the principal's office no later than Thursday. Please submit your forms on time!</strong>"}, {"n": 35, "type": "text", "section": "Composition & writing", "stem": "Joey wants to write a research paper about the early days of the Industrial Revolution during the 19th century. Which secondary source should Joey use for writing his paper?", "options": ["A documentary film made in the 20th century which describes the daily routine in a textile factory in the 19th century.", "A diary of an iron factory laborer from the 19th century.", "Photos of a factory from the 19th century.", "A novel which tells the story of a laborer's family back in the early days of the Industrial Revolution."]}, {"n": 36, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is not grammatically correct?", "options": ["Comets, which are made of rock and ice, orbits the sun.", "Our friends, who used to be our neighbors, are coming to visit.", "Energy conservation in homes and businesses reduces pollution.", "Stretching, when done properly, improves flexibility."]}, {"n": 37, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentence. The underlined phrase is functioning as which part of speech?", "options": ["noun", "verb", "adverb", "adjective"], "passage": "<strong>Senet is an ancient Egyptian game similar to the modern game of backgammon.</strong>"}, {"n": 38, "type": "text", "section": "Punctuation", "stem": "Read the following sentence. The following answer choices repeat the above sentence, but each one of them has an ellipsis in a different place. Choose the answer choice that correctly uses the ellipsis.", "options": ["The Wright brothers, Orville and Wilbur, are generally known for their success in building and flying the first airplane in the history of the world. Their first flight... North Carolina.", "The Wright brothers, Orville and Wilbur, are generally known for their success... Their first flight took place in 1903 in the state of North Carolina.", "The Wright brothers, Orville and Wilbur... Their first flight took place in 1903 in the state of North Carolina.", "The Wright brothers... are generally known for their success in building and flying the first airplane in the history of the world. Their first flight took place in 1903 in the state of North Carolina."], "passage": "<strong>The Wright brothers, Orville and Wilbur, are generally known for their success in building and flying the first airplane in the history of the world. Their first flight took place in 1903 in the state of North Carolina.</strong>"}, {"n": 39, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following phrases is a prepositional phrase?", "options": ["which arrived last year", "running a mile", "to sew a sweater", "at the first intersection"]}, {"n": 40, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following answer choices includes a rhetorical question?", "options": ["Don't you want to stop suffering from stomachaches? Try our new medication-it will alleviate your pain within 30 minutes!", "What is your name? I'll check to see if you are already a member in our club.", "I have been looking for my friend in the last three hours. Is there a chance you have seen him?", "Tomorrow I am going to take the train and visit the small villages near my town. There are lots of things to see and do over there. Do you want to join me?"]}, {"n": 41, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences contains a misplaced modifier?", "options": ["Our company has experienced sustained robust growth this year.", "A silver woman's bracelet was reported missing.", "The phoenix rose from its ashes in a triumphant blaze of glory.", "Sublime and awe-inspiring, the Northern Lights attract thousands of tourists each year."]}, {"n": 42, "type": "text", "section": "Punctuation", "stem": "Read the sentences and answer the question that follows. Which of the following revisions of the sentences above is punctuated correctly?", "options": ["The Pueblo people live in Arizona, and New Mexico. The Pueblo: are known for their architecture. Traditional Pueblo buildings are made from adobe: a kind of clay. Typically, three generations of a family live together-in a building that has up to five levels...", "The Pueblo people live in Arizona and New Mexico. The Pueblo are known for their architecture. Traditional Pueblo buildings are made from adobe: a kind of clay. Typically, three generations of a family live together in a building that has up to five levels...", "The Pueblo people live in Arizona and New Mexico. The Pueblo, are known for their architecture. Traditional Pueblo buildings are made from adobe: a kind of clay. Typically, three generations of a family live together in a building... openings in the roof, of each level.", "The Pueblo people live in Arizona, and New Mexico! The Pueblo people are known for their architecture. Traditional Pueblo buildings are made from adobe...a kind of clay. Typically, three generations of a family live together in a building... The roof of each level, is also a terrace..."], "passage": "<strong>The Pueblo people live in Arizona, and New Mexico. The Pueblo people are known for their architecture. Traditional Pueblo buildings are made from adobe: a kind of clay. Typically, three generations of a family live together; in a building that has up to five levels. The roof of each level is also a terrace for the level above it. People can move between levels using ladders that go through openings in the roof of each level.</strong>"}, {"n": 43, "type": "text", "section": "Composition & writing", "stem": "You want to write a short paragraph that would allow the reader to have a taste of the sunset you watched yesterday. Choose the most suitable paragraph for this purpose.", "options": ["To watch the sunset, you need to take precautions and do not look directly at the sun. Put on your sunglasses, and only when the sun starts disappearing can you look in its direction.", "Watching the sunset was a great experience. I really recommend everyone take a few minutes every day to look at it!", "Yesterday, my father and I went together to the beach to watch the sunset. We stood and watched the sun going down. After the sun disappeared, we took a taxi back home.", "When the sun was getting closer to the water, it became red like a huge grapefruit hanging in the sky, and the clouds around it looked like they were on fire."]}, {"n": 44, "type": "text", "section": "Grammar: usage", "stem": "Which sentence shows clear pronoun-antecedent agreement?", "options": ["After I finished collecting the plates from the tables, my friend helped me to return them back to their place.", "After many preparations, Chris and Rick organized a tennis competition in their school.", "If somebody wants to save some money, you first need to think about how much you usually spend each day.", "Alexandra took her wallet out of the drawer and then emptied it completely."]}, {"n": 45, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentence. Which word is modified by the adjective \"smaller\"?", "options": ["molecule", "is", "times", "grain"], "passage": "<strong>A molecule is approximately one million times smaller than a grain of sand.</strong>"}, {"n": 46, "type": "text", "section": "Composition & writing", "stem": "Which of the following is considered plagiarism in a research paper?", "options": ["paraphrasing a source without citing it", "citing another research paper written about the same topic", "citing the same source more than twice", "quoting something that was said to you"]}, {"n": 47, "type": "text", "section": "Word choice & vocabulary", "stem": "Read the sentence. Which rhetorical device is underlined in the sentence?", "options": ["inversion", "simile", "metaphor", "hyperbole"], "passage": "<strong>Never have I forgotten about my mother's birthday.</strong>"}, {"n": 48, "type": "text", "section": "Composition & writing", "stem": "You are writing an essay with the thesis \"The government should significantly reduce taxes in order to improve the economy.\" You anticipate the counterargument that a reduction in taxes would require cuts in education programs. Which source would best help you address this counterargument?", "options": ["historical evidence that lower taxes encourage economic activity", "a government budget proposal for lowering taxes and hiring more teachers", "a paper by an economist arguing that when taxes are lower companies hire more workers", "a case study showing lower taxes would improve a typical family's financial situation"]}, {"n": 49, "type": "text", "section": "Punctuation", "stem": "Read the sentence. Which punctuation is correct for all of the blank spaces?", "options": ["commas", "semicolons", "colons", "dashes"], "passage": "<strong>Our company has offices in Florence, Italy ___ Nairobi, Kenya ___ Montevideo, Uruguay, and New Delhi, India.</strong>"}, {"n": 50, "type": "text", "section": "Sentence structure", "stem": "Choose the sentence that uses parallelism.", "options": ["Breakfast is considered by many the most important meal of the day.", "Mount Vesuvius, which is located in Italy, is one of the most active volcanoes in the world.", "Jenny is an extraordinary athlete, as she practices swimming, dancing, and running.", "Bob did his best to get a high score on the test."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
