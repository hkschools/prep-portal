<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 6 Language Usage (Level 3): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 3): Drill 1</div>
  <h2>MAP Grade 6 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 3): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 3): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G6-LANG-L3-D1";
const BANK_PATH = "map-tests/grade-6/language-usage/level-3/drill-1/bank.csv";
const TITLE = "MAP Grade 6 Language Usage (Level 3): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences does not use the word \"then\" or the word \"than\" correctly?", "options": ["More then one quarter of marine species live in coral reefs.", "Our team was behind by one point, but then we scored a goal.", "Mumbai is closer to Hyderabad than to New Delhi.", "If you go to sleep early, then you will be well-rested tomorrow."]}, {"n": 2, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the paragraph. Which of the nouns in the paragraph can be classified as abstract?", "options": ["childhood, parents, imagination", "book, reading, knowledge", "childhood, knowledge, imagination", "book, parents, reading"], "passage": "<strong>During my childhood, I really enjoyed reading books. My parents bought me my first book when I was eight years old. Reading can be very beneficial for you. It can expand your knowledge and help you develop a rich imagination.</strong>"}, {"n": 3, "type": "text", "section": "Sentence structure", "stem": "Read the following. What is the proper classification of what is written above?", "options": ["interrogative sentence", "declarative sentence", "independent clause", "sentence fragment"], "passage": "<strong>Learning first aid and CPR in a babysitting class.</strong>"}, {"n": 4, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a declarative sentence?", "options": ["Do you have any idea what caused the dinosaurs to disappear 65 million years ago?", "Basketball is one of the most interesting games in the world, isn't it?", "The Gulf Stream is a warm current in the Atlantic Ocean that originates at America's shores and ends up in Europe.", "What an excellent movie I watched yesterday! It is absolutely the best movie I've ever seen!"]}, {"n": 5, "type": "text", "section": "Composition & writing", "stem": "Read the sentences. Which of the following sentences has the same meaning as the sentences above?", "options": ["Though Karl Benz invented the first gasoline-powered car in 1885, it was less reliable and more expensive than the Model T Henry Ford developed in 1913.", "In 1913, Henry Ford stole Karl Benz's 1885 invention and made it widely affordable.", "Though the gasoline-powered car was invented by Karl Benz in 1885, the first widely affordable car, the Model T, was developed by Henry Ford in 1913.", "Karl Benz invented the gasoline-powered car in 1885 but it was much less practical than the Model T developed by Henry Ford in 1913."], "passage": "<strong>The first gasoline-powered car was invented by Karl Benz in 1885. Henry Ford developed a car called the Model T in 1913. Ford's Model T was the first car that was widely affordable.</strong>"}, {"n": 6, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences uses alliteration?", "options": ["Liz has found a new way to get to school.", "Kelly claims her clothes are clean.", "My tap does not stop leaking.", "Their bond will hold far and beyond."]}, {"n": 7, "type": "text", "section": "Capitalization", "stem": "Choose the sentence that uses correct rules of capitalization.", "options": ["The student has been studying at Burlington high school for more than three years.", "My friend Emily volunteers every monday in the community center near her home.", "Ferdinand Hayden was an American scientist who convinced Congress to turn Yellowstone into a national park.", "Unfortunately, Panda bears are vulnerable animals. They mainly live in the southern area of China."]}, {"n": 8, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentence. Which of the following is the infinitive in this sentence?", "options": ["the first spring rain", "falls", "turns", "to absorb"], "passage": "<strong>After the first spring rain falls, the field near my house turns green and many people visit it to absorb some fresh air and beautiful views.</strong>"}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Which is the best thesis for a persuasive essay on the first time people landed on the moon?", "options": ["The moon landing is an event known by everyone in the United States.", "The moon landing was part of NASA's Apollo program.", "The moon landing is an achievement that humanity would have certainly reached at some point in one way or another.", "A famous sentence said by Neil Armstrong during the landing was, \"That's one small step for a man, one giant leap for mankind.\""]}, {"n": 10, "type": "text", "section": "Punctuation", "stem": "Which of the following titles of a play is punctuated correctly?", "options": ["\"Cats\"", "A Streetcar Named Desire", "Pygmalion", "The Merry Wives of Windsor"]}, {"n": 11, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences uses vivid imagery?", "options": ["Sometimes loud planes fly over our house and annoy us.", "Plankton are tiny creatures that play an essential role in ocean ecosystems.", "The National Mall in Washington, D.C. is a park, not a shopping mall.", "Smooth, flat stones are perfect for skipping on a lake to make rippling patterns."]}, {"n": 12, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following forms of poetry is characterized by praise for a person, place, thing, or idea?", "options": ["Elegy", "Ode", "Free Verse", "Haiku"]}, {"n": 13, "type": "text", "section": "Punctuation", "stem": "Choose the sentence that is correctly punctuated.", "options": ["My parents went to the city market yesterday and bought some fruit, bananas, apples, watermelons, peaches, and oranges.", "I have visited five big capital cities in my life: London, Moscow, Copenhagen, Ankara, and New Delhi.", "My friend Bill has a lot of books from various genres, including: drama, comedy, action, and adventure.", "Next summer, my family plans to travel to: Arizona and Nevada."]}, {"n": 14, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences does not use a semicolon correctly?", "options": ["The Summer Solstice is the longest day of the year; a tandem bicycle has two seats.", "Some birds can fly; others can't.", "Alexander Fleming noticed that mold stopped bacteria from growing; as a result, he discovered penicillin.", "Interstate highways with north-south routes have odd numbers; those with east-west routes have even numbers."]}, {"n": 15, "type": "text", "section": "Composition & writing", "stem": "Which of the following writing samples is an example of expository text?", "options": ["On a Sunday morning, you can hear the birds chirping as if the world belongs to them, not the cars and trucks that rule during the week. The stillness in the air clears away busy thoughts, like taking a soothing warm bath.", "Do yourself and our community a favor by volunteering at the zoo. As a volunteer, you'll provide care and companionship to all kinds of animals and will help to lead educational programs for visitors of all ages.", "One day, Jerry and Sue started a journey to find the end of the rainbow. They searched and searched and had many adventures. They never did find the end of the rainbow, but they realized that the journey is more important than the destination.", "The Tang Dynasty period (618-907 CE) was a time full of many great achievements of Chinese culture. Poetry, painting, and sculpture flourished, and technological innovations included the printing press and fireworks."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
