<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 6 Language Usage (Level 3): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 3): Drill 2</div>
  <h2>MAP Grade 6 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 3): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 6 Language Usage (Level 3): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G6-LANG-L3-D2";
const BANK_PATH = "map-tests/grade-6/language-usage/level-3/drill-2/bank.csv";
const TITLE = "MAP Grade 6 Language Usage (Level 3): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences is not punctuated correctly?", "options": ["My pet hamster, Fuzzy, loves to play inside of a wheel.", "The jazz musician Louis Armstrong was known for his trumpet solos.", "Mercury, the planet closest to the sun is covered in craters.", "We learned how to dance the Mazurka, a Polish folk dance."]}, {"n": 2, "type": "text", "section": "Spelling", "stem": "In which of the following sentences is the underlined compound noun written correctly?", "options": ["My friend has two father-in-laws.", "They are building three new parkings garage in town.", "Your plan has some obvious drawsback.", "I bought two different bottle openers."]}, {"n": 3, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a complex sentence?", "options": ["She doesn't speak Spanish, but she does speak Portuguese.", "The Dodo bird became extinct due to human activity.", "Despite the rain, the picnic was still a success.", "Going to school in the morning and going home in the afternoon."]}, {"n": 4, "type": "text", "section": "Word choice & vocabulary", "stem": "What does it mean when a poem has an end rhyme?", "options": ["that the poem does not have a rhyme pattern", "that the poem's rhymes appear at the end of its lines", "that there is only one rhyme at the end of the poem", "that the rhymes start towards the end of the poem"]}, {"n": 5, "type": "text", "section": "Composition & writing", "stem": "Which of the following is a relevant research question about musical instruments?", "options": ["When was the clarinet invented?", "What is the role of the drum in Navajo culture?", "Which instrument sounds better, the violin or the saxophone?", "What are the differences between a guitar and a banjo?"]}, {"n": 6, "type": "text", "section": "Capitalization", "stem": "Which of the following is an abbreviation that would be used to describe a nurse?", "options": ["J.D.", "R.N.", "M.D.", "Ph.D."]}, {"n": 7, "type": "text", "section": "Grammar: usage", "stem": "Read the sentence. Choose the words that correctly complete the sentence.", "options": ["had, sell", "has, sold", "had, sold", "has, sell"], "passage": "<strong>By the time Phil arrived at the office, the sandwich vendor ___ already ___ all his sandwiches.</strong>"}, {"n": 8, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentences. Which word correctly fills the blank?", "options": ["she", "I", "they", "me"], "passage": "<strong>Jessica invited my friends and ___ to a picnic at the park on Sunday. Each of us will bring food to share. In case of bad weather, we will have lunch indoors instead of going to the park.</strong>"}, {"n": 9, "type": "text", "section": "Capitalization", "stem": "Which sentence uses capitalization correctly?", "options": ["\"I enjoy running,\" said Albert, \"But I prefer swimming.\"", "\"Do you know,\" asked Maureen, \"How to make a birdhouse?\"", "\"South Africa has three capitals,\" Answered Yasmine, \"Cape Town, Pretoria, and Bloemfontein.\"", "\"If we get up early tomorrow,\" suggested Tom, \"we can finish our work by noon.\""]}, {"n": 10, "type": "text", "section": "Sentence structure", "stem": "Read the passage. Which underlined section of the passage is an independent clause?", "options": ["the daughter of the famous poet Lord Byron", "she met Charles Babbage", "proposing that computers could perform many tasks besides calculations", "Though Lovelace didn't live long enough to see her ideas put into practice"], "passage": "<strong>Long before computers existed, Ada Lovelace was already thinking of innovative ways they could be used. Lovelace, the daughter of the famous poet Lord Byron [A], was born in England in 1815. In 1833, she met Charles Babbage [B], who was creating a design for a mechanical computer that could perform calculations. Lovelace added to Babbage's ideas by proposing that computers could perform many tasks besides calculations [C]. Though Lovelace didn't live long enough to see her ideas put into practice [D], she is widely considered one of the first and most influential computer scientists in history.</strong>"}, {"n": 11, "type": "text", "section": "Grammar: parts of speech", "stem": "Read the sentence. The underlined phrase is functioning as what part of speech?", "options": ["noun", "pronoun", "adjective", "adverb"], "passage": "<strong>It can be difficult to acknowledge one's shortcomings in a dignified manner.</strong>"}, {"n": 12, "type": "text", "section": "Sentence structure", "stem": "Read the sentences. Which of the following is the best revision of the first sentence?", "options": ["People wear hats for many reasons, including to express themselves, to protect themselves from the sun, and practicing their religion.", "People wear hats for many reasons, including self-expression, protection from the sun, and to practice their religion.", "People wear hats for many reasons, including expressing themselves, protecting themselves from the sun, and to practice their religion.", "People wear hats for many reasons, including self-expression, protection from the sun, and religious practice."], "passage": "<strong>People wear hats for many reasons, including to express themselves, protection from the sun, wearing a uniform, and as part of their religion. Different cultures have a variety of traditions of hat-wearing, including countless styles for both men and women. Do you like to wear hats?</strong>"}, {"n": 13, "type": "text", "section": "Punctuation", "stem": "Read the sentences with missing punctuation. Which punctuation correctly fills the two blanks, in order?", "options": ["comma, comma", "semicolon, comma", "colon, colon", "colon, comma"], "passage": "<strong>There are three main types of rock ___ igneous, sedimentary, and metamorphic. Each kind of rock is formed in a different process. Igneous rock forms when magma (molten rock) cools. Sedimentary rock forms when grains of sand or other small particles stick together. Metamorphic rock ___ the rarest type of rock, forms when an already-existing rock is transformed by heat, pressure, or chemical reactions.</strong>"}, {"n": 14, "type": "text", "section": "Word choice & vocabulary", "stem": "Read the sentence. Which word best replaces the underlined phrase while keeping the same meaning?", "options": ["will conclude", "will stop", "will be completed", "will be finished"], "passage": "<strong>The show will be over at 4:30.</strong>"}, {"n": 15, "type": "text", "section": "Grammar: parts of speech", "stem": "In which of the following sentences is a relative pronoun underlined?", "options": ["The apple trees that we planted are starting to produce fruit.", "My cousins and their friends will meet us at the movie theater.", "I must reply to several important emails this morning.", "Abigail is preparing herself for an audition."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
