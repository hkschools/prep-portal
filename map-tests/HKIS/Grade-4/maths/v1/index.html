<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP HKIS Entry Grade 4 Mathematics (V1)</title>
<style>
#qcard svg{width:100%;max-width:360px;height:auto;display:block}  /* figures ship without width attrs; without this they stretch to the full card */
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP HKIS Entry Grade 4 Mathematics (V1)</div>
  <h2>MAP HKIS Entry · Grade 4 Mathematics</h2>
  <p class="muted">23 questions. Calculators are NOT permitted. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 4 Mathematics (V1)</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 4 Mathematics (V1)</div>
  <div class="card"><h2 id="thanks" style="color:var(--navy);margin:0 0 6px"></h2><p class="muted" id="thanksmsg" style="margin:0"></p></div>
</div>

const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Number & operations", "stem": "A baker used 2.5 kg of flour on Monday and 1.75 kg on Tuesday. How much flour did she use in total?", "options": ["3.25 kg", "4.25 kg", "4.20 kg", "3.75 kg"]}, {"n": 2, "type": "text", "section": "Number & operations", "stem": "On a number line, point P is exactly halfway between 3,400 and 3,600. What number does P represent?", "options": ["3,450", "3,520", "3,550", "3,500"]}, {"n": 3, "type": "text", "section": "Geometry & measurement", "stem": "The rectangle below is split into two parts. Which expression gives its total area?", "options": ["6 × 4", "6 + 7", "(6 × 4) + (6 × 3)", "6 + 4 + 3"], "fig": "<div style=\"margin:8px 0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 170\">\n<rect x=\"20\" y=\"30\" width=\"160\" height=\"110\" fill=\"#dCe6f2\" stroke=\"#1f3355\" stroke-width=\"2\"/>\n<rect x=\"180\" y=\"30\" width=\"120\" height=\"110\" fill=\"#eef3fa\" stroke=\"#1f3355\" stroke-width=\"2\"/>\n<line x1=\"180\" y1=\"30\" x2=\"180\" y2=\"140\" stroke=\"#1f3355\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<text x=\"100\" y=\"92\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"20\" text-anchor=\"middle\">4 cm</text>\n<text x=\"240\" y=\"92\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"20\" text-anchor=\"middle\">3 cm</text>\n<text x=\"10\" y=\"90\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"20\" text-anchor=\"middle\" transform=\"rotate(-90 10 90)\">6 cm</text>\n</svg></div>"}, {"n": 4, "type": "text", "section": "Geometry & measurement", "stem": "A rectangle has an area of 48 cm² and a width of 6 cm. What is its length?", "options": ["8 cm", "42 cm", "288 cm", "9 cm"]}, {"n": 5, "type": "text", "section": "Patterns & algebra", "stem": "A pattern of rods grows by the same amount each time: 15 cm, 30 cm, 45 cm, … How long is the 6th rod, written in metres?", "options": ["0.9 m", "0.75 m", "9 m", "90 m"]}, {"n": 6, "type": "text", "section": "Number & operations", "stem": "What is 7,000 − 2,486?", "options": ["5,514", "4,624", "5,624", "4,514"]}, {"n": 7, "type": "text", "section": "Data & statistics", "stem": "The bar graph shows how many books four students read. How many more books did Mei read than Tom?", "options": ["5", "6", "7", "29"], "fig": "<div style=\"margin:8px 0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 240\">\n<line x1=\"55\" y1=\"210.0\" x2=\"350\" y2=\"210.0\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"215.0\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"end\">0</text><line x1=\"55\" y1=\"170.0\" x2=\"350\" y2=\"170.0\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"175.0\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"end\">5</text><line x1=\"55\" y1=\"130.0\" x2=\"350\" y2=\"130.0\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"135.0\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"end\">10</text><line x1=\"55\" y1=\"90.0\" x2=\"350\" y2=\"90.0\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"95.0\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"end\">15</text><line x1=\"55\" y1=\"50.0\" x2=\"350\" y2=\"50.0\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"55.0\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"end\">20</text><line x1=\"55\" y1=\"20\" x2=\"55\" y2=\"210\" stroke=\"#1f3355\" stroke-width=\"2\"/>\n<line x1=\"55\" y1=\"210\" x2=\"350\" y2=\"210\" stroke=\"#1f3355\" stroke-width=\"2\"/>\n<text x=\"20\" y=\"120\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"14\" text-anchor=\"middle\" transform=\"rotate(-90 20 120)\">Books read</text>\n<rect x=\"70\" y=\"66.0\" width=\"46\" height=\"144.0\" fill=\"#2f5597\" stroke=\"#1f3355\"/>< t", "stem": "A regular pentagon has a perimeter of 35 cm. How long is each side?", "options": ["5 cm", "175 cm", "7 cm", "30 cm"]}, {"n": 12, "type": "text", "section": "Geometry & measurement", "stem": "On the grid, a triangle has vertices at (2, 1), (2, 4) and (5, 1). What is the length of its vertical side?", "options": ["3 units", "4 units", "5 units", "6 units"], "fig": "<div style=\"margin:8px 0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 280\">\n<line x1=\"40\" y1=\"250\" x2=\"40\" y2=\"-14\" stroke=\"#dde4ee\"/><line x1=\"40\" y1=\"250\" x2=\"304\" y2=\"250\" stroke=\"#dde4ee\"/><text x=\"40\" y=\"268\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"middle\">0</text><line x1=\"84\" y1=\"250\" x2=\"84\" y2=\"-14\" stroke=\"#dde4ee\"/><line x1=\"40\" y1=\"206\" x2=\"304\" y2=\"206\" stroke=\"#dde4ee\"/><text x=\"84\" y=\"268\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"middle\">1</text><text x=\"28\" y=\"211\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"middle\">1</text><line x1=\"128\" y1=\"250\" x2=\"128\" y2=\"-14\" stroke=\"#dde4ee\"/><line x1=\"40\" y1=\"162\" x2=\"304\" y2=\"162\" stroke=\"#dde4ee\"/><text x=\"128\" y=\"268\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"middle\">2</text><text x=\"28\" y=\"167\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"middle\">2</text><line x1=\"172\" y1=\"250\" x2=\"172\" y2=\"-14\" stroke=\"#dde4ee\"/><line x1=\"40\" y1=\"118\" x2=\"304\" y2=\"118\" stroke=\"#dde4ee\"/><text x=\"172\" y=\"268\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"middle\">3</text><text x=\"28\" y=\"123\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"13\" text-anchor=\"middle\">3</text><line x1=\"216\" y1=\"250\" x2=\"216\" y2=\"-14\"  the third term?", "options": ["5", "11", "9", "10"]}, {"n": 14, "type": "text", "section": "Number & operations", "stem": "Which number makes this equation true?  8 × 47 = (8 × 40) + (8 × ▢)", "options": ["40", "47", "8", "7"]}, {"n": 15, "type": "text", "section": "Data & statistics", "stem": "The table shows tickets sold over four days. Altogether 200 tickets were sold. How many were sold on Day 4?", "options": ["55", "60", "140", "50"], "fig": "<div style=\"margin:8px 0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px\"><table style=\"border-collapse:collapse;margin:0 auto;font-size:15px\"><tr><th style=\"border:1px solid #1f3355;padding:6px 16px;background:#eef3fa\">Day</th><th style=\"border:1px solid #1f3355;padding:6px 16px;background:#eef3fa\">Tickets sold</th></tr><tr><td style=\"border:1px solid #1f3355;padding:6px 16px\">Day 1</td><td style=\"border:1px solid #1f3355;padding:6px 16px;text-align:center\">55</td></tr><tr><td style=\"border:1px solid #1f3355;padding:6px 16px\">Day 2</td><td style=\"border:1px solid #1f3355;padding:6px 16px;text-align:center\">48</td></tr><tr><td style=\"border:1px solid #1f3355;padding:6px 16px\">Day 3</td><td style=\"border:1px solid #1f3355;padding:6px 16px;text-align:center\">37</td></tr><tr><td style=\"border:1px solid #1f3355;padding:6px 16px\">Day 4</td><td style=\"border:1px solid #1f3355;padding:6px 16px;text-align:center\">?</td></tr></table></div>"}, {"n": 16, "type": "text", "section": "Geometry & measurement", "stem": "A jug holds 2 litres of juice. Each glass holds 250 mL. How many full glasses can be poured from the jug?", "options": ["4", "5", "250", "8"]}, {"n": 17, "type": "text", "section": "Data & statistics", "stem": "Over three games a player scored 12, 15 and 18 points. What was the mean (average) score?", "options": ["15", "45", "14", "16"]}, {"n": 18, "type": "text", "section": "Geometry & measurement", "stem": "A rectangular box is completely filled with unit cubes: 4 along, 3 across and 2 high. How many cubes fill the box?", "options": ["9", "24", "14", "12"], "fig": "<div style=\"margin:8px 0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 200\"><polygon points=\"18.0,90.0 202.0,90.0 274.0,18.0 90.0,18.0\" fill=\"#cfe0f5\" stroke=\"#1f3355\" stroke-width=\"2\"/><polygon points=\"202.0,90.0 202.0,182.0 274.0,110.0 274.0,18.0\" fill=\"#9fc0e8\" stroke=\"#1f3355\" stroke-width=\"2\"/><polygon points=\"18.0,90.0 202.0,90.0 202.0,182.0 18.0,182.0\" fill=\"#eaf2fb\" stroke=\"#1f3355\" stroke-width=\"2\"/><line x1=\"64\" y1=\"90\" x2=\"64\" y2=\"182\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"110\" y1=\"90\" x2=\"110\" y2=\"182\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"156\" y1=\"90\" x2=\"156\" y2=\"182\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"18\" y1=\"136\" x2=\"202\" y2=\"136\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"64\" y1=\"90\" x2=\"136.0\" y2=\"18.0\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"110\" y1=\"90\" x2=\"182.0\" y2=\"18.0\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"156\" y1=\"90\" x2=\"228.0\" y2=\"18.0\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"42.0\" y1=\"66.0\" x2=\"226.0\" y2=\"66.0\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"66.0\" y1=\"42.0\" x2=\"250.0\" y2=\"42.0\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"202\" y1=\"136\" x2=\"274.0\" y2=\"64.0\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"226.0\" y1=\"66.0\" x2=\"226.0\" y2=\"158.0\" stroke=\"#1f3355\" stroke-width=\"1\"/><line x1=\"250.0\" y1=\"42.0\" x2=\"250.0\" y2=\"134.0\" stroke=\"#1f3355\" stroke-width=\"1\"/></svg></div>"}, {"n": 19, "type": "text", "section": "Patterns & algebra", "stem": "A pattern of squares grows: Figure 1 has 1 square, Figure 2 has 4 squares, Figure 3 has 9 squares. How many squares are in Figure 5?", "options": ["16", "25", "20", "15"]}, {"n": 20, "type": "text", "section": "Fractions", "stem": "Which number is greater than 3/5?", "options": ["0.7", "0.55", "1/2", "0.6"]}, {"n": 21, "type": "text", "section": "Number & operations", "stem": "A pen costs $7.50. Maya buys 4 pens and pays with a $50 note. How much change should she receive?", "options": ["$22.50", "$20.00", "$30.00", "$12.50"]}, {"n": 22, "type": "text", "section": "Number & operations", "stem": "I am a 4-digit number. My thousands digit is 3 more than my ones digit. My ones digit is 4, and my tens and hundreds digits are both 0. What number am I?", "options": ["4,007", "7,004", "3,004", "7,040"]}, {"n": 23, "type": "text", "section": "Data & statistics", "stem": "Five children measured their plants (in cm): 12, 19, 15, 22, 16. What is the range of the measurements?", "options": ["16", "19", "17", "10"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  if(q.fig) h += q.fig;
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("thanks").textContent = "Thank you, " + (window.studentName || "") + ".";
  document.getElementById("thanksmsg").textContent = "Your responses have been sent to HK-Schools.com for review. We will contact you shortly.";
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
