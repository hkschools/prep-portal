<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP HKIS Entry Grade 4 Reading (V1)</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP HKIS Entry Grade 4 Reading (V1)</div>
  <h2>MAP HKIS Entry · Grade 4 Reading</h2>
  <p class="muted">21 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 4 Reading (V1)</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 4 Reading (V1)</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

ike reading science.", "The gym is too small for sports."], "passage": "<strong>Read the passage (D — “Why Our School Should Have a Garden” (persuasive / argument))</strong><br><br>Our school should plant a vegetable garden in the empty yard behind the gym. First, a garden would give students a place to learn science by doing, not just by reading; we could measure how fast plants grow and test which soil works best. Second, the vegetables we grow could be used in the school kitchen, saving money and giving us fresher food. Finally, caring for plants teaches patience and teamwork, because a garden needs the whole class to water and weed it. Some people say a garden is too much work. But if every student helps for ten minutes a week, the work is small and the rewards are large."}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "How does the writer answer people who say a garden is too much work?", "options": ["By agreeing that it is too much work.", "By saying teachers will do all the work.", "By explaining the work is small if every student helps a little.", "By ignoring the concern completely."], "passage": "<strong>Read the passage (D — “Why Our School Should Have a Garden” (persuasive / argument))</strong><br><br>Our school should plant a vegetable garden in the empty yard behind the gym. First, a garden would give students a place to learn science by doing, not just by reading; we could measure how fast plants grow and test which soil works best. Second, the vegetables we grow could be used in the school kitchen, saving money and giving us fresher food. Finally, caring for plants teaches patience and teamwork, because a garden needs the whole class to water and weed it. Some people say a garden is too much work. But if every student helps for ten minutes a week, the work is small and the rewards are large."}, {"n": 13, "type": "text", "section": "Detail & inference", "stem": "Why does the narrator say the lumpy bao was “the best thing msy,” clumsy means —", "options": ["quick and neat", "strong and large", "awkward and not skillful", "clean and dry"], "passage": "<strong>Read the passage (E — “My First Bao” (memoir / personal narrative))</strong><br><br>I still remember the morning my grandmother taught me to fold bao. Flour dusted the whole kitchen table like soft snow. My fingers were clumsy, and my first bun looked more like a squashed dumpling than a neat ball. Po Po laughed, but it was a kind laugh. “The shape will come,” she said. “The taste is already here.” We steamed the buns until the kitchen filled with warm clouds. When I bit into my lumpy bao, it was the best thing I had ever eaten, perhaps because I had made it myself. Now, whenever I smell steaming dough, I think of that snowy table and my grandmother's patient hands."}, {"n": 16, "type": "text", "section": "Author's craft & structure", "stem": "Which step happens right after water evaporates into the air?", "options": ["The water falls as rain or snow.", "The sun heats the oceans.", "Rivers carry the water to the sea.", "The vapour cools and condenses into clouds."], "passage": "<strong>Read the passage (F — “The Water Cycle” (informational (science)))</strong><br><br>Water is always on the move, travelling in a never-ending loop called the water cycle. When the sun heats lakes, rivers, and oceans, some water turns into an invisible gas called water vapour and rises into the air; this step is called evaporation. High in the sky, cool air turns the vapour back into tiny drops that gather into clouds, which is called condensation. When the drops grow heavy enough, they fall as rain or snow, called precipitation. The water collects in rivers and oceans again, and the whole cycle starts over. The water you drink today may have fallen as rain hundreds of years ago."}, {"n": 17, "type": "text", "section": "Detail & inference", "stem": "According to the passage, what causes water to evaporate?", "options": ["Clouds becoming too heavy.", aking other children laugh.", "Finishing a race quickly."], "passage": "<strong>Read the passage (G — “The Borrowed Bicycle” (literary fiction))</strong><br><br>Aisha's bicycle had a flat tyre on the day of the big race. Her neighbour, old Mr. Tang, wheeled out his ancient bicycle, the one with the squeaky chain and the basket on the front. “It is slow,” he warned, “but it still rolls.” Aisha thanked him and pedalled to the starting line. The other children laughed at the rattly old bike with its basket. Aisha did not win the race. But near the finish she saw a small boy who had fallen, and she stopped to help him up, sitting him in the basket and riding him to his mother. That evening, more people remembered the girl with the basket than the child who came first."}, {"n": 20, "type": "text", "section": "Detail & inference", "stem": "Why did people remember Aisha that evening?", "options": ["Because she won the race easily.", "Because her bicycle was brand new.", "Because she laughed the loudest.", "Because she stopped to help a fallen boy instead of only racing."], "passage": "<strong>Read the passage (G — “The Borrowed Bicycle” (literary fiction))</strong><br><br>Aisha's bicycle had a flat tyre on the day of the big race. Her neighbour, old Mr. Tang, wheeled out his ancient bicycle, the one with the squeaky chain and the basket on the front. “It is slow,” he warned, “but it still rolls.” Aisha thanked him and pedalled to the starting line. The other children laughed at the rattly old bike with its basket. Aisha did not win the race. But near the finish she saw a small boy who had fallen, and she stopped to help him up, sitting him in the basket and riding him to his mother. That evening, more people remembered the girl with the basket than the child who came first."}, {"n": 21, "type": "text", "section": "Vocabulary in context", "stem": "Mr. Tang's bicycle is called “ancient.” Ancient means —", "options": ["very fast", "brightly painted", "brand new", "very old"], "passage": "<strong>Read the passage (G — “The Borrowed Bicycle” (literary fiction))</strong><br><br>Aisha's bicycle had a flat tyre on the day of the big race. Her neighbour, old Mr. Tang, wheeled out his ancient bicycle, the one with the squeaky chain and the basket on the front. “It is slow,” he warned, “but it still rolls.” Aisha thanked him and pedalled to the starting line. The other children laughed at the rattly old bike with its basket. Aisha did not win the race. But near the finish she saw a small boy who had fallen, and she stopped to help him up, sitting him in the basket and riding him to his mother. That evening, more people remembered the girl with the basket than the child who came first."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  if(q.fig) h += q.fig;
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
