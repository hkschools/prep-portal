<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP HKIS Entry Grade 3 Reading (V1)</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP HKIS Entry Grade 3 Reading (V1)</div>
  <h2>MAP HKIS Entry · Grade 3 Reading</h2>
  <p class="muted">21 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 3 Reading (V1)</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 3 Reading (V1)</div>
  <div class="card"><h2 id="thanks" style="color:var(--navy);margin:0 0 6px"></h2><p class="muted" id="thanksmsg" style="margin:0"></p></div>
</div>

<script>

const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Reading", "stem": "Which sentence best summarizes what happens in this passage?", "options": ["Maya loses both of her red mittens at the park and has to buy new ones.", "Leo is angry because Maya borrowed his warm winter boots without asking.", "Maya teaches her little brother Leo how to keep his hands warm in winter.", "Maya cannot find her mitten until Leo reveals he hid it to keep it warm."], "passage": "<strong>Read the passage (A — “The Lost Mitten” (short realistic fiction))</strong><br><br>Maya searched everywhere for her red mitten. She looked under her bed, inside her backpack, and behind the couch. “I had it at the park,” she said with a sigh. Her little brother Leo watched her quietly. Then he grinned and pulled the mitten out from inside his boot. “I was keeping it warm for you!” he laughed. Maya rolled her eyes, but she could not help smiling. She tugged the mitten onto her cold hand. “Next time,” she said, “keep your own boots warm.”"}, {"n": 2, "type": "text", "section": "Reading", "stem": "What is the theme, or lesson, of this passage?", "options": ["A little brother can be playful and loving even when he is annoying.", "You should never let anyone borrow your favourite winter clothing.", "Brothers and sisters should not be allowed to play together.", "It is dangerous to leave the house without warm mittens in winter."], "passage": "<strong>Read the passage (A — “The Lost Mitten” (short realistic fiction))</strong><br><br>Maya searched everywhere for her red mitten. She looked under her bed, inside her backpack, and behind the couch. “I had it at the park,” she said with a sigh. Her little brother Leo watched her quietly. Then he grinned and pulled the mitten out from inside his boot. “I was keeping it warm for you!” he laughed. Maya rolled her eyes, but she could not help smiling. She tugged the mitten onto her cold hand. “Next time,” she said, “keep your own boots warm.”"}, {"n": 3, "type": "text", "section": "Reading", "stem": "Read the sentence. What mood does the writer create?", "options": ["Cheerful and excited", "Calm and peaceful", "Silly and funny", "Spooky and scary"], "passage": "<strong>Read the passage (A — “The Lost Mitten” (short realistic fiction))</strong><br><br>Maya searched everywhere for her red mitten. She looked under her bed, inside her backpack, and behind the couch. “I had it at the park,” she said with a sigh. Her little brother Leo watched her quietly. Then he grinned and pulled the mitten out from inside his boot. “I was keeping it warm for you!” he laughed. Maya rolled her eyes, but she could not help smiling. She tugged the mitten onto her cold hand. “Next time,” she said, “keep your own boots warm.”"}, {"n": 4, "type": "text", "section": "Reading", "stem": "What is the best title for this passage?", "options": ["How Sharks Hunt for Food", "The Important Work of Bees", "A Trip to the Vegetable Garden", "Why Flowers Are So Colourful"], "passage": "<strong>Read the passage (B — “The Busy Bee” (short informational))</strong><br><br>Honeybees are small insects that do a very big job. As a bee flies from flower to flower, it collects a sweet liquid called nectar. The bee carries the nectar back to its hive. There, the nectar slowly turns into honey. While the bee gathers nectar, yellow dust called pollen sticks to its body. The bee carries this pollen to other flowers. This helps new plants grow. Without bees, many of the fruits and vegetables we eat would not grow at all."}, {"n": 5, "type": "text", "section": "Reading", "stem": "In the passage, the word “collects” is closest in meaning to which word?", "options": ["drops", "spills", "gathers", "sells"], "passage": "<strong>Read the passage (B — “The Busy Bee” (short informational))</strong><br><br>Honeybees are small insects that do a very big job. As a bee flies from flower to flower, it collects a sweet liquid called nectar. The bee carries the nectar back to its hive. There, the nectar slowly turns into honey. While the bee gathers nectar, yellow dust called pollen sticks to its body. The bee carries this pollen to other flowers. This helps new plants grow. Without bees, many of the fruits and vegetables we eat would not grow at all."}, {"n": 6, "type": "text", "section": "Reading", "stem": "Based on the passage, which statement is true?", "options": ["Bees turn pollen directly into honey inside the flower.", "Bees only visit one single flower during their whole life.", "Honey is made before the bee ever leaves the hive.", "Pollen carried by bees helps new plants grow."], "passage": "<strong>Read the passage (B — “The Busy Bee” (short informational))</strong><br><br>Honeybees are small insects that do a very big job. As a bee flies from flower to flower, it collects a sweet liquid called nectar. The bee carries the nectar back to its hive. There, the nectar slowly turns into honey. While the bee gathers nectar, yellow dust called pollen sticks to its body. The bee carries this pollen to other flowers. This helps new plants grow. Without bees, many of the fruits and vegetables we eat would not grow at all."}, {"n": 7, "type": "text", "section": "Reading", "stem": "In the passage, the phrase “his stomach still felt tight” tells the reader that Daniel feels", "options": ["hungry for his lunch.", "proud of his hard work.", "bored by the lesson.", "nervous about the test."], "passage": "<strong>Read the passage (C — “The Spelling Test” (short realistic fiction))</strong><br><br>Daniel stared at the spelling list. The words looked like a tangle of letters. He had practised every night that week, but his stomach still felt tight. When the teacher read the first word, his pencil trembled. Then he remembered his mother's advice: “Take it one word at a time.” Slowly, the letters began to make sense. By the last word, Daniel was sitting up straight. When the teacher handed back the test, a bright sticker shone at the top. Daniel had earned every single mark."}, {"n": 8, "type": "text", "section": "Reading", "stem": "This passage is an example of which type of text?", "options": ["A poem with rhyming lines", "A set of instructions", "A piece of realistic fiction", "A true news report"], "passage": "<strong>Read the passage (C — “The Spelling Test” (short realistic fiction))</strong><br><br>Daniel stared at the spelling list. The words looked like a tangle of letters. He had practised every night that week, but his stomach still felt tight. When the teacher read the first word, his pencil trembled. Then he remembered his mother's advice: “Take it one word at a time.” Slowly, the letters began to make sense. By the last word, Daniel was sitting up straight. When the teacher handed back the test, a bright sticker shone at the top. Daniel had earned every single mark."}, {"n": 9, "type": "text", "section": "Reading", "stem": "Read the sentence. The word “exhausted” means almost the same as", "options": ["very tired", "very hungry", "very angry", "very brave"], "passage": "<strong>Read the passage (C — “The Spelling Test” (short realistic fiction))</strong><br><br>Daniel stared at the spelling list. The words looked like a tangle of letters. He had practised every night that week, but his stomach still felt tight. When the teacher read the first word, his pencil trembled. Then he remembered his mother's advice: “Take it one word at a time.” Slowly, the letters began to make sense. By the last word, Daniel was sitting up straight. When the teacher handed back the test, a bright sticker shone at the top. Daniel had earned every single mark."}, {"n": 10, "type": "text", "section": "Reading", "stem": "Why did the author write this passage?", "options": ["To convince the school to make recess longer", "To explain the rules students follow at recess", "To tell a funny story about a game at recess", "To describe how a playground is built"], "passage": "<strong>Read the passage (D — “Recess Should Be Longer” (persuasive gument))</strong><br><br>Our school should make recess longer. Right now, students get only fifteen minutes to play outside. That is not enough time. When children run and play, their bodies grow stronger and their minds feel fresh. Studies show that students who move around can pay attention better in class. A longer recess would also give friends more time to talk and solve problems together. Some people say a longer recess wastes learning time. But a tired brain cannot learn well. Give us thirty minutes, and watch us learn more."}, {"n": 13, "type": "text", "section": "Reading", "stem": "In the passage, which word is an antonym (opposite) of “free” as the writer uses it?", "options": ["glad", "high", "alone", "trapped"], "passage": "<strong>Read the passage (E — “My First Bicycle” (memoir / personal narrative))</strong><br><br>I will never forget the morning my father taught me to ride a bicycle. The seat felt too high, and the handlebars wobbled in my grip. “I'll hold on,” my father promised, jogging beside me. Round and round the park we went. Suddenly, I heard him call from far behind, “You're doing it yourself!” My heart leapt. I was riding alone! For one shining moment I felt as free as a bird. Then I forgot to steer and tumbled gently onto the grass, laughing the whole way down."}, {"n": 14, "type": "text", "section": "Reading", "stem": "Which word best describes how the writer feels at the end of the passage?", "options": ["Frightened", "Bored", "Joyful", "Disappointed"], "passage": "<strong>Read the passage (E — “My First Bicycle” (memoir / personal narrative))</strong><br><br>I will never forget the morning my father taught me to ride a bicycle. The seat felt too high, and the handlebars wobbled in my grip. “I'll hold on,” my father promised, jogging beside me. Round and round the park we went. Suddenly, I heard him call from far behind, “You're doing it yourself!” My heart leapt. I was riding alone! For one shining moment I felt as free as a bird. Then I forgot to steer and tumbled gently onto the grass, laughing the whole way down."}, {"n": 15, "type": "text", "section": "Reading", "stem": "Read the sentence. The word “scrumptious” is a stronger way of saying", "options": ["pretty", "delicious", "healthy", "enormous"], "passage": "<strong>Read the passage (E — “My First Bicycle” (memoir / personal narrative))</strong><br><br>I will never forget the morning my father taught me to ride a bicycle. The seat felt too high, and the handlebars wobbled in my grip. “I'll hold on,” my father promised, jogging beside me. Round and round the park we went. Suddenly, I heard him call from far behind, “You're doing it yourself!” My heart leapt. I was riding alone! For one shining moment I felt as free as a bird. Then I forgot to steer and tumbled gently onto the grass, laughing the whole way down."}, {"n": 16, "type": "text", "section": "Reading", "stem": "What is the central idea of the whole passage?", "options": ["The octopus has many surprising tricks that help it survive.", "The octopus is the only animal that lives in the deep ocean.", "Octopuses are kept in aquariums all around the world.", "Sharks are the greatest danger to life in the ocean."], "passage": "<strong>Read the passage (F — “The Amazing Octopus” (informational (science) - longer multi-section))</strong><br><br>The octopus is one of the most surprising animals in the ocean. It has eight long arms, three hearts, and blue blood. Scientists believe the octopus is very intelligent, perhaps the cleverest of all animals without a backbone.<br><br>A Master of Disguise<br>The octopus can change the colour and texture of its skin in less than a second. It can look like a smooth grey rock or a bumpy patch of coral. This helps it hide from hungry sharks and sneak up on its own food.<br><br>Clever Escape Artists<br>Because an octopus has no bones, it can squeeze its soft body through a gap no wider than a coin. In aquariums, octopuses have been known to open jars, solve puzzles, and even climb out of their tanks at night to find a snack.<br><br>A Cloud of Ink<br>When an octopus is in danger, it can shoot out a cloud of dark ink. The ink hides the octopus and confuses the attacker. While the enemy is puzzled, the octopus jets away to safety. With all these tricks, it is no wonder the octopus has survived in the ocean for millions of years."}, {"n": 17, "type": "text", "section": "Reading", "stem": "The subheading “A Master of Disguise” tells the reader that the section will mostly be about how the octopus", "options": ["uses its three hearts to pump blue blood.", "changes its colour and texture to hide.", "shoots a cloud of dark ink at enemies.", "squeezes through a gap as small as a coin."], "passage": "<strong>Read the passage (F — “The Amazing Octopus” (informational (science) - longer multi-section))</strong><br><br>The octopus is one of the most surprising animals in the ocean. It has eight long arms, three hearts, and blue blood. Scientists believe the octopus is very intelligent, perhaps the cleverest of all animals without a backbone.<br><br>A Master of Disguise<br>The octopus can change the colour and texture of its skin in less than a second. It can look like a smooth grey rock or a bumpy patch of coral. This helps it hide from hungry sharks and sneak up on its own food.<br><br>Clever Escape Artists<br>Because an octopus has no bones, it can squeeze its soft body through a gap no wider than a coin. In aquariums, octopuses have been known to open jars, solve puzzles, and even climb out of their tanks at night to find a snack.<br><br>A Cloud of Ink<br>When an octopus is in danger, it can shoot out a cloud of dark ink. The ink hides the octopus and confuses the attacker. While the enemy is puzzled, the octopus jets away to safety. With all these tricks, it is no wonder the octopus has survived in the ocean for millions of years."}, {"n": 18, "type": "text", "section": "Reading", "stem": "Which detail is NOT stated anywhere in the passage?", "options": ["An octopus can shoot out a cloud of dark ink.", "An octopus can squeeze through a very small gap.", "An octopus can live for hundreds of years.", "An octopus can change the colour of its skin."], "passage": "<strong>Read the passage (F — “The Amazing Octopus” (informational (science) - longer multi-section))</strong><br><br>The octopus is one of the most surprising animals in the ocean. It has eight long arms, three hearts, and blue blood. Scientists believe the octopus is very intelligent, perhaps the cleverest of all animals without a backbone.<br><br>A Master of Disguise<br>The octopus can change the colour and texture of its skin in less than a second. It can look like a smooth grey rock or a bumpy patch of coral. This helps it hide from hungry sharks and sneak up on its own food.<br><br>Clever Escape Artists<br>Because an octopus has no bones, it can squeeze its soft body through a gap no wider than a coin. In aquariums, octopuses have been known to open jars, solve puzzles, and even climb out of their tanks at night to find a snack.<br><br>A Cloud of Ink<br>When an octopus is in danger, it can shoot out a cloud of dark ink. The ink hides the octopus and confuses the attacker. While the enemy is puzzled, the octopus jets away to safety. With all these tricks, it is no wonder the octopus has survived in the ocean for millions of years."}, {"n": 19, "type": "text", "section": "Reading", "stem": "What mood does the poem create?", "options": ["Gloomy and sad", "Lively and cheerful", "Tense and fearful", "Sleepy and still"], "passage": "<strong>Read the passage (G — “The Brook” (poem (classic-style)))</strong><br><br>I slip and slide past mossy stones,<br>I sing a silver, splashing song.<br>I hurry, hurry, never slow,<br>And murmur as I move along.<br>The meadow mice come down to drink,<br>The willows lean to hear me play.<br>I cannot stop, I cannot rest,<br>I laugh and leap and run away."}, {"n": 20, "type": "text", "section": "Reading", "stem": "The poet repeats the “s” sound in “slip and slide past mossy stones” and “silver, splashing song.” This use of repeated beginning sounds is called", "options": ["alliteration.", "a rhyme.", "a stage direction.", "a glossary."], "passage": "<strong>Read the passage (G — “The Brook” (poem (classic-style)))</strong><br><br>I slip and slide past mossy stones,<br>I sing a silver, splashing song.<br>I hurry, hurry, never slow,<br>And murmur as I move along.<br>The meadow mice come down to drink,<br>The willows lean to hear me play.<br>I cannot stop, I cannot rest,<br>I laugh and leap and run away."}, {"n": 21, "type": "text", "section": "Reading", "stem": "Read the sentence. The word “gratitude” comes from a root meaning “thankful.” Based on the root and the sentence, “gratitude” means", "options": ["a feeling of being afraid", "a feeling of being tired", "a feeling of being thankful", "a feeling of being curious"], "passage": "<strong>Read the passage (G — “The Brook” (poem (classic-style)))</strong><br><br>I slip and slide past mossy stones,<br>I sing a silver, splashing song.<br>I hurry, hurry, never slow,<br>And murmur as I move along.<br>The meadow mice come down to drink,<br>The willows lean to hear me play.<br>I cannot stop, I cannot rest,<br>I laugh and leap and run away."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  if(q.fig) h += q.fig;
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("thanks").textContent = "Thank you, " + (window.studentName || "") + ".";
  document.getElementById("thanksmsg").textContent = "Your responses have been sent to HK-Schools.com for review. We will contact you shortly.";
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
