<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP HKIS Entry Grade 3 Mathematics (V1)</title>
<style>
#qcard svg{width:100%;max-width:360px;height:auto;display:block}  /* figures ship without width attrs; without this they stretch to the full card */
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP HKIS Entry Grade 3 Mathematics (V1)</div>
  <h2>MAP HKIS Entry · Grade 3 Mathematics</h2>
  <p class="muted">23 questions. Calculators are NOT permitted. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 3 Mathematics (V1)</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP HKIS Entry Grade 3 Mathematics (V1)</div>
  <div class="card"><h2 id="thanks" style="color:var(--navy);margin:0 0 6px"></h2><p class="muted" id="thanksmsg" style="margin:0"></p></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-HKIS-G3-MATH-V1";
const BANK_PATH = "map-tests/HKIS/Grade-3/maths/v1/bank.csv";
const TITLE = "MAP HKIS Entry Grade 3 Mathematics (V1)";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Mathematics", "stem": "A baker made 6 trays of muffins. Each tray held 8 muffins. How many muffins did the baker make in total?", "options": ["14", "42", "54", "48"]}, {"n": 2, "type": "text", "section": "Mathematics", "stem": "In the number 3,752, which digit is in the hundreds place?", "options": ["3", "5", "7", "2"]}, {"n": 3, "type": "text", "section": "Mathematics", "stem": "About how long is a new pencil?", "options": ["18 cm", "18 m", "18 mm", "18 km"]}, {"n": 4, "type": "text", "section": "Mathematics", "stem": "How many sides does this shape have?", "options": ["6", "5", "8", "4"], "fig": "<div style=\"margin:10px 0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 180 180\"><polygon points=\"90.0,20.0 150.6,55.0 150.6,125.0 90.0,160.0 29.4,125.0 29.4,55.0\" fill=\"#dce6f2\" stroke=\"#1f3355\" stroke-width=\"2.5\"/></svg></div>"}, {"n": 5, "type": "text", "section": "Mathematics", "stem": "What number comes next in the pattern?  5, 10, 15, 20, ___", "options": ["21", "30", "25", "24"]}, {"n": 6, "type": "text", "section": "Mathematics", "stem": "What is 426 + 358?", "options": ["784", "674", "774", "884"]}, {"n": 7, "type": "text", "section": "Mathematics", "stem": "The bar graph shows the fruit students chose. How many more students chose apples than bananas?", "options": ["19", "7", "12", "5"], "fig": "<div style=\"margin:10px 0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 230\"><line x1=\"55\" y1=\"200\" x2=\"350\" y2=\"200\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"205\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"end\">0</text><line x1=\"55\" y1=\"173\" x2=\"350\" y2=\"173\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"178\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"end\">2</text><line x1=\"55\" y1=\"147\" x2=\"350\" y2=\"147\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"152\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"end\">4</text><line x1=\"55\" y1=\"120\" x2=\"350\" y2=\"120\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"125\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"end\">6</text><line x1=\"55\" y1=\"93\" x2=\"350\" y2=\"93\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"98\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"end\">8</text><line x1=\"55\" y1=\"67\" x2=\"350\" y2=\"67\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"72\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"end\">10</text><line x1=\"55\" y1=\"40\" x2=\"350\" y2=\"40\" stroke=\"#c7d2e0\"/><text x=\"48\" y=\"45\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"end\">12</text><line x1=\"55\" y1=\"20\" x2=\"55\" y2=\"200\" stroke=\"#1f3355\" stroke-width=\"2\"/><line x1=\"55\" y1=\"200\" x2=\"350\" y2=\"200\" stroke=\"#1f3355\" stroke-width=\"2\"/><text x=\"22\" y=\"110\" font-family=\"Arial, sans-serif\" font-size=\"13\" text-anchor=\"middle\" transform=\"rotate(-90 22 110)\">Students</text><rect x=\"70\" y=\"40.0\" width=\"46\" height=\"160.0\" fill=\"#2f5597\" stroke=\"#1f3355\"/><text x=\"93.0\" y=\"218\" font-family=\"Arial, sans-serif\" font-size=\"15\" text-anchor=\"middle\">Apples</text><text x=\"93.0\" y=\"34.0\" font-family=\"Arial, sans-serif\" font-size=\"14\" text-anchor=\"middle\">12</text><rect x=\"140\" y=\"106.66666666666666\" width=\"46\" height=\"93.33333333333334\" fill=\"#2f5597\" stroke=\"#1f3355\"/><text x=\"163.0\" y=\"218\" font-family=\"Arial, sans-serif\" font-size=\"15\" text-anchor=\"middle\">Bananas</text><text x=\"163.0\" y=\"100.66666666666666\" font-family=\"Arial, sans-serif\" font-size=\"14\" text-anchor=\"middle\">7</text><rect x=\"210\" y=\"80.0\" width=\"46\" height=\"120.0\" fill=\"#2f5597\" stroke=\"#1f3355\"/><text x=\"233.0\" y=\"218\" font-family=\"Arial, sans-serif\" font-size=\"15\" text-anchor=\"middle\">Grapes</text><text x=\"233.0\" y=\"74.0\" font-family=\"Arial, sans-serif\" font-size=\"14\" text-anchor=\"middle\">9</text><rect x=\"280\" y=\"133.33333333333331\" width=\"46\" height=\"66.66666666666667\" fill=\"#2f5597\" stroke=\"#1f3355\"/><text x=\"303.0\" y=\"218\" font-family=\"Arial, sans-serif\" font-size=\"15\" text-anchor=\"middle\">Pears</text><text x=\"303.0\" y=\"127.33333333333331\" font-family=\"Arial, sans-serif\" font-size=\"14\" text-anchor=\"middle\">5</text></svg></div>"}, {"n": 8, "type": "text", "section": "Mathematics", "stem": "Which shape has 4 equal sides and 4 right angles?", "options": ["rectangle", "triangle", "square", "pentagon"]}, {"n": 9, "type": "text", "section": "Mathematics", "stem": "There are 45 apples shared equally among 9 baskets. How many apples are in each basket?", "options": ["5", "6", "4", "9"]}, {"n": 10, "type": "text", "section": "Mathematics", "stem": "Which fraction is equal to one half?", "options": ["1/3", "2/3", "2/4", "1/4"]}, {"n": 11, "type": "text", "section": "Mathematics", "stem": "What is the perimeter of this rectangle?", "options": ["24 cm", "11 cm", "16 cm", "22 cm"], "fig": "<div style=\"margin:10px 0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 296 116\">\n<rect x=\"20\" y=\"20\" width=\"176\" height=\"66\" fill=\"#dce6f2\" stroke=\"#1f3355\" stroke-width=\"2\"/>\n<text x=\"108.0\" y=\"108\" font-family=\"Arial, sans-serif\" font-size=\"17\" text-anchor=\"middle\">8 cm</text>\n<text x=\"206\" y=\"53.0\" font-family=\"Arial, sans-serif\" font-size=\"17\" dominant-baseline=\"middle\">3 cm</text></svg></div>"}, {"n": 12, "type": "text", "section": "Mathematics", "stem": "How many angles does this shape have?", "options": ["4", "5", "6", "3"], "fig": "<div style=\"margin:10px 0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 180 180\"><polygon points=\"90.0,20.0 156.6,68.4 131.1,146.6 48.9,146.6 23.4,68.4\" fill=\"#dce6f2\" stroke=\"#1f3355\" stroke-width=\"2.5\"/></svg></div>"}, {"n": 13, "type": "text", "section": "Mathematics", "stem": "A pattern follows the rule “add 4.”  3, 7, 11, ___, 19. What is the missing number?", "options": ["14", "15", "16", "13"]}, {"n": 14, "type": "text", "section": "Mathematics", "stem": "What is 600 + 70 + 4 written as one number?", "options": ["6,704", "6,074", "60,704", "674"]}, {"n": 15, "type": "text", "section": "Mathematics", "stem": "The table shows how many books a class read each week. How many books did they read in the four weeks altogether?", "options": ["24", "26", "21", "28"], "fig": "<table style=\"border-collapse:collapse;margin:10px 0\"><tr><th style=\"border:1px solid #1f3355;padding:5px 14px\">Week</th><th style=\"border:1px solid #1f3355;padding:5px 14px\">1</th><th style=\"border:1px solid #1f3355;padding:5px 14px\">2</th><th style=\"border:1px solid #1f3355;padding:5px 14px\">3</th><th style=\"border:1px solid #1f3355;padding:5px 14px\">4</th></tr><tr><td style=\"border:1px solid #1f3355;padding:5px 14px\">Books</td><td style=\"border:1px solid #1f3355;padding:5px 14px\">5</td><td style=\"border:1px solid #1f3355;padding:5px 14px\">8</td><td style=\"border:1px solid #1f3355;padding:5px 14px\">6</td><td style=\"border:1px solid #1f3355;padding:5px 14px\">7</td></tr></table>"}, {"n": 16, "type": "text", "section": "Mathematics", "stem": "Sam had $20. He bought a book for $8 and a pen for $3. How much money does he have left?", "options": ["$11", "$9", "$12", "$5"]}, {"n": 17, "type": "text", "section": "Mathematics", "stem": "What is 803 − 567?", "options": ["236", "346", "244", "264"]}, {"n": 18, "type": "text", "section": "Mathematics", "stem": "A rectangular garden is 6 m long and 4 m wide. What is its area?", "options": ["10 sq m", "20 sq m", "24 sq m", "48 sq m"]}, {"n": 19, "type": "text", "section": "Mathematics", "stem": "Look at the pattern:  2, 4, 8, 16, ___. What is the next number?", "options": ["24", "20", "32", "18"]}, {"n": 20, "type": "text", "section": "Mathematics", "stem": "Maria ate 3/8 of a pizza. What fraction of the pizza is left?", "options": ["3/8", "8/8", "1/8", "5/8"]}, {"n": 21, "type": "text", "section": "Mathematics", "stem": "A class has 4 tables. Each table seats 6 students. If 21 students are present, how many seats are empty?", "options": ["5", "3", "4", "6"]}, {"n": 22, "type": "text", "section": "Mathematics", "stem": "Which number is two hundred more than 1,463?", "options": ["1,663", "1,465", "3,463", "1,683"]}, {"n": 23, "type": "text", "section": "Mathematics", "stem": "Round 568 to the nearest hundred.", "options": ["500", "600", "570", "560"]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  if(q.fig) h += q.fig;
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("thanks").textContent = "Thank you, " + (window.studentName || "") + ".";
  document.getElementById("thanksmsg").textContent = "Your responses have been sent to HK-Schools.com for review. We will contact you shortly.";
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
