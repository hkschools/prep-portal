 slipping in through the side door, breathless and smiling. “Traffic,” Grandma whispered, squeezing her hand. “But I heard the part that mattered.” Mara realized then that the speech had never really been for the chair at all."}, {"n": 4, "type": "text", "section": "Reading", "stem": "Which detail from the passage best supports the idea that the Fresnel lens is essential to a lighthouse?", "options": ["Keepers once lived inside to wind the clockwork and trim the wick.", "Each lighthouse blinks in its own pattern so sailors can tell them apart.", "Nearly all lighthouses today run on electricity.", "Without the lens, the lamp would glow softly in every direction and be useless to a distant ship."], "passage": "<strong>Read the passage (B — “How a Lighthouse Works” (informational text))</strong><br><br>A lighthouse may look like a simple tower, but it is a carefully designed machine for sending light across the sea. At the very top sits the lamp, surrounded by a special lens called a Fresnel lens. This lens is made of rings of glass that bend scattered light into a single powerful beam. Without it, the lamp would glow softly in every direction and be useless to a ship miles away. The lens often turns slowly on a track, which is why a distant lighthouse seems to blink. Each lighthouse blinks in its own pattern, so sailors can tell one from another in the dark. Some flash every ten seconds; others stay dark for longer stretches. Keepers once lived inside to wind the clockwork and trim the wick, but nearly all lighthouses today run on electricity and are controlled from far away. The purpose, however, has never changed: to warn ships away from rocks and guide them safely toward harbor."}, {"n": 5, "type": "text", "section": "Reading", "stem": "What is the author's main purpose in writing this passage?", "options": ["To persuade readers to visit a lighthouse", "To explain how a lighthouse works and why", "To tell an exciting story about a lighthouse keeper", "To compare lighthouses with other kinds of towers"], "passage": "<strong>Read the passage (B — “How a Lighthouse Works” (informational text))</strong><br><br>A lighthouse may look like a simple tower, but it is a carefully designed machine for sending light across the sea. At the very top sits the lamp, surrounded by a special lens called a Fresnel lens. This lens is made of rings of glass that bend scattered light into a single powerful beam. Without it, the lamp would glow softly in every direction and be useless to a ship miles away. The lens often turns slowly on a track, which is why a distant lighthouse seems to blink. Each lighthouse blinks in its own pattern, so sailors can tell one from another in the dark. Some flash every ten seconds; others stay dark for longer stretches. Keepers once lived inside to wind the clockwork and trim the wick, but nearly all lighthouses today run on electricity and are controlled from far away. The purpose, however, has never changed: to warn ships away from rocks and guide them safely toward harbor."}, {"n": 6, "type": "text", "section": "Reading", "stem": "Which sentence best states what the passage is mainly about?", "options": ["Lighthouse keepers once had to wind clockwork and trim wicks by hand.", "Some lighthouses flash every ten seconds while others stay dark longer.", "A lighthouse is a carefully designed machine that sends a guiding light to ships.", "Modern lighthouses are controlled by electricity from far away."], "passage": "<strong>Read the passage (B — “How a Lighthouse Works” (informational text))</strong><br><br>A lighthouse may look like a simple tower, but it is a carefully designed machine for sending light across the sea. At the very top sits the lamp, surrounded by a special lens called a Fresnel lens. This lens is made of rings of glass that bend scattered light into a single powerful beam. Without it, the lamp would glow softly in every direction and be useless to a ship miles away. The lens often turns slowly on a track, which is why a distant lighthouse seems to blink. Each lighthouse blinks in its own pattern, so sailors can tell one from another in the dark. Some flash every ten seconds; others stay dark for longer stretches. Keepers once lived inside to wind the clockwork and trim the wick, but nearly all lighthouses today run on electricity and are controlled from far away. The purpose, however, has never changed: to warn ships away from rocks and guide them safely toward harbor."}, {"n": 7, "type": "text", "section": "Reading", "stem": "Why does Theo decide he “did have to come” on the canoe trip?", "options": ["Because Sam ordered him to help load the canoe", "Because he wanted to prove he was a stronger paddler than Sam", "Because he was afraid of being alone on the lake", "Because Sam was leaving the next day and he wanted this last time together"], "passage": "<strong>Read the passage (C — “The Last Day of Summer” (literary fiction))</strong><br><br>On the last morning of summer, Theo dragged his feet down to the lake where his older brother Sam was loading the canoe. “You don't have to come,” Sam said, not looking up. But Theo did have to come, because tomorrow Sam left for boarding school, and a whole year suddenly felt as wide as the gray water in front of them. They paddled out past the reeds in silence. The morning was as still as held breath. Halfway across, Sam rested his paddle and said, “You know you can write to me, right? Real letters.” Theo, who had been bracing for a year of empty rooms, felt something loosen in his chest. He had spent all week being angry so he wouldn't have to be sad. “I'll write you a hundred,” he said, and meant it. They turned the canoe toward the far shore, where the trees were already tipped with the first rust of autumn, and paddled together, matching strokes the way Sam had taught him years ago."}, {"n": 8, "type": "text", "section": "Reading", "stem": "Which event marks the turning point where Theo's feelings begin to change?", "options": ["Theo drags his feet down to the lake at the start.", "Sam silently loads the canoe without looking up.", "Sam says Theo can write him real letters, and Theo feels something loosen.", "The brothers paddle past the reeds in complete silence."], "passage": "<strong>Read the passage (C — “The Last Day of Summer” (literary fiction))</strong><br><br>On the last morning of summer, Theo dragged his feet down to the lake where his older brother Sam was loading the canoe. “You don't have to come,” Sam said, not looking up. But Theo did have to come, because tomorrow Sam left for boarding school, and a whole year suddenly felt as wide as the gray water in front of them. They paddled out past the reeds in silence. The morning was as still as held breath. Halfway across, Sam rested his paddle and said, “You know you can write to me, right? Real letters.” Theo, who had been bracing for a year of empty rooms, felt something loosen in his chest. He had spent all week being angry so he wouldn't have to be sad. “I'll write you a hundred,” he said, and meant it. They turned the canoe toward the far shore, where the trees were already tipped with the first rust of autumn, and paddled together, matching strokes the way Sam had taught him years ago."}, {"n": 9, "type": "text", "section": "Reading", "stem": "Read this sentence from the passage: “The morning was as still as held breath.” Which word is closest in meaning to “still” as it is used here?", "options": ["Cold", "Motionless", "Continuing", "Silent"], "passage": "<strong>Read the passage (C — “The Last Day of Summer” (literary fiction))</strong><br><br>On the last morning of summer, Theo dragged his feet down to the lake where his older brother Sam was loading the canoe. “You don't have to come,” Sam said, not looking up. But Theo did have to come, because tomorrow Sam left for boarding school, and a whole year suddenly felt as wide as the gray water in front of them. They paddled out past the reeds in silence. The morning was as still as held breath. Halfway across, Sam rested his paddle and said, “You know you can write to me, right? Real letters.” Theo, who had been bracing for a year of empty rooms, felt something loosen in his chest. He had spent all week being angry so he wouldn't have to be sad. “I'll write you a hundred,” he said, and meant it. They turned the canoe toward the far shore, where the trees were already tipped with the first rust of autumn, and paddled together, matching strokes the way Sam had taught him years ago."}, {"n": 10, "type": "text", "section": "Reading", "stem": "What is the author's main purpose in this passage?", "options": ["To explain, step by step, how to plant a vegetable garden", "To entertain readers with a funny story about weeds", "To persuade the school to reopen the garden this spring", "To describe what the empty plot behind the gymnasium looks like"], "passage": "<strong>Read the passage (D — “Bring Back the School Garden” (persuasive / argument))</strong><br><br>Our school should reopen the garden behind the gymnasium, and we should do it this spring. For three years the plot has sat empty, growing nothing but weeds, when it could be growing food, knowledge, and pride. A school garden is one of the best classrooms we have. Studies suggest that students who grow vegetables are far more willing to eat them, which matters when so many of us reach only for chips at lunch. The garden would also give science lessons real roots, letting us measure plant growth instead of just reading about it. Some say a garden is too much work, but the truth is that caring for living things teaches responsibility better than any worksheet ever could. Last year's empty flowerbeds were a waste; this year's harvest could feed the whole cafeteria. A garden is not a frill. It is the most useful patch of ground on our entire campus, and leaving it bare any longer would be a mistake we can easily fix."}, {"n": 11, "type": "text", "section": "Reading", "stem": "Which sentence from the passage expresses an opinion rather than a fact?", "options": ["A garden is the most useful patch of ground on our entire campus.", "For three years the plot has sat empty.", "The garden is located behind the gymnasium.", "Students could measure plant growth in the garden."], "passage": "<strong>Read the passage (D — “Bring Back the School Garden” (persuasive / argument))</strong><br><br>Our school should reopen the garden behind the gymnasium, and we should do it this spring. For three years the plot has sat empty, growing nothing but weeds, when it could be growing food, knowledge, and pride. A school garden is one of the best classrooms we have. Studies suggest that students who grow vegetables are far more willing to eat them, which matters when so many of us reach only for chips at lunch. The garden would also give science lessons real roots, letting us measure plant growth instead of just reading about it. Some say a garden is too much work, but the truth is that caring for living things teaches responsibility better than any worksheet ever could. Last year's empty flowerbeds were a waste; this year's harvest could feed the whole cafeteria. A garden is not a frill. It is the most useful patch of ground on our entire campus, and leaving it bare any longer would be a mistake we can easily fix."}, {"n": 12, "type": "text", "section": "Reading", "stem": "Which best describes the author's attitude toward the empty garden plot?", "options": ["Disappointed by the waste and eager to put it to use", "Amused by how funny the weeds look", "Uncertain whether a garden is worth the effort", "Proud that the plot has been left undisturbed"], "passage": "<strong>Read the passage (D — “Bring Back the School Garden” (persuasive / argument))</strong><br><br>Our school should reopen the garden behind the gymnasium, and we should do it this spring. For three years the plot has sat empty, growing nothing but weeds, when it could be growing food, knowledge, and pride. A school garden is one of the best classrooms we have. Studies suggest that students who grow vegetables are far more willing to eat them, which matters when so many of us reach only for chips at lunch. The garden would also give science lessons real roots, letting us measure plant growth instead of just reading about it. Some say a garden is too much work, but the truth is that caring for living things teaches responsibility better than any worksheet ever could. Last year's empty flowerbeds were a waste; this year's harvest could feed the whole cafeteria. A garden is not a frill. It is the most useful patch of ground on our entire campus, and leaving it bare any longer would be a mistake we can easily fix."}, {"n": 13, "type": "text", "section": "Reading", "stem": "What does the phrase “his hand hovered at the small of my back, there and then suddenly not there” suggest about the father?", "options": ["He was too tired to keep holding the bicycle.", "He was quietly letting his child learn to balance alone.", "He was angry that his child kept falling.", "He was afraid the bicycle would break."], "passage": "<strong>Read the passage (E — “The Bicycle” (memoir / personal narrative))</strong><br><br>The summer I turned nine, my father taught me to ride a bicycle in the gravel lot behind our apartment. I remember the loose stones rattling under the tires and the way his hand hovered at the small of my back, there and then suddenly not there. “I've got you,” he kept saying, even after he had already let go. I pedaled, wobbled, and crashed into the same patch of weeds at least a dozen times. My knees still carry two pale scars from that lot. But what I remember most is not the falling. It is the moment I looked back, expecting to see him holding the seat, and saw instead my father standing far behind me, arms crossed, grinning like he had just won something. I had been riding alone for half the length of the lot and had not even known it. Some lessons, I learned that day, are only finished the instant you realize no one is holding you up anymore."}, {"n": 14, "type": "text", "section": "Reading", "stem": "Which detail from the passage best shows that the narrator was riding successfully without realizing it?", "options": ["“The loose stones rattled under the tires.”", "“My knees still carry two pale scars from that lot.”", "“I looked back... and saw my father standing far behind me, arms crossed, grinning.”", "“My father taught me to ride a bicycle in the gravel lot.”"], "passage": "<strong>Read the passage (E — “The Bicycle” (memoir / personal narrative))</strong><br><br>The summer I turned nine, my father taught me to ride a bicycle in the gravel lot behind our apartment. I remember the loose stones rattling under the tires and the way his hand hovered at the small of my back, there and then suddenly not there. “I've got you,” he kept saying, even after he had already let go. I pedaled, wobbled, and crashed into the same patch of weeds at least a dozen times. My knees still carry two pale scars from that lot. But what I remember most is not the falling. It is the moment I looked back, expecting to see him holding the seat, and saw instead my father standing far behind me, arms crossed, grinning like he had just won something. I had been riding alone for half the length of the lot and had not even known it. Some lessons, I learned that day, are only finished the instant you realize no one is holding you up anymore."}, {"n": 15, "type": "text", "section": "Reading", "stem": "Read this sentence: “Some lessons are only finished the instant you realize no one is holding you up anymore.” What is the meaning of the word “instant” here?", "options": ["A bright flash of light", "A repeated habit", "A type of food made quickly", "A precise moment in time"], "passage": "<strong>Read the passage (E — “The Bicycle” (memoir / personal narrative))</strong><br><br>The summer I turned nine, my father taught me to ride a bicycle in the gravel lot behind our apartment. I remember the loose stones rattling under the tires and the way his hand hovered at the small of my back, there and then suddenly not there. “I've got you,” he kept saying, even after he had already let go. I pedaled, wobbled, and crashed into the same patch of weeds at least a dozen times. My knees still carry two pale scars from that lot. But what I remember most is not the falling. It is the moment I looked back, expecting to see him holding the seat, and saw instead my father standing far behind me, arms crossed, grinning like he had just won something. I had been riding alone for half the length of the lot and had not even known it. Some lessons, I learned that day, are only finished the instant you realize no one is holding you up anymore."}, {"n": 16, "type": "text", "section": "Reading", "stem": "Which statement best expresses the central idea of the passage?", "options": ["Healthy soil is a living, busy resource that supports most of the food we eat.", "Earthworms tunnel through fields and let in air and water.", "A handful of soil holds more living things than the number of people on Earth.", "Bacteria and fungi are too small for people to see."], "passage": "<strong>Read the passage (F — “The Hidden Life of Soil” (informational (science)))</strong><br><br>When you walk across a field, you are stepping on one of the busiest places on Earth. A single handful of healthy soil can contain more living things than there are people on the planet. Most of these are bacteria and fungi far too small to see. They work without rest, breaking down dead leaves and roots into nutrients that living plants can drink up through their own roots. About 95 percent of the food we eat depends, in one way or another, on this hidden activity in the soil. Earthworms help, too. As they tunnel, they mix the soil and let in air and water, which plant roots need. Scientists estimate that worms in a single field can move tons of soil each year. Yet healthy soil takes a long time to form. Nature may need hundreds of years to build a layer just a few centimeters thick. That is why farmers and scientists now work hard to protect soil, treating it not as plain dirt but as a living resource."}, {"n": 17, "type": "text", "section": "Reading", "stem": "According to the passage, earthworms are helpful to plants because they", "options": ["eat the bacteria and fungi that harm roots.", "form new layers of soil within a few days.", "mix the soil and let in air and water that roots need.", "produce most of the food that people eat."], "passage": "<strong>Read the passage (F — “The Hidden Life of Soil” (informational (science)))</strong><br><br>When you walk across a field, you are stepping on one of the busiest places on Earth. A single handful of healthy soil can contain more living things than there are people on the planet. Most of these are bacteria and fungi far too small to see. They work without rest, breaking down dead leaves and roots into nutrients that living plants can drink up through their own roots. About 95 percent of the food we eat depends, in one way or another, on this hidden activity in the soil. Earthworms help, too. As they tunnel, they mix the soil and let in air and water, which plant roots need. Scientists estimate that worms in a single field can move tons of soil each year. Yet healthy soil takes a long time to form. Nature may need hundreds of years to build a layer just a few centimeters thick. That is why farmers and scientists now work hard to protect soil, treating it not as plain dirt but as a living resource."}, {"n": 18, "type": "text", "section": "Reading", "stem": "Which can be concluded from the passage?", "options": ["Because soil forms so slowly, losing it is a serious problem worth preventing.", "Soil can be fully replaced within a single growing season.", "Plants would grow just as well in lifeless dirt as in living soil.", "Most living things in soil are large enough to see with the const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  if(q.fig) h += q.fig;
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("thanks").textContent = "Thank you, " + (window.studentName || "") + ".";
  document.getElementById("thanksmsg").textContent = "Your responses have been sent to HK-Schools.com for review. We will contact you shortly.";
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
