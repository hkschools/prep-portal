<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Reading (Level 2): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Reading (Level 2): Drill 1</div>
  <h2>MAP Grade 4 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 2): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 2): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-READ-L2-D1";
const BANK_PATH = "map-tests/grade-4/reading/level-2/drill-1/bank.csv";
const TITLE = "MAP Grade 4 Reading (Level 2): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Vocabulary in context", "stem": "In the passage, the phrase \"low-maintenance\" means", "options": ["can survive cold climates.", "can survive without sunlight.", "requires a lot of attention.", "requires little attention."], "passage": "<strong>Read the passage</strong><br><br>The desert rose can survive in drier climates, and it can go long periods of time without water. In terms of upkeep, this popular houseplant needs plenty of sunlight and cannot survive cold climates, but otherwise it is very low-maintenance. The most important thing about the desert rose, though, is that its sap is poisonous. Make sure to keep it out of reach of pets and children, as well as to wash your hands if you get sap on them."}, {"n": 2, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following characteristics belongs to a myth?", "options": ["uses rhythmic qualities of language", "tells important events from the author's life", "ends with a clearly laid out moral", "consists of events that are seemingly historical"]}, {"n": 3, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is a synonym (a word having the same meaning) of \"pride\"?", "options": ["leader", "pack", "ranking", "wild"], "passage": "<strong>Read the passage</strong><br><br>In the wild, packs of animals are usually arranged in a strict order. In most animal species, the young are usually found to be at the lower levels. They are followed by the females, while the males are highest up. Yet, within the males, there are also clear ranks. For instance, when observing a pride of lions, it becomes clear that one male is feared by all the others. Furthermore, among the other males in the group, there are ones considered \"higher up\" and ones that are lower in rank."}, {"n": 4, "type": "text", "section": "Text structure", "stem": "How does the formation of the passage help the reader?", "options": ["The numbering of the passages organizes the information in order of importance.", "The numbering of the passages organizes the information in a time order.", "The subheadings direct to specific information.", "The subheadings arrange the information in alphabetical order."], "passage": "<strong>Read the passage</strong><br><br>The Galápagos penguin<br><br>The Galápagos penguin is a penguin that lives in the Galápagos Islands. It can survive due to the cool temperatures in the area. The Galápagos penguin is one of the banded penguins. The other species live mostly on the coasts of Africa and mainland South America.<br><br>What They Look Like<br><br>The average Galápagos penguin is 19 inches long and 5.5 lb in weight. Galápagos penguins have black heads with a white border running from behind the eye to join on the throat. They have black-grey upperparts and whitish underparts. The female penguins are smaller than the males.<br><br>Where They Live<br><br>The Galápagos penguin is found primarily on Fernandina Island and the west coast of Isabela Island. Small groups can be found on other islands in the Galápagos area.<br><br>What They Eat<br><br>Galápagos penguins eat small fish, mainly mullet and sardines. They search for food only during the day and normally within a few miles of their breeding site. They depend on the cold currents to bring them food.<br><br>Breeding and Predators<br><br>The Galápagos penguin lays one or two eggs in places such as caves, so that the eggs will not overheat from direct sunlight. One parent will always stay with the eggs or chicks, while the other is absent for several days to feed. The parents usually raise only one child. During colder seasons, the penguins put off breeding because their food becomes less abundant. This makes the chances of raising offspring successfully unlikely.<br><br>Because of the Galápagos penguin's smaller size, it has many predators. On land, the penguins are preyed upon by crabs, snakes, rice rats, cats, Galápagos hawks, and short-eared owls. Yet, in the water, they are preyed upon by sharks, fur seals, and sea lions. They face many dangers due to humans. Fishermen may interrupt the penguins' nesting, and they are often caught in fishing nets by mistake.<br><br>When travelling to the Galápagos Islands, it is recommended to try and spot these penguins while sailing around the islands. If you enjoy snorkelling, make sure to snorkel in areas where they are likely to be. Snorkelling with penguins is an incredible experience. The Galápagos penguin is an endangered species, so consider"}, {"n": 5, "type": "text", "section": "Detail & inference", "stem": "According to this passage, one may infer that", "options": ["Pierre Curie was the lead scientist in the laboratory.", "Marie Curie won her first Nobel Prize before Gerty Theresa Cory, another famous female scientist who won the Nobel Prize.", "Marie Curie invented radium.", "It was common for women in the 20th century to be scientists."], "passage": "<strong>Read the passage</strong><br><br>Marie Curie was a Polish and French scientist who conducted groundbreaking research on radioactivity. She was the first woman to win a Nobel Prize and was the first person and only woman to win twice. She shared the 1903 Nobel Prize in Physics with her husband Pierre Curie and with physicist Henri Becquerel, and then she won the 1911 Nobel Prize in Chemistry. Her achievements included the discovery of two elements: polonium and radium."}, {"n": 6, "type": "text", "section": "Vocabulary in context", "stem": "Which word from the passage best fits this definition: an organ for obtaining oxygen from water?", "options": ["skeleton", "beak", "gills", "heart"], "passage": "<strong>Read the passage</strong><br><br>Octopi are fascinating, eight-legged creatures that live in oceans around the world. Their bodies are almost entirely soft, with no internal skeleton or protective outer shell. The only rigid part of their bodies is their beak. This enables them to squeeze through narrow openings to avoid predators. Another interesting piece of trivia is that octopi have three hearts—two to pump blood into their gills and one to pump blood into the rest of their bodies."}, {"n": 7, "type": "text", "section": "Main idea & theme", "stem": "This passage is mainly about", "options": ["itchiness, sneezing, and asthma.", "how the body reacts to severe allergies.", "peanut allergies.", "why peanut allergies are worse than any other food allergies."], "passage": "<strong>Read the passage</strong><br><br>Peanuts may cause allergic reactions such as itchiness, sneezing, and asthma. The allergy to peanuts causes the immune system to overreact, which is the body's method of self-defense against potential harm. It is recognized as one of the most severe food allergies because of how common, persistent, and severe the reaction to it can be."}, {"n": 8, "type": "text", "section": "Detail & inference", "stem": "According to the passage, the Galápagos Islands are not", "options": ["a province of Ecuador.", "a World Heritage Site.", "a national park of Ecuador.", "a popular tourist destination."], "passage": "<strong>Read the passage</strong><br><br>The Galápagos Islands are a group of islands located in the Pacific Ocean near the equator. Made up of 19 major islands and two smaller islets, the group is a province of Ecuador and is classified as both an Ecuadorian national park and a World Heritage Site. The Galápagos Islands' most famous feature is their wildlife, as a large number of these species are unique to the Galápagos."}, {"n": 9, "type": "text", "section": "Text structure", "stem": "How does the writer arrange the ideas in the paragraph?", "options": ["by describing several solutions to a problem", "by telling how things are the same or different", "by putting events in time order", "by showing the difference between facts and opinions"], "passage": "<strong>Read the passage</strong><br><br>Whenever you have some free time, you should play a hilarious game called \"To Be Continued\" with your friends. First, get a piece of paper and a pencil. Then, write any sentence that comes to mind at the top of the page and fold it so the sentence cannot be seen. It is best to write a funny or a silly sentence in order to get the best result. For example, you could write, \"The unicorn spent the day dancing midair.\" Next, pass the folded piece of paper to a friend and ask him or her to write a random sentence and fold the paper too. Keep passing the paper between your friends until the page is full of your words. Enjoy gathering around, unfolding the page, and reading the ridiculous story you all wrote together!"}, {"n": 10, "type": "text", "section": "Text structure", "stem": "Which of the following sentences describes a chronological order of events in the passage?", "options": ["The refrigerator is one of the most important inventions in the last two centuries.", "Refrigerators for domestic use were invented in 1913 and became widespread 14 years later.", "Icehouses were used to provide cool storage for most of the year.", "Modern domestic refrigerators include a freezer as well, which usually maintains temperatures from 9 to 0° F."], "passage": "<strong>Read the passage</strong><br><br>One of the most important inventions of the last two centuries is the refrigerator. Before the invention of the refrigerator, icehouses were used to provide cool storage for most of the year. The refrigerator uses electricity to preserve food at a cold temperature. The lower temperature reduces the reproduction rate of bacteria, so the refrigerator lowers the rate of spoilage. The refrigerator maintains a temperature a few degrees above the freezing point of water. Refrigerators for home and domestic use were invented in 1913, but they only became widespread in 1927. Most of the modern domestic refrigerators include a freezer as well. Most household freezers maintain temperatures from 9 to 0° F. The freezer allows freezing of foods so they can be preserved safely for a long period."}, {"n": 11, "type": "text", "section": "Text structure", "stem": "Which of the following order of directions best fits chocolate's production process?", "options": ["Cocoa pods are split open, harvested from the cocoa trees, and then undergo a fermentation process.", "Cocoa beans are removed from the cocoa pods, undergo a fermentation process, and then dried.", "Cocoa beans are dried and sent to chocolate factories, where they undergo a fermentation process.", "Cocoa pods are broken into cocoa butter and chocolate, and then they are placed in heated trays."], "passage": "<strong>Read the passage</strong><br><br>Chocolate is made from cocoa beans. Cocoa pods are harvested by cutting them from the cocoa trees. The pods are then collected, split open, and all the cocoa beans are removed. The cocoa beans undergo a fermentation process, in which they are placed in heated trays or under the sun if the climate is right. After fermentation, the cocoa beans are dried and sent to chocolate factories. In those factories, machines break down the cocoa beans into cocoa butter and chocolate, which is called chocolate liquor. When this process is finished, the manufacturers blend chocolate liquor with sugar and milk to add flavor, and after they have finished blending, the chocolate liquor is delivered to molding factories, where it is poured into molds for sale. There it gets wrapped, packed, and made ready for transport."}, {"n": 12, "type": "text", "section": "Detail & inference", "stem": "Which detail from the story best supports the main idea that Aria is excited about ballet class?", "options": ["She counts down the minutes.", "She follows the teacher's instructions.", "She thinks all of her friends look happy.", "She looks at the other girls getting ready."], "passage": "<strong>Read the passage</strong><br><br>Aria was sitting on a bench in the ballet classroom. She looked at the other girls walking in, arranging their belongings in the corner, and getting ready. She smiled and waved at them all, counting down the minutes until the beginning of the class. She closed her eyes and could almost hear a distant echo of her favorite classical music piece. She pictured herself and her classmates dancing with this song playing in the background.<br><br>The ballet teacher opened the classroom door and asked the students to take their positions. Aria ran to the left side of the class. As she was following the teacher's instructions, she looked around at her friends. \"They all seem so happy!\" she thought. \"Ballet class is truly a magical pastime.\""}, {"n": 13, "type": "text", "section": "Vocabulary in context", "stem": "Choose the pair of words that are synonyms (two words that share the same meaning):", "options": ["stable, solid", "kind, bright", "helpful, fortunate", "weak, old"]}, {"n": 14, "type": "text", "section": "Main idea & theme", "stem": "Which of the following sentences describes the plot of the story?", "options": ["Leo and Jemma went to collect branches and did not come back. Their parents and brother went looking for them. They found them both, without any branches.", "Leo, Jemma, and Grant went on a camping trip with their parents. Leo and Jemma went to collect some branches, while Grant and their parents prepared sandwiches for everyone.", "Jemma was playing with a butterfly. Leo was absorbed by rare plants. The whole family went back to the forest to build a tent.", "Leo and Jemma split up while looking for branches. Their parents and brother went looking for them. They called their names and used their whistles to signal them."], "passage": "<strong>Read the passage</strong><br><br>Leo, Jemma, and Grant went on a camping trip with their parents. They drove for an hour until they reached the nearest forest. They unpacked their equipment and set up their huge tent. Leo and Jemma volunteered to collect some logs and branches, while Grant and their parents prepared sandwiches for everyone. Leo and Jemma split up—Leo followed the colorful plants on the left and Jemma ran after a cute little squirrel on the right.<br><br>A half an hour later, Grant noticed that his siblings had not come back yet. Grant and his parents went looking for Leo and Jemma. They called their names and used their whistles to signal them. A few minutes later, they heard Jemma giggle from far away. They kept walking until they found her chasing a beautiful butterfly. She joined them and they all went looking for Leo. Leo was found a few minutes later, absorbed by the rare plants he had encountered on the way. The whole family went back to their tent, amused that the mission to find wood did not go as planned, but had at least turned out to be entertaining for Leo and Jemma."}, {"n": 15, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of both paragraphs?", "options": ["pets saving their owners", "pets pulling Ryan to shore", "pets smelling smoke", "pets saving a person's life"], "passage": "<strong>Read the passage</strong><br><br>A Very Clever Dog<br><br>Rocky is a Labrador Retriever (a type of dog). One day, Rocky was swimming in Roaring Fork River in Colorado. He was trying to catch a stick when Ryan Regan, an eight-year-old boy, floated by. The river was full of melted snow, and Ryan was so cold he could not talk. The young boy's life was in danger. Ryan had been kayaking with his father when their boat turned over. Ryan's father swam to shore, but the fast-moving waters quickly took Ryan down the river to where Carol Baron, a girl of 13, was playing with her dog Rocky.<br><br>\"Rocky knew the boy was in trouble and needed help,\" says Carol. \"Ryan grabbed onto the dog's collar, and Rocky pulled Ryan to shore.\" Now Ryan and Rocky are friends for life, and Ryan visits Rocky whenever he can.<br><br>A Very Brave Cat<br><br>Normally, Chester is a quiet cat who enjoys sitting in people's laps. But last summer, the cat suddenly became very noisy. \"I was sleeping in my bedroom, and I woke up to Chester screeching and running back and forth,\" says Bernice Wells, who lives in North Dakota, USA. Bernice opened her eyes and found her home filled with smoke. With Chester the cat running at her side, she made her way through the living room, kitchen, and then out the door. By then, fire was coming from the basement. As Bernice and her clever cat Chester watched from the safety of the sheriff's car, the firefighters whom she called managed to put out the fire.<br><br>\"I feel very lucky,\" says Bernice. \"Without Chester I probably would have died in the smoke. Chester saved me and my home.\""}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
