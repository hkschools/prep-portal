<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Reading (Level 1): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Reading (Level 1): Drill 1</div>
  <h2>MAP Grade 4 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 1): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 1): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-READ-L1-D1";
const BANK_PATH = "map-tests/grade-4/reading/level-1/drill-1/bank.csv";
const TITLE = "MAP Grade 4 Reading (Level 1): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Text structure", "stem": "Which of the following is the missing step in the sequence of events?", "options": ["Joel's friend eating the crackers and cheese", "Joel's mother packing the vegetables and fruit", "Joel finishing his ice cream with a smile on his face", "Joel's father returning with an ice cream cone for Joel"], "passage": "<strong>Read the story</strong><br><br>Joel and his parents spent the afternoon at the beach. They spread a colorful blanket on the sand and took out all the food they brought with them: crackers, cheese, cut vegetables and some fruit. After they finished eating, Joel started digging holes in the sand and building sand castles. A young boy who passed by them was so impressed with Joel's castles that he asked if he could join him. Joel agreed enthusiastically, and they spent the next half an hour turning the castle into a kingdom. When they were done playing, Joel looked up and realized that his father was not there. \"Where is Dad?\" he asked his mother. \"Thanks, Dad!\" Joel beamed, enjoying his ice cream with a big smile on his face."}, {"n": 2, "type": "text", "section": "Vocabulary in context", "stem": "What does the narrator's cousin need to do once the experiment is finished?", "options": ["decide what the results are", "evaluate the results", "find the results", "think about the results"], "passage": "<strong>Read the sentences</strong><br><br>My cousin is a scientist and she does all kinds of experiments, trying to find a cure for the common cold. Every time she finishes an experiment, I ask her how it went. She always answers, \"The experiment seems to have been a success, but we must do a lot of calculations and tests to determine how good the results are.\""}, {"n": 3, "type": "text", "section": "Text structure", "stem": "Which rule outlines what being late to gym class will result in?", "options": ["1.2", "1.3", "2.3", "3.1"], "passage": "<strong>Review this appendix from a student handbook</strong><br><br>Appendix 4: Physical Education Rules<br><br>Rule 1: Attendance<br>1.1 - Students must not miss more than three classes in a semester.<br>1.2 - A student who is more than five minutes late will not be allowed to join the class and will be marked as absent.<br>1.3 - A student who is restricted from exercising under doctor's orders must present a note and remain at the gym during class.<br>1.4 - Class will take place at the court outside whenever the weather permits.<br><br>Rule 2: Equipment<br>2.1 - Students must wear athletic shoes only.<br>2.2 - Students must pull back long hair.<br>2.3 - Students must use equipment correctly and with care.<br><br>Rule 3: Behavior<br>3.1 - Students must remain seated at the beginning of the class and follow the teacher's directions.<br>3.2 - There will be no fighting or cursing during class.<br>3.3 - There will be no eating or chewing gum during class."}, {"n": 4, "type": "text", "section": "Author's craft & structure", "stem": "This passage is an example of which type of text?", "options": ["a play", "a story", "a poem", "a memoir"], "passage": "<strong>Read the passage</strong><br><br>I'm sure I did not break this cup;<br>It just fell down, I know it did-<br>For I was only climbing up,<br>Why do they keep the cake-box hid?-<br>I wanted such a little bit!<br>And then I heard that creaking door,<br>I can't tell what it was I hit,<br>Nor how that cup got on the floor."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "This passage is an example of which type of text?", "options": ["a play", "a poem", "historical fiction", "romantic fiction"], "passage": "<strong>Read the passage</strong><br><br>In the morning, after milking the cow and churning some butter, Elizabeth felt thirsty. She went over to the well, dropped the bucket inside, and then pulled and pulled until it came back up, full to the brim with water. As she put her lips to the bucket and drank the sweet, cold water, she felt much more energetic, and she knew it was going to be a good day."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "What do all these animals have in common?", "options": ["They all live at the Arctic.", "They are all predators.", "They are all able to mask themselves.", "They all share similar fur colors."], "passage": "<strong>Read the sentences about four animals</strong><br><br>1. Polar bears have white fur coats that can blend into the blindingly white snow of the Arctic.<br>2. Whether their coats are spotted or black, leopards can mask themselves in order to attack their prey by surprise.<br>3. In order to hide in the middle of nature's birdhouses, bark bugs appear to be part of the tree itself.<br>4. Chameleons only change color when in imminent danger."}, {"n": 7, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following are opposites of \"beneath\"?", "options": ["above, over", "under, below", "at, in", "from, of"]}, {"n": 8, "type": "text", "section": "Vocabulary in context", "stem": "What does the prefix mis- mean?", "options": ["not", "without", "wrongly", "against"], "passage": "<strong>Read the sentences</strong><br><br>I misread my lines at school.<br><br>She misunderstood what I was saying."}, {"n": 9, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the text is an opinion?", "options": ["Vincent van Gogh was one of the greatest painters of all time.", "His works include Sunflowers and The Starry Night, both created in the nineteenth century.", "Van Gogh was born and raised in the Netherlands, but when he grew up, he moved to France.", "He was poor and his work was not successful while he was still alive."], "passage": "<strong>Read the passage</strong><br><br>Vincent van Gogh was one of the greatest painters of all time. His works include Sunflowers and The Starry Night, both created in the nineteenth century. Van Gogh was born and raised in the Netherlands, but when he grew up, he moved to France. He was poor and his work was not successful while he was still alive. It was only after Van Gogh died that his paintings became a huge success and were sold for millions."}, {"n": 10, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the passage is persuasive?", "options": ["While we sleep, our muscles rest and the information we absorbed during the day is processed in our memories.", "The first one is sticking to a routine.", "Playing ball, swimming, or riding a bicycle can help you fall asleep faster.", "If you follow these two rules, you are likely to be more active and focused during the day."], "passage": "<strong>Read the passage</strong><br><br>Sleep is one of the most important processes in our bodies. While we sleep, our muscles rest and the information we absorbed during the day is processed in our brains. Lack of sleep may lead to restlessness, stubbornness, and mood swings.<br><br>In order to be healthy and stay focused in school, it is recommended to follow two specific rules. The first one is sticking to a routine. Once you go to sleep every night at a fixed time, your body gets used to it and it is easier to fall asleep. The second one is exercising during the day. Playing ball, swimming, or riding a bicycle can help you fall asleep faster. If you follow these two rules, you are likely to be more active and focused during the day."}, {"n": 11, "type": "text", "section": "Detail & inference", "stem": "What is Monica's problem?", "options": ["She does not want to talk to Pam, but she is afraid that her friends will want to.", "She wants to buy ice cream with all her friends.", "She wants to find another group of friends because her friends do not talk to Pam.", "She wants to talk to Pam, but she is afraid the other children will be upset with her."], "passage": "<strong>Read the passage</strong><br><br>Monica's friends gathered around the school yard to play softball and called Monica over to join them. Monica was on her way when she noticed Pam, who was also in their class, sitting alone, watching the children and looking glum. Monica was about to go over to her and invite her to join the game, when her friend Iris grabbed her hand and pulled her back. \"What are you doing?\" she hissed. \"We're not talking to her!\"<br><br>\"Why not?\" asked Monica, surprised.<br><br>\"Because we had a fight three days ago and she was horrible! She said really mean things, so now you can't talk to her! None of the other kids are talking to her.\"<br><br>Iris strode back to the group. Monica remained in her place, thinking. She looked at the group, then at Pam, who was looking extremely miserable. She thought for another minute, then crossed the yard and sat next to Pam.<br><br>\"Monica!\" Iris yelled, but Monica ignored her and started talking to Pam. Pam instantly looked much happier and they kept talking, ignoring the other children who looked very surprised.<br><br>After the game was over, Monica asked Pam to come eat ice cream with her. Before they knew it, a few other children had joined them, and eventually the whole group-even Iris who was still looking upset-went to the ice cream parlor together."}, {"n": 12, "type": "text", "section": "Detail & inference", "stem": "How does the author compare between woolly mammoths and elephants?", "options": ["According to the passage, woolly mammoths were about the same size as elephants and their behavior was similar.", "According to the passage, woolly mammoths and elephants lived at the same time and place.", "According to the passage, woolly mammoths looked exactly like elephants.", "According to the passage, woolly mammoths had the same diet as elephants."], "passage": "<strong>Read the passage</strong><br><br>It is said that from about 400,000 until 4,000 years ago, woolly mammoths roamed the earth; more specifically, they lived in Africa, Europe, Asia, and North America. Woolly mammoths were covered in fur, which varied in color from dark to light, and they were approximately the same size as modern-day African elephants. Their ears and tail were short, and they had long tusks and four molars. Their behavior was similar to that of modern elephants-they used their tusks and trunks for fighting and foraging for food. Woolly mammoths ate grass and plants. They could reach the age of 60."}, {"n": 13, "type": "text", "section": "Detail & inference", "stem": "Which of the following might be a conclusion from the text?", "options": ["Sea otters are friendly to people and other animals.", "Sea otters live all over the world.", "Sea otters spend a lot of time in water.", "Sea otters live alone."], "passage": "<strong>Read the passage</strong><br><br>Sea otters are mammals from the weasel family. Their thick, dense fur, the densest fur in the animal kingdom, repels water; they have webbed feet; and their ears close when they are in the water. They sleep floating on their backs using kelp to keep them from drifting.<br><br>They are social animals and like to be with other sea otters. They live in groups. It looks like they are \"holding hands\" when they are floating because they stay near each other all the time. In Alaska, sea otters can live in a group with over 2,000 other otters."}, {"n": 14, "type": "text", "section": "Detail & inference", "stem": "What word best describes how Shana feels at the end of the passage?", "options": ["proud", "tired", "excited", "disappointed"], "passage": "<strong>Read the passage</strong><br><br>Shana spent all of her weekend studying for her English test. She asked her brother to help her solve the practice test that was handed out on Thursday. She invited a friend over to review all the homework assignments they completed during the semester. She even read all of the punctuation rules in the textbook twice. When the teacher handed the marked tests back, she smiled at Shana and said, \"I am so proud of you! The progress you made in the last couple of months is really impressive.\" Shana looked at her test. She was hoping for a higher mark."}, {"n": 15, "type": "text", "section": "Main idea & theme", "stem": "Which of the following is the best summary of the story?", "options": ["Leslie lost her phone on the bus and the other passengers helped her find it.", "Leslie wanted to text her friend but could not find her phone anywhere.", "Leslie lost her phone on the bus and found it all by herself.", "Leslie decided to text her friend, but her phone was nowhere to be found. Eventually she found it."], "passage": "<strong>Read the passage</strong><br><br>Leslie was sitting on the bus and thinking about the next day, when summer vacation would start at last. Then she decided to text her friend Rachel. She reached into her bag to take out her phone, but it wasn't in its usual pocket. She opened the bag and looked inside, moving some of the things inside so she could see better, but there was nothing. Her phone was not there.<br><br>Leslie started to panic. She sat up straight and started looking all around her seat, but when she still couldn't see her phone anywhere, she started to cry.<br><br>\"What's wrong?\" asked the woman sitting behind her. \"Why are you crying?\"<br><br>\"I lost my phone,\" Leslie answered.<br><br>The woman got up and started looking all around Leslie's seat. After calming down, Leslie joined her. Then a young man behind them said: \"Here it is!\" Leslie turned around to see him bending over and picking her phone up from under one of the seats. Apparently, it had fallen out of her bag and traveled quite a long way around the bus. Grateful and relieved, Leslie thanked the people who had helped her and returned to her seat."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
