<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Reading (Level 1): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Reading (Level 1): Drill 2</div>
  <h2>MAP Grade 4 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 1): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 1): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-READ-L1-D2";
const BANK_PATH = "map-tests/grade-4/reading/level-1/drill-2/bank.csv";
const TITLE = "MAP Grade 4 Reading (Level 1): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of this poem?", "options": ["It gets dark earlier in the winter.", "The narrator does not like to go to bed in the summer.", "The narrator likes to play outside in the winter.", "It gets dark later in the summer."], "passage": "<strong>Read the poem</strong><br><br>BED IN SUMMER<br>by Robert Louis Stevenson<br><br>In winter I get up at night<br>And dress by yellow candlelight<br>In summer, quite the other way,<br>I have to go to bed by day.<br><br>I have to go to bed and see<br>The birds still hopping on the tree,<br>Or hear the grown-up people's feet<br>Still going past me in the street.<br><br>And does it not seem hard to you,<br>When all the sky is clear and blue,<br>And I should like so much to play.<br>To have to go to bed by day?"}, {"n": 2, "type": "text", "section": "Vocabulary in context", "stem": "What is an example of a hatchling?", "options": ["crocodile", "chick", "mammal", "egg"], "passage": "<strong>Read the paragraph and the glossary definitions</strong><br><br>Crocodiles are large reptiles found in tropical regions of Africa, Asia, the Americas, and Australia. The crocodile's diet consists mainly of fish, reptiles, birds, and mammals. To help with digestion, crocodiles swallow small stones that grind up the food in their stomachs. Thanks to their slow metabolisms, crocodiles can survive for months without food. Crocodiles lay 10 to 60 eggs at a time. The hatchlings are usually carried to the water in the mouth of their crocodile mother.<br><br>Glossary<br>reptile - an animal of a class that includes snakes, lizards, crocodiles, turtles, and tortoises<br>region - a particular area<br>metabolism - the chemical processes that occur within a living organism in order to maintain life<br>hatchling - a young animal that has recently come out of its egg<br>digestion - the process of digesting food"}, {"n": 3, "type": "text", "section": "Main idea & theme", "stem": "What is the moral of this passage?", "options": ["Turtles are faster than rabbits.", "Rabbits are faster than turtles.", "Never underestimate the weakest opponent.", "It is important to train before a race."], "passage": "<strong>Read the passage</strong><br><br>The rabbit used to mock the turtle that she was so much faster than he was. The turtle challenged the rabbit to a race. Everyone knew that the rabbit was much faster than the turtle. The turtle wanted to win so much that he trained for a whole week before.<br><br>The race was about to begin, and the turtle and the rabbit took their places at the starting line. The flag went down, and the turtle rambled forward slowly. Thinking she had plenty of time, the rabbit stopped to talk to her friend on the side of the path. The turtle neared the finish line, and the rabbit suddenly noticed. She tried to catch up, but it was too late. The turtle had won the race!"}, {"n": 4, "type": "text", "section": "Detail & inference", "stem": "Giraffes need to always be alert and on the lookout for predators. Which of the following sentences from the passage explains what happens because of this fact?", "options": ["They only eat plants and flowers.", "They do not need to drink a lot.", "Giraffes sleep for only 20 minutes a day.", "Giraffes have very interesting coat patterns."], "passage": "<strong>Read the passage</strong><br><br>Giraffes are herbivores, which means they only eat plants and flowers, mostly from trees. Giraffes eat hundreds of pounds of food per week, but they do not need to drink a lot. They get most of the moisture they need from the leaves and branches they eat.<br><br>Giraffes sleep for only 20 minutes a day, in two- to three-minute naps, so that they can always be on the lookout.<br><br>Giraffes have very long legs and have only two gaits-walking and galloping. Giraffes have very interesting coat patterns, and every giraffe has a different one, much like humans' fingerprints."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "What is the mood in the passage?", "options": ["positive", "negative", "neutral", "impossible to tell"], "passage": "<strong>Read the passage</strong><br><br>Elsa was looking out the window. It was a very cold, dark, and stormy night. The windowsill was freezing as she tried to lean on it to see outside the window. She gave up trying and decided to go and play with her little sister. It had been a long time since they had last played. She thought it might make her feel a bit better."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "Why is the town of Punxsutawney, Pennsylvania usually very crowded with tourists and news reporters at the beginning of February?", "options": ["because the weather is warm", "because they are on a vacation there", "because spring will arrive soon", "because they want to watch Punxsutawney Phil"], "passage": "<strong>Read the passage</strong><br><br>Groundhog Day is celebrated every year on February 2 in Punxsutawney, Pennsylvania. If the groundhog, Punxsutawney Phil, sees his shadow, he runs back to his burrow underground due to his fear. If he sees his shadow, winter will continue on for at least six more weeks. If the groundhog cannot see his shadow, he will stay above ground. This means that spring will arrive soon.<br><br>The town of Punxsutawney, Pennsylvania is usually very crowded with tourists and news reporters at the beginning of February."}, {"n": 7, "type": "text", "section": "Detail & inference", "stem": "Why is the polar bear classified as a marine mammal?", "options": ["It is the largest predator that lives in water.", "Its preferred food lives in water.", "It is the only mammal that lives in water.", "It relies on sea ice for its existence."], "passage": "<strong>Read the paragraph</strong><br><br>Polar bears are the largest land predators in the world. Polar bears hunt their preferred food of seals from the edge of sea ice. Polar bears are classified as marine mammals because they spend most of their lives in and depend on the sea ice of the Arctic Ocean. There is a high estimated risk of future decline in the polar bears' population due to climate change."}, {"n": 8, "type": "text", "section": "Text structure", "stem": "Which chapter should you read if you need information about mirrors?", "options": ["Chapter Four", "Chapter Five", "Chapter Six", "Chapter Seven"], "passage": "<strong>Read the table of contents</strong><br><br>Introduction<br>Chapter I: You and Your Car<br>Chapter II: Changing Oil<br>Chapter III: Checking the Tires<br>Chapter IV: Changing a Tire<br>Chapter V: Brakes<br>Chapter VI: Mirrors<br>Chapter VII: Checking the Headlights<br>Chapter VIII: Changing the Air Filter<br>Conclusion"}, {"n": 9, "type": "text", "section": "Author's craft & structure", "stem": "Why does the author use the phrase \"busy as a bee\"?", "options": ["to emphasize why the aunt is so impressive", "to explain why the aunt likes bees", "to show why speaking a lot of languages is impressive", "to explain why the aunt does not have time for her nephews"], "passage": "<strong>Read the passage</strong><br><br>My aunt is the most impressive woman I have ever met. She is a widow and she takes care of her three children on her own. She also works as an executive in a big company, speaks four languages, and has a lot of hobbies. Whenever I see her, even though she is always busy as a bee, she still always has time to kiss me and my brother, and ask us how things are going at school."}, {"n": 10, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following meanings of the verb \"made up\" is used in the sentence?", "options": ["used cosmetics", "invented a story", "restored a relationship", "compensated for something bad"], "passage": "<strong>Read the sentence</strong><br><br>They weren't speaking all week, but today they finally made up."}, {"n": 11, "type": "text", "section": "Author's craft & structure", "stem": "What is the descriptive language in the text used for?", "options": ["to show the reader that the food in India is delicious", "to show the reader that New Delhi is the capital of India", "to show the reader that the author dislikes India", "to show the reader that the author likes India"], "passage": "<strong>Read the passage</strong><br><br>I remember my first trip to India last summer as if it were yesterday. I landed in New Delhi and was amazed by the amount of people, sounds, and colors on the streets. Through the eyes of a tourist, it might look completely disordered, but after you get used to it, you realize there is an order. The people were extremely friendly, the food was delicious, and I saw the most beautiful sights in the world."}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "Which one of the following statements in the passage includes an opinion?", "options": ["Organisms need food to be able to keep their bodies working properly.", "Malnutrition can happen when a person does not eat the right amount of nutrients.", "The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water.", "Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty."], "passage": "<strong>Read the passage</strong><br><br>Nutrition provides the cells of an organism with food. Organisms need food to be able to keep their bodies working properly. They also need food to be able to do certain things. Malnutrition can happen when a person does not eat the right amount of nutrients. This person can get better by changing his or her diet so it has the right amount of nutrients.<br><br>The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water. Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty. They take longer to digest, and because they stay in the stomach longer, they leave the person who has eaten them feeling fuller for longer. Protein is needed for building cells. It is found in meat, beans, and eggs. Fat is found naturally in some foods. Many people think that fat is bad, but there are various opinions on this subject."}, {"n": 13, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following meanings of the word \"jam\" is used in the sentence?", "options": ["very crowded and slow", "blocked", "a difficult situation", "a sweet food"], "passage": "<strong>Read the passage</strong><br><br>I was so busy all day that I barely had a spare second to breathe, and I still wasn't finished when I joined my family at the dinner table. During dinner I talked only about the jam I was going to be in if I didn't finish soon, and as soon as dinner was over I ran back to my desk to keep working."}, {"n": 14, "type": "text", "section": "Vocabulary in context", "stem": "The meaning of the suffix \"-ible\" is \"capable of.\" Which of the following words means \"something you can make longer\"?", "options": ["extendible", "accessible", "divisible", "reversible"]}, {"n": 15, "type": "text", "section": "Vocabulary in context", "stem": "\"Rich\" and \"wealthy\" are two words with some kind of relationship between them. Which of the following pairs of words from the passage has the same relationship?", "options": ["popular - symbolic", "tasty - delicious", "healthy - unhealthy", "cultures - religions"], "passage": "<strong>Read the passage</strong><br><br>The pomegranate is a very popular fruit because it is so tasty. Pomegranates are grown today all over the Mediterranean area, Southeast Asia, and North America. Pomegranates are not just delicious and healthy, but are also symbolic in many cultures and religions around the world. However, some people believe them to be unhealthy."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
