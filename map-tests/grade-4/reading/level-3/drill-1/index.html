<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Reading (Level 3): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Reading (Level 3): Drill 1</div>
  <h2>MAP Grade 4 Reading</h2>
  <p class="muted">15 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 3): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Reading (Level 3): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-READ-L3-D1";
const BANK_PATH = "map-tests/grade-4/reading/level-3/drill-1/bank.csv";
const TITLE = "MAP Grade 4 Reading (Level 3): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences is the most reliable?", "options": ["M&M's were first introduced in 1941.", "They are in fact the healthiest candy.", "They make a wonderful, healthy breakfast.", "Your breakfast will also be a very memorable one."], "passage": "<strong>Read the passage</strong><br><br>First introduced in 1941, M&M's may look like any other candy, but they are in fact the healthiest candy! They make a wonderful, healthy breakfast! Your breakfast will also be a very memorable one! M&M's are on sale for only $2.99 at a store near you!"}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "Based on the passage, what is corralling?", "options": ["chasing fish into shallow water", "keeping dolphins in captivity", "swimming with dolphins in the wild", "feeding on other fish"], "passage": "<strong>Read the passage</strong><br><br>The Oceanic Dolphin\n\nDolphins are a diverse group of aquatic mammals. They live in all the oceans and even in some rivers. Most dolphins prefer the warmer waters of the tropic zones, but some prefer colder climates. Oceanic dolphins are one family of dolphins.\n\nWhat They Look Like\n\nOceanic dolphins range in size. In some of the species, the males are larger than the females. They have two limbs that can be changed into flippers. They typically have \"beaks\" at the front of their heads, although there are exceptions to this rule. Their skin has a wide range of colors and patterns.\n\nWhat They Eat\n\nMost oceanic dolphins eat fish, along with a smaller number of squid and small crustaceans. Some of these dolphins also eat marine mammals and birds. They all only eat other animals. They typically have between 100 and 200 teeth. There are several ways of feeding among oceanic species. Corralling is a method in which dolphins chase fish into shallow water to catch them more easily.\n\nSenses\n\nOceanic dolphins can make a broad range of sounds and whistles to communicate with other dolphins. The eye of an oceanic dolphin is small for an animal of its size, yet it does have a good eyesight. There are signs that suggest oceanic dolphins have no sense of smell. Oceanic dolphins are not thought to have a good sense of taste, as their taste buds are usually missing.\n\nIn Captivity\n\nSeveral species of dolphins are kept in captivity. They are kept in theme parks, commonly known as a dolphinarium. Hundreds of dolphins live in captivity across the world."}, {"n": 3, "type": "text", "section": "Author's craft & structure", "stem": "The phrase \"miserable people in need\" is trying to influence the reader in what way?", "options": ["by using the bandwagon effect", "by using loaded words", "by stating a simple fact", "by including irrelevant details"], "passage": "<strong>Read the passage</strong><br><br>Jon Bon Jovi started a foundation called Soul Kitchen that runs two restaurants in which there are no prices, and meals are paid for by donation or volunteer work. The foundation fights against hunger and homelessness and helps miserable people in need."}, {"n": 4, "type": "text", "section": "Text structure", "stem": "How is this paragraph organized?", "options": ["compare and contrast", "cause and effect", "problem and solution", "order of importance"], "passage": "<strong>Read the passage</strong><br><br>Technology surrounds today's kids most of their waking hours. Children spend on average close to eight hours a day watching TV, playing video games, and using their cell phones. This reliance on technology limits kids' imaginations and their capacity for creativity, as they are rarely challenged to imagine things on their own. It also affects bodies as they perform less physical activity."}, {"n": 5, "type": "text", "section": "Detail & inference", "stem": "One may conclude from the information in this passage that \"Platform 9¾\"", "options": ["can be found in a work of fiction.", "is a genuine, secret platform.", "is where the Hogwarts School of Witchcraft and Wizardry is.", "is not very popular."], "passage": "<strong>Read the passage</strong><br><br>King's Cross train station, a major London railway terminal located in central London, is featured in J. K. Rowling's series of fictional books Harry Potter. It is the starting point of the Hogwarts Express train to the Hogwarts School of Witchcraft and Wizardry. In the series, the train uses a secret platform—\"9¾\"—accessed through the brick wall between platforms 9 and 10.\n\nAt King's Cross station, a \"Platform 9¾\" plaque was presented in 1999 to mark the location of the fictional platform. Part of a luggage trolley was installed below the sign: the near end of the trolley is visible, but the rest seems to have disappeared into the wall. The location quickly became a popular tourist spot among Harry Potter fans."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "What is the most likely reason Galápagos penguins usually only raise one child?", "options": ["The Galápagos penguin searches for food only during the day.", "The Galápagos penguin is unable to provide food for the young at certain times.", "The Galápagos penguin has to handle the danger of many predators.", "The Galápagos penguin is an endangered species."], "passage": "<strong>Read the passage</strong><br><br>The Galápagos penguin\n\nThe Galápagos penguin is a penguin that lives in the Galápagos Islands. It can survive due to the cool temperatures in the area. The Galápagos penguin is one of the banded penguins. The other species live mostly on the coasts of Africa and mainland South America.\n\nWhat They Look Like\n\nThe average Galápagos penguin is 19 inches long and 5.5 lb in weight. Galápagos penguins have black heads with a white border running from behind the eye to join on the throat. They have black-grey upperparts and whitish underparts. The female penguins are smaller than the males.\n\nWhere They Live\n\nThe Galápagos penguin is found primarily on Fernandina Island and the west coast of Isabela Island. Small groups can be found on other islands in the Galápagos area.\n\nWhat They Eat\n\nGalápagos penguins eat small fish, mainly mullet and sardines. They search for food only during the day and normally within a few miles of their breeding site. They depend on the cold currents to bring them food.\n\nBreeding and Predators\n\nThe Galápagos penguin lays one or two eggs in places such as caves, so that the eggs will not overheat from direct sunlight. One parent will always stay with the eggs or chicks, while the other is absent for several days to feed. The parents usually raise only one child. During colder seasons, the penguins put off breeding because their food becomes less abundant. This makes the chances of raising offspring successfully unlikely.\n\nBecause of the Galápagos penguin's smaller size, it has many predators."}, {"n": 7, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences predicts the end of the story?", "options": ["We would schedule a time and a place to meet, and I would usually have to wait there at least half an hour.", "Due to his tardiness, we were forever late for movies, and more than once we missed our reservation at a restaurant.", "This situation went on and on until I decided to give Marco a taste of his own medicine.", "When Marco strolled in, about twenty-five minutes late, I wasn't there to give him his ticket, and he couldn't go in!"], "passage": "<strong>Read the passage</strong><br><br>My friend Marco was always late. We would schedule a time and a place to meet, and I would usually have to wait there for at least half an hour. We discussed this issue so many times; Marco always agreed he had a problem and always promised to change, yet when we scheduled another meeting, he always came late. Due to his tardiness, we were forever late for movies, and more than once we missed our reservation at a restaurant.\n\nThis situation went on and on until I decided to give Marco a taste of his own medicine. We scheduled another meeting, this time at the football stadium. There was a game Marco had wanted to see for months. He knew the stadium reserved the tickets for fifteen minutes only, so he was counting on me to show up on time. Well, I didn't. When Marco strolled in, about twenty-five minutes late, I wasn't there to give him his ticket, and he couldn't go in! I only showed up twenty minutes later and we had to give up the game.\n\nA few days ago, we decided to go to a movie. I showed up right on time. To my surprise, Marco was already there, waiting for me!"}, {"n": 8, "type": "text", "section": "Text structure", "stem": "Which of the following sentences describes the sequence of events in the passage?", "options": ["The decrease in trees leads to the need for logs.", "The clearing of forest areas leads to a rise in pollution levels.", "The functioning of trees as natural air filters leads to forest fires.", "The loss of habitat for animals leads to the restoration of forests."], "passage": "<strong>Read the passage</strong><br><br>In recent years, the process of clearing out an area that was once covered in forests has become more common. There are several reasons for this process, including the need for logs, living areas, or pastures. Other causes for this process can be natural, such as forest fires, earthquakes, and tsunamis.\n\nToday, this process mostly takes place in countries in which there is not enough awareness of the results of engaging in such a process. These countries also do not have enough resources to restore forests that have been converted to other uses.\n\nThe damage caused by the clearing of forest areas is unknown to most people. The first effect of this process is the loss of habitat for forest-dwelling animals. In addition, trees function as natural air filters. Thus, when there are less trees, pollution levels rise."}, {"n": 9, "type": "text", "section": "Main idea & theme", "stem": "How does Robert's character develop throughout the story?", "options": ["He learns how to stop watching television.", "He learns how to ride his bike more safely.", "He learns that it is very important to take responsibility for your mistakes.", "He learns that there are other things in life besides watching television."], "passage": "<strong>Read the passage</strong><br><br>Robert was always watching television. When his parents called him for dinner, he kept watching television. He didn't like to have dinner with his parents, or go out with friends, or play games, or talk to people. He just liked watching television.\n\nOne day, as he was riding his bike home, Robert accidentally hit a small dog. He stopped and stared at the dog. It was the first time he had ever felt sorry for someone other than himself. He had seen accidents on television and had never given them much thought, but this was not television—this was real life, and he was responsible for hurting this dog. He called his mother, who came and picked him and the dog up and drove them to the local veterinarian.\n\nAt the clinic, Robert watched as the vet took care of the injured dog and promised that the dog will be just fine. He asked some questions and the vet answered them all. Then the vet offered to give him a tour of the clinic, since it was the end of the day. He had a few cages with animals that were injured or sick and had to stay at the clinic for a while: dogs, cats, birds, squirrels, hamsters and even a young deer. Robert found himself asking dozens of questions, crouching next to the animals and touching them gently, watching fascinated as the vet gave them some medicine.\n\nThat night when they came home, Robert told his mother that he wanted to volunteer at the animal hospital. The next day he did just that. Since then, every day after school, Robert rode his bike to the hospital and helped the vets take care of the animals. He had never been happier in his life."}, {"n": 10, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is a synonym (a word that shares the same meaning with another) of the word consequence?", "options": ["ramification", "publication", "revelation", "finalization"]}, {"n": 11, "type": "text", "section": "Detail & inference", "stem": "According to the story, which of the following is a quality of the narrator?", "options": ["good listener", "reliable", "likes parties", "brave"], "passage": "<strong>Read the passage</strong><br><br>I had been an admirer of Amy Greenhouse's music for years and years before I finally got the chance to meet her. I had gone to all her concerts. Every day, I listened to all her songs on my iPod. When I listened to her voice, I felt like the sky had opened and I was entering heaven, it was so good. I read every single article about her; I watched interviews with her; I hung her posters in my room. I would have liked nothing better than to meet her and tell her how much I loved her and her voice.\n\nLast August was my best friend Annie's birthday. She had planned a big party and invited all our friends. I had already bought her a present and promised to be in charge of the music during the party, when I found out that Amy Greenhouse was coming to town and giving a concert on the very same night.\n\nI begged Annie to change the date of the party, but unfortunately, her parents had already booked a caterer and it was impossible. Amy Greenhouse was my hero and I wanted to see her more than anything, but I knew that if I wouldn't go to the party, no one would help with the music and the party would be ruined. It was a very difficult decision, but eventually I decided that friendship was more important and I would go to Annie's party instead of the concert."}, {"n": 12, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words has the same root as the word \"captivate\"?", "options": ["Capricorn", "capacity", "cope", "enchant"]}, {"n": 13, "type": "text", "section": "Author's craft & structure", "stem": "What does the storm in the story symbolize?", "options": ["sadness", "a surprise", "danger", "anger"], "passage": "<strong>Read the passage</strong><br><br>It was late afternoon, and three young children were walking in the forest. The high trees were full of leaves and were blocking their view of the sky, but they were able to see the way. The day was hot—so hot that beads of sweat were running down the children's foreheads and cheeks, and their clothes were sticking to their backs. Small birds were flying around and chirping, but as the children kept walking, they could hear fewer and fewer birds. The trees were growing further apart now, and they could see the sky.\n\nSuddenly, they came to a clearing. They looked around them, unsure where to go next. Then, before they could reach a decision, they heard thunder in the distance and the sky above them turned dark almost at once. They looked up and saw clouds gathering up quickly—a storm was coming. Heavy raindrops started to fall all around them and the thunder grew louder and closer."}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "Lucy's words are an example for which literary device?", "options": ["metaphor", "irony", "alliteration", "personification"], "passage": "<strong>Read the passage</strong><br><br>Edmund's little sister, Lucy, suddenly started telling the entire family about a magical land she had found inside the closet. Edmund did not believe her, and he constantly made fun of her. A few days later, Edmund found out that Lucy hadn't been lying—the magical land was real! However, he didn't want the other family members to think he was insane like Lucy, so when they asked him about it, he lied, saying that he and Lucy had only been pretending that her land was real. \"Thank you very much, Edmund,\" said Lucy."}, {"n": 15, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words is a synonym (a word that shares the same meaning with another) of the word profuse?", "options": ["lacking", "ajar", "sparse", "abundant"], "passage": "<strong>Read the passage</strong><br><br>Last year, our garden was so profuse with fruit and vegetables that we had to give some of them away."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
