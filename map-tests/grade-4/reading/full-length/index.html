const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";

const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n":1,"type":"text","section":"Reading","stem":"What is the meaning of the prefix \"un-\"?","options":["before","incorrectly","one","not"],"passage":"<strong>Read the sentences</strong><br><br>My uncle hasn't worked in a few months. He doesn't like being unemployed."},{"n":2,"type":"text","section":"Reading","stem":"Based on the sentence, what is the meaning of the word \"unruly\"?","options":["bored and indifferent","wild and out of control","smart and well-read","famous and well-known"],"passage":"<strong>Read the sentence</strong><br><br>The principal was called to stop the unruly student who was breaking school windows and spraying the walls with paint."},{"n":3,"type":"text","section":"Reading","stem":"The author mentions Europe and Australia in order to show","options":["how big Antarctica is.","how cold Antarctica is.","the similarities between these continents and Antarctica.","that 1,000 to 5,000 people spend time in Antarctica every year."],"passage":"<strong>Read the passage</strong><br><br>Antarctica, where the South Pole is located, is the coldest place in the world. The average temperature in Antarctica is below zero. About 98% of Antarctica is covered by thick ice. Antarctica is also the driest place on earth. In fact, it is considered a desert because it only gets 200 millimeters of rainfall (or snow) per year.<br><br>Antarctica is very big: its area is 14 million square kilometers. It is bigger than Europe, and it is almost twice the size of Australia. However, while millions of people live in Australia, there are no permanent human residents in Antarctica. The first people arrived at Antarctica in the 19th century. Nowadays, 1,000 to 5,000 people spend time in Antarctica every year, living and working at research stations.<br><br>While there are hardly any humans in Antarctica, there are various animals living there, including several species of penguins, seals, and whales. There are also a few plants, mainly ice algae. Studies indicate that millions of years ago, Antarctica's climate was a lot warmer, and it was home to large forests as well as many different land animals, such as dinosaurs."},{"n":4,"type":"text","section":"Reading","stem":"Which of the following words is a synonym (a word that shares the same meaning with another) of the word \"omniscient\"?","options":["powerful","alienated","all-knowing","thoughtful"],"passage":"<strong>Read the sentence</strong><br><br>Despite the fact that he always thinks he knows everything, he is not omniscient."},{"n":5,"type":"text","section":"Reading","stem":"What is the theme of the story?","options":["It is okay to hand in assignments late.","The power of silence.","Always listen to your teacher.","Homework is exhausting."],"passage":"<strong>Read the passage</strong><br><br>Jake's teacher gave the class an assignment to be handed in by Monday. Jake planned to finish it on Sunday night, but when his parents suggested going to a movie, he completely forgot about the assignment and joined them. He only remembered it on Monday morning, when he saw all his classmates handing in their assignments at the beginning of the lesson, and he had nothing to hand in. \"Where is your assignment?\" the teacher asked. Jake flushed slightly and said, \"I didn't do it.\" The teacher just looked him in the eye, saying nothing, and Jake grew more uncomfortable with each second. He felt awkward:it would have been easier if she had shouted at him. After a few minutes, the teacher turned her attention back to the class and Jake was silent for the entire lesson.<br><br>Jake worked very hard that night, and on Tuesday morning, he handed it in a perfect assignment the minute the teacher walked in. \"Thank you, Jake!\" the teacher said. \"Thank you. I'm sorry I forgot to do it,\" Jake replied and they both smiled."},{"n":6,"type":"text","section":"Reading","stem":"Which of the following sentences is an example that the author is biased?","options":["It is a recessive trait, which means you have to get the trait from both your parents in order to have it.","If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world.","You might be interested to know that red hair used to be considered an evil trait.","Red-haired people were persecuted because they were believed to be vampires."],"passage":"<strong>Read the passage</strong><br><br>Red hair is uncommon, occurring in about 1%-2% of people. It is a recessive trait, which means you have to get the trait from both your parents in order to have it. If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world. Then again, you still may not have red hair. You might be interested to know that red hair used to be considered an evil trait. Red-haired people were persecuted by people who believed they were vampires."},{"n":7,"type":"text","section":"Reading","stem":"What are Hallie's feelings about Kate being accepted to Richmond after receiving her own letter?","options":["happy","worried","envious","indifferent"],"passage":"<strong>Read the passage</strong><br><br>My best friend Hallie and I were playing basketball in my backyard when my mother came running to call me. \"Kate, come quick!\" she cried. \"Something wonderful has happened!\" Hallie and I ran into the house to find my parents sitting at the desk, holding a letter and beaming. I took the letter and read the first few lines. They told me I had been accepted to Richmond, the best high school in town! Hallie and I had applied a few months earlier; our fathers had attended that school together and it was our dream to do the same now. Hallie and I hugged each other happily and I told her to hurry home and come back with her letter of acceptance.<br><br>Two hours later, when Hallie still hadn't come back, I started to get worried and called her. \"Oh, yes,\" she said, \"I wasn't accepted.\" I was shocked. It had been our dream for so long. We'd always known we'd go to high school together. How could I go to school without my best friend? \"If you're not coming, I'm not going either,\" I said. Hallie instantly sounded happier and friendlier and we agreed to meet at school the next day and play basketball.<br><br>Then I went downstairs to tell my parents I wasn't going to Richmond. They were shocked and asked why. I explained about Hallie not being accepted and how I didn't want to go without her. \"No, Kate, you don't want to give up on your dream for her.\" \"You can still be best friends, but you don't have to be in school together. It's your dream and your opportunity. Go for it.\""},{"n":8,"type":"text","section":"Reading","stem":"What does the author want us to think about Sophia?","options":["She was bored.","She was tired.","She was outgoing.","She was lonely."],"passage":"<strong>Read the passage</strong><br><br>Sophia stood alone at the corner of the classroom. She looked around as her classmates talked to each other enthusiastically. Although she would have liked to, she was too shy to join the group next to her or the group across the room. She wished someone would come over and start a conversation."},{"n":9,"type":"text","section":"Reading","stem":"What is the synonym (a word that shares the same meaning with another) of the word \"remarkable\" in this short passage?","options":["flawed","impressive","average","grateful"],"passage":"<strong>Read the sentences</strong><br><br>Malala Yousafzai is a remarkable young Pakistani activist for female education. She had an undefeated spirit to continue fighting for her cause, even in the face of many obstacles. Her determination inspired world leaders, organizations, and millions of people to take action to improve education accessibility for girls."},{"n":10,"type":"text","section":"Reading","stem":"What do the words \"hooted\", \"fluttered\", and \"hissed\" have in common?","options":["They all describe the action of flying.","They all mimic the sound of the action they describe.","They all describe actions done by the owls.","They all describe what Mia saw in her backyard."],"passage":"<strong>Read the passage</strong><br><br>Mia was sitting in her backyard at twilight, reading a book. She raised her eyes as a few owls hooted and fluttered above her, before settling on a tree branch. Mia wondered what could be bothering the owls so much. Then, her cat appeared from between the trees and started to climb the tree on which the owls were now sitting. Mia decided to save the owls, so she got up and took the cat into the house. The cat hissed angrily, but Mia gave her a big bowl of her favorite food, and the cat seemed satisfied."},{"n":11,"type":"text","section":"Reading","stem":"What is the meaning of the word \"pupils\" in this text?","options":["students","black holes in the center of the eyes","loud noises used to scare mice","chairs"],"passage":"<strong>Read the passage</strong><br><br>The classroom was full; the bell was about to ring. Alicia was sitting and talking to her friends when suddenly they all noticed a mouse on the floor next to them. Alicia's friends started screaming, but Alicia did not scream:she stood up and walked over to the mouse. Her pupils were dilated with fear, but nonetheless she stomped her feet as hard as she could, trying to scare the mouse away. It worked. Before she could come any closer, the mouse turned around and ran out of the classroom. Alicia and her friends all exhaled with relief."},{"n":12,"type":"text","section":"Reading","stem":"Which of the following can describe the author's feelings according to the passage?","options":["The author feels that Harvard is the most notable school in Boston.","The author feels that Boston is a good city for students.","The author feels that Boston offers the biggest variety of universities in the United States.","The author feels that Boston was founded in the seventeenth century."],"passage":"<strong>Read the passage</strong><br><br>Founded in the seventeenth century, the city of Boston is considered an international center of higher education. Students from all over the world flock to Boston to enjoy its excellent schools and multicultural character. There are over one hundred universities and colleges in Greater Boston, the most notable of which include Massachusetts Institute of Technology, Harvard University, Boston University, Northeastern University, and Tufts University.<br><br>Most of the universities and colleges in Boston are private; there are only two community colleges and only one public university. Boston's colleges and universities employ over 42,000 people, accounting for nearly seven percent of the city's workforce."},{"n":13,"type":"text","section":"Reading","stem":"According to this passage,","options":["a sweet potato is very much like a potato.","sweet potatoes with colorful flesh are sweeter.","only the sweet potato's root is eaten.","a sweet potato's skin can be pink."],"passage":"<strong>Read the paragraph</strong><br><br>The sweet potato is a root vegetable, but its young leaves are sometimes eaten as greens. It is only distantly related to the potato. The edible root is long and narrow. Its smooth skin ranges in color: it can be yellow, orange, red, purple, brown, or beige. Its flesh color also varies, and can be beige, white, red, pink, violet, yellow, orange, or purple. Sweet potatoes with white or pale yellow flesh are less sweet and moist than those with red, pink, or orange flesh."},{"n":14,"type":"text","section":"Reading","stem":"What is the theme of this poem?","options":["appreciating unique birds","praising nature's beauty","enjoying summer's benefits","criticizing the weather"],"passage":"<strong>Read the poem</strong><br><br>TREES<br>by Joyce Kilmer<br><br>I think that I shall never see<br>A poem lovely as a tree.<br>A tree that may in summer wear<br>A nest of robins in her hair;<br>Upon whose bosom snow has lain;<br>Who intimately lives with rain."},{"n":15,"type":"text","section":"Reading","stem":"Which of the following would NOT be considered a strike?","options":["a pitch that was thrown outside the strike zone","a pitch that the batter swung at and missed","a pitch that was thrown inside the strike zone","a ball that the batter hit into foul territory"],"passage":"<strong>Read the paragraph and glossary</strong><br><br>Baseball is a sport played by two teams. Each team has nine players. In baseball, one team throws a small round ball, called a baseball, and the other team tries to hit it with a club, called a bat. Teams score points by running and touching markers on the ground, called bases, until they reach the last one, called home plate.<br><br>Glossary:<br>baseline: the line between each of the bases in order. For example, from home plate to first base, from first base to second base, and so on.<br>base path: the area along the baseline where the players run from base to base.<br>ball: a pitch that was thrown outside the strike zone and that the batter did not swing at.<br>strike: a pitch that was thrown inside the strike zone and that the batter did not swing at, a pitch that the batter swung at and missed, or a ball that the batter hit into foul territory."},{"n":16,"type":"text","section":"Reading","stem":"This passage is an example for which type of text?","options":["book review","autobiography","memoir","biography"],"passage":"<strong>Read the passage</strong><br><br>My name is Rita Brown. I was born in London in 1950. My father worked as a lawyer, and my mother was a dentist. When I was four years old, my parents decided to immigrate to the United States.<br><br>After high school, I went to Harvard Law School and then joined my father's law firm. I spent all my adult life working there, and when my father retired, I took over as senior partner. I married one of the other partners and we have three children. I continued to work at the same firm until I retired a few years ago to spend more time with my family and my new grandchildren.<br><br>This passage is an example for which type of text?"},{"n":17,"type":"text","section":"Reading","stem":"Which of the following words is a synonym (a word that shares the same meaning with another) of the word \"ardent\"?","options":["enthusiastic","fascinated","indifferent","confused"]},{"n":18,"type":"text","section":"Reading","stem":"Based on the descriptions in the two reviews, on which topic are the two reviewers most likely to agree?","options":["the overall quality of the book","the author's craft","the characters' personalities","the details of the setting"],"passage":"<strong>Read the paragraphs</strong><br><br>Review 1<br><br>Feeling Sorry for Celia is a captivating book. It is a cleverly written novel that combines mystery and humor. The story revolves around Elizabeth, who lives in a suburb of Sydney, Australia, with her mother and her dog. Elizabeth's best friend, Celia, keeps disappearing, her father comes back from a business trip, and her communication with her mother is only through notes left on the fridge. The author does a magnificent job of creating characters that have depth and complexity. This makes them very relatable. It also makes them seem like real human beings.<br><br>Review 2<br><br>Feeling Sorry for Celia was okay. I probably won't be compelled to read anything by this author anytime soon, though. I thought that the storyline, set in Sydney, Australia, was ridiculous because Elizabeth's problems seemed real but the parents were utterly fantastical. What sort of mother waits several weeks after her child's disappearance and is still not worried about her? What sort of mother is absent except in notes she exchanges with her daughter? I like fiction, but this was just an odd mix. I could not relate to many of the characters and that says a lot about the quality of the book."},{"n":19,"type":"text","section":"Reading","stem":"The main purpose of the passage is to","options":["present information about the hibernation of animals.","discuss the effects of the weather on animal hibernation.","describe the effect of winter hibernation on animals' bodies.","compare warm-blooded animals to cold-blooded animals."],"passage":"<strong>Read the passage</strong><br><br>In Northern Europe the animals stay put in winter, but you will not see them because they hibernate. Red squirrels disappear inside trees, bears use caves, and frogs go deep under the mud. Many animals sleep under the snow; there is a lot of air in loose snow, and this helps to keep the cold out.<br><br>Some warm-blooded animals, like cats, dogs, or wolves, lead active lives, which happens because their usual body temperature even in very cold weather. But a cold-blooded creature's body temperature drops along with the air temperature. In below-freezing weather, it cannot move about and has no choice but to lie down and sleep. To do that, it must find a place where it can keep fairly warm, as well as a place where its enemies cannot find it.<br><br>When hibernating, the animal's temperature drops to just over zero degrees, its heart beats very slowly and it seems dead: the body feels so cold and the creature may breathe only once every five minutes. A hibernating animal cannot feel pain. How does this animal manage to live without eating for so many months? First, it has stored supplies of fat in its body during the summer and autumn. Second, since the hibernating animal reduces movement to a minimum:even the movement of the heart and lungs are greatly reduced:it does not need food to supply it with energy."},{"n":20,"type":"text","section":"Reading","stem":"Why does the author use the phrase \"big yellow ball of fire\"?","options":["to convey how hot the sun was","to make the reader want to go to the beach","to describe the sky","to explain why it hurts to look at the sun"],"passage":"<strong>Read the passage</strong><br><br>We were at the beach and it was hot. It was so hot that beads of sweat were running down our bodies and all over our faces. We had put on sunscreen, but that didn't help us against the relentless sun. Staring up at the sky, we saw the big yellow ball of fire. Our eyes hurt from looking at it."},{"n":21,"type":"text","section":"Reading","stem":"Which of the following sentences describes the sequence of events in the passage?","options":["Dutch settlers hunted all the dodos, leading to their extinction.","The dodo went extinct because it could not fly.","The dodo went extinct before the Dutch settlers came to Mauritius.","The dodo went extinct because of hunting and predators eating its eggs."],"passage":"<strong>Read the passage</strong><br><br>The dodo was a bird that lived on the island of Mauritius until the seventeenth century. Nowadays, it is extinct. It was a large, flightless bird, with a long beak and gray plumage. It had no natural predators on the island.<br><br>When Dutch settlers came to Mauritius in the sixteenth century, they hunted numerous dodos and ate their meat. They also introduced animals that were new to the island, including dogs, cats, macaques, and pigs. Some of those animals escaped captivity and became feral, and they began plundering dodo nests and eating their eggs. Since the dodo only laid one egg per season, the number of eggs decreased quickly and the dodo population declined drastically, until the dodo went extinct in the middle of the seventeenth century."},{"n":22,"type":"text","section":"Reading","stem":"What is the purpose of the text?","options":["to persuade","to instruct","to describe","to inform"],"passage":"<strong>Read the passage</strong><br><br>The Yangtze, a Chinese river, is the longest river in Asia and the third-longest river in the world. Despite its length, it only flows inside one country. Some areas around the river flood every summer, but are protected by river dikes. Many people live in these areas, and this is why the dikes are so important."},{"n":23,"type":"text","section":"Reading","stem":"What is the main idea of the passage?","options":["It was a beautiful summer day.","The sand was warm.","The laughter of the children and the cries of the seagulls were in our ears.","The sky was a deep shade of blue."],"passage":"<strong>Read the passage</strong><br><br>It was such a beautiful summer day! The sand was warm on my feet as I lay in the sun watching the ocean waves. My brother and sister were in the water, and the sound of their laughter filled my ears. The sky was a deep shade of blue. Suddenly we all heard the cries of the seagulls above us; everybody looked up to see them flying, flying, flying to the horizon."},{"n":24,"type":"text","section":"Reading","stem":"What is the author's purpose in this passage?","options":["to inform","to entertain","to persuade","to instruct"],"passage":"<strong>Read the passage</strong><br><br>Studies have found that bilingualism is a great asset to the cognitive process, and therefore, it is highly advisable. People who speak more than one language have several cognitive advantages; they score better on different tests; their memory, concentration, and multitasking skills are better; and they are less prone to diseases such as Alzheimer's and dementia when they get older.<br><br>It is estimated that more than 427 million people speak Spanish as a native language. Spanish is considered one of the easiest languages for a native English speaker to learn, because even though the grammar and pronunciation are different from English, they are simpler and more consistent, so learning Spanish might be very easy for you. Spanish is the most popular second language learned in the United States, and even elementary schools have adopted it into their curriculums."},{"n":25,"type":"text","section":"Reading","stem":"Which set of words all have the same root word?","options":["reach, breach, preach","puzzle, dazzle, blizzard","misuse, useless, user","forever, over, never"]},{"n":26,"type":"text","section":"Reading","stem":"What does the suffix \"-phobia\" mean?","options":["love","envy","fear","respect"],"passage":"<strong>Read the sentence</strong><br><br>Ron cannot go to Luke's birthday party at his uncle's farm due to his zoophobia."},{"n":27,"type":"text","section":"Reading","stem":"Which sentence from the passage is an opinion about oceanic dolphins?","options":["\"The eye of the oceanic dolphin is small for an animal of its size.\"","\"Swimming with dolphins is a once-in-a-lifetime experience.\"","\"There are signs that suggest oceanic dolphins have no sense of smell.\"","\"Hundreds of dolphins live in captivity across the world.\""],"passage":"<strong>Read the passage</strong><br><br>The Oceanic Dolphin<br><br>1   Dolphins are a diverse group of aquatic mammals. They live in all the oceans and even in some rivers. Most dolphins prefer the warmer waters of the tropic zones, but some prefer colder climates. Oceanic dolphins are one family of dolphins.<br><br>What They Look Like<br>2   Oceanic dolphins range in size. In some of the species, the males are larger than the females. They have two limbs that can be changed into flippers. They typically have \"beaks\" at the front of their heads, although there are exceptions to this rule. Their skin has a wide range of colors and patterns.<br><br>What They Eat<br>3   Most oceanic dolphins eat fish, along with a smaller number of squid and small crustaceans. Some of these dolphins also eat marine mammals and birds. They all only eat other animals. They typically have between 100 and 200 teeth. There are several ways of feeding among oceanic dolphins. Corralling is a method in which dolphins chase fish into shallow water to catch them more easily.<br><br>Senses<br>4   Oceanic dolphins can make a broad range of sounds and whistles to communicate with other dolphins. The eye of an oceanic dolphin is small for an animal of its size, yet it does have a good eyesight. There are signs that suggest oceanic dolphins have no sense of smell. Oceanic dolphins are not thought to have a good sense of taste, as their taste buds are usually missing.<br><br>In Captivity<br>5   Several species of dolphins are kept in captivity. They are kept in theme parks, commonly known as a dolphinarium. Hundreds of dolphins live in captivity across the world, though exact numbers are unknown."},{"n":28,"type":"text","section":"Reading","stem":"How had Eli changed over the years?","options":["He started to break fences.","He stopped watching short, funny movies on the Internet and playing video games.","He wanted to go outside.","He started vandalizing the neighborhood and playing offensive tricks on his neighbors."],"passage":"<strong>Read the passage</strong><br><br>James was exhilarated. He was on his way to meet Eli, a friend he hadn't seen since they had entered elementary school five years ago. Eli had moved away with his parents and the two of them only kept in touch over the Internet.<br><br>James was now finally old enough to take the train by himself, and his parents had finally allowed him to go. On his way, he thought longingly of the days he and Eli had spent together; they had always liked to play video games and watch short, funny movies on the Internet. He was looking forward to doing that today.<br><br>When James got off the train and met Eli and his parents, they were all thrilled to see each other, and a short while later they arrived at Eli's house.<br><br>James wanted to play a video game, but Eli said he didn't have any video games anymore. He wanted to go outside and meet his friends and James reluctantly agreed. Eli and his friends ran around the backyards of the neighborhood, breaking fences and leaving insulting letters in mailboxes. When James saw what they were doing, he pretended to be feeling ill so he could go back to the house and ask Eli's parents to take him back to the train station. He knew he would probably never see Eli again, and he was happy about it."},{"n":29,"type":"text","section":"Reading","stem":"Which of the following is an example of personification?","options":["Trees all around were blooming.","My feet were soaked.","The breeze made the flowers dance.","It only made me shiver with joy."],"passage":"<strong>Read the passage</strong><br><br>It was a fine day and the sky was clear above Lake Moore. Trees all around were blooming. The air itself seemed easier to breathe than usual as I stood there, taking in the magnificent view. I had just stepped out of the lake. My feet were still soaked in the gentle water of the lake and I myself was completely drenched, but the gentle breeze, which made the flowers around dance ever so slightly, only made me shiver with joy."},{"n":30,"type":"text","section":"Reading","stem":"Which of the following sentences is an example of hyperbole?","options":["I have a million things to do.","She was shaking like a leaf.","She was busy from the moment we arrived until the moment we left.","Time is money."],"passage":"<strong>Read the passage</strong><br><br>Last week I visited my mother's office. She works as a CEO of a big company. She was busy from the moment we arrived until the moment we left. She ran from meeting to meeting, wrote dozens of e-mails, and answered more phone calls than I could possibly count. The other workers kept going in and out of her office and asking her questions. One of the workers had lost an important file and came to apologize, shaking like a leaf. My mother said quietly, \"I have a million things to do now and I have no time to find a solution. Please ask your colleagues for assistance.\" After the next meeting, the worker came in again to announce the file had been found. My mother endured it then. She explained to me just how important that file was. \"How did you manage to keep calm when it was missing?\" I asked. \"Panicking would not have helped,\" my mother replied. \"I was d, transportation, and excellent soil for growing food. Nowadays, the Nile is the primary water source of Egypt and Sudan."},{"n":33,"type":"text","section":"Reading","stem":"How did Sebastian's character develop in the story?","options":["He learned to play dodgeball.","He apologized for stepping on another child's toes.","He learned to play fair.","He stopped yelling."],"passage":"<strong>Read the passage</strong><br><br>Coach Clarke named two students as team captains and asked them to pick students for their dodgeball teams. When there were only a dozen students left, Sebastian cried, \"If you don't pick me next, I'm not going to play at all!\" Jill named Sebastian next and he joined her team, cheering.<br><br>Ten minutes into the game, Steve accidentally stepped on Sebastian's toes while trying to catch the ball before it rolled over to the other team's field. \"Foul!\" yelled Sebastian, even though Steve was on his team. \"Steve shouldn't play anymore, Coach!\" he demanded of Coach Clarke. \"He stepped on my toes on purpose!\" Steve apologized to Sebastian repeatedly and promised Coach Clarke it was an accident. Coach Clarke told Sebastian she would allow Steve to keep playing. Sebastian stomped his foot and turned to Steve. \"I don't like playing with you!\" Coach Clarke said, \"If you don't start playing fair and stop ruining the game for everybody else, Sebastian, I won't let you play anymore.\" Sebastian looked at Coach Clarke, and said, \"All right.\" For the rest of the game Sebastian was quiet, and at the end of the game he went to Jill and Steve and apologized. They all shook hands."},{"n":34,"type":"text","section":"Reading","stem":"What is the underlying assumption the advertisement is making about its audience?","options":["The people who would want to buy the shoes are amateur runners.","The people who would want to buy the shoes are looking for shoes under $100.","The people who would want to buy the shoes are short-distance runners.","The people y of life on Mars due to the planet's closeness and similarity to Earth. Searches for evidence of life on Mars began in the 19th century and continue today. The current understanding of the ability of a planet to develop life involves having liquid water on the surface of the planet. While the new findings show water is indeed found on Mars, some claim it is and has been too salty to support regular life. As of now, it is still unknown whether life has ever existed there, but neither has the question of life on Mars received a definite negative answer."},{"n":39,"type":"text","section":"Reading","stem":"What is the purpose of the subheadings?","options":["to hint about what will happen in the last paragraph","to teach the reader new words","to make it easier to locate information"],"passage":"<strong>Read the passage</strong><br><br>The Oceanic Dolphin<br><br>1   Dolphins are a diverse group of aquatic mammals. They live in all the oceans and even in some rivers. Most dolphins prefer the warmer waters of the tropic zones, but some prefer colder climates. Oceanic dolphins are one family of dolphins.<br><br>What They Look Like<br>2   Oceanic dolphins range in size. In some of the species, the males are larger than the females. They have two limbs that can be changed into flippers. They typically have \"beaks\" at the front of their heads, although there are exceptions to this rule. Their skin has a wide range of colors and patterns.<br><br>What They Eat<br>3   Most oceanic dolphins eat fish, along with a smaller number of squid and small crustaceans. Some of these dolphins also eat marine mammals and birds. They all only eat other animals. They typically have between 100 and 200 teeth. There are several ways of feeding among oceanic dolphins. Corralling is a method in which dolphins chase fish into shallow water to catch them more easily.<br><br>Senses<br>4   Oceanic dolphins can make a broad range of sounds and whistles to communicate with other dolphins. The eye of const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
