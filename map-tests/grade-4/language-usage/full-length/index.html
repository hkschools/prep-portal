<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Language Usage: Full-Length Practice Test</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Language Usage: Full-Length Practice Test</div>
  <h2>MAP Grade 4 Language Usage</h2>
  <p class="muted">52 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage: Full-Length Practice Test</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage: Full-Length Practice Test</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-LANG-FULL";

const TITLE = "MAP Grade 4 Language Usage: Full-Length Practice Test";

const QUESTIONS = [{"n": 1, "type": "text", "section": "Grammar: parts of speech", "stem": "What is the correct definition of a proper noun?", "options": ["It is a word used to name general items.", "It is a word that describes a noun or pronoun.", "It is a word that describes an action, condition, or experience.", "It is a word that names a particular person, place, or thing."]}, {"n": 2, "type": "text", "section": "Capitalization", "stem": "Which words in the sentences should begin with a capital letter?", "options": ["park, grizzly", "baby, giant", "bears, bear", "park, last"], "passage": "<strong>Read the sentences.</strong><br><br>Yosemite National park is widely known for the giant grizzly bears that live there. last year, my family and I saw a baby grizzly bear when we visited it."}, {"n": 3, "type": "text", "section": "Composition & writing", "stem": "Which of the following is required in research writing?", "options": ["sense of humor", "personal experiences", "a list of references", "imaginary story"]}, {"n": 4, "type": "text", "section": "Sentence structure", "stem": "What is the subject in the sentence?", "options": ["White socks", "His", "Left", "Ethan"], "passage": "<strong>Read the sentence.</strong><br><br>Ethan almost left his white socks on his bed as he was in a hurry."}, {"n": 5, "type": "text", "section": "Spelling", "stem": "In which sentence is the underlined word spelled correctly?", "options": ["There are high cliffes in the coasts of South Africa.", "My father and my grandfather were sheriffs.", "We all had experience with curfewes.", "He found two pairs of earmuffes on the street."]}, {"n": 6, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the sentences is the most appropriate to convey imagery?", "options": ["He closed the door silently so he wouldn't wake her up.", "She felt very sad when she came home and saw her fish was missing.", "Kuwait City is one of the hottest cities in the world.", "His face blossomed when his classmate flattered him."]}, {"n": 7, "type": "text", "section": "Grammar: usage", "stem": "Which sentence is not grammatically correct?", "options": ["They lie on their bed and watched a comedy show yesterday.", "He lay on his back and did sit-ups at the local gym.", "I had lain on the sofa all morning until the phone rang.", "I saw that the mechanic was lying on his back and fixing my father's car."]}, {"n": 8, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["Her's sneakers are very dirty; she should clean them.", "The dog jumped on it's owner with joy when he arrived home.", "Who's the person that called you so late last night?", "The childrens toys were scattered all over the floor."]}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Which of the following is used as a prewriting strategy?", "options": ["Revision", "Rewriting", "Clustering", "Proofreading"]}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which type of writing should you choose, if you want to describe the funny costumes your classmates wore to a Halloween party?", "options": ["A research paper", "An informal essay", "Business letter", "News report"]}, {"n": 11, "type": "text", "section": "Grammar: usage", "stem": "Which sentence is grammatically correct?", "options": ["I'm determined to do better then I did last year in school.", "I'm always afraid that I will loose my keys.", "The music was too loud for me, so I left the room.", "That group of students are going on a field trip to New York."]}, {"n": 12, "type": "text", "section": "Capitalization", "stem": "Which word should begin with a capital letter?", "options": ["sister", "software", "microsoft", "engineer"], "passage": "<strong>Read the sentence.</strong><br><br>Eric's sister has started working at microsoft as a software engineer."}, {"n": 13, "type": "text", "section": "Composition & writing", "stem": "Which form of writing is appropriate for this topic?", "options": ["Expository writing", "Persuasive writing", "Narrative writing", "Descriptive writing"], "passage": "<strong>You are asked to write an essay about an object that is special to you.</strong>"}, {"n": 14, "type": "text", "section": "Spelling", "stem": "In which sentence is the underlined word spelled correctly?", "options": ["Jessica was the head chearleeder of her school's team.", "My brother works as a lifegard during summer vacation.", "I usually store all my sports equipment in the wearhouse.", "He is famously known for the unique scar on his forehead."]}, {"n": 15, "type": "text", "section": "Composition & writing", "stem": "Who is the audience this advertisement should be written for?", "options": ["Short-distance runners", "People who want to sell shoes", "Professional runners", "People who look for shoes under $100"], "passage": "<strong>You are writing an advertisement for a pair of running shoes you want to sell.</strong><br><br>These shoes are designed specifically for long-distance runs and for professional runners. The price you request for them is $100, and their color is black and yellow."}, {"n": 16, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["On July 1, 1991, my parents visited the White House.", "The meeting is scheduled for Tuesday, May 15 at 7 p.m.", "Her flight should arrive on September 3 if there are no delays.", "November 19, 1863 is an important date in U.S. history."]}, {"n": 17, "type": "text", "section": "Composition & writing", "stem": "Which sentence will best serve as a topic sentence for this subject?", "options": ["Pets are helpful in keeping their owners fit and healthy.", "Pets can bring you many benefits in different aspects of life.", "Pets are a great source of love and friendship to their owners.", "Pets bring along many educational benefits for both children and adults."], "passage": "<strong>Sarah was asked to write an essay about the advantages of owning a pet.</strong>"}, {"n": 18, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is grammatically correct and uses parallel structure?", "options": ["Jerry likes to play baseball, to play the guitar, and swimming.", "Tom will help us prepare lunch, arrange the table, and might help us with the dishes.", "In my living room, you can find the following: a sofa, a television, and a table.", "Don't forget to shut down the computer and locking the door after you leave."]}, {"n": 19, "type": "text", "section": "Capitalization", "stem": "Which words should be capitalized?", "options": ["honeymoon, region", "aunt, region", "aunt, usb", "usb, stick"], "passage": "<strong>Read the sentences.</strong><br><br>I met aunt Marie yesterday. She gave me a usb stick with photos from her honeymoon in the Caribbean region."}, {"n": 20, "type": "text", "section": "Sentence structure", "stem": "Which of the following is an incomplete sentence?", "options": ["Stephen waited for the bus all morning.", "After you finally take the English test.", "The jackal was howling all night.", "I thought about you yesterday."]}, {"n": 21, "type": "text", "section": "Grammar: usage", "stem": "What is the plural of the word \"goose\"?", "options": ["geeses", "gooses", "geese", "goosess"], "passage": "<strong>Read the sentence.</strong><br><br>While I was walking along the lake, I saw a beautiful white goose."}, {"n": 22, "type": "text", "section": "Composition & writing", "stem": "Which of the descriptions best defines personal narrative?", "options": ["Form of writing in which the writer relates events or experiences from his/her life", "Form of writing in which the writer informs or explains a subject to the reader", "Form of writing in which the writer's purpose is to convince the readers with his/her point of view", "Form of writing in which the writer uses the five senses to paint a picture for the reader"]}, {"n": 23, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the words in the paragraph are adjectives?", "options": ["young, running back, hot", "young, faster, hot", "football, faster, team", "young, last, hot"], "passage": "<strong>Read the paragraph.</strong><br><br>The young boy has been on the school's football team since last year. His position is running back. He runs faster than anyone else on the team. After the training is over, the team members take hot showers and change clothes."}, {"n": 24, "type": "text", "section": "Punctuation", "stem": "Which of the sentences is punctuated correctly with parentheses?", "options": ["My sister likes (old country music), although I do not know why.", "Please read my short (essay) about nutrition. You will be amazed.", "The Labrador (which is my favorite dog breed) originated in Canada.", "The (Pacific) Ocean is the largest ocean in the world."]}, {"n": 25, "type": "text", "section": "Composition & writing", "stem": "This writing most likely would be found in:", "options": ["A research paper", "A book report", "A poem", "A diary"], "passage": "<strong>Read the sentences.</strong><br><br>Today there were track and field competitions in my school. I managed to advance to the finals in both 100-meter and 200-meter sprint races, but I didn't win any medals."}, {"n": 26, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a simple sentence?", "options": ["He returned the tablet after he noticed it was damaged.", "I'm going on a ski vacation next month with my father.", "I wanted to order a pizza, but my mom already made dinner.", "She brushed her teeth quickly, and she went straight to bed."]}, {"n": 27, "type": "text", "section": "Capitalization", "stem": "Which sentence is not capitalized correctly?", "options": ["There are over 2,000 languages spoken natively in Africa.", "It is one of the most diverse continents in terms of animal and plant life.", "The Sahara is the hottest desert on earth, and one of the driest.", "Africa hosts a large diversity of ethnicities, nationalities, and cultures."]}, {"n": 28, "type": "text", "section": "Grammar: usage", "stem": "Which of the following is grammatically correct?", "options": ["The pizza with pepperoni you ordered yesterday were great.", "The best time for buying electronic devices is now.", "The jar that contains all the cookies I made have disappeared.", "The bookcase with all my books are in my old room."]}, {"n": 29, "type": "text", "section": "Composition & writing", "stem": "Which of the following would be the most appropriate topic for a persuasive essay?", "options": ["The story of my mother's life", "Seasons of the year", "Most common trees in the U.S.", "Why baseball is the best sport"]}, {"n": 30, "type": "text", "section": "Spelling", "stem": "Which of the words is spelled correctly?", "options": ["Boredome", "Arguement", "Handfull", "Backwards"]}, {"n": 31, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["The herd follows its leader to the nearest watering hole.", "The pack of brownies were empty when I opened it.", "The team usually eat in a restaurant after winning a game.", "The school present an exhibition of students' paintings."]}, {"n": 32, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["Yes, I would like to have dinner with you.", "Well. I have to think about that.", "Suddenly! I heard a noise from upstairs.", "Hey? Did you see what just happened?"]}, {"n": 33, "type": "text", "section": "Composition & writing", "stem": "Identify the correct order of the sentences in this paragraph.", "options": ["3, 4, 1, 2", "1, 2, 3, 4", "3, 2, 4, 1", "4, 3, 2, 1"], "passage": "<strong>Read the sentences.</strong><br><br>1. Then she called her parents and siblings to the table.<br><br>2. Everyone complimented her on the delicious dinner.<br><br>3. Madison made a special birthday dinner for her brother.<br><br>4. She baked chocolate cake and cooked a turkey."}, {"n": 34, "type": "text", "section": "Grammar: parts of speech", "stem": "Identify the subjective pronouns in the sentences.", "options": ["her, she", "him, they", "she, they", "her, him"], "passage": "<strong>Read the sentences.</strong><br><br>Ali received a letter from her yesterday. The letter mentioned that she was planning to visit him next month. Ali is very excited as they haven't seen each other for almost a year."}, {"n": 35, "type": "text", "section": "Capitalization", "stem": "Which word should begin with a capital letter?", "options": ["myrtle", "finnish", "puppy", "spitz"], "passage": "<strong>Read the sentences.</strong><br><br>My new puppy, a finnish spitz, is very energetic and causes a lot of mess in my garden. It ruined one of the myrtle shrubs I planted just last week."}, {"n": 36, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences includes a simile?", "options": ["Taylor's voice is music to his ears.", "Yesterday was the hottest day of the year. It was boiling outside!", "Calvin and his brother fought like cats and dogs.", "She thought about cutting her hair as short as her mother's."]}, {"n": 37, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["Some of them are from other countries, but all speaks English well.", "The two boys who played together go to the same school.", "Here is the books you were looking for all morning.", "My favorite basketball team are the Houston Rockets."]}, {"n": 38, "type": "text", "section": "Spelling", "stem": "Which three words in the paragraph are misspelled?", "options": ["evidence, kitchen, texture", "exicting, fosil, predetors", "kitchen, predetors, creature", "fosil, creature, exicting"], "passage": "<strong>Read the paragraph.</strong><br><br>The sea sponge is considered to be the longest-exicting creature in our planet. The oldest evidence of a sea sponge found was a fosil discovered in a 760-million-year-old rock. Its body texture looks similar to the texture of a kitchen sponge. Some types of sea sponges have been found to live over 200 years, as they have almost no predetors."}, {"n": 39, "type": "text", "section": "Composition & writing", "stem": "Which of the following sentences could be a strong concluding sentence for the paragraph?", "options": ["Lastly, there are also fewer than 600 Sumatran tigers remaining in the world.", "Therefore, the main factor in the continued decline of the Javan rhinoceros' population has been poaching for horns.", "These factors have left the Javan rhinoceros one of the rarest animals on the planet.", "The Javan rhino can live around 30-45 years in the wild."], "passage": "<strong>Read the paragraph.</strong><br><br>There are fewer than 60 Javan rhinoceros remaining in the world. There is only one known population of the Javan rhinoceros in the wild, located in the island of Java, Indonesia. Loss of habitats and trophy hunting for its horns are the main causes for the serious decline in its numbers."}, {"n": 40, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a declarative sentence?", "options": ["Pick up the dinosaur toy from the floor.", "The T-Rex skeleton was huge!", "Did you go to the dinosaurs' exhibition last week?", "The last dinosaurs disappeared 65 million years ago."]}, {"n": 41, "type": "text", "section": "Punctuation", "stem": "Which of the sentences is punctuated correctly?", "options": ["I need to buy pickles, return the books to the library, and pick up my sister, on my way home.", "I need to buy pickles, return the books to the library and pick up my sister on my way home.", "I need to buy pickles, return the books to the library, and pick up my sister on my way home.", "I need to buy pickles, return the books to the library and pick up my sister, on my way home."]}, {"n": 42, "type": "text", "section": "Composition & writing", "stem": "Which of the following is the most appropriate thesis statement for this topic?", "options": ["There are many schools in which students must wear uniforms.", "There are many schools in which students can wear any outfit they want.", "Wearing uniforms in school has its advantages and also its disadvantages.", "Students should not wear uniforms to school as doing so does not allow them to express their personal style."], "passage": "<strong>Read the topic.</strong><br><br>Should students have to wear school uniforms?"}, {"n": 43, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is structured correctly?", "options": ["The members of the school's football team were very competitive.", "The very competitive members were of the school's football team.", "The very competitive of the school's football team were the members.", "Of the school's football team, the members were very competitive."]}, {"n": 44, "type": "text", "section": "Capitalization", "stem": "Which words should be capitalized?", "options": ["elementary, math, chemistry", "elementary, board, education", "board, of, education", "education, math, chemistry"], "passage": "<strong>Read the sentence.</strong><br><br>Jake Robinson elementary has received many awards from the State board of education for its students' achievements in math and chemistry."}, {"n": 45, "type": "text", "section": "Word choice & vocabulary", "stem": "Which transition word or phrase best completes the paragraph?", "options": ["suddenly", "in fact", "otherwise", "as a result"], "passage": "<strong>Read the paragraph.</strong><br><br>David was in a rush this morning. He left his house at the last minute, hurrying to an important meeting. When he reached his car, David noticed he had a flat tire. In order to drive his car, he had to replace the tire. He wasted a lot of time replacing the tire, and, ___ he was late for his meeting."}, {"n": 46, "type": "text", "section": "Spelling", "stem": "In which sentence is the plural spelled correctly?", "options": ["The chefs prepared lunch for the whole school.", "We saw three wolfs near the edge of the forest.", "Both shelfs in my bedroom are full of books.", "The knifes were kept in a locked drawer."]}, {"n": 47, "type": "text", "section": "Spelling", "stem": "In which sentence is the underlined word spelled correctly?", "options": ["Some drivers disobeyd the driving rules in the city.", "My father went on several journeyes to Japan.", "Chandler's dog is always obeying his orders.", "He works at a company that surveyes people's opinions."]}, {"n": 48, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["The old house in my neighborhood is built 100 years ago.", "Take your shoes off; the house was cleaned yesterday.", "The new action movie were directed by Richard, my brother.", "The fence around the backyard painted green last week."]}, {"n": 49, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["\"The teacher announced,\" \"The MAP test will be held next week!\"", "\"I have to leave soon, said mom, I need to do some shopping.\"", "You are invited to the barbeque we are planning tomorrow, \"said Tom.\"", "She said, \"I have an allergy to cats so I cannot visit you, unfortunately.\""]}, {"n": 50, "type": "text", "section": "Composition & writing", "stem": "What is the main idea of the paragraph?", "options": ["Chimpanzees and humans are part of the great ape family.", "Both humans and chimpanzees eat plants and meat.", "Chimpanzees and humans have great resemblance.", "Humans and chimpanzees share between 85% to 95% of the same DNA."], "passage": "<strong>Read the paragraph.</strong><br><br>Chimpanzees are part of the great ape family, just like humans. Chimpanzees are our closest living relatives, and it is estimated that humans and chimpanzees share between 85% to 95% of the same DNA. Chimpanzees have complex greetings and communications and they are omnivorous (eat plants and meat), like us. Both chimpanzees and humans can see in color and create and use tools to help them with daily challenges."}, {"n": 51, "type": "text", "section": "Grammar: usage", "stem": "Which sentence is grammatically correct?", "options": ["My father drank a cup of tea in the morning and driven to work with his colleague.", "I wanted to watch the birds, but they had already flown away when I arrived.", "He sleeps for eight hours every night and went to bed at 9 p.m.", "She forgave him this time and given him another chance."]}, {"n": 52, "type": "text", "section": "Word choice & vocabulary", "stem": "Which group of words is appropriate for your story?", "options": ["diagnosis, floss, brush", "healthy teeth, friendly dentist, tooth fairy", "tooth extraction, pain, fluorides", "mouth wash, gum disease, orthodontics"], "passage": "<strong>Read the sentence.</strong><br><br>You are asked by your teacher to write a story for preschoolers about their first trip to the dentist."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
