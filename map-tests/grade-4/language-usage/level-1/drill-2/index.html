<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Language Usage (Level 1): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 1): Drill 2</div>
  <h2>MAP Grade 4 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 1): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 1): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-LANG-L1-D2";
const BANK_PATH = "map-tests/grade-4/language-usage/level-1/drill-2/bank.csv";
const TITLE = "MAP Grade 4 Language Usage (Level 1): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is grammatically correct?", "options": ["My cactus plant do not need to be watered every day.", "My cactus plant does not grow.", "It only need watering once a month.", "I buy the plant last week."]}, {"n": 2, "type": "text", "section": "Punctuation", "stem": "Which punctuation marks are missing from the sentences? Note that there is more than one correct answer.", "options": ["a period", "a question mark", "a comma", "a colon"], "passage": "<strong>Read the sentences.</strong><br><br>Soccer is one of the most popular games in the world Garry is watching a game now. Do you want to join him"}, {"n": 3, "type": "text", "section": "Composition & writing", "stem": "What is the most useful graphic organizer for presenting this data?", "options": ["a Venn diagram", "a pie chart", "a line graph", "a web diagram"], "passage": "<strong>Read the sentences.</strong><br><br>Alex is writing a paper about native English-speaking populations all over the world. He wants to show the proportion of native English speakers in several countries."}, {"n": 4, "type": "text", "section": "Grammar: usage", "stem": "Which word correctly completes the sentence?", "options": ["begun", "began", "begin", "begins"], "passage": "<strong>Read the sentence.</strong><br><br>She had already ___ to eat the sandwich when they sat at the table."}, {"n": 5, "type": "text", "section": "Capitalization", "stem": "Which word in the sentences should begin with a capital letter?", "options": ["sea", "salt", "lake", "world"], "passage": "<strong>Read the sentences.</strong><br><br>The Dead sea is a big salt lake. Due to the salt, it is very easy to float on the water. The Dead sea is also famous for being the lowest point in the world."}, {"n": 6, "type": "text", "section": "Composition & writing", "stem": "Which of the following is not a supporting detail in this paragraph?", "options": ["Members of Generation Z constitute about a quarter of the population in the US.", "Members of Generation Z can quickly and efficiently shift between work and play.", "Members of Generation Z are typically thought of as being comfortable with technology.", "Members of Generation Z interact on social media websites for a significant portion of their socializing."], "passage": "<strong>Read the paragraph.</strong><br><br>Students born from the mid-1990s to 2014 are considered part of Generation Z. They are the youngest generation and constitute about 25% of the population in the U.S. Members of Generation Z are typically thought of as being comfortable with technology, and they interact on social media websites for a significant portion of their socializing."}, {"n": 7, "type": "text", "section": "Grammar: usage", "stem": "Which one of the sentences is correctly written in future perfect tense?", "options": ["I will probably see you tomorrow at the party.", "By the time you finish it, I will have left.", "He will has been here for two months next week.", "They have been planning this for a long time."]}, {"n": 8, "type": "text", "section": "Spelling", "stem": "In which sentence is the underlined word spelled correctly?", "options": ["The old tree has long branches.", "My dad bought two new toolboxs.", "There were a lot of monarches in the Roman Empire.", "The teacher gave us three quizes last week."]}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Which of the following is appropriate content for a friendly letter?", "options": ["You are writing a letter to a video games' store, thanking them for the friendly service they gave you.", "You are writing a letter to a friend who lives in Europe and who you have not seen in two years.", "You are writing a letter informing your teacher you are going on a vacation with a friend of yours.", "You are writing a letter in which you ask to volunteer at a friendly animal shelter."]}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which writing genre is appropriate for Jennifer's purpose?", "options": ["Descriptive writing", "Poetry writing", "Narrative writing", "Persuasive writing"], "passage": "<strong>Read the prompt.</strong><br><br>Jennifer is writing a paper about junk food and why children should not consume much of it."}, {"n": 11, "type": "text", "section": "Grammar: usage", "stem": "Which word correctly completes the sentence?", "options": ["More busy", "Busier", "Busiest", "Busy"], "passage": "<strong>Read the sentence.</strong><br><br>This week was ___ than last week. I had a lot of meetings every day."}, {"n": 12, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly with exclamation marks?", "options": ["Wow! Did you see how far it went!", "I have two brothers and one sister!", "Stop! You are spilling all the milk!", "Bring me the towel from the kitchen, please!"]}, {"n": 13, "type": "text", "section": "Composition & writing", "stem": "What is the topic sentence of the paragraph?", "options": ["Blue whales can grow to 100 feet long.", "They consume millions of krill each day, and they can dive to a depth of 328 feet.", "The heart of a blue whale is about the size of a small car.", "Blue whale is the biggest animal in the world."], "passage": "<strong>Read the paragraph.</strong><br><br>The blue whale is the biggest animal in the world. Blue whales can grow to 100 feet long and weigh about 400,000 pounds. The heart of a blue whale is about the size of a small car. They consume millions of krill each day, and they can dive to a depth of 328 feet."}, {"n": 14, "type": "text", "section": "Grammar: parts of speech", "stem": "Which sentence is grammatically correct?", "options": ["My mother took us bowling, who can take a very long time.", "My friend bought a cat, whose is my favorite pet.", "We went yesterday to a park whom is located near our house.", "There is a sign on our street that tells drivers to drive slowly."]}, {"n": 15, "type": "text", "section": "Capitalization", "stem": "In which sentence are the words capitalized correctly?", "options": ["I was born in the south but grew up in New York.", "If you want to reach the beach, you must keep heading West.", "Turn Right at the end of the street and then Left.", "The new settlers decided to explore the East."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
