<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Language Usage (Level 3): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 3): Drill 2</div>
  <h2>MAP Grade 4 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 3): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 3): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-LANG-L3-D2";
const BANK_PATH = "map-tests/grade-4/language-usage/level-3/drill-2/bank.csv";
const TITLE = "MAP Grade 4 Language Usage (Level 3): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the sentences has the same meaning as the sentence above?", "options": ["He will not go to the concert even if you go.", "He will not go to the concert when you go.", "He will not go to the concert if you do not go.", "He will not go to the concert since you go."], "passage": "<p>Read the sentence.</p><p>He will not go to the concert unless you go.</p>"}, {"n": 2, "type": "text", "section": "Spelling", "stem": "Which of the words is spelled correctly?", "options": ["teleskope", "graveety", "tishoe", "molecule"]}, {"n": 3, "type": "text", "section": "Word choice & vocabulary", "stem": "Which mood does the writer try to convey in the paragraph?", "options": ["loneliness", "sadness", "anger", "horror"], "passage": "<p>Read the paragraph.</p><p>It was a rainy and dark night. My parents went to a concert and would return home late at night, so I was the only person in the house. I had already gone to bed when I suddenly heard the basement door squeaking. I thought that it was probably just the wind, but it wouldn't stop squeaking. I took out a flashlight and went quietly downstairs to the basement. When I finally reached the basement door, I saw my dog, Bucky, trying to open his screen door to the basement. It kept squeaking as he couldn't open it fully.</p>"}, {"n": 4, "type": "text", "section": "Sentence structure", "stem": "Which sentence best combines and revises these sentences?", "options": ["Dan takes art classes at Blackwell Community College because he enjoys these classes.", "Dan, who enjoys art classes, takes painting and sculpture classes at Blackwell Community College.", "Dan, who takes art classes in painting and sculpture, learns at Blackwell Community College.", "Blackwell Community College is the place where Dan takes his art classes in painting and sculpture."], "passage": "<p>Read the sentences.</p><p>Dan enjoys art classes. He takes classes in painting and sculpture. He takes the classes at Blackwell Community College.</p>"}, {"n": 5, "type": "text", "section": "Punctuation", "stem": "Which sentence is incorrectly punctuated with a hyphen?", "options": ["You should read the user-friendly guide before using the software.", "I have only three favorite colors- black, blue, and grey.", "Two-thirds of the students in school arrive with the school bus.", "There are twenty-seven students in the classroom."]}, {"n": 6, "type": "text", "section": "Composition & writing", "stem": "Which of the following characteristics describes fictional writing?", "options": ["It deals with concrete facts about real people or events.", "The expression of feelings in the writing is given using distinctive style and rhythm.", "It gives basic instructions and directions for doing or making something.", "It deals with imaginary characters and does not describe real people."]}, {"n": 7, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences is not grammatically correct?", "options": ["When I was in 4th grade, I kept my books in the locker.", "Under the sea, the most incredible creatures can be found.", "Early in the morning, I catched my cat trying to steal a cookie.", "Luckily for us, she hasn't forgotten to buy sunscreen."]}, {"n": 8, "type": "text", "section": "Capitalization", "stem": "Which title of a work of art is capitalized correctly?", "options": ["The Raft of the Medusa", "In Advance Of the Broken Arm", "Through The Night Softly", "I Love You With my Ford"]}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Which method of organization would be the most effective in writing this paper?", "options": ["sequence", "cause and effect", "problem and solution", "comparison-contrast"], "passage": "<p>You are asked to write a paper that describes two of the largest land animals in our planet, the African elephant and the hippopotamus.</p>"}, {"n": 10, "type": "text", "section": "Sentence structure", "stem": "Which type of sentence is this?", "options": ["compound sentence", "incomplete sentence", "complex sentence", "simple sentence"], "passage": "<p>Read the sentence.</p><p>If he ever gets a chance, Justin would like to visit his cousin who lives in New Zealand.</p>"}, {"n": 11, "type": "text", "section": "Composition & writing", "stem": "Which is the best way for you to revise your draft?", "options": ["Stay on the subject. Omit the sentence about wanting to be a doctor.", "Further explain why you wanted to be the fastest runner.", "Change some of the words so they sound more like something a doctor would say.", "Add a sentence at the beginning of the paragraph that explains why it is important to be in shape."], "passage": "<p>You are writing a short paragraph about how you felt one time when you were jogging.</p><p>One time I was jogging because I felt sad. I ran as fast as I could, but I was still sad. In the past, I used to run to be the fastest, but not anymore. Now I run to be healthy and in shape. I want to be a doctor because they cure people and help them feel better. By jogging, you can improve your fitness, both physical and mental.</p>"}, {"n": 12, "type": "text", "section": "Spelling", "stem": "In which of the sentences is the underlined word spelled correctly?", "options": ["My grandma has two very old pianoes in her house.", "I like to read poems from poetry anthologys before I go to bed.", "The last mammothes were extinct over ten thousand years ago.", "There are several kindergartens in my neighborhood."]}, {"n": 13, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following includes a metaphor?", "options": ["The police officer listened to her story with a poker face.", "My heart was beating fast as it was my turn to go on stage.", "It was freezing outside. My hands were as cold as ice.", "I was very surprised by her news as I was not expecting it."]}, {"n": 14, "type": "text", "section": "Spelling", "stem": "In which of the following sentences is the underlined compound noun written correctly?", "options": ["My friend has two father-in-laws.", "They are building three new parkings garage in town", "Your plan has some obvious drawsback.", "I bought two different bottle openers."]}, {"n": 15, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["\"My favorite fairy tale is \"The Adventures of Pinocchio,\" said Matt.", "\"Alex told me, 'Our training is on Sunday this week,\" said Manuel.", "\"Her friends sang 'Happy Birthday' to Emma, told Christina.", "\"The coach always tells us, \"The best defense is offence,\" said Garry."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
