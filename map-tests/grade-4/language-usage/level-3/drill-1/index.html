<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 4 Language Usage (Level 3): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 3): Drill 1</div>
  <h2>MAP Grade 4 Language Usage</h2>
  <p class="muted">15 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 3): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 4 Language Usage (Level 3): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G4-LANG-L3-D1";
const BANK_PATH = "map-tests/grade-4/language-usage/level-3/drill-1/bank.csv";
const TITLE = "MAP Grade 4 Language Usage (Level 3): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Grammar: parts of speech", "stem": "Which conjunctive adverb correctly completes the sentence?", "options": ["on the other hand", "nonetheless", "therefore", "subsequently"], "passage": "<p>Read the sentence.</p><p>It will be very hot tomorrow; ___, it would be wise to take a hat and put on some sunscreen.</p>"}, {"n": 2, "type": "text", "section": "Punctuation", "stem": "Which of the sentences is punctuated correctly?", "options": ["Ladies and gentlemen may I have your attention, please?", "It was nice, to meet you Sir.", "Rachel can you bring me a glass of water?", "Thank you, Manuel, for your help yesterday."]}, {"n": 3, "type": "text", "section": "Composition & writing", "stem": "Which source of information would be most useful for writing this essay?", "options": ["A history book that describes the events of the French Revolution", "A history book that overviews the causes and effects of the American Revolution", "A newspaper article about a fiction book that deals with the American Revolution", "A new action movie about the American Revolution"], "passage": "<p>Enrique is writing a research paper about the American Revolution.</p>"}, {"n": 4, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences has the same meaning as the sentence above?", "options": ["He doesn't really care which of the two chocolate bars you will pick; he will eat the first or the second one.", "He doesn't really care which of the two chocolate bars you will pick; he will eat them both.", "He doesn't really care which of the two chocolate bars you will pick; he will eat neither of them.", "He doesn't really care which of the two chocolate bars you will pick; otherwise he will eat them."], "passage": "<p>Read the sentence.</p><p>He doesn't really care which of the two chocolate bars you will pick; he will eat either of them.</p>"}, {"n": 5, "type": "text", "section": "Capitalization", "stem": "Which title is capitalized correctly?", "options": ["The Legend Of the Black Knight", "Stopping by the lake on a rainy morning", "The Tall Man and The Giraffe", "Fairy Tales of the Pharaohs in Egypt"]}, {"n": 6, "type": "text", "section": "Word choice & vocabulary", "stem": "Which words suggest a positive meaning?", "options": ["nosy, unusual, crazy", "curious, unusual, original", "curious, weird, original", "nosy, weird, crazy"], "passage": "<p>Read the sentences.</p><p>Judy is a very (nosy, curious) person. She also has (unusual, weird) problem-solving methods and her ideas are usually (crazy, original).</p>"}, {"n": 7, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences is a compound sentence?", "options": ["Dana and Ron walk to school together every day.", "The audience applauded and cheered the players.", "It was hot yesterday, so I wore short pants and a t-shirt.", "During the production of the film, there was a snowstorm."]}, {"n": 8, "type": "text", "section": "Word choice & vocabulary", "stem": "In which of the sentences is the underlined word used correctly?", "options": ["I excepted his offer to buy the tickets.", "All the players accept for the goalie wore long-sleeved shirts.", "Except for Jonathan, nobody liked the new play.", "Camilla likes all colors accept purple."]}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Which transitional words and phrases are found in the paragraph?", "options": ["yesterday, as well, consequently, nevertheless", "not to mention, consequently, nevertheless, after", "not to mention, as well, at all, after", "yesterday, that, consequently, so"], "passage": "<p>Read the paragraph.</p><p>Yesterday was my birthday party. I wasn't expecting so many people to arrive, not to mention that some people I didn't invite at all came as well. Consequently, we ran out of food and snacks. Nevertheless, everyone had great fun. After they all had left, my friend helped me clean the place.</p>"}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which of the following is an example of narrative writing?", "options": ["Biography", "Play", "Poem", "Recipe"]}, {"n": 11, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the nouns in the paragraph can be classified as abstract?", "options": ["childhood, parents, imagination", "book, reading, knowledge", "childhood, knowledge, imagination", "book, parents, reading"], "passage": "<p>Read the paragraph.</p><p>During my childhood, I really enjoyed reading books. My parents bought me my first book when I was eight years old. Reading can be very beneficial for you. It can expand your knowledge and help you develop a rich imagination.</p>"}, {"n": 12, "type": "text", "section": "Punctuation", "stem": "Which sentence is punctuated correctly?", "options": ["That explanation as I have said before, is not sufficient.", "The experiment, which was performed by the teacher, was successful.", "My brother who has black hair and green eyes is taller than me.", "You should, nevertheless continue training despite this recent disappointment."]}, {"n": 13, "type": "text", "section": "Composition & writing", "stem": "Which of the following is appropriate content for a memo?", "options": ["a greeting you write to a friend of yours for his birthday", "an explanatory essay that explains a certain scientific subject", "an invitation to the annual company picnic being held next week", "a review regarding a new book you have read"]}, {"n": 14, "type": "text", "section": "Grammar: usage", "stem": "Which of the sentences are written in active voice?", "options": ["(1), (2), (4)", "(1), (3), (4)", "(2), (4), (5)", "(2), (3), (5)"], "passage": "<p>Read the paragraph.</p><p>(1) Adriana has found an old recipe for a cake in the basement. (2) The recipe was written by her grandmother many years ago. (3) Adriana stayed in her grandmother's house during school vacations and holidays. (4) She enjoyed watching her grandmother cook. (5) Her grandmother was taught cooking by one of the greatest chefs in the US.</p>"}, {"n": 15, "type": "text", "section": "Capitalization", "stem": "Which sentence is capitalized correctly?", "options": ["\"Did you know,\" asked the teacher, \"There are some fish that can live out of water?\"", "\"Please tell your sister,\" said the girl on the phone, \"sharon will be there at 7:00\"", "\"Students,\" Mr. Hernandez instructed, \"please bring your history books tomorrow.\"", "\"this cake,\" Dana told her friend, \"is one of the best cakes I have ever tasted.\""]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
