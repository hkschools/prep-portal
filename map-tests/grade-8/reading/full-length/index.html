<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 8 Reading: Full-Length Practice Test</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 8 Reading: Full-Length Practice Test</div>
  <h2>MAP Grade 8 Reading</h2>
  <p class="muted">42 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 8 Reading: Full-Length Practice Test</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 8 Reading: Full-Length Practice Test</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G8-READ-FULL";
const BANK_PATH = "map-tests/grade-8/reading/full-length/bank.csv";
const TITLE = "MAP Grade 8 Reading: Full-Length Practice Test";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words has the same root as the word \"micromanagement\"?", "options": ["Microcosm", "Manager", "Unimaginable", "Engagement"]}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "Which of the following is a conclusion that can be made from the passage?", "options": ["Eyespots are the best way to avoid deathly attacks by predators.", "Predators can never distinguish between eyespots and true eyes.", "Eyespots are more efficient if found on both the left and right sides of the body.", "All fish have eyespots, but in some fish species, they cannot be seen."], "passage": "<strong>Read the passage</strong><br><br>When a predator attacks its prey it usually aims for the head, often locating the eyes. Many animals use diversion mechanisms; the most efficient is an eyespot, a marking that looks like an eye but isn't. Eyespots are common in fish such as the butterflyfish, which has a large eyespot near its tail while its real eye is hidden, and in some butterflies, whose wing eyespots cause birds to attack the wing instead of the head, letting the butterfly escape."}, {"n": 3, "type": "text", "section": "Detail & inference", "stem": "According to the passage, which of the following caused the natives of the new world to disappear?", "options": ["The mindset of the Spanish settlers that only they were allowed to live in the new world", "The natives' refusal to pay tribute and the Spaniards' reaction to this", "The arrival of vessels from England and France to the settlements of the new world", "A war of extermination against the seamen from Northern Europe"], "passage": "<strong>Read the passage</strong><br><br>From BUCCANEERS AND PIRATES OF OUR COASTS: After Columbus, Spain believed the whole undiscovered world belonged to her and that natives had no rights. If natives refused to pay tribute or toil for gold, or if English or French vessels traded at a settlement, a war of attempted extermination was waged. Under this treatment the natives weakened and gradually disappeared, but the buccaneers grew more numerous and powerful."}, {"n": 4, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following literary devices is present in the passage?", "options": ["Imagery", "Hyperbole", "Metaphor", "Allegory"]}, {"n": 5, "type": "text", "section": "Text structure", "stem": "What is the structure of the passage?", "options": ["cause and effect", "order of importance", "compare and contrast", "chronology"]}, {"n": 6, "type": "text", "section": "Vocabulary in context", "stem": "If the meaning of the prefix \"iso-\" is \"equal,\" which of the following might be described as \"isomagnetic\"?", "options": ["something with a big magnetic force", "something with insignificant magnetic force", "something with the same magnetic force", "something without any magnetic force"]}, {"n": 7, "type": "text", "section": "Main idea & theme", "stem": "What is the author's viewpoint?", "options": ["It is a good idea to have more movies with strong heroines.", "Moana is the best animated film ever made.", "Animated films should avoid romance entirely.", "Children should not watch action films."], "passage": "<strong>Read the passage</strong><br><br>A conversation about the film Moana in which the speakers note that Moana saves the day herself and agree it is refreshing to see a heroine like her."}, {"n": 8, "type": "text", "section": "Text structure", "stem": "When should the dry ingredients be added to the wet mixture?", "options": ["in the beginning, when they are all mixed together", "after the butter comes to a boil", "after the wet mixture becomes shiny and smooth", "just before the mixture is stirred and scraped into the pan"], "passage": "<strong>Read the passage</strong><br><br>A brownie cake recipe. The dry ingredients (flour, cocoa powder, salt, baking powder) are whisked and set aside, the butter and sugar are melted and cooled, eggs and vanilla are whisked in until shiny and smooth, then the set-aside dry ingredients are stirred in and the batter is scraped into the pan and baked."}, {"n": 9, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the story?", "options": ["Landon does not like math.", "Landon gets help from an unexpected source.", "Robin comes to a decision.", "Robin sacrifices his only free time to help Landon."], "passage": "<strong>Read the passage</strong><br><br>Landon was anxious about a math test until he received help from an unexpected source, so that by the day of the test he felt ready and more relaxed than he had all week."}, {"n": 10, "type": "text", "section": "Detail & inference", "stem": "Why did Rowling not sign her full name on the Harry Potter books?", "options": ["because she wanted to become a billionaire", "because her publisher thought it was important to donate a lot of money to charity", "because she had a low self-esteem at the time", "because her publisher thought the book would be less successful if she did"], "passage": "<strong>Read the passage</strong><br><br>J. K. Rowling's rags-to-riches story: after hardship she wrote Harry Potter while unemployed. Bloomsbury agreed to publish it but asked her to use her initials because the publisher believed female authors' names were less appealing to young boys. The books became an instant success and made her a fortune."}, {"n": 11, "type": "text", "section": "Vocabulary in context", "stem": "Which possible meanings does the word \"terrific\" have in the sentence?", "options": ["long or short", "worrying or relaxing", "marvelous or delicious", "intense or frightful"], "passage": "<strong>Read the passage</strong><br><br>Owing to a terrific storm, the captain of the ship had to postpone his departure."}, {"n": 12, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences is NOT using a persuasive technique?", "options": ["\"... there's a lumpy garbage bag tied up on the floor, with ends of plastic utensils sticking out from holes that they made...\"", "\"Are you tired of these thin, inflexible, pathetic garbage bags...?\"", "\"What's the point of getting a large garbage bin if the bag that fits it can't contain the garbage?\"", "A neutral descriptive sentence with no persuasive intent."]}, {"n": 13, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following is most likely the definition of the word \"valetudinarian\"?", "options": ["Someone who is stubborn and set in his ways", "Someone who is cowardly and does not like to try new or adventurous things", "A health professional who specializes in valerian treatment", "Someone who is prone to and scared of sickness or overly concerned with his health"]}, {"n": 14, "type": "text", "section": "Author's craft & structure", "stem": "Which type of conflict is developed over the second half of this passage, starting from the first quote that begins \"Hold on...\"?", "options": ["Character vs. Character, between Tom and Sid", "Character vs. Society, between Tom and a society that disapproves of his behavior", "Character vs. Self, between Aunt Polly's conflicting emotions", "Character vs. Nature."], "passage": "<strong>Read the passage</strong><br><br>From Tom Sawyer: Aunt Polly catches Tom and starts to punish him, then wavers as her affection and her sense of duty pull against each other."}, {"n": 15, "type": "text", "section": "Main idea & theme", "stem": "What is the main idea of the passage?", "options": ["Humanity will definitely live on Mars one day.", "Living on Mars would be possible but would face many serious challenges.", "Mars is too far away to ever reach.", "The low gravity on Mars is harmless to humans."], "passage": "<strong>Read the passage</strong><br><br>The passage asks whether humanity can live on Mars. It explains reasons people might migrate, then describes why survival would be hard: water must be produced from ice, the soil detoxified, regular transports from Earth would be needed, and low gravity could harm the human body."}, {"n": 16, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following is a synonym of the word \"copious\"?", "options": ["amount", "spotless", "plentiful", "lonely"]}, {"n": 17, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences from the passage contains an idiom?", "options": ["It can be hard to wrap your head around the huge size of the universe and the tiny size of an atom.", "You could read thousands of science books and still not get a sense for it.", "A short video called Powers of Ten provides a guided tour of the universe in just eight minutes.", "At the end of the video the viewer feels like both an ant and a giant."]}, {"n": 18, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an example of alliteration?", "options": ["lonely lasses, lazy lads", "cherubs in clouds and cinnamon bread", "they weep and sweep and fall asleep", "muttering indistinctly under his breath"]}, {"n": 19, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is an example of alliteration?", "options": ["a phrase repeating the same beginning consonant sound", "a phrase comparing two things with \"like\"", "a phrase that exaggerates for effect", "a phrase using a word that imitates a sound"]}, {"n": 20, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following arguments uses the LEAST valid reasoning?", "options": ["\"Choosing clothes is one of the main ways people express their personalities.\"", "\"Wearing uniforms makes students all look the same, which builds a sense of community.\"", "\"Wearing uniforms does not help students learn any better, and instead makes school more boring.\"", "\"When uniforms are required, parents must buy clothes that can only be worn to school, which is inefficient.\""]}, {"n": 21, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the word \"bidirectional\"?", "options": ["in one direction", "in two directions", "in three directions", "in four directions"]}, {"n": 22, "type": "text", "section": "Vocabulary in context", "stem": "What is the meaning of the word \"bidirectional\" as used? (LEAST valid reasoning item continued.)", "options": ["in one direction", "in two directions", "in three directions", "in four directions"]}, {"n": 23, "type": "text", "section": "Author's craft & structure", "stem": "Which passage is foreshadowing which?", "options": ["Passage 1 is foreshadowing passage 4.", "Passage 2 is foreshadowing passage 3.", "Passage 3 is foreshadowing passage 1.", "Passage 2 is foreshadowing passage 4."], "passage": "<strong>Read the passage</strong><br><br>From Charlotte's Web: Templeton questions the goose about the eighth, unhatched egg (a 'dud'), and later that dud egg becomes important, an example of foreshadowing across the passages."}, {"n": 24, "type": "text", "section": "Author's craft & structure", "stem": "Which passage is foreshadowing which? (second part)", "options": ["Passage 1 is foreshadowing passage 4.", "Passage 2 is foreshadowing passage 3.", "Passage 3 is foreshadowing passage 4.", "Passage 4 is foreshadowing passage 1."]}, {"n": 25, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following best identifies the foreshadowing relationship?", "options": ["Passage 1 foreshadows passage 2.", "Passage 2 foreshadows passage 3.", "Passage 3 foreshadows passage 4.", "Passage 4 foreshadows passage 1."]}, {"n": 26, "type": "text", "section": "Detail & inference", "stem": "Which of the following can be inferred from the author's attitude toward the live-action film adaptation of Avatar: The Last Airbender?", "options": ["The author cannot remember much about the film.", "The original show was so successful that it inspired a live-action film.", "The author believes that the film did not live up to the reputation of the original animated series.", "The author did not watch the film because they disliked the original."]}, {"n": 27, "type": "text", "section": "Main idea & theme", "stem": "Which of the following best describes the theme of the poem?", "options": ["There is no feeling as sweet as success.", "Success is only fully understood by those who are victorious in battle.", "Success is only truly coveted and understood best by those who failed to achieve it.", "Success is never enjoyed once it is actually achieved."], "passage": "<strong>Read the passage</strong><br><br>Emily Dickinson's 'Success is counted sweetest': Success is counted sweetest by those who ne'er succeed; the dying, defeated soldier understands victory's meaning more clearly than the victors."}, {"n": 28, "type": "text", "section": "Detail & inference", "stem": "Which of the following can you infer about the author's attitude toward deforestation?", "options": ["The author believes that deforestation is the world's worst environmental problem.", "The author is more concerned about logging operations than about insects and tree diseases.", "The author does not believe society can find a balance between forest preservation and economic development.", "The author thinks more could be done to protect forests, but a balance is possible."]}, {"n": 29, "type": "text", "section": "Vocabulary in context", "stem": "Which definition of the word \"tone\" is used in the above sentence?", "options": ["definition 1", "definition 2", "definition 3", "definition 4"]}, {"n": 30, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following statements accurately describes how the author utilizes allusions to affect the tone of the passage?", "options": ["The author makes references to famous people and events in order to make the text sound less formal and more welcoming.", "The author alludes to pop culture and sports in order to make the text more interesting.", "The author uses interesting analogies in order to explain difficult ideas.", "The author quotes experts to add authority."]}, {"n": 31, "type": "text", "section": "Text structure", "stem": "Which of these sentences accurately describes the main point of the paragraph indicated in parentheses, NOT the main point of the passage?", "options": ["The Brown Argus butterfly is thriving in spite of global climate change (paragraph 1).", "The Brown Argus butterfly eats wild geranium in hot summers and lives in southern England (paragraph 2).", "While climate change has negative effects, some species benefit (paragraph 3).", "A fourth summary statement about the passage as a whole."]}, {"n": 32, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following words should be added into the passage in the indicated space?", "options": ["postpone", "prevent", "prolong", "procrastinate"]}, {"n": 33, "type": "text", "section": "Detail & inference", "stem": "Which of the following conclusions can be drawn from the chart?", "options": ["Of the three categories, customer service is the strongest area of the company.", "The customer service representatives are better at handling phone calls than answering e-mails.", "Sales of new products are helping to make up for a gap left by older products.", "The area that needs the most improvement is product quality."]}, {"n": 34, "type": "text", "section": "Author's craft & structure", "stem": "How does the setting outlined in the passage contribute to the narrator's feeling as it is described in the final paragraph?", "options": ["The red room is formidable and intimidating and therefore the narrator is afraid.", "The red room is bright and cheerful and therefore the narrator feels relaxed and happy.", "The red room is detached from the rest of the house and therefore the narrator feels free.", "The red room is plain and therefore the narrator feels bored."], "passage": "<strong>Read the passage</strong><br><br>From Jane Eyre by Charlotte Brontë: the narrator is shut in the cold, seldom-used red room, whose imposing, shadowy details fill her with dread."}, {"n": 35, "type": "text", "section": "Text structure", "stem": "What is the main purpose of the sidebar next to the article?", "options": ["To provide additional details about Tycho Brahe's techniques.", "To provide more background information and context about what astronomy was in Kepler's time.", "To connect ancient astronomy with contemporary astronomy.", "To show the reader how to make astronomical observations without using a telescope."]}, {"n": 36, "type": "text", "section": "Main idea & theme", "stem": "What is the common theme shared between each of these four passages?", "options": ["The hardships of immigrant life on the frontier.", "The changing yet enduring and unique friendship between Jim (the narrator) and Antonia.", "The importance of education for young people.", "The beauty of the natural landscape."]}, {"n": 37, "type": "text", "section": "Vocabulary in context", "stem": "Based on your knowledge of Greek and Latin roots, what is the meaning of the word \"homogeneous\"?", "options": ["of the same size", "of the same type", "of different shape", "of different color"]}, {"n": 38, "type": "text", "section": "Author's craft & structure", "stem": "What does this change about the message of the passage that the reader is meant to understand, as opposed to its literal meaning?", "options": ["The garden isn't actually beautiful, but rather repulsive.", "It is ironic that gardens are rarely ever seen by others when they are at their best.", "The visitors don't actually always miss the high points of the garden, but rather they see them.", "The gardener dislikes visitors."]}, {"n": 39, "type": "text", "section": "Main idea & theme", "stem": "How does the word \"fear\" in the last paragraph help the reader understand the main idea of the passage?", "options": ["It shows the narrator is a coward.", "It emphasizes how dangerous the journey was.", "It reveals that overcoming fear is central to the passage's message.", "It indicates the setting is frightening."]}, {"n": 40, "type": "text", "section": "Main idea & theme", "stem": "Which is the best summary of the poem?", "options": ["The speaker tells a story about meeting a talking statue in the desert that thinks it is a king.", "The speaker hears a story about a broken statue in the desert that depicts an ancient powerful king.", "The speaker tells a story about a cruel king who started many wars.", "The speaker describes building a monument to a king."], "passage": "<strong>Read the passage</strong><br><br>From 'Ozymandias' by Percy Bysshe Shelley: a traveller describes a shattered statue half-sunk in the desert, inscribed with a boast of the king's greatness, while \"the lone and level sands stretch far away.\""}, {"n": 41, "type": "text", "section": "Vocabulary in context", "stem": "Which of the following sentences most closely reflects the meaning of the sentence above?", "options": ["The owner tried to dry his car too quickly and carelessly and left streak marks on it.", "The owner's poor attempt to dry his wet car was the cause of the streaks found on it.", "Streaks were formed on the car as dust settled to the bottom of the water left behind.", "The streaks were created abruptly by the forceful way the owner dried his car."], "passage": "<strong>Read the passage</strong><br><br>Read the sentence and thesaurus entry: \"The streak marks on the car were a precipitate of its owner's inadequate attempt to dry it.\" Precipitate (noun): a product, outcome, or occurrence traceable to a specified cause or action."}, {"n": 42, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following best describes the tone of the passage?", "options": ["Light, humorous, and ironically serious at times", "Intellectual, witty, and urgently informative throughout", "Insightful, sarcastic, and subliminally critical", "Exciting and blunt, yet cautiously directional at the same time"], "passage": "<strong>Read the passage</strong><br><br>A whimsical passage imagining that chess was invented by a woman, explaining the powers and movements of the queen, bishops, knights, and other pieces as a reflection of life in a priest-ridden land."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
