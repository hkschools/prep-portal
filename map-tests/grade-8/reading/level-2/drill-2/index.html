<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 8 Reading (Level 2): Drill 2</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 8 Reading (Level 2): Drill 2</div>
  <h2>MAP Grade 8 Reading</h2>
  <p class="muted">7 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 8 Reading (Level 2): Drill 2</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 8 Reading (Level 2): Drill 2</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G8-READ-L2-D2";
const BANK_PATH = "map-tests/grade-8/reading/level-2/drill-2/bank.csv";
const TITLE = "MAP Grade 8 Reading (Level 2): Drill 2";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Main idea & theme", "stem": "What is the theme of the passage?", "options": ["Nature can cheer you up.", "Locking someone in a castle is wrong.", "Darkness takes over.", "Loneliness is difficult."], "passage": "<strong>Read the passage</strong><br><br>Ferdinand was sitting in the dark castle, looking outside the small window. The view, which might have been beautiful to a stranger, only depressed him. Everywhere he looked, he could only see trees and a big river. There were no birds, no houses, not a soul in sight. The castle, too, was abandoned and so silent that Ferdinand could hear his own breaths, slow and hollow. Ferdinand sighed as the sky darkened; clouds were gathering, and the air was filled with the smell of rain, which did nothing to comfort his forlorn and desperate soul. A storm began suddenly, and his vision was blurred in the heavy sheets of rain. Ferdinand cried, but there was no one to hear him."}, {"n": 2, "type": "text", "section": "Detail & inference", "stem": "Which of the following is correct, according to the passage?", "options": ["McDaniel was a successful actress from the moment she started her career.", "McDaniel was accepted to a minstrel show because of her career as a professional singer.", "McDaniel lost several acting parts because she was better known as a singer and comedian.", "McDaniel won an Oscar for a part she had not believed she would get."], "passage": "<strong>Read the passage</strong><br><br>Hattie McDaniel (1895-1952) was an American stage actress, singer-songwriter, and comedian. Born in Kansas, she was the youngest of thirteen children, and several of her family members had performing skills. At first, Hattie worked with her brother's minstrel show, writing and performing songs, and later, she embarked on a radio career as a professional singer. She recorded many songs before the Great Depression in 1929, which was a big economic crisis, and many people, including McDaniel, lost their jobs.<br><br>In 1931, McDaniel moved to Los Angeles and started working as an actress in films. She had several small roles in various films throughout the 1930s, many uncredited. However, towards the end of the 1930s, she was chosen to play a supporting part in Gone with the Wind, a very famous and successful movie at the time, and played the slave of the house. The competition for the role had been fierce: Eleanor Roosevelt, who was First Lady, wrote to the producer of the film and asked that her own maid be given the part; McDaniel did not believe she could win, but she still went to the audition wearing an authentic maid's uniform and won the part. Gone with the Wind is the most successful film in box-office history and is still regarded as one of the greatest films of all time.<br><br>The role of the slave in Gone with the Wind was extremely popular, and McDaniel won the 1939 Academy Award for Best Supporting Actress, the first Afro-American to win an Oscar. She was also the first Afro-American to be nominated for an Oscar. She played in over 300 movies over the years. Nowadays, she has two stars on the Hollywood Walk of Fame."}, {"n": 3, "type": "text", "section": "Vocabulary in context", "stem": "What is the connotation of the word \"without\" as it is used in the passage at the end of the third paragraph and the beginning of the fourth?", "options": ["Not having; indicating the absence of something", "Outside; being on or reaching the outer side of something", "Beyond; past something in distance", "Inside; existing on or reaching through to the inside of something"], "passage": "<strong>Read the passage</strong><br><br>Read the following passage from the biography of John Wilkes Booth that accounts the moments leading up to his assassination of President Abraham Lincoln.<br><br>The curtain had arisen on the third act, Mrs. Mountchessington and Asa Trenchard were exchanging vivacious stupidities, when [..] J. Wilkes Booth [..] appeared before the open door of the President's box, and prepared to enter.<br><br>The servant who attended Mr. Lincoln said politely, \"this is the President's box, sir, no one is permitted to enter.\" \"I am a senator,\" responded the person, \"Mr. Lincoln has sent for me.\" The attendant gave way, and the young man passed into the box.<br><br>As he appeared at the door, taking a quick, comprehensive glance at the interior, Major Rathbone arose. \"Are you aware, sir,\" he said, courteously, \"upon whom you are intruding? This is the President's box, and no one is admitted.\" The intruder answered not a word. Fastening his eyes upon Mr. Lincoln, who had half turned his head to ascertain what caused the disturbance, he stepped quickly back without the door.<br><br>Without this door there was an eyehole, bored it is presumed on the afternoon of the crime, while the theater was deserted by all save a few mechanics. Glancing through this orifice, John Wilkes Booth espied in a moment the precise position of the President."}, {"n": 4, "type": "text", "section": "Author's craft & structure", "stem": "Which one of the following statements in the passage states an opinion?", "options": ["Organisms need food to be able to keep their bodies working properly.", "Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty.", "The question of whether or not large amounts of fat are healthy is controversial.", "Fat is found in two main forms: saturated and unsaturated. Unsaturated fats are the healthier option."], "passage": "<strong>Read the passage</strong><br><br>Those who choose to study nutrition focus on the scientific side of the food we consume. Nutrition provides the cells of an organism with food. Organisms need food to be able to keep their bodies working properly. They also need food to be able to do certain things. Malnutrition can occur when a person does not eat the right amount of nutrients. This person can get better by changing his or her diet so it has the right amount of nutrients.<br><br>The six main types of nutrients are carbohydrates, fats, minerals, protein, vitamins, and water.<br><br>Carbohydrates, which are complex structures of sugar units, constitute a large part of common foods such as bread, rice, potatoes, fruit, and vegetables. Complex carbohydrates are more nutritious than simple carbohydrates, but they are also less tasty. They take longer to digest, and because they stay in the stomach longer, they leave the person who has eaten them feeling fuller for longer.<br><br>Protein makes up every cell and organ in an organism's body, including the skin, hair, nails, etc. It also makes up enzymes, which are structures that accelerate chemical reactions in the body. Proteins consist of small units called amino acids. There are twenty amino acids the human body cannot produce internally and must therefore receive from nutrition. Protein is found in meat, eggs, dairy products, and legumes such as beans.<br><br>Fat is found in foods such as avocado, sesame, meat, butter, nuts, etc. Many people think consuming a lot of fat is always unhealthy. However, the question of whether or not large amounts of fat are healthy is controversial. Fat is found in two main forms: saturated and unsaturated. Unsaturated fats are the healthier option.<br><br>Vitamins and minerals are found in many different foods; they are essential to the body, but in small doses. Vitamin or mineral deficiency may lead to serious diseases, and excessive levels may also be dangerous.<br><br>Water, the final nutrient, makes up more than half of the human body weight. It is essential for any life form. In most countries, tap water is a safe water source to drink from. The amount of water recommended for daily consumption varies, depending on age, physical activity, outside temperature, and personal health."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following sentences is an example that the author is biased?", "options": ["It is a recessive trait, which means you have to get the trait from both your parents in order to have it.", "If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world.", "You might be interested to know that red hair used to be considered an evil trait.", "Red-haired people were persecuted because they were believed to be vampires."], "passage": "<strong>Read the passage</strong><br><br>Red hair is uncommon, occurring in about 1%-2% of people. It is a recessive trait, which means you have to get the trait from both your parents in order to have it. If you have a red-haired parent and a red-haired grandparent on the other side, you have a high chance to be one of the lucky few people with red hair in this world. Then again, you still may not have red hair. You might be interested to know that red hair used to be considered an evil trait. Red-haired people were persecuted by people who believed they were vampires."}, {"n": 6, "type": "text", "section": "Detail & inference", "stem": "Which of the following is likely, according to the passage?", "options": ["Don McPherson is not color-blind.", "More men have diabetes than women.", "Don McPherson's glasses will work at night, too.", "When the rod cells are malfunctional, a person will not see colors at all."], "passage": "<strong>Read the passage</strong><br><br>The human eye has two types of cells responsible for vision: rod cells, which are responsible for night vision, and cone cells, which are responsible for color vision and function best in bright light. Therefore, it is much more difficult to see color in the darkness. There are three types of cone cells, each type responsible for a different range of colors.<br><br>Color blindness is the disability to distinguish between all or specific colors. Some people are completely color blind, which means they cannot see colors at all, but this is extremely rare. Usually, only one type of the cone cells is problematic, and therefore, color-blind people can usually still see some color. Among those who have a decreased ability to tell the difference between certain colors, there are two major groups: those who have difficulty distinguishing between red and green, which is the most common condition and affects about 80% of color-blind people, and those who have difficulty distinguishing between blue and yellow.<br><br>Color blindness is a hereditary trait which is more common among men. Around 8% of men and 0.5% of women have this trait. Color blindness may also be non-hereditary and occur as a result of a disease, such as diabetes.<br><br>There is no cure for color blindness. However, there are special glasses that allow people with red-green color blindness to see colors in bright light. The glasses were originally developed to help surgeons see more clearly in the operating room. The fact that they could help color-blind people, as well, was discovered by chance when scientist Don McPherson was wearing the glasses while playing ultimate Frisbee with his friend. McPherson's friend asked to borrow his eyewear, and as he put them on, he was amazed by his sudden ability to see color. McPherson then went ahead to perform research on color blindness, and after some small adjustments, began to sell the glasses to the public."}, {"n": 7, "type": "text", "section": "Main idea & theme", "stem": "What is the theme of the following poem?", "options": ["Becoming your best self", "Finding your true love to spend your life with", "Growing up and remembering your childhood", "Reproducing to renew your life and live beyond it"], "passage": "<strong>Read the passage</strong><br><br>Read the following Shakespearian sonnet.<br><br>Look in thy glass, and tell the face thou viewest<br>Now is the time that face should form another;<br>Whose fresh repair if now thou not renewest,<br>Thou dost beguile the world, unbless some mother.<br>For where is she so fair whose unear'd womb<br>Disdains the tillage of thy husbandry?<br>Or who is he so fond will be the tomb<br>Of his self-love, to stop posterity?<br>Thou art thy mother's glass, and she in thee<br>Calls back the lovely April of her prime:<br>So thou through windows of thine age shall see<br>Despite of wrinkles this thy golden time.<br>But if thou live, remember'd not to be,<br>Die single, and thine image dies with thee."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
