<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 8 Reading (Level 3): Drill 1</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 8 Reading (Level 3): Drill 1</div>
  <h2>MAP Grade 8 Reading</h2>
  <p class="muted">10 questions. Read each passage, then choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 8 Reading (Level 3): Drill 1</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 8 Reading (Level 3): Drill 1</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G8-READ-L3-D1";
const BANK_PATH = "map-tests/grade-8/reading/level-3/drill-1/bank.csv";
const TITLE = "MAP Grade 8 Reading (Level 3): Drill 1";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Vocabulary in context", "stem": "If someone were described as both \"naughty\" and \"nice\" in England in the 1300s, what might one conclude?", "options": ["This is a poetic and paradoxical description that uses seemingly contradictory terms to imply that he is both bad and good.", "This is a complex person who is generally disobedient and often does bad things, but he is also very friendly and kind.", "This person is severely lacking in both money and knowledge, making him poor and stupid.", "There are numerous different things that this description could mean over that time period, including evil and careless, as well as poor and careful, and both words could even mean that he is needy."], "passage": "<strong>Read the passage</strong><br><br>Use the etymological entries below. Naughty: from Old English \"nawiht\" meaning \"nothing\"; when adopted by Early Middle English in the 1300s it described a poor or needy person who has nothing, only later gaining the sense of \"evil\" and then mild \"disobedience.\" Nice: from Latin \"nescius\" meaning \"not knowing\"; in England in the 1300s it meant ignorant or stupid, and only over later centuries shifted through meanings to finally mean \"kind.\""}, {"n": 2, "type": "text", "section": "Author's craft & structure", "stem": "How would one best describe the attitude of the speaker throughout his address?", "options": ["He is indeed sorry for what he did, but he honestly thinks that the incident was somewhat blown out of proportion.", "He is bitter towards his fans and critics, and he finds it absurd that anyone expects him to apologize.", "He is sincerely apologetic for offending his fans and followers, he feels awful for disappointing them, and he appreciates their hurt.", "He is thankful for the advice and constructive criticism that he received, and he wishes to improve and regain their trust."], "passage": "<strong>Read the passage</strong><br><br>An actor delivers an over-the-top address \"apologizing\" to fans for missing a movie premiere because of a migraine and a cold. He thanks his critics for disrupting his sleep, calls their attacks \"noble,\" claims he ruined all their lives by wasting \"three minutes,\" and says an actor who gets migraines is \"unfit to appear in any movie whatsoever.\" The tone is heavily sarcastic and exaggerated throughout."}, {"n": 3, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following accurately describes the persuasive techniques that the speaker uses in his address? (Select all that apply.)", "options": ["The speaker appeals to the pathos of his fans and critics with emotive language in order to convince them that he is sincerely sorry.", "The speaker uses descriptive language in order to appeal to the senses of his audience.", "The speaker uses strong language, particularly poetic-sounding adjectives and adverbs, in order to convince his audience of his sincerity.", "The speaker appeals to the logos of his fans and critics, using logical arguments, anecdotes, and factual evidence to convince them that he did nothing wrong.", "The speaker uses hyperbole to make his message sound even stronger; and uses irony and sarcasm to draw attention to the foolishness of the criticisms against him."], "passage": "<strong>Read the passage</strong><br><br>An actor delivers an over-the-top address \"apologizing\" to fans for missing a movie premiere because of a migraine and a cold. He thanks his critics for disrupting his sleep, calls their attacks \"noble,\" claims he ruined all their lives by wasting \"three minutes,\" and says an actor who gets migraines is \"unfit to appear in any movie whatsoever.\" The tone is heavily sarcastic and exaggerated throughout."}, {"n": 4, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following excerpts from the passage is an example of exposition?", "options": ["I didn't care that it was cloudy, I just felt that the sky was misbehaving, as if it hadn't cleaned up its room.", "\"Turn here,\" I said to Ezra, \"it's a shortcut.\"", "Ezra was pretty good with directions, and he was especially familiar with this neighborhood. A few years back he lived in an apartment just two blocks away.", "But I knew the streets themselves. I knew their attitudes, their personalities."], "passage": "<strong>Read the passage</strong><br><br>Ezra and I were breezing through the crowded New York City streets as if the city were our backyard. The narrator, Jake, imagines the cloudy sky as a child who hasn't cleaned its room and argues with Ezra about whether climbing a fenced alleyway is really a shortcut. Jake believes he knows the streets' personalities, while Ezra simply knows how to get places."}, {"n": 5, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is the BEST description of the overall effect that the narrator's perspective has on the passage?", "options": ["It helps the reader understand how a path that takes more time can still be a shortcut.", "It compels the reader to take Jake's side, such as in the argument about the shortcut.", "It gives the reader a better understanding of where they are and what is going on by delving deep into the scenery.", "It makes the story more interesting by providing a unique understanding of certain things that would otherwise be insignificant, such as the sky and the streets."], "passage": "<strong>Read the passage</strong><br><br>Ezra and I were breezing through the crowded New York City streets as if the city were our backyard. The narrator, Jake, imagines the cloudy sky as a child who hasn't cleaned its room and argues with Ezra about whether climbing a fenced alleyway is really a shortcut. Jake believes he knows the streets' personalities, while Ezra simply knows how to get places."}, {"n": 6, "type": "text", "section": "Text structure", "stem": "Which individual word in the sentence indicates a cause-and-effect relationship between two of the clauses? (Write the word exactly as it appears.)", "options": ["so", "since", "around", "started"], "passage": "<strong>Read the sentence</strong><br><br>Since last winter, around the time Jiaying started her new job, she had been experiencing effects of high stress levels, so she decided to take a short vacation."}, {"n": 7, "type": "text", "section": "Author's craft & structure", "stem": "Which of the following is true about the form and structure of the poem?", "options": ["The poem maintains a consistent rhyme scheme.", "The poem maintains a consistent pattern of meter.", "Each line of the poem is in tetrameter form.", "The poem is a limerick."], "passage": "<strong>Read the passage</strong><br><br>Read the following poem by Emily Dickinson: \"I'm nobody! Who are you? / Are you nobody, too? / Then there's a pair of us—don't tell! / They'd banish us, you know. / How dreary to be somebody! / How public, like a frog / To tell your name the livelong day / To an admiring bog!\""}, {"n": 8, "type": "text", "section": "Author's craft & structure", "stem": "How does the narrator's specific choice and usage of the word \"right\" in the second-to-last sentence of the first paragraph affect the meaning of the sentence?", "options": ["It deliberately portrays the \"sushi haters\" argument in a way that makes it sound less credible.", "It uses sarcasm and hyperbole to express how much the narrator disagrees with the sushi haters.", "It asserts that the \"sushi haters\" don't believe that sushi can taste good because of its odd ingredients.", "It proclaims that since sushi is strange, people should legitimately not be allowed to think that it tastes good."], "passage": "<strong>Read the passage</strong><br><br>One of the most popular foods across many cultures is sushi. The narrator notes that \"sushi haters\" point out the oddity of raw fish in vinegared rice \"as if it should somehow mean that sushi does not have a right to taste good,\" then explains that sushi evolved slowly over thousands of years from ancient Chinese narezushi to the modern Japanese dish."}, {"n": 9, "type": "text", "section": "Detail & inference", "stem": "Which of the following things can be inferred about the narrator's attitude toward sushi? (Select all that apply.)", "options": ["The narrator thinks that sushi tastes good.", "The narrator thinks that sushi is strange.", "Sushi looks unappealing to the narrator.", "The narrator thinks that \"sushi haters\" judge sushi unfairly."], "passage": "<strong>Read the passage</strong><br><br>One of the most popular foods across many cultures is sushi. The narrator describes sushi as \"strangely appealing\" and a \"delicious abnormality,\" mocks \"sushi haters\" for judging it unfairly because of its odd ingredients, and recounts the long history of how sushi evolved."}, {"n": 10, "type": "text", "section": "Vocabulary in context", "stem": "What does the word \"ostentatious\" mean?", "options": ["Glamorous and exceptionally pretty", "Revealing and provocative", "Blatantly attention-grabbing", "Shiny and repulsive"], "passage": "<strong>Read the sentence</strong><br><br>Jasmin did not want to wear that outfit to the party because it had far too many diamonds for her taste; she felt that it was too ostentatious, and she preferred to stay modest and unnoticed."}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
