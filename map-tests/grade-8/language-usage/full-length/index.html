<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP Grade 8 Language Usage: Full-Length Practice Test</title>
<style>
:root{--navy:#27406b;--blue:#2f6db5;--light:#eef3f9;--muted:#6b7280;--line:#dce3ea;--ink:#1c2733}
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);margin:0;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.testtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
h2{color:var(--navy);margin:0 0 6px}.muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#fff}
.passage{background:var(--light);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px;white-space:normal}
.stem{font-weight:700;font-size:17px;margin:6px 0 14px;white-space:pre-line}
.opts label{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opts label:hover{border-color:var(--blue);background:#f7fafe}
.opts input{margin-right:10px}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.bar{height:6px;background:var(--light);border-radius:4px;margin:14px 0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);width:0}
.rev .ri{border-top:1px solid var(--line);padding:12px 0}.qn{color:var(--muted);font-size:12px}
.ans{margin:5px 0;padding:6px 10px;border-radius:8px}.ok{background:#e7f6ec;color:#1a7f37}.yourwrong{background:#fdecea;color:#c0392b}
.why{color:var(--muted);font-size:13px;margin-top:4px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<div id="start">
  <div class="testtitle">MAP Grade 8 Language Usage: Full-Length Practice Test</div>
  <h2>MAP Grade 8 Language Usage</h2>
  <p class="muted">40 questions. Choose the best answer. One question per screen.</p>
  <div class="card">
    <p><label>Full name<br><input type="text" id="sname" autocomplete="name"></label></p>
    <p><label>Email<br><input type="text" id="semail" autocomplete="email"></label></p>
    <button class="primary" id="startBtn">Start →</button>
  </div>
</div>

<div id="quiz" style="display:none">
  <div class="testtitle">MAP Grade 8 Language Usage: Full-Length Practice Test</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="qcard"></div>
  <button class="primary" id="nextBtn" disabled>Next →</button>
</div>

<div id="result" style="display:none">
  <div class="testtitle">MAP Grade 8 Language Usage: Full-Length Practice Test</div>
  <h2 id="scoreLine"></h2>
  <table id="secTable" style="border-collapse:collapse;margin:10px 0"></table>
  <div id="reviewArea" class="rev"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTUK6txHNCrDAOAWPl7f_aAizn6uBbXkxEFVtcVEctZgZ2wlp9DybhsAff-AtWk_YW/exec";
const TEST_ID = "MAP-G8-LANG-FULL";
const BANK_PATH = "map-tests/grade-8/language-usage/full-length/bank.csv";
const TITLE = "MAP Grade 8 Language Usage: Full-Length Practice Test";
const LETTERS = ["A","B","C","D","E"];
const QUESTIONS = [{"n": 1, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following poetic and literary devices is used in the sentence on the left? There is only ONE correct answer.", "options": ["Alliteration", "Simile", "Oxymoron", "Onomatopoeia"], "passage": "<strong>Don't spend time with Spencer's circle of friends; they are the wolves of the school, and they are incredibly rude.</strong>"}, {"n": 2, "type": "text", "section": "Grammar: usage", "stem": "Which of the following options completes the sentence on the left properly?", "options": ["\"me and my mom\"", "\"my mom and me\"", "\"I and my mom\"", "\"my mom and I\""], "passage": "<strong>Some members of my extended family were selected to speak at the party, including ___</strong>"}, {"n": 3, "type": "text", "section": "Punctuation", "stem": "Which of the following revisions must be made to the above sentence? There is only ONE correct answer.", "options": ["It's like what Walker always says: your true colors should have no color at all.", "It's like what Walker always says; Your true colors should have no color at all.", "It's like what Walker always says: You're true colors should have no color at all.", "It's like what Walker always says: \"Your true colors should have no color at all.\""], "passage": "<strong>It's like what Walker always says: Your true colors should have no color at all.</strong>"}, {"n": 4, "type": "text", "section": "Sentence structure", "stem": "Which is the best way to combine the sentences above?", "options": ["Julia Smith, who turned thirteen last week, is too young to attend the local arts school, which only accepts 14-year-olds or older.", "Julia Smith, who is too young to attend the local arts school but only accepts 14-year-olds or older, turned thirteen last week.", "Julia Smith would like to go to the local arts school, but it only accepts 14-year-olds or older and she is too young, because she is only thirteen.", "Julia, whose last name is Smith, is too young to attend the local arts school which only accepts 14-year-olds or older."], "passage": "<strong>Julia was thirteen years old last week. Julia is too young to attend the local arts school. The school only accepts 14-year-olds or older. Julia's last name is Smith.</strong>"}, {"n": 5, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences includes an example of vague pronoun use?", "options": ["Callie styled her hair in a French braid, in spite of the heavy rain outside, which was the reason she was late for work.", "Don't listen to them about anything.", "Amelie and Jemma went to the mall to try on clothes, and they had a great time.", "It isn't wise to have a tank of fish without a filter because it will get dirty."]}, {"n": 6, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences does not use the word \"then\" or the word \"than\" correctly?", "options": ["More then one quarter of marine species live in coral reefs.", "Our team was behind by one point, but then we scored a goal.", "Mumbai is closer to Hyderabad than to New Delhi.", "If you go to sleep early, then you will be well-rested tomorrow."]}, {"n": 7, "type": "text", "section": "Composition & writing", "stem": "DeAngelo is writing an article about the accomplishments of the city government this year. Which of the following sentences supports this objective the best if it appears in the article?", "options": ["There was a record number of candidates in the recent election.", "The President's nominations for the Supreme Court have attracted a lot of attention.", "Politicians have a reputation for being very corrupt, yet I aspire to run for public office and reform the system dramatically.", "After the repaving of the highways and the \"Feed the Homeless\" project in June, the Mayor's approval rating reached a new high."]}, {"n": 8, "type": "text", "section": "Sentence structure", "stem": "What is the complete predicate of the sentence?", "options": ["Tuvan people", "are famous", "are famous for their singing", "are famous for their singing and wrestling"], "passage": "<strong>The Tuvan people are famous for their singing and wrestling.</strong>"}, {"n": 9, "type": "text", "section": "Composition & writing", "stem": "Which pattern of organization is used in this writing sample?", "options": ["compare and contrast", "order of importance", "cause and effect", "sequence"], "passage": "<strong>How do you become a scientist? You should start by completing your school studies. Then, you can think about the field that interests you the most. Once you make a decision regarding your favorite field of study, you need to either go to college or university in order to learn this field of study thoroughly.</strong>"}, {"n": 10, "type": "text", "section": "Composition & writing", "stem": "Which of the following is a rhetorical question that illustrates the author's point?", "options": ["How would you feel if someone made fun of you?", "Have you ever made fun of someone for being different?", "Isn't it true that bullying is mean?", "Many children ask themselves if it's even worth it to go to school if they will just be made fun of."], "passage": "<strong>You should never make fun of people or call them mean names. It is not nice, and you could really hurt someone's feelings. You may think that someone is doing something strange or even annoying, but that does not give you the right to put them down.</strong>"}, {"n": 11, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following words is an adjective?", "options": ["loud", "on", "tree", "slowly"]}, {"n": 12, "type": "text", "section": "Grammar: usage", "stem": "Which of the following is the most proper revision of the sentence on the left that stays closest to the same meaning and expresses it clearly and directly?", "options": ["Akito told his son that he was not requiring him to clean the kitchen for no reason, for the reason was to teach him responsibility.", "Akito responded that he was not making his son clean the kitchen for no good reason other than to teach responsibility to him.", "Akito told his son that he wasn't making him clean the kitchen for a reason-to teach him responsibility.", "Akito responded to his son that he was making him clean the kitchen for a reason-to teach him responsibility."], "passage": "<strong>Akito responded to his son that he wasn't making him clean the kitchen for no reason, but rather to teach him responsibility.</strong>"}, {"n": 13, "type": "text", "section": "Composition & writing", "stem": "Which of the following options to complete the sentence creates a mysterious mood?", "options": ["she demanded impatiently, \"My brother is in there and he needs a doctor.\"", "she asked sadly, wondering if Mark would be able to fix the broken equipment.", "she asked in a low, trembling voice, as Mark stared back, bewildered.", "she asked, tapping her fingers on the chair. \"I need to get to the train station as soon as possible.\""], "passage": "<strong>Maureen stared at Mark; \"Could you please help me?\" ___</strong>"}, {"n": 14, "type": "text", "section": "Sentence structure", "stem": "What is the main clause in this sentence?", "options": ["After the Great Fire in 1666 destroyed London", "the capital city of England", "architect Sir Christopher Wren led the process of rebuilding the city", "led the process of rebuilding the city"], "passage": "<strong>After the Great Fire in 1666 destroyed London, the capital city of England, architect Sir Christopher Wren led the process of rebuilding the city.</strong>"}, {"n": 15, "type": "text", "section": "Spelling", "stem": "Which of the following words is spelled correctly?", "options": ["proffesor", "intermittent", "aggresive", "aparatus"]}, {"n": 16, "type": "text", "section": "Grammar: usage", "stem": "Which of the following changes should be made to the passage?", "options": ["Change \"to\" to \"from\" in the first sentence.", "Remove the word \"sitting\" from the second sentence.", "Change \"starts\" to \"started\" in the third sentence.", "Change \"anywhere\" to \"everywhere\" in the fourth sentence."], "passage": "<strong>Kevin woke up in the morning to the smell of home-made pancakes. He ran down the stairs, only to find an empty skillet and dirty plates sitting on the counter. He starts searching around the kitchen for leftover pancakes... He found no pancakes anywhere he searched. Feeling sad and groaning loudly, he walked back up the stairs and got back in bed.</strong>"}, {"n": 17, "type": "text", "section": "Composition & writing", "stem": "Alicia is writing a paper that single-sex education fosters better results for both boys and girls. Which of the following pieces of evidence would best support her claim?", "options": ["A story of a boy and a girl from the same school who transferred to single-sex schools and improved academically", "Official New York documents showing girls in all-girls schools outperforming girls in coed schools", "Transcripts of boys and girls from single-sex and coed schools", "A peer-review paper based on a scientific study that found marginal increases in grades of boys and girls in single-sex environments as opposed to coed learning."]}, {"n": 18, "type": "text", "section": "Sentence structure", "stem": "Which of the following is a compound-complex sentence?", "options": ["We decided to go to a rock concert as a family, but my wife, who dislikes crowded places, did not join us.", "My friend is now reading the most fascinating and well-written book I have ever read.", "My dentist, who had moved to another state a long time ago, came back last week.", "The child searched the busy, noisy street for hours, yet his ball was nowhere to be seen, and finally he was forced to give up."]}, {"n": 19, "type": "text", "section": "Spelling", "stem": "Which of the following words is not spelled correctly?", "options": ["Fate", "Strate", "Slate", "Rate"]}, {"n": 20, "type": "text", "section": "Grammar: usage", "stem": "In which of the following sentences is the underlined compound noun written correctly?", "options": ["My friend has two father-in-laws.", "They are building three new parkings garage in town.", "Your plan has some obvious drawsback.", "I bought two different bottle openers."]}, {"n": 21, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences provides the most helpful context for determining the definition of the word \"counterintuitive\"?", "options": ["John went with the second option, despite it being counterintuitive to what he knew about public relations.", "Saltwater is actually good for open wounds, despite being counterintuitive...", "Jan thought it was strange, but she agreed that despite the fact that it seemed counterintuitive, it actually made more sense to go under the fence than over in this case.", "When Jack was taking his history exam, all of the answer choices... seemed counterintuitive."]}, {"n": 22, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences contains a dangling modifier?", "options": ["He bought a bouquet of flowers for the girl that was beautiful.", "Intending to impress the girl he met last night, the flowers he got were very expensive.", "The flowers that he bought for the girl he met the previous night were very expensive.", "Impulsively, after he met a girl the previous night, he bought her beautiful flowers to impress her."]}, {"n": 23, "type": "text", "section": "Grammar: parts of speech", "stem": "The underlined phrase is functioning as what part of speech?", "options": ["noun", "pronoun", "adjective", "adverb"], "passage": "<strong>It can be difficult to acknowledge one's shortcomings in a dignified manner.</strong>"}, {"n": 24, "type": "text", "section": "Punctuation", "stem": "Which of the following sentences does not use a semicolon correctly?", "options": ["The Summer Solstice is the longest day of the year; a tandem bicycle has two seats.", "Some birds can fly; others can't.", "Alexander Fleming noticed that mold stopped bacteria from growing; as a result, he discovered penicillin.", "Interstate highways with north-south routes have odd numbers; those with east-west routes have even numbers."]}, {"n": 25, "type": "text", "section": "Punctuation", "stem": "Which of the following is a correct revision of the above passage? There is only ONE correct answer.", "options": ["...street; the smell... Yes 5947 Fenton Road was... Mr. Hanson the master of the house was said to be a bit loony...", "The house's windows were open. The residents were visible inside cleaning their not-so-fancy home. The music was audible from all the way down the street, and the smell of the cleaning supplies was noticeable from three doors down. Yes, 5947, Fenton Road was causing problems in the neighborhood. Mr. Hanson, the master of the house, was said to be \"a bit loony\" by the neighbors.", "...Yes 5947, Fenton Road, was... Mr. Hanson the master of the house, was said to be 'a bit loony'...", "The houses windows were open. The residents' were visible... cleaning they're not-so-fancy home..."], "passage": "<strong>The houses windows were open. The resident's were visible inside, cleaning their not-so-fancy home. The music was audible from all the way down the street; and the smell of the cleaning supplies was noticeable from three doors down. Yes, 5947, Fenton Road was causing problems in the neighborhood. Mr Hanson, the master of the house, was said to be 'a bit loony' by the neighbors.</strong>"}, {"n": 26, "type": "text", "section": "Composition & writing", "stem": "Which of the following topics can be used for an expository paragraph?", "options": ["Linda's new puppy", "the funniest puppy I have ever encountered in an adoption center", "how Alice's dream about dogs affected her decision to adopt a puppy", "why puppies are so helpless in the first few months of their lives"]}, {"n": 27, "type": "text", "section": "Grammar: parts of speech", "stem": "What is an interjection used for?", "options": ["to link words, phrases, or clauses together", "to express emotion", "to explain how an action is done", "to specify a relationship in time, space, or purpose"]}, {"n": 28, "type": "text", "section": "Punctuation", "stem": "Which of the following is NOT a proper usage of the em dash?", "options": ["Unless she wanted to stay there all alone-she had to go with them.", "All of the factors causing her stress-namely, her job, her bills, her parents, and her injury-just melted away when she looked into his eyes.", "There was only one thing in the world that he wanted-a friend.", "Everyone present at the meeting except for Jason was wearing a tie (including Jodi)."]}, {"n": 29, "type": "text", "section": "Composition & writing", "stem": "Choose the best revision for the following passage.", "options": ["Lucille staggered in shock when she learned... Card games had been played and tea had been drunk until late at night, but nobody had invited Lucille.", "Lucille was completely shocked to learn that her whole family had been invited by her brother... Card games had been played and tea had been drunk... but Lucille had not been invited.", "Lucille was completely shocked to learn that her brother had invited the whole family to his house and made them dinner. They had played card games and drunk tea until late at night, but nobody invited Lucille.", "Lucille staggered in shock when she learned that her brother had invited the whole family... They had played card games and drunk tea until late at night, but Lucille had not been invited."], "passage": "<strong>Lucille was completely shocked to learn that her brother had invited the whole family to his house and made them dinner. They had played card games and drunk tea until late at night, but Lucille had not been invited.</strong>"}, {"n": 30, "type": "text", "section": "Grammar: usage", "stem": "Which correction should be made to this sentence?", "options": ["Change \"watches\" to \"watched\"", "Change \"dressed\" to \"dressing\"", "Change \"their\" to \"its\"", "Change \"go\" to \"goes\""], "passage": "<strong>Rosie watches as a large bus of people dressed in matching t-shirts and clapping their hands go down the street.</strong>"}, {"n": 31, "type": "text", "section": "Composition & writing", "stem": "Which argument does the author wish to avoid or refute by writing \"Taking inflation into account\"? Assume any information given within an argument is true.", "options": ["It is only the second highest grossing film, which is not as impressive as the highest grossing film, Gone with the Wind.", "Avengers: Endgame and Avatar have both grossed more money in dollars than Titanic has, making Titanic the 3rd highest grossing film, not the second.", "The culture and movie-going practices when Titanic was released were far different... so you cannot compare the value of different movies in money earned.", "The economy was doing very poorly when Titanic was released, yet so many people still came to see the movie."], "passage": "<strong>Titanic is one of the most successful movies ever made... Taking inflation into account, Titanic ranks as the second highest grossing film of all time with a worldwide gross of 2.18 billion dollars...</strong>"}, {"n": 32, "type": "text", "section": "Punctuation", "stem": "Which punctuation correctly fills the two blanks, in order?", "options": ["semicolon, comma", "comma, comma", "colon, colon", "colon, comma"], "passage": "<strong>There are three main types of rock ___ igneous, sedimentary, and metamorphic... Metamorphic rock ___ the rarest type of rock, forms when an already-existing rock is transformed...</strong>"}, {"n": 33, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following sentences uses vivid imagery?", "options": ["Sometimes loud planes fly over our house and annoy us.", "Plankton are tiny creatures that play an essential role in ocean ecosystems.", "The National Mall in Washington, D.C. is a park, not a shopping mall.", "Smooth, flat stones are perfect for skipping on a lake to make rippling patterns."]}, {"n": 34, "type": "text", "section": "Grammar: parts of speech", "stem": "Which of the following is the infinitive in this sentence?", "options": ["the first spring rain", "falls", "turns", "to absorb"], "passage": "<strong>After the first spring rain falls, the field near my house turns green and many people visit it to absorb some fresh air and beautiful views.</strong>"}, {"n": 35, "type": "text", "section": "Sentence structure", "stem": "Which of the following sentences has an adverb clause underlined?", "options": ["The pirates buried their treasure under the palm tree.", "The U.S. Constitution was signed in 1787 but didn't come into effect until 1789.", "After the party's over we'll have to clean the house.", "The painting that was sold for $5 million was a fake!"]}, {"n": 36, "type": "text", "section": "Punctuation", "stem": "What is the purpose of the three dots in the passage?", "options": ["to express deep emotion", "to emphasize how good the teacher was", "to convey a time jump", "to express hesitation"], "passage": "<strong>My English teacher in junior high was one of the most unusual people I have ever met... he asked me to help him carry some books to the staff room... That day when I came home from school, I couldn't stop thinking about how nice he had been...</strong>"}, {"n": 37, "type": "text", "section": "Word choice & vocabulary", "stem": "Which of the following word changes would be more consistent with the writing style and better fit the context of the passage?", "options": ["Replace \"wished\" with \"begged\"", "Replace \"wished\" with \"yearned\"", "Replace \"miserable\" with \"sad\"", "Replace \"see\" with \"witness\""], "passage": "<strong>Julio sat there in his dull prison cell that was void of even a whisper of hopefulness. The thought of his forsaken family plagued him heavily. He wished for their presence as he sat there alone with his miserable thoughts...</strong>"}, {"n": 38, "type": "text", "section": "Composition & writing", "stem": "Dean finds this letter from Fredrick Ward and considers it a very valuable source for his paper. What topic is Dean's paper most likely concerned with?", "options": ["Eastern religion and culture", "The development and different beliefs of Hinduism", "A traveler's guide to Asia", "Tracking the travels of Fredrick Ward"], "passage": "<strong>Dear Anne, My travels have taken me to India... When I was in China... These religions are vastly different from the Muslims I met in Turkey and the Jews I met in Israel... My tour of Asia is reaching a close as I head toward Thailand next Tuesday... Missing you a great deal, Fredrick Ward</strong>"}, {"n": 39, "type": "text", "section": "Composition & writing", "stem": "Which of the following revisions makes for the clearest and most fluent sentence that still retains all of the information from the original passage?", "options": ["Joan was staying in a hotel because her employers decided that was the best option for lodging, and she was in Michigan because of a business trip... in order to recruit new employees to the company.", "Joan's employers sent her on a business trip to Michigan for three days in October in order to recruit new employees, and they decided that they should have her stay in a hotel.", "Joan was sent by her employers on a business trip to Michigan for three days in October... and Joan's employers decided that they should have Joan stay in a hotel.", "Joan was in a hotel in Michigan to recruit employees for her company for three days in October."], "passage": "<strong>Joan was staying in a hotel in Michigan. It was decided by her employers that having her stay in a hotel would be the best option for lodging. She was staying there because of a business trip that she was sent on by her work. This took place in October, and it lasted for three days. The goal of the trip was for new employees to be recruited to the company.</strong>"}, {"n": 40, "type": "text", "section": "Grammar: usage", "stem": "Which of the following sentences uses a conjunctive adverb to join two independent clauses? There is only ONE correct answer.", "options": ["Although she was not very happy to see her brother, Quinn hid this very well.", "Quinn was not very happy to see her brother despite the fact that she hid it very well.", "Quinn was not very happy to see her brother; nevertheless, she hid this very well.", "While not very happy to see her brother, Quinn did, however, hide it very well."]}];
const total = QUESTIONS.length;
const answers = {};
let idx = 0, startTime = 0;
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("startBtn").onclick = function(){
  const nm = document.getElementById("sname").value.trim();
  const em = document.getElementById("semail").value.trim();
  if(!nm){ alert("Please enter your name."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert("Please enter a valid email address."); return; }
  window.studentName = nm; window.studentEmail = em;
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  startTime = Date.now(); renderQuestion();
};
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById("prog").style.width = Math.round(idx/total*100)+"%";
  let h = "";
  if(q.passage) h += '<div class="passage">'+q.passage+'</div>';
  if(q.img) h += '<div style="margin:10px 0"><img src="'+q.img+'" alt="figure" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>';
  h += '<div class="qn">Question '+(idx+1)+' of '+total+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.options.forEach(function(opt,i){
    const L=LETTERS[i], checked = answers[q.n]===L ? " checked":"";
    h += '<label><input type="radio" name="opt" value="'+L+'"'+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div>';
  document.getElementById("qcard").innerHTML = h;
  const nb = document.getElementById("nextBtn");
  nb.disabled = !answers[q.n];
  nb.textContent = (idx===total-1) ? "Finish" : "Next →";
  document.querySelectorAll('input[name=opt]').forEach(function(r){
    r.onchange = function(){ answers[q.n]=this.value; nb.disabled=false; };
  });
  window.scrollTo(0,0);
}
document.getElementById("nextBtn").onclick = function(){
  if(this.disabled) return;
  if(idx<total-1){ idx++; renderQuestion(); } else submit();
};
async function submit(){
  const btn=document.getElementById("nextBtn");
  if(SCRIPT_URL.indexOf("PASTE_")===0){ alert("This test is not connected to its engine yet."); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scoring…';
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      type:"generic", test_id:TEST_ID, bankPath:BANK_PATH, title:TITLE,
      name:window.studentName, email:window.studentEmail||"",
      elapsedSeconds: Math.round((Date.now()-startTime)/1000),
      answers: answers, questions: QUESTIONS
    })});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    showResult(data);
  }catch(err){ btn.disabled=false; btn.textContent="Finish"; alert("Submission failed: "+err.message); }
}
function showResult(data){
  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreLine").innerHTML = "Score: "+data.total+" / "+data.max +
    (data.total===data.max?' <span style="color:#1a7f37">(perfect!)</span>':"");
  let rows="<tr><th style='text-align:left;padding:6px 12px'>Skill</th><th style='padding:6px 12px'>Score</th></tr>";
  for(const s of (data.sections||[])) rows+="<tr><td style='padding:6px 12px;border-top:1px solid #dce3ea'>"+esc(s.name)+"</td><td style='padding:6px 12px;border-top:1px solid #dce3ea;text-align:center'>"+s.correct+" / "+s.total+"</td></tr>";
  document.getElementById("secTable").innerHTML=rows;
  const byN={}; for(const q of QUESTIONS) byN[q.n]=q;
  let html='<h3>Review: correct answers</h3>';
  for(const rv of (data.review||[])){
    const q=byN[rv.n]; if(!q) continue;
    const yourTxt = rv.your ? (rv.your+") "+esc(q.options[LETTERS.indexOf(rv.your)])) : "not answered";
    const corrTxt = rv.correct+") "+esc(q.options[LETTERS.indexOf(rv.correct)]);
    const right = rv.your===rv.correct;
    html += '<div class="ri"><span class="qn">Question '+rv.n+' · '+esc(q.section||"")+'</span>'
      + '<div class="stem" style="font-size:15px">'+esc(q.stem)+'</div>'
      + '<div class="ans '+(right?"ok":"yourwrong")+'">Your answer: '+yourTxt+(right?" ✓":"")+'</div>'
      + (right?"":'<div class="ans ok">Correct: '+corrTxt+'</div>')
      + (rv.expl?'<div class="why">'+esc(rv.expl)+'</div>':'')
      + '</div>';
  }
  document.getElementById("reviewArea").innerHTML=html;
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}
</script></div></body></html>
