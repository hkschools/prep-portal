<title>IDAT CIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCHOOL = "CIS", STAGE = "6", VERSION = "1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the underlined word in the sentence below?\n\nThe diplomat gave a <u>laconic</u> reply, saying only, 'We shall see.'", "options": {"A": "long-winded and detailed", "B": "using very few words", "C": "angry and hostile", "D": "warm and encouraging"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'meticulous' in the sentence below?\n\nThe restorer was meticulous, examining every brushstroke of the fading portrait before applying a single drop of solvent.", "options": {"A": "anxious and easily distracted", "B": "slow and reluctant", "C": "extremely careful and precise", "D": "talented and imaginative"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the option that uses the colon correctly.", "options": {"A": "The expedition needed: rope, water, and a reliable map.", "B": "The expedition needed three things, rope, water, and a reliable map:", "C": "The expedition: needed three things rope, water, and a reliable map.", "D": "The expedition needed three things: rope, water, and a reliable map."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the word that most precisely means 'doubtful because one tends to distrust people's motives in general'.", "options": {"A": "cynical", "B": "sceptical", "C": "incredulous", "D": "dubious"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the option in which the semicolon is used correctly.", "options": {"A": "The storm had passed; and the streets were still flooded.", "B": "Although the storm had passed; the streets were still flooded.", "C": "The storm had passed; the streets, however, were still flooded.", "D": "The storm had passed; flooded streets everywhere."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "In the sentence below, the underlined word is used as which part of speech?\n\nThe negotiators agreed to <u>table</u> the controversial clause until the next session.", "options": {"A": "noun", "B": "verb", "C": "adjective", "D": "gerund (an -ing noun form)"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which labelled section contains an error?\n\nNeither the director nor the producers (A) was willing (B) to accept responsibility for the budget overrun, (C) which had embarrassed the studio (D) for months.", "options": {"A": "section (A)", "B": "section (B)", "C": "section (C)", "D": "section (D)"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nWhen the salesman promised the car had 'never had a single problem', the mechanic took it <u>with a pinch of salt</u>.", "options": {"A": "with great enthusiasm and approval", "B": "with anger and open hostility", "C": "with careful, literal attention to detail", "D": "with scepticism, not fully believing it"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which revision best combines the two sentences to improve flow and reduce repetition?\n\nThe glacier has retreated sharply over the past decade. The retreat alarms climate scientists.", "options": {"A": "The glacier's sharp retreat over the past decade alarms climate scientists.", "B": "The glacier has retreated sharply over the past decade, and the retreat alarms climate scientists.", "C": "The glacier has retreated sharply over the past decade, a retreat that alarms climate scientists.", "D": "The glacier has retreated sharply over the past decade; it alarms climate scientists, the retreat."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the word that most precisely fits the sentence.\n\nThe witness gave a _____ account of the accident, leaving out nothing the jury needed to know.", "options": {"A": "comprehensible", "B": "compendious", "C": "comprehensive", "D": "compulsive"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Which labelled section breaks parallel structure?\n\nThe internship taught her (A) to analyse data, (B) to write clearly, and (C) how managing a team works, (D) all within three months.", "options": {"A": "section (A)", "B": "section (B)", "C": "section (C)", "D": "section (D)"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which of the following is a euphemism (a softened phrase) for civilian deaths caused in a military attack?", "options": {"A": "friendly fire", "B": "collateral damage", "C": "shock and awe", "D": "exit strategy"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "For a formal scientific report, which sentence best follows the convention of impersonal, passive construction?", "options": {"A": "I heated the solution to 80 degrees and wrote down the colour change.", "B": "You heat the solution to 80 degrees and you record the colour change.", "C": "We were heating the solution and recording the colour change as it happened.", "D": "The solution was heated to 80 degrees and the colour change was recorded."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Using the context, what is the most likely meaning of 'truculent' in the sentence below?\n\nFar from co-operating, the truculent prisoner snarled at the guards and refused every reasonable request.", "options": {"A": "quietly cooperative", "B": "deeply sorrowful", "C": "aggressively defiant", "D": "physically exhausted"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Choose the sentence that uses the dash correctly to set off a parenthetical remark.", "options": {"A": "The result, surprising as it was — confirmed the hypothesis — a hypothesis many had dismissed.", "B": "The result, surprising as it was, confirmed the hypothesis — a hypothesis many had dismissed.", "C": "The result surprising — as it was confirmed — the hypothesis many had dismissed.", "D": "The result, surprising as it was confirmed the hypothesis, — a hypothesis many had dismissed."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nThe poet wrote: '<u>The old factory groaned awake each morning and stretched its iron arms over the town.</u>'", "options": {"A": "personification", "B": "simile", "C": "hyperbole", "D": "onomatopoeia"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes this third (unreal past) conditional.\n\nIf the engineers _____ the warning signs, the bridge would not have collapsed.", "options": {"A": "have heeded", "B": "would heed", "C": "heeded", "D": "had heeded"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which word is the most FORMAL/academic synonym for 'use' in the sentence below?\n\nThe study will _____ a new statistical model to test the claim.", "options": {"A": "try out", "B": "employ", "C": "go with", "D": "grab"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Which labelled section contains a spelling error?\n\nThe council's (A) unanimous decision was widely (B) percieved as a (C) conscientious response to a (D) recurring problem.", "options": {"A": "section (A)", "B": "section (B)", "C": "section (C)", "D": "section (D)"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Choose the adjective that most accurately describes someone who states opinions firmly without being rude.", "options": {"A": "aggressive", "B": "abrasive", "C": "assertive", "D": "domineering"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Choose the transition that best signals a CONCESSION followed by a counterpoint.\n\nThe new policy reduced waiting times. _____, it did so by quietly limiting who could join the waiting list in the first place.", "options": {"A": "Admittedly", "B": "Furthermore", "C": "Therefore", "D": "Meanwhile"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the underlined word in the sentence below?\n\nThe critic's <u>terse</u> review consisted of just three words: 'Ambitious, flawed, unforgettable.'", "options": {"A": "brief and to the point", "B": "confused and rambling", "C": "highly detailed and thorough", "D": "enthusiastic and praising"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Which revision corrects the dangling modifier?\n\nOriginal: Walking through the ruins, the broken columns seemed to whisper of a lost age.", "options": {"A": "Walking through the ruins, the broken columns whispered, seeming of a lost age.", "B": "The broken columns, walking through the ruins, seemed to whisper of a lost age.", "C": "Whispering of a lost age, the ruins were walked through by the broken columns.", "D": "Walking through the ruins, we felt the broken columns seemed to whisper of a lost age."}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nThe board hoped the new figures would <u>turn the tide</u> after three quarters of falling sales.", "options": {"A": "reverse an unfavourable trend", "B": "delay an important decision", "C": "reveal a hidden secret", "D": "punish those responsible"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Which sentence opening best varies a paragraph that has begun three sentences in a row with 'The'?\n\nContext: '...The scientists collected the samples. The samples were frozen. ___ the results surprised everyone.'", "options": {"A": "The results surprised everyone once analysed.", "B": "The analysis was done and the results surprised everyone.", "C": "Once analysed, the results surprised everyone.", "D": "The results, after they were analysed, surprised everyone."}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Read this line of verse:\n\n'The <u>silver ships sailed silently</u> past the sleeping shore.'\n\nWhich device is most prominent in the underlined phrase?", "options": {"A": "assonance", "B": "enjambment", "C": "hyperbole", "D": "alliteration"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "Choose the option that correctly punctuates a list whose items already contain commas.", "options": {"A": "The tour visited three cities: Lyon, France; Turin, Italy; and Basel, Switzerland.", "B": "The tour visited three cities; Lyon, France, Turin, Italy, and Basel, Switzerland.", "C": "The tour visited three cities: Lyon, France, Turin, Italy, and Basel, Switzerland.", "D": "The tour visited three cities, Lyon France; Turin Italy; and Basel Switzerland."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "In a news report aiming to sound NEUTRAL, which word best replaces the loaded word in: 'The protesters were _____ by police.'?", "options": {"A": "crushed", "B": "routed", "C": "swept away", "D": "dispersed"}, "fig": "", "passage": "", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "Which statement best expresses the central theme of the story?", "options": {"A": "Skilled craftsmen always deserve to be paid more than merchants.", "B": "Lasting worth is often plain and easily overlooked, while showy things may fail when tested.", "C": "Wealthy people are incapable of recognising true quality.", "D": "It is foolish to buy anything decorated with jewels or coloured glass."}, "fig": "", "passage": "<strong>The Lamp-Maker of Aleppo</strong><br>In the old quarter of a city whose name the years have worn smooth, there lived a lamp-maker named Idris, famous for the steadiness of his hands and the patience of his heart. His shop was no larger than a cupboard, yet travellers crossed three deserts to buy from him, for it was said that a lamp made by Idris would burn through any darkness without faltering.\n\nOne autumn a wealthy merchant arrived, his rings catching the light like small fires. He set a heavy purse upon the counter and demanded the finest lamp in the shop, one grand enough to hang in the hall of a governor. Idris bowed and offered him a plain brass lamp, unadorned, its surface dull as river stone.\n\nThe merchant laughed. 'For this price I expect gold and jewels, not a beggar's pot. Have you nothing worthier of my house?'\n\n'The worth of a lamp,' said Idris quietly, 'is not in what catches the eye but in what it gives the eye to see. This lamp will outlast every jewelled trinket in your hall.'\n\nThe merchant, unconvinced, bought instead a dazzling lamp from a rival across the square, its body crusted with coloured glass that threw rainbows across the wall. He carried it home in triumph. But on the first cold night, when the wind crept beneath his doors, the bright lamp flickered, choked, and went dark, and the merchant sat in a blackness made deeper by the memory of its glitter.\n\nHumbled, he returned to the cupboard-shop at dawn. Idris was already at his bench, shaping a wick by the grey morning light. Without a word of reproach, the lamp-maker reached beneath the counter and produced the very brass lamp the merchant had scorned. 'I kept it for you,' he said. 'I thought you might come to need it.'\n\nThe merchant lit it that evening. Through the longest, coldest night of the year it burned without a tremor, a small unwavering gold against the dark, while outside the wind howled itself hoarse. And the merchant understood, at last, that he had paid twice: once for what glittered, and once for what endured, and that only the second had been worth the price.\n\nIt is told that he kept the lamp until he was an old man, and that he would point to its plain brass body and say to his grandchildren, 'Beware the thing that shines too eagerly. Ask not whether a light is bright, but whether it will stay.' And the children, who loved bright things as all children do, would nod without understanding, as the young must, until the cold nights of their own lives taught them what the lamp had taught him.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the underlined word as used in the passage?\n\n'...a small <u>unwavering</u> gold against the dark...'", "options": {"A": "flickering and unsteady", "B": "faint and barely visible", "C": "steady and not flickering", "D": "extremely valuable"}, "fig": "", "passage": "<strong>The Lamp-Maker of Aleppo</strong><br>In the old quarter of a city whose name the years have worn smooth, there lived a lamp-maker named Idris, famous for the steadiness of his hands and the patience of his heart. His shop was no larger than a cupboard, yet travellers crossed three deserts to buy from him, for it was said that a lamp made by Idris would burn through any darkness without faltering.\n\nOne autumn a wealthy merchant arrived, his rings catching the light like small fires. He set a heavy purse upon the counter and demanded the finest lamp in the shop, one grand enough to hang in the hall of a governor. Idris bowed and offered him a plain brass lamp, unadorned, its surface dull as river stone.\n\nThe merchant laughed. 'For this price I expect gold and jewels, not a beggar's pot. Have you nothing worthier of my house?'\n\n'The worth of a lamp,' said Idris quietly, 'is not in what catches the eye but in what it gives the eye to see. This lamp will outlast every jewelled trinket in your hall.'\n\nThe merchant, unconvinced, bought instead a dazzling lamp from a rival across the square, its body crusted with coloured glass that threw rainbows across the wall. He carried it home in triumph. But on the first cold night, when the wind crept beneath his doors, the bright lamp flickered, choked, and went dark, and the merchant sat in a blackness made deeper by the memory of its glitter.\n\nHumbled, he returned to the cupboard-shop at dawn. Idris was already at his bench, shaping a wick by the grey morning light. Without a word of reproach, the lamp-maker reached beneath the counter and produced the very brass lamp the merchant had scorned. 'I kept it for you,' he said. 'I thought you might come to need it.'\n\nThe merchant lit it that evening. Through the longest, coldest night of the year it burned without a tremor, a small unwavering gold against the dark, while outside the wind howled itself hoarse. And the merchant understood, at last, that he had paid twice: once for what glittered, and once for what endured, and that only the second had been worth the price.\n\nIt is told that he kept the lamp until he was an old man, and that he would point to its plain brass body and say to his grandchildren, 'Beware the thing that shines too eagerly. Ask not whether a light is bright, but whether it will stay.' And the children, who loved bright things as all children do, would nod without understanding, as the young must, until the cold nights of their own lives taught them what the lamp had taught him.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What can be inferred about Idris from the fact that he kept the scorned lamp 'for' the merchant?", "options": {"A": "He was unable to sell the lamp to anyone else.", "B": "He wanted to embarrass the merchant publicly.", "C": "He had forgotten that the merchant had refused it.", "D": "He understood human nature and expected the merchant to return."}, "fig": "", "passage": "<strong>The Lamp-Maker of Aleppo</strong><br>In the old quarter of a city whose name the years have worn smooth, there lived a lamp-maker named Idris, famous for the steadiness of his hands and the patience of his heart. His shop was no larger than a cupboard, yet travellers crossed three deserts to buy from him, for it was said that a lamp made by Idris would burn through any darkness without faltering.\n\nOne autumn a wealthy merchant arrived, his rings catching the light like small fires. He set a heavy purse upon the counter and demanded the finest lamp in the shop, one grand enough to hang in the hall of a governor. Idris bowed and offered him a plain brass lamp, unadorned, its surface dull as river stone.\n\nThe merchant laughed. 'For this price I expect gold and jewels, not a beggar's pot. Have you nothing worthier of my house?'\n\n'The worth of a lamp,' said Idris quietly, 'is not in what catches the eye but in what it gives the eye to see. This lamp will outlast every jewelled trinket in your hall.'\n\nThe merchant, unconvinced, bought instead a dazzling lamp from a rival across the square, its body crusted with coloured glass that threw rainbows across the wall. He carried it home in triumph. But on the first cold night, when the wind crept beneath his doors, the bright lamp flickered, choked, and went dark, and the merchant sat in a blackness made deeper by the memory of its glitter.\n\nHumbled, he returned to the cupboard-shop at dawn. Idris was already at his bench, shaping a wick by the grey morning light. Without a word of reproach, the lamp-maker reached beneath the counter and produced the very brass lamp the merchant had scorned. 'I kept it for you,' he said. 'I thought you might come to need it.'\n\nThe merchant lit it that evening. Through the longest, coldest night of the year it burned without a tremor, a small unwavering gold against the dark, while outside the wind howled itself hoarse. And the merchant understood, at last, that he had paid twice: once for what glittered, and once for what endured, and that only the second had been worth the price.\n\nIt is told that he kept the lamp until he was an old man, and that he would point to its plain brass body and say to his grandchildren, 'Beware the thing that shines too eagerly. Ask not whether a light is bright, but whether it will stay.' And the children, who loved bright things as all children do, would nod without understanding, as the young must, until the cold nights of their own lives taught them what the lamp had taught him.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "In the final paragraph, the children who 'nod without understanding...until the cold nights of their own lives taught them' chiefly illustrate which idea?", "options": {"A": "Children are incapable of learning from their elders.", "B": "Some truths can only be learned through lived experience, not simply by being told.", "C": "The merchant was a poor teacher of his grandchildren.", "D": "Bright lights are dangerous to young children."}, "fig": "", "passage": "<strong>The Lamp-Maker of Aleppo</strong><br>In the old quarter of a city whose name the years have worn smooth, there lived a lamp-maker named Idris, famous for the steadiness of his hands and the patience of his heart. His shop was no larger than a cupboard, yet travellers crossed three deserts to buy from him, for it was said that a lamp made by Idris would burn through any darkness without faltering.\n\nOne autumn a wealthy merchant arrived, his rings catching the light like small fires. He set a heavy purse upon the counter and demanded the finest lamp in the shop, one grand enough to hang in the hall of a governor. Idris bowed and offered him a plain brass lamp, unadorned, its surface dull as river stone.\n\nThe merchant laughed. 'For this price I expect gold and jewels, not a beggar's pot. Have you nothing worthier of my house?'\n\n'The worth of a lamp,' said Idris quietly, 'is not in what catches the eye but in what it gives the eye to see. This lamp will outlast every jewelled trinket in your hall.'\n\nThe merchant, unconvinced, bought instead a dazzling lamp from a rival across the square, its body crusted with coloured glass that threw rainbows across the wall. He carried it home in triumph. But on the first cold night, when the wind crept beneath his doors, the bright lamp flickered, choked, and went dark, and the merchant sat in a blackness made deeper by the memory of its glitter.\n\nHumbled, he returned to the cupboard-shop at dawn. Idris was already at his bench, shaping a wick by the grey morning light. Without a word of reproach, the lamp-maker reached beneath the counter and produced the very brass lamp the merchant had scorned. 'I kept it for you,' he said. 'I thought you might come to need it.'\n\nThe merchant lit it that evening. Through the longest, coldest night of the year it burned without a tremor, a small unwavering gold against the dark, while outside the wind howled itself hoarse. And the merchant understood, at last, that he had paid twice: once for what glittered, and once for what endured, and that only the second had been worth the price.\n\nIt is told that he kept the lamp until he was an old man, and that he would point to its plain brass body and say to his grandchildren, 'Beware the thing that shines too eagerly. Ask not whether a light is bright, but whether it will stay.' And the children, who loved bright things as all children do, would nod without understanding, as the young must, until the cold nights of their own lives taught them what the lamp had taught him.", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "The phrase 'a city whose name the years have worn smooth' mainly serves to", "options": {"A": "give the tale a timeless, fable-like quality rather than a specific historical setting", "B": "establish the exact date and location of the events", "C": "suggest the city was destroyed in a war", "D": "criticise people who forget history"}, "fig": "", "passage": "<strong>The Lamp-Maker of Aleppo</strong><br>In the old quarter of a city whose name the years have worn smooth, there lived a lamp-maker named Idris, famous for the steadiness of his hands and the patience of his heart. His shop was no larger than a cupboard, yet travellers crossed three deserts to buy from him, for it was said that a lamp made by Idris would burn through any darkness without faltering.\n\nOne autumn a wealthy merchant arrived, his rings catching the light like small fires. He set a heavy purse upon the counter and demanded the finest lamp in the shop, one grand enough to hang in the hall of a governor. Idris bowed and offered him a plain brass lamp, unadorned, its surface dull as river stone.\n\nThe merchant laughed. 'For this price I expect gold and jewels, not a beggar's pot. Have you nothing worthier of my house?'\n\n'The worth of a lamp,' said Idris quietly, 'is not in what catches the eye but in what it gives the eye to see. This lamp will outlast every jewelled trinket in your hall.'\n\nThe merchant, unconvinced, bought instead a dazzling lamp from a rival across the square, its body crusted with coloured glass that threw rainbows across the wall. He carried it home in triumph. But on the first cold night, when the wind crept beneath his doors, the bright lamp flickered, choked, and went dark, and the merchant sat in a blackness made deeper by the memory of its glitter.\n\nHumbled, he returned to the cupboard-shop at dawn. Idris was already at his bench, shaping a wick by the grey morning light. Without a word of reproach, the lamp-maker reached beneath the counter and produced the very brass lamp the merchant had scorned. 'I kept it for you,' he said. 'I thought you might come to need it.'\n\nThe merchant lit it that evening. Through the longest, coldest night of the year it burned without a tremor, a small unwavering gold against the dark, while outside the wind howled itself hoarse. And the merchant understood, at last, that he had paid twice: once for what glittered, and once for what endured, and that only the second had been worth the price.\n\nIt is told that he kept the lamp until he was an old man, and that he would point to its plain brass body and say to his grandchildren, 'Beware the thing that shines too eagerly. Ask not whether a light is bright, but whether it will stay.' And the children, who loved bright things as all children do, would nod without understanding, as the young must, until the cold nights of their own lives taught them what the lamp had taught him.", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "According to the passage, why did the merchant feel his darkness was 'made deeper'?", "options": {"A": "Because the night was unusually long that year", "B": "Because Idris had refused to sell him any lamp", "C": "Because the memory of the bright lamp's glitter sharpened his sense of the dark", "D": "Because the rival merchant had cheated him of his money"}, "fig": "", "passage": "<strong>The Lamp-Maker of Aleppo</strong><br>In the old quarter of a city whose name the years have worn smooth, there lived a lamp-maker named Idris, famous for the steadiness of his hands and the patience of his heart. His shop was no larger than a cupboard, yet travellers crossed three deserts to buy from him, for it was said that a lamp made by Idris would burn through any darkness without faltering.\n\nOne autumn a wealthy merchant arrived, his rings catching the light like small fires. He set a heavy purse upon the counter and demanded the finest lamp in the shop, one grand enough to hang in the hall of a governor. Idris bowed and offered him a plain brass lamp, unadorned, its surface dull as river stone.\n\nThe merchant laughed. 'For this price I expect gold and jewels, not a beggar's pot. Have you nothing worthier of my house?'\n\n'The worth of a lamp,' said Idris quietly, 'is not in what catches the eye but in what it gives the eye to see. This lamp will outlast every jewelled trinket in your hall.'\n\nThe merchant, unconvinced, bought instead a dazzling lamp from a rival across the square, its body crusted with coloured glass that threw rainbows across the wall. He carried it home in triumph. But on the first cold night, when the wind crept beneath his doors, the bright lamp flickered, choked, and went dark, and the merchant sat in a blackness made deeper by the memory of its glitter.\n\nHumbled, he returned to the cupboard-shop at dawn. Idris was already at his bench, shaping a wick by the grey morning light. Without a word of reproach, the lamp-maker reached beneath the counter and produced the very brass lamp the merchant had scorned. 'I kept it for you,' he said. 'I thought you might come to need it.'\n\nThe merchant lit it that evening. Through the longest, coldest night of the year it burned without a tremor, a small unwavering gold against the dark, while outside the wind howled itself hoarse. And the merchant understood, at last, that he had paid twice: once for what glittered, and once for what endured, and that only the second had been worth the price.\n\nIt is told that he kept the lamp until he was an old man, and that he would point to its plain brass body and say to his grandchildren, 'Beware the thing that shines too eagerly. Ask not whether a light is bright, but whether it will stay.' And the children, who loved bright things as all children do, would nod without understanding, as the young must, until the cold nights of their own lives taught them what the lamp had taught him.", "qnum": "34"}, {"n": "36", "type": "mcq", "section": "English", "stem": "Which statement best captures the main idea of the passage?", "options": {"A": "The Chinese invented the compass purely for navigation during the Han dynasty.", "B": "Satellite navigation has made the magnetic compass completely obsolete.", "C": "The magnetic compass developed gradually and remains valuable despite its imperfections and the rise of modern technology.", "D": "Magnetic declination makes the compass too unreliable to be used at sea."}, "fig": "", "passage": "<strong>How the Compass Found Its North</strong><br>For most of human history, travellers who lost sight of land were at the mercy of the sky. By day they steered by the sun; by night, by the stars. But when cloud smothered the heavens for days at a stretch, a ship could wander in circles, its crew unable to tell east from west. The instrument that finally freed sailors from this dependence on clear skies was deceptively humble: a sliver of magnetised iron, free to swing, that always settled into the same direction.\n\nThe magnetic compass was not invented in a single flash of genius. The Chinese had known for centuries that lodestone, a naturally magnetic rock, would align itself north and south when allowed to move freely. As early as the Han dynasty, this property was used not for navigation but for divination and the laying-out of buildings according to careful rules of orientation. Only later, perhaps around the eleventh century, did Chinese sailors begin floating magnetised needles on water to steer their ships. From China the knowledge travelled westward along trade routes, reaching Arab and then European mariners, who refined it into the pivoted, card-mounted dial recognisable today.\n\nThe compass did not, however, point to true north, and this caused centuries of confusion. The Earth behaves as though a colossal bar magnet sits at its core, but its magnetic poles do not sit exactly at the geographic poles around which the planet spins. The angle between the direction a compass points and true geographic north is called magnetic declination, and it varies from place to place and, more troublingly, drifts slowly over the years. A chart of declination drawn for a sailor in 1700 would mislead a sailor in 1900. Navigators had to carry tables of corrections, adjusting their readings according to where they stood on the globe.\n\nWhy the poles wander at all remained a puzzle until the twentieth century. The modern explanation points to the Earth's outer core, a vast ocean of molten iron whose churning currents generate the planet's magnetic field. Because this metal sea is forever in motion, the field it produces shifts, and the magnetic poles creep across the surface, sometimes by tens of kilometres in a single year. Far stranger, the rock record shows that the field has reversed itself entirely many times, north becoming south and back again, over spans of thousands of years.\n\nToday satellites pinpoint a ship's position to within a few metres, and the magnetic compass might seem a relic. Yet it endures aboard every serious vessel, for a simple reason: it needs no power, no signal, and no satellite overhead. When the electronics fail, as electronics sometimes do, the old sliver of magnetised iron still swings quietly toward the north, just as it did for the sailors who first trusted their lives to it a thousand years ago.", "qnum": "35"}, {"n": "37", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the underlined word as used in the passage?\n\n'The instrument that finally freed sailors from this dependence on clear skies was <u>deceptively</u> humble.'", "options": {"A": "dishonestly and with intent to cheat", "B": "in a way that hides its real importance", "C": "obviously and clearly", "D": "temporarily, for a short while"}, "fig": "", "passag tronics sometimes do, the old sliver of magnetised iron still swings quietly toward the north, just as it did for the sailors who first trusted their lives to it a thousand years ago.", "qnum": "40"}, {"n": "42", "type": "writing", "section": "English Writing", "intro": "Stage 6 (Year 12) writing task: a single argumentative essay on a debatable issue. You answer ONE of the two prompts using the keyboard.", "label": "", "body": "Choose ONE of the following: (1) 'Social media has done more harm than good to society.' To what extent do you agree? Argue your position. (2) 'Governments should make voting compulsory for all eligible citizens.' Do you agree or disagree? Argue your position.", "hint": "Write a persuasive, well-structured argumentative essay. Take a clear position, support it with reasoned arguments and specific examples, address at least one counter-argument, and end with a strong conclusion. Type your answer in the box. Aim for roughly 350 to 500 words.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "43", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid storage box has a rectangular base measuring 5 cm by 12 cm and a height of 9 cm. A straight rod is placed so that it runs from one bottom corner to the opposite top corner (the space diagonal). Find the angle, to 2 d.p., that this rod makes with the horizontal base.", "options": {"A": "36.87°", "B": "60.95°", "C": "55.30°", "D": "34.70°"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A closed rectangular tank has internal dimensions 4 m by 7 m by 11 m. Find the length of the longest straight pole that can fit inside the tank (the space diagonal), to 2 d.p.", "options": {"A": "8.06 m", "B": "13.04 m", "C": "13.64 m", "D": "15.30 m"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In triangle ABC, angle A = 52° and angle B = 60°, and the side opposite A measures 8 cm. Using the sine rule to find a second side first, find the area of the triangle, to 1 d.p.", "options": {"A": "32.6 cm²", "B": "27.7 cm²", "C": "35.2 cm²", "D": "20.4 cm²"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "47", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangular plot has a perimeter of 18 m, and its three sides are in the ratio 5 : 6 : 7. Find the area of the plot using Heron's rule, to 1 d.p.", "options": {"A": "21.0 m²", "B": "14.7 m²", "C": "16.3 m²", "D": "12.2 m²"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"314\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"185\" cy=\"55\" r=\"3\" fill=\"#1F3864\"/><text x=\"185\" y=\"47\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"180\" y=\"215\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">5 m</text><text x=\"264\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">6 m</text><text x=\"100\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">7 m</text></svg>", "passage": "", "qnum": "4"}, {"n": "48", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In an arithmetic progression the 7th term is 27 and the 15th term is 59. Find the 30th term.", "options": {"A": "115", "B": "123", "C": "119", "D": "87"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "49", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In an arithmetic progression the sum of the first 10 terms is 145 and the 4th term is 16. Find the sum of the first 20 terms.", "options": {"A": "190", "B": "210", "C": "175", "D": "380"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "50", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a geometric progression the 2nd term is 12 and the 5th term is 324. Find the 7th term.", "options": {"A": "972", "B": "8748", "C": "1296", "D": "2916"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A convergent geometric progression has first term 18 and common ratio 2/3. Find the sum to infinity.", "options": {"A": "27", "B": "54", "C": "12", "D": "30"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A convergent geometric progression has its 2nd term equal to 6 and its 4th term equal to 1.5. Find the sum to infinity (take the positive common ratio).", "options": {"A": "16", "B": "48", "C": "9", "D": "24"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "An arithmetic progression begins 50, 44, 38, … . Find the value of the first term in the sequence that is negative.", "options": {"A": "−4", "B": "2", "C": "−10", "D": "−6"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Convert 150° to radians, giving an exact answer in terms of π.", "options": {"A": "2π/3", "B": "3π/4", "C": "5π/6", "D": "4π/5"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In the binomial expansion of (2x − 3)⁶, find the coefficient of the x⁴ term.", "options": {"A": "2160", "B": "240", "C": "−2160", "D": "720"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the polynomial of least degree, with leading coefficient 1, whose only zeros are x = 2 and x = −3.", "options": {"A": "x² − x − 6", "B": "x² + x − 6", "C": "x² + 5x + 6", "D": "x² − 5x + 6"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Use the cosine rule: a triangle has two sides of 9 cm and 11 cm with an included angle of 73° between them. Find the length of the third side, to 2 d.p.", "options": {"A": "14.21 cm", "B": "16.12 cm", "C": "20.00 cm", "D": "12.00 cm"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sector of a circle, shown shaded, has radius 12 cm and a central angle of 2.5 radians. Find the area of the sector.", "options": {"A": "30 cm²", "B": "360 cm²", "C": "180 cm²", "D": "90 cm²"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In the binomial expansion of (3 + 2x)⁵, find the coefficient of the x² term.", "options": {"A": "120", "B": "270", "C": "1080", "D": "540"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A geometric progression has first term 4 and common ratio 1.5. Find the sum of the first 6 terms, to 3 d.p.", "options": {"A": "45.563", "B": "83.125", "C": "91.188", "D": "30.375"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A geometric progression has first term 5 and common ratio 2. Find the smallest value of n for which the nth term first exceeds 1000.", "options": {"A": "10", "B": "9", "C": "8", "D": "11"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the sequence: 2, 3, 6, 7, 14, 15, __. Two rules alternate. What is the next term?", "options": {"A": "16", "B": "29", "C": "30", "D": "22"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code language: 'mon dal fic' means 'green tigers run', 'dal sup vez' means 'tigers eat fish', and 'fic vez ral' means 'run fish away'. Which word means 'fish'?", "options": {"A": "vez", "B": "dal", "C": "fic", "D": "ral"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Use the fares-and-times grid. Mr Lai must travel from Town P to Town S and arrive no later than 10:00. He wants the cheapest valid journey. Only the routes in the grid are available; a journey is valid only if it arrives by 10:00. Which journey should he take?", "options": {"A": "Direct P→S, $60, arriving 10:00", "B": "P→Q→S, total $52, arriving 10:05", "C": "Express P→S, $75, arriving 09:50", "D": "P→R→S, total $43, arriving 09:55"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A bag holds 4 red, 3 blue and 1 green counter. Two counters are drawn without replacement. What is the probability that both are red?", "options": {"A": "1/4", "B": "3/14", "C": "1/64", "D": "1/2"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word can precede all three of the following to make a real compound word: ____fall, ____proof, ____shed?", "options": {"A": "rain", "B": "water", "C": "snow", "D": "down"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Three of these tiles show the same L-shaped piece simply turned (rotated) on the page; one is a mirror image (a reflection) and so is the odd one out. The L has unequal arms so its handedness is clear. Which tile is the odd one out?", "options": {"A": "Tile A", "B": "Tile B", "C": "Tile C", "D": "Tile D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"472\" height=\"150\" viewBox=\"0 0 472 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"472\" height=\"150\" fill=\"white\"/><g transform=\"rotate(90 59.0 60)\"><polygon points=\"40,29 60,29 60,69 80,69 80,89 40,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"59\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><g transform=\"rotate(180 177.0 60)\"><polygon points=\"158,29 178,29 178,69 198,69 198,89 158,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"177\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><g transform=\"rotate(270 295.0 60)\"><polygon points=\"276,29 296,29 296,69 316,69 316,89 276,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"295\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><g transform=\"translate(826.0 0) scale(-1 1)\"><polygon points=\"394,29 414,29 414,69 434,69 434,89 394,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"413\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "24"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A is to B as C is to ? In the figure, the first shape is a small upright white square with a dot in it; it becomes a large grey square rotated 45° (a diamond) with no dot. Apply the same combined change to C, a small upright white triangle with a dot in it.", "options": {"A": "a large grey triangle rotated to point sideways, with no dot", "B": "a large grey triangle still pointing up, with a dot", "C": "a large grey square rotated 45°, with no dot", "D": "a small white triangle with a dot, rotated 45°"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Argument: \"Our district should convert its entire taxi fleet to electric vehicles within two years. Doing so will cut the district's transport-related carbon emissions to zero, save drivers money, and improve residents' health. The plan is therefore the right one and should be approved without delay.\"\n\nFor the argument's conclusion to hold, the writer must be taking several things for granted. Which ONE of the following is NOT a hidden assumption the argument requires?", "options": {"A": "Electric vehicles are a more advanced technology than petrol vehicles in every respect.", "B": "The electricity used to charge the taxis is itself generated without producing carbon emissions.", "C": "A two-year conversion timetable is achievable given the supply of electric taxis and charging infrastructure.", "D": "Lower running costs for drivers will not be offset by higher purchase or financing costs that leave drivers no better off."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Facts: \"If a manuscript passes peer review, it is sent to the copy-editor. If a manuscript is sent to the copy-editor, it is not returned to the original author. If a manuscript is returned to the original author, it is rescheduled for the next issue.\" You are also told: \"Manuscript Z was returned to its original author.\"\n\nWhich one of the following can be deduced with certainty?", "options": {"A": "Manuscript Z passed peer review but was withdrawn afterwards.", "B": "Manuscript Z did not pass peer review.", "C": "Manuscript Z was sent to the copy-editor before being returned.", "D": "It cannot be determined whether Manuscript Z was rescheduled for the next issue."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"A school surveyed all 500 of its Year 12 students about a proposed Saturday revision programme. Of the 500, exactly 340 said they would attend if the programme were offered free of charge. (No student gave more than one response, and every student responded.)\"\n\nConsider these two conclusions:\n(1) A majority of the surveyed Year 12 students said they would attend the programme if it were free.\n(2) A majority of all secondary students at the school would attend a free Saturday programme.\n\nWhich option correctly states whether each conclusion follows, using only the given information?", "options": {"A": "Both conclusions follow.", "B": "Neither conclusion follows.", "C": "Conclusion 1 follows; Conclusion 2 does not follow.", "D": "Conclusion 1 does not follow; Conclusion 2 follows."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "72", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Facts: \"Every athlete selected for the national squad must pass the fitness test. No one who has passed the fitness test is exempt from the anti-doping check. Priya has been selected for the national squad.\"\n\nWhich one of the following conclusions does NOT follow from the facts?", "options": {"A": "Priya must pass the fitness test.", "B": "Priya is not exempt from the anti-doping check.", "C": "Anyone who is exempt from the anti-doping check has not passed the fitness test.", "D": "Anyone who passes the fitness test has been selected for the national squad."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "73", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A student is researching whether a popular dietary supplement, BrainBoost, improves memory. She finds two sources making the SAME claim, that BrainBoost improves memory. Judging only on how credible each source is, which source's support for the claim should she trust MORE, and why?", "options": {"A": "Source 1: a glossy advertisement on BrainBoost's own website featuring before-and-after testimonials from three named customers who say their memory improved.", "B": "Source 3: a peer-reviewed article in an independent medical journal reporting a randomised double-blind trial in which BrainBoost outperformed a placebo on a standard memory test.", "C": "Source 2: a blog post by a wellness influencer who was paid by BrainBoost to write it, citing 'studies' but linking to none.", "D": "All three sources are equally credible, because they all reach the same conclusion about BrainBoost."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "74", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"After a hospital introduced a new electronic patient-records system, the average time patients waited in the emergency department fell by 18% over the following six months. During those same six months, the hospital also opened four additional treatment bays and recruited six extra nurses.\"\n\nWhich one of the following can be inferred with CERTAINTY from the statement alone?", "options": {"A": "The new electronic records system was the cause of the 18% fall in waiting time.", "B": "Without the four additional treatment bays, waiting time would not have fallen.", "C": "The six extra nurses were recruited specifically to reduce waiting time.", "D": "Average emergency-department waiting time fell after the changes were introduced."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "75", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "根據文章，「我」起初對祖父修補舊物的態度是怎樣的？<br><span style=\"color:#555\">根据文章，「我」起初对祖父修补旧物的态度是怎样的？</span>", "options": {"A": "不以為然，覺得不值得花工夫<br><span style=\"color:#555\">不以为然，觉得不值得花工夫</span>", "B": "十分敬佩，主動向他學習<br><span style=\"color:#555\">十分敬佩，主动向他学习</span>", "C": "感到害怕，不敢靠近他", "D": "漠不關心，從未留意過<br><span style=\"color:#555\">漠不关心，从未留意过</span>"}, "fig": "", "passage": "小時候，每逢家中有東西壞了，我總嚷著要買新的。祖父卻不慌不忙地取出工具箱，戴上老花鏡，把那些別人眼中的廢物一件件擺在桌上。他的手指彷彿有了眼睛，輕輕一摸，便知道毛病出在哪裏。一把舊鎖、一台收音機，到了他手裏，總能恢復往日的模樣，重新派上用場。我起初不以為然，覺得這不過是白費工夫，壞了的東西買新的便是了。有一回，我見他為了一隻只值幾塊錢的舊鬧鐘，伏在燈下足足修了一個下午，更覺得他傻。直到有一天，他一面修補著母親留下的舊鐘，一面輕聲說：「每一件舊物，都連著一段日子，丟了，那段日子也就跟著沒了。」那一刻，我才恍然大悟，原來他珍惜的從來不是物件本身，而是物件背後那些再也回不來的時光。<br><span style=\"color:#555\">小时候，每逢家中有东西坏了，我总嚷着要买新的。祖父却不慌不忙地取出工具箱，戴上老花镜，把那些别人眼中的废物一件件摆在桌上。他的手指仿佛有了眼睛，轻轻一摸，便知道毛病出在哪里。一把旧锁、一台收音机，到了他手里，总能恢复往日的模样，重新派上用场。我起初不以为然，觉得这不过是白费工夫，坏了的东西买新的便是了。有一回，我见他为了一只只值几块钱的旧闹钟，伏在灯下足足修了一个下午，更觉得他傻。直到有一天，他一面修补着母亲留下的旧钟，一面轻声说：「每一件旧物，都连着一段日子，丢了，那段日子也就跟着没了。」那一刻，我才恍然大悟，原来他珍惜的从来不是物件本身，而是物件背后那些再也回不来的时光。</span>", "qnum": "1"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "文中「他的手指彷彿有了眼睛」一句，主要表現祖父甚麼特點？<br><span style=\"color:#555\">文中「他的手指仿佛有了眼睛」一句，主要表现祖父什么特点？</span>", "options": {"A": "視力比常人銳利<br><span style=\"color:#555\">视力比常人锐利</span>", "B": "對毛病的感知靈敏、手藝高超<br><span style=\"color:#555\">对毛病的感知灵敏、手艺高超</span>", "C": "喜歡在黑暗中工作<br><span style=\"color:#555\">喜欢在黑暗中工作</span>", "D": "性格固執、不願改變<br><span style=\"color:#555\">性格固执、不愿改变</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "「每一件舊物，都連著一段日子，丟了，那段日子也就跟著沒了。」這句話的意思最接近：<br><span style=\"color:#555\">「每一件旧物，都连着一段日子，丢了，那段日子也就跟着没了。」这句话的意思最接近：</span>", "options": {"A": "舊物用久了便會自然損壞，不必可惜<br><span style=\"color:#555\">旧物用久了便会自然损坏，不必可惜</span>", "B": "丟掉舊物可以騰出空間，迎接新的生活<br><span style=\"color:#555\">丢掉旧物可以腾出空间，迎接新的生活</span>", "C": "日子過得太快，舊物來不及修好就壞了<br><span style=\"color:#555\">日子过得太快，旧物来不及修好就坏了</span>", "D": "舊物承載著往日的回憶，丟棄它就等於丟掉那段記憶<br><span style=\"color:#555\">旧物承载着往日的回忆，丢弃它就等于丢掉那段记忆</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "文章結尾「我」的轉變，最適合用下列哪個詞語來概括？<br><span style=\"color:#555\">文章结尾「我」的转变，最适合用下列哪个词语来概括？</span>", "options": {"A": "恍然大悟", "B": "無動於衷<br><span style=\"co an style=\"color:#555\">祖父修好了一把旧锁。</span>", "B": "桌上放著一個老花鏡。<br><span style=\"color:#555\">桌上放着一个老花镜。</span>", "C": "他遞給我一支舊鋼筆。<br><span style=\"color:#555\">他递给我一支旧钢笔。</span>", "D": "牆角擺著一張舊木櫃。<br><span style=\"color:#555\">墙角摆着一张旧木柜。</span>"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "「祖父的工具箱裏，整整齊齊放著好幾______螺絲批和鉗子。」最合適的量詞是：<br><span style=\"color:#555\">「祖父的工具箱里，整整齐齐放着好几______螺丝批和钳子。」最合适的量词是：</span>", "options": {"A": "件", "B": "把", "C": "副", "D": "枝"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "「祖父做事一絲不苟」中「一絲不苟」的意思是：<br><span style=\"color:#555\">「祖父做事一丝不苟」中「一丝不苟」的意思是：</span>", "options": {"A": "做事拖拖拉拉，毫不上心", "B": "連最細微處也不馬虎，極為認真<br><span style=\"color:#555\">连最细微处也不马虎，极为认真</span>", "C": "做一件事只用一點力氣<br><span style=\"color:#555\">做一件事只用一点力气</span>", "D": "凡事斤斤計較，毫不讓步<br><span style=\"color:#555\">凡事斤斤计较，毫不让步</span>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "87", "type": "mcq", "section": "Chinese", "stem": "「他把那台舊收音機修得______，連雜音也沒有了。」填入畫線處最恰當的成語是：<br><span style=\"color:#555\">「他把那台旧收音机修得______，连杂音也没有了。」填入画线处最恰当的成语是：</span>", "options": {"A": "煥然一新<br><span style=\"color:#555\">焕然一新</span>", "B": "亡羊補牢<br><span style=\"color:#555\">亡羊补牢</span>", "C": "畫蛇添足<br><span style=\"color:#555\">画蛇添足</span>", "D": "杯弓蛇影"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "88", "type": "mcq", "section": "Chinese", "stem": "下列句子沒有語病的一句是：<br><span style=\"color:#555\">下列句子没有语病的一句是：</span>", "options": {"A": "通過祖父的講解，使我明白了惜物的道理。<br><span style=\"color:#555\">通过祖父的讲解，使我明白了惜物的道理。</span>", "B": "祖父修補舊物的手藝，是我從小就十分佩服。<br><span style=\"color:#555\">祖父修补旧物的手艺，是我从小就十分佩服。</span>", "C": "無論颳風下雨，他都堅持把答應別人的東西修好。<br><span style=\"color:#555\">无论刮风下雨，他都坚持把答应别人的东西修好。</span>", "D": "能否修好這台舊鐘，關鍵在於他肯不肯花心思去琢磨。<br><span style=\"color:#555\">能否修好这台旧钟，关键在于他肯不肯花心思去琢磨。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "89", "type": "mcq", "section": "Chinese", "stem": "「只要肯花心思，_ let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
