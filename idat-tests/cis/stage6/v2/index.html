<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

 "Which sentence uses the colon CORRECTLY?", "options": {"A": "The ingredients we need are: flour, sugar, and butter.", "B": "He travelled to: Rome, Vienna, and Prague.", "C": "She whispered: that the door was open.", "D": "Her argument rested on one principle: fairness must come before efficiency."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below? \"When my colleague claimed he had read the entire report in five minutes, I took his boast <u>with a grain of salt</u>.\"", "options": {"A": "with great enthusiasm", "B": "with scepticism, not fully believing it", "C": "with bitter resentment", "D": "as a serious warning"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Read the sentence and choose the option that correctly applies subject-verb agreement: \"Neither the coaches nor the player ______ satisfied with the result.\"", "options": {"A": "was", "B": "were", "C": "were not", "D": "have been"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which word is the most precise, formal substitute for the underlined word in this academic sentence? \"The two studies showed almost the same results, which made the conclusion stronger.\"", "options": {"A": "different", "B": "convenient", "C": "convergent", "D": "frequent"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which revision combines the two sentences with the most effective use of SUBORDINATION to show their relationship? \"The experiment failed. The team learned a valuable lesson.\"", "options": {"A": "Although the experiment failed, the team learned a valuable lesson.", "B": "The experiment failed and the team learned a valuable lesson.", "C": "The experiment failed, the team learned a valuable lesson.", "D": "The experiment failed, so therefore the team learned a valuable lesson."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Which underlined phrase is a EUPHEMISM? \"After the restructuring, the airline said it would <u>right-size its workforce</u> while continuing to invest in new routes.\"", "options": {"A": "after the restructuring", "B": "right-size its workforce", "C": "continuing to invest", "D": "in new routes"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error. \"Each of the candidates (A) have submitted (B) their portfolios (C) before the deadline (D).\"", "options": {"A": "have submitted", "B": "their portfolios", "C": "before the deadline", "D": "No error"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "In the sentence, the word 'table' functions as which part of speech? \"The committee decided to table the motion until more evidence could be gathered.\"", "options": {"A": "noun", "B": "verb", "C": "adjective", "D": "adverb"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Choose the word that most precisely conveys mild, good-natured amusement rather than scorn: \"There was a ______ smile on her face as she watched the puppy chase its tail.\"", "options": {"A": "smug", "B": "sardonic", "C": "nervous", "D": "wry"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which sentence uses a matched pair of DASHES CORRECTLY to set off a parenthetical remark?", "options": {"A": "My oldest friend -- whom I have known since childhood -- never forgets a birthday.", "B": "My oldest friend, whom I have known since childhood -- never forgets a birthday.", "C": "My oldest friend -- whom I have known since childhood, never forgets a birthday.", "D": "My oldest friend, whom I have known since childhood, never forgets a birthday --."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'ostensible' in the sentence below? \"The ostensible purpose of the visit was friendship, but everyone suspected a business motive.\"", "options": {"A": "genuine and heartfelt", "B": "secret and hidden", "C": "unimportant and minor", "D": "apparent or claimed (but perhaps not real)"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes this third (unreal past) conditional: \"If the engineers ______ the warning signs, the bridge would not have collapsed.\"", "options": {"A": "had heeded", "B": "heeded", "C": "would have heeded", "D": "have heeded"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which term names the device in this line? \"The silence after the verdict was deafening.\"", "options": {"A": "hyperbole", "B": "oxymoron", "C": "simile", "D": "alliteration"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Which revision corrects the dangling modifier? \"Hoping to win the prize, the entry was submitted an hour before the deadline.\"", "options": {"A": "Hoping to win the prize, the entry was submitted an hour before the deadline by us.", "B": "Hoping to win the prize, we submitted the entry an hour before the deadline.", "C": "The entry, hoping to win the prize, was submitted an hour before the deadline.", "D": "Hoping to win the prize the entry was submitted an hour before the deadline."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Select the word with the most strongly NEGATIVE connotation for a leader who refuses to listen to others:", "options": {"A": "overbearing", "B": "authoritative", "C": "autocratic", "D": "firm"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error. \"The novel, (A) along with its many sequels, (B) were translated (C) into twelve languages (D).\"", "options": {"A": "along with its many sequels", "B": "were translated", "C": "into twelve languages", "D": "No error"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'galvanise' in the sentence below? \"The shocking report galvanised the community into immediate action.\"", "options": {"A": "to frighten into silence", "B": "to slowly persuade over time", "C": "to stir into sudden, energetic action", "D": "to divide into opposing groups"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Which sentence opening creates the most effective EMPHASIS through inversion?", "options": {"A": "The team had never faced such a formidable opponent before this.", "B": "Never had the team faced such a formidable opponent.", "C": "The team never faced such a formidable opponent, never.", "D": "Such a formidable opponent the team had never, ever faced."}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean? \"For weeks the company kept the new product hidden, but a junior employee <u>spilled the beans</u> in an interview.\"", "options": {"A": "caused unnecessary panic", "B": "refused to give a clear answer", "C": "made a costly mistake", "D": "revealed a secret, often accidentally"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "In which part of speech is the underlined word used? \"The senators hoped to <u>weather</u> the storm of public criticism and remain in office.\"", "options": {"A": "verb", "B": "noun", "C": "adjective", "D": "preposition"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which sentence is spelled and punctuated correctly?", "options": {"A": "It's effect on the economy was greater than the governments advisers had predicted.", "B": "Its' effect on the economy was greater than the government's advisers had predicted.", "C": "Its effect on the economy was greater than the government's advisers had predicted.", "D": "It's effect on the economy was greater than the government's advisers had predicted."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "Choose the word that conveys praise for careful attention to detail rather than criticism for fussiness: \"She was ______ in checking every figure before submitting the report.\"", "options": {"A": "meticulous", "B": "pedantic", "C": "careless", "D": "fussy"}, "fig": "", "passage": "", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'inexorable' in the sentence below? \"Despite every protest, the inexorable march of automation continued.\"", "options": {"A": "surprisingly gentle", "B": "easily reversed", "C": "poorly planned", "D": "impossible to stop or resist"}, "fig": "", "passage": "", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "Which statement best expresses the central theme of the story?", "options": {"A": "Real knowledge requires testing what we have merely been told, even at personal cost.", "B": "Sailors should never trust maps drawn by people who have not travelled.", "C": "Old craftsmen are always wiser than their young apprentices.", "D": "Maps are useless unless they are drawn with perfect neatness."}, "fig": "", "passage": "<strong>The Cartographer's Apprentice</strong><br>Mira had drawn maps since she was old enough to hold a pen, but she had never once left the walled town of her birth. Her master, the old cartographer Bedros, possessed a workshop crowded with charts of coastlines he had never sailed and mountains he had never climbed, each one copied from the testimony of returning travellers. \"A good map,\" he liked to say, tapping the side of his nose, \"is built from a hundred honest lies.\"\n\nMira did not understand him, and for years she did not try. She simply copied. She traced the rivers exactly as Bedros traced them, inked the same dragons into the same empty seas, and lettered the same warnings along the same blank margins: HERE THE LAND IS NOT YET KNOWN. The maps sold well. Merchants paid handsomely for them, and Mira took quiet pride in the neatness of her hand.\n\nThen, one grey morning, a sailor came to the workshop with a complaint. He unrolled one of Bedros's charts on the counter and stabbed a finger at a tidy bay drawn near the southern edge. \"There is no bay here,\" he said. \"I sailed past this coast a month ago. Where your map shows safe water, there are rocks that have sunk three ships.\" Bedros only shrugged. \"The man who described it to me believed there was a bay,\" he said. \"I drew what he believed.\"\n\nThat night Mira could not sleep. She had inked that bay herself, a dozen times, never once asking whether it was real. She had assumed that because the line was drawn confidently, it must be true; that neatness was the same as accuracy. Now she imagined the sailors steering trustfully toward her elegant, invented bay, and the thought sat cold in her chest.\n\nIn the morning she did something she had never done. She packed a satchel, bought passage on a southbound ship, and went to see the coast for herself. The voyage was wretched: she was sick for three days, soaked for five, and frightened for most of the rest. But when at last the southern shore rose out of the haze, she saw with her own eyes the jagged rocks where her bay had been, and she understood at last what Bedros had meant, and where he had been wrong.\n\nWhen she returned, months later, she did not throw away the old charts. Instead she began to mark y had been, and she understood at last what Bedros had meant, and where he had been wrong.\n\nWhen she returned, months later, she did not throw away the old charts. Instead she began to mark them differently. Where a coastline had been seen by no one she knew, she wrote not a confident line but a faint, broken one, and beside it a small honest word: REPORTED. Where she had stood herself, she drew firm and dark. Bedros, grown frail now, studied her new maps for a long time. \"You have ruined the neatness,\" he said at last. Then he smiled. \"But you have made them true.\"", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "\"A good map is built from a hundred honest lies.\" Which device is used in the phrase 'honest lies'?", "options": {"A": "hyperbole", "B": "simile", "C": "alliteration", "D": "oxymoron"}, "fig": "", "passage": "<strong>The Cartographer's Apprentice</strong><br>Mira had drawn maps since she was old enough to hold a pen, but she had never once left the walled town of her birth. Her master, the old cartographer Bedros, possessed a workshop crowded with charts of coastlines he had never sailed and mountains he had never climbed, each one copied from the testimony of returning travellers. \"A good map,\" he liked to say, tapping the side of his nose, \"is built from a hundred honest lies.\"\n\nMira did not understand him, and for years she did not try. She simply copied. She traced the rivers exactly as Bedros traced them, inked the same dragons into the same empty seas, and lettered the same warnings along the same blank margins: HERE THE LAND IS NOT YET KNOWN. The maps sold well. Merchants paid handsomely for them, and Mira took quiet pride in the neatness of her hand.\n\nThen, one grey morning, a sailor came to the workshop with a complaint. He unrolled one of Bedros's charts on the counter and stabbed a finger at a tidy bay drawn near the southern edge. \"There is no bay here,\" he said. \"I sailed past this coast a month ago. Where your map shows safe water, there are rocks that have sunk three ships.\" Bedros only shrugged. \"The man who described it to me believed there was a bay,\" he said. \"I drew what he believed.\"\n\nThat night Mira could not sleep. She had inked that bay herself, a dozen times, never once asking whether it was real. She had assumed that because the line was drawn confidently, it must be true; that neatness was the same as accuracy. Now she imagined the sailors steering trustfully toward her elegant, invented bay, and the thought sat cold in her chest.\n\nIn the morning she did something she had never done. She packed a satchel, bought passage on a southbound ship, and went to see the coast for herself. The voyage was wretched: she was sick for three days, soaked for five, and frightened for most of the rest. But when at last the southern shore rose out of the haze, she saw with her own eyes the jagged rocks where her bay had been, and she understood at last what Bedros had meant, and where he had been wrong.\n\nWhen she returned, months later, she did not throw away the old charts. Instead she began to mark them differently. Where a coastline had been seen by no one she knew, she wrote not a confident line but a faint, broken one, and beside it a small honest word: REPORTED. Where she had stood herself, she drew firm and dark. Bedros, grown frail now, studied her new maps for a long time. \"You have ruined the neatness,\" he said at last. Then he smiled. \"But you have made them true.\"", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "According to Mira's own thinking that sleepless night, what mistaken assumption had she been making about the maps she copied?", "options": {"A": "That merchants would refuse to pay for untidy charts", "B": "That a confidently drawn, neat line must be accurate", "C": "That Bedros had personally visited every coast he drew", "D": "That dragons in the empty seas were real creatures"}, "fig": "", "passage": ose out of the haze, she saw with her own eyes the jagged rocks where her bay had been, and she understood at last what Bedros had meant, and where he had been wrong.\n\nWhen she returned, months later, she did not throw away the old charts. Instead she began to mark them differently. Where a coastline had been seen by no one she knew, she wrote not a confident line but a faint, broken one, and beside it a small honest word: REPORTED. Where she had stood herself, she drew firm and dark. Bedros, grown frail now, studied her new maps for a long time. \"You have ruined the neatness,\" he said at last. Then he smiled. \"But you have made them true.\"", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "Bedros's final words, \"You have ruined the neatness... But you have made them true,\" most powerfully reinforce the theme because they:", "options": {"A": "reveal that the old maps had never sold well in the first place", "B": "prove that Bedros had always secretly wanted Mira to leave the workshop", "C": "show that honesty about the limits of one's knowledge can matter more than a polished appearance", "D": "suggest that neatness and truth can never exist together in any map"}, "fig": "", "passage": "<strong>The Cartographer's Apprentice</strong><br>Mira had drawn maps since she was old enough to hold a pen, but she had never once left the walled town of her birth. Her master, the old cartographer Bedros, possessed a workshop crowded with charts of coastlines he had never sailed and mountains he had never climbed, each one copied from the testimony of returning travellers. \"A good map,\" he liked to say, tapping the side of his nose, \"is built from a hundred honest lies.\"\n\nMira did not understand him, and for years she did not try. She simply copied. She traced the rivers exactly as Bedros traced them, inked the same dragons into the same empty seas, and lettered the same warnings along the same blank margins: HERE THE LAND IS NOT YET KNOWN. The maps sold well. Merchants paid handsomely for them, and Mira took quiet pride in the neatness of her hand.\n\nThen, one grey morning, a sailor came to the workshop with a complaint. He unrolled one of Bedros's charts on the counter and stabbed a finger at a tidy bay drawn near the southern edge. \"There is no bay here,\" he said. \"I sailed past this coast a month ago. Where your map shows safe water, there are rocks that have sunk three ships.\" Bedros only shrugged. \"The man who described it to me believed there was a bay,\" he said. \"I drew what he believed.\"\n\nThat night Mira could not sleep. She had inked that bay herself, a dozen times, never once asking whether it was real. She had assumed that because the line was drawn confidently, it must be true; that neatness was the same as accuracy. Now she imagined the sailors steering trustfully toward her elegant, invented bay, and the thought sat cold in her chest.\n\nIn the morning she did something she had never done. She packed a satchel, bought passage on a southbound ship, and went to see the coast for herself. The voyage was wretched: she was sick for three days, soaked for five, and frightened for most of the rest. But when at last the southern shore rose out of the haze, she saw with her own eyes the jagged rocks where her bay had been, and she understood at last what Bedros had meant, and where he had been wrong.\n\nWhen she returned, months later, she did not throw away the old charts. Instead she began to mark them differently. Where a coastline had been seen by no one she knew, she wrote not a confident line but a faint, broken one, and beside it a small honest word: REPORTED. Where she had stood herself, she drew firm and dark. Bedros, grown frail now, studied her new maps for a long time. \"You have ruined the neatness,\" he said at last. Then he smiled. \"But you have made them true.\"", "qnum": "34"}, {"n": "36", "type": "mcq", "section": "English", "stem": "Which statement best captures the main idea of the passage?", "options": {"A": "Deserts are defined entirely by the amount of sand they contain.", "B": "Antarctica is the largest desert in the world.", "C": "Desert dunes are shaped over long periods by the combined action of water and, above all, wind.", "D": "Saltation is the only way that wind can move sand."}, "fig": "", "passage": "<strong>How a Desert Becomes a Sea of Sand</strong><br>To most people the word 'desert' summons an image of endless dunes, yet sand seas of the kind seen in the Sahara cover only about a fifth of the world's deserts. A desert is defined not by its sand but by its dryness: any region receiving less than 250 millimetres of rainfall a year qualifies, whether it is the icy expanse of Antarctica or the baking flats of Australia. The towering dunes that capture our imagination are the product of a long and patient collaboration between rock, water, and above all, wind.\n\nThe story begins, surprisingly, with water. Over thousands of years, rare but violent desert rains shatter exposed rock and wash the fragments into dry riverbeds and basins. There the debris is ground finer and finer until it becomes sand: countless grains, most of them quartz, each polished smooth by repeated collision. Only once this raw material exists in vast quantities can the wind begin its work.\n\nWind moves sand in three ways. The lightest, finest dust is lifted high into the air and may travel for thousands of kilometres, sometimes crossing entire oceans to fall as a fine haze on distant continents. Medium grains hop along the surface in a bouncing motion that scientists call saltation, each grain dislodging others as it lands, so that a whole sheet of sand seems to creep forward. The heaviest grains are too large to lift and instead roll and slide, nudged along by the impact of their hopping neighbours. It is saltation, that endless bouncing dance, that does most of the work of building a dune.\n\nA dune forms wherever something slows the wind enough to make it drop its load: a rock, a shrub, even a slight rise in the ground. Sand accumulates on the windward slope, is carried over the crest, and slips down the sheltered face beyond. Grain by grain, the entire dune migrates downwind, sometimes advancing several metres in a single year. Whole villages and ancient roads have been swallowed by dunes on the march.\n\nThe shape a dune takes is a kind of written record of the wind that made it. Where the wind blows steadily from one direction, crescent-shaped barchan dunes form, their horns pointing downwind. Where winds blow from two directions, long straight ridges called linear dunes appear. And where the wind is so variable that it has no single mind, star dunes rise, with arms reaching out in several directions at once. To a trained eye, then, a desert is not a wasteland of sameness but an archive, every ridge and hollow recording the invisible currents of air that shaped it over centuries.", "qnum": "35"}, {"n": "37", "type": "mcq", "section": "English", "stem": "According to the passage, what defines a region as a desert?", "options": {"A": "Being covered in quartz sand", "B": "Receiving less than 250 millimetres of rainfall a year", "C": "Having dunes that migrate downwind", "D": "Reaching very high daytime temperatures"}, "fig": "", "passage": "<strong>How a Desert Becomes a Sea of Sand</strong><br>To most people the word 'desert' summons an image of endless dunes, yet sand seas of the kind seen in the Sahara cover only about a fifth of the world's deserts. A desert is defined not by its sand but by its dryness: any region receiving less than 250 millimetres of rainfall a year qualifies, whether it is the icy expanse of Antarctica or the baking flats of Australia. The towering dunes that capture our imagination are the product of a long and patient collaboration between rock, water, and above all, wind.\n\nThe story begins, surprisingly, with water. Over thousands of years, rare but violent desert rains  every ridge and hollow recording the invisible currents of air that shaped it over centuries.", "qnum": "40"}, {"n": "42", "type": "writing", "section": "English Writing", "intro": "Stage 6 (Year 12) argumentative essay: assesses sophistication of reasoning, quality of evidence, handling of counter-arguments, and control of register and sentence variety.", "label": "", "body": "Choose ONE of the following: (1) 'Smartphones should be banned in secondary schools.' To what extent do you agree? Argue your position with reasons and evidence. (2) Some people believe that students should be allowed to use artificial intelligence tools freely in their schoolwork; others believe this undermines genuine learning. Argue which view you find more convincing.", "hint": "Write a persuasive, well-structured argumentative essay. Take a clear position, support it with developed reasons and evidence, acknowledge and respond to at least one opposing view, and organise your essay with an introduction, well-linked body paragraphs, and a conclusion. Use precise vocabulary, varied sentence structures, and accurate punctuation (including colons, semicolons and dashes where appropriate).", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "43", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A surveyor standing 40 m from the foot of a vertical mast measures the angle of elevation to the top of the mast as 38°. Her measuring instrument is 1.6 m above the ground. Find the height of the mast, to 1 d.p.", "options": {"A": "32.9 m", "B": "31.2 m", "C": "24.6 m", "D": "51.2 m"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In triangle PQR, sides PQ = 6 cm and PR = 10 cm meet at P with the included angle ∠P = 48°. Find the length of the third side QR, to 2 d.p.", "options": {"A": "8.00 cm", "B": "14.69 cm", "C": "7.46 cm", "D": "11.66 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"314\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"185\" cy=\"55\" r=\"3\" fill=\"#1F3864\"/><text x=\"185\" y=\"47\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"180\" y=\"215\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">6 cm</text><text x=\"264\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#C00\">?</text><text x=\"100\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">10 cm</text><text x=\"84\" y=\"223\" font-size=\"13\" fill=\"#C00\">48°</text><path d=\"M78,195 A18,18 0 0 1 72,182\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.4\"/></svg>", "passage": "", "qnum": "2"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A scalene triangular field has sides of 7 m, 8 m and 11 m. Find its area using Heron's rule, to 1 d.p.", "options": {"A": "38.5 m²", "B": "30.8 m²", "C": "20.4 m²", "D": "27.9 m²"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "47", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In triangle ABC, AB = 13 cm, AC = 16 cm and the angle between them ∠A = 37°. Find the area of the triangle, to 1 d.p.", "options": {"A": "83.0 cm²", "B": "62.6 cm²", "C": "104.0 cm²", "D": "125.2 cm²"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "48", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The arithmetic progression 3, 7, 11, 15, … has the sum of its first n terms equal to 465. Find n.", "options": {"A": "12", "B": "16", "C": "31", "D": "15"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "49", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In an arithmetic progression the 5th term is 23 and the 12th term is 58. Find the sum of the first 20 terms.", "options": {"A": "1010", "B": "1160", "C": "920", "D": "505"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "50", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A convergent geometric progression has first term 18 and common ratio 1/3. Find its sum to infinity.", "options": {"A": "54", "B": "24", "C": "27", "D": "6"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a geometric progression the 3rd term is 20 and the 6th term is 540. Find the common ratio.", "options": {"A": "9", "B": "3", "C": "27", "D": "1.5"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A colony of bacteria numbers 5000 and increases by 8% each hour. Treating the hourly counts as a geometric progression, find the population after 6 hours, to the nearest whole number.", "options": {"A": "7400", "B": "7000", "C": "8568", "D": "7934"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sector of a circle, shown shaded, has radius 9 cm and a central angle of 1.2 radians. Find the length of the arc bounding the sector.", "options": {"A": "10.8 cm", "B": "48.6 cm", "C": "97.2 cm", "D": "7.5 cm"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sector of a circle has radius 10 cm and a central angle of 0.8 radians. Find the area of the sector.", "options": {"A": "8 cm²", "B": "80 cm²", "C": "40 cm²", "D": "16 cm²"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Convert 210° to radians, giving the answer as a multiple of π.", "options": {"A": "5π/6", "B": "7π/6", "C": "7π/4", "D": "6π/7"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the coefficient of x⁵ in the binomial expansion of (x − 2)⁷.", "options": {"A": "84", "B": "−84", "C": "21", "D": "−168"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the coefficient of x³ in the binomial expansion of (2x + 3)⁵.", "options": {"A": "240", "B": "80", "C": "1080", "D": "720"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find a polynomial of least degree, with leading coefficient 1, whose only zeros are x = 1, x = −4 and x = 0.", "options": {"A": "x³ − 3x² − 4x", "B": "x³ + 3x² − 4x", "C": "x³ + 3x² + 4x", "D": "x² + 3x − 4"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangle has sides of 5 cm, 7 cm and 8 cm. Use the cosine rule to find the size of the largest angle, to 1 d.p.", "options": {"A": "38.2°", "B": "60.0°", "C": "81.8°", "D": "98.2°"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A geometric progression has first term 7 and common ratio 2. Find the smallest value of n for which the nth term first exceeds 5000.", "options": {"A": "9", "B": "12", "C": "10", "D": "11"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A right pyramid has a square base of side 10 cm and a vertical height of 12 cm, with its apex directly above the centre of the base. Find the angle, to 1 d.p., that a lateral edge (from a base corner to the apex) makes with the base.", "options": {"A": "59.5°", "B": "67.4°", "C": "50.2°", "D": "30.5°"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Read this cryptic clue carefully: \"The more of me you take, the more you leave behind. What am I?\" Which answer correctly resolves the clue?", "options": {"A": "Footsteps", "B": "Money", "C": "Time", "D": "Breaths"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a made-up language: 'tovi lan rek' means 'birds sing loudly', 'lan dush tovi' means 'loudly fly birds', and 'mira rek dush' means 'children sing fly'. Which word means 'loudly'?", "options": {"A": "tovi", "B": "rek", "C": "lan", "D": "dush"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Line 1 trains leave a platform at 06:00 and every 40 minutes after that. Line 2 trains leave the same platform at 06:10 and every 25 minutes after that. After 06:00, what is the FIRST time a train from each line departs within the same minute?", "options": {"A": "07:00", "B": "08:00", "C": "07:20", "D": "08:40"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Complete the analogy by the relationship, not the meaning: FOUNDATION is to BUILDING as PREMISE is to ___", "options": {"A": "Conclusion", "B": "Argument", "C": "Roof", "D": "Debate"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A bag holds 4 red, 3 green and 2 yellow counters. Two counters are drawn at random WITHOUT replacement. What is the probability that BOTH counters are red?", "options": {"A": "16/81", "B": "4/27", "C": "1/6", "D": "4/9"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The flat net below folds up into a cube. Reading left to right, the bottom row is four squares P, Q, R, S in a line; square E is attached on top of Q and square F is attached underneath Q. When the net is folded into a cube, which face ends up DIRECTLY OPPOSITE face Q?", "options": {"A": "Face P", "B": "Face S", "C": "Face E", "D": "Face R"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Each term in this sequence is built from the TWO terms before it by a single fixed rule: 1, 2, 5, 13, 34, ___. What number comes next?", "options": {"A": "89", "B": "102", "C": "47", "D": "68"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The city should make entry to the public museum free of charge, because doing so will substantially increase the number of residents who visit it.\" PROPOSED ASSUMPTION: \"For at least some residents, the entry fee is currently a real factor in their decision not to visit the museum.\" Using only the information in the statement, is this assumption logical (i.e. is it something the statement must be taking for granted)?", "options": {"A": "No — the statement is about visitor numbers, so it makes no assumptions about why people currently stay away.", "B": "Yes — free entry would attract more visitors because museums are widely known to be good for education, and the statement relies on that established fact.", "C": "Yes — for removing the fee to substantially increase visits, the argument must take for granted that the fee is, for at least some residents, a genuine reason they currently do not visit.", "D": "No — many residents stay away because of distance or lack of interest, so the assumption is factually false."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"In a review of 400 research projects at a university, every project that was awarded a distinction grade had also been submitted before its deadline. Some projects that were submitted before their deadline were not awarded a distinction grade.\" Which one of the following MUST be true on the basis of this statement alone?", "options": {"A": "Submitting a project before its deadline was the cause of it being awarded a distinction grade.", "B": "Submitting a project before its deadline does not, by itself, guarantee that the project was awarded a distinction grade.", "C": "Every project that was submitted before its deadline was awarded a distinction grade.", "D": "Most of the 400 projects were submitted before their deadline."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Last year a regional grid generated 820 gigawatt-hours (GWh) from solar and 640 GWh from coal. Four years earlier it had generated 250 GWh from solar and 980 GWh from coal. Over the same four years the region's average electricity bill rose.\" CONCLUSIONS: (1) Solar generation rose over the four-year period. (2) Coal generation fell over the four-year period. (3) The rise in average electricity bills was caused by the shift toward solar. (4) Total generation from these two sources (solar plus coal) was higher last year than four years earlier. Using ONLY the information given, which conclusions FOLLOW?", "options": {"A": "Conclusions 1, 2 and 4 follow; conclusion 3 does not.", "B": "Conclusions 1, 2 and 3 follow; conclusion 4 does not.", "C": "Conclusions 1 and 2 follow; conclusions 3 and 4 do not.", "D": "All four conclusions follow."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "72", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"If a research proposal is funded, it is assigned a supervisor. If a proposal is assigned a supervisor, it is not entered in the open competition. Some proposals entered in the open competition were submitted by first-year students.\" You are also told: \"Proposal X was entered in the open competition.\" Treating these facts as true, which one of the following can be deduced with CERTAINTY?", "options": {"A": "Proposal X was funded.", "B": "Proposal X was assigned a supervisor.", "C": "Proposal X was submitted by a first-year student.", "D": "It cannot be determined whether Proposal X was submitted by a first-year student."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "73", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should a company move its office staff to a four-day working week with no cut in pay?\" Which one of the following is the STRONGEST argument, judged on relevance and the quality of its support?", "options": {"A": "Yes — a controlled trial across 60 companies found that staff on a four-day week produced the same measured output as before while reporting lower burnout, and none of the firms reverted afterwards.", "B": "No — a five-day week has been the standard for generations, and an arrangement that has lasted that long must be the most productive one.", "C": "Yes — many of the most admired technology firms are trialling shorter weeks, and our company should not appear behind the times.", "D": "No — a manager I spoke to once tried a shorter week for his team and said it felt unproductive, so it clearly does not work."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "74", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A student is investigating the claim that a food additive, Glycoform-7, is safe for long-term human consumption. She finds two sources that both make this SAME claim. Judging ONLY on how credible each source is, whose support for the claim should she trust MORE, and why?", "options": {"A": "Source 1: a press release on the website of the company that manufactures and sells Glycoform-7, summarising 'internal testing' that it has not published.", "B": "Source 2: a peer-reviewed paper in an independent toxicology journal reporting a long-term, double-blind study, funded by a government research council, that found no harmful effects.", "C": "Both sources are equally credible, because they independently reach the same conclusion about Glycoform-7.", "D": "Source 1, because as the manufacturer it has the most direct access to information about its own product."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "75", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "文中說祖父離鄉時「行囊裏只有一件換洗的衣裳和母親塞給他的幾個銅錢」，從這個細節可以推斷出甚麼？<br><span style=\"color:#555\">文中说祖父离乡时「行囊里只有一件换洗的衣裳和母亲塞给他的几个铜钱」，从这个细节可以推断出什么？</span>", "options": {"A": "祖父離鄉時家境清貧，是在艱難中起步的<br><span style=\"color:#555\">祖父离乡时家境清贫，是在艰难中起步的</span>", "B": "祖父做事粗心，忘了帶足夠的行李<br><span style=\"color:#555\">祖父做事粗心，忘了带足够的行李</span>", "C": "祖父打算很快就回故鄉，所以只帶少許東西<br><span style=\"color:#555\">祖父打算很快就回故乡，所以只带少许东西</span>", "D": "祖父喜歡輕裝上路，不愛帶累贅的物品<br><span style=\"color:#555\">祖父喜欢轻装上路，不爱带累赘的物品</span>"}, "fig": "", "passage": "祖父年輕的時候，為了一家的生計，不得已離開了南方的故鄉，獨自到城裏打拼。那一年他剛滿十八歲，行囊裏只有一件換洗的衣裳和母親塞給他的幾個銅錢。城裏的日子並不好過，他做過搬運、當過學徒，吃了不少苦頭，總算白手起家，慢慢地站穩了腳跟，家裏的光景也一年比一年好。然而，無論在城裏住了多少年，祖父始終對故鄉院子裏那棵老樟樹念念不忘，那是他童年攀爬嬉戲的地方。晚年的祖父，總愛坐在窗前，望著南方出神，一坐就是大半天。他常常告訴我們，做人要懂得飲水思源，無論走得多遠，都不能忘了自己的根。如今祖父離鄉已數十載，鄉音雖在，故人卻已不多；那棵老樟樹，也只能在他泛黃的舊照片裏，靜靜地守著一段回不去的歲月。<br><span style=\"color:#555\">祖父年轻的时候，为了一家的生计，不得已离开了南方的故乡，独自到城里打拼。那一年他刚满十八岁，行囊里只有一件换洗的衣裳和母亲塞给他的几个铜钱。城里的日子并不好过，他做过搬运、当过学徒，吃了不少苦头，总算白手起家，慢慢地站稳了脚跟，家里的光景也一年比一年好。然而，无论在城里住了多少年，祖父始终对故乡院子里那棵老樟树念念不忘，那是他童年攀爬嬉戏的地方。晚年的祖父，总爱坐在窗前，望着南方出神，一坐就是大半天。他常常告诉我们，做人要懂得饮水思源，无论走得多远，都不能忘了自己的根。如今祖父离乡已数十载，乡音虽在，故人却已不多；那棵老樟树，也只能在他泛黄的旧照片里，静静地守着一段回不去的岁月。</span>", "qnum": "1"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "結尾「鄉音雖在，故人卻已不多」這一句，主要表達祖父怎樣的感受？<br><span style=\"color:#555\">结尾「乡音虽在，故人却已不多」这一句，主要表达祖父怎样的感受？</span>", "options": {"A": "因學會了城裏的口音而自豪<br><span style=\"color:#555\">因学会了城里的口音而自豪</span>", "B": "對自己一直鄉音未改感到驚訝<br><span style=\"color:#555\">对自己一直乡音未改感到惊讶</span>", "C": "面對時光流逝、人事變遷的感慨<br><span style=\"color:#555\">面对时光流逝、人事变迁的感慨</span>", "D": "埋怨故鄉的舊友都不再與他往來<br><span style=\"color:#555\">埋怨故乡的旧友都不再与他往来</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "作者描寫祖父晚年「總愛坐在窗前，望著南方出神」，這個細節主要的作用是甚麼？<br><span style=\"color:#555\">作者描写祖父晚年「总爱坐在窗前，望着南方出神」，这个细节主要的作用是什么？</span>", "options": {"A": "說明祖父晚年視力衰退<br><span style=\"color:#555\">说明祖父晚年视力衰退</span>", "B": "交代故事發生的季節<br><span style=\"color:#555\">交代故事发生的季节</span>", "C": "以動作含蓄地烘托祖父的思鄉之情<br><span style=\"color:#555\">以动作含蓄地烘托祖父的思乡之情</span>", "D": "表現祖父喜歡安靜的性格<br><span style=\"color:#555\">表现祖父喜欢安静的性格</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "綜觀全文，作者透過祖父的故事，最想傳達的情感是甚麼？<br><span style=\"color:#555\">综观全文，作者通过祖父的故事，最想传达的情感是什么？</span>", "options": {"A": "對城市繁華生活的嚮往<br><span style=\"color:#555\">对城市繁华生活的向往</span>", "B": "對祖父固執性格的不滿<br><span style=\"color:#555\">对祖父固执性格的不满</span>", "C": "對現代人忘本的強烈批判<br><span style=\"color:#555\">对现代人忘本的强烈批判</span>", "D": "對遊子無法歸鄉的惆悵與對根的眷戀<br><span style=\"color:#555\">对游子无法归乡的惆怅与对根的眷恋</span>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "本文的寫作手法，下列哪一項描述最準確？<br><span style=\"color:#555\">本文的写作手法，下列哪一项描述最准确？</span>", "options": {"A": "全篇議論，逐點分析離鄉的利弊<br><span style=\"color:#555\">全篇议论，逐点分析离乡的利弊</span>", "B": "以對話為主，推進故事情節<br><span style=\"color:#555\">以对话为主，推进故事情节</span>", "C": "借物抒情，以老樟樹寄託對故鄉的感情<br><span style=\"color:#555\">借物抒情，以老樟树寄托对故乡的感情</span>", "D": "純粹說明，介紹樟樹的特性與用途<br><span style=\"color:#555\">纯粹说明，介绍樟树的特性与用途</span>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "81", "type": "mcq", "section": "Chinese", "ste 项是：</span>", "options": {"A": "他對家鄉的山水念念不忘，真是數典忘祖。<br><span style=\"color:#555\">他对家乡的山水念念不忘，真是数典忘祖。</span>", "B": "祖父白手起家，在城裏站穩了腳跟。<br><span style=\"color:#555\">祖父白手起家，在城里站稳了脚跟。</span>", "C": "聽他描述故鄉，我彷彿身臨其境。<br><span style=\"color:#555\">听他描述故乡，我仿佛身临其境。</span>", "D": "面對突如其來的變故，他依然處變不驚。<br><span style=\"color:#555\">面对突如其来的变故，他依然处变不惊。</span>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "87", "type": "mcq", "section": "Chinese", "stem": "下列句子沒有語病的一項是：<br><span style=\"color:#555\">下列句子没有语病的一项是：</span>", "options": {"A": "祖父常常告訴我們，做人要懂得飲水思源。<br><span style=\"color:#555\">祖父常常告诉我们，做人要懂得饮水思源。</span>", "B": "通過這次回鄉，使祖父了卻了多年的心願。<br><span style=\"color:#555\">通过这次回乡，使祖父了却了多年的心愿。</span>", "C": "他之所以離鄉，是因為家境貧困的緣故。<br><span style=\"color:#555\">他之所以离乡，是因为家境贫困的缘故。</span>", "D": "我們應該防止思鄉之情不再氾濫。<br><span style=\"color:#555\">我们应该防止思乡之情不再泛滥。</span>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "88", "type": "mcq", "section": "Chinese", "stem": "「祖父把母親留下的銅錢一直珍藏到今天。」這句話改寫成被動句，最恰當的是：<br><span style=\"color:#555\">「祖父把母亲留下的铜钱一直珍藏到今天。」这句话改写成被动句，最恰当的是：</span>", "options": {"A": "祖父一直被母親留下的銅錢珍藏到今天。<br><span style=\"color:#555\">祖父一直被母亲留下的铜钱珍藏到今天。</span>", "B": "母親留下的銅錢把祖父一直珍藏到今天。<br><span style=\"color:#555\">母亲留下的铜钱把祖父一直珍藏到今天。</span>", "C": "母親留下的銅錢一直珍藏祖父到今天。<br><span style=\"color:#555\">母亲留下的铜钱一直珍藏祖父到今天。</span>", "D": "母親留下的銅錢一直被祖父珍藏到今天。<br><span style=\"color:#555\">母亲留下的铜钱一直被祖父珍藏到今天。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "89", "type": "mcq", "section": "Chinese", "stem": "下列各句的標點符號，使用正確的一項是：<br><span style=\"color:#555\">下列各句的标点符号，使用正确的一项是：</span>", "options": {"A": "鄉愁是甚麼，鄉愁是一棵長在心底的老樟樹。<br><span style=\"color:#555\">乡愁是什么，乡愁是一棵长在心底的老樟树。</span>", "B": "祖父問我：「你想不想回鄉下看看。」<br><span style=\"color:#555\">祖父问我：“你想不想回乡下看看。”</span>", "C": "他離開了故鄉、離開了親人、踏上了謀生的路。<br><span style=\"color:#555\">他离开了故乡、离开了亲人、踏上了谋生的路。</span>", "D": "故鄉的一草一木、一磚一瓦，都深深印在祖父的記憶裏。<br><span style=\"color:#555\">故乡的一草一木、一砖一瓦，都深深印在祖父的记忆里。</span>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
