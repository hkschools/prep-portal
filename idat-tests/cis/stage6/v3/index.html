<!DOCTYPE html>

<title>IDAT CIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the linking word that best fits the sentence: The factory met every safety standard on paper; _____, three serious accidents occurred within a month of opening.", "options": {"A": "nonetheless", "B": "therefore", "C": "similarly", "D": "moreover"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which word has the most NEGATIVE connotation while still meaning 'careful with money'?", "options": {"A": "thrifty", "B": "miserly", "C": "prudent", "D": "frugal"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which sentence uses the colon correctly?", "options": {"A": "The recipe required: butter, sugar, and two eggs.", "B": "He left early: although the meeting was unfinished.", "C": "The verdict rested on a single fact: the witness had lied.", "D": "They toured four countries: and remembered each fondly."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'ephemeral' in the sentence below?\nThe fame of a viral video is ephemeral, forgotten by most viewers within a week.", "options": {"A": "widespread", "B": "undeserved", "C": "controversial", "D": "short-lived"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\nEither the manager (A) or the assistants (B) is (C) responsible for locking the building (D) each night.", "options": {"A": "section A", "B": "section B", "C": "section C", "D": "section D"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\nThe auditor warned that the missing funds were merely <u>the tip of the iceberg</u> and that far deeper problems lay hidden in the accounts.", "options": {"A": "a problem that is now fully solved", "B": "only a small visible part of a much larger problem", "C": "a danger that has been wildly exaggerated", "D": "a matter too trivial to investigate"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which revision best combines the two sentences to improve flow while preserving the contrast?\nThe team had trained for two years. They lost the final in the opening ten minutes.", "options": {"A": "The team had trained for two years, they lost the final in the opening ten minutes.", "B": "The team had trained for two years; they lost the final, in the opening ten minutes.", "C": "After training for two years, the team lost the final in the opening ten minutes.", "D": "The team had trained for two years and they lost the final in the opening ten minutes."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the word that most precisely describes someone who speaks firmly and directly but without warmth.", "options": {"A": "timid", "B": "eloquent", "C": "gracious", "D": "blunt"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which sentence punctuates the parenthetical element correctly?", "options": {"A": "The composer, who died in poverty, is now celebrated worldwide.", "B": "The composer who died in poverty, is now celebrated worldwide.", "C": "The composer, who died in poverty is now celebrated worldwide.", "D": "The composer who died in poverty is now, celebrated worldwide."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'curtailed' in the sentence below?\nThe drought curtailed the harvest, leaving the farmers with barely half their usual yield.", "options": {"A": "delayed", "B": "reduced", "C": "destroyed", "D": "improved"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Choose the linking expression that best signals the writer is introducing an illustrative example.", "options": {"A": "On the contrary,", "B": "As a result,", "C": "To illustrate,", "D": "In conclusion,"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which literary device is used in the line: 'I have told you a thousand times to lock the gate'?", "options": {"A": "personification", "B": "metaphor", "C": "simile", "D": "hyperbole"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains a spelling or word-choice error.\nThe committee's decision will effect (A) every department, so the director asked staff to accept (B) the new procedures without (C) further delay (D).", "options": {"A": "section A", "B": "section B", "C": "section C", "D": "section D"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which underlined phrase is a euphemism?", "options": {"A": "The hospital <u>closed the ward</u> to save money.", "B": "The patient <u>passed away</u> during the night.", "C": "The patient <u>recovered fully</u> after surgery.", "D": "The hospital <u>raised its charges</u> sharply."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\nReaching the summit (A) at last, exhausted (B) and frozen (C), the view rewarded (D) the climbers.", "options": {"A": "section A", "B": "section B", "C": "section C", "D": "section D"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'placate' in the sentence below?\nThe airline offered free vouchers to placate passengers furious about the long delay.", "options": {"A": "to calm and satisfy", "B": "to confuse further", "C": "to ignore completely", "D": "to investigate carefully"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which sentence uses the semicolon correctly?", "options": {"A": "The lecture ran long; the students grew restless and began to fidget.", "B": "Because the lecture ran long; the students grew restless.", "C": "We invited three speakers; a poet, a historian, and a chemist.", "D": "She hesitated; before stepping onto the stage."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "In a formal academic essay, which word is the most appropriate replacement for the casual phrase 'a big drop' in 'a big drop in attendance'?", "options": {"A": "a massive plunge", "B": "a sharp decline", "C": "a slight dip", "D": "a bit of a fall"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Which revision converts the sentence to the passive voice appropriately for a scientific procedure?\n'We weighed the samples before the experiment.'", "options": {"A": "The samples were weighed before the experiment.", "B": "The samples weighed before the experiment.", "C": "We had weighed the samples before the experiment.", "D": "Weighing the samples before the experiment."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "A reviewer wants to describe a film's plot unfavourably. Which word should she choose?", "options": {"A": "intricate", "B": "elaborate", "C": "detailed", "D": "convoluted"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which sentence correctly uses a pair of dashes to set off an interruption for emphasis?", "options": {"A": "The decision, made overnight, reversed, years of policy.", "B": "The decision made overnight — reversed years of — policy.", "C": "The decision — made overnight — reversed years of policy.", "D": "The decision; made overnight; reversed years of policy."}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Using the surrounding context, what part of speech is the underlined word, and what does it most likely mean?\nThe sudden <u>surge</u> in electricity demand overwhelmed the ageing power grid.", "options": {"A": "verb, meaning 'to fall sharply'", "B": "noun, meaning 'a sudden sharp increase'", "C": "noun, meaning 'a steady supply'", "D": "adjective, meaning 'electrical'"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Which version corrects the run-on sentence most effectively?\n'The alarm sounded everyone left the building at once.'", "options": {"A": "The alarm sounded, everyone left the building at once.", "B": "The alarm sounded everyone, left the building at once.", "C": "The alarm sounded; everyone left the building at once.", "D": "The alarm sounded everyone left; the building at once."}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What is the term for a phrase that softens a harsh idea, such as calling a prison a 'correctional facility'?", "options": {"A": "litotes", "B": "irony", "C": "allusion", "D": "euphemism"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Choose the option that best maintains cohesion across these sentences.\n'Electric cars produce no exhaust at the tailpipe. _____, the electricity that powers them may still come from coal-burning plants.'", "options": {"A": "However,", "B": "Consequently,", "C": "Likewise,", "D": "For instance,"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which word most precisely describes a remark that is brief to the point of seeming rude?", "options": {"A": "fluent", "B": "curt", "C": "concise", "D": "verbose"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\nThe evidence suggests (A) that, of (B) all the candidates, she is by far the more (C) qualified for the senior role (D).", "options": {"A": "section A", "B": "section B", "C": "section C", "D": "section D"}, "fig": "", "passage": "", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'relentless' in the sentence below?\nThrough months of setbacks, her relentless pursuit of the cure never slowed for a single day.", "options": {"A": "reckless", "B": "occasional", "C": "reluctant", "D": "unceasing"}, "fig": "", "passage": "", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'guttered' as used in 'she worked... until the lamp guttered low'?", "options": {"A": "burned brightly and steadily", "B": "was refilled with fresh oil", "C": "burned weakly and flickered toward going out", "D": "was suddenly extinguished"}, "fig": "", "passage": "<strong>The Weaver and the Broken Loom</strong><br>In a mountain village where the winters were long, there lived a weaver named Sora, whose cloth was prized in markets three valleys away. She had inherited her loom from her mother, and over the years its wooden frame had grown smooth under generations of patient hands. Sora worked from before dawn until the lamp guttered low, and the villagers said that no thread ever slipped through her fingers untaught.\n\nOne bitter morning the great loom cracked. A beam that had held firm for fifty years split with a sound like breaking ice, and the half-finished blanket sagged useless from its threads. For three days Sora did not weave. She sat by her cold hearth and grieved as though for a friend, certain that without the loom her skill was worthless.\n\nOn the fourth day a young shepherd, passing with his flock, looked in at her door and asked why the cleverest weaver in the valley sat idle while the snow piled at her gate. 'My loom is broken,' she said, 'and so I cannot work.'\n\nThe shepherd considered this. 'When my crook snaps on the high pasture,' he said, 'I do not sit down in the snow and wait to freeze. I cut a new one from whatever wood is near. Is the skill in the crook, or in the shepherd?'\n\nSora said nothing, but that evening she took up her mother's old tools and began, clumsily at first, to shape a new beam from a fallen ash. Her fingers, so sure upon the threads, were unsure upon the wood, and she ruined three beams before the fourth held true. Yet as she worked she understood something she had never grasped in all her years at the loom: that her art had never lived in the frame of polished wood, but in the patient hands that had learned to mend whatever broke.\n\nWhen the new beam was set and the first blanket finished, the villagers swore it was the finest she had ever made. But Sora valued it for a different reason. She kept the cracked old beam above her door, not in mourning, but as a teacher, and whenever a young weaver complained that some tool or thread had failed her, Sora would point to it and say, 'The loom can break. See that you do not break with it.'", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "Why did Sora not weave for three days after the loom cracked?", "options": {"A": "She believed her skill was worthless without the loom.", "B": "She was waiting for a carpenter to arrive from another valley.", "C": "She had run out of thread for her work.", "D": "She had injured her hands when the beam split."}, "fig": "", "passage": "<strong>The Weaver and the Broken Loom</strong><br>In a mountain village where the winters were long, there lived a weaver named Sora, whose cloth was prized in markets three valleys away. She had inherited her loom from her mother, and over the years its wooden frame had grown smooth under generations of patient hands. Sora worked from before dawn until the lamp guttered low, and the villagers said that no thread ever slipped through her fingers untaught.\n\nOne bitter morning the great loom cracked. A beam that had held firm for fifty years split with a sound like breaking ice, and the half-finished blanket sagged useless from its threads. For three days Sora did not weave. She sat by her cold hearth and grieved as though for a friend, certain that without the loom her skill was worthless.\n\nOn the fourth day a young shepherd, passing with his flock, looked in at her door and asked why the cleverest weaver in the valley sat idle while the snow piled at her gate. 'My loom is broken,' she said, 'and so I cannot work.'\n\nThe shepherd considered this. 'When my crook snaps on the high pasture,' he said, 'I do not sit down in the snow and wait to freeze. I cut a new one from whatever wood is near. Is the skill in the crook, or in the shepherd?'\n\nSora said nothing, but that evening she took up her mother's old tools and began, clumsily at first, to shape a new beam from a fallen ash. Her fingers, so sure upon the threads, were unsure upon the wood, and she ruined three beams before the fourth held true. Yet as she worked she understood something she had never grasped in all her years at the loom: that her art had never lived in the frame of polished wood, but in the patient hands that had learned to mend whatever broke.\n\nWhen the new beam was set and the first blanket finished, the villagers swore it was the finest she had ever made. But Sora valued it for a different reason. She kept the cracked old beam above her door, not in mourning, but as a teacher, and whenever a young weaver complained that some tool or thread had failed her, Sora would point to it and say, 'The loom can break. See that you do not break with it.'", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What does the shepherd's question, 'Is the skill in the crook, or in the shepherd?', most likely suggest to Sora?", "options": {"A": "That she should give up weaving and become a shepherd.", "B": "That expensive tools always produce better work.", "C": "That a good craftsman should never lend out their tools.", "D": "That true ability lies in the person, not in the tool they use."}, "fig": "", "passage": "<strong>The Weaver and the Broken Loom</strong><br>In a mountain village where the winters were long, there lived a weaver named Sora, whose cloth was prized in markets three valleys away. She had inherited her loom from her mother, and over the years its wooden frame had grown smooth under generations of patient hands. Sora worked from before dawn until the lamp guttered low, and the villagers said that no thread ever slipped through her fingers untaught.\n\nOne bitter morning the great loom cracked. A beam that had held firm for fifty years split with a sound like breaking ice, and the half-finished blanket sagged useless from its threads. For three days Sora did not weave. She sat by her cold hearth and grieved as though for a friend, certain that without the loom her skill was worthless.\n\nOn the fourth day a young shepherd, passing with his flock, looked in at her door and asked why the cleverest weaver in the valley sat idle while the snow piled at her gate. 'My loom is broken,' she said, 'and so I cannot work.'\n\nThe shepherd considered this. 'When my crook snaps on the high pasture,' he said, 'I do not sit down in the snow and wait to freeze. I cut a new one from whatever wood is near. Is the skill in the crook, or in the shepherd?'\n\nSora said nothing, but that evening she took up her mother's old tools and began, clumsily at first, to shape a new beam from a fallen ash. Her fingers, so sure upon the threads, were unsure upon the wood, and she ruined three beams before the fourth held true. Yet as she worked she understood something she had never grasped in all her years at the loom: that her art had never lived in the frame of polished wood, but in the patient hands that had learned to mend whatever broke.\n\nWhen the new beam was set and the first blanket finished, the villagers swore it was the finest she had ever made. But Sora valued it for a different reason. She kept the cracked old beam above her door, not in mourning, but as a teacher, and whenever a young weaver complained that some tool or thread had failed her, Sora would point to it and say, 'The loom can break. See that you do not break with it.'", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "Which statement best expresses the central theme of the fable?", "options": {"A": "Inherited possessions are more valuable than new ones.", "B": "True skill resides in the person and endures even when their tools fail.", "C": "Weaving is a more difficult craft than shepherding.", "D": "One should never repair a broken object but replace it."}, "fig": "", "passage": "<strong>The Weaver and the Broken Loom</strong><br>In a mountain village where the winters were long, there lived a weaver named Sora, whose cloth was prized in markets three valleys away. She had inherited her loom from her mother, and over the years its wooden frame had grown smooth under generations of patient hands. Sora worked from before dawn until the lamp guttered low, and the villagers said that no thread ever slipped through her fingers untaught.\n\nOne bitter morning the great loom cracked. A beam that had held firm for fifty years split with a sound like breaking ice, and the half-finished blanket sagged useless from its threads. For three days Sora did not weave. She sat by her cold hearth and grieved as though for a friend, certain that without the loom her skill was worthless.\n\nOn the fourth day a young shepherd, passing with his flock, looked in at her door and asked why the cleverest weaver in the valley sat idle while the snow piled at her gate. 'My loom is broken,' she said, 'and so I cannot work.'\n\nThe shepherd considered this. 'When my crook snaps on the high pasture,' he said, 'I do not sit down in the snow and wait to freeze. I cut a new one from whatever wood is near. Is the skill in the crook, or in the shepherd?'\n\nSora said nothing, but that evening she took up her mother's old tools and began, clumsily at first, to shape a new beam from a fallen ash. Her fingers, so sure upon the threads, were unsure upon the wood, and she ruined three beams before the fourth held true. Yet as she worked she understood something she had never grasped in all her years at the loom: that her art had never lived in the frame of polished wood, but in the patient hands that had learned to mend whatever broke.\n\nWhen the new beam was set and the first blanket finished, the villagers swore it was the finest she had ever made. But Sora valued it for a different reason. She kept the cracked old beam above her door, not in mourning, but as a teacher, and whenever a young weaver complained that some tool or thread had failed her, Sora would point to it and say, 'The loom can break. See that you do not break with it.'", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "Sora keeps the cracked beam above her door 'not in mourning, but as a teacher'. What does this description most effectively convey?", "options": {"A": "That she preserved the broken beam as a lasting reminder of a lesson learned.", "B": "That she felt the broken beam had gradually lost all its meaning.", "C": "That she still hoped to repair the original beam one day.", "D": "That she planned to sell the beam to another weaver."}, "fig": "", "passage": "<strong>The Weaver and the Broken Loom</strong><br>In a mountain village where the winters were long, there lived a weaver named Sora, whose cloth was prized in markets three valleys away. She had inherited her loom from her mother, and over the years its wooden frame had grown smooth under generations of patient hands. Sora worked from before dawn until the lamp guttered low, and the villagers said that no thread ever slipped through her fingers untaught.\n\nOne bitter morning the great loom cracked. A beam that had held firm for fifty years split with a sound like breaking ice, and the half-finished blanket sagged useless from its threads. For three days Sora did not weave. She sat by her cold hearth and grieved as though for a friend, certain that without the loom her skill was worthless.\n\nOn the fourth day a young shepherd, passing with his flock, looked in at her door and asked why the cleverest weaver in the valley sat idle while the snow piled at her gate. 'My loom is broken,' she said, 'and so I cannot work.'\n\nThe shepherd considered this. 'When my crook snaps on the high pasture,' he said, 'I do not sit down in the snow and wait to freeze. I cut a new one from whatever wood is near. Is the skill in the crook, or in the shepherd?'\n\nSora said nothing, but that evening she took up her mother's old tools and began, clumsily at first, to shape a new beam from a fallen ash. Her fingers, so sure upon the threads, were unsure upon the wood, and she ruined three beams before the fourth held true. Yet as she worked she understood something she had never grasped in all her years at the loom: that her art had never lived in the frame of polished wood, but in the patient hands that had learned to mend whatever broke.\n\nWhen the new beam was set and the first blanket finished, the villagers swore it was the finest she had ever made. But Sora valued it for a different reason. She kept the cracked old beam above her door, not in mourning, but as a teacher, and whenever a young weaver complained that some tool or thread had failed her, Sora would point to it and say, 'The loom can break. See that you do not break with it.'", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "How does the structure of the fable, moving from Sora's despair to her self-made repair and final teaching, reinforce its message?", "options": {"A": "It shows that grief is pointless and should always be suppressed.", "B": "It proves that her original skill at the loom had been overrated.", "C": "It suggests the story has no clear resolution.", "D": "It traces a journey from helpless dependence to self-reliance, mirroring the lesson she later passes on."}, "fig": "", "passage": "<strong>The Weaver and the Broken Loom</strong><br>In a mountain village where the winters were long, there lived a weaver named Sora, whose cloth was prized in markets three valleys away. She had inherited her loom from her mother, and over the years its wooden frame had grown smooth under generations of patient hands. Sora worked from before dawn until the lamp guttered low, and the villagers said that no thread ever slipped through her fingers untaught.\n\nOne bitter morning the great loom cracked. A beam that had held firm for fifty years split with a sound like breaking ice, and the half-finished blanket sagged useless from its threads. For three days Sora did not weave. She sat by her cold hearth and grieved as though for a friend, certain that without the loom her skill was worthless.\n\nOn the fourth day a young shepherd, passing with his flock, looked in at her door and asked why the cleverest weaver in the valley sat idle while the snow piled at her gate. 'My loom is broken,' she said, 'and so I cannot work.'\n\nThe shepherd considered this. 'When my crook snaps on the high pasture,' he said, 'I do not sit down in the snow and wait to freeze. I cut a new one from whatever wood is near. Is the skill in the crook, or in the shepherd?'\n\nSora said nothing, but that evening she took up her mother's old tools and began, clumsily at first, to shape a new beam from a fallen ash. Her fingers, so sure upon the threads, were unsure upon the wood, and she ruined three beams before the fourth held true. Yet as she worked she understood something she had never grasped in all her years at the loom: that her art had never lived in the frame of polished wood, but in the patient hands that had learned to mend whatever broke.\n\nWhen the new beam was set and the first blanket finished, the villagers swore it was the finest she had ever made. But Sora valued it for a different reason. She kept the cracked old beam above her door, not in mourning, but as a teacher, and whenever a young weaver complained that some tool or thread had failed her, Sora would point to it and say, 'The loom can break. See that you do not break with it.'", "qnum": "34"}, {"n": "36", "type": "mcq", "section": "English", "stem": "According to the passage, how does pollen move from one flower to another?", "options": {"A": "The plant releases pollen into the wind to drift between blooms.", "B": "Bees deliberately collect pollen to deliver it to other plants.", "C": "Pollen catches on a bee's hairs and brushes off on the next flower it visits.", "D": "Nectar dissolves the pollen and carries it through the soil."}, "fig": "", "passage": "<strong>The Hidden Work of the Honeybee</strong><br>A single honeybee, weighed against the scale of a farm or a forest, seems almost too small to matter. Yet the quiet daily labour of bees underpins a large share of the food that reaches our tables, and the mechanism by which they do it is a marvel of accidental cooperation between insect and flower.\n\nThe relationship rests on a simple exchange. A flowering plant cannot move to find a partner, so it must persuade a courier to carry its pollen to another bloom of the same kind. To do so it offers a reward, nectar, a sugary liquid that bees gather and convert into honey. As a bee pushes into a flower to drink, grains of pollen catch on the dense hairs that cover its body. When it flies to the next flower, some of those grains brush off onto the receptive part of that bloom, and fertilisation can occur. The bee is paid in sugar; the plant, without ever knowing it, is helped to reproduce.\n\nWhat makes bees especially valuable couriers is a habit known as flower constancy. On any single foraging trip, a bee tends to visit only one kind of flower, ignoring others even when they are closer and equally rich. For the plant this is precisely what is needed, since pollen is useful only if it reaches a flower of the same species. A courier that wandered from roses to daisies to clover would waste most of the pollen it carried. The bee's narrow loyalty, driven by its own efficiency, happens to serve the plant perfectly.\n\nBack at the hive, the bees that have found a good patch of flowers must somehow tell the others where it lies. They do this through a movement scientists call the waggle dance. A returning forager runs in a figure of eight, waggling its body along the straight central run, and the direction and duration of that run encode the angle of the food relative to the sun and its distance from the hive. Hundreds of hivemates read the dance in the darkness and set out toward a meadow none of them has seen.\n\nThis quiet machinery is now under strain. Habitat loss, pesticides, disease, and a warming climate have all been linked to falling bee numbers in many parts of the world. Because so many crops depend on insect pollination, the decline is not only a concern for naturalists but a question of how reliably the rest of us will be fed. To protect bees, scientists increasingly argue, is to protect a service most people never see and have never had to think about.", "qnum": "35"}, {"n": "37", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'constancy' in the phrase 'flower constancy'?", "options": {"A": "constant change of preference", "B": "faithful sticking to one kind", "C": "rapid speed of movement", "D": "large size of the flower"}, "fig": "", "passage": "<strong>The Hidden Work of the Honeybee</strong><br>A single honeybee, est of us will be fed. To protect bees, scientists increasingly argue, is to protect a service most people never see and have never had to think about.", "qnum": "38"}, {"n": "40", "type": "mcq", "section": "English", "stem": "Which sentence best states the central idea of the passage?", "options": {"A": "Bees make honey by gathering nectar from flowers.", "B": "Bees quietly provide essential pollination through an accidental partnership with flowers, a service now under threat.", "C": "The waggle dance is the most remarkable behaviour in the animal kingdom.", "D": "A single honeybee is too small to have any real effect on farming."}, "fig": "", "passage": "<strong>The Hidden Work of the Honeybee</strong><br>A single honeybee, weighed against the scale of a farm or a forest, seems almost too small to matter. Yet the quiet daily labour of bees underpins a large share of the food that reaches our tables, and the mechanism by which they do it is a marvel of accidental cooperation between insect and flower.\n\nThe relationship rests on a simple exchange. A flowering plant cannot move to find a partner, so it must persuade a courier to carry its pollen to another bloom of the same kind. To do so it offers a reward, nectar, a sugary liquid that bees gather and convert into honey. As a bee pushes into a flower to drink, grains of pollen catch on the dense hairs that cover its body. When it flies to the next flower, some of those grains brush off onto the receptive part of that bloom, and fertilisation can occur. The bee is paid in sugar; the plant, without ever knowing it, is helped to reproduce.\n\nWhat makes bees especially valuable couriers is a habit known as flower constancy. On any single foraging trip, a bee tends to visit only one kind of flower, ignoring others even when they are closer and equally rich. For the plant this is precisely what is needed, since pollen is useful only if it reaches a flower of the same species. A courier that wandered from roses to dais vel of accidental cooperation between insect and flower.\n\nThe relationship rests on a simple exchange. A flowering plant cannot move to find a partner, so it must persuade a courier to carry its pollen to another bloom of the same kind. To do so it offers a reward, nectar, a sugary liquid that bees gather and convert into honey. As a bee pushes into a flower to drink, grains of pollen catch on the dense hairs that cover its body. When it flies to the next flower, some of those grains brush off onto the receptive part of that bloom, and fertilisation can occur. The bee is paid in sugar; the plant, without ever knowing it, is helped to reproduce.\n\nWhat makes bees especially valuable couriers is a habit known as flower constancy. On any single foraging trip, a bee tends to visit only one kind of flower, ignoring others even when they are closer and equally rich. For the plant this is precisely what is needed, since pollen is useful only if it reaches a flower of the same species. A courier that wandered from roses to daisies to clover would waste most of the pollen it carried. The bee's narrow loyalty, driven by its own efficiency, happens to serve the plant perfectly.\n\nBack at the hive, the bees that have found a good patch of flowers must somehow tell the others where it lies. They do this through a movement scientists call the waggle dance. A returning forager runs in a figure of eight, waggling its body along the straight central run, and the direction and duration of that run encode the angle of the food relative to the sun and its distance from the hive. Hundreds of hivemates read the dance in the darkness and set out toward a meadow none of them has seen.\n\nThis quiet machinery is now under strain. Habitat loss, pesticides, disease, and a warming climate have all been linked to falling bee numbers in many parts of the world. Because so many crops depend on insect pollination, the decline is not only a concern for naturalists but a question of how reliably the rest of us will be fed. To protect bees, scientists increasingly argue, is to protect a service most people never see and have never had to think about.", "qnum": "40"}, {"n": "42", "type": "writing", "section": "English Writing", "intro": "Stage 6 (Year 12) writing task: a single argumentative essay on a debatable issue, written under timed conditions on a keyboard. Assessed on clarity of position, quality and development of reasoning, handling of counter-arguments, structure and cohesion, and precision and sophistication of language.", "label": "", "body": "Choose ONE of the following:\n(1) Some people argue that university education should be free for all students, funded entirely by the government. Others believe students should contribute to the cost of their own degrees. Take a clear position, argue your view, and respond to the strongest objection to your own position.\n(2) 'Cities should ban private cars from their centres to reduce pollution and congestion.' Do you agree? Argue for or against this proposal, responding to the strongest objection to your own position.", "hint": "Write a persuasive, well-structured argumentative essay. Choose ONE topic only and answer it on the keyboard. Take a clear position, support it with developed reasons and evidence, acknowledge and respond to at least one counter-argument, and conclude effectively. Aim for several well-organised paragraphs with varied sentence structure and precise vocabulary.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "43", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangle has sides of 6 cm, 9 cm and 10 cm. Use the cosine rule to find the size of the largest angle, to 1 d.p.", "options": {"A": "36.3°", "B": "62.7°", "C": "80.9°", "D": "99.1°" 58", "B": "4374", "C": "13122", "D": "486"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A convergent geometric progression has 2nd term 12 and 5th term 1.5. Find the sum to infinity (take the positive common ratio).", "options": {"A": "24", "B": "12", "C": "64", "D": "48"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A geometric progression has first term 3 and common ratio 4. Find the smallest value of n for which the nth term first exceeds 10 000.", "options": {"A": "7", "B": "6", "C": "8", "D": "5"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "An arithmetic progression begins 72, 65, 58, … . Find the position n of the first term in the sequence that is negative.", "options": {"A": "11", "B": "12", "C": "13", "D": "10"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sector of a circle, shown shaded, has radius 8 cm and a central angle of 1.5 radians. Find the perimeter of the sector (arc plus the two bounding radii).", "options": {"A": "12.0 cm", "B": "20.0 cm", "C": "48.0 cm", "D": "28.0 cm"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In the binomial expansion of (3x − 2)⁶, find the coefficient of the x⁴ term.", "options": {"A": "1215", "B": "−2430", "C": "4860", "D": "540"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the polynomial of least degree, with leading coefficient 1, whose only zeros are x = −1, x = 2 and x = 3.", "options": {"A": "x³ − 4x² + x + 6", "B": "x³ + 4x² + x − 6", "C": "x³ − 6x² + 11x − 6", "D": "x³ − 7x − 6"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In triangle ABC, AB = 7 cm and BC = 10 cm meet at B with the included angle ∠B = 55°. Use the cosine rule to find the length of the third side AC, to 2 d.p.", "options": {"A": "15.14 cm", "B": "12.21 cm", "C": "8.29 cm", "D": "17.00 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"314\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"185\" cy=\"55\" r=\"3\" fill=\"#1F3864\"/><text x=\"185\" y=\"47\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"180\" y=\"215\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">7 cm</text><text x=\"264\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">10 cm</text><text x=\"100\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#C00\">?</text><text x=\"260\" y=\"223\" font-size=\"13\" fill=\"#C00\">55°</text><path d=\"M318,195 A18,18 0 0 1 312,182\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.4\"/></svg>", "passage": "", "qnum": "14"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangular field has sides of 7 m, 11 m and 16 m. Find its area using Heron's rule, to 1 d.p.", "options": {"A": "38.5 m²", "B": "31.9 m²", "C": "88.0 m²", "D": "1020.3 m²"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sector of a circle has radius 6 cm and a central angle of 120°. Find the area of the sector, giving an exact answer in terms of π.", "options": {"A": "4π cm²", "B": "37.7π cm²", "C": "36π cm²", "D": "12π cm²"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A geometric progression has first term 5 and common ratio 3. Find the sum of the first 7 terms.", "options": {"A": "5465", "B": "3645", "C": "16400", "D": "5467"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid has a rectangular base 9 cm by 12 cm and a vertical height of 8 cm. A straight diagonal is drawn inside it from one bottom corner to the diagonally opposite top corner. The base diagonal measures √(9²+12²) = 15 cm. Find the angle, to 1 d.p., that the internal diagonal makes with the horizontal base.", "options": {"A": "33.7°", "B": "28.1°", "C": "41.6°", "D": "61.9°"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Each term in this sequence is built from the TWO terms before it by one fixed rule: 1, 3, 7, 17, 41, ___ . What number comes next?", "options": {"A": "58", "B": "82", "C": "99", "D": "89"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code language: 'pell vora tisk' means 'silver birds glide', 'vora kemd pell' means 'birds vanish silver', and 'tisk kemd nool' means 'glide vanish slowly'. The word order is NOT preserved between the code and the English. Which word means 'vanish'?", "options": {"A": "vora", "B": "kemd", "C": "tisk", "D": "pell"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A studio rents a lighting kit under two plans. Plan A: a flat $88 booking fee plus $14 per day. Plan B: no booking fee but $34 per day, with every 4th day free (you pay for only 3 days in each block of 4). A client needs the kit for exactly 8 days. Which plan is cheaper, and by how much?", "options": {"A": "Plan A is cheaper by $4", "B": "Plan B is cheaper by $4", "C": "Plan A is cheaper by $72", "D": "They cost the same"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A box holds 5 red, 4 blue and 3 green marbles. Two marbles are drawn at random WITHOUT replacement. What is the probability that BOTH are red?", "options": {"A": "25/144", "B": "5/36", "C": "5/12", "D": "5/33"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A traveller takes a ferry that reaches the Pier at 09:35. At the Pier she must change to a bus, but the changeover requires at least 12 minutes to walk between docks. Buses leave the Pier at 09:40, 10:10 and 10:25, and the bus ride to Town takes 35 minutes. What is the EARLIEST she can arrive in Town?", "options": {"A": "10:15", "B": "10:45", "C": "10:10", "D": "11:00"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The flat net below folds into a cube. It is a plus-shaped (cross) net: a centre square F has four squares attached to its sides, T (top), B (bottom), L (left) and R (right); a sixth square K is attached to the outer edge of B. When folded into the cube, which face ends up DIRECTLY OPPOSITE the centre square F?", "options": {"A": "Face B", "B": "Face R", "C": "Face K", "D": "Face T"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Solve this riddle: 'I have cities, but no houses. I have mountains, but no trees. I have water, but no fish. I have roads, but no cars. What am I?'", "options": {"A": "A dream", "B": "A painting", "C": "A globe", "D": "A map"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Argument: \"The town should keep its public library open until 10 p.m. on weekdays instead of closing at 6 p.m. The extended hours will let working residents who finish late still use the library, will raise the library's total weekly borrowing, and will make better use of a building that currently sits empty all evening. The plan is plainly worthwhile and should be adopted.\"\n\nFor the conclusion to hold, the writer must take several things for granted. Which ONE of the following is NOT a hidden assumption the argument requires?", "options": {"A": "At least some working residents who cannot currently reach the library before 6 p.m. would actually use it during the later hours.", "B": "The extra cost of staffing, lighting and securing the building until 10 p.m. would not outweigh the benefits the longer hours bring.", "C": "The library's evening collection will be expanded with newly purchased books chosen specifically for late-finishing professionals.", "D": "Keeping the building open later genuinely counts as a better use of it than leaving it closed and empty in the evening."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"At a music conservatoire, every candidate who was offered a place had attended the audition day. The conservatoire also confirmed that a number of candidates who attended the audition day were not offered a place.\"\n\nWhich one of the following MUST be true on the basis of this statement alone?", "options": {"A": "Attending the audition day was the reason candidates were offered a place.", "B": "Most of the candidates who attended the audition day were offered a place.", "C": "Some candidates who did NOT attend the audition day were still offered a place.", "D": "Attending the audition day was not, by itself, enough to secure an offer of a place."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"A city council surveyed all 600 households on one estate about a proposed weekly food-waste collection. Each household gave exactly one of two responses. 390 households said they would separate their food waste if the collection were provided; the remaining households said they would not.\"\n\nConsider these conclusions:\n(1) A majority of the surveyed households said they would separate their food waste if the collection were provided.\n(2) More than half of all households in the city would separate their food waste if the collection were provided.\n(3) Among the surveyed households, those who said they would separate their food waste outnumbered those who said they would not.\n\nUsing ONLY the information given, which conclusions FOLLOW?", "options": {"A": "Conclusions (1) and (3) follow; conclusion (2) does not.", "B": "Only conclusion (1) follows.", "C": "Conclusions (1), (2) and (3) all follow.", "D": "Only conclusion (3) follows."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "72", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Facts: \"If a student joins the orchestra, they are given a locker in the music wing. If a student is given a locker in the music wing, they are exempt from the lunchtime study hall. No student who is exempt from the lunchtime study hall is enrolled in the catch-up programme. Some students enrolled in the catch-up programme are in Year 9.\" You are also told: \"Tomas is enrolled in the catch-up programme.\"\n\nTreating these facts as true, which one of the following can be deduced with CERTAINTY?", "options": {"A": "Tomas is in Year 9.", "B": "Tomas has not joined the orchestra.", "C": "Tomas is exempt from the lunchtime study hall.", "D": "Tomas is given a locker in the music wing."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "73", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Question: \"Should a city lower the speed limit on its residential streets from 50 km/h to 30 km/h?\" Each option below argues YES. Judged ONLY on relevance and the quality of the support (not on whether you agree), which is the STRONGEST argument?", "options": {"A": "Yes — speeding cars are dangerous, and everybody knows that slower driving is safer, so a lower limit must be the right choice.", "B": "Yes — a neighbouring city lowered its residential limit to 30 km/h last year, and we should match what nearby cities are doing so we do not look behind the times.", "C": "Yes — a resident wrote to the newspaper describing a near-miss on her street and said she is sure a 30 km/h limit would have prevented it.", "D": "Yes — a study of 40 cities that cut residential limits to 30 km/h found that pedestrian injuries fell by an average of 25% in the three years afterwards, with no measured rise in journey times."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "74", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"A company introduced a new project-management app and, over the next quarter, the teams using it completed their projects on average four days faster than in the previous quarter. The company also notes that during that same quarter it reduced the average team's workload from five simultaneous projects to three, and that it did not separately measure the effect of either change.\"\n\nWhich one of the following can be inferred with the GREATEST confidence from the statement alone?", "options": {"A": "The new project-management app caused projects to be completed four days faster.", "B": "Reducing each team's workload to three projects had no effect on completion times.", "C": "The four-day improvement in completion time cannot, by itself, be attributed to the new app.", "D": "Teams that kept five simultaneous projects completed their work more slowly than teams with three."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "75", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "根據文章，作者第一次回到故鄉時，最深的感受是甚麼？<br><span style=\"color:#555\">根据文章，作者第一次回到故乡时，最深的感受是什么？</span>", "options": {"A": "對都市生活的厭倦<br><span style=\"color:#555\">对都市生活的厌倦</span>", "B": "熟悉之中夾雜著陌生<br><span style=\"color:#555\">熟悉之中夹杂着陌生</span>", "C": "對童年玩伴的思念<br><span style=\"color:#555\">对童年玩伴的思念</span>", "D": "終於衣錦還鄉的得意<br><span style=\"color:#555\">终于衣锦还乡的得意</span>"}, "fig": "", "passage": "闊別二十年，我終於踏上回鄉的小路。巷口那棵老樟樹依舊撐著一片濃蔭，樹皮卻比記憶中粗糙了許多。走近老屋，門牌已換上嶄新的紅漆，連那口我幼時打水的老井，也被填平鋪成了水泥地。鄰家一個約莫七八歲的孩子怯生生地望著我，問：「您找誰呀？」我張了張口，竟一時答不上來，彷彿我才是這裏的陌生人。我站在熟悉又陌生的院子裏，伸手摸了摸冰涼的牆，恍惚還聞得到當年灶間飯菜的香氣。傍晚的炊煙仍舊裊裊升起，只是灶前的人早已不是當年的模樣。我忽然明白，記憶可以停留，光陰卻不肯回頭。望著屋後那條依舊潺潺的小河，河水載著落葉，不慌不忙地流向遠方。我輕聲對自己說：河水總要向前流。<br><span style=\"color:#555\">阔别二十年，我终于踏上回乡的小路。巷口那棵老樟树依旧撑着一片浓荫，树皮却比记忆中粗糙了许多。走近老屋，门牌已换上崭新的红漆，连那口我幼时打水的老井，也被填平铺成了水泥地。邻家一个约莫七八岁的孩子怯生生地望着我，问：「您找谁呀？」我张了张口，竟一时答不上来，仿佛我才是这里的陌生人。我站在熟悉又陌生的院子里，伸手摸了摸冰凉的墙，恍惚还闻得到当年灶间饭菜的香气。傍晚的炊烟仍旧袅袅升起，只是灶前的人早已不是当年的模样。我忽然明白，记忆可以停留，光阴却不肯回头。望着屋后那条依旧潺潺的小河，河水载着落叶，不慌不忙地流向远方。我轻声对自己说：河水总要向前流。</span>", "qnum": "1"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "文中「那口井也填平了」一句，主要用來表達甚麼？<br><span style=\"color:#555\">文中「那口井也填平了」一句，主要用来表达什么？</span>", "options": {"A": "故鄉的衛生條件得到改善<br><span style=\"color:#555\">故乡的卫生条件得到改善</span>", "B": "村民已不再需要井水", "C": "舊日生活痕跡的逐漸消失<br><span style=\"color:#555\">旧日生活痕迹的逐渐消失</span>", "D": "作者對水井安全的擔憂<br><span style=\"color:#555\">作者对水井安全的担忧</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "綜觀全文，作者對故鄉變化的態度最接近下列哪一項？<br><span style=\"color:#555\">综观全文，作者对故乡变化的态度最接近下列哪一项？</span>", "options": {"A": "強烈反對，認為發展破壞了一切<br><span style=\"color:#555\">强烈反对，认为发展破坏了一切</span>", "B": "全然欣喜，樂見家鄉進步<br><span style=\"color:#555\">全然欣喜，乐见家乡进步</span>", "C": "無動於衷，覺得與己無關<br><span style=\"color:#555\">无动于衷，觉得与己无关</span>", "D": "悵惘中帶著理解與接受<br><span style=\"color:#555\">怅惘中带着理解与接受</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "文章結尾「河水總要向前流」一句，在文中的作用是甚麼？<br><span style=\"color:#555\">文章结尾「河水总要向前流」一句，在文中的作用是什么？</span>", "options": {"A": "說明故鄉的地理環境<br><span style=\"color:#555\">说明故乡的地理环境</span>", "B": "以景作結，寄寓對時光流逝的感悟<br><span style=\"color:#555\">以景作结，寄寓对时光流逝的感悟</span>", "C": "提醒讀者注意河流污染<br><span style=\"color:#555\">提醒读者注意河流污染</span>", "D": "暗示作者打算離鄉遠行<br><span style=\"color:#555\">暗示作者打算离乡远行</span>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "本文的體裁與主要表達方式是：<br><span style=\"color:#555\">本文的体裁与主要表达方式是：</span>", "options": {"A": "說明文，以說明為主<br><span style=\"color:#555\">说明文，以说明为主</span>", "B": "議論文，以論證為主<br><span style=\"color:#555\">议论文，以论证为主</span>", "C": "應用文，以實用為主<br><span style=\"color:#555\">应用文，以实用为主</span>", "D": "抒情散文，以記敘抒情為主<br><span style=\"color:#555\">抒情散文，以记叙抒情为主</span>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "「他做事一向__，從不馬虎，深得上司信任。」最適合填入的詞語是：<br><span style=\"color:#555\">「他做事一向__，从不马虎，深得上司信任。」最适合填入的词语是：</span>", "options": {"A": "嚴謹<br><span style=\"color:#555\">严谨</span>", "B": "嚴峻<br><span style=\"color:#555\">严峻</span>", "C": "嚴厲<br><span style=\"color:#555\">严厉</span>", "D": "嚴肅<br><span style=\"color:#555\">严肃</span>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "82", "type": "mcq", "section": "Chinese", "stem": "下列句子中加點詞語「不脛而走」使用正確的一項是：<br><span style=\"color:#555\">下列句子中加点词语「不胫而走」使用正确的一项是：</span>", "options": {"A": "聽到下課鈴聲，他不脛而走，第一個衝出課室。<br><span style=\"color:#555\">听到下课铃声，他不胫而走，第一个冲出课室。</span>", "B": "這個消息不脛而走，很快傳遍了全城。<br><span style=\"color:#555\">这个消息不胫而走，很快传遍了全城。</span>", "C": "運動員一聲令下便不脛而走，向終點奔去。<br><span style=\"color:#555\">运动员一声令下便不胫而走，向终点奔去。</span>", "D": "小狗一見到主人就不脛而走，撲到他懷裏。<br><span style=\"color:#555\">小狗一见到主人就不胫而走，扑到他怀里。</span>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "「面對眾人的質疑，他__地解釋，語氣不卑不亢。」橫線上最恰當的詞是：<br><span style=\"color:#555\">「面对众人的质疑，他__地解释，语气不卑不亢。」横线上最恰当的词是：</span>", "options": {"A": "從容<br><span style=\"color:#555\">从容</span>", "B": "倉皇<br><span style=\"color:#555\">仓皇</span>", "C": "敷衍", "D": "傲慢"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "84", "type": "mcq", "section": "Chinese", "stem": "下列各句量詞使用正確的一項是：<br><span style=\"color:#555\">下列各句量词使用正确的一项是：</span>", "options": {"A": "他送了我一張好書，我很喜歡。<br><span style=\"color:#555\">他送了我一张好书，我很喜欢。</span>", "B": "遠處傳來一頭悠揚的歌聲。<br><span style=\"color:#555\">远处传来一头悠扬的歌声。</span>", "C": "桌上放著一棵嶄新的字典。<br><span style=\"color:#555\">桌上放着一棵崭新的字典。</span>", "D": "牆上掛著一幅水墨畫，意境深遠。<br><span style=\"color:#555\">墙上挂着一幅水墨画，意境深远。</span>"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "「他一__話也沒說，轉身就走了。」橫線上應填的量詞是：<br><span style=\"color:#555\">「他一__话也没说，转身就走了。」横线上应填的量词是：</span>", "options": {"A": "句", "B": "條<br><span style=\"color:#555\">条</span>", "C": "片", "D": "張<br><span style=\"color:#555\">张</span>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "「他平日勤奮鑽研，這次比賽奪冠絕非僥倖，可謂__。」橫線上最貼切的成語是：<br><span style=\"color:#555\">「他平日勤奋钻研，这次比赛夺冠绝非侥幸，可谓__。」横线上最贴切的成语是：</span>", "options": {"A": "水到渠成", "B": "守株待兔", "C": "塞翁失馬<br><span style=\"color:#555\">塞翁失马</span>", "D": "畫蛇添足<br><span style=\"color:#555\">画蛇添足</span>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "87", "type": "mcq", "section": "Chinese", "stem": "別人陷入困境時，你不但不施援手，反而加以打擊。下列成語中，最能形容這種行為的一項是：<br><span style=\"color:#555\">别人陷入困境时，你不但不施援手，反而加以打击。下列成语中，最能形容这种行为的一项是：</span>", "options": {"A": "錦上添花<br><span style=\"color:#555\">锦上添花</span>", "B": "雪中送炭", "C": "落井下石", "D": "袖手旁觀<br><span style=\"color:#555\">袖手旁观</span>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "88", "type": "mcq", "section": "Chinese", "stem": "下列句子沒有語病的一項是：<br><span style=\"color:#555\">下列句子没有语病的一项是：</span>", "options": {"A": "他在會上提出了許多寶貴的建議和經驗。<br><span style=\"color:#555\">他在会上提出了许多宝贵的建议和经验。</span>", "B": "通過這次活動，使我明白了團隊合作的重要。<br><span style=\"color:#555\">通过这次活动，使我明白了团队合作的重要。</span>", "C": "他能否成功，關鍵在於是否堅持到底。<br><span style=\"color:#555\">他能否成功，关键在于是否坚持到底。</span>", "D": "這篇文章的內容大約二千字左右。<br><span style=\"color:#555\">这篇文章的内容大约二千字左右。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "89", "type": "mcq", "section": "Chinese", "stem": "「__天氣惡劣，比賽__如期舉行。」依文意，橫線上應依次填入的關聯詞是：<br><span style=\"color:#555\">「__天气恶劣，比赛__如期举行。」依文意，横线上应依次填入的关联词是：</span>", "options": {"A": "因為……所以……<br><span style=\"color:#555\">因为……所以……</span>", "B": "雖然……但仍……<br><span style=\"color:#555\">虽然……但仍……</span>", "C": "只要……就……", "D": "如果……就……"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
