const SCHOOL = "CIS", STAGE = "6", VERSION = "5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "In \"<u>rehearsing</u> alone had taught him more than the run itself\", what part of speech is the underlined word?", "options": {"A": "verb", "B": "adjective", "C": "adverb", "D": "noun"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "In \"he stayed <u>because</u> nobody had asked him to leave\", the underlined word is", "options": {"A": "a preposition", "B": "a subordinating conjunction", "C": "a coordinating conjunction", "D": "an adverb"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which version is clearest?", "options": {"A": "The committee delayed the decision because the second report had not arrived.", "B": "It was decided by the committee that the decision would be delayed, the reason for this being the non-arrival of the second report.", "C": "A delay to the decision was implemented by the committee, the second report not having been received at that time.", "D": "The decision, it having been the case that the second report was not received, was delayed."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which sentence says most precisely what the writer means?", "options": {"A": "Attendance rose quite a lot in the second year.", "B": "Attendance rose by a factor of 12 per cent in the second year.", "C": "Attendance rose by 12 per cent in the second year.", "D": "Attendance in the second year saw an increase which was 12 per cent higher."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which sentence inverts correctly after a fronted negative?", "options": {"A": "Rarely an understudy gets more than one chance.", "B": "Rarely does an understudy get more than one chance.", "C": "Rarely does an understudy gets more than one chance.", "D": "Rarely gets an understudy more than one chance."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which sentence agrees correctly?", "options": {"A": "None of the rehearsals were recorded, which was surprising to everyone who were present.", "B": "Neither of the two recordings survive.", "C": "Each of the recordings were lost in the move.", "D": "None of the rehearsals was recorded."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which phrase correctly reduces \"the actor who was waiting in the wings\"?", "options": {"A": "the actor waiting in the wings", "B": "the actor waited in the wings", "C": "the actor been waiting in the wings", "D": "the actor to wait in the wings"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence expresses regret about the past correctly?", "options": {"A": "He wishes he asked for the part.", "B": "He wishes he would have asked for the part.", "C": "He wishes he had asked for the part.", "D": "He wishes he has asked for the part."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which sentence punctuates the introduced list correctly?", "options": {"A": "Three things were missing: the score, the prompt book and the lighting plot.", "B": "Three things were missing; the score, the prompt book and the lighting plot.", "C": "Three things were missing, the score, the prompt book and the lighting plot.", "D": "Three things were missing: the score; the prompt book; and the lighting plot."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which sentence uses the comparative correctly?", "options": {"A": "The second night was far more assureder than the first.", "B": "The second night was the most assured than the first.", "C": "The second night was far more assured than the first.", "D": "The second night was more assured then the first."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Which sentence is correctly punctuated?", "options": {"A": "Although he had learnt the part he had never spoken it aloud to an audience however he was ready.", "B": "Although he had learnt the part, he had never spoken it aloud to an audience.", "C": "Although he had learnt the part, he had never spoken it aloud, to an audience.", "D": "Although, he had learnt the part he had never spoken it aloud to an audience."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which sentence uses the correct pronoun case?", "options": {"A": "The director gave the note to the stage manager and I.", "B": "The director gave the note to the stage manager and myself.", "C": "The director gave the note to the stage manager and mine.", "D": "The director gave the note to the stage manager and me."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which sentence speculates about a PAST event?", "options": {"A": "He must have been given the part at short notice.", "B": "He must be given the part at short notice.", "C": "He must be being given the part at short notice.", "D": "He will have to be given the part at short notice."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "In \"the first act needed cutting and the second one did too\", what does \"did\" stand for?", "options": {"A": "the second act", "B": "needed cutting", "C": "was cut", "D": "the first act"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "A recurring image that carries a text's larger idea is called", "options": {"A": "a theme", "B": "a genre", "C": "a metaphor", "D": "a motif"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "\"He knew the lines. He had known them for nine years. He knew them still.\" The EFFECT of the repetition is to", "options": {"A": "show that the character has an unusually good memory", "B": "suggest that the character is confused about the passing of time", "C": "make the knowledge feel useless as well as complete", "D": "build excitement before a performance"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which word would be OUT OF PLACE in an otherwise formal review?", "options": {"A": "uneven", "B": "underpowered", "C": "perfunctory", "D": "shambolic"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "In a scientific text, which phrase claims the LEAST?", "options": {"A": "demonstrates", "B": "is consistent with", "C": "indicates", "D": "confirms"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "In describing a procedure, which word names a step that must happen before another can begin?", "options": {"A": "prerequisite", "B": "outcome", "C": "variable", "D": "increment"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Which word describes measurements that cluster closely together but may all be wrong?", "options": {"A": "accurate", "B": "reliable", "C": "precise", "D": "valid"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "\"The revival was <u>salutary</u> rather than enjoyable.\" \"Salutary\" means", "options": {"A": "extremely long", "B": "producing a beneficial effect, often through discomfort", "C": "respectful towards the original", "D": "well attended"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Which word praises a performance for doing less than it could have?", "options": {"A": "restrained", "B": "muted", "C": "hesitant", "D": "flat"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "The words \"verdict\", \"dictate\" and \"contradict\" share a root meaning", "options": {"A": "to judge", "B": "to write", "C": "to hold", "D": "to say"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "Which word most naturally completes \"the court ____ the earlier judgment\"?", "options": {"A": "supported", "B": "agreed", "C": "upheld", "D": "approved"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "How is the word for lodging or housing correctly spelled?", "options": {"A": "accomodation", "B": "accommodation", "C": "acommodation", "D": "acomodation"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which word names the principle that a rule should apply in the same way to everyone?", "options": {"A": "leniency", "B": "discretion", "C": "impartiality", "D": "precedent"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "Which verb most precisely describes running a study again to see whether the result holds?", "options": {"A": "replicate", "B": "review", "C": "simulate", "D": "extrapolate"}, "fig": "", "passage": "", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "Which word describes a decision made without consulting those it affects?", "options": {"A": "provisional", "B": "informal", "C": "contentious", "D": "unilateral"}, "fig": "", "passage": "", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "Text A is built around which idea?", "options": {"A": "Talent goes unrecognised when it is not given the chance to be seen.", "B": "Teaching is a more valuable career than performing.", "C": "Preparation can be the substance of a working life rather than a wait for one.", "D": "Understudies are treated unfairly by theatre companies."}, "fig": "", "passage": "<strong>The Understudy</strong><br>For nine years Ilse learned parts she did not play. She was contracted to be ready, and being ready is not a small thing: she knew the blocking, the cues, the three different ways the director had asked for the second-act entrance before settling on the first. She stood at the back of the rehearsal room with the book open and did not need it.\n\nOn a Thursday in the ninth year, the lead was taken ill at four o'clock. Ilse went on. She was, by every account including her own, adequate. She did not fall over the furniture, she was audible at the back, and she made one small choice in the third act that the director noticed and later borrowed. Nobody wrote about it. There was no review, because nobody reviews a Thursday.\n\nWhat she remembered afterwards was not the performance but the twenty minutes before it, standing in the wings in a costume cut for someone else, discovering that she was not frightened. Nine years of standing at the back had done something she had not known they were doing. The readiness had not been a wait. It had been the work.\n\nShe left the company that summer and taught for the next thirty years. Her students describe her as the only teacher any of them had who never once told them that their moment would come. What she told them instead, over and over, was that the moment was not the point and would not feel like one when it arrived, and that they should get on with learning the blocking.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "Why does the writer report the performance itself so flatly?", "options": {"A": "It shows that Ilse was not good enough for the part.", "B": "So that the third paragraph can locate the real event somewhere other than on the stage.", "C": "It builds tension before the outcome is revealed.", "D": "It explains why the lead was taken ill."}, "fig": "", "passage": "<strong>The Understudy</strong><br>For nine years Ilse learned parts she did not play. She was contracted to be ready, and being ready is not a small thing: she knew the blocking, the cues, the three different ways the director had asked for the second-act entrance before settling on the first. She stood at the back of the rehearsal room with the book open and did not need it.\n\nOn a Thursday in the ninth year, the lead was taken ill at four o'clock. Ilse went on. She was, by every account including her own, adequate. She did not fall over the furniture, she was audible at the back, and she made one small choice in the third act that the director noticed and later borrowed. Nobody wrote about it. There was no review, because nobody reviews a Thursday.\n\nWhat she remembered afterwards was not the performance but the twenty minutes before it, standing in the wings in a costume cut for someone else, discovering that she was not frightened. Nine years of standing at the back had done something she had not known they were doing. The readiness had not been a wait. It had been the work.\n\nShe left the company that summer and taught for the next thirty years. Her students describe her as the only teacher any of them had who never once told them that their moment would come. What she told them instead, over and over, was that the moment was not the point and would not feel like one when it arrived, and that they should get on with learning the blocking.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What does the detail of the costume \"cut for someone else\" contribute?", "options": {"A": "It marks how completely the occasion belonged to someone else, which makes her calm more striking.", "B": "It shows that the company had not prepared properly for an absence.", "C": "It suggests she was physically unlike the lead actor.", "D": "It explains why nobody reviewed the performance."}, "fig": "", "passage": "<strong>The Understudy</strong><br>For nine years Ilse learned parts she did not play. She was contracted to be ready, and being ready is not a small thing: she knew the blocking, the cues, the three different ways the director had asked for the second-act entrance before settling on the first. She stood at the back of the rehearsal room with the book open and did not need it.\n\nOn a Thursday in the ninth year, the lead was taken ill at four o'clock. Ilse went on. She was, by every account including her own, adequate. She did not fall over the furniture, she was audible at the back, and she made one small choice in the third act that the director noticed and later borrowed. Nobody wrote about it. There was no review, because nobody reviews a Thursday.\n\nWhat she remembered afterwards was not the performance but the twenty minutes before it, standing in the wings in a costume cut for someone else, discovering that she was not frightened. Nine years of standing at the back had done something she had not known they were doing. The readiness had not been a wait. It had been the work.\n\nShe left the company that summer and taught for the next thirty years. Her students describe her as the only teacher any of them had who never once told them that their moment would come. What she told them instead, over and over, was that the moment was not the point and would not feel like one when it arrived, and that they should get on with learning the blocking.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "The final paragraph reports what Ilse told her students rather than what she thought. The EFFECT is to", "options": {"A": "suggest that she never really believed it herself", "B": "imply that her students disagreed with her", "C": "leave the reader uncertain about what she concluded", "D": "show that the understanding held for thirty years and was passed on"}, "fig": "", "passage": "<strong>The Understudy</strong><br>For nine years Ilse learned parts she did not play. She was contracted to be ready, and being ready is not a small thing: she knew the blocking, the cues, the three different ways the director had asked for the second-act entrance before settling on the first. She stood at the back of the rehearsal room with the book open and did not need it.\n\nOn a Thursday in the ninth year, the lead was taken ill at four o'clock. Ilse went on. She was, by every account including her own, adequate. She did not fall over the furniture, she was audible at the back, and she made one small choice in the third act that the director noticed and later borrowed. Nobody wrote about it. There was no review, because nobody reviews a Thursday.\n\nWhat she remembered afterwards was not the performance but the twenty minutes before it, standing in the wings in a costume cut for someone else, discovering that she was not frightened. Nine years of standing at the back had done something she had not known they were doing. The readiness had not been a wait. It had been the work.\n\nShe left the company that summer and taught for the next thirty years. Her students describe her as the only teacher any of them had who never once told them that their moment would come. What she told them instead, over and over, was that the moment was not the point and would not feel like one when it arrived, and that they should get on with learning the blocking.", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "In Text A, \"adequate\" is used to", "options": {"A": "criticise Ilse for wasting her one opportunity", "B": "report the performance honestly without treating that as a disappointment", "C": "suggest that the audience did not notice her at all", "D": "imply that the director had misjudged her ability"}, "fig": "", "passage": "<strong>The Understudy</strong><br>For nine years Ilse learned parts she did not play. She was contracted to be ready, and being ready is not a small thing: she knew the blocking, the cues, the three different ways the director had asked for the second-act entrance before settling on the first. She stood at the back of the rehearsal room with the book open and did not need it.\n\nOn a Thursday in the ninth year, the lead was taken ill at four o'clock. Ilse went on. She was, by every account including her own, adequate. She did not fall over the furniture, she was audible at the back, and she made one small choice in the third act that the director noticed and later borrowed. Nobody wrote about it. There was no review, because nobody reviews a Thursday.\n\nWhat she remembered afterwards was not the performance but the twenty minutes before it, standing in the wings in a costume cut for someone else, discovering that she was not frightened. Nine years of standing at the back had done something she had not known they were doing. The readiness had not been a wait. It had been the work.\n\nShe left the company that summer and taught for the next thirty years. Her students describe her as the only teacher any of them had who never once told them that their moment would come. What she told them instead, over and over, was that the moment was not the point and would not feel like one when it arrived, and that they should get on with learning the blocking.", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "Which detail most directly supports the story's central idea?", "options": {"A": "She left the company that summer.", "B": "The lead was taken ill at four o'clock.", "C": "She knew the three ways the entrance had been tried before the director settled on one.", "D": "She was audible at the back."}, "fig": "", "passage": "<strong>The Understudy</strong><br>For nine years Ilse learned parts she did not play. She was contracted to be ready, and being ready is not a small thing: she knew the blocking, the cues, the three different ways the director had asked for the second-act entrance before settling on the first. She stood at the back of the rehearsal room with the book open and did not need it.\n\nOn a Thursday in the ninth year, the lead was taken ill at four o'clock. Ilse went on. She was, by every account including her own, adequate. She did not fall over the furniture, she was audible at the back, and she made one small choice in the third act that the director noticed and later borrowed. Nobody wrote about it. There was no review, because nobody reviews a Thursday.\n\nWhat she remembered afterwards was not the performance but the twenty minutes before it, standing in the wings in a costume cut for someone else, discovering that she was not frightened. Nine years of standing at the back had done something she had not known they were doing. The readiness had not been a wait. It had been the work.\n\nShe left the company that summer and taught for the next thirty years. Her students describe her as the only teacher any of them had who never once told them that their moment would come. What she told them instead, over and over, was that the moment was not the point and would not feel like one when it arrived, and that they should get on with learning the blocking.", "qnum": "34"}, {"n": "36", "type": "mcq", "section": "English", "stem": "According to Text B, what happens IMMEDIATELY BEFORE the model steps forward in time?", "options": {"A": "The previous forecast is corrected using the new observations.", "B": "Half a million measurements are collected from satellites and stations.", "C": "The model is run many times from slightly different starting states.", "D": "The spread across the ensemble is converted into a probability."}, "fig": "", "passage": "<strong>How a Weather Forecast Is Made</strong><br>A forecast is not a prediction drawn from a chart by an experienced eye. It is the output of a physical model, and understanding what it can and cannot do means following how it is produced.\n\nThe first stage is observation. Roughly half a million measurements reach the major forecasting centres every hour, from surface stations, weather balloons, ships, aircraft and, above all, satellites. These arrive irregularly in space and time, and almost none of them fall on the grid points the model actually uses.\n\nThe second stage, data assimilation, is the one most often skipped in explanations and is arguably the hardest. The model cannot simply be handed the observations. Instead the previous forecast is used as a first guess at the current state of the atmosphere, and the new observations are used to correct it, each weighted by how reliable it is known to be. The result is an estimate of the atmosphere now that is better than either the observations or the previous forecast alone.\n\nThe third stage is integration. The model steps that estimated state forward in time, applying the equations of fluid motion and thermodynamics at every grid point, typically in steps of a few minutes, for as many steps as the forecast period requires.\n\nThe fourth stage is where the honesty lies. Because the atmosphere is chaotic, two starting states that differ by less than the measurement error will diverge, and after about ten days they diverge completely. Centres therefore run the model many times from slightly different starting states and report the spread. A forecast of a 30 per cent chance of rain is a statement about how many members of that ensemble produced rain, and it is a claim about the model, not a promise about the sky.", "qnum": "35"}, {"n": "37", "type": "mcq", "section": "English", "stem": "According to Text B, why can the model not simply be given the observations?", "options": {"A": "There are too few of them to describe the atmosphere.", "B": "They are less reliable than the previous forecast.", "C": "They cannot be collected quickly enough to be useful.", "D": "They arrive irregularly and almost none of them fall on the grid points the model uses."}, "fig": "", "passage": "<strong>How a Weather Forecast Is Made</strong><br>A forecast is not a prediction drawn from a chart by an experienced eye. It is the output of a physical model, and understanding what it can and cannot do means following how it is produced.\n\nThe first stage is observation. Roughly half a million measurements reach the major forecasting centres every hour, from surface stations, weather balloons, ships, aircraft and, above all, satellites. These arrive irregularly in space and time, and almost none of them fall on the grid points the model actually uses.\n\nThe second stage, data assimilation, is the one most often skipped in explanations and is arguably the hardest. The model cannot simply be handed the observations. Instead the previous forecast is used as a first guess at the current state of the atmosphere, and the new observations are used to correct it, each weighted by how reliable it is known to be. The result is an estimate of the atmosphere now that is better than either the observations or the previous forecast alone.\n\nThe third stage is integration. The model steps that estimated state forward in time, applying the equations of fluid motion and thermodynamics at every grid point, typically in steps of a few minutes, for as many steps as the forecast period requires.\n\nThe fourth stage is where the honesty lies. Because the atmosphere is chaotic, two starting states that differ by less than the measurement error will diverge, and after about ten days they diverge completely. Centres therefore run the model many times from slightly different starting states and report the spread. A forecast of a 30 per cent chance of rain is a statement about how many members of that ensemble produced rain, and it is a claim about the model, not a promise about the sky.", "qnum": "36"}, {"n": "38", "type": "mcq", "section": "English", "stem": "What can be inferred from the statement that two starting states differing by less than the measurement error will diverge?", "options": {"A": "The model's equations must contain an error.", "B": "Improving the observations alone cannot extend a forecast indefinitely.", "C": "Forecasts beyond ten days are never attempted.", "D": "Satellite measurements are less accurate than surface measurements."}, "fig": "", "passage": "<strong>How a Weather Forecast Is Made</strong><br>A forecast is not a prediction drawn from a chart by an experienced eye. It is the output of a physical model, and understanding what it can and cannot do means following how it is produced.\n\nThe first stage is observation. Roughly half a million measurements reach the major forecasting centres every hour, from surface stations, weather balloons, ships, aircraft and, above all, satellites. These arrive irregularly in space and time, and almost none of them fall on the grid points the model actually uses.\n\nThe second stage, data assimilation, is the one most often skipped in explanations and is arguably the hardest. The model cannot simply be handed the observations. Instead the previous forecast is used as a first guess at the current state of the atmosphere, and the new observations are used to correct it, each weighted by how reliable it is known to be. The result is an estimate of the atmosphere now that is better than either the observations or the previous forecast alone.\n\nThe third stage is integration. The model steps that estimated state forward in time, applying the equations of fluid motion and thermodynamics at every grid point, typically in steps of a few minutes, for as many steps as the forecast period requires.\n\nThe fourth stage is where the honesty lies. Because the atmosphere is chaotic, two starting states that differ by less than the measurement error will diverge, and after about ten days they diverge completely. Centres therefore run the model many times from slightly different starting states and report the spread. A forecast of a 30 per cent chance of rain is a statement about how many members of that ensemble produced rain, and it is a claim about the model, not a promise about the sky.", "qnum": "37"}, {"n": "39", "type": "mcq", "section": "English", "stem": "Why does the writer call the fourth stage the one \"where the honesty lies\"?", "options": {"A": "Because it is the only stage carried out by human forecasters.", "B": "Because it is the stage where errors from earlier stages are corrected.", "C": "Because it is the stage the public sees.", "D": "Because it is where the forecast reports the limits of its own certainty"}, "fig": "", "passage": "<strong>How a Weather Forecast Is Made</strong><br>A forecast is not a prediction drawn from a chart by an experienced eye. It is the output of a physical model, and understanding what it can and cannot do means following how it is produced.\n\nThe first stage is observation. Roughly half a million measurements reach the major forecasting centres every hour, from surface stations, weather balloons, ships, aircraft and, above all, satellites. These arrive irregularly in space and time, and almost none of them fall on the grid points the model actually uses.\n\nThe second stage, data assimilation, is the one most often skipped in explanations and is arguably the hardest. The model cannot simply be handed the observations. Instead the previous forecast is used as a first guess at the current state of the atmosphere, and the new observations are used to correct it, each weighted by how reliable it is known to be. The result is an estimate of the atmosphere now that is better than either the observations or the previous forecast alone.\n\nThe third stage is integration. The model steps that estimated state forward in time, applying the equations of fluid motion and thermodynamics at every grid point, typically in steps of a few minutes, for as many steps as the forecast period requires.\n\nThe fourth stage is where the honesty lies. Because the atmosphere is chaotic, two starting states that differ by less than the measurement error will diverge, and after about ten days they diverge completely. Centres therefore run the model many times from slightly different starting states and report the spread. A forecast of a 30 per cent chance of rain is a statement about how many members of that ensemble produced rain, and it is a claim about the model, not a promise about the sky.", "qnum": "38"}, {"n": "40", "type": "mcq", "section": "English", "stem": "According to Text B, a forecast of a 30 per cent chance of rain means that", "options": {"A": "about 30 per cent of the model runs produced rain", "B": "rain will fall on about 30 per cent of the forecast area.", "C": "the forecaster is 30 per cent confident in the whole forecast.", "D": "rain will fall for about 30 per cent of the day."}, "fig": "", "passage": "<strong>How a Weather Forecast Is Made</strong><br>A forecast is not a prediction drawn from a chart by an experienced eye. It is the output of a physical model, and understanding what it can and cannot do means following how it is produced.\n\nThe first stage is observation. Roughly half a million measurements reach the major forecasting centres every hour, from surface stations, weather balloons, ships, aircraft and, above all, satellites. These arrive irregularly in space and time, and almost none of them fall on the grid points the model actually uses.\n\nThe second stage, data assimilation, is the one most often skipped in explanations and is arguably the hardest. The model cannot simply be handed the observations. Instead the previous forecast is used as a first guess at the current state of the atmosphere, and the new observations are used to correct it, each weighted by how reliable it is known to be. The result is an estimate of the atmosphere now that is better than either the observations or the previous forecast alone.\n\nThe third stage is integration. The model steps that estimated state forward in time, applying the equations of fluid motion and thermodynamics at every grid point, typically in steps of a few minutes, for as many steps as the forecast period requires.\n\nThe fourth stage is where the honesty lies. Because the atmosphere is chaotic, two starting states that differ by less than the measurement error will diverge, and after about ten days they diverge completely. Centres therefore run the model many times from slightly different starting states and report the spread. A forecast of a 30 per cent chance of rain is a statement about how many members of that ensemble produced rain, and it is a claim about the model, not a promise about the sky.", "qnum": "39"}, {"n": "41", "type": "mcq", "section": "English", "stem": "Taken as a whole, Text B is about", "options": {"A": "Weather forecasting has become accurate because satellites now supply half a million measurements an hour.", "B": "Because the atmosphere is chaotic, forecasting beyond a few days is impossible.", "C": "A forecast is built in four stages from observations to an ensemble, and the last stage is what tells you how far to trust it.", "D": "Data assimilation is the hardest part of forecasting and deserves more attention."}, "fig": "", "passage": "<strong>How a Weather Forecast Is Made</strong><br>A forecast is not a prediction drawn from a chart by an experienced eye. It is the output of a physical model, and understanding what it can and cannot do means following how it is produced.\n\nThe first stage is observation. Roughly half a million measurements reach the major forecasting centres every hour, from surface stations, weather balloons, ships, aircraft and, above all, satellites. These arrive irregularly in space and time, and almost none of them fall on the grid points the model actually uses.\n\nThe second stage, data assimilation, is the one most often skipped in explanations and is arguably the hardest. The model cannot simply be handed the observations. Instead the previous forecast is used as a first guess at the current state of the atmosphere, and the new observations are used to correct it, each weighted by how reliable it is known to be. The result is an estimate of the atmosphere now that is better than either the observations or the previous forecast alone.\n\nThe third stage is integration. The model steps that estimated state forward in time, applying the equations of fluid motion and thermodynamics at every grid point, typically in steps of a few minutes, for as many steps as the forecast period requires.\n\nThe fourth stage is where the honesty lies. Because the atmosphere is chaotic, two starting states that differ by less than the measurement error will diverge, and after about ten days they diverge completely. Centres therefore run the model many times from slightly different starting states and report the spread. A forecast of a 30 per cent chance of rain is a statement about how many members of that ensemble produced rain, and it is a claim about the model, not a promise about the sky.", "qnum": "40"}, {"n": "42", "type": "writing", "section": "English Writing", "intro": "This is a Stage 6 writing task and it offers two DIFFERENT text types. Task 1 is an ARGUMENTATIVE essay: defend a claim with reasoning and evidence and answer the strongest objection to it. Task 2 is an explanation of a PROCESS OR PROCEDURE: set out the stages in order, make each step's purpose clear, and write for a reader who does not already know the subject. Before you finish, edit your own work: cut repetition, turn heavy noun phrases back into verbs, and check that every sentence says what you meant.", "label": "", "body": "Choose ONE of the following: (1) 'A society that rewards only visible achievement will end up with less of everything else.' To what extent do you agree? Argue your position and answer the strongest objection to it. (2) Explain, for a reader who knows nothing about it, how something is measured, tested or produced in a field you know well. Set out the stages in order, say what each one is for, and make clear what the method cannot tell you.", "hint": "Write five or six paragraphs. If you choose Task 1, state your claim, develop at least two reasons, answer an objection and conclude. If you choose Task 2, set the stages out in order and be explicit about the method's limits. Check your spelling, punctuation and grammar, and re-read for anything you can cut.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "43", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The cone shown has a base radius of 5 cm and a vertical height of 12 cm. What is its slant height?", "options": {"A": "17 cm", "B": "7 cm", "C": "169 cm", "D": "13 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><ellipse cx=\"110\" cy=\"160\" rx=\"62\" ry=\"18\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M48,160 A62,18 0 0 0 172,160 L110,40 Z\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M48,160 A62,18 0 0 1 172,160\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "1"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What is the distance between the points (-3, 4) and (5, -2)?", "options": {"A": "10", "B": "14", "C": "2", "D": "100"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The triangle shown has sides of 5 cm, 7 cm and 8 cm. Which expression gives the cosine of the angle OPPOSITE the 8 cm side?", "options": {"A": "<span class=\"frac\"><span class=\"num\">8<sup>2</sup> + 7<sup>2</sup> - 5<sup>2</sup></span><span , "stem": "The matrix with rows (3, 5) and (1, 2) has determinant 1. What is its inverse?", "options": {"A": "the matrix with rows (2, -5) and (-1, 3)", "B": "the matrix with rows (2, 5) and (1, 3)", "C": "the matrix with rows (-3, -5) and (-1, -2)", "D": "the matrix with rows (3, 1) and (5, 2)"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a year group, 60 per cent study Physics and 25 per cent study both Physics and Chemistry. A student who studies Physics is chosen at random. What is the probability that they also study Chemistry?", "options": {"A": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>", "B": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>", "C": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">12</span></span>", "D": "<span class=\"frac\"><span class=\"num\">12</span><span class=\"den\">5</span></span>"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A machine has three components, each of which fails independently with probability 0.1. What is the probability that AT LEAST ONE fails?", "options": {"A": "0.3", "B": "0.001", "C": "0.729", "D": "0.271"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Solve the cryptic clue: \"Listen, confused, and be quiet (6)\".", "options": {"A": "LISTEN", "B": "SILENT", "C": "TINSEL", "D": "ENLIST"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What comes next in this sequence? Z, W, S, N, ___", "options": {"A": "H", "B": "G", "C": "I", "D": "M"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "\"The grallick snorves have plimbed two bantic wexes.\" Which invented word is functioning as a VERB?", "options": {"A": "grallick", "B": "snorves", "C": "plimbed", "D": "wexes"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two dice are rolled. Which is MORE likely: a total of 7, or a total of 10?", "options": {"A": "a total of 10", "B": "they are equally likely", "C": "it cannot be determined without knowing the dice are fair", "D": "a total of 7"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Five books stand on a shelf. The atlas is somewhere to the left of the dictionary. The thesaurus is immediately right of the atlas. The almanac is at the far right. The gazetteer is at the far left. Which book is in the MIDDLE?", "options": {"A": "the atlas", "B": "the thesaurus", "C": "the dictionary", "D": "the gazetteer"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this sequence: 2, 5, 11, 23, 47, ___ . What number comes next?", "options": {"A": "94", "B": "71", "C": "95", "D": "96"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a club of 40 members, 22 play chess, 19 play bridge and 7 play both. How many play NEITHER?", "options": {"A": "6", "B": "13", "C": "34", "D": "11"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The regulator will publish every hospital's rate of surgical complications, so that patients can choose the safest hospital for their operation.\"\n\nPROPOSED ASSUMPTION: \"A hospital's published complication rate reflects how safely it performs the operation.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "Yes. The published rate is offered as the basis on which patients should choose the safest hospital, which only works if the rate measures safety rather than something else.", "B": "No. The statement announces what will be published and makes no claim about what the figures mean."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Under the scheme's rules, no application is considered unless it is submitted with two independent references. The Mbeki application was submitted with three independent references.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "The Mbeki application satisfied the scheme's reference requirement.", "B": "The Mbeki application was considered.", "C": "Most applications to the scheme carry three references.", "D": "Applications with two references are always considered."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A law firm reviewed all 600 cases it handled in one year. It found that 400 were settled before trial, 330 involved a corporate client, and 150 were both settled before trial and involved a corporate client.\"\n\nCONCLUSION (1): Two thirds of the firm's cases were settled before trial.\nCONCLUSION (2): Most cases involving a corporate client were settled before trial.\nCONCLUSION (3): 20 cases were neither settled before trial nor involved a corporate client.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "All three conclusions follow.", "B": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "C": "Conclusion 1 follows, but Conclusions 2 and 3 do not.", "D": "Conclusions 1 and 3 follow, but Conclusion 2 does not."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "72", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"Every contract signed under the old framework includes an arbitration clause. No contract that includes an arbitration clause may be heard in the small claims court.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "Any contract that may be heard in the small claims court was signed under the new framework.", "B": "No contract signed under the old framework may be heard in the small claims court.", "C": "Every contract with an arbitration clause was signed under the old framework."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "73", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should a research funder require that every study it funds publishes its data openly?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "Yes. Research paid for by the public belongs to the public, and any scientist who wants to keep their data to themselves has something to hide. Science is supposed to be open, and secrecy has no place in it.", "B": "No. Preparing data for publication takes researchers weeks that they could have spent on the next study, and small teams would be hit hardest because they have no data manager.", "C": "Yes. When one funder introduced the requirement, an audit of the 1,900 studies published in the following three years found that 4.1 per cent contained a statistical error material enough to change a stated conclusion, against 11.6 per cent in a matched set from funders without the requirement. The difference held after adjusting for field and sample size, and most of the errors were found by readers rather than by reviewers, which is only possible when the data are available."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "74", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A legal aid charity reported: 'Of the 220 tenants who contacted us about eviction last year and who were represented at their hearing, 64 per cent kept their tenancy. Tenants reached us through advice centres, court duty desks and word of mouth.'\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Representation at a hearing raises a tenant's chance of keeping their tenancy.", "B": "Most tenants facing eviction keep their tenancy.", "C": "Among the represented tenants who contacted the charity, most kept their tenancy.", "D": "The charity represented 220 tenants last year."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "75", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "作者認為無人駕駛帶來的真正難題在哪裏？<br><i>作者认为无人驾驶带来的真正难题在哪里？</i>", "options": {"A": "在技術上仍然無法克服<br><i>在技术上仍然无法克服</i>", "B": "在市民不願意接受新技術<br><i>在市民不愿意接受新技术</i>", "C": "在製造成本過於高昂<br><i>在制造成本过于高昂</i>", "D": "在法律上難以確定責任誰屬<br><i>在法律上难以确定责任谁属</i>"}, "fig": "", "passage": "無人駕駛汽車已經在多個城市的道路上試行。技術上的難題正一項一項解決，真正棘手的問題卻不在工程，而在法律：一旦這樣的車輛造成傷亡，責任應由誰來承擔？\n\n傳統的交通法規建立在一個簡單的前提之上：方向盤後面坐着一個人，那個人在每一刻都作出判斷，因此也為每一刻負責。無人駕駛把這個前提抽走了。車上的人沒有操作，軟件的設計者則在事發之前數年便寫下了那一段程式碼。責任在時間上被拉長，在人數上被攤薄，於是誰也不像是那個「肇事者」。\n\n目前主要有三種主張。第一種把責任歸於車主，理由是他選擇使用這項技術，也從中得益。第二種把責任歸於製造商，理由是只有製造商知道系統如何作出決定，也只有製造商有能力改良它。第三種主張設立一個由業界共同供款的賠償基金，先向傷者賠償，再另行追究。\n\n三種主張各有難處。若一律歸咎車主，等於要一個無法理解系統的人為系統負責，這既不公平，也不會令道路更安全。若一律歸咎製造商，看似合理，但訴訟的成本最終會轉嫁到售價之上，而且製造商為求自保，可能把系統設定得過分保守，反而妨礙交通。至於賠償基金，它能迅速安撫傷者，卻有一個隱憂：若賠償與過失脫鈎，改良系統的動力便會減弱。\n\n《韓非子》說：「法不阿貴，繩不撓曲。」法律不因對方的身分而偏袒，墨線不因木材彎曲而遷就。面對一個資金雄厚的行業，這句話尤其值得記住：規則不應為了扶植產業而放寬到讓傷者無處申訴。\n\n然而只靠法律也不足夠。《孟子》說：「徒善不足以為政，徒法不能以自行。」空有善意辦不好政事，單有法律也不會自己運作。要讓責任落到實處，必須同時要求車輛保存可供查核的行車紀錄，設立獨立的事故調查機構，並公開每一次系統失效的原因。有了紀錄與調查，責任才不再是抽象的爭論，而是可以查明的事實。\n\n換言之，問題不是「誰負責」這四個字能夠回答的。與其急於指定一個承擔者，不如先建立一套讓真相浮現的制度。<br><i>无人驾驶汽车已经在多个城市的道路上试行。技术上的难题正一项一项解决，真正棘手的问题却不在工程，而在法律：一旦这样的车辆造成伤亡，责任应由谁来承担？\n\n传统的交通法规建立在一个简单的前提之上：方向盘后面坐着一个人，那个人在每一刻都作出判断，因此也为每一刻负责。无人驾驶把这个前提抽走了。车上的人没有操作，软件的设计者则在事发之前数年便写下了那一段程式码。责任在时间上被拉长，在人数上被摊薄，于是谁也不像是那个「肇事者」。\n\n目前主要有三种主张。第一种把责任归于车主，理由是他选择使用这项技术，也从中得益。第二种把责任归于制造商，理由是只有制造商知道系统如何作出决定，也只有制造商有能力改良它。第三种主张设立一个由业界共同供款的赔偿基金，先向伤者赔偿，再另行追究。\n\n三种主张各有难处。若一律归咎车主，等于要一个无法理解系统的人为系统负责，这既不公平，也不会令道路更安全。若一律归咎制造商，看似合理，但诉讼的成本最终会转嫁到售价之上，而且制造商为求自保，可能把系统设定得过分保守，反而妨碍交通。至于赔偿基金，它能迅速安抚伤者，却有一个隐忧：若赔偿与过失脱钩，改良系统的动力便会减弱。\n\n《韩非子》说：「法不阿贵，绳不挠曲。」法律不因对方的身分而偏袒，墨线不因木材弯曲而迁就。面对一个资金雄厚的行业，这句话尤其值得记住：规则不应为了扶植产业而放宽到让伤者无处申诉。\n\n然而只靠法律也不足够。《孟子》说：「徒善不足以为政，徒法不能以自行。」空有善意办不好政事，单有法律也不会自己运作。要让责任落到实处，必须同时要求车辆保存可供查核的行车纪录，设立独立的事故调查机构，并公开每一次系统失效的原因。有了纪录与调查，责任才不再是抽象的争论，而是可以查明的事实。\n\n换言之，问题不是「谁负责」这四个字能够回答的。与其急于指定一个承担者，不如先建立一套让真相浮现的制度。</i>", "qnum": "1"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "傳統交通法規建立在甚麼前提之上？<br><i>传统交通法规建立在甚么前提之上？</i>", "options": {"A": "每輛車都必須購買足額保險<br><i>每辆车都必须购买足额保险</i>", "B": "駕駛者在每一刻作出判斷，因此為每一刻負責<br><i>驾驶者在每一刻作出判断，因此为每一刻负责</i>", "C": "道路的設計必須符合安全標準<br><i>道路的设计必须符合安全标准</i>", "D": "行人必須遵守交通指示<br><i>行人必须遵守交通指示</i>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "作者認為把責任一律歸咎車主，有甚麼問題？<br><i>作者认为把责任一律归咎车主，有甚么问题？</i>", "options": {"A": "等於要一個無法理解系統的人為系統負責<br><i>等于要一个无法理解系统的人为系统负责</i>", "B": "車主大多沒有能力賠償<br><i>车主大多没有能力赔偿</i>", "C": "車主並非車輛的擁有人<br><i>车主并非车辆的拥有人</i>", "D": "車主無法購買保險<br><i>车主无法购买保险</i>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "作者指出賠償基金的隱憂是甚麼？<br><i>作者指出赔偿基金的隐忧是甚么？</i>", "options": {"A": "基金的款項不足以應付賠償<br><i>基金的款项不足以应付赔偿</i>", "B": "業界不願意共同供款<br><i>业界不愿意共同供款</i>", "C": "賠償與過失脫鈎後，改良系統的動力會減弱<br><i>赔偿与过失脱钩后，改良系统的动力会减弱</i>", "D": "傷者需要等候很長時間<br><i>伤者需要等候很长时间</i>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "作者最後提出的主張是甚麼？<br><i>作者最后提出的主张是甚么？</i>", "options": {"A": "立刻立法規定由製造商全數承擔<br><i>立刻立法规定由制造商全数承担</i>", "B": "暫停一切無人駕駛的道路測試<br><i>暂停一切无人驾驶的道路测试</i>", "C": "由車主與製造商各承擔一半責任<br><i>由车主与制造商各承担一半责任</i>", "D": "先建立讓真相浮現的制度，而不是急於指定一個承擔者<br><i>先建立让真相浮现的制度，而不是急于指定一个承担者</i>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "本文的論證結構是怎樣的？<br><i>本文的论证结构是怎样的？</i>", "options": {"A": "先說明難題，再列出三種主張並逐一指出難處，最後提出自己的方案<br><i>先说明难题，再列出三种主张并逐一指出难处，最后提出自己的方案</i>", "B": "先提出結論，再用三個例子加以證明<br><i>先提出结论，再用三个例子加以证明</i>", "C": "由頭到尾支持設立賠償基金<br><i>由头到尾支持设立赔偿基金</i>", "D": "只陳述各方意見，不作任何判斷<br><i>只陈述各方意见，不作任何判断</i>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "82", "type": "mcq", "section": "Chinese", "stem": "文中引《韓非子》「法不阿貴，繩不撓曲」，這兩句的意思是<br><i>文中引《韩非子》「法不阿贵，绳不挠曲」，这两句的意思是</i>", "options": {"A": "法律應當寬待權貴，工匠應當順應木材<br><i>法律应当宽待权贵，工匠应当顺应木材</i>", "B": "法律難以執行，工具也未必準確<br><i>法律难以执行，工具也未必准确</i>", "C": "法律不偏袒權貴，墨線不遷就彎曲的木材<br><i>法律不偏袒权贵，墨线不迁就弯曲的木材</i>", "D": "權貴應當帶頭守法，木匠應當精益求精<br><i>权贵应当带头守法，木匠应当精益求精</i>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "文中引《孟子》「徒善不足以為政，徒法不能以自行」，作者用這句話是要說明甚麼？<br><i>文中引《孟子》「徒善不足以为政，徒法不能以自行」，作者用这句话是要说明甚么？</i>", "options": {"A": "善意比法律更加重要", "B": "單靠法律並不足夠，還需要紀錄與調查等配套<br><i>单靠法律并不足够，还需要纪录与调查等配套</i>", "C": "政治與法律本來就互不相干<br><i>政治与法律本来就互不相干</i>", "D": "法律應當由有德行的人來制訂<br><i>法律应当由有德行的人来制订</i>"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "84", "type": "mcq", "section": "Chinese", "stem": "「責任在時間上被拉長，在人數上被攤薄」，「攤薄」在文中的意思是<br><i>「责任在时间上被拉长，在人数上被摊薄」，「摊薄」在文中的意思是</i>", "options": {"A": "減少到可以忽略不計<br><i>减少到可以忽略不计</i>", "B": "被人推卸而無人承認<br><i>被人推卸而无人承认</i>", "C": "分散到許多人身上而變得稀薄<br><i>分散到许多人身上而变得稀薄</i>", "D": "按比例平均分配"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "「訴訟的成本最終會轉嫁到售價之上」，「轉嫁」的意思是<br><i>「诉讼的成本最终会转嫁到售价之上」，「转嫁」的意思是</i>", "options": {"A": "把負擔移到別人身上<br><i>把负担移到别人身上</i>", "B": "改變原來的用途<br><i>改变原来的用途</i>", "C": "提高產品的品質<br><i>提高产品的品质</i>", "D": "重新計算成本<br><i>重新计算成本</i>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "作者指出製造商「為求自保，可能把系統設定得過分保守，反而妨礙交通」。這種情況最適合用哪個成語形容？<br><i>作者指出制造商「为求自保，可能把系统设定得过分保守，反而妨碍交通」。这种情况最适合用哪个成语形容？</i>", "options": {"A": "因勢利導<br><i>因势利导</i>", "B": "一勞永逸<br><i>一劳永逸</i>", "C": "釜底抽薪", "D": "矯枉過正<br><i>矫枉过正</i>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "87", "type": "mcq", "section": "Chinese", "stem": "作者主張先保存紀錄、設立調查機構，讓責任成為可以查明的事實。這種做法最適合用哪個成語形容？<br><i>作者主张先保存纪录、设立调查机构，让责任成为可以查明的事实。这种做法最适合用哪个成语形容？</i>", "options": {"A": "空穴來風<br><i>空穴来风</i>", "B": "有據可循<br><i>有据可循</i>", "C": "眾說紛紜<br><i>众说纷纭</i>", "D": "道聽塗說<br><i>道听涂说</i>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "88", "type": "mcq", "section": "Chinese", "stem": "下列哪一句沒有語病？<br><i>下列哪一句没有语病？</i>", "options": {"A": "由於設立了調查機構，使責任變得可以查明。<br><i>由于设立了调查机构，使责任变得可以查明。</i>", "B": "這項技術是否安全，取決於製造商有沒有負責任的態度是關鍵。<br><i>这项技术是否安全，取决于制造商有没有负责任的态度是关键。</i>", "C": "公開失效原因的做法，對於減少同類事故的發生是有幫助的作用。<br><i>公开失效原因的做法，对于减少同类事故的发生是有帮助的作用。</i>", "D": "獨立的事故調查機構能夠查明系統失效的原因。<br><i>独立的事故调查机构能够查明系统失效的原因。</i>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "89", "type": "mcq", "section": "Chinese", "stem": "「空有善意辦不好政事，單有法律也不會自己運作。」這一句主要用了哪種修辭手法？<br><i>「空有善意办不好政事，单有法律也不会自己运作。」这一句主要用了哪种修辞手法？</i>", "options": {"A": "借代", "B": "層遞<br><i>层递</i>", "C": "對偶<br><i>对偶</i>", "D": "反問<br><i>反问</i>"}, "fig": "", "passage": "", "qnum": "14"}];

let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 (V5)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
</html>
