<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 6 Critical Thinking Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT CIS: Stage 6 Critical Thinking Drill 4</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "CT-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions using ONLY the information given. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The regulator should publish the name of every restaurant that fails a hygiene inspection, because in the year a neighbouring city began doing so the share of restaurants passing at the first inspection rose by fourteen points.\"<br><br>PROPOSED ASSUMPTION: \"Restaurants in this city would respond to publication in broadly the way restaurants in the neighbouring city did.\"<br><br>Is this assumption being made, YES or NO?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The court should allow the recording from the shop camera to be shown to the jury, because it is the only evidence that puts anybody at the counter at the time of the theft.\"<br><br>PROPOSED ASSUMPTION: \"Who was at the counter at the time of the theft bears on what the jury has to decide.\"<br><br>Is this assumption being made, YES or NO?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Parliament should raise the penalty for driving while holding a telephone, because the present fine is smaller than the cost of a parking ticket in the city centre.\"<br><br>PROPOSED ASSUMPTION: \"Parking tickets in the city centre are issued more often than fines for driving while holding a telephone.\"<br><br>Is this assumption being made, YES or NO?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The tribunal should hear the case although the deadline has passed, because the employee spent the whole of the period for filing a claim in hospital.\"<br><br>PROPOSED ASSUMPTION: \"The employee will win the case if the tribunal hears it.\"<br><br>Is this assumption being made, YES or NO?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every complaint the ombudsman upheld last year concerned a firm that had received at least one earlier warning. The complaint against Harker Insurance was upheld last year.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Harker Insurance had received exactly one earlier warning.", "B": "Every firm that had received an earlier warning had a complaint upheld against it.", "C": "Harker Insurance had received at least one earlier warning.", "D": "The ombudsman upheld every complaint made against Harker Insurance."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Some of the clauses in the contract are governed by the law of another country. Every clause governed by the law of another country was drafted by the firm's external counsel.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Every clause in the contract was drafted by the firm's external counsel.", "B": "Every clause drafted by the firm's external counsel is governed by the law of another country.", "C": "Most of the contract is governed by the law of another country.", "D": "At least one clause in the contract was drafted by the firm's external counsel."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No document may be released to the public unless the privacy office has redacted the names in it. The inspection report on the ferry terminal has been released to the public.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The privacy office redacted the names in the inspection report on the ferry terminal.", "B": "The inspection report found faults at the ferry terminal.", "C": "Every document whose names the privacy office redacts is released to the public.", "D": "The inspection report was the first document the privacy office redacted."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every case heard in the small claims division is decided by a single judge. Every case decided by a single judge may be appealed only on a point of law. The Larkin case was heard in the small claims division.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The Larkin case was appealed.", "B": "The Larkin case may be appealed only on a point of law.", "C": "Every case that may be appealed only on a point of law was heard in the small claims division.", "D": "The judge in the Larkin case found for the claimant."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Inspectors visited 250 building sites in a city last year and issued a stop notice at 30 of them. The year before, they visited 400 sites and issued a stop notice at 40.\"<br><br>CONCLUSIONS:<br>(1) A higher proportion of the sites visited received a stop notice last year than in the year before.<br>(2) Building sites in the city became less safe between the two years.<br>(3) Fewer stop notices were issued last year than in the year before.<br><br>Which of the following is correct?", "options": {"A": "Conclusions (1) and (3) follow; conclusion (2) does not.", "B": "All three conclusions follow.", "C": "Only conclusion (3) follows.", "D": "Conclusions (1) and (2) follow; conclusion (3) does not."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A regulator fined 12 of the 60 firms it audited last year. Nine of the fines were for the same breach of the record-keeping rules. The regulator chooses for audit the firms it considers most likely to be in breach.\"<br><br>CONCLUSIONS:<br>(1) One firm in five in the industry broke the rules last year.<br>(2) Three quarters of the fines were for a breach of the record-keeping rules.<br>(3) The record-keeping rules are the rules most often broken in the industry.<br><br>Which of the following is correct?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not.", "D": "Only conclusion (2) follows."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A court disposed of 900 cases last year. 540 ended in a guilty plea, 270 went to trial and the remainder were withdrawn. Of the 270 that went to trial, 108 ended in an acquittal.\"<br><br>CONCLUSIONS:<br>(1) 90 cases were withdrawn.<br>(2) Three fifths of the cases disposed of ended in a guilty plea.<br>(3) Two fifths of the cases that went to trial ended in an acquittal.<br><br>Which of the following is correct?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not.", "B": "Only conclusion (1) follows.", "C": "All three conclusions follow.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A new law required cyclists to wear helmets. In the first year after it came into force, head injuries to cyclists recorded at hospitals fell from 500 to 350, and the number of cycle journeys made in the city fell from 20 million to 14 million.\"<br><br>CONCLUSIONS:<br>(1) The law reduced the risk of head injury to a cyclist.<br>(2) Recorded head injuries fell by 30 per cent.<br>(3) Head injuries for each million journeys were the same in both years.<br><br>Which of the following is correct?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (2) and (3) follow; conclusion (1) does not.", "C": "Only conclusion (2) follows.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every appeal lodged after the twenty-eight day limit is refused without a hearing.<br>2. The appeal in the Vance matter was given a hearing.<br><br>Which conclusion FOLLOWS from these facts?", "options": {"A": "The appeal in the Vance matter was not lodged after the twenty-eight day limit.", "B": "The appeal in the Vance matter succeeded.", "C": "Every appeal lodged within the limit is given a hearing."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. The Crown Room is the only room in the courthouse fitted for a witness to give evidence from behind a screen.<br>2. A witness gave evidence from behind a screen in the courthouse on Wednesday.<br><br>Which conclusion FOLLOWS from these facts?", "options": {"A": "Every hearing in the Crown Room uses the screen.", "B": "The Crown Room is the largest room in the courthouse.", "C": "That witness gave evidence in the Crown Room."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Whenever an inspector finds a fire door blocked, the premises are re-inspected within a month.<br>2. The hotel has not been re-inspected in the four months since its last inspection.<br><br>Which conclusion FOLLOWS from these facts?", "options": {"A": "The hotel passed its last inspection in every respect.", "B": "The inspector did not find a blocked fire door at the hotel.", "C": "Premises are re-inspected within a month only when a blocked fire door is found."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every contract the authority signed this year was reviewed by its legal team.<br>2. The legal team keeps a written note of every review it carries out.<br>3. The authority signed the waste contract this year.<br><br>Which conclusion FOLLOWS from these facts?", "options": {"A": "The legal team reviewed no contract signed in an earlier year.", "B": "Every contract of which the legal team kept a written note was signed this year.", "C": "A written note was kept of the review of the waste contract."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should a jury be told about a defendant's previous convictions before it decides the charge in front of it?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Across 400 simulated trials using identical evidence, juries told of a previous conviction convicted 68 per cent of the time against 42 per cent for juries not told, and the gap held even where the earlier offence was of a wholly different kind.", "B": "Yes. Somebody who has done it before has shown what sort of person they are, and a jury has every right to know that much.", "C": "No. The courts have never done it that way in this country, and there must be some good reason behind that."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should a regulator be allowed to fine a company a share of its worldwide turnover instead of a fixed maximum sum?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. A fine that could run into billions would frighten investors away from the country altogether, and nobody wants that.", "B": "Yes. Under the fixed maximum, the largest firm penalised last year paid a sum equal to four hours of its revenue, and it committed the same breach again within eighteen months.", "C": "Yes! These companies think they can do exactly as they please, and it is high time somebody taught them a lesson."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should police be permitted to run facial recognition cameras in busy shopping streets?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No, not at the accuracy so far recorded. In the force's own six-month trial the system produced 42 matches, of which 8 were correct, and every wrong match ended with somebody being stopped in the street.", "B": "Yes. If you have nothing to hide you have nothing to fear from a camera that is only looking for people who are wanted.", "C": "No. Cameras on every corner make a country feel like a police state, and I would hate to live anywhere like that."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should a landlord be required to give six months' notice before bringing a tenancy to an end?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. It is the landlord's property, and it can never be right to tell an owner what to do with something they paid for themselves.", "B": "Yes. My aunt was told to leave in eight weeks last year and the whole family was frantic, so six months is obviously the right figure.", "C": "Yes. In a region that moved the minimum notice from two months to six, the number of households entering emergency accommodation fell by a third over two years, while the number of properties offered for rent was unchanged."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 Critical Thinking Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
