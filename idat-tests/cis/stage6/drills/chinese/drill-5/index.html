<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "CHI-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Chinese", "body": "閱讀下面的短文，然後回答問題。全部題目為選擇題，限時十五分鐘。"}, {"n": "2", "type": "mcq", "section": "Chinese", "stem": "就整體而言，作者希望市民採取怎樣的態度？<br><i>就整体而言，作者希望市民采取怎样的态度？</i>", "options": {"A": "把野豬全部遷往離島安置<br><i>把野猪全部迁往离岛安置</i>", "B": "在指定地點集中餵飼，以免牠們四處覓食<br><i>在指定地点集中喂饲，以免牠们四处觅食</i>", "C": "先捕殺傷過人的個體，再研究長遠對策<br><i>先捕杀伤过人的个体，再研究长远对策</i>", "D": "管好垃圾、停止餵飼，把問題當成城市與郊野邊界的問題來處理<br><i>管好垃圾、停止喂饲，把问题当成城市与郊野边界的问题来处理</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Chinese", "stem": "野豬何以離開山林走近民居？文中給出的主要誘因是甚麼？<br><i>野猪何以离开山林走近民居？文中给出的主要诱因是甚么？</i>", "options": {"A": "市區的氣溫比山上暖和<br><i>市区的气温比山上暖和</i>", "B": "山上食物短缺，市區卻有廚餘與人手遞上的食物<br><i>山上食物短缺，市区却有厨余与人手递上的食物</i>", "C": "山上的其他動物把牠們趕了出來<br><i>山上的其他动物把牠们赶了出来</i>", "D": "牠們天生喜歡在夜間活動<br><i>牠们天生喜欢在夜间活动</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是 改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Chinese", "stem": "作者說半馴化的狀態「最危險」，危險在哪裏？<br><i>作者说半驯化的状态「最危险」，危险在哪里？</i>", "options": {"A": "野豬失去了對人應有的距離，覓食本領也隨之退化<br><i>野猪失去了对人应有的距离，觅食本领也随之退化</i>", "B": "野豬會把疾病傳給家中飼養的寵物<br><i>野猪会把疾病传给家中饲养的宠物</i>", "C": "野豬的體形會比山上的同類大得多<br><i>野猪的体形会比山上的同类大得多</i>", "D": "野豬會學會打開所有款式的垃圾桶<br><i>野猪会学会打开所有款式的垃圾桶</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Chinese", "stem": "文題說牠們「並沒有闖進來」，這個判斷的根據是甚麼？<br><i>文题说牠们「并没有闯进来」，这个判断的根据是甚么？</i>", "options": {"A": "野豬只在市區邊緣活動，從未進入市中心<br><i>野猪只在市区边缘活动，从未进入市中心</i>", "B": "是人先把山腳的林地換成房屋街道，並且遞上食物，牠們才走近<br><i>是人先把山脚的林地换成房屋街道，并且递上食物，牠们才走近</i>", "C": "野豬的數量其實一直沒有增加<br><i>野猪的数量其实一直没有增加</i>", "D": "牠們走的仍是幾百年前的舊路<br><i>牠们走的仍是几百年前的旧路</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Chinese", "stem": "「牠們原有的棲息地被切成一塊一塊」的「棲息」，意思是甚麼？<br><i>「牠们原有的栖息地被切成一块一块」的「栖息」，意思是甚么？</i>", "options": {"A": "遷徙往來<br><i>迁徙往来</i>", "B": "覓食進食<br><i>觅食进食</i>", "C": "繁殖後代<br><i>繁殖后代</i>", "D": "停留居住<br><i>停留居住</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人 相模仿覓食的方法<br><i>动物之间互相模仿觅食的方法</i>", "C": "野生動物因長期接近人而失去野性，習慣依賴人<br><i>野生动物因长期接近人而失去野性，习惯依赖人</i>", "D": "人把野生動物送進動物園飼養<br><i>人把野生动物送进动物园饲养</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Chinese", "stem": "首段「也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴」，成語用錯了。應改為下列哪一個？<br><i>首段「也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉」，成语用错了。应改为下列哪一个？</i>", "options": {"A": "樂此不疲<br><i>乐此不疲</i>", "B": "不勝其煩<br><i>不胜其烦</i>", "C": "習以為常<br><i>习以为常</i>", "D": "無動於衷<br><i>无动于衷</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Chinese", "stem": "捕殺被形容為「一刀切的做法」，這個說法所批評的是甚麼？<br><i>捕杀被形容为「一刀切的做法」，这个说法所批评的是甚么？</i>", "options": {"A": "動作乾淨利落，不留手尾<br><i>动作干净利落，不留手尾</i>", "B": "把責任一次過交給別人<br><i>把责任一次过交给别人</i>", "C": "先訂下標準再逐一審查<br><i>先订下标准再逐一审查</i>", "D": "不分情況，一律用同一種辦法處理<br><i>不分情况，一律用同一种办法处理</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物 ，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Chinese", "stem": "就用語的準確而言，下面哪一句最站得住腳？<br><i>就用语的准确而言，下面哪一句最站得住脚？</i>", "options": {"A": "凡是野豬都會攻擊途人。<br><i>凡是野猪都会攻击途人。</i>", "B": "他看見野豬在垃圾桶旁邊吃東西的時候很開心。<br><i>他看见野猪在垃圾桶旁边吃东西的时候很开心。</i>", "C": "由於連日大雨，使山上的食物大為減少。<br><i>由于连日大雨，使山上的食物大为减少。</i>", "D": "調查顯示，傷人的個案大多與餵飼有關。<br><i>调查显示，伤人的个案大多与喂饲有关。</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大雨之後，山上的食物少得可憐，街市後巷的廚餘卻堆得滿滿，一頭懂得計算得失的動物，自然知道該往哪一邊走。更關鍵的是餵飼。野豬本來怕人，一旦有人天天在同一處遞上食物，牠們很快就把人與食物連在一起，見人不但不逃，還會主動走近討要。這種半馴化的狀態最危險：對人而言，牠們失去了應有的距離；對牠們而言，覓食的本領也一併退化，一旦沒有人餵，便只能翻垃圾。傷人的個案，十之八九出在這些已經習慣了人的野豬身上。餵飼的人往往出於好意，結果卻是親手把牠們推向險境。《列子》記海邊有人喜歡鷗鳥，每天到海上去，鷗鳥成百地飛下來與他同遊；有一天他父親叫他捉一隻回來，第二天他再到海邊，鷗鳥便只在空中盤旋，一隻也不肯落下。人一起了捉牠的念頭，鳥就知道了。這個故事說得很準：人與野生動物之間本來有一段距離，那段距離既是牠們的保障，也是我們的保障。所以真正該做的，不是舉起獵槍，而是把人這一邊的事情做好：管好垃圾，換上野豬打不開的桶；停止餵飼，並且認真執行；在牠們慣走的路上設置通道與警告；在郊野與市區之間留一條走得通的邊界。這些工夫都不好看，也上不了新聞，卻是唯一有效的辦法。《禮記》的月令篇有「毋覆巢，毋殺孩蟲」一語，古人在春天不許掏鳥巢、不許殺幼蟲，不是因為心軟，而是明白取用要有節制，日後才有可取。今天我們住在一座建在山邊的城市裏，這句話不必改動一個字：與其問怎樣把牠們趕走，不如問我們願不願意先把自己的那一份收拾乾淨。</p><p>簡体<br>入夜之后，市区边缘的几条街常有这样的画面：三两头野猪不慌不忙地走过马路，在垃圾桶旁边停下，用鼻子把桶掀翻，然后从容地吃。有人躲在远处拍照，有人拿出面包喂牠们，也有居民对翻倒了一地的垃圾不厌其烦，天天打电话投诉。每逢有人被撞伤的新闻出现，同一种主张便会冒出来：捕杀。这个办法看似干脆，却经不起推敲。野生动物的数量受食物与空间支配，捕走一批，空出来的地方很快便由别的个体填补；除非把食物来源一并切断，否则捕杀只能换来几个月的平静。何况一刀切的做法根本无法分辨哪一头曾经伤人、哪一头只是路过。要弄清楚牠们为甚么下山，先要看看山上发生了甚么。这些年来，山脚的林地一年一年退去，换上一片瓦顶与街灯；牠们原有的栖息地被切成一块一块，觅食的路线被马路截断。连日大雨之后，山上的食物少得可怜，街市后巷的厨余却堆得满满，一头懂得计算得失的动物，自然知道该往哪一边走。更关键的是喂饲。野猪本来怕人，一旦有人天天在同一处递上食物，牠们很快就把人与食物连在一起，见人不但不逃，还会主动走近讨要。这种半驯化的状态最危险：对人而言，牠们失去了应有的距离；对牠们而言，觅食的本领也一并退化，一旦没有人喂，便只能翻垃圾。伤人的个案，十之八九出在这些已经习惯了人的野猪身上。喂饲的人往往出于好意，结果却是亲手把牠们推向险境。《列子》记海边有人喜欢鸥鸟，每天到海上去，鸥鸟成百地飞下来与他同游；有一天他父亲叫他捉一只回来，第二天他再到海边，鸥鸟便只在空中盘旋，一只也不肯落下。人一起了捉牠的念头，鸟就知道了。这个故事说得很准：人与野生动物之间本来有一段距离，那段距离既是牠们的保障，也是我们的保障。所以真正该做的，不是举起猎枪，而是把人这一边的事情做好：管好垃圾，换上野猪打不开的桶；停止喂饲，并且认真执行；在牠们惯走的路上设置通道与警告；在郊野与市区之间留一条走得通的边界。这些工夫都不好看，也上不了新闻，却是唯一有效的办法。《礼记》的月令篇有「毋覆巢，毋杀孩虫」一语，古人在春天不许掏鸟巢、不许杀幼虫，不是因为心软，而是明白取用要有节制，日后才有可取。今天我们住在一座建在山边的城市里，这句话不必改动一个字：与其问怎样把牠们赶走，不如问我们愿不愿意先把自己的那一份收拾干净。</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Chinese", "stem": "以下四個判語，若按語氣由輕到重排列，排在最前的應是哪一個？<br><i>以下四个判语，若按语气由轻到重排列，排在最前的应是哪一个？</i>", "options": {"A": "大錯特錯<br><i>大错特错</i>", "B": "未必妥當<br><i>未必妥当</i>", "C": "全然荒謬<br><i>全然荒谬</i>", "D": "難以成立<br><i>难以成立</i>"}, "fig": "", "passage": "<strong>牠們並沒有闖進來<br><i>牠们并没有闯进来</i></strong><br><p>繁體<br>入夜之後，市區邊緣的幾條街常有這樣的畫面：三兩頭野豬不慌不忙地走過馬路，在垃圾桶旁邊停下，用鼻子把桶掀翻，然後從容地吃。有人躲在遠處拍照，有人拿出麵包餵牠們，也有居民對翻倒了一地的垃圾不厭其煩，天天打電話投訴。每逢有人被撞傷的新聞出現，同一種主張便會冒出來：捕殺。這個辦法看似乾脆，卻經不起推敲。野生動物的數量受食物與空間支配，捕走一批，空出來的地方很快便由別的個體填補；除非把食物來源一併切斷，否則捕殺只能換來幾個月的平靜。何況一刀切的做法根本無法分辨哪一頭曾經傷人、哪一頭只是路過。要弄清楚牠們為甚麼下山，先要看看山上發生了甚麼。這些年來，山腳的林地一年一年退去，換上一片瓦頂與街燈；牠們原有的棲息地被切成一塊一塊，覓食的路線被馬路截斷。連日大 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 Chinese Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
