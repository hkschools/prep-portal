<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "CHI-D2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Chinese", "body": "閱讀下面的短文，然後回答問題。全部題目為選擇題，限時十五分鐘。"}, {"n": "2", "type": "mcq", "section": "Chinese", "stem": "這篇文章要說明的核心現象是甚麼？<br><i>这篇文章要说明的核心现象是甚么？</i>", "options": {"A": "香港夏季氣溫連年上升的紀錄<br><i>香港夏季气温连年上升的纪录</i>", "B": "空調的耗電量為何逐年增加<br><i>空调的耗电量为何逐年增加</i>", "C": "市區綠化用地不足的歷史成因<br><i>市区绿化用地不足的历史成因</i>", "D": "市區氣溫明顯高於四周郊野的成因與紓緩辦法<br><i>市区气温明显高于四周郊野的成因与纾缓办法</i>"}, "fig": "", "passage": "<strong>城市為甚麼比郊野熱<br><i>城市为甚么比郊野热</i></strong><br><p>繁體<br>七月的傍晚，若有人從新界的郊野公園一路走回市區，會在皮膚上察覺一件觀測數據早已記下的事：同一時刻，市中心的氣溫往往比十多公里外的郊野高出三度以至五度。這種市區明顯較四周溫暖的現象，氣象學上稱為城市熱島效應。熱島的成因，先要從材料說起。混凝土、磚石與瀝青的比熱容較大，白天可以把大量太陽輻射蓄熱起來，到了夜間才緩緩放出；泥土與草地卻含有水分，水分蒸發時把熱量一併帶走，升溫既慢，降溫也快。加上深色路面的反照率低，同樣的日照之下吸收的能量遠比淺色地面為多，市區於是在日落之後仍像一塊燒過的鐵板，久久不肯冷卻。其次是形狀。市區高樓密集，街道兩旁的外牆把天空切成一條窄縫，研究者稱這種空間為都市峽谷。峽谷之內，地面向天空散熱的角度大受限制，射出去的長波輻射有一部分打在對面的牆上，再被反射回來；風也難以貫穿，帶不走積聚的熱氣。天空可見的範圍愈小，夜間降溫便愈慢，這是相當穩定的關係。第三是人為排熱。車輛的引擎、廚房的爐火、機房的伺服器，以至千家萬戶的空調，都在不停把熱量排到戶外。空調尤其值得一提：它把室內的熱抽出來丟在街上，室內愈涼，街上愈熱，街上愈熱，室內又要開得更大，於是形成一個轉不出來的循環。單靠空調降溫，不過是治標不治本。入夜以後，鐵皮與玻璃把白天吸下的熱一點一點吐回街上。白天的悶熱固然難受，真正折磨人的，是入夜之後仍然退不下去的餘溫，因為人體要在睡眠之中散熱，夜間氣溫居高不下，中暑的風險便隨之上升。要紓緩熱島，可行的辦法不外三類：一是增加綠化，二是改變表面，三是留出風道。樹木降溫並不只靠遮蔭，葉片的蒸散作用會把水分變成水汽，過程中吸走大量潛熱，一棵成年喬木在盛夏一天之內的降溫效果，相當於好幾部空調。近年政府在增加樹木覆蓋一事上首當其衝，率先在多條主要幹道補種喬木；不過種下去之後如何照料，才是成敗所繫。柳宗元寫種樹的能手，說他「其蒔也若子，其置也若棄」，栽種時細心得像照顧嬰孩，種好之後便不再擾動，任它自己長成。這句話今天讀來仍然中肯：市區的樹最常見的死因，不是無人栽種，而是栽下之後年年修剪過度、根部又被路面封死。《管子》說「一年之計，莫如樹穀；十年之計，莫如樹木；終身之計，莫如樹人」。熱島不是一年之內造成的，也不會在一年之內散去。改變路面的顏色、留出通風的走廊、把樹種下去並且養活，每一項都要以十年計。這座城市在下一代人手上會不會涼一點，答案其實藏在今年動不動手。</p><p>簡体<br>七月的傍晚，若有人从新界的郊野公园一路走回市区，会在皮肤上察觉一件观测数据早已记下的事：同一时刻，市中心的气温往往比十多公里外的郊野高出三度以至五度。这种市区明显较四周温暖的现象，气象学上称为城市热岛效应。热岛的成因，先要从材料说起。混凝土、砖石与沥青的比热容较大，白天可以把大量太阳辐射蓄热起来，到了夜间才缓缓放出；泥土与草地却含有水分，水分蒸发时把热量一并带走，升温既慢，降温也快。加上深色路面的反照率低，同样的日照之下吸收的能量远比浅色地面为多，市区于是在日落之后仍像一块烧过的铁板，久久不肯冷却。其次是形状。市区高楼密集，街道两旁的外墙把天空切成一条窄缝，研究者称这种空间为都市峡谷。峡谷之内，地面向天空散热的角度大受限制，射出去的长波辐射有一部分打在对面的墙上，再被反射回来；风也难以贯穿，带不走积聚的热气。天空可见的范围愈小，夜间降温便愈慢，这是相当稳定的关系。第三是人为排热。车辆的引擎、厨房的炉火、机房的伺服器，以至千家万户的空调，都在不停把热量排到户外。空调尤其值得一提：它把室内的热抽出来丢在街上，室内愈凉，街上愈热，街上愈热，室内又要开得更大，于是形成一个转不出来的循环。单靠空调降温，不过是治标不治本。入夜以后，铁皮与玻璃把白天吸下的热一点一点吐回街上。白天的闷热固然难受，真正折磨人的，是入夜之后仍然退不下去的余温，因为人体要在睡眠之中散热，夜间气温居高不下，中暑的风险便随之上升。要纾缓热岛，可行的办法不外三类：一是增加绿化，二是改变表面，三是留出风道。树木降温并不只靠遮荫，叶片的蒸散作用会把水分变成水汽，过程中吸走大量潜热，一棵成年乔木在盛夏一天之内的降温效果，相当于好几部空调。近年政府在增加树木覆盖一事上首当其冲，率先在多条主要干道补种乔木；不过种下去之后如何照料，才是成败所系。柳宗元写种树的能手，说他「其莳也若子，其置也若弃」，栽种时细心得像照顾婴孩，种好之后便不再扰动，任它自己长成。这句话今天读来仍然中肯：市区的树最常见的死因，不是无人栽种，而是栽下之后年年修剪过度、根部又被路面封死。《管子》说「一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人」。热岛不是一年之内造成的，也不会在一年之内散去。改变路面的颜色、留出通风的走廊、把树种下去并且养活，每一项都要以十年计。这座城市在下一代人手上会不会凉一点，答案其实藏在今年动不动手。</p>", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Chinese", "stem": "按文中所述，市區在入夜之後仍然悶熱，最直接的原因是甚麼？<br><i>按文中所述，市区在入夜之后仍然闷热，最直接的原因是甚么？</i>", "options": {"A": "夜間的風速比日間更高<br><i>夜间的风速比日间更高</i>", "B": "混凝土與瀝青白天蓄熱，到夜間才緩緩放出<br><i>混凝土与沥青白天蓄热，到夜间才缓缓放出</i>", "C": "郊野的樹木把涼風擋在市區之外<br><i>郊野的树木把凉风挡在市区之外</i>", "D": "夜間的車流量比日間更多<br><i>夜间的车流量比日间更多</i>"}, "fig": "", "passage": "<strong>城市為甚麼比郊野熱<br><i>城市为甚么比郊野热</i></strong><br><p>繁體<br>七月的傍晚，若有人從新界的郊野公園一路走回市區，會在皮膚上察覺一件觀測數據早已記下的事：同一時刻，市中心的氣溫往往比十多公里外的郊野高出三度以至五度。這種市區明顯較四周溫暖的現象，氣象學上稱為城市熱島效應。熱島的成因，先要從材料說起。混凝土、磚石與瀝青的比熱容較大，白天可以把大量太陽輻射蓄熱起來，到了夜間才緩緩放出；泥土與草地卻含有水分，水分蒸發時把熱量一併帶走，升溫既慢，降溫也快。加上深色路面的反照率低，同樣的日照之下吸收的能量遠比淺色地面為多，市區於是在日落之後仍像一塊燒過的鐵板，久久不肯冷卻。其次是形狀。市區高樓密集，街道兩旁的外牆把天空切成一條窄縫，研究者稱這種空間為都市峽谷。峽谷之內，地面向天空散熱的角度大受限制，射出去的長波輻射有一部分打在對面的牆上，再被反射回來；風也難以貫穿，帶不走積聚的熱氣。天空可見的範圍愈小，夜間降溫便愈慢，這是相當穩定的關係。第三是人為排熱。車輛的引擎、廚房的爐火、機房的伺服器，以至千家萬戶的空調，都在不停把熱量排到戶外。空調尤其值得一提：它把室內的熱抽出來丟在街上，室內愈涼，街上愈熱，街上愈熱，室內又要開得更大，於是形成一個轉不出來的循環。單靠空調降溫，不過是治標不治本。入夜以後，鐵皮與玻璃把白天吸下的熱一點一點吐回街上。白天的悶熱固然難受，真正折磨人的，是入夜之後仍然退不下去的餘溫，因為人體要在睡眠之中散熱，夜間氣溫居高不下，中暑的風險便隨之上升。要紓緩熱島，可行的辦法不外三類：一是增加綠化，二是改變表面，三是留出風道。樹木降溫並不只靠遮蔭，葉片的蒸散作用會把水分變成水汽，過程中吸走大量潛熱，一棵成年喬木在盛夏一天之內的降溫效果，相當於好幾部空調。近年政府在增加樹木覆蓋一事上首當其衝，率先在多條主要幹道補種喬木；不過種下去之後如何照料，才是成敗所繫。柳宗元寫種樹的能手，說他「其蒔也若子，其置也若棄」，栽種時細心得像照顧嬰孩，種好之後便不再擾動，任它自己長成。這句話今天讀來仍然中肯：市區的樹最常見的死因，不是無人栽種，而是栽下之後年年修剪過度、根部又被路面封死。《管子》說「一年之計，莫如樹穀；十年之計，莫如樹木；終身之計，莫如樹人」。熱島不是一年之內造成的，也不會在一年之內散去。改變路面的顏色、留出通風的走廊、把樹種下去並且養活，每一項都要以十年計。這座城市在下一代人手上會不會涼一點，答案其實藏在今年動不動手。</p><p>簡体<br>七月的傍晚，若有人从新界的郊野公园一路走回市区，会在皮肤上察觉一件观测数据早已记下的事：同一时刻，市中心的气温往往比十多公里外 树的能手，说他「其莳也若子，其置也若弃」，栽种时细心得像照顾婴孩，种好之后便不再扰动，任它自己长成。这句话今天读来仍然中肯：市区的树最常见的死因，不是无人栽种，而是栽下之后年年修剪过度、根部又被路面封死。《管子》说「一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人」。热岛不是一年之内造成的，也不会在一年之内散去。改变路面的颜色、留出通风的走廊、把树种下去并且养活，每一项都要以十年计。这座城市在下一代人手上会不会凉一点，答案其实藏在今年动不动手。</p>", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Chinese", "stem": "文中說綠化可以「紓緩」熱島，這個詞的意思是甚麼？<br><i>文中说绿化可以「纾缓」热岛，这个词的意思是甚么？</i>", "options": {"A": "使變化來得更快<br><i>使变化来得更快</i>", "B": "把問題掩飾過去<br><i>把问题掩饰过去</i>", "C": "使程度減輕、緩和下來<br><i>使程度减轻、缓和下来</i>", "D": "把成因徹底消除<br><i>把成因彻底消除</i>"}, "fig": "", "passage": "<strong>城市為甚麼比郊野熱<br><i>城市为甚么比郊野热</i></strong><br><p>繁體<br>七月的傍晚，若有人從新界的郊野公園一路走回市區，會在皮膚上察覺一件觀測數據早已記下的事：同一時刻，市中心的氣溫往往比十多公里外的郊野高出三度以至五度。這種市區明顯較四周溫暖的現象，氣象學上稱為城市熱島效應。熱島的成因，先要從材料說起。混凝土、磚石與瀝青的比熱容較大，白天可以把大量太陽輻射蓄熱起來，到了夜間才緩緩放出；泥土與草地卻含有水分，水分蒸發時把熱量一併帶走，升溫既慢，降溫也快。加上深色路面的反照率低，同樣的日照之下吸收的能量遠比淺色地面為多，市區於是在日落之後仍像一塊燒過的鐵板，久久不肯冷卻。其次是形狀。市區高樓密集，街道兩旁的外牆把天空切成一條窄縫，研究者稱這種空間為都市峽谷。峽谷之內，地面向天空散熱的角度大受限制，射出去的長波輻射有一部分打在對面的牆上，再被反射回來；風也難以貫穿，帶不走積聚的熱氣。天空可見的範圍愈小，夜間降溫便愈慢，這是相當穩定的關係。第三是人為排熱。車輛的引擎、廚房的爐火、機房的伺服器，以至千家萬戶的空調，都在不停把熱量排到戶外。空調尤其值得一提：它把室內的熱抽出來丟在街上，室內愈涼，街上愈熱，街上愈熱，室內又要開得更大，於是形成一個轉不出來的循環。單靠空調降溫，不過是治標不治本。入夜以後，鐵皮與玻璃把白天吸下的熱一點一點吐回街上。白天的悶熱固然難受，真正折磨人的，是入夜之後仍然退不下去的餘溫，因為人體要在睡眠之中散熱，夜間氣溫居高不下，中暑的風險便隨之上升。要紓緩熱島，可行的辦法不外三類：一是增加綠化，二是改變表面，三是留出風道。樹木降溫並不只靠遮蔭，葉片的蒸散作用會把水分變成水汽，過程中吸走大量潛熱，一棵成年喬木在盛夏一天之內的降溫效果，相當於好幾部空調。近年政府在增加樹木覆蓋一事上首當其衝，率先在多條主要幹道補種喬木；不過種下去之後如何照料，才是成敗所繫。柳宗元寫種樹的能手，說他「其蒔也若子，其置也若棄」，栽種時細心得像照顧嬰孩，種好之後便不再擾動，任它自己長成。這句話今天讀來仍然中肯：市區的樹最常見的死因，不是無人栽種，而是栽下之後年年修剪過度、根部又被路面封死。《管子》說「一年之計，莫如樹穀；十年之計，莫如樹木；終身之計，莫如樹人」。熱島不是一年之內造成的，也不會在一年之內散去。改變路面的顏色、留出通風的走廊、把樹種下去並且養活，每一項都要以十年計。這座城市在下一代人手上會不會涼一點，答案其實藏在今年動不動手。</p><p>簡体<br>七月的傍晚，若有人从新界的郊野公园一路走回市区，会在皮肤上察觉一件观测数据早已记下的事：同一时刻，市中心的气温往往比十多公里外的郊野高出三度以至五度。这种市区明显较四周温暖的现象，气象学上称为城市热岛效应。热岛的成因，先要从材料说起。混凝土、砖石与沥青的比热容较大，白天可以把大量太阳辐射蓄热起来，到了夜间才缓缓放出；泥土与草地却含有水分，水分蒸发时把热量一并带走，升温既慢，降温也快。加上深色路面的反照率低，同样的日照之下吸收的能量远比浅色地面为多，市区于是在日落之后仍像一块烧过的铁板，久久不肯冷却。其次是形状。市区高楼密集，街道两旁的外墙把天空切成一条窄缝，研究者称这种空间为都市峡谷。峡谷之内，地面向天空散热的角度大受限制，射出去的长波辐射有一部分打在对面的墙上，再被反射回来；风也难以贯穿，带不走积聚的热气。天空可见的范围愈小，夜间降温便愈慢，这是相当稳定的关系。第三是人为排热。车辆的引擎、厨房的炉火、机房的伺服器，以至千家万户的空调，都在不停把热量排到户外。空调尤其值得一提：它把室内的热抽出来丢在街上，室内愈凉，街上愈热，街上愈热，室内又要开得更大，于是形成一个转不出来的循环。单靠空调降温，不过是治标不治本。入夜以后，铁皮与玻璃把白天吸下的热一点一点吐回街上。白天的闷热固然难受，真正折磨人的，是入夜之后仍然退不下去的余温，因为人体要在睡眠之中散热，夜间气温居高不下，中暑的风险便随之上升。要纾缓热岛，可行的办法不外三类：一是增加绿化，二是改变表面，三是留出风道。树木降温并不只靠遮荫，叶片的蒸散作用会把水分变成水汽，过程中吸走大量潜热，一棵成年乔木在盛夏一天之内的降温效果，相当于好几部空调。近年政府在增加树木覆盖一事上首当其冲，率先在多条主要干道补种乔木；不过种下去之后如何照料，才是成败所系。柳宗元写种树的能手，说他「其莳也若子，其置也若弃」，栽种时细心得像照顾婴孩，种好之后便不再扰动，任它自己长成。这句话今天读来仍然中肯：市区的树最常见的死因，不是无人栽种，而是栽下之后年年修剪过度、根部又被路面封死。《管子》说「一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人」。热岛不是一年之内造成的，也不会在一年之内散去。改变路面的颜色、留出通风的走廊、把树种下去并且养活，每一项都要以十年计。这座城市在下一代人手上会不会凉一点，答案其实藏在今年动不动手。</p>", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Chinese", "stem": "第二段的「蓄熱」，指的是甚麼？<br><i>第二段的「蓄热」，指的是甚么？</i>", "options": {"A": "把熱量迅速排到空氣中<br><i>把热量迅速排到空气中</i>", "B": "使各處的溫度趨於平均<br><i>使各处的温度趋于平均</i>", "C": "把熱量轉換成電力<br><i>把热量转换成电力</i>", "D": "把熱量儲存起來，日後再慢慢放出<br><i>把热量储存起来，日后再慢慢放出</i>"}, "fig": "", "passage": "<strong>城市為甚麼比郊野熱<br><i>城市为甚么比郊野热</i></strong><br><p>繁體<br>七月的傍晚，若有人從新界的郊野公園一路走回市區，會在皮膚上察覺一件觀測數據早已記下的事：同一時刻，市中心的氣溫往往比十多公里外的郊野高出三度以至五度。這種市區明顯較四周溫暖的現象，氣象學上稱為城市熱島效應。熱島的成因，先要從材料說起。混凝土、磚石與瀝青的比熱容較大，白天可以把大量太陽輻射蓄熱起來，到了夜間才緩緩放出；泥土與草地卻含有水分，水分蒸發時把熱量一併帶走，升溫既慢，降溫也快。加上深色路面的反照率低，同樣的日照之下吸收的能量遠比淺色地面為多，市區於是在日落之後仍像一塊燒過的鐵板，久久不肯冷卻。其次是形狀。市區高樓密集，街道兩旁的外牆把天空切成一條窄縫，研究者稱這種空間為都市峽谷。峽谷之內，地面向天空散熱的角度大受限制，射出去的長波輻射有一部分打在對面的牆上，再被反射回來；風也難以貫穿，帶不走積聚的熱氣。天空可見的範圍愈小，夜間降溫便愈慢，這是相當穩定的關係。第三是人為排熱。車輛的引擎、廚房的爐火、機房的伺服器，以至千家萬戶的空調，都在不停把熱量排到戶外。空調尤其值得一提：它把室內的熱抽出來丟在街上，室內愈涼，街上愈熱，街上愈熱，室內又要開得更大，於是形成一個轉不出來的循環。單靠空調降溫，不過是治標不治本。入夜以後，鐵皮與玻璃把白天吸下的熱一點一點吐回街上。白天的悶熱固然難受，真正折磨人的，是入夜之後仍然退不下去的餘溫，因為人體要在睡眠之中散熱，夜間氣溫居高不下，中暑的風險便隨之上升。要紓緩熱島，可行的辦法不外三類：一是增加綠化，二是改變表面，三是留出風道。樹木降溫並不只靠遮蔭，葉片的蒸散作用會把水分變成水汽，過程中吸走大量潛熱，一棵成年喬木在盛夏一天之內的降溫效果，相當於好幾部空調。近年政府在增加樹木覆蓋一事上首當其衝，率先在多條主要幹道補種喬木；不過種下去之後如何照料，才是成敗所繫。柳宗元寫種樹的能手，說他「其蒔也若子，其置也若棄」，栽種時細心得像照顧嬰孩，種好之後便不再擾動，任它自己長成。這句話今天讀來仍然中肯：市區的樹最常見的死因，不是無人栽種，而是栽下之後年年修剪過度、根部又被路面封死。《管子》說「一年之計，莫如樹穀；十年之計，莫如樹木；終身之計，莫如樹人」。熱島不是一年之內造成的，也不會在一年之內散去。改變路面的顏色、留出通風的走廊、把樹種下去並且養活，每一項都要以十年計。這座城市在下一代人手上會不會涼一點，答案其實藏在今年動不動手。</p><p>簡体<br>七月的傍晚，若有人 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 Chinese Drill 2</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
