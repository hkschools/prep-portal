  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}

  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "CHI-D3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Chinese", "body": "閱讀下面的短文，然後回答問題。全部題目為選擇題，限時十五分鐘。"}, {"n": "2", "type": "mcq", "section": "Chinese", "stem": "作者通篇要維護的主張是甚麼？<br><i>作者通篇要维护的主张是甚么？</i>", "options": {"A": "共同語與方言可以並存，要緊的是讓方言在生活中仍有用武之地<br><i>共同语与方言可以并存，要紧的是让方言在生活中仍有用武之地</i>", "B": "應立法規定所有學校以方言授課<br><i>应立法规定所有学校以方言授课</i>", "C": "共同語的推行是語言消亡的唯一原因<br><i>共同语的推行是语言消亡的唯一原因</i>", "D": "語言既然是工具，用的人少了便該任它退場<br><i>语言既然是工具，用的人少了便该任它退场</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Chinese", "stem": "主張「不必大驚小怪」的一方，提出了哪些理由？<br><i>主张「不必大惊小怪」的一方，提出了哪些理由？</i>", "options": {"A": "方言的語法比共同語混亂，不便書寫<br><i>方言的语法比共同语混乱，不便书写</i>", "B": "方言的使用者大多不願意子女學習<br><i>方言的使用者大多不愿意子女学习</i>", "C": "共用一種語言可以降低溝通成本，方便教育、行政與流動<br><i>共用一种语言可以降低沟通成本，方便教育、行政与流动</i>", "D": "錄音技術已經足以把方言完整保存下來<br><i>录音技术已经足以把方言完整保存下来</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Chinese", "stem": "作者怎樣回應「語言只是工具」這個說法？<br><i>作者怎样回应「语言只是工具」这个说法？</i>", "options": {"A": "指出工具論在邏輯上自相矛盾<br><i>指出工具论在逻辑上自相矛盾</i>", "B": "指出方言的使用人數其實正在回升<br><i>指出方言的使用人数其实正在回升</i>", "C": "承認說得對，因此改為主張統一語言<br><i>承认说得对，因此改为主张统一语言</i>", "D": "承認語言是工具，但強調它同時承載記憶與思考的方式<br><i>承认语言是工具，但强调它同时承载记忆与思考的方式</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Chinese", "stem": "作者為甚麼對「錄音存檔便算保存」的做法有保留？<br><i>作者为甚么对「录音存档便算保存」的做法有保留？</i>", "options": {"A": "錄音的成本太高，難以持續<br><i>录音的成本太高，难以持续</i>", "B": "錄音只是標本，不能代替一種話在生活裏繼續被人使用<br><i>录音只是标本，不能代替一种话在生活里继续被人使用</i>", "C": "老人的口述往往記錯，不足為據<br><i>老人的口述往往记错，不足为据</i>", "D": "字幕會令聽者不再留心語音<br><i>字幕会令听者不再留心语音</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Chinese", "stem": "文末說祖母的話「不是自然消失的」，這句話的用意是甚麼？<br><i>文末说祖母的话「不是自然消失的」，这句话的用意是甚么？</i>", "options": {"A": "說明祖母其實仍能與人交談<br><i>说明祖母其实仍能与人交谈</i>", "B": "說明方言消失的速度比統計所說的更慢<br><i>说明方言消失的速度比统计所说的更慢</i>", "C": "責備家人沒有替祖母錄音留底<br><i>责备家人没有替祖母录音留底</i>", "D": "點出語言的退場是一次次選擇的結果，並非無可避免的自然現象<br><i>点出语言的退场是一次次选择的结果，并非无可避免的自然现象</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Chinese", "stem": "「用的人少了自然式微」的「式微」，意思最接近下列哪一項？<br><i>「用的人少了自然式微」的「式微」，意思最接近下列哪一项？</i>", "options": {"A": "重新興盛<br><i>重新兴盛</i>", "B": "衰落、由盛轉衰<br><i>衰落、由盛转衰</i>", "C": "形式簡單<br><i>形式简单</i>", "D": "微不足道<br><i>微不足道</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Chinese", "stem": "作者說一種話是「一套記憶的載體」，「載體」在句中指的是甚麼？<br><i>作者说一种话是「一套记忆的载体」，「载体」在句中指的是甚么？</i>", "options": {"A": "承載並傳遞某些內容的東西<br><i>承载并传递某些内容的东西</i>", "B": "運送貨物的車輛<br><i>运送货物的车辆</i>", "C": "體積龐大的物件<br><i>体积庞大的物件</i>", "D": "記錄年份的簿冊<br><i>记录年份的簿册</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Chinese", "stem": "首段「近年方言保育成為炙手可熱的話題」，成語用得並不恰當，原因是甚麼？<br><i>首段「近年方言保育成为炙手可热的话题」，成语用得并不恰当，原因是甚么？</i>", "options": {"A": "「炙手可熱」只能用來形容天氣<br><i>「炙手可热」只能用来形容天气</i>", "B": "「炙手可熱」是褒義詞，不宜用於學術題目<br><i>「炙手可热」是褒义词，不宜用于学术题目</i>", "C": "「炙手可熱」形容權勢極盛、氣燄迫人，不能拿來說一個題目受歡迎<br><i>「炙手可热」形容权势极盛、气燄迫人，不能拿来说一个题目受欢迎</i>", "D": "「炙手可熱」必須與數字連用<br><i>「炙手可热」必须与数字连用</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Chinese", "stem": "反對一方說「語言本來就是約定俗成的」，這四個字指的是甚麼？<br><i>反对一方说「语言本来就是约定俗成的」，这四个字指的是甚么？</i>", "options": {"A": "由官方訂立條文並公布施行<br><i>由官方订立条文并公布施行</i>", "B": "經眾人長期沿用而自然形成，並非誰人規定<br><i>经众人长期沿用而自然形成，并非谁人规定</i>", "C": "先與人立下約定，日後再作修改<br><i>先与人立下约定，日后再作修改</i>", "D": "風俗一旦形成便不可更改<br><i>风俗一旦形成便不可更改</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Chinese", "stem": "「先是不在課堂上說，再是不在街上說，最後連家裏也不說了」，這樣的寫法屬於哪一種手法？<br><i>「先是不在课堂上说，再是不在街上说，最后连家里也不说了」，这样的写法属于哪一种手法？</i>", "options": {"A": "層遞<br><i>层递</i>", "B": "借代<br><i>借代</i>", "C": "誇張<br><i>夸张</i>", "D": "反問<br><i>反问</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Chinese", "stem": "「博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄」憑甚麼手法收到警醒的效果？<br><i>「博物馆里的录音愈齐全，街上的活人声音就愈稀薄」凭甚么手法收到警醒的效果？</i>", "options": {"A": "設問<br><i>设问</i>", "B": "擬人<br><i>拟人</i>", "C": "排比<br><i>排比</i>", "D": "映襯<br><i>映衬</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Chinese", "stem": "「通過這次訪問，使我們了解到方言在日常生活中的處境。」這句話有語病，下列哪一項修改最恰當？<br><i>「通过这次访问，使我们了解到方言在日常生活中的处境。」这句话有语病，下列哪一项修改最恰当？</i>", "options": {"A": "把「通過」改為「經過」<br><i>把「通过」改为「经过」</i>", "B": "刪去「使」字<br><i>删去「使」字</i>", "C": "把「了解」改為「明白」<br><i>把「了解」改为「明白」</i>", "D": "在句末加上「的原因」<br><i>在句末加上「的原因」</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Chinese", "stem": "作者說自己對那種保育方式「有保留」。下列四種說法之中，哪一個語氣最重？<br><i>作者说自己对那种保育方式「有保留」。下列四种说法之中，哪一个语气最重？</i>", "options": {"A": "斷然反對<br><i>断然反对</i>", "B": "未敢苟同<br><i>未敢苟同</i>", "C": "不無疑慮<br><i>不无疑虑</i>", "D": "有保留<br><i>有保留</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Chinese", "stem": "《論語》「子所雅言，詩、書、執禮，皆雅言也」一句，作者引來說明甚麼？<br><i>《论语》「子所雅言，诗、书、执礼，皆雅言也」一句，作者引来说明甚么？</i>", "options": {"A": "孔子認為方音粗鄙，終生不用<br><i>孔子认为方音粗鄙，终生不用</i>", "B": "孔子主張把各地方言統一為一種<br><i>孔子主张把各地方言统一为一种</i>", "C": "孔子平日說方音，只在讀經行禮時改用共同語，可見兩者早已按場合並用<br><i>孔子平日说方音，只在读经行礼时改用共同语，可见两者早已按场合并用</i>", "D": "詩、書兩部經典都是用方言寫成的<br><i>诗、书两部经典都是用方言写成的</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br><p>繁體<br>有一項統計常被引用：全世界約七千種語言，本世紀之內大概有一半會停止使用。數字聽來遙遠，落到一個家庭身上卻十分具體：祖母說的那種話，父親聽得懂而說不流利，到了孫兒一輩，連聽也吃力。近年方言保育成為炙手可熱的話題，我卻覺得，熱鬧之中最少人肯認真回答的，是一個很簡單的問題：一種話消失之後，我們究竟失去了甚麼。主張不必大驚小怪的人，理由並不薄弱。語言首先是工具，工具就有高下之分。一個社會共用一種語言，溝通成本低，教育與行政都好辦，年輕人流動起來也方便；方言愈多，隔閡愈多，這在歷史上並非沒有教訓。他們還會補上一句：語言本來就是約定俗成的，用的人少了自然式微，強行挽留反而不自然。這番話有它的道理，可惜只說對了一半。語言確是工具，卻不只是工具。一種話同時是一套記憶的載體：某地的漁民能一口叫出二十多種魚的名字，其中大半在共同語裏並沒有對應的詞；某些農事、節慶與親屬稱謂，一經翻譯就走了樣。話沒有了，那些分辨也跟着沒有了。更要緊的是，語言還牽動思考的方式，同一件事用不同的話說出來，着重的地方往往不同。所以一種語言死去，並不等於一個譯本失傳，而更像一種看世界的角度被關上。《論語》記孔子「子所雅言，詩、書、執禮，皆雅言也」，可見他平日說的是魯地的方音，只在誦讀經典與行禮這些場合改用當時的共同語。這一筆很值得玩味：兩千多年前的人已經懂得按場合換一種話說，共同語與地方話從來不是勢不兩立的。《禮記》也說「五方之民，言語不通，嗜欲不同」，古人視語言分歧為常態，所想的是設官通譯，而不是把它抹平。我因此對一種常見的保育方式有保留：把老人的口述錄下來，存進資料庫，配上字幕，然後宣布方言已經保存。錄音當然要做，但那是標本，不是生命。博物館裏的錄音愈齊全，街上的活人聲音就愈稀薄，這件事並不值得慶祝。真正的保存，是讓那種話仍然有用武之地。一種話的退場往往有跡可循：先是不在課堂上說，再是不在街上說，最後連家裏也不說了。反過來，要它活下去，也就是把這幾步倒着走回去：家裏肯說，鄰里之間肯說，學校肯留一個位置給它，媒體肯讓它出聲。這並不需要犧牲共同語。世界上多的是兩種話都說得好的社會，關鍵只在於有沒有人覺得那種話值得說。祖母的那種話，我大概是家中最後一個聽得懂的人。我沒有把握把它傳下去，但至少可以不騙自己：它不是自然消失的，它是被一次又一次的「還是說回大家都懂的話吧」勸退的。</p><p>簡体<br>有一项统计常被引用：全世界约七千种语言，本世纪之内大概有一半会停止使用。数字听来遥远，落到一个家庭身上却十分具体：祖母说的那种话，父亲听得懂而说不流利，到了孙儿一辈，连听也吃力。近年方言保育成为炙手可热的话题，我却觉得，热闹之中最少人肯认真回答的，是一个很简单的问题：一种话消失之后，我们究竟失去了甚么。主张不必大惊小怪的人，理由并不薄弱。语言首先是工具，工具就有高下之分。一个社会共用一种语言，沟通成本低，教育与行政都好办，年轻人流动起来也方便；方言愈多，隔阂愈多，这在历史上并非没有教训。他们还会补上一句：语言本来就是约定俗成的，用的人少了自然式微，强行挽留反而不自然。这番话有它的道理，可惜只说对了一半。语言确是工具，却不只是工具。一种话同时是一套记忆的载体：某地的渔民能一口叫出二十多种鱼的名字，其中大半在共同语里并没有对应的词；某些农事、节庆与亲属称谓，一经翻译就走了样。话没有了，那些分辨也跟着没有了。更要紧的是，语言还牵动思考的方式，同一件事用不同的话说出来，着重的地方往往不同。所以一种语言死去，并不等于一个译本失传，而更像一种看世界的角度被关上。《论语》记孔子「子所雅言，诗、书、执礼，皆雅言也」，可见他平日说的是鲁地的方音，只在诵读经典与行礼这些场合改用当时的共同语。这一笔很值得玩味：两千多年前的人已经懂得按场合换一种话说，共同语与地方话从来不是势不两立的。《礼记》也说「五方之民，言语不通，嗜欲不同」，古人视语言分歧为常态，所想的是设官通译，而不是把它抹平。我因此对一种常见的保育方式有保留：把老人的口述录下来，存进资料库，配上字幕，然后宣布方言已经保存。录音当然要做，但那是标本，不是生命。博物馆里的录音愈齐全，街上的活人声音就愈稀薄，这件事并不值得庆祝。真正的保存，是让那种话仍然有用武之地。一种话的退场往往有迹可循：先是不在课堂上说，再是不在街上说，最后连家里也不说了。反过来，要它活下去，也就是把这几步倒着走回去：家里肯说，邻里之间肯说，学校肯留一个位置给它，媒体肯让它出声。这并不需要牺牲共同语。世界上多的是两种话都说得好的社会，关键只在于有没有人觉得那种话值得说。祖母的那种话，我大概是家中最后一个听得懂的人。我没有把握把它传下去，但至少可以不骗自己：它不是自然消失的，它是被一次又一次的「还是说回大家都懂的话吧」劝退的。</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Chinese", "stem": "《禮記》「五方之民，言語不通，嗜欲不同」，古人由此得出的做法是甚麼？<br><i>《礼记》「五方之民，言语不通，嗜欲不同」，古人由此得出的做法是甚么？</i>", "options": {"A": "遷徙人口，使五方之民雜居<br><i>迁徙人口，使五方之民杂居</i>", "B": "禁止各地使用自己的語言<br><i>禁止各地使用自己的语言</i>", "C": "要求各地自行編寫字典<br><i>要求各地自行编写字典</i>", "D": "設官通譯，讓不同的語言各自存在而又能互通<br><i>设官通译，让不同的语言各自存在而又能互通</i>"}, "fig": "", "passage": "<strong>一種話消失之後<br><i>一种话消失之后</i></strong><br>< let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 Chinese Drill 3</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
