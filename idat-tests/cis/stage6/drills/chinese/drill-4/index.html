<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}

  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "CHI-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Chinese", "body": "閱讀下面的短文，然後回答問題。全部題目為選擇題，限時十五分鐘。"}, {"n": "2", "type": "mcq", "section": "Chinese", "stem": "文章結尾所歸結的立場，最貼近下列哪一項？<br><i>文章结尾所归结的立场，最贴近下列哪一项？</i>", "options": {"A": "網絡上的一切批評都應該立即禁止<br><i>网络上的一切批评都应该立即禁止</i>", "B": "批評應與過失相稱、止於當事人，並在對方改正之後懂得停下來<br><i>批评应与过失相称、止于当事人，并在对方改正之后懂得停下来</i>", "C": "犯錯的人無論如何都應獲得原諒<br><i>犯错的人无论如何都应获得原谅</i>", "D": "只有法庭才有資格評論任何人的過失<br><i>只有法庭才有资格评论任何人的过失</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不打算為網絡批評一概說項。它確實有它的作用：一個人若身處高位而行事不當，從前受害者投訴無門，如今至少有機會被聽見；不少長期被掩蓋的事，正是靠網絡上的追問才翻出來的。把這種力量整個拆掉，受損的往往是最沒有辦法的一群。問題不在批評本身，而在於三件事：懲罰有沒有止境、對象有沒有分寸、出路有沒有留下。先說止境。法庭的判刑有刑期，網絡的判刑卻沒有。一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人，愈燒愈遠，早已與最初那件事無關。最後說出路。孔子說「過而不改，是謂過矣」，可見古人看重的並不是有沒有犯過錯，而是肯不肯改；犯了錯而肯改，這件事本身便值得記上一筆。今天的網絡卻常常把話說死：無論怎樣道歉、賠償、改正，那段截圖仍在，於是犯錯的人索性甚麼也不做，反正做甚麼都沒有分別。一種讓人無法回頭的做法，最後只會養出更多不肯認錯的人。《尚書》有一句「與人不求備，檢身若不及」，說的是對別人不必求全責備，對自己卻要像追趕不上似的常常反省。這兩句話今天讀來，簡直像是特意寫給網絡的：我們對陌生人的要求，往往比對自己嚴苛得多。所以我主張的並不是沉默，而是分寸：批評的力度應與過失相稱，追究的範圍應止於當事人，而在他確實改正之後，我們也應當有停下來的能力。得饒人處且饒人，這句老話不是叫人縱容，而是提醒我們，今天握着鍵盤的人，明天也可能是被搜出來的那一個。</p><p>簡体<br>曾几何时，网络被视为一个人人都有机会说话的地方；今天打开任何一个社交网站，最先看见的却多半是一场正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠网络上的追问才翻出来的。把这种力量整个拆掉，受损的往往是最没有办法的一群。问题不在批评本身，而在于三件事：惩罚有没有止境、对象有没有分寸、出路有没有留下。先说止境。法庭的判刑有刑期，网络的判刑却没有。一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年：求职时被搜出来，结交新朋友时被翻出来，换了一座城市仍旧跟着。过失或许只是一时失言，代价却按终身计算，这样的惩罚与过失并不相称。再说分寸。一个人做错事，该承担的应该是他自己。可是现在的做法往往是：先骂当事人，再打电话到他的公司，然后找上他的父母与子女。一件事由当事人扩散到雇主，由雇主扩散到家人，由家人扩散到与他同姓的陌生人，愈烧愈远，早已与最初那件事无关。最后说出路。孔子说「过而不改，是谓过矣」，可见古人看重的并不是有没有犯过错，而是肯不肯改；犯了错而肯改，这件事本身便值得记上一笔。今天的网络却常常把话说死：无论怎样道歉、赔偿、改正，那段截图仍在，于是犯错的人索性甚么也不做，反正做甚么都没有分别。一种让人无法回头的做法，最后只会养出更多不肯认错的人。《尚书》有一句「与人不求备，检身若不及」，说的是对别人不必求全责备，对自己却要像追赶不上似的常常反省。这两句话今天读来，简直像是特意写给网络的：我们对陌生人的要求，往往比对自己严苛得多。所以我主张的并不是沉默，而是分寸：批评的力度应与过失相称，追究的范围应止于当事人，而在他确实改正之后，我们也应当有停下来的能力。得饶人处且饶人，这句老话不是叫人纵容，而是提醒我们，今天握着键盘的人，明天也可能是被搜出来的那一个。</p>", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Chinese", "stem": "作者承認網絡批評有哪一項作用？<br><i>作者承认网络批评有哪一项作用？</i>", "options": {"A": "令從前投訴無門的受害者有機會被聽見，把被掩蓋的事翻出來<br><i>令从前投诉无门的受害者有机会被听见，把被掩盖的事翻出来</i>", "B": "令法庭的判刑變得更快更重<br><i>令法庭的判刑变得更快更重</i>", "C": "令僱主更容易查核求職者的品行<br><i>令雇主更容易查核求职者的品行</i>", "D": "令傳媒的報道成本大為下降<br><i>令传媒的报道成本大为下降</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不打算為網絡批評一概說項。它確實有它的作用：一個人若身處高位而行事不當，從前受害者投訴無門，如今至少有機會被聽見；不少長期被掩蓋的事，正是靠網絡上的追問才翻出來的。把這種力量整個拆掉，受損的往往是最沒有辦法的一群。問題不在批評本身，而在於三件事：懲罰有沒有止境、對象有沒有分寸、出路有沒有留下。先說止境。法庭的判刑有刑期，網絡的判刑卻沒有。一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人，愈燒愈遠，早已與最初那件事無關。最後說出路。孔子說「過而不改，是謂過矣」，可見古人看重的並不是有沒有犯過錯，而是肯不肯改；犯了錯而肯改，這件事本身便值得記上一筆。今天的網絡卻常常把話說死：無論怎樣道歉、賠償、改正，那段截圖仍在，於是犯錯的人索性甚麼也不做，反正做甚麼都沒有分別。一種讓人無法回頭的做法，最後只會養出更多不肯認錯的人。《尚書》有一句「與人不求備，檢身若不及」，說的是對別人不必求全責備，對自己卻要像追趕不上似的常常反省。這兩句話今天讀來，簡直像是特意寫給網絡的：我們對陌生人的要求，往往比對自己嚴苛得多。所以我主張的並不是沉默，而是分寸：批評的力度應與過失相稱，追究的範圍應止於當事人，而在他確實改正之後，我們也應當有停下來的能力。得饒人處且饒人，這句老話不是叫人縱容，而是提醒我們，今天握着鍵盤的人，明天也可能是被搜出來的那一個。</p><p>簡体<br>曾几何时，网络被视为一个人人都有机会说话的地方；今天打开任何一个社交网站，最先看见的却多半是一场正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠网络上的追问才翻出来的。把这种力量整个拆掉，受损的往往是最没有办法的一群。问题不在批评本身，而在于三件事：惩罚有没有止境、对象有没有分寸、出路有没有留下。先说止境。法庭的判刑有刑期，网络的判刑却没有。一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年：求职时被搜出来，结交新朋友时被翻出来，换了一座城市仍旧跟着。过失或许只是一时失言，代价却按终身计算，这样的惩罚与过失并不相称。再说分寸。一个人做错事，该承担的应该是他自己。可是现在的做法往往是：先骂当事人，再打电话到他的公司，然后找上他的父母与子女。一件事由当事人扩散到雇主，由雇主扩散到家人，由家人扩散到与他同姓的陌生人，愈烧愈远，早已与最初那件事无关。最后说出路。孔子说「过而不改，是谓过矣」，可见古人看重的并不是有没有犯过错，而是肯不肯改；犯了错而肯改，这件事本身便值得记上一笔。今天的网络却常常把话说死：无论怎样道歉、赔偿、改正，那段截图仍在，于是犯错的人索性甚么也不做，反正做甚么都没有分别。一种让人无法回头的做法，最后只会养出更多不肯认错的人。《尚书》有一句「与人不求备，检身若不及」，说的是对别人不必求全责备，对自己却要像追赶不上似的常常反省。这两句话今天读来，简直像是特意写给网络的：我们对陌生人的要求，往往比对自己严苛得多。所以我主张的并不是沉默，而是分寸：批评的力度应与过失相称，追究的范围应止于当事人，而在他确实改正之后，我们也应当有停下来的能力。得饶人处且饶人，这句老话不是叫人纵容，而是提醒我们，今天握着键盘的人，明天也可能是被搜出来的那一个。</p>", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Chinese", "stem": "「一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年」，這句話要指出甚麼？<br><i>「一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年」，这句话要指出甚么？</i>", "options": {"A": "網民的記性其實很差<br><i>网民的记性其实很差</i>", "B": "道歉的方式應該改為書面<br><i>道歉的方式应该改为书面</i>", "C": "補救轉眼被人忘記，懲罰卻近乎終身，兩者並不相稱<br><i>补救转眼被人忘记，惩罚却近乎终身，两者并不相称</i>", "D": "截圖的畫質比文字更容易保存<br><i>截图的画质比文字更容易保存</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不打算為網絡批評一概說項。它確實有它的作用：一個人若身處高位而行事不當，從前受害者投訴無門，如今至少有機會被聽見；不少長期被掩蓋的事，正是靠網絡上的追問才翻出來的。把這種力量整個拆掉，受損的往往是最沒有辦法的一群。問題不在批評本身，而在於三件事：懲罰有沒有止境、對象有沒有分寸、出路有沒有留下。先說止境。法庭的判刑有刑期，網絡的判刑卻沒有。一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人，愈燒愈遠，早已與最初那件事無關。最後說出路。孔子說「過而不改，是謂過矣」，可見古人看重的並不是有沒有犯過錯，而是肯不肯改；犯了錯而肯改，這件事本身便值得記上一筆。今天的網絡卻常常把話說死：無論怎樣道歉、賠償、改正，那段截圖仍在，於是犯錯的人索性甚麼也不做，反正做甚麼都沒有分別。一種讓人無法回頭的做法，最後只會養出更多不肯認錯的人。《尚書》有一句「與人不求備，檢身若不及」，說的是對別人不必求全責備，對自己卻要像追趕不上似的常常反省。這兩句話今天讀來，簡直像是特意寫給網絡的：我們對陌生人的要求，往往比對自己嚴苛得多。所以我主張的並不是沉默，而是分寸：批評的力度應與過失相稱，追究的範圍應止於當事人，而在他確實改正之後，我們也應當有停下來的能力。得饒人處且饒人，這句老話不是叫人縱容，而是提醒我們，今天握着鍵盤的人，明天也可能是被搜出來的那一個。</p><p>簡体<br>曾几何时，网络被视为一个人人都有机会说话的地方；今天打开任何一个社交网站，最先看见的却多半是一场正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠 正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠网络上的追问才翻出来的。把这种力量整个拆掉，受损的往往是最没有办法的一群。问题不在批评本身，而在于三件事：惩罚有没有止境、对象有没有分寸、出路有没有留下。先说止境。法庭的判刑有刑期，网络的判刑却没有。一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年：求职时被搜出来，结交新朋友时被翻出来，换了一座城市仍旧跟着。过失或许只是一时失言，代价却按终身计算，这样的惩罚与过失并不相称。再说分寸。一个人做错事，该承担的应该是他自己。可是现在的做法往往是：先骂当事人，再打电话到他的公司，然后找上他的父母与子女。一件事由当事人扩散到雇主，由雇主扩散到家人，由家人扩散到与他同姓的陌生人，愈烧愈远，早已与最初那件事无关。最后说出路。孔子说「过而不改，是谓过矣」，可见古人看重的并不是有没有犯过错，而是肯不肯改；犯了错而肯改，这件事本身便值得记上一笔。今天的网络却常常把话说死：无论怎样道歉、赔偿、改正，那段截图仍在，于是犯错的人索性甚么也不做，反正做甚么都没有分别。一种让人无法回头的做法，最后只会养出更多不肯认错的人。《尚书》有一句「与人不求备，检身若不及」，说的是对别人不必求全责备，对自己却要像追赶不上似的常常反省。这两句话今天读来，简直像是特意写给网络的：我们对陌生人的要求，往往比对自己严苛得多。所以我主张的并不是沉默，而是分寸：批评的力度应与过失相称，追究的范围应止于当事人，而在他确实改正之后，我们也应当有停下来的能力。得饶人处且饶人，这句老话不是叫人纵容，而是提醒我们，今天握着键盘的人，明天也可能是被搜出来的那一个。</p>", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Chinese", "stem": "作者為甚麼說今天的網絡「常常把話說死」？<br><i>作者为甚么说今天的网络「常常把话说死」？</i>", "options": {"A": "因為無論當事人怎樣道歉改正，那段截圖仍在，改過等於沒有意義<br><i>因为无论当事人怎样道歉改正，那段截图仍在，改过等于没有意义</i>", "B": "因為網民不許任何人在帖文下留言<br><i>因为网民不许任何人在帖文下留言</i>", "C": "因為社交網站會刪去所有道歉的紀錄<br><i>因为社交网站会删去所有道歉的纪录</i>", "D": "因為法庭不接納網上的證據<br><i>因为法庭不接纳网上的证据</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不打算為網絡批評一概說項。它確實有它的作用：一個人若身處高位而行事不當，從前受害者投訴無門，如今至少有機會被聽見；不少長期被掩蓋的事，正是靠網絡上的追問才翻出來的。把這種力量整個拆掉，受損的往往是最沒有辦法的一群。問題不在批評本身，而在於三件事：懲罰有沒有止境、對象有沒有分寸、出路有沒有留下。先說止境。法庭的判刑有刑期，網絡的判刑卻沒有。一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人，愈燒愈遠，早已與最初那件事無關。最後說出路。孔子說「過而不改，是謂過矣」，可見古人看重的並不是有沒有犯過錯，而是肯不肯改；犯了錯而肯改，這件事本身便值得記上一筆。今天的網絡卻常常把話說死：無論怎樣道歉、賠償、改正，那段截圖仍在，於是犯錯的人索性甚麼也不做，反正做甚麼都沒有分別。一種讓人無法回頭的做法，最後只會養出更多不肯認錯的人。《尚書》有一句「與人不求備，檢身若不及」，說的是對別人不必求全責備，對自己卻要像追趕不上似的常常反省。這兩句話今天讀來，簡直像是特意寫給網絡的：我們對陌生人的要求，往往比對自己嚴苛得多。所以我主張的並不是沉默，而是分寸：批評的力度應與過失相稱，追究的範圍應止於當事人，而在他確實改正之後，我們也應當有停下來的能力。得饒人處且饒人，這句老話不是叫人縱容，而是提醒我們，今天握着鍵盤的人，明天也可能是被搜出來的那一個。</p><p>簡体<br>曾几何时，网络被视为一个人人都有机会说话的地方；今天打开任何一个社交网站，最先看见的却多半是一场正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠网络上的追问才翻出来的。把这种力量整个拆掉，受损的往往是最没有办法的一群。问题不在批评本身，而在于三件事：惩罚有没有止境、对象有没有分寸、出路有没有留下。先说止境。法庭的判刑有刑期，网络的判刑却没有。一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年：求职时被搜出来，结交新朋友时被翻出来，换了一座城市仍旧跟着。过失或许只是一时失言，代价却按终身计算，这样的惩罚与过失并不相称。再说分寸。一个人做错事，该承担的应该是他自己。可是现在的做法往往是：先骂当事人，再打电话到他的公司，然后找上他的父母与子女。一件事由当事人扩散到雇主，由雇主扩散到家人，由家人扩散到与他同姓的陌生人，愈烧愈远，早已与最初那件事无关。最后说出路。孔子说「过而不改，是谓过矣」，可见古人看重的并不是有没有犯过错，而是肯不肯改；犯了错而肯改，这件事本身便值得记上一笔。今天的网络却常常把话说死：无论怎样道歉、赔偿、改正，那段截图仍在，于是犯错的人索性甚么也不做，反正做甚么都没有分别。一种让人无法回头的做法，最后只会养出更多不肯认错的人。《尚书》有一句「与人不求备，检身若不及」，说的是对别人不必求全责备，对自己却要像追赶不上似的常常反省。这两句话今天读来，简直像是特意写给网络的：我们对陌生人的要求，往往比对自己严苛得多。所以我主张的并不是沉默，而是分寸：批评的力度应与过失相称，追究的范围应止于当事人，而在他确实改正之后，我们也应当有停下来的能力。得饶人处且饶人，这句老话不是叫人纵容，而是提醒我们，今天握着键盘的人，明天也可能是被搜出来的那一个。</p>", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Chinese", "stem": "「這樣的懲罰與過失並不相稱」的「相稱」，意思是甚麼？<br><i>「这样的惩罚与过失并不相称」的「相称」，意思是甚么？</i>", "options": {"A": "互相稱讚<br><i>互相称赞</i>", "B": "彼此相同<br><i>彼此相同</i>", "C": "分量彼此配得上、程度相當<br><i>分量彼此配得上、程度相当</i>", "D": "先後呼應<br><i>先后呼应</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不打算為網絡批評一概說項。它確實有它的作用：一個人若身處高位而行事不當，從前受害者投訴無門，如今至少有機會被聽見；不少長期被掩蓋的事，正是靠網絡上的追問才翻出來的。把這種力量整個拆掉，受損的往往是最沒有辦法的一群。問題不在批評本身，而在於三件事：懲罰有沒有止境、對象有沒有分寸、出路有沒有留下。先說止境。法庭的判刑有刑期，網絡的判刑卻沒有。一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人，愈燒愈遠，早已與最初那件事無關。最後說出路。孔子說「過而不改，是謂過矣」，可見古人看重的並不是有沒有犯過錯，而是肯不肯改；犯了錯而肯改，這件事本身便值得記上一筆。今天的網絡卻常常把話說死：無論怎樣道歉、賠償、改正，那段截圖仍在，於是犯錯的人索性甚麼也不做，反正做甚麼都沒有分別。一種讓人無法回頭的做法，最後只會養出更多不肯認錯的人。《尚書》有一句「與人不求備，檢身若不及」，說的是對別人不必求全責備，對自己卻要像追趕不上似的常常反省。這兩句話今天讀來，簡直像是特意寫給網絡的：我們對陌生人的要求，往往比對自己嚴苛得多。所以我主張的並不是沉默，而是分寸：批評的力度應與過失相稱，追究的範圍應止於當事人，而在他確實改正之後，我們也應當有停下來的能力。得饒人處且饒人，這句老話不是叫人縱容，而是提醒我們，今天握着鍵盤的人，明天也可能是被搜出來的那一個。</p><p>簡体<br>曾几何时，网络被视为一个人人都有机会说话的地方；今天打开任何一个社交网站，最先看见的却多半是一场正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠网络上的追问才翻出来的。把这种力量整个拆掉，受损的往往是最没有办法的一群。问题不在批评本身，而在于三件事：惩罚有没有止境、对象有没有分寸、出路有没有留下。先说止境。法庭的判刑有刑期，网络的判刑却没有。一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年：求职时被搜出来，结交新朋友时被翻出来，换了一座城市仍旧跟着。过失或许只是一时失言，代价却按终身计算，这样的惩罚与过失并不相称。再说分寸。一个人做错事，该承担的应该是他自己。可是现在的做法往往是：先骂当事人，再打电话到他的公司，然后找上他的父母与子女。一件事由当事人扩散到雇主，由雇主扩散到家人，由家人扩散到与他同姓的陌生人，愈烧愈远，早已与最初那件事无关。最后说出路。孔子说「过而不改，是谓过矣」，可见古人看重的并不是有没有犯过错，而是肯不肯改；犯了错而肯改，这件事本身便值得记上一笔。今天的网络却常常把话说死：无论怎样道歉、赔偿、改正，那段截图仍在，于是犯错的人索性甚么也不做，反正做甚么都没有分别。一种让人无法回头的做法，最后只会养出更多不肯认错的人。《尚书》有一句「与人不求备，检身若不及」，说的是对别人不必求全责备，对自己却要像追赶不上似的常常反省。这两句话今天读来，简直像是特意写给网络的：我们对陌生人的要求，往往比对自己严苛得多。所以我主张的并不是沉默，而是分寸：批评的力度应与过失相称，追究的范围应止于当事人，而在他确实改正之后，我们也应当有停下来的能力。得饶人处且饶人，这句老话不是叫人纵容，而是提醒我们，今天握着键盘的人，明天也可能是被搜出来的那一个。</p>", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Chinese", "stem": "「我並不打算為網絡批評一概說項」的「說項」，指的是甚麼？<br><i>「我并不打算为网络批评一概说项」的「说项」，指的是甚么？</i>", "options": {"A": "逐項列出理由<br><i>逐项列出理由</i>", "B": "把事情分項處理<br><i>把事情分项处理</i>", "C": "當面提出質詢<br><i>当面提出质询</i>", "D": "替人說好話、代為辯護<br><i>替人说好话、代为辩护</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不打算為網絡批評一概說項。它確實有它的作用：一個人若身處高位而行事不當，從前受害者投訴無門，如今至少有機會被聽見；不少長期被掩蓋的事，正是靠網絡上的追問才翻出來的。把這種力量整個拆掉，受損的往往是最沒有辦法的一群。問題不在批評本身，而在於三件事：懲罰有沒有止境、對象有沒有分寸、出路有沒有留下。先說止境。法庭的判刑有刑期，網絡的判刑卻沒有。一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人， 年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人，愈燒愈遠，早已與最初那件事無關。最後說出路。孔子說「過而不改，是謂過矣」，可見古人看重的並不是有沒有犯過錯，而是肯不肯改；犯了錯而肯改，這件事本身便值得記上一筆。今天的網絡卻常常把話說死：無論怎樣道歉、賠償、改正，那段截圖仍在，於是犯錯的人索性甚麼也不做，反正做甚麼都沒有分別。一種讓人無法回頭的做法，最後只會養出更多不肯認錯的人。《尚書》有一句「與人不求備，檢身若不及」，說的是對別人不必求全責備，對自己卻要像追趕不上似的常常反省。這兩句話今天讀來，簡直像是特意寫給網絡的：我們對陌生人的要求，往往比對自己嚴苛得多。所以我主張的並不是沉默，而是分寸：批評的力度應與過失相稱，追究的範圍應止於當事人，而在他確實改正之後，我們也應當有停下來的能力。得饒人處且饒人，這句老話不是叫人縱容，而是提醒我們，今天握着鍵盤的人，明天也可能是被搜出來的那一個。</p><p>簡体<br>曾几何时，网络被视为一个人人都有机会说话的地方；今天打开任何一个社交网站，最先看见的却多半是一场正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠网络上的追问才翻出来的。把这种力量整个拆掉，受损的往往是最没有办法的一群。问题不在批评本身，而在于三件事：惩罚有没有止境、对象有没有分寸、出路有没有留下。先说止境。法庭的判刑有刑期，网络的判刑却没有。一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年：求职时被搜出来，结交新朋友时被翻出来，换了一座城市仍旧跟着。过失或许只是一时失言，代价却按终身计算，这样的惩罚与过失并不相称。再说分寸。一个人做错事，该承担的应该是他自己。可是现在的做法往往是：先骂当事人，再打电话到他的公司，然后找上他的父母与子女。一件事由当事人扩散到雇主，由雇主扩散到家人，由家人扩散到与他同姓的陌生人，愈烧愈远，早已与最初那件事无关。最后说出路。孔子说「过而不改，是谓过矣」，可见古人看重的并不是有没有犯过错，而是肯不肯改；犯了错而肯改，这件事本身便值得记上一笔。今天的网络却常常把话说死：无论怎样道歉、赔偿、改正，那段截图仍在，于是犯错的人索性甚么也不做，反正做甚么都没有分别。一种让人无法回头的做法，最后只会养出更多不肯认错的人。《尚书》有一句「与人不求备，检身若不及」，说的是对别人不必求全责备，对自己却要像追赶不上似的常常反省。这两句话今天读来，简直像是特意写给网络的：我们对陌生人的要求，往往比对自己严苛得多。所以我主张的并不是沉默，而是分寸：批评的力度应与过失相称，追究的范围应止于当事人，而在他确实改正之后，我们也应当有停下来的能力。得饶人处且饶人，这句老话不是叫人纵容，而是提醒我们，今天握着键盘的人，明天也可能是被搜出来的那一个。</p>", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Chinese", "stem": "末段引用「得饒人處且饒人」，作者用它來提醒讀者甚麼？<br><i>末段引用「得饶人处且饶人」，作者用它来提醒读者甚么？</i>", "options": {"A": "犯錯的人不必受到任何追究<br><i>犯错的人不必受到任何追究</i>", "B": "凡事應交由旁人代為決定<br><i>凡事应交由旁人代为决定</i>", "C": "應該盡量避免與人來往<br><i>应该尽量避免与人来往</i>", "D": "在可以留有餘地的時候留一步，因為今天批評別人的人，明天也可能被批評<br><i>在可以留有余地的时候留一步，因为今天批评别人的人，明天也可能被批评</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不 天握着键盘的人，明天也可能是被搜出来的那一个。</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Chinese", "stem": "「這種做法已經（　）了當事人的生活。」括號內若要填入語義最重的一個詞，應選哪一個？<br><i>「这种做法已经（　）了当事人的生活。」括号内若要填入语义最重的一个词，应选哪一个？</i>", "options": {"A": "影響<br><i>影响</i>", "B": "打擾<br><i>打扰</i>", "C": "摧毀<br><i>摧毁</i>", "D": "改變<br><i>改变</i>"}, "fig": "", "passage": "<strong>判詞比法庭快<br><i>判词比法庭快</i></strong><br><p>繁體<br>曾幾何時，網絡被視為一個人人都有機會說話的地方；今天打開任何一個社交網站，最先看見的卻多半是一場正在進行的審判。有人在餐廳失了禮，有人在網上說錯一句話，不出半日，姓名、學校、僱主以至家人的照片都已列在同一段帖文之下，幾百個鍵盤同時落下，判詞比法庭快得多，也重得多。我並不打算為網絡批評一概說項。它確實有它的作用：一個人若身處高位而行事不當，從前受害者投訴無門，如今至少有機會被聽見；不少長期被掩蓋的事，正是靠網絡上的追問才翻出來的。把這種力量整個拆掉，受損的往往是最沒有辦法的一群。問題不在批評本身，而在於三件事：懲罰有沒有止境、對象有沒有分寸、出路有沒有留下。先說止境。法庭的判刑有刑期，網絡的判刑卻沒有。一句道歉在第二天已經無人記得，一段截圖卻可以跟着一個人十年：求職時被搜出來，結交新朋友時被翻出來，換了一座城市仍舊跟着。過失或許只是一時失言，代價卻按終身計算，這樣的懲罰與過失並不相稱。再說分寸。一個人做錯事，該承擔的應該是他自己。可是現在的做法往往是：先罵當事人，再打電話到他的公司，然後找上他的父母與子女。一件事由當事人擴散到僱主，由僱主擴散到家人，由家人擴散到與他同姓的陌生人，愈燒愈遠，早已與最初那件事無關。最後說出路。孔子說「過而不改，是謂過矣」，可見古人看重的並不是有沒有犯過錯，而是肯不肯改；犯了錯而肯改，這件事本身便值得記上一筆。今天的網絡卻常常把話說死：無論怎樣道歉、賠償、改正，那段截圖仍在，於是犯錯的人索性甚麼也不做，反正做甚麼都沒有分別。一種讓人無法回頭的做法，最後只會養出更多不肯認錯的人。《尚書》有一句「與人不求備，檢身若不及」，說的是對別人不必求全責備，對自己卻要像追趕不上似的常常反省。這兩句話今天讀來，簡直像是特意寫給網絡的：我們對陌生人的要求，往往比對自己嚴苛得多。所以我主張的並不是沉默，而是分寸：批評的力度應與過失相稱，追究的範圍應止於當事人，而在他確實改正之後，我們也應當有停下來的能力。得饒人處且饒人，這句老話不是叫人縱容，而是提醒我們，今天握着鍵盤的人，明天也可能是被搜出來的那一個。</p><p>簡体<br>曾几何时，网络被视为一个人人都有机会说话的地方；今天打开任何一个社交网站，最先看见的却多半是一场正在进行的审判。有人在餐厅失了礼，有人在网上说错一句话，不出半日，姓名、学校、雇主以至家人的照片都已列在同一段帖文之下，几百个键盘同时落下，判词比法庭快得多，也重得多。我并不打算为网络批评一概说项。它确实有它的作用：一个人若身处高位而行事不当，从前受害者投诉无门，如今至少有机会被听见；不少长期被掩盖的事，正是靠网络上的追问才翻出来的。把这种力量整个拆掉，受损的往往是最没有办法的一群。问题不在批评本身，而在于三件事：惩罚有没有止境、对象有没有分寸、出路有没有留下。先说止境。法庭的判刑有刑期，网络的判刑却没有。一句道歉在第二天已经无人记得，一段截图却可以跟着一个人十年：求职时被搜出来，结交新朋友时被翻出来，换了一座城市仍旧跟着。过失或许只是一时失言，代价却按终身计算，这样的惩罚与过失并不相称。再说分寸。一个人做错事，该承担的应该是他自己。可是现在的做法往往是：先骂当事人，再打电话到他的公司，然后找上他的父母与子女。一件事由当事人扩散到雇主，由雇主扩散到家人，由家人扩散到与他同姓的陌生人，愈烧愈远，早已与最初那件事无关。最后说出路。孔子说「过而不改，是谓过矣」，可见古人看重的并不是有没有犯过错，而是肯不肯改；犯了错而肯改，这件事本身便值得记上一笔。今天的网络却常常把话说死：无论怎样道歉、赔偿、改正，那段截图仍在，于是犯错的人索性甚么也不做，反正做甚么都没有分别。一种让人无法回头的做法，最后只会养出更多不肯认错的人。《尚书》有一句「与人不求备，检身若不及」，说的是对别人不必求全责备，对自己却要像追赶不上似的常常反省。这两句话今天读来，简直像是特意写给网络的： let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 Chinese Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
