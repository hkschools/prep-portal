<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 6 Logic Drill 5</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT CIS: Stage 6 Logic Drill 5</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "LOGIC-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Logic", "body": "Answer all questions. Choose the single best answer. You may use paper and pencil."}, {"n": "2", "type": "mcq", "section": "Logic", "stem": "Each term of this sequence is the term before it multiplied by a number that grows by one every step. What comes next?  1, 2, 6, 24, 120, ...", "options": {"A": "600", "B": "240", "C": "840", "D": "720"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Logic", "stem": "One chain of letters runs backwards through the alphabet and the other runs forwards. Which letter belongs in the EIGHTH place?  Z, C, W, F, T, I, Q, ...", "options": {"A": "N", "B": "L", "C": "J", "D": "O"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Logic", "stem": "Look at the grid below. One rule connects the pair on the left of each row to the value on its right. Work out that rule and give the missing value.", "options": {"A": "79", "B": "1", "C": "49", "D": "105"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"174\" height=\"138\" viewBox=\"0 0 174 138\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"174\" height=\"138\" fill=\"white\"/><path d=\"M20,18 L12,18 L12,120 L20,120\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M154,18 L162,18 L162,120 L154,120\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"41\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">9</text><text x=\"87\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">11</text><text x=\"133\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">70</text><text x=\"41\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">7</text><text x=\"87\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">13</text><text x=\"133\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">36</text><text x=\"41\" y=\"108\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">8</text><text x=\"87\" y=\"108\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">15</text><text x=\"133\" y=\"108\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">?</text></svg>", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Logic", "stem": "The sequence 7, 12, 17, 22, ... goes on rising by the same amount. What is the SUM of its first TWENTY terms?", "options": {"A": "1,090", "B": "2,180", "C": "102", "D": "1,050"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Logic", "stem": "In a certain code every letter is moved forward through the alphabet by the number of letters in the word, so the four-letter word RISK is written VMWO. Written in the same code, what is BRIDGE?", "options": {"A": "VLCXAY", "B": "FVMHKI", "C": "HXOJMK", "D": "HXOJMI"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Logic", "stem": "The first word names a branch of study and the second names what it studies. Ornithology is to birds as entomology is to ...", "options": {"A": "Plants", "B": "Insects", "C": "Rocks", "D": "Fish"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Logic", "stem": "Three of these verbs mean to praise somebody warmly. Which is LEAST like the others?  laud, extol, eulogise, censure", "options": {"A": "laud", "B": "extol", "C": "eulogise", "D": "censure"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Logic", "stem": "Each of print, writing and book turns into a compound when one identical word is placed in front of it. Which word does that?", "options": {"A": "Hand", "B": "Foot", "C": "Note", "D": "Type"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Logic", "stem": "In the picture below, the second drawing is made from the first by a single change. Work out that change, then choose the drawing that stands in the same relation to the third.", "options": {"A": "Octagon", "B": "Decagon", "C": "Heptagon", "D": "Nonagon"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"250\" viewBox=\"0 0 480 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"250\" fill=\"white\"/><text x=\"10\" y=\"20\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">A is to B, as C is to ?</text><rect x=\"27\" y=\"50\" width=\"56\" height=\"56\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"100\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><polygon points=\"155.0,50.0 176.9,60.5 182.3,84.2 167.1,103.2 142.9,103.2 127.7,84.2 133.1,60.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"206\" y=\"86\" font-size=\"22\" font-weight=\"bold\" fill=\"#333\">::</text><polygon points=\"262.0,50.0 286.2,64.0 286.2,92.0 262.0,106.0 237.8,92.0 237.8,64.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"308\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><text x=\"362\" y=\"90\" font-size=\"30\" font-weight=\"bold\" fill=\"#C00\">?</text><line x1=\"10\" y1=\"140\" x2=\"470\" y2=\"140\" stroke=\"#ccc\"/><text x=\"10\" y=\"162\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Options:</text><polygon points=\"60.0,170.0 79.8,178.2 88.0,198.0 79.8,217.8 60.0,226.0 40.2,217.8 32.0,198.0 40.2,178.2\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"152.0,170.0 168.5,175.3 178.6,189.3 178.6,206.7 168.5,220.7 152.0,226.0 135.5,220.7 125.4,206.7 125.4,189.3 135.5,175.3\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"152\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"244.0,170.0 265.9,180.5 271.3,204.2 256.1,223.2 231.9,223.2 216.7,204.2 222.1,180.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"244\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"336.0,170.0 354.0,176.6 363.6,193.1 360.2,212.0 345.6,224.3 326.4,224.3 311.8,212.0 308.4,193.1 318.0,176.6\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"336\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Logic", "stem": "Suppose the shape below is cut out and closed up into a solid. Name that solid and say how many VERTICES it has.", "options": {"A": "A triangular prism, with 6 vertices", "B": "A triangular prism, with 5 vertices", "C": "A square-based pyramid, with 5 vertices", "D": "A tetrahedron, with 4 vertices"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"240\" height=\"230\" viewBox=\"0 0 240 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"240\" height=\"230\" fill=\"white\"/><rect x=\"40\" y=\"70\" width=\"50\" height=\"60\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"90\" y=\"70\" width=\"50\" height=\"60\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"140\" y=\"70\" width=\"50\" height=\"60\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"90,70 140,70 115,30\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"90,130 140,130 115,170\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></svg>", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Logic", "stem": "A solid cube of metal with edges of 10 cm is melted down and cast, with nothing lost, into a solid block measuring 8 cm by 5 cm by h cm. What is h?", "options": {"A": "960 cm", "B": "25 cm", "C": "62.5 cm", "D": "12.5 cm"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Logic", "stem": "Exactly one of the four shapes drawn below will tile a flat floor on its own, with no gaps and no overlaps. Which shape is it?", "options": {"A": "Pentagon", "B": "Octagon", "C": "Triangle", "D": "Circle"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><polygon points=\"60.0,28.0 92.3,51.5 80.0,89.5 40.0,89.5 27.7,51.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"180.0,28.0 204.0,38.0 214.0,62.0 204.0,86.0 180.0,96.0 156.0,86.0 146.0,62.0 156.0,38.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"300.0,28.0 329.4,79.0 270.6,79.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><circle cx=\"420.0\" cy=\"62\" r=\"34\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Logic", "stem": "A restaurant adds a service charge of 15% to every bill. One party paid $644 in all. What was the bill BEFORE the service charge was added?", "options": {"A": "$547.40", "B": "$740.60", "C": "$629", "D": "$560"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Logic", "stem": "A train arrived at 15:42. Its running time was 3 hours 20 minutes, and on the way it was held for 25 minutes at one station and 18 minutes at another. At what time did it leave?", "options": {"A": "12:22", "B": "11:57", "C": "11:39", "D": "19:45"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Logic", "stem": "Ella cycles to work at 20 km/h and walks home along the same road at 5 km/h. The round trip takes her exactly 1 hour. How far is her workplace from her home?", "options": {"A": "4 km", "B": "12.5 km", "C": "6.25 km", "D": "2.5 km"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Logic", "stem": "Five machines working together take 12 hours to complete an order. All the machines work at the same steady rate. How long would EIGHT machines take?", "options": {"A": "19 hours 12 minutes", "B": "7 hours 30 minutes", "C": "7 hours 12 minutes", "D": "9 hours"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Logic", "stem": "Five papers were sat on the five days from Monday to Friday, one each day. German was sat on Monday. History was sat on the day immediately after Biology. Economics was sat on Friday. Biology was sat before French. Which paper was sat on WEDNESDAY?", "options": {"A": "Biology", "B": "French", "C": "History", "D": "German"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Logic", "stem": "Lena, Miko, Nour and Otto each hold exactly one of the roles of editor, illustrator, printer and translator, and no two hold the same role. Lena is neither the editor nor the printer. Miko is the printer. Nour is not the translator. Otto is neither the illustrator nor the translator. Who is the TRANSLATOR?", "options": {"A": "Miko", "B": "Lena", "C": "Nour", "D": "Otto"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Logic", "stem": "A fault report states that either the sensor failed or the power supply was cut, and possibly both. Later checks showed that the power supply was NOT cut. If the report is true, what must also be true?", "options": {"A": "The sensor failed.", "B": "Both the sensor and the power supply failed.", "C": "The sensor did not fail.", "D": "It cannot be told which of the two went wrong."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Logic", "stem": "A school announced that ONLY students who had submitted a portfolio were called to interview. Priya was called to interview. What MUST be true?", "options": {"A": "Every student who submitted a portfolio was called to interview.", "B": "Priya's portfolio was the strongest submitted.", "C": "Priya was offered a place at the school.", "D": "Priya submitted a portfolio."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 Logic Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
