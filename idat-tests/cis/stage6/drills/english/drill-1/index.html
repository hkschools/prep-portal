<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 6 English Drill 1</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "ENG-D1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "In the sentence below, which part of speech does the word <b>fast</b> belong to as it is used here?<br><i>The dye held fast through three washings.</i>", "options": {"A": "Adjective", "B": "Noun", "C": "Adverb", "D": "Verb"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "The word <b>refractory</b> is built on the root <i>fract</i>, meaning 'to break'. What is a <b>refractory</b> pupil most likely to be?", "options": {"A": "One who accepts correction readily and rarely argues.", "B": "One who recovers quickly after an illness.", "C": "One whose work has been broken into small careless pieces.", "D": "One who resists instruction and is hard to manage."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which word describes an argument that LOOKS sound but conceals a flaw?", "options": {"A": "Plausible", "B": "Specious", "C": "Cogent", "D": "Tenuous"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which rewriting removes the DANGLING MODIFIER from the draft sentence below?<br><i>Having boiled for ten minutes, the technician removed the flask from the heat.</i>", "options": {"A": "When the flask had boiled for ten minutes, the technician removed it from the heat.", "B": "Having boiled for ten minutes, the technician then removed the flask from the heat.", "C": "The technician removed the flask from the heat, having boiled for ten minutes.", "D": "Having boiled for ten minutes the technician removed the flask from the heat."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "One word in the draft sentence below is spelled wrongly. Which word is it?<br><i>The apparatus was calibrated at regular intervals so that the readings would be consistant.</i>", "options": {"A": "apparatus", "B": "calibrated", "C": "intervals", "D": "consistant"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "A paragraph is to set out three separate forces that wear away a coastline. Which opening sentence best controls that paragraph?", "options": {"A": "Coastal erosion is an interesting subject that many geographers have studied.", "B": "In 1953 a storm surge broke through the sea wall at the mouth of the estuary.", "C": "Three forces, working together, strip material from a coastline.", "D": "It is therefore clear that this coastline cannot be defended indefinitely."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which revision of the two short sentences below uses SUBORDINATION to show which idea matters more?<br><i>The readings were inconsistent. The experiment was repeated.</i>", "options": {"A": "Because the readings were inconsistent, the experiment was repeated.", "B": "The readings were inconsistent, and the experiment was repeated.", "C": "The readings were inconsistent; the experiment was repeated.", "D": "The readings were inconsistent, the experiment was repeated."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which opening sentence of an argumentative essay gives the reader a claim that can genuinely be argued against?", "options": {"A": "This essay will discuss the advantages and disadvantages of school examinations.", "B": "School examinations should be replaced by continuous assessment, because they measure preparation rather than understanding.", "C": "School examinations have been set in British schools since the nineteenth century.", "D": "Examinations are a subject about which many people hold strong opinions."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "In the method section of a scientific report, why is the PASSIVE voice usually preferred to the active?", "options": {"A": "It makes the writing sound more difficult, and difficulty is expected in science.", "B": "It allows the writer to leave out the equipment that was used.", "C": "It shortens every sentence, and short sentences are required in reports.", "D": "It keeps the reader's attention on what was done rather than on who did it, so the method can be repeated by anyone."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Read this sentence from an essay published in 1625.<br><i>Some books are to be tasted, others to be swallowed, and some few to be chewed and digested.</i><br>Which statement best identifies the CENTRAL IDEA the writer is putting forward?", "options": {"A": "Books deserve different degrees of attention, and a good reader judges which degree each one has earned.", "B": "Reading is a physical activity and should be treated in the same way as eating.", "C": "Only a very few books are worth reading, and the rest should be put aside.", "D": "Books ought to be read in the order in which they were written."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Why does the lecturer treat the rubbing together of two pieces of ice as decisive evidence?", "options": {"A": "Ice is the only material in which melting can be measured with any accuracy.", "B": "Both pieces stay at the freezing point, so the melting cannot be explained by heat flowing in from something warmer.", "C": "The thermometer rises during the experiment, proving that a fluid has entered the ice.", "D": "The two pieces are colder than the room, so they must draw heat out of the air."}, "fig": "", "passage": "<strong>A lecture on heat, delivered in 1863</strong><br><p><b>From a lecture delivered to a philosophical institution in the north of England, 1863.</b></p><p>We are accustomed to speak of heat as though it were a substance, poured into a body as water is poured into a jug and drawn off again when the body cools. The language is convenient, and it is wrong. Nothing enters the iron when you beat it; nothing leaves the wheel when the brake grows cold. What passes between them is not a thing but a condition, and the condition is motion.</p><p>Consider the humblest experiment in this room. I take two pieces of ice, both standing at the freezing point, and I rub the one upon the other. The thermometer does not stir; yet where the two faces meet, the ice is wetted, and water runs down my sleeve. Where, then, is the substance of heat that has done this work? It was never in the ice, for the ice was as cold at the end as at the beginning. It was in my arm, and before it entered the ice it was motion.</p><p>The consequence is graver than the experiment looks. If heat is motion, the engine that burns coal is not consuming a fluid but transforming a movement; and what it fails to transform it does not destroy. It scatters. Every wasted degree is a movement gone out into the general stir of the world, spread so thin among so many bodies that no engine we shall ever build can gather it in again. The account balances to the last figure. Nothing is lost, and yet everything is spent.</p><p>I do not ask you to believe this because I have said it. I ask you to rub the ice.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which statement best expresses the CENTRAL IDEA of the 1863 lecture?", "options": {"A": "Friction is the only means by which ice can be made to melt.", "B": "Scientific language should be made more convenient for ordinary listeners.", "C": "Heat is a form of motion rather than a substance, and seeing it that way changes what an engine can be expected to do.", "D": "Coal supplies will one day be exhausted, so engines must be redesigned."}, "fig": "", "passage": "<strong>A lecture on heat, delivered in 1863</strong><br><p><b>From a lecture delivered to a philosophical institution in the north of England, 1863.</b></p><p>We are accustomed to speak of heat as though it were a substance, poured into a body as water is poured into a jug and drawn off again when the body cools. The language is convenient, and it is wrong. Nothing enters the iron when you beat it; nothing leaves the wheel when the brake grows cold. What passes between them is not a thing but a condition, and the condition is motion.</p><p>Consider the humblest experiment in this room. I take two pieces of ice, both standing at the freezing point, and I rub the one upon the other. The thermometer does not stir; yet where the two faces meet, the ice is wetted, and water runs down my sleeve. Where, then, is the substance of heat that has done this work? It was never in the ice, for the ice was as cold at the end as at the beginning. It was in my arm, and before it entered the ice it was motion.</p><p>The consequence is graver than the experiment looks. If heat is motion, the engine that burns coal is not consuming a fluid but transforming a movement; and what it fails to transform it does not destroy. It scatters. Every wasted degree is a movement gone out into the general stir of the world, spread so thin among so many bodies that no engine we shall ever build can gather it in again. The account balances to the last figure. Nothing is lost, and yet everything is spent.</p><p>I do not ask you to believe this because I have said it. I ask you to rub the ice.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "In the third paragraph the lecturer says that what an engine fails to transform it does not destroy but <b>scatters</b>. What does <b>scatters</b> mean as it is used here?", "options": {"A": "Throws the motion away so completely that it ceases to exist.", "B": "Divides the coal into smaller quantities before it is burnt.", "C": "Sends the heat back into the fire so that it may be used a second time.", "D": "Spreads the motion so thinly through so many bodies that no engine can collect it again."}, "fig": "", "passage": "<strong>A lecture on heat, delivered in 1863</strong><br><p><b>From a lecture delivered to a philosophical institution in the north of England, 1863.</b></p><p>We are accustomed to speak of heat as though it were a substance, poured into a body as water is poured into a jug and drawn off again when the body cools. The language is convenient, and it is wrong. Nothing enters the iron when you beat it; nothing leaves the wheel when the brake grows cold. What passes between them is not a thing but a condition, and the condition is motion.</p><p>Consider the humblest experiment in this room. I take two pieces of ice, both standing at the freezing point, and I rub the one upon the other. The thermometer does not stir; yet where the two faces meet, the ice is wetted, and water runs down my sleeve. Where, then, is the substance of heat that has done this work? It was never in the ice, for the ice was as cold at the end as at the beginning. It was in my arm, and before it entered the ice it was motion.</p><p>The consequence is graver than the experiment looks. If heat is motion, the engine that burns coal is not consuming a fluid but transforming a movement; and what it fails to transform it does not destroy. It scatters. Every wasted degree is a movement gone out into the general stir of the world, spread so thin among so many bodies that no engine we shall ever build can gather it in again. The account balances to the last figure. Nothing is lost, and yet everything is spent.</p><p>I do not ask you to believe this because I have said it. I ask you to rub the ice.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "How does the lecturer construct the argument across the four paragraphs?", "options": {"A": "A law is stated, proved by calculation, and then qualified with its exceptions.", "B": "A familiar way of speaking is rejected, an experiment is offered against it, the wider consequence is drawn out, and the test is handed to the audience.", "C": "Several engines are described and the least wasteful of them is recommended.", "D": "A consequence is stated first and the definition of heat is reached at the end."}, "fig": "", "passage": "<strong>A lecture on heat, delivered in 1863</strong><br><p><b>From a lecture delivered to a philosophical institution in the north of England, 1863.</b></p><p>We are accustomed to speak of heat as though it were a substance, poured into a body as water is poured into a jug and drawn off again when the body cools. The language is convenient, and it is wrong. Nothing enters the iron when you beat it; nothing leaves the wheel when the brake grows cold. What passes between them is not a thing but a condition, and the condition is motion.</p><p>Consider the humblest experiment in this room. I take two pieces of ice, both standing at the freezing point, and I rub the one upon the other. The thermometer does not stir; yet where the two faces meet, the ice is wetted, and water runs down my sleeve. Where, then, is the substance of heat that has done this work? It was never in the ice, for the ice was as cold at the end as at the beginning. It was in my arm, and before it entered the ice it was motion.</p><p>The consequence is graver than the experiment looks. If heat is motion, the engine that burns coal is not consuming a fluid but transforming a movement; and what it fails to transform it does not destroy. It scatters. Every wasted degree is a movement gone out into the general stir of the world, spread so thin among so many bodies that no engine we shall ever build can gather it in again. The account balances to the last figure. Nothing is lost, and yet everything is spent.</p><p>I do not ask you to believe this because I have said it. I ask you to rub the ice.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "The third paragraph ends: 'Nothing is lost, and yet everything is spent.' What does setting those two statements against each other achieve?", "options": {"A": "It holds the two halves of the idea together: the motion survives, but it survives in a form nobody can use.", "B": "It concedes that the lecturer's own argument contains a contradiction he cannot resolve.", "C": "It softens the argument by hinting that the question is too hard to settle.", "D": "It shows that the lecturer has changed his mind about heat being a substance."}, "fig": "", "passage": "<strong>A lecture on heat, delivered in 1863</strong><br><p><b>From a lecture delivered to a philosophical institution in the north of England, 1863.</b></p><p>We are accustomed to speak of heat as though it were a substance, poured into a body as water is poured into a jug and drawn off again when the body cools. The language is convenient, and it is wrong. Nothing enters the iron when you beat it; nothing leaves the wheel when the brake grows cold. What passes between them is not a thing but a condition, and the condition is motion.</p><p>Consider the humblest experiment in this room. I take two pieces of ice, both standing at the freezing point, and I rub the one upon the other. The thermometer does not stir; yet where the two faces meet, the ice is wetted, and water runs down my sleeve. Where, then, is the substance of heat that has done this work? It was never in the ice, for the ice was as cold at the end as at the beginning. It was in my arm, and before it entered the ice it was motion.</p><p>The consequence is graver than the experiment looks. If heat is motion, the engine that burns coal is not consuming a fluid but transforming a movement; and what it fails to transform it does not destroy. It scatters. Every wasted degree is a movement gone out into the general stir of the world, spread so thin among so many bodies that no engine we shall ever build can gather it in again. The account balances to the last figure. Nothing is lost, and yet everything is spent.</p><p>I do not ask you to believe this because I have said it. I ask you to rub the ice.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the whole English section, reading and writing together, is 85 minutes at Stage 6, and the writing is typed on a keyboard. Choose ONE of the two tasks below. They are different text types and are marked differently. TASK 1 is an ARGUMENTATIVE ESSAY: you defend a claim with reasoning and evidence and you answer the strongest case against you. TASK 2 asks you to write a SCIENTIFIC PROCESS OR PROCEDURE: an impersonal, ordered and precise account that another person could either follow exactly or use to understand how something works.", "label": "", "body": "", "hint": "For TASK 1, open with a claim that can be argued against, give each paragraph one point with the reasoning or evidence behind it, use linking words to carry the reader from paragraph to paragraph, and give one paragraph to the strongest objection before you answer it. For TASK 2, write in the third person and mainly in the PASSIVE voice ('the flask was heated', not 'I heated the flask'), put the steps in the order they happen, and mark that order with sequencing connectives such as first, once, until, thereafter and finally. Be exact about quantity, time and temperature: '60 degrees Celsius for fifteen minutes' rather than 'quite hot for a while'. Give no opinions in a procedure. Whichever task you choose, vary your sentence lengths and read your work back at the end to catch spelling slips and sentences that have lost their subject.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": "TASK 1\n'A discovery that cannot be explained to a non-specialist has not been fully understood.' Argue for or against this claim. State your position, defend it with two developed reasons, use one example drawn from science or public life rather than from your own experience, set out the strongest objection to your position and answer it, and close by saying precisely how far your claim extends.\n\nTASK 2\nWrite an account of a simple experiment that shows that two objects at the same temperature can still be made to change state when work is done on them, of the kind the 1863 lecturer describes. Set out the apparatus, the steps in order, the measurements to be taken and the precautions that keep the result trustworthy, and end with a short paragraph explaining what the result shows and why. Write throughout as a method another student could follow without asking you a single question."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 English Drill 1</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
