<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}

  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}

  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}

  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}

good one as though it were a merit. It will be found more useful, and I believe more accurate, to speak of both as we speak of a footpath across a field. Nobody plans the path. The first man crosses where the ground looks driest; the second finds a trace of the first and follows it, because following is easier than choosing; and by the hundredth crossing the grass is gone and the line is fixed. The path was not decided. It was worn.</p><p>The nervous system, so far as we can judge it, is worn in the same manner. Every action leaves the channel it passed through a little more open than it found it, and the next impulse takes the open channel in preference to the closed one, not from any principle but from the ordinary economy by which water finds the lower ground. What we call character is the sum of these channels at any given moment. It is a record of what has been done, and it is also, unfortunately, a prediction of what will be.</p><p>Two consequences follow, and they point in opposite directions. The first is discouraging: a habit is not undone by wishing it undone, any more than a footpath is closed by disapproving of it. The second is not discouraging at all. If habits are worn, they can be worn differently. No single crossing decides a path, and no single act decides a character; but no crossing is wasted either, and the man who takes the harder line across the field is not merely resisting the old path, he is beginning a new one.</p><p>The practical rule, then, is not to resolve harder. It is to arrange matters so that the crossing you wish to become habitual is the crossing most easily made, and to allow no exception until the new line is worn. An exception is not a small failure. It is a walk down the old path, and the old path is only waiting to be used.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "The writer calls character 'a record of what has been done, and ... a prediction of what will be'. Why does he add the second es the harder line across the field is not merely resisting the old path, he is beginning a new one.</p><p>The practical rule, then, is not to resolve harder. It is to arrange matters so that the crossing you wish to become habitual is the crossing most easily made, and to allow no exception until the new line is worn. An exception is not a small failure. It is a walk down the old path, and the old path is only waiting to be used.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "The third paragraph says two consequences follow and that they point in opposite directions. What are they?", "options": {"A": "Habits are easy to acquire but impossible to lose.", "B": "Good habits are worn in quickly while bad ones take years to form.", "C": "A habit can be removed by a single decisive act of will.", "D": "Wishing a habit away cannot work, but a habit that was worn in can be worn out and replaced."}, "fig": "", "passage": "<strong>On habit, from a treatise of 1890</strong><br><p><b>From a treatise on the formation of character, 1890.</b></p><p>We speak of a bad habit as though it were a fault of the will, and of a good one as though it were a merit. It will be found more useful, and I believe more accurate, to speak of both as we speak of a footpath across a field. Nobody plans the path. The first man crosses where the ground looks driest; the second finds a trace of the first and follows it, because following is easier than choosing; and by the hundredth crossing the grass is gone and the line is fixed. The path was not decided. It was worn.</p><p>The nervous system, so far as we can judge it, is worn in the same manner. Every action leaves the channel it passed through a little more open than it found it, and the next impulse takes the open channel in preference to the closed one, not from any principle but from the ordinary economy by which water finds the lower ground. What we call character is the sum of these channels at any given moment  can already picture.", "D": "It proves that the nervous system and a field behave in identical ways."}, "fig": "", "passage": "<strong>On habit, from a treatise of 1890</strong><br><p><b>From a treatise on the formation of character, 1890.</b></p><p>We speak of a bad habit as though it were a fault of the will, and of a good one as though it were a merit. It will be found more useful, and I believe more accurate, to speak of both as we speak of a footpath across a field. Nobody plans the path. The first man crosses where the ground looks driest; the second finds a trace of the first and follows it, because following is easier than choosing; and by the hundredth crossing the grass is gone and the line is fixed. The path was not decided. It was worn.</p><p>The nervous system, so far as we can judge it, is worn in the same manner. Every action leaves the channel it passed through a little more open than it found it, and the next impulse takes the open channel in preference to the closed one, not from any principle but from the ordinary economy by which water finds the lower ground. What we call character is the sum of these channels at any given moment. It is a record of what has been done, and it is also, unfortunately, a prediction of what will be.</p><p>Two consequences follow, and they point in opposite directions. The first is discouraging: a habit is not undone by wishing it undone, any more than a footpath is closed by disapproving of it. The second is not discouraging at all. If habits are worn, they can be worn differently. No single crossing decides a path, and no single act decides a character; but no crossing is wasted either, and the man who takes the harder line across the field is not merely resisting the old path, he is beginning a new one.</p><p>The practical rule, then, is not to resolve harder. It is to arrange matters so that the crossing you wish to become habitual is the crossing most easily made, and to allow no exception until the new line is worn. An exception is not a small failure. It is a walk down the old path, and the old path is only waiting to be used.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the whole English section, reading and writing together, is 85 minutes at Stage 6, and the writing is typed on a keyboard. Choose ONE of the two tasks below. They are two different text types with two different registers. TASK 1 is an ARGUMENTATIVE ESSAY: you take a position that can be disputed, defend it with reasoning and evidence, and answer the strongest case against you. TASK 2 is a SCIENTIFIC PROCESS OR PROCEDURE: an impersonal, ordered and precise piece of writing that either sets out a method to be followed or explains how a process works, step by step and cause by cause.", "label": "", "body": "", "hint": "For TASK 1, state a claim a reasonable person could deny, give each paragraph one point with the reasoning or evidence behind it, use linking words so the reader can feel the argument advancing, and give a full paragraph to the objection you would least like to be asked about. For TASK 2, write impersonally and mainly in the PASSIVE voice: 'the readings were taken each morning', not 'I took the readings'. Order the steps as they happen and signal that order with first, next, once, until, thereafter and finally. Give exact quantities, durations and temperatures rather than 'some', 'a while' and 'warm', and make every causal link explicit so the reader never has to guess why one stage leads to the next. In either task, vary your sentence openings, and reread at the end for spelling slips, misplaced 'only' and homophones such as there, their and were.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "TASK 1\n'Character is formed by what we repeat, not by what we intend.' Argue for or against this claim. State your position, defend it with two developed reasons, take one example from history, sport or public life rather than from your own experience, set out the strongest objection and answer it, and close by making clear what your claim does not cover.", "partB": "TASK 2\nWrite a procedure by which someone could test whether a new routine has actually become established rather than merely being maintained by effort. Set out what would be recorded, over what period, at what intervals, what is kept constant, and what would count as evidence that the routine had taken hold. Finish with a short paragraph explaining how the record should be read and what it could not tell you. Write throughout as a method another person could carry out without asking you a question."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 English Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
