<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}

  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "ENG-D3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "In the sentence below, which part of speech is the word <b>running</b>?<br><i>Running the trial twice was the only way to be certain.</i>", "options": {"A": "A verb in the present continuous tense.", "B": "An adjective describing the noun 'trial'.", "C": "A noun, since the phrase it heads is the subject of the sentence.", "D": "An adverb telling the reader how the trial was conducted."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "The word <b>circumscribe</b> joins the prefix <i>circum</i>, meaning 'around', to the root <i>scrib</i>, meaning 'to write or draw'. What does it mean to circumscribe a power?", "options": {"A": "To write about it at very great length.", "B": "To read a description of it with close attention.", "C": "To find a way of getting around it unnoticed.", "D": "To draw limits around it so that it can reach only so far."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which word best describes an answer worded so that it can be taken two ways ON PURPOSE?", "options": {"A": "Ambiguous", "B": "Equivocal", "C": "Obscure", "D": "Concise"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which correction repairs the AGREEMENT fault in the draft sentence below?<br><i>The set of readings taken from the three flasks were discarded.</i>", "options": {"A": "'were' should be 'was'", "B": "'readings' should be 'reading'", "C": "'taken' should be 'which were taken'", "D": "'flasks' should be 'flask'"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Proofread the draft sentence below. Which of the four underlined words has been spelled wrongly?<br><i>The <u>occurence</u> of these <u>anomalies</u> was <u>recorded</u> in a <u>supplementary</u> table.</i>", "options": {"A": "anomalies", "B": "occurence", "C": "recorded", "D": "supplementary"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "A paragraph argues that sealed containers stay free of decay. Which of these sentences should be cut from it?", "options": {"A": "The glassblower who supplied the flasks had learned his trade in Bohemia.", "B": "Every flask that remained sealed was still clear after eleven weeks.", "C": "The flasks opened to the room clouded within four days.", "D": "The same result followed when the trial was repeated in a colder month."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which single sentence best combines the three short statements below without losing any information?<br><i>The flask was sealed. It was left for six weeks. It remained clear.</i>", "options": {"A": "The flask was sealed, it was left for six weeks, and it remained clear.", "B": "The flask, which was sealed, and which was left for six weeks, remained clear.", "C": "Sealed and then left for six weeks, the flask remained clear.", "D": "The flask was sealed and left for six weeks and remained clear."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which version of a claim is worded so that ONE counter-example could not overturn it?", "options": {"A": "Whenever a charge is removed, attendance rises.", "B": "Removing a charge always causes attendance to rise within a year.", "C": "No borough that removed the charge has ever seen attendance fall.", "D": "In nearly every borough that removed the charge, attendance rose within a year."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which of these instructions could a second experimenter repeat exactly as written?", "options": {"A": "The mixture is warmed gently for a while and then left to cool down.", "B": "The mixture is held at 60 degrees Celsius for fifteen minutes and then allowed to cool in still air.", "C": "The mixture is heated until it looks about right and then removed from the flame.", "D": "The mixture is brought to a fairly high temperature and cooled fairly quickly."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Read this sentence from a pamphlet against the licensing of books, published in 1644.<br><i>As good almost kill a man as kill a good book.</i><br>Which statement best identifies the THEME the writer is developing?", "options": {"A": "Suppressing a book destroys something living, because a book carries the reasoning of the mind that made it.", "B": "Books are more valuable possessions than most people are willing to admit.", "C": "Writers who publish dangerous opinions deserve to be punished severely.", "D": "Murder should be punished more heavily than the destruction of property."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Why does the writer stress that all twenty flasks were charged from one vessel and stood on the same bench at the same temperature?", "options": {"A": "So that the experiment would take up as little bench space as possible.", "B": "So that the infusion would be strong enough to putrefy quickly.", "C": "So that the flasks could all be boiled at the same moment in one operation.", "D": "So that the only difference left between the two sets is the sealing, and any difference in outcome must be traced to it."}, "fig": "", "passage": "<strong>A paper on the souring of infusions, read in 1877</strong><br><p><b>From a paper read to a provincial medical society, 1877.</b></p><p>The question before us is not whether an infusion of hay will putrefy. Every kitchen knows that it will. The question is whether the agents of that putrefaction arise within the liquid of themselves, as some able men still maintain, or whether they are carried into it from without. The dispute has run for a century on argument alone. It can be ended with a flask.</p><p>Twenty flasks were charged with the same infusion, drawn from one vessel so that no difference of composition could be alleged. All twenty were boiled for one hour. Ten were then sealed at the neck with the blowpipe while the vapour was still driving the air outward; the remaining ten were left open to the room. Nothing else distinguished the two sets. They stood side by side on the same bench, in the same light, at the same temperature, for eleven weeks.</p><p>The ten open flasks clouded, the earliest on the fourth day and the last within a fortnight. Of the ten sealed flasks, nine remained as clear at the end of the eleven weeks as on the day they were closed. The tenth clouded in the sixth week, and on examination its seal was found to be cracked across.</p><p>I lay some weight on that tenth flask. Had every sealed flask stayed clear, a critic might reasonably have replied that boiling and sealing together had altered the infusion in some way we had not thought of, so that it was no longer capable of putrefying at all. The cracked flask answers him. The same infusion, boiled and sealed in the same manner, putrefied the moment the air was let in. The liquid had lost nothing. It had merely been protected, and the protection failed.</p><p>Nothing in this proves that life never arises from what is not alive. It proves that in this liquid, in these eleven weeks, it did not, and that whoever says otherwise must now produce a flask of his own.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "The tenth sealed flask clouded. Why does the writer say he lays some weight on it?", "options": {"A": "It shows that his sealing technique was unreliable and needs improvement.", "B": "It proves that putrefaction can begin without any air reaching the liquid.", "C": "It shows that the boiled and sealed infusion could still putrefy, so the other nine were protected rather than made inert.", "D": "It suggests that eleven weeks was too short a period for the trial."}, "fig": "", "passage": "<strong>A paper on the souring of infusions, read in 1877</strong><br><p><b>From a paper read to a provincial medical society, 1877.</b></p><p>The question before us is not whether an infusion of hay will putrefy. Every kitchen knows that it will. The question is whether the agents of that putrefaction arise within the liquid of themselves, as some able men still maintain, or whether they are carried into it from without. The dispute has run for a century on argument alone. It can be ended with a flask.</p><p>Twenty flasks were charged with the same infusion, drawn from one vessel so that no difference of composition could be alleged. All twenty were boiled for one hour. Ten were then sealed at the neck with the blowpipe while the vapour was still driving the air outward; the remaining ten were left open to the room. Nothing else distinguished the two sets. They stood side by side on the same bench, in the same light, at the same temperature, for eleven weeks.</p><p>The ten open flasks clouded, the earliest on the fourth day and the last within a fortnight. Of the ten sealed flasks, nine remained as clear at the end of the eleven weeks as on the day they were closed. The tenth clouded in the sixth week, and on examination its seal was found to be cracked across.</p><p>I lay some weight on that tenth flask. Had every sealed flask stayed clear, a critic might reasonably have replied that boiling and sealing together had altered the infusion in some way we had not thought of, so that it was no longer capable of putrefying at all. The cracked flask answers him. The same infusion, boiled and sealed in the same manner, putrefied the moment the air was let in. The liquid had lost nothing. It had merely been protected, and the protection failed.</p><p>Nothing in this proves that life never arises from what is not alive. It proves that in this liquid, in these eleven weeks, it did not, and that whoever says otherwise must now produce a flask of his own.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "How does the final paragraph limit what the experiment is said to have shown?", "options": {"A": "It withdraws the conclusion and admits that the question is still entirely open.", "B": "It claims only that putrefaction did not arise unaided in this liquid over these weeks, not that it never can.", "C": "It claims that life can never arise from what is not alive.", "D": "It leaves the conclusion to the reader without stating one at all."}, "fig": "", "passage": "<strong>A paper on the souring of infusions, read in 1877</strong><br><p><b>From a paper read to a provincial medical society, 1877.</b></p><p>The question before us is not whether an infusion of hay will putrefy. Every kitchen knows that it will. The question is whether the agents of that putrefaction arise within the liquid of themselves, as some able men still maintain, or whether they are carried into it from without. The dispute has run for a century on argument alone. It can be ended with a flask.</p><p>Twenty flasks were charged with the same infusion, drawn from one vessel so that no difference of composition could be alleged. All twenty were boiled for one hour. Ten were then sealed at the neck with the blowpipe while the vapour was still driving the air outward; the remaining ten were left open to the room. Nothing else distinguished the two sets. They stood side by side on the same bench, in the same light, at the same temperature, for eleven weeks.</p><p>The ten open flasks clouded, the earliest on the fourth day and the last within a fortnight. Of the ten sealed flasks, nine remained as clear at the end of the eleven weeks as on the day they were closed. The tenth clouded in the sixth week, and on examination its seal was found to be cracked across.</p><p>I lay some weight on that tenth flask. Had every sealed flask stayed clear, a critic might reasonably have replied that boiling and sealing together had altered the infusion in some way we had not thought of, so that it was no longer capable of putrefying at all. The cracked flask answers him. The same infusion, boiled and sealed in the same manner, putrefied the moment the air was let in. The liquid had lost nothing. It had merely been protected, and the protection failed.</p><p>Nothing in this proves that life never arises from what is not alive. It proves that in this liquid, in these eleven weeks, it did not, and that whoever says otherwise must now produce a flask of his own.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "The first paragraph ends: 'It can be ended with a flask.' What is the effect of that sentence after the long ones before it?", "options": {"A": "It admits that the writer has only one flask and so cannot test the question properly.", "B": "It signals that the writer is about to change the subject.", "C": "The abruptness makes the point: a dispute of a century is to be settled by evidence rather than by more argument.", "D": "It shows that the writer regards the question as unimportant."}, "fig": "", "passage": "<strong>A paper on the souring of infusions, read in 1877</strong><br><p><b>From a paper read to a provincial medical society, 1877.</b></p><p>The question before us is not whether an infusion of hay will putrefy. Every kitchen knows that it will. The question is whether the agents of that putrefaction arise within the liquid of themselves, as some able men still maintain, or whether they are carried into it from without. The dispute has run for a century on argument alone. It can be ended with a flask.</p><p>Twenty flasks were charged with the same infusion, drawn from one vessel so that no difference of composition could be alleged. All twenty were boiled for one hour. Ten were then sealed at the neck with the blowpipe while the vapour was still driving the air outward; the remaining ten were left open to the room. Nothing else distinguished the two sets. They stood side by side on the same bench, in the same light, at the same temperature, for eleven weeks.</p><p>The ten open flasks clouded, the earliest on the fourth day and the last within a fortnight. Of the ten sealed flasks, nine remained as clear at the end of the eleven weeks as on the day they were closed. The tenth clouded in the sixth week, and on examination its seal was found to be cracked across.</p><p>I lay some weight on that tenth flask. Had every sealed flask stayed clear, a critic might reasonably have replied that boiling and sealing together had altered the infusion in some way we had not thought of, so that it was no longer capable of putrefying at all. The cracked flask answers him. The same infusion, boiled and sealed in the same manner, putrefied the moment the air was let in. The liquid had lost nothing. It had merely been protected, and the protection failed.</p><p>Nothing in this proves that life never arises from what is not alive. It proves that in this liquid, in these eleven weeks, it did not, and that whoever says otherwise must now produce a flask of his own.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which sequence describes the order in which the paper sets out its material?", "options": {"A": "The conclusion first, then the results, then the method that produced them.", "B": "A history of the dispute, then a survey of other investigators' findings, then a proposal.", "C": "The method, then a second method, then a comparison of the two.", "D": "The question at issue, then the method, then the results, then the objection answered, then a carefully bounded conclusion."}, "fig": "", "passage": "<strong>A paper on the souring of infusions, read in 1877</strong><br><p><b>From a paper read to a provincial medical society, 1877.</b></p><p>The question before us is not whether an infusion of hay will putrefy. Every kitchen knows that it will. The question is whether the agents of that putrefaction arise within the liquid of themselves, as some able men still maintain, or whether they are carried into it from without. The dispute has run for a century on argument alone. It can be ended with a flask.</p><p>Twenty flasks were charged with the same infusion, drawn from one vessel so that no difference of composition could be alleged. All twenty were boiled for one hour. Ten were then sealed at the neck with the blowpipe while the vapour was still driving the air outward; the remaining ten were left open to the room. Nothing else distinguished the two sets. They stood side by side on the same bench, in the same light, at the same temperature, for eleven weeks.</p><p>The ten open flasks clouded, the earliest on the fourth day and the last within a fortnight. Of the ten sealed flasks, nine remained as clear at the end of the eleven weeks as on the day they were closed. The tenth clouded in the sixth week, and on examination its seal was found to be cracked across.</p><p>I lay some weight on that tenth flask. Had every sealed flask stayed clear, a critic might reasonably have replied that boiling and sealing together had altered the infusion in some way we had not thought of, so that it was no longer capable of putrefying at all. The cracked flask answers him. The same infusion, boiled and sealed in the same manner, putrefied the moment the air was let in. The liquid had lost nothing. It had merely been protected, and the protection failed.</p><p>Nothing in this proves that life never arises from what is not alive. It proves that in this liquid, in these eleven weeks, it did not, and that whoever says otherwise must now produce a flask of his own.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the whole English section, reading and writing together, is 85 minutes at Stage 6, and the writing is typed on a keyboard. Choose ONE of the two tasks below. They belong to two different text types. TASK 1 is an ARGUMENTATIVE ESSAY: a contestable claim, defended with reasoning and evidence, with the strongest objection stated fairly and answered. TASK 2 asks for a SCIENTIFIC PROCESS OR PROCEDURE: an impersonal, ordered and precise account of how something is done or how it works, of the kind the 1877 paper above sets out in its second paragraph.", "label": "", "body": "", "hint": "For TASK 1, put your claim where a reader cannot miss it, give one point per paragraph with its reasoning or evidence, link the paragraphs so the argument moves forward, and answer the objection you find hardest rather than the one that is easiest to knock down. For TASK 2, keep yourself out of the writing and use the PASSIVE voice: 'the flasks were sealed', not 'we sealed the flasks'. Put the steps in the order they occur and mark that order with sequencing connectives such as first, next, once, until, thereafter and finally. Be exact about number, time and temperature, and say what is held constant as well as what is changed. Whichever task you choose, vary your sentence lengths, and read the finished piece back once for spelling slips and for verbs that do not agree with their subjects.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "TASK 1\n'An experiment that cannot fail proves nothing.' Argue for or against this claim. State your position, defend it with two developed reasons, draw one example from science or from public life rather than from your own experience, state and answer the strongest objection you can find, and close by saying exactly how far your position reaches.", "partB": "TASK 2\nWrite the method for an experiment that would test whether bread kept in a sealed container stays free of mould for longer than bread left in the open air. Set out the apparatus and materials, the steps in the order they must be carried out, what is measured and how often, what is deliberately kept the same between the two sets, and the precautions that would keep the comparison fair. Finish with a short paragraph explaining how the results should be interpreted and what they could not show."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 English Drill 3</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
