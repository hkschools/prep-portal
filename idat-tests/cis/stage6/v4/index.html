<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}

  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "6", VERSION = "4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "In \"the committee moved quickly to <u>counter</u> the objection\", what part of speech is the underlined word?", "options": {"A": "noun", "B": "adjective", "C": "verb", "D": "preposition"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "In \"she answered the question <u>more carefully than anyone expected</u>\", the underlined group functions as", "options": {"A": "a noun phrase", "B": "an adverbial", "C": "a relative clause", "D": "a complement"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which version removes the redundancy without losing meaning?", "options": {"A": "The two findings were identical.", "B": "The two findings were both exactly identical to each other.", "C": "The two findings were exactly the same as each other.", "D": "Both of the two findings were identical."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which version is clearer for a reader?", "options": {"A": "The panel's decision was the rejection of the appeal, the reason being the passing of the deadline.", "B": "A rejection of the appeal was the outcome of the panel's deliberation, deadline expiry having occurred.", "C": "Rejection of the appeal followed from deadline non-compliance by the appellant.", "D": "The panel decided to reject the appeal because the deadline had passed."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which sentence inverts the conditional correctly?", "options": {"A": "Had the sample been larger, the difference reached significance.", "B": "If had the sample been larger, the difference would have reached significance.", "C": "Had the sample been larger, the difference would have reached significance.", "D": "Have the sample been larger, the difference would have reached significance."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which sentence agrees correctly?", "options": {"A": "The set of readings taken during the two trials is stored on the server.", "B": "The set of readings taken during the two trials are stored on the server.", "C": "The set of readings taken during the two trials were stored on the server, which are encrypted.", "D": "The sets of readings taken during the trial is stored on the server."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which sentence uses \"whom\" correctly?", "options": {"A": "The reviewer whom sent the paper back declined to comment.", "B": "The reviewer to whom the paper was sent declined to comment.", "C": "The reviewer who the paper was sent to declined to comment, and whom is now retired.", "D": "The reviewer whose the paper was sent declined to comment."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence reports the earlier finding correctly?", "options": {"A": "The authors noted that the effect has disappeared once the outlier was removed.", "B": "The authors note that the effect had disappeared once the outlier is removed.", "C": "The authors had noted that the effect disappears once the outlier had been removed.", "D": "The authors noted that the effect had disappeared once the outlier was removed."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "The house style forbids dashes. Which version of \"the result, and this surprised everyone, was reversed\" is the cleanest repair?", "options": {"A": "The result and this surprised everyone was reversed.", "B": "The result, which surprised everyone, was reversed.", "C": "The result; and this surprised everyone; was reversed.", "D": "The result: and this surprised everyone: was reversed."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which sentence uses an absolute construction correctly?", "options": {"A": "The calibration completing, the team began recording.", "B": "Completing the calibration, the recordings began.", "C": "The calibration was complete, the team began recording.", "D": "The calibration complete, the team began recording."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "In a report, which sentence claims the MOST?", "options": {"A": "The data are consistent with the treatment working.", "B": "The data suggest that the treatment may work.", "C": "The data show that the treatment works.", "D": "The data do not rule out that the treatment works."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which sentence places the correlative pair correctly?", "options": {"A": "The method is used not only in geology but also in archaeology.", "B": "The method is not only used in geology but also in archaeology.", "C": "The method not only is used in geology but also archaeology.", "D": "Not only the method is used in geology but also in archaeology."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "In \"what the second trial showed was that the first had been underpowered\", the clause <u>that the first had been underpowered</u> functions as", "options": {"A": "the subject of the sentence", "B": "an adverbial of reason", "C": "the complement of the verb \"was\"", "D": "a relative clause"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which sentence keeps a consistent formal register?", "options": {"A": "The discrepancy has not yet been explained, and someone needs to sort it out.", "B": "Nobody has a clue why the numbers differ, and further work is required.", "C": "The discrepancy remains a total mystery, so we had better crack on.", "D": "The discrepancy has not yet been explained, and further work is required."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which word names the underlying idea a whole text keeps returning to?", "options": {"A": "theme", "B": "plot", "C": "register", "D": "motif"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "\"He filed the letter, made the tea and told his daughter her mother had died.\" The main EFFECT of the sentence's structure is to", "options": {"A": "show that the father did not care about the news", "B": "make the news land harder by placing it among ordinary tasks", "C": "suggest that the events happened over a long period", "D": "emphasise how organised the father was"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which word describes writing that treats a serious subject with deliberate lightness?", "options": {"A": "solemn", "B": "effusive", "C": "wry", "D": "didactic"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "In a scientific procedure, which word most precisely describes the amount of a substance added?", "options": {"A": "number", "B": "quantity", "C": "size", "D": "volume"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "In describing a procedure, which connective best signals that one step depends on the one before being finished?", "options": {"A": "Once", "B": "Meanwhile", "C": "Similarly", "D": "In contrast"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Which word describes a result that is repeatable by other researchers?", "options": {"A": "plausible", "B": "substantial", "C": "provisional", "D": "reproducible"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "\"The later study did not overturn the finding so much as <u>attenuate</u> it.\" \"Attenuate\" means", "options": {"A": "confirm it in more detail", "B": "explain the reason behind it", "C": "reduce its strength without removing it", "D": "publish it more widely"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Which word describes a conclusion drawn responsibly from limited evidence?", "options": {"A": "timid", "B": "tentative", "C": "evasive", "D": "half-hearted"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "The words \"chronology\", \"anachronism\" and \"synchronise\" share a root meaning", "options": {"A": "place", "B": "writing", "C": "measure", "D": "time"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "Which word most naturally completes \"the study ____ several limitations\"?", "options": {"A": "acknowledges", "B": "admits", "C": "confesses", "D": "reveals"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Which of these is spelled correctly?", "options": {"A": "supercede", "B": "superceed", "C": "supersede", "D": "supersead"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which word names the duty to give an account of a decision to those affected by it?", "options": {"A": "responsibility", "B": "transparency", "C": "integrity", "D": "accountability"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "Which verb most precisely describes setting aside an earlier ruling?", "options": {"A": "rescind", "B": "dispute", "C": "postpone", "D": "interpret"}, "fig": "", "passage": "", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "Which word describes a sample that does not represent the population it was drawn from?", "options": {"A": "small", "B": "biased", "C": "anonymous", "D": "inconsistent"}, "fig": "", "passage": "", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "Which statement best expresses the CENTRAL IDEA of Text A?", "options": {"A": "Perfectionism prevents talented people from ever publishing their work.", "B": "Translation is impossible because no version can be faithful to the original.", "C": "A daughter can only understand a parent after that parent has died.", "D": "A task pursued without any intention of completing it can be a form of understanding rather than a failure."}, "fig": "", "passage": "<strong>The Translator</strong><br>Her father had translated the same poet for forty-one years, and had published nothing. The manuscripts went into the second drawer of the desk, each version dated, none of them crossed out. When Mira asked him once why he did not send them, he said that he had not finished, and then, after a while, that he did not think he would, and then that this was not the same as failing.\n\nShe read them after he died, in order, and found that he was right. The early versions were confident and wrong. They took the poet's short lines and made them elegant, and in doing so removed exactly the thing the poet had been doing, which was to stop before the sentence was comfortable. By the fifteenth year the elegance was gone. By the thirtieth the lines had become so bare that Mira, reading them cold, could not have said they were poetry at all. And then, in the last four or five, something came back, but it was not the elegance. It was a kind of attention.\n\nShe had thought, before she read them, that she would find a man defeated by a task. What she found was a man who had understood, earlier than she had, that the task was the point and that finishing it would have ended something he had no wish to end. He had not been trying to produce a book. He had been trying to hear the poet, and each year he heard a little more, and each year the amount he could not hear grew larger too, because hearing more shows you how much there is.\n\nMira published nothing either. She copied the last version out by hand, once a year, on the same date, and each time she changed one or two words. She kept the copies in the second drawer. She does not expect to finish.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "What is the function of the second paragraph of Text A?", "options": {"A": "It traces the change in the translations so that the change in the translator becomes visible.", "B": "It explains why the early versions were the best ones.", "C": "It establishes that Mira is a better reader of poetry than her father was.", "D": "It provides technical detail about how translation is done."}, "fig": "", "passage": "<strong>The Translator</strong><br>Her father had translated the same poet for forty-one years, and had published nothing. The manuscripts went into the second drawer of the desk, each version dated, none of them crossed out. When Mira asked him once why he did not send them, he said that he had not finished, and then, after a while, that he did not think he would, and then that this was not the same as failing.\n\nShe read them after he died, in order, and found that he was right. The early versions were confident and wrong. They took the poet's short lines and made them elegant, and in doing so removed exactly the thing the poet had been doing, which was to stop before the sentence was comfortable. By the fifteenth year the elegance was gone. By the thirtieth the lines had become so bare that Mira, reading them cold, could not have said they were poetry at all. And then, in the last four or five, something came back, but it was not the elegance. It was a kind of attention.\n\nShe had thought, before she read them, that she would find a man defeated by a task. What she found was a man who had understood, earlier than she had, that the task was the point and that finishing it would have ended something he had no wish to end. He had not been trying to produce a book. He had been trying to hear the poet, and each year he heard a little more, and each year the amount he could not hear grew larger too, because hearing more shows you how much there is.\n\nMira published nothing either. She copied the last version out by hand, once a year, on the same date, and each time she changed one or two words. She kept the copies in the second drawer. She does not expect to finish.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What does the sentence \"each year the amount he could not hear grew larger too\" suggest?", "options": {"A": "His hearing declined as he grew older.", "B": "Understanding more of the poet revealed how much more there was to understand.", "C": "The poet's later work was more difficult than the early work.", "D": "He became less able to concentrate as the years passed."}, "fig": "", "passage": "<strong>The Translator</strong><br>Her father had translated the same poet for forty-one years, and had published nothing. The manuscripts went into the second drawer of the desk, each version dated, none of them crossed out. When Mira asked him once why he did not send them, he said that he had not finished, and then, after a while, that he did not think he would, and then that this was not the same as failing.\n\nShe read them after he died, in order, and found that he was right. The early versions were confident and wrong. They took the poet's short lines and made them elegant, and in doing so removed exactly the thing the poet had been doing, which was to stop before the sentence was comfortable. By the fifteenth year the elegance was gone. By the thirtieth the lines had become so bare that Mira, reading them cold, could not have said they were poetry at all. And then, in the last four or five, something came back, but it was not the elegance. It was a kind of attention.\n\nShe had thought, before she read them, that she would find a man defeated by a task. What she found was a man who had understood, earlier than she had, that the task was the point and that finishing it would have ended something he had no wish to end. He had not been trying to produce a book. He had been trying to hear the poet, and each year he heard a little more, and each year the amount he could not hear grew larger too, because hearing more shows you how much there is.\n\nMira published nothing either. She copied the last version out by hand, once a year, on the same date, and each time she changed one or two words. She kept the copies in the second drawer. She does not expect to finish.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "The last paragraph mirrors the father's practice almost exactly. The EFFECT of this is to", "options": {"A": "suggest that Mira has been unable to escape her father's influence", "B": "imply that the translations will eventually be published by someone else", "C": "show that Mira has accepted the same understanding rather than merely inherited a habit", "D": "show that Mira is a more disciplined worker than her father was"}, "fig": "", "passage": "<strong>The Translator</strong><br>Her father had translated the same poet for forty-one years, and had published nothing. The manuscripts went into the second drawer of the desk, each version dated, none of them crossed out. When Mira asked him once why he did not send them, he said that he had not finished, and then, after a while, that he did not think he would, and then that this was not the same as failing.\n\nShe read them after he died, in order, and found that he was right. The early versions were confident and wrong. They took the poet's short lines and made them elegant, and in doing so removed exactly the thing the poet had been doing, which was to stop before the sentence was comfortable. By the fifteenth year the elegance was gone. By the thirtieth the lines had become so bare that Mira, reading them cold, could not have said they were poetry at all. And then, in the last four or five, something came back, but it was not the elegance. It was a kind of attention.\n\nShe had thought, before she read them, that she would find a man defeated by a task. What she found was a man who had understood, earlier than she had, that the task was the point and that finishing it would have ended something he had no wish to end. He had not been trying to produce a book. He had been trying to hear the poet, and each year he heard a little more, and each year the amount he could not hear grew larger too, because hearing more shows you how much there is.\n\nMira published nothing either. She copied the last version out by hand, once a year, on the same date, and each time she changed one or two words. She kept the copies in the second drawer. She does not expect to finish.", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "In Text A, \"the elegance was gone\" is presented as", "options": {"A": "a gain rather than a loss", "B": "a sign that his ability had declined", "C": "evidence that he had lost interest in the work", "D": "a change he later regretted and reversed"}, "fig": "", "passage": "<strong>The Translator</strong><br>Her father had translated the same poet for forty-one years, and had published nothing. The manuscripts went into the second drawer of the desk, each version dated, none of them crossed out. When Mira asked him once why he did not send them, he said that he had not finished, and then, after a while, that he did not think he would, and then that this was not the same as failing.\n\nShe read them after he died, in order, and found that he was right. The early versions were confident and wrong. They took the poet's short lines and made them elegant, and in doing so removed exactly the thing the poet had been doing, which was to stop before the sentence was comfortable. By the fifteenth year the elegance was gone. By the thirtieth the lines had become so bare that Mira, reading them cold, could not have said they were poetry at all. And then, in the last four or five, something came back, but it was not the elegance. It was a kind of attention.\n\nShe had thought, before she read them, that she would find a man defeated by a task. What she found was a man who had understood, earlier than she had, that the task was the point and that finishing it would have ended something he had no wish to end. He had not been trying to produce a book. He had been trying to hear the poet, and each year he heard a little more, and each year the amount he could not hear grew larger too, because hearing more shows you how much there is.\n\nMira published nothing either. She copied the last version out by hand, once a year, on the same date, and each time she changed one or two words. She kept the copies in the second drawer. She does not expect to finish.", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "Which detail most directly supports the idea that the father distinguished not finishing from failing?", "options": {"A": "He kept the manuscripts in a drawer rather than on a shelf.", "B": "He translated only one poet for the whole period.", "C": "He dated every version and crossed none of them out.", "D": "He answered Mira's question in three stages."}, "fig": "", "passage": "<strong>The Translator</strong><br>Her father had translated the same poet for forty-one years, and had published nothing. The manuscripts went into the second drawer of the desk, each version dated, none of them crossed out. When Mira asked him once why he did not send them, he said that he had not finished, and then, after a while, that he did not think he would, and then that this was not the same as failing.\n\nShe read them after he died, in order, and found that he was right. The early versions were confident and wrong. They took the poet's short lines and made them elegant, and in doing so removed exactly the thing the poet had been doing, which was to stop before the sentence was comfortable. By the fifteenth year the elegance was gone. By the thirtieth the lines had become so bare that Mira, reading them cold, could not have said they were poetry at all. And then, in the last four or five, something came back, but it was not the elegance. It was a kind of attention.\n\nShe had thought, before she read them, that she would find a man defeated by a task. What she found was a man who had understood, earlier than she had, that the task was the point and that finishing it would have ended something he had no wish to end. He had not been trying to produce a book. He had been trying to hear the poet, and each year he heard a little more, and each year the amount he could not hear grew larger too, because hearing more shows you how much there is.\n\nMira published nothing either. She copied the last version out by hand, once a year, on the same date, and each time she changed one or two words. She kept the copies in the second drawer. She does not expect to finish.", "qnum": "34"}, {"n": "36", "type": "mcq", "section": "English", "stem": "According to Text B, what happens IMMEDIATELY BEFORE the sample is measured in the spectrometer?", "options": {"A": "It is cleaned to remove modern contamination.", "B": "It is converted into a form the instrument can handle, usually graphite.", "C": "The raw result is calibrated against tree rings.", "D": "Its half-life is calculated from the decay rate."}, "fig": "", "passage": "<strong>How Radiocarbon Dating Works</strong><br>Every living thing takes in carbon from its surroundings, and a small, fixed proportion of that carbon is the unstable form carbon-14. While the organism is alive, the carbon-14 it loses to radioactive decay is continually replaced, so the proportion inside it stays the same as the proportion outside. When it dies, the intake stops and the replacement stops with it. From that moment the carbon-14 only decreases, at a rate that does not depend on temperature, pressure or anything else the sample subsequently experiences.\n\nThat rate is what makes dating possible. Carbon-14 has a half-life of about 5,730 years, meaning that half of whatever is present decays over that period, half of the remainder over the next, and so on. Measuring how much is left therefore gives an estimate of how long ago the intake stopped.\n\nThe procedure runs in four stages. First the sample is cleaned, because a single fibre of modern root material can contaminate a measurement badly, and modern carbon has far more carbon-14 than ancient carbon does. Second, the cleaned sample is converted to a form the instrument can handle, usually graphite. Third, an accelerator mass spectrometer counts the carbon-14 atoms directly rather than waiting for them to decay, which is what allows a useful measurement from a few milligrams. Fourth, the raw result is calibrated.\n\nThat fourth stage is the one most often left out of summaries, and it matters. The proportion of carbon-14 in the atmosphere has not in fact been constant across the centuries; it varies with solar activity and, more recently, with the burning of fossil fuels and with nuclear testing. Calibration converts the raw radiocarbon age into a calendar age using tree rings and other records whose true dates are known independently. Without it, a raw age can be out by several centuries.\n\nThe method has limits. Beyond about 50,000 years so little carbon-14 remains that the measurement cannot be distinguished from background, and the technique says nothing at all about material that never lived.", "qnum": "35"}, {"n": "37", "type": "mcq", "section": "English", "stem": "According to Text B, why must the sample be cleaned first?", "options": {"A": "Dirt on the sample would damage the spectrometer.", "B": "Cleaning slows the rate of radioactive decay.", "C": "The instrument cannot detect carbon-14 in an uncleaned sample.", "D": "Modern carbon contains far more carbon-14 than ancient carbon, so a small amount distorts the result badly."}, "fig": "", "passage": "<strong>How Radiocarbon Dating Works</strong><br>Every living thing takes in carbon from its surroundings, and a small, fixed proportion of that carbon is the unstable form carbon-14. While the organism is alive, the carbon-14 it loses to radioactive decay is continually replaced, so the proportion inside it stays the same as the proportion outside. When it dies, the intake stops and the replacement stops with it. From that moment the carbon-14 only decreases, at a rate that does not depend on temperature, pressure or anything else the sample subsequently experiences.\n\nThat rate is what makes dating possible. Carbon-14 has a half-life of about 5,730 years, meaning that half of whatever is present decays over that period, half of the remainder over the next, and so on. Measuring how much is left therefore gives an estimate of how long ago the intake stopped.\n\nThe procedure runs in four stages. First the sample is cleaned, because a single fibre of modern root material can contaminate a measurement badly, and modern carbon has far more carbon-14 than ancient carbon does. Second, the cleaned sample is converted to a form the instrument can handle, usually graphite. Third, an accelerator mass spectrometer counts the carbon-14 atoms directly rather than waiting for them to decay, which is what allows a useful measurement from a few milligrams. Fourth, the raw result is calibrated.\n\nThat fourth stage is the one most often left out of summaries, and it matters. The proportion of carbon-14 in the atmosphere has not in fact been constant across the centuries; it varies with solar activity and, more recently, with the burning of fossil fuels and with nuclear testing. Calibration converts the raw radiocarbon age into a calendar age using tree rings and other records whose true dates are known independently. Without it, a raw age can be out by several centuries.\n\nThe method has limits. Beyond about 50,000 years so little carbon-14 remains that the measurement cannot be distinguished from background, and the technique says nothing at all about material that never lived.", "qnum": "36"}, {"n": "38", "type": "mcq", "section": "English", "stem": "Why does the writer of Text B single out the fourth stage?", "options": {"A": "Because it is the most expensive stage of the procedure.", "B": "Because it is the stage most likely to be performed incorrectly.", "C": "Because it is usually omitted from summaries although leaving it out can shift a date by centuries", "D": "Because it was the last stage of the method to be developed."}, "fig": "", "passage": "<strong>How Radiocarbon Dating Works</strong><br>Every living thing takes in carbon from its surroundings, and a small, fixed proportion of that carbon is the unstable form carbon-14. While the organism is alive, the carbon-14 it loses to radioactive decay is continually replaced, so the proportion inside it stays the same as the proportion outside. When it dies, the intake stops and the replacement stops with it. From that moment the carbon-14 only decreases, at a rate that does not depend on temperature, pressure or anything else the sample subsequently experiences.\n\nThat rate is what makes dating possible. Carbon-14 has a half-life of about 5,730 years, meaning that half of whatever is present decays over that period, half of the remainder over the next, and so on. Measuring how much is left therefore gives an estimate of how long ago the intake stopped.\n\nThe procedure runs in four stages. First the sample is cleaned, because a single fibre of modern root material can contaminate a measurement badly, and modern carbon has far more carbon-14 than ancient carbon does. Second, the cleaned sample is converted to a form the instrument can handle, usually graphite. Third, an accelerator mass spectrometer counts the carbon-14 atoms directly rather than waiting for them to decay, which is what allows a useful measurement from a few milligrams. Fourth, the raw result is calibrated.\n\nThat fourth stage is the one most often left out of summaries, and it matters. The proportion of carbon-14 in the atmosphere has not in fact been constant across the centuries; it varies with solar activity and, more recently, with the burning of fossil fuels and with nuclear testing. Calibration converts the raw radiocarbon age into a calendar age using tree rings and other records whose true dates are known independently. Without it, a raw age can be out by several centuries.\n\nThe method has limits. Beyond about 50,000 years so little carbon-14 remains that the measurement cannot be distinguished from background, and the technique says nothing at all about material that never lived.", "qnum": "37"}, {"n": "39", "type": "mcq", "section": "English", "stem": "What can be inferred from the statement that the decay rate does not depend on temperature or pressure?", "options": {"A": "A sample's storage conditions since death do not affect the date it yields.", "B": "Carbon-14 decays at the same rate as every other radioactive isotope.", "C": "The proportion of carbon-14 in the atmosphere has always been constant.", "D": "Samples can be dated without being cleaned first."}, "fig": "", "passage": "<strong>How Radiocarbon Dating Works</strong><br>Every living thing takes in carbon from its surroundings, and a small, fixed proportion of that carbon is the unstable form carbon-14. While the organism is alive, the carbon-14 it loses to radioactive decay is continually replaced, so the proportion inside it stays the same as the proportion outside. When it dies, the intake stops and the replacement stops with it. From that moment the carbon-14 only decreases, at a rate that does not depend on temperature, pressure or anything else the sample subsequently experiences.\n\nThat rate is what makes dating possible. Carbon-14 has a half-life of about 5,730 years, meaning that half of whatever is present decays over that period, half of the remainder over the next, and so on. Measuring how much is left therefore gives an estimate of how long ago the intake stopped.\n\nThe procedure runs in four stages. First the sample is cleaned, because a single fibre of modern root material can contaminate a measurement badly, and modern carbon has far more carbon-14 than ancient carbon does. Second, the cleaned sample is converted to a form the instrument can handle, usually graphite. Third, an accelerator mass spectrometer counts the carbon-14 atoms directly rather than waiting for them to decay, which is what allows a useful measurement from a few milligrams. Fourth, the raw result is calibrated.\n\nThat fourth stage is the one most often left out of summaries, and it matters. The proportion of carbon-14 in the atmosphere has not in fact been constant across the centuries; it varies with solar activity and, more recently, with the burning of fossil fuels and with nuclear testing. Calibration converts the raw radiocarbon age into a calendar age using tree rings and other records whose true dates are known independently. Without it, a raw age can be out by several centuries.\n\nThe method has limits. Beyond about 50,000 years so little carbon-14 remains that the measurement cannot be distinguished from background, and the technique says nothing at all about material that never lived.", "qnum": "38"}, {"n": "40", "type": "mcq", "section": "English", "stem": "According to Text B, which of these could NOT be dated by this method?", "options": {"A": "a wooden beam from a house built 800 years ago", "B": "a stone tool with no organic material on it", "C": "a fragment of bone about 20,000 years old", "D": "a seed found at the bottom of a lake"}, "fig": "", "passage": "<strong>How Radiocarbon Dating Works</strong><br>Every living thing takes in carbon from its surroundings, and a small, fixed proportion of that carbon is the unstable form carbon-14. While the organism is alive, the carbon-14 it loses to radioactive decay is continually replaced, so the proportion inside it stays the same as the proportion outside. When it dies, the intake stops and the replacement stops with it. From that moment the carbon-14 only decreases, at a rate that does not depend on temperature, pressure or anything else the sample subsequently experiences.\n\nThat rate is what makes dating possible. Carbon-14 has a half-life of about 5,730 years, meaning that half of whatever is present decays over that period, half of the remainder over the next, and so on. Measuring how much is left therefore gives an estimate of how long ago the intake stopped.\n\nThe procedure runs in four stages. First the sample is cleaned, because a single fibre of modern root material can contaminate a measurement badly, and modern carbon has far more carbon-14 than ancient carbon does. Second, the cleaned sample is converted to a form the instrument can handle, usually graphite. Third, an accelerator mass spectrometer counts the carbon-14 atoms directly rather than waiting for them to decay, which is what allows a useful measurement from a few milligrams. Fourth, the raw result is calibrated.\n\nThat fourth stage is the one most often left out of summaries, and it matters. The proportion of carbon-14 in the atmosphere has not in fact been constant across the centuries; it varies with solar activity and, more recently, with the burning of fossil fuels and with nuclear testing. Calibration converts the raw radiocarbon age into a calendar age using tree rings and other records whose true dates are known independently. Without it, a raw age can be out by several centuries.\n\nThe method has limits. Beyond about 50,000 years so little carbon-14 remains that the measurement cannot be distinguished from background, and the technique says nothing at all about material that never lived.", "qnum": "39"}, {"n": "41", "type": "mcq", "section": "English", "stem": "Which sentence best summarises Text B as a whole?", "options": {"A": "Carbon-14 decays at a known rate, which allows the age of any object to be calculated.", "B": "Contamination is the greatest problem facing radiocarbon dating.", "C": "Radiocarbon dates are unreliable because the atmosphere has changed over time.", "D": "A known decay rate makes dating possible, four stages turn a sample into a date, and calibration and the age limit define what the method can deliver."}, "fig": "", "passage": "<strong>How Radiocarbon Dating Works</strong><br>Every living thing takes in carbon from its surroundings, and a small, fixed proportion of that carbon is the unstable form carbon-14. While the organism is alive, the carbon-14 it loses to radioactive decay is continually replaced, so the proportion inside it stays the same as the proportion outside. When it dies, the intake stops and the replacement stops with it. From that moment the carbon-14 only decreases, at a rate that does not depend on temperature, pressure or anything else the sample subsequently experiences.\n\nThat rate is what makes dating possible. Carbon-14 has a half-life of about 5,730 years, meaning that half of whatever is present decays over that period, half of the remainder over the next, and so on. Measuring how much is left therefore gives an estimate of how long ago the intake stopped.\n\nThe procedure runs in four stages. First the sample is cleaned, because a single fibre of modern root material can contaminate a measurement badly, and modern carbon has far more carbon-14 than ancient carbon does. Second, the cleaned sample is converted to a form the instrument can handle, usually graphite. Third, an accelerator mass spectrometer counts the carbon-14 atoms directly rather than waiting for them to decay, which is what allows a useful measurement from a few milligrams. Fourth, the raw result is calibrated.\n\nThat fourth stage is the one most often left out of summaries, and it matters. The proportion of carbon-14 in the atmosphere has not in fact been constant across the centuries; it varies with solar activity and, more recently, with the burning of fossil fuels and with nuclear testing. Calibration converts the raw radiocarbon age into a calendar age using tree rings and other records whose true dates are known independently. Without it, a raw age can be out by several centuries.\n\nThe method has limits. Beyond about 50,000 years so little carbon-14 remains that the measurement cannot be distinguished from background, and the technique says nothing at all about material that never lived.", "qnum": "40"}, {"n": "42", "type": "writing", "section": "English Writing", "intro": "This is a Stage 6 writing task and it offers two DIFFERENT text types. Task 1 is an ARGUMENTATIVE essay: defend a claim with reasoning and evidence and answer the strongest objection to it. Task 2 is an explanation of a PROCESS OR PROCEDURE: set out the stages in order, make each step's purpose clear, and write for a reader who does not already know the subject. Before you finish, edit your own work: cut repetition, turn heavy noun phrases back into verbs, and check that every sentence says what you meant.", "label": "", "body": "Choose ONE of the following: (1) 'Work that is never finished is not worth doing.' To what extent do you agree? Argue your position and answer the strongest objection to it. (2) Explain, for a reader who has never done it, how a process or procedure you know well is carried out from start to finish. Make clear at each stage why that step is necessary and what would go wrong if it were skipped.", "hint": "Write five or six paragraphs. If you choose Task 1, state your claim, develop at least two reasons, answer an objection and conclude. If you choose Task 2, set the stages out in order and explain the purpose of each. Check your spelling, punctuation and grammar, and re-read for anything you can cut.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "43", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A rectangular room measures 8 m by 6 m and is 4 m high. What is the length of the longest straight rod that will fit inside it, to one decimal place?", "options": {"A": "10.0 m", "B": "10.8 m", "C": "18.0 m", "D": "11.7 m"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><rect x=\"45\" y=\"75\" width=\"120\" height=\"75\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"45,75 75,45 195,45 165,75\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"165,75 195,45 195,120 165,150\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></svg>", "passage": "", "qnum": "1"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A ladder 5.2 m long leans against a vertical wall with its foot 2.0 m from the base of the wall. How far up the wall does it reach, to one decimal place?", "options": {"A": "5.6 m", "B": "3.2 m", "C": "4.8 m", "D": "2.6 m"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In the triangle shown, AB = 7 cm, AC = 9 cm and the angle at A is 60 degrees. How long is BC, to one decimal place?", "options": {"A": "8.2 m", "B": "11.4 m", "C": "16.0 m", "D": "2.0 m"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" h , "options": {"A": "5", "B": "20", "C": "32", "D": "10"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "For which value of k does x<sup>2</sup> + 6x + k = 0 have NO real roots?", "options": {"A": "k = 9", "B": "k = 10", "C": "k = 8", "D": "k = 0"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "One root of a quadratic equation with real coefficients is 3 - 2i. What is the other root?", "options": {"A": "3 + 2i", "B": "-3 + 2i", "C": "-3 - 2i", "D": "2 - 3i"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out (4 + 3i)(2 - i).", "options": {"A": "8 - 3i", "B": "11 + 2i", "C": "5 + 2i", "D": "11 - 2i"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What is the determinant of the matrix shown?", "options": {"A": "26", "B": "2", "C": "12", "D": "-2"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"168\" height=\"104\" viewBox=\"0 0 168 104\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"168\" height=\"104\" fill=\"white\"/><text x=\"10\" y=\"57\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">M =</text><path d=\"M60,18 L52,18 L52,86 L60,86\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M148,18 L156,18 L156,86 L148,86\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"81\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">3</text><text x=\"127\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">2</text><text x=\"81\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">7</text><text x=\"127\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">4</text></svg>", "passage": "", "qnum": "15"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "If A is a 2 by 3 matrix and B is a 3 by 4 matrix, what are the dimensions of the product AB?", "options": {"A": "3 by 3", "B": "4 by 2", "C": "2 by 4", "D": "the product is not defined"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A card is drawn from a standard 52-card pack. Event A is \"the card is a heart\" and event B is \"the card is a king\". Are A and B independent?", "options": {"A": "Independent", "B": "Dependent"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A bag holds 4 white and 6 black beads. Two beads are drawn without replacement. What is the probability that both are white?", "options": {"A": "<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">25</span></span>", "B": "<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span>", "C": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">15</span></span>", "D": "<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">15</span></span>"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Solve the cryptic clue: \"Under pressure, turned into puddings (8)\".", "options": {"A": "STRESSED", "B": "PASTRIES", "C": "DRESSERS", "D": "DESSERTS"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What comes next in this sequence? B, D, G, K, P, ___", "options": {"A": "V", "B": "T", "C": "U", "D": "Q"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "\"The frelmy tordacks blissed the marn quorbly.\" Which invented word is functioning as an ADVERB?", "options": {"A": "frelmy", "B": "tordacks", "C": "quorbly", "D": "blissed"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A test for a condition is correct 90 per cent of the time. The condition affects 1 person in 1,000. A randomly chosen person tests positive. Roughly how likely is it that they have the condition?", "options": {"A": "about 90 per cent", "B": "about 1 per cent", "C": "about 50 per cent", "D": "about 10 per cent"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four researchers each read exactly one of four papers, and no two read the same one. Nadia did not read the paper on soils. The paper on soils was read by the person who arrived first. Omar arrived last. Priya did not arrive first. Who read the paper on soils?", "options": {"A": "Rafi", "B": "Nadia", "C": "Omar", "D": "Priya"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this sequence: 1, 2, 6, 24, 120, ___ . What number comes next?", "options": {"A": "600", "B": "240", "C": "125", "D": "720"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a group of 30 students, 18 study Chemistry, 15 study Economics and 5 study neither. How many study BOTH?", "options": {"A": "3", "B": "8", "C": "33", "D": "12"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The medical school will remove applicants' names and schools from personal statements before they are marked, so that the marking is fair.\"\n\nPROPOSED ASSUMPTION: \"Knowing an applicant's name or school can affect how a marker judges their personal statement.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "No. The statement describes a change to a procedure and makes no claim about how markers behave.", "B": "Yes. Removing the information is offered as the way to make the marking fair, which presupposes that leaving it in could make the marking unfair."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A journal's policy is that no paper is published unless at least two reviewers recommend acceptance. A paper by Dr Aziz received recommendations to accept from three reviewers.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Dr Aziz's paper met the journal's reviewer requirement for publication.", "B": "Dr Aziz's paper was published.", "C": "Dr Aziz's paper received no negative reviews.", "D": "The journal publishes every paper that two reviewers recommend."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A university reviewed all 1,200 research projects registered in one year. It found that 780 had pre-registered their analysis plan, 540 had published their data openly, and 420 had done both.\"\n\nCONCLUSION (1): More than half the projects pre-registered an analysis plan.\nCONCLUSION (2): Most projects that published their data openly had also pre-registered.\nCONCLUSION (3): 300 projects did neither.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "Conclusions 1 and 3 follow, but Conclusion 2 does not.", "B": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "C": "All three conclusions follow.", "D": "Conclusion 1 follows, but Conclusions 2 and 3 do not."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "72", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"Under the regulation, any device sold as medical equipment must carry a conformity mark. Nothing carrying a conformity mark may be advertised as untested.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "No device sold as medical equipment may be advertised as untested.", "B": "Anything carrying a conformity mark is sold as medical equipment.", "C": "Any device advertised as untested is not a device at all."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "73", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should courts be allowed to use an algorithm's risk score when deciding whether to grant bail?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "Yes. Human judges are inconsistent and biased, and a computer is neither. Algorithms simply apply the same rule to every case, which is exactly what justice is supposed to mean. Anyone who has sat in a magistrates' court knows how much depends on which judge you get.", "B": "No. Bail decisions are among the most serious a court makes, and it would be wrong to hand such a decision to a machine rather than to a person who can be held responsible for it.", "C": "No. An audit of 7,214 defendants scored by one widely used tool found that among those who did not go on to reoffend, black defendants were almost twice as likely as white defendants to have been labelled high risk. The tool's overall accuracy, at about 65 per cent, was no better than that of untrained volunteers given the same case files. A score that is no more accurate than a lay judgement while distributing its errors unevenly gives a court nothing it did not already have."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "74", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A study of 300 patients recruited through a hospital's specialist migraine clinic found that 71 per cent reported at least one attack a week.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Most people who suffer from migraine have at least one attack a week.", "B": "The clinic's treatment is failing most of its patients.", "C": "Weekly attacks are becoming more common.", "D": "Among the patients studied, most reported at least one attack a week."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "75", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "「預設同意」制度的具體內容是甚麼？<br><i>「预设同意」制度的具体内容是甚么？</i>", "options": {"A": "市民必須主動登記，才會被視為願意捐贈<br><i>市民必须主动登记，才会被视为愿意捐赠</i>", "B": "除非生前明確表示反對，否則死後視為願意捐出器官<br><i>除非生前明确表示反对，否则死后视为愿意捐出器官</i>", "C": "由家屬在病人死後代為決定是否捐贈<br><i>由家属在病人死后代为决定是否捐赠</i>", "D": "政府可以在有需要時強制取用器官<br><i>政府可以在有需要时强制取用器官</i>"}, "fig": "", "passage": "香港的器官捐贈率長期偏低。每年輪候腎臟移植的病人以千計，真正等到的卻只有數十人。近年社會上有一種主張：把現行的「預設不同意」改為「預設同意」，即除非市民生前明確表示反對，否則死後即被視為願意捐出器官。這個建議一提出，支持與反對的聲音同樣強烈。\n\n支持者的理由頗為實在。第一，現行制度要求市民主動登記，而登記需要一點決心與時間；許多人並非不願意，只是一直未去辦理。第二，外國的經驗顯示，改制之後捐贈率確有上升。第三，器官在死後短時間內便會失去移植價值，家屬往往在最哀傷的時刻被問及是否同意，這對家屬其實也是一種負擔；若制度已有預設，家屬的壓力反而減輕。\n\n反對者的顧慮同樣不容輕視。最根本的一點是：沉默不等於同意。一個人沒有表態，可能是因為不知道有這回事，也可能是因為不願意面對死亡的話題，把這種沉默解讀為願意，等於替他做了一個他從未做過的決定。《論語》說：「己所不欲，勿施於人。」我們自己未必願意在毫不知情的情況下被納入一個名冊，又怎能以此加諸他人？此外，若市民對制度缺乏信任，貿然改制反而可能引起反彈，令原本願意捐贈的人也去登記反對。\n\n兩邊的說法都不能一筆抹煞。值得注意的是，外國的數字並不像倡議者說的那樣簡單。在若干採用預設同意的國家，捐贈率上升的同時，移植協調員的人手、深切治療部的床位、以及與家屬溝通的程序，也一併大幅改善。研究者其後指出，把上升全部歸功於制度轉變，是把同時發生的事當成因果。制度或許有用，但真正把器官送到病人身上的，是那一整套配套。\n\n孟子說：「老吾老以及人之老。」推己及人，本是善意的起點。然而善意若要落到實處，靠的不是一句「預設」，而是讓每一個人都有機會在清醒的時候，認真地作出自己的決定。與其把沉默算作同意，不如把「問一問」變成常態：在考取駕駛執照時問，在辦理身分證時問，在家庭醫生的診所裏問。\n\n把選擇權交回市民手上，同時把配套做好，也許比改一個預設值走得更遠。<br><i>香港的器官捐赠率长期偏低。每年轮候肾脏移植的病人以千计，真正等到的却只有数十人。近年社会上有一种主张：把现行的「预设不同意」改为「预设同意」，即除非市民生前明确表示反对，否则死后即被视为愿意捐出器官。这个建议一提出，支持与反对的声音同样强烈。\n\n支持者的理由颇为实在。第一，现行制度要求市民主动登记，而登记需要一点决心与时间；许多人并非不愿意，只是一直未去办理。第二，外国的经验显示，改制之后捐赠率确有上升。第三，器官在死后短时间内便会失去移植价值，家属往往在最哀伤的时刻被问及是否同意，这对家属其实也是一种负担；若制度已有预设，家属的压力反而减轻。\n\n反对者的顾虑同样不容轻视。最根本的一点是：沉默不等于同意。一个人没有表态，可能是因为不知道有这回事，也可能是因为不愿意面对死亡的话题，把这种沉默解读为愿意，等于替他做了一个他从未做过的决定。《论语》说：「己所不欲，勿施于人。」我们自己未必愿意在毫不知情的情况下被纳入一个名册，又怎能以此加诸他人？此外，若市民对制度缺乏信任，贸然改制反而可能引起反弹，令原本愿意捐赠的人也去登记反对。\n\n两边的说法都不能一笔抹煞。值得注意的是，外国的数字并不像倡议者说的那样简单。在若干采用预设同意的国家，捐赠率上升的同时，移植协调员的人手、深切治疗部的床位、以及与家属沟通的程序，也一并大幅改善。研究者其后指出，把上升全部归功于制度转变，是把同时发生的事当成因果。制度或许有用，但真正把器官送到病人身上的，是那一整套配套。\n\n孟子说：「老吾老以及人之老。」推己及人，本是善意的起点。然而善意若要落到实处，靠的不是一句「预设」，而是让每一个人都有机会在清醒的时候，认真地作出自己的决定。与其把沉默算作同意，不如把「问一问」变成常态：在考取驾驶执照时问，在办理身分证时问，在家庭医生的诊所里问。\n\n把选择权交回市民手上，同时把配套做好，也许比改一个预设值走得更远。</i>", "qnum": "1"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "支持者提出的第三個理由是甚麼？<br><i>支持者提出的第三个理由是甚么？</i>", "options": {"A": "器官移植的費用可以由政府全數承擔<br><i>器官移植的费用可以由政府全数承担</i>", "B": "醫院可以縮短病人輪候的隊伍<br><i>医院可以缩短病人轮候的队伍</i>", "C": "市民登記的手續會變得更加簡便<br><i>市民登记的手续会变得更加简便</i>", "D": "有了預設，家屬在哀傷時被問及同意與否的壓力反而減輕<br><i>有了预设，家属在哀伤时被问及同意与否的压力反而减轻</i>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "反對者認為「沉默不等於同意」，其理由是甚麼？<br><i>反对者认为「沉默不等于同意」，其理由是甚么？</i>", "options": {"A": "沒有表態可能只是不知情或不願面對死亡的話題<br><i>没有表态可能只是不知情或不愿面对死亡的话题</i>", "B": "沉默的人大多其實是反對捐贈的<br><i>沉默的人大多其实是反对捐赠的</i>", "C": "法律規定沉默一律視為拒絕<br><i>法律规定沉默一律视为拒绝</i>", "D": "市民表態與否應由家屬代為決定<br><i>市民表态与否应由家属代为决定</i>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "作者對「外國經驗顯示捐贈率上升」這一點，有甚麼看法？<br><i>作者对「外国经验显示捐赠率上升」这一点，有甚么看法？</i>", "options": {"A": "外國的數字完全不可信<br><i>外国的数字完全不可信</i>", "B": "外國的情況與香港完全相同<br><i>外国的情况与香港完全相同</i>", "C": "上升可能來自同時改善的配套，不能全部歸功於制度<br><i>上升可能来自同时改善的配套，不能全部归功于制度</i>", "D": "捐贈率上升其實只是短暫現象<br><i>捐赠率上升其实只是短暂现象</i>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "作者最後提出的主張是甚麼？<br><i>作者最后提出的主张是甚么？</i>", "options": {"A": "把選擇權交回市民，並在日常場合主動詢問，同時做好配套<br><i>把选择权交回市民，并在日常场合主动询问，同时做好配套</i>", "B": "立刻推行預設同意制度<br><i>立刻推行预设同意制度</i>", "C": "維持現狀，不作任何改變<br><i>维持现状，不作任何改变</i>", "D": "由醫生代替市民作出決定<br><i>由医生代替市民作出决定</i>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "本文的論證有甚麼特點？<br><i>本文的论证有甚么特点？</i>", "options": {"A": "由頭到尾支持預設同意，並逐一駁斥反對意見<br><i>由头到尾支持预设同意，并逐一驳斥反对意见</i>", "B": "只列舉數據，不作任何判斷<br><i>只列举数据，不作任何判断</i>", "C": "以個人的親身經歷貫串全文<br><i>以个人的亲身经历贯串全文</i>", "D": "先  {"A": "亡羊補牢<br><i>亡羊补牢</i>", "B": "未雨綢繆<br><i>未雨绸缪</i>", "C": "急功近利", "D": "按兵不動<br><i>按兵不动</i>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "88", "type": "mcq", "section": "Chinese", "stem": "下列哪一句沒有語病？<br><i>下列哪一句没有语病？</i>", "options": {"A": "通過這次討論，使我們明白了問題的複雜。<br><i>通过这次讨论，使我们明白了问题的复杂。</i>", "B": "是否推行新制度，取決於市民對政府有沒有信任的支持。<br><i>是否推行新制度，取决于市民对政府有没有信任的支持。</i>", "C": "這個建議一提出，支持與反對的聲音都同樣地非常強烈得很。<br><i>这个建议一提出，支持与反对的声音都同样地非常强烈得很。</i>", "D": "現行制度要求市民主動登記，而登記需要一點決心與時間。<br><i>现行制度要求市民主动登记，而登记需要一点决心与时间。</i>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "89", "type": "mcq", "section": "Chinese", "stem": "「在考取駕駛執照時問，在辦理身分證時問，在家庭醫生的診所裏問。」這一句主要用了哪種修辭手法？<br><i>「在考取驾驶执照时问，在办理身分证时问，在家庭医生的诊所里问。」这一句主要用了哪种修辞手法？</i>", "options": {"A": "借代", "B": "排比", "C": "映襯<br><i>映衬</i>", "D": "層遞<br><i>层递</i>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 6 (V4)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
