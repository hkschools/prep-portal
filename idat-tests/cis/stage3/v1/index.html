<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

aper, working for three whole evenings by lamplight, and when she let out the string, the kite climbed until it hung above the rooftops like a small red sun.<br><br>&quot;Look how high I fly!&quot; the kite called to a sparrow resting on a fence post below. &quot;Higher than the trees, higher than the temple roof, higher than any bird in this village.&quot;<br><br>The sparrow tilted her head. &quot;You fly well,&quot; she said, &quot;but be careful. The wind up there is stronger than it looks.&quot;<br><br>The kite scoffed at the little bird. &quot;What would a sparrow know about real flying? I would fly higher still if it were not for this string. It drags at me all day long. It is the only thing holding me back.&quot;<br><br>All afternoon the kite pulled and twisted against the line, while far below Lin laughed, thinking her kite was only dancing. Then at last a fierce gust swept up the hill and the string snapped. &quot;Free!&quot; cried the kite, but only for a moment. Without the steady pull of the string, the kite could not hold its face to the wind. It spun, tipped sideways, and tumbled down and down until it crashed into the branches of an old banyan tree, where its proud red paper tore.<br><br>The sparrow fluttered up beside it. &quot;Strange,&quot; she said gently. &quot;The thing you called a chain was the very thing that held you up.&quot;<br><br>Lin climbed the tree and carried her kite home to mend it. The kite never complained about the string again, for it had learned that what feels like a burden may, in truth, be the very thing that keeps us steady.", "qnum": 27}, {"n": 29, "type": "mcq", "section": "English", "stem": "According to the passage, how do some mangrove species deal with salt that enters them?", "options": {"A": "They store the salt safely inside their trunks.", "B": "They push the salt out through special glands on their leaves.", "C": "They filter the salt through their snorkel-like roots.", "D": "They wash the salt away at low tide."}, "fig": "", "passage": "<strong>Mangroves: The Forests Between Land and Sea</strong><br>If you sail along a tropical coastline, you may see a strange forest standing with its feet in the sea. These are mangroves, trees that grow where the land meets salt water, in the warm regions of Asia, Africa, Australia and the Americas.<br><br>Salt water kills most plants, but mangroves have clever ways of surviving it. Some species block the salt at their roots, letting only fresh water travel up the trunk. Others allow the salt in and then push it out through special glands on their leaves; if you look closely, you can sometimes see white salt crystals shining on a mangrove leaf. Because the mud they grow in holds very little oxygen, many mangroves also grow special roots that poke up out of the mud like snorkels, taking in air at low tide.<br><br>The tangle of roots beneath a mangrove forest is one of the busiest neighbourhoods in nature. Young fish, shrimp and crabs hide among the roots, where larger hunters cannot easily follow. A single patch of healthy mangrove can shelter thousands of young creatures at one time. Scientists call mangroves a nursery of the sea, because so many creatures spend the first part of their lives in this shelter before swimming out to deeper water and coral reefs.<br><br>Mangroves protect people as well. Their roots slow down waves and trap mud and sand, holding the coastline together. During storms, a wide band of mangroves can soak up much of a wave&#x27;s energy before it reaches the villages behind the forest. Yet in many places, mangroves are being cleared to make room for fish ponds, hotels and ports. Once the trees are gone, the coast washes away far more easily. That is why countries around the world have begun replanting mangrove forests. In some villages, schoolchildren help by pressing young seedlings into the soft mud at low tide; within a few years, the new trees begin their quiet work of guarding the boundary between land and sea.", "qnum": 28}, {"n": 30, "type": "mcq", "section": "English", "stem": "Why do scientists call mangroves \"a nursery of the sea\"?", "options": {"A": "Young mangrove trees are grown there to be sold and replanted.", "B": "The forest heals fish that have been injured by larger hunters.", "C": "Larger hunters cannot survive in the salty water among the roots.", "D": "Many young sea creatures grow up safely among the roots before moving to deeper water."}, "fig": "", "passage": "<strong>Mangroves: The Forests Between Land and Sea</strong><br>If you sail along a tropical coastline, you may see a strange forest standing with its feet in the sea. These are mangroves, trees that grow where the land meets salt water, in the warm regions of Asia, Africa, Australia and the Americas.<br><br>Salt water kills most plants, but mangroves have clever ways of surviving it. Some species block the salt at their roots, letting only fresh water travel up the trunk. Others allow the salt in and then push it out through special glands on their leaves; if you look closely, you can sometimes see white salt crystals shining on a mangrove leaf. Because the mud they grow in holds very little oxygen, many mangroves also grow special roots that poke up out of the mud like snorkels, taking in air at low tide.<br><br>The tangle of roots beneath a mangrove forest is one of the busiest neighbourhoods in nature. Young fish, shrimp and crabs hide among the roots, where larger hunters cannot easily follow. A single patch of healthy mangrove can shelter thousands of young creatures at one time. Scientists call mangroves a nursery of the sea, because so many creatures spend the first part of their lives in this shelter before swimming out to deeper water and coral reefs.<br><br>Mangroves protect people as well. Their roots slow down waves and trap mud and sand, holding the coastline together. During storms, a wide band of mangroves can soak up much of a wave&#x27;s energy before it reaches the villages ,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"200\" height=\"200\" fill=\"#ffffff\"/><rect x=\"40\" y=\"40\" width=\"120\" height=\"120\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><line x1=\"40\" y1=\"40\" x2=\"160\" y2=\"160\" stroke=\"#27406b\" stroke-width=\"2\"/><line x1=\"160\" y1=\"40\" x2=\"40\" y2=\"160\" stroke=\"#27406b\" stroke-width=\"2\"/></svg>", "passage": null, "qnum": 57}, {"n": 62, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: The school canteen will stop selling sugary drinks next term because the principal wants students to be healthier.\n\nPROPOSED ASSUMPTION: The principal believes that sugary drinks are not good for students' health.\n\nUsing the information in the statement, is this assumption logical: YES or NO?", "options": {"A": "Yes", "B": "No", "C": "", "D": ""}, "fig": "", "passage": null, "qnum": 58}, {"n": 63, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: Every student in Class 6B borrowed at least one book from the school library this month. Mei is a student in Class 6B. The library records show that Class 6B borrowed 40 books in total this month.\n\nUsing only the information above, which of the following MUST be true?", "options": {"A": "Mei borrowed exactly one book this month.", "B": "Class 6B borrowed more books this month than any other class in the school.", "C": "Mei borrowed at least one book from the school library this month.", "D": "Most students in Class 6B borrowed more than one book this month."}, "fig": "", "passage": null, "qnum": 59}, {"n": 64, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: A survey at Harbourview Primary asked 200 students how they travel to school. 70% of the students surveyed said they walk to school. All of the rest travel by bus or by car.\n\nCONCLUSIONS:\n1. More of the students surveyed walk to school than travel by bus or car.\n2. Walking is the healthiest way for students to travel to school.\n3. 60 of the students surveyed travel by bus or by car.\n\nUsing ONLY the information in the statement, which option is correct?", "options": {"A": "Conclusion 1 follows; Conclusions 2 and 3 do not follow.", "B": "Conclusions 1 and 3 follow; Conclusion 2 does not follow.", "C": "Conclusions 1, 2 and 3 all follow.", "D": "Conclusions 1 and 2 follow; Conclusion 3 does not follow."}, "fig": "", "passage": null, "qnum": 60}, {"n": 65, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: All members of the school chess club meet on Friday afternoons. Some members of the chess club are also members of the choir. Priya is a member of the chess club.\n\nBringing all the facts together, which conclusion does NOT follow?", "options": {"A": "Priya meets on Friday afternoons.", "B": "At least one member of the choir is also a member of the chess club.", "C": "Any student who is a member of the chess club meets on Friday afternoons.", "D": "Priya is a member of the choir."}, "fig": "", "passage": null, "qnum": 61}, {"n": 66, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: Should the school replace all printed textbooks with tablets for Year 7 students?\n\nWhich of the following THREE arguments is the STRONGEST?", "options": {"A": "No: a school in another city switched to tablets last year, and one class's test scores went down that term.", "B": "Yes: a two-year study of 40 schools found that students using tablets carried an average of 5 kg less each day and reported fewer back problems.", "C": "Yes: everyone knows tablets are the future, and the school will look old-fashioned if it keeps using paper books.", "D": ""}, "fig": "", "passage": null, "qnum": 62}, {"n": 67, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: The 8:05 ferry to Mui Wo was cancelled this morning because a typhoon signal was raised. Passengers holding tickets for the 8:05 ferry were given seats on the 9:30 ferry to Mui Wo instead.\n\nUsing only the information above, which of the following MUST be true?", "options": {"A": "At least one other ferry to Mui Wo was scheduled after 8:05 this morning.", "B": "The typhoon signal was lowered before 9:30 this morning.", "C": "All of the 8:05 passengers were happy to take the later ferry.", "D": "The 9:30 ferry departed exactly on time."}, "fig": "", "passage": null, "qnum": 63}, {"n": 68, "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 簡体.)"}, {"n": 69, "type": "mcq", "section": "Chinese", "stem": "根據文章，「我」和媽媽到街市做甚麼？ <br><span style=\"color:#555\">根据文章，“我”和妈妈到街市做什么？</span>", "options": {"A": "買衣服<br><span style=\"color:#555\">买衣服</span>", "B": "買菜<br><span style=\"color:#555\">买菜</span>", "C": "探望伯伯<br><span style=\"color:#555\">探望伯伯</span>", "D": "逛超級市場<br><span style=\"color:#555\">逛超级市场</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>上星期六，我和媽媽一起到街市買菜，街市裏人來人往，叫賣聲此起彼落，十分熱鬧。媽媽先在魚檔買了一條新鮮的魚，然後到菜檔挑選蔬菜，檔口的貨品琳瑯滿目。賣菜的伯伯笑着對我們說：「這些菜心是今天清晨剛運到的，又嫩又甜。」媽媽聽了，便買了兩斤菜心。回家的路上，媽媽告訴我，到街市買菜雖然不及超級市場方便，但是食物比較新鮮，價錢也便宜一些，懂得貨比三家，才是精明的消費者。我聽了之後恍然大悟：原來日常生活中，處處都有學問。</div><div><em>簡体</em><br>上星期六，我和妈妈一起到街市买菜，街市里人来人往，叫卖声此起彼落，十分热闹。妈妈先在鱼档买了一条新鲜的鱼，然后到菜档挑选蔬菜，档口的货品琳琅满目。卖菜的伯伯笑着对我们说：“这些菜心是今天清晨刚运到的，又嫩又甜。”妈妈听了，便买了两斤菜心。回家的路上，妈妈告诉我，到街市买菜虽然不及超级市场方便，但是食物比较新鲜，价钱也便宜一些，懂得货比三家，才是精明的消费者。我听了之后恍然大悟：原来日常生活中，处处都有学问。</div>", "qnum": 64}, {"n": 70, "type": "mcq", "section": "Chinese", "stem": "媽媽在街市先買了甚麼？ <br><span style=\"color:#555\">妈妈在街市先买了什么？</span>", "options": {"A": "菜心<br><span style=\"color:#555\">菜心</span>", "B": "水果<br><span style=\"color:#555\">水果</span>", "C": "豬肉<br><span style=\"color:#555\">猪肉</span>", "D": "魚<br><span style=\"color:#555\">鱼</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>上星期六，我和媽媽一起到街市買菜，街市裏人來人往，叫賣聲此起彼落，十分熱鬧。媽媽先在魚檔買了一條新鮮的魚，然後到菜檔挑選蔬菜，檔口的貨品琳瑯滿目。賣菜的伯伯笑着對我們說：「這些菜心是今天清晨剛運到的，又嫩又甜。」媽媽聽了，便買了兩斤菜心。回家的路上，媽媽告訴我，到街市買菜雖然不及超級市場方便，  "type": "mcq", "section": "Chinese", "stem": "下面哪一個句子的詞序正確？ <br><span style=\"color:#555\">下面哪一个句子的词序正确？</span>", "options": {"A": "我昨天在圖書館借了一本故事書。<br><span style=\"color:#555\">我昨天在图书馆借了一本故事书。</span>", "B": "我昨天借了在圖書館一本故事書。<br><span style=\"color:#555\">我昨天借了在图书馆一本故事书。</span>", "C": "我在圖書館昨天借了一本故事書。<br><span style=\"color:#555\">我在图书馆昨天借了一本故事书。</span>", "D": "我借了一本故事書昨天在圖書館。<br><span style=\"color:#555\">我借了一本故事书昨天在图书馆。</span>"}, "fig": "", "passage": null, "qnum": 76}, {"n": 82, "type": "mcq", "section": "Chinese", "stem": "選出最適當的關聯詞：「＿＿明天下雨，運動會＿＿會照常舉行。」 <br><span style=\"color:#555\">选出最适当的关联词：“＿＿明天下雨，运动会＿＿会照常举行。”</span>", "options": {"A": "因為……所以<br><span style=\"color:#555\">因为……所以</span>", "B": "即使……也<br><span style=\"color:#555\">即使……也</span>", "C": "雖然……但是<br><span style=\"color:#555\">虽然……但是</span>", "D": "不但……而且<br><span style=\"color:#555\">不但……而且</span>"}, "fig": "", "passage": null, "qnum": 77}, {"n": 83, "type": "info", "title": "中文寫作 Chinese Writing", "body": "<div class='info-body'>在正式考試中，中文寫作為紙筆作答，以下兩題<b>二選一</b>。此頁僅供參考，你不需要在此輸入答案。<br>In the real test, Chinese writing is done on paper, <b>choose one</b> of the two prompts below. This page is for reference only; you don't need to type anything here.</div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 1 / 题目 1</b><br>《一件難忘的事》, , 寫出事情的經過和你的感受（不少於 8 句）。<br><span style='color:#555'>《一件难忘的事》, , 写出事情的经过和你的感受（不少于 8 句）。</span></div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 2 / 题目 2</b><br>《我最喜歡的地方》, , 描述那個地方的樣子，並說明你喜歡它的原因（不少於 8 句）。<br><span style='color:#555'>《我最喜欢的地方》, , 描述那个地方的样子，并说明你喜欢它的原因（不少于 8 句）。</span></div>"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
