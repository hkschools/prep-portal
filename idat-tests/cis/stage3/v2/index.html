  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

Neither of the answers ___ correct, according to the teacher.", "options": {"A": "is", "B": "are", "C": "being", "D": "were being"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is most nearly OPPOSITE in meaning to the underlined word? After the storm passed, the sea became remarkably <u>calm</u>.", "options": {"A": "rough", "B": "deep", "C": "cold", "D": "salty"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the sentence that uses the apostrophe correctly.", "options": {"A": "The womens' meeting was moved to Friday.", "B": "The women's meeting was moved to Friday.", "C": "The womens meeting was moved to Friday.", "D": "The women's meeting's was moved to Friday."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the sentence that uses commas correctly in a list.", "options": {"A": "We packed sandwiches fruit, water and a blanket for the picnic.", "B": "We packed, sandwiches, fruit, water and a blanket for the picnic.", "C": "We packed sandwiches, fruit, water, and, a blanket for the picnic.", "D": "We packed sandwiches, fruit, water and a blanket for the picnic."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Choose the correct passive form of: 'The builders are repairing the bridge.'", "options": {"A": "The bridge is repaired by the builders.", "B": "The bridge is being repaired by the builders.", "C": "The bridge was repaired by the builders.", "D": "The bridge is repairing by the builders."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which word shows the STRONGEST degree of the feeling? When the lights suddenly went out, the small children were ___.", "options": {"A": "terrified", "B": "nervous", "C": "uneasy", "D": "curious"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Choose the expression that is most appropriate for a polite, formal written request to the school librarian.", "options": {"A": "Hand over another week with this book.", "B": "I need you to renew this book for me.", "C": "Would it be possible to renew this book, please?", "D": "Can you just renew this book?"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "In the sentence below, which word is an ADJECTIVE? The nervous swimmer dived into the pool.", "options": {"A": "swimmer", "B": "nervous", "C": "dived", "D": "pool"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Choose the correct verb form. She ___ in Hong Kong for six years before she moved to Tokyo.", "options": {"A": "has lived", "B": "lives", "C": "had lived", "D": "was living"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Add a suffix to the root word 'hope' to make a word meaning 'full of hope'. The correct word is:", "options": {"A": "hopeless", "B": "hoping", "C": "hoper", "D": "hopeful"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Choose the correct plural spelling. The children fed the noisy ___ at the duck pond.", "options": {"A": "gooses", "B": "geeses", "C": "geese", "D": "goose's"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Complete the analogy. Painter is to canvas as sculptor is to ___.", "options": {"A": "marble", "B": "gallery", "C": "chisel", "D": "visitor"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "One labelled section contains a grammatical error. Which labelled section is wrong? (A) Their is a small (B) wooden bench (C) beside the path (D) near the gate.", "options": {"A": "section (A)", "B": "section (B)", "C": "section (C)", "D": "section (D)"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean? Lara had been studying for hours, so when her friends asked her to come out, she decided to <u>call it a day</u>.", "options": {"A": "to keep going until midnight", "B": "to phone someone for help", "C": "to stop what you are doing for now", "D": "to plan the next day carefully"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Choose the option that makes the pronoun reference clear. 'When Daniel saw Marcus, he had cut his hair short.' To show clearly that MARCUS had cut his hair, rewrite as:", "options": {"A": "When he saw Marcus, Daniel had cut his hair short.", "B": "He had cut his hair short when Daniel saw Marcus.", "C": "When Daniel saw him, he had cut his hair short.", "D": "When Daniel saw Marcus, Marcus had cut his hair short."}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'fragile' in the sentence below? The old letters were so fragile that they nearly crumbled when she touched them.", "options": {"A": "valuable", "B": "ancient", "C": "dusty", "D": "easily broken"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Why did the lion let the mouse go free at the start of the story?", "options": {"A": "He was too sleepy to eat her.", "B": "He was not cruel and chose to release her.", "C": "The mouse escaped from under his paw.", "D": "Another animal told him to."}, "fig": "", "passage": "<strong>The Lion and the Mouse, Retold</strong><br>In the warm shade of an acacia tree, a great lion lay sleeping. A small mouse, scurrying home with a seed, did not see the lion's paw and ran straight across it. The lion woke with a growl and pinned the trembling mouse beneath one claw.\n\n\"Please,\" squeaked the mouse, \"let me go. One day I may be able to help you in return.\" The lion laughed at the idea that so tiny a creature could ever help him, but he was not cruel, and he lifted his paw and let the mouse go free.\n\nWeeks later, the lion was padding through the long grass when ropes snapped tight around him. Hunters had hidden a net, and the harder the lion struggled, the tighter it held. His roars of anger echoed across the plain, but no other beast dared come near.\n\nThe little mouse, however, heard the familiar voice and came running. \"Hold still,\" she told the lion, and she began to gnaw at the thick ropes with her sharp teeth. Strand by strand the net loosened, until at last the lion pulled himself free.\n\n\"You laughed when I promised to help you,\" said the mouse, \"yet here we are.\" The lion bowed his huge head. He had learned that kindness is never wasted, and that even the smallest friend may do what the strongest cannot.", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'gnaw' as used in 'she began to gnaw at the thick ropes with her sharp teeth'?", "options": {"A": "pull with both paws", "B": "stare at closely", "C": "tie into knots", "D": "bite and chew steadily"}, "fig": "", "passage": "<strong>The Lion and the Mouse, Retold</strong><br>In the warm shade of an acacia tree, a great lion lay sleeping. A small mouse, scurrying home with a seed, did not see the lion's paw and ran straight across it. The lion woke with a growl and pinned the trembling mouse beneath one claw.\n\n\"Please,\" squeaked the mouse, \"let me go. One day I may be able to help you in return.\" The lion laughed at the idea that so tiny a creature could ever help him, but he was not cruel, and he lifted his paw and let the mouse go free.\n\nWeeks later, the lion was padding through the long grass when ropes snapped tight around him. Hunters had hidden a net, and the harder the lion struggled, the tighter it held. His roars of anger echoed across the plain, but no other beast dared come near.\n\nThe little mouse, however, heard the familiar voice and came running. \"Hold still,\" she told the lion, and she began to gnaw at the thick ropes with her sharp teeth. Strand by strand the net loosened, until at last the lion pulled himself free.\n\n\"You laughed when I promised to help you,\" said the mouse, \"yet here we are.\" The lion bowed his huge head. He had learned that kindness is never wasted, and that even the smallest friend may do what the strongest cannot.", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Why was the lion unable to escape the net by himself?", "options": {"A": "The hunters were standing on the ropes.", "B": "He had hurt his paw earlier.", "C": "He was still tired from sleeping.", "D": "The more he struggled, the tighter the net became."}, "fig": "", "passage": "<strong>The Lion and the Mouse, Retold</strong><br>In the warm shade of an acacia tree, a great lion lay sleeping. A small mouse, scurrying home with a seed, did not see the lion's paw and ran straight across it. The lion woke with a growl and pinned the trembling mouse beneath one claw.\n\n\"Please,\" squeaked the mouse, \"let me go. One day I may be able to help you in return.\" The lion laughed at the idea that so tiny a creature could ever help him, but he was not cruel, and he lifted his paw and let the mouse go free.\n\nWeeks later, the lion was padding through the long grass when ropes snapped tight around him. Hunters had hidden a net, and the harder the lion struggled, the tighter it held. His roars of anger echoed across the plain, but no other beast dared come near.\n\nThe little mouse, however, heard the familiar voice and came running. \"Hold still,\" she told the lion, and she began to gnaw at the thick ropes with her sharp teeth. Strand by strand the net loosened, until at last the lion pulled himself free.\n\n\"You laughed when I promised to help you,\" said the mouse, \"yet here we are.\" The lion bowed his huge head. He had learned that kindness is never wasted, and that even the smallest friend may do what the strongest cannot.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which statement best expresses the main message of this fable?", "options": {"A": "Lions should never sleep under trees.", "B": "Hunters always set traps on the plain.", "C": "Even the smallest friend can help in a way the strongest cannot.", "D": "You should never make promises you cannot keep."}, "fig": "", "passage": "<strong>The Lion and the Mouse, Retold</strong><br>In the warm shade of an acacia tree, a great lion lay sleeping. A small mouse, scurrying home with a seed, did not see the lion's paw and ran straight across it. The lion woke with a growl and pinned the trembling mouse beneath one claw.\n\n\"Please,\" squeaked the mouse, \"let me go. One day I may be able to help you in return.\" The lion laughed at the idea that so tiny a creature could ever help him, but he was not cruel, and he lifted his paw and let the mouse go free.\n\nWeeks later, the lion was padding through the long grass when ropes snapped tight around him. Hunters had hidden a net, and the harder the lion struggled, the tighter it held. His roars of anger echoed across the plain, but no other beast dared come near.\n\nThe little mouse, however, heard the familiar voice and came running. \"Hold still,\" she told the lion, and she began to gnaw at the thick ropes with her sharp teeth. Strand by strand the net loosened, until at last the lion pulled himself free.\n\n\"You laughed when I promised to help you,\" said the mouse, \"yet here we are.\" The lion bowed his huge head. He had learned that kindness is never wasted, and that even the smallest friend may do what the strongest cannot.", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "According to the passage, what danger did ships face when sailing toward land at night?", "options": {"A": "Rocks and shallow water could tear the hull apart.", "B": "Other ships were difficult to see.", "C": "The wind always blew them out to sea.", "D": "Their lamps ran out of oil."}, "fig": "", "passage": "<strong>How Lighthouses Guided Ships</strong><br>Long before radios and satellites, a ship sailing toward land at night faced a hidden danger. Rocks and shallow water near the coast could tear a hull apart, and in the dark a captain often could not tell how close the shore really was. For centuries, the safest harbours were the ones a sailor could find by the light of a fire on the cliffs.\n\nThe answer to this danger was the lighthouse. A lighthouse is a tall tower built on a headland or a rocky island, with a bright lamp at the top. By keeping the lamp burning through the night, keepers gave passing ships a fixed point of light to steer by, warning them away from the rocks and toward the safe channel.\n\nEarly lighthouses simply burned wood or coal, but the flames were weak and easily lost in fog. Everything changed when engineers added a special set of curved glass lenses around the lamp. These lenses gathered the scattered light and bent it into a single powerful beam that could be seen many kilometres out to sea. Some lighthouses even turned their lamps slowly, so each one flashed in its own rhythm and sailors could tell exactly which light they were looking at.\n\nToday, satellites guide most ships, and many old lighthouses stand empty. Yet they are not forgotten. People visit them as museums, and on a stormy night their beams can still bring a tired sailor safely home.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'beam' as used in 'bent it into a single powerful beam that could be seen many kilometres out to sea'?", "options": {"A": "a wooden post", "B": "a wide smile", "C": "a ray of light", "D": "a loud sound"}, "fig": "", "passage": "<strong>How Lighthouses Guided Ships</s  not tell how close the shore really was. For centuries, the safest harbours were the ones a sailor could find by the light of a fire on the cliffs.\n\nThe answer to this danger was the lighthouse. A lighthouse is a tall tower built on a headland or a rocky island, with a bright lamp at the top. By keeping the lamp burning through the night, keepers gave passing ships a fixed point of light to steer by, warning them away from the rocks and toward the safe channel.\n\nEarly lighthouses simply burned wood or coal, but the flames were weak and easily lost in fog. Everything changed when engineers added a special set of curved glass lenses around the lamp. These lenses gathered the scattered light and bent it into a single powerful beam that could be seen many kilometres out to sea. Some lighthouses even turned their lamps slowly, so each one flashed in its own rhythm and sailors could tell exactly which light they were looking at.\n\nToday, satellites guide most ships, and many old lighthouses stand empty. Yet they are not forgotten. People visit them as museums, and on a stormy night their beams can still bring a tired sailor safely home.", "qnum": "29"}, {"n": "31", "type": "writing", "section": "English Writing", "intro": "Some moments stay clear in our memory for years, even small ones.", "label": "", "body": "Write about a moment you remember well. It could be a first day somewhere, a surprise, a journey, or an ordinary day that turned out to matter. Describe what happened so your reader can picture it, and explain why you still remember it.", "hint": "Write at least 7 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "32", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "33", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What is the value of the digit 8 in 6 851 207?", "options": {"A": "8 000", "B": "80 000", "C": "800 000", "D": "8 000 000"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "34", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Write 50 000 + 3 000 + 70 + 6 in standard form.", "options": {"A": "53 760", "B": "503 076", "C": "5 376", "D": "53 076"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "35", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate 7 003 - 2 856.", "options": {"A": "4 147", "B": "4 247", "C": "5 853", "D": "4 157"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "36", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 36.4 + 9.27.", "options": {"A": "45.31", "B": "12.91", "C": "37.327", "D": "45.67"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "37", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate 276 x 25.", "options": {"A": "1 380", "B": "6 960", "C": "5 520", "D": "6 900"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "38", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 738 / 9.", "options": {"A": "82", "B": "92", "C": "82 r4", "D": "81"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "39", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Estimate 487 x 21 by rounding each number to its leading place first.", "options": {"A": "9 600", "B": "10 000", "C": "10 227", "D": "1 000"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate 2/5 + 1/3.", "options": {"A": "3/8", "B": "11/15", "C": "3/15", "D": "13/15"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What is 3/4 x 8?", "options": {"A": "3/32", "B": "24", "C": "6", "D": "35/4"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which decimal is equal to 5/8?", "options": {"A": "0.58", "B": "5.8", "C": "0.625", "D": "0.125"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "43", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Write 0.06 as a fraction in its simplest form.", "options": {"A": "3/50", "B": "6/10", "C": "1/6", "D": "3/5"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which list of decimals is ordered from least to greatest?", "options": {"A": "0.9, 0.18, 0.2", "B": "0.18, 0.9, 0.2", "C": "0.18, 0.2, 0.9", "D": "0.2, 0.18, 0.9"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A school of 600 pupils has 45% who walk to school. How many pupils walk to school?", "options": {"A": "270", "B": "330", "C": "45", "D": "60"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Complete: 4.2 metres = ____ centimetres.", "options": {"A": "42", "B": "4 200", "C": "0.042", "D": "420"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "47", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A recipe needs 1.75 litres of milk. How many millilitres is this?", "options": {"A": "175", "B": "1 750", "C": "17 500", "D": "17.5"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "48", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "An angle measures 162 degrees. Which type of angle is it?", "options": {"A": "Acute", "B": "Obtuse", "C": "Right", "D": "Reflex"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"220\" fill=\"white\"/><line x1=\"60\" y1=\"170\" x2=\"190\" y2=\"170\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><line x1=\"60\" y1=\"170\" x2=\"-63.6\" y2=\"129.8\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><path d=\"M94,170 A34,34 0 0 0 27.7,159.5\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.5\"/><circle cx=\"60\" cy=\"170\" r=\"3\" fill=\"#1F3864\"/></svg>", "passage": "", "qnum": "16"}, {"n": "49", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Three angles meet at a point and together make a full turn. Two of them are 140 degrees and 95 degrees. What is the third angle?", "options": {"A": "125", "B": "55", "C": "135", "D": "235"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "50", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the figure. How many edges does this solid have?", "options": {"A": "5", "B": "8", "C": "6", "D": "10"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><polygon points=\"40,150 150,150 180,120 70,120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"40,150 110,40 180,120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\" opacity=\"0.85\"/><path d=\"M70,120 L110,40 M150,150 L110,40\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "18"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which of the labelled shapes is a regular polygon?", "options": {"A": "Shape A", "B": "Shape B", "C": "Shape C", "D": "Shape D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><polygon points=\"60.0,28 87,62 60.0,96 33,62\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><rect x=\"136\" y=\"38\" width=\"88\" height=\"48\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"300.0,28.0 332.3,51.5 320.0,89.5 280.0,89.5 267.7,51.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"386,96 454,96 386,28\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "19"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this number sequence. One term is missing. What number belongs in the gap?  1, 3, 6, 10, ___, 21", "options": {"A": "16", "B": "15", "C": "14", "D": "13"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word is the odd one out? (Three of them belong to the same group; one does not.)", "options": {"A": "Mercury", "B": "Venus", "C": "Moon", "D": "Mars"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A ferry leaves the pier every 40 minutes, starting at 09:15. Tomas reaches the pier at 11:00. How long must he wait for the next ferry?", "options": {"A": "15 minutes", "B": "40 minutes", "C": "20 minutes", "D": "25 minutes"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Five cats catch five mice in five minutes. Working at the same steady rate, how many cats are needed to catch twenty mice in twenty minutes?", "options": {"A": "20", "B": "100", "C": "4", "D": "5"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "These four words must be placed in dictionary (alphabetical) order. Which word comes FIRST?", "options": {"A": "precept", "B": "precede", "C": "precinct", "D": "precedent"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The shapes in the figure follow a pattern: the number of sides increases by two each time (a single line segment, then a triangle, then a pentagon). Which labelled shape comes NEXT in the sequence?", "options": {"A": "hexagon", "B": "pentagon", "C": "heptagon", "D": "nonagon"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the first pair of shapes in the figure: a small circle becomes a large circle. The third shape is a small square. Which answer shape completes the pattern in the same way? (small circle is to large circle as small square is to ___)", "options": {"A": "large square", "B": "small square", "C": "large triangle", "D": "large circle"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"250\" viewBox=\"0 0 480 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"250\" fill=\"white\"/><text x=\"10\" y=\"20\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">A is to B, as C is to ?</text><circle cx=\"55\" cy=\"78\" r=\"20\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"100\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><circle cx=\"155\" cy=\"78\" r=\"38\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"206\" y=\"86\" font-size=\"22\" font-weight=\"bold\" fill=\"#333\">::</text><rect x=\"242\" y=\"58\" width=\"40\" height=\"40\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"308\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><text x=\"362\" y=\"90\" font-size=\"30\" font-weight=\"bold\" fill=\"#C00\">?</text><line x1=\"10\" y1=\"140\" x2=\"470\" y2=\"140\" stroke=\"#ccc\"/><text x=\"10\" y=\"162\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Options:</text><rect x=\"22\" y=\"160\" width=\"76\" height=\"76\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><rect x=\"132\" y=\"178\" width=\"40\" height=\"40\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"152\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"244.0,160.0 276.9,217.0 211.1,217.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"244\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><circle cx=\"336\" cy=\"198\" r=\"38\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"336\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "26"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Read the statement, then decide whether the proposed assumption is logical USING ONLY the information in the statement.\n\nStatement: \"We should hold the school sports day in October, because the weather in Hong Kong is usually cooler and drier then than in June.\"\n\nProposed assumption: \"Holding sports day in cooler, drier weather is better for the students taking part.\"\n\nUsing the information in the statement, is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "27"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INFERENCE. A statement is given. Choose the ONE option that MUST be true based only on the statement (the others may be true but are not certain).\n\nStatement: \"Every Year 7 student at Riverside School plays at least one musical instrument. Mei is a Year 7 student at Riverside School.\"", "options": {"A": "Mei plays the piano.", "B": "Mei plays exactly one musical instrument.", "C": "Mei plays an instrument she chose herself.", "D": "Mei plays at least one musical instrument."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INTERPRETATION. Read the statement, then decide which numbered conclusions FOLLOW using ONLY the information given (no outside knowledge).\n\nStatement: \"In a survey of 200 students, 150 said they walk to school and the remaining 50 said they take the bus. None chose any other method of travel.\"\n\nConclusions:\n(1) More students in the survey walk to school than take the bus.\n(2) Most students in the survey live within walking distance of the school.\n\nWhich conclusion(s) follow?", "options": {"A": "Only conclusion (1) follows.", "B": "Only conclusion (2) follows.", "C": "Both (1) and (2) follow.", "D": "Neither (1) nor (2) follows."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "DEDUCTION. Take ALL the stated facts together. Choose the ONE conclusion that does NOT follow.\n\nFacts:\n(1) All members of the Chess Club also belong to the Maths Club.\n(2) Some members of the Maths Club are in Year 8.\n(3) No member of the Drama Club belongs to the Chess Club.", "options": {"A": "Every Chess Club member can also be found on the Maths Club register.", "B": "There is at least one Maths Club member who is in Year 8.", "C": "Some members of the Chess Club are in Year 8.", "D": "No one who is in the Drama Club is also in the Chess Club."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the school replace its paper library catalogue with a searchable online catalogue?\" Three arguments are offered below. Which one is the STRONGEST? (A strong argument is factual, supported by evidence or statistics, and addresses the question directly; a weak one rests on personal feeling or on a sweeping, unsupported claim.)", "options": {"A": "No, I personally find flipping through the paper cards more relaxing than staring at a screen.", "B": "Yes, in a trial last year students found a requested book in an average of 40 seconds using the online catalogue, compared with 4 minutes using the paper catalogue.", "C": "Yes, online things are always better than old-fashioned paper things."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Read the statement, then decide whether the proposed assumption is logical USING ONLY the information in the statement.\n\nStatement: \"The canteen has decided to stop selling sugary soft drinks, so that students will choose healthier drinks like water and milk instead.\"\n\nProposed assumption: \"Removing sugary soft drinks from the canteen will lead students to buy the healthier drinks the canteen still sells.\"\n\nUsing the information in the statement, is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "32"}, {"n": "65", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "66", "type": "mcq", "section": "Chinese", "stem": "小明是在什麼時候第一次學種菜的？<br><span style=\"color:#555\">小明是在什么时候第一次学种菜的？</span>", "options": {"A": "今年的暑假", "B": "今年的寒假", "C": "去年的暑假", "D": "每個週末<br><span style=\"color:#555\">每个周末</span>"}, "fig": "", "passage": "小明的爺爺住在鄉下，屋後有一個小小的菜園。今年暑假，小明第一次跟着爺爺學種菜。爺爺先教他把泥土翻鬆，再小心地撒下一行行的種子。每天清早，小明都會提着水桶去澆水，看看有沒有小芽冒出來。等了差不多兩個星期，嫩綠的幼苗終於探出頭來，小明高興得跳了起來。\n\n可是好景不長，有幾天太陽特別猛烈，一部分幼苗漸漸枯黃、低下了頭。小明看着發蔫的菜苗，心裏很沮喪，嘟着嘴說：「算了吧，我不想種了。」爺爺卻拍拍他的肩膀，笑着說：「種菜就像做人，急不來，也不能一遇到困難就放棄。你只要每天替它們遮遮太陽、按時澆水，慢慢來才會有收穫。」小明聽了，重新打起精神，照着爺爺的話細心照料。\n\n那個暑假，小明不但吃到了自己親手種的青菜，還明白了一個道理：只要肯付出、肯堅持，努力總會有回報。<br><span style=\"color:#555\">小明的爷爷住在乡下，屋后有一个小小的菜园。今年暑假，小明第一次跟着爷爷学种菜。爷爷先教他把泥土翻松，再小心地撒下一行行的种子。每天清早，小明都会提着水桶去浇水，看看有没有小芽冒出来。等了差不多两个星期，嫩绿的幼苗终于探出头来，小明高兴得跳了起来。\n\n可是好景不长，有几天太阳特别猛烈，一部分幼苗渐渐枯黄、低下了头。小明看着发蔫的菜苗，心里很沮丧，嘟着嘴说：「算了吧，我不想种了。」爷爷却拍拍他的肩膀，笑着说：「种菜就像做人，急不来，也不能一遇到困难就放弃。你只要每天替它们遮遮太阳、按时浇水，慢慢来才会有收获。」小明听了，重新打起精神，照着爷爷的话细心照料。\n\n那个暑假，小明不但吃到了自己亲手种的青菜，还明白了一个道理：只要肯付出、肯坚持，努力总会有回报。</span>", "qnum": "1"}, {"n": "67", "type": "mcq", "section": "Chinese", "stem": "爺爺教小明種菜的第一個步驟是什麼？<br><span style=\"color:#555\">爷爷教小明种菜的第一个步骤是什么？</span>", "options": {"A": "把泥土翻鬆<br><span style=\"color:#555\">把泥土翻松</span>", "B": "提水澆水<br><span style=\"color:#555\">提水浇水</span>", "C": "撒下種子<br><span style=\"color:#555\">撒下种子</span>", "D": "替菜苗遮太陽<br><span style=\"color:#555\">替菜苗遮太阳</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "68", "type": "mcq", "section": "Chinese", "stem": "小明撒下種子後，大約等了多久幼苗才長出來？<br><span style=\"color:#555\">小明撒下种子后，大约等了多久幼苗才长出来？</span>", "options": {"A": "差不多兩天<br><span style=\"color:#555\">差不多两天</span>", "B": "差不多兩個星期<br><span style=\"color:#555\">差不多两个星期</span>", "C": "差不多兩個月<br><span style=\"color:#555\">差不多两个月</span>", "D": "差不多半年"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "69", "type": "mcq", "section": "Chinese", "stem": "當一部分幼苗枯黃、小明想放棄時，爺爺是怎樣回應他的？<br><span style=\"color:#555\">当一部分幼苗枯黄、小明想放弃时，爷爷是怎样回应他的？</span>", "options": {"A": "責怪小明照顧得不夠用心<br><span style=\"color:#555\">责怪小明照顾得不够用心</span>", "B": "叫小明重新撒一次種子<br><span style=\"color:#555\">叫小明重新撒一次种子</span>", "C": "鼓勵他別輕易放棄，教他遮太陽、按時澆水<br><span style=\"color:#555\">鼓励他别轻易放弃，教他遮太阳、按时浇水</span>", "D": "決定把菜園改種別的植物<br><span style=\"color:#555\">决定把菜园改种别的植物</span>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "70", "type": "mcq", "section": "Chinese", "stem": "這篇文章最適合用哪一個題目？<br><span style=\"color:#555\">这篇文章最适合用哪一个题目？</span>", "options": {"A": "我的爺爺<br><span style=\"color:#555\">我的爷爷</span>", "B": "種菜給我的啟示<br><span style=\"color:#555\">种菜给我的启示</span>", "C": "鄉下的菜園<br><span style=\"color:#555\">乡下的菜园</span>", "D": "暑假的旅行"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "71", "type": "mcq", "section": "Chinese", "stem": "「嫩綠的幼苗終於探出頭來」一句中，「探出頭來」的意思最接近：<br><span style=\"color:#555\">「嫩绿的幼苗终于探出头来」一句中，「探出头来」的意思最接近：</span>", "options": {"A": "被風吹倒了<br><span style=\"color:#555\">被风吹倒了</span>", "B": "伸出手去摸", "C": "枯萎不見了<br><span style=\"color:#555\">枯萎不见了</span>", "D": "慢慢冒出、長出來<br><span style=\"color:#555\">慢慢冒出、长出来</span>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "72", "type": "mcq", "section": "Chinese", "stem": "「努力總會有回報」中的「回報」，與下面哪一個詞語意思最相近？<br><span style=\"color:#555\">「努力总会有回报」中的「回报」，与下面哪一个词语意思最相近？</span>", "options": {"A": "回家", "B": "回收", "C": "報答、收穫<br><span style=\"color:#555\">报答、收获</span>", "D": "報名<br><span style=\"color:#555\">报名</span>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "下面哪一個詞語的意思和「清早」相反？<br><span style=\"color:#555\">下面哪一个词语的意思和「清早」相反？</span>", "options": {"A": "早上", "B": "傍晚", "C": "中午", "D": "清潔<br><span style=\"color:#555\">清洁</span>"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "爺爺在田裏種了好幾（　）青菜。括號裏應填哪個量詞？<br><span style=\"color:#555\">爷爷在田里种了好几（　）青菜。括号里应填哪个量词？</span>", "options": {"A": "頂<br><span style=\"color:#555\">顶</span>", "B": "粒", "C": "塊<br><span style=\"color:#555\">块</span>", "D": "棵"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "「小明買了一（　）關於種植的書回家看。」括號裏應填哪個量詞？<br><span style=\"color:#555\">「小明买了一（　）关于种植的书回家看。」括号里应填哪个量词？</span>", "options": {"A": "張<br><span style=\"color:#555\">张</span>", "B": "本", "C": "間<br><span style=\"color:#555\">间</span>", "D": "枝"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "小明每天耐心澆水、遇到困難也不放棄，最後吃到自己種的青菜。用哪個成語形容他最合適？<br><span style=\"color:#555\">小明每天耐心浇水、遇到困难也不放弃，最后吃到自己种的青菜。用哪个成语形容他最合适？</span>", "options": {"A": "一心一意", "B": "三心兩意<br><span style=\"color:#555\">三心两意</span>", "C": "持之以恆<br><span style=\"color:#555\">持之以恒</span>", "D": "畫蛇添足<br><span style=\"color:#555\">画蛇添足</span>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "「急不來，慢慢來才會有收穫」這個道理，與下面哪一個成語的意思最接近？<br><span style=\"color:#555\">「急不来，慢慢来才会有收获」这个道理，与下面哪一个成语的意思最接近？</span>", "options": {"A": "欲速則不達<br><span style=\"color:#555\">欲速则不达</span>", "B": "一日千里", "C": "爭分奪秒<br><span style=\"color:#555\">争分夺秒</span>", "D": "手忙腳亂<br><span style=\"color:#555\">手忙脚乱</span>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "下面哪一個句子的詞語次序排得正確、意思通順？<br><span style=\"color:#555\">下面哪一个句子的词语次序排得正确、意思通顺？</span>", "options": {"A": "清早小明每天去澆水都菜園。<br><span style=\"color:#555\">清早小明每天去浇水都菜园。</span>", "B": "澆水小明菜園每天清早去都。<br><span style=\"color:#555\">浇水小明菜园每天清早去都。</span>", "C": "都去小明清早菜園澆水每天。<br><span style=\"color:#555\">都去小明清早菜园浇水每天。</span>", "D": "小明每天清早都去菜園澆水。<br><span style=\"color:#555\">小明每天清早都去菜园浇水。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "「小明（　）吃到了自己種的青菜，（　）明白了一個做人的道理。」填入哪一組關聯詞最恰當？<br><span style=\"color:#555\">「小明（　）吃到了自己种的青菜，（　）明白了一个做人的道理。」填入哪一组关联词最恰当？</span>", "options": {"A": "不但……還……<br><span style=\"color:#555\">不但……还……</span>", "B": "雖然……但是……<br><span style=\"color:#555\">虽然……但是……</span>", "C": "因為……所以……<br><span style=\"color:#555\">因为……所以……</span>", "D": "如果……就……"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
