<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}

  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}

  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}

  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}

  .field{margin:12px 0}

  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}

  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "By the time we reached the pier, the ferry ____ .", "options": {"A": "has already left", "B": "already leaves", "C": "had already left", "D": "was already leaving"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Look, the kittens ____ under the table again.", "options": {"A": "are hiding", "B": "hide", "C": "hid", "D": "have hidden"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which sentence PREDICTS something because of what the speaker can see?", "options": {"A": "It will rain in November most years.", "B": "Those clouds are dark, so it is going to rain.", "C": "It rains a lot in November.", "D": "It rained all last November."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "In which sentence does the subject have the action done TO it?", "options": {"A": "The postman delivered the letters before nine o'clock.", "B": "The letters arrived before nine o'clock.", "C": "Delivering the letters took an hour.", "D": "The letters were delivered before nine o'clock."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Mum asked, \"Where are your shoes?\" Which sentence reports her question correctly?", "options": {"A": "Mum asked where were my shoes.", "B": "Mum asked where my shoes were.", "C": "Mum asked where are my shoes.", "D": "Mum asked, where my shoes were?"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which sentence says that something is NOT allowed?", "options": {"A": "You need not run beside the pool.", "B": "You might not run beside the pool.", "C": "You should not mber from the desk."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "If someone says the test was \"a piece of cake\", they mean it was", "options": {"A": "very short", "B": "very easy", "C": "about food", "D": "shared out between people"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "The words \"portable\", \"import\" and \"transport\" share a part that means", "options": {"A": "build", "B": "look", "C": "carry", "D": "write"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "In \"a large brown envelope with a torn corner\", which single word is the MAIN noun?", "options": {"A": "large", "B": "brown", "C": "corner", "D": "envelope"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "What does the prefix \"pre-\" mean in \"preview\" and \"prepare\"?", "options": {"A": "before", "B": "after", "C": "again", "D": "not"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Adding \"-ly\" to \"quick\" makes a word that describes", "options": {"A": "a person who does it", "B": "how something is done", "C": "a thing", "D": "when something happens"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which spelling of the word meaning \"took place\" is correct?", "options": {"A": "happenned", "B": "hapened", "C": "happend", "D": "happened"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which word means almost the same as \"exhausted\"?", "options": {"A": "bored", "B": "worn out", "C": "hungry", "D": "annoyed"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Which word is the OPPOSITE of \"generous\"?", "options": {"A": "mean", "B": "kind", "C": "quiet", "D": "careful"}, "fig  the sofa with nothing to do and, after a while, asked what the book was about. Ottoline told her. She talked for eleven minutes without stopping, about a girl who could hear what buildings remembered, and her hands moved while she talked, and twice she laughed at something before she got to it.\n\nBea did not know what to say when she finished, so she said the true thing, which was that she had not known Ottoline liked anything that much.\n\n\"You never asked,\" said Ottoline. She did not say it crossly. She said it the way you might read out a bus time. Then she went back to the book, and Bea sat where she was for a long while, and the rain kept on, and she thought about the four summers before this one.", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What was Bea's plan for this summer?", "options": {"A": "To fill her days so that she would hardly see her cousin.", "B": "To ask her cousin about her books.", "C": "To persuade her parents to shorten the visit.", "D": "To make her cousin join in with her friends."}, "fig": "", "passage": "<strong>The Quiet Cousin</strong><br>Every summer, Bea's cousin Ottoline came to stay for two weeks, and every summer Bea counted the days until she left. It was not that Ottoline was unkind. It was that she said almost nothing. She would sit at the end of the sofa with a book, answer a question in three words, and go back to the book, and Bea would be left feeling as though she had done something wrong without being told what it was.\n\nThis summer Bea had a plan. She would simply be busy. She arranged three things a day with her friends, and left Ottoline to the sofa, and told herself this was kinder for everybody.\n\nOn the fifth day it rained without stopping and every plan was cancelled. Bea sat down at the other end of the sofa with nothing to do and, after a while, asked what the book was about. Ottoline told her. She talked for eleven minutes without stopping, about a girl who could hear what buildings remembered, and her hands moved while she talked, and twice she laughed at something before she got to it.\n\nBea did not know what to say when she finished, so she said the true thing, which was that she had not known Ottoline liked anything that much.\n\n\"You never asked,\" said Ottoline. She did not say it crossly. She said it the way you might read out a bus time. Then she went back to the book, and Bea sat where she was for a long while, and the rain kept on, and she thought about the four summers before this one.", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "What made the conversation happen at all?", "options": {"A": "Ottoline asked Bea to sit with her.", "B": "Rain cancelled everything Bea had arranged.", "C": "Bea's parents told her to be more polite.", "D": "Ottoline finished her book and had nothing to read."}, "fig": "", "passage": "<strong>The Quiet Cousin</strong><br>Every summer, Bea's cousin Ottoline came to stay for two weeks, and every summer Bea counted the days until she left. It was not that Ottoline was unkind. It was that she said almost nothing. She would sit at the end of the sofa with a book, answer a question in three words, and go back to the book, and Bea would be left feeling as though she had done something wrong without being told what it was.\n\nThis summer Bea had a plan. She would simply be busy. She arranged three things a day with her friends, and left Ottoline to the sofa, and told herself this was kinder for everybody.\n\nOn the fifth day it rained without stopping and every plan was cancelled. Bea sat down at the other end of the sofa with nothing to do and, after a while, asked what the book was about. Ottoline told her. She talked for eleven minutes without stopping, about a girl who could hear what buildings remembered, and her hands moved while she talked, and twice she laughed at something before she got to it.\n\nBea did not know what to say when she finished, so she said the true thing, which was that she had not known Ottoline liked anything that much.\n\n\"You never asked,\" said Ottoline. She did not say it crossly. She said it the way you might read out a bus time. Then she went back to the book, and Bea sat where she was for a long while, and the rain kept on, and she thought about the four summers before this one.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "What does \"You never asked\" tell the reader about the four earlier summers?", "options": {"A": "Ottoline had been angry with Bea for four years.", "B": "Ottoline had not liked reading until this summer.", "C": "Bea had asked her about books before and been refused.", "D": "Ottoline had things to say and nobody had asked her for them."}, "fig": "", "passage": "<strong>The Quiet Cousin</strong><br>Every summer, Bea's cousin Ottoline came to stay for two weeks, and every summer Bea counted the days until she left. It was not that Ottoline was unkind. It was that she said almost nothing. She would sit at the end of the sofa with a book, answer a question in three words, and go back to the book, and Bea would be left feeling as though she had done something wrong without being told what it was.\n\nThis summer Bea had a plan. She would simply be busy. She arranged three things a day with her friends, and left Ottoline to the sofa, and told herself this was kinder for everybody.\n\nOn the fifth day it rained without stopping and every plan was cancelled. Bea sat down at the other end of the sofa with nothing to do and, after a while, asked what the book was about. Ottoline told her. She talked for eleven minutes without stopping, about a girl who could hear what buildings remembered, and her hands moved while she talked, and twice she laughed at something before she got to it.\n\nBea did not know what to say when she finished, so she said the true thing, which was that she had not known Ottoline liked anything that much.\n\n\"You never asked,\" said Ottoline. She did not say it crossly. She said it the way you might read out a bus time. Then she went back to the book, and Bea sat where she was for a long while, and the rain kept on, and she thought about the four summers before this one.", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "If you had to say in one sentence what this story is about, which would you choose?", "options": {"A": "A girl learns that she should be kinder to visitors.", "B": "Two cousins discover that they both love the same book.", "C": "A girl discovers that the cousin she found difficult had been waiting to be asked.", "D": "A rainy day spoils a summer holiday."}, "fig": "", "passage": "<strong>The Quiet Cousin</strong><br>Every summer, Bea's cousin Ottoline came to stay for two weeks, and every summer Bea counted the days until she left. It was not that Ottoline was unkind. It was that she said almost nothing. She would sit at the end of the sofa with a book, answer a question in three words, and go back to the book, and Bea would be left feeling as though she had done something wrong without being told what it was.\n\nThis summer Bea had a plan. She would simply be busy. She arranged three things a day with her friends, and left Ottoline to the sofa, and told herself this was kinder for everybody.\n\nOn the fifth day it rained without stopping and every plan was cancelled. Bea sat down at the other end of the sofa with nothing to do and, after a while, asked what the book was about. Ottoline told her. She talked for eleven minutes without stopping, about a girl who could hear what buildings remembered, and her hands moved while she talked, and twice she laughed at something before she got to it.\n\nBea did not know what to say when she finished, so she said the true thing, which was that she had not known Ottoline liked anything that much.\n\n\"You never asked,\" said Ottoline. She did not say it crossly. She said it the way you might read out a bus time. Then she went back to the book, and Bea sat where she was for a long while, and the rain kept on, and she thought about the four summers before this one.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "According to the text, what was clipping?", "options": {"A": "Shaving a thin sliver of metal off the edge of a coin and spending the coin as if it were whole.", "B": "Cutting a coin in half so that it could be shared.", "C": "Stamping a new pattern on to an old coin.", "D": "Melting coins down to make new ones."}, "fig": "", "passage": "<strong>Why Coins Have Ridges</strong><br>Pick up a coin and run your thumb along its edge. On some coins the edge is smooth, and on others it is covered in fine grooves. Those grooves have a name, milling, and a reason that has almost nothing to do with the coins in your pocket today.\n\nFor most of history, coins were worth what they were made of. A silver coin was accepted because it contained a certain weight of silver, not because a government said so. That created an obvious temptation. A dishonest person could shave a thin sliver off the edge of a coin, spend the coin as though it were whole, and keep the silver. Do it to enough coins and the shavings added up. The practice was called clipping, and it was common enough to be a serious problem: coins in circulation grew lighter and lighter, and people began weighing them instead of counting them.\n\nThe answer was to make the edge of the coin part of its design. If the edge carries a pattern of grooves, a clipped coin shows at once, because the pattern is broken. Milling spread through European mints in the seventeenth century, and clipping stopped being worth the risk.\n\nModern coins are not worth their metal, so nobody clips them, and the reason for milling has gone. The grooves stayed anyway. They turned out to be useful for something the original mints never intended: a milled edge can be told from a smooth one by touch alone, which is how many people who cannot see the coin tell one denomination from another. A defence against thieves became a way of reading money with your fingers.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "Why did clipping work as a way of making money?", "options": {"A": "Coins were too small for anyone to weigh them.", "B": "A coin was worth the metal in it, so the shavings had value of their own.", "C": "There were no laws against damaging coins.", "D": "Governments replaced clipped coins for free."}, "fig": "", "passage": "<strong>Why Coins Have Ridges</strong><br>Pick up a coin and run your thumb along its edge. On some coins the edge is smooth, and on others it is covered in fine grooves. Those grooves have a name, milling, and a reason that has almost nothing to do with the coins in your pocket today.\n\nFor most of history, coins were worth what they were made of. A silver coin was accepted because it contained a certain weight of silver, not because a government said so. That created an obvious temptation. A dishonest person could shave a thin sliver off the edge of a coin, spend the coin as though it were whole, and keep the silver. Do it to enough coins and the shavings added up. The practice was called clipping, and it was common enough to be a serious problem: coins in circulation grew lighter and lighter, and people began weighing them instead of counting them.\n\nThe answer was to make the edge of the coin part of its design. If the edge carries a pattern of grooves, a clipped coin shows at once, because the pattern is broken. Milling spread through European mints in the seventeenth century, and clipping stopped being worth the risk.\n\nModern coins are not worth their metal, so nobody clips them, and the reason for milling has gone. The grooves stayed anyway. They turned out to be useful for something the original mints never intended: a milled edge can be told from a smooth one by touch alone, which is how many people who cannot see the coin tell one denomination from another. A defence against thieves became a way of reading money with your fingers.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "How did milling stop clipping?", "options": {"A": "A clipped coin shows at once, because the pattern on its edge is broken.", "B": "The grooves made the coin too hard to cut.", "C": "The grooves added silver to the edge of the coin.", "D": "The grooves made every coin exactly the same weight."}, "fig": "", "passage": "<strong>Why Coins Have Ridges</strong><br>Pick up a coin and run your thumb along its edge. On some coins the edge is smooth, and on others it is covered in fine grooves. Those grooves have a name, milling, and a reason that has almost nothing to do with the coins in your pocket today.\n\nFor most of history, coins were worth what they were made of. A silver coin was accepted because it contained a certain weight of silver, not because a government said so. That created an obvious temptation. A dishonest person could shave a thin sliver off the edge of a coin, spend the coin as though it were whole, and keep the silver. Do it to enough coins and the shavings added up. The practice was called clipping, and it was common enough to be a serious problem: coins in circulation grew lighter and lighter, and people began weighing them instead of counting them.\n\nThe answer was to make the edge of the coin part of its design. If the edge carries a pattern of grooves, a clipped coin shows at once, because the pattern is broken. Milling spread through European mints in the seventeenth century, and clipping stopped being worth the risk.\n\nModern coins are not worth their metal, so nobody clips them, and the reason for milling has gone. The grooves stayed anyway. They turned out to be useful for something the original mints never intended: a milled edge can be told from a smooth one by touch alone, which is how many people who cannot see the coin tell one denomination from another. A defence against thieves became a way of reading money with your fingers.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What is the writer's main point in the last paragraph?", "options": {"A": "Modern coins should be made of more valuable metal.", "B": "Milling is no longer used on any coins today.", "C": "The grooves stayed after their original purpose ended, and found a new use nobody planned.", "D": "Thieves have found new ways to damage coins."}, "fig": "", "passage": "<strong>Why Coins Have Ridges</strong><br>Pick up a coin and run your thumb along its edge. On some coins the edge is smooth, and on others it is covered in fine grooves. Those grooves have a name, milling, and a reason that has almost nothing to do with the coins in your pocket today.\n\nFor most of history, coins were worth what they were made of. A silver coin was accepted because it contained a certain weight of silver, not because a government said so. That created an obvious temptation. A dishonest person could shave a thin sliver off the edge of a coin, spend the coin as though it were whole, and keep the silver. Do it to enough coins and the shavings added up. The practice was called clipping, and it was common enough to be a serious problem: coins in circulation grew lighter and lighter, and people began weighing them instead of counting them.\n\nThe answer was to make the edge of the coin part of its design. If the edge carries a pattern of grooves, a clipped coin shows at once, because the pattern is broken. Milling spread through European mints in the seventeenth century, and clipping stopped being worth the risk.\n\nModern coins are not worth their metal, so nobody clips them, and the reason for milling has gone. The grooves stayed anyway. They turned out to be useful for something the original mints never intended: a milled edge can be told from a smooth one by touch alone, which is how many people who cannot see the coin tell one denomination from another. A defence against thieves became a way of reading money with your fingers.", "qnum": "31"}, {"n": "33", "type": "writing", "section": "English Writing", "intro": "This is a PERSONAL ESSAY. Write about yourself, in the first person, and let the reader see the moment rather than only being told about it. You will be assessed on how clearly you organise your ideas, the words you choose, and the accuracy of your sentences.", "label": "", "body": "Write about a person you once misjudged. Say what you thought of them at first, what changed your mind, and what you think now.", "hint": "Write at least 7 sentences. Plan for a moment before you begin, use paragraphs, and check your spelling and punctuation before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "34", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "35", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which number is the LARGEST? 8,099, 8,910, 8,901, 8,199", "options": {"A": "8,901", "B": "8,199", "C": "8,099", "D": "8,910"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "36", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Write the number twenty thousand and forty in digits.", "options": {"A": "2,040", "B": "20,400", "C": "20,040", "D": "200,040"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "37", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cinema has 480 seats. On Friday 297 were sold and on Saturday 361 were sold. How many more seats were sold on Saturday than on Friday?", "options": {"A": "64", "B": "658", "C": "119", "D": "74"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "38", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Ivy had $500. She spent $128 on a bag and $75 on a book. How much has she left?", "options": {"A": "$372", "B": "$297", "C": "$425", "D": "$703"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "39", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 24 x 15.", "options": {"A": "360", "B": "120", "C": "39", "D": "340"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A rope 154 cm long is cut into pieces 7 cm long. How many pieces are there?", "options": {"A": "21", "B": "23", "C": "1,078", "D": "22"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "There are 6 rows of chairs with 18 chairs in each row. 25 chairs are taken away. How many chairs are left?", "options": {"A": "108", "B": "133", "C": "83", "D": "78"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The arrow on the number line shown points to which fraction?", "options": {"A": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">4</span></span>", "B": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">5</span></span>", "C": "<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">5</span></span>", "D": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">3</span></span>"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"420\" height=\"110\" viewBox=\"0 0 420 110\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"420\" height=\"110\" fill=\"white\"/><line x1=\"40\" y1=\"70\" x2=\"380\" y2=\"70\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"40.0\" y1=\"63\" x2=\"40.0\" y2=\"77\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"63\" x2=\"108.0\" y2=\"77\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"176.0\" y1=\"63\" x2=\"176.0\" y2=\"77\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"244.0\" y1=\"63\" x2=\"244.0\" y2=\"77\" stroke=\"#333\" stroke-width=\"2\"/><line ter turning</text></svg>", "passage": "", "qnum": "22"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A farmer has some chickens and some cows. Altogether there are 8 heads and 22 legs. How many cows are there?", "options": {"A": "5", "B": "4", "C": "3", "D": "8"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which of these words would come LAST in a dictionary? shore, shop, short, shone", "options": {"A": "short", "B": "shore", "C": "shop", "D": "shone"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code, WIN is written XJO. How is BOX written?", "options": {"A": "APW", "B": "CPY", "C": "CPX", "D": "DQZ"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A swimming lesson runs from 09:50 to 10:35. How long does it last?", "options": {"A": "85 minutes", "B": "15 minutes", "C": "1 hour 45 minutes", "D": "45 minutes"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The library will start opening at lunchtime, so that pupils who cannot come after school are able to borrow books.\"\n\nPROPOSED ASSUMPTION: \"Some pupils are unable to come to the library after school.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "No. The statement announces a change to the opening times and claims nothing about the pupils.", "B": "Yes. The whole reason given for opening at lunchtime is to reach pupils who cannot come after school, which takes for granted that such pupils exist."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every pupil who won a prize at the science fair had entered on their own, without a partner. Leo entered the science fair on his own.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "It cannot be told from the statement whether Leo won a prize.", "B": "Leo won a prize.", "C": "Leo did not win a prize.", "D": "Everyone who entered on their own won a prize."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"All 200 pupils in Years 5 and 6 were asked about after-school clubs. 130 belong to at least one club, 90 stay for after-school study, and 60 do both.\"\n\nCONCLUSION (1): More than half the pupils belong to at least one club.\nCONCLUSION (2): Most pupils who stay for study also belong to a club.\nCONCLUSION (3): 40 pupils do neither.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "Conclusions 1 and 3 follow, but Conclusion 2 does not.", "B": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "C": "All three conclusions follow.", "D": "Conclusion 1 follows, but Conclusions 2 and 3 do not."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"Everyone who helps in the school garden has a set of gloves. Nobody with a set of gloves has to borrow from the store cupboard.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "Everyone with a set of gloves helps in the school garden.", "B": "Some garden helpers borrow from the store cupboard.", "C": "Nobody who helps in the school garden has to borrow from the store cupboard."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the school let pupils choose where they sit in class?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "No. A teacher at a nearby school tried both arrangements with the same class for half a term each and kept a record. When pupils chose their own seats, the amount of work finished in lessons fell by about a fifth, and the pupils who lost the most were the ones who had been struggling before. Nothing else about the lessons changed between the two halves of the term.", "B": "Yes. It is our classroom too, and nobody likes being told where to sit. Everyone knows you work better when you are comfortable and happy. Why should a teacher decide something so small?", "C": "No. If pupils choose, some of them will end up sitting alone, and that would be unkind."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The class notice board said: 'Since the reading corner was set up in March, the number of books borrowed from the class shelf each week has risen from 12 to 27.'\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "The reading corner made pupils want to read more.", "B": "More books are borrowed from the class shelf each week now than before March.", "C": "Every pupil in the class now borrows a book each week.", "D": "The class shelf now holds more books than it did in March."}, "fig": "", "passage": "", "qnum": "32"}, {"n": "67", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "68", "type": "mcq", "section": "Chinese", "stem": "媽媽叮囑「我」要注意甚麼？<br><i>妈妈叮嘱「我」要注意甚么？</i>", "options": {"A": "坐九號巴士，第四個站下車<br><i>坐九号巴士，第四个站下车</i>", "B": "坐四號巴士，第九個站下車<br><i>坐四号巴士，第九个站下车</i>", "C": "坐九號巴士，總站下車<br><i>坐九号巴士，总站下车</i>", "D": "跟着同學一起下車<br><i>跟着同学一起下车</i>"}, "fig": "", "passage": "升上小六那年，媽媽對我說：「明天起，你自己坐巴士上學吧。」我聽了，心裏又高興又害怕。\n\n第一天早上，媽媽把我送到巴士站，把八達通放進我的外套袋子裏，叮囑我：「記住是九號巴士，第四個站下車，看見那間紅色的士多就是了。」我一連點了幾次頭，其實心裏一直在默唸：九號，第四個站，紅色的士多。\n\n巴士來了。我上了車，找了一個靠窗的位子坐下。窗外的街道我天天都走，這天卻好像忽然變得陌生。我不敢看風景，只顧數着站牌：一個、兩個、三個……數到第三個站的時候，車上忽然上來很多人，我被擠得看不見窗外，心一下子慌了起來。\n\n我踮起腳尖，好不容易才從人群的縫隙裏望出去，看見了那間紅色的士多。我連忙按鈴，擠到門口下了車。站在路 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V5)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
