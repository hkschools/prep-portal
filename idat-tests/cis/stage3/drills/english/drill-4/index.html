<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 3 English Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT CIS: Stage 3 English Drill 4</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "3", VERSION = "ENG-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Fill in the blank.<br>The twins painted the whole shed by ____.", "options": {"A": "themselves", "B": "theirselves", "C": "himself", "D": "them"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which sentence means the same as the one below, written in the PASSIVE voice?<br>The council planted forty trees along the river.", "options": {"A": "Forty trees planted the council along the river.", "B": "The council was planting forty trees along the river.", "C": "Along the river, the council planted forty trees.", "D": "Forty trees were planted along the river by the council."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Fill in the blank with the word that best joins the two ideas.<br>The path was flooded; ____, we took the longer route over the hill.", "options": {"A": "however", "B": "meanwhile", "C": "therefore", "D": "otherwise"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which sentence is correct?", "options": {"A": "The rain stopped, we walked home.", "B": "The rain stopped, so we walked home.", "C": "The rain stopped so, we walked home.", "D": "The rain stopped we walked home."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Correct the underlined word.<br>The dog wagged <u>it's</u> tail when we came in.", "options": {"A": "its'", "B": "it is", "C": "its", "D": "their"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which affix means \"again\"?", "options": {"A": "un-", "B": "-able", "C": "sub-", "D": "re-"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which word is close in meaning to the underlined word but is a STRONGER emotion?<br>He was <u>pleased</u> to hear the result.", "options": {"A": "glad", "B": "overjoyed", "C": "relieved", "D": "interested"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Only one of these spellings is correct. Which one?", "options": {"A": "definitely", "B": "definately", "C": "definitly", "D": "defenitely"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the word that is a synonym of the underlined word.<br>The room fell <u>silent</u> when she stood up.", "options": {"A": "empty", "B": "dark", "C": "still", "D": "quiet"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What does this saying mean?<br>\"To be in the same boat.\"", "options": {"A": "To be in the same difficult situation as someone else", "B": "To travel together on a journey", "C": "To agree completely with someone", "D": "To take turns at a task"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Where did the grandmother keep the tide table?", "options": {"A": "Pinned up in the kitchen", "B": "In a drawer at the harbour", "C": "Folded in her coat pocket", "D": "She did not own one."}, "fig": "", "passage": "<strong>Low Tide</strong><br><p>My grandmother could read the tide table the way other people read a bus timetable. She kept the year's copy folded in her coat pocket, soft as cloth from being opened so often, and she never once needed to look at it.</p><p>The first time she took me out to the sandbank, I ran ahead. The sand was ribbed and firm and seemed to go on for ever. She walked slowly behind me, stopping now and then, and I thought she was tired. She was not. She was watching the water in the channel behind us, which had begun, very quietly, to fill.</p><p>She called me back when the channel was still only ankle deep. I complained the whole way. We crossed it, and she sat down on the harbour wall and made me watch. Within twenty minutes the channel was chest deep and moving fast. The sandbank where I had been standing was gone.</p><p>She did not say anything clever about it. She just folded the tide table back into her pocket. I have never in my life gone onto a beach without knowing what the water is doing.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Why did the narrator think the grandmother was tired?", "options": {"A": "She sat down on the harbour wall.", "B": "She kept stopping as she walked.", "C": "She refused to walk onto the sandbank.", "D": "She complained about the distance."}, "fig": "", "passage": "<strong>Low Tide</strong><br><p>My grandmother could read the tide table the way other people read a bus timetable. She kept the year's copy folded in her coat pocket, soft as cloth from being opened so often, and she never once needed to look at it.</p><p>The first time she took me out to the sandbank, I ran ahead. The sand was ribbed and firm and seemed to go on for ever. She walked slowly behind me, stopping now and then, and I thought she was tired. She was not. She was watching the water in the channel behind us, which had begun, very quietly, to fill.</p><p>She called me back when the channel was still only ankle deep. I complained the whole way. We crossed it, and she sat down on the harbour wall and made me watch. Within twenty minutes the channel was chest deep and moving fast. The sandbank where I had been standing was gone.</p><p>She did not say anything clever about it. She just folded the tide table back into her pocket. I have never in my life gone onto a beach without knowing what the water is doing.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "The tide table is described as \"soft as cloth from being opened so often\". What does this detail suggest?", "options": {"A": "That she consulted it constantly over a long period.", "B": "That the table was cheaply printed.", "C": "That she had recently bought it.", "D": "That she kept it as a keepsake."}, "fig": "", "passage": "<strong>Low Tide</strong><br><p>My grandmother could read the tide table the way other people read a bus timetable. She kept the year's copy folded in her coat pocket, soft as cloth from being opened so often, and she never once needed to look at it.</p><p>The first time she took me out to the sandbank, I ran ahead. The sand was ribbed and firm and seemed to go on for ever. She walked slowly behind me, stopping now and then, and I thought she was tired. She was not. She was watching the water in the channel behind us, which had begun, very quietly, to fill.</p><p>She called me back when the channel was still only ankle deep. I complained the whole way. We crossed it, and she sat down on the harbour wall and made me watch. Within twenty minutes the channel was chest deep and moving fast. The sandbank where I had been standing was gone.</p><p>She did not say anything clever about it. She just folded the tide table back into her pocket. I have never in my life gone onto a beach without knowing what the water is doing.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Why does the grandmother make the narrator sit and watch the channel fill?", "options": {"A": "So that the narrator would apologise for complaining.", "B": "Because she needed to rest before walking home.", "C": "Because she wanted to check her tide table was right.", "D": "So that the danger would be understood rather than just described."}, "fig": "", "passage": "<strong>Low Tide</strong><br><p>My grandmother could read the tide table the way other people read a bus timetable. She kept the year's copy folded in her coat pocket, soft as cloth from being opened so often, and she never once needed to look at it.</p><p>The first time she took me out to the sandbank, I ran ahead. The sand was ribbed and firm and seemed to go on for ever. She walked slowly behind me, stopping now and then, and I thought she was tired. She was not. She was watching the water in the channel behind us, which had begun, very quietly, to fill.</p><p>She called me back when the channel was still only ankle deep. I complained the whole way. We crossed it, and she sat down on the harbour wall and made me watch. Within twenty minutes the channel was chest deep and moving fast. The sandbank where I had been standing was gone.</p><p>She did not say anything clever about it. She just folded the tide table back into her pocket. I have never in my life gone onto a beach without knowing what the water is doing.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which of these comes closest to the overall message of the passage?", "options": {"A": "Children should always obey their elders without question.", "B": "The sea is more dangerous than most people realise.", "C": "Some lessons are learned by being shown rather than being told.", "D": "Older people are better at reading timetables."}, "fig": "", "passage": "<strong>Low Tide</strong><br><p>My grandmother could read the tide table the way other people read a bus timetable. She kept the year's copy folded in her coat pocket, soft as cloth from being opened so often, and she never once needed to look at it.</p><p>The first time she took me out to the sandbank, I ran ahead. The sand was ribbed and firm and seemed to go on for ever. She walked slowly behind me, stopping now and then, and I thought she was tired. She was not. She was watching the water in the channel behind us, which had begun, very quietly, to fill.</p><p>She called me back when the channel was still only ankle deep. I complained the whole way. We crossed it, and she sat down on the harbour wall and made me watch. Within twenty minutes the channel was chest deep and moving fast. The sandbank where I had been standing was gone.</p><p>She did not say anything clever about it. She just folded the tide table back into her pocket. I have never in my life gone onto a beach without knowing what the water is doing.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the writing is typed on a keyboard and you choose ONE of the two tasks below. For Year 7 entry the text type is a personal essay.", "label": "", "body": "", "hint": "Read the instructions carefully and make sure your answer includes EVERY part of the task. Write at least three paragraphs. Use interesting vocabulary and vary the kinds of sentence you write. Check your spelling and punctuation before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "TASK 1\nWrite a personal essay about something an older member of your family or community taught you. Include who they are, how they taught you, and a list of the things you remember about the occasion. Explain whether you still do it their way.", "partB": "TASK 2\nWrite a personal essay about a place you know well outdoors. Describe what it looks, sounds and smells like at a particular time of day. Include one thing that happened to you there, and say why you would take a visitor to see it."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 English Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
</html>
