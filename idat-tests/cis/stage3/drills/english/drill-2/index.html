<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 3 English Drill 2</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT CIS: Stage 3 English Drill 2</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "3", VERSION = "ENG-D2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Fill in the blank.<br>By the time we reached the hall, the concert ____ already begun.", "options": {"A": "has", "B": "was", "C": "have", "D": "had"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which sentence uses the correct verb after 'neither'?", "options": {"A": "Neither of the boys was ready on time.", "B": "Neither of the boys were ready on time.", "C": "Neither of the boy was ready on time.", "D": "Neither of the boys are ready on time."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Correct the underlined word.<br>The team played <u>good</u> in the second half.", "options": {"A": "gooder", "B": "better", "C": "well", "D": "goodly"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which sentence uses commas correctly?", "options": {"A": "After the storm passed we swept the yard, cleared the drain and mended the fence.", "B": "After the storm passed, we swept the yard, cleared the drain and mended the fence.", "C": "After the storm passed, we swept the yard cleared the drain and mended the fence.", "D": "After, the storm passed we swept the yard, cleared the drain and mended the fence."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which sentence uses the apostrophe correctly?", "options": {"A": "The childrens' coats were left in the hall.", "B": "The childrens coats were left in the hall.", "C": "The children's coats were left in the hall.", "D": "The children's coat's were left in the hall."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which affix means \"able to be\"?", "options": {"A": "-ible", "B": "mis-", "C": "-ness", "D": "pre-"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word but is a WEAKER adjective?<br>The room was <u>freezing</u> when we arrived.", "options": {"A": "icy", "B": "warm", "C": "damp", "D": "cool"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is spelled correctly?", "options": {"A": "neccessary", "B": "necessary", "C": "necesary", "D": "neccesary"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Fill in the blank with the correct word.<br>The runners had to wait for ____ turn to start.", "options": {"A": "there", "B": "they're", "C": "theirs", "D": "their"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What does this saying mean?<br>\"To bite off more than you can chew.\"", "options": {"A": "To eat too quickly at a meal", "B": "To take on more than you can manage", "C": "To speak before you have thought", "D": "To refuse an offer of help"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What did the brother ask Sun Bo to make?", "options": {"A": "A cat", "B": "A lantern shaped like a fish", "C": "A tiger", "D": "Nothing; Sun Bo chose for him"}, "fig": "", "passage": "<strong>The Lantern Maker</strong><br><p>Every autumn a man called Sun Bo set up a folding table at the end of our street and made paper lanterns. He worked without a pattern. He would look at a child for a moment, ask one question, and then begin cutting.</p><p>My brother asked for a tiger. What he got was a small fat cat with an enormous striped tail, and he was furious. He carried it home at arm's length, as though it were something he had been asked to throw away.</p><p>That night, at the lantern parade, every tiger in the street looked the same: orange, fierce and identical, printed from the same shop in the market. My brother's ridiculous cat drew a crowd. Three people asked him where he had bought it. By the end of the evening he had stopped explaining that he had asked for a tiger.</p><p>Sun Bo did not come back the following autumn. My brother still has the cat, in a box on top of his wardrobe, and he has never once let anyone borrow it.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Why does the writer describe the brother carrying the lantern \"at arm's length\"?", "options": {"A": "To show how embarrassed he was by it.", "B": "To show the lantern was very heavy.", "C": "To show he was being careful with it.", "D": "To show he was in a hurry to get home."}, "fig": "", "passage": "<strong>The Lantern Maker</strong><br><p>Every autumn a man called Sun Bo set up a folding table at the end of our street and made paper lanterns. He worked without a pattern. He would look at a child for a moment, ask one question, and then begin cutting.</p><p>My brother asked for a tiger. What he got was a small fat cat with an enormous striped tail, and he was furious. He carried it home at arm's length, as though it were something he had been asked to throw away.</p><p>That night, at the lantern parade, every tiger in the street looked the same: orange, fierce and identical, printed from the same shop in the market. My brother's ridiculous cat drew a crowd. Three people asked him where he had bought it. By the end of the evening he had stopped explaining that he had asked for a tiger.</p><p>Sun Bo did not come back the following autumn. My brother still has the cat, in a box on top of his wardrobe, and he has never once let anyone borrow it.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Why does the writer mention that the other tigers were \"printed from the same shop in the market\"?", "options": {"A": "To explain that the market was cheaper.", "B": "To contrast their sameness with the brother's one-off lantern.", "C": "To suggest the other children were dishonest.", "D": "To show the market was very popular."}, "fig": "", "passage": "<strong>The Lantern Maker</strong><br><p>Every autumn a man called Sun Bo set up a folding table at the end of our street and made paper lanterns. He worked without a pattern. He would look at a child for a moment, ask one question, and then begin cutting.</p><p>My brother asked for a tiger. What he got was a small fat cat with an enormous striped tail, and he was furious. He carried it home at arm's length, as though it were something he had been asked to throw away.</p><p>That night, at the lantern parade, every tiger in the street looked the same: orange, fierce and identical, printed from the same shop in the market. My brother's ridiculous cat drew a crowd. Three people asked him where he had bought it. By the end of the evening he had stopped explaining that he had asked for a tiger.</p><p>Sun Bo did not come back the following autumn. My brother still has the cat, in a box on top of his wardrobe, and he has never once let anyone borrow it.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "What changed for the brother during the parade?", "options": {"A": "He decided to buy a tiger lantern instead.", "B": "He gave the lantern away.", "C": "He stopped minding that the lantern was not a tiger.", "D": "He found out why Sun Bo had made a cat."}, "fig": "", "passage": "<strong>The Lantern Maker</strong><br><p>Every autumn a man called Sun Bo set up a folding table at the end of our street and made paper lanterns. He worked without a pattern. He would look at a child for a moment, ask one question, and then begin cutting.</p><p>My brother asked for a tiger. What he got was a small fat cat with an enormous striped tail, and he was furious. He carried it home at arm's length, as though it were something he had been asked to throw away.</p><p>That night, at the lantern parade, every tiger in the street looked the same: orange, fierce and identical, printed from the same shop in the market. My brother's ridiculous cat drew a crowd. Three people asked him where he had bought it. By the end of the evening he had stopped explaining that he had asked for a tiger.</p><p>Sun Bo did not come back the following autumn. My brother still has the cat, in a box on top of his wardrobe, and he has never once let anyone borrow it.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which sentence best sums up what this passage is really about?", "options": {"A": "What makes something valuable is often what makes it unlike everything else.", "B": "Handmade things are always better made than shop-bought ones.", "C": "Children should be grateful for whatever they are given.", "D": "Traditions disappear when the people who keep them leave."}, "fig": "", "passage": "<strong>The Lantern Maker</strong><br><p>Every autumn a man called Sun Bo set up a folding table at the end of our street and made paper lanterns. He worked without a pattern. He would look at a child for a moment, ask one question, and then begin cutting.</p><p>My brother asked for a tiger. What he got was a small fat cat with an enormous striped tail, and he was furious. He carried it home at arm's length, as though it were something he had been asked to throw away.</p><p>That night, at the lantern parade, every tiger in the street looked the same: orange, fierce and identical, printed from the same shop in the market. My brother's ridiculous cat drew a crowd. Three people asked him where he had bought it. By the end of the evening he had stopped explaining that he had asked for a tiger.</p><p>Sun Bo did not come back the following autumn. My brother still has the cat, in a box on top of his wardrobe, and he has never once let anyone borrow it.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the writing is typed on a keyboard and you choose ONE of the two tasks below. For Year 7 entry the text type is a personal essay.", "label": "", "body": "", "hint": "Read the instructions carefully and make sure your answer includes EVERY part of the task. Write at least three paragraphs. Use interesting vocabulary and vary the kinds of sentence you write. Check your spelling and punctuation before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": "TASK 1\nWrite a personal essay about something you own that would seem ordinary to other people but matters to you. Describe the object, explain how you came to have it, and give a list of the occasions you have used or kept it. Say why you would not replace it.\n\nTASK 2\nWrite a personal essay about a time you changed your mind about someone or something. Include what you thought at first, what happened to change it, and who else was involved. Explain what you now think, and what made the difference."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 English Drill 2</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
</html>
