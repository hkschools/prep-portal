<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}

  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}

  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}

const SCHOOL = "CIS", STAGE = "3", VERSION = "4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Mei ____ in this school since she was five years old.", "options": {"A": "is", "B": "was", "C": "will be", "D": "has been"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "We ____ our lunch when the fire bell rang.", "options": {"A": "were eating", "B": "ate", "C": "have eaten", "D": "are eating"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which sentence talks about a plan already made for tomorrow?", "options": {"A": "We meet at the library at four.", "B": "We will have met at the library at four.", "C": "We are meeting at the library at four.", "D": "We met at the library at four."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "In which sentence is the subject having something done TO it?", "options": {"A": "A football broke the window.", "B": "The window was broken by a football.", "C": "The window looked broken.", "D": "Someone broke the window."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Dad said, \"I am cooking dinner.\" Which sentence reports this correctly?", "options": {"A": "Dad said that I was cooking dinner.", "B": "Dad said that he is cooking dinner.", "C": "Dad said that he was cooking dinner.", "D": "Dad said that he cooked dinner."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which sentence ASKS FOR PERMISSION most politely?", "options": {"A": "Give me your ruler.", "B": "I am taking your ruler.", "C": "You must lend me your ruler.", "D": "May I borrow your ruler, please?"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which sentence uses commas correctly in a list?", "options": {"A": "I packed a towel, sunscreen, a hat and my swimming goggles.", "B": "I packed a towel sunscreen, a hat and my swimming goggles.", "C": "I packed, a towel, sunscreen, a hat and my swimming goggles.", "D": "I packed a towel, sunscreen, a hat, and, my swimming goggles."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence puts the comma in the right place?", "options": {"A": "After the rain, stopped we walked home along the beach.", "B": "After the rain stopped, we walked home along the beach.", "C": "After the rain stopped we walked home, along the beach.", "D": "After, the rain stopped we walked home along the beach."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which of these is a COMPLEX sentence?", "options": {"A": "Because the bus was late, we missed the start of the film.", "B": "The bus was late, and we missed the start of the film.", "C": "The bus was late. We missed the start of the film.", "D": "The late bus made us miss the start of the film."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which sentence has the correct verb?", "options": {"A": "The box of old photographs belong to my grandmother.", "B": "The box of old photographs are belonging to my grandmother.", "C": "The box of old photographs belongs to my grandmother.", "D": "The box of old photographs were my grandmother."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "\"Sam gave his brother the map because <u>he</u> knew the way.\" Who most likely knew the way?", "options": {"A": "Sam", "B": "Sam's brother", "C": "the person who drew the map", "D": "nobody in the sentence"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "If a friend tells you to \"keep your chin up\", they are telling you to", "options": {"A": "stand up straighter", "B": "stop talking so much", "C": "look upwards to see something", "D": "stay cheerful in a difficult moment"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "The words \"telephone\", \"telescope\" and \"television\" share a beginning that means", "options": {"A": "sound", "B": "picture", "C": "far off", "D": "quick"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "In \"the rusty old gate at the end of the lane creaked\", which words make up the NOUN PHRASE that is the subject?", "options": {"A": "the rusty old gate at the end of the lane", "B": "the rusty old gate", "C": "at the end of the lane", "D": "creaked"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which prefix added to \"lock\" means to open it again?", "options": {"A": "re-", "B": "dis-", "C": "mis-", "D": "un-"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Adding \"-less\" to a word usually means", "options": {"A": "full of it", "B": "without it", "C": "able to do it", "D": "the person who does it"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which spelling of the word meaning \"needed\" is correct?", "options": {"A": "neccessary", "B": "necesary", "C": "necessary", "D": "necessery"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which word means almost the same as \"enormous\"?", "options": {"A": "tiny", "B": "huge", "C": "heavy", "D": "noisy"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Which word is the OPPOSITE of \"ancient\"?", "options": {"A": "historic", "B": "enormous", "C": "rare", "D": "modern"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "\"The path was <u>treacherous</u> after the rain, so we walked very slowly.\" \"Treacherous\" here means", "options": {"A": "dangerous to walk on", "B": "very long", "C": "beautiful to look at", "D": "closed to the public"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which of these is a compound word?", "options": {"A": "playful", "B": "playground", "C": "player", "D": "replay"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Which word describes a smell in a PLEASANT way?", "options": {"A": "stench", "B": "odour", "C": "fragrance", "D": "whiff"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Why did Kai choose the last row?", "options": {"A": "Because he wanted to sit next to Priya.", "B": "Because the teacher told him to sit there.", "C": "Because he could not see the board from the front.", "D": "So that nobody would find out he could not read the board."}, "fig": "", "passage": "<strong>The Last Row</strong><br>For the whole of Primary Five, Kai sat in the last row. He had chosen it himself on the first morning, and he had a reason, although he never gave it to anyone. From the back you could see the whole room. Nobody could look over your shoulder. And if the teacher wrote something on the board that you could not read, nobody found out.\n\nHe had grown good at not finding out. He copied from Priya beside him, who wrote large and neatly. He learned to guess from the shape of a word, and he was right often enough. When the teacher asked him to read a number aloud from the board he said the first one that came into his head, and once or twice it was even correct.\n\nIt was the school photograph that gave him away. The photographer set the classes up on benches and asked everyone to look at the camera, and Kai looked, and could not see it. He could see a blur with a person-shaped part in the middle. He turned to Priya and said, without meaning to, \"Where is it?\"\n\nPriya told the teacher. The teacher told his mother. A week later Kai came to school in a pair of thin silver frames and sat, for the first time, in the second row from the front. He spent the whole morning reading the board out of order, jumping ahead, the way you eat the best part of a meal first. At lunchtime Priya asked him whether the glasses were annoying.\n\n\"A bit,\" said Kai, who could see her face clearly from where he sat, and had never noticed before that she had a small scar above one eyebrow. \"Not much.\"", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What does \"He had grown good at not finding out\" tell us about Kai?", "options": {"A": "He had learned ways of hiding the problem instead of solving it.", "B": "He was not interested in his schoolwork.", "C": "He had a poor memory for what he read.", "D": "He preferred to learn things on his own."}, "fig": "", "passage": "<strong>The Last Row</strong><br>For the whole of Primary Five, Kai sat in the last row. He had chosen it himself on the first morning, and he had a reason, although he never gave it to anyone. From the back you could see the whole room. Nobody could look over your shoulder. And if the teacher wrote something on the board that you could not read, nobody found out.\n\nHe had grown good at not finding out. He copied from Priya beside him, who wrote large and neatly. He learned to guess from the shape of a word, and he was right often enough. When the teacher asked him to read a number aloud from the board he said the first one that came into his head, and once or twice it was even correct.\n\nIt was the school photograph that gave him away. The photographer set the classes up on benches and asked everyone to look at the camera, and Kai looked, and could not see it. He could see a blur with a person-shaped part in the middle. He turned to Priya and said, without meaning to, \"Where is it?\"\n\nPriya told the teacher. The teacher told his mother. A week later Kai came to school in a pair of thin silver frames and sat, for the first time, in the second row from the front. He spent the whole morning reading the board out of order, jumping ahead, the way you eat the best part of a meal first. At lunchtime Priya asked him whether the glasses were annoying.\n\n\"A bit,\" said Kai, who could see her face clearly from where he sat, and had never noticed before that she had a small scar above one eyebrow. \"Not much.\"", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "What finally revealed Kai's difficulty?", "options": {"A": "He read a number wrongly from the board.", "B": "Priya noticed him copying her work.", "C": "His mother took him to have his eyes tested.", "D": "He could not see the camera at the school photograph."}, "fig": "", "passage": "<strong>The Last Row</strong><br>For the whole of Primary Five, Kai sat in the last row. He had chosen it himself on the first morning, and he had a reason, although he never gave it to anyone. From the back you could see the whole room. Nobody could look over your shoulder. And if the teacher wrote something on the board that you could not read, nobody found out.\n\nHe had grown good at not finding out. He copied from Priya beside him, who wrote large and neatly. He learned to guess from the shape of a word, and he was right often enough. When the teacher asked him to read a number aloud from the board he said the first one that came into his head, and once or twice it was even correct.\n\nIt was the school photograph that gave him away. The photographer set the classes up on benches and asked everyone to look at the camera, and Kai looked, and could not see it. He could see a blur with a person-shaped part in the middle. He turned to Priya and said, without meaning to, \"Where is it?\"\n\nPriya told the teacher. The teacher told his mother. A week later Kai came to school in a pair of thin silver frames and sat, for the first time, in the second row from the front. He spent the whole morning reading the board out of order, jumping ahead, the way you eat the best part of a meal first. At lunchtime Priya asked him whether the glasses were annoying.\n\n\"A bit,\" said Kai, who could see her face clearly from where he sat, and had never noticed before that she had a small scar above one eyebrow. \"Not much.\"", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "The story says Kai read the board \"the way you eat the best part of a meal first\". This suggests that he was", "options": {"A": "in a great hurry to finish", "B": "careless about doing things in order", "C": "eager, taking in what he had been missing", "D": "hungry after a long morning"}, "fig": "", "passage": "<strong>The Last Row</strong><br>For the whole of Primary Five, Kai sat in the last row. He had chosen it himself on the first morning, and he had a reason, although he never gave it to anyone. From the back you could see the whole room. Nobody could look over your shoulder. And if the teacher wrote something on the board that you could not read, nobody found out.\n\nHe had grown good at not finding out. He copied from Priya beside him, who wrote large and neatly. He learned to guess from the shape of a word, and he was right often enough. When the teacher asked him to read a number aloud from the board he said the first one that came into his head, and once or twice it was even correct.\n\nIt was the school photograph that gave him away. The photographer set the classes up on benches and asked everyone to look at the camera, and Kai looked, and could not see it. He could see a blur with a person-shaped part in the middle. He turned to Priya and said, without meaning to, \"Where is it?\"\n\nPriya told the teacher. The teacher told his mother. A week later Kai came to school in a pair of thin silver frames and sat, for the first time, in the second row from the front. He spent the whole morning reading the board out of order, jumping ahead, the way you eat the best part of a meal first. At lunchtime Priya asked him whether the glasses were annoying.\n\n\"A bit,\" said Kai, who could see her face clearly from where he sat, and had never noticed before that she had a small scar above one eyebrow. \"Not much.\"", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "Which sentence best sums up the whole story?", "options": {"A": "A boy hides a difficulty for a long time until an accident brings it into the open, and his life changes for the better.", "B": "A boy is moved to the front of the class as a punishment.", "C": "A boy learns that copying another pupil's work is wrong.", "D": "A girl helps her friend to become better at reading."}, "fig": "", "passage": "<strong>The Last Row</strong><br>For the whole of Primary Five, Kai sat in the last row. He had chosen it himself on the first morning, and he had a reason, although he never gave it to anyone. From the back you could see the whole room. Nobody could look over your shoulder. And if the teacher wrote something on the board that you could not read, nobody found out.\n\nHe had grown good at not finding out. He copied from Priya beside him, who wrote large and neatly. He learned to guess from the shape of a word, and he was right often enough. When the teacher asked him to read a number aloud from the board he said the first one that came into his head, and once or twice it was even correct.\n\nIt was the school photograph that gave him away. The photographer set the classes up on benches and asked everyone to look at the camera, and Kai looked, and could not see it. He could see a blur with a person-shaped part in the middle. He turned to Priya and said, without meaning to, \"Where is it?\"\n\nPriya told the teacher. The teacher told his mother. A week later Kai came to school in a pair of thin silver frames and sat, for the first time, in the second row from the front. He spent the whole morning reading the board out of order, jumping ahead, the way you eat the best part of a meal first. At lunchtime Priya asked him whether the glasses were annoying.\n\n\"A bit,\" said Kai, who could see her face clearly from where he sat, and had never noticed before that she had a small scar above one eyebrow. \"Not much.\"", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "According to the text, why did every town once keep its own time?", "options": {"A": "Clocks were not accurate enough to agree with each other.", "B": "Noon was set by when the sun was highest over that town.", "C": "Each country wanted to be different from its neighbours.", "D": "There were not enough clocks to go round."}, "fig": "", "passage": "<strong>Why the World Has Time Zones</strong><br>For most of human history, every town kept its own time. Noon was the moment the sun stood highest over that town, and since the sun reaches one town a little before the next, a clock in one place was never quite the same as a clock a hundred kilometres away. Nobody minded, because nobody could travel fast enough for the difference to matter.\n\nThe railway changed that. A train could cross in a morning a distance that had taken days on foot, and railway companies had to publish timetables. A timetable is useless if every station on the line is using its own clock. In Britain in the 1840s the railways began telling every station to use the time kept in London, and people called it railway time.\n\nOther countries had the same problem on a larger scale. In 1883 the railways of North America divided the continent into four bands, and inside each band every clock read the same. The following year an international meeting agreed to extend the idea around the world, dividing the globe into twenty-four zones, each one hour apart.\n\nThe zones are not the neat stripes the idea suggests. Their edges bend around borders, because a country would rather keep one time than split itself in two. China is wide enough for five zones and uses one. A few places, including parts of India and Australia, sit half an hour off their neighbours rather than a whole hour.\n\nSo the map of time is not really a map of the sun. It is a map of what people found convenient, drawn on top of the sun.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "According to the text, what made local time a PROBLEM?", "options": {"A": "Ships began to cross the ocean more often.", "B": "Towns grew much larger than before.", "C": "Railways had to publish timetables covering many stations.", "D": "Clocks became cheap enough for everyone to own one."}, "fig": "", "passage": "<strong>Why the World Has Time Zones</strong><br>For most of human history, every town kept its own time. Noon was the moment the sun stood highest over that town, and since the sun reaches one town a little before the next, a clock in one place was never quite the same as a clock a hundred kilometres away. Nobody minded, because nobody could travel fast enough for the difference to matter.\n\nThe railway changed that. A train could cross in a morning a distance that had taken days on foot, and railway companies had to publish timetables. A timetable is useless if every station on the line is using its own clock. In Britain in the 1840s the railways began telling every station to use the time kept in London, and people called it railway time.\n\nOther countries had the same problem on a larger scale. In 1883 the railways of North America divided the continent into four bands, and inside each band every clock read the same. The following year an international meeting agreed to extend the idea around the world, dividing the globe into twenty-four zones, each one hour apart.\n\nThe zones are not the neat stripes the idea suggests. Their edges bend around borders, because a country would rather keep one time than split itself in two. China is wide enough for five zones and uses one. A few places, including parts of India and Australia, sit half an hour off their neighbours rather than a whole hour.\n\nSo the map of time is not really a map of the sun. It is a map of what people found convenient, drawn on top of the sun.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "The text mentions China in order to show that", "options": {"A": "China was the first country to use time zones", "B": "China's clocks are half an hour off its neighbours", "C": "China has more time zones than any other country", "D": "a country may use one time even when it is wide enough for several zones"}, "fig": "", "passage": "<strong>Why the World Has Time Zones</strong><br>For most of human history, every town kept its own time. Noon was the moment the sun stood highest over that town, and since the sun reaches one town a little before the next, a clock in one place was never quite the same as a clock a hundred kilometres away. Nobody minded, because nobody could travel fast enough for the difference to matter.\n\nThe railway changed that. A train could cross in a morning a distance that had taken days on foot, and railway companies had to publish timetables. A timetable is useless if every station on the line is using its own clock. In Britain in the 1840s the railways began telling every station to use the time kept in London, and people called it railway time.\n\nOther countries had the same problem on a larger scale. In 1883 the railways of North America divided the continent into four bands, and inside each band every clock read the same. The following year an international meeting agreed to extend the idea around the world, dividing the globe into twenty-four zones, each one hour apart.\n\nThe zones are not the neat stripes the idea suggests. Their edges bend around borders, because a country would rather keep one time than split itself in two. China is wide enough for five zones and uses one. A few places, including parts of India and Australia, sit half an hour off their neighbours rather than a whole hour.\n\nSo the map of time is not really a map of the sun. It is a map of what people found convenient, drawn on top of the sun.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What is the writer's main purpose in this text?", "options": {"A": "To persuade countries to use fewer time zones", "B": "To explain how and why time zones came to exist", "C": "To describe how a railway timetable is written", "D": "To compare the clocks used in different countries"}, "fig": "", "passage": "<strong>Why the World Has Time Zones</strong><br>For most of human history, every town kept its own time. Noon was the moment the sun stood highest over that town, and since the sun reaches one town a little before the next, a clock in one place was never quite the same as a clock a hundred kilometres away. Nobody minded, because nobody could travel fast enough for the difference to matter.\n\nThe railway changed that. A train could cross in a morning a distance that had taken days on foot, and railway companies had to publish timetables. A timetable is useless if every station on the line is using its own clock. In Britain in the 1840s the railways began telling every station to use the time kept in London, and people called it railway time.\n\nOther countries had the same problem on a larger scale. In 1883 the railways of North America divided the continent into four bands, and inside each band every clock read the same. The following year an international meeting agreed to extend the idea around the world, dividing the globe into twenty-four zones, each one hour apart.\n\nThe zones are not the neat stripes the idea suggests. Their edges bend around borders, because a country would rather keep one time than split itself in two. China is wide enough for five zones and uses one. A few places, including parts of India and Australia, sit half an hour off their neighbours rather than a whole hour.\n\nSo the map of time is not really a map of the sun. It is a map of what people found convenient, drawn on top of the sun.", "qnum": "31"}, {"n": "33", "type": "writing", "section": "English Writing", "intro": "This is a PERSONAL ESSAY. Write about yourself, in the first person, and let the reader see the moment rather than only being told about it. You will be assessed on how clearly you organise your ideas, the words you choose, and the accuracy of your sentences.", "label": "", "body": "Write about something you were once not very good at, and what changed. Say what it was like at the start, what happened, and how you felt afterwards.", "hint": "Write at least 7 sentences. Plan for a moment before you begin, use paragraphs, and check your spelling and punctuation before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "34", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "35", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In the number 47,082, what is the value of the digit 7?", "options": {"A": "7,000", "B": "700", "C": "70", "D": "7"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "36", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Round 6,349 to the nearest hundred.", "options": {"A": "6,400", "B": "6,350", "C": "6,000", "D": "6,300"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "37", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A library had 1,205 books. It gave away 348 and then received 90 new ones. How many books does it have now?", "options": {"A": "857", "B": "947", "C": "1,643", "D": "857 books, with 90 still to arrive"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "38", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What number goes in the box? 3,000 - ____ = 1,742", "options": {"A": "1,358", "B": "1,742", "C": "1,258", "D": "4,742"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "39", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A baker packs 246 rolls into trays of 6. How many full trays does she fill?", "options": {"A": "40", "B": "42", "C": "240", "D": "41"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 308 x 7.", "options": {"A": "2,156", "B": "2,106", "C": "356", "D": "21,056"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four friends share the cost of a $92 present equally. How much does each pay?", "options": {"A": "$22", "B": "$24", "C": "$23", "D": "$368"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the grid shown. What fraction of it is NOT shaded? Give your answer in its simplest form.", "options": {"A": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">12</span></span>", "B": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>", "C": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">4</span></span>", "D": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"204\" height=\"158\" viewBox=\"0 0 204 158\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"204\" height=\"158\" fill=\"white\"/><rect x=\"10\" y=\"10\" width=\"46\" height=\"46\" fill=\"#4472C4\" stroke=\"#1F3864\" stroke-width=\"1.5\"/><rect x=\"56\" y=\"10\" width=\"46\" height=\"46\" fill=\"#4472C4\" stroke=\"#1F3864\" stroke-width=\"1.5\"/><rect x=\"102\" y=\"10\" width=\"46\" height=\"46\" fill=\"#4472C4\" stroke=\"#1F3864\" stroke-width °", "C": "235°", "D": "115°"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "50", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which statement about a SQUARE is always true?", "options": {"A": "All four sides are the same length, but the angles may differ.", "B": "The opposite sides are equal, but the four sides need not all be equal.", "C": "It has exactly two lines of symmetry.", "D": "All four sides are the same length and all four angles are right angles."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A shape has 4 equal sides but its angles are NOT right angles. What is it?", "options": {"A": "a rhombus", "B": "a square", "C": "a rectangle", "D": "a trapezium"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The net shown folds up to make which solid?", "options": {"A": "a square-based pyramid", "B": "a cube", "C": "a triangular prism", "D": "a cuboid with two long sides"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"240\" height=\"230\" viewBox=\"0 0 240 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"240\" height=\"230\" fill=\"white\"/><rect x=\"108\" y=\"15\" width=\"44\" height=\"44\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"64\" y=\"59\" width=\"44\" height=\"44\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"108\" y=\"59\" width=\"44\" height=\"44\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"152\" y=\"59\" width=\"44\" height=\"44\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"108\" y=\"103\" width=\"44\" height=\"44\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"108\" y=\"147\" width=\"44\" height=\"44\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></svg>", "passage": "", "qnum": "18"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "How many VERTICES (corners) does a square-based pyramid have?", "options": {"A": "4", "B": "8", "C": "6", "D": "5"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this sequence: 2, 5, 8, 11, ___ . What number comes next?", "options": {"A": "13", "B": "14", "C": "15", "D": "22"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "SPARROW, EAGLE and PENGUIN are all kinds of what?", "options": {"A": "bird", "B": "nest", "C": "feather", "D": "wing"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which of these shapes has exactly SIX sides?", "options": {"A": "pentagon", "B": "octagon", "C": "triangle", "D": "hexagon"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><polygon points=\"60.0,28.0 92.3,51.5 80.0,89.5 40.0,89.5 27.7,51.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"180.0,28.0 204.0,38.0 214.0,62.0 204.0,86.0 180.0,96.0 156.0,86.0 146.0,62.0 156.0,38.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"300.0,28.0 329.4,79.0 270.6,79.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"420.0,28.0 449.4,45.0 449.4,79.0 420.0,96.0 390.6,79.0 390.6,45.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "22"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "You have 7 pets: 3 cats and 4 birds. How many legs do your pets have altogether?", "options": {"A": "14", "B": "28", "C": "20", "D": "11"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which of these words would come FIRST in a dictionary? branch, brave, brain, brand", "options": {"A": "brain", "B": "brand", "C": "branch", "D": "brave"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code, CAT is written 3-1-20. How is DOG written?", "options": {"A": "4-14-7", "B": "3-15-7", "C": "4-15-7", "D": "4-15-8"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A film starts at 14:40 and lasts 1 hour and 35 minutes. What time does it finish?", "options": {"A": "15:75", "B": "16:15", "C": "16:05", "D": "15:15"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The school will move the bicycle racks closer to the gate, so that more pupils will cycle to school.\"\n\nPROPOSED ASSUMPTION: \"Where the bicycle racks are makes a difference to whether pupils cycle.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "No. The statement says where the racks will go and does not claim anything about how pupils decide.", "B": "Yes. The move is expected to increase cycling, which only makes sense if the position of the racks affects the decision to cycle."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every pupil in Class 6A who went on the museum trip brought a packed lunch. Tara brought a packed lunch on Tuesday.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "It cannot be told from the statement whether Tara went on the museum trip.", "B": "Tara went on the museum trip.", "C": "Tara did not go on the museum trip.", "D": "Everyone who brings a packed lunch goes on trips."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"All 120 pupils in Year 6 were asked about their journey to school. 78 walk to school, 54 take a bus at least once a week, and 30 do both.\"\n\nCONCLUSION (1): More than half of Year 6 walk to school.\nCONCLUSION (2): Every pupil who takes a bus also walks to school.\nCONCLUSION (3): 18 pupils neither walk nor take a bus.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "All three conclusions follow.", "B": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "C": "Conclusion 1 follows, but Conclusions 2 and 3 do not.", "D": "Conclusions 1 and 3 follow, but Conclusion 2 does not."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"Everyone in the school choir also plays an instrument. Nobody who plays an instrument has games on Thursday afternoon.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "Everyone who plays an instrument is in the school choir.", "B": "Nobody in the school choir has games on Thursday afternoon.", "C": "Some people in the choir have games on Thursday afternoon."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the school give every class fifteen minutes of silent reading at the start of the day?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "Yes. Reading is the most important thing anyone ever learns, and everybody knows that children these days do not read enough. Fifteen minutes is nothing! Why would anyone even argue about something so obviously good for them?", "B": "No. Fifteen minutes a day adds up to more than a whole week of lessons across a year, and that time has to come from somewhere. Every subject would lose a share of it.", "C": "Yes. A primary school in the same district tried it for one year and kept a record. The number of pupils borrowing at least one library book a month rose from 41 to 96 out of 180, and reading test scores rose more in that year than in either of the two years before it. Nothing else about the timetable changed that year."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The school newsletter reported: 'After the new bins were put in the playground, the amount of litter collected by the caretaker each week fell from 9 bags to 4 bags.'\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "The new bins caused pupils to drop less litter.", "B": "Pupils now put all their litter in the bins.", "C": "The caretaker collected fewer bags of litter each week after the bins were put in than before.", "D": "The playground is now completely clean."}, "fig": "", "passage": "", "qnum": "32"}, {"n": "67", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "68", "type": "mcq", "section": "Chinese", "stem": "陸運會最後一項比賽是甚麼？<br><i>陆运会最后一项比赛是甚么？</i>", "options": {"A": "四百米接力", "B": "跳高比賽<br><i>跳高比赛</i>", "C": "一百米短跑", "D": "一千五百米長跑<br><i>一千五百米长跑</i>"}, "fig": "", "passage": "上星期五是我們學校的陸運會。天氣很好，操場上插滿了彩旗，同學們穿着各班的隊服，在看台上一邊拍手，一邊高聲喊着口號。\n\n最後一項比賽是一千五百米長跑。我們班的阿健也報了名。說實話，阿健跑得並不快，體育課上他總是落在後面。出發的哨子一響，前面的同學很快便拉開了距離，阿健跟在最後，越落越遠。\n\n跑到第三圈，阿健的腳步慢了下來，臉漲得通紅，汗水一滴一滴地掉在跑道上。有人在看台上叫：「阿健，別跑了，休息吧！」阿健沒有回答，只是把頭一低，繼續向前。\n\n第一名衝過終點的時候，阿健還有大半圈。工作人員已經開始收拾器材，看台上的同學也陸續站了起來。就在這時，不知是誰先拍起手來，接着掌聲一片一片響起，越來越大。全場的人都站着，看着那個跑在最後的身影，一步一步地跑完最後一段路。\n\n阿健衝線的時候，成績是全級最後一名。可是那天下午，我聽見好幾個同學說起這場比賽，說的都不是誰拿了冠軍，而是阿健。\n\n後來我常常想起那個下午。原來一個人值不值得別人佩服，不一定要看他跑得多快，而是看他在最想停下來的時候，有沒有停下來。<br><i>上星期五是我们学校的陆运会。天气很好，操场上插满了彩旗，同学们穿着各班的队服，在看台上一边拍手，一边高声喊着口号。\n\n最后一项比赛是一千五百米长跑。我们班的阿健也报了名。说实话，阿健跑得并不快，体育课上他总是落在后面。出发的哨子一响，前面的同学很快便拉开了距离，阿健跟在最后，越落越远。\n\n跑到第三圈，阿健的脚步慢了下来，脸涨得通红，汗水一滴一滴地掉在跑道上。有人在看台上叫：「阿健，别跑了，休息吧！」阿健没有回答，只是把头一低，继续向前。\n\n第一名冲过终点的时候，阿健还有大半圈。工作人员已经开始收拾器材，看台上的同学也陆续站了起来。就在这时，不知是谁先拍起手来，接着掌声一片一片响起，越来越大。全场的人都站着，看着那个跑在最后的身影，一步一步地跑完最后一段路。\n\n阿健冲线的时候，成绩是全级最后一名。可是那天下午，我听见好几个同学说起这场比赛，说的都不是谁拿了冠军，而是阿健。\n\n后来我常常想起那个下午。原来一个人值不值得别人佩服，不一定要看他跑得多快，而是看他在最想停下来的时候，有没有停下来。</i>", "qnum": "1"}, {"n": "69", "type": "mcq", "section": "Chinese", "stem": "比賽開始不久，阿健的情況怎樣？<br><i>比赛开始不久，阿健的情况怎样？</i>", "options": {"A": "一直緊跟在第一名後面<br><i>一直紧跟在第一名后面</i>", "B": "跟在最後，而且越落越遠<br><i>跟在最后，而且越落越远</i>", "C": "在中間的位置不前不後<br><i>在中间的位置不前不后</i>", "D": "因為身體不適而退出<br><i>因为身体不适而退出</i>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "70", "type": "mcq", "section": "Chinese", "stem": "有人叫阿健「別跑了，休息吧」，阿健有甚麼反應？<br><i>有人叫阿健「别跑了，休息吧」，阿健有甚么反应？</i>", "options": {"A": "沒有回答，低下頭繼續向前跑<br><i>没有回答，低下头继续向前跑</i>", "B": "停下來喝了一口水才再跑<br><i>停下来喝了一口水才再跑</i>", "C": "向看台揮手表示明白<br><i>向看台挥手表示明白</i>", "D": "大聲回答說自己還可以<br><i>大声回答说自己还可以</i>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "71", "type": "mcq", "section": "Chinese", "stem": "看台上的同學為甚麼站起來鼓掌？<br><i>看台上的同学为甚么站起来鼓掌？</i>", "options": {"A": "因為第一名剛剛衝過終點<br><i>因为第一名刚刚冲过终点</i>", "B": "因為比賽已經結束要離場了<br><i>因为比赛已经结束要离场了</i>", "C": "被阿健堅持跑完的樣子打動了<br><i>被阿健坚持跑完的样子打动了</i>", "D": "因為工作人員請大家鼓掌<br><i>因为工作人员请大家鼓掌</i>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "72", "type": "mcq", "section": "Chinese", "stem": "本文最後一段想告訴讀者甚麼道理？<br><i>本文最后一段想告诉读者甚么道理？</i>", "options": {"A": "只要努力，最後一定可以取得第一名<br><i>只要努力，最后一定可以取得第一名</i>", "B": "參加比賽之前一定要好好練習<br><i>参加比赛之前一定要好好练习</i>", "C": "同學之間應該互相幫助<br><i>同学之间应该互相帮助</i>", "D": "值得佩服的不是跑得快，而是最想停下來時沒有停下來<br><i>值得佩服的不是跑得快，而是最想停下来时没有停下来</i>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "「臉漲得通紅」中的「漲」，在文中是甚麼意思？<br><i>「脸涨得通红」中的「涨」，在文中是甚么意思？</i>", "options": {"A": "水位升高", "B": "因用力而脹起、變紅<br><i>因用力而胀起、变红</i>", "C": "價錢提高<br><i>价钱提高</i>", "D": "衣服變大<br><i>衣服变大</i>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "「同學們陸續站了起來」中的「陸續」，意思是<br><i>「同学们陆续站了起来」中的「陆续」，意思是</i>", "options": {"A": "全部一起", "B": "勉強地<br><i>勉强地</i>", "C": "一個接一個地<br><i>一个接一个地</i>", "D": "慢慢地"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "下列哪一個詞語最適合形容阿健？<br><i>下列哪一个词语最适合形容阿健？</i>", "options": {"A": "堅持<br><i>坚持</i>", "B": "聰明<br><i>聪明</i>", "C": "幽默", "D": "大方"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "操場上插滿了____彩旗。橫線上應該填甚麼量詞？<br><i>操场上插满了____彩旗。横线上应该填甚么量词？</i>", "options": {"A": "條<br><i>条</i>", "B": "面", "C": "張<br><i>张</i>", "D": "枝"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "汗水一____一____地掉在跑道上。橫線上應該填甚麼量詞？<br><i>汗水一____一____地掉在跑道上。横线上应该填甚么量词？</i>", "options": {"A": "片", "B": "串", "C": "滴", "D": "塊<br><i>块</i>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "同學們一邊拍手，一邊高聲喊口號，場面十分熱鬧。用哪個成語形容最恰當？<br><i>同学们一边拍手，一边高声喊口号，场面十分热闹。用哪个成语形容最恰当？</i>", "options": {"A": "鴉雀無聲<br><i>鸦雀无声</i>", "B": "孤苦伶仃", "C": "垂頭喪氣<br><i>垂头丧气</i>", "D": "人聲鼎沸<br><i>人声鼎沸</i>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "阿健雖然跑在最後，卻一直沒有放棄。用哪個成語形容他最恰當？<br><i>阿健虽然跑在最后，却一直没有放弃。用哪个成语形容他最恰当？</i>", "options": {"A": "堅持不懈<br><i>坚持不懈</i>", "B": "半途而廢<br><i>半途而废</i>", "C": "三心兩意<br><i>三心两意</i>", "D": "坐享其成"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "「阿健沒有回答，只是把頭一低，繼續向前。」句中的「把」字句，強調的是<br><i>「阿健没有回答，只是把头一低，继续向前。」句中的「把」字句，强调的是</i>", "options": {"A": "阿健是誰<br><i>阿健是谁</i>", "B": "動作發生的時間<br><i>动作发生的时间</i>", "C": "對「頭」這個對象做了甚麼<br><i>对「头」这个对象做了甚么</i>", "D": "動作發生的地點<br><i>动作发生的地点</i>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "「不知是誰先拍起手來，接着掌聲一片一片響起。」句中的「接着」表示<br><i>「不知是谁先拍起手来，接着掌声一片一片响起。」句中的「接着」表示</i>", "options": {"A": "前後兩件事互相矛盾<br><i>前后两件事互相矛盾</i>", "B": "後一件事是前一件的原因<br><i>后一件事是前一件的原因</i>", "C": "兩件事同時發生<br><i>两件事同时发生</i>", "D": "前後兩件事有先後次序<br><i>前后两件事有先后次序</i>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V4)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
