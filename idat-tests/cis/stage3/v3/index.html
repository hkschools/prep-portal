<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 3 (V3)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>

</div>

const SCHOOL = "CIS", STAGE = "3", VERSION = "3";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence. Mr Lau gave the prizes to my sister and ____.", "options": {"A": "I", "B": "me", "C": "mine", "D": "myself"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "The prefix 'mis-' is added to 'judge' to form 'misjudge'. What does 'misjudge' mean?", "options": {"A": "to judge again", "B": "to judge before", "C": "to judge wrongly", "D": "to judge fully"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence. We waited nearly ____ hour before the doctor could see us.", "options": {"A": "a", "B": "the", "C": "an", "D": "one"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence. By the time we arrived at the cinema, the film ____ already started.", "options": {"A": "has", "B": "did", "C": "have", "D": "had"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Choose the option that punctuates the direct speech correctly.", "options": {"A": "\"Put your books away,\" said the teacher.", "B": "\"Put your books away\" said the teacher.", "C": "\"Put your books away,\" Said the teacher.", "D": "Put your books away, \"said the teacher.\""}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence. ____ she had practised for weeks, she still felt nervous before the concert.", "options": {"A": "Because", "B": "So", "C": "Although", "D": "Unless"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean? When Maya was asked who broke the window, she decided to come clean.", "options": {"A": "to wash something", "B": "to tell the truth", "C": "to feel guilty", "D": "to run away quickly"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Choose the option that uses the apostrophe correctly.", "options": {"A": "The two girl's bags were left on the bus.", "B": "The two girls bag's were left on the bus.", "C": "The two girls' bags were left on the bus.", "D": "The two girls bags' were left on the bus."}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Which word is the OPPOSITE (antonym) of the underlined word? The path up the mountain was steep and difficult.", "options": {"A": "gentle", "B": "smooth", "C": "high", "D": "narrow"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "Choose the option that rewrites the sentence in the passive voice. The storm damaged several roofs.", "options": {"A": "Several roofs were damaged by the storm.", "B": "Several roofs damaged the storm.", "C": "The storm was damaged by several roofs.", "D": "Several roofs have damaging the storm."}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "You are writing a formal letter to your school principal. Choose the most suitable and polite way to make the request.", "options": {"A": "Can you give us more time, yeah?", "B": "You should just give us more time.", "C": "Gotta have more time for this.", "D": "Could you please consider extending the deadline?"}, "fig": "", "passage": null, "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "Choose the option that punctuates the sentence correctly.", "options": {"A": "My uncle a famous chef is cooking dinner tonight.", "B": "My uncle, a famous chef, is cooking dinner tonight.", "C": "My uncle, a famous chef is cooking dinner tonight.", "D": "My uncle a famous chef, is cooking dinner tonight."}, "fig": "", "passage": null, "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Add the suffix '-less' to the word 'harm'. What does 'harmless' mean?", "options": {"A": "causing no harm", "B": "full of harm", "C": "able to be harmed", "D": "in a harmful way"}, "fig": "", "passage": null, "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "Choose the option that best completes the analogy. Author is to book as composer is to ____.", "options": {"A": "piano", "B": "orchestra", "C": "audience", "D": "music"}, "fig": "", "passage": null, "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "All four words can describe a smell, but which one has the most NEGATIVE meaning? A word for a smell that is unpleasant and disgusting is ____.", "options": {"A": "scent", "B": "aroma", "C": "fragrance", "D": "stench"}, "fig": "", "passage": null, "qnum": 15}, {"n": 17, "type": "mcq", "section": "English", "stem": "Why was the narrator unable to get into the locker at first?", "options": {"A": "The narrator had lost the key.", "B": "The lock would not open however the dial was turned.", "C": "Another student was using the locker.", "D": "The locker belonged to someone else."}, "fig": "", "passage": "<strong>The Locker That Would Not Open</strong><br>On my first morning at the new school, I stood in front of locker number forty-two and could not make it open. I had turned the little dial left and right a dozen times, but the lock held firm. Around me the corridor was emptying as students hurried to class, and my face grew hot. The bell would ring in two minutes, and my books were trapped inside.<br><br>A tall girl with a green backpack stopped beside me. I had never seen her before. &quot;Stuck?&quot; she asked. I nodded, too embarrassed to speak. Instead of laughing, she leaned in and looked at the worn numbers on the dial.<br><br>&quot;These old locks are tricky,&quot; she said. &quot;You have to spin past zero twice first, then go straight to your last number. Watch.&quot; She showed me slowly, turning the dial with care. On my second try, following exactly what she had done, the lock clicked and the door swung open.<br><br>I grabbed my books and barely had time to thank her before she disappeared into the crowd. I never even learned her name. Yet I still remember that moment years later, because a stranger chose to stop and help when it would have been easier to walk on. Since then, whenever I see someone looking lost or stuck, I try to be the girl with the green backpack.", "qnum": 16}, {"n": 18, "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word firm as it is used in this sentence from the passage? 'I had turned the little dial left and right a dozen times, but the lock held firm.'", "options": {"A": "tightly shut and unmoving", "B": "a business company", "C": "kind but strict", "D": "soft to the touch"}, "fig": "", "passage": "<strong>The Locker That Would Not Open</strong><br>On my first morning at the new school, I stood in front of locker number forty-two and could not make it open. I had turned the little dial left and right a dozen times, but the lock held firm. Around me the corridor was emptying as students hurried to class, and my face grew hot. The bell would ring in two minutes, and my books were trapped inside.<br><br>A tall girl with a green backpack stopped beside me. I had never seen her before. &quot;Stuck?&quot; she asked. I nodded, too embarrassed to speak. Instead of laughing, she leaned in and looked at the worn numbers on the dial.<br><br>&quot;These old locks are tricky,&quot; she said. &quot;You have to spin past zero twice first, then go straight to your last number. Watch.&quot; She showed me slowly, turning the dial with care. On my second try, following exactly what she had done, the lock clicked and the door swung open. I try to be the girl with the green backpack.", "qnum": 18}, {"n": 20, "type": "mcq", "section": "English", "stem": "What can we infer about how the narrator was feeling before the girl stopped to help?", "options": {"A": "The narrator felt proud and confident.", "B": "The narrator was bored and uninterested.", "C": "The narrator was anxious and embarrassed.", "D": "The narrator was angry at the other students."}, "fig": "", "passage": "<strong>The Locker That Would Not Open</strong><br>On my first morning at the new school, I stood in front of locker number forty-two and could not make it open. I had turned the little dial left and right a dozen times, but the lock held firm. Around me the corridor was emptying as students hurried to class, and my face grew hot. The bell would ring in two minutes, and my books were trapped inside.<br><br>A tall girl with a green backpack stopped beside me. I had never seen her before. &quot;Stuck?&quot; she asked. I nodded, too embarrassed to speak. Instead of laughing, she leaned in and looked at the worn numbers on the dial.<br><br>&quot;These old locks are tricky,&quot; she said. &quot;You have to spin past zero twice first, then go straight to your last number. Watch.&quot; She showed me slowly, turning the dial with care. On my second try, following exactly what she had done, the lock clicked and the door swung open.<br><br>I grabbed my books and barely had time to thank her before she disappeared into the crowd. I never even learned her name. Yet I still remember that moment years later, because a stranger chose to stop and help when it would have been easier to walk on. Since then, whenever I see someone looking lost or stuck, I try to be the girl with the green backpack.", "qnum": 19}, {"n": 21, "type": "mcq", "section": "English", "stem": "Which statement best expresses the main message of this narrative?", "options": {"A": "New schools always have broken lockers.", "B": "A small act of kindness can be remembered for a long time and passed on.", "C": "You should never speak to strangers.", "D": "It is important to arrive at school early."}, "fig": "", "passage": "<strong>The Locker That Would Not Open</strong><br>On my first morning at the new school, I stood in front of locker number forty-two and could not make it open. I had turned the little dial left and right a dozen times, but the lock held firm. Around me the corridor was emptying as students hurried to class, and my face grew hot. The bell would ring in two minutes, and my books were trapped inside.<br><br>A tall girl with a green backpack stopped beside me. I had never seen her before. &quot;Stuck?&quot; she asked. I nodded, too embarrassed to speak. Instead of laughing, she leaned in and looked at the worn numbers on the dial.<br><br>&quot;These old locks are tricky,&quot; she said. &quot;You have to spin past zero twice first, then go straight to your last number. Watch.&quot; She showed me slowly, turning the dial with care. On my second try, following exactly what she had done, the lock clicked and the door swung open.<br><br>I grabbed my books and barely had time to thank her before she disappeared into the crowd. I never even learned her name. Yet I still remember that moment years later, because a stranger chose to stop and help when it would have been easier to walk on. Since then, whenever I see someone looking lost or stuck, I try to be the girl with the green backpack.", "qnum": 20}, {"n": 22, "type": "writing", "section": "English Writing", "intro": "A small act of kindness is something helpful you do for another person, even when it is not expected.", "label": "", "body": "Write about a time when you helped someone, or when someone helped you. What happened, how did you feel, and why do you still remember it?", "hint": "Write at least 7 sentences.", "placeholder": "Type your response here…", "partA": "Write about a time when you helped someone, or when someone helped you. What happened, how did you feel, and why do you still remember it?", "partB": ""}, {"n": 23, "type": "info", "title": "English Listening &amp; Speaking", "body": "<div class='info-body'>In the real test this section is delivered by an on-screen avatar: you listen and then speak your answers aloud into the microphone. There is nothing to type or record here, the sample questions below show the kind of thing you'll be asked, so you can practise out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Tell me about your family and what you like to do together.</li><li style='margin:7px 0'>What is your favourite subject at school, and why?</li><li style='margin:7px 0'>Describe your favourite game or activity.</li><li style='margin:7px 0'>What did you do during the last holiday?</li><li style='margin:7px 0'>Listen to a short story, then tell it back in your own words.</li></ul>"}, {"n": 24, "type": "info", "title": "Mathematics, Logic &amp; Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": 25, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What is the value of the digit 7 in 4 706 285?", "options": {"A": "700 000", "B": "70 000", "C": "7 000", "D": "7"}, "fig": "", "passage": null, "qnum": 21}, {"n": 26, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Round 47 326 to the nearest thousand.", "options": {"A": "48 000", "B": "47 400", "C": "47 300", "D": "47 000"}, "fig": "", "passage": null, "qnum": 22}, {"n": 27, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "1 928.27 + 4 293.55 = ?", "options": {"A": "6 121.82", "B": "6 221.82", "C": "6 221.72", "D": "5 221.82"}, "fig": "", "passage": null, "qnum": 23}, {"n": 28, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Estimate 612 x 38 by rounding 612 to the nearest hundred and 38 to the nearest ten.", "options": {"A": "24 000", "B": "18 000", "C": " Thinking", "stem": "A bus leaves the depot every 25 minutes, starting at 08:00. Mei arrives at the stop at 09:05. How long must she wait for the next bus?", "options": {"A": "10 minutes", "B": "25 minutes", "C": "20 minutes", "D": "15 minutes"}, "fig": "", "passage": null, "qnum": 39}, {"n": 44, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Rearrange the letters of BARZE to make a real word. The hidden word is the name of a:", "options": {"A": "insect", "B": "animal", "C": "bird", "D": "fish"}, "fig": "", "passage": null, "qnum": 40}, {"n": 45, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four shapes are shown, labelled A to D. Which one IS a regular polygon, a shape with ALL sides equal AND all angles equal?", "options": {"A": "Shape A", "B": "Shape B", "C": "Shape C", "D": "Shape D"}, "fig": "<svg viewBox=\"0 0 360 120\" width=\"360\" height=\"120\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"360\" height=\"120\" fill=\"#ffffff\"/></svg>", "passage": null, "qnum": 41}, {"n": 46, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Read the statement, then decide whether the proposed assumption is logical USING ONLY the information in the statement.\n\nStatement: \"Our school is buying new laptops so that every Year 7 student can use one in lessons this term.\"\n\nProposed assumption: \"The school does not currently have enough working laptops for every Year 7 student to use one in lessons.\"\n\nUsing the information in the statement, is this assumption logical?", "options": {"A": "Yes", "B": "No", "C": "Yes", "D": "No"}, "fig": "", "passage": null, "qnum": 42}, {"n": 47, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INFERENCE. A statement is given. Choose the ONE option that MUST be true based only on the statement (the others may be true but are not certain).\n\nStatement: \"Every member of the school chess club also plays at least one sport for the school. Mia is a member of the school chess club.\"", "options": {"A": "Mia plays at least one sport for the school.", "B": "Mia is one of the best chess players in the club.", "C": "Mia plays more than one sport for the school.", "D": "Mia joined the chess club this year."}, "fig": "", "passage": null, "qnum": 43}, {"n": 48, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "DEDUCTION. Take ALL the stated facts together. Choose the ONE conclusion that does NOT follow.\n\nFacts:\n(1) All the books on the top shelf are hardbacks.\n(2) None of the hardbacks are in French.\n(3) The dictionary is a book on the top shelf.", "options": {"A": "The dictionary is a hardback.", "B": "The dictionary is not in French.", "C": "Every hardback is on the top shelf.", "D": "No book in French is on the top shelf."}, "fig": "", "passage": null, "qnum": 44}, {"n": 49, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INTERPRETATION. Read the statement, then decide which of the numbered conclusions FOLLOW using ONLY the information given (no outside knowledge).\n\nStatement: \"In the school bake sale, every cake that contained nuts was clearly labelled with a red sticker. The lemon cake had no red sticker.\"\n\nConclusions:\n(1) The lemon cake did not contain nuts.\n(2) The lemon cake was the most popular cake at the sale.\n(3) Any cake without a red sticker contained no nuts.\n\nWhich conclusion(s) follow?", "options": {"A": "Only conclusion 1 follows.", "B": "Both conclusions 1 and 3 follow.", "C": "Only conclusion 2 follows.", "D": "All three conclusions follow."}, "fig": "", "passage": null, "qnum": 45}, {"n": 50, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "EVALUATION OF ARGUMENTS. Question: 'Should the school keep its library open for one extra hour after lessons end?' Choose the STRONGEST argument. A strong argument is factual, supported by evidence or statistics, and addresses the question directly; a weak one rests on personal feeling or measures the wrong thing.", "options": {"A": "Yes, I personally love the library and I would feel much happier if I could stay there longer after school.", "B": "No, a survey of 200 parents found that 85% said children should come straight home after school, so the library should close on time.", "C": "Yes, last year the library trialled staying open one extra hour, and attendance records show an average of 40 more students used it each day to complete homework.", "D": "No, the new library curtains were chosen last term and they look very smart, so nothing about the library should change."}, "fig": "", "passage": null, "qnum": 46}, {"n": 51, "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 簡体.)"}, {"n": 52, "type": "mcq", "section": "Chinese", "stem": "阿明今年升上六年級，可是他做事總是三分鐘熱度。學期初他立志每天練習書法，買了一整套毛筆和宣紙，興致勃勃地寫了三天，第四天就藉口功課太多停了下來。媽媽見狀，沒有責罵他，只是把書法工具收進櫃子，並在牆上貼了一張紙條，上面寫著:「滴水可以穿石。」起初阿明不以為意，但每次經過都會看見那句話。一個月後，他站在櫃子前猶豫了好一會兒，終於重新拿起毛筆，這次他只要求自己每天寫五個字。半年下來，他的字果然漂亮了許多。\n\n根據短文，阿明一開始停止練習書法的原因是什麼? <br><span style=\"color:#555\">阿明今年升上六年级，可是他做事总是三分钟热度。学期初他立志每天练习书法，买了一整套毛笔和宣纸，兴致勃勃地写了三天，第四天就借口功课太多停了下来。妈妈见状，没有责骂他，只是把书法工具收进柜子，并在墙上贴了一张纸条，上面写着:「滴水可以穿石。」起初阿明不以为意，但每次经过都会看见那句话。一个月后，他站在柜子前犹豫了好一会儿，终于重新拿起毛笔，这次他只要求自己每天写五个字。半年下来，他的字果然漂亮了许多。\n\n根据短文，阿明一开始停止练习书法的原因是什么?</span>", "options": {"A": "毛筆和宣紙用完了<br><span style=\"color:#555\">毛笔和宣纸用完了</span>", "B": "他藉口功課太多<br><span style=\"color:#555\">他借口功课太多</span>", "C": "媽媽把工具收起來了<br><span style=\"color:#555\">妈妈把工具收起来了</span>", "D": "他覺得字寫得不好看<br><span style=\"color:#555\">他觉得字写得不好看</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>阿明今年升上六年級，可是他做事總是三分鐘熱度。學期初他立志每天練習書法，買了一整套毛筆和宣紙，興致勃勃地寫了三天，第四天就藉口功課太多停了下來。媽媽見狀，沒有責罵他，只是把書法工具收進櫃子，並在牆上貼了一張紙條，上面寫著:「滴水可以穿石。」起初阿明不以為意，但每次經過都會看見那句話。一個月後，他站在櫃子前猶豫了好一會兒，終於重新拿起毛筆，這次他只要求自己每天寫五個字。半年下來，他的字果然漂亮了許多。</div><div> let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V3)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
</html>
