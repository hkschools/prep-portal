<!DOCTYPE html>

<head>

<title>IDAT CIS: Stage 3 (V3)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "3", VERSION = "3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe puppy chased ____ own tail around the garden until it grew dizzy.", "options": {"A": "it's", "B": "its", "C": "its'", "D": "it is"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "What does the prefix 'un-' add to the meaning of the underlined word in the sentence below?\n\nThe knot was so tight that it was almost impossible to <u>untie</u>.", "options": {"A": "to tie again", "B": "to tie very tightly", "C": "to do the opposite of tying", "D": "to tie before something else"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nWe waited for nearly ____ hour before the train finally arrived.", "options": {"A": "a", "B": "an", "C": "the", "D": "one"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word in the sentence below?\n\nAfter the long hike, the children were absolutely <u>famished</u> and ate everything on their plates.", "options": {"A": "very tired", "B": "very thirsty", "C": "very bored", "D": "very hungry"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "All four sentences describe a changing room shared by the whole girls' team. Choose the option with the correct use of the apostrophe.", "options": {"A": "The girls' changing room was at the end of the corridor.", "B": "The girl's changing room was at the end of the corridor.", "C": "The girls changing room was at the end of the corridor.", "D": "The girls's changing room was at the end of the corridor."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which word is most nearly OPPOSITE in meaning to the underlined word in the sentence below?\n\nThe instructions were so <u>complex</u> that nobody in the class could follow them.", "options": {"A": "difficult", "B": "confusing", "C": "detailed", "D": "simple"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nEach of the players ____ given a medal at the end of the tournament.", "options": {"A": "were", "B": "have been", "C": "was", "D": "are"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "What is the most likely meaning of the word 'novel' as it is used in the sentence below?\n\nThe engineer came up with a completely novel solution that no one had ever tried before.", "options": {"A": "a long printed story", "B": "complicated", "C": "sensible and safe", "D": "new and original"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe whole match was cancelled ____ the pitch was completely flooded after the storm.", "options": {"A": "so", "B": "because", "C": "but", "D": "or"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which word correctly adds the suffix '-ous' to the root word 'fame' to mean 'having fame'?", "options": {"A": "famous", "B": "fameous", "C": "famious", "D": "fameious"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "You are writing a polite formal email to your head teacher. Choose the option that fits this formal register best.\n\n'____ I please leave the lesson five minutes early to catch my bus?'", "options": {"A": "Can", "B": "Could", "C": "May", "D": "Will"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "All four words can describe being pleased. Choose the word that shows the STRONGEST degree of being pleased.", "options": {"A": "satisfied", "B": "pleased", "C": "delighted", "D": "overjoyed"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Choose the option that correctly rewrites the sentence below in the PASSIVE voice.\n\nThe council is planting hundreds of new trees along the river.", "options": {"A": "Hundreds of new trees are being planted along the river by the council.", "B": "Hundreds of new trees were planted along the river by the council.", "C": "The council are being planted hundreds of new trees along the river.", "D": "Along the river, the council is planting hundreds of new trees."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Choose the word that completes the analogy.\n\nWhisper is to shout as trickle is to ____.", "options": {"A": "drip", "B": "pour", "C": "water", "D": "stop"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "One labelled section contains a pronoun error. Which labelled section should be corrected?\n\nThe coach told (A) Maya and I (B) that (C) our team had (D) qualified for the final.", "options": {"A": "(A) Maya and I", "B": "(B) that", "C": "(C) our team had", "D": "(D) qualified for the final"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nWhen Ben said he had run ten kilometres in twenty minutes, we took it <u>with a pinch of salt</u>.", "options": {"A": "we found it very tasty", "B": "we were very impressed by it", "C": "we did not fully believe it", "D": "we became angry about it"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Choose the word or words that best complete the sentence.\n\nBy the time the bell rang, the students ____ already finished the experiment.", "options": {"A": "have", "B": "has", "C": "having", "D": "had"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "If these words were placed in a dictionary, which word would come THIRD in alphabetical order?\n\nthread, throne, thirst, thought", "options": {"A": "thought", "B": "thirst", "C": "thread", "D": "throne"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "In the sentence below, which part of speech is the underlined word?\n\nThe runners moved <u>swiftly</u> towards the finishing line.", "options": {"A": "adverb", "B": "adjective", "C": "verb", "D": "noun"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled plural form to complete the sentence.\n\nThe carpenter fixed three new ____ to the wall of the workshop.", "options": {"A": "shelfs", "B": "shelfes", "C": "shelve", "D": "shelves"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Both words below can describe someone who saves money. Choose the word with the more NEGATIVE connotation.", "options": {"A": "thrifty", "B": "careful", "C": "stingy", "D": "sensible"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Choose the option that punctuates the direct speech correctly.", "options": {"A": "\"Have you finished your homework?\" asked Mr Lee.", "B": "\"Have you finished your homework\"? asked Mr Lee.", "C": "\"Have you finished your homework?\" Asked Mr Lee.", "D": "\"Have you finished your homework,\" asked Mr Lee?"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Why was the crow unable to drink the water when she first looked inside the pitcher?", "options": {"A": "The water was too dirty to drink.", "B": "The water was too far down for her beak to reach.", "C": "A farmer was guarding the pitcher.", "D": "The pitcher was completely empty."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>At the end of a long, dry summer, a thirsty crow flew over fields that had not seen rain for weeks. Her throat was as dry as the cracked earth below, and she searched everywhere for even a single drop of water.\n\nAt last, near an old farmhouse, she spotted a tall pitcher standing in the shade. With a hopeful croak she swooped down and peered inside. There, far at the bottom, lay a small pool of water, gleaming like a coin.\n\nThe crow stretched her neck as far as it would go, but her beak could not reach the water. She tried tipping the pitcher over, pushing against it with all her weight, yet the heavy clay would not budge. Tired and discouraged, she perched on the rim and thought hard, for she was a clever bird and would not give up so easily.\n\nNearby lay a scattering of small pebbles, and an idea came to her. One by one, she dropped a pebble into the pitcher. With each stone, the water rose just a little higher. It was slow work, and her wings ached, but she did not stop.\n\nAt last the water climbed close enough to the top. The crow dipped her beak and drank deeply, and never had water tasted so sweet. As she flew away into the cooling evening, she carried with her a lesson worth more than the drink itself: that patience and a thinking mind can solve what brute strength cannot.", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the word 'discouraged' as it is used in the passage?\n\n'Tired and discouraged, she perched on the rim and thought hard...'", "options": {"A": "having lost hope or confidence", "B": "feeling angry and loud", "C": "feeling curious and excited", "D": "feeling proud of her success"}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>At the end of a long, dry summer, a thirsty crow flew over fields that had not seen rain for weeks. Her throat was as dry as the cracked earth below, and she searched everywhere for even a single drop of water.\n\nAt last, near an old farmhouse, she spotted a tall pitcher standing in the shade. With a hopeful croak she swooped down and peered inside. There, far at the bottom, lay a small pool of water, gleaming like a coin.\n\nThe crow stretched her neck as far as it would go, but her beak could not reach the water. She tried tipping the pitcher over, pushing against it with all her weight, yet the heavy clay would not budge. Tired and discouraged, she perched on the rim and thought hard, for she was a clever bird and would not give up so easily.\n\nNearby lay a scattering of small pebbles, and an idea came to her. One by one, she dropped a pebble into the pitcher. With each stone, the water rose just a little higher. It was slow work, and her wings ached, but she did not stop.\n\nAt last the water climbed close enough to the top. The crow dipped her beak and drank deeply, and never had water tasted so sweet. As she flew away into the cooling evening, she carried with her a lesson worth more than the drink itself: that patience and a thinking mind can solve what brute strength cannot.", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "What can we infer about the crow from the way she solved her problem?", "options": {"A": "She had solved this same problem many times before.", "B": "She was lucky and solved the problem by accident.", "C": "She was patient and able to think of a clever plan.", "D": "She gave up easily when things became difficult."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>At the end of a long, dry summer, a thirsty crow flew over fields that had not seen rain for weeks. Her throat was as dry as the cracked earth below, and she searched everywhere for even a single drop of water.\n\nAt last, near an old farmhouse, she spotted a tall pitcher standing in the shade. With a hopeful croak she swooped down and peered inside. There, far at the bottom, lay a small pool of water, gleaming like a coin.\n\nThe crow stretched her neck as far as it would go, but her beak could not reach the water. She tried tipping the pitcher over, pushing against it with all her weight, yet the heavy clay would not budge. Tired and discouraged, she perched on the rim and thought hard, for she was a clever bird and would not give up so easily.\n\nNearby lay a scattering of small pebbles, and an idea came to her. One by one, she dropped a pebble into the pitcher. With each stone, the water rose just a little higher. It was slow work, and her wings ached, but she did not stop.\n\nAt last the water climbed close enough to the top. The crow dipped her beak and drank deeply, and never had water tasted so sweet. As she flew away into the cooling evening, she carried with her a lesson worth more than the drink itself: that patience and a thinking mind can solve what brute strength cannot.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which sentence best states the MORAL (main lesson) of the fable?", "options": {"A": "You should always carry water on a hot day.", "B": "Clever thinking and patience can succeed where force fails.", "C": "Crows are the cleverest of all birds.", "D": "It is better to ask others for help than to work alone."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>At the end of a long, dry summer, a thirsty crow flew over fields that had not seen rain for weeks. Her throat was as dry as the cracked earth below, and she searched everywhere for even a single drop of water.\n\nAt last, near an old farmhouse, she spotted a tall pitcher standing in the shade. With a hopeful croak she swooped down and peered inside. There, far at the bottom, lay a small pool of water, gleaming like a coin.\n\nThe crow stretched her neck as far as it would go, but her beak could not reach the water. She tried tipping the pitcher over, pushing against it with all her weight, yet the heavy clay would not budge. Tired and discouraged, she perched on the rim and thought hard, for she was a clever bird and would not give up so easily.\n\nNearby lay a scattering of small pebbles, and an idea came to her. One by one, she dropped a pebble into the pitcher. With each stone, the water rose just a little higher. It was slow work, and her wings ached, but she did not stop.\n\nAt last the water climbed close enough to the top. The crow dipped her beak and drank deeply, and never had water tasted so sweet. As she flew away into the cooling evening, she carried with her a lesson worth more than the drink itself: that patience and a thinking mind can solve what brute strength cannot.", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "According to the passage, what did Chinese officials FIRST use the early lodestone instruments for?", "options": {"A": "steering ships across the open sea", "B": "attracting and collecting pieces of iron", "C": "measuring the distance between continents", "D": "arranging buildings and ceremonies in harmony with the directions"}, "fig": "", "passage": "<strong>How the Compass Found Its Way</strong><br>Long before satellites circled the Earth, travellers had to find their way using only the sun, the stars and a few clever tools. One of the most important of these tools was the magnetic compass, an invention that changed the history of exploration.\n\nThe story begins in ancient China, more than two thousand years ago. People there discovered that a certain rock, called lodestone, had a strange power: it could attract iron. They also noticed something even more useful. When a thin piece of lodestone was allowed to swing freely, it always came to rest pointing in the same direction, roughly north and south. At first, Chinese officials used these early instruments not for travel but for arranging buildings and ceremonies in harmony with the directions.\n\nOver time, sailors realised how valuable this pointing stone could be. By the time of the Song dynasty, Chinese ships were using floating compasses to steer across open water, even on cloudy nights when no stars could be seen. Knowledge of the compass slowly spread westward along trade routes until, by the twelfth century, sailors in Europe were using it too.\n\nThe compass works because the Earth itself behaves like a giant magnet. Its core, deep beneath our feet, creates an invisible magnetic field that stretches around the whole planet. A compass needle is a small magnet, and it lines up with this field, so that one end always swings towards the magnetic north. With this simple device, sailors could hold a steady course far from any coast.\n\nThe magnetic compass made long ocean voyages far safer and more reliable. Explorers could now sail beyond the sight of land with confidence, opening sea routes between distant continents. A small piece of magnetic rock, it turned out, helped to connect the whole world.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the word 'steady' as it is used in the sentence below?\n\n'With this simple device, sailors could hold a steady course far from any coast.'", "options": {"A": "firm and unchanging", "B": "slow and gentle", "C": "secret and hidden", "D": "dangerous and risky"}, "fig": "", "passage": "<strong>How the Compass Found Its Way</strong><br>Long before satellites circled the Earth, travellers had to find their way using only the sun, the stars and a few clever tools. One of the most important of these tools was the magnetic compass, an invention that changed the history of exploration.\n\nThe story begins in ancient China, more than two thousand years ago. People there discovered that a certain rock, called lodestone, had a strange power: it could attract iron. They also noticed something even more useful. When a thin piece of lodestone was allowed to swing freely, it always came to rest pointing in the same direction, roughly north and south. At first, Chinese officials used these early instruments not for travel but for arranging buildings and ceremonies in harmony with the directions.\n\nOver time, sailors realised how valuable this pointing stone could be. By the time of the Song dynasty, Chinese ships were using floating compasses to steer across open water, even on cloudy nights when no stars could be seen. Knowledge of the compass slowly spread westward along trade routes until, by the twelfth century, sailors in Europe were using it too.\n\nThe compass works because the Earth itself behaves like a giant magnet. Its core, deep beneath our feet, creates an invisible magnetic field that stretches around the whole planet. A compass needle is a small magnet, and it lines up with this field, so that one end always swings towards the magnetic north. With this simple device, sailors could hold a steady course far from any coast.\n\nThe magnetic compass made long ocean voyages far safer and more reliable. Explorers could now sail beyond the sight of land with confidence, opening sea routes between distant continents. A small piece of magnetic rock, it turned out, helped to connect the whole world.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "According to the passage, why does a compass needle point north?", "options": {"A": "The needle is pulled by the light of the North Star.", "B": "The needle is a small magnet that lines up with the Earth's magnetic field.", "C": "The needle points to lodestone buried deep inside the Earth.", "D": "The needle is attracted to nearby pieces of iron on the ship."}, "fig": "", "passage": "<strong>How the Compass Found Its Way</strong><br>Long before satellites circled the Earth, travellers had to find their way using only the sun, the stars and a few clever tools. One of the most important of these tools was the magnetic compass, an invention that changed the history of exploration.\n\nThe story begins in ancient China, more than two thousand years ago. People there discovered that a certain rock, called lodestone, had a strange power: it could attract iron. They also noticed something even more useful. When a thin piece of lodestone was allowed to swing freely, it always came to rest pointing in the same direction, roughly north and south. At first, Chinese officials used these early instruments not for travel but for arranging buildings and ceremonies in harmony with the directions.\n\nOver time, sailors realised how valuable this pointing stone could be. By the time of the Song dynasty, Chinese ships were using floating compasses to steer across open water, even on cloudy nights when no stars could be seen. Knowledge of the compass slowly spread westward along trade routes until, by the twelfth century, sailors in Europe were using it too.\n\nThe compass works because the Earth itself behaves like a giant magnet. Its core, deep beneath our feet, creates an invisible magnetic field that stretches around the whole planet. A compass needle is a small magnet, and it lines up with this field, so that one end always swings towards the magnetic north. With this simple device, sailors could hold a steady course far from any coast.\n\nThe magnetic compass made long ocean voyages far safer and more reliable. Explorers could now sail beyond the sight of land with confidence, opening sea routes between distant continents. A small piece of magnetic rock, it turned out, helped to connect the whole world.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "Which sentence best states the MAIN IDEA of the whole passage?", "options": {"A": "Lodestone is a rock found only in ancient China.", "B": "Sailors in Europe invented the compass in the twelfth century.", "C": "The magnetic compass developed over centuries and transformed exploration around the world.", "D": "The Earth's core is made of magnetic rock like lodestone."}, "fig": "", "passage": "<strong>How the Compass Found Its Way</strong><br>Long before satellites circled the Earth, travellers had to find their way using only the sun, the stars and a few clever tools. One of the most important of these tools was the magnetic compass, an invention that changed the history of exploration.\n\nThe story begins in ancient China, more than two thousand years ago. People there discovered that a certain rock, called lodestone, had a strange power: it could attract iron. They also noticed something even more useful. When a thin piece of lodestone was allowed to swing freely, it always came to rest pointing in the same direction, roughly north and south. At first, Chinese officials used these early instruments not for travel but for arranging buildings and ceremonies in harmony with the directions.\n\nOver time, sailors realised how valuable this pointing stone could be. By the time of the Song dynasty, Chinese ships were using floating compasses to steer across open water, even on cloudy nights when no stars could be seen. Knowledge of the compass slowly spread westward along trade routes until, by the twelfth century, sailors in Europe were using it too.\n\nThe compass works because the Earth itself behaves like a giant magnet. Its core, deep beneath our feet, creates an invisible magnetic field that stretches around the whole planet. A compass needle is a small magnet, and it lines up with this field, so that one end always swings towards the magnetic north. With this simple device, sailors could hold a steady course far from any coast.\n\nThe magnetic compass made long ocean voyages far safer and more reliable. Explorers could now sail beyond the sight of land with confidence, opening sea routes between distant continents. A small piece of magnetic rock, it turned out, helped to connect the whole world.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "Based on the passage, why was the compass especially useful on cloudy nights at sea?", "options": {"A": "The compass glowed brightly so sailors could see in the dark.", "B": "On cloudy nights the stars were hidden, but the compass could still show direction.", "C": "Clouds made the Earth's magnetic field stronger at night.", "D": "Sailors only ever used the compass when it was raining."}, "fig": "", "passage": "<strong>How the Compass Found Its Way</strong><br>Long before satellites circled the Earth, travellers had to find their way using only the sun, the stars and a few clever tools. One of the most important of these tools was the magnetic compass, an invention that changed the history of exploration.\n\nThe story begins in ancient China, more than two thousand years ago. People there discovered that a certain rock, called lodestone, had a strange power: it could attract iron. They also noticed something even more useful. When a thin piece of lodestone was allowed to swing freely, it always came to rest pointing in the same direction, roughly north and south. At first, Chinese officials used these early instruments not for travel but for arranging buildings and ceremonies in harmony with the directions.\n\nOver time, sailors realised how valuable this pointing stone could be. By the time of the Song dynasty, Chinese ships were using floating compasses to steer across open water, even on cloudy nights when no stars could be seen. Knowledge of the compass slowly spread westward along trade routes until, by the twelfth century, sailors in Europe were using it too.\n\nThe compass works because the Earth itself behaves like a giant magnet. Its core, deep beneath our feet, creates an invisible magnetic field that stretches around the whole planet. A compass needle is a small magnet, and it lines up with this field, so that one end always swings towards the magnetic north. With this simple device, sailors could hold a steady course far from any coast.\n\nThe magnetic compass made long ocean voyages far safer and more reliable. Explorers could now sail beyond the sight of land with confidence, opening sea routes between distant continents. A small piece of magnetic rock, it turned out, helped to connect the whole world.", "qnum": "31"}, {"n": "33", "type": "writing", "section": "English Writing", "intro": "A small act of kindness is something thoughtful you do for another person, even when no one asks you to.", "label": "", "body": "Write about a time when you did something kind for another person. What did you do, how did the other person react, and how did it make you feel?", "hint": "Write at least 7 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "34", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "35", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the solid shown. How many vertices does it have?", "options": {"A": "5", "B": "6", "C": "9", "D": "8"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><polygon points=\"150,160 70,160 110,90 190,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"40,160 150,160 110,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"40\" y1=\"160\" x2=\"80\" y2=\"90\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M80,90 L190,90 M80,90 L110,90\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "1"}, {"n": "36", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A solid has 6 faces, 12 edges and 8 vertices, and every face is a rectangle but the faces are not all identical squares. What is the best name for this solid?", "options": {"A": "Cube", "B": "Cuboid", "C": "Hexagonal prism", "D": "Square pyramid"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "37", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A net is made of 2 identical triangles and 3 rectangles, with the triangles at the two ends. Which solid does it fold up to make?", "options": {"A": "Triangular pyramid", "B": "Rectangular prism", "C": "Triangular prism", "D": "Octahedron"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "38", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four shapes are shown. Each is a polygon. Which one is a regular polygon (all sides equal AND all angles equal)?", "options": {"A": "Shape A", "B": "Shape B", "C": "Shape C", "D": "Shape D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><polygon points=\"60.0,28 87,62 60.0,96 33,62\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><rect x=\"136\" y=\"38\" width=\"88\" height=\"48\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"300.0,28.0 329.4,45.0 329.4,79.0 300.0,96.0 270.6,79.0 270.6,45.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"386,96 454,82 444,28 410,42 386,62\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "4"}, {"n": "39", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangle has sides of 5 cm, 7 cm and 9 cm. What is the best name for this triangle based on its sides?", "options": {"A": "Equilateral", "B": "Isosceles", "C": "Scalene", "D": "Irregular triangle"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Estimate the size of the marked angle shown.", "options": {"A": "50°", "B": "130°", "C": "95°", "D": "230°"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"220\" fill=\"white\"/><line x1=\"60\" y1=\"170\" x2=\"190\" y2=\"170\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><line x1=\"60\" y1=\"170\" x2=\"-23.6\" y2=\"70.4\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><path d=\"M94,170 A34,34 0 0 0 38.1,144.0\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.5\"/><circle cx=\"60\" cy=\"170\" r=\"3\" fill=\"#1F3864\"/></svg>", "passage": "", "qnum": "6"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two angles meet on a straight line. One of them is 118°. What is the size of the other angle?", "options": {"A": "62°", "B": "28°", "C": "118°", "D": "242°"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A path is 2.4 km long. A second path is 850 m long. What is the total length of the two paths, in metres?", "options": {"A": "3,250 m", "B": "1,090 m", "C": "11,500 m", "D": "2,485 m"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "43", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A bottle holds 1.5 litres of juice. A glass holds 250 ml. How many full glasses can be poured from one bottle?", "options": {"A": "4", "B": "60", "C": "600", "D": "6"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What is the value of the digit 6 in the number 3,648,150?", "options": {"A": "6,000", "B": "60,000", "C": "600,000", "D": "6,000,000"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Write the number that is exactly 1,000 less than 250,407.", "options": {"A": "150,407", "B": "250,307", "C": "240,407", "D": "249,407"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 8,002 − 3,675.", "options": {"A": "5,673", "B": "4,427", "C": "4,337", "D": "4,327"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "47", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A theatre has 48 rows of seats with 35 seats in each row. How many seats are there in total?", "options": {"A": "1,680", "B": "240", "C": "1,480", "D": "16,800"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "48", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Estimate 5,847 ÷ 19 by rounding each number to convenient values.", "options": {"A": "About 30", "B": "About 20", "C": "About 3,000", "D": "About 300"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "49", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 3/4 + 2/5.", "options": {"A": "5/9", "B": "1 3/20", "C": "5/20", "D": "11/20"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "50", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 2/3 of 18, then multiply that result by 5/6.", "options": {"A": "10", "B": "15", "C": "12", "D": "30"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out 6.5 × 0.4.", "options": {"A": "26", "B": "2.6", "C": "0.26", "D": "260"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which decimal is equal to the fraction 3/8?", "options": {"A": "0.38", "B": "0.3", "C": "0.375", "D": "0.83"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Order these numbers from least to greatest: 0.6, 1/2, 0.55, 3/5.", "options": {"A": "1/2, 0.55, 0.6, 3/5", "B": "1/2, 0.55, 3/5, 0.6", "C": "0.55, 1/2, 0.6, 3/5", "D": "3/5, 0.6, 0.55, 1/2"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this number sequence. One term is missing. What number belongs in the gap?  2, 5, 7, 12, 19, ___", "options": {"A": "26", "B": "24", "C": "38", "D": "31"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word is the odd one out? (Three of them belong to the same group; one does not.)", "options": {"A": "Violin", "B": "Trumpet", "C": "Easel", "D": "Flute"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Liam has HK$50. Sketchbooks cost HK$12 each and pencils cost HK$4 each. He must buy exactly 3 sketchbooks first, then spend as much of the money that is left as he can on pencils. What is the greatest number of pencils he can buy?", "options": {"A": "4", "B": "3", "C": "2", "D": "9"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word can go in FRONT of all three of these words to make a real word each time?  ___ball   ___flake   ___man", "options": {"A": "snow", "B": "foot", "C": "fire", "D": "corn"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Carriage is to Train as ___ is to ___.", "options": {"A": "Link is to Chain", "B": "Station is to Carriage", "C": "Wheel is to Axle", "D": "Steam is to Engine"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Three of these tiles show the SAME shape simply turned (rotated). One tile is a mirror image (a reflection) and cannot be made by turning. Which tile is the odd one out?", "options": {"A": "Tile A", "B": "Tile B", "C": "Tile C", "D": "Tile D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"472\" height=\"150\" viewBox=\"0 0 472 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"472\" height=\"150\" fill=\"white\"/><g transform=\"rotate(90 59.0 60)\"><polygon points=\"40,29 60,29 60,69 80,69 80,89 40,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"59\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><g transform=\"translate(354.0 0) scale(-1 1)\"><polygon points=\"158,29 178,29 178,69 198,69 198,89 158,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"177\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><g transform=\"rotate(180 295.0 60)\"><polygon points=\"276,29 296,29 296,69 316,69 316,89 276,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"295\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><g transform=\"rotate(270 413.0 60)\"><polygon points=\"394,29 414,29 414,69 434,69 434,89 394,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"413\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "25"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A scout is standing still and facing North. She turns 90° clockwise, then turns 90° clockwise again, then turns 90° clockwise once more. Which direction is she facing now?", "options": {"A": "East", "B": "South", "C": "West", "D": "North"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Read the statement, then decide whether the proposed assumption is logical USING ONLY the information in the statement.\n\nStatement: \"The school is planting a vegetable garden so that students will understand where their food comes from.\"\n\nProposed assumption: \"Growing vegetables at school can help students understand where their food comes from.\"\n\nUsing the information in the statement, is this assumption logical?", "options": {"A": "Yes — the school plants the garden in order to achieve that understanding, so it must take for granted that growing vegetables can produce it.", "B": "No — the statement says the school will plant a garden, but it does not say the students will actually look after the plants themselves.", "C": "(not used)", "D": "(not used)"}, "fig": "", "passage": "", "qnum": "27"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Read the statement, then decide whether the proposed assumption is logical USING ONLY the information in the statement.\n\nStatement: \"Ms Chan announced that the Year 6 science fair will be held in the main hall on Thursday.\"\n\nProposed assumption: \"Ms Chan is the person who organised the Year 6 science fair.\"\n\nUsing the information in the statement, is this assumption logical?", "options": {"A": "Yes — the person who announces an event is always the person who organised it.", "B": "No — the statement says Ms Chan announced the science fair, but it does not say she is the one who organised it; she could simply be passing on the news.", "C": "(not used)", "D": "(not used)"}, "fig": "", "passage": "", "qnum": "28"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INFERENCE. A statement is given. Choose the ONE option that MUST be true based only on the statement (the others may be true but are not certain).\n\nStatement: \"Every runner on the Red Team finished Saturday's cross-country race. Tom is a runner on the Red Team.\"", "options": {"A": "Tom won Saturday's cross-country race.", "B": "Tom finished ahead of every runner on the Blue Team.", "C": "Tom completed the cross-country race on Saturday.", "D": "Tom trained harder for the race than his teammates did."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INTERPRETATION. Read the statement, then decide which numbered conclusions FOLLOW using ONLY the information given (no outside knowledge).\n\nStatement: \"The Year 6 activity club has exactly 30 members. When they chose a single activity for sports day, 18 members chose football and the remaining 12 chose badminton. No member chose any other activity.\"\n\nConclusions:\n(1) More members of the club chose football than chose badminton.\n(2) Football is the most popular activity among all Year 6 students at the school.\n\nWhich conclusion(s) follow?", "options": {"A": "Only conclusion (1) follows.", "B": "Only conclusion (2) follows.", "C": "Both (1) and (2) follow.", "D": "Neither (1) nor (2) follows."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "DEDUCTION. Take ALL the stated facts together. Choose the ONE conclusion that does NOT follow.\n\nFacts:\n(1) All school prefects wear a silver badge.\n(2) Everyone who wears a silver badge attended Monday's assembly.\n(3) Raj attended Monday's assembly.", "options": {"A": "Every school prefect attended Monday's assembly.", "B": "Anyone wearing a silver badge was present at Monday's assembly.", "C": "All school prefects wear a silver badge.", "D": "Raj is a school prefect."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the school move the start of the school day from 8:00 a.m. to 8:45 a.m. for Year 9 students?\" Three arguments are offered below. Which one is the STRONGEST? (A strong argument is factual, supported by evidence or statistics, and addresses the question directly; a weak one rests on personal feeling or on a sweeping, unsupported claim.)", "options": {"A": "No, I personally enjoy getting to school early because the corridors are quiet then.", "B": "No, students should simply learn to cope with early mornings, because that is how it has always been done.", "C": "Yes, when a neighbouring school trialled an 8:45 start for one year, lateness among Year 9 students fell by 60% and teachers recorded higher scores for morning concentration.", "D": "(not used)"}, "fig": "", "passage": "", "qnum": "32"}, {"n": "67", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "68", "type": "mcq", "section": "Chinese", "stem": "小儀放學時遇到甚麼困難？<br><span style=\"color:#555\">小仪放学时遇到什么困难？</span>", "options": {"A": "忘了帶傘，又下大雨<br><span style=\"color:#555\">忘了带伞，又下大雨</span>", "B": "找不到回家的路", "C": "把書包弄丟了<br><span style=\"color:#555\">把书包弄丢了</span>", "D": "和同學吵了架<br><span style=\"color:#555\">和同学吵了架</span>"}, "fig": "", "passage": "秋天的一個下午，天色忽然暗了下來，下起了滂沱大雨。小儀放學時忘了帶傘，只好站在學校門口的屋簷下等候，看着雨水沿着屋頂一行行地流下來，就像一道道閃亮的水簾。她心裏又焦急又無奈，不知道甚麼時候才能回家。\n\n這時候，一位住在附近的同學阿東剛好撐着傘走過。他見小儀被困在門口，便主動走上前，把傘移到她的頭頂，輕聲說：「我們一起走吧，順路送你一段。」兩個人擠在一把小傘下，雨水把他們的半邊衣袖都打濕了，可是小儀的心裏卻暖暖的。\n\n回到家門前，小儀連聲道謝，阿東卻擺擺手說：「同學之間互相幫忙，是應該的。」望着阿東離去的背影，小儀暗暗下定決心：以後別人有困難的時候，自己也要像他一樣，毫不猶豫地伸出援手。<br><span style=\"color:#555\">秋天的一个下午，天色忽然暗了下来，下起了滂沱大雨。小仪放学时忘了带伞，只好站在学校门口的屋檐下等候，看着雨水沿着屋顶一行行地流下来，就像一道道闪亮的水帘。她心里又焦急又无奈，不知道什么时候才能回家。\n\n这时候，一位住在附近的同学阿东刚好撑着伞走过。他见小仪被困在门口，便主动走上前，把伞移到她的头顶，轻声说：「我们一起走吧，顺路送你一段。」两个人挤在一把小伞下，雨水把他们的半边衣袖都打湿了，可是小仪的心里却暖暖的。\n\n回到家门前，小仪连声道谢，阿东却摆摆手说：「同学之间互相帮忙，是应该的。」望着阿东离去的背影，小仪暗暗下定决心：以后别人有困难的时候，自己也要像他一样，毫不犹豫地伸出援手。</span>", "qnum": "1"}, {"n": "69", "type": "mcq", "section": "Chinese", "stem": "文中把沿着屋頂流下的雨水比喻成甚麼？<br><span style=\"color:#555\">文中把沿着屋顶流下的雨水比喻成什么？</span>", "options": {"A": "一條小河<br><span style=\"color:#555\">一条小河</span>", "B": "一道道閃亮的水簾<br><span style=\"color:#555\">一道道闪亮的水帘</span>", "C": "一串串珍珠", "D": "一片白霧<br><span style=\"color:#555\">一片白雾</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "70", "type": "mcq", "section": "Chinese", "stem": "阿東是怎樣幫助小儀的？<br><span style=\"color:#555\">阿东是怎样帮助小仪的？</span>", "options": {"A": "把自己的傘送給小儀<br><span style=\"color:#555\">把自己的伞送给小仪</span>", "B": "打電話叫小儀的家人來接<br><span style=\"color:#555\">打电话叫小仪的家人来接</span>", "C": "和小儀一起撐傘，順路送她一段<br><span style=\"color:#555\">和小仪一起撑伞，顺路送她一段</span>", "D": "陪小儀在屋簷下一直等雨停<br><span style=\"color:#555\">陪小仪在屋檐下一直等雨停</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "71", "type": "mcq", "section": "Chinese", "stem": "「兩個人擠在一把小傘下，雨水把他們的半邊衣袖都打濕了，可是小儀的心裏卻暖暖的。」這句話主要想表達甚麼？<br><span style=\"color:#555\">「两个人挤在一把小伞下，雨水把他们的半边衣袖都打湿了，可是小仪的心里却暖暖的。」这句话主要想表达什么？</span>", "options": {"A": "雨下得很大，把衣服都淋濕了<br><span style=\"color:#555\">雨下得很大，把衣服都淋湿了</span>", "B": "雖然身上被雨淋濕，但因得到幫助而感到溫暖<br><span style=\"color:#555\">虽然身上被雨淋湿，但因得到帮助而感到温暖</span>", "C": "一把小傘根本擋不住雨<br><span style=\"color:#555\">一把小伞根本挡不住雨</span>", "D": "小儀覺得和阿東一起走很擠迫<br><span style=\"color:#555\">小仪觉得和阿东一起走很挤迫</span>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "72", "type": "mcq", "section": "Chinese", "stem": "從這次經歷中，小儀下定了甚麼決心？<br><span style=\"color:#555\">从这次经历中，小仪下定了什么决心？</span>", "options": {"A": "以後上學一定要記得帶傘<br><span style=\"color:#555\">以后上学一定要记得带伞</span>", "B": "以後要和阿東做最好的朋友<br><span style=\"color:#555\">以后要和阿东做最好的朋友</span>", "C": "以後下雨天就不回家了<br><span style=\"color:#555\">以后下雨天就不回家了</span>", "D": "以後別人有困難時，自己也要主動幫忙<br><span style=\"color:#555\">以后别人有困难时，自己也要主动帮忙</span>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "「滂沱大雨」一詞用來形容下面哪一種情況最合適？<br><span style=\"color:#555\">「滂沱大雨」一词用来形容下面哪一种情况最合适？</span>", "options": {"A": "雨下得很大很急", "B": "天上飄着毛毛細雨<br><span style=\"color:#555\">天上飘着毛毛细雨</span>", "C": "天空晴朗無雲<br><span style=\"color:#555\">天空晴朗无云</span>", "D": "下了一場小雪<br><span style=\"color:#555\">下了一场小雪</span>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "「毫不猶豫地伸出援手」中的「猶豫」，意思是甚麼？<br><span style=\"color:#555\">「毫不犹豫地伸出援手」中的「犹豫」，意思是什么？</span>", "options": {"A": "十分高興<br><span style=\"color:#555\">十分高兴</span>", "B": "感到害怕", "C": "非常生氣<br><span style=\"color:#555\">非常生气</span>", "D": "拿不定主意，遲遲不決定<br><span style=\"color:#555\">拿不定主意，迟迟不决定</span>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "下面哪一組詞語的意思相反（反義詞）？<br><span style=\"color:#555\">下面哪一组词语的意思相反（反义词）？</span>", "options": {"A": "焦急——着急", "B": "幫忙——協助<br><span style=\"color:#555\">帮忙——协助</span>", "C": "焦急——冷靜<br><span style=\"color:#555\">焦急——冷静</span>", "D": "等候——等待"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "「阿東撐着一____傘走過來。」橫線上應填哪一個量詞？<br><span style=\"color:#555\">「阿东撑着一____伞走过来。」横线上应填哪一个量词？</span>", "options": {"A": "頂<br><span style=\"color:#555\">顶</span>", "B": "張<br><span style=\"color:#555\">张</span>", "C": "條<br><span style=\"color:#555\">条</span>", "D": "把"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "下面哪一句的量詞用得正確？<br><span style=\"color:#555\">下面哪一句的量词用得正确？</span>", "options": {"A": "我喝了一張牛奶。<br><span style=\"color:#555\">我喝了一张牛奶。</span>", "B": "他寫了一頭信。<br><span style=\"color:#555\">他写了一头信。</span>", "C": "公園裏有一隻大樹。<br><span style=\"color:#555\">公园里有一只大树。</span>", "D": "天邊掛着一道彩虹。<br><span style=\"color:#555\">天边挂着一道彩虹。</span>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "看見同學遇到困難就立刻上前幫助，一點也不遲疑，最適合用哪一個成語來形容？<br><span style=\"color:#555\">看见同学遇到困难就立刻上前帮助，一点也不迟疑，最适合用哪一个成语来形容？</span>", "options": {"A": "袖手旁觀<br><span style=\"color:#555\">袖手旁观</span>", "B": "見義勇為<br><span style=\"color:#555\">见义勇为</span>", "C": "幸災樂禍<br><span style=\"color:#555\">幸灾乐祸</span>", "D": "斤斤計較<br><span style=\"color:#555\">斤斤计较</span>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "小強答應了同學的事卻常常忘記，從不放在心上。用哪一個成語形容他最合適？<br><span style=\"color:#555\">小强答应了同学的事却常常忘记，从不放在心上。用哪一个成语形容他最合适？</span>", "options": {"A": "言而有信", "B": "一諾千金<br><span style=\"color:#555\">一诺千金</span>", "C": "言而無信<br><span style=\"color:#555\">言而无信</span>", "D": "誠心誠意<br><span style=\"color:#555\">诚心诚意</span>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "下面哪一句句子的詞語次序正確、意思通順？<br><span style=\"color:#555\">下面哪一句句子的词语次序正确、意思通顺？</span>", "options": {"A": "阿東小儀把送回家順路。<br><span style=\"color:#555\">阿东小仪把送回家顺路。</span>", "B": "順路阿東送把小儀回家。<br><span style=\"color:#555\">顺路阿东送把小仪回家。</span>", "C": "阿東順路把小儀送回家。<br><span style=\"color:#555\">阿东顺路把小仪送回家。</span>", "D": "把小儀回家阿東送順路。<br><span style=\"color:#555\">把小仪回家阿东送顺路。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "「____下着大雨，阿東____堅持把小儀送回家。」橫線上填哪一組關聯詞最恰當？<br><span style=\"color:#555\">「____下着大雨，阿东____坚持把小仪送回家。」横线上填哪一组关联词最恰当？</span>", "options": {"A": "雖然……還是<br><span style=\"color:#555\">虽然……还是</span>", "B": "因為……所以<br><span style=\"color:#555\">因为……所以</span>", "C": "只要……就", "D": "如果……就"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V3)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
