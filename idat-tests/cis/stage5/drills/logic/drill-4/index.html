<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 5 Logic Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>

  <header>
    <div class="brand">HK-Schools.com</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "LOGIC-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Logic", "body": "Answer all questions. Choose the single best answer. You may use paper and pencil."}, {"n": "2", "type": "mcq", "section": "Logic", "stem": "The gaps between these terms follow a pattern of their own. What number comes next?  1, 3, 7, 13, 21, 31, ...", "options": {"A": "43", "B": "41", "C": "45", "D": "42"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Logic", "stem": "In each term the letter follows one rule and the number follows another. Which term comes next?  A2, C6, F12, J20, ...", "options": {"A": "N30", "B": "O28", "C": "O30", "D": "O32"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Logic", "stem": "Every term after the second is worked out from the two terms in front of it. What comes next?  4, 6, 9, 14, 22, ...", "options": {"A": "36", "B": "35", "C": "34", "D": "30"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Logic", "stem": "A diagonal joins two corners of a shape that are not next to each other. Which of the shapes drawn below has the GREATEST number of diagonals?", "options": {"A": "Pentagon", "B": "Hexagon", "C": "Square", "D": "Octagon"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><polygon points=\"60.0,28.0 92.3,51.5 80.0,89.5 40.0,89.5 27.7,51.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"180.0,28.0 209.4,45.0 209.4,79.0 180.0,96.0 150.6,79.0 150.6,45.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><rect x=\"266\" y=\"28\" width=\"68\" height=\"68\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"420.0,28.0 444.0,38.0 454.0,62.0 444.0,86.0 420.0,96.0 396.0,86.0 386.0,62.0 396.0,38.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Logic", "stem": "Give every letter the number of its place in the alphabet, so that A is 1, B is 2 and so on, and add the numbers up. Which of these words has the LARGEST total?  ICE, BUS, ANT, LID", "options": {"A": "ANT", "B": "LID", "C": "BUS", "D": "ICE"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Logic", "stem": "The first word names a cause and the second its result. Drought is to famine as neglect is to ...", "options": {"A": "Care", "B": "Decay", "C": "Owner", "D": "Repair"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Logic", "stem": "Three of these phrases are gentle ways of speaking about the same difficult subject. Which is the ODD ONE OUT?  passed away · no longer with us · at rest · under the weather", "options": {"A": "under the weather", "B": "passed away", "C": "no longer with us", "D": "at rest"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Logic", "stem": "The same missing word begins all three of these phrases: ______ market, ______ box and ______ list. Which word is missing?", "options": {"A": "Super", "B": "Check", "C": "Stock", "D": "Black"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Logic", "stem": "The five-pointed star below has been turned about its centre and now looks exactly as it did before. What is the SMALLEST turn that could have been made?", "options": {"A": "60°", "B": "72°", "C": "45°", "D": "36°"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"170\" viewBox=\"0 0 320 170\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"320\" height=\"170\" fill=\"white\"/><g transform=\"rotate(-90 75 80)\"><polygon points=\"75.0,42.0 85.1,66.2 111.1,68.3 91.3,85.3 97.3,110.7 75.0,97.1 52.7,110.7 58.7,85.3 38.9,68.3 64.9,66.2\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"75\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">original</text><text x=\"160\" y=\"85\" text-anchor=\"middle\" font-size=\"26\" fill=\"#C00\">&#8594;</text><g transform=\"rotate(-18 245 80)\"><polygon points=\"245.0,42.0 255.1,66.2 281.1,68.3 261.3,85.3 267.3,110.7 245.0,97.1 222.7,110.7 228.7,85.3 208.9,68.3 234.9,66.2\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"245\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">after turning</text></svg>", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Logic", "stem": "Which of these correctly describes the solid drawn below?", "options": {"A": "5 faces, 9 edges and 6 vertices", "B": "6 faces, 9 edges and 5 vertices", "C": "5 faces, 8 edges and 5 vertices", "D": "4 faces, 6 edges and 4 vertices"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><polygon points=\"150,160 70,160 110,90 190,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"40,160 150,160 110,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"40\" y1=\"160\" x2=\"80\" y2=\"90\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M80,90 L190,90 M80,90 L110,90\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Logic", "stem": "A net for a cube is made of a row of four squares labelled P, Q, R and S from left to right, with a square T joined above Q and a square U joined below Q. When the net is folded into a cube, which face ends up OPPOSITE Q?", "options": {"A": "P", "B": "T", "C": "S", "D": "U"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Logic", "stem": "The first two shapes are linked by a rule. Apply the same rule to the third shape. Which shape completes the second pair?", "options": {"A": "Hexagon", "B": "Square", "C": "Star", "D": "Decagon"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"250\" viewBox=\"0 0 480 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"250\" fill=\"white\"/><text x=\"10\" y=\"20\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">A is to B, as C is to ?</text><rect x=\"27\" y=\"50\" width=\"56\" height=\"56\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"100\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><polygon points=\"155.0,50.0 174.8,58.2 183.0,78.0 174.8,97.8 155.0,106.0 135.2,97.8 127.0,78.0 135.2,58.2\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"206\" y=\"86\" font-size=\"22\" font-weight=\"bold\" fill=\"#333\">::</text><polygon points=\"262.0,50.0 288.6,69.3 278.5,100.7 245.5,100.7 235.4,69.3\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"308\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><text x=\"362\" y=\"90\" font-size=\"30\" font-weight=\"bold\" fill=\"#C00\">?</text><line x1=\"10\" y1=\"140\" x2=\"470\" y2=\"140\" stroke=\"#ccc\"/><text x=\"10\" y=\"162\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Options:</text><polygon points=\"60.0,170.0 84.2,184.0 84.2,212.0 60.0,226.0 35.8,212.0 35.8,184.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><rect x=\"124\" y=\"170\" width=\"56\" height=\"56\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"152\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"244.0,170.0 251.4,187.8 270.6,189.3 256.0,201.9 260.5,220.7 244.0,210.6 227.5,220.7 232.0,201.9 217.4,189.3 236.6,187.8\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"244\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"336.0,170.0 352.5,175.3 362.6,189.3 362.6,206.7 352.5,220.7 336.0,226.0 319.5,220.7 309.4,206.7 309.4,189.3 319.5,175.3\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"336\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Logic", "stem": "A ferry takes 40 minutes to cross a lake and then waits 15 minutes before setting off again. The first crossing leaves at 06:00. At what time does the ferry leave on its FOURTH crossing?", "options": {"A": "08:45", "B": "09:40", "C": "08:00", "D": "07:50"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Logic", "stem": "A machine fills 45 bottles a minute for its first 20 minutes and then slows to 30 bottles a minute. Altogether it must fill 2100 bottles. How long does the whole run take?", "options": {"A": "47 minutes", "B": "70 minutes", "C": "60 minutes", "D": "40 minutes"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Logic", "stem": "A shop sets its price by adding 25% to what it paid, and a shirt is priced at $60. In a sale an identical shirt is sold for $54. Does the shop make a profit or a loss on the sale shirt, and how much?", "options": {"A": "A loss of $6", "B": "A profit of $13.50", "C": "A profit of $9", "D": "A profit of $6"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Logic", "stem": "Three friends share a taxi fare of $84. Bea pays twice as much as Ana, and Cal pays $9 more than Bea. How much does ANA pay?", "options": {"A": "$28", "B": "$15", "C": "$30", "D": "$25"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Logic", "stem": "Five towers are named V, W, X, Y and Z, and no two are the same height. X is taller than W. W is taller than Y. Y is taller than Z. V is the second tallest of the five. Which tower is THIRD tallest?", "options": {"A": "V", "B": "Y", "C": "W", "D": "X"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Logic", "stem": "Nadia, Owen, Pia and Quinn each chose a different one of art, drama, music and Spanish as an extra subject. Nadia chose neither music nor Spanish. Owen chose drama. Pia did not choose Spanish. Who chose SPANISH?", "options": {"A": "Quinn", "B": "Nadia", "C": "Owen", "D": "Pia"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Logic", "stem": "The organisers announced: \"The match will be played unless the pitch is flooded.\" The match was not played. What MUST be true?", "options": {"A": "The pitch was not flooded.", "B": "The pitch was flooded.", "C": "The match will be replayed next week.", "D": "Matches everywhere are called off whenever a pitch is flooded."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Logic", "stem": "Every book in the display is either a biography or a travel book. None of the travel books is by a living author. Which of these MUST be true?", "options": {"A": "All the biographies in the display are by living authors.", "B": "There are no travel books in the display.", "C": "Every book in the display was written this year.", "D": "Any book in the display by a living author is a biography."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 Logic Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
