<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>IDAT CIS: Stage 5 English Drill 1</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "ENG-D1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which sentence uses a COLON correctly to introduce a list after a complete clause?", "options": {"A": "The park needs: shade, water and seating.", "B": "The park needs three things; shade, water and seating.", "C": "The park needs three things: shade, water and seating.", "D": "The park needs three things, shade: water and seating."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which expression below is a EUPHEMISM, that is, a mild phrase used in place of a blunter one?", "options": {"A": "The council gave the plan the green light.", "B": "The chairman kicked the bucket last spring.", "C": "The whole meeting was a shambles.", "D": "The council has asked two members of staff to step down."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which word describes praise so excessive that it starts to sound insincere?", "options": {"A": "Generous", "B": "Fulsome", "C": "Candid", "D": "Grudging"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.<br>Every page had been checked by a ____ editor.", "options": {"A": "conscientious", "B": "concientious", "C": "conscientous", "D": "consciencious"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which linking word best signals that a writer is CONCEDING a point before disagreeing with it?", "options": {"A": "Consequently", "B": "Admittedly", "C": "Likewise", "D": "Namely"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Read the opening of a sonnet published in 1609.<br><i>Shall I compare thee to a summer's day?<br>Thou art more lovely and more temperate.</i><br>What is the EFFECT of raising the comparison with summer and then setting it aside?", "options": {"A": "It tells the reader plainly that the poem is set during the summer.", "B": "It admits that the subject cannot be described and gives up the attempt.", "C": "It suggests that the subject is as changeable as the weather.", "D": "It praises the subject by measuring them against summer and finding summer the lesser of the two."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "In an argumentative essay, what is the job of the paragraph that sets out the OPPOSING view?", "options": {"A": "To list every objection briefly so that the reader can see how many there are.", "B": "To describe how the writer feels about the people who disagree.", "C": "To state the strongest objection fairly and then answer it with reasoning or evidence.", "D": "To repeat the writer's own claim in stronger words."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "A travel writer of the 1850s describes a harbour at dawn:<br><i>The slow sea slid against the stones, and the sails stood still as paper.</i><br>What does the repeated 's' sound contribute here?", "options": {"A": "It slows the line down and suits the stillness being described.", "B": "It makes the harbour sound noisy and crowded.", "C": "It shows that the writer disapproves of the harbour.", "D": "It marks the sentence as a question rather than a statement."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which sentence keeps the three items of its list in PARALLEL form?", "options": {"A": "The scheme promised cleaner air, quieter streets and that crossings would be safer.", "B": "The scheme promised to clean the air, quieter streets and safer crossings.", "C": "The scheme promised cleaner air, that streets be quieter and safer crossings.", "D": "The scheme promised cleaner air, quieter streets and safer crossings."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "A letter to a school governor calls for the most FORMAL of these four ways of saying the same thing. Which is it?", "options": {"A": "Any chance you could think again about this?", "B": "I should be grateful if you would reconsider the decision.", "C": "You need to take another look at what you decided.", "D": "Give the decision another go, please."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "In TEXT A, what does the speaker mean by saying the ground 'has no rent to pay and no voice to speak with'?", "options": {"A": "The land belongs to nobody and may therefore be built on freely.", "B": "The people who live near the field have not been consulted.", "C": "The land earns the town nothing and cannot argue for itself, so somebody must argue for it.", "D": "The town cannot afford to buy the field from its owner."}, "fig": "", "passage": "<strong>Two texts about the last open ground at Hollow Lane</strong><br><p><b>TEXT A</b>: from an address to the Improvement Committee of a northern town, 1878</p><p>Gentlemen, I do not ask you to build a monument. I ask you to leave a field alone. The four acres above Hollow Lane are the last open ground between the canal and the moor, and every week another yard of them is taken quietly, by a wall here and a shed there, until one morning the town will wake and find that its last green thought has been carried off in a barrow.</p><p>Consider what the mill has already taken. The mill never sleeps; all night it breathes its smoke over the sleeping town, and in the morning our children draw that smoke into their lungs before they draw a letter on a slate. Consider, too, that the ground itself has no rent to pay and no voice to speak with. It must be spoken for.</p><p>I have heard it said that a park is a luxury. So is a lung.</p><p><b>TEXT B</b>: from a briefing paper prepared for a district council this year</p><p>The Hollow Lane site extends to 1.6 hectares and is the only undeveloped land remaining in the ward. Officers were asked to set out the options.</p><p>Option 1 retains the whole site as public open space. It scores highest on air quality and on the residents' survey, 71 per cent of which named open space as the ward's greatest need. It delivers no housing.</p><p>Option 2 builds forty homes on the eastern third and lays out the remainder as a park. It meets 8 per cent of the ward's five-year housing target and reduces the open space by roughly a third.</p><p>Members are reminded that the waiting list for social housing in the ward stands at 430 households, and that no other site in the ward is available. Whichever option is chosen, something the ward needs will not be provided.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which description best fits the stance TEXT B takes towards the two options?", "options": {"A": "It weighs both options and states the cost of each without recommending one.", "B": "It argues that the whole site should be kept as open space.", "C": "It argues that homes should be built across the whole site.", "D": "It avoids giving figures so that members may decide freely."}, "fig": "", "passage": "<strong>Two texts about the last open ground at Hollow Lane</strong><br><p><b>TEXT A</b>: from an address to the Improvement Committee of a northern town, 1878</p><p>Gentlemen, I do not ask you to build a monument. I ask you to leave a field alone. The four acres above Hollow Lane are the last open ground between the canal and the moor, and every week another yard of them is taken quietly, by a wall here and a shed there, until one morning the town will wake and find that its last green thought has been carried off in a barrow.</p><p>Consider what the mill has already taken. The mill never sleeps; all night it breathes its smoke over the sleeping town, and in the morning our children draw that smoke into their lungs before they draw a letter on a slate. Consider, too, that the ground itself has no rent to pay and no voice to speak with. It must be spoken for.</p><p>I have heard it said that a park is a luxury. So is a lung.</p><p><b>TEXT B</b>: from a briefing paper prepared for a district council this year</p><p>The Hollow Lane site extends to 1.6 hectares and is the only undeveloped land remaining in the ward. Officers were asked to set out the options.</p><p>Option 1 retains the whole site as public open space. It scores highest on air quality and on the residents' survey, 71 per cent of which named open space as the ward's greatest need. It delivers no housing.</p><p>Option 2 builds forty homes on the eastern third and lays out the remainder as a park. It meets 8 per cent of the ward's five-year housing target and reduces the open space by roughly a third.</p><p>Members are reminded that the waiting list for social housing in the ward stands at 430 households, and that no other site in the ward is available. Whichever option is chosen, something the ward needs will not be provided.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "How do the PURPOSES of the two Hollow Lane texts differ?", "options": {"A": "TEXT A sets out options for a decision; TEXT B argues for one course of action.", "B": "Both texts are written to raise money for a new park.", "C": "TEXT A sets out to persuade a committee to act; TEXT B sets out options for members who must choose.", "D": "Both texts report the findings of a survey of local residents."}, "fig": "", "passage": "<strong>Two texts about the last open ground at Hollow Lane</strong><br><p><b>TEXT A</b>: from an address to the Improvement Committee of a northern town, 1878</p><p>Gentlemen, I do not ask you to build a monument. I ask you to leave a field alone. The four acres above Hollow Lane are the last open ground between the canal and the moor, and every week another yard of them is taken quietly, by a wall here and a shed there, until one morning the town will wake and find that its last green thought has been carried off in a barrow.</p><p>Consider what the mill has already taken. The mill never sleeps; all night it breathes its smoke over the sleeping town, and in the morning our children draw that smoke into their lungs before they draw a letter on a slate. Consider, too, that the ground itself has no rent to pay and no voice to speak with. It must be spoken for.</p><p>I have heard it said that a park is a luxury. So is a lung.</p><p><b>TEXT B</b>: from a briefing paper prepared for a district council this year</p><p>The Hollow Lane site extends to 1.6 hectares and is the only undeveloped land remaining in the ward. Officers were asked to set out the options.</p><p>Option 1 retains the whole site as public open space. It scores highest on air quality and on the residents' survey, 71 per cent of which named open space as the ward's greatest need. It delivers no housing.</p><p>Option 2 builds forty homes on the eastern third and lays out the remainder as a park. It meets 8 per cent of the ward's five-year housing target and reduces the open space by roughly a third.</p><p>Members are reminded that the waiting list for social housing in the ward stands at 430 households, and that no other site in the ward is available. Whichever option is chosen, something the ward needs will not be provided.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Both texts record that Hollow Lane is the last open ground in the area. What does each make of that?", "options": {"A": "TEXT A turns it into an image of loss going on yard by yard; TEXT B records it as a constraint beside the housing figures.", "B": "TEXT A records it as a planning constraint; TEXT B turns it into an image of loss.", "C": "Only TEXT B notices that the site is the last of its kind.", "D": "The two texts disagree about whether other open land exists."}, "fig": "", "passage": "<strong>Two texts about the last open ground at Hollow Lane</strong><br><p><b>TEXT A</b>: from an address to the Improvement Committee of a northern town, 1878</p><p>Gentlemen, I do not ask you to build a monument. I ask you to leave a field alone. The four acres above Hollow Lane are the last open ground between the canal and the moor, and every week another yard of them is taken quietly, by a wall here and a shed there, until one morning the town will wake and find that its last green thought has been carried off in a barrow.</p><p>Consider what the mill has already taken. The mill never sleeps; all night it breathes its smoke over the sleeping town, and in the morning our children draw that smoke into their lungs before they draw a letter on a slate. Consider, too, that the ground itself has no rent to pay and no voice to speak with. It must be spoken for.</p><p>I have heard it said that a park is a luxury. So is a lung.</p><p><b>TEXT B</b>: from a briefing paper prepared for a district council this year</p><p>The Hollow Lane site extends to 1.6 hectares and is the only undeveloped land remaining in the ward. Officers were asked to set out the options.</p><p>Option 1 retains the whole site as public open space. It scores highest on air quality and on the residents' survey, 71 per cent of which named open space as the ward's greatest need. It delivers no housing.</p><p>Option 2 builds forty homes on the eastern third and lays out the remainder as a park. It meets 8 per cent of the ward's five-year housing target and reduces the open space by roughly a third.</p><p>Members are reminded that the waiting list for social housing in the ward stands at 430 households, and that no other site in the ward is available. Whichever option is chosen, something the ward needs will not be provided.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "TEXT A ends: 'I have heard it said that a park is a luxury. So is a lung.' What does that closing comparison achieve?", "options": {"A": "It concedes that the park would be an expensive extravagance.", "B": "It answers the objection by making the park as necessary as breathing.", "C": "It turns the subject to the speaker's own health.", "D": "It offers a statistic in support of the argument."}, "fig": "", "passage": "<strong>Two texts about the last open ground at Hollow Lane</strong><br><p><b>TEXT A</b>: from an address to the Improvement Committee of a northern town, 1878</p><p>Gentlemen, I do not ask you to build a monument. I ask you to leave a field alone. The four acres above Hollow Lane are the last open ground between the canal and the moor, and every week another yard of them is taken quietly, by a wall here and a shed there, until one morning the town will wake and find that its last green thought has been carried off in a barrow.</p><p>Consider what the mill has already taken. The mill never sleeps; all night it breathes its smoke over the sleeping town, and in the morning our children draw that smoke into their lungs before they draw a letter on a slate. Consider, too, that the ground itself has no rent to pay and no voice to speak with. It must be spoken for.</p><p>I have heard it said that a park is a luxury. So is a lung.</p><p><b>TEXT B</b>: from a briefing paper prepared for a district council this year</p><p>The Hollow Lane site extends to 1.6 hectares and is the only undeveloped land remaining in the ward. Officers were asked to set out the options.</p><p>Option 1 retains the whole site as public open space. It scores highest on air quality and on the residents' survey, 71 per cent of which named open space as the ward's greatest need. It delivers no housing.</p><p>Option 2 builds forty homes on the eastern third and lays out the remainder as a park. It meets 8 per cent of the ward's five-year housing target and reduces the open space by roughly a third.</p><p>Members are reminded that the waiting list for social housing in the ward stands at 430 households, and that no other site in the ward is available. Whichever option is chosen, something the ward needs will not be provided.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the whole English section, reading and writing together, is 80 minutes, and the writing is typed on a keyboard. Choose ONE of the two tasks below. At Stage 5 the text type is an ARGUMENTATIVE essay: you defend a claim with reasoning and evidence, and you answer the strongest argument against you. Personal experience may illustrate a point, but it cannot carry the whole answer.", "label": "", "body": "", "hint": "Answer EVERY part of the task you choose. Open with a claim that can be argued about, then give each paragraph one point and the reasoning or evidence that supports it. Use linking words to carry the reader between paragraphs, and give one paragraph to the strongest objection before you answer it. Vary your sentence types. Use a colon to introduce a list or an explanation and a semi-colon to join two closely related statements. Check the spelling of your longer words before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": "TASK 1\nA city council must decide whether its last piece of undeveloped land becomes a public park or housing. Argue for one of the two. State your claim, give two reasons with evidence or reasoning behind each, set out the strongest case for the other choice, answer it, and say what would have to be true for you to change your mind.\n\nTASK 2\n'Anything worth protecting can pay for itself.' Argue for or against this claim. State your position, defend it with two developed reasons, use one example from history, science or public life rather than from your own experience, answer the objection you consider strongest, and close by saying precisely how far your claim extends."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 English Drill 1</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
