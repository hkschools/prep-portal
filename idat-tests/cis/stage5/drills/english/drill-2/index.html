<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 5 English Drill 2</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

const SCHOOL = "CIS", STAGE = "5", VERSION = "ENG-D2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "In which sentence does a SEMI-COLON correctly join two statements that could each stand alone?", "options": {"A": "The train was late; because the points had frozen.", "B": "The train was late; nobody on the platform seemed surprised.", "C": "The train was late; and everybody waited.", "D": "The train was; late nobody seemed surprised."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "You are writing a letter of condolence to a colleague. Which wording is the one to use?", "options": {"A": "I hear your grandfather kicked the bucket.", "B": "I hear your grandfather has snuffed it.", "C": "I was very sorry to hear that your grandfather passed away.", "D": "I hear your grandfather bit the dust last week."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which verb most precisely describes noise from a crowd dying away by degrees rather than all at once?", "options": {"A": "Subsided", "B": "Vanished", "C": "Erupted", "D": "Persisted"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which spelling of the word for lodging and room is correct in this sentence?<br>The station cannot provide ____ for so many passengers.", "options": {"A": "acommodation", "B": "accomodation", "C": "accommadation", "D": "accommodation"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Four sentences have been jumbled. Which order runs from cause to consequence?<br>(i) Within a decade the coaching inns along the road had closed.<br>(ii) The railway reached the town in 1844.<br>(iii) Passengers who had once broken the journey overnight now arrived before dinner.<br>(iv) The road itself fell quiet, and grass came back to its edges.", "options": {"A": "(ii), (iii), (i), (iv)", "B": "(i), (ii), (iii), (iv)", "C": "(ii), (i), (iv), (iii)", "D": "(iv), (iii), (ii), (i)"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Read these lines, written in 1802 about London seen at sunrise.<br><i>This City now doth like a garment wear<br>The beauty of the morning.</i><br>What does the comparison with a garment suggest about that beauty?", "options": {"A": "That the city is trying to disguise how ugly it usually is.", "B": "That the buildings are draped in cloth for a public occasion.", "C": "That the beauty of the city can never be lost.", "D": "That it has been put on for a while and can be taken off again, so the beauty is real but temporary."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which sentence would work best as the THESIS of an argumentative essay, the claim the whole essay then defends?", "options": {"A": "This essay will discuss the advantages and disadvantages of cheap air travel.", "B": "Cheap air travel is a fascinating subject with many sides to it.", "C": "Cheap air travel should be taxed more heavily, because the cost of the damage it does falls on people who never fly.", "D": "Millions of people took a low cost flight last year."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "A nineteenth century narrator says of a landlord who has just turned a family out of their home:<br><i>He was, by his own account, the most reasonable of men.</i><br>What kind of irony is at work?", "options": {"A": "Dramatic irony, since the reader knows something the landlord does not.", "B": "Verbal irony, since the praise is written to be read as its opposite.", "C": "Situational irony, since the outcome is the reverse of what was intended.", "D": "No irony, since the narrator is simply reporting the landlord's opinion."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which sentence uses the correct verb form after the subject 'neither'?", "options": {"A": "Neither of the timetables were accurate.", "B": "Neither of the timetables have been accurate.", "C": "Neither of the timetables was accurate.", "D": "Neither of the timetables are accurate."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "A writer of 1844 calls a railway carriage 'commodious'. What is he telling his reader about it?", "options": {"A": "That it is roomy and comfortable.", "B": "That it is expensive to travel in.", "C": "That it is crowded and stuffy.", "D": "That it may be hired by anybody who applies."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to TEXT A, what astonished the letter writer most?", "options": {"A": "The comfort of the carriage and the size of its windows.", "B": "The way the speed altered how the countryside appeared, rather than the speed in itself.", "C": "The news that the fare would fall again by the summer.", "D": "The age of the church that he passed on the way."}, "fig": "", "passage": "<strong>Two texts about a journey to the coast</strong><br><p><b>TEXT A</b>: from a letter written in 1844, three weeks after the line to the coast opened</p><p>My dear Harriet, I have this day done a thing our grandmother would not have believed. I breakfasted in this town, and I walked on the sand at Redcar before two o'clock.</p><p>The carriage is commodious and the windows are large. What astonished me was not the speed itself but what the speed does to the country. Hedges do not pass; they are drawn away, like a thread pulled from a seam. A church that has stood since the Conquest is given to you and taken from you between one thought and the next.</p><p>Ten hours by coach, and I have done it in two. I am told the fare will fall again by the summer. Whether we shall be the better for arriving so soon I cannot tell you; I know only that I did.</p><p><b>TEXT B</b>: from a newspaper column published this year</p><p>The line to the coast opened in 1844 and cut the journey from ten hours to two. We have been shortening journeys ever since, and we have never once asked what the shortening costs.</p><p>A ten hour coach journey was miserable. Nobody is arguing for its return. But a journey that takes ten hours is a journey you have to think about, and a place you have thought about for ten hours is a place you arrive at differently. Two hours buys you the coast. It does not buy you the distance.</p><p>The objection to all this is obvious: it is easy to admire slow travel when nobody is making you do it. That is fair, and I would not pretend otherwise. I would still say that speed has quietly changed what a destination is, and that we chose this without ever having the discussion.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What does the writer of TEXT B do with the argument that slow travel is easy to admire from a distance?", "options": {"A": "He argues that the ten hour coach journey ought to be brought back.", "B": "He refuses to consider any argument against his position.", "C": "He concludes that speed has made no real difference after all.", "D": "He accepts that the objection is fair and keeps his claim in spite of it."}, "fig": "", "passage": "<strong>Two texts about a journey to the coast</strong><br><p><b>TEXT A</b>: from a letter written in 1844, three weeks after the line to the coast opened</p><p>My dear Harriet, I have this day done a thing our grandmother would not have believed. I breakfasted in this town, and I walked on the sand at Redcar before two o'clock.</p><p>The carriage is commodious and the windows are large. What astonished me was not the speed itself but what the speed does to the country. Hedges do not pass; they are drawn away, like a thread pulled from a seam. A church that has stood since the Conquest is given to you and taken from you between one thought and the next.</p><p>Ten hours by coach, and I have done it in two. I am told the fare will fall again by the summer. Whether we shall be the better for arriving so soon I cannot tell you; I know only that I did.</p><p><b>TEXT B</b>: from a newspaper column published this year</p><p>The line to the coast opened in 1844 and cut the journey from ten hours to two. We have been shortening journeys ever since, and we have never once asked what the shortening costs.</p><p>A ten hour coach journey was miserable. Nobody is arguing for its return. But a journey that takes ten hours is a journey you have to think about, and a place you have thought about for ten hours is a place you arrive at differently. Two hours buys you the coast. It does not buy you the distance.</p><p>The objection to all this is obvious: it is easy to admire slow travel when nobody is making you do it. That is fair, and I would not pretend otherwise. I would still say that speed has quietly changed what a destination is, and that we chose this without ever having the discussion.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which pair of descriptions fits the TONE of each text?", "options": {"A": "TEXT A is reasoned and argumentative; TEXT B is astonished and personal.", "B": "TEXT A is astonished and personal; TEXT B is reasoned and argumentative.", "C": "Both texts are written to persuade the reader to travel by rail.", "D": "Both look back on the railway from a distance of many years."}, "fig": "", "passage": "<strong>Two texts about a journey to the coast</strong><br><p><b>TEXT A</b>: from a letter written in 1844, three weeks after the line to the coast opened</p><p>My dear Harriet, I have this day done a thing our grandmother would not have believed. I breakfasted in this town, and I walked on the sand at Redcar before two o'clock.</p><p>The carriage is commodious and the windows are large. What astonished me was not the speed itself but what the speed does to the country. Hedges do not pass; they are drawn away, like a thread pulled from a seam. A church that has stood since the Conquest is given to you and taken from you between one thought and the next.</p><p>Ten hours by coach, and I have done it in two. I am told the fare will fall again by the summer. Whether we shall be the better for arriving so soon I cannot tell you; I know only that I did.</p><p><b>TEXT B</b>: from a newspaper column published this year</p><p>The line to the coast opened in 1844 and cut the journey from ten hours to two. We have been shortening journeys ever since, and we have never once asked what the shortening costs.</p><p>A ten hour coach journey was miserable. Nobody is arguing for its return. But a journey that takes ten hours is a journey you have to think about, and a place you have thought about for ten hours is a place you arrive at differently. Two hours buys you the coast. It does not buy you the distance.</p><p>The objection to all this is obvious: it is easy to admire slow travel when nobody is making you do it. That is fair, and I would not pretend otherwise. I would still say that speed has quietly changed what a destination is, and that we chose this without ever having the discussion.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Both texts carry the figure of ten hours reduced to two. What does each text do with it?", "options": {"A": "TEXT A uses it to open an argument; TEXT B offers it as a personal marvel.", "B": "The two texts give different figures for the journey.", "C": "Neither text says how long the journey took before the railway.", "D": "TEXT A offers it as a marvel he has just lived through; TEXT B uses it to open an argument about what speed has cost."}, "fig": "", "passage": "<strong>Two texts about a journey to the coast</strong><br><p><b>TEXT A</b>: from a letter written in 1844, three weeks after the line to the coast opened</p><p>My dear Harriet, I have this day done a thing our grandmother would not have believed. I breakfasted in this town, and I walked on the sand at Redcar before two o'clock.</p><p>The carriage is commodious and the windows are large. What astonished me was not the speed itself but what the speed does to the country. Hedges do not pass; they are drawn away, like a thread pulled from a seam. A church that has stood since the Conquest is given to you and taken from you between one thought and the next.</p><p>Ten hours by coach, and I have done it in two. I am told the fare will fall again by the summer. Whether we shall be the better for arriving so soon I cannot tell you; I know only that I did.</p><p><b>TEXT B</b>: from a newspaper column published this year</p><p>The line to the coast opened in 1844 and cut the journey from ten hours to two. We have been shortening journeys ever since, and we have never once asked what the shortening costs.</p><p>A ten hour coach journey was miserable. Nobody is arguing for its return. But a journey that takes ten hours is a journey you have to think about, and a place you have thought about for ten hours is a place you arrive at differently. Two hours buys you the coast. It does not buy you the distance.</p><p>The objection to all this is obvious: it is easy to admire slow travel when nobody is making you do it. That is fair, and I would not pretend otherwise. I would still say that speed has quietly changed what a destination is, and that we chose this without ever having the discussion.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "TEXT A says the hedges 'are drawn away, like a thread pulled from a seam'. What does that comparison capture?", "options": {"A": "The smooth, continuous way the nearest landscape is pulled out of sight.", "B": "The damage that the railway did to the hedges themselves.", "C": "How tangled and confusing the view had become.", "D": "How slowly the countryside appeared to move past the window."}, "fig": "", "passage": "<strong>Two texts about a journey to the coast</strong><br><p><b>TEXT A</b>: from a letter written in 1844, three weeks after the line to the coast opened</p><p>My dear Harriet, I have this day done a thing our grandmother would not have believed. I breakfasted in this town, and I walked on the sand at Redcar before two o'clock.</p><p>The carriage is commodious and the windows are large. What astonished me was not the speed itself but what the speed does to the country. Hedges do not pass; they are drawn away, like a thread pulled from a seam. A church that has stood since the Conquest is given to you and taken from you between one thought and the next.</p><p>Ten hours by coach, and I have done it in two. I am told the fare will fall again by the summer. Whether we shall be the better for arriving so soon I cannot tell you; I know only that I did.</p><p><b>TEXT B</b>: from a newspaper column published this year</p><p>The line to the coast opened in 1844 and cut the journey from ten hours to two. We have been shortening journeys ever since, and we have never once asked what the shortening costs.</p><p>A ten hour coach journey was miserable. Nobody is arguing for its return. But a journey that takes ten hours is a journey you have to think about, and a place you have thought about for ten hours is a place you arrive at differently. Two hours buys you the coast. It does not buy you the distance.</p><p>The objection to all this is obvious: it is easy to admire slow travel when nobody is making you do it. That is fair, and I would not pretend otherwise. I would still say that speed has quietly changed what a destination is, and that we chose this without ever having the discussion.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "The English section of the real test lasts 80 minutes in total and the writing is typed on a keyboard. Choose ONE of the two tasks below and answer every part of it. The text type at Stage 5 is an ARGUMENTATIVE essay: a claim defended with reasoning and evidence, with the strongest counter-argument stated and answered. Your own experience may illustrate a point but cannot stand as the proof of it.", "label": "", "body": "", "hint": "Plan before you type. Put your claim in the first paragraph in a form somebody could disagree with, then build one point per paragraph and show the reasoning behind each. Carry the reader forward with linking words such as 'admittedly', 'against this' and 'it follows that'. Give a full paragraph to the objection you find hardest and answer it. Mix short sentences with longer ones. A colon introduces an explanation or a list; a semi-colon joins two statements that could each stand alone. Leave time to check your spelling.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "TASK 1\n'Faster is not always better.' Argue for or against this claim as it applies to travel, to communication or to study. State your position, defend it with two developed reasons, support at least one of them with evidence rather than with feeling, answer the strongest objection, and say what limits you would put on your own claim.", "partB": "TASK 2\nA city is deciding whether to spend a very large sum on cutting a rail journey by twenty minutes, or the same sum on more frequent local services. Argue for one of the two. Explain who gains under your choice and who loses, give the reasoning that decides it for you, set out the best case for the other option, and answer it."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 English Drill 2</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
