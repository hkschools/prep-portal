<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 5 English Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "ENG-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which sentence uses a COLON correctly to introduce an explanation of the statement before it?", "options": {"A": "The reason is simple, the boats arrive before the whales have fed.", "B": "The reason is simple: the boats arrive before the whales have fed.", "C": "The reason is simple: because the boats arrive before the whales have fed.", "D": "The reason: is simple the boats arrive before the whales have fed."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "An official notice reads: 'Following a review, the visitor centre will be rationalised.' What is 'rationalised' doing there?", "options": {"A": "It is an idiom, a fixed phrase whose meaning is not literal.", "B": "It is slang, informal language belonging to a particular group.", "C": "It is a euphemism, a mild word standing in for closure or cuts.", "D": "It is a technical term with one exact meaning."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which word describes a statement so worded that it can honestly be read in two different ways?", "options": {"A": "Explicit", "B": "Inaccurate", "C": "Concise", "D": "Equivocal"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Pick the correctly spelled form of the word meaning close and continuous watching.<br>The colony has been under ____ since 1998.", "options": {"A": "surveillance", "B": "surveilance", "C": "survellance", "D": "surveillence"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Four sentences are meant to form one paragraph about whale watching trips. Which sentence does NOT belong?<br>(i) Boats now leave the harbour four times a day in summer.<br>(ii) Visitor numbers have tripled since the first licence was issued.<br>(iii) The harbour cafe has recently changed its opening hours.<br>(iv) Guides say the animals have become harder to find close to shore.", "options": {"A": "(i)", "B": "(ii)", "C": "(iv)", "D": "(iii)"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which device gives these lines from a poem of 1798 their force?<br><i>Water, water, every where,<br>Nor any drop to drink.</i>", "options": {"A": "Simile, since the sea is compared to something else using 'like'.", "B": "Understatement, since the danger is made to sound smaller than it is.", "C": "Irony, since the sailors are surrounded by the very thing they cannot have.", "D": "Personification, since the sea is given human qualities."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "A student writes: 'Boat trips should be limited, because I once waited two hours and saw nothing.' What is the weakness of this as an argument?", "options": {"A": "It rests on one personal experience, which cannot show what happens generally.", "B": "It uses a linking word, and linking words weaken an argument.", "C": "It takes a position, which an argumentative essay should avoid.", "D": "It is too short to count as a proper sentence."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "A nineteenth century writer records: <i>In the morning it was a mirror; by evening it was a wall.</i><br>Which device shapes the sentence, and why does it work?", "options": {"A": "Simile, since the sea is compared to a mirror using 'like'.", "B": "Antithesis, since two opposite images are balanced against each other to show how completely the sea changed.", "C": "Alliteration, since the same consonant opens several words.", "D": "Understatement, since the change is made to sound smaller than it was."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type ich the company has gone.</p><p>I set this down because I do not expect to see it again, and because I would have the reader know that the creature came to us. We did not pursue it. It chose the boat.</p><p><b>TEXT B</b>: from guidance issued to licensed operators this year</p><p>Operators must not approach within 100 metres of a whale. Engines are to be set to neutral if an animal approaches a vessel of its own accord, and the vessel must not be manoeuvred in order to keep the animal alongside.</p><p>Records show that animals approach vessels in roughly one encounter in five. Passengers commonly describe this behaviour as friendly. It is more accurately described as investigative, and there is evidence that animals which repeatedly approach vessels feed less and rest less on the days when they do so.</p><p>The 100 metre rule therefore protects the animal and not the passenger. Operators found in breach of it will have their licence reviewed.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "The two texts describe the same behaviour for very different reasons. Which pair of purposes is right?", "options": {"A": "TEXT A sets out rules to be followed; TEXT B records a personal experience.", "B": "TEXT A records one man's experience for its own sake; TEXT B sets rules that operators are required to follow.", "C": "Both texts exist to attract visitors onto whale watching trips.", "D": "Both texts report the findings of a scientific study."}, "fig": "", "passage": "<strong>Two texts about whales that come to a boat</strong><br><p><b>TEXT A</b>: from a naturalist's essay published in 1861</p><p>We had been three hours at the oars when the first of them rose, not twenty yards from the boat. The water lay grey and flat, and the creature came up through it as quietly as a thought comes up through a still mind. Nobody in the boat spoke. The oarsman, who had seen a hundred, took off his cap.</p><p>They stayed with us the better part of an hour. It is the fashion to call such animals monsters. I can only report that they circled us with the gravity of hosts, and that when they left, the sea seemed a room from which the company has gone.</p><p>I set this down because I do not expect to see it again, and because I would have the reader know that the creature came to us. We did not pursue it. It chose the boat.</p><p><b>TEXT B</b>: from guidance issued to licensed operators this year</p><p>Operators must not approach within 100 metres of a whale. Engines are to be set to neutral if an animal approaches a vessel of its own accord, and the vessel must not be manoeuvred in order to keep the animal alongside.</p><p>Records show that animals approach vessels in roughly one encounter in five. Passengers commonly describe this behaviour as friendly. It is more accurately described as investigative, and there is evidence that animals which repeatedly approach vessels feed less and rest less on the days when they do so.</p><p>The 100 metre rule therefore protects the animal and not the passenger. Operators found in breach of it will have their licence reviewed.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Both texts state that the whales came to the boat. How does the MEANING each gives that fact differ?", "options": {"A": "TEXT A treats it as the animals choosing the boat; TEXT B treats it as investigation that costs the animal feeding and rest.", "B": "TEXT A treats it as costly investigation; TEXT B treats it as the animals choosing the boat.", "C": "Only TEXT A reports that the animals approach boats.", "D": "The two texts disagree about whether the approach happens at all."}, "fig": "", "passage": "<strong>Two texts about whales that come to a boat</strong><br><p><b>TEXT A</b>: from a naturalist's essay published in 1861</p><p>We had been three hours at the oars when the first of them rose, not twenty yards from the boat. The water lay grey and flat, and the creature came up through it as quietly as a thought comes up through a still mind. Nobody in the boat spoke. The oarsman, who had seen a hundred, took off his cap.</p><p>They stayed with us the better part of an hour. It is the fashion to call such animals monsters. I can only report that they circled us with the gravity of hosts, and that when they left, the sea seemed a room from which the company has gone.</p><p>I set this down because I do not expect to see it again, and because I would have the reader know that the creature came to us. We did not pursue it. It chose the boat.</p><p><b>TEXT B</b>: from guidance issued to licensed operators this year</p><p>Operators must not approach within 100 metres of a whale. Engines are to be set to neutral if an animal approaches a vessel of its own accord, and the vessel must not be manoeuvred in order to keep the animal alongside.</p><p>Records show that animals approach vessels in roughly one encounter in five. Passengers commonly describe this behaviour as friendly. It is more accurately described as investigative, and there is evidence that animals which repeatedly approach vessels feed less and rest less on the days when they do so.</p><p>The 100 metre rule therefore protects the animal and not the passenger. Operators found in breach of it will have their licence reviewed.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "TEXT A says that when the whales left, 'the sea seemed a room from which the company has gone'. What does the metaphor convey?", "options": {"A": "That the sea had turned dangerously rough.", "B": "That the boat was surrounded by other vessels.", "C": "That the writer was relieved to be alone again.", "D": "The sudden emptiness left behind, as in a room after guests have left."}, "fig": "", "passage": "<strong>Two texts about whales that come to a boat</strong><br><p><b>TEXT A</b>: from a naturalist's essay published in 1861</p><p>We had been three hours at the oars when the first of them rose, not twenty yards from the boat. The water lay grey and flat, and the creature came up through it as quietly as a thought comes up through a still mind. Nobody in the boat spoke. The oarsman, who had seen a hundred, took off his cap.</p><p>They stayed with us the better part of an hour. It is the fashion to call such animals monsters. I can only report that they circled us with the gravity of hosts, and that when they left, the sea seemed a room from which the company has gone.</p><p>I set this down because I do not expect to see it again, and because I would have the reader know that the creature came to us. We did not pursue it. It chose the boat.</p><p><b>TEXT B</b>: from guidance issued to licensed operators this year</p><p>Operators must not approach within 100 metres of a whale. Engines are to be set to neutral if an animal approaches a vessel of its own accord, and the vessel must not be manoeuvred in order to keep the animal alongside.</p><p>Records show that animals approach vessels in roughly one encounter in five. Passengers commonly describe this behaviour as friendly. It is more accurately described as investigative, and there is evidence that animals which repeatedly approach vessels feed less and rest less on the days when they do so.</p><p>The 100 metre rule therefore protects the animal and not the passenger. Operators found in breach of it will have their licence reviewed.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test all of the reading and the writing must be done inside one 80 minute English section, and the essay is typed on a keyboard. Choose ONE of the two tasks below and cover every part of it. At Stage 5 the text type is an ARGUMENTATIVE essay: a claim defended by reasoning and by evidence, with the best argument on the other side stated fairly and then answered. A personal example may illustrate a reason; it cannot replace one.", "label": "", "body": "", "hint": "Begin with a claim somebody could reasonably deny. Give each paragraph one point, and after each point show the reasoning or the evidence that supports it. Use linking words to signal the shape of the argument: 'first', 'moreover', 'admittedly', 'even so'. Spend a whole paragraph on the objection you find hardest, and answer it. Vary your sentences so that a short one lands where you want emphasis. Use a colon to introduce a list or an explanation and a semi-colon to join two related statements. Check your longer words for spelling before you stop.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "TASK 1\n'Wild animals should never be used to entertain people, however carefully it is done.' Argue for or against this claim. State your position, give two developed reasons, support at least one with evidence rather than with feeling, set out the strongest case against you, answer it, and say what would have to change for your answer to change.", "partB": "TASK 2\nA coastal town earns much of its income from wildlife tours, and a new study suggests the tours are harming the animals. Argue for what the town should do. Explain who is affected by your proposal, give the reasoning behind it, deal with the objection you consider strongest, and say what evidence would show whether your solution had worked."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 English Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
