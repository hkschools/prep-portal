<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 5 English Drill 5</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

<div class="wrap">

    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>

  <div class="card" id="card"></div>

</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "ENG-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "In which sentence has a semi-colon been used where a COLON is required?", "options": {"A": "The looms worked faster; the wages fell all the same.", "B": "The petition made one demand; that the looms be taxed.", "C": "The mill ran day and night; the town never quite slept.", "D": "Wages fell in the first year; they fell again in the second."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "You are writing a formal report and must say that a scheme failed. Which wording belongs in the report?", "options": {"A": "The scheme did not achieve its stated aims.", "B": "The scheme went belly up.", "C": "The scheme was a complete flop, to be honest.", "D": "The scheme was, sadly, no longer with us."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which word describes a change so gradual that nobody notices it while it is happening?", "options": {"A": "Abrupt", "B": "Reversible", "C": "Conspicuous", "D": "Imperceptible"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which of these four spellings of the word for upkeep is correct?<br>The engines required constant ____.", "options": {"A": "maintainance", "B": "maintenence", "C": "maintenance", "D": "maintanence"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "A new paragraph has to signal that the essay is turning to the opposite side of the argument. Which opening does that?", "options": {"A": "In the same way, it can be argued that ...", "B": "As a result, it can be argued that ...", "C": "For example, it can be argued that ...", "D": "Against this, it can be argued that ..."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "An American address of 1863 closes with the words 'of the people, by the people, for the people'. What does the three part repetition achieve?", "options": {"A": "It presses one idea from three angles and gives the ending a balance that sounds final.", "B": "It names three separate groups who hold power in turn.", "C": "It shows the speaker could not decide which phrase to use.", "D": "It softens the claim by qualifying it three times over."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which sentence REBUTS an opposing argument rather than merely restating or dismissing it?", "options": {"A": "Supporters say the machines create new work, and that is indeed what supporters say.", "B": "Supporters say the machines create new work, but the new work has appeared in different towns from the work that was lost.", "C": "Supporters say the machines create new work, which is obviously wrong.", "D": "Supporters say the machines create new work, and I disagree very strongly."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "A weaver writes in 1834: <i>The loom does not eat, and it does not have children.</i><br>What is he conveying by putting it so flatly?", "options": {"A": "That the machine is better at producing cloth than a weaver is.", "B": "That the mill owners ought to provide food for their workers.", "C": "That the machine can be cheaper than a worker only because it has no family to keep.", "D": "That machines will one day be treated as though they were people."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which sentence uses 'fewer' for what is counted and 'less' for what is measured?", "options": {"A": "Less looms were idle, so there was fewer waste.", "B": "Fewer looms were idle, so there was less waste.", "C": "Fewer looms were idle, so there was fewer waste.", "D": "Less looms were idle, so there was less waste."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "A report needs the most precise word for wages that stay where they are while prices climb. Which is it?", "options": {"A": "Plummeting", "B": "Volatile", "C": "Generous", "D": "Stagnant"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What are the weavers in TEXT A actually asking Parliament for?", "options": {"A": "The banning of the new looms altogether.", "B": "Charity payments for weavers who are out of work.", "C": "Time, so that the change comes more slowly, rather than money or the removal of the machines.", "D": "Higher prices for the cloth they weave by hand."}, "fig": "", "passage": "<strong>Two texts about machines and the work they replace</strong><br><p><b>TEXT A</b>: from a petition sent to Parliament by hand loom weavers in 1834</p><p>We do not petition against the machine. We petition against the speed at which it has been brought among us. A trade that took a man seven years to learn has been undone in eleven months, and the men who learned it are not eleven months younger for that.</p><p>It is said that the new looms make more cloth in a day than we made in a week. We do not deny it. We ask your honourable House to consider what is to become of the week, and of the hands that filled it.</p><p>We ask for no charity. We ask for time.</p><p><b>TEXT B</b>: from a student's argumentative essay written this year</p><p>Every wave of automation raises output and displaces workers, and the two facts are usually reported as though only one of them were true. The power loom did both. So does the software now taking over routine office work.</p><p>The standard reply is that new jobs always appear in the end. Historically that reply is correct, and it is worth saying so plainly. But it answers a question about the economy and not the question people are actually asking, which is what becomes of a particular person in a particular town during the twenty years in between.</p><p>My claim is therefore a narrow one. Automation should not be slowed, but the transition should be paid for, because the gains land in one place and the losses in another. A country able to measure the gain can afford to measure the loss.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What does the writer of TEXT B do with the argument that new jobs always appear in the end?", "options": {"A": "He grants that it is historically correct, then shows that it answers a different question.", "B": "He rejects the argument as historically untrue.", "C": "He passes over the argument without addressing it.", "D": "He adopts the argument as his own main claim."}, "fig": "", "passage": "<strong>Two texts about machines and the work they replace</strong><br><p><b>TEXT A</b>: from a petition sent to Parliament by hand loom weavers in 1834</p><p>We do not petition against the machine. We petition against the speed at which it has been brought among us. A trade that took a man seven years to learn has been undone in eleven months, and the men who learned it are not eleven months younger for that.</p><p>It is said that the new looms make more cloth in a day than we made in a week. We do not deny it. We ask your honourable House to consider what is to become of the week, and of the hands that filled it.</p><p>We ask for no charity. We ask for time.</p><p><b>TEXT B</b>: from a student's argumentative essay written this year</p><p>Every wave of automation raises output and displaces workers, and the two facts are usually reported as though only one of them were true. The power loom did both. So does the software now taking over routine office work.</p><p>The standard reply is that new jobs always appear in the end. Historically that reply is correct, and it is worth saying so plainly. But it answers a question about the economy and not the question people are actually asking, which is what becomes of a particular person in a particular town during the twenty years in between.</p><p>My claim is therefore a narrow one. Automation should not be slowed, but the transition should be paid for, because the gains land in one place and the losses in another. A country able to measure the gain can afford to measure the loss.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "How do the two texts differ in the WAY they put their case?", "options": {"A": "TEXT A marks out the limits of its claim; TEXT B appeals to fairness in formal phrases.", "B": "Both texts demand that the machines be removed.", "C": "Both texts are written by economists reporting research.", "D": "TEXT A appeals to fairness in balanced, formal phrases; TEXT B states a claim and then marks out its limits in plain modern prose."}, "fig": "", "passage": "<strong>Two texts about machines and the work they replace</strong><br><p><b>TEXT A</b>: from a petition sent to Parliament by hand loom weavers in 1834</p><p>We do not petition against the machine. We petition against the speed at which it has been brought among us. A trade that took a man seven years to learn has been undone in eleven months, and the men who learned it are not eleven months younger for that.</p><p>It is said that the new looms make more cloth in a day than we made in a week. We do not deny it. We ask your honourable House to consider what is to become of the week, and of the hands that filled it.</p><p>We ask for no charity. We ask for time.</p><p><b>TEXT B</b>: from a student's argumentative essay written this year</p><p>Every wave of automation raises output and displaces workers, and the two facts are usually reported as though only one of them were true. The power loom did both. So does the software now taking over routine office work.</p><p>The standard reply is that new jobs always appear in the end. Historically that reply is correct, and it is worth saying so plainly. But it answers a question about the economy and not the question people are actually asking, which is what becomes of a particular person in a particular town during the twenty years in between.</p><p>My claim is therefore a narrow one. Automation should not be slowed, but the transition should be paid for, because the gains land in one place and the losses in another. A country able to measure the gain can afford to measure the loss.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Both texts accept that the machines raise output. What does each build on that admission?", "options": {"A": "TEXT A concedes it and turns at once to what becomes of the workers; TEXT B sets it beside displacement as two facts usually kept apart.", "B": "TEXT A sets it beside displacement as two facts kept apart; TEXT B concedes it and turns to the workers.", "C": "Only TEXT B accepts that output rises.", "D": "The two texts disagree about whether output rises at all."}, "fig": "", "passage": "<strong>Two texts about machines and the work they replace</strong><br><p><b>TEXT A</b>: from a petition sent to Parliament by hand loom weavers in 1834</p><p>We do not petition against the machine. We petition against the speed at which it has been brought among us. A trade that took a man seven years to learn has been undone in eleven months, and the men who learned it are not eleven months younger for that.</p><p>It is said that the new looms make more cloth in a day than we made in a week. We do not deny it. We ask your honourable House to consider what is to become of the week, and of the hands that filled it.</p><p>We ask for no charity. We ask for time.</p><p><b>TEXT B</b>: from a student's argumentative essay written this year</p><p>Every wave of automation raises output and displaces workers, and the two facts are usually reported as though only one of them were true. The power loom did both. So does the software now taking over routine office work.</p><p>The standard reply is that new jobs always appear in the end. Historically that reply is correct, and it is worth saying so plainly. But it answers a question about the economy and not the question people are actually asking, which is what becomes of a particular person in a particular town during the twenty years in between.</p><p>My claim is therefore a narrow one. Automation should not be slowed, but the transition should be paid for, because the gains land in one place and the losses in another. A country able to measure the gain can afford to measure the loss.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "TEXT A closes: 'We ask for no charity. We ask for time.' What does the matched pair achieve?", "options": {"A": "It shows that the petitioners could not agree on one request.", "B": "It suggests that the petitioners expect to be refused.", "C": "The repeated shape sets what they refuse against what they want, so the request sounds dignified and exact.", "D": "It softens the request by making it twice as long."}, "fig": "", "passage": "<strong>Two texts about machines and the work they replace</strong><br><p><b>TEXT A</b>: from a petition sent to Parliament by hand loom weavers in 1834</p><p>We do not petition against the machine. We petition against the speed at which it has been brought among us. A trade that took a man seven years to learn has been undone in eleven months, and the men who learned it are not eleven months younger for that.</p><p>It is said that the new looms make more cloth in a day than we made in a week. We do not deny it. We ask your honourable House to consider what is to become of the week, and of the hands that filled it.</p><p>We ask for no charity. We ask for time.</p><p><b>TEXT B</b>: from a student's argumentative essay written this year</p><p>Every wave of automation raises output and displaces workers, and the two facts are usually reported as though only one of them were true. The power loom did both. So does the software now taking over routine office work.</p><p>The standard reply is that new jobs always appear in the end. Historically that reply is correct, and it is worth saying so plainly. But it answers a question about the economy and not the question people are actually asking, which is what becomes of a particular person in a particular town during the twenty years in between.</p><p>My claim is therefore a narrow one. Automation should not be slowed, but the transition should be paid for, because the gains land in one place and the losses in another. A country able to measure the gain can afford to measure the loss.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "The real test gives 80 minutes to the whole English section, reading and writing together, and the essay is typed on a keyboard. Choose ONE of the two tasks below and answer each of its parts. At Stage 5 the text type is an ARGUMENTATIVE essay: you defend a claim with reasoning and evidence and you answer the best argument against you. Experience of your own can illustrate a reason but cannot serve as the proof of it.", "label": "", "body": "", "hint": "State a claim that could be denied, and say how far it extends. Give each paragraph one point with the reasoning or evidence behind it, and link the paragraphs so the reader can feel the argument turning: 'moreover', 'against this', 'even so', 'therefore'. Concede what is true in the opposing case before you answer it. Vary your sentence types, and keep one short sentence for the point you most want remembered. Use a colon to introduce an explanation or a list and a semi-colon to join two statements that could each stand alone. Read your work back for spelling.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": "TASK 1\n'When a new technology destroys jobs, the people who gain from it should pay for the people who lose.' Argue for or against this claim. State your position, defend it with two developed reasons, use one example from history or from current affairs rather than from your own life, answer the strongest objection to your view, and state the limits of what you are claiming.\n\nTASK 2\nA government must choose between slowing the introduction of a new technology and letting it arrive at full speed while retraining those it displaces. Argue for one of the two. Explain who benefits and who pays under your choice, give the reasoning that decides it, make the best case you can for the other course, answer it, and say what result would show that you had been wrong."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 English Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
