const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "CHI-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Chinese", "body": "閱讀下面的短文，然後回答問題。全部題目為選擇題，限時十五分鐘。"}, {"n": "2", "type": "mcq", "section": "Chinese", "stem": "作者對廣泛涉獵與一門深入的看法是甚麼？<br><i>作者对广泛涉猎与一门深入的看法是甚么？</i>", "options": {"A": "中學生應該集中精力，只做一件事<br><i>中学生应该集中精力，只做一件事</i>", "B": "中學生應該樣樣都試，不必勉強堅持<br><i>中学生应该样样都试，不必勉强坚持</i>", "C": "兩者不必對立，應多方嘗試，同時至少有一門下過苦功<br><i>两者不必对立，应多方尝试，同时至少有一门下过苦功</i>", "D": "應由老師替學生決定專攻哪一項<br><i>应由老师替学生决定专攻哪一项</i>"}, "fig": "", "passage": "<strong>廣與深之間<br><i>广与深之间</i></strong><br><p>繁體<br>每年九月的課外活動博覽，總會看見兩種同學。一種手上拿着七八張報名表，由天文學會排到劍擊隊，樣樣都想試；另一種走過長廊，只在同一個攤位前停下，那是他由中一練到中五的地方。老師和家長各有偏愛：有人讚前者眼界開闊，也有人說後者才叫下過真功夫。在我看來，廣泛涉獵與一門深入本來就不必對立，只是先後有別。中學這幾年，應該盡量多試，同時至少要有一門，是自己實實在在下過苦功的。先說為甚麼要多試。興趣很少是想出來的，多半是碰出來的。沒有走進實驗室，不會知道自己原來喜歡把儀器一件一件擺好；沒有參加過一場辯論比賽，也未必發現自己真正着迷的並非說話，而是賽前翻查資料、把一堆散亂材料整理成論點的那幾個晚上。試得夠多，選擇才有根據；否則所謂志向，不過是把別人的說法抄了一遍。然而只有廣度也不成。一樣接一樣地試，每樣試三個月就換，到頭來只是淺嘗輒止。任何一件事，最有趣的部分往往不在開頭。學琴的人都知道，第一年最好玩，曲子短，進步看得見；第二年開始枯燥，天天練音階；要到第三年，才聽得出同一首曲子彈得好與彈得妥當之間的分別。只有熬過那段枯燥的日子，才聽得出這一點分別。三分鐘的熱度人人都有，三年的耐性卻不是人人都有。有人主張及早專精，說十二歲就該定下方向，才有機會拔尖。這種說法把成長看成一場起跑比賽，把太早收窄的路說成優勢。難道十二歲就一定看得清楚自己往後四十年要做甚麼嗎？路收得太早，一旦發現選錯，要付的代價反而更大。荀子說：「不積跬步，無以至千里。」半步半步地走，看似很慢，卻是唯一走得到的方法。廣是為了找到那一門，深是為了證明自己走得下去。試過，才知道自己喜歡甚麼；堅持過，才知道自己做得到甚麼；把一件事做成過，才知道自己還可以走多遠。何況一門功夫下得深了，往往能夠觸類旁通：練琴時學會的拆解與重複，搬到讀書、做研究上面，一樣管用。</p><p>簡体<br>每年九月的课外活动博览，总会看见两种同学。一种手上拿着七八张报名表，由天文学会排到剑击队，样样都想试；另一种走过长廊，只在同一个摊位前停下，那是他由中一练到中五的地方。老师和家长各有偏爱：有人赞前者眼界开阔，也有人说后者才叫下过真功夫。在我看来，广泛涉猎与一门深入本来就不必对立，只是先后有别。中学这几年，应该尽量多试，同时至少要有一门，是自己实实在在下过苦功的。先说为甚么要多试。兴趣很少是想出来的，多半是碰出来的。没有走进实验室，不会知道自己原来喜欢把仪器一件一件摆好；没有参加过一场辩论比赛，也未必发现自己真正着迷的并非说话，而是赛前翻查资料、把一堆散乱材料整理成论点的那几个晚上。试得够多，选择才有根据；否则所谓志向，不过是把别人的说法抄了一遍。然而只有广度也不成。一样接一样地试，每样试三个月就换，到头来只是浅尝辄止。任何一件事，最有趣的部分往往不在开头。学琴的人都知道，第一年最好玩，曲子短，进步看得见；第二年开始枯燥，天天练音阶；要到第三年，才听得出同一首曲子弹得好与弹得妥当之间的分别。只有熬过那段枯燥的日子，才听得出这一点分别。三分钟的热度人人都有，三年的耐性却不是人人都有。有人主张及早专精，说十二岁就该定下方向，才有机会拔尖。这种说法把成长看成一场起跑比赛，把太早收窄的路说成优势。难道十二岁就一定看得清楚自己往后四十年要做甚么吗？路收得太早，一旦发现选错，要付的代价反而更大。荀子说：「不积跬步，无以至千里。」半步半步地走，看似很慢，却是唯一走得到的方法。广是为了找到那一门，深是为了证明自己走得下去。试过，才知道自己喜欢甚么；坚持过，才知道自己做得到甚么；把一件事做成过，才知道自己还可以走多远。何况一门功夫下得深了，往往能够触类旁通：练琴时学会的拆解与重复，搬到读书、做研究上面，一样管用。</p>", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Chinese", "stem": "作者為甚麼認為中學階段要多方嘗試？<br><i>作者为甚么认为中学阶段要多方尝试？</i>", "options": {"A": "因為學校規定要參加一定數目的活動<br><i>因为学校规定要参加一定数目的活动</i>", "B": "因為興趣多半是碰出來的，試得夠多，選擇才有根據<br><i>因为兴趣多半是碰出来的，试得够多，选择才有根据</i>", "C": "因為報讀大學時活動紀錄愈多愈有利<br><i>因为报读大学时活动纪录愈多愈有利</i>", "D": "因為同學之間需要互相比較<br><i>因为同学之间需要互相比较</i>"}, "fig": "", "passage": "<strong>廣與深之間<br><i>广与深之间</i></strong><br><p>繁體<br>每年九月的課外活動博覽，總會看見兩種同學。一種手上拿着七八張報名表，由天文學會排到劍擊隊，樣樣都想試；另一種走過長廊，只在同一個攤位前停下，那是他由中一練到中五的地方。老師和家長各有偏愛：有人讚前者眼界開闊，也有人說後者才叫下過真功夫。在我看來，廣泛涉獵與一門深入本來就不必對立，只是先後有別。中學這幾年，應該盡量多試，同時至少要有一門，是自己實實在在下過苦功的。先說為甚麼要多試。興趣很少是想出來的，多半是碰出來的。沒有走進實驗室，不會知道自己原來喜歡把儀器一件一件擺好；沒有參加過一場辯論比賽，也未必發現自己真正着迷的並非說話，而是賽前翻查資料、把一堆散亂材料整理成論點的那幾個晚上。試得夠多，選擇才有根據；否則所謂志向，不過是把別人的說法抄了一遍。然而只有廣度也不成。一樣接一樣地試，每樣試三個月就換，到頭來只是淺嘗輒止。任何一件事，最有趣的部分往往不在開頭。學琴的人都知道，第一年最好玩，曲子短，進步看得見；第二年開始枯燥，天天練音階；要到第三年，才聽得出同一首曲子彈得好與彈得妥當之間的分別。只有熬過那段枯燥的日子，才聽得出這一點分別。三分鐘的熱度人人都有，三年的耐性卻不是人人都有。有人主張及早專精，說十二歲就該定下方向，才有機會拔尖。這種說法把成長看成一場起跑比賽，把太早收窄的路說成優勢。難道十二歲就一定看得清楚自己往後四十年要做甚麼嗎？路收得太早，一旦發現選錯，要付的代價反而更大。荀子說：「不積跬步，無以至千里。」半步半步地走，看似很慢，卻是唯一走得到的方法。廣是為了找到那一門，深是為了證明自己走得下去。試過，才知道自己喜歡甚麼；堅持過，才知道自己做得到甚麼；把一件事做成過，才知道自己還可以走多遠。何況一門功夫下得深了，往往能夠觸類旁通：練琴時學會的拆解與重複，搬到讀書、做研究上面，一樣管用。</p><p>簡体<br>每年九月的课外活动博览，总会看见两种同学。一种手上拿着七八张报名表，由天文学会排到剑击队，样样都想试；另一种走过长廊，只在同一个摊位前停下，那是他由中一练到中五的地方。老师和家长各有偏爱：有人赞前者眼界开阔，也有人说后者才叫下过真功夫。在我看来，广泛涉猎与一门深入本来就不必对立，只是先后有别。中学这几年，应该尽量多试，同时至少要有一门，是自己实实在在下过苦功的。先说为甚么要多试。兴趣很少是想出来的，多半是碰出来的。没有走进实验室，不会知道自己原来喜欢把仪器一件一件摆好；没有参加过一场辩论比赛，也未必发现自己真正着迷的并非说话，而是赛前翻查资料、把一堆散乱材料整理成论点的那几个晚上。试得够多，选择才有根据；否则所谓志向，不过是把别人的说法抄了一遍。然而只有广度也不成。一样接一样地试，每样试三个月就换，到头来只是浅尝辄止。任何一件事，最有趣的部分往往不在开头。学琴的人都知道，第一年最好玩，曲子短，进步看得见；第二年开始枯燥，天天练音阶；要到第三年，才听得出同一首曲子弹得好与弹得妥当之间的分别。只有熬过那段枯燥的日子，才听得出这一点分别。三分钟的热度人人都有，三年的耐性却不是人人都有。有人主张及早专精，说十二岁就该定下方向，才有机会拔尖。这种说法把成长看成一场起跑比赛，把太早收窄的路说成优势。难道十二岁就一定看得清楚自己往后四十年要做甚么吗？路收得太早，一旦发现选错，要付的代价反而更大。荀子说：「不积跬步，无以至千里。」半步半步地走，看似很慢，却是唯一走得到的方法。广是为了找到那一门，深是为了证明自己走得下去。试过，才知道自己喜欢甚么；坚持过，才知道自己做得到甚么；把一件事做成过，才知道自己还可以走多远。何况一门功夫下得深了，往往能够触类旁通：练琴时学会的拆解与重复，搬到读书、做研究上面，一样管用。</p>", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Chinese", "stem": "作者舉學琴頭三年的經過，用意是甚麼？<br><i>作者举学琴头三年的经过，用意是甚么？</i>", "options": {"A": "說明學琴比其他活動更值得堅持<br><i>说明学琴比其他活动更值得坚持</i>", "B": "說明初學者應該先練音階<br><i>说明初学者应该先练音阶</i>", "C": "說明教琴的方法有待改良<br><i>说明教琴的方法有待改良</i>", "D": "說明最有趣的部分要熬過枯燥期之後才出現<br><i>说明最有趣的部分要熬过枯燥期之后才出现</i>"}, "fig": "", "passage": "<strong>廣與深之間<br><i>广与深之间</i></strong><br><p>繁體<br>每年九月的課外活動博覽，總會看見兩種同學。一種手上拿着七八張報名表，由天文學會排到劍擊隊，樣樣都想試；另一種走過長廊，只在同一個攤位前停下，那是他由中一練到中五的地方。老師和家長各有偏愛：有人讚前者眼界開闊，也有人說後者才叫下過真功夫。在我看來，廣泛涉獵與一門深入本來就不必對立，只是先後有別。中學這幾年，應該盡量多試，同時至少要有一門，是自己實實在在下過苦功的。先說為甚麼要多試。興趣很少是想出來的，多半是碰出來的。沒有走進實驗室，不會知道自己原來喜歡把儀器一件一件擺好；沒有參加過一場辯論比賽，也未必發現自己真正着迷的並非說話，而是賽前翻查資料、把一堆散亂材料整理成論點的那幾個晚上。試得夠多，選擇才有根據；否則所謂志向，不過是把別人的說法抄了一遍。然而只有廣度也不成。一樣接一樣地試，每樣試三個月就換，到頭來只是淺嘗輒止。任何一件事，最有趣的部分往往不在開頭。學琴的人都知道，第一年最好玩，曲子短，進步看得見；第二年開始枯燥，天天練音階；要到第三年，才聽得出同一首曲子彈得好與彈得妥當之間的分別。只有熬過那段枯燥的日子，才聽得出這一點分別。三分鐘的熱度人人都有，三年的耐性卻不是人人都有。有人主張及早專精，說十二歲就該定下方向，才有機會拔尖。這種說法把成長看成一場起跑比賽，把太早收窄的路說成優勢。難道十二歲就一定看得清楚自己往後四十年要做甚麼嗎？路收得太早，一旦發現選錯，要付的代價反而更大。荀子說：「不積跬步，無以至千里。」半步半步地走，看似很慢，卻是唯一走得到的方法。廣是為了找到那一門，深是為了證明自己走得下去。試過，才知道自己喜歡甚麼；堅持過，才知道自己做得到甚麼；把一件事做成過，才知道自己還可以走多遠。何況一門功夫下得深了，往往能夠觸類旁通：練琴時學會的拆解與重複，搬到讀書、做研究上面，一樣管用。</p><p>簡体<br>每年九月的课外活动博览，总会看见两种同学。一种手上拿着七八张报名表，由天文学会排到剑击队，样样都想试；另一种走过长廊，只在同一个摊位前停下，那是他由中一练到中五的地方。老师和家长各有偏爱：有人赞前者眼界开阔，也有人说后者才叫下过真功夫。在我看来，广泛涉猎与一门深入本来就不必对立，只是先后有别。中学这几年，应该尽量多试，同时至少要有一门，是自己实实在在下过苦功的。先说为甚么要多试。兴趣很少是想出来的，多半是碰出来的。没有走进实验室，不会知道自己原来喜欢把仪器一件一件摆好；没有参加过一场辩论比赛，也未必发现自己真正着迷的并非说话，而是赛前翻查资料、把一堆散乱材料整理成论点的那几个晚上。试得够多，选择才有根据；否则所谓志向，不过是把别人的说法抄了一遍。然而只有广度也不成。一样接一样地试，每样试三个月就换，到头来只是浅尝辄止。任何一件事，最有趣的部分往往不在开头。学琴的人都知道，第一年最好玩，曲子短，进步看得见；第二年开始枯燥，天天练音阶；要到第三年，才听得出同一首曲子弹得好与弹得妥当之间的分别。只有熬过那段枯燥的日子，才听得出这一点分别。三分钟的热度人人都有，三年的耐性却不是人人都有。有人主张及早专精，说十二岁就该定下方向，才有机会拔尖。这种说法把成长看成一场起跑比赛，把太早收窄的路说成优势。难道十二岁就一定看得清楚自己往后四十年要做甚么吗？路收得太早，一旦发现选错，要付的代价反而更大。荀子说：「不积跬步，无以至千里。」半步半步地走，看似很慢，却是唯一走得到的方法。广是为了找到那一门，深是为了证明自己走得下去。试过，才知道自己喜欢甚么；坚持过，才知道自己做得到甚么；把一件事做成过，才知道自己还可以走多远。何况一门功夫下得深了，往往能够触类旁通：练琴时学会的拆解与重复，搬到读书、做研究上面，一样管用。</p>", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Chinese", "stem": "對於「及早專精、十二歲就該定下方向」的主張，作者的態度是甚麼？<br><i>对于「及早专精、十二岁就该定下方向」的主张，作者的态度是甚么？</i>", "options": {"A": "不贊成，認為路收得太早，選錯的代價更大<br><i>不赞成，认为路收得太早，选错的代价更大</i>", "B": "完全贊成，認為愈早開始愈有優勢<br><i>完全赞成，认为愈早开始愈有优势</i>", "C": "認為要看家庭的經濟條件而定<br><i>认为要看家庭的经济条件而定</i>", "D": "認為只適用於體育項目<br><i>认为只适用于体育项目</i>"}, "fig": "", "passage": "<strong>廣與深之間<br><i>广与深之间</i></strong><br><p>繁體<br>每年九月的課外活動博覽，總會看見兩種同學。一種手上拿着七八張報名表，由天文學會排到劍擊隊，樣樣都想試；另一種走過長廊，只在同一個攤位前停下，那是他由中一練到中五的地方。老師和家長各有偏愛：有人讚前者眼界開闊，也有人說後者才叫下過真功夫。在我看來，廣泛涉獵與一門深入本來就不必對立，只是先後有別。中學這幾年，應該盡量多試，同時至少要有一門，是自己實實在在下過苦功的。先說為甚麼要多試。興趣很少是想出來的，多半是碰出來的。沒有走進實驗室，不會知道自己原來喜歡把儀器一件一件擺好；沒有參加過一場辯論比賽，也未必發現自己真正着迷的並非說話，而是賽前翻查資料、把一堆散亂材料整理成論點的那幾個晚上。試得夠多，選擇才有根據；否則所謂志向，不過是把別人的說法抄了一遍。然而只有廣度也不成。一樣接一樣地試，每樣試三個月就換，到頭來只是淺嘗輒止。任何一件事，最有趣的部分往往不在開頭。學琴的人都知道，第一年最好玩，曲子短，進步看得見；第二年開始枯燥，天天練音階；要到第三年，才聽得出同一首曲子彈得好與彈得妥當之間的分別。只有熬過那段枯燥的日子，才聽得出這一點分別。三分鐘的熱度人人都有，三年的耐性卻不是人人都有。有人主張及早專精，說十二歲就該定下方向，才有機會拔尖。這種說法把成長看成一場起跑比賽，把太早收窄的路說成優勢。難道十二歲就一定看得清楚自己往後四十年要做甚麼嗎？路收得太早，一旦發現選錯，要付的代價反而更大。荀子說：「不積跬步，無以至千里。」半步半步地走，看似很慢，卻是唯一走得到的方法。廣是為了找到那一門，深是為了證明自己走得下去。試過，才知道自己喜歡甚麼；堅持過，才知道自己做得到甚麼；把一件事做成過，才知道自己還可以走多遠。何況一門功夫下得深了，往往能夠觸類旁通：練琴時學會的拆解與重複，搬到讀書、做研究上面，一樣管用。</p><p>簡体<br>每年九月的课外活动博览，总会看见两种同学。一种手上拿着七八张报名表，由天文学会排到剑击队，样样都想试；另一种走过长廊，只在同一个摊位前停下，那是他由中一练到中五的地方。老师和家长各有偏爱：有人赞前者眼界开阔，也有人说后者才叫下过真功夫。在我看来，广泛涉猎与一门深入本来就不必对立，只是先后有别。中学这几年，应该尽量多试，同时至少要有一门，是自己实实在在下过苦功的。先说为甚么要多试。兴趣很少是想出来的，多半是碰出来的。没有走进实验室，不会知道自己原来喜欢把仪器一件一件摆好；没有参加过一场辩论比赛，也未必发现自己真正着迷的并非说话，而是赛前翻查资料、把一堆散乱材料整理成论点的那几个晚上。试得够多，选择才有根据；否则所谓志向，不过是把别人的说法抄了一遍。然而只有广度也不成。一样接一样地试，每样试三个月就换，到头来只是浅尝辄止。任何一件事，最有趣的部分往往不在开头。学琴的人都知道，第一年最好玩，曲子短，进步看得见；第二年开始枯燥，天天练音阶；要到第三年，才听得出同一首曲子弹得好与弹得妥当之间的分别。只有熬过那段枯燥的日子，才听得出这一点分别。三分钟的热度人人都有，三年的耐性却不是人人都有。有人主张及早专精，说十二岁就该定下方向，才有机会拔尖。这种说法把成长看成一场起跑比赛，把太早收窄的路说成优势。难道十二岁就一定看得清楚自己往后四十年要做甚么吗？路收得太早，一旦发现选错，要付的代价反而更大。荀子说：「不积跬步，无以至千里。」半步半步地走，看似很慢，却是唯一走得到的方法。广是为了找到那一门，深是为了证明自己走得下去。试过，才知道自己喜欢甚么；坚持过，才知道自己做得到甚么；把一件事做成过，才知道自己还可以走多远。何况一门功夫下得深了，往往能够触类旁通：练琴时学会的拆解与重复，搬到读书、做研究上面，一样管用。</p>", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Chinese", "stem": "作者在末段歸結出怎樣的看法？<br><i>作者在末段归结出怎样的看法？</i>", "options": {"A": "先深後廣，才是最穩妥的次序<br><i>先深后广，才是最稳妥的次序</i>", "B": "興趣應該交由測驗與評估決定<br><i>兴趣应该交由测验与评估决定</i>", "C": "廣是為了找到那一門，深是為了證明自己走得下去<br><i>广是为了找到那一门，深是为了证明自己走得下去</i>", "D": "課外活動應該減少，好讓學生專心讀書<br><i>课外活动应该减少，好让学生专心读书</i>"}, "fig": "", "passage": "<strong>廣與深之間<br><i>广与深之间</i></strong><br><p>繁體<br>每年九月的課外活動博覽，總會看見兩種同學。一種手上拿着七八張報名表，由天文學會排到劍擊隊，樣樣都想試；另一種走過長廊，只在同一個攤位前停下，那是他由中一練到中五的地方。老師和家長各有偏愛：有人讚前者眼界開闊，也有人說後者才叫下過真功夫。在我看來，廣泛涉獵與一門深入本來就不必對立，只是先後有別。中學這幾年，應該盡量多試，同時至少要有一門，是自己實實在在下過苦功的。先說為甚麼要多試。興趣很少是想出來的，多半是碰出來的。沒有走進實驗室，不會知道自己原來喜歡把儀器一件一件擺好；沒有參加過一場辯論比賽，也未必發現自己真正着迷的並非說話，而是賽前翻查資料、把一堆散亂材料整理成論點的那幾個晚上。試得夠多，選擇才有根據；否則所謂志向，不過是把別人的說法抄了一遍。然而只有廣度也不成。一樣接一樣地試，每樣試三個月就換，到頭來只是淺嘗輒止。任何一件事，最有趣的部分往往不在開頭。學琴的人都知道，第一年最好玩，曲子短，進步看得見；第二年開始枯燥，天天練音階；要到第三年，才聽得出同一首曲子彈得好與彈得妥當之間的分別。只有熬過那段枯燥的日子，才聽得出這一點分別。三分鐘的熱度人人都有，三年的耐性卻不是人人都有。有人主張及早專精，說十二歲就該定下方向，才有機會拔尖。這種說法把成長看成一場起跑比賽，把太早收窄的路說成優勢。難道十二歲就一定看得清楚自己往後四十年要做甚麼嗎？路收得太早，一旦發現選錯，要付的代價反而更大。荀子說：「不積跬步，無以至千里。」半步半步地走，看似很慢，卻是唯一走得到的方法。廣是為了找到那一門，深是為了證明自己走得下去。試過，才知道自己喜歡甚麼；堅持過，才知道自己做得到甚麼；把一件事做成過，才知道自己還可以走多遠。何況一門功夫下得深了，往往能夠觸類旁通：練琴時學會的拆解與重複，搬到讀書、做研究上面，一樣管用。</p><p>簡体<br>每年九月的课外活动博览，总会看见两种同学。一种手上拿着七八张报名表，由天文学会排到剑击队，样样都想试；另一种走过长廊，只在同一个摊位前停下，那是他由中一练到中五的地方。老师和家长各有偏爱：有人赞前者眼界开阔，也有人说后者才叫下过真功夫。在我看来，广泛涉猎与一门深入本来就不必对立，只是先后有别。中学这几年，应该尽量多试，同时至少要有一门，是自己实实在在下过苦功的。先说为甚么要多试。兴趣很少是想出来的，多半是碰出来的。没有走进实验室，不会知道自己原来喜欢把仪器一件一件摆好；没有参加过一场辩论比赛，也未必发现自己真正着迷的并非说话，而是赛前翻查资料、把一堆散乱材料整理成论点的那几个晚上。试得够多，选择才有根据；否则所谓志向，不过是把别人的说法抄了一遍。然而只有广度也不成。一样接一样地试，每样试三个月就换，到头来只是浅尝辄止。任何一件事，最有趣的部分往往不在开头。学琴的人都知道，第一年最好玩，曲子短，进步看得见；第二年开始枯燥，天天练音阶；要到第三年，才听得出同一首曲子弹得好与弹得妥当之间的分别。只有熬过那段枯燥的日子，才听得出这一点分别。三分钟的热度人人都有，三年的耐性却不是人人都有。有人主张及早专精，说十二岁就该定下方向，才有机会拔尖。这种说法把成长看成一场起跑比赛，把太早收窄的路说成优势。难道十二岁就一定看得清楚自己往后四十年要做甚么吗？路收得太早，一旦发现选错，要付的代价反而更大。荀子说：「不积跬步，无以至千里。」半步半步地走，看似很慢，却是唯一走得到的方法。广是为了找到那一门，深是为了证明自己走得下去。试过，才知道自己喜欢甚么；坚持过，才知道自己做得到甚么；把一件事做成过，才知道自己还可以走多远。何况一门功夫下得深了，往往能够触类旁通：练琴时学会的拆解与重复，搬到读书、做研究上面，一样管用。</p>", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Chinese", "stem": "「廣泛涉獵與一門深入本來就不必對立」一句中的「涉獵」，指的是甚麼？<br><i>「广泛涉猎与一门深入本来就不必对立」一 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 Chinese Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
