const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "CHI-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Chinese", "body": "閱讀下面的短文，然後回答問題。全部題目為選擇題，限時十五分鐘。"}, {"n": "2", "type": "mcq", "section": "Chinese", "stem": "作者對學生使用人工智能寫作的基本立場是甚麼？<br><i>作者对学生使用人工智能写作的基本立场是甚么？</i>", "options": {"A": "應該全面禁止，一經發現就要處分<br><i>应该全面禁止，一经发现就要处分</i>", "B": "可以用來輔助，但結論必須由自己想出來<br><i>可以用来辅助，但结论必须由自己想出来</i>", "C": "只要文句通順，用甚麼方法完成都可以<br><i>只要文句通顺，用甚么方法完成都可以</i>", "D": "應由學校統一提供工具，再要求全班使用<br><i>应由学校统一提供工具，再要求全班使用</i>"}, "fig": "", "passage": "<strong>當機器替我們動筆<br><i>当机器替我们动笔</i></strong><br><p>繁體<br>這一兩年，老師之間流傳着一個新的難題：收回來的作文，文句忽然變得十分整齊，起承轉合一應俱全，讀下去卻總覺得少了點甚麼。問起來，同學多半答得坦白，說只是用人工智能替自己潤色，並非整篇由機器代寫。工具固然有用，我也不主張把它一概封殺；但我認為這裏有一條界線：交上去的文章，可以借工具修飾，卻必須先經過自己的腦袋。先說寫作這回事本身。一篇文章的價值，不只在於交出來的那幾百字，更在於構思、取捨與推敲的過程。想清楚要說甚麼、決定甚麼該留甚麼該刪，這些工夫做過一次，思路就清楚一分。用機器代寫，就像請人代自己跑步來減肥，路程一樣走完了，該練的卻半點沒有練到。其次是可靠與否。機器答得流暢，卻會一本正經地說錯：它有時憑空生出一條引文，配上似模似樣的出處；有時把數字說得斬釘截鐵，翻查之下卻毫無根據。我曾請它列出三本談寫作的書，書名齊全，作者也對得上，到圖書館一查，其中兩本根本不存在。沒有讀過原文的人，根本分不出哪一句是真、哪一句是編出來的。反對的一方也有他們的道理。他們說，計算機面世之後，難道我們今天還要求學生用算盤嗎？工具替人省下功夫，本來就是進步。這個類比聽來順耳，卻並不貼切：計算機代替的是計算的步驟，不是判斷本身；學生仍要決定用哪一條公式、答案是否合理。把判斷也交出去，才是真正的分別所在。至於因為機器會出錯就完全不用，同樣是因噎廢食。古人說「工欲善其事，必先利其器」，話說得極是。工具愈鋒利，愈值得學會用；只是這句話從來沒有說過，器利了，事就不必自己做。所以我的看法是這樣：用它列一份大綱，可以；用它挑出句子的毛病，可以；用它找出與自己相反的說法，然後逐一回應，更是好事；唯獨用它替自己想出結論，不可以。一篇沒有人真正想過的文章，無論文句多麼整齊，交給誰看都沒有多大意思。</p><p>簡体<br>这一两年，老师之间流传着一个新的难题：收回来的作文，文句忽然变得十分整齐，起承转合一应俱全，读下去却总觉得少了点甚么。问起来，同学多半答得坦白，说只是用人工智能替自己润色，并非整篇由机器代写。工具固然有用，我也不主张把它一概封杀；但我认为这里有一条界线：交上去的文章，可以借工具修饰，却必须先经过自己的脑袋。先说写作这回事本身。一篇文章的价值，不只在于交出来的那几百字，更在于构思、取舍与推敲的过程。想清楚要说甚么、决定甚么该留甚么该删，这些工夫做过一次，思路就清楚一分。用机器代写，就像请人代自己跑步来减肥，路程一样走完了，该练的却半点没有练到。其次是可靠与否。机器答得流畅，却会一本正经地说错：它有时凭空生出一条引文，配上似模似样的出处；有时把数字说得斩钉截铁，翻查之下却毫无根据。我曾请它列出三本谈写作的书，书名齐全，作者也对得上，到图书馆一查，其中两本根本不存在。没有读过原文的人，根本分不出哪一句是真、哪一句是编出来的。反对的一方也有他们的道理。他们说，计算机面世之后，难道我们今天还要求学生用算盘吗？工具替人省下功夫，本来就是进步。这个类比听来顺耳，却并不贴切：计算机代替的是计算的步骤，不是判断本身；学生仍要决定用哪一条公式、答案是否合理。把判断也交出去，才是真正的分别所在。至于因为机器会出错就完全不用，同样是因噎废食。古人说「工欲善其事，必先利其器」，话说得极是。工具愈锋利，愈值得学会用；只是这句话从来没有说过，器利了，事就不必自己做。所以我的看法是这样：用它列一份大纲，可以；用它挑出句子的毛病，可以；用它找出与自己相反的说法，然后逐一回应，更是好事；唯独用它替自己想出结论，不可以。一篇没有人真正想过的文章，无论文句多么整齐，交给谁看都没有多大意思。</p>", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Chinese", "stem": "作者認為寫作的價值主要在哪裏？<br><i>作者认为写作的价值主要在哪里？</i>", "options": {"A": "在於文章的字數是否足夠<br><i>在于文章的字数是否足够</i>", "B": "在於用詞是否華麗<br><i>在于用词是否华丽</i>", "C": "在於能否得到老師的稱讚<br><i>在于能否得到老师的称赞</i>", "D": "在於構思、取捨與推敲的過程<br><i>在于构思、取舍与推敲的过程</i>"}, "fig": "", "passage": "<strong>當機器替我們動筆<br><i>当机器替我们动笔</i></strong><br><p>繁體<br>這一兩年，老師之間流傳着一個新的難題：收回來的作文，文句忽然變得十分整齊，起承轉合一應俱全，讀下去卻總覺得少了點甚麼。問起來，同學多半答得坦白，說只是用人工智能替自己潤色，並非整篇由機器代寫。工具固然有用，我也不主張把它一概封殺；但我認為這裏有一條界線：交上去的文章，可以借工具修飾，卻必須先經過自己的腦袋。先說寫作這回事本身。一篇文章的價值，不只在於交出來的那幾百字，更在於構思、取捨與推敲的過程。想清楚要說甚麼、決定甚麼該留甚麼該刪，這些工夫做過一次，思路就清楚一分。用機器代寫，就像請人代自己跑步來減肥，路程一樣走完了，該練的卻半點沒有練到。其次是可靠與否。機器答得流暢，卻會一本正經地說錯：它有時憑空生出一條引文，配上似模似樣的出處；有時把數字說得斬釘截鐵，翻查之下卻毫無根據。我曾請它列出三本談寫作的書，書名齊全，作者也對得上，到圖書館一查，其中兩本根本不存在。沒有讀過原文的人，根本分不出哪一句是真、哪一句是編出來的。反對的一方也有他們的道理。他們說，計算機面世之後，難道我們今天還要求學生用算盤嗎？工具替人省下功夫，本來就是進步。這個類比聽來順耳，卻並不貼切：計算機代替的是計算的步驟，不是判斷本身；學生仍要決定用哪一條公式、答案是否合理。把判斷也交出去，才是真正的分別所在。至於因為機器會出錯就完全不用，同樣是因噎廢食。古人說「工欲善其事，必先利其器」，話說得極是。工具愈鋒利，愈值得學會用；只是這句話從來沒有說過，器利了，事就不必自己做。所以我的看法是這樣：用它列一份大綱，可以；用它挑出句子的毛病，可以；用它找出與自己相反的說法，然後逐一回應，更是好事；唯獨用它替自己想出結論，不可以。一篇沒有人真正想過的文章，無論文句多麼整齊，交給誰看都沒有多大意思。</p><p>簡体<br>这一两年，老师之间流传着一个新的难题：收回来的作文，文句忽然变得十分整齐，起承转合一应俱全，读下去却总觉得少了点甚么。问起来，同学多半答得坦白，说只是用人工智能替自己润色，并非整篇由机器代写。工具固然有用，我也不主张把它一概封杀；但我认为这里有一条界线：交上去的文章，可以借工具修饰，却必须先经过自己的脑袋。先说写作这回事本身。一篇文章的价值，不只在于交出来的那几百字，更在于构思、取舍与推敲的过程。想清楚要说甚么、决定甚么该留甚么该删，这些工夫做过一次，思路就清楚一分。用机器代写，就像请人代自己跑步来减肥，路程一样走完了，该练的却半点没有练到。其次是可靠与否。机器答得流畅，却会一本正经地说错：它有时凭空生出一条引文，配上似模似样的出处；有时把数字说得斩钉截铁，翻查之下却毫无根据。我曾请它列出三本谈写作的书，书名齐全，作者也对得上，到图书馆一查，其中两本根本不存在。没有读过原文的人，根本分不出哪一句是真、哪一句是编出来的。反对的一方也有他们的道理。他们说，计算机面世之后，难道我们今天还要求学生用算盘吗？工具替人省下功夫，本来就是进步。这个类比听来顺耳，却并不贴切：计算机代替的是计算的步骤，不是判断本身；学生仍要决定用哪一条公式、答案是否合理。把判断也交出去，才是真正的分别所在。至于因为机器会出错就完全不用，同样是因噎废食。古人说「工欲善其事，必先利其器」，话说得极是。工具愈锋利，愈值得学会用；只是这句话从来没有说过，器利了，事就不必自己做。所以我的看法是这样：用它列一份大纲，可以；用它挑出句子的毛病，可以；用它找出与自己相反的说法，然后逐一回应，更是好事；唯独用它替自己想出结论，不可以。一篇没有人真正想过的文章，无论文句多么整齐，交给谁看都没有多大意思。</p>", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Chinese", "stem": "文中指出機器「一本正經地說錯」，最令作者憂慮的是甚麼？<br><i>文中指出机器「一本正经地说错」，最令作者忧虑的是甚么？</i>", "options": {"A": "錯誤外表可信，未讀過原文的人分不出真假<br><i>错误外表可信，未读过原文的人分不出真假</i>", "B": "機器回答的速度太慢<br><i>机器回答的速度太慢</i>", "C": "機器不肯承認自己會犯錯<br><i>机器不肯承认自己会犯错</i>", "D": "機器只能處理數字，不能處理文字<br><i>机器只能处理数字，不能处理文字</i>"}, "fig": "", "passage": "<strong>當機器替我們動筆<br><i>当机器替我们动笔</i></strong><br><p>繁體<br>這一兩年，老師之間流傳着一個新的難題：收回來的作文，文句忽然變得十分整齊，起承轉合一應俱全，讀下去卻總覺得少了點甚麼。問起來，同學多半答得坦白，說只是用人工智能替自己潤色，並非整篇由機器代寫。工具固然有用，我也不主張把它一概封殺；但我認為這裏有一條界線：交上去的文章，可以借工具修飾，卻必須先經過自己的腦袋。先說寫作這回事本身。一篇文章的價值，不只在於交出來的那幾百字，更在於構思、取捨與推敲的過程。想清楚要說甚麼、決定甚麼該留甚麼該刪，這些工夫做過一次，思路就清楚一分。用機器代寫，就像請人代自己跑步來減肥，路程一樣走完了，該練的卻半點沒有練到。其次是可靠與否。機器答得流暢，卻會一本正經地說錯：它有時憑空生出一條引文，配上似模似樣的出處；有時把數字說得斬釘截鐵，翻查之下卻毫無根據。我曾請它列出三本談寫作的書，書名齊全，作者也對得上，到圖書館一查，其中兩本根本不存在。沒有讀過原文的人，根本分不出哪一句是真、哪一句是編出來的。反對的一方也有他們的道理。他們說，計算機面世之後，難道我們今天還要求學生用算盤嗎？工具替人省下功夫，本來就是進步。這個類比聽來順耳，卻並不貼切：計算機代替的是計算的步驟，不是判斷本身；學生仍要決定用哪一條公式、答案是否合理。把判斷也交出去，才是真正的分別所在。至於因為機器會出錯就完全不用，同樣是因噎廢食。古人說「工欲善其事，必先利其器」，話說得極是。工具愈鋒利，愈值得學會用；只是這句話從來沒有說過，器利了，事就不必自己做。所以我的看法是這樣：用它列一份大綱，可以；用它挑出句子的毛病，可以；用它找出與自己相反的說法，然後逐一回應，更是好事；唯獨用它替自己想出結論，不可以。一篇沒有人真正想過的文章，無論文句多麼整齊，交給誰看都沒有多大意思。</p><p>簡体<br>这一两年，老师之间流传着一个新的难题：收回来的作文，文句忽然变得十分整齐，起承转合一应俱全，读下去却总觉得少了点甚么。问起来，同学多半答得坦白，说只是用人工智能替自己润色，并非整篇由机器代写。工具固然有用，我也不主张把它一概封杀；但我认为这里有一条界线：交上去的文章，可以借工具修饰，却必须先经过自己的脑袋。先说写作这回事本身。一篇文章的价值，不只在于交出来的那几百字，更在于构思、取舍与推敲的过程。想清楚要说甚么、决定甚么该留甚么该删，这些工夫做过一次，思路就清楚一分。用机器代写，就像请人代自己跑步来减肥，路程一样走完了，该练的却半点没有练到。其次是可靠与否。机器答得流畅，却会一本正经地说错：它有时凭空生出一条引文，配上似模似样的出处；有时把数字说得斩钉截铁，翻查之下却毫无根据。我曾请它列出三本谈写作的书，书名齐全，作者也对得上，到图书馆一查，其中两本根本不存在。没有读过原文的人，根本分不出哪一句是真、哪一句是编出来的。反对的一方也有他们的道理。他们说，计算机面世之后，难道我们今天还要求学生用算盘吗？工具替人省下功夫，本来就是进步。这个类比听来顺耳，却并不贴切：计算机代替的是计算的步骤，不是判断本身；学生仍要决定用哪一条公式、答案是否合理。把判断也交出去，才是真正的分别所在。至于因为机器会出错就完全不用，同样是因噎废食。古人说「工欲善其事，必先利其器」，话说得极是。工具愈锋利，愈值得学会用；只是这句话从来没有说过，器利了，事就不必自己做。所以我的看法是这样：用它列一份大纲，可以；用它挑出句子的毛病，可以；用它找出与自己相反的说法，然后逐一回应，更是好事；唯独用它替自己想出结论，不可以。一篇没有人真正想过的文章，无论文句多么整齐，交给谁看都没有多大意思。</p>", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Chinese", "stem": "反對的一方以計算機取代算盤作類比，作者怎樣回應？<br><i>反对的一方以计算机取代算盘作类比，作者怎样回应？</i>", "options": {"A": "承認類比恰當，因此收回自己的主張<br><i>承认类比恰当，因此收回自己的主张</i>", "B": "指出計算機同樣會出錯，所以也不該使用<br><i>指出计算机同样会出错，所以也不该使用</i>", "C": "指出計算機代替的是計算步驟，人工智能卻代替了判斷<br><i>指出计算机代替的是计算步骤，人工智能却代替了判断</i>", "D": "指出算盤比計算機更能訓練思考，應該保留<br><i>指出算盘比计算机更能训练思考，应该保留</i>"}, "fig": "", "passage": "<strong>當機器替我們動筆<br><i>当机器替我们动笔</i></strong><br><p>繁體<br>這一兩年，老師之間流傳着一個新的難題：收回來的作文，文句忽然變得十分整齊，起承轉合一應俱全，讀下去卻總覺得少了點甚麼。問起來，同學多半答得坦白，說只是用人工智能替自己潤色，並非整篇由機器代寫。工具固然有用，我也不主張把它一概封殺；但我認為這裏有一條界線：交上去的文章，可以借工具修飾，卻必須先經過自己的腦袋。先說寫作這回事本身。一篇文章的價值，不只在於交出來的那幾百字，更在於構思、取捨與推敲的過程。想清楚要說甚麼、決定甚麼該留甚麼該刪，這些工夫做過一次，思路就清楚一分。用機器代寫，就像請人代自己跑步來減肥，路程一樣走完了，該練的卻半點沒有練到。其次是可靠與否。機器答得流暢，卻會一本正經地說錯：它有時憑空生出一條引文，配上似模似樣的出處；有時把數字說得斬釘截鐵，翻查之下卻毫無根據。我曾請它列出三本談寫作的書，書名齊全，作者也對得上，到圖書館一查，其中兩本根本不存在。沒有讀過原文的人，根本分不出哪一句是真、哪一句是編出來的。反對的一方也有他們的道理。他們說，計算機面世之後，難道我們今天還要求學生用算盤嗎？工具替人省下功夫，本來就是進步。這個類比聽來順耳，卻並不貼切：計算機代替的是計算的步驟，不是判斷本身；學生仍要決定用哪一條公式、答案是否合理。把判斷也交出去，才是真正的分別所在。至於因為機器會出錯就完全不用，同樣是因噎廢食。古人說「工欲善其事，必先利其器」，話說得極是。工具愈鋒利，愈值得學會用；只是這句話從來沒有說過，器利了，事就不必自己做。所以我的看法是這樣：用它列一份大綱，可以；用它挑出句子的毛病，可以；用它找出與自己相反的說法，然後逐一回應，更是好事；唯獨用它替自己想出結論，不可以。一篇沒有人真正想過的文章，無論文句多麼整齊，交給誰看都沒有多大意思。</p><p>簡体<br>这一两年，老师之间流传着一个新的难题：收回来的作文，文句忽然变得十分整齐，起承转合一应俱全，读下去却总觉得少了点甚么。问起来，同学多半答得坦白，说只是用人工智能替自己润色，并非整篇由机器代写。工具固然有用，我也不主张把它一概封杀；但我认为这里有一条界线：交上去的文章，可以借工具修饰，却必须先经过自己的脑袋。先说写作这回事本身。一篇文章的价值，不只在于交出来的那几百字，更在于构思、取舍与推敲的过程。想清楚要说甚么、决定甚么该留甚么该删，这些工夫做过一次，思路就清楚一分。用机器代写，就像请人代自己跑步来减肥，路程一样走完了，该练的却半点没有练到。其次是可靠与否。机器答得流畅，却会一本正经地说错：它有时凭空生出一条引文，配上似模似样的出处；有时把数字说得斩钉截铁，翻查之下却毫无根据。我曾请它列出三本谈写作的书，书名齐全，作者也对得上，到图书馆一查，其中两本根本不存在。没有读过原文的人，根本分不出哪一句是真、哪一句是编出来的。反对的一方也有他们的道理。他们说，计算机面世之后，难道我们今天还要求学生用算盘吗？工具替人省下功夫，本来就是进步。这个类比听来顺耳，却并不贴切：计算机代替的是计算的步骤，不是判断本身；学生仍要决定用哪一条公式、答案是否合理。把判断也交出去，才是真正的分别所在。至于因为机器会出错就完全不用，同样是因噎废食。古人说「工欲善其事，必先利其器」，话说得极是。工具愈锋利，愈值得学会用；只是这句话从来没有说过，器利了，事就不必自己做。所以我的看法是这样：用它列一份大纲，可以；用它挑出句子的毛病，可以；用它找出与自己相反的说法，然后逐一回应，更是好事；唯独用它替自己想出结论，不可以。一篇没有人真正想过的文章，无论文句多么整齐，交给谁看都没有多大意思。</p>", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Chinese", "stem": "按末段所述，下列哪一種用法是作者不接受的？<br><i>按末段所述，下列哪一种用法是作者不接受的？</i>", "options": {"A": "用它列出文章大綱<br><i>用它列出文章大纲</i>", "B": "用它替自己想出文章的結論<br><i>用它替自己想出文章的结论</i>", "C": "用它挑出句子的毛病<b 是進步。這個類比聽來順耳，卻並不貼切：計算機代替的是計算的步驟，不是判斷本身；學生仍要決定用哪一條公式、答案是否合理。把判斷也交出去，才是真正的分別所在。至於因為機器會出錯就完全不用，同樣是因噎廢食。古人說「工欲善其事，必先利其器」，話說得極是。工具愈鋒利，愈值得學會用；只是這句話從來沒有說過，器利了，事就不必自己做。所以我的看法是這樣：用它列一份大綱，可以；用它挑出句子的毛病，可以；用它找出與自己相反的說法，然後逐一回應，更是好事；唯獨用它替自己想出結論，不可以。一篇沒有人真正想過的文章，無論文句多麼整齊，交給誰看都沒有多大意思。</p><p>簡体<br>这一两年，老师之间流传着一个新的难题：收回来的作文，文句忽然变得十分整齐，起承转合一应俱全，读下去却总觉得少了点甚么。问起来，同学多半答得坦白，说只是用人工智能替自己润色，并非整篇由机器代写。工具固然有用，我也不主张把它一概封杀；但我认为这里有一条界线：交上去的文章，可以借工具修饰，却必须先经过自己的脑袋。先说写作这回事本身。一篇文章的价值，不只在于交出来的那几百字，更在于构思、取舍与推敲的过程。想清楚要说甚么、决定甚么该留甚么该删，这些工夫做过一次，思路就清楚一分。用机器代写，就像请人代自己跑步来减肥，路程一样走完了，该练的却半点没有练到。其次是可靠与否。机器答得流畅，却会一本正经地说错：它有时凭空生出一条引文，配上似模似样的出处；有时把数字说得斩钉截铁，翻查之下却毫无根据。我曾请它列出三本谈写作的书，书名齐全，作者也对得上，到图书馆一查，其中两本根本不存在。没有读过原文的人，根本分不出哪一句是真、哪一句是编出来的。反对的一方也有他们的道理。他们说，计算机面世之后，难道我们今天还要求学生用算盘吗？工具替人省下功夫，本来就是进步。这个类比听来顺耳，却并不贴切：计算机代替的是计算的步骤，不是判断本身；学生仍要决定用哪一条公式、答案是否合理。把判断也交出去，才是真正的分别所在。至于因为机器会出错就完全不用，同样是因噎废食。古人说「工欲善其事，必先利其器」，话说得极是。工具愈锋利，愈值得学会用；只是这句话从来没有说过，器利了，事就不必自己做。所以我的看法是这样：用它列一份大纲，可以；用它挑出句子的毛病，可以；用它找出与自己相反的说法，然后逐一回应，更是好事；唯独用它替自己想出结论，不可以。一篇没有人真正想过的文章，无论文句多么整齐，交给谁看都没有多大意思。</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Chinese", "stem": "「工具固然有用，我也不主張把它一概封殺」的「固然」，在句中起甚麼作用？<br><i>「工具固然有用，我也不主张把它一概封杀」的「固然」，在句中起甚么作用？</i>", "options": {"A": "表示因此得出結論<br><i>表示因此得出结论</i>", "B": "先承認一點，暗示下文另有話說<br><i>先承认一点，暗示下文另有话说</i>", "C": "表示事情已經完成<br><i>表示事情已经完成</i>", "D": "表示假設一種情況<br><i>表示假设一种情况</i>"}, "fig": "", "passage": "<strong>當機器替我們動筆<br><i>当机器替我们动笔</i></strong><br><p>繁體<br>這一兩年，老師之間流傳着一個新的難題：收回來的作文，文句忽然變得十分整齊，起承轉合一應俱全，讀下去卻總覺得少了點甚麼。問起來，同學多半答得坦白，說只是用人工智能替自己潤色，並非整篇由機器代寫。工具固然有用，我也不主張把它一概封殺；但我認為這裏有一條界線：交上去的文章，可以借工具修飾，卻必須先經過自己的腦袋。先說寫作這回事本身。一篇文章的價值，不只在於交出來的那幾百字，更在於構思、取捨與推敲的過程。想清楚要說甚麼、決定甚麼該留甚麼該刪，這些工夫做過一次，思路就清楚一分。用機器代寫，就像請人代自己跑步來減肥，路程一樣走完了，該練的卻半點沒有練到。其次是可靠與否。機器答得流暢，卻會一本正經地說錯：它有時憑空生出一條引文，配上似模似樣的出處；有時把數字說得斬釘截鐵，翻查之下卻毫無根據。我曾請它列出三本談寫作的書，書名齊全，作者也對得上，到圖書館一查，其中兩本根本不存在。沒有讀過原文的人，根本分不出哪一句是真、哪一句是編出來的。反對的一方也有他們的道理。他們說，計算機面世之後，難道我們今天還要求學生用算盤嗎？工具替人省下功夫，本來就是進步。這個類比聽來順耳，卻並不貼切：計算機代替的是計算的步驟，不是判斷本身；學生仍要決定用哪一條公式、答案是否合理。把判斷也交出去，才是真正的分別所在。至於因為機器會出錯就完全不用，同樣是因噎廢食。 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 Chinese Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }

  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
