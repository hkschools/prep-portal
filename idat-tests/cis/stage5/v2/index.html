<title>IDAT CIS: Stage 5 (V2)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmXlzvpnHvxI5ILdACyHHZv8HWfNQ08pCP27GmmluJ7lUGiou1izR4e7Gs8LxKLtgo/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "2";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nThe organisers sent the certificates to the other finalists and ____, even though we had withdrawn before the final round.", "options": {"A": "I", "B": "we", "C": "us", "D": "ourselves"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "Choose the subordinating conjunction that best completes the sentence.\n\n____ the new policy was popular with parents, the teachers argued that it added significantly to their workload.", "options": {"A": "Because", "B": "Whereas", "C": "So", "D": "Therefore"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the underlined word in the sentence below?\n\nThe spokesperson gave an <u>evasive</u> answer, never quite addressing the question that had been asked.", "options": {"A": "honest", "B": "detailed", "C": "furious", "D": "elusive"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nNeither the players nor the captain ____ satisfied with the referee's final decision.", "options": {"A": "were", "B": "have been", "C": "was", "D": "are"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "The word <u>circumnavigate</u> contains the Latin roots 'circum' and 'nav'. Using these roots, what does 'circumnavigate' most likely mean?", "options": {"A": "to sail all the way around something", "B": "to build a new ship", "C": "to measure the depth of the sea", "D": "to travel in a straight line"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Choose the sentence in which the colon and the semicolon are both punctuated correctly.", "options": {"A": "We packed three things; a tent, a stove, and a map; the rain had already begun: we hurried.", "B": "We packed three things, a tent, a stove, and a map: the rain had already begun, we hurried.", "C": "We packed three things a tent, a stove, and a map; the rain had already begun we hurried.", "D": "We packed three things: a tent, a stove, and a map; the rain had already begun, so we hurried."}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "What is the best meaning of the underlined word as it is used in the sentence below?\n\nAfter months of training, the rower's <u>stroke</u> had become smooth and powerful.", "options": {"A": "a sudden illness affecting the brain", "B": "a single movement of the oar through the water", "C": "an act of gentle touching", "D": "a mark made by a pen or brush"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "You are writing a formal letter to the director of a museum to request a tour for your class. Choose the most appropriate option to complete the sentence.\n\n____ it be possible to arrange a guided visit for our group next term?", "options": {"A": "Would", "B": "Can't", "C": "Won't", "D": "Gotta make"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Which word is most nearly OPPOSITE in meaning to the underlined word?\n\nThe instructions were refreshingly <u>lucid</u>.", "options": {"A": "clear", "B": "brief", "C": "confusing", "D": "lengthy"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "Choose the option that correctly rewrites the sentence in the passive voice.\n\nActive: The engineers have completed the bridge ahead of schedule.", "options": {"A": "The bridge has complete by the engineers ahead of schedule.", "B": "The bridge is completed by the engineers ahead of schedule.", "C": "The bridge had been completing by the engineers ahead of schedule.", "D": "The bridge has been completed by the engineers ahead of schedule."}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Read the sentence, then choose the word whose connotation best matches the writer's clearly negative attitude.\n\nThe reviewer mocked the film as a ____ imitation of far better movies.", "options": {"A": "slavish", "B": "faithful", "C": "loyal", "D": "respectful"}, "fig": "", "passage": null, "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "Choose the word that best completes the analogy.\n\nTimid is to boldness as frugal is to ____.", "options": {"A": "money", "B": "extravagance", "C": "thrift", "D": "poverty"}, "fig": "", "passage": null, "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nThe city never sleeps; its streets <u>hum and breathe</u> long after midnight.", "options": {"A": "simile", "B": "hyperbole", "C": "personification", "D": "alliteration"}, "fig": "", "passage": null, "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "One of the labelled sections contains an error. Choose the labelled section that must be corrected.\n\nThe volunteers, who had worked since dawn, (A) was exhausted by evening, (B) yet they refused (C) to leave until every box (D) had been delivered.", "options": {"A": "was exhausted by evening", "B": "yet they refused", "C": "to leave until every box", "D": "had been delivered"}, "fig": "", "passage": null, "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "What does the underlined idiom most nearly mean in the sentence below?\n\nWhen the manager asked who had broken the printer, the new intern decided to <u>bite the bullet</u> and admit it was him.", "options": {"A": "to stay completely silent", "B": "to blame someone else quickly", "C": "to become suddenly angry", "D": "to force oneself to do something difficult or unpleasant"}, "fig": "", "passage": null, "qnum": 15}, {"n": 17, "type": "mcq", "section": "English", "stem": "What is Dr Hoffmann's central claim about modern zoos?", "options": {"A": "Zoos are outdated and should gradually be closed.", "B": "Zoos can keep endangered species alive and inspire people to care about nature.", "C": "Zoos exist mainly to make a profit from visitors.", "D": "Zoos should keep only animals that are not endangered."}, "fig": "", "passage": "<strong>Two Views on Modern Zoos</strong><br>VIEW ONE, Dr Lena Hoffmann, conservation biologist<br><br>A good modern zoo is no longer a row of bars and bored animals; it is one of the last lifelines that some species have. When a creature&#x27;s wild home is bulldozed for farmland, a well-run zoo can keep a breeding population alive until that home can be restored. The golden lion tamarin would almost certainly be extinct today without exactly this kind of careful work. Critics picture suffering, but they ignore the science: accredited zoos now build enclosures that mimic natural habitats, employ full-time vets, and fund field projects most of us will never see. Surely a child who watches a real animal breathe and move is far more likely to grow up caring about the planet than one who only ever sees a screen. To shut these places down in the name of kindness would be a tragic mistake, condemning the very animals we claim to love.<br><br>VIEW TWO, Marcus Reyes, animal-welfare campaigner<br><br>No enclosure, however clever, can replace the wild. A tiger that would roam many kilometres a day in nature paces a few metres in a concrete pen, and we call this conservation. Zoos love to talk about saving species, yet only a tiny fraction of the animals they keep belong to endangered breeding programmes; the rest are simply there to draw paying crowds. If we truly cared about wild populations, that money would protect real habitats, not build car parks and gift shops. I do not doubt that some keepers love their animals, and I am sure many work long hours for them. But love is not the same as freedom, and an animal cannot consent to a lifetime behind glass. A child who learns that this is normal learns the wrong lesson about wild creatures. We should be funding wildlife where it actually lives, not charging families to watch it slowly forget what it was.", "qnum": 16}, {"n": 18, "type": "mcq", "section": "English", "stem": "Hoffmann writes: 'Surely a child who watches a real animal breathe and move is far more likely to grow up caring about the planet than one who only ever sees a screen.' Which persuasive technique is she mainly using?", "options": {"A": "Citing a named scientific study with figures", "B": "Admitting a weakness in her own argument", "C": "A rhetorical appeal that invites the reader to agree without proof", "D": "Quoting an expert who disagrees with her"}, "fig": "", "passage": "<strong>Two Views on Modern Zoos</strong><br>VIEW ONE, Dr Lena Hoffmann, conservation biologist<br><br>A good modern zoo is no longer a row of bars and bored animals; it is one of the last lifelines that some species have. When a creature&#x27;s wild home is bulldozed for farmland, a well-run zoo can keep a breeding population alive until that home can be restored. The golden lion tamarin would almost certainly be extinct today without exactly this kind of careful work. Critics picture suffering, but they ignore the science: accredited zoos now build enclosures that mimic natural habitats, employ full-time vets, and fund field projects most of us will never see. Surely a child who watches a real animal breathe and move is far more likely to grow up caring about the planet than one who only ever sees a screen. To shut these places down in the name of kindness would be a tragic mistake, condemning the very animals we claim to love.<br><br>VIEW TWO, Marcus Reyes, animal-welfare campaigner<br><br>No enclosure, however clever, can replace the wild. A tiger that would roam many kilometres a day in nature paces a few metres in a concrete pen, and we call this conservation. Zoos love to talk about saving species, yet only a tiny fraction of the animals they keep belong to endangered breeding programmes; the rest are simply there to draw paying crowds. If we truly cared about wild populations, that money would protect real habitats, not build car parks and gift shops. I do not doubt that some keepers love their animals, and I am sure many work long hours for them. But love is not the same as freedom, and an animal cannot consent to a lifetime behind glass. A child who learns that this is normal learns the wrong lesson about wild creatures. We should be funding wildlife where it actually lives, not charging families to watch it slowly forget what it was.", "qnum": 17}, {"n": 19, "type": "mcq", "section": "English", "stem": "Which phrase from Reyes's argument is the clearest example of loaded, emotionally charged language rather than neutral fact?", "options": {"A": "only a tiny fraction of the animals they keep belong to endangered breeding programmes", "B": "A tiger that would roam many kilometres a day in nature", "C": "We should be funding wildlife where it actually lives", "D": "watch it slowly forget what it was"}, "fig": "", "passage": "<strong>Two Views on Modern Zoos</strong><br>VIEW ONE, Dr Lena Hoffmann, conservation biologist<br><br>A good modern zoo is no longer a row of bars and bored animals; it is one of the last lifelines that some species have. When a creature&#x27;s wild home is bulldozed for farmland, a well-run zoo can keep a breeding population alive until that home can be restored. The golden lion tamarin would almost certainly be extinct today without exactly this kind of careful work. Critics picture suffering, but they ignore the science: accredited zoos now build enclosures that mimic natural habitats, employ full-time vets, and fund field projects most of us will never see. Surely a child who watches a real animal breathe and move is far more likely to grow up caring about the planet than one who only ever sees a screen. To shut these places down in the name of kindness would be a tragic mistake, condemning the very animals we claim to love.<br><br>VIEW TWO, Marcus Reyes, animal-welfare campaigner<br><br>No enclosure, however clever, can replace the wild. A tiger that would roam many kilometres a day in nature paces a few metres in a concrete pen, and we call this conservation. Zoos love to talk about saving species, yet only a tiny fraction of the animals they keep belong to endangered breeding programmes; the rest are simply there to draw paying crowds. If we truly cared about wild populations, that money would protect real habitats, not build car parks and gift shops. I do not doubt that some keepers love their animals, and I am sure many work long hours for them. But love is not the same as freedom, and an animal cannot consent to a lifetime behind glass. A child who learns that this is normal learns the wrong lesson about wild creatures. We should be funding wildlife where it actually lives, not charging families to watch it slowly forget what it was.", "qnum": 18}, {"n": 20, "type": "mcq", "section": "English", "stem": "Both writers mention money. How do they DIFFER in what they say about it?", "options": {"A": "Hoffmann says zoos fund field conservation work; Reyes says zoo money should instead protect wild habitats.", "B": "Hoffmann says zoos waste money; Reyes says zoos save money.", "C": "Both writers agree that zoos spend too much on advertising.", "D": "Neither writer mentions how zoo money is spent."}, "fig": "", "passage": "<strong>Two Views on Modern Zoos</strong><br>VIEW ONE, Dr Lena Hoffmann, conservation biologist<br><br>A good modern zoo is no longer a row of bars and bored animals; it is one of the last lifelines that some species have. When a creature&#x nimal cannot consent to a lifetime behind glass. A child who learns that this is normal learns the wrong lesson about wild creatures. We should be funding wildlife where it actually lives, not charging families to watch it slowly forget what it was.", "qnum": 21}, {"n": 23, "type": "mcq", "section": "English", "stem": "Considering both passages together, what is the most reasonable inference about the writers' shared common ground?", "options": {"A": "Both believe zoos should be expanded as quickly as possible.", "B": "Both ultimately want endangered species to survive, but disagree on how best to achieve it.", "C": "Both think wild habitats are unimportant compared with enclosures.", "D": "Both argue that no one who works at a zoo cares about animals."}, "fig": "", "passage": "<strong>Two Views on Modern Zoos</strong><br>VIEW ONE, Dr Lena Hoffmann, conservation biologist<br><br>A good modern zoo is no longer a row of bars and bored animals; it is one of the last lifelines that some species have. When a creature&#x27;s wild home is bulldozed for farmland, a well-run zoo can keep a breeding population alive until that home can be restored. The golden lion tamarin would almost certainly be extinct today without exactly this kind of careful work. Critics picture suffering, but they ignore the science: accredited zoos now build enclosures that mimic natural habitats, employ full-time vets, and fund field projects most of us will never see. Surely a child who watches a real animal breathe and move is far more likely to grow up caring about the planet than one who only ever sees a screen. To shut these places down in the name of kindness would be a tragic mistake, condemning the very animals we claim to love.<br><br>VIEW TWO, Marcus Reyes, animal-welfare campaigner<br><br>No enclosure, however clever, can replace the wild. A tiger that would roam many kilometres a day in nature paces a few metres in a concrete pen, and we call this conservation. Zoos love to talk about saving species, yet only a tiny fraction of the animals they keep belong to endangered breeding programmes; the rest are simply there to draw paying crowds. If we truly cared about wild populations, that money would protect real habitats, not build car parks and gift shops. I do not doubt that some keepers love their animals, and I am sure many work long hours for them. But love is not the same as freedom, and an animal cannot consent to a lifetime behind glass. A child who learns that this is normal learns the wrong lesson about wild creatures. We should be funding wildlife where it actually lives, not charging families to watch it slowly forget what it was.", "qnum": 22}, {"n": 24, "type": "mcq", "section": "English", "stem": "A reader wants to test Reyes's claim that 'only a tiny fraction' of zoo animals are in endangered breeding programmes. Which piece of evidence would be MOST useful?", "options": {"A": "Official data on what percentage of a zoo's animals are part of recognised breeding programmes.", "B": "A survey asking visitors whether they enjoyed their day at the zoo.", "C": "An interview in which a keeper describes loving the animals.", "D": "A photograph of a tiger pacing in its enclosure."}, "fig": "", "passage": "<strong>Two Views on Modern Zoos</strong><br>VIEW ONE, Dr Lena Hoffmann, conservation biologist<br><br>A good modern zoo is no longer a row of bars and bored animals; it is one of the last lifelines that some species have. When a creature&#x27;s wild home is bulldozed for farmland, a well-run zoo can keep a breeding population alive until that home can be restored. The golden lion tamarin would almost certainly be extinct today without exactly this kind of careful work. Critics picture suffering, but they ignore the science: accredited zoos now build enclosures that mimic natural habitats, employ full-time vets, and fund field projects most of us will never see. Surely a child who watches a real animal breathe and move is far more likely to grow up caring about the planet than one who only ever sees a screen. To shut these places down in the name of kindness would be a tragic mistake, condemning the very animals we claim to love.<br><br>VIEW TWO, Marcus Reyes, animal-welfare campaigner<br><br>No enclosure, however clever, can replace the wild. A tiger that would roam many kilometres a day in nature paces a few metres in a concrete pen, and we call this conservation. Zoos love to talk about saving species, yet only a tiny fraction of the animals they keep belong to endangered breeding programmes; the rest are simply there to draw paying crowds. If we truly cared about wild populations, that money would protect real habitats, not build car parks and gift shops. I do not doubt that some keepers love their animals, and I am sure many work long hours for them. But love is not the same as freedom, and an animal cannot consent to a lifetime behind glass. A child who learns that this is normal learns the wrong lesson about wild creatures. We should be funding wildlife where it actually lives, not charging families to watch it slowly forget what it was.", "qnum": 23}, {"n": 25, "type": "writing", "section": "English Writing", "intro": "A single place can shape the way we see the world long after we have left it.", "label": "", "body": "Describe a place that has had a strong effect on you, using vivid, sensory language so the reader can picture it. Then explain why you believe places like this matter, and whether you think they are worth protecting, giving clear reasons for your view.", "hint": "Write at least 8 sentences. Use vivid, specific detail and explain your reasoning clearly.", "placeholder": "Type your response here…", "partA": "Describe a place that has had a strong effect on you, using vivid, sensory language so the reader can picture it. Then explain why you believe places like this matter, and whether you think they are worth protecting, giving clear reasons for your view.", "partB": ""}, {"n": 26, "type": "info", "title": "English Listening &amp; Speaking", "body": "<div class='info-body'>In the real test this section is delivered by an on-screen avatar: you listen and then speak your answers aloud into the microphone. There is nothing to type or record here, the sample questions below show the kind of thing you'll be asked, so you can practise out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Introduce yourself and describe your main academic interests and goals.</li><li style='margin:7px 0'>Describe a challenge you have overcome and what you learned from it.</li><li style='margin:7px 0'>What qualities make a good leader? Give an example.</li><li style='margin:7px 0'>Talk about an issue facing young people today and explain your view.</li><li style='margin:7px 0'>Listen to a short talk, then summarise its main argument in your own words.</li></ul>"}, {"n": 27, "type": "info", "title": "Mathematics, Logic &amp; Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": 28, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A line has equation 4x − 2y = 8. Which line below is parallel to it?", "options": {"A": "y = −2x − 4", "B": "y = 2x + 9", "C": "y = −½x + 1", "D": "y = ½x − 4"}, "fig": "", "passage": null, "qnum": 24}, {"n": 29, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A line has equation 3x + y = 7. Which line below is perpendicular to it?", "options": {"A": "y = −3x + 2", "B": "y = ⅓x − 4", "C": "y = −⅓x + 5", "D": "y = 3x + 1"}, "fig": "", "passage": null, "qnum": 25}, {"n": 30, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the straight line passing through the points (2, 5) and (5, 14).", "options": {"A": "y = 3x + 5", "B": "y = 3x − 1", "C": "y = ⅓x + 4", "D": "y = 3x + 14"}, "fig": "<svg viewBox=\"0 0 300 300\" width=\"300\" height=\"300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"300\" height=\"300\" fill=\"#ffffff\"/><line x1=\"12\" y1=\"150\" x2=\"288\" y2=\"150\" stroke=\"#888\"/><line x1=\"150\" y1=\"12\" x2=\"150\" y2=\"288\" stroke=\"#888\"/><line x1=\"193.3\" y1=\"28.7\" x2=\"167.3\" y2=\"106.7\" stroke=\"#27406b\" stroke-width=\"2\"/><circle cx=\"193.3\" cy=\"28.7\" r=\"3.5\" fill=\"#c0392b\"/><text x=\"199.3\" y=\"22.7\" font-size=\"11\">P(5,14)</text><circle cx=\"167.3\" cy=\"106.7\" r=\"3.5\" fill=\"#c0392b\"/><text x=\"173.3\" y=\"100.7\" font-size=\"11\">Q(2,5)</text></svg>", "passage": null, "qnum": 26}, {"n": 31, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the line with gradient 5 that passes through the point (−2, 3).", "options": {"A": "y = 5x + 3", "B": "y = 5x − 7", "C": "y = 5x + 13", "D": "y = 5x − 2"}, "fig": "", "passage": null, "qnum": 27}, {"n": 32, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Triangles ABC and PQR are similar. Side AB = 8 cm corresponds to PQ = 14 cm, and height BC = 12 cm corresponds to QR = y. Find y.", "options": {"A": "y = 18 cm", "B": "y = 6.9 cm", "C": "y = 10.5 cm", "D": "y = 21 cm"}, "fig": "<svg viewBox=\"0 0 360 185\" width=\"360\" height=\"185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"360\" height=\"185\" fill=\"#ffffff\"/><polygon points=\"40,150 120,150 40,80\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"72\" y=\"168\" font-size=\"12\" text-anchor=\"middle\">8</text><text x=\"14\" y=\"118\" font-size=\"12\">12</text><polygon points=\"200,158 330,158 200,58\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"262\" y=\"176\" font-size=\"12\" text-anchor=\"middle\">14</text><text x=\"168\" y=\"112\" font-size=\"12\">?</text></svg>", "passage": null, "qnum": 28}, {"n": 33, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Shape B is similar to shape A with linear scale factor 4. Shape A has area 15 cm². Find the area of shape B.", "options": {"A": "240 cm²", "B": "60 cm²", "C": "225 cm²", "D": "960 cm²"}, "fig": "", "passage": null, "qnum": 29}, {"n": 34, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two similar figures have corresponding lengths 18 cm and 12 cm. Write the scale factor of the larger to the smaller in its simplest ratio form.", "options": {"A": "9 : 6", "B": "3 : 2", "C": "2 : 3", "D": "18 : 12"}, "fig": "", "passage": null, "qnum": 30}, {"n": 35, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two similar pentagons have areas 12 cm² and 75 cm². Find the scale factor of their corresponding side lengths.", "options": {"A": "6.25", "B": "12.5", "C": "2.5", "D": "63"}, "fig": "", "passage": null, "qnum": 31}, {"n": 36, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Expand and simplify: 4(3x − 2) − 3(2x − 5).", "options": {"A": "6x − 23", "B": "18x + 7", "C": "6x + 7", "D": "6x − 7"}, "fig": "", "passage": null, "qnum": 32}, {"n": 37, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify the algebraic fraction (x² − 25)/(x − 5).", "options": {"A": "x − 5", "B": "x − 25", "C": "x + 5", "D": "x − 20"}, "fig": "", "passage": null, "qnum": 33}, {"n": 38, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A square-based pyramid has base edge 12 cm and slant height 10 cm. Find its total surface area.", "options": {"A": "384 cm²", "B": "240 cm²", "C": "204 cm²", "D": "744 cm²"}, "fig": "<svg viewBox=\"0 0 230 200\" width=\"230\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"230\" height=\"200\" fill=\"#ffffff\"/><rect x=\"55\" y=\"72\" width=\"95\" height=\"68\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><polygon points=\"55,72 85,46 180,46 150,72\" fill=\"#cdd9ec\" stroke=\"#27406b\" stroke-width=\"2\"/><polygon points=\"150,72 180,46 180,114 150,140\" fill=\"#c0cde2\" stroke=\"#27406b\" stroke-width=\"2\"/></svg>", "passage": null, "qnum": 34}, {"n": 39, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid has a volume of 360 cm³. Its base measures 9 cm by 8 cm. Find its height.", "options": {"A": "5 cm", "B": "343 cm", "C": "2.5 cm", "D": "20 cm"}, "fig": "", "passage": null, "qnum": 35}, {"n": 40, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sphere has radius 3 cm. Using V = 4⁄3 πr³, find its volume to 1 decimal place.", "options": {"A": "56.5 cm³", "B": "37.7 cm³", "C": "36.0 cm³", "D": "113.1 cm³"}, "fig": "", "passage": null, "qnum": 36}, {"n": 41, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The mean of five numbers is 14. Four of the numbers are 11, 16, 9 and 18. Find the fifth number.", "options": {"A": "16", "B": "13.5", "C": "70", "D": "54"}, "fig": "", "passage": null, "qnum": 37}, {"n": 42, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the median of the data: 20, 7, 13, 9, 4, 16.", "options": {"A": "13", "B": "11", "C": "11.5", "D": "9"}, "fig": "", "passage": null, "qnum": 38}, {"n": 43, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A shop records the number of items in 7 baskets: 3, 7, 7, 7, 10, 12, 12. Which average best describes the most common basket size, and what is its value?", "options": {"A": "Mean, 8.3", "B": "Median, 7", "C": "Range, 9", "D": "Mode, 7"}, "fig": "", "passage": null, "qnum": 39}, {"n": 44, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "For the ordered data 4, 6, 9, 11, 14, 16, 19, 22, 25, 27, 31, find the interquartile range.", "options": {"A": "16", "B": "27", "C": "9", "D": "8"}, "fig": "", "passage": null, "qnum": 40}, {"n": 45, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "After 6 games a player has a mean score of 12 points. In the first 5 games she scored 8, 15, 10, 7 and 14. How many points did she score in the 6th game?", "options": {"A": "11", "B": "10.8", "C": "18", "D": "72"}, "fig": "", "passage": null, "qnum": 41}, {"n": 46, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the number pattern: 3, 7, 16, 35, 74, ___. What number comes next in the sequence?", "options": {"A": "148", "B": "149", "C": "152", "D": "153"}, "fig": "", "passage": null, "qnum": 42}, {"n": 47, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a made-up language, all 'krellig' are 'tovs', and no 'tovs' are 'pims'. Based only on these rules, which statement MUST be true?", "options": {"A": "Some pims are tovs.", "B": "All tovs are krellig.", "C": "No krellig are pims.", "D": "Cannot be determined from the rules."}, "fig": "", "passage": null, "qnum": 43}, {"n": 48, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Jordan wants to save $540 over 6 months. He earns $110 each month from a part-time job, and each month he must spend $35 on transport and $45 on lunch. If he keeps everything he does not spend, how much MORE must he save each month to reach his $540 target on time?", "options": {"A": "$90", "B": "$60", "C": "$30", "D": "$15"}, "fig": "", "passage": null, "qnum": 44}, {"n": 49, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the four labelled shapes in the figure. A regular polygon has ALL sides equal AND ALL angles equal. Which ONE of the shapes is a regular polygon?", "options": {"A": "Shape A (equilateral triangle)", "B": "Shape B (rhombus)", "C": "Shape C (rectangle)", "D": "Shape D (isosceles trapezoid)"}, "fig": "<svg viewBox=\"0 0 368 120\" width=\"368\" height=\"120\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"368\" height=\"120\" fill=\"#ffffff\"/><polygon points=\"46.0,25.0 69.4,65.5 22.6,65.5\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"46.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">A</text><polygon points=\"138.0,25.0 156.9,52.0 138.0,79.0 119.1,52.0\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"138.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">B</text><rect x=\"203.0\" y=\"35.8\" width=\"54.0\" height=\"32.4\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"230.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">C</text><polygon points=\"308.5,35.8 335.5,35.8 349.0,68.2 295.0,68.2\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"322.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">D</text></svg>", "passage": null, "qnum": 45}, {"n": 50, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Study the figure: a solid rectangular box measures 8 cm long, 6 cm wide and 4 cm tall. Small solid cubes with an edge of 2 cm are packed inside, filling the box completely with no gaps. How many 2 cm cubes fit inside the box?", "options": {"A": "12", "B": "24", "C": "48", "D": "96"}, "fig": "<svg viewBox=\"0 0 240 200\" width=\"240\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"240\" height=\"200\" fill=\"#ffffff\"/><rect x=\"40\" y=\"62\" width=\"120\" height=\"78\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><polygon points=\"40,62 70,38 190,38 160,62\" fill=\"#cdd9ec\" stroke=\"#27406b\" stroke-width=\"2\"/><polygon points=\"160,62 190,38 190,116 160,140\" fill=\"#c0cde2\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"10\" y=\"172\" font-size=\"12\">Box 8×6×4 cm</text><rect x=\"200\" y=\"118\" width=\"22\" height=\"22\" fill=\"#dbe6f5\" stroke=\"#27406b\"/><text x=\"200\" y=\"158\" font-size=\"11\">cube 2 cm</text></svg>", "passage": null, "qnum": 46}, {"n": 51, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Statement: \"The Harbourview Museum should translate all of its exhibit labels into a second language, because doing so will noticeably increase the number of overseas tourists who visit.\" Proposed assumption: A meaningful number of overseas tourists currently choose not to visit the museum because the exhibit labels are written in only one language. Using ONLY the information in the statement, is this assumption logical?", "options": {"A": "No, the statement is really about translation costs, so tourist numbers are irrelevant to it.", "B": "Yes, the statement claims that adding a second language will noticeably increase overseas visitors, which only follows if the single-language labels are currently keeping a meaningful number of them away.", "C": "Yes, overseas tourists are well known to prefer attractions in their own language, so translation must attract them.", "D": "No, the museum board has not yet approved the translation budget, so no assumption can be made."}, "fig": "", "passage": null, "qnum": 47}, {"n": 52, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INFERENCE. Statement: \"Every applicant who was offered a place at Marlow Academy had also achieved a grade of at least 65 in the entrance portfolio. Priya achieved a grade of 58 in the entrance portfolio.\"\nWhich one of the following MUST be true?", "options": {"A": "Everyone who achieved at least 65 in the portfolio was offered a place.", "B": "Priya would have been offered a place if her portfolio grade had been seven marks higher.", "C": "Priya was not offered a place at Marlow Academy.", "D": "At least one applicant who was offered a place achieved exactly 65 in the portfolio."}, "fig": "", "passage": null, "qnum": 48}, {"n": 53, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INTERPRETATION. Statement: \"In a survey of 800 commuters, 55% said they cycle to work at least three days a week. Of those regular cyclists, 65% reported that their stress levels had fallen over the past year.\" Consider these conclusions:\n(1) A majority of the 800 commuters surveyed cycle to work at least three days a week.\n(2) Cycling regularly caused most of those cyclists' stress levels to fall. Which option correctly states which conclusions FOLLOW from the statement?", "options": {"A": "Conclusion 1 follows; Conclusion 2 does not follow.", "B": "Both Conclusion 1 and Conclusion 2 follow.", "C": "Neither conclusion follows.", "D": "Conclusion 2 follows; Conclusion 1 does not follow."}, "fig": "", "passage": null, "qnum": 49}, {"n": 54, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the school keep its library open until 8 p.m. on weeknights?\"\nWhich of the following is the STRONGEST argument?", "options": {"A": "No, I personally never use the library in the evening, so I doubt anyone else really needs it open that late.", "B": "Yes, keeping the library open longer would make our school look more impressive than the school across the road.", "C": "No, the librarian would probably prefer to go home earlier, and it isn't fair to make her stay.", "D": "Yes, a one-term trial of late opening last year showed average daily library use rose by 45%, and a student survey found most students used the extra hours to study."}, "fig": "", "passage": null, "qnum": 50}, {"n": 55, "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 簡体.)"}, {"n": 56, "type": "mcq", "section": "Chinese", "stem": "根據文章，外公小鋪門口木牌上「補書，亦補心」這句話，最主要想表達甚麼？ <br><span style=\"color:#555\">根据文章，外公小铺门口木牌上「补书，亦补心」这句话，最主要想表达什么？</span>", "options": {"A": "修書不只是修復紙頁，更是為人守護回憶與情感<br><span style=\"color:#555\">修书不只是修复纸页，更是为人守护回忆与情感</span>", "B": "外公既會修補書本，也兼營心理輔導的生意<br><span style=\"color:#555\">外公既会修补书本，也兼营心理辅导的生意</span>", "C": "提醒顧客修書價格昂貴，要有心理準備<br><span style=\"color:#555\">提醒顾客修书价格昂贵，要有心理准备</span>", "D": "外公希望藉招牌吸引更多年輕顧客上門<br><span style=\"color:#555\">外公希望借招牌吸引更多年轻顾客上门</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>外公是鎮上有名的「修書匠」。他的小鋪藏在巷子最深處，門口掛着一塊褪了色的木牌，上面寫着「補書，亦補心」四個字。鋪子裏堆滿了泛黃的舊書，空氣中浮着一股淡淡的舊紙與漿糊的氣味。每天清晨，外公都會戴上老花鏡，把一本本破損的書攤在桌上，先用毛刷輕輕掃去灰塵，再用細針麻線一頁一頁地縫補。鄰居都說，這年頭書壞了就買新的，何苦花這麼多工夫？外公卻總是笑而不語。<br>有一回，一位白髮蒼蒼的老婆婆捧着一本散了架的相冊般的舊書找上門來，說那是亡夫留下的唯一念想。外公接過書，足足修了三個晚上，連封面那道裂痕也補得幾乎看不出來。老婆婆取回書時，眼眶都紅了，連聲道謝。外公只淡淡地說：「書裏裝的不只是字，還有人的念想，修書，就是替人把記憶縫回去。」<br>那一刻我才明白，木牌上「亦補心」三個字的分量。如今外公的手已不如從前靈巧，可那盞昏黃的燈，至今仍在巷子深處，靜靜地亮着。</div><div><em>簡体</em><br>外公是镇上有名的「修书匠」。他的小铺藏在巷子最深处，门口挂着一块褪了色的木牌，上面写着「补书，亦补心」四个字。铺子里堆满了泛黄的旧书，空气中浮着一股淡淡的旧纸与浆糊的气味。每天清晨，外公都会戴上老花镜，把一本本破损的书摊在桌上，先用毛刷轻轻扫去灰尘，再用细针麻线一页一页地缝补。邻居都说，这年头书坏了就买新的，何苦花这么多工夫？外公却总是笑而不语。<br>有一回，一位白发苍苍的老婆婆捧着一本散了架的相册般的旧书找上门来，说那是亡夫留下的唯一念想。外公接过书，足足修了三个晚上，连封面那道裂痕也补得几乎看不出来。老婆婆取回书时，眼眶都红了，连声道谢。外公只淡淡地说：「书里装的不只是字，还有人的念想，修书，就是替人把记忆缝回去。」<br>那一刻我才明白，木牌上「亦补心」三个字的分量。如今外公的手已不如从前灵巧，可那盏昏黄的灯，至今仍在巷子深处，静静地亮着。</div>", "qnum": 51}, {"n": 57, "type": "mcq", "section": "Chinese", "stem": "面對鄰居「何苦花這麼多工夫」的質疑，外公「總是笑而不語」，這反映他怎樣的態度？ <br><span style=\"color:#555\">面对邻居「何苦花这么多工夫」的质疑，外公「总是笑而不语」，这反映他怎样的态度？</span>", "options": {"A": "因為被人看輕而生氣，不願多作解釋<br><span style=\"color:#555\">因为被人看轻而生气，不愿多作解释</span>", "B": "其實也認同鄰居，只是不好意思承認<br><span style=\"color:#555\">其实也认同邻居，只是不好意思承认</span>", "C": "對自己堅持的事心中有數，無須爭辯<br><span style=\"color:#555\">对自己坚持的事心中有数，无须争辩</span>", "D": "聽不懂鄰居在說甚麼，只好含糊應對<br><span style=\"color:#555\">听不懂邻居在说什么，只好含糊应对</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>外公是鎮上有名的「修書匠」。他的小鋪藏在巷子最深處，門口掛着一塊褪了色的木牌，上面寫着「補書，亦補心」四個字。鋪子裏堆滿了泛黃的舊書，空氣中浮着一股淡淡的舊紙與漿糊的氣味。每天清晨，外公都會戴上老花鏡，把一本本破損的書攤在桌上，先用毛刷輕輕掃去灰塵，再用細針麻線一頁一頁地縫補。鄰居都說，這年頭書壞了就買新的，何苦花這麼多工夫？外公卻總是笑而不語。<br>有一回，一位白髮蒼蒼的老婆婆捧着一本散了架的相冊般的舊書找上門來，說那是亡夫留下的唯一念想。外公接過書，足足修了三個晚上，連封 是： <br><span style=\"color:#555\">「～他事先做了充分准备，这次面试～能对答如流，从容过关。」横线上最合适的一组关联词是：</span>", "options": {"A": "雖然……但是……<br><span style=\"color:#555\">虽然……但是……</span>", "B": "如果……就……<br><span style=\"color:#555\">如果……就……</span>", "C": "因為……所以……<br><span style=\"color:#555\">因为……所以……</span>", "D": "不是……而是……<br><span style=\"color:#555\">不是……而是……</span>"}, "fig": "", "passage": null, "qnum": 63}, {"n": 69, "type": "info", "title": "中文寫作 Chinese Writing", "body": "<div class='info-body'>在正式考試中，中文寫作為紙筆作答，以下兩題<b>二選一</b>。此頁僅供參考，你不需要在此輸入答案。<br>In the real test, Chinese writing is done on paper, <b>choose one</b> of the two prompts below. This page is for reference only; you don't need to type anything here.</div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 1 / 题目 1</b><br>《一次令我成長的經歷》, , 記敘一件對你影響深遠的事，並談談你的反思與成長（不少於 12 句）。<br><span style='color:#555'>《一次令我成长的经历》, , 记叙一件对你影响深远的事，并谈谈你的反思与成长（不少于 12 句）。</span></div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 2 / 题目 2</b><br>《談堅持》, , 以「堅持」為題，談談你的看法，並舉例加以說明（不少於 12 句）。<br><span style='color:#555'>《谈坚持》, , 以「坚持」为题，谈谈你的看法，并举例加以说明（不少于 12 句）。</span></div>"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 (V2)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
