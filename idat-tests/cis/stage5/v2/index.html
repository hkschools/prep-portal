<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>IDAT CIS: Stage 5 (V2)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word reluctant in the sentence below?\n\nThe new student was reluctant to join the debate club, even though her teachers encouraged her.", "options": {"A": "forbidden", "B": "unwilling", "C": "unable", "D": "delighted"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that punctuates the sentence correctly.", "options": {"A": "We packed three things for the hike: water, a map, and sunscreen.", "B": "We packed three things for the hike; water, a map, and sunscreen.", "C": "We packed three things for the hike, water, a map and sunscreen.", "D": "We packed three things: for the hike, water, a map and sunscreen."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.\n\nThe committee found the proposal entirely _____.", "options": {"A": "acceptible", "B": "exceptable", "C": "acceptable", "D": "acceptabel"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the linking word that best fits the sentence.\n\nThe experiment was carefully designed; _____, the results were inconclusive.", "options": {"A": "therefore", "B": "likewise", "C": "for example", "D": "nevertheless"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nWhen the manager promised another bonus, the staff took it <u>with a pinch of salt</u>.", "options": {"A": "with great excitement", "B": "with some doubt or scepticism", "C": "with cautious acceptance", "D": "with anger and resentment"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which version of the sentence is grammatically correct?", "options": {"A": "Neither the teacher nor the students was aware of the change.", "B": "Neither the teacher or the students were aware of the change.", "C": "Neither the teacher nor the students were aware of the change.", "D": "Neither the teacher nor the students is aware of the change."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word meticulous in the sentence below?\n\nThe architect was meticulous, checking every measurement twice before approving the plan.", "options": {"A": "extremely careful and precise", "B": "slow and indecisive", "C": "anxious and fearful", "D": "talented and creative"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the option that uses the semi-colon correctly.", "options": {"A": "The rain stopped at noon; because the pitch was wet.", "B": "The rain stopped at noon; and the players returned to the pitch.", "C": "Although the rain stopped at noon; the players waited.", "D": "The rain stopped at noon; the players returned to the pitch immediately."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which sentence uses a euphemism for dismissing workers?", "options": {"A": "The company announced it would be firing two hundred workers.", "B": "The company announced it would be dismissing two hundred workers.", "C": "The company announced it would be letting go of two hundred workers.", "D": "The company announced it would be making two hundred workers redundant."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\n\n(A) Each of the runners (B) have collected (C) their numbers (D) before the race.", "options": {"A": "(D)", "B": "(B)", "C": "(C)", "D": "(A)"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Which literary device is used in the sentence below?\n\nThe thunder grumbled angrily across the valley.", "options": {"A": "metaphor", "B": "simile", "C": "hyperbole", "D": "personification"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Choose the linking word that best fits the sentence.\n\nThe entrance fee was raised twice this year. _____, attendance has continued to climb.", "options": {"A": "However", "B": "Therefore", "C": "Consequently", "D": "In addition"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word ambivalent in the sentence below?\n\nShe felt ambivalent about moving abroad, excited by the adventure yet sad to leave her friends.", "options": {"A": "completely opposed", "B": "having mixed feelings", "C": "entirely enthusiastic", "D": "deeply confused"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which version of the sentence is correctly written?", "options": {"A": "Having finished her homework, the television was switched on by Mia.", "B": "Having finished her homework, the television Mia switched on.", "C": "Having finished her homework, Mia switched on the television.", "D": "Having finished her homework the television was switched on."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which option rewrites the underlined slang in formal English?\n\nThe critics said the film was <u>a flop</u>.", "options": {"A": "a masterpiece", "B": "a sequel", "C": "a rehearsal", "D": "a failure"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Choose the conjunction that best completes the sentence.\n\n_____ the report was thorough, it failed to suggest any practical solutions.", "options": {"A": "Although", "B": "Because", "C": "So that", "D": "Unless"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "All four words describe someone who spends very little money. Which one carries the most disapproving tone?", "options": {"A": "thrifty", "B": "stingy", "C": "economical", "D": "frugal"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Choose the sentence with correct apostrophe use.", "options": {"A": "The childrens' coats were left in the hall, and its label had fallen off.", "B": "The childrens coats were left in the hall, and it's label had fallen off.", "C": "The children's coats were left in the hall, and its label had fallen off.", "D": "The childrens' coats were left in the hall, and it's label had fallen off."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nAfter weeks of secrecy, the manager finally <u>let the cat out of the bag</u> about the merger.", "options": {"A": "lost his temper", "B": "created a problem", "C": "changed his mind", "D": "revealed a secret"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Which sentence is the most appropriate for a formal letter of complaint?", "options": {"A": "I am writing to express my dissatisfaction with the service I received.", "B": "I want to let you know that your service was pretty disappointing.", "C": "Just letting you know the service was a total letdown.", "D": "FYI, your service was nowhere near good enough."}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nThe silence in the empty hall was <u>deafening</u>.", "options": {"A": "metaphor", "B": "oxymoron", "C": "simile", "D": "personification"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\n\nThe scientists (A) who discovered the comet (B) was awarded (C) a major prize (D) last year.", "options": {"A": "(D)", "B": "(A)", "C": "(B)", "D": "(C)"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word pragmatic in the sentence below?\n\nRather than chasing an ideal solution, the team took a pragmatic approach and fixed what they could.", "options": {"A": "idealistic and ambitious", "B": "careless and hasty", "C": "cautious and fearful", "D": "practical and realistic"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "Choose the sentence with correct parallel structure.", "options": {"A": "Good revision means reading the notes, testing yourself, and explaining ideas aloud.", "B": "Good revision means reading the notes, to test yourself, and explaining ideas aloud.", "C": "Good revision means reading the notes, a self-test, and to explain ideas aloud.", "D": "Good revision means to read the notes, testing yourself, and you explain ideas aloud."}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "In which sentence does the word keen carry the same meaning as in: 'She has a keen eye for detail'?", "options": {"A": "The wind was so keen it stung our faces.", "B": "He has a keen sense of which colours work together.", "C": "The knife had a keen edge after sharpening.", "D": "There was keen competition for the scholarship."}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which version of the sentence is grammatically correct?", "options": {"A": "Every student must bring their own calculator, and they should label them clearly.", "B": "Every student must bring his or her own calculator and label them clearly.", "C": "Every student must bring his or her own calculator and label it clearly.", "D": "Every students must bring his or her own calculator and label it clearly."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "According to this writer, why is a cashless system safer than cash?", "options": {"A": "It allows the school to serve healthier food.", "B": "It makes the lunch queue move more quickly.", "C": "It is cheaper for the school to set up.", "D": "A registered card cannot be spent by anyone else if it is lost."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>Our school should switch its cafeteria to a fully cashless system, where every student taps a card or phone to pay. The advantages are too great to ignore. First, queues would move far faster: no one would fumble for coins or wait for change, so more students could be served in the short lunch break. Second, a cashless system is safer. Cash can be lost, stolen, or forgotten at home, leaving a hungry student with nothing; a registered card cannot be spent by anyone else and can be topped up online by a parent in seconds.\n\nThere is a health benefit too. When payments are digital, the school can see exactly what is being bought and can gently steer choices, for example by letting families block fizzy drinks from their child's account. Critics warn that some students have no card, but the school could simply issue one to everyone, free of charge. The small cost of setting up the system would soon be repaid in time saved and worry avoided. A cashless cafeteria is not a luxury; it is the obvious next step for a modern school.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "How does the writer deal with the objection that some students have no card?", "options": {"A": "By proposing that the school issue a free card to everyone.", "B": "By ignoring the objection completely.", "C": "By admitting it is a reason to keep cash.", "D": "By claiming no student would ever lack a card."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>Our school should switch its cafeteria to a fully cashless system, where every student taps a card or phone to pay. The advantages are too great to ignore. First, queues would move far faster: no one would fumble for coins or wait for change, so more students could be served in the short lunch break. Second, a cashless system is safer. Cash can be lost, stolen, or forgotten at home, leaving a hungry student with nothing; a registered card cannot be spent by anyone else and can be topped up online by a parent in seconds.\n\nThere is a health benefit too. When payments are digital, the school can see exactly what is being bought and can gently steer choices, for example by letting families block fizzy drinks from their child's account. Critics warn that some students have no card, but the school could simply issue one to everyone, free of charge. The small cost of setting up the system would soon be repaid in time saved and worry avoided. A cashless cafeteria is not a luxury; it is the obvious next step for a modern school.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word steer as it is used in: 'the school can gently steer choices'?", "options": {"A": "record", "B": "guide or influence", "C": "forbid outright", "D": "advertise"}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>Our school should switch its cafeteria to a fully cashless system, where every student taps a card or phone to pay. The advantages are too great to ignore. First, queues would move far faster: no one would fumble for coins or wait for change, so more students could be served in the short lunch break. Second, a cashless system is safer. Cash can be lost, stolen, or forgotten at home, leaving a hungry student with nothing; a registered card cannot be spent by anyone else and can be topped up online by a parent in seconds.\n\nThere is a health benefit too. When payments are digital, the school can see exactly what is being bought and can gently steer choices, for example by letting families block fizzy drinks from their child's account. Critics warn that some students have no card, but the school could simply issue one to everyone, free of charge. The small cost of setting up the system would soon be repaid in time saved and worry avoided. A cashless cafeteria is not a luxury; it is the obvious next step for a modern school.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "Look at the final sentence: 'A cashless cafeteria is not a luxury; it is the obvious next step for a modern school.' What is the main effect of calling it 'the obvious next step'?", "options": {"A": "It admits the idea is risky and untested.", "B": "It provides statistical proof that the system works.", "C": "It pressures the reader to agree by making disagreement seem old-fashioned.", "D": "It changes the subject away from cafeterias."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>Our school should switch its cafeteria to a fully cashless system, where every student taps a card or phone to pay. The advantages are too great to ignore. First, queues would move far faster: no one would fumble for coins or wait for change, so more students could be served in the short lunch break. Second, a cashless system is safer. Cash can be lost, stolen, or forgotten at home, leaving a hungry student with nothing; a registered card cannot be spent by anyone else and can be topped up online by a parent in seconds.\n\nThere is a health benefit too. When payments are digital, the school can see exactly what is being bought and can gently steer choices, for example by letting families block fizzy drinks from their child's account. Critics warn that some students have no card, but the school could simply issue one to everyone, free of charge. The small cost of setting up the system would soon be repaid in time saved and worry avoided. A cashless cafeteria is not a luxury; it is the obvious next step for a modern school.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "Which sentence best summarises the FIRST writer's overall point of view?", "options": {"A": "A cashless cafeteria is clearly worth adopting, and its drawbacks can be solved.", "B": "A cashless cafeteria sounds modern but creates more problems than it solves.", "C": "Schools should keep cash because digital systems are unsafe.", "D": "The choice between cash and cards does not really matter."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>Our school should switch its cafeteria to a fully cashless system, where every student taps a card or phone to pay. The advantages are too great to ignore. First, queues would move far faster: no one would fumble for coins or wait for change, so more students could be served in the short lunch break. Second, a cashless system is safer. Cash can be lost, stolen, or forgotten at home, leaving a hungry student with nothing; a registered card cannot be spent by anyone else and can be topped up online by a parent in seconds.\n\nThere is a health benefit too. When payments are digital, the school can see exactly what is being bought and can gently steer choices, for example by letting families block fizzy drinks from their child's account. Critics warn that some students have no card, but the school could simply issue one to everyone, free of charge. The small cost of setting up the system would soon be repaid in time saved and worry avoided. A cashless cafeteria is not a luxury; it is the obvious next step for a modern school.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "According to this writer, what happens to speed when the cashless system crashes?", "options": {"A": "Students pay with coins instead.", "B": "The school refunds the lost money.", "C": "The whole queue grinds to a halt and no one can buy lunch.", "D": "Lunch is served more slowly but still continues."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>A fully cashless cafeteria sounds modern, but our school should think again before scrapping cash. The promised benefits hide real costs. Speed, for instance, depends on the network: when the system crashes, as school systems often do, the whole queue grinds to a halt and no one can buy lunch at all. With coins, a broken till is a minor nuisance; with a cashless system, a single fault can leave hundreds of students unfed.\n\nThere is a fairness problem too. Not every family can top up an account online the moment it runs low, and a child whose balance hits zero may be turned away in front of friends, a quiet humiliation that cash never caused. Supporters say cards could be issued free, but the cards still need money loaded onto them, and that is exactly where some families struggle.\n\nFinally, tracking every purchase raises a privacy question. Do we really want a record of everything a fourteen-year-old eats? Cash teaches young people to handle money responsibly and keeps their small daily choices their own. Before we hand the lunch queue to a computer, we should ask what we are giving up.", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "Why does the second writer mention 'a quiet humiliation that cash never caused'?", "options": {"A": "To argue that cash is faster than cards.", "B": "To prove that all students dislike cashless systems.", "C": "To explain how the privacy of purchases is protected.", "D": "To suggest the cashless system could embarrass poorer students publicly."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>A fully cashless cafeteria sounds modern, but our school should think again before scrapping cash. The promised benefits hide real costs. Speed, for instance, depends on the network: when the system crashes, as school systems often do, the whole queue grinds to a halt and no one can buy lunch at all. With coins, a broken till is a minor nuisance; with a cashless system, a single fault can leave hundreds of students unfed.\n\nThere is a fairness problem too. Not every family can top up an account online the moment it runs low, and a child whose balance hits zero may be turned away in front of friends, a quiet humiliation that cash never caused. Supporters say cards could be issued free, but the cards still need money loaded onto them, and that is exactly where some families struggle.\n\nFinally, tracking every purchase raises a privacy question. Do we really want a record of everything a fourteen-year-old eats? Cash teaches young people to handle money responsibly and keeps their small daily choices their own. Before we hand the lunch queue to a computer, we should ask what we are giving up.", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "Both writers discuss issuing free cards to every student. How do their views differ?", "options": {"A": "The first sees free cards as a full solution; the second argues the cards still need money loaded onto them.", "B": "The first opposes free cards; the second strongly supports them.", "C": "Both agree free cards completely solve the fairness problem.", "D": "Neither writer mentions free cards at all."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>A fully cashless cafeteria sounds modern, but our school should think again before scrapping cash. The promised benefits hide real costs. Speed, for instance, depends on the network: when the system crashes, as school systems often do, the whole queue grinds to a halt and no one can buy lunch at all. With coins, a broken till is a minor nuisance; with a cashless system, a single fault can leave hundreds of students unfed.\n\nThere is a fairness problem too. Not every family can top up an account online the moment it runs low, and a child whose balance hits zero may be turned away in front of friends, a quiet humiliation that cash never caused. Supporters say cards could be issued free, but the cards still need money loaded onto them, and that is exactly where some families struggle.\n\nFinally, tracking every purchase raises a privacy question. Do we really want a record of everything a fourteen-year-old eats? Cash teaches young people to handle money responsibly and keeps their small daily choices their own. Before we hand the lunch queue to a computer, we should ask what we are giving up.", "qnum": "34"}, {"n": "36", "type": "mcq", "section": "English", "stem": "Which concern is raised by the AGAINST writer but NOT by the FOR writer?", "options": {"A": "That queues should move quickly.", "B": "That parents can top up an account online.", "C": "That cards can be issued to every student.", "D": "That tracking every purchase raises a question about privacy."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>A fully cashless cafeteria sounds modern, but our school should think again before scrapping cash. The promised benefits hide real costs. Speed, for instance, depends on the network: when the system crashes, as school systems often do, the whole queue grinds to a halt and no one can buy lunch at all. With coins, a broken till is a minor nuisance; with a cashless system, a single fault can leave hundreds of students unfed.\n\nThere is a fairness problem too. Not every family can top up an account online the moment it runs low, and a child whose balance hits zero may be turned away in front of friends, a quiet humiliation that cash never caused. Supporters say cards could be issued free, but the cards still need money loaded onto them, and that is exactly where some families struggle.\n\nFinally, tracking every purchase raises a privacy question. Do we really want a record of everything a fourteen-year-old eats? Cash teaches young people to handle money responsibly and keeps their small daily choices their own. Before we hand the lunch queue to a computer, we should ask what we are giving up.", "qnum": "35"}, {"n": "37", "type": "mcq", "section": "English", "stem": "Which statement best describes how the two writers treat the speed of service?", "options": {"A": "Both writers agree that speed is unimportant either way.", "B": "The first treats faster queues as a clear benefit, while the second argues speed collapses entirely if the network fails.", "C": "The first writer ignores speed, while the second praises it.", "D": "Both writers use speed to argue against going cashless."}, "fig": "", "passage": "<strong>Should School Cafeterias Go Cashless? Two Views</strong><br>A fully cashless cafeteria sounds modern, but our school should think again before scrapping cash. The promised benefits hide real costs. Speed, for instance, depends on the network: when the system crashes, as school systems often do, the whole queue grinds to a halt and no one can buy lunch at all. With coins, a broken till is a minor nuisance; with a cashless system, a single fault can leave hundreds of students unfed.\n\nThere is a fairness problem too. Not every family can top up an account online the moment it runs low, and a child whose balance hits zero may be turned away in front of friends, a quiet humiliation that cash never caused. Supporters say cards could be issued free, but the cards still need money loaded onto them, and that is exactly where some families struggle.\n\nFinally, tracking every purchase raises a privacy question. Do we really want a record of everything a fourteen-year-old eats? Cash teaches young people to handle money responsibly and keeps their small daily choices their own. Before we hand the lunch queue to a computer, we should ask what we are giving up.", "qnum": "36"}, {"n": "38", "type": "writing", "section": "English Writing", "intro": "This is a personal-opinion essay. You answer ONE of the two topics above, typing your response on the keyboard. There is no single correct answer; you are assessed on the clarity of your viewpoint, the quality of your reasoning and examples, your organisation across introduction, body and conclusion, and your control of vocabulary, grammar and punctuation. Use precise vocabulary, varied sentence structures, and at least one correctly punctuated colon or semi-colon.", "label": "", "body": "Choose ONE of the following: (1) Some people believe that students learn more from their failures than from their successes. Do you agree? Give your opinion and support it with reasons and examples. (2) Many schools are considering replacing printed textbooks entirely with digital devices. Do you think this is a good idea? Give your opinion and support it with reasons and examples.", "hint": "Write a structured essay: introduction, 2-3 body paragraphs, conclusion.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "39", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A line has equation 9x − 3y = 15. Find the equation of the line parallel to it that passes through the point (1, −4).", "options": {"A": "y = 3x − 7", "B": "y = −1/3 x − 11/3", "C": "y = −3x − 1", "D": "y = 3x − 4"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the line perpendicular to y = 3/4 x + 2 that passes through the point (6, 1).", "options": {"A": "y = 3/4 x − 7/2", "B": "y = −4/3 x + 9", "C": "y = 4/3 x − 7", "D": "y = −3/4 x + 11/2"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the straight line passing through the points (−3, 7) and (3, −5).", "options": {"A": "y = −2x + 13", "B": "y = 2x + 1", "C": "y = −2x + 1", "D": "y = −1/2 x + 11/2"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "43", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the line with gradient −3/4 that passes through the point (4, −1).", "options": {"A": "y = −3/4 x − 1", "B": "y = 4/3 x − 19/3", "C": "y = −3/4 x + 2", "D": "y = −3/4 x + 3"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Triangles A and B are similar. In triangle A the base is 8 cm and the height is 6 cm; the corresponding base in triangle B is 20 cm. Find the height y of triangle B.", "options": {"A": "18 cm", "B": "26 cm", "C": "2.4 cm", "D": "15 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"420\" height=\"220\" viewBox=\"0 0 420 220\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"420\" height=\"220\" fill=\"white\"/><polygon points=\"40,150 110,150 40,95\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"40\" y=\"138\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1\"/><text x=\"75\" y=\"168\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">8</text><text x=\"30\" y=\"122\" font-size=\"13\" text-anchor=\"end\" fill=\"#333\">6</text><polygon points=\"230,175 370,175 230,65\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"230\" y=\"163\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1\"/><text x=\"300\" y=\"193\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">20</text><text x=\"220\" y=\"120\" font-size=\"13\" text-anchor=\"end\" fill=\"#C00\">?</text></svg>", "passage": "", "qnum": "5"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two similar bottles have heights 12 cm and 18 cm. The smaller bottle holds 320 ml. Find the capacity of the larger bottle.", "options": {"A": "480 ml", "B": "720 ml", "C": "1080 ml", "D": "213.3 ml"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two similar rectangles have corresponding sides 6 cm and 21 cm. What is the scale factor from the smaller to the larger?", "options": {"A": "15", "B": "12.25", "C": "0.286", "D": "3.5"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "47", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two similar figures have areas in the ratio 25 : 64. What is the ratio of their corresponding lengths?", "options": {"A": "25 : 64", "B": "8 : 5", "C": "625 : 4096", "D": "5 : 8"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "48", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify fully: (15x⁴y³) ÷ (5x²y).", "options": {"A": "3x²y²", "B": "10x²y²", "C": "3x⁴y²", "D": "3x²y³"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "49", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Expand and simplify: (3x − 2)(x + 5) − x(x − 3).", "options": {"A": "2x² + 16x − 10", "B": "2x² + 10x − 10", "C": "4x² + 16x − 10", "D": "2x² + 16x + 10"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "50", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A square-based pyramid has a base edge of 6 cm and a vertical height of 4 cm. First find the slant height, then find the total surface area.", "options": {"A": "96 cm²", "B": "60 cm²", "C": "84 cm²", "D": "36 cm²"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><polygon points=\"40,150 150,150 180,120 70,120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"40,150 110,40 180,120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\" opacity=\"0.85\"/><path d=\"M70,120 L110,40 M150,150 L110,40\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "11"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A solid cylinder has radius 3 cm and height 7 cm. Using π ≈ 3.14, find its volume to 1 decimal place.", "options": {"A": "65.9 cm³", "B": "791.3 cm³", "C": "131.9 cm³", "D": "197.8 cm³"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"300\" viewBox=\"0 0 300 300\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"300\" fill=\"white\"/><ellipse cx=\"100\" cy=\"230\" rx=\"64\" ry=\"20\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"36\" y=\"60\" width=\"128\" height=\"170\" fill=\"#EAF0FA\" stroke=\"none\"/><line x1=\"36\" y1=\"60\" x2=\"36\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"164\" y1=\"60\" x2=\"164\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M36,230 A64,20 0 0 0 164,230\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><ellipse cx=\"100\" cy=\"60\" rx=\"64\" ry=\"20\" fill=\"#DCE6F6\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"100\" y1=\"60\" x2=\"164\" y2=\"60\" stroke=\"#C00\" stroke-width=\"1.5\"/><text x=\"132\" y=\"53\" font-size=\"13\" text-anchor=\"middle\" fill=\"#C00\">r = 3 cm</text><line x1=\"180\" y1=\"60\" x2=\"180\" y2=\"230\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"186\" y=\"145\" font-size=\"13\" fill=\"#333\">h = 7 cm</text></svg>", "passage": "", "qnum": "12"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sphere has radius 3 cm. Using V = 4/3 πr³ with π ≈ 3.14, find its volume to 1 decimal place.", "options": {"A": "56.5 cm³", "B": "113.0 cm³", "C": "84.8 cm³", "D": "36.0 cm³"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A frequency table records the number of emails received per day over 20 days: 1 email (5 days), 2 emails (8 days), 3 emails (4 days), 4 emails (3 days). Find the mean number of emails per day.", "options": {"A": "2.5", "B": "2.25", "C": "45", "D": "11.25"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the median of the data set: 23, 8, 15, 4, 19, 11, 27.", "options": {"A": "15", "B": "11", "C": "19", "D": "4"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Over a week a shop records daily sales of a jacket: 7, 7, 7, 10, 13, 16, 19. Which average best describes the most typical (most frequently occurring) number sold, and what is its value?", "options": {"A": "Mean, 11.3", "B": "Median, 10", "C": "Mode, 7", "D": "Range, 12"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "For the ordered data 3, 7, 8, 12, 15, 19, 22, 25, 30, find the interquartile range.", "options": {"A": "27", "B": "16", "C": "7.5", "D": "23.5"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A right-angled triangle has a hypotenuse of 15 cm, and one of the acute angles is 40°. Find the length of the side adjacent to the 40° angle, to 1 decimal place.", "options": {"A": "9.6 cm", "B": "11.5 cm", "C": "12.6 cm", "D": "19.6 cm"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Line L has equation y = 5x + 2. Find the equation of the line parallel to L that passes through the point (3, 4).", "options": {"A": "y = 5x + 4", "B": "y = −1/5 x + 23/5", "C": "y = 5x − 11", "D": "y = 5x + 2"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the sequence: 3, 8, 15, 24, 35, ___. What is the next term?", "options": {"A": "44", "B": "48", "C": "46", "D": "45"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Read these statements as a closed logic puzzle and use ONLY the rules given, not real-world meaning: 'All zarns are mips. No mips are voks.' Which conclusion MUST be true?", "options": {"A": "Some zarns are voks.", "B": "All voks are mips.", "C": "No zarns are mips.", "D": "No zarns are voks."}, "fig": "", "passage": "", "qnum": "21"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Daniel wants to save $600 over 5 months for a music course. He earns $170 a month from a weekend job and already spends $98 a month on transport and lunches. If he keeps that spending, can he meet his goal on time, and what is the most he can actually save each month?", "options": {"A": "Yes — he needs $120 a month and can manage it.", "B": "Yes — he only needs $72 a month.", "C": "No — he needs $120 a month but can save at most $72.", "D": "No — he falls $48 short each month and cannot make the goal on time."}, "fig": "", "passage": "", "qnum": "22"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A flight leaves Hong Kong at 22:40 HKT and the journey takes 11 hours 50 minutes. London is 7 hours BEHIND Hong Kong. What is the local clock time in London when the flight lands?", "options": {"A": "03:30", "B": "10:30", "C": "17:30", "D": "02:30"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word can go BEFORE all three of these words to make a common compound word: ___FLOWER, ___GLASSES, ___RISE?", "options": {"A": "SUN", "B": "MOON", "C": "EYE", "D": "STAR"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Three of these tiles show the SAME L-shaped piece simply turned (rotated) to different positions. One tile is a mirror image (a reflection) and cannot be made by turning. Which tile is the odd one out?", "options": {"A": "Tile A", "B": "Tile B", "C": "Tile C", "D": "Tile D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"472\" height=\"150\" viewBox=\"0 0 472 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"472\" height=\"150\" fill=\"white\"/><g transform=\"rotate(90 59.0 60)\"><polygon points=\"40,29 60,29 60,69 80,69 80,89 40,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"59\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><g transform=\"rotate(180 177.0 60)\"><polygon points=\"158,29 178,29 178,69 198,69 198,89 158,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"177\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><g transform=\"translate(590.0 0) scale(-1 1)\"><polygon points=\"276,29 296,29 296,69 316,69 316,89 276,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"295\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><g transform=\"rotate(270 413.0 60)\"><polygon points=\"394,29 414,29 414,69 434,69 434,89 394,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"413\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "25"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The figure shows a flat net of six squares, labelled P, Q, R, S, T and U, that folds up into a cube. The four squares Q, R, S, T sit in a row; P is attached above R and U is attached below R. When the net is folded into the cube, which face ends up DIRECTLY OPPOSITE face R?", "options": {"A": "Face P", "B": "Face Q", "C": "Face S", "D": "Face T"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"Our school should install solar panels on the roof, because within seven years the savings on electricity bills will completely pay back the cost of the panels.\"\n\nProposed assumption: The school will still be operating in that same building seven years from now.\n\nUsing only the information in the statement, is this assumption logical (i.e., must the argument depend on it)?", "options": {"A": "Yes, the argument's claim that the panels \"pay back\" their cost over seven years only makes sense if the school is still there to collect those seven years of savings.", "B": "No, the statement never mentions moving buildings, so we cannot assume anything about the school's future location.", "C": "No, the statement is about saving money, and money can be saved regardless of which building the school occupies.", "D": "Yes, the school is the kind of institution that plans for the long term, so it is bound to remain in the building for at least seven years."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"Every candidate awarded a place on the orchestra's touring ensemble passed the Grade 8 music examination. Mei has not passed the Grade 8 music examination.\"\n\nWhich one of the following MUST be true on the basis of this statement?", "options": {"A": "Mei is not a skilful musician.", "B": "Anyone who has passed the Grade 8 examination was awarded a place on the touring ensemble.", "C": "Mei would have been awarded a place if she had passed the Grade 8 examination.", "D": "Mei was not awarded a place on the touring ensemble."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Statement: \"A survey of 1,000 commuters in a city found that 62% who cycle to work reported feeling 'energetic' on arrival, compared with 31% of those who travel by car. The survey was conducted on a single fine-weather morning in June.\"\n\nConclusion 1: Among the commuters surveyed, a higher proportion of cyclists than car-travellers reported feeling energetic on arrival.\nConclusion 2: Cycling to work causes people to feel more energetic than driving does.\n\nUsing only the information given, which conclusions FOLLOW?", "options": {"A": "Both Conclusion 1 and Conclusion 2 follow.", "B": "Conclusion 1 follows; Conclusion 2 does not follow.", "C": "Neither conclusion follows.", "D": "Conclusion 2 follows; Conclusion 1 does not follow."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Facts: \"All members of the debating club must take part in at least one public competition each year. Some members of the debating club are also in the school orchestra. No one in the school orchestra performs in public competitions during the autumn term.\"\n\nWhich one of the following conclusions does NOT follow from these facts?", "options": {"A": "Some members of the debating club do not perform in public competitions during the autumn term.", "B": "Every member of the debating club who is also in the orchestra must take part in a public competition at some point in the year outside the autumn term.", "C": "All members of the school orchestra are members of the debating club.", "D": "At least one student must, during the year, both compete in a public competition and belong to the orchestra."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Question: \"Should a city introduce a charge for driving private cars into its busiest downtown district during rush hour?\"\n\nWhich one of the following is the STRONGEST argument?", "options": {"A": "No, I once sat in a traffic jam for an hour after a new road charge was introduced in another city, so these charges clearly do not work.", "B": "No, driving into the city is a basic freedom, and no government has any right to tell people where they may take their own car.", "C": "Yes, anyone who opposes a driving charge obviously does not care about the health of children breathing polluted air.", "D": "Yes, in three comparable cities that introduced such a charge, independent transport studies recorded a 20 to 30% fall in rush-hour traffic and measurable reductions in roadside air pollution within two years."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two short texts discuss the same new study on screen time and children's sleep.\n\nSource 1 (a news website headline and opening line): \"SHOCK STUDY: Phones Are WRECKING Your Child's Sleep! Experts say bedtime scrolling could be ruining a whole generation's health, and parents are right to be terrified.\"\n\nSource 2 (the abstract of the study itself): \"In a sample of 480 children aged 10 to 13, each additional hour of screen use after 8 p.m. was associated with an average of 14 fewer minutes of sleep. The authors note the design was observational and cannot establish cause, and call for controlled follow-up studies.\"\n\nA teacher wants to advise parents accurately about what the study actually shows. Which source is more credible for that purpose, and why?", "options": {"A": "Source 2, because it reports the specific sample size and measured effect and openly states the study's limits, whereas Source 1 overstates the findings with alarming, emotive language.", "B": "Source 1, because its confident, emotional language shows the authors feel strongly, and strong feeling is a sign that the writers are sure of their facts.", "C": "Source 1, because it is written in plain, punchy language that is easy to read, and a source that is easier to read is more reliable than one full of technical terms.", "D": "Both are equally credible, because they report on the very same study, so the underlying facts must be identical in each."}, "fig": "", "passage": "", "qnum": "32"}, {"n": "72", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "文中說李師傅刻印「一筆一畫從不肯草草了事」，這句話主要表現他甚麼？<br><span style=\"color:#555\">文中说李师傅刻印「一笔一画从不肯草草了事」，这句话主要表现他什么？</span>", "options": {"A": "他寫字的速度比別人慢<br><span style=\"color:#555\">他写字的速度比别人慢</span>", "B": "他只肯接刻字少的印章", "C": "他年紀大了，手腳變得遲緩<br><span style=\"color:#555\">他年纪大了，手脚变得迟缓</span>", "D": "他做事認真細緻，毫不馬虎<br><span style=\"color:#555\">他做事认真细致，毫不马虎</span>"}, "fig": "", "passage": "　　巷子深處有一爿小小的刻印鋪，門面不過容得下一張舊書桌。李師傅在這裏替人刻印章，已有四十個寒暑。他握刀的手布滿厚繭，每落一刀都凝神屏息，一筆一畫從不肯草草了事。從前，逢年過節，求印的人絡繹不絕，門前常常排起長隊；如今講求快捷，許多人寧可上街買一枚現成的膠章，肯花時間等一方手刻石印的，已寥寥可數。有人笑他守着這門老手藝，未免不合時宜，何苦自討苦吃。李師傅卻不以為意，只說刻印刻的不單是字，更是一份託付與心意，馬虎不得。窗外車聲喧囂，鋪子裏卻自有一方天地，安安靜靜，刀石相觸的輕響，像在低聲訴說着一段快要被人淡忘的舊日時光。<br><span style=\"color:#555\">　　巷子深处有一爿小小的刻印铺，门面不过容得下一张旧书桌。李师傅在这里替人刻印章，已有四十个寒暑。他握刀的手布满厚茧，每落一刀都凝神屏息，一笔一画从不肯草草了事。从前，逢年过节，求印的人络绎不绝，门前常常排起长队；如今讲求快捷，许多人宁可上街买一枚现成的胶章，肯花时间等一方手刻石印的，已寥寥可数。有人笑他守着这门老手艺，未免不合时宜，何苦自讨苦吃。李师傅却不以为意，只说刻印刻的不单是字，更是一份托付与心意，马虎不得。窗外车声喧嚣，铺子里却自有一方天地，安安静静，刀石相触的轻响，像在低声诉说着一段快要被人淡忘的旧日时光。</span>", "qnum": "1"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "文章說「肯花時間等一方手刻石印的，已寥寥可數」，這句話反映了甚麼現象？<br><span style=\"color:#555\">文章说「肯花时间等一方手刻石印的，已寥寥可数」，这句话反映了什么现象？</span>", "options": {"A": "石印的價錢愈來愈便宜<br><span style=\"color:#555\">石印的价钱越来越便宜</span>", "B": "人們講求快捷，願意等候手藝的人愈來愈少<br><span style=\"color:#555\">人们讲求快捷，愿意等候手艺的人越来越少</span>", "C": "李師傅刻印的速度愈來愈快<br><span style=\"color:#555\">李师傅刻印的速度越来越快</span>", "D": "求印的人比從前更有耐性<br><span style=\"color:#555\">求印的人比从前更有耐性</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "面對別人「何苦自討苦吃」的取笑，李師傅堅持手藝的真正原因是甚麼？<br><span style=\"color:#555\">面对别人「何苦自讨苦吃」的取笑，李师傅坚持手艺的真正原因是什么？</span>", "options": {"A": "他想藉此賺取更多金錢<br><span style=\"color:#555\">他想借此赚取更多金钱</span>", "B": "他不會做別的工作，只好繼續<br><span style=\"color:#555\">他不会做别的工作，只好继续</span>", "C": "他認為刻印承載着一份託付與心意，不能馬虎<br><span style=\"color:#555\">他认为刻印承载着一份托付与心意，不能马虎</span>", "D": "他想證明自己比年輕人更能幹<br><span style=\"color:#555\">他想证明自己比年轻人更能干</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "結尾把刻印鋪比作「自有一方天地」，又寫刀石輕響「像在低聲訴說」，這樣寫的用意是甚麼？<br><span style=\"color:#555\">结尾把刻印铺比作「自有一方天地」，又写刀石轻响「像在低声诉说」，这样写的用意是什么？</span>", "options": {"A": "說明鋪子隔音效果很好<br><span style=\"color:#555\">说明铺子隔音效果很好</span>", "B": "強調鋪子的面積其實很大<br><span style=\"color:#555\">强调铺子的面积其实很大</span>", "C": "暗示鋪子快要倒閉<br><span style=\"color:#555\">暗示铺子快要倒闭</span>", "D": "以鬧中取靜，烘托這門老手藝的寧靜與情味<br><span style=\"color:#555\">以闹中取静，烘托这门老手艺的宁静与情味</span>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "從全文看，作者對李師傅這門老手藝流露出怎樣的態度？<br><span style=\"color:#555\">从全文看，作者对李师傅这门老手艺流露出怎样的态度？</span>", "options": {"A": "覺得它落後過時，理應淘汰<br><span style=\"color:#555\">觉得它落后过时，理应淘汰</span>", "B": "珍視這份專注與心意，惋惜它漸被淡忘<br><span style=\"color:#555\">珍视这份专注与心意，惋惜它渐被淡忘</span>", "C": "完全客觀，不帶任何感情<br><span style=\"color:#555\">完全客观，不带任何感情</span>", "D": "認為堅持下去毫無意義<br><span style=\"color:#555\">认为坚持下去毫无意义</span>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "「求印的人絡繹不絕」中「絡繹不絕」一詞，最接近的意思是：<br><span style=\"color:#555\">「求印的人络绎不绝」中「络绎不绝」一词，最接近的意思是：</span>", "options": {"A": "人來人往、接連不斷<br><span style=\"color:#555\">人来人往、接连不断</span>", "B": "突然全部離去、空無一人<br><span style=\"color:#555\">突然全部离去、空无一人</span>", "C": "互相爭吵、秩序混亂<br><span style=\"color:#555\">互相争吵、秩序混乱</span>", "D": "排隊時悄無聲息<br><span style=\"color:#555\">排队时悄无声息</span>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "「未免不合時宜」中「不合時宜」的意思是：<br><span style=\"color:#555\">「未免不合时宜」中「不合时宜」的意思是：</span>", "options": {"A": "不符合當下的潮流與需要<br><span style=\"color:#555\">不符合当下的潮流与需要</span>", "B": "沒有看準時間、遲到了<br><span style=\"color:#555\">没有看准时间、迟到了</span>", "C": "天氣不適合外出<br><span style=\"color:#555\">天气不适合外出</span>", "D": "衣著穿得不夠得體<br><span style=\"color:#555\">衣着穿得不够得体</span>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "下列哪一句的量詞使用完全正確？<br><span style=\"color:#555\">下列哪一句的量词使用完全正确？</span>", "options": {"A": "桌上放着一顆印章和兩張印泥。<br><span style=\"color:#555\">桌上放着一颗印章和两张印泥。</span>", "B": "他點起一張油燈，照亮整間鋪子。<br><span style=\"color:#555\">他点起一张油灯，照亮整间铺子。</span>", "C": "牆上掛着一面舊匾和一幅對聯。<br><span style=\"color:#555\">墙上挂着一面旧匾和一幅对联。</span>", "D": "李師傅刻好一方石印，遞來一張收據。<br><span style=\"color:#555\">李师傅刻好一方石印，递来一张收据。</span>"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "樹木常用的量詞是哪一個？以巷口的老榕為例，最恰當的說法是：<br><span style=\"color:#555\">树木常用的量词是哪一个？以巷口的老榕为例，最恰当的说法是：</span>", "options": {"A": "一條老榕<br><span style=\"color:#555\">一条老榕</span>", "B": "一棵老榕", "C": "一座老榕", "D": "一頂老榕<br><span style=\"color:#555\">一顶老榕</span>"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "82", "type": "mcq", "section": "Chinese", "stem": "別人取笑李師傅守着老手藝「不過如此，____」，填入哪個成語最貼切？<br><span style=\"color:#555\">别人取笑李师傅守着老手艺「不过如此，____」，填入哪个成语最贴切？</span>", "options": {"A": "守口如瓶", "B": "錦上添花<br><span style=\"color:#555\">锦上添花</span>", "C": "雪中送炭", "D": "微不足道"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "「如今講求快捷，肯等手刻石印的人已____」，最適合填入的成語是：<br><span style=\"color:#555\">「如今讲求快捷，肯等手刻石印的人已____」，最适合填入的成语是：</span>", "options": {"A": "比比皆是", "B": "雨後春筍<br><span style=\"color:#555\">雨后春笋</span>", "C": "屈指可數<br><span style=\"color:#555\">屈指可数</span>", "D": "絡繹不絕<br><span style=\"color:#555\">络绎不绝</span>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "84", "type": "mcq", "section": "Chinese", "stem": "下列各句成語使用恰當的一項是：<br><span style=\"color:#555\">下列各句成语使用恰当的一项是：</span>", "options": {"A": "他刻印時心不在焉，所以每個筆畫都格外工整。<br><span style=\"color:#555\">他刻印时心不在焉，所以每个笔画都格外工整。</span>", "B": "這道題我一竅不通，所以答得又快又對。<br><span style=\"color:#555\">这道题我一窍不通，所以答得又快又对。</span>", "C": "他誇誇其談，可惜真要動手時甚麼都不會。<br><span style=\"color:#555\">他夸夸其谈，可惜真要动手时什么都不会。</span>", "D": "李師傅技藝精湛，街坊都對他望而生畏。<br><span style=\"color:#555\">李师傅技艺精湛，街坊都对他望而生畏。</span>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "下列句子沒有語病的一項是：<br><span style=\"color:#555\">下列句子没有语病的一项是：</span>", "options": {"A": "通過李師傅的講解，使我們明白了刻印的工序。<br><span style=\"color:#555\">通过李师傅的讲解，使我们明白了刻印的工序。</span>", "B": "為了留住這門老手藝，李師傅始終堅持手工刻印。<br><span style=\"color:#555\">为了留住这门老手艺，李师傅始终坚持手工刻印。</span>", "C": "他能否守住這門手藝，關鍵在於有沒有耐心是成功的保證。<br><span style=\"color:#555\">他能否守住这门手艺，关键在于有没有耐心是成功的保证。</span>", "D": "走進鋪子，撲面而來的墨香和刀石聲。<br><span style=\"color:#555\">走进铺子，扑面而来的墨香和刀石声。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "「他聽了別人的取笑，只是淡淡一笑，____低頭繼續刻他的印。」依文意，橫線上最恰當的關聯詞是：<br><span style=\"color:#555\">「他听了别人的取笑，只是淡淡一笑，____低头继续刻他的印。」依文意，横线上最恰当的关联词是：</span>", "options": {"A": "接着", "B": "卻<br><span style=\"color:#555\">却</span>", "C": "雖然<br><span style=\"color:#555\">虽然</span>", "D": "因為<br><span style=\"color:#555\">因为</span>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 (V2)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
