<head>

<title>IDAT CIS: Stage 5 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmXlzvpnHvxI5ILdACyHHZv8HWfNQ08pCP27GmmluJ7lUGiou1izR4e7Gs8LxKLtgo/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "1";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nThe award was shared between Priya and ____, since we had run the entire project together.", "options": {"A": "me", "B": "I", "C": "she", "D": "myself"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "Choose the option that uses the colon and semicolon correctly.", "options": {"A": "The committee reached one conclusion; the trial should continue: the evidence was too strong to ignore.", "B": "The committee reached one conclusion, the trial should continue; the evidence was too strong to ignore.", "C": "The committee reached one conclusion the trial should continue, the evidence was too strong to ignore.", "D": "The committee reached one conclusion: the trial should continue; the evidence was too strong to ignore."}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nNeither the manager nor the assistants ____ willing to approve the budget without further review.", "options": {"A": "was", "B": "were", "C": "is", "D": "has been"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "One underlined section contains an error. Choose the section that must be corrected.\n\nThe research team (A) have since revised its model, (B) although their findings (C) had already been published in (D) a leading journal.", "options": {"A": "have since revised its model", "B": "although their findings", "C": "had already been published in", "D": "a leading journal"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "The word <u>benevolent</u> contains the Latin roots 'bene' and 'vol'. Using these roots, what does 'benevolent' most likely mean?", "options": {"A": "speaking many languages", "B": "acting too quickly", "C": "wishing harm on others", "D": "wishing others well"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Choose the option that correctly rewrites the sentence in the passive voice.\n\nActive: The council will announce the results tomorrow.", "options": {"A": "The results will announce by the council tomorrow.", "B": "The results are announced by the council tomorrow.", "C": "The results will be announced by the council tomorrow.", "D": "The results will be announce by the council tomorrow."}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?\n\nThe negotiator remained <u>resolute</u> even as both sides pressured her to compromise.", "options": {"A": "hesitant", "B": "determined", "C": "courteous", "D": "exhausted"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "You are writing a formal email to a school principal. Choose the most appropriate way to make a request.", "options": {"A": "I want you to reschedule the interview.", "B": "Please reschedule the interview as soon as you can.", "C": "I would be grateful if you could reschedule the interview.", "D": "Can't you just reschedule the interview?"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>candid</u> in the sentence below?\n\nIn a rare and <u>candid</u> interview, the retired athlete admitted she had often doubted herself.", "options": {"A": "frank and honest", "B": "cheerful and lively", "C": "secretive and guarded", "D": "brief and rushed"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "Choose the subordinating conjunction that best completes the sentence.\n\n____ the report was thoroughly researched, its conclusions were ultimately rejected by the panel.", "options": {"A": "Therefore", "B": "Although", "C": "Because", "D": "Moreover"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "In the sentence below, which part of speech is the underlined word?\n\nThe early frost will <u>damage</u> the young seedlings before spring arrives.", "options": {"A": "noun", "B": "adjective", "C": "verb", "D": "adverb"}, "fig": "", "passage": null, "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "All four words can describe a person who is careful with money. Which has the most NEGATIVE connotation?", "options": {"A": "thrifty", "B": "frugal", "C": "economical", "D": "stingy"}, "fig": "", "passage": null, "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Choose the pair that best completes the analogy.\n\nReluctant is to eager as scarce is to ____", "options": {"A": "rare", "B": "valuable", "C": "hidden", "D": "abundant"}, "fig": "", "passage": null, "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "The word 'novel' has more than one meaning. Which meaning does <u>novel</u> carry in the sentence below?\n\nThe engineers proposed a <u>novel</u> solution that no one on the panel had ever considered before.", "options": {"A": "new and original", "B": "a long work of fiction", "C": "carefully tested", "D": "extremely expensive"}, "fig": "", "passage": null, "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nThe old engine <u>coughed and groaned</u> as the mechanic tried to bring it back to life.", "options": {"A": "hyperbole", "B": "oxymoron", "C": "personification", "D": "alliteration"}, "fig": "", "passage": null, "qnum": 15}, {"n": 17, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>blunt</u> as Ms Okafor uses it?\n\n\"Let me be blunt: phones do not belong in classrooms.\"", "options": {"A": "gentle and uncertain", "B": "direct and frank", "C": "physically dull or not sharp", "D": "rude and insulting"}, "fig": "", "passage": "<strong>Should Schools Ban Smartphones? Two Views</strong><br>PASSAGE 1, Ms Okafor, Head of Year<br><br>Let me be blunt: phones do not belong in classrooms. Every teacher I know has watched a bright student vanish behind a screen, thumbs twitching under the desk while a lesson slides past unheard. Studies from several universities show that simply having a phone nearby, even switched off and face down, quietly drains a student&#x27;s attention; the mind keeps listening for the next buzz. We are not banning phones because we distrust young people. We are doing it because we respect their right to learn without a machine engineered by clever companies to interrupt them again and again. A locked pouch from nine to three is not a prison, and no one is asking students to give up their phones forever. It is a quiet space for six hours, and in that calm space, slow and careful thinking can finally begin. Surely six undistracted hours a day is a gift, not a punishment.<br><br>PASSAGE 2, Daniel Cheung, Student Council President<br><br>A blanket ban treats every student as a suspect before anyone has done a single thing wrong. Yes, phones can distract, but so can a window, a daydream, or a friend whispering two seats away. We do not brick up the windows or ban friendships. Phones are also genuine tools: I use mine to translate a difficult science term, photograph the board before it is wiped, and message my mother when after-school practice runs late. Banning the device does not teach self-control; it simply postpones the day we must finally learn it for ourselves. Adults carry phones into every meeting and trust themselves to stay focused. Why assume we cannot be taught the very same discipline? Guide us, do not confiscate. The real goal of school is to prepare us for a world full of screens, not to pretend for a few hours that such a world does not exist.", "qnum": 16}, {"n": 18, "type": "mcq", "section": "English", "stem": "Which persuasive technique does Ms Okafor use in her final sentence, \"Surely six undistracted hours a day is a gift, not a punishment\"?", "options": {"A": "A rhetorical question that reframes the ban as a benefit", "B": "A statistic drawn from named scientific research", "C": "A personal anecdote about her own school days", "D": "An admission that the opposing view is correct"}, "fig": "", "passage": "<strong>Should Schools Ban Smartphones? Two Views</strong><br>PASSAGE 1, Ms Okafor, Head of Year<br><br>Let me be blunt: phones do not belong in classrooms. Every teacher I know has watched a bright student vanish behind a screen, thumbs twitching under the desk while a lesson slides past unheard. Studies from several universities show that simply having a phone nearby, even switched off and face down, quietly drains a student&#x27;s attention; the mind keeps listening for the next buzz. We are not banning phones because we distrust young people. We are doing it because we respect their right to learn without a machine engineered by clever companies to interrupt them again and again. A locked pouch from nine to three is not a prison, and no one is asking students to give up their phones forever. It is a quiet space for six hours, and in that calm space, slow and careful thinking can finally begin. Surely six undistracted hours a day is a gift, not a punishment.<br><br>PASSAGE 2, Daniel Cheung, Student Council President<br><br>A blanket ban treats every student as a suspect before anyone has done a single thing wrong. Yes, phones can distract, but so can a window, a daydream, or a friend whispering two seats away. We do not brick up the windows or ban friendships. Phones are also genuine tools: I use mine to translate a difficult science term, photograph the bo as watched a bright student vanish behind a screen, thumbs twitching under the desk while a lesson slides past unheard. Studies from several universities show that simply having a phone nearby, even switched off and face down, quietly drains a student&#x27;s attention; the mind keeps listening for the next buzz. We are not banning phones because we distrust young people. We are doing it because we respect their right to learn without a machine engineered by clever companies to interrupt them again and again. A locked pouch from nine to three is not a prison, and no one is asking students to give up their phones forever. It is a quiet space for six hours, and in that calm space, slow and careful thinking can finally begin. Surely six undistracted hours a day is a gift, not a punishment.<br><br>PASSAGE 2, Daniel Cheung, Student Council President<br><br>A blanket ban treats every student as a suspect before anyone has done a single thing wrong. Yes, phones can distract, but so can a window, a daydream, or a friend whispering two seats away. We do not brick up the windows or ban friendships. Phones are also genuine tools: I use mine to translate a difficult science term, photograph the board before it is wiped, and message my mother when after-school practice runs late. Banning the device does not teach self-control; it simply postpones the day we must finally learn it for ourselves. Adults carry phones into every meeting and trust themselves to stay focused. Why assume we cannot be taught the very same discipline? Guide us, do not confiscate. The real goal of school is to prepare us for a world full of screens, not to pretend for a few hours that such a world does not exist.", "qnum": 20}, {"n": 22, "type": "writing", "section": "English Writing", "intro": "Everyone has faced a moment when they had to choose between what was easy and what was right.", "label": "", "body": "Describe a time when you had to make a difficult decision. Explain what made the choice hard and what you finally decided. Then argue what you believe the right choice is in situations like yours, giving clear reasons for your view. Use vivid, specific language throughout.", "hint": "Write at least 8 sentences.", "placeholder": "Type your response here…", "partA": "Describe a time when you had to make a difficult decision. Explain what made the choice hard and what you finally decided. Then argue what you believe the right choice is in situations like yours, giving clear reasons for your view. Use vivid, specific language throughout.", "partB": ""}, {"n": 23, "type": "info", "title": "English Listening &amp; Speaking", "body": "<div class='info-body'>In the real test this section is delivered by an on-screen avatar: you listen and then speak your answers aloud into the microphone. There is nothing to type or record here, the sample questions below show the kind of thing you'll be asked, so you can practise out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Introduce yourself and describe your main academic interests and goals.</li><li style='margin:7px 0'>Describe a challenge you have overcome and what you learned from it.</li><li style='margin:7px 0'>What qualities make a good leader? Give an example.</li><li style='margin:7px 0'>Talk about an issue facing young people today and explain your view.</li><li style='margin:7px 0'>Listen to a short talk, then summarise its main argument in your own words.</li></ul>"}, {"n": 24, "type": "info", "title": "Mathematics, Logic &amp; Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": 25, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which line is parallel to y = 3x − 4?", "options": {"A": "y = 3x + 7", "B": "y = −3x − 4", "C": "y = −⅓x + 1", "D": "y = ⅓x − 4"}, "fig": "", "passage": null, "qnum": 21}, {"n": 26, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which line is perpendicular to y = 2x + 5?", "options": {"A": "y = 2x − 5", "B": "y = −½x + 1", "C": "y = ½x + 3", "D": "y = −2x + 5"}, "fig": "", "passage": null, "qnum": 22}, {"n": 27, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the line through (0, 1) and (2, 7).", "options": {"A": "y = 6x + 1", "B": "y = 3x + 2", "C": "y = 3x − 1", "D": "y = 3x + 1"}, "fig": "", "passage": null, "qnum": 23}, {"n": 28, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the line through (−1, 2) with gradient 4.", "options": {"A": "y = 4x − 1", "B": "y = 4x + 2", "C": "y = 4x + 6", "D": "y = 4x − 2"}, "fig": "", "passage": null, "qnum": 24}, {"n": 29, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two triangles are similar. Find the unknown height y.", "options": {"A": "11", "B": "5.33", "C": "12", "D": "5"}, "fig": "<svg viewBox=\"0 0 360 185\" width=\"360\" height=\"185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"360\" height=\"185\" fill=\"#ffffff\"/><polygon points=\"40,150 120,150 40,80\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"72\" y=\"168\" font-size=\"12\" text-anchor=\"middle\">6</text><text x=\"14\" y=\"118\" font-size=\"12\">8</text><polygon points=\"200,158 330,158 200,58\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"262\" y=\"176\" font-size=\"12\" text-anchor=\"middle\">9</text><text x=\"168\" y=\"112\" font-size=\"12\">?</text></svg>", "passage": null, "qnum": 25}, {"n": 30, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Triangle A has area 20 cm². Triangle B is similar with scale factor 3. Find the area of B.", "options": {"A": "60", "B": "180", "C": "23", "D": "540"}, "fig": "", "passage": null, "qnum": 26}, {"n": 31, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two similar figures have lengths in the ratio 4 : 10. Give the scale factor in simplest form.", "options": {"A": "4 : 10", "B": "2 : 5", "C": "5 : 2", "D": "2 : 6"}, "fig": "", "passage": null, "qnum": 27}, {"n": 32, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify 3a + 5b − (a − 2b).", "options": {"A": "2a + 7b", "B": "2a + 3b", "C": "4a + 3b", "D": "9ab"}, "fig": "", "passage": null, "qnum": 28}, {"n": 33, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify (6x²y) ÷ (2x).", "options": {"A": "4xy", "B": "3x²y", "C": "3x³y", "D": "3xy"}, "fig": "", "passage": null, "qnum": 29}, {"n": 34, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the surface area of a square pyramid with base side 10 cm and slant height 12 cm.", "options": {"A": "240 cm²", "B": "340 cm²", "C": "100 cm²", "D": "280 cm²"}, "fig": "", "passage": null, "qnum": 30}, {"n": 35, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid measures 12 cm × 7 cm × 5 cm, as shown. Find its volume.", "options": {"A": "420 cm³", "B": "24 cm³", "C": "358 cm³", "D": "179 cm³"}, "fig": "<svg viewBox=\"0 0 300 200\" width=\"300\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"#ffffff\"/><rect x=\"60\" y=\"40\" width=\"180\" height=\"110\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"150.0\" y=\"30\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Arial\">7</text><text x=\"248\" y=\"95.0\" font-size=\"12\" font-family=\"Arial\">5</text></svg>", "passage": null, "qnum": 31}, {"n": 36, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the volume of a sphere of radius 6 cm. Use V = 4⁄3 πr³ (1 d.p.).", "options": {"A": "452.4 cm³", "B": "288.0 cm³", "C": "150.8 cm³", "D": "904.8 cm³"}, "fig": "<svg viewBox=\"0 0 230 200\" width=\"230\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"230\" height=\"200\" fill=\"#ffffff\"/><circle cx=\"110\" cy=\"100\" r=\"58\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><ellipse cx=\"110\" cy=\"100\" rx=\"58\" ry=\"17\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><text x=\"8\" y=\"190\" font-size=\"12\">r = 6 cm</text></svg>", "passage": null, "qnum": 32}, {"n": 37, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the surface area of a square pyramid with base side 8 cm and slant height 9 cm.", "options": {"A": "144 cm²", "B": "64 cm²", "C": "208 cm²", "D": "352 cm²"}, "fig": "", "passage": null, "qnum": 33}, {"n": 38, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the mean of 4, 7, 7, 9, 13.", "options": {"A": "7", "B": "9", "C": "8", "D": "40"}, "fig": "", "passage": null, "qnum": 34}, {"n": 39, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the median of 11, 3, 8, 5, 14, 6.", "options": {"A": "8", "B": "7", "C": "5.5", "D": "9.5"}, "fig": "", "passage": null, "qnum": 35}, {"n": 40, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the mode of 2, 5, 5, 8, 8, 8, 9.", "options": {"A": "6.4", "B": "5", "C": "7", "D": "8"}, "fig": "", "passage": null, "qnum": 36}, {"n": 41, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the lower quartile of 2, 4, 5, 6, 8, 10, 12, 15.", "options": {"A": "4.5", "B": "5", "C": "4", "D": "6"}, "fig": "", "passage": null, "qnum": 37}, {"n": 42, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "For 3, 5, 7, 9, 11, 13, 15, 17, find the upper quartile.", "options": {"A": "15", "B": "13", "C": "14", "D": "11"}, "fig": "", "passage": null, "qnum": 38}, {"n": 43, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the sequence: 2, 6, 14, 30, 62, __ . What is the next term?", "options": {"A": "124", "B": "122", "C": "126", "D": "64"}, "fig": "", "passage": null, "qnum": 39}, {"n": 44, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Read these rules carefully and treat the invented words purely by the rules given (ignore any real-world meaning): All BLIMS are DORGS. No DORGS are FLENS. Which statement MUST be true?", "options": {"A": "No BLIMS are FLENS", "B": "Some BLIMS are FLENS", "C": "All FLENS are BLIMS", "D": "It cannot be determined from the rules"}, "fig": "", "passage": null, "qnum": 40}, {"n": 45, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Mei wants to save $600 over the next 5 months. Each month she earns $90 from a part-time job, and each month she spends $40 on transport and $15 on snacks. If she keeps everything she does not spend, how much EXTRA must she save per month to reach her $600 goal on time?", "options": {"A": "$70", "B": "$85", "C": "$120", "D": "$30"}, "fig": "", "passage": null, "qnum": 41}, {"n": 46, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A flight departs Hong Kong at 23:40 on Monday (Hong Kong time). The journey takes 12 hours 50 minutes. London is 7 hours behind Hong Kong. What is the local arrival time and day in London?", "options": {"A": "12:30 Tuesday", "B": "19:30 Tuesday", "C": "06:30 Tuesday", "D": "05:30 Tuesday"}, "fig": "", "passage": null, "qnum": 42}, {"n": 47, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "An arrow starts by pointing UP. It is first rotated 90° clockwise, and then rotated 90° clockwise a second time. In which direction does the arrow point at the end?", "options": {"A": "Points right", "B": "Points down", "C": "Points up", "D": "Points left"}, "fig": "<svg viewBox=\"0 0 160 160\" width=\"160\" height=\"160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"160\" height=\"160\" fill=\"#ffffff\"/><line x1=\"80\" y1=\"78\" x2=\"80\" y2=\"32\" stroke=\"#27406b\" stroke-width=\"3\"/><line x1=\"80\" y1=\"32\" x2=\"86.5\" y2=\"43.3\" stroke=\"#27406b\" stroke-width=\"3\"/><line x1=\"80\" y1=\"32\" x2=\"73.5\" y2=\"43.3\" stroke=\"#27406b\" stroke-width=\"3\"/><text x=\"80\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5b6b7a\">Starting position</text></svg>", "passage": null, "qnum": 43}, {"n": 48, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Statement: \"Our school should install free water-refill stations in every corridor, because this will cut the number of single-use plastic bottles students throw away each day.\"\n\nProposed assumption: \"Students who currently use single-use plastic bottles would be willing to use a refill station instead.\"\n\nUsing the information in the statement, is this assumption logical (i.e. is it something the argument must be taking for granted)?", "options": {"A": "Yes, the plan can only reduce thrown-away bottles if students actually switch to refilling, so the argument must take this willingness for granted.", "B": "No, the argument already guarantees that fewer bottles will be thrown away, so it does not need to assume anything about students' choices.", "C": "Yes, the statement proves that students prefer refill stations to plastic bottles.", "D": "No, an assumption must be stated openly in the argument, and this one is not written down."}, "fig": "", "passage": null, "qnum": 44}, {"n": 49, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INFERENCE. Read the statement, then choose the conclusion that MUST be true on the information given. The other options are not certain, some may possibly be true, and some may even be impossible, but none is guaranteed.\n\nStatement: \"In a survey of one secondary school, every student who studied more than ten hours a week passed the mathematics examination. Some students who studied fewer than ten hours a week also passed, but not all of them did.\"", "options": {"A": "Every student who passed the mathematics examination studied more than ten hours a week.", "B": "No student who studied more than ten hours a week failed the examination.", "C": "At least one student who studied more than ten hours a week failed the examination.", "D": "At least one student who passed studied more than ten hours a week, and at least one student who passed studied fewer than ten hours a week."}, "fig": "", "passage": null, "qnum": 45}, {"n": 50, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "DEDUCTION. Treat the following facts as true, even if they sound unusual.\nWhich conclusion does NOT follow from them?\n\nFacts: \"All members of the robotics club must take the coding course. No one who takes the coding course is allowed to skip the safety test. Jaden is a member of the robotics club.\"", "options": {"A": "Jaden must take the coding course.", "B": "Jaden cannot skip the safety test.", "C": "Jaden must take the safety test.", "D": "Jaden taking the coding course would prove that Jaden joined the robotics club."}, "fig": "", "passage": null, "qnum": 46}, {"n": 51, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the city require all new public buses to be electric within five years?\" Each option gives one argument. Choose the STRONGEST argument (the one most relevant and best supported, rather than emotive, based on personal opinion, or merely following the crowd).", "options": {"A": "No, my uncle drives a diesel bus and he says electric buses are a silly idea that will never catch on.", "B": "Yes, most major cities have already announced electric-bus targets, so we should follow them so as not to be left behind.", "C": "No, switching the whole fleet in five years is impractical because the city would have to replace buses faster than they wear out, and there is no plan or budget to do so.", "D": "Yes, electric vehicles are clearly the future, so the city should obviously just do it."}, "fig": "", "passage": null, "qnum": 47}, {"n": 52, "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 簡体.)"}, {"n": 53, "type": "mcq", "section": "Chinese", "stem": "根據短文，老茶館生意一度冷清的原因是什麼？ <br><span style=\"color:#555\">根据短文，老茶馆生意一度冷清的原因是什么？</span>", "options": {"A": "因為附近開了許多新式咖啡店，年輕人不再上茶館<br><span style=\"color:#555\">因为附近开了许多新式咖啡店，年轻人不再上茶馆</span>", "B": "因為茶葉漲價，許多熟客負擔不起<br><span style=\"color:#555\">因为茶叶涨价，许多熟客负担不起</span>", "C": "因為陳師傅年紀大了，沖泡的茶不如從前<br><span style=\"color:#555\">因为陈师傅年纪大了，冲泡的茶不如从前</span>", "D": "因為茶館搬到了偏僻的小巷，客人找不到<br><span style=\"color:#555\">因为茶馆搬到了偏僻的小巷，客人找不到</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>老街轉角的那家茶館，陳師傅已經守了三十年。近年來，街角新開的咖啡店一間接一間，年輕人寧願捧着紙杯匆匆而過，茶館一度門可羅雀，冷清得連店裏的舊掛鐘也彷彿走得格外緩慢。然而陳師傅並不慌張，他沒有丟下祖傳的手藝，也不肯打價格戰，卻在週末開起體驗班，讓年輕人親手學沖一壺茶。起初來的人寥寥無幾，後來一傳十、十傳百，週末的小店竟漸漸熱鬧起來。有人為了那一盞回甘的好茶而來，也有人只為在喧囂的城市裏偷得片刻寧靜。如今再走過那個轉角，老味道沒有走，新客人卻來了。</div><div><em>簡体</em><br>老街转角的那家茶馆，陈师傅已经守了三十年。近年来，街角新开的咖啡店一间接一间，年轻人宁愿捧着纸杯匆匆而过，茶馆一度门可罗雀，冷清得连店里的旧挂钟也仿佛走得格外缓慢。然而陈师傅并不慌张，他没有丢下祖传的手艺，也不肯打价格战，却在周末开起体验班，让年轻人亲手学冲一壶茶。起初来的人寥寥无几，后来一传十、十传百，周末的小店竟渐渐热闹起来。有人为了那一盏回甘的好茶而来，也有人只为在喧嚣的城市里偷得片刻宁静。如今再走过那个转角，老味道没有走，新客人却来了。</div>", "qnum": 48}, {"n": 54, "type": "mcq", "section": "Chinese", "stem": "文中「門可羅雀」一詞，用來形容茶館的什麼情況？ <br><span style=\"color:#555\">文中「门可罗雀」一词，用来形容茶馆的什么情况？</span>", "options": {"A": "門外有人張網捕雀，十分熱鬧<br><span style=\"color:#555\">门外有人张网捕雀，十分热闹</span>", "B": "客人稀少，生意極為冷清<br><span style=\"color:#555\">客人稀少，生意极为冷清</span>", "C": "門前種滿花草，吸引雀鳥停留<br><span style=\"color:#555\">门前种满花草，吸引雀鸟停留</span>", "D": "顧客川流不息，座無虛席<br><span style=\"color:#555\">顾客川流不息，座无虚席</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>老街轉角的那家茶館，陳師傅已經守了三十年。近年來，街角新開的咖啡店一間接一間，年輕人寧願捧着紙杯匆匆而過，茶館一度門可羅雀，冷清得連店裏的舊掛鐘也彷彿走得格外緩慢。然而陳師傅並不慌張，他沒有丟下祖傳的手藝，也不肯打價格戰，卻在週末開起體驗班，讓年輕人親手學沖一壺茶。起初來的人寥寥無幾，後來一傳十、十傳百，週末的小店竟漸漸熱鬧起來。有人為了那一盞回甘的好茶而來，也有人只為在喧囂的城市裏偷得片刻寧靜。如今再走過那個轉角，老味道沒有走，新客人卻來了。</div><div><em>簡体</em><br>老街转角的那家茶馆，陈师傅已经守了三十年。近年来，街角新开的咖啡店一间接一间，年轻人宁愿捧着纸杯匆匆而过，茶馆一度门可罗雀，冷清得连店里的旧挂钟也仿佛走得格外缓慢。然而陈师傅并不慌张，他没有丢下祖传的手艺，也不肯打价格战，却在周末开起体验班，让年轻人亲手学冲一壶茶。起初来的人寥寥无几，后来一传十、十传百，周末的小店竟渐渐热闹起来。有人为了那一盏回甘的好茶而来，也有人只为在喧嚣的城市里偷得片刻宁静。如今再走过那个转角，老味道没有走，新客人却来了。</div>", "qnum": 49}, {"n": 55, "type": "mcq", "section": "Chinese", "stem": "陳師傅面對冷清的生意，採取了什麼做法？ <br><span style=\"color:#555\">陈师傅面对冷清的生意，采取了什么做法？</span>", "options": {"A": "決定結束營業，把鋪位轉租給咖啡店<br><span style=\"color:#555\">决定结束营业，把铺位转租给咖啡店</span>", "B": "把茶價大幅降低，與咖啡店硬碰硬地競爭<br><span style=\"color:#555\">把茶价大幅降低，与咖啡店硬碰硬地竞争</span>", "C": "保留老手藝，同時開設體驗班，請年輕人親手泡茶<br><span style=\"color:#555\">保留老手艺，同时开设体验班，请年轻人亲手泡茶</span>", "D": "不作任何改變，靜待老顧客自己回頭<br><span style=\"color:#555\">不作任何改变，静待老顾客自己回头</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>老街轉角的那家茶館，陳師傅已經守了三十年。近年來，街角新開的咖啡店一間接一間，年輕人寧願捧着紙杯匆匆而過，茶館一度門可羅雀，冷清得連店裏的舊掛鐘也彷彿走得格外緩慢。然而陳師傅並不慌張，他沒有丟下祖傳的手藝，也不肯打價格戰，卻在週末開起體驗班，讓年輕人親手學沖一壺茶。起初來的人寥寥無幾，後來一傳十、十傳百，週末的小店竟漸漸熱鬧起來。有人為了那一盞回甘的好茶而來，也有人只為在喧囂的城市裏偷得片刻寧靜。如今再走過那個轉角，老味道沒有走，新客人卻來了。</div><div><em>簡体</em><br>老街转角的那家茶馆，陈师傅已经守了三十年。近年来，街角新开的咖啡店一间接一间，年轻人宁愿捧着纸杯匆匆而过，茶馆一度门可罗雀，冷清得连店里的旧挂钟也仿佛走得格外缓慢。然而陈师傅并不慌张，他没有丢下祖传的手艺，也不肯打价格战，却在周末开起体验班，让年轻人亲手学冲一壶茶。起初来的人寥寥无几，后来一传十、十传百，周末的小店竟渐渐热闹起来。有人为了那一盏回甘的好茶而来，也有人只为在喧嚣的城市里偷得片刻宁静。如今再走过那个转角，老味道没有走，新客人却来了。</div>", "qnum": 50}, {"n": 56, "type": "mcq", "section": "Chinese", "stem": "從全文看，作者對陳師傅的態度是怎樣的？ <br><span style=\"color:#555\">从全文看，作者对陈师傅的态度是怎样的？</span>", "options": {"A": "讚賞他能在堅守傳統的同時靈活應變<br><span style=\"color:#555\">赞赏他能在坚守传统的同时灵活应变</span>", "B": "惋惜他固執守舊，終究跟不上時代<br><span style=\"color:#555\">惋惜他固执守旧，终究跟不上时代</span>", "C": "嘲諷他只顧賺錢，丟失了茶道的本心<br><span style=\"color:#555\">嘲讽他只顾赚钱，丢失了茶道的本心</span>", "D": "同情他年事已高，獨力難支<br><span style=\"color:#555\">同情他年事已高，独力难支</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>老街轉角的那家茶館，陳師傅已經守了三十年。近年來，街角新開的咖啡店一間接一間，年輕人寧願捧着紙杯匆匆而過，茶館一度門可羅雀，冷清得連店裏的舊掛鐘也彷彿走得格外緩慢。然而陳師傅並不慌張，他沒有丟下祖傳的手藝，也不肯打價格戰，卻在週末開起體驗班，讓年輕人親手學沖一壺茶。起初來的人寥寥無幾，後來一傳十、十傳百，週末的小店竟漸漸熱鬧起來。有人為了那一盞回甘的好茶而來，也有人只為在喧囂的城市裏偷得片刻寧靜。如今再走過那個轉角，老味道沒有走，新客人卻來了。</div><div><em>簡体</em><br>老街转角的那家茶馆，陈师傅已经守了三十年。近年来，街角新开的咖啡店一间接一间，年轻人宁愿捧着纸杯匆匆而过，茶馆一度门可罗雀，冷清得连店里的旧挂钟也仿佛走得格外缓慢。然而陈师傅并不慌张，他没有丢下祖传的手艺，也不肯打价格战，却在周末开起体验班，让年轻人亲手学冲一壶茶。起初来的人寥寥无几，后来一传十、十传百，周末的小店竟渐渐热闹起来。有人为了那一盏回甘的好茶而来，也有人只为在喧嚣的城市里偷得片刻宁静。如今再走过那个转角，老味道没有走，新客人却来了。</div>", "qnum": 51}, {"n": 57, "type": "mcq", "section": "Chinese", "stem": "短文最後一句「老味道沒有走，新客人卻來了」主要說明什麼道理？ <br><span style=\"color:#555\">短文最后一句「老味道没有走，新客人却来了」主要说明什么道理？</span>", "options": {"A": "只要價錢便宜，自然會吸引新顧客<br><span style=\"color:#555\">只要价钱便宜，自然会吸引新顾客</span>", "B": "傳統終將被淘汰，唯有放棄才能生存<br><span style=\"color:#555\">传统终将被淘汰，唯有放弃才能生存</span>", "C": "守住根本與順應時代並不矛盾，可以兼得<br><span style=\"color:#555\">守住根本与顺应时代并不矛盾，可以兼得</span>", "D": "新事物總比舊事物更受歡迎<br><span style=\"color:#555\">新事物总比旧事物更受欢迎</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>老街轉角的那家茶館，陳師傅已經守了三十年。近年來，街角新開的咖啡店一間接一間，年輕人寧願捧着紙杯匆匆而過，茶館一度門可羅雀，冷清得連店裏的舊掛鐘也彷彿走得格外緩慢。然而陳師傅並不慌張，他沒有丟下祖傳的手藝，也不肯打價格戰，卻在週末開起體驗班，讓年輕人親手學沖一壺茶。起初來的人寥寥無幾，後來一傳十、十傳百，週末的小店竟漸漸熱鬧起來。有人為了那一盞回甘的好茶而來，也有人只為在喧囂的城市裏偷得片刻寧靜。如今再走過那個轉角，老味道沒有走，新客人卻來了。</div><div><em>簡体</em><br>老街转角的那家茶馆，陈师傅已经守了三十年。近年来，街角新开的咖啡店一间接一间，年轻人宁愿捧着纸杯匆匆而过，茶馆一度门可罗雀，冷清得连店里的旧挂钟也仿佛走得格外缓慢。然而陈师傅并不慌张，他没有丢下祖传的手艺，也不肯打价格战，却在周末开起体验班，让年轻人亲手学冲一壶茶。起初来的人寥寥无几，后来一传十、十传百，周末的小店竟渐渐热闹起来。有人为了那一盏回甘的好茶而来，也有人只为在喧嚣的城市里偷得片刻宁静。如今再走过那个转角，老味道没有走，新客人却来了。</div>", "qnum": 52}, {"n": 58, "type": "mcq", "section": "Chinese", "stem": "「他做事一向腳踏實地，從不好高騖遠。」句中「好高騖遠」的意思最接近： <br><span style=\"color:#555\">「他做事一向脚踏实地，从不好高骛远。」句中「好高骛远」的意思最接近：</span>", "options": {"A": "喜歡爬到高處眺望遠方<br><span style=\"color:#555\">喜欢爬到高处眺望远方</span>", "B": "不切實際地追求過高過遠的目標<br><span style=\"color:#555\">不切实际地追求过高过远的目标</span>", "C": "志向遠大，腳步穩健<br><span style=\"color:#555\">志向远大，脚步稳健</span>", "D": "做事拖延  "mcq", "section": "Chinese", "stem": "下列各句成語運用正確的一項是： <br><span style=\"color:#555\">下列各句成语运用正确的一项是：</span>", "options": {"A": "他剛學會幾個生字，就在同學面前誇誇其談，真是博古通今。<br><span style=\"color:#555\">他刚学会几个生字，就在同学面前夸夸其谈，真是博古通今。</span>", "B": "面對突如其來的問題，她從容不迫地一一作答，令人佩服。<br><span style=\"color:#555\">面对突如其来的问题，她从容不迫地一一作答，令人佩服。</span>", "C": "這場演出精彩絕倫，觀眾看得無精打采，掌聲雷動。<br><span style=\"color:#555\">这场演出精彩绝伦，观众看得无精打采，掌声雷动。</span>", "D": "他成績一落千丈，老師同學都為他的進步感到高興。<br><span style=\"color:#555\">他成绩一落千丈，老师同学都为他的进步感到高兴。</span>"}, "fig": "", "passage": null, "qnum": 58}, {"n": 64, "type": "mcq", "section": "Chinese", "stem": "下列句子沒有語病的一項是： <br><span style=\"color:#555\">下列句子没有语病的一项是：</span>", "options": {"A": "為了避免成績不再退步，他制定了詳細的溫習計劃。<br><span style=\"color:#555\">为了避免成绩不再退步，他制定了详细的温习计划。</span>", "B": "通過這次活動，使我明白了團隊合作的重要。<br><span style=\"color:#555\">通过这次活动，使我明白了团队合作的重要。</span>", "C": "他不但成績優異，而且樂於助人，深受同學歡迎。<br><span style=\"color:#555\">他不但成绩优异，而且乐于助人，深受同学欢迎。</span>", "D": "我們大約讀了三十多本課外書，收穫很大。<br><span style=\"color:#555\">我们大约读了三十多本课外书，收获很大。</span>"}, "fig": "", "passage": null, "qnum": 59}, {"n": 65, "type": "mcq", "section": "Chinese", "stem": "「無論天氣多麼惡劣，他______堅持每天到醫院探望生病的祖母。」橫線上填入最恰當的關聯詞是： <br><span style=\"color:#555\">「无论天气多么恶劣，他______坚持每天到医院探望生病的祖母。」横线上填入最恰当的关联词是：</span>", "options": {"A": "都<br><span style=\"color:#555\">都</span>", "B": "卻<br><span style=\"color:#555\">却</span>", "C": "就<br><span style=\"color:#555\">就</span>", "D": "才<br><span style=\"color:#555\">才</span>"}, "fig": "", "passage": null, "qnum": 60}, {"n": 66, "type": "info", "title": "中文寫作 Chinese Writing", "body": "<div class='info-body'>在正式考試中，中文寫作為紙筆作答，以下兩題<b>二選一</b>。此頁僅供參考，你不需要在此輸入答案。<br>In the real test, Chinese writing is done on paper, <b>choose one</b> of the two prompts below. This page is for reference only; you don't need to type anything here.</div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 1 / 题目 1</b><br>《一次令我成長的經歷》, , 記敘一件對你影響深遠的事，並談談你的反思與成長（不少於 12 句）。<br><span style='color:#555'>《一次令我成长的经历》, , 记叙一件对你影响深远的事，并谈谈你的反思与成长（不少于 12 句）。</span></div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 2 / 题目 2</b><br>《談堅持》, , 以「堅持」為題，談談你的看法，並舉例加以說明（不少於 12 句）。<br><span style='color:#555'>《谈坚持》, , 以「坚持」为题，谈谈你的看法，并举例加以说明（不少于 12 句）。</span></div>"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
