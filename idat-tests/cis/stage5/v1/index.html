<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}

  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}

  .center{text-align:center;margin:auto 0}

  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "5", VERSION = "1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence with correct punctuation.\n\nThe expedition leader read out the supplies we still needed ______", "options": {"A": "needed: rope, a compass, and two extra torches.", "B": "needed; rope, a compass, and two extra torches.", "C": "needed, rope: a compass, and two extra torches.", "D": "needed rope, a compass, and two extra torches."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'parched' in the sentence below?\n\nAfter crossing the desert all afternoon with an empty bottle, the travellers were utterly parched.", "options": {"A": "exhausted", "B": "sunburnt", "C": "very thirsty", "D": "lost"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the linking word that best fits the sentence.\n\nThe new timetable freed up the afternoons; ______, it left almost no time for lunch.", "options": {"A": "therefore", "B": "for example", "C": "similarly", "D": "however"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which word is spelled correctly?", "options": {"A": "conscious", "B": "concious", "C": "consciuos", "D": "consious"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the option that uses a semicolon correctly.", "options": {"A": "The bridge was flooded; so the bus took the long way round.", "B": "The bridge was flooded, the bus took the long way round.", "C": "The bridge was flooded; the bus took the long way round.", "D": "The bridge was flooded; because of the heavy rain."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nThe two managers had been arguing for weeks, but at the meeting they finally decided to <u>bury the hatchet</u>.", "options": {"A": "make peace and stop quarrelling", "B": "hide the evidence", "C": "give up completely", "D": "prepare for a fight"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the correctly written sentence.", "options": {"A": "Each of the runners were given a numbered bib before the race.", "B": "Each of the runners was given a numbered bib before the race.", "C": "Each of the runners is given a numbered bib before the race yesterday.", "D": "Each of the runners were given a numbered bib before the race yesterday."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence uses a euphemism?", "options": {"A": "The government raised taxes sharply last year.", "B": "The government cut funding for the clinics last year.", "C": "The government opened three new clinics last year.", "D": "The government introduced revenue enhancements last year."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the word that best maintains the flow and logic of the paragraph.\n\nThe trial showed clear benefits. ______, the budget ran out before the team could confirm the findings, so the project was paused.", "options": {"A": "Consequently", "B": "Furthermore", "C": "Meanwhile", "D": "Unfortunately"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which word is the formal equivalent of the slang term 'knackered' in the sentence below?\n\nAfter the double shift, the nurses were completely knackered.", "options": {"A": "irritated", "B": "confused", "C": "delighted", "D": "exhausted"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nThe runner was <u>as quick as a hare</u> off the starting line.", "options": {"A": "simile", "B": "personification", "C": "hyperbole", "D": "metaphor"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Choose the option with correct colon usage.", "options": {"A": "She finally: knew the secret to the recipe was patience.", "B": "She finally knew the secret to the recipe: patience.", "C": "She finally knew: the secret to the recipe patience.", "D": "She finally knew the secret, to the recipe: patience."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'tenacious' in the sentence below?\n\nThe young lawyer was tenacious, refusing to drop the case even after three defeats.", "options": {"A": "aggressive", "B": "experienced", "C": "determined and persistent", "D": "lucky"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\n\nThe list of approved candidates (A) were posted on the noticeboard, (B) and the office (C) reminded applicants (D) to check it carefully.", "options": {"A": "section (B)", "B": "section (D)", "C": "section (A)", "D": "section (C)"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which option gives the meaning of 'current' as used in the sentence below?\n\nThe swimmers were warned about the strong current near the rocks.", "options": {"A": "a steady flow of water in one direction", "B": "happening at the present time", "C": "an electric charge in a wire", "D": "a small dried fruit used in baking"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Choose the subordinating conjunction that best completes the sentence.\n\n______ she had practised for months, she still felt nervous walking onto the stage.", "options": {"A": "Because", "B": "Even though", "C": "So", "D": "Therefore"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which word has the most negative connotation?", "options": {"A": "confident", "B": "self-assured", "C": "assertive", "D": "arrogant"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which sentence is most appropriate for a formal letter of complaint?", "options": {"A": "I'm fed up with the rubbish service you lot keep giving me.", "B": "I am writing to raise a serious concern about the service I received.", "C": "I demand that you grovel and fix this disgraceful mess at once.", "D": "FYI the service was a total joke from start to finish."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nWhen the funding was cut, the whole project was left <u>in limbo</u>, with no one sure whether it would continue.", "options": {"A": "completely cancelled", "B": "running ahead of schedule", "C": "in an uncertain, unresolved state", "D": "kept strictly secret"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Choose the sentence that is correctly punctuated and structured.", "options": {"A": "Walking home in the rain, my umbrella suddenly turned inside out.", "B": "Walking home in the rain, I felt my umbrella suddenly turn inside out.", "C": "Walking home in the rain the umbrella suddenly turned inside out.", "D": "Walking home in the rain; I felt my umbrella turn inside out."}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which literary device is used in the sentence below?\n\nThe new recruit was a bundle of nerves, yet he showed a kind of confident shyness on his first day.", "options": {"A": "metaphor", "B": "oxymoron", "C": "simile", "D": "hyperbole"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Choose the connective that best fits the paragraph's flow.\n\nThe museum lowered its ticket prices to attract more families. ______, visitor numbers rose by nearly a third within a year.", "options": {"A": "On the other hand", "B": "In contrast", "C": "As a result", "D": "For instance"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Which underlined phrase is a euphemism for 'was sacked from his job'?", "options": {"A": "He <u>handed in his notice</u> to start a new career.", "B": "He <u>took a day off</u> to visit the dentist.", "C": "He <u>worked from home</u> on Fridays.", "D": "He was <u>asked to clear his desk</u> after the audit."}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "The Latin root 'aud' means 'hear'. Which word's meaning is most directly built from this root?", "options": {"A": "auction", "B": "August", "C": "audible", "D": "autumn"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Choose the correctly punctuated sentence.", "options": {"A": "The tour visited four authors' homes; Dickens, in London, Austen, in Hampshire, Brontë, in Yorkshire, and Hardy, in Dorset.", "B": "The tour visited four authors' homes: Dickens, in London; Austen, in Hampshire; Brontë, in Yorkshire; and Hardy, in Dorset.", "C": "The tour visited four authors' homes: Dickens, in London, Austen, in Hampshire, Brontë, in Yorkshire, and Hardy, in Dorset.", "D": "The tour visited four authors' homes: Dickens, in London; Austen, in Hampshire; Brontë, in Yorkshire and Hardy, in Dorset."}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Identify the literary device in the underlined words.\n\nThe <u>old clock muttered</u> in the corner of the silent hall.", "options": {"A": "hyperbole", "B": "onomatopoeia", "C": "personification", "D": "simile"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "Why was the Crow unable to drink the water at first?", "options": {"A": "The water was too dirty to drink.", "B": "The Pitcher was tall and narrow, so the water was out of reach.", "C": "Another animal was guarding the Pitcher.", "D": "The Pitcher was completely empty."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, dry summer, a thirsty Crow flew for miles in search of water. The streams she knew had shrunk to cracked mud, the ponds had dwindled to dust, and the heat pressed down on her black feathers like a heavy hand. She was beginning to despair when, at the corner of a deserted farmyard, she spied a tall earthenware Pitcher standing in the shade of a wall.\n\nHer heart leapt, and she dropped down beside it at once. Sure enough, when she peered over the rim, a little water glimmered at the very bottom. But the Pitcher was tall and narrow, and the water lay far below. She stretched her neck as far as it would go, and still her beak fell short. She pushed, and strained, and tilted her head until it ached, but the cool water stayed maddeningly out of reach.\n\nShe thought of tipping the Pitcher over, and shoved against it with all her weight; but it was far too heavy, and it would not so much as rock. For a moment she sat back, defeated, the sun beating down and her throat as dry as the dust around her.\n\nThen, as she looked about her, an idea began to form. Scattered across the farmyard lay a great many small pebbles. The Crow hopped to the nearest one, carried it in her beak, and dropped it into the Pitcher. Then she fetched another, and another. It was slow work, and at first nothing seemed to change. But with each pebble she added, the water crept a little higher up the inside of the jar, for the stones took up the space at the bottom and pushed the water upward.\n\nStone by patient stone, the Crow worked through the long afternoon, until at last the water rose to the very brim. She dipped her beak, drank her fill of the cool, clear water, and rested her tired wings in the shade.\n\nAnd as she flew home at evening, she carried with her a truth as old as thirst itself: that what cannot be done by force may often be done by thought, and that little by little, with patience, the hardest task is won.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'dwindled' as it is used in the phrase 'the ponds had dwindled to dust'?", "options": {"A": "frozen solid", "B": "overflowed their banks", "C": "shrunk away to almost nothing", "D": "turned bright green"}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, dry summer, a thirsty Crow flew for miles in search of water. The streams she knew had shrunk to cracked mud, the ponds had dwindled to dust, and the heat pressed down on her black feathers like a heavy hand. She was beginning to despair when, at the corner of a deserted farmyard, she spied a tall earthenware Pitcher standing in the shade of a wall.\n\nHer heart leapt, and she dropped down beside it at once. Sure enough, when she peered over the rim, a little water glimmered at the very bottom. But the Pitcher was tall and narrow, and the water lay far below. She stretched her neck as far as it would go, and still her beak fell short. She pushed, and strained, and tilted her head until it ached, but the cool water stayed maddeningly out of reach.\n\nShe thought of tipping the Pitcher over, and shoved against it with all her weight; but it was far too heavy, and it would not so much as rock. For a moment she sat back, defeated, the sun beating down and her throat as dry as the dust around her.\n\nThen, as she looked about her, an idea began to form. Scattered across the farmyard lay a great many small pebbles. The Crow hopped to the nearest one, carried it in her beak, and dropped it into the Pitcher. Then she fetched another, and another. It was slow work, and at first nothing seemed to change. But with each pebble she added, the water crept a little higher up the inside of the jar, for the stones took up the space at the bottom and pushed the water upward.\n\nStone by patient stone, the Crow worked through the long afternoon, until at last the water rose to the very brim. She dipped her beak, drank her fill of the cool, clear water, and rested her tired wings in the shade.\n\nAnd as she flew home at evening, she carried with her a truth as old as thirst itself: that what cannot be done by force may often be done by thought, and that little by little, with patience, the hardest task is won.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "What does the Crow's success with the pebbles suggest about her?", "options": {"A": "She solved the problem by thinking rather than by force.", "B": "She was stronger than she had realised.", "C": "She was lucky that it began to rain.", "D": "She gave up and found water elsewhere."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, dry summer, a thirsty Crow flew for miles in search of water. The streams she knew had shrunk to cracked mud, the ponds had dwindled to dust, and the heat pressed down on her black feathers like a heavy hand. She was beginning to despair when, at the corner of a deserted farmyard, she spied a tall earthenware Pitcher standing in the shade of a wall.\n\nHer heart leapt, and she dropped down beside it at once. Sure enough, when she peered over the rim, a little water glimmered at the very bottom. But the Pitcher was tall and narrow, and the water lay far below. She stretched her neck as far as it would go, and still her beak fell short. She pushed, and strained, and tilted her head until it ached, but the cool water stayed maddeningly out of reach.\n\nShe thought of tipping the Pitcher over, and shoved against it with all her weight; but it was far too heavy, and it would not so much as rock. For a moment she sat back, defeated, the sun beating down and her throat as dry as the dust around her.\n\nThen, as she looked about her, an idea began to form. Scattered across the farmyard lay a great many small pebbles. The Crow hopped to the nearest one, carried it in her beak, and dropped it into the Pitcher. Then she fetched another, and another. It was slow work, and at first nothing seemed to change. But with each pebble she added, the water crept a little higher up the inside of the jar, for the stones took up the space at the bottom and pushed the water upward.\n\nStone by patient stone, the Crow worked through the long afternoon, until at last the water rose to the very brim. She dipped her beak, drank her fill of the cool, clear water, and rested her tired wings in the shade.\n\nAnd as she flew home at evening, she carried with her a truth as old as thirst itself: that what cannot be done by force may often be done by thought, and that little by little, with patience, the hardest task is won.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "In the phrase 'the heat pressed down on her black feathers like a heavy hand', which literary device is used?", "options": {"A": "personification", "B": "simile", "C": "hyperbole", "D": "alliteration"}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, dry summer, a thirsty Crow flew for miles in search of water. The streams she knew had shrunk to cracked mud, the ponds had dwindled to dust, and the heat pressed down on her black feathers like a heavy hand. She was beginning to despair when, at the corner of a deserted farmyard, she spied a tall earthenware Pitcher standing in the shade of a wall.\n\nHer heart leapt, and she dropped down beside it at once. Sure enough, when she peered over the rim, a little water glimmered at the very bottom. But the Pitcher was tall and narrow, and the water lay far below. She stretched her neck as far as it would go, and still her beak fell short. She pushed, and strained, and tilted her head until it ached, but the cool water stayed maddeningly out of reach.\n\nShe thought of tipping the Pitcher over, and shoved against it with all her weight; but it was far too heavy, and it would not so much as rock. For a moment she sat back, defeated, the sun beating down and her throat as dry as the dust around her.\n\nThen, as she looked about her, an idea began to form. Scattered across the farmyard lay a great many small pebbles. The Crow hopped to the nearest one, carried it in her beak, and dropped it into the Pitcher. Then she fetched another, and another. It was slow work, and at first nothing seemed to change. But with each pebble she added, the water crept a little higher up the inside of the jar, for the stones took up the space at the bottom and pushed the water upward.\n\nStone by patient stone, the Crow worked through the long afternoon, until at last the water rose to the very brim. She dipped her beak, drank her fill of the cool, clear water, and rested her tired wings in the shade.\n\nAnd as she flew home at evening, she carried with her a truth as old as thirst itself: that what cannot be done by force may often be done by thought, and that little by little, with patience, the hardest task is won.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "Which statement best expresses the moral of the fable?", "options": {"A": "Birds are cleverer than other animals.", "B": "It is dangerous to travel far in hot weather.", "C": "Patience and clever thinking can succeed where force fails.", "D": "You should always carry water on a journey."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, dry summer, a thirsty Crow flew for miles in search of water. The streams she knew had shrunk to cracked mud, the ponds had dwindled to dust, and the heat pressed down on her black feathers like a heavy hand. She was beginning to despair when, at the corner of a deserted farmyard, she spied a tall earthenware Pitcher standing in the shade of a wall.\n\nHer heart leapt, and she dropped down beside it at once. Sure enough, when she peered over the rim, a little water glimmered at the very bottom. But the Pitcher was tall and narrow, and the water lay far below. She stretched her neck as far as it would go, and still her beak fell short. She pushed, and strained, and tilted her head until it ached, but the cool water stayed maddeningly out of reach.\n\nShe thought of tipping the Pitcher over, and shoved against it with all her weight; but it was far too heavy, and it would not so much as rock. For a moment she sat back, defeated, the sun beating down and her throat as dry as the dust around her.\n\nThen, as she looked about her, an idea began to form. Scattered across the farmyard lay a great many small pebbles. The Crow hopped to the nearest one, carried it in her beak, and dropped it into the Pitcher. Then she fetched another, and another. It was slow work, and at first nothing seemed to change. But with each pebble she added, the water crept a little higher up the inside of the jar, for the stones took up the space at the bottom and pushed the water upward.\n\nStone by patient stone, the Crow worked through the long afternoon, until at last the water rose to the very brim. She dipped her beak, drank her fill of the cool, clear water, and rested her tired wings in the shade.\n\nAnd as she flew home at evening, she carried with her a truth as old as thirst itself: that what cannot be done by force may often be done by thought, and that little by little, with patience, the hardest task is won.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "According to the passage, why did some ship owners overload their vessels?", "options": {"A": "They wanted the ships to travel faster.", "B": "They could earn more money by carrying extra cargo.", "C": "They were ordered to do so by the government.", "D": "They did not have enough ships for all their cargo."}, "fig": "", "passage": "<strong>How the Plimsoll Line Made Ships Safer</strong><br>In the middle of the nineteenth century, a sea voyage was a dangerous gamble, and not only because of storms. Some ship owners discovered that they could make more money by loading a vessel far beyond what it could safely carry. A ship piled high with extra cargo sat low and heavy in the water, and in rough weather it could be swamped and sink. Worse still, a few unscrupulous owners deliberately over-insured these ships, so that if a vessel went down, the owner collected more money than the cargo was worth. Sailors grimly called such overloaded vessels 'coffin ships', because so few of their crews came home.\n\nThe man who changed this was a British politician named Samuel Plimsoll. He could not stop bad weather, but he realised the real danger was something simpler and entirely preventable: there was no agreed limit on how much a ship could carry. His solution was strikingly simple. He campaigned for a mark to be painted on the side of every ship's hull, a circle crossed by a horizontal line, showing the level to which the water was allowed to rise when the ship was loaded. If the line disappeared beneath the water, everyone on the dockside could see at a glance that the ship was overloaded, and it could be stopped before it ever left port.\n\nYet a single fixed line was not quite enough. Water is not always the same: cold seawater is denser than warm water, and salt water is denser than fresh, so a ship floats a little higher in some conditions than in others. To allow for this, the mark was given several short lines beside it, each labelled for a different kind of water, such as tropical seas or northern winter oceans. A captain could read the correct line for the waters he was sailing into and load the ship accordingly, neither dangerously low nor wastefully light.\n\nThe idea spread from Britain to shipping nations around the world, and the mark still appears on cargo ships today. Plimsoll's achievement was not a new engine or a stronger hull. It was the recognition that safety often depends less on building something cleverer than on making the right limit visible to everyone who needs to see it.", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'unscrupulous' as it is used in the phrase 'a few unscrupulous owners'?", "options": {"A": "without honest principles", "B": "extremely wealthy", "C": "very experienced", "D": "easily frightened"}, "fig": "", "passage": "<strong>How the Plimsoll Line Made Ships Safer</strong><br>In the middle of the nineteenth century, a sea voyage was a dangerous gamble, and not only because of storms. Some ship owners discovered that they could make more money by loading a vessel far beyond what it could safely carry. A ship piled high with extra cargo sat low and heavy in the water, and in rough weather it could be swamped and sink. Worse still, a few unscrupulous owners deliberately over-insured these ships, so that if a vessel went down, the owner collected more money than the cargo was worth. Sailors grimly called such overloaded vessels 'coffin ships', because so few of their crews came home.\n\nThe man who changed this was a British politician named Samuel Plimsoll. He could not stop bad weather, but he realised the real danger was something simpler and entirely preventable: there was no agreed limit on how much a ship could carry. His solution was strikingly simple. He campaigned for a mark to be painted on the side of every ship's hull, a circle crossed by a horizont nterquartile range.", "options": {"A": "17", "B": "31", "C": "9", "D": "26"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A right-angled triangle has a hypotenuse of 12 cm, and one of the acute angles is 35°. Find the length of the side opposite the 35° angle, to 1 decimal place.", "options": {"A": "9.8 cm", "B": "6.9 cm", "C": "8.4 cm", "D": "20.9 cm"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Line L has equation y = 4x − 1. Find the equation of the line parallel to L that passes through the point (2, 3).", "options": {"A": "y = 4x + 3", "B": "y = −1/4 x + 3.5", "C": "y = 4x − 5", "D": "y = 4x − 1"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Read these statements as a closed logic puzzle — judge ONLY by the rules given, not by real-world meaning:\n• All florns are greeps.\n• No greeps are wuzzles.\n• Every wuzzle is a tarn.\n\nWhich conclusion MUST be true?", "options": {"A": "Some florns are wuzzles.", "B": "All tarns are wuzzles.", "C": "No florns are wuzzles.", "D": "All florns are tarns."}, "fig": "", "passage": "", "qnum": "20"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Mira wants to save exactly $700 over the next 5 months for a robotics competition. She already has $80 set aside. Each month she earns $180 from coaching and has fixed costs of $55 (transport) and $35 (phone). In month 1 only, she must also make a one-off $130 purchase of competition kit. If she banks everything left over each month, how much MORE must she save per month (on top of her current plan) to reach exactly $700 on time?", "options": {"A": "$25", "B": "$60", "C": "$34", "D": "$76"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem":  up"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Our school should fit motion-sensor lights in the corridors, because this will cut the electricity the school wastes each year.\" PROPOSED ASSUMPTION: The corridor lights currently account for a meaningful amount of the school's electricity use. Using only the information in the statement, is this assumption logical?", "options": {"A": "Yes, the promised saving on wasted electricity only holds if the corridor lights are currently a meaningful source of that use.", "B": "No, the statement never proves motion sensors are cheaper to buy than ordinary switches, so it is not supported.", "C": "Yes, the statement shows that motion-sensor lights are more modern than ordinary corridor lights.", "D": "No, electricity can be made from solar panels, so the corridor lights are not really wasteful at all."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"In a survey of our Year 11 students, every student who plays in a competitive sports team trains at least four times each week. Daniel is a Year 11 student who trains only twice each week.\" Which conclusion MUST be true based only on this statement?", "options": {"A": "Daniel does not play in a competitive sports team.", "B": "Any Year 11 student who trains at least four times each week plays in a competitive sports team.", "C": "Daniel does not enjoy competitive sport.", "D": "Most Year 11 students train at least four times each week."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A school report found that in the two years after a homework-club was opened, the proportion of students handing work in late fell by 22%, while attendance at the homework-club climbed steadily.\" Consider these conclusions: (1) The homework-club was the sole cause of the fall in late work. (2) More students were making use of the homework-club by the end of the two-year period than at the start. Which option is correct, using ONLY the given information?", "options": {"A": "Both Conclusion 1 and Conclusion 2 follow.", "B": "Conclusion 1 follows, but Conclusion 2 does not.", "C": "Neither Conclusion 1 nor Conclusion 2 follows.", "D": "Conclusion 2 follows, but Conclusion 1 does not."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"All members of the orchestra must perform in at least one public concert each year. No student who suffers from severe stage fright performs in any public concert. Lena suffers from severe stage fright.\" Which conclusion does NOT follow from these facts?", "options": {"A": "Lena does not perform in any public concert.", "B": "Some members of the orchestra suffer from severe stage fright.", "C": "Lena is not a member of the orchestra.", "D": "Any student who performs in no public concert is not a member of the orchestra."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the city require all new apartment blocks to include secure indoor bicycle storage?\" Which of the following is the STRONGEST argument?", "options": {"A": "No, my cousin once chained his bike outside his block for a whole winter and it was never stolen, so secure storage is plainly unnecessary for anyone.", "B": "Yes, anyone who opposes bicycle storage obviously does not care in the slightest about reducing the traffic on our city's roads.", "C": "Yes, a four-year study of 150 apartment blocks found that secure indoor storage raised regular cycling among residents by 28%.", "D": "No, a great many residents would surely think that indoor bicycle racks look untidy and out of place in a smart modern lobby."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"We should hold the school open day on a Friday rather than a Monday, because more parents will be able to attend.\" PROPOSED ASSUMPTION: Holding the open day on a day when more parents can attend is desirable. Using only the information in the statement, is this assumption logical?", "options": {"A": "Yes, the statement proves that a Friday is always sunnier than a Monday for an outdoor event.", "B": "Yes, the argument uses 'more parents can attend' as its reason for choosing Friday, so it must treat higher parent attendance as a good thing.", "C": "No, the statement does not say how many parents were actually asked about their availability.", "D": "No, some parents have to work on Fridays too, so attendance might not really turn out to be higher."}, "fig": "", "passage": "", "qnum": "32"}, {"n": "72", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "根據文章，老茶館生意冷清的主要原因是甚麼？<br><span style=\"color:#555\">根据文章，老茶馆生意冷清的主要原因是什么？</span>", "options": {"A": "茶葉的價錢比從前貴了許多<br><span style=\"color:#555\">茶叶的价钱比从前贵了许多</span>", "B": "陳伯的手藝不如往日精湛<br><span style=\"color:#555\">陈伯的手艺不如往日精湛</span>", "C": "鎮上開了好幾家新的茶館搶生意<br><span style=\"color:#555\">镇上开了好几家新的茶馆抢生意</span>", "D": "年輕人的生活步調改變，少了從容品茶的閒情<br><span style=\"color:#555\">年轻人的生活步调改变，少了从容品茶的闲情</span>"}, "fig": "", "passage": "小鎮的盡頭有一間老茶館，門楣上「清心」二字已被歲月磨得有些斑駁。陳伯守着這間茶館，已經四十多個年頭了。從前，每到午後，茶館裏總是高朋滿座，談笑聲、棋子聲此起彼落，好不熱鬧。如今，街上的人腳步匆匆，再沒有人願意坐下來，靜靜地品一壺好茶。陳伯的手藝依舊，茶香依舊，只是那份從容的閒情，彷彿隨着舊日的時光一同遠去了。茶涼了，他又默默地續上一壺；牆上掛着的那幅字畫，依然筆勢蒼勁，引人注目。角落裏，一位老人靜靜地看着窗外，彷彿也在等候某個再不會回來的人。窗外的雨依舊下個不停，陳伯的思緒，也飄回了多年前的那個午後。<br><span style=\"color:#555\">小镇的尽头有一间老茶馆，门楣上「清心」二字已被岁月磨得有些斑驳。陈伯守着这间茶馆，已经四十多个年头了。从前，每到午后，茶馆里总是高朋满座，谈笑声、棋子声此起彼落，好不热闹。如今，街上的人脚步匆匆，再没有人愿意坐下来，静静地品一壶好茶。陈伯的手艺依旧，茶香依旧，只是那份从容的闲情，仿佛随着旧日的时光一同远去了。茶凉了，他又默默地续上一壶；墙上挂着的那幅字画，依然笔势苍劲，引人注目。角落里，一位老人静静地看着窗外，仿佛也在等候某个再不会回来的人。窗外的雨依旧下个不停，陈伯的思绪，也飘回了多年前的那个午后。</span>", "qnum": "1"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "文中「茶涼了，又續上一壺」這句話，最能表達陳伯怎樣的心情？<br><span style=\"color:#555\">文中「茶凉了，又续上一壶」这句话，最能表达陈伯怎样的心情？</span>", "options": {"A": "對顧客遲遲不來的焦急與不耐<br><span style=\"color:#555\">对顾客迟迟不来的焦急与不耐</span>", "B": "對舊日時光默默的守候與不捨<br><span style=\"color:#555\">对旧日时光默默的守候与不舍</span>", "C": "對生意興隆的滿足與得意<br><span style=\"color:#555\">对生意兴隆的满足与得意</span>", "D": "對天氣轉冷的擔憂<br><span style=\"color:#555\">对天气转冷的担忧</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "作者在這篇文章中流露出的態度，最接近以下哪一項？<br><span style=\"color:#555\">作者在这篇文章中流露出的态度，最接近以下哪一项？</span>", "options": {"A": "嚴厲批評年輕人不懂珍惜傳統<br><span style=\"color:#555\">严厉批评年轻人不懂珍惜传统</span>", "B": "對舊事物消逝懷有淡淡的惋惜<br><span style=\"color:#555\">对旧事物消逝怀有淡淡的惋惜</span>", "C": "勸人放下過去、積極向前<br><span style=\"color:#555\">劝人放下过去、积极向前</span>", "D": "客觀記述一間茶館的經營情況<br><span style=\"color:#555\">客观记述一间茶馆的经营情况</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "下列哪一項最適合作為這篇文章的標題？<br><span style=\"color:#555\">下列哪一项最适合作为这篇文章的标题？</span>", "options": {"A": "《泡茶的學問》<br><span style=\"color:#555\">《泡茶的学问》</span>", "B": "《陳伯的致富之道》<br><span style=\"color:#555\">《陈伯的致富之道》</span>", "C": "《小鎮旅遊指南》<br><span style=\"color:#555\">《小镇旅游指南》</span>", "D": "《一壺茶，半生情》<br><span style=\"color:#555\">《一壶茶，半生情》</span>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "從文章可以推斷，那位坐在角落、「靜靜看着窗外」的老人，最可能是甚麼人？<br><span style=\"color:#555\">从文章可以推断，那位坐在角落、「静静看着窗外」的老人，最可能是什么人？</span>", "options": {"A": "一位和陳伯一樣懷念舊日的老茶客<br><span style=\"color:#555\">一位和陈伯一样怀念旧日的老茶客</span>", "B": "前來查問租金的業主<br><span style=\"color:#555\">前来查问租金的业主</span>", "C": "迷路而進來歇腳的遊客<br><span style=\"color:#555\">迷路而进来歇脚的游客</span>", "D": "陳伯新請來的夥計<br><span style=\"color:#555\">陈伯新请来的伙计</span>"}, "fig": "", "passage": "", "qnum": "5"}, pan>", "C": "一蹶不振", "D": "一絲不苟<br><span style=\"color:#555\">一丝不苟</span>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "下列句子中，成語運用恰當的一句是：<br><span style=\"color:#555\">下列句子中，成语运用恰当的一句是：</span>", "options": {"A": "這部電影情節精彩，看得我們津津有味。<br><span style=\"color:#555\">这部电影情节精彩，看得我们津津有味。</span>", "B": "他成績優異，真是罄竹難書。<br><span style=\"color:#555\">他成绩优异，真是罄竹难书。</span>", "C": "她剛獲獎，心情低落，垂頭喪氣。<br><span style=\"color:#555\">她刚获奖，心情低落，垂头丧气。</span>", "D": "弟弟年紀雖小，做起事來卻老態龍鍾。<br><span style=\"color:#555\">弟弟年纪虽小，做起事来却老态龙钟。</span>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "84", "type": "mcq", "section": "Chinese", "stem": "「______陳伯的茶藝再精湛，______留不住匆匆而過的客人。」橫線上最適合填入的關聯詞是：<br><span style=\"color:#555\">「______陈伯的茶艺再精湛，______留不住匆匆而过的客人。」横线上最适合填入的关联词是：</span>", "options": {"A": "因為……所以……<br><span style=\"color:#555\">因为……所以……</span>", "B": "縱使……也……<br><span style=\"color:#555\">纵使……也……</span>", "C": "只要……就……", "D": "不但……而且……"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "下列句子，沒有語病的一句是：<br><span style=\"color:#555\">下列句子，没有语病的一句是：</span>", "options": {"A": "他的成功，是憑着多年苦練得來的結果換來的。<br><span style=\"color:#555\">他的成功，是凭着多年苦练得来的结果换来的。</span>", "B": "我們要及時糾正並改正作業中的錯誤。<br><span style=\"color:#555\">我们要及时纠正并改正作业中的错误。</span>", "C": "他這番話，深深地打動了在場的每一個人。<br><span style=\"color:#555\">他这番话，深深地打动了在场的每一个人。</span>", "D": "全班同學差不多幾乎都讀過這本小說。<br><span style=\"color:#555\">全班同学差不多几乎都读过这本小说。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "「窗外的雨______下個不停，他的思緒______飄回了多年前的那個午後。」最適合填入的一組詞語是：<br><span style=\"color:#555\">「窗外的雨______下个不停，他的思绪______飘回了多年前的那个午后。」最适合填入的一组词语是：</span>", "options": {"A": "已經……竟然……<br><span style=\"color:#555\">已经……竟然……</span>", "B": "彷彿……便……<br><span style=\"color:#555\">仿佛……便……</span>", "C": "依舊……也……<br><span style=\"color:#555\">依旧……也……</span>", "D": "雖然……但是……<br><span style=\"color:#555\">虽然……但是……</span>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
