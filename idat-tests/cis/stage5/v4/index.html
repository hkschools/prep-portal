<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}

  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;

  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}

": "The committee recommended that the report is published in full.", "C": "The committee recommended that the report was published in full.", "D": "The committee recommended that the report will be published in full."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which sentence correctly reduces the relative clause in \"the samples that were collected in March\"?", "options": {"A": "the samples collecting in March", "B": "the samples which collected in March", "C": "the samples collected in March", "D": "the samples had collected in March"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "\"If the barometer ____ that morning, the boats would still be at sea.\" Which completion makes a MIXED conditional?", "options": {"A": "did not fall", "B": "has not fallen", "C": "would not have fallen", "D": "had not fallen"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which sentence compares the two things in parallel form?", "options": {"A": "Reading the log is quicker than checking the instruments.", "B": "Reading the log is quicker than to check the instruments.", "C": "To read the log is quicker than checking the instruments.", "D": "Reading the log is quicker than the instruments."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence punctuates the quotation correctly?", "options": {"A": "\"The glass is falling.\" Hare wrote, \"and I do not like the colour of the sky.\"", "B": "\"The glass is falling,\" Hare wrote, \"and I do not like the colour of the sky.\"", "C": "\"The glass is falling\", Hare wrote, \"and I do not like the colour of the sky\".", "D": "\"The glass is falling,\" Hare wrote, \"And I do not like the colour of the sky.\""}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Where should \"only\" go to say that the crew did nothing except wait?", "options": {"A": "Only the crew waited.", "B": "The crew waited only.", "C": "The crew only waited.", "D": "The only crew waited."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "A paragraph has just conceded that the older method was cheaper. Which connective best opens the next sentence, which gives the reason to abandon it anyway?", "options": {"A": "Consequently,", "B": "Nevertheless,", "C": "Similarly,", "D": "For instance,"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "In \"what the instruments recorded contradicted the captain's account\", the underlined group <u>what the instruments recorded</u> functions as", "options": {"A": "the subject of the sentence", "B": "an adverbial of time", "C": "the object of the verb", "D": "a relative clause describing a noun"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which sentence keeps its tenses consistent?", "options": {"A": "He opened the log, reads the last entry and closed the book without a word.", "B": "He opens the log, read the last entry and closes the book without a word.", "C": "He had opened the log, reads the last entry and will close the book without a word.", "D": "He opened the log, read the last entry and closed the book without a word."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Why might a scientific report prefer \"the samples were stored at four degrees\" to \"we stored the samples at four degrees\"?", "options": {"A": "It is shorter than the active version.", "B": "It keeps the focus on the procedure rather than on the people carrying it out.", "C": "The passive is always more formal than the active.", "D": "It avoids naming a tense."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which of these is SLANG rather than an idiom or a euphemism?", "options": {"A": "passed away", "B": "under the weather", "C": "gutted", "D": "let go"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which phrase is a EUPHEMISM?", "options": {"A": "a period of adjustment", "B": "a complete disaster", "C": "swings and roundabouts", "D": "a hard sell"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "A writer describes a rival firm's plan as \"a house built on sand\". The EFFECT of this image is to", "options": {"A": "suggest the plan is unusually cheap to carry out", "B": "suggest the plan was designed in a hurry", "C": "suggest the plan belongs to an earlier age", "D": "suggest the plan will collapse because its foundation is unsound"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "\"The sea worked at the cliff, patiently, year upon year, as a debtor works at a debt.\" The comparison mainly makes the sea's action feel", "options": {"A": "slow, deliberate and certain to finish", "B": "violent and sudden", "C": "wasteful and pointless", "D": "beautiful and calming"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which word most precisely describes evidence that points towards a conclusion without proving it?", "options": {"A": "conclusive", "B": "irrelevant", "C": "fabricated", "D": "suggestive"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "\"Her account of the voyage was <u>laconic</u>: eleven words for a week in which two men nearly drowned.\" \"Laconic\" means", "options": {"A": "difficult to believe", "B": "using very few words", "C": "full of vivid detail", "D": "written long after the event"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Which word ood?", "options": {"A": "They dive on to the water from a height.", "B": "They follow the ship and take scraps from the water.", "C": "They wade in the shallows near the northern point.", "D": "They settle on the surface and reach below it."}, "fig": "", "passage": "<strong>From the Journal of Thomas Hare, Naturalist, 1871</strong><br>The eighth day. We are becalmed off the northern point, and I confess the stillness unsettles me more than the gale did. A wind, however ill-tempered, may be reasoned with by degrees; a flat sea offers nothing to argue against.\n\nI have spent the morning at the rail with the glass. The birds that trouble the water here are of a kind I have not met with, and I set down what I saw with such exactness as I can manage, being conscious that a naturalist's memory is a poor cupboard and leaks at every joint. They are white about the throat, dark upon the back, and they fish not by diving from a height, as the gannet does, but by settling upon the surface and reaching beneath it, in the manner of a woman feeling for a dropped coin in dark water. It is an ungainly method and it appears to answer very well.\n\nOssian holds that they are a variety of the common tern, driven south. I am not persuaded. The bill is heavier and the wing shorter than any tern I have handled, and a bird driven from its country by weather does not, in my experience, take up a new manner of feeding within the season. Still, I set his opinion beside mine and let the reader choose; it is the business of a journal to record what was thought as well as what was seen, and I have been wrong before in print, which is a lesson that improves the temper if not the reputation.\n\nTowards four the water darkened to the east and the men grew cheerful. We shall have wind by morning. I am sorry for it. The birds will go, and I shall never know whether Ossian was right.<br><br><strong>What Victorian Naturalists Got Right</strong><br>The journals of nineteenth-century field naturalists occupy an awkward place in modern science. They contain a great deal that is simply wrong: species misassigned, distances misjudged, and confident explanations of behaviour that later work overturned. They were also written without any of the equipment that makes a modern observation checkable, and often by men with no formal training in the subject at all.\n\nAnd yet they remain in use. Three qualities explain why. The first is that the best of them describe rather than conclude. A journal entry that records the shape of a bill, the length of a wing and the exact method of feeding stays useful long after the identification attached to it has been discarded, because a later reader can re-identify the animal from the description.\n\nThe second is that they record the observer's uncertainty. It became a convention in the better journals to set a rival interpretation beside one's own and leave the matter open. A modern reader can therefore see which parts of an entry were settled and which were contested at the time, which is information a confident summary destroys.\n\nThe third is date and place. A Victorian journal fixes an animal at a location on a day, and for many species those entries are the earliest records that exist. Researchers reconstructing how ranges have shifted over 150 years depend on them, and no amount of modern instrumentation can recover an observation nobody made.\n\nThe lesson is not that the Victorians were better observers than their successors. It is that a record built to be re-examined outlasts one built to persuade.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "Hare compares the birds' feeding to \"a woman feeling for a dropped coin in dark water\". The main EFFECT of this comparison is to", "options": {"A": "show that the birds are clumsy and unsuccessful", "B": "suggest that the birds are searching for something they have lost", "C": "make an unfamiliar movement immediately easy to picture", "D": "emphasise h ssage": "", "qnum": "9"}, {"n": "49", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Work out <span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span> of 0.64, giving your answer as a decimal.", "options": {"A": "1.71", "B": "0.24", "C": "0.08", "D": "0.192"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "50", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "What is the size of each interior angle of a regular decagon?", "options": {"A": "144°", "B": "36°", "C": "1,440°", "D": "108°"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "51", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In the right-angled triangle shown, the two shorter sides are 9 cm and 12 cm. How long is the hypotenuse?", "options": {"A": "21 cm", "B": "225 cm", "C": "15 cm", "D": "7.9 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"239.2,204.0 120.8,204.0 120.8,46.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"239.2\" cy=\"204.0\" r=\"3\" fill=\"#1F3864\"/><text x=\"253.4\" y=\"218.4\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"120.8\" cy=\"204.0\" r=\"3\" fill=\"#1F3864\"/><text x=\"110.5\" y=\"222.6\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"120.8\" cy=\"46.0\" r=\"3\" fill=\"#1F3864\"/><text x=\"114.8\" y=\"35.1\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"180.0\" y=\"230.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">9 cm</text><text x=\"99.8\" y=\"130.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">12 cm</text><text x=\"196.8\" y=\"117.4\" font-size=\"14\" text-anchor=\"middle\" fill=\"#C00\">?</text><polyline points=\"136.8,204.0 136.8,188.0 120.8,188.0\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.6\"/></svg>", "passage": "", "qnum": "12"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The point (4, -1) is reflected in the y-axis. What are the coordinates of the image?", "options": {"A": "(4, 1)", "B": "(-4, -1)", "C": "(-4, 1)", "D": "(-1, 4)"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A shape is enlarged by scale factor 3. Its original area was 8 cm squared. What is the area of the enlarged shape?", "options": {"A": "72 cm squared", "B": "24 cm squared", "C": "8 cm squared", "D": "216 cm squared"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A fair spinner has eight equal sectors numbered 1 to 8. What is the probability that one spin gives a number that is BOTH even and greater than 3?", "options": {"A": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>", "B": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">8</span></span>", "C": "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span>", "D": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span>"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sum of money is shared between three people in the ratio 2 : 3 : 7. The largest share is $854. How much was shared altogether?", "options": {"A": "$2,562", "B": "$1,220", "C": "$5,978", "D": "$1,464"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The cylinder shown has a radius of 5 cm and a height of 14 cm. What is its volume, to the nearest cubic centimetre? Use π = 3.14.", "options": {"A": "220 cm cubed", "B": "1,099 cm cubed", "C": "2,199 cm cubed", "D": "314 cm cubed"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"300\" viewBox=\"0 0 300 300\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"300\" fill=\"white\"/><ellipse cx=\"100\" cy=\"230\" rx=\"64\" ry=\"20\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"36\" y=\"60\" width=\"128\" height=\"170\" fill=\"#EAF0FA\" stroke=\"none\"/><line x1=\"36\" y1=\"60\" x2=\"36\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"164\" y1=\"60\" x2=\"164\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M36,230 A64,20 0 0 0 164,230\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><ellipse cx=\"100\" cy=\"60\" rx=\"64\" ry=\"20\" fill=\"#DCE6F6\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"100\" y1=\"60\" x2=\"164\" y2=\"60\" stroke=\"#C00\" stroke-width=\"1.5\"/><text x=\"132\" y=\"53\" font-size=\"13\" text-anchor=\"middle\" fill=\"#C00\">5 cm</text><line x1=\"180\" y1=\"60\" x2=\"180\" y2=\"230\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"186\" y=\"145\" font-size=\"13\" fill=\"#333\">14 cm</text></svg>", "passage": "", "qnum": "17"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A train covers 189 km in 1 hour and 45 minutes. What is its average speed in kilometres per hour?", "options": {"A": "108 km/h", "B": "189 km/h", "C": "110.6 km/h", "D": "94.5 km/h"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The bar chart shows how many books five pupils read over the summer. What is the MEAN number of books read?", "options": {"A": "6", "B": "11", "C": "35", "D": "7"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"460\" height=\"300\" viewBox=\"0 0 460 300\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"460\" height=\"300\" fill=\"white\"/><text x=\"230.0\" y=\"18\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">Summer reading</text><line x1=\"50\" y1=\"250.0\" x2=\"440\" y2=\"250.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"254.0\" text-anchor=\"end\" font-size=\"11\">0</text><line x1=\"50\" y1=\"206.0\" x2=\"440\" y2=\"206.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"210.0\" text-anchor=\"end\" font-size=\"11\">3</text><line x1=\"50\" y1=\"162.0\" x2=\"440\" y2=\"162.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"166.0\" text-anchor=\"end\" font-size=\"11\">6</text><line x1=\"50\" y1=\"118.0\" x2=\"440\" y2=\"118.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"122.0\" text-anchor=\"end\" font-size=\"11\">9</text><line x1=\"50\" y1=\"74.0\" x2=\"440\" y2=\"74.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"78.0\" text-anchor=\"end\" font-size=\"11\">12</text><line x1=\"50\" y1=\"30.0\" x2=\"440\" y2=\"30.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"34.0\" text-anchor=\"end\" font-size=\"11\">15</text><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"250\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"250\" x2=\"440\" y2=\"250\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"65.6\" y=\"191.3\" width=\"46.8\" height=\"58.7\" fill=\"#4472C4\"/><text x=\"89.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">Ada</text><rect x=\"143.6\" y=\"118.0\" width=\"46.8\" height=\"132.0\" fill=\"#ED7D31\"/><text x=\"167.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">Bo</text><rect x=\"221.6\" y=\"162.0\" width=\"46.8\" height=\"88.0\" fill=\"#70AD47\"/><text x=\"245.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">Cai</text><rect x=\"299.6\" y=\"88.7\" width=\"46.8\" height=\"161.3\" fill=\"#FFC000\"/><text x=\"323.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">Dev</text><rect x=\"377.6\" y=\"176.7\" width=\"46.8\" height=\"73.3\" fill=\"#5B9BD5\"/><text x=\"401.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">Eli</text><text x=\"14\" y=\"140.0\" text-anchor=\"middle\" font-size=\"11\" transform=\"rotate(-90 14 140.0)\">Books read</text></svg>", "passage": "", "qnum": "19"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A flight leaves Hong Kong at 23:40 on Monday and takes 13 hours 20 minutes. London is 7 hours BEHIND Hong Kong. What is the local time and day in London when it lands?", "options": {"A": "13:00 on Tuesday", "B": "05:00 on Tuesday", "C": "05:00 on Monday", "D": "12:00 on Tuesday"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A solid cube measuring 4 cm on each edge is painted on every face and then cut into 1 cm cubes. How many of the small cubes have EXACTLY two painted faces?", "options": {"A": "8", "B": "16", "C": "12", "D": "24"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In an invented language, \"tren mopa\" means \"blue river\", \"mopa sile\" means \"river crossing\" and \"sile drun\" means \"crossing guard\". Which word means \"guard\"?", "options": {"A": "sile", "B": "mopa", "C": "drun", "D": "tren"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this sequence: 1, 4, 13, 40, 121, ___ . What number comes next?", "options": {"A": "364", "B": "242", "C": "363", "D": "400"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four runners finish a race. Priya finishes ahead of Marco. Sam finishes behind Marco but ahead of Tara. Marco does not finish first. Who finished FIRST?", "options": {"A": "Marco", "B": "Sam", "C": "Tara", "D": "Priya"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code, the word FLAME is written GJDIJ. Using the same rule, how is CHASE written?", "options": {"A": "DIBTF", "B": "BJZWA", "C": "DFDQJ", "D": "DFDQI"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two taps fill a tank. On its own the first takes 6 hours and the second takes 12 hours. How long do they take running together?", "options": {"A": "4 hours", "B": "9 hours", "C": "18 hours", "D": "3 hours"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Our company should move its customer helpline to an online chat service, because the average call now costs us four times what an average chat session costs.\"\n\nPROPOSED ASSUMPTION: \"Customers who currently telephone the helpline would be able to resolve their queries through an online chat service.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "No. The statement is a comparison of costs and makes no claim about what customers are able to do.", "B": "Yes. The argument treats the two channels as interchangeable and compares only their cost, which makes sense only if chat can do the same job for the same customers."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A trial reported that among patients given the new inhaler, 62 per cent reported fewer night-time symptoms, compared with 41 per cent of those given the older inhaler. Patients were assigned to the two groups at random.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "The new inhaler relieves night-time symptoms in 62 per cent of all patients.", "B": "The new inhaler is safe for long-term use.", "C": "A higher proportion of the new-inhaler group than of the old-inhaler group reported fewer night-time symptoms.", "D": "At least 21 per cent of patients would have improved without any inhaler."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A retailer analysed its 2,000 online orders from one week. It found that 1,300 were placed from a mobile phone, 900 included at least one item on promotion, and 400 were both from a mobile phone and included a promoted item.\"\n\nCONCLUSION (1): More orders came from a mobile phone than from all other devices combined.\nCONCLUSION (2): Most orders that included a promoted item were placed from a mobile phone.\nCONCLUSION (3): Exactly 200 orders were neither from a mobile phone nor included a promoted item.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "Conclusions 1 and 3 follow, but Conclusion 2 does not.", "B": "All three conclusions follow.", "C": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "D": "Conclusion 1 follows, but Conclusions 2 and 3 do not."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"If a supplier passes the annual audit, it is added to the approved list. No supplier on the approved list is charged a deposit.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "Any supplier that is not charged a deposit has passed the annual audit.", "B": "Every supplier on the approved list has passed the annual audit.", "C": "No supplier that passes the annual audit is charged a deposit."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should a company require all staff to return to the office five days a week in order to raise productivity?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "No. A randomised trial at a firm with 1,600 engineers and marketers assigned teams to two days at home or five days in the office for six months. Performance reviews and code output were indistinguishable between the two groups, while resignations in the hybrid group fell by a third. Because teams were assigned rather than choosing, the comparison is not explained by more committed staff picking one arrangement over the other.", "B": "Yes. Everyone knows you cannot build a real team over a video call. The best ideas I have ever had came from a conversation by the coffee machine, and you simply do not get those at home. Why are we even debating something so obvious?", "C": "No. Staff have arranged their lives around working from home, and forcing them back would be unfair after several years of a different expectation. Many would have to move house or change their childcare arrangements at short notice."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A newspaper reported: 'Towns that opened a branch of the chain last year saw retail employment grow by 4 per cent, while towns without a branch saw it grow by 1 per cent.'\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Opening a branch of the chain causes retail employment to grow.", "B": "Retail employment grew in both groups of towns last year.", "C": "The chain opened branches in most of the towns surveyed.", "D": "Retail employment in towns with a branch is now higher than in towns without one."}, "fig": "", "passage": "", "qnum": "32"}, {"n": "72", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "文章開首提出的問題是甚麼？<br><i>文章开首提出的问题是甚么？</i>", "options": {"A": "學校應否公開學生的分數<br><i>学校应否公开学生的分数</i>", "B": "取消排名究竟是進步還是逃避<br><i>取消排名究竟是进步还是逃避</i>", "C": "考試次數是否應該減少<br><i>考试次数是否应该减少</i>", "D": "壁報應該張貼甚麼內容<br><i>壁报应该张贴甚么内容</i>"}, "fig": "", "passage": "每逢考試放榜，總有學校把成績排名貼在壁報上，由第一名排到最後一名。有人認為這是公平的做法：分數人人看得見，誰努力誰鬆懈，一目了然。近年卻有不少學校把排名取消，只把分數告訴學生本人。這樣的改變，究竟是進步，還是逃避？\n\n主張保留排名的人，理由大致有兩個。其一是排名能夠激發鬥志。人總是在比較中認識自己的位置，若連位置也不知道，努力便失去方向。其二是社會本身就充滿競爭，升學、求職，無一不是排名。學校若刻意迴避，只會讓學生日後更難適應。\n\n這兩個理由都有道理，卻並不完整。先說激勵。心理學界一項追蹤研究把同級學生分成兩組，一組每次考試後看到全班排名，另一組只看到自己的分數和進步幅度。一年之後，兩組的平均成績相差不大；但在排名組中，原本名次靠後的學生，其學習動機明顯下跌。換言之，排名激勵了本已領先的人，卻打擊了最需要鼓勵的人。所謂「激發鬥志」，只對一部分學生成立。\n\n再說適應社會。社會確有競爭，但競爭的形式並非把所有人放在同一條隊伍裏比高低。一名出色的工程師與一名出色的護士，並不需要分出誰是第一。學校若把「競爭」窄化為「排名」，學生學到的其實不是競爭，而是把自己的價值交給一個數字。\n\n古人早有此見。《論語》有言：「君子和而不同。」和而不同，是承認彼此有別而仍能共處；排名卻要求所有人在同一把尺上排列。以一把尺量盡眾人之長，本身就是一種粗疏。\n\n取消排名並不等於取消要求。學校仍可讓學生看見自己的分數、自己的進步、自己與課程要求的距離。這些訊息比一個名次具體得多，也更容易化為下一步的行動。真正該被取消的，不是對成績的重視，而是把人與人並排比較的習慣。<br><i>每逢考试放榜，总有学校把成绩排名贴在壁报上，由第一名排到最后一名。有人认为这是公平的做法：分数人人看得见，谁努力谁松懈，一目了然。近年却有不少学校把排名取消，只把分数告诉学生本人。这样的改变，究竟是进步，还是逃避？\n\n主张保留排名的人，理由大致有两个。其一是排名能够激发斗志。人总是在比较中认识自己的位置，若连位置也不知道，努力便失去方向。其二是社会本身就充满竞争，升学、求职，无一不是排名。学校若刻意回避，只会让学生日后更难适应。\n\n这两个理由都有道理，却并不完整。先说激励。心理学界一项追踪研究把同级学生分成两组，一组每次考试后看到全班排名，另一组只看到自己的分数和进步幅度。一年之后，两组的平均成绩相差不大；但在排名组中，原本名次靠后的学生，其学习动机明显下跌。换言之，排名激励了本已领先的人，却打击了最需要鼓励的人。所谓「激发斗志」，只对一部分学生成立。\n\n再说适应社会。社会确有竞争，但竞争的形式并非把所有人放在同一条队伍里比高低。一名出色的工程师与一名出色的护士，并不需要分出谁是第一。学校若把「竞争」窄化为「排名」，学生学到的其实不是竞争，而是把自己的价值交给一个数字。\n\n古人早有此见。《论语》有言：「君子和而不同。」和而不同，是承认彼此有别而仍能共处；排名却要求所有人在同一把尺上排列。以一把尺量尽众人之长，本身就是一种粗疏。\n\n取消排名并不等于取消要求。学校仍可让学生看见自己的分数、自己的进步、自己与课程要求的距离。这些讯息比一个名次具体得多，也更容易化为下一步的行动。真正该被取消的，不是对成绩的重视，而是把人与人并排比较的习惯。</i>", "qnum": "1"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "主張保留排名的人提出的兩個理由是甚麼？<br><i>主张保留排名的人提出的两个理由是甚么？</i>", "options": {"A": "排名省時方便，又能減輕教師的工作<br><i>排名省时方便，又能减轻教师的工作</i>", "B": "排名能讓家長知情，又能提高學校聲譽<br><i>排名能让家长知情，又能提高学校声誉</i>", "C": "排名能激發鬥志，又能讓學生適應競爭的社會<br><i>排名能激发斗志，又能让学生适应竞争的社会</i>", "D": "排名有助分班，又能決定升留級<br><i>排名有助分班，又能决定升留级</i>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "文中引述的追蹤研究，最主要說明了甚麼？<br><i>文中引述的追踪研究，最主要说明了甚么？</i>", "options": {"A": "排名主要激勵了本已領先的學生，卻打擊了成績落後的學生<br><i>排名主要激励了本已领先的学生，却打击了成绩落后的学生</i>", "B": "看排名的一組平均成績明顯較好<br><i>看排名的一组平均成绩明显较好</i>", "C": "只看分數的一組完全沒有進步<br><i>只看分数的一组完全没有进步</i>", "D": "學生的動機與考試次數有關<br><i>学生的动机与考试次数有关</i>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "作者認為把「競爭」窄化為「排名」，會有甚麼後果？<br><i>作者认为把「竞争」窄化为「排名」，会有甚么后果？</i>", "options": {"A": "學生會完全失去競爭意識<br><i>学生会完全失去竞争意识</i>", "B": "學校的課程會變得過於艱深<br><i>学校的课程会变得过于艰深</i>", "C": "成績好的學生會拒絕幫助同學<br><i>成绩好的学生会拒绝帮助同学</i>", "D": "學生會把自己的價值交給一個數字<br><i>学生会把自己的价值交给一个数字</i>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "作者認為真正應該取消的是甚麼？<br><i>作者认为真正应该取消的是甚么？</i>", "options": {"A": "對成績的重視<br><i>对成绩的重视</i>", "B": "把人與人並排比較的習慣<br><i>把人与人并排比较的习惯</i>", "C": "所有形式的考試<br><i>所有形式的考试</i>", "D": "學生之間的一切競爭<br><i>学生之间的一切竞争</i>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "本文的論證結構是怎樣的？<br><i>本文的论证结构是怎样的？</i>", "options": {"A": "先提出自己的主張，再舉出三個例子加以證明<br><i>先提出自己的主张，再举出三个例子加以证明</i>", "B": "由頭到尾只反覆說明排名的害處<br><i>由头到尾只反复说明排名的害处</i>", "C": "以個人的求學經歷貫串全文<br><i>以个人的求学经历贯串全文</i>", "D": "先列出對方的理由，再逐一指出其不足，最後提出自己的主張<br><i>先列出对方的理由，再逐一指出其不足，最后提出自己的主张</i>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "「誰努力誰鬆懈，一目了然」，「一目了然」在文中的意思是<br><i>「谁努力谁松懈，一目了然」，「一目了然」在文中的意思是</i>", "options": {"A": "看一眼就完全清楚", "B": "看了一次便忘記<br><i>看了一次便忘记</i>", "C": "只看見表面的情況<br><i>只看见表面的情况</i>", "D": "眾人的看法一致<br><i>众人的看法一致</i>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "「以一把尺量盡眾人之長，本身就是一種粗疏」，「粗疏」的意思是<br><i>「以一把尺量尽众人之长，本身就是一种粗疏」，「粗疏」的意思是</i>", "options": {"A": "態度粗暴無禮<br><i>态度粗暴无礼</i>", "B": "尺寸做得太大", "C": "做法草率，不夠細緻<br><i>做法草率，不够细致</i>", "D": "人數過於眾多<br><i>人数过于众多</i>"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "「換言之，排名激勵了本已領先的人」，「換言之」的作用是<br><i>「换言之，排名激励了本已领先的人」，「换言之」的作用是</i>", "options": {"A": "引出一個相反的例子<br><i>引出一个相反的例子</i>", "B": "把上文的意思換個說法再說一次<br><i>把上文的意思换个说法再说一次</i>", "C": "表示下文是新的證據<br><i>表示下文是新的证据</i>", "D": "提醒讀者上文有誤<br><i>提醒读者上文有误</i>"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "82", "type": "mcq", "section": "Chinese", "stem": "文中引《論語》「君子和而不同」，這句話的意思是<br><i>文中引《论语》「君子和而不同」，这句话的意思是</i>", "options": {"A": "君子待人和氣，所以與眾人並無分別<br><i>君子待人和气，所以与众人并无分别</i>", "B": "君子凡事和稀泥，不肯表明立場<br><i>君子凡事和稀泥，不肯表明立场</i>", "C": "君子只與意見相同的人來往<br><i>君子只与意见相同的人来往</i>", "D": "君子能與人和睦相處，卻不必事事與人相同<br><i>君子能与人和睦相处，却不必事事与人相同</i>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "第三段指出排名「激勵了本已領先的人，卻打擊了最需要鼓勵的人」。這種情況最適合用哪個成語形容？<br><i>第三段指出排名「激励了本已领先的人，却打击了最需要鼓励的人」。这种情况最适合用哪个成语形容？</i>", "options": {"A": "因材施教", "B": "循序漸進<br><i>循序渐进</i>", "C": "適得其反<br><i>适得其反</i>", "D": "有教無類<br><i>有教无类</i>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "84", "type": "mcq", "section": "Chinese", "stem": "「這兩個理由都有道理，卻並不完整。」句中的「卻」，其作用是<br><i>「这两个理由都有道理，却并不完整。」句中的「却」，其作用是</i>", "options": {"A": "承接上文而語意一轉<br><i>承接上文而语意一转</i>", "B": "加強上文的語氣<br><i>加强上文的语气</i>", "C": "說明上文的原因<br><i>说明上文的原因</i>", "D": "列舉另一件同類的事<br><i>列举另一件同类的事</i>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "下列哪一句的語序最通順？<br><i>下列哪一句的语序最通顺？</i>", "options": {"A": "學校仍可讓自己與課程要求的距離看見學生。<br><i>学校仍可让自己与课程要求的距离看见学生。</i>", "B": "仍可學校讓學生看見自己與課程要求的距離。<br><i>仍可学校让学生看见自己与课程要求的距离。</i>", "C": "學校仍可讓學生看見自己與課程要求的距離。<br><i>学校仍可让学生看见自己与课程要求的距离。</i>", "D": "學校讓學生仍可看見距離自己與課程要求的。<br><i>学校让学生仍可看见距离自己与课程要求的。</i>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "「究竟是進步，還是逃避？」這一句用了哪種修辭手法？<br><i>「究竟是进步，还是逃避？」这一句用了哪种修辞手法？</i>", "options": {"A": "反問<br><i>反问</i>", "B": "設問<br><i>设问</i>", "C": "排比", "D": "對偶<br><i>对偶</i>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 (V4)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
