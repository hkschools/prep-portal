<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCHOOL = "CIS", STAGE = "5", VERSION = "3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>resilient</u> in the sentence below?\n\nThe coral proved surprisingly resilient, regrowing within months after the storm had stripped the reef bare.", "options": {"A": "brightly coloured", "B": "able to recover quickly from damage", "C": "extremely rare", "D": "dangerous to touch"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which sentence is punctuated correctly?", "options": {"A": "The recipe needed: flour, butter, and two eggs.", "B": "The recipe: needed flour, butter, and two eggs.", "C": "The recipe needed three ingredients: flour, butter, and two eggs.", "D": "The recipe needed three ingredients, flour: butter, and two eggs."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe veteran reporter remained ______ under hostile questioning, never once raising her voice or losing her train of thought.", "options": {"A": "compliant", "B": "complacent", "C": "competent", "D": "composed"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the linking word that best fits the logic of the sentence.\n\nThe ferry service was cheaper than the train; ______, it took almost twice as long to reach the city.", "options": {"A": "however", "B": "therefore", "C": "for instance", "D": "likewise"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nThe negotiations had stalled for months, but a single phone call finally <u>broke the ice</u> between the two sides.", "options": {"A": "ended the talks for good", "B": "eased the tension and got things started", "C": "caused a serious new argument", "D": "delayed the decision further"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which version is punctuated correctly?", "options": {"A": "The festival drew crowds from three cities; Osaka, Japan; Busan, South Korea; and Taipei, Taiwan.", "B": "The festival drew crowds from three cities: Osaka, Japan; Busan, South Korea; and Taipei, Taiwan.", "C": "The festival drew crowds from three cities: Osaka, Japan, Busan, South Korea, and Taipei, Taiwan.", "D": "The festival drew crowds from three cities: Osaka; Japan, Busan; South Korea, and Taipei; Taiwan."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>frank</u> in the sentence below?\n\nIn a frank assessment, the coach told the squad exactly where they had gone wrong, holding nothing back.", "options": {"A": "gentle and tactful", "B": "brief and hurried", "C": "carefully rehearsed", "D": "honest and direct"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\n\n(A) After the long delay, (B) the passengers were exhausted, (C) they boarded the replacement coach (D) without complaint.", "options": {"A": "section (C)", "B": "section (A)", "C": "section (B)", "D": "section (D)"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which underlined phrase is a euphemism for the idea of 'an old, second-hand car'?", "options": {"A": "The dealer was selling a <u>brand-new model</u> straight from the factory.", "B": "The dealer was selling a <u>pre-owned vehicle</u> with sixty thousand miles on it.", "C": "The dealer was selling a <u>luxury sports car</u> with leather seats.", "D": "The dealer was selling a <u>company van</u> used for deliveries."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the option that makes the paragraph flow logically.\n\nThe review praised the restaurant's inventive menu. ______, it noted that the service was painfully slow.", "options": {"A": "As a result", "B": "In conclusion", "C": "Nevertheless", "D": "Above all"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe panel rejected the design as ______, pointing out that it copied almost every feature from a rival's product.", "options": {"A": "divisive", "B": "definitive", "C": "deferential", "D": "derivative"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which version is punctuated correctly?", "options": {"A": "He had only one regret: that he had never learned to swim.", "B": "He had only one regret; that he had never learned to swim.", "C": "He had only one regret, that he had never learned to swim:", "D": "He had: only one regret that he had never learned to swim."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nThe shutters <u>sighed and shifted</u> uneasily as the storm gathered outside.", "options": {"A": "metaphor", "B": "personification", "C": "onomatopoeia", "D": "hyperbole"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which sentence uses a semicolon correctly?", "options": {"A": "The match was called off; because the floodlights had failed.", "B": "The match was called off; and the fans were given refunds.", "C": "The match was called off; the fans were given refunds.", "D": "The match; was called off and the fans were given refunds."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>fleeting</u> in the sentence below?\n\nThe comet offered only a fleeting display, blazing across the sky for a few seconds before vanishing for another century.", "options": {"A": "extremely bright to look at", "B": "dangerous to observers", "C": "impossible to predict", "D": "lasting only a very short time"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\n\n(A) The box of old photographs (B) were stored (C) in the attic (D) for many years.", "options": {"A": "section (B)", "B": "section (A)", "C": "section (C)", "D": "section (D)"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Choose the most formal equivalent of the underlined slang for a written report.\n\nThe pilot study looked promising, but the team did not want to <u>get ahead of themselves</u>.", "options": {"A": "lose all hope", "B": "become overconfident too early", "C": "break the agreed rules", "D": "work far too slowly"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Choose the option in the most appropriate register for a formal email to a teacher.", "options": {"A": "Hiya, just wondering if you could send over the notes whenever.", "B": "Send me the notes ASAP, I really need them.", "C": "I would be grateful if you could send me the lesson notes when convenient.", "D": "Could you ping me those notes at some point? Cheers."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe instructions were admirably ______: a single page told the reader everything needed, with not a wasted word.", "options": {"A": "ambiguous", "B": "elaborate", "C": "tedious", "D": "concise"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Choose the conjunction that best expresses the relationship between the two ideas.\n\n______ the warning signs were clearly posted, several hikers still wandered off the marked path.", "options": {"A": "Although", "B": "Because", "C": "Unless", "D": "So that"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which literary device is illustrated by the underlined phrase?\n\nThe veteran called the chaos of the battlefield an example of <u>organised confusion</u>.", "options": {"A": "simile", "B": "oxymoron", "C": "alliteration", "D": "hyperbole"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Which sentence is spelled correctly?", "options": {"A": "The auditor said the figures were not entirely consistant with the records.", "B": "The auditor said the figures were not entirely consistnet with the records.", "C": "The auditor said the figures were not entirely consisttent with the records.", "D": "The auditor said the figures were not entirely consistent with the records."}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Choose the linking phrase that best preserves the flow of the argument.\n\nSolar panels generate no pollution while running. ______, manufacturing them uses scarce minerals and a great deal of energy.", "options": {"A": "In the same way", "B": "Consequently", "C": "To summarise", "D": "On the other hand"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>provisional</u> in the sentence below?\n\nThe committee issued a provisional timetable, warning that every date might change once funding was confirmed.", "options": {"A": "temporary and subject to change", "B": "highly detailed and technical", "C": "final and officially approved", "D": "secret and confidential"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe spokesperson's answer was deliberately ______: it could be taken as a firm denial or as a quiet admission.", "options": {"A": "amicable", "B": "ambitious", "C": "ambiguous", "D": "ample"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which version corrects the faulty sentence?", "options": {"A": "Rushing to catch the train, my ticket slipped out of my pocket.", "B": "Rushing to catch the train, the ticket was dropped by me on the platform.", "C": "Rushing to catch the train, I dropped my ticket on the platform.", "D": "Rushing to catch the train, it was discovered that the ticket was gone."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>felled</u> as it is used in paragraph 2 ('the tree was to be felled to widen the road')?", "options": {"A": "cut down", "B": "carefully replanted", "C": "fenced off", "D": "watered daily"}, "fig": "", "passage": "<strong>The Last Tree on Harbour Street</strong><br>For as long as anyone could remember, a single plane tree had stood at the elbow of Harbour Street, its roots cracking the pavement and its branches throwing a wide green shade over the bus stop. Mrs Okafor, who had sold newspapers on that corner for thirty years, called it her ceiling. On hot afternoons the whole queue gathered beneath it, strangers pressed shoulder to shoulder in its cool, and somehow they began to talk.\n\nThen the notices appeared, stapled to the trunk: the tree was to be felled to widen the road. Mrs Okafor read the notice twice, the way a person does when she hopes the words will rearrange themselves.\n\nA young engineer came to measure the pavement. 'It's only one tree,' he said, not unkindly. 'The new road will move thousands of cars an hour.'\n\nMrs Okafor folded her newspaper. 'Thousands of cars,' she agreed, 'and not one of them will stop to talk. You count what passes through, but a tree counts what stays.' She tapped the bark gently, as one might touch the shoulder of an old friend.\n\nThe engineer left, and in time the saws came. The road was wider now, and faster, and the buses no longer queued in the shade because there was no shade to queue in. People still waited on the corner, but they waited apart, eyes on their phones, and the talk that the tree had gathered drifted away with its leaves.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "Why did the queue of people gather under the plane tree on hot afternoons?", "options": {"A": "Because the bus only stopped there in summer.", "B": "Because Mrs Okafor sold newspapers from beneath it.", "C": "Because its branches gave a wide, cool shade.", "D": "Because the council had ordered them to wait there."}, "fig": "", "passage": "<strong>The Last Tree on Harbour Street</strong><br>For as long as anyone could remember, a single plane tree had stood at the elbow of Harbour Street, its roots cracking the pavement and its branches throwing a wide green shade over the bus stop. Mrs Okafor, who had sold newspapers on that corner for thirty years, called it her ceiling. On hot afternoons the whole queue gathered beneath it, strangers pressed shoulder to shoulder in its cool, and somehow they began to talk.\n\nThen the notices appeared, stapled to the trunk: the tree was to be felled to widen the road. Mrs Okafor read the notice twice, the way a person does when she hopes the words will rearrange themselves.\n\nA young engineer came to measure the pavement. 'It's only one tree,' he said, not unkindly. 'The new road will move thousands of cars an hour.'\n\nMrs Okafor folded her newspaper. 'Thousands of cars,' she agreed, 'and not one of them will stop to talk. You count what passes through, but a tree counts what stays.' She tapped the bark gently, as one might touch the shoulder of an old friend.\n\nThe engineer left, and in time the saws came. The road was wider now, and faster, and the buses no longer queued in the shade because there was no shade to queue in. People still waited on the corner, but they waited apart, eyes on their phones, and the talk that the tree had gathered drifted away with its leaves.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "What does Mrs Okafor most likely mean when she says, 'You count what passes through, but a tree counts what stays'?", "options": {"A": "The engineer values traffic flow, while she values the lasting human connections the tree created.", "B": "She believes the engineer's measurements of the pavement are wrong.", "C": "She thinks trees are physically stronger than roads.", "D": "She wants the council to count the cars more accurately."}, "fig": "", "passage": "<strong>The Last Tree on Harbour Street</strong><br>For as long as anyone could remember, a single plane tree had stood at the elbow of Harbour Street, its roots cracking the pavement and its branches throwing a wide green shade over the bus stop. Mrs Okafor, who had sold newspapers on that corner for thirty years, called it her ceiling. On hot afternoons the whole queue gathered beneath it, strangers pressed shoulder to shoulder in its cool, and somehow they began to talk.\n\nThen the notices appeared, stapled to the trunk: the tree was to be felled to widen the road. Mrs Okafor read the notice twice, the way a person does when she hopes the words will rearrange themselves.\n\nA young engineer came to measure the pavement. 'It's only one tree,' he said, not unkindly. 'The new road will move thousands of cars an hour.'\n\nMrs Okafor folded her newspaper. 'Thousands of cars,' she agreed, 'and not one of them will stop to talk. You count what passes through, but a tree counts what stays.' She tapped the bark gently, as one might touch the shoulder of an old friend.\n\nThe engineer left, and in time the saws came. The road was wider now, and faster, and the buses no longer queued in the shade because there was no shade to queue in. People still waited on the corner, but they waited apart, eyes on their phones, and the talk that the tree had gathered drifted away with its leaves.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "In the final paragraph, the people 'waited apart, eyes on their phones, and the talk that the tree had gathered drifted away with its leaves.' What is the main effect of this description?", "options": {"A": "It praises the new road for moving people more efficiently.", "B": "It links the loss of the tree to a loss of human connection, deepening the sense of regret.", "C": "It suggests the people were always unfriendly to one another.", "D": "It proves the phones caused the tree to be cut down."}, "fig": "", "passage": "<strong>The Last Tree on Harbour Street</strong><br>For as long as anyone could remember, a single plane tree had stood at the elbow of Harbour Street, its roots cracking the pavement and its branches throwing a wide green shade over the bus stop. Mrs Okafor, who had sold newspapers on that corner for thirty years, called it her ceiling. On hot afternoons the whole queue gathered beneath it, strangers pressed shoulder to shoulder in its cool, and somehow they began to talk.\n\nThen the notices appeared, stapled to the trunk: the tree was to be felled to widen the road. Mrs Okafor read the notice twice, the way a person does when she hopes the words will rearrange themselves.\n\nA young engineer came to measure the pavement. 'It's only one tree,' he said, not unkindly. 'The new road will move thousands of cars an hour.'\n\nMrs Okafor folded her newspaper. 'Thousands of cars,' she agreed, 'and not one of them will stop to talk. You count what passes through, but a tree counts what stays.' She tapped the bark gently, as one might touch the shoulder of an old friend.\n\nThe engineer left, and in time the saws came. The road was wider now, and faster, and the buses no longer queued in the shade because there was no shade to queue in. People still waited on the corner, but they waited apart, eyes on their phones, and the talk that the tree had gathered drifted away with its leaves.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "How is the narrator's attitude toward Mrs Okafor and the tree conveyed in the passage?", "options": {"A": "Mocking, treating her attachment to the tree as foolish sentimentality.", "B": "Neutral and factual, simply reporting a road-widening project.", "C": "Warm and sympathetic, presenting the loss with quiet sorrow.", "D": "Fearful, portraying the tree as a threat to the street."}, "fig": "", "passage": "<strong>The Last Tree on Harbour Street</strong><br>For as long as anyone could remember, a single plane tree had stood at the elbow of Harbour Street, its roots cracking the pavement and its branches throwing a wide green shade over the bus stop. Mrs Okafor, who had sold newspapers on that corner for thirty years, called it her ceiling. On hot afternoons the whole queue gathered beneath it, strangers pressed shoulder to shoulder in its cool, and somehow they began to talk.\n\nThen the notices appeared, stapled to the trunk: the tree was to be felled to widen the road. Mrs Okafor read the notice twice, the way a person does when she hopes the words will rearrange themselves.\n\nA young engineer came to measure the pavement. 'It's only one tree,' he said, not unkindly. 'The new road will move thousands of cars an hour.'\n\nMrs Okafor folded her newspaper. 'Thousands of cars,' she agreed, 'and not one of them will stop to talk. You count what passes through, but a tree counts what stays.' She tapped the bark gently, as one might touch the shoulder of an old friend.\n\nThe engineer left, and in time the saws came. The road was wider now, and faster, and the buses no longer queued in the shade because there was no shade to queue in. People still waited on the corner, but they waited apart, eyes on their phones, and the talk that the tree had gathered drifted away with its leaves.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>infrastructure</u> as it is used in the final paragraph ('working infrastructure, as real as drains and street lights')?", "options": {"A": "decorative features added for beauty", "B": "rules that drivers must obey", "C": "basic systems and structures a city needs to function", "D": "money set aside for emergencies"}, "fig": "", "passage": "<strong>Why Cities Are Planting Trees Again</strong><br>For much of the twentieth century, city planners treated street trees as a decoration to be removed whenever a road needed widening. Today that thinking has reversed, and many cities are racing to plant trees as fast as they once cut them down. The change is driven less by beauty than by hard evidence about how trees make urban life work better.\n\nThe clearest benefit is temperature. Dark roads and concrete absorb heat and release it slowly, turning a city into what scientists call an 'urban heat island', several degrees hotter than the countryside around it. A mature tree cools the air both by casting shade and by releasing water vapour from its leaves, and a single well-placed row of trees can lower a street's temperature enough to cut the use of air conditioning indoors.\n\nTrees also manage water. When heavy rain falls on bare pavement, it rushes straight into drains and can overwhelm them, causing floods. Roots and soil around a tree soak up a share of that water and release it slowly, easing the strain on the system. Leaves trap dust and some polluting gases as well, modestly improving the air people breathe.\n\nThere is even evidence that streets with trees are calmer and safer: drivers slow down, and residents report feeling more attached to greener neighbourhoods. None of this means a tree can solve a city's problems alone. But planners now see trees not as ornaments but as working infrastructure, as real as drains and street lights, and far cheaper to install.", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "According to the passage, how does a mature tree help cool a city street?", "options": {"A": "By blocking heavy rain from reaching the drains.", "B": "By casting shade and releasing water vapour from its leaves.", "C": "By absorbing heat from the road and storing it in its roots.", "D": "By reflecting sunlight back into the sky with its leaves."}, "fig": "", "passage": "<strong>Why Cities Are Planting Trees Again</strong><br>For much of the twentieth century, city planners treated street trees as a decoration to be removed whenever a road needed widening. Today that thinking has reversed, and many cities are racing to plant trees as fast as they once cut them down. The change is driven less by beauty than by hard evidence about how trees make urban life work better.\n\nThe clearest benefit is temperature. Dark roads and concrete absorb heat and release it slowly, turning a city into what scientists call an 'urban heat island', several degrees hotter than the countryside around it. A mature tree cools the air both by casting shade and by releasing water vapour from its leaves, and a single well-placed row of trees can lower a street's temperature enough to cut the use of air conditioning indoors.\n\nTrees also manage water. When heavy rain falls on bare pavement, it rushes straight into drains and can overwhelm them, causing floods. Roots and soil around a tree soak up a share of that water and release it slowly, easing the strain on the system. Leaves trap dust and some polluting gases as well, modestly improving the air people breathe.\n\nThere is even evidence that streets with trees are calmer and safer: drivers slow down, and residents report feeling more attached to greener neighbourhoods. None of tached to greener neighbourhoods. None of this means a tree can solve a city's problems alone. But planners now see trees not as ornaments but as working infrastructure, as real as drains and street lights, and far cheaper to install.", "qnum": "34"}, {"n": "36", "type": "mcq", "section": "English", "stem": "Which statement best expresses the central idea of the passage?", "options": {"A": "Cities should remove trees whenever a road needs to be widened.", "B": "Trees are valued again because they do practical work that helps cities function.", "C": "Air conditioning is the only reliable way to cool a hot city.", "D": "Trees can solve every problem a modern city faces."}, "fig": "", "passage": "<strong>Why Cities Are Planting Trees Again</strong><br>For much of the twentieth century, city planners treated street trees as a decoration to be removed whenever a road needed widening. Today that thinking has reversed, and many cities are racing to plant trees as fast as they once cut them down. The change is driven less by beauty than by hard evidence about how trees make urban life work better.\n\nThe clearest benefit is temperature. Dark roads and concrete absorb heat and release it slowly, turning a city into what scientists call an 'urban heat island', several degrees hotter than the countryside around it. A mature tree cools the air both by casting shade and by releasing water vapour from its leaves, and a single well-placed row of trees can lower a street's temperature enough to cut the use of air conditioning indoors.\n\nTrees also manage water. When heavy rain falls on bare pavement, it rushes straight into drains and can overwhelm them, causing floods. Roots and soil around a tree soak up a share of that water and release it slowly, easing the strain on the system. Leaves trap dust and some polluting gases as well, modestly improving the air people breathe.\n\nThere is even evidence that streets with trees are calmer and safer: drivers slow down, and residents report feeling more attached to greener neighbourhoods. None of this means a tree can solve a city's problems alone. But planners now see trees not as ornaments but as working infrastructure, as real as drains and street lights, and far cheaper to install.", "qnum": "35"}, {"n": "37", "type": "mcq", "section": "English", "stem": "Both texts are about a city street tree. How do their main purposes differ?", "options": {"A": "The story explores the human and emotional meaning of one tree, while the article explains the practical reasons cities value trees.", "B": "Both texts mainly argue that roads should never be widened.", "C": "The story gives scientific data, while the article tells an invented tale.", "D": "Both texts are written chiefly to give instructions for planting trees."}, "fig": "", "passage": "<strong>Why Cities Are Planting Trees Again</strong><br>For much of the twentieth century, city planners treated street trees as a decoration to be removed whenever a road needed widening. Today that thinking has reversed, and many cities are racing to plant trees as fast as they once cut them down. The change is driven less by beauty than by hard evidence about how trees make urban life work better.\n\nThe clearest benefit is temperature. Dark roads and concrete absorb heat and release it slowly, turning a city into what scientists call an 'urban heat island', several degrees hotter than the countryside around it. A mature tree cools the air both by casting shade and by releasing water vapour from its leaves, and a single well-placed row of trees can lower a street's temperature enough to cut the use of air conditioning indoors.\n\nTrees also manage water. When heavy rain falls on bare pavement, it rushes straight into drains and can overwhelm them, causing floods. Roots and soil around a tree soak up a share of that water and release it slowly, easing the strain on the system. Leaves trap dust and some polluting gases as well, modestly improving the air people breathe.\n\nThere is even evidence that streets with trees are calmer and safer: drivers slow down, and residents report feeling more attached to greener neighbourhoods. None of this means a tree can solve a city's problems alone. But planners now see trees not as ornaments but as working infrastructure, as real as drains and street lights, and far cheaper to install.", "qnum": "36"}, {"n": "38", "type": "writing", "section": "English Writing", "intro": "Stage 5 personal-opinion essay (CIS Year 10 level). You answer ONE of the two topics above, typing your response on the keyboard. There is no single correct answer; the marker assesses a clear thesis, logically ordered paragraphs with topic sentences and linking words, the sophistication and accuracy of your vocabulary, varied and correct sentence structures (including correct use of colons and semicolons), a fair acknowledgement of the opposing view, and a conclusion that resolves your position rather than merely repeating it. Aim for roughly 250 to 350 words.", "label": "", "body": "Choose ONE of the following: (1) Some people argue that cities should replace car lanes with parks, trees, and cycle paths, even if this makes driving slower. Do you agree? Give your opinion and support it with clear reasons and examples. (2) Should students of your age be required to spend a fixed number of hours each year on environmental or community projects? Explain your view, giving reasons for and against before reaching a conclusion.", "hint": "Write a structured essay: introduction, 2-3 body paragraphs, conclusion.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "39", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A line has equation 10x − 5y = 20. Find the equation of the line parallel to it that passes through the point (3, 1).", "options": {"A": "y = −1/2 x + 5/2", "B": "y = 2x − 5", "C": "y = −2x + 7", "D": "y = 2x + 1"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the line perpendicular to y = −4/5 x + 3 that passes through the point (−5, 2).", "options": {"A": "y = −4/5 x − 2", "B": "y = −5/4 x − 17/4", "C": "y = 5/4 x + 33/4", "D": "y = 4/5 x + 6"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"170\" viewBox=\"0 0 300 170\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"170\" fill=\"white\"/><line x1=\"40\" y1=\"100\" x2=\"260\" y2=\"100\" stroke=\"#1F3864\" stroke-width=\"3\"/><line x1=\"150\" y1=\"25\" x2=\"150\" y2=\"150\" stroke=\"#1F3864\" stroke-width=\"3\"/></svg>", "passage": "", "qnum": "2"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the straight line passing through the points (−4, 6) and (2, −3).", "options": {"A": "y = 3/2 x + 6", "B": "y = −3/2 x", "C": "y = 3/2 x", "D": "y = −2/3 x + 10/3"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "43", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the equation of the line with gradient 3/5 that passes through the point (5, −2).", "options": {"A": "y = 3/5 x − 2", "B": "y = 3/5 x + 5", "C": "y = −5/3 x + 19/3", "D": "y = 3/5 x − 5"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Triangles A and B are similar. In triangle A the base is 9 cm and the height is 6 cm; the corresponding base in triangle B is 24 cm. Find the height y of triangle B.", "options": {"A": "16 cm", "B": "21 cm", "C": "2.25 cm", "D": "39 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"420\" height=\"220\" viewBox=\"0 0 420 220\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\" \" font-weight=\"bold\">5</text><line x1=\"348.0\" y1=\"252\" x2=\"414.0\" y2=\"252\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"30\" y1=\"252\" x2=\"420\" y2=\"252\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"225.0\" y=\"298\" text-anchor=\"middle\" font-size=\"14\" fill=\"#333\"><tspan font-weight=\"bold\" fill=\"#1F3864\">✕</tspan> = 1 students</text></svg>", "passage": "", "qnum": "17"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the lower quartile (Q1) of: 4, 6, 9, 12, 15, 18, 21, 24.", "options": {"A": "6", "B": "7.5", "C": "9", "D": "13.5"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the upper quartile (Q3) of: 3, 5, 7, 11, 13, 16, 18, 18, 21.", "options": {"A": "18", "B": "16", "C": "17", "D": "13"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Treat these statements as a closed logic puzzle — judge ONLY by the rules given, not by what the words might suggest in the real world:\n• All plinks are dorfs.\n• No dorfs are vels.\n• Some vels are crus.\n\nWhich conclusion MUST be true?", "options": {"A": "Some plinks are crus.", "B": "No plinks are vels.", "C": "All crus are vels.", "D": "Some dorfs are crus."}, "fig": "", "passage": "", "qnum": "20"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Leon wants to save exactly $900 over the next 6 months for a coding bootcamp. He already has $180 set aside. Each month he earns $180 from a weekend job and has fixed costs of $50 (transport) and $40 (phone). In month 1 only, he must also pay a one-off $120 enrolment deposit. If he banks everything left over each month, how much MORE must he save per month (on top of this part-time income) to reach exactly $900 on time?", "options": {"A": "$80", "B": "$30", "C": "$50", "D": "$10"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A flight leaves Hong Kong at 19:05 on Monday (HKT) and is scheduled to fly for 13 hours 25 minutes to Los Angeles. Los Angeles is 15 hours BEHIND Hong Kong. What is the local arrival time AND day in Los Angeles (24-hour clock)?", "options": {"A": "08:30 Tuesday", "B": "23:30 Tuesday", "C": "17:05 Monday", "D": "17:30 Monday"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Study the relationship in the figure. The worked pair shows how a small SHADED circle changes into a large UNSHADED circle: two things happen at once — the figure grows from small to large AND its shading is removed. Apply the SAME two-part rule to the third shape, a small shaded square, and choose the answer (A–D) that completes the analogy.", "options": {"A": "A large unshaded square.", "B": "A large shaded square.", "C": "A small unshaded square.", "D": "A large unshaded circle."}, "fig": "", "passage": "", "qnum": "23"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The figure shows a flag-shaped arrow that currently points UP, with a small notch on its RIGHT side. The object is turned by TWO successive rotations of 90° CLOCKWISE (a total of 180°). Which option (A–D) correctly describes the object's new position after BOTH turns?", "options": {"A": "Pointing DOWN, with the notch on the LEFT side.", "B": "Pointing RIGHT, with the notch on the BOTTOM.", "C": "Pointing LEFT, with the notch on the TOP.", "D": "Pointing DOWN, with the notch on the RIGHT side."}, "fig": "", "passage": "", "qnum": "24"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Treat these statements as a closed logic puzzle and reason ONLY from the rules:\n• Every quommet is a brindle.\n• No brindle is a sprock.\n• Every drazz is a sprock.\n\nWhich conclusion MUST be true?", "options": {"A": "Some quommets are drazzes.", "B": "Every sprock is a drazz.", "C": "No quommet is a drazz.", "D": "Every brindle is a quommet."}, "fig": "", "passage": "", "qnum": "25"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A rectangular box measures 13 cm long, 9 cm wide and 8 cm tall. You want to pack it with solid cubes of side 3 cm. The cubes cannot be cut, bent or overlapped, and each must sit squarely along the box's edges. What is the MAXIMUM number of whole 3 cm cubes that will fit inside the box?", "options": {"A": "34", "B": "24", "C": "36", "D": "12"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "ASSUMPTION. Statement: \"Our school should make the debate club compulsory for all Year 10 students, because every student needs to be able to argue a point of view clearly.\"\n\nProposed assumption: \"Taking part in the debate club helps students argue a point of view clearly.\"\n\nUsing only the information in the statement, is this assumption logical?", "options": {"A": "Yes, the statement's reason for making the club compulsory only makes sense if the club develops the very skill it names.", "B": "No, the assumption only holds if debating is shown to be the single best way to build the skill, which the statement never establishes.", "C": "No, the statement is about Year 10 students, so it tells us nothing about whether the club helps anyone.", "D": "Yes, every school activity is designed to improve some skill, so the club must improve arguing."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INFERENCE. Statement: \"At Riverside School, no student may join the senior choir unless they have passed the annual voice test. This year, exactly 30 students joined the senior choir.\" Choose the option that MUST be true.", "options": {"A": "Every student who passed the annual voice test joined the senior choir.", "B": "At least 30 students passed the annual voice test this year.", "C": "The 30 students who joined the choir scored higher in the voice test than any student who did not join.", "D": "Any student who passed the annual voice test was allowed to join the senior choir."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INTERPRETATION. Statement: \"A survey of 600 students at Harbour College found that 70% own a smartphone, and of those who own one, 40% report checking it during lessons.\"\n\nConclusions:\n1. More than half of all 600 students own a smartphone.\n2. At least 168 students at Harbour College check a smartphone during lessons.\n3. Most students who own a smartphone do not check it during lessons.\n\nUsing only the given information, which conclusions FOLLOW?", "options": {"A": "Conclusions 1 and 2 follow, but 3 does not.", "B": "Only Conclusion 1 follows.", "C": "Conclusions 1, 2 and 3 all follow.", "D": "Only Conclusion 3 follows."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "DEDUCTION. Facts: \"All qualified lifeguards have completed the first-aid course. No one who has completed the first-aid course is under 16. Sam is a qualified lifeguard. Bina is under 16.\" Which conclusion does NOT follow from these facts?", "options": {"A": "Sam has completed the first-aid course.", "B": "Sam is not under 16.", "C": "Bina is not a qualified lifeguard.", "D": "Bina is both under 16 and a qualified lifeguard."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the school replace all printed textbooks with a tablet computer for every student?\" Which of the following is the STRONGEST argument?", "options": {"A": "Yes, in four comparable schools that switched to tablets, independent education researchers recorded no drop in test results and a measurable fall in the schools' annual spending on books within two years.", "B": "No, my younger brother dropped his tablet once and it cracked, which proves tablets are far too fragile for any school to rely on.", "C": "Yes, tablets are the modern way to learn, and a good school should always choose whatever is most modern.", "D": "No, if we give students tablets now, soon they will demand phones in class, then smartwatches, and eventually no real learning will happen at all."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "INFERENCE. Statement: \"A research team reported that students who slept at least 8 hours the night before a test scored, on average, 12% higher than students who slept fewer than 5 hours. The team noted they did not record what time students went to bed or how much they had revised.\" Choose the option that MUST be true.", "options": {"A": "Sleeping at least 8 hours the night before a test causes students to score higher.", "B": "If a student sleeps fewer than 5 hours, that student will score below average on the test.", "C": "In this study, the group sleeping at least 8 hours had a higher average score than the group sleeping fewer than 5 hours.", "D": "Students who revised more also slept more, which explains the difference in scores."}, "fig": "", "passage": "", "qnum": "32"}, {"n": "72", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "根據文章，作者第一次站在山頂時的心情是怎樣的？<br><span style=\"color:#555\">根据文章，作者第一次站在山顶时的心情是怎样的？</span>", "options": {"A": "因路途辛苦而感到後悔<br><span style=\"color:#555\">因路途辛苦而感到后悔</span>", "B": "既驚歎又有滿足感<br><span style=\"color:#555\">既惊叹又有满足感</span>", "C": "急着想立刻下山", "D": "對風景感到失望<br><span style=\"color:#555\">对风景感到失望</span>"}, "fig": "", "passage": "那年夏天，我第一次登上那座以險峻聞名的高山。山勢陡峭，小徑曲折，我們沿着石階一步步往上攀，足足走了兩個多小時，汗水早已濕透衣背。然而當我終於站上山頂，眼前的景象卻教我屏住呼吸：腳下雲海翻湧，遠處峰巒疊翠，朝霞在天際緩緩鋪展，遠近高低，無一不美，那壯麗實在令人歎為觀止。山風拂面，松濤陣陣，我只覺心曠神怡，先前的疲累彷彿都隨風散去。那一刻，心裏湧起一陣難以言喻的滿足，美得教人捨不得眨眼。我靜靜地站着，只覺天地遼闊，人是何等渺小。下山之後我常常想起那片雲海，也終於明白：若不是親自一步步走上來，又怎能體會這份得來不易的壯麗。<br><span style=\"color:#555\">那年夏天，我第一次登上那座以险峻闻名的高山。山势陡峭，小径曲折，我们沿着石阶一步步往上攀，足足走了两个多小时，汗水早已湿透衣背。然而当我终于站上山顶，眼前的景象却教我屏住呼吸：脚下云海翻涌，远处峰峦叠翠，朝霞在天际缓缓铺展，远近高低，无一不美，那壮丽实在令人叹为观止。山风拂面，松涛阵阵，我只觉心旷神怡，先前的疲累仿佛都随风散去。那一刻，心里涌起一阵难以言喻的满足，美得教人舍不得眨眼。我静静地站着，只觉天地辽阔，人是何等渺小。下山之后我常常想起那片云海，也终于明白：若不是亲自一步步走上来，又怎能体会这份得来不易的壮丽。</span>", "qnum": "1"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "文中「腳下雲海翻湧」一句，主要運用了哪種寫作手法？<br><span style=\"color:#555\">文中「脚下云海翻涌」一句，主要运用了哪种写作手法？</span>", "options": {"A": "把雲比作翻滾的海浪，是比喻<br><span style=\"color:#555\">把云比作翻滚的海浪，是比喻</span>", "B": "直接說明雲的化學成分，是說明<br><span style=\"color:#555\">直接说明云的化学成分，是说明</span>", "C": "與下句「峰巒疊翠」字數相對、結構相應，是對偶<br><span style=\"color:#555\">与下句「峰峦叠翠」字数相对、结构相应，是对偶</span>", "D": "把雲當作人來寫，是擬人<br><span style=\"color:#555\">把云当作人来写，是拟人</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "從全文看，作者藉這次登山經歷想表達的道理最接近下列哪一項？<br><span style=\"color:#555\">从全文看，作者借这次登山经历想表达的道理最接近下列哪一项？</span>", "options": {"A": "登山是最健康的運動<br><span style=\"color:#555\">登山是最健康的运动</span>", "B": "只要肯堅持，沒有克服不了的困難<br><span style=\"color:#555\">只要肯坚持，没有克服不了的困难</span>", "C": "付出努力後，親身得來的收穫格外可貴<br><span style=\"color:#555\">付出努力后，亲身得来的收获格外可贵</span>", "D": "清晨的空氣比黃昏清新<br><span style=\"color:#555\">清晨的空气比黄昏清新</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "文中說作者「捨不得眨眼」，這個細節主要用來表現甚麼？<br><span style=\"color:#555\">文中说作者「舍不得眨眼」，这个细节主要用来表现什么？</span>", "options": {"A": "作者眼睛不舒服", "B": "山頂的風很大<br><span style=\"color:#555\">山顶的风很大</span>", "C": "景色極美，令作者全神貫注<br><span style=\"color:#555\">景色极美，令作者全神贯注</span>", "D": "天色太暗看不清楚"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "作者在文中對這座山的整體態度是怎樣的？<br><span style=\"color:#555\">作者在文中对这座山的整体态度是怎样的？</span>", "options": {"A": "讚賞與嚮往<br><span style=\"color:#555\">赞赏与向往</span>", "B": "厭倦與抗拒<br><span style=\"color:#555\">厌倦与抗拒</span>", "C": "冷漠與無所謂<br><span style=\"color:#555\">冷漠与无所谓</span>", "D": "恐懼與不安<br><span style=\"color:#555\">恐惧与不安</span>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "「他做事一向認真，從不馬虎。」句中「馬虎」的意思是：<br><span style=\"color:#555\">「他做事一向认真，从不马虎。」句中「马虎」的意思是：</span>", "options": {"A": "做事勇猛", "B": "粗心、不仔細<br><span style=\"color:#555\">粗心、不仔细</span>", "C": "速度很快", "D": "喜歡騎馬<br><span style=\"color:#555\">喜欢骑马</span>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "下列各組詞語，意思最相近的一組是：<br><span style=\"color:#555\">下列各组词语，意思最相近的一组是：</span>", "options": {"A": "嚴肅 — 活潑<br><span style=\"color:#555\">严肃 — 活泼</span>", "B": "謙虛 — 驕傲<br><span style=\"color:#555\">谦虚 — 骄傲</span>", "C": "懊悔 — 後悔<br><span style=\"color:#555\">懊悔 — 后悔</span>", "D": "節儉 — 浪費<br><span style=\"color:#555\">节俭 — 浪费</span>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "「這篇文章的結構十分嚴謹。」句中「嚴謹」最適合用來形容下列哪一項？<br><span style=\"color:#555\">「这篇文章的结构十分严谨。」句中「严谨」最适合用来形容下列哪一项？</span>", "options": {"A": "一頓豐富的晚餐<br><span style=\"color:#555\">一顿丰富的晚餐</span>", "B": "一座美麗的花園<br><span style=\"color:#555\">一座美丽的花园</span>", "C": "一份條理分明、毫無破綻的計劃書<br><span style=\"color:#555\">一份条理分明、毫无破绽的计划书</span>", "D": "一件柔軟的毛衣<br><span style=\"color:#555\">一件柔软的毛衣</span>"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "下列句子中量詞用得正確的一句是：<br><span style=\"color:#555\">下列句子中量词用得正确的一句是：</span>", "options": {"A": "湖面上漂着一葉小舟。<br><span style=\"color:#555\">湖面上漂着一叶小舟。</span>", "B": "湖面上漂着一座小舟。", "C": "湖面上漂着一頂小舟。<br><span style=\"color:#555\">湖面上漂着一顶小舟。</span>", "D": "湖面上漂着一棵小舟。"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "82", "type": "mcq", "section": "Chinese", "stem": "「天邊飄過一_____白雲。」橫線上最恰當的量詞是：<br><span style=\"color:#555\">「天边飘过一_____白云。」横线上最恰当的量词是：</span>", "options": {"A": "塊<br><span style=\"color:#555\">块</span>", "B": "縷<br><span style=\"color:#555\">缕</span>", "C": "根", "D": "顆<br><span style=\"color:#555\">颗</span>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "經過多年努力，他的畫技已經_____，作品屢獲大獎。橫線上最恰當的成語是：<br><span style=\"color:#555\">经过多年努力，他的画技已经_____，作品屡获大奖。横线上最恰当的成语是：</span>", "options": {"A": "爐火純青<br><span style=\"color:#555\">炉火纯青</span>", "B": "畫蛇添足<br><span style=\"color:#555\">画蛇添足</span>", "C": "半途而廢<br><span style=\"color:#555\">半途而废</span>", "D": "井底之蛙"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "84", "type": "mcq", "section": "Chinese", "stem": "下列句子中，成語運用恰當的一句是：<br><span style=\"color:#555\">下列句子中，成语运用恰当的一句是：</span>", "options": {"A": "他樂於助人，對同學的求助總是袖手旁觀。<br><span style=\"color:#555\">他乐于助人，对同学的求助总是袖手旁观。</span>", "B": "面對突如其來的問題，她臨危不亂，從容應對。<br><span style=\"color:#555\">面对突如其来的问题，她临危不乱，从容应对。</span>", "C": "這道題很簡單，他卻絞盡腦汁，一下子就答對了。<br><span style=\"color:#555\">这道题很简单，他却绞尽脑汁，一下子就答对了。</span>", "D": "比賽還沒開始，他就已經垂頭喪氣，信心十足。<br><span style=\"color:#555\">比赛还没开始，他就已经垂头丧气，信心十足。</span>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "「_____天氣不好，_____我們仍然按時出發了。」橫線上最恰當的關聯詞是：<br><span style=\"color:#555\">「_____天气不好，_____我们仍然按时出发了。」横线上最恰当的关联词是：</span>", "options": {"A": "因為……所以……<br><span style=\"color:#555\">因为……所以……</span>", "B": "雖然……但是……<br><span style=\"color:#555\">虽然……但是……</span>", "C": "只要……就……", "D": "不但……而且……"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "下列句子沒有語病、表達最通順的一句是：<br><span style=\"color:#555\">下列句子没有语病、表达最通顺的一句是：</span>", "options": {"A": "通過這次活動，使我明白了團隊合作的重要。<br><span style=\"color:#555\">通过这次活动，使我明白了团队合作的重要。</span>", "B": "他大約跑了十分鐘左右才到達終點。<br><span style=\"color:#555\">他大约跑了十分钟左右才到达终点。</span>", "C": "為了避免類似的錯誤不再發生，我們訂立了新規則。<br><span style=\"color:#555\">为了避免类似的错误不再发生，我们订立了新规则。</span>", "D": "這次旅行讓我們欣賞到大自然的壯麗景色。<br><span style=\"color:#555\">这次旅行让我们欣赏到大自然的壮丽景色。</span>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
