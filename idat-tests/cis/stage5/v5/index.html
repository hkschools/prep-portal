<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;

  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>

: "The trustees denied for refusing the request."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which sentence uses \"which\" correctly for information that could be removed?", "options": {"A": "The east wing which was added in 1902 houses the newspapers.", "B": "The east wing, that was added in 1902, houses the newspapers.", "C": "The east wing, which was added in 1902, houses the newspapers.", "D": "The east wing, which added in 1902, houses the newspapers."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "\"If the trust ____ the lease, the collection would have been sold.\" Which completion makes a THIRD conditional?", "options": {"A": "did not renew", "B": "has not renewed", "C": "would not renew", "D": "had not renewed"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which sentence keeps its list of purposes in parallel form?", "options": {"A": "The room was intended for reading, to study and for shelter from the weather.", "B": "The room was intended for reading, for study and for shelter from the weather.", "C": "The room was intended for reading, studying and it kept out the weather.", "D": "The room was intended for reading, for study and sheltering from the weather."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence keeps the pronoun in agreement with its noun?", "options": {"A": "Each of the trustees signed the minutes before leaving.", "B": "Each of the trustees signed their minutes before they left.", "C": "Each of the trustees have signed the minutes before leaving.", "D": "Each of the trustees signed his or her minutes before they left."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which sentence puts the strongest emphasis on the time the room opened?", "options": {"A": "The room did not open to women until 1897.", "B": "Not until 1897 did the room open to women.", "C": "The room opened to women in 1897, not before.", "D": "It was the room that did not open to women until 1897."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "In \"the trustees rejected the plan, and this delayed the opening by two years\", what does \"this\" refer to?", "options": {"A": "the plan itself", "B": "the two-year delay", "C": "the trustees", "D": "the trustees' rejection of the plan"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "In an argumentative essay, which sentence correctly reports a source's continuing claim?", "options": {"A": "Ellis argues that the reading rooms were never intended for scholars.", "B": "Ellis argued that the reading rooms are never intended for scholars.", "C": "Ellis is arguing that the reading rooms were never intended for scholars.", "D": "Ellis will argue that the reading rooms were never intended for scholars."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which version puts the emphasis on the COLLECTION rather than on the trustees?", "options": {"A": "The trustees catalogued the collection over four winters.", "B": "Over four winters, the trustees catalogued the collection.", "C": "The collection was catalogued by the trustees over four winters.", "D": "It was the trustees who catalogued the collection over four winters."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which sentence HEDGES its claim most carefully?", "options": {"A": "The figures prove that attendance peaked before the war.", "B": "Attendance obviously peaked before the war.", "C": "It is possible that the figures might perhaps suggest a peak before the war.", "D": "The figures suggest that attendance may have peaked before the war."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Three of these are informal in different ways. Which one is a fixed figurative phrase whose meaning cannot be worked out from the words themselves?", "options": {"A": "a bit dodgy", "B": "no longer with us", "C": "at the eleventh hour", "D": "a total shambles"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which phrase is a EUPHEMISM used by an institution?", "options": {"A": "a rationalisation of opening hours", "B": "a cut to opening hours", "C": "a fairer timetable", "D": "a temporary closure"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "A writer says an argument \"cuts both ways\". The EFFECT of the phrase is to point out that the argument", "options": {"A": "has already been used too often to be persuasive", "B": "supports the other side just as well as it supports the writer's own", "C": "depends on evidence that has not been checked", "D": "makes two separate claims at once"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "\"To the labourer, the reading room gave what the drawing room gave the gentleman: an hour, a chair, and no one asking why.\" The main EFFECT of the parallel structure is to", "options": {"A": "show that the labourer was given more than the gentleman", "B": "suggest that the reading room was uncomfortable", "C": "mock the gentleman for having nothing to do", "D": "insist that the two men are being given the same thing"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which word describes an argument that is technically correct but misses what matters?", "options": {"A": "mistaken", "B": "pedantic", "C": "dishonest", "D": "incoherent"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "\"The committee's <u>equivocation</u> on the question satisfied nobody.\" \"Equivocation\" means", "options": {"A": "deliberately ambiguous language that avoids committing", "B": "a firm refusal", "C": "a long delay before answering", "D": "an angry disagreement between members"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Which word is the ADJECTIVE in the family of \"benefit\", \"beneficiary\" and \"benefactor\"?", "options": {"A": "beneficiary", "B": "benefactor", "C": "beneficial", "D": "benefiting"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which word describes a plan as unrealistic while sounding almost admiring?", "options": {"A": "idealistic", "B": "naive", "C": "foolish", "D": "deluded"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "How is the noun meaning the work of keeping a building in good repair spelled?", "options": {"A": "maintainance", "B": "maintenence", "C": "maintenance", "D": "maintainence"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Which version is most appropriate in an academic essay?", "options": {"A": "There is not much to go on here.", "B": "The evidence for this claim is limited.", "C": "This claim has basically nothing behind it.", "D": "Sadly, this claim does not really stand up."}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "Which prefix means \"too much\"?", "options": {"A": "hypo-", "B": "hetero-", "C": "homo-", "D": "hyper-"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Which verb most precisely describes weakening an argument by attacking one of its premises?", "options": {"A": "contradict", "B": "dismiss", "C": "undermine", "D": "misinterpret"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which word names the quality of judging a case on its merits rather than on who is making it?", "options": {"A": "impartiality", "B": "indifference", "C": "consistency", "D": "scepticism"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "According to Text A, what does the writer say the parish is being asked to buy?", "options": {"A": "comfort", "B": "an hour", "C": "newspapers", "D": "a public house"}, "fig": "", "passage": "<strong>From a Pamphlet Addressed to the Ratepayers of Aldbury, 1893</strong><br>It is objected, and by men of good sense, that a reading room is a luxury, and that a parish which cannot mend its own road has no business furnishing armchairs. I would answer that the objection mistakes what is being proposed.\n\nWe are not asked to buy comfort. We are asked to buy an hour. The labourer who leaves the yard at six has, between that hour and his bed, no place to sit that is not either his own room, in which four children are also sitting, or the public house, in which he will spend what he has not got. Give him a third door and he will use it. I have watched him use it in Rochdale, in Bury and in Keighley, and the men who use it are not, on the whole, the men the subscribers expected.\n\nIt is objected further that few will read. I dare say few will. But a room in which a man may sit with a newspaper he has not bought, among men who are not obliged to speak to him, is worth having whether he reads or not, and I would rather the parish paid for a chair he does not use than for a sentence he need not have served.\n\nTo the labourer, the reading room gave what the drawing room gave the gentleman: an hour, a chair, and no one asking why. I do not think we shall be thanked for it. I do not think we ought to expect to be. The measure of the thing will be that in twenty years nobody remembers it was ever controversial.<br><br><strong>What Public Libraries Are Actually For</strong><br>Ask a council what its libraries are for and the answer will usually involve books. Ask the people inside one and the answer diverges sharply. A survey of 4,100 visitors across nine English library services in 2022 found that 38 per cent had come primarily to borrow or return material. The remainder had come to use a computer, to attend a class or a group, to accompany a child, to fill in a form, to get warm, or for no purpose they could name.\n\nThis is not a decline from some earlier purity. The Victorian free reading rooms that preceded public libraries were explicitly social projects, argued for at the time on grounds of temperance, public order and the provision of somewhere warm to sit. Books were the means; the room was the point.\n\nThe distinction matters because it changes what counts as evidence of success. A service measured by loans will close the branch with the lowest issue figures, which is frequently the branch in the poorest area, where the computers are busiest and the loans are fewest. A service measured by visits, or by hours occupied, reaches a different decision about the same branch.\n\nNone of this settles what a library should do. It does suggest that the argument is rarely about books, and that the choice of measure usually decides the argument before it has been had.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "The writer says he would rather the parish paid \"for a chair he does not use than for a sentence he need not have served\". The main EFFECT of this contrast is to", "options": {"A": "suggest that most users of the room will turn out to be criminals", "B": "criticise the courts for sentences that are too long", "C": "admit that the room will probably be a waste of money", "D": "reframe the cost of the room as cheaper than the cost of not having it"}, "fig": "", "passage": "<strong>From a Pamphlet Addressed to the Ratepayers of Aldbury, 1893</strong><br>It is objected, and by men of good sense, that  "Maths, Logic & Critical Thinking", "stem": "A rectangular box measures 6 cm by 4 cm by 3 cm. How many cubes of side 2 cm fit inside it exactly?", "options": {"A": "18", "B": "9", "C": "12", "D": "36"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In an invented language, \"velk tomar\" means \"cold morning\", \"tomar shen\" means \"morning light\" and \"shen dovi\" means \"light rain\". Which word means \"cold\"?", "options": {"A": "tomar", "B": "shen", "C": "dovi", "D": "velk"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this sequence: 2, 3, 5, 9, 17, ___ . What number comes next?", "options": {"A": "33", "B": "25", "C": "34", "D": "29"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Five houses stand in a row. The blue house is immediately left of the green one. The red house is at one end. The white house is between the red and the blue. The yellow house is at the other end. Which house is in the MIDDLE?", "options": {"A": "the white house", "B": "the blue house", "C": "the green house", "D": "the red house"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code, MIRROR is written RORRIM. Using the same rule, how is PLANET written?", "options": {"A": "QMBOFU", "B": "TENALPP", "C": "TENALP", "D": "PLANTE"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A shop sells pens in packs of 5 and packs of 8. What is the LARGEST number of pens that cannot be bought exactly?", "options": {"A": "27", "B": "13", "C": "30", "D": "40"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The regional health board will send a text-message reminder before every appointment, because missed appointments cost the service 4.6 million dollars last year.\"\n\nPROPOSED ASSUMPTION: \"At least some of the missed appointments were missed because the patient forgot.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "No. The statement gives the cost of missed appointments and the action being taken, and makes no claim about why appointments were missed.", "B": "Yes. A reminder can only reduce the cost if forgetting explains at least part of it, so the argument takes that for granted."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"An audit reported that of the 90 suppliers reviewed, every supplier that failed the safety inspection had also missed at least one delivery deadline. Supplier K missed two delivery deadlines.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Supplier K failed the safety inspection.", "B": "Supplier K passed the safety inspection.", "C": "Every supplier that missed a deadline failed the safety inspection.", "D": "It cannot be determined from the audit whether Supplier K failed the safety inspection."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A city surveyed all 800 households on one estate. It found that 520 owned at least one bicycle, 300 had at least one member who cycles to work, and 260 households were in both groups.\"\n\nCONCLUSION (1): Most households on the estate own at least one bicycle.\nCONCLUSION (2): Most households that own a bicycle have a member who cycles to work.\nCONCLUSION (3): 240 households neither own a bicycle nor have a member who cycles to work.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "Conclusions 1 and 3 follow, but Conclusion 2 does not.", "B": "All three conclusions follow.", "C": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "D": "Conclusion 1 follows, but Conclusions 2 and 3 do not."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "69", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"Every device that carries the safety mark has passed the drop test. Some devices that have passed the drop test are still awaiting the electrical test.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "Some devices carrying the safety mark are awaiting the electrical test.", "B": "It does not follow that any device carrying the safety mark is awaiting the electrical test.", "C": "No device carrying the safety mark is awaiting the electrical test."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "70", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should a supermarket chain replace its staffed checkouts entirely with self-service tills in order to cut costs?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "Yes. Self-service tills are the future, and any business that refuses to modernise will be overtaken by one that does. Customers today expect speed above everything, and nobody enjoys queueing to be served by a person who would rather be somewhere else.", "B": "No. Replacing staffed checkouts would put thousands of people out of work, and a company that profits from a community has a duty to employ people from it.", "C": "No. When a large chain converted 61 of its stores to self-service only and kept 61 matched stores unchanged for a year, the converted stores cut labour costs by 11 per cent but recorded stock losses 2.4 times higher and a fall in weekly transactions among customers aged over 70 of 19 per cent. Net operating profit across the converted stores was lower than across the matched ones."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "71", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A trade journal reported: 'Firms that introduced a four-day week in 2023 reported higher staff retention over the following year than firms that did not. Firms chose for themselves whether to take part.'\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "The four-day week improves staff retention.", "B": "Retention was higher among the firms that introduced a four-day week than among those that did not.", "C": "Most firms in the sector introduced a four-day week in 2023.", "D": "Retention fell at the firms that did not introduce a four-day week."}, "fig": "", "passage": "", "qnum": "32"}, {"n": "72", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "作者認為爭論雙方的說法有甚麼共同的毛病？<br><i>作者认为争论双方的说法有甚么共同的毛病？</i>", "options": {"A": "都只顧引用古人的話，缺乏事實根據<br><i>都只顾引用古人的话，缺乏事实根据</i>", "B": "都把背誦看成孤立的一件事，忽略了背了以後做甚麼<br><i>都把背诵看成孤立的一件事，忽略了背了以后做甚么</i>", "C": "都認為中文科不應該有考試<br><i>都认为中文科不应该有考试</i>", "D": "都低估了學生的記憶能力<br><i>都低估了学生的记忆能力</i>"}, "fig": "", "passage": "近年每逢談及中文科的改革，「背誦古文」總會被拿出來爭論一番。反對的一方說，把《岳陽樓記》一字不漏地背下來，於今天的生活有何用處？支持的一方則說，不背便不算學過。兩種說法都太快下了結論。\n\n先說反對的理由。最常見的一種是：背誦是機械的操作，只練記憶，不練思考。這個批評並非無的放矢。若教師只要求學生默出全文，不問文意，不問作者處境，學生確實可以背得滾瓜爛熟而一無所得。可是這是教法的問題，不是背誦本身的問題。把工具用壞了，不能反過來說工具沒有用。\n\n那麼背誦究竟有甚麼用？其一是語感。一個人若讀過大量文言，自然懂得句子該在哪裏斷、虛詞該落在哪一處；這種本領無法靠講解得來，只能靠反覆誦讀累積。其二是儲備。人在遇事之際，能否想起一句貼切的話，取決於腦中有沒有這句話。《禮記》有言：「玉不琢，不成器；人不學，不知道。」若不曾記住，臨事再翻書已經來不及。\n\n不過，支持的一方也不宜把話說滿。要求學生背誦數十篇長文，把中文科變成記憶競賽，同樣是把手段當成目的。篇章應當精選，數量宜少而質宜高；背之前要先讀懂，背之後要能運用。否則背得再多，也不過是把文字搬進腦裏，再原封不動地搬出來。\n\n說到底，爭論的雙方都把「背誦」看成一件孤立的事。真正的問題不是背與不背，而是背了以後做甚麼。若背誦之後有討論、有寫作、有引用，它便是根基；若背誦之後只有默書，它便只是負擔。<br><i>近年每逢谈及中文科的改革，「背诵古文」总会被拿出来争论一番。反对的一方说，把《岳阳楼记》一字不漏地背下来，于今天的生活有何用处？支持的一方则说，不背便不算学过。两种说法都太快下了结论。\n\n先说反对的理由。最常见的一种是：背诵是机械的操作，只练记忆，不练思考。这个批评并非无的放矢。若教师只要求学生默出全文，不问文意，不问作者处境，学生确实可以背得滚瓜烂熟而一无所得。可是这是教法的问题，不是背诵本身的问题。把工具用坏了，不能反过来说工具没有用。\n\n那么背诵究竟有甚么用？其一是语感。一个人若读过大量文言，自然懂得句子该在哪里断、虚词该落在哪一处；这种本领无法靠讲解得来，只能靠反复诵读累积。其二是储备。人在遇事之际，能否想起一句贴切的话，取决于脑中有没有这句话。《礼记》有言：「玉不琢，不成器；人不学，不知道。」若不曾记住，临事再翻书已经来不及。\n\n不过，支持的一方也不宜把话说满。要求学生背诵数十篇长文，把中文科变成记忆竞赛，同样是把手段当成目的。篇章应当精选，数量宜少而质宜高；背之前要先读懂，背之后要能运用。否则背得再多，也不过是把文字搬进脑里，再原封不动地搬出来。\n\n说到底，争论的双方都把「背诵」看成一件孤立的事。真正的问题不是背与不背，而是背了以后做甚么。若背诵之后有讨论、有写作、有引用，它便是根基；若背诵之后只有默书，它便只是负担。</i>", "qnum": "1"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "反對背誦最常見的理由是甚麼？<br><i>反对背诵最常见的理由是甚么？</i>", "options": {"A": "古文的內容已經過時<br><i>古文的内容已经过时</i>", "B": "背誦佔用了太多上課時間<br><i>背诵占用了太多上课时间</i>", "C": "學生的普通話水平不足<br><i>学生的普通话水平不足</i>", "D": "背誦只練記憶，不練思考<br><i>背诵只练记忆，不练思考</i>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "作者怎樣回應「背誦只練記憶」這個批評？<br><i>作者怎样回应「背诵只练记忆」这个批评？</i>", "options": {"A": "承認這個批評完全正確<br><i>承认这个批评完全正确</i>", "B": "認為記憶比思考更加重要<br><i>认为记忆比思考更加重要</i>", "C": "指出那是教法的問題，不是背誦本身的問題<br><i>指出那是教法的问题，不是背诵本身的问题</i>", "D": "主張以錄音代替背誦<br><i>主张以录音代替背诵</i>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "作者認為背誦的兩項用處是甚麼？<br><i>作者认为背诵的两项用处是甚么？</i>", "options": {"A": "培養語感，以及儲備可供臨事引用的材料<br><i>培养语感，以及储备可供临事引用的材料</i>", "B": "提高默書成績，以及應付升學考試<br><i>提高默书成绩，以及应付升学考试</i>", "C": "鍛煉耐性，以及訓練書寫的速度<br><i>锻炼耐性，以及训练书写的速度</i>", "D": "認識古代歷史，以及學習繁體字<br><i>认识古代历史，以及学习繁体字</i>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "77", "type": "mcq", "section": "Chinese", "stem": "作者對支持背誦的一方，提出了甚麼保留？<br><i>作者对支持背诵的一方，提出了甚么保留？</i>", "options": {"A": "不宜在小學階段開始背誦<br><i>不宜在小学阶段开始背诵</i>", "B": "不宜要求學生背誦大量長文，把中文科變成記憶競賽<br><i>不宜要求学生背诵大量长文，把中文科变成记忆竞赛</i>", "C": "不宜選用《岳陽樓記》一類名篇<br><i>不宜选用《岳阳楼记》一类名篇</i>", "D": "不宜要求學生解釋文意<br><i>不宜要求学生解释文意</i>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "78", "type": "mcq", "section": "Chinese", "stem": "本文的中心論點是甚麼？<br><i>本文的中心论点是甚么？</i>", "options": {"A": "背誦是學習中文唯一有效的方法<br><i>背诵是学习中文唯一有效的方法</i>", "B": "中文科應當完全取消背誦<br><i>中文科应当完全取消背诵</i>", "C": "背誦本身無所謂好壞，關鍵在於背誦之後如何運用<br><i>背诵本身无所谓好坏，关键在于背诵之后如何运用</i>", "D": "古文比白話文更值得學習<br><i>古文比白话文更值得学习</i>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "79", "type": "mcq", "section": "Chinese", "stem": "「這個批評並非無的放矢」，「無的放矢」的意思是<br><i>「这个批评并非无的放矢」，「无的放矢」的意思是</i>", "options": {"A": "箭術高明，百發百中<br><i>箭术高明，百发百中</i>", "B": "有話直說，毫不隱瞞<br><i>有话直说，毫不隐瞒</i>", "C": "反覆練習，精益求精<br><i>反复练习，精益求精</i>", "D": "沒有目標地亂發議論<br><i>没有目标地乱发议论</i>"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "「學生確實可以背得滾瓜爛熟而一無所得」，「滾瓜爛熟」形容<br><i>「学生确实可以背得滚瓜烂熟而一无所得」，「滚瓜烂熟」形容</i>", "options": {"A": "背得極其純熟流利<br><i>背得极其纯熟流利</i>", "B": "讀得斷斷續續<br><i>读得断断续续</i>", "C": "學得雜亂無章<br><i>学得杂乱无章</i>", "D": "寫得工整漂亮<br><i>写得工整漂亮</i>"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "「支持的一方也不宜把話說滿」，「把話說滿」的意思是<br><i>「支持的一方也不宜把话说满」，「把话说满」的意思是</i>", "options": {"A": "說得太多，佔用時間<br><i>说得太多，占用时间</i>", "B": "說話聲音太大<br><i>说话声音太大</i>", "C": "說得太絕對，不留餘地<br><i>说得太绝对，不留余地</i>", "D": "把想說的話全部說完<br><i>把想说的话全部说完</i>"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "82", "type": "mcq", "section": "Chinese", "stem": "文中引《禮記》「玉不琢，不成器；人不學，不知道」，這兩句的意思是<br><i>文中引《礼记》「玉不琢，不成器；人不学，不知道」，这两句的意思是</i>", "options": {"A": "美玉不必雕琢已經名貴，人不必學習也有天分<br><i>美玉不必雕琢已经名贵，人不必学习也有天分</i>", "B": "雕琢美玉十分困難，讀書求學同樣辛苦<br><i>雕琢美玉十分困难，读书求学同样辛苦</i>", "C": "玉器與學問都應該及早開始<br><i>玉器与学问都应该及早开始</i>", "D": "美玉不經雕琢便不能成為器物，人不學習便不明白道理<br><i>美玉不经雕琢便不能成为器物，人不学习便不明白道理</i>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "作者說「把工具用壞了，不能反過來說工具沒有用」。這句話所針對的推論毛病，最適合用哪個成語形容？<br><i>作者说「把工具用坏了，不能反过来说工具没有用」。这句话所针对的推论毛病，最适合用哪个成语形容？</i>", "options": {"A": "因噎廢食<br><i>因噎废食</i>", "B": "按圖索驥<br><i>按图索骥</i>", "C": "捨本逐末<br><i>舍本逐末</i>", "D": "一葉知秋<br><i>一叶知秋</i>"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "84", "type": "mcq", "section": "Chinese", "stem": "「若教師只要求學生默出全文，不問文意，學生確實可以背得滾瓜爛熟而一無所得。」這個複句屬於哪一種關係？<br><i>「若教师只要求学生默出全文，不问文意，学生确实可以背得滚瓜烂熟而一无所得。」这个复句属于哪一种关系？</i>", "options": {"A": "轉折關係<br><i>转折关系</i>", "B": "假設關係<br><i>假设关系</i>", "C": "並列關係<br><i>并列关系</i>", "D": "遞進關係<br><i>递进关系</i>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "85", "type": "mcq", "section": "Chinese", "stem": "「篇章應當精選，數量宜少而質宜高。」句中的「而」，其作用是<br><i>「篇章应当精选，数量宜少而质宜高。」句中的「而」，其作用是</i>", "options": {"A": "連接前後兩個並列的要求<br><i>连接前后两个并列的要求</i>", "B": "表示前後相反<br><i>表示前后相反</i>", "C": "表示先後次序<br><i>表示先后次序</i>", "D": "表示因果關係<br><i>表示因果关系</i>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "86", "type": "mcq", "section": "Chinese", "stem": "「於今天的生活有何用處？」這一句用了哪種修辭手法？<br><i>「于今天的生活有何用处？」这一句用了哪种修辞手法？</i>", "options": {"A": "設問<br><i>设问</i>", "B": "比喻", "C": "反問<br><i>反问</i>", "D": "對偶<br><i>对偶</i>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 5 (V5)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
