<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmXlzvpnHvxI5ILdACyHHZv8HWfNQ08pCP27GmmluJ7lUGiou1izR4e7Gs8LxKLtgo/exec";
const SCHOOL = "CIS", STAGE = "4", VERSION = "1";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Maria lent her umbrella to Tom because ___ had forgotten his own.", "options": {"A": "he", "B": "him", "C": "himself", "D": "his"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "The museum ___ we visited last summer has just reopened after major repairs.", "options": {"A": "who", "B": "where", "C": "which", "D": "what"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "What is the closest in meaning to “Famished” as it is used in the sentence below?\nAfter the long hike with no lunch, the children were absolutely famished by the time they reached camp.", "options": {"A": "exhausted", "B": "very hungry", "C": "sleepy", "D": "frightened"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "Choose the correctly punctuated sentence.", "options": {"A": "The rain had stopped, but the streets were still flooded.", "B": "The rain had stopped but, the streets were still flooded.", "C": "The rain had stopped but the streets were still flooded.", "D": "The rain had stopped, but, the streets were still flooded."}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Choose the conjunction that best completes the sentence: 'I wanted to watch the film, ___ the cinema was already closed.'", "options": {"A": "but", "B": "because", "C": "so", "D": "or"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Each of the students ___ a copy of the assignment before leaving.", "options": {"A": "receive", "B": "are receiving", "C": "have received", "D": "receives"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word? 'The new app proved remarkably PROFICIENT at sorting the files.'", "options": {"A": "slow", "B": "experienced", "C": "skilful", "D": "popular"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Look at the sky: those clouds mean it ___ within the hour.", "options": {"A": "has rained", "B": "rained", "C": "was raining", "D": "will probably rain"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "What is the closest in meaning to “Grueling” as it is used in the sentence below?\nMonths of grueling training left even the strongest runners drained, yet none of them gave up.", "options": {"A": "enjoyable", "B": "extremely demanding", "C": "brief", "D": "expensive"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "By the time the bell rang, the class ___ already ___ the experiment.", "options": {"A": "has / finished", "B": "had / finished", "C": "have / finished", "D": "was / finishing"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Which word is the OPPOSITE of 'abundant'?", "options": {"A": "plentiful", "B": "generous", "C": "scarce", "D": "rare"}, "fig": "", "passage": null, "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "Rewrite in the passive voice: 'The committee will announce the results tomorrow.'", "options": {"A": "The results will announce the committee tomorrow.", "B": "The results are announced by the committee tomorrow.", "C": "The results will being announced by the committee tomorrow.", "D": "The results will be announced by the committee tomorrow."}, "fig": "", "passage": null, "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "A school newsletter wants to describe a determined student in a POSITIVE way. Which word fits best?", "options": {"A": "persistent", "B": "stubborn", "C": "obstinate", "D": "pig-headed"}, "fig": "", "passage": null, "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "Choose the word closest in meaning to the underlined phrase: 'She arrived EARLIER THAN BEFORE to get a good seat.'", "options": {"A": "later", "B": "sooner", "C": "louder", "D": "rarely"}, "fig": "", "passage": null, "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "Complete the analogy: 'cautious' is to 'reckless' as 'humble' is to ___.", "options": {"A": "modest", "B": "quiet", "C": "arrogant", "D": "honest"}, "fig": "", "passage": null, "qnum": 15}, {"n": 17, "type": "mcq", "section": "English", "stem": "Before 1962, how was the lighthouse lamp powered?", "options": {"A": "By oil", "B": "By a distant computer", "C": "By rainwater collected in barrels", "D": "By electricity"}, "fig": "", "passage": "<strong>The Lighthouse at Cape Verena</strong><br>For more than a hundred years, a tall white tower has stood on the rocks at Cape Verena, warning ships away from the dangerous shoals that hide beneath the waves. When it was first built in 1887, the lighthouse had no electricity. Instead, its keeper climbed the spiral staircase every evening to light a great oil lamp, and again before dawn to put it out. The lamp sat behind curved glass lenses that gathered its weak flame into a single powerful beam, bright enough to be seen from twenty miles out at sea.<br><br>Life for a lighthouse keeper was lonely and demanding. The keeper and his family often lived for months without visitors, growing their own vegetables and collecting rainwater in barrels. During fierce storms, supplies sometimes failed to arrive for weeks. Yet the keeper could never abandon his post, because a single dark night might cost the lives of an entire crew.<br><br>In 1962, the oil lamp was replaced by an electric light, and in 1998 the lighthouse was fully automated. Today no keeper lives there at all. Sensors switch the light on at dusk, and a computer many miles away checks whether it is working. Some people feel that something valuable was lost when the keepers left, for those quiet figures had once been the only protection against the sea. Others point out that automation has made the light far more reliable, since a machine never falls ill, never sleeps, and never forgets to climb the stairs. Whatever one believes, the old tower still turns its patient beam across the water every night, just as it always has.", "qnum": 16}, {"n": 18, "type": "mcq", "section": "English", "stem": "In the passage, the word 'demanding' (paragraph 2) most nearly means", "options": {"A": "requiring great effort", "B": "asking many questions", "C": "highly paid", "D": "frequently changing"}, "fig": "", "passage": "<strong>The Lighthouse at Cape Verena</strong><br>For more than a hundred years, a tall white tower has stood on the rocks at Cape Verena, warning ships away from the dangerous shoals that hide beneath the waves. When it was first built in 1887, the lighthouse had no electricity. Instead, its keeper climbed the spiral staircase every evening to light a great oil lamp, and again before dawn to put it out. The lamp sat behind curved glass lenses that gathered its weak flame into a single powerful beam, bright enough to be seen from twenty miles out at sea.<br><br>Life for a lighthouse keeper was lonely and demanding. The keeper and his family often lived for months without visitors, growing their own vegetables and collecting rainwater in barrels. During fierce storms, supplies sometimes failed to arrive for weeks. Yet the keeper could never abandon his post, because a single dark night might cost the lives of an entire crew.<br><br>In 1962, the oil lamp was replaced by an electric light, and in 1998 the lighthouse was fully automated. Today no keeper lives there at all. Sensors switch the light on at dusk, and a computer many miles away checks whether it is working. Some people feel that something valuable was lost when the keepers left, for those quiet figures had once been the only protection against the sea. Others point out that automation has made the light far more reliable, since a machine never falls ill, never sleeps, and never forgets to climb the stairs. Whatever one believes, the old tower still turns its patient beam across the water every night, just as it always has.", "qnum": 17}, {"n": 19, "type": "mcq", "section": "English", "stem": "According to the passage, why could the keeper never abandon his post?", "options": {"A": "Because supplies arrived every week", "B": "Because the computer told him to stay", "C": "Because a dark night might cost a crew their lives", "D": "Because he enjoyed the loneliness"}, "fig": "", "passage": "<strong>The Lighthouse at Cape Verena</strong><br>For more than a hundred years, a tall white tower has stood on the rocks at Cape Verena, warning ships away from the dangerous shoals that hide beneath the waves. When it was first built in 1887, the lighthouse had no electricity. Instead, its keeper climbed the spiral staircase every evening to light a great oil lamp, and again before dawn to put it out. The lamp sat behind curved glass lenses that gathered its weak flame into a single powerful beam, bright enough to be seen from twenty miles out at sea.<br><br>Life for a lighthouse keeper was lonely and demanding. The keeper and his family often lived for months without visitors, growing their own vegetables and collecting rainwater in barrels. During fierce storms, supplies sometimes failed to arrive for weeks. Yet the keeper could never abandon his post, because a single dark night might cost the lives of an entire crew.<br><br>In 1962, the oil lamp was replaced by an electric light, and in 1998 the lighthouse was fully automated. Today no keeper lives there at all. Sensors switch the light on at dusk, and a computer many miles away checks whether it is working. Some people feel that something valuable was lost when the keepers left, for those quiet figures had once been the only protection against the sea. Others point out that automation has made the light far more reliable, since a machine never falls ill, never sleeps, and never forgets to climb the stairs. Whatever one believes, the old tower still turns its patient beam across the water every night, just as it always has.", "qnum": 18}, {"n": 20, "type": "mcq", "section": "English", "stem": "What can you infer about the writer's attitude toward automation?", "options": {"A": "The writer is firmly against it and wants keepers to return.", "B": "The writer thinks the lighthouse should be torn down.", "C": "The writer believes automation has made the sea less dangerous.", "D": "The writer presents both gains and losses without taking a side."}, "fig": "", "passage": "<strong>The Lighthouse at Cape Verena</strong><br>For more than a hundred years, a tall white tower has stood on the rocks at Cape Verena, warning ships away from the dangerous shoals that hide beneath the waves. When it was first built in 1887, the lighthouse had no electricity. Instead, its keeper climbed the spiral staircase every evening to light a great oil lamp, and again before dawn to put it out. The lamp sat behind curved glass lenses that gathered its weak flame into a single powerful beam, bright enough to be seen from twenty miles out at sea.<br><br>Life for a lighthouse keeper was lonely and demanding. The keeper and his family often lived for months without visitors, growing their own vegetables and collecting rainwater in barrels. During fierce storms, supplies sometimes failed to arrive for weeks. Yet the keeper could never abandon his post, because a single dark night might cost the lives of an entire crew.<br><br>In 1962, the oil lamp was replaced by an electric light, and in 1998 the lighthouse was fully automated. Today no keeper lives there at all. Sensors switch the light on at dusk, and a computer many miles away checks whether it is working. Some people feel that something valuable was lost when the keepers left, for those quiet figures had once been the only protection against the sea. Others point out that automation has made the light far more reliable, since a machine never falls ill, never sleeps, and never forgets to climb the stairs. Whatever one believes, the old tower still turns its patient beam across the water every night, just as it always has.", "qnum": 19}, {"n": 21, "type": "mcq", "section": "English", "stem": "In what year was the lighthouse fully automated?", "options": {"A": "1887", "B": "1962", "C": "1998", "D": "1962 and again in 1998"}, "fig": "", "passage": "<strong>The Lighthouse at Cape Verena</strong><br>For more than a hundred years, a tall white tower has stood on the rocks at Cape Verena, warning ships away from the dangerous shoals that hide beneath the waves. When it was first built in 1887, the lighthouse had no electricity. Instead, its keeper climbed the spiral staircase every evening to light a great oil lamp, and again before dawn to put it out. The lamp sat behind curved glass lenses that gathered its weak flame into a single powerful beam, bright enough to be seen from twenty miles out at sea.<br><br>Life for a lighthouse keeper was lonely and demanding. The keeper and his family often lived for months without visitors, growing their own vegetables and collecting rainwater in barrels. During fierce storms, supplies sometimes failed to arrive for weeks. Yet the keeper could never abandon his post, because a single dark night might cost the lives of an entire crew.<br><br>In 1962, the oil lamp was replaced by an electric light, and in 1998 the lighthouse was fully automated. Today no keeper lives there at all. Sensors switch the light on at dusk, and a computer many miles away checks whether it is working. Some people feel that something valuable was lost when the keepers left, for those quiet figures had once been the only protection against the sea. Others point out that automation has made the light far more reliable, since a machine never falls ill, never sleeps, and never forgets to climb the stairs. Whatever one believes, the old tower still turns its patient beam across the water every night, just as it always has.", "qnum": 20}, {"n": 22, "type": "mcq", "section": "English", "stem": "What is the writer's main opinion in this passage?", "options": {"A": "Phones should be allowed freely throughout the school day.", "B": "Schools are right to lock phones away during the school day.", "C": "Phones are useless and should be banned everywhere, forever.", "D": "Teachers should be given phones instead of students."}, "fig": "", "passage": "<strong>Should Schools Ban Phones During the Day?</strong><br>Walk into almost any classroom today and you will see them: smartphones tucked into pockets, buzzing in bags, glowing under desks. More and more schools are now choosing to lock phones away from the first bell to the last, and I believe they are right to do so.<br><br>The strongest reason is attention. Studies have shown that even a silent phone sitting face-down on a desk pulls at a student&#x27;s focus, because part of the mind keeps waiting for the next message. When phones are collected at the door, lessons run more smoothly and students remember more of what they learn. A tool that constantly interrupts learning has no place in the middle of a lesson.<br><br>The second reason is friendship. In schools that have gone phone-free, teachers report that something surprising happens at break time: the noise returns. Instead of staring down at glowing screens, students talk, argue, laugh, and play together. These ordinary conversations are how young people learn to read one another and to handle disagreement, skills no app can teach.<br><br>Of course, phones are useful. They keep families in contact and can answer a question in seconds. But a phone left in a locker is not gone forever; it is simply waiting until the school day ends. For six or seven hours, students lose very little and gain a great deal: sharper focus, real conversation, and a calmer place to learn. For these reasons, schools that ban phones during the day are making a wise choice, and more should follow their lead.", "qnum": 21}, {"n": 23, "type": "mcq", "section": "English", "stem": "Which two main reasons does the writer give to support the ban?", "options": {"A": "Lower cost and better exam results", "B": "Safety from traffic and healthier eating", "C": "Faster internet and quieter hallways", "D": "Better focus in lessons and more real friendship at break"}, "fig": "", "passage": "<strong>Should Schools Ban Phones During the Day?</strong><br>Walk into almost any classroom today and you will see them: smartphones tucked into pockets, buzzing in bags, glowing under desks. More and more schools are now choosing to lock phones away from the first bell to the last, and I believe they are right to do so.<br><br>The strongest reason is attention. Studies have shown that even a silent phone sitting face-down on a desk pulls at a student&#x27;s focus, because part of the mind keeps waiting for the next message. When phones are collected at the door, lessons run more smoothly and students remember more of what they learn. A tool that constantly interrupts learning has no place in the middle of a lesson.<br><br>The second reason is friendship. In schools that have gone phone-free, teachers report that something surprising happens at break time: the noise returns. Instead of staring down at glowing screens, students talk, argue, laugh, and play together. These ordinary conversations are how young people learn to read one another and to handle disagreement, skills no app can teach.<br><br>Of course, phones are useful. They keep families in contact and can answer a question in seconds. But a phone left in a locker is not gone forever; it is simply waiting until the school day ends. For six or seven hours, students lose very little and gain a great deal: sharper focus, real conversation, and a calmer place to learn. For these reasons, schools that ban phones during the day are making a wise choice, and more should follow their lead.", "qnum": 22}, {"n": 24, "type": "mcq", "section": "English", "stem": "In the passage, the phrase 'pulls at a student's focus' (paragraph 2) most nearly means", "options": {"A": "improves concentration", "B": "distracts attention", "C": "physically tugs the student", "D": "switches off the phone"}, "fig": "", "passage": "<strong>Should Schools Ban Phones During the Day?</strong><br>Walk into almost any classroom today and you will see them: smartphones tucked into pockets, buzzing in bags, glowing under desks. More and more schools are now choosing to lock phones away from the first bell to the last, and I believe they are right to do so.<br><br>The strongest reason is attention. Studies have shown that even a silent phone sitting face-down on a desk pulls at a student&#x27;s focus, because part of the mind keeps waiting for the next message. When phones are collected at the door, lessons run more smoothly and students remember more of what they learn. A tool that constantly interrupts learning has no place in the middle of a lesson.<br><br>The second reason is friendship. In schools that have gone phone-free, teachers report that something surprising happens at break time: the noise returns. Instead of staring down at glowing screens, students talk, argue, laugh, and play together. These ordinary conversations are how young people learn to read one another and to handle disagreement, skills no app can teach.<br><br>Of course, phones are useful. They keep families in contact and can answer a question in seconds. But a phone left in a locker is not gone forever; it is simply waiting until the school day ends. For six or seven hours, students lose very little and gain a great deal: sharper focus, real conversation, and a calmer place to learn. For these reasons, schools that ban phones during the day are making a wise choice, and more should follow their lead.", "qnum": 23}, {"n": 25, "type": "mcq", "section": "English", "stem": "Why does the writer admit that 'phones are useful' in the final paragraph?", "options": {"A": "To acknowledge the other view before explaining why the ban still wins", "B": "To fill space with an unrelated fact", "C": "To change sides and argue against the ban", "D": "To prove that phones should never be locked away"}, "fig": "", "passage": "<strong>Should Schools Ban Phones During the Day?</strong><br>Walk into almost any classroom today and you will see them: smartphones tucked into pockets, buzzing in bags, glowing under desks. More and more schools are now choosing to lock phones away from the first bell to the last, and I believe they are right to do so.<br><br>The strongest reason is attention. Studies have shown that even a silent phone sitting face-down on a desk pulls at a student&#x27;s focus, because part of the mind keeps waiting for the next message. When phones are collected at the door, lessons run more smoothly and students remember more of what they learn. A tool that constantly interrupts learning has no place in the middle of a lesson.<br><br>The second reason is friendship. In schools that have gone phone-free, teachers report that something surprising happens at break time: the noise returns. Instead of staring down at glowing screens, students talk, argue, laugh, and play together. These ordinary conversations are how young people learn to read one another and to handle disagreement, skills no app can teach.<br><br>Of course, phones are useful. They keep families in contact and can answer a question in seconds. But a phone left in a locker is not gone forever; it is simply waiting until the school day ends. For six or seven hours, students lose very little and gain a great deal: sharper focus, real conversation, and a calmer place to learn. For these reasons, schools that ban phones during the day are making a wise choice, and more should follow their lead.", "qnum": 24}, {"n": 26, "type": "mcq", "section": "English", "stem": "Based on the passage, how would the writer most likely respond to a parent worried about contacting their child during the day?", "options": {"A": "Children do not need their parents at school.", "B": "Parents should never be allowed to contact the school.", "C": "Phones should be banned at home as well.", "D": "The phone is only locked away temporarily and can be used once the day ends."}, "fig": "", "passage": "<strong>Should Schools Ban Phones During the Day?</strong><br>Walk into almost any classroom today and you will see them: smartphones tucked into pockets, buzzing in bags, glowing under desks. More and more schools are now choosing to lock phones away from the first bell to the last, and I believe they are right to do so.<br><br>The strongest reason is attention. Studies have shown that even a silent phone sitting face-down on a desk pulls at a student&#x27;s focus, because part of the mind keeps waiting for the next message. When phones are collected at the door, lessons run more smoothly and students remember more of what they learn. A tool that constantly interrupts learning has no place in the middle of a lesson.<br><br>The second reason is friendship. In schools that have gone phone-free, teachers report that something surprising happens at break time: the noise returns. Instead of staring down at glowing screens, students talk, argue, laugh, and play together. These ordinary conversations are how young people learn to read one another and to handle disagreement, skills no app can teach.<br><br>Of course, phones are useful. They keep families in contact and can answer a question in seconds. But a phone left in a locker is not gone forever; it is simply waiting until the school day ends. For six or seven hours, students lose very little and gain a great deal: sharper focus, real conversation, and a calmer place to learn. For these reasons, schools that ban phones during the day are making a wise choice, and more should follow their lead.", "qnum": 25}, {"n": 27, "type": "writing", "section": "English Writing", "intro": "Everyone has a place that feels special to them, whether it is busy or quiet, far away or close to home.", "label": "", "body": "Describe a place that is special to you. Explain what it looks, sounds, and feels like, why it matters to you, and whether you think everyone needs a place like this of their own.", "hint": "Write at least 7-8 sentences.", "placeholder": "Type your response here…", "partA": "Describe a place that is special to you. Explain what it looks, sounds, and feels like, why it matters to you, and whether you think everyone needs a place like this of their own.", "partB": ""}, {"n": 28, "type": "info", "title": "English Listening &amp; Speaking", "body": "<div class='info-body'>In the real test this section is delivered by an on-screen avatar: you listen and then speak your answers aloud into the microphone. There is nothing to type or record here, the sample questions below show the kind of thing you'll be asked, so you can practise out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Introduce yourself and tell me about your interests outside school.</li><li style='margin:7px 0'>Describe a challenge you faced and how you dealt with it.</li><li style='margin:7px 0'>What does being a good friend mean to you?</li><li style='margin:7px 0'>Talk about a place you would like to visit and explain why.</li><li style='margin:7px 0'>Listen to a short talk, then summarise the main points.</li></ul>"}, {"n": 29, "type": "info", "title": "Mathematics, Logic &amp; Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": 30, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which expression is equal to 6(2x − 5)?", "options": {"A": "12x − 5", "B": "12x − 30", "C": "2x − 11", "D": "12x − 11"}, "fig": "", "passage": null, "qnum": 26}, {"n": 31, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify: 7a + 4b − 3a + 2b.", "options": {"A": "4a + 6b", "B": "10a + 6b", "C": "4a + 8b", "D": "10ab"}, "fig": "", "passage": null, "qnum": 27}, {"n": 32, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Order from least to greatest: −7, 3, −12, 0, −5.", "options": {"A": "−5, −7, −12, 0, 3", "B": "0, 3, −5, −7, −12", "C": "−12, −7, −5, 0, 3", "D": "3, 0, −5, −7, −12"}, "fig": "", "passage": null, "qnum": 28}, {"n": 33, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A sum of $480 is shared between two people in the ratio 5 : 3. How much does the person with the larger share receive?", "options": {"A": "$160", "B": "$180", "C": "$240", "D": "$300"}, "fig": "", "passage": null, "qnum": 29}, {"n": 34, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 15 + (−9) − (−4).", "options": {"A": "2", "B": "10", "C": "20", "D": "0"}, "fig": "", "passage": null, "qnum": 30}, {"n": 35, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 5/9 ÷ 3/5.", "options": {"A": "1/3", "B": "8/14", "C": "25/27", "D": "3/5"}, "fig": "", "passage": null, "qnum": 31}, {"n": 36, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which percentage is equal to 7/20?", "options": {"A": "27%", "B": "35%", "C": "7%", "D": "70%"}, "fig": "", "passage": null, "qnum": 32}, {"n": 37, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 1.44 ÷ 0.6.", "options": {"A": "2.4", "B": "0.24", "C": "2.04", "D": "0.864"}, "fig": "", "passage": null, "qnum": 33}, {"n": 38, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A jacket costs $250. In a sale the price is reduced by 20%. What is the sale price?", "options": {"A": "$230", "B": "$50", "C": "$300", "D": "$200"}, "fig": "", "passage": null, "qnum": 34}, {"n": 39, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: (−2)(−5)(−3).", "options": {"A": "30", "B": "−30", "C": "−10", "D": "10"}, "fig": "", "passage": null, "qnum": 35}, {"n": 40, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangle has sides 8.5 cm, 6 cm and 7.5 cm. What is its perimeter?", "options": {"A": "22 cm", "B": "20.5 cm", "C": "14.5 cm", "D": "21 cm"}, "fig": "", "passage": null, "qnum": 36}, {"n": 41, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangle has base 12 cm and perpendicular height 5 cm. What is its area?", "options": {"A": "60 cm²", "B": "17 cm²", "C": "30 cm²", "D": "34 cm²"}, "fig": "", "passage": null, "qnum": 37}, {"n": 42, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two angles of a triangle are 47° and 68°. What is the third angle?", "options": {"A": "115°", "B": "75°", "C": "245°", "D": "65°"}, "fig": "<svg viewBox=\"0 0 300 200\" width=\"300\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"#ffffff\"/><polygon points=\"40,170 260,170 110,40\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"64\" y=\"162\" font-size=\"12\" font-family=\"Arial\">47°</text><text x=\"222\" y=\"162\" font-size=\"12\" font-family=\"Arial\">68°</text><text x=\"104\" y=\"64\" font-size=\"13\" font-family=\"Arial\" font-weight=\"bold\">?</text></svg>", "passage": null, "qnum": 38}, {"n": 43, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Find the mean of these five numbers: 12, 8, 15, 9, 16.", "options": {"A": "60", "B": "15", "C": "12", "D": "8"}, "fig": "", "passage": null, "qnum": 39}, {"n": 44, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid measures 6 cm by 4 cm by 3 cm. What is its volume?", "options": {"A": "13 cm³", "B": "108 cm³", "C": "26 cm³", "D": "72 cm³"}, "fig": "", "passage": null, "qnum": 40}, {"n": 45, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Evaluate: 3 + 4 × (10 − 6) − 5.", "options": {"A": "14", "B": "23", "C": "3", "D": "33"}, "fig": "", "passage": null, "qnum": 41}, {"n": 46, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this number sequence, which follows two alternating rules:\n3, 6, 4, 8, 6, 12, 10, ___\nWhat is the next term?", "options": {"A": "8", "B": "20", "C": "5", "D": "22"}, "fig": "", "passage": null, "qnum": 42}, {"n": 47, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two people make two bicycles in two hours.\nHow many people are needed to make twelve bicycles in six hours?", "options": {"A": "12", "B": "6", "C": "4", "D": "2"}, "fig": "", "passage": null, "qnum": 43}, {"n": 48, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A shuttle bus leaves the station every 25 minutes, with the first departure at 14:05. The ride to the stadium takes 35 minutes. Mei must arrive at the stadium no later than 16:00.\nWhich is the LATEST departure she can take and still arrive on time?", "options": {"A": "15:20", "B": "15:45", "C": "14:55", "D": "14:30"}, "fig": "", "passage": null, "qnum": 44}, {"n": 49, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word connects the other three?\noak    pine    birch    ____", "options": {"A": "plant", "B": "pine", "C": "forest", "D": "tree"}, "fig": "", "passage": null, "qnum": 45}, {"n": 50, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A code writes each letter as its position in the alphabet (A = 1, B = 2, ...) converted to a 5-digit binary number, with place values 16, 8, 4, 2, 1 read left to right. For example, C = 3 = 00011.\nWhat letter does 01000 represent?", "options": {"A": "I", "B": "H", "C": "B", "D": "D"}, "fig": "", "passage": null, "qnum": 46}, {"n": 51, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"To reduce the litter in our park, the council should install more bins along every path.\"\nProposed ASSUMPTION: \"People will use the extra bins if they are placed within easy reach.\"\nUsing only the information in the statement, is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": null, "qnum": 47}, {"n": 52, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every member of the Year 9 debate team scored above 80% on the school's written reasoning test. To be invited into the school's Advanced Reasoning class, a student must score at least 75% on that same test.\"\nWhich of the following MUST be true?", "options": {"A": "Every member of the Year 9 debate team meets the score requirement for the Advanced Reasoning class.", "B": "Any student who scored at least 75% on the test is a member of the debate team.", "C": "A student who is not on the debate team scored below 75% on the test.", "D": "All members of the Advanced Reasoning class are on the debate team."}, "fig": "", "passage": null, "qnum": 48}, {"n": 53, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"All students in Class 4B study Spanish. Some students who study Spanish also study Latin. No student who studies Latin is in the choir.\"\nWhich conclusion does NOT follow from these facts?", "options": {"A": "No student who is in the choir studies Latin.", "B": "Some students who study Spanish do not study Latin.", "C": "Every student in Class 4B studies Spanish.", "D": "At least one student studies both Spanish and Latin."}, "fig": "", "passage": null, "qnum": 49}, {"n": 54, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the school replace its printed library catalogue with a digital search system?\"\nThree arguments are offered below.\nWhich is the STRONGEST argument?", "options": {"A": "Yes, a one-term trial at three nearby schools cut average book-search time from 4 minutes to under 1 minute and raised borrowing by 30%.", "B": "No, change is usually a bad thing, and the printed catalogue has served the school for many years.", "C": "Yes, 92% of households in Hong Kong now own a smartphone, so going digital is clearly the way forward."}, "fig": "", "passage": null, "qnum": 50}, {"n": 55, "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 簡体.)"}, {"n": 56, "type": "mcq", "section": "Chinese", "stem": "李婆婆日復一日地修整花圃，最終為這條街帶來了什麼變化？ <br><span style=\"color:#555\">李婆婆日复一日地修整花圃，最终为这条街带来了什么变化？</span>", "options": {"A": "公園裏最好的位置都被她佔去了<br><span style=\"color:#555\">公园里最好的位置都被她占去了</span>", "B": "街坊重新關心起這片曾被遺忘的土地，鄰里也多了問候<br><span style=\"color:#555\">街坊重新关心起这片曾被遗忘的土地，邻里也多了问候</span>", "C": "醫生終於同意她可以多做運動<br><span style=\"color:#555\">医生终于同意她可以多做运动</span>", "D": "鄰居們開始互相比較誰更勤勞<br><span style=\"color:#555\">邻居们开始互相比较谁更勤劳</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>李婆婆住在舊樓的三樓，窗外正對著一片被人遺忘的舊花圃。那片花圃早已荒草叢生，街坊路過時誰也不曾多看一眼，孩子寧願繞道而行，也不願靠近那片雜亂的角落。有人甚至建議把它鏟平，改作停車的空地。李婆婆沒有說話，只是常常望著那片荒地出神。一個清晨，天還沒有完全亮，李婆婆便悄悄拎著小鏟子下了樓，蹲在花圃邊，一點一點地拔除雜草。她並沒有想過要做給誰看，只是覺得，再荒涼的土地，也不該就這樣被人放棄。此後，她日復一日地修整那片土地，從不間斷，颳風下雨也照常出門。春去秋來，枯黃的角落漸漸冒出了新綠，開出了一朵朵小花。漸漸地，街坊才重新注意到這片曾被忽略的花圃，有人駐足欣賞，有人也跟著動手幫忙。一片小小的花圃，竟悄悄喚起了整條街對這片土地的關心，鄰里之間也因此多了幾分問候與笑容。</div><div><em>簡体</em><br>李婆婆住在旧楼的三楼，窗外正对着一片被人遗忘的旧花圃。那片花圃早已荒草丛生，街坊路过时谁也不曾多看一眼，孩子宁愿绕道而行，也不愿靠近那片杂乱的角落。有人甚至建议把它铲平，改作停车的空地。李婆婆没有说话，只是常常望着那片荒地出神。一个清晨，天还没有完全亮，李婆婆便悄悄拎着小铲子下了楼，蹲在花圃边，一点一点地拔除杂草。她并没有想过要做给谁看，只是觉得，再荒凉的土地，也不该就这样被人放弃。此后，她日复一日地修整那片土地，从不间断，刮风下雨也照常出门。春去秋来，枯黄的角落渐渐冒出了新绿，开出了一朵朵小花。渐渐地，街坊才重新注意到这片曾被忽略的花圃，有人驻足欣赏，有人也跟着动手帮忙。一片小小的花圃，竟悄悄唤起了整条街对这片土地的关心，邻里之间也因此多了几分问候与笑容。</div>", "qnum": 51}, {"n": 57, "type": "mcq", "section": "Chinese", "stem": "從短文可以推斷，起初街坊對那片舊花圃抱着怎樣的態度？ <br><span style=\"color:#555 ": "mcq", "section": "Chinese", "stem": "「他臨危不亂，沉__應對，化解了這場危機。」橫線上應填的字是： <br><span style=\"color:#555\">「他临危不乱，沉__应对，化解了这场危机。」横线上应填的字是：</span>", "options": {"A": "默<br><span style=\"color:#555\">默</span>", "B": "著<br><span style=\"color:#555\">着</span>", "C": "重<br><span style=\"color:#555\">重</span>", "D": "迷<br><span style=\"color:#555\">迷</span>"}, "fig": "", "passage": null, "qnum": 63}, {"n": 69, "type": "info", "title": "中文寫作 Chinese Writing", "body": "<div class='info-body'>在正式考試中，中文寫作為紙筆作答，以下兩題<b>二選一</b>。此頁僅供參考，你不需要在此輸入答案。<br>In the real test, Chinese writing is done on paper, <b>choose one</b> of the two prompts below. This page is for reference only; you don't need to type anything here.</div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 1 / 题目 1</b><br>《克服困難的經歷》, , 記敘一次你面對困難並努力克服的過程，談談你的體會（不少於 10 句）。<br><span style='color:#555'>《克服困难的经历》, , 记叙一次你面对困难并努力克服的过程，谈谈你的体会（不少于 10 句）。</span></div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 2 / 题目 2</b><br>《給三年後自己的一封信》, , 談談你的期望、目標與計劃（不少於 10 句）。<br><span style='color:#555'>《给三年后自己的一封信》, , 谈谈你的期望、目标与计划（不少于 10 句）。</span></div>"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
