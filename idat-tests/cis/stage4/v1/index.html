<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCHOOL = "CIS", STAGE = "4", VERSION = "1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which word has the most POSITIVE connotation when describing a person who does not give up easily?", "options": {"A": "stubborn", "B": "obstinate", "C": "pig-headed", "D": "persistent"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "In the sentence below, the writer wants to make the smell sound UNPLEASANT. Which word fits the negative tone? \"As we opened the old refrigerator, a _____ smell filled the kitchen.\"", "options": {"A": "fragrant", "B": "aromatic", "C": "pungent", "D": "scented"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word ravenous in the sentence below? \"After a whole afternoon of football with no lunch, the boys were ravenous by the time dinner was served.\"", "options": {"A": "extremely hungry", "B": "exhausted", "C": "faint and dizzy", "D": "thirsty"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the option that corrects the subject-verb agreement error in the sentence below. \"The box of old photographs were left in the attic for years.\"", "options": {"A": "The box of old photographs were left in the attic for years.", "B": "The box of old photographs was left in the attic for years.", "C": "The box of old photographs are left in the attic for years.", "D": "The boxes of old photograph was left in the attic for years."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which prefix forms the standard English word built from \"necessary\" that means \"not needed\"?", "options": {"A": "un-", "B": "im-", "C": "mis-", "D": "re-"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Choose the correct relative pronoun to complete the sentence. \"The scientist _____ discovered the vaccine was awarded a major prize.\"", "options": {"A": "which", "B": "where", "C": "what", "D": "who"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word grueling in the sentence below? \"The marathon was a grueling test of endurance that left even the fittest runners gasping.\"", "options": {"A": "exhausting and demanding", "B": "enjoyable", "C": "brief", "D": "confusing"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which of the following is a COMPLETE sentence rather than a fragment?", "options": {"A": "Running through the rain to catch the last bus home.", "B": "Because the library closed earlier than expected on Friday.", "C": "The exhausted travellers finally reached the hotel.", "D": "Which surprised everyone in the audience that evening."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the word closest in meaning to the underlined word in the sentence below. \"She is a highly <u>adept</u> pianist who can sight-read almost any score.\"", "options": {"A": "enthusiastic", "B": "famous", "C": "talented", "D": "skilled"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the correct PASSIVE version of the active sentence below. \"The chef will prepare a special dessert tomorrow.\"", "options": {"A": "A special dessert will be prepared by the chef tomorrow.", "B": "A special dessert will prepare the chef tomorrow.", "C": "A special dessert is prepared by the chef tomorrow.", "D": "The chef is prepared by a special dessert tomorrow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "In the sentence below, what does the pronoun \"it\" most clearly refer to? \"Maya set the letter down on the desk, switched off the lamp, and went to bed, but the next morning she could not find it anywhere.\"", "options": {"A": "the desk", "B": "the lamp", "C": "the letter", "D": "Maya"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word embark in the sentence below? \"Next month our class will embark on a three-week study of ancient Egypt.\"", "options": {"A": "finish", "B": "begin", "C": "cancel", "D": "review"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Choose the option that corrects the error in the underlined gerund phrase. \"<u>To swimming every morning</u> improved her stamina dramatically.\"", "options": {"A": "To swimming every morning improved her stamina dramatically.", "B": "Swimming every morning improved her stamina dramatically.", "C": "To swim every morning, which improved her stamina dramatically.", "D": "Swim every morning improved her stamina dramatically."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which prefix added to the word \"mature\" reverses its meaning to mean \"not fully grown or developed\"?", "options": {"A": "un-", "B": "in-", "C": "im-", "D": "dis-"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Choose the correct verb form to complete the sentence. \"By the time the firefighters arrived, the flames _____ the entire roof.\"", "options": {"A": "have engulfed", "B": "engulf", "C": "will engulf", "D": "had engulfed"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word exotic in the sentence below? \"The market stalls overflowed with exotic fruits that none of the tourists could name.\"", "options": {"A": "strange and e at the edge of a busy town lived an old clockmaker named Elias, whose shop was crowded with ticking, chiming machines. Elias was proud of his work, and prouder still of the great brass clock in his window. \"Not a second too fast, not a second too slow,\" he would boast to anyone who paused to admire it.\n\nOne grey morning a small sparrow, half-frozen from the cold, fluttered through the open door and perched upon the brass clock. Elias waved his cloth at the bird. \"Away with you! You will dirty my finest work.\" But the sparrow only tucked its head beneath its wing and refused to move.\n\nDay after day the bird returned, and day after day Elias scolded it. Yet he noticed that whenever the sparrow sang, the townspeople stopped at his window, not to study the clock, but to listen. They lingered, they smiled, and many stepped inside to buy a watch or have an old one mended.\n\nWinter deepened, and one bitter evening Elias found the sparrow shivering on the cold floor. Without quite knowing why, he wrapped it gently in his cleaning cloth and set it by the warmth of his lamp. The bird recovered, and from that night it sang more sweetly than ever.\n\nWhen spring arrived, Elias opened the window and the sparrow flew free. He looked at his brass clock, still keeping its flawless time. \"You measure the hours,\" he murmured, \"but it was the little singer who taught me what they were for.\" From that day his door stayed open to every creature, and his shop was never empty again.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word lingered as it is used in the third paragraph? \"They lingered, they smiled, and many stepped inside.\"", "options": {"A": "hurried away", "B": "stayed for a while", "C": "argued loudly", "D": "paid quickly"}, "fig": "", "passage": "<strong>The Clockmaker and the Sparrow</strong><br>In a narrow lane at the edge of a busy town lived an old clockmaker named Elias, whose shop was crowded with ticking, chiming machines. Elias was proud of his work, and prouder still of the great brass clock in his window. \"Not a second too fast, not a second too slow,\" he would boast to anyone who paused to admire it.\n\nOne grey morning a small sparrow, half-frozen from the cold, fluttered through the open door and perched upon the brass clock. Elias waved his cloth at the bird. \"Away with you! You will dirty my finest work.\" But the sparrow only tucked its head beneath its wing and refused to move.\n\nDay after day the bird returned, and day after day Elias scolded it. Yet he noticed that whenever the sparrow sang, the townspeople stopped at his window, not to study the clock, but to listen. They lingered, they smiled, and many stepped inside to buy a watch or have an old one mended.\n\nWinter deepened, and one bitter evening Elias found the sparrow shivering on the cold floor. Without quite knowing why, he wrapped it gently in his cleaning cloth and set it by the warmth of his lamp. The bird recovered, and from that night it sang more sweetly than ever.\n\nWhen spring arrived, Elias opened the window and the sparrow flew free. He looked at his brass clock, still keeping its flawless time. \"You measure the hours,\" he murmured, \"but it was the little singer who taught me what they were for.\" From that day his door stayed open to every creature, and his shop was never empty again.", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "What can be inferred about Elias from the way his feelings toward the sparrow change?", "options": {"A": "He never truly cared about his customers.", "B": "He decides to stop making clocks altogether.", "C": "He was afraid of the sparrow from the beginning.", "D": "He learns to value warmth and kindness, not only precision."}, "fig": "", "passage": "<strong>The Clockmaker and the Sparrow</strong><br>In a narrow lane at the edge of a busy town lived an old clockmaker named Elias, whose shop was crowded with ticking, chiming machines. Elias was proud of his work, and prouder still of the great brass clock in his window. \"Not a second too fast, not a second too slow,\" he would boast to anyone who paused to admire it.\n\nOne grey morning a small sparrow, half-frozen from the cold, fluttered through the open door and perched upon the brass clock. Elias waved his cloth at the bird. \"Away with you! You will dirty my finest work.\" But the sparrow only tucked its head beneath its wing and refused to move.\n\nDay after day the bird returned, and day after day Elias scolded it. Yet he noticed that whenever the sparrow sang, the townspeople stopped at his window, not to study the clock, but to listen. They lingered, they smiled, and many stepped inside to buy a watch or have an old one mended.\n\nWinter deepened, and one bitter evening Elias found the sparrow shivering on the cold floor. Without quite knowing why, he wrapped it gently in his cleaning cloth and set it by the warmth of his lamp. The bird recovered, and from that night it sang more sweetly than ever.\n\nWhen spring arrived, Elias opened the window and the sparrow flew free. He looked at his brass clock, still keeping its flawless time. \"You measure the hours,\" he murmured, \"but it was the little singer who taught me what they were for.\" From that day his door stayed open to every creature, and his shop was never empty again.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "Which statement best expresses the THEME (central message) of the fable?", "options": {"A": "Hard work always leads to wealth.", "B": "Technical perfection matters more than anything else.", "C": "Compassion and beauty can give purpose to our work.", "D": "Birds make better companions than people."}, "fig": "", "passage": "<strong>The Clockmaker and the Sparrow</strong><br>In a narrow lane at the edge of a busy town lived an old clockmaker named Elias, whose shop was crowded with ticking, chiming machines. Elias was proud of his work, and prouder still of the great brass clock in his window. \"Not a second too fast, not a second too slow,\" he would boast to anyone who paused to admire it.\n\nOne grey morning a small sparrow, half-frozen from the cold, fluttered through the open door and perched upon the brass clock. Elias waved his cloth at the bird. \"Away with you! You will dirty my finest work.\" But the sparrow only tucked its head beneath its wing and refused to move.\n\nDay after day the bird returned, and day after day Elias scolded it. Yet he noticed that whenever the sparrow sang, the townspeople stopped at his window, not to study the clock, but to listen. They lingered, they smiled, and many stepped inside to buy a watch or have an old one mended.\n\nWinter deepened, and one bitter evening Elias found the sparrow shivering on the cold floor. Without quite knowing why, he wrapped it gently in his cleaning cloth and set it by the warmth of his lamp. The bird recovered, and from that night it sang more sweetly than ever.\n\nWhen spring arrived, Elias opened the window and the sparrow flew free. He looked at his brass clock, still keeping its flawless time. \"You measure the hours,\" he murmured, \"but it was the little singer who taught me what they were for.\" From that day his door stayed open to every creature, and his shop was never empty again.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "In the final paragraph, the sentence \"You measure the hours, but it was the little singer who taught me what they were for\" mainly serves to:", "options": {"A": "explain how the brass clock was built", "B": "contrast measuring time with understanding its value", "C": "prove the sparrow could tell the time", "D": "describe the weather in spring"}, "fig": "", "passage": "<strong>The Clockmaker and the Sparrow</strong><br>In a narrow lane at the edge of a busy town lived an old clockmaker named Elias, whose shop was crowded with ticking, chiming machines. Elias was proud of his work, and prouder still of the great brass clock in his window. \"Not a second too fast, not a second too slow,\" he would boast to anyone who paused to admire it.\n\nOne grey morning a small sparrow, half-frozen from the cold, fluttered through the open door and perched upon the brass clock. Elias waved his cloth at the bird. \"Away with you! You will dirty my finest work.\" But the sparrow only tucked its head beneath its wing and refused to move.\n\nDay after day the bird returned, and day after day Elias scolded it. Yet he noticed that whenever the sparrow sang, the townspeople stopped at his window, not to study the clock, but to listen. They lingered, they smiled, and many stepped inside to buy a watch or have an old one mended.\n\nWinter deepened, and one bitter evening Elias found the sparrow shivering on the cold floor. Without quite knowing why, he wrapped it gently in his cleaning cloth and set it by the warmth of his lamp. The bird recovered, and from that night it sang more sweetly than ever.\n\nWhen spring arrived, Elias opened the window and the sparrow flew free. He looked at his brass clock, still keeping its flawless time. \"You measure the hours,\" he murmured, \"but it was the little singer who taught me what they were for.\" From that day his door stayed open to every creature, and his shop was never empty again.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "According to the passage, how do green roofs help reduce flooding during storms?", "options": {"A": "They direct rainwater straight into the drains.", "B": "They make buildings heavier so water cannot reach them.", "C": "Their soil and roots soak up rainfall and release it slowly.", "D": "They raise the temperature of the surrounding air."}, "fig": "", "passage": "<strong>Why Cities Are Building Green Roofs</strong><br>Across the world's crowded cities, an unusual kind of garden is appearing where few people ever look: on the tops of buildings. Known as green roofs, these living layers of soil and plants are being installed on offices, schools, and apartment blocks from Singapore to Stuttgart. They may seem decorative, but planners value them for practical reasons.\n\nThe first benefit is temperature. Dense cities suffer from the urban heat island effect: concrete and asphalt absorb sunlight during the day and release it slowly at night, keeping built-up areas several degrees warmer than the countryside. Plants, by contrast, cool the air as water evaporates from their leaves. A roof covered in vegetation can lower the temperature of the building beneath it, cutting the need for air conditioning.\n\nGreen roofs also help manage rainwater. When a heavy storm strikes a city of hard surfaces, water rushes straight into drains, which can overflow and cause flooding. The soil and roots of a green roof act like a sponge, soaking up a large share of the rainfall and releasing it slowly. This eases the burden on a city's drainage system when it is most strained.\n\nThere are challenges, of course. A green roof is heavier than an ordinary one, so the building must support the extra weight of wet soil. It also costs more to install, and the plants need occasional care. For these reasons, some owners hesitate.\n\nYet many planners argue that the long-term gains, lower energy bills, reduced flooding, and cleaner air, outweigh the early expense. As cities grow hotter and more crowded, the humble rooftop may become one of the most valuable pieces of land a building owns.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word humble as it is used in the final sentence? \"...the humble rooftop may become one of the most valuable pieces of land a building owns.\"", "options": {"A": "expensive", "B": "ordinary and easily overlooked", "C": "dangerous", "D": "enormous"}, "fig": "", "passage": "<strong>Why Cities Are Building Green Roofs</strong><br>Across r, outweigh the early expense. As cities grow hotter and more crowded, the humble rooftop may become one of the most valuable pieces of land a building owns.", "qnum": "34"}, {"n": "36", "type": "writing", "section": "English Writing", "intro": "You will answer ONE of the two topics below using the keyboard. Plan briefly, then write a clear, well-organised personal response with a beginning, a middle, and an end.", "label": "", "body": "Choose ONE of the following: (1) Write about a hobby or activity that matters to you. Explain what it is, how you got started, and why it has become important in your life. (2) Write about a person who has had a strong influence on you. Explain who they are, one or two things they have done, and why their influence means so much to you.", "hint": "Write a well-developed response of at least 10-12 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "37", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "38", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which expression is equal to 4(3x − 7) + 2x?", "options": {"A": "12x − 28", "B": "14x − 7", "C": "5x − 28", "D": "14x − 28"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "39", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify: 6p − 4q − 9p + 7q + 3.", "options": {"A": "15p + 11q + 3", "B": "−3p + 3q + 3", "C": "−3p + 11q + 3", "D": "3p − 3q + 3"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Order from least to greatest: −8, 4, −11, 0, −3.", "options": {"A": "−3, −8, −11, 0, 4", "B": "−11, −8, −3, 0, 4", "C": "0, −3, −8, −11, 4", "D": "4, 0, −3, −8, −11"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which ral are 88°, 102° and 64°. What is the fourth angle?", "options": {"A": "106°", "B": "74°", "C": "254°", "D": "126°"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid measures 6 cm by 4 cm by 2 cm. What is its volume?", "options": {"A": "12 cm³", "B": "88 cm²", "C": "48 cm³", "D": "48 cm²"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cafe sells coffee at $28 a cup and tea at $19 a cup. On Monday it sells 15 coffees and 8 teas. How much money does it take in altogether?", "options": {"A": "$572", "B": "$420", "C": "$552", "D": "$1081"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this number sequence, which follows two alternating rules: 4, 12, 7, 21, 16, 48, ___ . What number comes next?", "options": {"A": "43", "B": "53", "C": "144", "D": "24"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A market stall sells mangoes at 3 for $14. A customer wants to buy 9 mangoes, but the stall gives a $4 discount on the whole purchase for any order of 9 or more. How much does the customer pay for 9 mangoes?", "options": {"A": "$42", "B": "$38", "C": "$46", "D": "$10"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word does NOT belong with the others? Whisper, Shout, Mutter, Murmur.", "options": {"A": "Shout", "B": "Whisper", "C": "Mutter", "D": "Murmur"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A ferry leaves the pier at 13:40 and the crossing takes 55 minutes. There is then a 20-minute wait before a connecting tram that takes 35 minutes. At what time does the passenger reach the fina =\"color:#555\">下面哪一句把「候鸟被我们的脚步声吓得飞走了」改成主动句最正确？</span>", "options": {"A": "我們的腳步聲把候鳥嚇得飛走了。<br><span style=\"color:#555\">我们的脚步声把候鸟吓得飞走了。</span>", "B": "候鳥把我們的腳步聲嚇得飛走了。<br><span style=\"color:#555\">候鸟把我们的脚步声吓得飞走了。</span>", "C": "我們的腳步聲被候鳥嚇得飛走了。<br><span style=\"color:#555\">我们的脚步声被候鸟吓得飞走了。</span>", "D": "候鳥的腳步聲把我們嚇得飛走了。<br><span style=\"color:#555\">候鸟的脚步声把我们吓得飞走了。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "「夕陽西下，時候不早了，我們（　）要離開濕地公園了。」橫線上填哪個詞語最連貫？<br><span style=\"color:#555\">「夕阳西下，时候不早了，我们（　）要离开湿地公园了。」横线上填哪个词语最连贯？</span>", "options": {"A": "反而", "B": "竟然", "C": "終於<br><span style=\"color:#555\">终于</span>", "D": "難道<br><span style=\"color:#555\">难道</span>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
