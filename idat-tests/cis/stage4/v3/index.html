<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 4 (V3)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmXlzvpnHvxI5ILdACyHHZv8HWfNQ08pCP27GmmluJ7lUGiou1izR4e7Gs8LxKLtgo/exec";
const SCHOOL = "CIS", STAGE = "4", VERSION = "3";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the option that correctly fills the blank. When the players arrived, the coach handed the new jerseys to ___ before the match.", "options": {"A": "them", "B": "they", "C": "their", "D": "theirs"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word famished in the sentence below? After hiking all day without lunch, the children were famished by the time they reached camp.", "options": {"A": "exhausted", "B": "weak", "C": "thirsty", "D": "extremely hungry"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the sentence that uses apostrophes correctly. In every option the dogs belong to several owners and there is more than one dog.", "options": {"A": "The dog's tails wagged when their owners returned.", "B": "The dogs tails wagged when their owners returned.", "C": "The dogs' tails wagged when their owners returned.", "D": "The dogs's tails wagged when their owners returned."}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word detailed? The instructions were so detailed that even a beginner could follow them with ease.", "options": {"A": "boring", "B": "thorough", "C": "brief", "D": "confusing"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly. Neither the teacher nor the students ___ ready for the sudden fire drill.", "options": {"A": "were", "B": "was", "C": "wasn't", "D": "weren't"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Rewrite in the passive voice: 'The teacher will mark the essays next week.'", "options": {"A": "The essays will mark next week by the teacher.", "B": "The essays are marked next week by the teacher.", "C": "The teacher will be marked the essays next week.", "D": "The essays will be marked next week by the teacher."}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Which word is the OPPOSITE in meaning to the word scarce in the sentence below? Fresh water became scarce during the long drought.", "options": {"A": "sufficient", "B": "limited", "C": "abundant", "D": "expensive"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Choose the conjunction that best completes the sentence. She wanted to join the debate team, ___ she was nervous about speaking in public.", "options": {"A": "so", "B": "but", "C": "because", "D": "for"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "You are writing a formal email to your school principal. Which sentence uses the most appropriate, polite modal for the request?", "options": {"A": "Could you please consider extending the deadline?", "B": "I want you to extend the deadline.", "C": "You must extend the deadline.", "D": "Can't you just extend the deadline?"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "Which spelling correctly forms the word meaning 'not able to be read', built from 'legible'?", "options": {"A": "inlegible", "B": "unlegible", "C": "dislegible", "D": "illegible"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly. My brother is studying to become ___ engineer at ___ university in Scotland.", "options": {"A": "a / a", "B": "an / a", "C": "an / an", "D": "a / an"}, "fig": "", "passage": null, "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "A writer wants to describe a leader in a POSITIVE way, suggesting firmness without rudeness. Which word best fits? The new captain was known for being ___.", "options": {"A": "bossy", "B": "domineering", "C": "assertive", "D": "pushy"}, "fig": "", "passage": null, "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Which word would appear THIRD if the following words were placed in alphabetical (dictionary) order? generous, gentle, general, genuine", "options": {"A": "generous", "B": "general", "C": "gentle", "D": "genuine"}, "fig": "", "passage": null, "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "Choose the pair that best completes the analogy. Fragile is to sturdy as generous is to ___.", "options": {"A": "kind", "B": "wealthy", "C": "helpful", "D": "stingy"}, "fig": "", "passage": null, "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "What does the idiom in bold most likely mean? When Maya finally admitted she had broken the vase, she decided to face the music and tell her parents the truth.", "options": {"A": "to enjoy a concert", "B": "to accept the unpleasant consequences of one's actions", "C": "to pay close attention before acting", "D": "to avoid taking responsibility"}, "fig": "", "passage": null, "qnum": 15}, {"n": 17, "type": "mcq", "section": "English", "stem": "Which statement best expresses the writer's own opinion?", "options": {"A": "Teenagers are lazy and should simply go to bed earlier.", "B": "Schools should keep their current start times to avoid disruption.", "C": "Secondary schools should begin the school day at least an hour later.", "D": "Parents, not schools, should decide when lessons begin."}, "fig": "", "passage": "<strong>Should Schools Start Later?</strong><br>Every weekday, millions of teenagers drag themselves out of bed before sunrise, half-asleep and barely able to think. I believe this is a mistake, and that secondary schools should push their start times back by at least an hour.<br><br>The strongest reason is biology. Scientists have shown that during the teenage years, the body&#x27;s internal clock naturally shifts later. Most teenagers simply cannot fall asleep early, no matter how hard they try. Forcing them to wake at six in the morning is like asking an adult to start work at four. The result is a generation of students who are present in body but absent in mind.<br><br>Some people argue that later starts would cause chaos. Parents would struggle to drop children off before work, they say, and sports practices would run into the evening. These are fair concerns, and I do not dismiss them. Yet schools in several countries have already shifted their timetables successfully, proving that careful planning can solve such problems.<br><br>The benefits are too great to ignore. In trials where start times were delayed, students reported better moods, missed fewer lessons, and even achieved higher grades. A well-rested student learns more in one focused hour than a tired one learns in three.<br><br>Changing a timetable is never simple, and I understand why some head teachers hesitate. But if we truly want young people to succeed, we must listen to the science rather than cling to tradition. Our schools should wake up to the evidence.", "qnum": 16}, {"n": 18, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word cling as it is used in the final paragraph (cling to tradition)?", "options": {"A": "hold on tightly", "B": "return suddenly", "C": "object loudly", "D": "explain carefully"}, "fig": "", "passage": "<strong>Should Schools Start Later?</strong><br>Every weekday, millions of teenagers drag themselves out of bed before sunrise, half-asleep and barely able to think. I believe this is a mistake, and that secondary schools should push their start times back by at least an hour.<br><br>The strongest reason is biology. Scientists have shown that during the teenage years, the body&#x27;s internal clock naturally shifts later. Most teenagers simply cannot fall asleep early, no matter how hard they try. Forcing them to wake at six in the morning is like asking an adult to start work at four. The result is a generation of students who are present in body but absent in mind.<br><br>Some people argue that later starts would cause chaos. Parents would struggle to drop children off before work, they say, and sports practices would run into the evening. These are fair concerns, and I do not dismiss them. Yet schools in several countries have already shifted their timetables successfully, proving that careful planning can solve such problems.<br><br>The benefits are too great to ignore. In trials where start times were delayed, students reported better moods, missed fewer lessons, and even achieved higher grades. A well-rested student learns more in one focused hour than a tired one learns in three.<br><br>Changing a timetable is never simple, and I understand why some head teachers hesitate. But if we truly want young people to succeed, we must listen to the science rather than cling to tradition. Our schools should wake up to the evidence.", "qnum": 17}, {"n": 19, "type": "mcq", "section": "English", "stem": "Which concern do opponents of later start times raise, according to the passage?", "options": {"A": "Teenagers would stay up even later at night.", "B": "Students would learn less in the afternoon.", "C": "Schools in other countries have already failed to change.", "D": "Parents would find it harder to drop children off before work."}, "fig": "", "passage": "<strong>Should Schools Start Later?</strong><br>Every weekday, millions of teenagers drag themselves out of bed before sunrise, half-asleep and barely able to think. I believe this is a mistake, and that secondary schools should push their start times back by at least an hour.<br><br>The strongest reason is biology. Scientists have shown that during the teenage years, the body&#x27;s internal clock naturally shifts later. Most teenagers simply cannot fall asleep early, no matter how hard they try. Forcing them to wake at six in the morning is like asking an adult to start work at four. The result is a generation of students who are present in body but absent in mind.<br><br>Some people argue that later starts would cause chaos. Parents would struggle to drop children off before work, they say, and sports practices would run into the evening. These are fair concerns, and I do not dismiss them. Yet schools in several countries have already shifted their timetables successfully, proving that careful planning can solve such problems.<br><br>The benefits are too great to ignore. In trials where start times were delayed, students reported better moods, missed fewer lessons, and even achieved higher grades. A well-rested student learns more in one focused hour than a tired one learns in three.<br><br>Changing a timetable is never simple, and I understand why some head teachers hesitate. But if we truly want young people to succeed, we must listen to the science rather than cling to tradition. Our schools should wake up to the evidence.", "qnum": 18}, {"n": 20, "type": "mcq", "section": "English", "stem": "How does the writer respond to the concerns raised by opponents?", "options": {"A": "The writer ignores the concerns and changes the subject.", "B": "The writer admits the concerns are fair but argues that careful planning can solve them.", "C": "The writer agrees the concerns make later starts impossible.", "D": "The writer claims the concerns were invented by lazy students."}, "fig": "", "passage": "<strong>Should Schools Start Later?</strong><br>Every weekday, millions of teenagers drag themselves out of bed before sunrise, half-asleep and barely able to think. I believe this is a mistake, and that secondary schools should push their start times back by at least an hour.<br><br>The strongest reason is biology. Scientists have shown that during the teenage years, the body&#x27;s internal clock naturally shifts later. Most teenagers simply cannot fall asleep early, no matter how hard they try. Forcing them to wake at six in the morning is like asking an adult to start work at four. The result is a generation of students who are present in body but absent in mind.<br><br>Some people argue that later starts would cause chaos. Parents would struggle to drop children off before work, they say, and sports practices would run into the evening. These are fair concerns, and I do not dismiss them. Yet schools in several countries have already shifted their timetables successfully, proving that careful planning can solve such problems.<br><br>The benefits are too great to ignore. In trials where start times were delayed, students reported better moods, missed fewer lessons, and even achieved higher grades. A well-rested student learns more in one focused hour than a tired one learns in three.<br><br>Changing a timetable is never simple, and I understand why some head teachers hesitate. But if we truly want young people to succeed, we must listen to the science rather than cling to tradition. Our schools should wake up to the evidence.", "qnum": 19}, {"n": 21, "type": "mcq", "section": "English", "stem": "Which statement best summarises the main argument of the whole passage?", "options": {"A": "Teenagers need more exercise to sleep well at night.", "B": "Changing a school timetable is impossible without government help.", "C": "Because teenagers' biology makes early waking harmful, schools should start later despite the practical difficulties.", "D": "The writer's main point is that students get better grades, so homework should be reduced."}, "fig": "", "passage": "<strong>Should Schools Start Later?</strong><br>Every weekday, millions of teenagers drag themselves out of bed before sunrise, half-asleep and barely able to think. I believe this is a mistake, and that secondary schools should push their start times back by at least an hour.<br><br>The strongest reason is biology. Scientists have shown that during the teenage years, the body&#x27;s internal clock naturally shifts later. Most teenagers simply cannot fall asleep early, no matter how hard they try. Forcing them to wake at six in the morning is like asking an adult to start work at four. The result is a generation of students who are present in body but absent in mind.<br><br>Some people argue that later starts would cause chaos. Parents would struggle to drop children off before work, they say, and sports practices would run into the evening. These are fair concerns, and I do not dismiss them. Yet schools in several countries have already shifted their timetables successfully, proving that careful planning can solve such problems.<br><br>The benefits are too great to ignore. In trials where start times were delayed, students reported better moods, missed fewer lessons, and even achieved higher grades. A well-rested student learns more in one focused hour than a tired one learns in three.<br><br>Changing a timetable is never simple, and I understand why some head teachers hesitate. But if we truly want young people to succeed, we must listen to the science rather than cling to tradition. Our schools should wake up to the evidence.", "qnum": 20}, {"n": 22, "type": "writing", "section": "English Writing", "intro": "Everyone has a place where they feel completely at ease.", "label": "", "body": "Describe a place that is special to you and explain why it matters. Include what the place looks, sounds, and feels like, and describe how you feel when you are there.", "hint": "Write at least 7-8 sentences.", "placeholder": "Type your response here…", "partA": "Describe a place that is special to you and explain why it matters. Include what the place looks, sounds, and feels like, and describe how you feel when you are there.", "partB": ""}, {"n": 23, "type": "info", "title": "English Listening &amp; Speaking", "body": "<div class='info-body'>In the real test this section is delivered by an on-screen avatar: you listen and then speak your answers aloud into the microphone. There is nothing to type or record here, the sample questions below show the kind of thing you'll be asked, so you can practise out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Introduce yourself and tell me about your interests outside school.</li><li style='margin:7px 0'>Describe a challenge you faced and how you dealt with it.</li><li style='margin:7px 0'>What does being a good friend mean to you?</li><li style='margin:7px 0'>Talk about a place you would like to visit and explain why.</li><li style='margin:7px 0'>Listen to a short talk, then summarise the main points.</li></ul>"}, {"n": 24, "type": "info", "title": "Mathematics, Logic &amp; Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": 25, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which expression is equal to \"7 less than the product of 5 and a number n\"?", "options": {"A": "5n − 7", "B": "7 − 5n", "C": "5(n − 7)", "D": "7n − 5"}, "fig": "", "passage": null, "qnum": 21}, {"n": 26, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify: 8a − 3b + 2a + 5b.", "options": {"A": "6a + 2b", "B": "10a + 8b", "C": "10a + 2b", "D": "6a − 8b"}, "fig": "", "passage": null, "qnum": 22}, {"n": 27, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Order from least to greatest: −5, 3, −12, 0, −1.", "options": {"A": "−1, −5, −12, 0, 3", "B": "−12, −5, −1, 0, 3", "C": "0, −1, −5, −12, 3", "D": "−12, −5, 0, −1, 3"}, "fig": "", "passage": null, "qnum": 23}, {"n": 28, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A prize of $240 is shared between two students in the ratio 5 : 3. How much does the student with the larger share receive?", "options": {"A": "$120", "B": "$90", "C": "$150", "D": "$96"}, "fig": "", "passage": null, "qnum": 24}, {"n": 29, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "At dawn the temperature was −3°C. By midday it had risen 8°C, and by night it had fallen 6°C from its midday value. What was the temperature at night?", "options": {"A": "−5°C", "B": "1°C", "C": "11°C", "D": "−1°C"}, "fig": "", "passage": null, "qnum": 25}, {"n": 30, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which decimal is equal to 3/8?", "options": {"A": "0.375", "B": "0.38", "C": "2.667", "D": "0.83"}, "fig": "", "passage": null, "qnum": 26}, {"n": 31, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Compute: 2/3 + 1/6.", "options": {"A": "3/9", "B": "1/3", "C": "3/6", "D": "5/6"}, "fig": "", "passage": null, "qnum": 27}, {"n": 32, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Compute: 1.28 ÷ 0.4.", "options": {"A": "0.32", "B": "32", "C": "0.512", "D": "3.2"}, "fig": "", "passage": null, "qnum": 28}, {"n": 33, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Compute: −6.65 − 5.48.", "options": {"A": "−1.17", "B": "12.13", "C": "−12.13", "D": "−11.13"}, "fig": "", "passage": null, "qnum": 29}, {"n": 34, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The perimeter of a triangle with sides 9 cm, 12 cm and 7 cm is:", "options": {"A": "28 cm", "B": "378 cm", "C": "54 cm", "D": "21 cm"}, "fig": "", "passage": null, "qnum": 30}, {"n": 35, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The area of a triangle with base 10 cm and height 6 cm is:", "options": {"A": "16 cm²", "B": "60 cm²", "C": "30 cm²", "D": "32 cm²"}, "fig": "", "passage": null, "qnum": 31}, {"n": 36, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In triangle ABC, two angles are 35° and 80°. Find the third angle.", "options": {"A": "55°", "B": "65°", "C": "115°", "D": "45°"}, ll, "qnum": 40}, {"n": 45, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Study the relationship in the first pair of shapes in the figure, then choose the shape that completes the second pair in the same way. A small square is to a large square as a small triangle is to ___ ?", "options": {"A": "A large triangle", "B": "A small triangle", "C": "A large square", "D": "A small circle"}, "fig": "<svg viewBox=\"0 0 380 210\" width=\"380\" height=\"210\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"380\" height=\"210\" fill=\"#ffffff\"/><rect x=\"33.7\" y=\"33.7\" width=\"24.6\" height=\"24.6\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"84\" y=\"52\" font-size=\"20\" text-anchor=\"middle\">&#8594;</text><rect x=\"103.2\" y=\"27.2\" width=\"37.5\" height=\"37.5\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"170\" y=\"52\" font-size=\"18\" text-anchor=\"middle\">::</text><polygon points=\"218.0,29.6 232.2,54.2 203.8,54.2\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"256\" y=\"52\" font-size=\"20\" text-anchor=\"middle\">&#8594;</text><text x=\"288\" y=\"54\" font-size=\"22\" fill=\"#c0392b\" text-anchor=\"middle\">?</text><line x1=\"6\" y1=\"92\" x2=\"374\" y2=\"92\" stroke=\"#e6ebf2\"/><text x=\"6\" y=\"112\" font-size=\"12\" fill=\"#5b6b7a\">Options</text><polygon points=\"42.0,127.0 63.7,164.5 20.3,164.5\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"42.0\" y=\"192\" font-size=\"13\" text-anchor=\"middle\">A</text><polygon points=\"126.0,135.6 140.2,160.2 111.8,160.2\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"126.0\" y=\"192\" font-size=\"13\" text-anchor=\"middle\">B</text><rect x=\"191.2\" y=\"133.2\" width=\"37.5\" height=\"37.5\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"210.0\" y=\"192\" font-size=\"13\" text-anchor=\"middle\">C</text><circle cx=\"294.0\" cy=\"152\" r=\"16.4\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"294.0\" y=\"192\" font-size=\"13\" text-anchor=\"middle\">D</text></svg>", "passage": null, "qnum": 41}, {"n": 46, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"We must replace the school library's printed encyclopaedias with online versions, because the printed sets are now three years out of date.\"\n\nPROPOSED ASSUMPTION: The online encyclopaedias contain more up-to-date information than the printed sets currently in the library.\n\nUsing only the information in the statement, is this assumption logical, YES or NO?", "options": {"A": "Yes", "B": "No", "C": "", "D": ""}, "fig": "", "passage": null, "qnum": 42}, {"n": 47, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every student who completed the optional weekend coding club passed the end-of-term programming test. Maya did not attend the coding club.\"\n\nWhich one of the following MUST be true on the basis of the statement alone?", "options": {"A": "Maya failed the end-of-term programming test.", "B": "Every student who passed the programming test had attended the coding club.", "C": "The statement does not tell us whether Maya passed or failed the programming test.", "D": "Maya passed the programming test even though she did not attend the club."}, "fig": "", "passage": null, "qnum": 43}, {"n": 48, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"In a survey of 600 Year 8 students, 480 said they own a bicycle. Of those 480, exactly half said they ride it to school at least once a week.\"\n\nConclusions:\n(1) More than half of the surveyed students own a bicycle.\n(2) 240 of the surveyed students ride a bicycle to school at least once a week.\n(3) Most students who own a bicycle ride it to school every day.\n\nWhich conclusions FOLLOW from the statement (using only the given information)?", "options": {"A": "Conclusion 1 only.", "B": "Conclusions 1 and 2 only.", "C": "Conclusions 1, 2 and 3.", "D": "Conclusion 3 only."}, "fig": "", "passage": null, "qnum": 44}, {"n": 49, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT (treat all three facts as true):\n- Every member of the school chess team is in Year 9.\n- No Year 9 student is enrolled in the Mandarin beginners' class.\n- Tom is enrolled in the Mandarin beginners' class.\n\nWhich one of the following conclusions does NOT follow from these facts?", "options": {"A": "Tom is not in Year 9.", "B": "Tom is not a member of the school chess team.", "C": "No member of the school chess team is enrolled in the Mandarin beginners' class.", "D": "The school chess team has fewer members than the Mandarin beginners' class."}, "fig": "", "passage": null, "qnum": 45}, {"n": 50, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: Should the city require all new public buildings to install rooftop solar panels?\n\nThree arguments are offered below.\nWhich one is the STRONGEST?", "options": {"A": "No, solar panels look unattractive on top of buildings, and many residents would simply dislike the way they change the skyline.", "B": "No, my uncle installed solar panels on his house once and he told me they were more trouble than they were worth.", "C": "Yes, a five-year city study found that buildings with rooftop solar reduced their grid electricity use by an average of 38%, cutting both costs and emissions measurably.", "D": ""}, "fig": "", "passage": null, "qnum": 46}, {"n": 51, "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 簡体.)"}, {"n": 52, "type": "mcq", "section": "Chinese", "stem": "外婆走路「不疾不徐」，這四個字最能表現她怎樣的性情？ <br><span style=\"color:#555\">外婆走路「不疾不徐」，这四个字最能表现她怎样的性情？</span>", "options": {"A": "急躁好勝，事事爭先<br><span style=\"color:#555\">急躁好胜，事事争先</span>", "B": "從容不迫，安然自得<br><span style=\"color:#555\">从容不迫，安然自得</span>", "C": "膽小怯懦，畏首畏尾<br><span style=\"color:#555\">胆小怯懦，畏首畏尾</span>", "D": "懶散拖延，不肯出力<br><span style=\"color:#555\">懒散拖延，不肯出力</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>　　星期六清晨，天還未亮透，外婆便挑著一擔新摘的青菜往市集去。露水沾濕了她的褲腳，她卻走得不疾不徐，臉上始終掛著淡淡的笑意。我提著小竹籃跟在後頭，一路上聽她和相熟的菜販打招呼，言談之間十分親切。到了攤位，外婆並不急著叫賣，而是先把每一把菜整理得齊齊整整，再用稻草輕輕綁好。有人嫌她的菜比別家貴幾毛錢，她也不爭辯，只是笑著說：「一分耕耘，一分收穫，我的菜是自己一鋤一鋤種出來的。」那天太陽升得老高，籃裏的菜竟所剩無幾。回家路上，外婆把賣菜換來的零錢一一數給我看，眼裏的光，比晨曦還要溫暖。</div><div><em>簡体</em><br>　　星期六清晨，天还未亮透，外婆便挑着一担新摘的青菜往市集去。露水沾湿了她的裤脚，她却走得不疾不徐，脸上始终挂着淡淡的笑意。我提着小竹篮跟在后头，一路上听她和相熟的菜贩打招呼，言谈之间十分亲切。到了摊位，外婆并不急着叫卖，而是先把每一把菜整理得齐齐整整，再用稻草轻轻绑好。有人嫌她的菜比别家贵几毛钱，她也不争辩，只是笑着说：「一分耕耘，一分收获，我的菜是自己一锄一锄种出来的。」那天太阳升得老高，篮里的菜竟所剩无几。回家路上，外婆把卖菜换来的零钱一一数给我看，眼里的光，比晨曦还要温暖。</div>", "qnum": 47}, {"n": 53, "type": "mcq", "section": "Chinese", "stem": "有人嫌外婆的菜貴，外婆「不爭辯」，這反映她── <br><span style=\"color:#555\">有人嫌外婆的菜贵，外婆「不争辩」，这反映她──</span>", "options": {"A": "對自己的勞動成果有信心，不必爭辯<br><span style=\"color:#555\">对自己的劳动成果有信心，不必争辩</span>", "B": "理虧心虛，不敢回應顧客<br><span style=\"color:#555\">理亏心虚，不敢回应顾客</span>", "C": "聽不懂顧客在說甚麼<br><span style=\"color:#555\">听不懂顾客在说什么</span>", "D": "脾氣暴躁，懶得理會別人<br><span style=\"color:#555\">脾气暴躁，懒得理会别人</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>　　星期六清晨，天還未亮透，外婆便挑著一擔新摘的青菜往市集去。露水沾濕了她的褲腳，她卻走得不疾不徐，臉上始終掛著淡淡的笑意。我提著小竹籃跟在後頭，一路上聽她和相熟的菜販打招呼，言談之間十分親切。到了攤位，外婆並不急著叫賣，而是先把每一把菜整理得齊齊整整，再用稻草輕輕綁好。有人嫌她的菜比別家貴幾毛錢，她也不爭辯，只是笑著說：「一分耕耘，一分收穫，我的菜是自己一鋤一鋤種出來的。」那天太陽升得老高，籃裏的菜竟所剩無幾。回家路上，外婆把賣菜換來的零錢一一數給我看，眼裏的光，比晨曦還要溫暖。</div><div><em>簡体</em><br>　　星期六清晨，天还未亮透，外婆便挑着一担新摘的青菜往市集去。露水沾湿了她的裤脚，她却走得不疾不徐，脸上始终挂着淡淡的笑意。我提着小竹篮跟在后头，一路上听她和相熟的菜贩打招呼，言谈之间十分亲切。到了摊位，外婆并不急着叫卖，而是先把每一把菜整理得齐齐整整，再用稻草轻轻绑好。有人嫌她的菜比别家贵几毛钱，她也不争辩，只是笑着说：「一分耕耘，一分收获，我的菜是自己一锄一锄种出来的。」那天太阳升得老高，篮里的菜竟所剩无几。回家路上，外婆把卖菜换来的零钱一一数给我看，眼里的光，比晨曦还要温暖。</div>", "qnum": 48}, {"n": 54, "type": "mcq", "section": "Chinese", "stem": "文中「籃裏的菜竟所剩無幾」一句，最主要說明甚麼？ <br><span style=\"color:#555\">文中「篮里的菜竟所剩无几」一句，最主要说明什么？</span>", "options": {"A": "外婆 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 (V3)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
