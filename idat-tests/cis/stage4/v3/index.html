<title>IDAT CIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCHOOL = "CIS", STAGE = "4", VERSION = "3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which word has a POSITIVE connotation when describing a person who speaks very little?", "options": {"A": "reserved", "B": "secretive", "C": "withdrawn", "D": "evasive"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly: 'One of the museum guides ___ the visitors through the ancient gallery every hour.'", "options": {"A": "lead", "B": "leads", "C": "are leading", "D": "have led"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which prefix added to 'obedient' correctly reverses its meaning to 'not obedient'?", "options": {"A": "un-", "B": "im-", "C": "dis-", "D": "mis-"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "In which sentence is the underlined word used with a NEGATIVE connotation?", "options": {"A": "The veteran teacher was admired for being <u>shrewd</u> about her students' needs.", "B": "Her <u>shrewd</u> reading of the market earned the company a fortune.", "C": "The landlord was a <u>shrewd</u> man who twisted every contract to his own advantage.", "D": "A <u>shrewd</u> investor, she spotted the opportunity before anyone else."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "What is the meaning of the word 'monotonous' in the sentence below? 'The factory job was so monotonous that Daniel could do it without thinking.'", "options": {"A": "dangerous and unpredictable", "B": "highly rewarding", "C": "physically exhausting", "D": "dull because it never changes"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Choose the correct relative pronoun: 'The stadium ___ the championship was held has since been demolished.'", "options": {"A": "where", "B": "which", "C": "who", "D": "whose"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which word is CLOSEST in meaning to 'elated' in the sentence below? 'When the results were posted, the whole team was absolutely elated.'", "options": {"A": "overjoyed", "B": "relieved", "C": "surprised", "D": "nervous"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which option is a COMPLETE sentence?", "options": {"A": "Whispering nervously behind the heavy velvet curtain before the show.", "B": "Although the engineers had checked every cable on the bridge twice.", "C": "The young pianist forgot the opening notes of her piece.", "D": "Who had travelled from three different countries to attend the conference."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "What does 'meticulous' mean in the sentence below? 'The architect was meticulous, checking every measurement on the plans three times.'", "options": {"A": "slow and unsure", "B": "famous and respected", "C": "easily distracted", "D": "extremely careful about detail"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the correct PASSIVE form of: 'The volunteers planted hundreds of trees last weekend.'", "options": {"A": "Hundreds of trees were planting by the volunteers last weekend.", "B": "Hundreds of trees were planted by the volunteers last weekend.", "C": "Hundreds of trees are planted by the volunteers last weekend.", "D": "Hundreds of trees had been planting by the volunteers last weekend."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is the meaning of 'thrive' in the sentence below? 'With plenty of sunlight and water, the seedlings began to thrive on the balcony.'", "options": {"A": "grow strongly and flourish", "B": "wither and die", "C": "stay exactly the same", "D": "spread out of control"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "In the sentence below, what does the pronoun 'they' refer to? 'The scientists labelled the samples carefully so that they would not be confused during the experiment.'", "options": {"A": "the scientists", "B": "the samples", "C": "the labels", "D": "the experiment"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly: '___ a second language takes years of steady practice.'", "options": {"A": "To learning", "B": "Learn", "C": "Learning", "D": "Learned"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "What does 'vast' suggest about the desert in the sentence below? 'For three days they drove across the vast desert without seeing a single town.'", "options": {"A": "extremely large in size", "B": "cold and windy", "C": "crowded with people", "D": "rich in minerals"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which sentence uses the comma with a coordinating conjunction (FANBOYS) correctly?", "options": {"A": "The lights flickered twice and then the whole room went dark.", "B": "The lights flickered twice, and then the whole room went dark.", "C": "The lights flickered twice, and, then the whole room went dark.", "D": "The lights flickered twice and, then the whole room went dark."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled adverb to complete the sentence: 'The climbers moved ___ across the narrow ledge.'", "options": {"A": "cautious", "B": "cautiousy", "C": "cautiousely", "D": "cautiously"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Choose the correct verb form: 'By the time the doctor saw the X-ray, the bone ___ in the wrong position.'", "options": {"A": "sets", "B": "had already set", "C": "will set", "D": "is setting"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which word is CLOSEST in meaning to 'baffle' in the sentence below? 'The strange symbols on the ancient tablet continued to baffle the experts.'", "options": {"A": "amuse", "B": "annoy", "C": "convince", "D": "puzzle"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Choose the correct article to complete the sentence: 'It took the team nearly ___ hour to set up the telescope on the hilltop.'", "options": {"A": "a", "B": "the", "C": "some", "D": "an"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "What does 'fragile' mean in the sentence below? 'The fragile vase had to be wrapped in thick foam before the move.'", "options": {"A": "valuable and rare", "B": "easily broken or damaged", "C": "heavy and solid", "D": "old and dusty"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Choose the correct ACTIVE form of: 'The lost dog was found by a kind stranger near the harbour.'", "options": {"A": "A kind stranger found the lost dog near the harbour.", "B": "A kind stranger finds the lost dog near the harbour.", "C": "A kind stranger has found the lost dog near the harbour.", "D": "A kind stranger was found the lost dog near the harbour."}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Which word would a writer choose to describe a crowd in a NEUTRAL way, without praising or criticising?", "options": {"A": "mob", "B": "rabble", "C": "gathering", "D": "horde"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "In the sentence below, which labelled section contains an error? 'Either the coach (A) or the players (B) is responsible (C) for tidying the equipment room (D).'", "options": {"A": "(A)", "B": "(B)", "C": "(C)", "D": "(D)"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "What is the meaning of the underlined idiom in the sentence below? 'When Priya was asked to lead the project, she decided to <u>bite the bullet</u> and accept the challenge.'", "options": {"A": "react with anger", "B": "refuse to take part", "C": "make a careless mistake", "D": "face something difficult bravely"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "What does the word 'despair' mean as it is used in the second paragraph?", "options": {"A": "a feeling of complete hopelessness", "B": "sudden anger", "C": "mild disappointment", "D": "physical pain"}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, rainless summer, a thirsty crow flew for miles over cracked fields in search of water. Her throat was dry and her wings ached. At last, in a forgotten garden, she spotted a tall clay pitcher and swooped down with a cry of hope.\n\nBut when she pushed her beak inside, her joy turned to despair. The water lay far down at the bottom, well below the reach of her beak. She stretched and strained, tipping her head this way and that, yet the cool water stayed out of reach. A weaker bird might have given up and flown away to die of thirst.\n\nThe crow, however, was no ordinary bird. She perched on the rim and studied the pitcher. Nearby lay a scattering of small pebbles, baked pale by the sun. An idea took shape in her clever mind. One by one, she dropped a pebble into the pitcher. Each stone sank with a quiet plink, and each time the water crept a little higher.\n\nIt was slow, patient work, and the sun beat down without mercy. Still the crow did not stop. Pebble after pebble she gathered, never pausing to rest, until the water rose to the very lip of the pitcher. She dipped her beak and drank deeply, her strength returning with every cool swallow.\n\nAs she flew home against the orange evening sky, the crow understood something she would never forget: that brute strength is no match for a thinking mind, and that even the largest problem will yield to small, steady efforts repeated without surrender.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "How does the crow finally manage to reach the water?", "options": {"A": "She tips the pitcher over until it spills.", "B": "She waits for rain to fill the pitcher higher.", "C": "She breaks the pitcher with a heavy stone.", "D": "She drops pebbles into the pitcher to raise the water level."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, rainless summer, a thirsty crow flew for miles over cracked fields in search of water. Her throat was dry and her wings ached. At last, in a forgotten garden, she spotted a tall clay pitcher and swooped down with a cry of hope.\n\nBut when she pushed her beak inside, her joy turned to despair. The water lay far down at the bottom, well below the reach of her beak. She stretched and strained, tipping her head this way and that, yet the cool water stayed out of reach. A weaker bird might have given up and flown away to die of thirst.\n\nThe crow, however, was no ordinary bird. She perched on the rim and studied the pitcher. Nearby lay a scattering of small pebbles, baked pale by the sun. An idea took shape in her clever mind. One by one, she dropped a pebble into the pitcher. Each stone sank with a quiet plink, and each time the water crept a little higher.\n\nIt was slow, patient work, and the sun beat down without mercy. Still the crow did not stop. Pebble after pebble she gathered, never pausing to rest, until the water rose to the very lip of the pitcher. She dipped her beak and drank deeply, her strength returning with every cool swallow.\n\nAs she flew home against the orange evening sky, the crow understood something she would never forget: that brute strength is no match for a thinking mind, and that even the largest problem will yield to small, steady efforts repeated without surrender.", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "What can we infer about the crow's character from her actions?", "options": {"A": "She is lucky rather than clever.", "B": "She is resourceful and patient.", "C": "She is fearful and easily discouraged.", "D": "She is greedy and selfish."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, rainless summer, a thirsty crow flew for miles over cracked fields in search of water. Her throat was dry and her wings ached. At last, in a forgotten garden, she spotted a tall clay pitcher and swooped down with a cry of hope.\n\nBut when she pushed her beak inside, her joy turned to despair. The water lay far down at the bottom, well below the reach of her beak. She stretched and strained, tipping her head this way and that, yet the cool water stayed out of reach. A weaker bird might have given up and flown away to die of thirst.\n\nThe crow, however, was no ordinary bird. She perched on the rim and studied the pitcher. Nearby lay a scattering of small pebbles, baked pale by the sun. An idea took shape in her clever mind. One by one, she dropped a pebble into the pitcher. Each stone sank with a quiet plink, and each time the water crept a little higher.\n\nIt was slow, patient work, and the sun beat down without mercy. Still the crow did not stop. Pebble after pebble she gathered, never pausing to rest, until the water rose to the very lip of the pitcher. She dipped her beak and drank deeply, her strength returning with every cool swallow.\n\nAs she flew home against the orange evening sky, the crow understood something she would never forget: that brute strength is no match for a thinking mind, and that even the largest problem will yield to small, steady efforts repeated without surrender.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "Which statement best expresses the THEME of the fable?", "options": {"A": "Always carry water on a hot day.", "B": "Birds are smarter than people think.", "C": "Steady effort and clever thinking can overcome big problems.", "D": "It is dangerous to fly long distances in summer."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, rainless summer, a thirsty crow flew for miles over cracked fields in search of water. Her throat was dry and her wings ached. At last, in a forgotten garden, she spotted a tall clay pitcher and swooped down with a cry of hope.\n\nBut when she pushed her beak inside, her joy turned to despair. The water lay far down at the bottom, well below the reach of her beak. She stretched and strained, tipping her head this way and that, yet the cool water stayed out of reach. A weaker bird might have given up and flown away to die of thirst.\n\nThe crow, however, was no ordinary bird. She perched on the rim and studied the pitcher. Nearby lay a scattering of small pebbles, baked pale by the sun. An idea took shape in her clever mind. One by one, she dropped a pebble into the pitcher. Each stone sank with a quiet plink, and each time the water crept a little higher.\n\nIt was slow, patient work, and the sun beat down without mercy. Still the crow did not stop. Pebble after pebble she gathered, never pausing to rest, until the water rose to the very lip of the pitcher. She dipped her beak and drank deeply, her strength returning with every cool swallow.\n\nAs she flew home against the orange evening sky, the crow understood something she would never forget: that brute strength is no match for a thinking mind, and that even the largest problem will yield to small, steady efforts repeated without surrender.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "Why does the author most likely describe the sun beating down 'without mercy' while the crow keeps working?", "options": {"A": "to explain why the garden was forgotten", "B": "to emphasise the crow's determination by contrasting it with harsh conditions", "C": "to suggest the crow should have flown away", "D": "to prove that summers are getting hotter"}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of a long, rainless summer, a thirsty crow flew for miles over cracked fields in search of water. Her throat was dry and her wings ached. At last, in a forgotten garden, she spotted a tall clay pitcher and swooped down with a cry of hope.\n\nBut when she pushed her beak inside, her joy turned to despair. The water lay far down at the bottom, well below the reach of her beak. She stretched and strained, tipping her head this way and that, yet the cool water stayed out of reach. A weaker bird might have given up and flown away to die of thirst.\n\nThe crow, however, was no ordinary bird. She perched on the rim and studied the pitcher. Nearby lay a scattering of small pebbles, baked pale by the sun. An idea took shape in her clever mind. One by one, she dropped a pebble into the pitcher. Each stone sank with a quiet plink, and each time the water crept a little higher.\n\nIt was slow, patient work, and the sun beat down without mercy. Still the crow did not stop. Pebble after pebble she gathered, never pausing to rest, until the water rose to the very lip of the pitcher. She dipped her beak and drank deeply, her strength returning with every cool swallow.\n\nAs she flew home against the orange evening sky, the crow understood something she would never forget: that brute strength is no match for a thinking mind, and that even the largest problem will yield to small, steady efforts repeated without surrender.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "According to the passage, what does a young worker bee do during the first weeks of its life?", "options": {"A": "It flies out to collect nectar and pollen.", "B": "It leads and gives orders to the rest of the colony.", "C": "It performs the waggle dance for older bees.", "D": "It stays inside the hive doing tasks such as cleaning and feeding the young."}, "fig": "", "passage": "<strong>The Hidden World of Honeybees</strong><br>A single honeybee may seem small, but a colony behaves almost like one large, intelligent creature. Inside a hive, tens of thousands of bees divide the work so smoothly that scientists call the colony a superorganism. No single bee is in charge, yet the whole community thrives through cooperation.\n\nEach worker bee changes jobs as it ages. For the first weeks of its life, a young worker stays inside the hive, cleaning cells, feeding the young, and building wax comb. Only later does it leave to become a forager, flying out to collect nectar and pollen. This division of labour means every task is always covered.\n\nThe most remarkable thing bees do is communicate through movement. When a forager finds a rich patch of flowers, it returns and performs a waggle dance. By moving in a figure-eight and waggling its body at a certain angle, the bee tells the others both the direction of the flowers, measured against the sun, and roughly how far away they are. Through this silent code, distant food can be shared with the colony within minutes.\n\nBees matter far beyond their hives. As they travel from flower to flower, they carry pollen, allowing plants to produce seeds and fruit. This process, called pollination, supports many of the crops humans eat. Scientists estimate that pollinators help produce roughly a third of our food.\n\nIn recent years, bee numbers in many countries have fallen sharply. Pesticides, disease, and the loss of wild flowers all play a part. Protecting bees, researchers argue, is not merely a kindness to a small insect but a necessary step to safeguard the food supply of the whole planet.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What does the word 'forager' mean as it is used in the passage?", "options": {"A": "a bee that searches for and collects food", "B": "a bee that guards the hive entrance", "C": "a bee that cleans the hive", "D": "a bee that lays eggs"}, "fig": "", "passage": "<strong>The Hidden World of Honeybees</strong><br>A single honeybee may seem small, but a colony behaves almost like one large, intelligent creature. Inside a hive, tens of thousands of bees divide the work so smoothly that scientists call the colony a superorganism. No single bee is in charge, yet the whole community thrives through cooperation.\n\nEach worker bee changes jobs as it ages. For the first weeks of its life, a young worker stays inside the hive, cleaning cells, feeding the young, and building wax comb. Only later does it leave to become a forager, flying out to collect nectar and pollen. This division of labour means every task is always covered.\n\nThe most remarkable thing bees do is communicate through movement. When a forager finds a rich patch of flowers, it returns and performs a waggle dance. By moving in a figure-eight and waggling its body at a certain angle, the bee tells the others both the direction of the flowers, measured against the sun, and roughly how far away they are. Through this silent code, distant food can be shared with the colony within minutes.\n\nBees matter far beyond their hives. As they travel from flower to flower, they carry pollen, allowing plants to produce seeds and fruit. This process, called pollination, supports many of the crops humans eat. Scientists estimate that pollinators help produce roughly a third of our food.\n\nIn recent years, bee numbers in many countries have fallen sharply. Pesticides, disease, and the loss of wild flowers all play a part. Protecting bees, researchers argue, is not merely a kindness to a small insect but a necessary step to safeguard the food supply of the whole planet.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "What information does the waggle dance communicate to other bees?", "options": {"A": "the age of the dancing bee", "B": "the temperature inside the hive", "C": "the direction and rough distance of a food source", "D": "which bee is in charge of the colony"}, "fig": "", "passage": "<strong>The Hidden World of Honeybees</strong><br>A single honeybee may seem small, but a colony behaves almost like one large, intelligent creature. Inside a hive, tens of thousands of bees divide the work so smoothly that scientists call the colony a superorganism. No single bee is in charge, yet the whole community thrives through cooperation.\n\nEach worker bee changes jobs as it ages. For the first weeks of its life, a young worker stays inside the hive, cleaning cells, feeding the young, and building wax comb. Only later does it leave to become a forager, flying out to collect nectar and pollen. This division of labour means every task is always covered.\n\nThe most remarkable thing bees do is communicate through movement. When a forager finds a rich patch of flowers, it returns and performs a waggle dance. By moving in a figure-eight and waggling its body at a certain angle, the bee tells the others both the direction of the flowers, measured against the sun, and roughly how far away they are. Through this silent code, distant food can be shared with the colony within minutes.\n\nBees matter far beyond their hives. As they travel from flower to flower, they carry pollen, allowing plants to produce seeds and fruit. This process, called pollination, supports many of the crops humans eat. Scientists estimate that pollinators help produce roughly a third of our food.\n\nIn recent years, bee numbers in many countries have fallen sharply. Pesticides, disease, and the loss of wild flowers all play a part. Protecting bees, researchers argue, is not merely a kindness to a small insect but a necessary step to safeguard the food supply of the whole planet.", "qnum": "32"}, {"n": "34", "type": "mcq", "section": "English", "stem": "According to the passage, why do scientists call the bee colony a 'superorganism'?", "options": {"A": "because each bee is unusually large", "B": "because the many bees work together so smoothly that the colony acts like a single creature", "C": "because bees live longer than other insects", "D": "because one powerful bee controls all the others"}, "fig": "", "passage": "<strong>The Hidden World of Honeybees</strong><br>A single honeybee may seem small, but a colony behaves almost like one large, intelligent creature. Inside a hive, tens of thousands of bees divide the work so smoothly that scientists call the colony a superorganism. No single bee is in charge, yet the whole community thrives through cooperation.\n\nEach worker bee changes jobs as it ages. For the first weeks of its life, a young worker stays inside the hive, cleaning cells, feeding the young, and building wax comb. Only later does it leave to become a forager, flying out to collect nectar and pollen. This division of labour means every task is always covered.\n\nThe most remarkable thing bees do is communicate through movement. When a forager finds a rich patch of flowers, it returns and performs a waggle dance. By moving in a figure-eight and waggling its body at a certain angle, the bee tells the others both the direction of the flowers, measured against the sun, and roughly how far away they are. Through this silent code, distant food can be shared with the colony within minutes.\n\nBees matter far beyond their hives. As they travel from flower to flower, they carry pollen, allowing plants to produce seeds and fruit. This process, called pollination, supports many of the crops humans eat. Scientists estimate that pollinators help produce roughly a third of our food.\n\nIn recent years, bee numbers in many countries have fallen sharply. Pesticides, disease, and the loss of wild flowers all play a part. Protecting bees, researchers argue, is not merely a kindness to a small insect but a necessary step to safeguard the food supply of the whole planet.", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "What is the author's main PURPOSE in writing this passage?", "options": {"A": "to persuade readers to start keeping bees as a hobby", "B": "to inform readers about how bees live, communicate, and matter to humans", "C": "to entertain readers with a funny story about insects", "D": "to compare bees with other flying insects"}, "fig": "", "passage": "<strong>The Hidden World of Honeybees</strong><br>A single honeybee may seem small, but a colony behaves almost like one large, intelligent creature. Inside a hive, tens of thousands of bees divide the work so smoothly that scientists call the colony a superorganism. No single bee is in charge, yet the whole community thrives through cooperation.\n\nEach worker bee changes jobs as it ages. For the first weeks of its life, a young worker stays inside the hive, cleaning cells, feeding the young, and building wax comb. Only later does it leave to become a forager, flying out to collect nectar and pollen. This division of labour means every task is always covered.\n\nThe most remarkable thing bees do is communicate through movement. When a forager finds a rich patch of flowers, it returns and performs a waggle dance. By moving in a figure-eight and waggling its body at a certain angle, the bee tells the others both the direction of the flowers, measured against the sun, and roughly how far away they are. Through this silent code, distant food can be shared with the colony within minutes.\n\nBees matter far beyond their hives. As they travel from flower to flower, they carry pollen, allowing plants to produce seeds and fruit. This process, called pollination, supports many of the crops humans eat. Scientists estimate that pollinators help produce roughly a third of our food.\n\nIn recent years, bee numbers in many countries have fallen sharply. Pesticides, disease, and the loss of wild flowers all play a part. Protecting bees, researchers argue, is not merely a kindness to a small insect but a necessary step to safeguard the food supply of the whole planet.", "qnum": "34"}, {"n": "36", "type": "writing", "section": "English Writing", "intro": "This is a personal essay. Write in the first person, organise your ideas into clear paragraphs, and use varied sentences and precise vocabulary. You will be assessed on the range of your vocabulary, the variety and accuracy of your sentences, and how clearly and fully you develop your ideas.", "label": "", "body": "Choose ONE of the following: (1) Write about a hobby or activity that matters to you. Explain what it is, why you enjoy it, and what it has taught you about yourself. (2) Write about a place that is special to you. Describe what the place is like, and explain why it matters so much to you.", "hint": "Write a well-developed response of at least 10-12 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "37", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "38", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which expression is equal to \"double the sum of a number k and 6\"?", "options": {"A": "2(k + 6)", "B": "2k + 6", "C": "k + 12", "D": "2k + 12k"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "39", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify: 9w − 16w + 7w.", "options": {"A": "32w", "B": "−10w", "C": "0", "D": "16w"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Order these numbers from least to greatest: −1.5, 5/4, −2, 0.3, −7/4.", "options": {"A": "−1.5, −7/4, −2, 0.3, 5/4", "B": "−2, −7/4, −1.5, 0.3, 5/4", "C": "0.3, −1.5, −7/4, −2, 5/4", "D": "5/4, 0.3, −1.5, −7/4, −2"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which statement is true?", "options": {"A": "3/8 > 0.4", "B": "0.4 < 37%", "C": "3/8 < 0.4", "D": "37% > 0.4"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Evaluate: 17 + (−6) − (−8) − 21.", "options": {"A": "−18", "B": "52", "C": "10", "D": "−2"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "43", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: (−3)(−4)(2)(−1).", "options": {"A": "24", "B": "−6", "C": "10", "D": "−24"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "44", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 5.7 − 12.4.", "options": {"A": "6.7", "B": "−7.3", "C": "−6.7", "D": "−6.3"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "45", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 3.6 ÷ 0.08.", "options": {"A": "4.5", "B": "0.45", "C": "450", "D": "45"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "46", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Express 7/8 as a decimal.", "options": {"A": "0.78", "B": "0.875", "C": "1.142", "D": "0.87"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "47", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 5/12 ÷ 3/4.", "options": {"A": "5/16", "B": "5/9", "C": "8/16", "D": "9/5"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "48", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Convert 7/10 to a percentage.", "options"  d=\"M318,195 A18,18 0 0 1 312,182\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.4\"/></svg>", "passage": "", "qnum": "15"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The three angles of a triangle are in the ratio 3 : 4 : 5. What is the largest angle?", "options": {"A": "75°", "B": "60°", "C": "90°", "D": "45°"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Three angles of a quadrilateral are 84°, 96° and 71°. What is the fourth angle?", "options": {"A": "71°", "B": "109°", "C": "289°", "D": "119°"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid measures 7 cm by 5 cm by 3.5 cm. What is its volume?", "options": {"A": "122.5 cm³", "B": "15.5 cm³", "C": "122.5 cm²", "D": "35 cm³"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this sequence, which follows two alternating rules: 7, 4, 8, 5, 10, 7, ___ . What number comes next?", "options": {"A": "4", "B": "14", "C": "10", "D": "9"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A shop sells notebooks at $12 each. If a customer buys 5 or more in one purchase, the shop takes $8 off the whole order. How much does a customer pay for exactly 5 notebooks?", "options": {"A": "$60", "B": "$68", "C": "$20", "D": "$52"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word does NOT belong with the other three? Damp, Soaked, Drenched, Parched.", "options": {"A": "Parched", "B": "Damp", "C": "Soaked", "D": "Drenched"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four friends sit in a row of four seats numbered 1 to 4 from left to right. Tara sits somewhere to the left of Omar. Bea sits immediately to the right of Omar. Tara is not in seat 1. Who sits in seat 1?", "options": {"A": "Omar", "B": "Bea", "C": "Leo", "D": "Tara"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The letters R E T G I can be rearranged to spell a word. Which category does that word belong to?", "options": {"A": "An animal", "B": "A fruit", "C": "A country", "D": "A colour"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the flat cross-shaped net of six squares in the figure. If it is folded up to make a cube, which face ends up DIRECTLY OPPOSITE the shaded face?", "options": {"A": "Face 1", "B": "Face 5", "C": "Face 3", "D": "Face 6"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the sequence of shapes in the figure: square (4 sides), pentagon (5 sides), hexagon (6 sides), heptagon (7 sides). Which shape comes NEXT in the pattern?", "options": {"A": "decagon", "B": "nonagon", "C": "octagon", "D": "circle"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"470\" height=\"230\" viewBox=\"0 0 470 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"470\" height=\"230\" fill=\"white\"/><text x=\"10\" y=\"22\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Sequence:</text><rect x=\"34\" y=\"34\" width=\"52\" height=\"52\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"150.0,34.0 174.7,52.0 165.3,81.0 134.7,81.0 125.3,52.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"240.0,34.0 262.5,47.0 262.5,73.0 240.0,86.0 217.5,73.0 217.5,47.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"330.0,34.0 350.3,43.8 355.3,65.8 341.3,83.4 318.7,83.4 304.7,65.8 309.7,43.8\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"70\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"bold\" fill=\"#C00\">?</text><line x1=\"10\" y1=\"120\" x2=\"460\" y2=\"120\" stroke=\"#ccc\"/><text x=\"10\" y=\"142\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Options:</text><polygon points=\"60.0,149.0 75.3,154.0 84.7,167.0 84.7,183.0 75.3,196.0 60.0,201.0 44.7,196.0 35.3,183.0 35.3,167.0 44.7,154.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"150.0,149.0 166.7,155.1 175.6,170.5 172.5,188.0 158.9,199.4 141.1,199.4 127.5,188.0 124.4,170.5 133.3,155.1\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"150\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"240.0,149.0 258.4,156.6 266.0,175.0 258.4,193.4 240.0,201.0 221.6,193.4 214.0,175.0 221.6,156.6\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"240\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><circle cx=\"330\" cy=\"175\" r=\"26\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"330\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "25"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The school library will close one hour earlier on Fridays so that staff can reshelve the books returned during the week.\"\n\nPROPOSED ASSUMPTION: \"Books are returned to the library on more than one day of the week.\"\n\nUsing only the information in the statement, is this assumption logical?", "options": {"A": "Yes — the statement says the early Friday closing is to reshelve books \"returned during the week,\" which means returns happen across the week, not only on Friday.", "B": "No — the statement only mentions Friday, so we cannot say anything about returns on other days.", "C": "(not used)", "D": "(not used)"}, "fig": "", "passage": "", "qnum": "26"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every student who scored above 80% on the mock exam was offered a place in the advanced maths class. Mei scored 76% on the mock exam.\"\n\nWhich of the following MUST be true based only on this statement?", "options": {"A": "Mei was not offered a place in the advanced maths class.", "B": "Students who scored below 80% were never offered a place in the advanced maths class.", "C": "Mei is weaker at maths than every student who was offered a place.", "D": "Mei did not score above 80% on the mock exam."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"In a survey of the 200 Year 8 students, 50% said their main after-school activity is sport, 30% said it is music, and the remaining 20% said it is art. No student named more than one main activity.\"\n\nCONCLUSIONS:\n(1) 40 of the surveyed Year 8 students named art as their main after-school activity.\n(2) More of the surveyed students named art as their main activity than named music.\n\nUsing only the information given, which option is correct?", "options": {"A": "Both (1) and (2) follow.", "B": "Neither (1) nor (2) follows.", "C": "(1) follows but (2) does not.", "D": "(2) follows but (1) does not."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"All members of the debate club must also be members of the school council. Some members of the school council are in Year 9. Raj is a member of the debate club.\"\n\nWhich conclusion does NOT follow from these facts?", "options": {"A": "Raj is a member of the school council.", "B": "Raj is in Year 9.", "C": "At least one school council member is in the debate club.", "D": "There is at least one student who is a member of the school council."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the school replace all printed textbooks with tablets?\"\n\nWhich of the three arguments below is the STRONGEST?", "options": {"A": "Yes — a two-year trial in 30 comparable schools found that tablet-using classes covered the same syllabus while cutting printing costs by 40% with no drop in test scores.", "B": "No — I personally find reading on a screen tiring and I have always preferred the feel of a real book in my hands.", "C": "Yes — tablets let students carry their whole curriculum on one device and receive updates instantly, so they are obviously the better choice.", "D": "(not used)"}, "fig": "", "passage": "", "qnum": "30"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The museum is free to enter on the first Sunday of every month. On all other days, adult tickets cost $50 and children's tickets cost $20.\"\n\nWhich of the following MUST be true based only on this statement?", "options": {"A": "More people visit the museum on the first Sunday of the month than on any other day.", "B": "An adult always pays more to enter the museum than a child does.", "C": "An adult who visits on the second Sunday of the month must pay $50.", "D": "The museum earns no money at all on the first Sunday of the month."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "69", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "70", "type": "mcq", "section": "Chinese", "stem": "根據文章，老樟樹最初是怎樣來到村口的？<br><span style=\"color:#555\">根据文章，老樟树最初是怎样来到村口的？</span>", "options": {"A": "是阿婆的祖父年輕時親手栽下的<br><span style=\"color:#555\">是阿婆的祖父年轻时亲手栽下的</span>", "B": "是村民從山上移植過來的<br><span style=\"color:#555\">是村民从山上移植过来的</span>", "C": "是一場大風把種子吹來自然長成的<br><span style=\"color:#555\">是一场大风把种子吹来自然长成的</span>", "D": "是縣城的官員下令種植的<br><span style=\"color:#555\">是县城的官员下令种植的</span>"}, "fig": "", "passage": "村口有一棵老樟樹，枝葉茂密，像一把巨大的綠傘撐在路旁。這棵樹是阿婆的祖父年輕時親手種下的，算起來已有近百年的歲數。它默默地站在那裏，彷彿一位沉默的長者，見證著村子幾十年來的變化。春天，新葉嫩綠，樹梢綴著點點細小的花；到了夏天的黃昏，孩子們在樹下追逐嬉戲，老人們在樹蔭裏對弈閒談，笑聲一陣接著一陣。秋風一起，金黃的落葉鋪滿地面，踩上去發出沙沙的聲響。阿婆常常坐在樹下，一邊搖著蒲扇，一邊向我們娓娓講起從前的故事。她說，無論時代怎麼變，這棵樹始終是全村人最溫暖的記憶。聽著風吹過樹葉沙沙作響，我忽然明白，這棵老樹早已不只是一棵樹，而是故鄉的象徵。後來表哥到城裏唸書，臨走那天還特意回頭望了望它；他說，無論走多遠，他都會記得村口那棵老樹。<br><span style=\"color:#555\">村口有一棵老樟树，枝叶茂密，像一把巨大的绿伞撑在路旁。这棵树是阿婆的祖父年轻时亲手种下的，算起来已有近百年的岁数。它默默地站在那里，仿佛一位沉默的长者，见证着村子几十年来的变化。春天，新叶嫩绿，树梢缀着点点细小的花；到了夏天的黄昏，孩子们在树下追逐嬉戏，老人们在树荫里对弈闲谈，笑声一阵接着一阵。秋风一起，金黄的落叶铺满地面，踩上去发出沙沙的声响。阿婆常常坐在树下，一边摇着蒲扇，一边向我们娓娓讲起从前的故事。她说，无论时代怎么变，这棵树始终是全村人最温暖的记忆。听着风吹过树叶沙沙作响，我忽然明白，这棵老树早已不只是一棵树，而是故乡的象征。后来表哥到城里念书，临走那天还特意回头望了望它；他说，无论走多远，他都会记得村口那棵老树。</span>", "qnum": "1"}, {"n": "71", "type": "mcq", "section": "Chinese", "stem": "文章說老樟樹「彷彿一位沉默的長者」，這個比喻主要想表達甚麼？<br><span style=\"color:#555\">文章说老樟树「仿佛一位沉默的长者」，这个比喻主要想表达什么？</span>", "options": {"A": "這棵樹快要枯死，沒有生氣<br><span style=\"color:#555\">这棵树快要枯死，没有生气</span>", "B": "這棵樹長得又高又瘦，像老人的身形<br><span style=\"color:#555\">这棵树长得又高又瘦，像老人的身形</span>", "C": "這棵樹年代久遠，靜靜見證了村子的變遷<br><span style=\"color:#555\">这棵树年代久远，静静见证了村子的变迁</span>", "D": "這棵樹不會說話，所以很孤獨<br><span style=\"color:#555\">这棵树不会说话，所以很孤独</span>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "72", "type": "mcq", "section": "Chinese", "stem": "「孩子們在樹下追逐嬉戲，老人們在樹蔭裏對弈閒談」一句，主要寫出了甚麼？<br><span style=\"color:#555\">「孩子们在树下追逐嬉戏，老人们在树荫里对弈闲谈」一句，主要写出了什么？</span>", "options": {"A": "村裏人口太多，十分擁擠<br><span style=\"color:#555\">村里人口太多，十分拥挤</span>", "B": "老樹已成了村民日常生活的中心<br><span style=\"color:#555\">老树已成了村民日常生活的中心</span>", "C": "孩子和老人之間常常發生爭執<br><span style=\"color:#555\">孩子和老人之间常常发生争执</span>", "D": "村民都不願意外出工作<br><span style=\"color:#555\">村民都不愿意外出工作</span>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "從全文看，作者寫這篇文章最主要想表達的感情是甚麼？<b ns": {"A": "經過這次活動，使我學會了團隊合作。<br><span style=\"color:#555\">经过这次活动，使我学会了团队合作。</span>", "B": "他不但成績優異，而且為人謙虛。<br><span style=\"color:#555\">他不但成绩优异，而且为人谦虚。</span>", "C": "我們要努力防止類似的事故不再發生。<br><span style=\"color:#555\">我们要努力防止类似的事故不再发生。</span>", "D": "能否取得好成績，關鍵在於他平時很用功。<br><span style=\"color:#555\">能否取得好成绩，关键在于他平时很用功。</span>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "「妹妹把那本故事書看完了。」這句話改寫成「被」字句，最正確的是：<br><span style=\"color:#555\">「妹妹把那本故事书看完了。」这句话改写成「被」字句，最正确的是：</span>", "options": {"A": "那本故事書被妹妹看完了。<br><span style=\"color:#555\">那本故事书被妹妹看完了。</span>", "B": "妹妹被那本故事書看完了。<br><span style=\"color:#555\">妹妹被那本故事书看完了。</span>", "C": "那本故事書把妹妹看完了。<br><span style=\"color:#555\">那本故事书把妹妹看完了。</span>", "D": "妹妹被看完了那本故事書。<br><span style=\"color:#555\">妹妹被看完了那本故事书。</span>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
