<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

const SCHOOL = "CIS", STAGE = "4", VERSION = "2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence: Neither the referee nor the linesmen ____ aware that the match had been postponed.", "options": {"A": "was", "B": "is", "C": "were", "D": "has been"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word parched in the sentence below?\nAfter crossing the desert for six hours under the blazing sun, the travellers were so parched they could barely speak.", "options": {"A": "extremely thirsty", "B": "exhausted", "C": "frightened", "D": "impatient"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which of the following is a complete sentence?", "options": {"A": "Whoever leaves the laboratory last each evening.", "B": "The tired nurse signed the final report.", "C": "Climbing the steep hill behind the village.", "D": "Although the train was already late that morning."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which underlined word carries a NEGATIVE connotation?", "options": {"A": "The reviewer described the meal as <u>economical</u>.", "B": "The reviewer described the meal as <u>thrifty</u>.", "C": "The reviewer described the meal as <u>budget-friendly</u>.", "D": "The reviewer described the meal as <u>skimpy</u>."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the correct relative pronoun: The laboratory, ____ stores the rarest samples in the region, will be inspected on Monday.", "options": {"A": "who", "B": "which", "C": "where", "D": "what"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which prefix forms the standard dictionary antonym of the word 'legible'?", "options": {"A": "un-", "B": "dis-", "C": "il-", "D": "non-"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence as the subject: ____ before breakfast has steadily improved Daniel's stamina.", "options": {"A": "Jogging", "B": "Jogged", "C": "He jogs", "D": "For jogging"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word relentless in the sentence below?\nThe rescue workers kept up a relentless search through the night, refusing to rest until everyone was found.", "options": {"A": "unexpected", "B": "dangerous", "C": "brief", "D": "unceasing"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "In the sentence below, what does the pronoun 'it' refer to?\nThe gardener leaned the rusty rake against the wooden fence, which creaked because it was rotten.", "options": {"A": "the gardener", "B": "the fence", "C": "the rake", "D": "the garden"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined phrase?\nThe explorers decided to <u>set out on</u> a six-month trek across the rainforest.", "options": {"A": "complete", "B": "cancel", "C": "embark on", "D": "describe"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Choose the correct passive-voice version of: 'The committee will announce the winners tomorrow.'", "options": {"A": "The winners will be announced by the committee tomorrow.", "B": "The winners are announced by the committee tomorrow.", "C": "The winners have been announced by the committee tomorrow.", "D": "The winners were announced by the committee tomorrow."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Choose the correct adverb form to complete the sentence: The surgeon worked ____ throughout the long operation, never once losing focus.", "options": {"A": "methodical", "B": "method", "C": "methodicalness", "D": "methodically"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Choose the correctly punctuated sentence.", "options": {"A": "The road was flooded so the driver took a longer route home.", "B": "The road was flooded, so the driver took a longer route home.", "C": "The road was flooded, the driver took a longer route home.", "D": "The road was, flooded so the driver took a longer route home."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word adept in the sentence below?\nAfter years of weekend practice, Mei became adept at woodworking and could build a cabinet faster than her instructor.", "options": {"A": "interested", "B": "curious", "C": "skilled", "D": "certified"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Choose the verb form that best completes the sentence: By the time the guests arrived, the chef ____ the dessert.", "options": {"A": "prepares", "B": "prepared", "C": "will prepare", "D": "had prepared"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "Which underlined word has a POSITIVE connotation in describing a person's behaviour?", "options": {"A": "The columnist called the mayor <u>tenacious</u>.", "B": "The columnist called the mayor <u>stubborn</u>.", "C": "The columnist called the mayor <u>pushy</u>.", "D": "The columnist called the mayor <u>obstinate</u>."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\n(A) Each of the candidates (B) were handed (C) a numbered badge (D) before the debate.", "options": {"A": "Each of the candidates", "B": "were handed", "C": "a numbered badge", "D": "before the debate"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word peculiar in the sentence below?\nThe antique shop was full of peculiar instruments that none of the visitors could even name.", "options": {"A": "expensive", "B": "valuable", "C": "strange", "D": "shiny"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Choose the correct active-voice version of: 'A new tunnel is being dug by the workers beneath the harbour.'", "options": {"A": "The workers are digging a new tunnel beneath the harbour.", "B": "The workers dug a new tunnel beneath the harbour.", "C": "The workers will dig a new tunnel beneath the harbour.", "D": "The workers have dug a new tunnel beneath the harbour."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?\nThe reforms proved highly <u>detrimental</u> to small farmers across the valley.", "options": {"A": "advantageous", "B": "temporary", "C": "compulsory", "D": "harmful"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Choose the correct relative pronoun: After hours of thought, the detective finally grasped ____ the suspect had been hiding all along.", "options": {"A": "which", "B": "what", "C": "that", "D": "who"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error.\n(A) The architect, together with her assistants, (B) the publisher (C) are reviewing the blueprints (D) this afternoon.", "options": {"A": "The architect, together with her assistants,", "B": "the publisher", "C": "are reviewing the blueprints", "D": "this afternoon"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?\nThe captain's <u>blunt</u> assessment of the crew's mistakes startled the new recruits.", "options": {"A": "frank", "B": "gentle", "C": "detailed", "D": "private"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "Choose the verb form that best completes the sentence: He is one of those colleagues who ____ always willing to help a newcomer.", "options": {"A": "is", "B": "was", "C": "has been", "D": "are"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "Why did the townsfolk hurry past the tower after the crack appeared?", "options": {"A": "They disliked the bell's new broken sound.", "B": "They were afraid the tower would fall.", "C": "They could no longer hear the bell at all.", "D": "They were angry at the small girl."}, "fig": "", "passage": "<strong>The Cracked Bell</strong><br>High in the white tower of an old town hung a great bronze bell. For a hundred years it had rung out the hours, and the people below set their whole lives by its deep, steady voice. The bell was proud, and it believed the town could not live without it.\n\nOne winter a thin crack appeared along its rim. When the bell-ringer pulled the rope, the bell no longer sang. Instead it gave a flat, broken clang, like a pot struck with a spoon. The townsfolk frowned and covered their ears. \"What use is a bell that cannot sing?\" they muttered, and they hurried past the tower without looking up.\n\nThe bell was ashamed. It longed to be melted down and forgotten. But one grey morning a small girl climbed the tower stairs and sat beside it. \"You sound different now,\" she said, \"but you still tell us the hour. I always know when to go home because of you.\" The bell, which had thought itself useless, was startled to hear that it still mattered.\n\nFrom that day the bell rang with its cracked, honest voice, and slowly the people grew fond of it. Visitors came from far away just to hear the strange, rough note that no other bell in the world could make. The mayor, who had once planned to replace it, now boasted of it instead.\n\nThe bell learned that worth is not found only in a perfect, polished voice. Sometimes the very flaw that we wish to hide becomes the thing that makes us treasured. A crack, the bell decided, was not the end of usefulness, but the beginning of a different kind of song.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word startled as used in paragraph three?", "options": {"A": "insulted", "B": "reassured", "C": "surprised", "D": "bored"}, "fig": "", "passage": "<strong>The Cracked Bell</strong><br>High in the white tower of an old town hung a great bronze bell. For a hundred years it had rung out the hours, and the people below set their whole lives by its deep, steady voice. The bell was proud, and it believed the town could not live without it.\n\nOne winter a thin crack appeared along its rim. When the bell-ringer pulled the rope, the bell no longer sang. Instead it gave a flat, broken clang, like a pot struck with a spoon. The townsfolk frowned and covered their ears. \"What use is a bell that cannot sing?\" they muttered, and they hurried past the tower without looking up.\n\nThe bell was ashamed. It longed to be melted down and forgotten. But one grey morning a small girl climbed the tower stairs and sat beside it. \"You sound different now,\" she said, \"but you still tell us the hour. I always know when to go home because of you.\" The bell, which had thought itself useless, was startled to hear that it still mattered.\n\nFrom that day the bell rang with its cracked, honest voice, and slowly the people grew fond of it. Visitors came from far away just to hear the strange, rough note that no other bell in the world could make. The mayor, who had once planned to replace it, now boasted of it instead.\n\nThe bell learned that worth is not found only in a perfect, polished voice. Sometimes the very flaw that we wish to hide becomes the thing that makes us treasured. A crack, the bell decided, was not the end of usefulness, but the beginning of a different kind of song.", "qnum": "26"}, {"n": "28", "type": "mcq", "section": "English", "stem": "What can be inferred about the mayor by the end of the story?", "options": {"A": "He still wishes to replace the bell.", "B": "He never noticed the crack in the bell.", "C": "He blames the girl for the bell's sound.", "D": "He has changed his opinion of the bell."}, "fig": "", "passage": "<strong>The Cracked Bell</strong><br>High in the white tower of an old town hung a great bronze bell. For a hundred years it had rung out the hours, and the people below set their whole lives by its deep, steady voice. The bell was proud, and it believed the town could not live without it.\n\nOne winter a thin crack appeared along its rim. When the bell-ringer pulled the rope, the bell no longer sang. Instead it gave a flat, broken clang, like a pot struck with a spoon. The townsfolk frowned and covered their ears. \"What use is a bell that cannot sing?\" they muttered, and they hurried past the tower without looking up.\n\nThe bell was ashamed. It longed to be melted down and forgotten. But one grey morning a small girl climbed the tower stairs and sat beside it. \"You sound different now,\" she said, \"but you still tell us the hour. I always know when to go home because of you.\" The bell, which had thought itself useless, was startled to hear that it still mattered.\n\nFrom that day the bell rang with its cracked, honest voice, and slowly the people grew fond of it. Visitors came from far away just to hear the strange, rough note that no other bell in the world could make. The mayor, who had once planned to replace it, now boasted of it instead.\n\nThe bell learned that worth is not found only in a perfect, polished voice. Sometimes the very flaw that we wish to hide becomes the thing that makes us treasured. A crack, the bell decided, was not the end of usefulness, but the beginning of a different kind of song.", "qnum": "27"}, {"n": "29", "type": "mcq", "section": "English", "stem": "Which statement best expresses the theme of the fable?", "options": {"A": "Old objects should always be replaced with new ones.", "B": "A flaw can become the very thing that makes us valued.", "C": "People will never change their minds once decided.", "D": "It is dangerous to climb tall towers in winter."}, "fig": "", "passage": "<strong>The Cracked Bell</strong><br>High in the white tower of an old town hung a great bronze bell. For a hundred years it had rung out the hours, and the people below set their whole lives by its deep, steady voice. The bell was proud, and it believed the town could not live without it.\n\nOne winter a thin crack appeared along its rim. When the bell-ringer pulled the rope, the bell no longer sang. Instead it gave a flat, broken clang, like a pot struck with a spoon. The townsfolk frowned and covered their ears. \"What use is a bell that cannot sing?\" they muttered, and they hurried past the tower without looking up.\n\nThe bell was ashamed. It longed to be melted down and forgotten. But one grey morning a small girl climbed the tower stairs and sat beside it. \"You sound different now,\" she said, \"but you still tell us the hour. I always know when to go home because of you.\" The bell, which had thought itself useless, was startled to hear that it still mattered.\n\nFrom that day the bell rang with its cracked, honest voice, and slowly the people grew fond of it. Visitors came from far away just to hear the strange, rough note that no other bell in the world could make. The mayor, who had once planned to replace it, now boasted of it instead.\n\nThe bell learned that worth is not found only in a perfect, polished voice. Sometimes the very flaw that we wish to hide becomes the thing that makes us treasured. A crack, the bell decided, was not the end of usefulness, but the beginning of a different kind of song.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "The author compares the bell's broken sound to 'a pot struck with a spoon'. What is the main effect of this comparison?", "options": {"A": "It makes the broken sound seem grand and beautiful.", "B": "It suggests the bell was made of cheap metal.", "C": "It helps the reader imagine how dull and ordinary the sound became.", "D": "It proves the bell was actually a kitchen object."}, "fig": "", "passage": "<strong>The Cracked Bell</strong><br>High in the white tower of an old town hung a great bronze bell. For a hundred years it had rung out the hours, and the people below set their whole lives by its deep, steady voice. The bell was proud, and it believed the town could not live without it.\n\nOne winter a thin crack appeared along its rim. When the bell-ringer pulled the rope, the bell no longer sang. Instead it gave a flat, broken clang, like a pot struck with a spoon. The townsfolk frowned and covered their ears. \"What use is a bell that cannot sing?\" they muttered, and they hurried past the tower without looking up.\n\nThe bell was ashamed. It longed to be melted down and forgotten. But one grey morning a small girl climbed the tower stairs and sat beside it. \"You sound different now,\" she said, \"but you still tell us the hour. I always know when to go home because of you.\" The bell, which had thought itself useless, was startled to hear that it still mattered.\n\nFrom that day the bell rang with its cracked, honest voice, and slowly the people grew fond of it. Visitors came from far away just to hear the strange, rough note that no other bell in the world could make. The mayor, who had once planned to replace it, now boasted of it instead.\n\nThe bell learned that worth is not found only in a perfect, polished voice. Sometimes the very flaw that we wish to hide becomes the thing that makes us treasured. A crack, the bell decided, was not the end of usefulness, but the beginning of a different kind of song.", "qnum": "29"}, {"n": "31", "type": "mcq", "section": "English", "stem": "How did sailors measure ocean depth before the use of sonar?", "options": {"A": "By lowering a weighted rope until it touched the bottom.", "B": "By sending pulses of sound to the seabed.", "C": "By photographing the seabed from ships.", "D": "By comparing the ocean to the surface of Mars."}, "fig": "", "passage": "<strong>The Race to Map the Ocean Floor</strong><br>For most of human history, the bottom of the ocean was a complete mystery. Sailors could measure shallow water by lowering a weighted rope until it touched the seabed, but in the deep ocean the rope could stretch for kilometres, and a single measurement might take hours. As late as the nineteenth century, many people imagined the deep sea floor as a flat, lifeless plain.\n\nThe first real breakthrough came in the 1870s, when the British ship HMS Challenger sailed around the world taking thousands of depth measurements. Its crew discovered that the ocean floor was not flat at all. There were towering underwater mountains, vast plains, and trenches deeper than any valley on land. One of these, later named the Mariana Trench, plunges nearly eleven kilometres below the surface, deep enough to swallow the world's tallest mountain with room to spare.\n\nIn the twentieth century, scientists replaced ropes with sound. A device called sonar sends a pulse of sound toward the seabed and measures how long the echo takes to return. Because sound travels through water at a known speed, the time of the echo reveals the depth. Sonar allowed ships to map wide strips of ocean floor as they sailed, rather than one slow point at a time.\n\nThese maps changed science forever. They revealed a chain of underwater mountains, called the mid-ocean ridge, that winds around the globe like the seam of a baseball. This discovery became powerful evidence for the theory of plate tectonics, which explains how the continents slowly move. Yet even today, more than three-quarters of the ocean floor has never been mapped in detail. We have better maps of the surface of Mars than of the bottom of our own seas, a reminder that the greatest unexplored frontier may lie not above us, but below.", "qnum": "30"}, {"n": "32", "type": "mcq", "section": "English", "stem": "What did the crew of HMS Challenger discover about the ocean floor?", "options": {"A": "It was a flat, lifeless plain.", "B": "It was shallower than people expected.", "C": "It was impossible to measure with rope.", "D": "It contained mountains, plains, and deep trenches."}, "fig": "", "passage": "<strong>The Race to Map the Ocean Floor</strong><br>For most of human history, the bottom of the ocean was a complete mystery. Sailors could measure shallow water by lowering a weighted rope until it touched the seabed, but in the deep ocean the rope could stretch for kilometres, and a single measurement might take hours. As late as the nineteenth century, many people imagined the deep sea floor as a flat, lifeless plain.\n\nThe first real breakthrough came in the 1870s, when the British ship HMS Challenger sailed around the world taking thousands of depth measurements. Its crew discovered that the ocean floor was not flat at all. There were towering underwater mountains, vast plains, and trenches deeper than any valley on land. One of these, later named the Mariana Trench, plunges nearly eleven kilometres below the surface, deep enough to swallow the world's tallest mountain with room to spare.\n\nIn the twentieth century, scientists replaced ropes with sound. A device called sonar sends a pulse of sound toward the seabed and measures how long the echo takes to return. Because sound travels through water at a known speed, the time of the echo reveals the depth. Sonar allowed ships to map wide strips of ocean floor as they sailed, rather than one slow point at a time.\n\nThese maps changed science forever. They revealed a chain of underwater mountains, called the mid-ocean ridge, that winds around the globe like the seam of a baseball. This discovery became powerful evidence for the theory of plate tectonics, which explains how the continents slowly move. Yet even today, more than three-quarters of the ocean floor has never been mapped in detail. We have better maps of the surface of Mars than of the bottom of our own seas, a reminder that the greatest unexplored frontier may lie not above us, but below.", "qnum": "31"}, {"n": "33", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word plunges as used in the second paragraph?", "options": {"A": "floats", "B": "drops steeply", "C": "narrows", "D": "spreads out"}, "fig": "", "passage": "<strong>The Race to Map the Ocean Floor</strong><br>For most of human history, the bottom of the ocean was a complete mystery. Sailors could measure shallow water by lowering a weighted rope until it touched the seabed, but in the deep ocean the rope could stretch for kilometres, and a single measurement might take hours. As late as the nineteenth century, many people imagined the deep sea floor as a flat, lifeless plain.\n\nThe first real breakthrough came in the 1870s, when the British ship HMS Challenger sailed around the world taking thousands of depth measurements. Its crew discovered that the ocean floor was not flat at all. There were towering underwater mountains, vast plains, and trenches deeper than any valley on land. One of these, later named the Mariana Trench, plunges nearly eleven kilometres below the surface, deep enough to swallow the world's tallest mountain with room to spare.\n\nIn the twentieth century, scientists replaced ropes with sound. A device r named the Mariana Trench, plunges nearly eleven kilometres below the surface, deep enough to swallow the world's tallest mountain with room to spare.\n\nIn the twentieth century, scientists replaced ropes with sound. A device called sonar sends a pulse of sound toward the seabed and measures how long the echo takes to return. Because sound travels through water at a known speed, the time of the echo reveals the depth. Sonar allowed ships to map wide strips of ocean floor as they sailed, rather than one slow point at a time.\n\nThese maps changed science forever. They revealed a chain of underwater mountains, called the mid-ocean ridge, that winds around the globe like the seam of a baseball. This discovery became powerful evidence for the theory of plate tectonics, which explains how the continents slowly move. Yet even today, more than three-quarters of the ocean floor has never been mapped in detail. We have better maps of the surface of Mars than of the bottom of our own seas, a reminder that the greatest unexplored frontier may lie not above us, but below.", "qnum": "33"}, {"n": "35", "type": "mcq", "section": "English", "stem": "Why does the author mention that 'We have better maps of the surface of Mars than of the bottom of our own seas'?", "options": {"A": "To emphasise how little of the ocean floor we have explored.", "B": "To show that space travel is easier than ocean travel.", "C": "To suggest that Mars has oceans similar to Earth's.", "D": "To prove that sonar does not actually work."}, "fig": "", "passage": "<strong>The Race to Map the Ocean Floor</strong><br>For most of human history, the bottom of the ocean was a complete mystery. Sailors could measure shallow water by lowering a weighted rope until it touched the seabed, but in the deep ocean the rope could stretch for kilometres, and a single measurement might take hours. As late as the nineteenth century, many people imagined the deep sea floor as a flat, lifeless plain.\n\nThe first real breakthrough came in the 1870s, when the British ship HMS Challenger sailed around the world taking thousands of depth measurements. Its crew discovered that the ocean floor was not flat at all. There were towering underwater mountains, vast plains, and trenches deeper than any valley on land. One of these, later named the Mariana Trench, plunges nearly eleven kilometres below the surface, deep enough to swallow the world's tallest mountain with room to spare.\n\nIn the twentieth century, scientists replaced ropes with sound. A device called sonar sends a pulse of sound toward the seabed and measures how long the echo takes to return. Because sound travels through water at a known speed, the time of the echo reveals the depth. Sonar allowed ships to map wide strips of ocean floor as they sailed, rather than one slow point at a time.\n\nThese maps changed science forever. They revealed a chain of underwater mountains, called the mid-ocean ridge, that winds around the globe like the seam of a baseball. This discovery became powerful evidence for the theory of plate tectonics, which explains how the continents slowly move. Yet even today, more than three-quarters of the ocean floor has never been mapped in detail. We have better maps of the surface of Mars than of the bottom of our own seas, a reminder that the greatest unexplored frontier may lie not above us, but below.", "qnum": "34"}, {"n": "36", "type": "writing", "section": "English Writing", "intro": "Stage 4 personal essay. Choose ONE topic and develop it fully with specific details, varied sentence types, and a clear sense of why the hobby or place matters to you.", "label": "", "body": "Choose ONE of the following: (1) Write about a hobby or activity that matters to you. Explain what it is, how you became interested in it, and why it is important in your life. (2) Write about a place that is special to you. Describe what the place is like and explain why it means so much to you.", "hint": "Write a well-developed response of at least 10-12 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": ""}, {"n": "37", "type": "info", "title": "Maths, Logic & Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": "38", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify: -2y - 9y + 15y", "options": {"A": "4y", "B": "26y", "C": "2y", "D": "-26y"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "39", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which expression is equal to -6(3 + 5t)?", "options": {"A": "-18 + 5t", "B": "-18 - 30t", "C": "-18 + 30t", "D": "-9 + t"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "40", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Order these integers from least to greatest: -7, 3, -13, 0, -2", "options": {"A": "0, -2, -7, -13, 3", "B": "-2, -7, -13, 0, 3", "C": "-13, -7, -2, 0, 3", "D": "3, 0, -2, -7, -13"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "41", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which comparison statement is true?", "options": {"A": "-12 > -8", "B": "-20 > 6", "C": "0 < -5", "D": "-12 < -8"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "42", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangle has a base of 14 cm and a perpendicular height of 8 cm. What is its area?", "options": {"A": "56 cm²", "B": "112 cm²", "C": "22 cm²", "D": "56 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300 "", "passage": "", "qnum": "20"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A bus leaves the depot every 18 minutes and a tram leaves every 24 minutes. They both leave together at 9:00 a.m. At what time do they NEXT leave together?", "options": {"A": "10:12 a.m.", "B": "9:36 a.m.", "C": "10:00 a.m.", "D": "9:42 a.m."}, "fig": "", "passage": "", "qnum": "21"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Three of these words share a hidden property that the fourth does not. Which word does NOT belong with the other three?", "options": {"A": "Listen", "B": "Silent", "C": "Garden", "D": "Tinsel"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Three of these tiles show the SAME shape simply turned (rotated). One tile is a mirror image (a reflection) and cannot be made by turning the others. Which tile is the odd one out?", "options": {"A": "Tile A", "B": "Tile B", "C": "Tile C", "D": "Tile D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"472\" height=\"150\" viewBox=\"0 0 472 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"472\" height=\"150\" fill=\"white\"/><g transform=\"rotate(90 59.0 60)\"><polygon points=\"40,29 60,29 60,69 80,69 80,89 40,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"59\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><g transform=\"rotate(270 177.0 60)\"><polygon points=\"158,29 178,29 178,69 198,69 198,89 158,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"177\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><g transform=\"rotate(180 295.0 60)\"><polygon points=\"276,29 296,29 296,69 316,69 316,89 276,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"295\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><g transform=\"translate(826.0 0) scale(-1 1)\"><polygon points=\"394,29 414,29 414,69 434,69 434,89 394,89\" fill=\"#dbe6f5\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"413\" y=\"135\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "23"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four runners finished a race. Dan finished ahead of Mia. Pavel finished immediately behind Dan. Mia did not finish last. List the runners in finishing order, 1st to 4th. Who came LAST?", "options": {"A": "Mia", "B": "Pavel", "C": "Dan", "D": "Wei"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "How many triangles of ANY size can you count in the figure? It shows a single large triangle with both a left-to-right midline and one internal line drawn from the top vertex straight down to the middle of the base, dividing it into smaller triangular regions.", "options": {"A": "5", "B": "6", "C": "8", "D": "4"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The drama teacher has reserved the school's only minibus, which seats 16, to take the entire cast to the theatre festival in one trip.\"\n\nPROPOSED ASSUMPTION: \"The cast has no more than 16 members.\"\n\nUsing only the information in the statement, is this assumption logical — YES or NO?", "options": {"A": "Yes", "B": "No", "C": "", "D": ""}, "fig": "", "passage": "", "qnum": "26"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every gymnast who reached the national showcase had to score above 9.0 at the qualifying meet. Priya reached the national showcase this year.\"\n\nWhich one of the following MUST be true?", "options": {"A": "Priya is the most talented gymnast in her region.", "B": "Priya scored above 9.0 at every meet she entered.", "C": "Priya scored above 9.0 at the qualifying meet.", "D": "Priya will win the national showcase."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"In a survey of 180 pupils, 120 said they bring a packed lunch from home and the remaining 60 said they buy lunch in the canteen. No pupil reported doing both.\"\n\nCONCLUSIONS:\n(1) More of the surveyed pupils bring a packed lunch than buy lunch in the canteen (120 vs 60).\n(2) Most of the surveyed pupils bring a packed lunch because canteen food is too expensive.\n\nWhich option correctly states whether each conclusion FOLLOWS from the statement?", "options": {"A": "Conclusion 1 follows; Conclusion 2 does not follow.", "B": "Conclusion 1 does not follow; Conclusion 2 follows.", "C": "Both conclusions follow.", "D": "Neither conclusion follows."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS:\n- All members of the orchestra can read music.\n- No one who can read music is in the absolute-beginners' group.\n- Lena is a member of the orchestra.\n\nWhich one of the following conclusions DOES NOT follow from the facts? (Three of these are valid; choose the one that is NOT.)", "options": {"A": "Lena can read music.", "B": "Lena is not in the absolute-beginners' group.", "C": "No member of the orchestra is in the absolute-beginners' group.", "D": "Everyone who can read music is a member of the orchestra."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the town install a pedestrian crossing with traffic lights outside the primary school?\"\n\nThree arguments are offered below. Which one is the STRONGEST argument?", "options": {"A": "No — I drive past that school every day and I find it irritating to stop for a red light.", "B": "Yes — in five comparable towns, official road-safety records showed that pedestrian injuries outside schools fell by about 45% in the two years after a light-controlled crossing was installed.", "C": "No — my cousin once waited a long time at a crossing in another town, so crossings just slow everyone down.", "D": ""}, "fig": "", "passage": "", "qnum": "30"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The science lab is opened for pupils on a given day if, and only if, the lab technician is present that day. On Thursday the science lab was not opened for pupils.\"\n\nWhich one of the following MUST be true?", "options": {"A": "The lab technician was not present on Thursday.", "B": "The science lab is never opened on a Thursday.", "C": "The lab technician was ill on Thursday.", "D": "The science lab will be opened for pupils on Friday."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "69", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "70", "type": "mcq", "section": "Chinese", "stem": "根據短文，林婆婆每天清晨到公園做什麼？<br><span style=\"color:#555\">根据短文，林婆婆每天清晨到公园做什么？</span>", "options": {"A": "打太極拳<br><span style=\"color:#555\">打太极拳</span>", "B": "練習書法<br><span style=\"color:#555\">练习书法</span>", "C": "晨跑健身", "D": "餵流浪貓<br><span style=\"color:#555\">喂流浪猫</span>"}, "fig": "", "passage": "公園的東邊有一個不起眼的小角落，住着幾隻沒有人照顧的流浪貓。牠們瘦弱怕人，一有腳步聲便躲進草叢。林婆婆每天清晨都會帶着一袋貓糧，準時來到那裏餵牠們。起初，街坊都不理解她，覺得她多此一舉，甚至有人嫌貓兒弄髒了環境，私下議論紛紛。可是，無論颳風還是下雨，林婆婆從未間斷過。有一年夏天颱風來襲，狂風暴雨，她仍撐着雨傘，深一腳淺一腳地把貓糧送到角落，自己卻淋得渾身濕透。日子久了，那些原本怕人的貓兒，一見到她的身影就會跑過來，圍着她「喵喵」地叫。漸漸地，街坊們也被她的堅持打動了。住在三樓的陳先生，本來常常抱怨貓兒擾人清夢，後來竟主動買來貓糧，跟林婆婆一起照顧這些小生命；還有幾位街坊輪流清理角落，保持整潔。如今，那個小角落不但乾淨整潔，還成了街坊閒聊、互相問候的地方。一份小小的善意，竟然悄悄改變了整個社區。<br><span style=\"color:#555\">公园的东边有一个不起眼的小角落，住着几只没有人照顾的流浪猫。它们瘦弱怕人，一有脚步声便躲进草丛。林婆婆每天清晨都会带着一袋猫粮，准时来到那里喂它们。起初，街坊都不理解她，觉得她多此一举，甚至有人嫌猫儿弄脏了环境，私下议论纷纷。可是，无论刮风还是下雨，林婆婆从未间 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
