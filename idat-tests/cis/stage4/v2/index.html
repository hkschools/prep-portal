<!DOCTYPE html>
<html lang="en">
<head>

<title>IDAT CIS: Stage 4 (V2)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmXlzvpnHvxI5ILdACyHHZv8HWfNQ08pCP27GmmluJ7lUGiou1izR4e7Gs8LxKLtgo/exec";
const SCHOOL = "CIS", STAGE = "4", VERSION = "2";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the correct word to complete the sentence:\n\nMy sister and ___ walked to the library together after school.", "options": {"A": "I", "B": "me", "C": "myself", "D": "mine"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "Choose the correctly punctuated sentence.", "options": {"A": "The dog wagged it's tail when its owner arrived.", "B": "The dog wagged its tail when it's owner arrived.", "C": "The dog wagged its' tail when its' owner arrived.", "D": "The dog wagged its tail when its owner arrived."}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?\n\nThe new lab assistant proved remarkably PROFICIENT, finishing every task without a single error.", "options": {"A": "cheerful", "B": "skilled", "C": "cautious", "D": "patient"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "Choose the correct verb form to complete the sentence:\n\nBy the time we reached the station, the train ___ already left.", "options": {"A": "has", "B": "have", "C": "having", "D": "had"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "What is the closest meaning of the word FAMISHED in the sentence below?\n\nAfter skipping both breakfast and lunch, Mia was absolutely famished by dinnertime.", "options": {"A": "feeling faint", "B": "extremely thirsty", "C": "extremely hungry", "D": "very tired"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Rewrite the sentence in the passive voice. Choose the best version.\n\nActive: The committee will announce the results tomorrow.", "options": {"A": "The results will announce tomorrow by the committee.", "B": "The results are announced tomorrow by the committee.", "C": "The results will being announced tomorrow by the committee.", "D": "The results will be announced tomorrow by the committee."}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Add a prefix to make the word mean its OPPOSITE.\n\nWhich prefix turns 'visible' into a word meaning 'not visible'?", "options": {"A": "in-", "B": "un-", "C": "dis-", "D": "im-"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Choose the conjunction that best completes the sentence:\n\nWe wanted to play outside, ___ the heavy rain forced us to stay indoors.", "options": {"A": "so", "B": "or", "C": "but", "D": "because"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Which word is the OPPOSITE (antonym) of the underlined word?\n\nThe instructions were remarkably VAGUE, leaving everyone confused.", "options": {"A": "unclear", "B": "lengthy", "C": "precise", "D": "polite"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "You are writing a formal email to your school principal. Choose the most appropriate way to make a request.", "options": {"A": "Hey, can I grab an extra day for the project? Thanks!", "B": "Could you please grant me an extra day to complete the project?", "C": "I would like an extra day, so please make sure I get it.", "D": "I want an extra day for the project, now."}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Complete the analogy.\n\nAUTHOR is to NOVEL as COMPOSER is to ___", "options": {"A": "piano", "B": "orchestra", "C": "audience", "D": "symphony"}, "fig": "", "passage": null, "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "Choose the correct verb to complete the sentence:\n\nNeither the teacher nor the students ___ aware of the schedule change.", "options": {"A": "was", "B": "were", "C": "is", "D": "has been"}, "fig": "", "passage": null, "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "All four words mean roughly 'thin'. Which word has the MOST clearly NEGATIVE, unhealthy connotation?", "options": {"A": "slender", "B": "lean", "C": "scrawny", "D": "slim"}, "fig": "", "passage": null, "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "What does the idiom 'to bite off more than you can chew' mean in the sentence below?\n\nBy signing up for five clubs at once, Daniel had bitten off more than he could chew.", "options": {"A": "to take on more than you can handle", "B": "to eat food too quickly", "C": "to make a difficult decision bravely", "D": "to argue with a friend"}, "fig": "", "passage": null, "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "Choose the relative pronoun that best completes the sentence:\n\nThe science museum, ___ we visited last spring, has just opened a new robotics gallery.", "options": {"A": "who", "B": "what", "C": "where", "D": "which"}, "fig": "", "passage": null, "qnum": 15}, {"n": 17, "type": "mcq", "section": "English", "stem": "According to the writer, what does finding information in a library require that an online search does not?", "options": {"A": "A paid subscription", "B": "Patience to browse and compare sources", "C": "Permission from a teacher", "D": "A fast internet connection"}, "fig": "", "passage": "<strong>Why Every School Should Keep a Library</strong><br>Some people argue that school libraries are relics of the past. Why keep shelves of paper books, they ask, when every fact a student needs is a tap away on a phone? I believe this view is badly mistaken. A school library is not simply a storehouse of information; it is one of the most valuable spaces a school can offer, and we abandon it at our peril.<br><br>Consider first what a library teaches that a search engine cannot. Online, the first answer is usually the one we accept, whether or not it is true. In a library, finding what you need takes patience: you browse, you compare sources, you stumble upon a book you were not looking for and discover an idea you never expected. This slow, curious kind of reading builds exactly the deep attention that screens so often destroy.<br><br>A library is also one of the few quiet, shared spaces left in a busy school. It belongs to everyone equally, the confident reader and the struggling one alike. A student who cannot afford a single book at home can, in the library, hold a hundred. To close that door is to widen the gap between those who have and those who do not.<br><br>Of course, schools should embrace technology, and good libraries already do. But a screen and a shelf are not enemies. The wisest schools keep both, because they understand a simple truth: a library is not really about books at all. It is about giving every young person the time, the space, and the freedom to think.", "qnum": 16}, {"n": 18, "type": "mcq", "section": "English", "stem": "What is the closest meaning of the word RELICS as it is used in the first paragraph ('school libraries are relics of the past')?", "options": {"A": "outdated things left over from an earlier time", "B": "expensive pieces of equipment", "C": "valuable treasures worth protecting", "D": "newly invented tools"}, "fig": "", "passage": "<strong>Why Every School Should Keep a Library</strong><br>Some people argue that school libraries are relics of the past. Why keep shelves of paper books, they ask, when every fact a student needs is a tap away on a phone? I believe this view is badly mistaken. A school library is not simply a storehouse of information; it is one of the most valuable spaces a school can offer, and we abandon it at our peril.<br><br>Consider first what a library teaches that a search engine cannot. Online, the first answer is usually the one we accept, whether or not it is true. In a library, finding what you need takes patience: you browse, you compare sources, you stumble upon a book you were not looking for and discover an idea you never expected. This slow, curious kind of reading builds exactly the deep attention that screens so often destroy.<br><br>A library is also one of the few quiet, shared spaces left in a busy school. It belongs to everyone equally, the confident reader and the struggling one alike. A student who cannot afford a single book at home can, in the library, hold a hundred. To close that door is to widen the gap between those who have and those who do not.<br><br>Of course, schools should embrace technology, and good libraries already do. But a screen and a shelf are not enemies. The wisest schools keep both, because they understand a simple truth: a library is not really about books at all. It is about giving every young person the time, the space, and the freedom to think.", "qnum": 17}, {"n": 19, "type": "mcq", "section": "English", "stem": "Which sentence best describes the writer's overall point of view?", "options": {"A": "School libraries should be replaced by online resources to save money.", "B": "Technology has no useful place in a modern school.", "C": "Schools should keep libraries because they offer things technology cannot replace.", "D": "Reading paper books is the only way to learn anything worthwhile."}, "fig": "", "passage": "<strong>Why Every School Should Keep a Library</strong><br>Some people argue that school libraries are relics of the past. Why keep shelves of paper books, they ask, when every fact a student needs is a tap away on a phone? I believe this view is badly mistaken. A school library is not simply a storehouse of information; it is one of the most valuable spaces a school can offer, and we abandon it at our peril.<br><br>Consider first what a library teaches that a search engine cannot. Online, the first answer is usually the one we accept, whether or not it is true. In a library, finding what you need takes patience: you browse, you compare sources, you stumble upon a book you were not looking for and discover an idea you never expected. This slow, curious kind of reading builds exactly the deep attention that screens so often destroy.<br><br>A library is also one of the few quiet, shared spaces left in a busy school. It belongs to everyone equally, the confident reader and the struggling one alike. A student who cannot afford a single book at home can, in the library, hold a hundred. To close that door is to widen the gap between those who have and those who do not.<br><br>Of course, schools should embrace technology, and good libraries already do. But a screen and a shelf are not enemies. The wisest schools keep both, because they understand a simple truth: a library is not really about books at all. It is about giving every young person the time, the space, and the freedom to think.", "qnum": 18}, {"n": 20, "type": "mcq", "section": "English", "stem": "From the third paragraph, what can we infer about the writer's concern for fairness?", "options": {"A": "The writer thinks wealthy students read more than others.", "B": "The writer believes libraries help reduce inequality between students.", "C": "The writer wants libraries to charge a small fee for books.", "D": "The writer feels struggling readers should study separately."}, "fig": "", "passage": "<strong>Why Every School Should Keep a Library</strong><br>Some people argue that school libraries are relics of the past. Why keep shelves of paper books, they ask, when every fact a student needs is a tap away on a phone? I believe this view is badly mistaken. A school library is not simply a storehouse of information; it is one of the most valuable spaces a school can offer, and we abandon it at our peril.<br><br>Consider first what a library teaches that a search engine cannot. Online, the first answer is usually the one we accept, whether or not it is true. In a library, finding what you need takes patience: you browse, you compare sources, you stumble upon a book you were not looking for and discover an idea you never expected. This slow, curious kind of reading builds exactly the deep attention that screens so often destroy.<br><br>A library is also one of the few quiet, shared spaces left in a busy school. It belongs to everyone equally, the confident reader and the struggling one alike. A student who cannot afford a single book at home can, in the library, hold a hundred. To close that door is to widen the gap between those who have and those who do not.<br><br>Of course, schools should embrace technology, and good libraries already do. But a screen and a shelf are not enemies. The wisest schools keep both, because they understand a simple truth: a library is not really about books at all. It is about giving every young person the time, the space, and the freedom to think.", "qnum": 19}, {"n": 21, "type": "mcq", "section": "English", "stem": "Which sentence best states the main idea of the passage?", "options": {"A": "School libraries remain essential because they offer learning, quiet space, and fairness that technology alone cannot provide.", "B": "Search engines usually give students the wrong answers.", "C": "Paper books are always better than digital screens for every subject.", "D": "Schools spend too much money on new technology."}, "fig": "", "passage": "<strong>Why Every School Should Keep a Library</strong><br>Some people argue that school libraries are relics of the past. Why keep shelves of paper books, they ask, when every fact a student needs is a tap away on a phone? I believe this view is badly mistaken. A school library is not simply a storehouse of information; it is one of the most valuable spaces a school can offer, and we abandon it at our peril.<br><br>Consider first what a library teaches that a search engine cannot. Online, the first answer is usually the one we accept, whether or not it is true. In a library, finding what you need takes patience: you browse, you compare sources, you stumble upon a book you were not looking for and discover an idea you never expected. This slow, curious kind of reading builds exactly the deep attention that screens so often destroy.<br><br>A library is also one of the few quiet, shared spaces left in a busy school. It belongs to everyone equally, the confident reader and the struggling one alike. A student who cannot afford a single book at home can, in the library, hold a hundred. To close that door is to widen the gap between those who have and those who do not.<br><br>Of course, schools should embrace technology, and good libraries already do. But a screen and a shelf are not enemies. The wisest schools keep both, because they understand a simple truth: a library is not really about books at all. It is about giving every young person the time, the space, and the freedom to think.", "qnum": 20}, {"n": 22, "type": "writing", "section": "English Writing", "intro": "Everyone has a place where they feel completely at ease.", "label": "", "body": "Describe a place that is special to you and explain why it matters. Include details about what you can see, hear, or feel there.", "hint": "Write at least 7 to 8 sentences.", "placeholder": "Type your response here…", "partA": "Describe a place that is special to you and explain why it matters. Include details about what you can see, hear, or feel there.", "partB": ""}, {"n": 23, "type": "info", "title": "English Listening &amp; Speaking", "body": "<div class='info-body'>In the real test this section is delivered by an on-screen avatar: you listen and then speak your answers aloud into the microphone. There is nothing to type or record here, the sample questions below show the kind of thing you'll be asked, so you can practise out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Introduce yourself and tell me about your interests outside school.</li><li style='margin:7px 0'>Describe a challenge you faced and how you dealt with it.</li><li style='margin:7px 0'>What does being a good friend mean to you?</li><li style='margin:7px 0'>Talk about a place you would like to visit and explain why.</li><li style='margin:7px 0'>Listen to a short talk, then summarise the main points.</li></ul>"}, {"n": 24, "type": "info", "title": "Mathematics, Logic &amp; Critical Thinking", "body": "One combined section. Read each question carefully and choose the best answer."}, {"n": 25, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which expression is equal to 6(2x + 5)?", "options": {"A": "12x + 5", "B": "12x + 30", "C": "8x + 11", "D": "6x + 30"}, "fig": "", "passage": null, "qnum": 21}, {"n": 26, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Simplify: 7a + 3b - 2a + 5b", "options": {"A": "5a + 8b", "B": "9a + 2b", "C": "5a + 2b", "D": "9a + 8b"}, "fig": "", "passage": null, "qnum": 22}, {"n": 27, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Order from least to greatest: -7, 3, -12, 0, -5", "options": {"A": "-12, -7, -5, 3, 0", "B": "-5, -7, -12, 0, 3", "C": "-12, -7, -5, 0, 3", "D": "3, 0, -5, -7, -12"}, "fig": "", "passage": null, "qnum": 23}, {"n": 28, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A recipe uses flour and sugar in the ratio 3 : 2. If 12 cups of flour are used, how many cups of sugar are needed?", "options": {"A": "18", "B": "6", "C": "8", "D": "4"}, "fig": "", "passage": null, "qnum": 24}, {"n": 29, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Evaluate: -6 + 15 - 9 + 4", "options": {"A": "-4", "B": "22", "C": "16", "D": "4"}, "fig": "", "passage": null, "qnum": 25}, {"n": 30, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which fraction is equivalent to 3/5?", "options": {"A": "6/15", "B": "8/10", "C": "3/10", "D": "9/15"}, "fig": "", "passage": null, "qnum": 26}, {"n": 31, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 2/3 + 1/6", "options": {"A": "3/9", "B": "5/6", "C": "3/6", "D": "2/9"}, "fig": "", "passage": null, "qnum": 27}, {"n": 32, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which is equal to 0.75?", "options": {"A": "3/4", "B": "7/5", "C": "1/75", "D": "75/10"}, "fig": "", "passage": null, "qnum": 28}, {"n": 33, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 4.6 - 1.85", "options": {"A": "2.75", "B": "2.95", "C": "2.85", "D": "3.25"}, "fig": "", "passage": null, "qnum": 29}, {"n": 34, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 0.6 × 0.4", "options": {"A": "2.4", "B": "0.024", "C": "0.24", "D": "24"}, "fig": "", "passage": null, "qnum": 30}, {"n": 35, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A triangle has sides 7 cm, 9 cm and 11 cm. What is its perimeter?", "options": {"A": "27 cm", "B": "99 cm", "C": "63 cm", "D": "36 cm"}, "fig": "", "passage": null, "qnum": 31}, {"n": 36, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Solve for x: 3x - 7 = 20", "options": {"A": "13/3", "B": "4", "C": "9", "D": "81"}, "fig": "", "passage": null, "qnum": 32}, {"n": 37, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Two angles of a triangle are shown. What is the size of the third angle?", "options": {"A": "115°", "B": "75°", "C": "50°", "D": "65°"}, "fig": "", "passage": null, "qnum": 33}, {"n": 38, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A jacket originally costs $400. In a sale it is reduced by 25%. What is the sale price?", "options": {"A": "$375", "B": "$300", "C": "$100", "D": "$320"}, "fig": "", "passage": null, "qnum": 34}, {"n": 39, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A cuboid measures 5 cm × 3 cm × 4 cm. What is its volume?", "options": {"A": "12 cm³", "B": "60 cm³", "C": "94 cm³", "D": "15 cm³"}, "fig": "", "passage": null, "qnum": 35}, {"n": 40, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Calculate: 3 + 4 × 5 - 2", "options": {"A": "33", "B": "13", "C": "35", "D": "21"}, "fig": "", "passage": null, "qnum": 36}, {"n": 41, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this number sequence. Each term follows the same two-step rule that repeats: 80, 40, 44, 22, 26, 13, ___. What number comes next?", "options": {"A": "30", "B": "17", "C": "9", "D": "26"}, "fig": "", "passage": null, "qnum": 37}, {"n": 42, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A bus leaves the depot every 18 minutes starting at 07:00. Mei arrives at the stop at 08:05. The journey to school takes 26 minutes. School starts at 08:45. Which is the latest bus Mei can catch and still arrive on time, and does she make it?", "options": {"A": "The 07:54 bus, arriving 08:20, on time", "B": "The 08:00 bus, arriving 08:26, on time", "C": "The 08:12 bus, arriving 08:38, on time", "D": "The 08:30 bus, arriving 08:56, too late"}, "fig": "", "passage": null, "qnum": 38}, {"n": 43, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Four words are listed. Three share a hidden property that the fourth does not. Which word does NOT belong: JUPITER, MARS, COMET, SATURN?", "options": {"A": "COMET", "B": "MARS", "C": "SATURN", "D": "JUPITER"}, "fig": "", "passage": null, "qnum": 39}, {"n": 44, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The left panel shows an arrow pointing straight up. After a single rotation it points straight down, as shown in the right panel. Which single rotation maps the left arrow onto the right arrow?", "options": {"A": "90° clockwise", "B": "180°", "C": "270° anticlockwise", "D": "90° anticlockwise"}, "fig": "<svg viewBox=\"0 0 160 160\" width=\"160\" height=\"160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"160\" height=\"160\" fill=\"#ffffff\"/><line x1=\"80\" y1=\"78\" x2=\"80\" y2=\"32\" stroke=\"#27406b\" stroke-width=\"3\"/><line x1=\"80\" y1=\"32\" x2=\"86.5\" y2=\"43.3\" stroke=\"#27406b\" stroke-width=\"3\"/><line x1=\"80\" y1=\"32\" x2=\"73.5\" y2=\"43.3\" stroke=\"#27406b\" stroke-width=\"3\"/><text x=\"80\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5b6b7a\">Starting position</text></svg>", "passage": null, "qnum": 40}, {"n": 45, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at the figure: a square with both diagonals drawn from corner to corner. How many triangles can you count in total?", "options": {"A": "4", "B": "6", "C": "8", "D": "10"}, "fig": "<svg viewBox=\"0 0 200 200\" width=\"200\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"200\" height=\"200\" fill=\"#ffffff\"/><rect x=\"40\" y=\"40\" width=\"120\" height=\"120\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><line x1=\"40\" y1=\"40\" x2=\"160\" y2=\"160\" stroke=\"#27406b\" stroke-width=\"2\"/><line x1=\"160\" y1=\"40\" x2=\"40\" y2=\"160\" stroke=\"#27406b\" stroke-width=\"2\"/></svg>", "passage": null, "qnum": 41}, {"n": 46, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Our school library should stay open until 8 p.m. on weekdays so that students who travel a long way home can finish their group projects before they leave.\"\n\nPROPOSED ASSUMPTION: \"At least some students do group projects in the evening (before going home).\"\n\nUsing only the information in the statement, is this assumption logical?", "options": {"A": "Yes", "B": "No", "C": "(suppress, 2-option item)", "D": "(suppress, 2-option item)"}, "fig": "", "passage": null, "qnum": 42}, {"n": 47, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every student in Year 9 who passed the swimming test was allowed to join the kayaking trip. Mei is in Year 9 and she joined the kayaking trip.\"\n\nWhich of the following MUST be true?", "options": {"A": "Mei passed the swimming test.", "B": "Passing the swimming test was, on its own, enough for a Year 9 student to be allowed to join the kayaking trip.", "C": "Every Year 9 student joined the kayaking trip.", "D": "Any Year 9 student who failed the swimming test was banned from all school trips."}, "fig": "", "passage": null, "qnum": 43}, {"n": 48, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS:\n• All members of the debate club must take a public-speaking workshop.\n• No one who takes the public-speaking workshop is allowed to skip the end-of-term showcase.\n• Raj is a member of the debate club.\n\nWhich conclusion does NOT follow from the facts?", "options": {"A": "Raj must take the public-speaking workshop.", "B": "Raj is not allowed to skip the end-of-term showcase.", "C": "Anyone who skips the showcase is not a debate-club member.", "D": "Everyone who is not allowed to skip the showcase is a debate-club member."}, "fig": "", "passage": null, "qnum": 44}, {"n": 49, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the city add a separated cycle lane along Harbour Road?\"\n\nThree arguments are offered below.\nWhich is the STRONGEST argument?", "options": {"A": "No, change is usually a bad idea, and the road has been fine the way it is for years.", "B": "Yes, I really enjoy cycling and I would feel much happier riding to school every day if there were a proper lane.", "C": "Yes, in three comparable cities, separated cycle lanes reduced cyclist injuries on similar roads by about 40% within two years, according to published transport-department data.", "D": "(suppress, 3-argument item)"}, "fig": "", "passage": null, "qnum": 45}, {"n": 50, "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"At this year's school science fair, every project that won a prize was the work of a team of at least three students. The robotics project won a prize.\"\n\nCONCLUSIONS:\n1. The robotics project was made by a team of at least three students.\n2. Every team of at least three students won a prize.\n\nUsing ONLY the information in the statement, which of the following is correct?", "options": {"A": "Conclusion 1 follows, but Conclusion 2 does not.", "B": "Conclusion 2 follows, but Conclusion 1 does not.", "C": "Both Conclusion 1 and Conclusion 2 follow.", "D": "Neither Conclusion 1 nor Conclusion 2 follows."}, "fig": "", "passage": null, "qnum": 46}, {"n": 51, "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 簡体.)"}, {"n": 52, "type": "mcq", "section": "Chinese", "stem": "根據短文，王伯伯堅持親手養蜂，主要是因為： <br><span style=\"color:#555\">根据短文，王伯伯坚持亲手养蜂，主要是因为：</span>", "options": {"A": "他想藉此賺取更多金錢<br><span style=\"color:#555\">他想借此赚取更多金钱</span>", "B": "他重視從中體會到的耐心與責任<br><span style=\"color:#555\">他重视从中体会到的耐心与责任</span>", "C": "他害怕別人偷走他的蜜蜂<br><span style=\"color:#555\">他害怕别人偷走他的蜜蜂</span>", "D": "他要證明自己比鄰居更勤勞<br><span style=\"color:#555\">他要证明自己比邻居更勤劳</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>小區的盡頭有一座小花園，是王伯伯一手打理的。十多年來，他每天清晨都來照料那幾箱蜜蜂，從未間斷。蜜蜂在花叢間穿梭，嗡嗡作響，為寧靜的早晨添了幾分生機。王伯伯動作輕柔，一絲不苟地查看每一格蜂巢，臉上始終帶著淺淺的笑意。有鄰居曾出價向他買蜜，他都婉拒了；鄰居都說養蜂辛苦，他卻不以為意，因為他不為牟利，只為那份在等待中磨練出來的耐心。每逢收成，他總把香甜的蜂蜜分送給左鄰右舍，自己只留下一小罐。日復一日，他在這方小天地裏，收穫的遠不止是蜂蜜。</div><div><em>簡体</em><br>小区的尽头有一座小花园，是王伯伯一手打理的。十多年来，他每天清晨都来照料那几箱蜜蜂，从未间断。蜜蜂在花丛间穿梭，嗡嗡作响，为宁静的早晨添了几分生机。王伯伯动作轻柔，一丝不苟地查看每一格蜂巢，脸上始终带着浅浅的笑意。有邻居曾出价向他买蜜，他都婉拒了；邻居都说养蜂辛苦，他却不以为意，因为他不为牟利，只为那份在等待中磨练出来的耐心。每逢收成，他总把香甜的蜂蜜分送给左邻右舍，自己只留下一小罐。日复一日，他在这方小天地里，收获的远不止是蜂蜜。</div>", "qnum": 47}, {"n": 53, "type": "mcq", "section": "Chinese", "stem": "短文末句「他在這方小天地裏，收穫的遠不止是蜂蜜」，最可能是指王伯伯還收穫了： <br><span style=\"color:#555\">短文末句「他在这方小天地里，收获的远不止是蜂蜜」，最可能是指王伯伯还收获了：</span>", "options": {"A": "一筆可觀的賣蜜收入<br><span style=\"color:#555\">一笔可观的卖蜜收入</span>", "B": "更多可以養蜂的箱子<br><span style=\"color:#555\">更多可以养蜂的箱子</span>", "C": "鄰居送來的各種禮物<br><span style=\"color:#555\">邻居送来的各种礼物</span>", "D": "內心的滿足、耐心與鄰里的情誼<br><span style=\"color:#555\">内心的满足、耐心与邻里的情谊</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>小區的盡頭有一座小花園，是王伯伯一手打理的。十多年來，他每天清晨都來照料那幾箱蜜蜂，從未間斷。蜜蜂在花叢間穿梭，嗡嗡作響，為寧靜的早晨添了幾分生機。王伯伯動作輕柔，一絲不苟地查看每一格蜂巢，臉上始終帶著淺淺的笑意。有鄰居曾出價向他買蜜，他都婉拒了；鄰居都說養蜂辛苦，他卻不以為意，因為他不為牟利，只為那份在等待中磨練出來的耐心。每逢收成，他總把香甜的蜂蜜分送給左鄰右舍，自己只留下一小罐。日復一日，他在這方小天地裏，收穫的遠不止是蜂蜜。</div><div><em>簡体</em><br>小区的尽头有一座小花园，是王伯伯一手打理的。十多年来，他每天清晨都来照料那几箱蜜蜂，从未间断。蜜蜂在花丛间穿梭，嗡嗡作响，为宁静的早晨添了几分生机。王伯伯动作轻柔，一丝不苟地查看每一格蜂巢，脸上始终带着浅浅的笑意。有邻居曾出价向他买蜜，他都婉拒了；邻居都说养蜂辛苦，他却不以为意，因为他不为牟利，只为那份在等待中磨练出来的耐心。每逢收成，他总把香甜的蜂蜜分送给左邻右舍，自己只留下一小罐。日复一日，他在这方小天地里，收获的远不止是蜂蜜。</div>", "qnum": 48}, {"n": 54, "type": "mcq", "section": "Chinese", "stem": "作者描寫蜜蜂「在花叢間穿梭」，主要作用是： <br><span style=\"color:#555\">作者描写蜜蜂「在花丛间穿梭」，主要作用是：</span>", "options": {"A": "說明花園面積十分廣大<br><span style=\"color:#555\">说明花园面积十分广大</span>", "B": "以生動畫面襯托養蜂生活的勃勃生機<br><span style=\"color:#555\">以生动画面衬托养蜂生活的勃勃生机</span>", "C": "暗示蜜蜂即將離巢飛走<br><span style=\"color:#555\">暗示蜜蜂即将离巢飞走</span>", "D": "提醒讀者蜜蜂會螫人<br><span style=\"color:#555\">提醒读者蜜蜂会螫人</span>"}, "fig": "", "passage": "<div style='margin-bottom:8px'><em>繁體</em><br>小區的盡頭有一座小花園，是王伯伯一手打理的。十多年來，他每天清晨都來照料那幾箱蜜蜂，從未間斷。蜜蜂在花叢間穿梭，嗡嗡作響，為寧靜的早晨添了幾分生機。王伯伯動作輕柔，一絲不苟地查看每一格蜂巢，臉上始終帶著淺淺的笑意。有鄰居曾出價向他買蜜，他都婉拒了；鄰居都說養蜂辛苦，他卻不以為意，因為他不為牟利，只為那份在等待中磨練出來的耐心。每逢收成，他總把香甜的蜂蜜分送給左鄰右舍，自己只留下一小罐。日復一日，他在這方小天地裏，收穫的遠不止是蜂蜜。</div><div><em>簡体</em><br>小区的尽头有一座小花园，是王伯伯一手打理的。十多年来，他每天清晨都来照料那几箱蜜蜂，从未间断。蜜蜂在花丛间穿梭，嗡嗡作响，为宁静的早晨添了几分生机。王伯伯动作轻柔，一丝不苟地查看每一格蜂巢，脸上始终带着浅浅的笑意。有邻居曾出价向他买蜜，他都婉拒了；邻居都说养蜂辛苦，他却不以为意，因为他不为牟利，只为那份在等待中磨练出来的耐心。每逢收成，他总把香甜的蜂蜜分送给左邻右舍，自己只留下一小罐。日复一日，他在这方小天地里，收获的远不止是蜂蜜。</div>", "qnum": 49}, {"n": 55, "type": "mcq", "section": "Chinese", "stem": "綜觀全文，作者對王伯伯的態度是： <br r(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 1 / 题目 1</b><br>《克服困難的經歷》, , 記敘一次你面對困難並努力克服的過程，談談你的體會（不少於 10 句）。<br><span style='color:#555'>《克服困难的经历》, , 记叙一次你面对困难并努力克服的过程，谈谈你的体会（不少于 10 句）。</span></div><div style='background:var(-bg);border:1px solid var(-line);border-radius:10px;padding:12px 14px;margin:10px 0'><b>題目 2 / 题目 2</b><br>《給三年後自己的一封信》, , 談談你的期望、目標與計劃（不少於 10 句）。<br><span style='color:#555'>《给三年后自己的一封信》, , 谈谈你的期望、目标与计划（不少于 10 句）。</span></div>"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 (V2)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
