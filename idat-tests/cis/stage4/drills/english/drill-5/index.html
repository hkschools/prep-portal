<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 4 English Drill 5</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT CIS: Stage 4 English Drill 5</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "4", VERSION = "ENG-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which of these extracts is written in the third person, staying inside ONE character's head?", "options": {"A": "I counted the coins twice and could not make them come to enough.", "B": "Ravi counted the coins twice. He could not make them come to enough, and he did not want to look up.", "C": "You count the coins twice and they still will not come to enough.", "D": "Ravi counted the coins twice, while behind the counter the shopkeeper wondered whether to help."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which sentence uses a RELATIVE CLAUSE to add information about a noun?", "options": {"A": "The bridge, which had been closed for two years, reopened in May.", "B": "The bridge reopened in May after two years.", "C": "The bridge had been closed and it reopened in May.", "D": "Because the bridge had been closed, the detour was long."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "A paragraph has just explained why the old hall was demolished. The next paragraph will describe the building that replaced it. Which sentence LINKS them best?", "options": {"A": "The hall was demolished in the summer of 1998.", "B": "The new building has four floors and a glass entrance.", "C": "Many people were sorry to see the old hall go.", "D": "What went up in its place, however, satisfied almost nobody either."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which word describes agreement that is given unwillingly?", "options": {"A": "Enthusiastic", "B": "Unanimous", "C": "Grudging", "D": "Immediate"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.<br>He was ____ to find that he had come on the wrong day.", "options": {"A": "embarassed", "B": "embarrassed", "C": "embarrased", "D": "embarased"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which sentence turns the passive sentence below into the ACTIVE voice?<br>The window had been broken by a stray ball.", "options": {"A": "The window broke.", "B": "A stray ball was breaking the window.", "C": "The window had broken itself.", "D": "A stray ball had broken the window."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the correct form of the word in brackets to complete the sentence.<br>Her report was admirably (economy) with words.", "options": {"A": "economy", "B": "economically", "C": "economical", "D": "economic"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "What does this saying mean?<br>\"That is only the tip of the iceberg.\"", "options": {"A": "It is a small visible part of a much larger problem", "B": "It is a problem that will soon melt away", "C": "It is the coldest part of a difficult situation", "D": "It is the last part of a problem to be solved"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the word closest in meaning to the underlined word.<br>Further argument at that point would have been <u>futile</u>.", "options": {"A": "impolite", "B": "premature", "C": "pointless", "D": "exhausting"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which word is close in meaning to the underlined word but describes a STRONGER reaction?<br>The crowd was <u>surprised</u> by the result.", "options": {"A": "puzzled", "B": "interested", "C": "pleased", "D": "astounded"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "In Text A, why did the grandmother walk the whole length of the market before buying anything?", "options": {"A": "Because she disliked the traders at the first stall.", "B": "So that she knew every price and every shortage before she chose.", "C": "Because the fish stalls were at the far end of the hall.", "D": "To make the walk to the market worth the journey."}, "fig": "", "passage": "<strong>Two texts about the same market</strong><br><p><b>TEXT A</b>: from a memoir</p><p>My grandmother shopped at Bellin Street on Tuesdays because that was the day the fish came. We went at seven, before the crowds, and she made me carry the basket so that I would learn what a week's food weighed.</p><p>She never bought from the first stall. She walked the whole length of the market, said nothing to anybody, and then walked back to whichever stall she had decided on. It took twenty minutes and it looked like idleness. It was not. By the time she stopped she knew what everything cost and who had run out of what.</p><p>I still cannot walk into a market without going round it once before I buy anything, and I have never once regretted the twenty minutes.</p><p><b>TEXT B</b>: from a city guidebook</p><p>Bellin Street Market, established in 1874, occupies two covered halls off the north end of Bellin Street. Around ninety traders sell fresh produce, fish, cheese and flowers.</p><p>The market opens from 6 am to 2 pm, Tuesday to Saturday. Tuesday is the principal fish day and is correspondingly busy; visitors who dislike crowds are advised to arrive before eight or after midday.</p><p>Prices vary noticeably between traders and it is worth comparing several stalls before buying. Cash is preferred at many stalls. The nearest station is Bellin Road, five minutes' walk to the south.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "One piece of practical advice appears in BOTH texts, though each gives it differently. What is it?", "options": {"A": "Compare several stalls before buying anything.", "B": "Arrive before eight in the morning.", "C": "Bring cash rather than a card.", "D": "Avoid the market on Tuesdays."}, "fig": "", "passage": "<strong>Two texts about the same market</strong><br><p><b>TEXT A</b>: from a memoir</p><p>My grandmother shopped at Bellin Street on Tuesdays because that was the day the fish came. We went at seven, before the crowds, and she made me carry the basket so that I would learn what a week's food weighed.</p><p>She never bought from the first stall. She walked the whole length of the market, said nothing to anybody, and then walked back to whichever stall she had decided on. It took twenty minutes and it looked like idleness. It was not. By the time she stopped she knew what everything cost and who had run out of what.</p><p>I still cannot walk into a market without going round it once before I buy anything, and I have never once regretted the twenty minutes.</p><p><b>TEXT B</b>: from a city guidebook</p><p>Bellin Street Market, established in 1874, occupies two covered halls off the north end of Bellin Street. Around ninety traders sell fresh produce, fish, cheese and flowers.</p><p>The market opens from 6 am to 2 pm, Tuesday to Saturday. Tuesday is the principal fish day and is correspondingly busy; visitors who dislike crowds are advised to arrive before eight or after midday.</p><p>Prices vary noticeably between traders and it is worth comparing several stalls before buying. Cash is preferred at many stalls. The nearest station is Bellin Road, five minutes' walk to the south.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "The two texts agree on the facts they share. What is the main difference between them?", "options": {"A": "Text A is written to help a visitor use the market; Text B to convey a memory.", "B": "Text A is accurate and Text B is not.", "C": "Both texts are written to persuade the reader to visit the market.", "D": "Text A is written to convey what the market taught the writer; Text B to help a visitor use it."}, "fig": "", "passage": "<strong>Two texts about the same market</strong><br><p><b>TEXT A</b>: from a memoir</p><p>My grandmother shopped at Bellin Street on Tuesdays because that was the day the fish came. We went at seven, before the crowds, and she made me carry the basket so that I would learn what a week's food weighed.</p><p>She never bought from the first stall. She walked the whole length of the market, said nothing to anybody, and then walked back to whichever stall she had decided on. It took twenty minutes and it looked like idleness. It was not. By the time she stopped she knew what everything cost and who had run out of what.</p><p>I still cannot walk into a market without going round it once before I buy anything, and I have never once regretted the twenty minutes.</p><p><b>TEXT B</b>: from a city guidebook</p><p>Bellin Street Market, established in 1874, occupies two covered halls off the north end of Bellin Street. Around ninety traders sell fresh produce, fish, cheese and flowers.</p><p>The market opens from 6 am to 2 pm, Tuesday to Saturday. Tuesday is the principal fish day and is correspondingly busy; visitors who dislike crowds are advised to arrive before eight or after midday.</p><p>Prices vary noticeably between traders and it is worth comparing several stalls before buying. Cash is preferred at many stalls. The nearest station is Bellin Road, five minutes' walk to the south.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Text A says the grandmother made the writer carry the basket \"so that I would learn what a week's food weighed\". What does this detail mainly show?", "options": {"A": "That the basket was too heavy for her to carry.", "B": "That she taught by making him experience things rather than by explaining them.", "C": "That she bought more food than the family needed.", "D": "That she wanted him to complain less about errands."}, "fig": "", "passage": "<strong>Two texts about the same market</strong><br><p><b>TEXT A</b>: from a memoir</p><p>My grandmother shopped at Bellin Street on Tuesdays because that was the day the fish came. We went at seven, before the crowds, and she made me carry the basket so that I would learn what a week's food weighed.</p><p>She never bought from the first stall. She walked the whole length of the market, said nothing to anybody, and then walked back to whichever stall she had decided on. It took twenty minutes and it looked like idleness. It was not. By the time she stopped she knew what everything cost and who had run out of what.</p><p>I still cannot walk into a market without going round it once before I buy anything, and I have never once regretted the twenty minutes.</p><p><b>TEXT B</b>: from a city guidebook</p><p>Bellin Street Market, established in 1874, occupies two covered halls off the north end of Bellin Street. Around ninety traders sell fresh produce, fish, cheese and flowers.</p><p>The market opens from 6 am to 2 pm, Tuesday to Saturday. Tuesday is the principal fish day and is correspondingly busy; visitors who dislike crowds are advised to arrive before eight or after midday.</p><p>Prices vary noticeably between traders and it is worth comparing several stalls before buying. Cash is preferred at many stalls. The nearest station is Bellin Road, five minutes' walk to the south.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "A reader who has read both texts knows something that neither text states on its own. Which is it?", "options": {"A": "The grandmother's seven o'clock arrival was early enough to beat the Tuesday crowds.", "B": "The market has been open since 1874.", "C": "Prices at the market vary between stalls.", "D": "The writer of Text A still shops at Bellin Street."}, "fig": "", "passage": "<strong>Two texts about the same market</strong><br><p><b>TEXT A</b>: from a memoir</p><p>My grandmother shopped at Bellin Street on Tuesdays because that was the day the fish came. We went at seven, before the crowds, and she made me carry the basket so that I would learn what a week's food weighed.</p><p>She never bought from the first stall. She walked the whole length of the market, said nothing to anybody, and then walked back to whichever stall she had decided on. It took twenty minutes and it looked like idleness. It was not. By the time she stopped she knew what everything cost and who had run out of what.</p><p>I still cannot walk into a market without going round it once before I buy anything, and I have never once regretted the twenty minutes.</p><p><b>TEXT B</b>: from a city guidebook</p><p>Bellin Street Market, established in 1874, occupies two covered halls off the north end of Bellin Street. Around ninety traders sell fresh produce, fish, cheese and flowers.</p><p>The market opens from 6 am to 2 pm, Tuesday to Saturday. Tuesday is the principal fish day and is correspondingly busy; visitors who dislike crowds are advised to arrive before eight or after midday.</p><p>Prices vary noticeably between traders and it is worth comparing several stalls before buying. Cash is preferred at many stalls. The nearest station is Bellin Road, five minutes' walk to the south.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the writing is typed on a keyboard and you choose ONE of the two tasks below. At this stage the text type is a personal OPINION essay: take a position and argue for it.", "label": "", "body": "", "hint": "Answer EVERY part of the task you choose. Open with your opinion and give each paragraph one point to make. Deal with at least one argument on the other side. Vary your sentence types, choose precise words rather than approximate ones, and check the spelling of your longer words before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "TASK 1\nSome things are better learned by doing them than by being told about them. Do you agree? Give your opinion, support it with something you learned this way, describe one thing you think is better taught by explanation, and say what makes the two cases different.", "partB": "TASK 2\nA habit you were taught as a young child has stayed with you. Write about whether you are glad of it. Explain what the habit is and who taught it to you, say what it has cost you as well as what it has given you, and say whether you would pass it on."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 English Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
</html>
