<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 4 English Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT CIS: Stage 4 English Drill 4</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "4", VERSION = "ENG-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which rewriting turns the sentence below into the FIRST person?<br>She locked the gate behind her and did not look back at the house.", "options": {"A": "You locked the gate behind you and did not look back at the house.", "B": "I locked the gate behind me and did not look back at the house.", "C": "She locked the gate behind me and did not look back at the house.", "D": "They locked the gate behind them and did not look back at the house."}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which sentence BEGINS with a subordinate clause?", "options": {"A": "We missed the connecting train because the ferry was delayed.", "B": "The ferry was delayed and we missed the connecting train.", "C": "Because the ferry was delayed, we missed the connecting train.", "D": "The delayed ferry cost us the connecting train."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Four sentences have been jumbled. Which order makes the most sensible paragraph?<br>(i) Within a year it had 300 members.<br>(ii) The club began with six people in a borrowed classroom.<br>(iii) It now runs sessions in three languages.<br>(iv) Word spread first through friends, then through the local paper.", "options": {"A": "(ii), (iv), (i), (iii)", "B": "(i), (ii), (iii), (iv)", "C": "(iii), (ii), (i), (iv)", "D": "(ii), (i), (iii), (iv)"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which word means expressed in very few words?", "options": {"A": "Verbose", "B": "Vague", "C": "Elaborate", "D": "Concise"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.<br>The path floods ____ after very heavy rain.", "options": {"A": "occasionally", "B": "occassionally", "C": "ocasionally", "D": "occasionaly"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which sentence reports the words below correctly as INDIRECT speech?<br>\"I finished the drawing yesterday,\" said Omar.", "options": {"A": "Omar said that \"he had finished the drawing the day before.\"", "B": "Omar said that he finished the drawing yesterday.", "C": "Omar said that he had finished the drawing the day before.", "D": "Omar said he had finished the drawing yesterday."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the ending \"-ology\" mean in words such as geology and biology?", "options": {"A": "The fear of something", "B": "The measurement of something", "C": "The love of something", "D": "The study of something"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence uses WHO or WHOM correctly?", "options": {"A": "The scientist whom first described the effect worked alone for years.", "B": "The scientist who first described the effect worked alone for years.", "C": "The scientist who the committee ignored worked alone for years.", "D": "The scientist whose first described the effect worked alone for years."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the word closest in meaning to the underlined word.<br>Wild garlic is <u>abundant</u> along the river in spring.", "options": {"A": "plentiful", "B": "fragrant", "C": "scarce", "D": "edible"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which option orders these words from MOST often to LEAST often?", "options": {"A": "seldom, often, always", "B": "always, often, seldom", "C": "often, always, seldom", "D": "always, seldom, often"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Which figure appears in Text B but NOT in Text A?", "options": {"A": "The 17-minute difference in sleep.", "B": "The length of the study.", "C": "The number of participants.", "D": "The 34-minute difference for those using a screen in bed."}, "fig": "", "passage": "<strong>Two texts about screens and sleep</strong><br><p><strong>TEXT A</strong>: a newspaper column</p><p>We are told, yet again, that screens are ruining our children's sleep. A study out this week is being reported as proof. Before we take the phones away, it is worth asking what the study actually found.</p><p>It followed 900 teenagers for six months. Those who used a screen in the hour before bed slept, on average, seventeen minutes less than those who did not. Seventeen minutes. Not two hours, not one. Seventeen minutes, in a group that was not asked what else it was doing at eleven at night.</p><p>Seventeen minutes is not nothing. But a headline that turns it into a crisis tells you more about headlines than about teenagers.</p><p><strong>TEXT B</strong>: a summary of the study</p><p>The study followed 912 participants aged 13 to 17 over 26 weeks. Sleep duration was recorded by wrist monitor and screen use by an application installed on participants' own devices.</p><p>Participants using a screen within 60 minutes of bedtime slept on average 17 minutes less per night than those who did not. The difference was larger, at 34 minutes, among participants who reported using a screen in bed itself.</p><p>The authors note that the study records an association and was not designed to establish cause. Other night-time activities were not measured.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What is the columnist in Text A mainly arguing?", "options": {"A": "That the study was badly carried out.", "B": "That screens have no effect on sleep at all.", "C": "That the study's finding is real but much smaller than the reporting suggests.", "D": "That teenagers should be allowed screens in bed."}, "fig": "", "passage": "<strong>Two texts about screens and sleep</strong><br><p><strong>TEXT A</strong>: a newspaper column</p><p>We are told, yet again, that screens are ruining our children's sleep. A study out this week is being reported as proof. Before we take the phones away, it is worth asking what the study actually found.</p><p>It followed 900 teenagers for six months. Those who used a screen in the hour before bed slept, on average, seventeen minutes less than those who did not. Seventeen minutes. Not two hours, not one. Seventeen minutes, in a group that was not asked what else it was doing at eleven at night.</p><p>Seventeen minutes is not nothing. But a headline that turns it into a crisis tells you more about headlines than about teenagers.</p><p><strong>TEXT B</strong>: a summary of the study</p><p>The study followed 912 participants aged 13 to 17 over 26 weeks. Sleep duration was recorded by wrist monitor and screen use by an application installed on participants' own devices.</p><p>Participants using a screen within 60 minutes of bedtime slept on average 17 minutes less per night than those who did not. The difference was larger, at 34 minutes, among participants who reported using a screen in bed itself.</p><p>The authors note that the study records an association and was not designed to establish cause. Other night-time activities were not measured.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Text B states that the study records an association and was not designed to establish cause. How does Text A treat that same point?", "options": {"A": "It states the same caution in the same plain terms.", "B": "It denies that any such caution is needed.", "C": "It does not touch on the point at all.", "D": "It makes the point indirectly, by noting that the group was not asked what else it was doing late at night."}, "fig": "", "passage": "<strong>Two texts about screens and sleep</strong><br><p><strong>TEXT A</strong>: a newspaper column</p><p>We are told, yet again, that screens are ruining our children's sleep. A study out this week is being reported as proof. Before we take the phones away, it is worth asking what the study actually found.</p><p>It followed 900 teenagers for six months. Those who used a screen in the hour before bed slept, on average, seventeen minutes less than those who did not. Seventeen minutes. Not two hours, not one. Seventeen minutes, in a group that was not asked what else it was doing at eleven at night.</p><p>Seventeen minutes is not nothing. But a headline that turns it into a crisis tells you more about headlines than about teenagers.</p><p><strong>TEXT B</strong>: a summary of the study</p><p>The study followed 912 participants aged 13 to 17 over 26 weeks. Sleep duration was recorded by wrist monitor and screen use by an application installed on participants' own devices.</p><p>Participants using a screen within 60 minutes of bedtime slept on average 17 minutes less per night than those who did not. The difference was larger, at 34 minutes, among participants who reported using a screen in bed itself.</p><p>The authors note that the study records an association and was not designed to establish cause. Other night-time activities were not measured.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Both texts report the 17-minute finding. What is the main difference in HOW they report it?", "options": {"A": "Text A repeats it to argue that it is small; Text B states it once alongside the method and the limits.", "B": "Text B repeats it to argue that it is small; Text A states it once.", "C": "Text A gives a larger figure than Text B does.", "D": "Neither text says how the figure was measured."}, "fig": "", "passage": "<strong>Two texts about screens and sleep</strong><br><p><strong>TEXT A</strong>: a newspaper column</p><p>We are told, yet again, that screens are ruining our children's sleep. A study out this week is being reported as proof. Before we take the phones away, it is worth asking what the study actually found.</p><p>It followed 900 teenagers for six months. Those who used a screen in the hour before bed slept, on average, seventeen minutes less than those who did not. Seventeen minutes. Not two hours, not one. Seventeen minutes, in a group that was not asked what else it was doing at eleven at night.</p><p>Seventeen minutes is not nothing. But a headline that turns it into a crisis tells you more about headlines than about teenagers.</p><p><strong>TEXT B</strong>: a summary of the study</p><p>The study followed 912 participants aged 13 to 17 over 26 weeks. Sleep duration was recorded by wrist monitor and screen use by an application installed on participants' own devices.</p><p>Participants using a screen within 60 minutes of bedtime slept on average 17 minutes less per night than those who did not. The difference was larger, at 34 minutes, among participants who reported using a screen in bed itself.</p><p>The authors note that the study records an association and was not designed to establish cause. Other night-time activities were not measured.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "A reader has both texts in front of them. Which conclusion is best supported?", "options": {"A": "Screens cause teenagers to lose about 17 minutes of sleep a night.", "B": "Screen use before bed makes no difference to how long teenagers sleep.", "C": "Screen use before bed is associated with slightly less sleep, and the study cannot show that it causes it.", "D": "The study was too small to show anything at all."}, "fig": "", "passage": "<strong>Two texts about screens and sleep</strong><br><p><strong>TEXT A</strong>: a newspaper column</p><p>We are told, yet again, that screens are ruining our children's sleep. A study out this week is being reported as proof. Before we take the phones away, it is worth asking what the study actually found.</p><p>It followed 900 teenagers for six months. Those who used a screen in the hour before bed slept, on average, seventeen minutes less than those who did not. Seventeen minutes. Not two hours, not one. Seventeen minutes, in a group that was not asked what else it was doing at eleven at night.</p><p>Seventeen minutes is not nothing. But a headline that turns it into a crisis tells you more about headlines than about teenagers.</p><p><strong>TEXT B</strong>: a summary of the study</p><p>The study followed 912 participants aged 13 to 17 over 26 weeks. Sleep duration was recorded by wrist monitor and screen use by an application installed on participants' own devices.</p><p>Participants using a screen within 60 minutes of bedtime slept on average 17 minutes less per night than those who did not. The difference was larger, at 34 minutes, among participants who reported using a screen in bed itself.</p><p>The authors note that the study records an association and was not designed to establish cause. Other night-time activities were not measured.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the writing is typed on a keyboard and you choose ONE of the two tasks below. At this stage the text type is a personal OPINION essay: take a position and argue for it.", "label": "", "body": "", "hint": "Answer EVERY part of the task you choose. State your opinion early and give each paragraph one clear point. Answer at least one argument against you, and be careful to say what your evidence does and does not show. Vary your sentence types and check the spelling of your longer words before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": "TASK 1\nNewspapers often report a small finding as though it were a large one. Does this matter? Give your opinion, explain your reasoning, describe one occasion when you or someone you know believed a headline that turned out to be misleading, and say what a reader can do about it.\n\nTASK 2\nShould your school set rules about how students use their phones outside lesson time? Give your opinion, support it with two reasons, explain the strongest argument against your view, and say why you still hold it."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 English Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
