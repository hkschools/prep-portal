<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT CIS: Stage 4 English Drill 2</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT CIS: Stage 4 English Drill 2</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "CIS", STAGE = "4", VERSION = "ENG-D2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Choose the single best answer."}, {"n": "2", "type": "mcq", "section": "English", "stem": "From which point of view is the extract below written?<br>You reach the top of the steps and stop. Ahead of you the hall is already full, and you cannot see a single face you recognise.", "options": {"A": "First person", "B": "Third person, following one character", "C": "Third person, knowing every character's thoughts", "D": "Second person"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which of these is a COMPOUND sentence, that is, two clauses of equal weight joined together?", "options": {"A": "The bell rang and the corridor filled at once.", "B": "When the bell rang, the corridor filled at once.", "C": "The corridor filled at once.", "D": "The corridor, which had been empty a moment before, filled at once."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "A paragraph is to argue that the school field is used more than any other space. Which sentence does NOT belong in it?", "options": {"A": "Three year groups have lessons on it every week.", "B": "The field was laid out in 1974, when the school was much smaller.", "C": "It is booked every lunchtime in the summer term.", "D": "Two clubs train on it after school on four days out of five."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which word means to praise someone or something very highly?", "options": {"A": "Denounce", "B": "Tolerate", "C": "Extol", "D": "Ignore"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.<br>She had ____ decided not to enter the competition.", "options": {"A": "definitely", "B": "definately", "C": "definitly", "D": "defenitely"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which sentence uses its pronouns correctly?", "options": {"A": "The teacher asked Priya and I to set out the chairs.", "B": "The teacher asked Priya and myself to set out the chairs.", "C": "Priya and me set out the chairs.", "D": "The teacher asked Priya and me to set out the chairs."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which prefix means \"across\" or \"through\"?", "options": {"A": "sub-", "B": "trans-", "C": "ante-", "D": "inter-"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which option orders these words from LEAST certain to MOST certain?", "options": {"A": "certain, probable, possible", "B": "probable, possible, certain", "C": "possible, probable, certain", "D": "possible, certain, probable"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "One word below is wrong. Which option corrects the underlined word?<br><u>Their</u> going to announce the results at noon.", "options": {"A": "There", "B": "Theirs", "C": "Their's", "D": "They're"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which part of this sentence is a NOUN PHRASE?<br>A thin grey cat watched us carefully from the wall.", "options": {"A": "watched us carefully", "B": "from the wall", "C": "A thin grey cat", "D": "carefully"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to Text A, why is the 10.15 bus no help to the people the writer describes?", "options": {"A": "It leaves before their shifts have finished.", "B": "It is always full by the time it reaches them.", "C": "It does not stop near the leisure centre.", "D": "It costs more than the later service."}, "fig": "", "passage": "<strong>Two texts about the last bus</strong><br><p><b>TEXT A</b>: a letter to the local newspaper</p><p>Sir, the decision to withdraw the 11.40 bus has been presented as a small adjustment. For the people who use it, it is nothing of the kind.</p><p>I have caught that bus home from work on Fridays for nine years. So do the cleaners who finish at eleven at the leisure centre, and the students who work evening shifts at the supermarket. None of us can afford a taxi twice a week, and the next bus before it leaves at 10.15, which is no use to anybody whose shift ends at eleven.</p><p>We are told the service carries too few passengers to justify itself. I would ask the company to count us again, and to count us on a Friday.</p><p><b>TEXT B</b>: from the bus operator's notice at the stop</p><p>From 6 October the 11.40 service on route 9 will be withdrawn. The last departure will be at 10.15.</p><p>Passenger counts taken over eight weeks in February and March recorded an average of four passengers on the 11.40 departure, against an operating cost that the company is no longer able to meet from fares. Route 9 will otherwise run as at present.</p><p>Passengers wishing to comment on this change may write to the address below before 20 September.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Both texts refer to how many people use the 11.40 bus. How do they differ in the evidence they give?", "options": {"A": "Text A gives a counted average; Text B names the kinds of people who use it.", "B": "Text A names the kinds of people who use it; Text B gives a counted average.", "C": "Only Text A refers to the number of passengers at all.", "D": "Both texts give the same figure for the number of passengers."}, "fig": "", "passage": "<strong>Two texts about the last bus</strong><br><p><b>TEXT A</b>: a letter to the local newspaper</p><p>Sir, the decision to withdraw the 11.40 bus has been presented as a small adjustment. For the people who use it, it is nothing of the kind.</p><p>I have caught that bus home from work on Fridays for nine years. So do the cleaners who finish at eleven at the leisure centre, and the students who work evening shifts at the supermarket. None of us can afford a taxi twice a week, and the next bus before it leaves at 10.15, which is no use to anybody whose shift ends at eleven.</p><p>We are told the service carries too few passengers to justify itself. I would ask the company to count us again, and to count us on a Friday.</p><p><b>TEXT B</b>: from the bus operator's notice at the stop</p><p>From 6 October the 11.40 service on route 9 will be withdrawn. The last departure will be at 10.15.</p><p>Passenger counts taken over eight weeks in February and March recorded an average of four passengers on the 11.40 departure, against an operating cost that the company is no longer able to meet from fares. Route 9 will otherwise run as at present.</p><p>Passengers wishing to comment on this change may write to the address below before 20 September.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Text B was written by the bus operator. What is it mainly trying to do?", "options": {"A": "Announce a change to the service and give the reason behind it.", "B": "Persuade passengers that the decision is a fair one.", "C": "Apologise to passengers for the inconvenience caused.", "D": "Encourage more people to travel on the 11.40 service."}, "fig": "", "passage": "<strong>Two texts about the last bus</strong><br><p><b>TEXT A</b>: a letter to the local newspaper</p><p>Sir, the decision to withdraw the 11.40 bus has been presented as a small adjustment. For the people who use it, it is nothing of the kind.</p><p>I have caught that bus home from work on Fridays for nine years. So do the cleaners who finish at eleven at the leisure centre, and the students who work evening shifts at the supermarket. None of us can afford a taxi twice a week, and the next bus before it leaves at 10.15, which is no use to anybody whose shift ends at eleven.</p><p>We are told the service carries too few passengers to justify itself. I would ask the company to count us again, and to count us on a Friday.</p><p><b>TEXT B</b>: from the bus operator's notice at the stop</p><p>From 6 October the 11.40 service on route 9 will be withdrawn. The last departure will be at 10.15.</p><p>Passenger counts taken over eight weeks in February and March recorded an average of four passengers on the 11.40 departure, against an operating cost that the company is no longer able to meet from fares. Route 9 will otherwise run as at present.</p><p>Passengers wishing to comment on this change may write to the address below before 20 September.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Text A ends by asking the company to count the passengers again, on a Friday. Which detail in Text B does this respond to?", "options": {"A": "That the last departure will now be at 10.15.", "B": "That comments must be sent before 20 September.", "C": "That the counts were taken in February and March.", "D": "That route 9 will otherwise run as at present."}, "fig": "", "passage": "<strong>Two texts about the last bus</strong><br><p><b>TEXT A</b>: a letter to the local newspaper</p><p>Sir, the decision to withdraw the 11.40 bus has been presented as a small adjustment. For the people who use it, it is nothing of the kind.</p><p>I have caught that bus home from work on Fridays for nine years. So do the cleaners who finish at eleven at the leisure centre, and the students who work evening shifts at the supermarket. None of us can afford a taxi twice a week, and the next bus before it leaves at 10.15, which is no use to anybody whose shift ends at eleven.</p><p>We are told the service carries too few passengers to justify itself. I would ask the company to count us again, and to count us on a Friday.</p><p><b>TEXT B</b>: from the bus operator's notice at the stop</p><p>From 6 October the 11.40 service on route 9 will be withdrawn. The last departure will be at 10.15.</p><p>Passenger counts taken over eight weeks in February and March recorded an average of four passengers on the 11.40 departure, against an operating cost that the company is no longer able to meet from fares. Route 9 will otherwise run as at present.</p><p>Passengers wishing to comment on this change may write to the address below before 20 September.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "How would you best describe the TONE of Text A compared with that of Text B?", "options": {"A": "Both texts are angry.", "B": "Text A is arguing a case; Text B is stating a decision.", "C": "Text A is neutral; Text B is emotional.", "D": "Both texts are trying to persuade the reader."}, "fig": "", "passage": "<strong>Two texts about the last bus</strong><br><p><b>TEXT A</b>: a letter to the local newspaper</p><p>Sir, the decision to withdraw the 11.40 bus has been presented as a small adjustment. For the people who use it, it is nothing of the kind.</p><p>I have caught that bus home from work on Fridays for nine years. So do the cleaners who finish at eleven at the leisure centre, and the students who work evening shifts at the supermarket. None of us can afford a taxi twice a week, and the next bus before it leaves at 10.15, which is no use to anybody whose shift ends at eleven.</p><p>We are told the service carries too few passengers to justify itself. I would ask the company to count us again, and to count us on a Friday.</p><p><b>TEXT B</b>: from the bus operator's notice at the stop</p><p>From 6 October the 11.40 service on route 9 will be withdrawn. The last departure will be at 10.15.</p><p>Passenger counts taken over eight weeks in February and March recorded an average of four passengers on the 11.40 departure, against an operating cost that the company is no longer able to meet from fares. Route 9 will otherwise run as at present.</p><p>Passengers wishing to comment on this change may write to the address below before 20 September.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "In the real test the writing is typed on a keyboard and you choose ONE of the two tasks below. At this stage the text type is a personal OPINION essay: take a position and argue for it.", "label": "", "body": "", "hint": "Answer EVERY part of the task you choose. State your opinion in the first paragraph and build each later paragraph on one clear reason. Answer at least one objection. Vary your sentence types, choose exact words rather than approximate ones, and check the spelling of your longer words before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "", "partB": "TASK 1\nA service used by a small number of people is expensive to run. Should it be kept going anyway? Give your opinion, explain the reasoning behind it, describe one situation in which you think the opposite answer would be right, and say what makes the difference between the two cases.\n\nTASK 2\nSome people believe that young people should have a say in decisions made by their town, such as where money is spent or which services are kept. Write your opinion for a local newspaper. Say what you think, give two reasons, describe one practical difficulty with what you are proposing, and suggest how it might be overcome."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 English Drill 2</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
