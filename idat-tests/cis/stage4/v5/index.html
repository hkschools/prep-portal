<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>

const SCHOOL = "CIS", STAGE = "4", VERSION = "5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "The results ____ before the head teacher announced them at assembly.", "options": {"A": "were already checked", "B": "have already been checked", "C": "are already being checked", "D": "had already been checked"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "\"The lights are off and the gate is locked, so the office ____ be closed.\" Which word shows the speaker is almost certain?", "options": {"A": "must", "B": "might", "C": "could", "D": "should"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which sentence joins the two ideas with a CONCESSION?", "options": {"A": "Because the ferry was delayed, we reached the island before dark.", "B": "Even though the ferry was delayed, we reached the island before dark.", "C": "As soon as the ferry was delayed, we reached the island before dark.", "D": "So that the ferry was delayed, we reached the island before dark."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which sentence punctuates the possessive correctly?", "options": {"A": "The stallholder's association meets on the first Tuesday of the month.", "B": "The stallholders association meets on the first Tuesday of the month.", "C": "The stallholders' association meets on the first Tuesday of the month.", "D": "The stallholders's association meets on the first Tuesday of the month."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which sentence uses the semi-colon correctly?", "options": {"A": "The market opens at six; by nine the best stalls have sold out.", "B": "The market opens at six; and by nine the best stalls have sold out.", "C": "The market opens at six; which is earlier than most.", "D": "Although the market opens at six; the best stalls sell out by nine."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "\"You have not seen the new timetable, ____\"", "options": {"A": "haven't you?", "B": "did you?", "C": "do you?", "D": "have you?"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Rewrite in the ACTIVE voice: \"The winning design was chosen by a panel of local traders.\"", "options": {"A": "The winning design chose a panel of local traders.", "B": "A panel of local traders was chosen by the winning design.", "C": "A panel of local traders chose the winning design.", "D": "A panel of local traders has been choosing the winning design."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence uses the correct verb after \"either ... or\"?", "options": {"A": "Either the traders or the council are paying for the repairs.", "B": "Either the traders or the council is paying for the repairs.", "C": "Either the traders or the council were paying for the repairs.", "D": "Either the traders or the council have paid for the repairs."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which of these is a complete sentence rather than a fragment?", "options": {"A": "Because fewer stalls open in winter.", "B": "Fewer stalls opening in winter, which the traders dislike.", "C": "Although fewer stalls in winter.", "D": "Fewer stalls open in winter."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which sentence would work best as the TOPIC SENTENCE of a paragraph about why the market matters to older residents?", "options": {"A": "For many older residents, the market is the one place they are certain to meet someone they know.", "B": "The market has been held on the same square since 1904.", "C": "Mrs Danvers has run the flower stall for thirty-one years.", "D": "Older residents deserve more support from the council."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "\"When the trader spoke to the inspector, <u>he</u> agreed the stall could stay.\" Why is this sentence unclear?", "options": {"A": "\"He\" cannot refer to either noun, because both are singular.", "B": "\"He\" could refer to either the trader or the inspector.", "C": "\"He\" must refer to the trader, because the trader is the subject.", "D": "\"He\" is in the wrong case and should be \"him\"."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which sentence opens with a SUBORDINATE CLAUSE?", "options": {"A": "The square looked twice its usual size once the awnings were down.", "B": "Slowly, the square emptied of shoppers and traders alike.", "C": "Once the awnings were down, the square looked twice its usual size.", "D": "In the corner by the fountain, two stalls were still trading."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which word criticises a decision most GENTLY?", "options": {"A": "questionable", "B": "reckless", "C": "indefensible", "D": "disastrous"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "\"The council's reply was so <u>perfunctory</u> that the traders suspected nobody had read their letter.\" \"Perfunctory\" means", "options": {"A": "written in unusually formal language", "B": "delayed for several months", "C": "done with the least possible care", "D": "surprisingly generous"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which of these is the correct spelling of the noun formed from the verb \"occur\"?", "options": {"A": "occurence", "B": "occurrence", "C": "ocurrence", "D": "occurrance"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "The words \"audible\", \"auditorium\" and \"audience\" share a root meaning", "options": {"A": "to speak", "B": "to gather", "C": "to look", "D": "to hear"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which suffix means \"able to be\"?", "options": {"A": "-ist", "B": "-ism", "C": "-ible", "D": "-ise"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "Which phrase is a EUPHEMISM for closing the market?", "options": {"A": "shutting the market down", "B": "reviewing the future of the square", "C": "cancelling the traders' licences", "D": "saving the square from decline"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Which verb most naturally completes \"the council ____ a consultation\"?", "options": {"A": "launched", "B": "opened", "C": "released", "D": "performed"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "A writer wants to show that the crowd's pleasure was overwhelming. Which word should they choose?", "options": {"A": "content", "B": "relieved", "C": "amused", "D": "elated"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which word describes a crowd NEUTRALLY, without approval or disapproval?", "options": {"A": "mob", "B": "gathering", "C": "throng", "D": "rabble"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "If a trader says the council has \"moved the goalposts\", they mean the council has", "options": {"A": "delayed its decision again", "B": "refused to meet the traders", "C": "spent money on the sports ground", "D": "changed the rules after the process began"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "\"The square was a held breath, waiting for the traders to return.\" This is an example of", "options": {"A": "metaphor", "B": "simile", "C": "onomatopoeia", "D": "understatement"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "Which word is the most FORMAL way to say \"put off\"?", "options": {"A": "shelve", "B": "scrap", "C": "postpone", "D": "stall"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "According to Text A, what does the writer say the report she read counted?", "options": {"A": "the number of visitors", "B": "the number of stalls", "C": "the money the market takes", "D": "the age of the traders"}, "fig": "", "passage": "<strong>Letter to the Editor: Keep Our Saturday Market</strong><br>Sir, I read last week that the council is considering ending the Saturday market on Cross Square. I have shopped there every week for thirty-one years, and I would like to put the other side.\n\nThe report you printed counted stalls. That is a fair thing to count, and I do not dispute the figure. But a market is not only a row of stalls, and the thing it does best does not appear in any column. On a Saturday morning I speak to perhaps a dozen people. Some of them I know by name. Most I do not, and would not recognise anywhere else. My neighbour on the top floor, who moved here in March and had not spoken to a soul until June, now spends an hour there every week arguing about tomatoes.\n\nI am told the supermarket on Weir Street sells the same produce for less. It does. I have been in it. You take a trolley, you put things in it, and you leave, and in twenty minutes not one person has said anything to you that was not printed on a sign. That is efficient, and I understand why the council likes efficient things. It is not the same as a market and it should not be counted as a replacement for one.\n\nIf the market is losing money, say so plainly and let us argue about the money. What I object to is being told that fourteen stalls means nobody wants it. Fourteen stalls means fourteen stalls. It does not tell you how many people came, or what the morning was worth to them. Yours, M. Aldiss, Cross Square.<br><br><strong>Market Stalls Fall to Fourteen</strong><br>The number of traders at the Saturday market on Cross Square has fallen to fourteen, the lowest figure since the market was reorganised in 1998, according to figures released by the district council this week.\n\nAt its peak in 2009 the market ran to forty-one stalls across the square and the two side streets. Council officers attribute the decline to three factors: the rise in the weekly pitch fee from eleven pounds to twenty-six pounds over the past decade, the opening of a large supermarket on Weir Street in 2016, and the difficulty traders report in finding staff willing to work a single morning a week.\n\nFootfall, however, has not fallen at the same rate. Counts taken by the council's own sensors at the four entrances to the square recorded an average of 2,340 visitors on a Saturday morning in 2009 and 1,910 last year, a fall of about eighteen per cent against a drop of two thirds in the number of stalls.\n\nA council spokesperson said no decision had been taken and that a consultation would open in the autumn. Two options are understood to be under consideration: reducing the pitch fee for new traders for an initial two years, or ending the Saturday market and leasing the square for events. The council has not published a cost estimate for either option.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "What is the writer's main objection in Text A?", "options": {"A": "That a count of stalls is being treated as a measure of whether the market is wanted", "B": "That the council has already decided to close the market.", "C": "That the supermarket sells worse produce than the market does.", "D r><br><strong>Market Stalls Fall to Fourteen</strong><br>The number of traders at the Saturday market on Cross Square has fallen to fourteen, the lowest figure since the market was reorganised in 1998, according to figures released by the district council this week.\n\nAt its peak in 2009 the market ran to forty-one stalls across the square and the two side streets. Council officers attribute the decline to three factors: the rise in the weekly pitch fee from eleven pounds to twenty-six pounds over the past decade, the opening of a large supermarket on Weir Street in 2016, and the difficulty traders report in finding staff willing to work a single morning a week.\n\nFootfall, however, has not fallen at the same rate. Counts taken by the council's own sensors at the four entrances to the square recorded an average of 2,340 visitors on a Saturday morning in 2009 and 1,910 last year, a fall of about eighteen per cent against a drop of two thirds in the number of stalls.\n\nA council spokesperson said no decision had been taken and that a consultation would open in the autumn. Two options are understood to be under consideration: reducing the pitch fee for new traders for an initial two years, or ending the Saturday market and leasing the square for events. The council has not published a cost estimate for either option.", "qnum": "28"}, {"n": "30", "type": "mcq", "section": "English", "stem": "Which figure from Text B most directly SUPPORTS the argument made in Text A?", "options": {"A": "The pitch fee rose from eleven pounds to twenty-six pounds.", "B": "The market ran to forty-one stalls in 2009.", "C": "Footfall has fallen far less steeply than the number of stalls.", "D": "A supermarket opened on Weir Street in 2016."}, "fig": "", "passage": "<strong>Letter to the Editor: Keep Our Saturday Market</strong><br>Sir, I read last week that the council is considering ending the Saturday market on Cross Square. I have shopped there every week for thirty-one years, and I would like to put the other side.\n\nThe report you printed counted stalls. That is a fair thing to count, and I do not dispute the figure. But a market is not only a row of stalls, and the thing it does best does not appear in any column. On a Saturday morning I speak to perhaps a dozen people. Some of them I know by name. Most I do not, and would not recognise anywhere else. My neighbour on the top floor, who moved here in March and had not spoken to a soul until June, now spends an hour there every week arguing about tomatoes.\n\nI am told the supermarket on Weir Street sells the same produce for less. It does. I have been in it. You take a trolley, you put things in it, and you leave, and in twenty minutes not one person has said anything to you that was not printed on a sign. That is efficient, and I understand why the council likes efficient things. It is not the same as a market and it should not be counted as a replacement for one.\n\nIf the market is losing money, say so plainly and let us argue about the money. What I object to is being told that fourteen stalls means nobody wants it. Fourteen stalls means fourteen stalls. It does not tell you how many people came, or what the morning was worth to them. Yours, M. Aldiss, Cross Square.<br><br><strong>Market Stalls Fall to Fourteen</strong><br>The number of traders at the Saturday market on Cross Square has fallen to fourteen, the lowest figure since the market was reorganised in 1998, according to figures released by the district council this week.\n\nAt its peak in 2009 the market ran to forty-one stalls across the square and the two side streets. Council officers attribute the decline to three factors: the rise in the weekly pitch fee from eleven pounds to twenty-six pounds over the past decade, the opening of a large supermarket on Weir Street in 2016, and the difficulty traders report in finding staff willing to work a single morning a week.\n\nFootfall, however, has not fallen at the same rate. Counts t idth=\"2\"/><polygon points=\"85,85 145,85 115,30\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"85,145 145,145 115,200\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"85,85 85,145 30,115\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"145,85 145,145 200,115\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></svg>", "passage": "", "qnum": "21"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Five people meet, and each one shakes hands once with every other person. How many handshakes take place altogether?", "options": {"A": "20", "B": "10", "C": "25", "D": "15"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which of these words would appear FIRST in a dictionary? preserve, present, presume, prepare", "options": {"A": "prepare", "B": "present", "C": "preserve", "D": "presume"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code, 3-9-1-18 spells CHAIR. What does 12-1-13-16 spell?", "options": {"A": "MAKE", "B": "KALO", "C": "LAMP", "D": "LAMB"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A film lasts 2 hours and 47 minutes and finishes at 21:05. At what time did it start?", "options": {"A": "18:52", "B": "18:18", "C": "23:52", "D": "18:58"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The school will publish the sports fixtures on the website instead of pinning them to the noticeboard, so that parents can see them without coming into the building.\"\n\nPROPOSED ASSUMPTION: \"Parents who want to see the fixtures are able to use the school website.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "Yes. The change is justified by parents being able to see the fixtures without coming in, which only holds if those parents can reach the website.", "B": "No. The statement describes where the fixtures will be published and says nothing about what parents can or cannot use."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"At Northbrook School, no pupil may take part in the inter-school quiz unless they have attended at least six practice sessions. Daniel attended nine practice sessions.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Daniel took part in the inter-school quiz.", "B": "Daniel has met the attendance requirement for the quiz.", "C": "Daniel attended more sessions than any other pupil.", "D": "Pupils who attend six sessions are chosen for the quiz."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A town clinic reviewed all 500 of its appointments in one month. It found that 320 were booked online, 240 were with a nurse rather than a doctor, and 150 were both booked online and with a nurse.\"\n\nCONCLUSION (1): Fewer than half the appointments were with a doctor.\nCONCLUSION (2): Every appointment booked online was with a nurse.\nCONCLUSION (3): At least 90 appointments were neither booked online nor with a nurse.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "Conclusions 1 and 3 follow, but Conclusion 2 does not.", "B": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "C": "None of the three conclusions follows.", "D": "Conclusion 3 follows, but Conclusions 1 and 2 do not."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"Every article in the school magazine is checked by the student editor before it is printed. Nothing the student editor checks is printed without a named author.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "Everything the student editor checks is an article in the school magazine.", "B": "Some articles with named authors are not checked by the student editor.", "C": "No article in the school magazine is printed without a named author."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should local councils be required to put speed cameras on residential roads where a serious injury has been recorded?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "No. A review of 216 camera sites in the United Kingdom found that when sites are chosen because a serious collision has just happened there, part of the later fall in collisions is regression to the mean rather than an effect of the camera. Once the reviewers corrected for that, the average reduction fell from 27 per cent to about 10 per cent. Choosing sites by a single recorded injury would therefore concentrate cameras where the apparent benefit is largest and the real benefit is smallest.", "B": "Yes. Speed cameras save lives, and anyone who argues against them is putting the convenience of drivers above the safety of children. How would those same drivers feel if it were their own child crossing that road? No cost is too high when a life is at stake.", "C": "No. Councils are already short of money, and a camera costs tens of thousands of pounds to install and maintain. Residents would rather see that money spent on repairing the roads, which everyone uses every day."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A public health report noted: 'Among the 40 secondary schools in the district, those that introduced a free breakfast club recorded a smaller rise in unauthorised absence last year than those that did not.'\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Breakfast clubs reduce unauthorised absence.", "B": "Unauthorised absence fell in the schools with a breakfast club.", "C": "Unauthorised absence rose last year in at least some schools in the district.", "D": "Most schools in the district introduced a breakfast club."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "69", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "70", "type": "mcq", "section": "Chinese", "stem": "根據文章，城市的夜空看不見星星，最主要的原因是甚麼？<br><i>根据文章，城市的夜空看不见星星，最主要的原因是甚么？</i>", "options": {"A": "星星的數量近年真的減少了<br><i>星星的数量近年真的减少了</i>", "B": "城市的空氣污染擋住了星光<br><i>城市的空气污染挡住了星光</i>", "C": "城市的樓宇太高，遮住了視線<br><i>城市的楼宇太高，遮住了视线</i>", "D": "背景太亮，微弱的星光被蓋過<br><i>背景太亮，微弱的星光被盖过</i>"}, "fig": "", "passage": "小時候在鄉間過夜，抬頭一看，滿天都是星。如今站在城市的天台上，同樣的夜空卻只剩下三數點微光。星星並沒有消失，消失的是我們看見它們的能力。\n\n天文學家把這種現象稱為「光害」。城市裏的街燈、廣告牌、球場的射燈，向四面八方發出光線；其中不少並沒有照到需要照明的地面，而是斜斜地射向天空。這些光線遇上空氣中的塵埃和水氣，被散射開來，在城市上空形成一層淡淡的光幕。星光本來就微弱，一旦背景亮了起來，它便像白紙上的淺灰色字跡，難以分辨。\n\n本地有研究隊伍曾在多處地點測量夜空的亮度。結果顯示，市區最亮的地點，夜空比國際天文學界所訂的標準亮出數百倍；即使在郊野公園，情況也比二十年前遜色。研究人員指出，問題的根源並非燈的數量，而是燈的方向和時間：許多招牌在午夜以後仍然全開，而商場外牆的射燈更是徹夜長明。\n\n光害的影響不只在於看不看得見星星。候鳥依靠星象辨別方向，強光會令牠們偏離航道；海龜幼苗孵化後本應循着海面的反光爬向大海，卻可能被岸上的燈火引往相反的方向。對人而言，夜間過強的光線會抑制褪黑激素的分泌，長期下來影響睡眠。\n\n可幸的是，光害與其他污染不同：只要關燈，它便立刻消失。近年不少城市推行「全遮蔽式」燈具，把光線集中射向地面；也有地區規定廣告燈箱在深夜關掉。這些做法既省電，也讓夜空重新暗下來。\n\n下一次走到郊外，不妨關掉手電筒，靜靜地站上十分鐘。等眼睛適應了黑暗，你會發現，星星一直都在。<br><i>小时候在乡间过夜，抬头一看，满天都是星。如今站在城市的天台上，同样的夜空却只剩下三数点微光。星星并没有消失，消失的是我们看见它们的能力。\n\n天文学家把这种现象称为「光害」。城市里的街灯、广告牌、球场的射灯，向四面八方发出光线；其中不少并没有照到需要照明的地面，而是斜斜地射向天空。这些光线遇上空气中的尘埃和水气，被散射开来，在城市上空形成一层淡淡的光幕。星光本来就微弱，一旦背景亮了起来，它便像白纸上的浅灰色字迹，难以分辨。\n\n本地有研究队伍曾在多处地点测量夜空的亮度。结果显示，市区最亮的地点，夜空比国际天文学界所订的标准亮出数百倍；即使在郊野公园，情况也比二十年前逊色。研究人员指出，问题的根源并非灯的数量，而是灯的方向和时间：许多招牌在午夜以后仍然全开，而商场外墙的射灯更是彻夜长明。\n\n光害的影响不只在于看不看得见星星。候鸟依靠星象辨别方向，强光会令牠们偏离航道；海龟幼苗孵化后本应循着海面的反光爬向大海，却可能被岸上的灯火引往相反的方向。对人而言，夜间过强的光线会抑制褪黑激素的分泌，长期下来影响睡眠。\n\n可幸的是，光害与其他污染不同：只要关灯，它便立刻消失。近年不少城市推行「全遮蔽式」灯具，把光线集中射向地面；也有地区规定广告灯箱在深夜关掉。这些做法既省电，也让夜空重新暗下来。\n\n下一次走到郊外，不妨关掉手电筒，静静地站上十分钟。等眼睛适应了黑暗，你会发现，星星一直都在。</i>", "qnum": "1"}, {"n": "71", "type": "mcq", "section": "Chinese", "stem": "文中所說的「光幕」是怎樣形成的？<br><i>文中所说的「光幕」是怎样形成的？</i>", "options": {"A": "雲層反射了地面的燈光<br><i>云层反射了地面的灯光</i>", "B": "街燈的燈罩把光線集中在半空<br><i>街灯的灯罩把光线集中在半空</i>", "C": "射向天空的燈光被塵埃和水氣散射開來<br><i>射向天空的灯光被尘埃和水气散射开来</i>", "D": "汽車廢氣在市區上空積聚<br><i>汽车废气在市区上空积聚</i>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "72", "type": "mcq", "section": "Chinese", "stem": "研究人員認為光害的根源在於甚麼？<br><i>研究人员认为光害的根源在于甚么？</i>", "options": {"A": "燈的方向和開燈的時間<br><i>灯的方向和开灯的时间</i>", "B": "燈的數量太多<br><i>灯的数量太多</i>", "C": "郊野公園的遊人太多<br><i>郊野公园的游人太多</i>", "D": "市民不願意早睡<br><i>市民不愿意早睡</i>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "73", "type": "mcq", "section": "Chinese", "stem": "根據文章，強光對海龜幼苗有甚麼影響？<br><i>根据文章，强光对海龟幼苗有甚么影响？</i>", "options": {"A": "令牠們提早孵化<br><i>令牠们提早孵化</i>", "B": "可能被岸上的燈火引往與大海相反的方向<br><i>可能被岸上的灯火引往与大海相反的方向</i>", "C": "使牠們無法辨別星象<br><i>使牠们无法辨别星象</i>", "D": "令牠們的體溫過高<br><i>令牠们的体温过高</i>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "74", "type": "mcq", "section": "Chinese", "stem": "文章最後一段的主要作用是甚麼？<br><i>文章最后一段的主要作用是甚么？</i>", "options": {"A": "邀請讀者親身體驗，收束全文<br><i>邀请读者亲身体验，收束全文</i>", "B": "補充說明光害的科學原理<br><i>补充说明光害的科学原理</i>", "C": "指出郊野的空氣比市區清新<br><i>指出郊野的空气比市区清新</i>", "D": "批評市民缺乏環保意識<br><i>批评市民缺乏环保意识</i>"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "75", "type": "mcq", "section": "Chinese", "stem": "本文的主旨是甚麼？<br><i>本文的主旨是甚么？</i>", "options": {"A": "記述作者小時候在鄉間看星的經歷<br><i>记述作者小时候在乡间看星的经历</i>", "B": "比較市區與郊野公園的環境差異<br><i>比较市区与郊野公园的环境差异</i>", "C": "說明光害的成因與影響，並指出情況可以改善<br><i>说明光害的成因与影响，并指出情况可以改善</i>", "D": "呼籲市民減少晚上外出活動<br><i>呼吁市民减少晚上外出活动</i>"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "76", "type": "mcq", "section": "Chinese", "stem": "「即使在郊野公園，情況也比二十年前遜色」，「遜色」在文中的意思是<br><i>「即使在郊野公园，情况也比二十年前逊色」，「逊色」在文中的意思是</i>", "options": {"A": "顏色變得暗淡<br><i>颜色变得暗淡</i>", "B": "比不上從前<br><i>比不上 stem": "「城市裏的街燈、廣告牌、球場的射燈，向四面八方發出光線」一句主要用了哪種手法？<br><i>「城市里的街灯、广告牌、球场的射灯，向四面八方发出光线」一句主要用了哪种手法？</i>", "options": {"A": "擬人<br><i>拟人</i>", "B": "排比", "C": "設問<br><i>设问</i>", "D": "反覆<br><i>反复</i>"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 (V5)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
