<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;

  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}

ch said, \"We will train again tomorrow.\" Which sentence reports this correctly?", "options": {"A": "The coach said that they would train again the next day.", "B": "The coach said that they will train again tomorrow.", "C": "The coach said that we would train again tomorrow.", "D": "The coach said that they will train again the next day."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Rewrite in the passive: \"Volunteers repaired the footpath last spring.\"", "options": {"A": "The footpath is repaired by volunteers last spring.", "B": "The footpath was repaired by volunteers last spring.", "C": "The footpath had been repaired by volunteers last spring.", "D": "The footpath were repaired by volunteers last spring."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which sentence uses the correct verb after a collective noun acting as one body?", "options": {"A": "The committee have published its decision.", "B": "The committee has published their decision.", "C": "The committee has published its decision.", "D": "The committee have published their decisions, and it was unanimous."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which of these is a COMPLEX sentence?", "options": {"A": "The rink was closing, and the skaters stayed until dusk.", "B": "The rink was closing; the skaters stayed until dusk.", "C": "The rink was closing at dusk after a long season.", "D": "Although the rink was closing, the skaters stayed until dusk."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "A paragraph argues that the town should keep its late bus. Which sentence best LINKS a new point to the one before it?", "options": {"A": "More importantly, the late bus is the only way pupils without a car can get home after clubs.", "B": "The late bus runs at nine o'clock every evening except Sunday.", "C": "In conclusion, the late bus should be kept.", "D": "However, the late bus is the only way pupils without a car can get home after clubs."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "\"The council moved the recycling bins next to the flats so that <u>they</u> would be easier to reach.\" What does the underlined pronoun refer to?", "options": {"A": "the council", "B": "the flats", "C": "the recycling bins", "D": "the residents"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which sentence keeps its list in parallel form?", "options": {"A": "The course covers planning a route, to pack a bag and reading a map.", "B": "The course covers planning a route, packing a bag and reading a map.", "C": "The course covers how to plan a route, packing a bag and you should read a map.", "D": "The course covers a route plan, packing a bag and to read a map."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which word describes a decision made after careful thought, with APPROVAL from the writer?", "options": {"A": "hasty", "B": "calculating", "C": "considered", "D": "stubborn"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "In \"the hall fell silent, and a single cough punctuated the stillness\", the word \"punctuated\" means that the cough", "options": {"A": "ended the silence for good", "B": "briefly interrupted the silence", "C": "made the silence deeper", "D": "was politely ignored"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which word is spelled correctly?", "options": {"A": "consciencious", "B": "conscientous", "C": "consientious", "D": "conscientious"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "English", "stem": "The words \"portable\", \"export\" and \"transport\" share a root that means", "options": {"A": "to carry", "B": "to build", "C": "to see", "D": "to hold back"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "English", "stem": "Which prefix means \"between\" or \"among\"?", "options": {"A": "intra-", "B": "infra-", "C": "intro-", "D": "inter-"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "English", "stem": "If someone says a plan \"does not hold water\", they mean it", "options": {"A": "is too expensive to try", "B": "does not stand up to examination", "C": "has not yet been written down", "D": "will only work in dry weather"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "English", "stem": "Adding \"-ify\" to a word usually makes it a", "options": {"A": "noun", "B": "adjective", "C": "verb", "D": "adverb"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "English", "stem": "Which word most naturally completes \"the team ____ a narrow victory\"?", "options": {"A": "secured", "B": "performed", "C": "delivered", "D": "obtained"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "22", "type": "mcq", "section": "English", "stem": "Which word describes the SAME feeling as \"annoyed\" but much more strongly?", "options": {"A": "irritated", "B": "uneasy", "C": "furious", "D": "disappointed"}, "fig": "", "passage": "", "qnum": "21"}, {"n": "23", "type": "mcq", "section": "English", "stem": "\"The path was so <u>circuitous</u> that a walk of two kilometres took us most of the morning.\" \"Circuitous\" must mean", "options": {"A": "steep and rocky", "B": "narrow and overgrown", "C": "badly signposted", "D": "long and indirect"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "24", "type": "mcq", "section": "English", "stem": "Which version is most suitable for a formal letter to the council?", "options": {"A": "I want you to fix the footpath before winter comes.", "B": "I am writing to request that the footpath be repaired before the winter.", "C": "Any chance of getting the footpath sorted before winter?", "D": "The footpath is a disgrace and must be dealt with at once."}, "fig": "", "passage": "", "qnum": "23"}, {"n": "25", "type": "mcq", "section": "English", "stem": "\"The old rink groaned under the weight of another warm winter.\" This is an example of", "options": {"A": "personification", "B": "simile", "C": "hyperbole", "D": "alliteration"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "26", "type": "mcq", "section": "English", "stem": "According to Text A, why does the writer train before sunrise?", "options": {"A": "The rink is too crowded later in the morning.", "B": "Her coach is only available at that time.", "C": "The covered rink does not open until seven.", "D": "That is when the outdoor ice is at its hardest."}, "fig": "", "passage": "<strong>A Season on the Ice</strong><br>My alarm went at half past four all through January, and I never once minded it. The rink at Kestrel Park is outdoors, and outdoor ice is only ever properly hard in the dark hour before sunrise. By five I would be lacing up on the bench at the end, breath hanging in front of me, listening to the ice tick and settle as the temperature dropped that last degree.\n\nPeople who skate indoors tell me I am making it harder than it needs to be. There is a covered rink twenty minutes away with a smooth surface, warm changing rooms and a coach who takes bookings. I have trained there. It is better in every way that can be measured, and I still choose the park. On the outdoor ice you learn to read a surface: where the wind has scoured it thin, where a puddle froze late and left a soft patch that will grab a blade. Indoors the ice tells you nothing, because it is the same everywhere.\n\nThere is also the matter of who else is there. At the covered rink you skate with skaters. At Kestrel Park, by seven, there are children being towed across the middle by their grandparents, a hockey game with coats for goalposts, and an elderly man who has circled the outside edge every morning for as long as anyone can remember and has never once spoken to me. I have raced in three counties and none of it has taught me as much as sharing a surface with people who are not training for anything.\n\nThis January the rink opened on the ninth and closed on the thirty-first. Last year it managed six weeks. My coach says I should move indoors before it costs me a season. I know she is right. I am not going to.<br><br><strong>The Slow Disappearance of the Outdoor Rink</strong><br>For most of the twentieth century, the community outdoor rink was the cheapest sports facility a town could own. A flat area, a low wooden frame and a hose were enough. Volunteers flooded the surface at night, the cold did the rest, and the rink stayed usable from December until the middle of February. Municipal records from the 1960s list more than four hundred such rinks across the northern counties.\n\nFewer than ninety are still flooded today. The reason is not falling interest. Surveys carried out by two county councils in 2023 found that demand for winter ice time had risen, not fallen, over the previous decade. The problem is that an outdoor rink needs a run of nights below minus five degrees to build a base thick enough to skate on, and a single warm week can undo six weeks of work. Across the same region, the average number of such nights has fallen from fifty-one in the 1970s to twenty-two in the 2020s.\n\nCouncils have responded in two ways. Some have installed refrigeration pipes beneath the existing surface, which extends the season to about ninety days but costs roughly forty times what a hose and a volunteer rota cost. Others have closed the outdoor rink and directed users to a covered facility, usually one that charges for entry.\n\nBoth responses solve the engineering problem. Neither addresses what the rinks were originally for. The 1960s rinks were unstaffed, unbooked and free, and the councils that built them described them in their own minutes as places for the whole town rather than for athletes. That is the part that has proved hardest to replace.", "qnum": "25"}, {"n": "27", "type": "mcq", "section": "English", "stem": "Which sentence best captures the writer's ATTITUDE to the covered rink?", "options": {"A": "She believes it is worse than the outdoor rink in every respect.", "B": "She accepts that it is better in measurable ways but values something it cannot give her.", "C": "She has never trained there and is judging it from a distance.", "D": "She would move there at once if she could afford the fees."}, "fig": "", "passage": "<strong>A Season on the Ice</strong><br>My alarm went at half past four all through January, and I never once minded it. The rink at Kestrel Park is outdoors, and outdoor ice is only ever properly hard in the dark hour before sunrise. By five I would be lacing up on the bench at the end, breath hanging in front of me, listening to the ice tick and settle as the temperature dropped that last degree.\n\nPeople who skate indoors tell me I am making it harder than it needs to be. There is a covered rink twenty minutes away with a smooth surface, warm changing rooms and a coach who takes bookings. I have trained there. It is better in every way that can be measured, and I still choose the park. On the outdoor ice you learn to read a surface: where the wind has scoured it thin, where a puddle froze late and left a soft patch that will grab a blade. Indoors the ice tells you nothing, because it is the same everywhere.\n\nThere is also the matter of who else is there. At the covered rink you skate with skaters. At Kestrel Park, by seven, there are children being towed across the middle by their grandparents, a hockey game with coats for goalposts, and an elderly man who has circled the outside edge every morning for as long as anyone can remember and has never once spoken to me. I have raced in three es better skaters than indoor ice.", "D": "Small towns should spend more on their sports facilities."}, "fig": "", "passage": "<strong>A Season on the Ice</strong><br>My alarm went at half past four all through January, and I never once minded it. The rink at Kestrel Park is outdoors, and outdoor ice is only ever properly hard in the dark hour before sunrise. By five I would be lacing up on the bench at the end, breath hanging in front of me, listening to the ice tick and settle as the temperature dropped that last degree.\n\nPeople who skate indoors tell me I am making it harder than it needs to be. There is a covered rink twenty minutes away with a smooth surface, warm changing rooms and a coach who takes bookings. I have trained there. It is better in every way that can be measured, and I still choose the park. On the outdoor ice you learn to read a surface: where the wind has scoured it thin, where a puddle froze late and left a soft patch that will grab a blade. Indoors the ice tells you nothing, because it is the same everywhere.\n\nThere is also the matter of who else is there. At the covered rink you skate with skaters. At Kestrel Park, by seven, there are children being towed across the middle by their grandparents, a hockey game with coats for goalposts, and an elderly man who has circled the outside edge every morning for as long as anyone can remember and has never once spoken to me. I have raced in three counties and none of it has taught me as much as sharing a surface with people who are not training for anything.\n\nThis January the rink opened on the ninth and closed on the thirty-first. Last year it managed six weeks. My coach says I should move indoors before it costs me a season. I know she is right. I am not going to.<br><br><strong>The Slow Disappearance of the Outdoor Rink</strong><br>For most of the twentieth century, the community outdoor rink was the cheapest sports facility a town could own. A flat area, a low wooden frame and a hose were ice as much as Ben, and Carl pays the same as Ben. How much does Aisha pay?", "options": {"A": "$135", "B": "$90", "C": "$67.50", "D": "$108"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "52", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A jacket priced at $480 is reduced by 15% in a sale. What is the sale price?", "options": {"A": "$72", "B": "$465", "C": "$408", "D": "$552"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "53", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The rectangle shown has a length of 14 cm and a width of 9 cm. What is its area?", "options": {"A": "126 centimetres", "B": "46 square centimetres", "C": "23 square centimetres", "D": "126 square centimetres"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"340\" height=\"230\" viewBox=\"0 0 340 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"340\" height=\"230\" fill=\"white\"/><rect x=\"70\" y=\"50\" width=\"200\" height=\"120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"170.0\" y=\"198\" text-anchor=\"middle\" font-size=\"15\">14 cm</text><text x=\"58\" y=\"115.0\" text-anchor=\"end\" font-size=\"15\">9 cm</text></svg>", "passage": "", "qnum": "16"}, {"n": "54", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A rectangular water tank measures 60 cm long, 40 cm wide and 25 cm deep. How many litres does it hold when it is full? (1 litre fills 1,000 cubic centimetres.)", "options": {"A": "60 litres", "B": "60,000 litres", "C": "6 litres", "D": "125 litres"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "55", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A recipe needs 1.25 kg of flour, 750 g of sugar and 400 g of butter. What is the total mass in kilograms?", "options": {"A": "2,400 kg", "B": "2.04 kg", "C": "2.4 kg", "D": "2.375 kg"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "56", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Look at this sequence: 3, 6, 11, 18, 27, ___ . What number comes next?", "options": {"A": "36", "B": "35", "C": "54", "D": "38"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "57", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which word goes in front of all three of these to make a compound word: ____ band, ____ watch, ____ cuff?", "options": {"A": "wrist", "B": "hand", "C": "arm", "D": "clock"}, "fig": "", "passage": "", "qnum": "20"}, {"n": "58", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "The solid shown is a triangular prism. How many EDGES does it have?", "options": {"A": "6", "B": "9", "C": "5", "D": "12"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><polygon points=\"150,160 70,160 110,90 190,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"40,160 150,160 110,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"40\" y1=\"160\" x2=\"80\" y2=\"90\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M80,90 L190,90 M80,90 L110,90\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "21"}, {"n": "59", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A rope 23 m long is cut into three pieces. The second piece is twice as long as the first, and the third is 3 m longer than the second. How long is the first piece?", "options": {"A": "5 m", "B": "8 m", "C": "4 m", "D": "6 m"}, "fig": "", "passage": "", "qnum": "22"}, {"n": "60", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "Which of these words would appear LAST in a dictionary? station, statue, stature, statute", "options": {"A": "statute", "B": "stature", "C": "statue", "D": "station"}, "fig": "", "passage": "", "qnum": "23"}, {"n": "61", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "In a code, MONDAY is written PRQGDB. Using the same rule, how is FRIDAY written?", "options": {"A": "CODAXV", "B": "IULGDA", "C": "GSJEBZ", "D": "IULGDB"}, "fig": "", "passage": "", "qnum": "24"}, {"n": "62", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "A shuttle bus leaves the depot every 18 minutes, and the first bus of the day leaves at 06:00. At what time does the FIFTH bus leave?", "options": {"A": "07:30", "B": "07:12", "C": "06:72", "D": "06:54"}, "fig": "", "passage": "", "qnum": "25"}, {"n": "63", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"The city health service will run its vaccination clinic on Saturday mornings so that people who work on weekdays can attend.\"\n\nPROPOSED ASSUMPTION: \"Some of the people the clinic is meant to reach cannot attend on a weekday.\"\n\nUsing only the information in the statement, is this assumption being made?", "options": {"A": "Yes. The stated reason for moving the clinic to Saturday is that weekday workers can then attend, which only makes sense if some of the intended patients are unable to come during the week.", "B": "No. The statement gives the clinic's opening time but says nothing about whether anyone is unable to attend on other days."}, "fig": "", "passage": "", "qnum": "26"}, {"n": "64", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"Every pupil at Marlow School who joined the newspaper club is also enrolled on the media studies course. Priya is enrolled on the media studies course.\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "Priya joined the newspaper club.", "B": "Priya did not join the newspaper club.", "C": "Every pupil on the media studies course joined the newspaper club.", "D": "It cannot be determined from the statement whether Priya joined the newspaper club."}, "fig": "", "passage": "", "qnum": "27"}, {"n": "65", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A health survey of all 400 Year 9 pupils at Bellwood School found that 260 walk or cycle to school, 180 take part in a sports club, and 120 do both.\"\n\nCONCLUSION (1): More than half of the pupils surveyed walk or cycle to school.\nCONCLUSION (2): Every pupil who takes part in a sports club also walks or cycles to school.\nCONCLUSION (3): Fewer than 100 pupils neither walk or cycle to school nor take part in a sports club.\n\nWhich conclusions follow beyond reasonable doubt?", "options": {"A": "Conclusions 1 and 3 follow, but Conclusion 2 does not.", "B": "Conclusion 1 follows, but Conclusions 2 and 3 do not.", "C": "Conclusions 1 and 2 follow, but Conclusion 3 does not.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "28"}, {"n": "66", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "FACTS: \"Every teacher at Ashford School who supervises the school magazine has completed the media training course. No one who has completed the media training course teaches Year 7.\"\n\nWhich conclusion FOLLOWS from these facts?", "options": {"A": "No teacher who supervises the school magazine teaches Year 7.", "B": "Every teacher who has completed the media training course supervises the school magazine.", "C": "Some teachers who teach Year 7 have completed the media training course."}, "fig": "", "passage": "", "qnum": "29"}, {"n": "67", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "QUESTION: \"Should the school district require all secondary schools to start lessons no earlier than 8:45 in the morning?\"\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "Yes. I have never been able to think straight in a first lesson at eight o'clock, and honestly neither has anyone I know! Ask any teenager in the country and they will tell you the same thing. Why do adults keep pretending this is complicated when everybody already knows the answer?", "B": "No. School has always started early, and generations of pupils have coped perfectly well. Changing the timetable now would upset bus routes, sports fixtures and thousands of working parents, all so that teenagers can stay up later on their phones and still get up at the same time.", "C": "Yes. When one district in Washington State moved secondary start times from 7:50 to 8:45, researchers tracking the same pupils recorded a median increase of 34 minutes of sleep a night, a fall in first-period absence from 15.5 per cent to 13.6 per cent, and a rise in median grades. The change applied to every school at once, so the comparison is not distorted by families choosing a later school for their child."}, "fig": "", "passage": "", "qnum": "30"}, {"n": "68", "type": "mcq", "section": "Maths, Logic & Critical Thinking", "stem": "STATEMENT: \"A local newspaper reported: 'In the two years after Fairhaven council opened its riverside cycle path, the proportion of adults in the town who cycle at least once a week rose from 9 per cent to 16 per cent.'\"\n\nWhich of the following MUST BE TRUE on the information given?", "options": {"A": "The cycle path caused more adults in Fairhaven to take up cycling.", "B": "More than three quarters of Fairhaven adults now cycle at least once a week.", "C": "A larger proportion of Fairhaven adults cycled weekly two years after the path opened than before it opened.", "D": "The number of adults cycling weekly in Fairhaven nearly doubled."}, "fig": "", "passage": "", "qnum": "31"}, {"n": "69", "type": "info", "title": "中文 Chinese", "body": "阅读下面的短文，然后回答问题。Read the passage, then answer. (繁體 then 简体.)"}, {"n": "70", "type": "mcq", "section": "Chinese", "stem": "「我」第一次走進陳記麵檔，是因為甚麼？<br><i>「我」第一次走进陈记面档，是因为甚么？</i>", "options": {"A": "聽說陳姨的麵很有名，特意去品嚐<br><i>听说陈姨的面很有名，特意去品尝</i>", "B": "家人吩咐「我」到街市買麵回家<br><i>家人吩咐「我」到街市买面回家</i>", "C": "放學後錯過了巴士，在街市裏躲雨<br><i>放学后错过了巴士，在街市里躲雨</i>", "D": "學校安排同學到街市做社會服務<br><i>学校安排同学到街市做社会服务</i>"}, "fig": "", "passage": "街市盡頭有一家小小的麵檔，招牌上「陳記」兩個字被油煙燻得發黃。每天清晨五時，陳姨已經在案板前忙碌。她把麵粉倒進大盆裏，加水，撒鹽，然後用力揉搓。麵團在她掌下由散亂漸漸變得光滑，像一塊溫潤的玉。\n\n我第一次走進這家麵檔，是去年冬天。那天下着細雨，我放學後貪玩，錯過了回家的巴士，只好在街市裏躲雨。陳姨見我站在檐下發抖，便招手叫我進去，遞來一碗熱湯。湯是清的，卻帶着一股淡淡的甘味。我一口喝下，整個人都暖了起來。\n\n從那以後，我每逢周末都到麵檔幫忙。陳姨教我揉麵，說：「揉麵不能急，急了麵就散。」我起初不明白，總嫌她的動作太慢。有一次我趁她不在，偷偷加快速度，結果麵團裂成一塊一塊，怎麼也黏不回去。陳姨回來看見，並沒有責備我，只是重新和了一盆麵，讓我從頭再來。她說：「手上的功夫，是時間一點一點餵出來的。」\n\n陳姨的麵檔並不賺錢。街口新開了一家連鎖麵館，裝修明亮，價錢也便宜。有人勸她收檔，她卻搖頭：「街坊吃慣了我的麵，我走了，他們吃甚麼呢？」這句話說得平淡，我卻聽得心裏一震。\n\n今年夏天，我終於揉出了第一團像樣的麵。陳姨把它切成細條，下鍋，撈起，淋上一勺熱油。我捧着那碗麵，忽然明白她說的「餵」是甚麼意思：不只是麵團要慢慢養，人的耐性也是。\n\n如今我升上中學，功課忙了，去麵檔的日子少了。可是每次經過街市，聞到那股熟悉的油香，我總會停下腳步，想起那個雨天，和那雙沾滿麵粉的手。<br><i>街市尽头有一家小小的面档，招牌上「陈记」两个字被油烟熏得发黄。每天清晨五时，陈姨已经在案板前忙碌。她把面粉倒进大盆里，加水，撒盐，然后用力揉搓。面团在她掌下由散乱渐渐变得光滑，像一块温润的玉。\n\n我第一次走进这家面档，是去年冬天。那天下着细雨，我放学后贪玩，错过了回家的巴士，只好在街市里躲雨。陈姨见我站在檐下发抖，便招手叫我进去，递来一碗热汤。汤是清的，却带着一股淡淡的甘味。我一口喝下，整个人都暖了起来。\n\n从那以后，我每逢周末都到面档帮忙。陈姨教我揉面，说：「揉面不能急，急了面就散。」我起初不明白，总嫌她的动作太慢。有一次我趁她不在，偷偷加快速度，结果面团裂成一块一块，怎么也黏不回去。陈姨回来看见，并没有责备我，只是重新和了一盆面，让我从头再来。她说：「手上的功夫，是时间一点一点喂出来的。」\n\n陈姨的面档并不赚钱。街口新开了一家连锁面馆，装修明亮，价钱也便宜。有人劝她收档，她却摇头：「街坊吃惯了我的面，我走了，他们吃甚么呢？」这句话说得平淡，我却听得心里一震。\n\n今年夏天，我终于揉出了第一团像样的面。陈姨把它切成细条，下锅，捞起，淋上一勺热油。我捧着那碗面，忽然明白她说的「喂」是甚么意思：不只是面团要慢慢养，人的耐性也是。\n\n如今我升上中学，功课忙了，去面档的日子少了。可是每次经过街市，闻到那股熟悉的油香，我总会停下脚步，想起那个雨天，和那双沾满面粉的手。</i>", "qnum": "1"}, {"n": "71", "type": "mcq", "section": "Chinese", "stem": "陳姨說「揉麵不能急，急了麵就散」，最主要想說明甚麼道理？<br><i>陈姨说「揉面不能急，急了面就散」，最主要想说明甚么道理？</i>", "options": {"A": "做事要有耐性，欲速反而壞事<br><i>做事要有耐性，欲速反而坏事</i>", "B": "麵粉的份量一定要準確<br><i>面粉的份量一定要准确</i>", "C": "年輕人的體力比長者好<br><i>年轻人的体力比长者好</i>", "D": "做生意必須薄利多銷<br><i>做生意必须薄利多销</i>"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "72", "type": "mcq", "section": "Chinese", "stem": "「我」偷偷加快揉麵速度，結果怎樣？<br><i>「我」偷偷加快揉面速度，结果怎样？</i>", "options": {"A": "麵團變得比平日更加光滑<br><i>面团变得比平日更加光滑</i>", "B": "麵團裂成一塊一塊，怎麼也黏不回去<br><i>面团裂成一块一块，怎么也黏不回去</i>", "C": "陳姨十分生氣，責備了「我」一頓<br><i>陈姨十分生气，责备了「我」一顿</i>", "D": "麵團黏在案板上，弄髒了整張桌子<br><i>面团黏在案板上，弄脏了整张桌子</i>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "73", "type": "m 个成语概括？</i>", "options": {"A": "一鳴驚人<br><i>一鸣惊人</i>", "B": "半途而廢<br><i>半途而废</i>", "C": "欲速不達<br><i>欲速不达</i>", "D": "因小失大"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "80", "type": "mcq", "section": "Chinese", "stem": "陳姨數十年守着小小的麵檔，不為新店所動。用哪個成語形容最恰當？<br><i>陈姨数十年守着小小的面档，不为新店所动。用哪个成语形容最恰当？</i>", "options": {"A": "見異思遷<br><i>见异思迁</i>", "B": "始終如一<br><i>始终如一</i>", "C": "孤芳自賞<br><i>孤芳自赏</i>", "D": "守株待兔"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "81", "type": "mcq", "section": "Chinese", "stem": "「有人勸她收檔，她卻搖頭。」句中的「卻」表示前後兩句是哪一種關係？<br><i>「有人劝她收档，她却摇头。」句中的「却」表示前后两句是哪一种关系？</i>", "options": {"A": "因果關係<br><i>因果关系</i>", "B": "並列關係<br><i>并列关系</i>", "C": "遞進關係<br><i>递进关系</i>", "D": "轉折關係<br><i>转折关系</i>"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "82", "type": "mcq", "section": "Chinese", "stem": "把「陳姨把麵團切成細條」改寫成被動句，下列哪一句最恰當？<br><i>把「陈姨把面团切成细条」改写成被动句，下列哪一句最恰当？</i>", "options": {"A": "陳姨被麵團切成細條。<br><i>陈姨被面团切成细条。</i>", "B": "麵團被陳姨切成細條。<br><i>面团被陈姨切成细条。</i>", "C": "麵團把陳姨切成細條。<br><i>面团把陈姨切成细条。</i>", "D": "陳姨的麵團切成了細條。<br><i>陈姨的面团切成了细条。</i>"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "83", "type": "mcq", "section": "Chinese", "stem": "「麵團在她掌下由散亂漸漸變得光滑，像一塊溫潤的玉。」這句用了哪種修辭手法？<br><i>「面团在她掌下由散乱渐渐变得光滑，像一块温润的玉。」这句用了哪种修辞手法？</i>", "options": {"A": "比喻", "B": "擬人<br><i>拟人</i>", "C": "誇張<br><i>夸张</i>", "D": "排比"}, "fig": "", "passage": "", "qnum": "14"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT CIS: Stage 4 (V4)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
