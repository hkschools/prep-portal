  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}

  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}

  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}

tions": {"A": "it announced", "B": "it did announce", "C": "did it announce", "D": "announced it"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word capitulate in the sentence below? After months of siege and dwindling supplies, the garrison was finally forced to capitulate.", "options": {"A": "retaliate", "B": "surrender", "C": "negotiate", "D": "regroup"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Identify the labelled section that contains an error. No sooner had the alarm sounded (A) than the staff, who had rehearsed the drill many times, (B) begun to file out, (C) moving calmly toward the exits (D) without the slightest panic.", "options": {"A": "section (A)", "B": "section (B)", "C": "section (C)", "D": "section (D)"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the correct word form to complete the sentence: The crowd erupted into such a ____ of cheering and drumming that the speaker could not be heard.", "options": {"A": "cacophonous", "B": "cacophonously", "C": "cacophony", "D": "cacophonist"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word myriad in the sentence below? From the hilltop the astronomer pointed out the myriad stars scattered across the clear night sky.", "options": {"A": "countless", "B": "distant", "C": "ancient", "D": "faint"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which option gives TWO words that could both correctly replace the underlined word with the same meaning? As the storm passed, the howling wind began to <u>wane</u>.", "options": {"A": "subside and intensify", "B": "swell and abate", "C": "subside and diminish", "D": "diminish and resume"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word indifferent as it is used in the final sentence (\"the indifferent power of the ocean\")?", "options": {"A": "uncaring", "B": "merciless", "C": "average", "D": "gentle"}, "fig": "", "passage": "<strong>The Lighthouse Keepers Who Vanished</strong><br>The Empty Tower\n\nOn the morning of 26 December 1900, a relief boat approached the lonely island of Eilean Mor in the Flannan Isles, off the west coast of Scotland. The three men who tended its lighthouse were due to be relieved, yet no light had shone from the tower for several nights, and passing ships had reported the darkness with growing unease. When the relief keeper, a man named Joseph Moore, climbed the long flight of steps cut into the cliff and called out, no one answered. He pushed open the unlocked door and found the rooms cold and silent. The kitchen was orderly, the beds were neatly made, and the clock on the wall had stopped, having run down for want of winding. A half-eaten meal sat on the table, as though the keepers had risen suddenly and meant to return. Of the three men, there was no trace at all. Moore searched every room twice, then stood in the doorway, reluctant to accept what the stillness already told him.\n\nThe Logbook\n\nIn the days that followed, investigators pieced together what they could from the keepers' logbook, hoping the careful daily entries would explain the silence. Instead, the records only deepened the mystery. The entries described a ferocious storm that had battered the rocks for days, with winds so violent that the men could scarcely stand. Yet weather records from nearby islands, and from passing vessels, showed calm seas across exactly those dates. Stranger still was the tone of the writing. One keeper, James Ducat, was an experienced and steady man, not given to nerves, yet the log recorded that he had been seen weeping. Another, it was written, had fallen silent and turned to prayer. The senior keeper was said to have grown unusually quiet. The final entry, dated 15 December, ended without any note of alarm: \"Storm ended, sea calm. God is over all.\" After those words the page was blank, and no one ever learned what happened next.\n\nThe Physical Evidence\n\nThe physical clues were as puzzling as the written ones. A set of oilskin coats and sea boots was missing from their pegs, suggesting that the men had gone outside into rough weather. Yet one keeper's coat remained on its hook by the door, as if he had left in such haste that he never stopped to take it. Down at the western landing, where supplies were hauled up from the sea, the damage was severe. Iron railings had been bent and twisted, ropes had been torn from their fastenings, and a heavy wooden storage box, fixed into a crevice more than thirty metres above the water, had been wrenched out and smashed to pieces. Tools were scattered across the rocks, and a great block of stone had been shifted from its place. Such destruction, so high above the normal reach of the sea, implied a wave of extraordinary and almost unimaginable size.\n\nThe Accepted Theory\n\nOver the years many fanciful explanations were offered, from sea serpents to ghostly abductions, but the most widely accepted account is sober rather than supernatural. The Flannan Isles are notorious among sailors for sudden, towering waves that can surge up the narrow gullies without warning, even on a day that begins calm. The accepted theory holds that two of the keepers went down to the western landing to secure equipment as a great swell approached, and that when that swell failed to draw back as expected, the third keeper, seeing the danger, rushed out coatless to help his companions. A second, larger wave then struck and carried all three men into the sea. No ghost story is required to account for their fate, only the indifferent power of the ocean and the courage of men who, for one fatal moment, underestimated it.", "q they could from the keepers' logbook, hoping the careful daily entries would explain the silence. Instead, the records only deepened the mystery. The entries described a ferocious storm that had battered the rocks for days, with winds so violent that the men could scarcely stand. Yet weather records from nearby islands, and from passing vessels, showed calm seas across exactly those dates. Stranger still was the tone of the writing. One keeper, James Ducat, was an experienced and steady man, not given to nerves, yet the log recorded that he had been seen weeping. Another, it was written, had fallen silent and turned to prayer. The senior keeper was said to have grown unusually quiet. The final entry, dated 15 December, ended without any note of alarm: \"Storm ended, sea calm. God is over all.\" After those words the page was blank, and no one ever learned what happened next.\n\nThe Physical Evidence\n\nThe physical clues were as puzzling as the written ones. A set of oilskin coats and sea boots was missing from their pegs, suggesting that the men had gone outside into rough weather. Yet one keeper's coat remained on its hook by the door, as if he had left in such haste that he never stopped to take it. Down at the western landing, where supplies were hauled up from the sea, the damage was severe. Iron railings had been bent and twisted, ropes had been torn from their fastenings, and a heavy wooden storage box, fixed into a crevice more than thirty metres above the water, had been wrenched out and smashed to pieces. Tools were scattered across the rocks, and a great block of stone had been shifted from its place. Such destruction, so high above the normal reach of the sea, implied a wave of extraordinary and almost unimaginable size.\n\nThe Accepted Theory\n\nOver the years many fanciful explanations were offered, from sea serpents to ghostly abductions, but the most widely accepted account is sober rather than supernatural. The Flannan Isles are notorious among sailors for sudden, towering waves that can surge up the narrow gullies without warning, even on a day that begins calm. The accepted theory holds that two of the keepers went down to the western landing to secure equipment as a great swell approached, and that when that swell failed to draw back as expected, the third keeper, seeing the danger, rushed out coatless to help his companions. A second, larger wave then struck and carried all three men into the sea. No ghost story is required to account for their fate, only the indifferent power of the ocean and the courage of men who, for one fatal moment, underestimated it.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Stage 6 (HKIS IDAT Concise) two-part English writing task: a drop-down editing cloze followed by a single paragraph chosen from two options (one explanatory, one recount/narrative).", "label": "", "body": "", "hint": "This task has two parts. In Part 1, read the passage and choose the best option for each of the six numbered brackets. In Part 2, choose ONE of the two tasks and write a single paragraph of no more than 14 sentences. Plan briefly before you write, use precise vocabulary, and check your grammar and punctuation when you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option that makes the writing correct and appropriate.\n\nThe deep ocean is one of the least explored places on Earth. Although it covers most of the planet, scientists [1: A) has B) have C) is] mapped only a small fraction of its floor in detail. Conditions there are extreme: the water is intensely cold, sunlight cannot reach such depths, and the pressure is far [2: A) greater B) greatest C) more great] than anything found on land. Creatures that survive in this zone have adapted [3: A) remarkable B) remarkably C) remark] to their surroundings. Much of what we know [4: A) has been B) have been C) has being] learned from robotic submersibles, which can withstand pressures that would crush a human diver. [5: A) Because of B) Despite C) Owing to] these advances, researchers argue that the abyss remains more mysterious than the surface of Mars. The next generation of explorers may finally reveal what lies [6: A) beneath B) between C) beside] the ocean's surface.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 14 sentences: (1) Explain, for a younger student, how scientists are able to study the deep ocean and why the work is so difficult. Write a clear, informational paragraph that gives reasons and uses precise language. (2) Recount a time when you, or a character you invent, discovered something unexpected in a place everyone believed was empty. Use vivid description and show how the discovery changed the way that person felt or thought."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you do best?", "options": {"A": "Sports and moving my body", "B": "School work and studying", "C": "Art, music or making things", "D": "Helping and working with other people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What do you most want to do better?", "options": {"A": "Stay calm when I feel worried", "B": "Speak up and share my ideas", "C": "Finish what I start", "D": "Not be so hard on myself when I get something wrong"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "When you do something well, what do you like the most?", "options": {"A": "Knowing I worked hard for it", "B": "Someone noticing and telling me", "C": "Feeling proud and happy inside", "D": "Showing others how I did it"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "How important is it to you to know what you are good at and what you find tricky?", "options": {"A": "Not important", "B": "A little important", "C": "Quite important", "D": "Very important"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "A sport or game I have never played", "B": "Performing or speaking in front of others", "C": "A hard puzzle or tricky project", "D": "Making a new friend I do not know yet"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "When you have to try something new and hard, how comfortable do you usually feel?", "options": {"A": "Very comfortable", "B": "Quite comfortable", "C": "A little comfortable", "D": "Not very comfortable"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "When something is hard and does not work the first time, what do you do best?", "options": {"A": "Stick with it and keep going", "B": "Try a different way", "C": "Ask someone for help", "D": "Take a break, then come back to it"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "Of these, which do you enjoy the least?", "options": {"A": "Plans changing at the last minute", "B": "Doing something I have not practised yet", "C": "Doing the same thing over and over", "D": "Being rushed before I am ready"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Imagine you are given four things: a ball, a paintbrush, a notebook and a puzzle. What would you most want to do?", "options": {"A": "Play with the ball", "B": "Paint or draw a picture", "C": "Write or invent a story in the notebook", "D": "Solve the puzzle"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you work on a project, what do you like the most?", "options": {"A": "Thinking up a brand new idea", "B": "Making someone else's idea better", "C": "Spotting how ection": "Maths", "stem": "In triangle ABC, AB = 7 m, CA = 5 m and the included angle at A = 48°. Use the cosine rule to find BC (to 2 d.p.).", "options": {"A": "5.21 m", "B": "8.60 m", "C": "6.24 m", "D": "10.99 m"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"314\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"185\" cy=\"55\" r=\"3\" fill=\"#1F3864\"/><text x=\"185\" y=\"47\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"180\" y=\"215\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">7 m</text><text x=\"264\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#C00\">?</text><text x=\"100\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">5 m</text><text x=\"84\" y=\"223\" font-size=\"13\" fill=\"#C00\">48°</text><path d=\"M78,195 A18,18 0 0 1 72,182\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.4\"/></svg>", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "In triangle PQR, angle P = 40°, angle Q = 75° and the side p (opposite P) = 10 cm. Use the sine rule to find side q (opposite Q), to 2 d.p.", "options": {"A": "6.65 cm", "B": "9.06 cm", "C": "15.03 cm", "D": "12.31 cm"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "A triangle has sides 6 cm, 9 cm and 11 cm. Use Heron's formula to find its area (to 2 d.p.).", "options": {"A": "33.00 cm²", "B": "26.98 cm²", "C": "27.00 cm²", "D": "13.00 cm²"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "A sector of a circle has radius 12 cm and subtends an angle of 5π/6 radians at the centre. Find the area of the sector (to 2 d.p.). [Sector area = ½r²θ]", "options": {"A": "31.42 cm²", "B": "15.71 cm²", "C": "376.99 cm²", "D": "188.50 cm²"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "Two events satisfy P(A) = 0.4, P(B) = 0.5 and P(A∩B) = 0.25. Are A and B independent?", "options": {"A": "Dependent, because P(A)·P(B) ≠ P(A∩B)", "B": "Independent, because P(A)·P(B) = P(A∩B)", "C": "Dependent, because P(A∩B) ≠ 0", "D": "Independent, because P(A∩B) < P(A) and < P(B)"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "Given matrix A = [[3, −2],[0, 5],[7, 1]] and B = [[1, 4],[−2, 0]], compute A − B.", "options": {"A": "[[2, −6],[2, 5],[7, 1]]", "B": "[[4, 2],[−2, 5],[7, 1]]", "C": "[[2, −6],[2, 5]]", "D": "Undefined (dimensions do not match)"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"168\" height=\"138\" viewBox=\"0 0 168 138\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"168\" height=\"138\" fill=\"white\"/><text x=\"10\" y=\"74\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A =</text><path d=\"M60,18 L52,18 L52,120 L60,120\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M148,18 L156,18 L156,120 L148,120\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"81\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">3</text><text x=\"127\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">-2</text><text x=\"81\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">0</text><text x=\"127\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">5</text><text x=\"81\" y=\"108\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">7</text><text x=\"127\" y=\"108\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">1</text></svg>", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "Simplify (3 + 2i)(4 − 5i), where i = √−1.", "options": {"A": "12 − 10i", "B": "22 − 7i", "C": "2 − 7i", "D": "22 + 7i"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "A polynomial with real coefficients has 2 − i as a root (i = √−1). Find a real quadratic factor of the polynomial.", "options": {"A": "x² − 4x + 5", "B": "x² + 4x + 5", "C": "x² − 4x − 3", "D": "x² − 4x + 3"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "Find the remainder when f(x) = x³ − 4x² + 2x + 7 is divided by (x + 2).", "options": {"A": "3", "B": "15", "C": "−21", "D": "11"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "In the binomial expansion of (b + 3)⁶, find the coefficient of the b⁴ term.", "options": {"A": "15", "B": "135", "C": "1215", "D": "540"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "46", "type": "mcq", "section": "Maths", "stem": "In a geometric sequence, the 3rd term is 18 and the 5th term is 162. Given that the common ratio is positive, find the first term a₁.", "options": {"A": "6", "B": "3", "C": "54", "D": "2"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "47", "type": "mcq", "section": "Maths", "stem": "For the arithmetic sequence 48, 41, 34, 27, …, find the sum of the first 12 terms.", "options": {"A": "−29", "B": "228", "C": "114.00", "D": "72.00"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "48", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at this sequence of letter-triples, which follows a fixed rule:  DGK,  FIM,  HKO,  ____.  What is the next triple?", "options": {"A": "JMQ", "B": "INR", "C": "HMQ", "D": "JNR"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "In an invented code language:  'tovi mesh kran' means 'birds eat seeds',  'ralo mesh pibo' means 'foxes eat berries',  and  'tovi dren ralo' means 'birds chase foxes'.  Which code word means 'eat'?", "options": {"A": "tovi", "B": "ralo", "C": "mesh", "D": "dren"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A bag holds 4 red, 3 green and 5 yellow marbles. You draw two marbles one after the other WITHOUT replacing the first. What is the probability that BOTH marbles are red?", "options": {"A": "1/9", "B": "1/11", "C": "1/12", "D": "3/11"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Solve this riddle:  'I have keys but open no locks. I have space but no room. You can press enter, but you cannot step inside. What am I?'", "options": {"A": "a piano", "B": "a map", "C": "a hotel", "D": "a keyboard"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Read these two statements and treat them as true:  (1) Every member of the chess club also plays the piano.  (2) No one who plays the piano studies Latin.  Which conclusion MUST be true?", "options": {"A": "Everyone who studies Latin plays the piano.", "B": "Some members of the chess club study Latin.", "C": "No member of the chess club studies Latin.", "D": "Everyone who plays the piano is in the chess club."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "PASSAGE: A transport official argues: \"Our district already has a scattering of paid roadside chargers and a handful of homeowners with private wall units, but uptake of electric vehicles has stalled at four per cent. The single decisive factor is cost-at-the-point-of-use. Therefore the only way to push residents over the line and persuade them to switch is for the council to fund a network of FREE public charging stations in every neighbourhood; nothing short of removing the charging fee will change behaviour.\"\n\nPROPOSED ASSUMPTION: Residents currently have no access to any charging facilities of any kind.\n\nUsing only the information in the passage, is this assumption one that the argument MUST be making?", "options": {"A": "Yes — describing free public stations as the 'only way' to persuade residents can be true only if no charging facility of any kind exists at present.", "B": "No — the argument's claim is about persuasion turning on the absence of a FEE, not on the absence of charging; the passage explicitly notes that paid and private charging already exist but are judged too costly to change behaviour, so it does not assume facilities are absent.", "C": "Yes — because the official wants stations in 'every neighbourhood', he must be assuming that no neighbourhood is currently served at all.", "D": "No — the argument is really about residents not yet owning electric vehicles, so it assumes a shortage of vehicles rather than of charging, and the proposed assumption misidentifies the gap."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"In the wellbeing survey, every student who reported sleeping fewer than six hours a night also reported feeling tired during morning classes. Some students who slept more than six hours also reported feeling tired in the morning. The survey did not record how many students fell into each sleep category, and a few students declined to answer the morning-tiredness question altogether.\"\n\nWhich ONE of the following MUST be true on the basis of the statement alone?", "options": {"A": "Sleeping fewer than six hours a night causes students to feel tired in morning classes.", "B": "Most students who felt tired in the morning slept fewer than six hours a night.", "C": "A student in the survey who did NOT report feeling tired in the morning, and who answered the tiredness question, slept at least six hours a night.", "D": "Students who slept more than six hours were less likely to feel tired than those who slept fewer than six hours."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS: (1) Every member of the debate club also belongs to the school's public-speaking society. (2) No member of the public-speaking society is in Year 9. (3) Mei is in Year 9.\n\nWhich ONE of the following conclusions does NOT follow from the facts (it is neither provable nor disprovable from them)?", "options": {"A": "Mei is not a member of the debate club.", "B": "Mei is not a member of the public-speaking society.", "C": "No Year 9 student is a member of the debate club.", "D": "Every member of the public-speaking society is also a member of the debate club."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "57", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: Should the city government make residential rooftop solar panels mandatory on all new housing developments?\n\nWhich of the following is the STRONGEST argument?", "options": {"A": "Yes — a five-year city study of 4,000 new homes found that mandated rooftop solar cut each household's grid electricity use by an average of 38% and paid back its installation cost within seven years, while the wider rollout measurably reduced peak-summer strain on the power network.", "B": "No — either we mandate rooftop solar on every new home or we abandon any hope of cutting the city's emissions, and a blanket mandate is too heavy-handed, so we should do nothing.", "C": "Yes — the national energy regulator's chairman, who is a respected public figure, has said he personally likes solar panels, and we should defer to his standing on the matter.", "D": "No — a developer lobby group's brochure claims mandatory solar would raise house prices by 30%, so the policy would clearly make housing unaffordable."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 6 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
