<title>IDAT HKIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

est in meaning to the word ephemeral in the sentence below? The blossoms were beautiful but ephemeral, gone within a single afternoon of spring wind.", "options": {"A": "fragrant", "B": "short-lived", "C": "delicate", "D": "colourless"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word tenacious in the sentence below? Despite repeated rejections, the young inventor remained tenacious, refining her design night after night.", "options": {"A": "talented", "B": "anxious", "C": "persistent", "D": "secretive"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the correct word form to complete the sentence: Deep in the cave, the divers were astonished by the faint ____ of the glow-worms clinging to the rocks.", "options": {"A": "luminescence", "B": "luminescent", "C": "luminescently", "D": "luminesce"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Three of the following are real English words and one is not. Which is NOT a real English word?", "options": {"A": "remediation", "B": "remedial", "C": "remediate", "D": "remediment"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word gregarious in the sentence below? Unlike her reserved brother, Priya was gregarious, happiest in the middle of a noisy, crowded room.", "options": {"A": "generous", "B": "talkative", "C": "sociable", "D": "cheerful"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which option gives TWO words that could both correctly replace the underlined word with the same meaning? The accountant was praised for her <u>meticulous</u> records.", "options": {"A": "careless and thorough", "B": "scrupulous and painstaking", "C": "hasty and precise", "D": "painstaking and indifferent"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Based on the passage, why did disagreeing clocks become dangerous once railways appeared, when they had caused no trouble before?", "options": {"A": "Because villagers began travelling much farther from home for pleasure.", "B": "Because the sun no longer reached its highest point at noon.", "C": "Because farmers could no longer read the time from the sky.", "D": "Because two trains on one track could be sent toward each other by clocks that disagreed."}, "fig": "", "passage": "<strong>Setting the Nation's Clocks</strong><br>A Patchwork of Local Times\n\nFor most of human history, no two towns kept exactly the same time, and almost nobody minded. Each community set its clocks by the sun, declaring it noon at the moment the sun stood highest over its own rooftops. Because the sun reaches its peak a little later as one travels west, a town fifty miles to the west of another might run its clocks several minutes behind. A traveller crossing a country could pass through dozens of slightly different local times in a single day. For farmers and villagers who rarely went far from home, this patchwork caused no trouble at all. The sun was the clock, and the sun was good enough. A letter sent by horse might take a week to arrive, so a few minutes' difference between one town's clock and the next mattered to no one. Life moved at the pace of walking, riding and sailing, and time itself felt local, personal, and beyond dispute.\n\nThe Railways Demand Order\n\nThe arrival of the railway changed everything. Trains ran to printed timetables, and a timetable is useless if every station along the line measures the hour differently. A train leaving one city at what its clock called ten o'clock might arrive in the next city at a time that, by the local reckoning there, made no sense at all. Worse, two trains running on the same track to clocks that disagreed could be set on a collision course, each driver convinced he had the line to himself. Railway companies quickly grew impatient with the old confusion. They began, on their own authority, to impose a single standard time along their entire networks, ignoring the local sun altogether. In Britain this 'railway time' spread along the tracks until, by the 1850s, most public clocks in the country quietly followed it.\n\nThe Logic of Time Zones\n\nStandardising a small island was one thing; standardising a continent was another. A country as wide as the United States stretches across so many degrees of longitude that a single national time would have the sun rising in the morning sky for some citizens while it set for others. The solution, agreed by railway officials in 1883, was both simple and clever. Rather than force everyone onto one clock, the continent was divided into broad bands, or time zones, each keeping a uniform time and each differing from its neighbour by a tidy whole hour. Within a zone the clocks agreed perfectly; crossing into the next zone, a traveller simply moved the hands forward or back by exactly sixty minutes. The messy minute-by-minute drift of sun time was replaced by a clean, predictable grid. The idea spread far beyond America, and within a few decades most of the world had agreed to measure its hours from a single starting line drawn through Greenwich in England, so that every zone could be described as a fixed number of hours ahead of or behind that one reference point.\n\nWhat Was Gained, What Was Lost\n\nThe benefits were enormous and are still with us. Timetables could be trusted, factories could coordinate shifts across great distances, and the telegraph could flash messages between cities that finally agreed on what hour it was. Yet something was quietly surrendered as well. The new time no longer belonged to any particular place; it was a convenience agreed upon by committees and printed in official tables, not read from the sky above one's own town. A few stubborn communities resisted for years, insisting that their 'real' noon was the one the sun gave them. In the end, though, the demands of a connected, fast-moving world won out. We accepted a small fiction, that noon is the same instant across a whole wide band of country, in exchange for the enormous gift of being able to plan our lives together.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Which phrase best describes the author's tone in the final section, \"What Was Gained, What Was Lost\"?", "options": {"A": "balanced and slightly wistful", "B": "angry and accusing", "C": "uncertain and confused", "D": "amused and mocking"}, "fig": "", "passage": "<strong>Setting the Nation's Clocks</strong><br>A Patchwork of Local Times\n\nFor most of human history, no two towns kept exactly the same time, and almost nobody minded. Each community set its clocks by the sun, declaring it noon at the moment the sun stood highest over its own rooftops. Because the sun reaches its peak a little later as one travels west, a town fifty miles to the west of another might run its clocks several minutes behind. A traveller crossing a country could pass through dozens of slightly different local times in a single day. For farmers and villagers who rarely went far from home, this patchwork caused no trouble at all. The sun was the clock, and the sun was good enough. A letter sent by horse might take a week to arrive, so a few minutes' difference between one town's clock and the next mattered to no one. Life moved at the pace of walking, riding and sailing, and time itself felt local, personal, and beyond dispute.\n\nThe Railways Demand Order\n\nThe arrival of the railway changed everything. Trains ran to printed timetables, and a timetable is useless if every station along the line measures the hour differently. A train leaving one city at what its clock called ten o'clock might arrive in the next city at a time that, by the local reckoning there, made no sense at all. hour. Within a zone the clocks agreed perfectly; crossing into the next zone, a traveller simply moved the hands forward or back by exactly sixty minutes. The messy minute-by-minute drift of sun time was replaced by a clean, predictable grid. The idea spread far beyond America, and within a few decades most of the world had agreed to measure its hours from a single starting line drawn through Greenwich in England, so that every zone could be described as a fixed number of hours ahead of or behind that one reference point.\n\nWhat Was Gained, What Was Lost\n\nThe benefits were enormous and are still with us. Timetables could be trusted, factories could coordinate shifts across great distances, and the telegraph could flash messages between cities that finally agreed on what hour it was. Yet something was quietly surrendered as well. The new time no longer belonged to any particular place; it was a convenience agreed upon by committees and printed in official tables, not read from the sky above one's own town. A few stubborn communities resisted for years, insisting that their 'real' noon was the one the sun gave them. In the end, though, the demands of a connected, fast-moving world won out. We accepted a small fiction, that noon is the same instant across a whole wide band of country, in exchange for the enormous gift of being able to plan our lives together.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Stage 6 (HKIS IDAT Concise) two-part English writing task: a drop-down editing cloze followed by a single paragraph chosen from two options (one explanatory, one recount/narrative).", "label": "", "body": "", "hint": "This task has two parts. In Part 1, read the passage and choose the best option for each of the six numbered brackets. In Part 2, choose ONE of the two tasks and write a single paragraph of no more than 14 sentences. Plan briefly before you write, use precise vocabulary, and check your grammar and punctuation when you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option that makes the writing correct and appropriate.\n\nThe city library has stood on the same corner for almost a hundred years. When it first opened, the shelves [1: A) was B) were C) is] stocked mainly with novels and a few worn atlases. Over the decades the collection grew [2: A) steady B) steadily C) more steady], until today it holds rare manuscripts as well as thousands of digital records. Every weekday morning the heavy doors are [3: A) opened B) opening C) open] by a librarian who has worked there for years. Students come [4: A) for B) at C) on] quiet corners to study, while younger children gather in the bright reading room downstairs. [5: A) Because B) Although C) Unless] the building is old, its rooms feel surprisingly modern and welcoming. Of all the public spaces in the district, the library is widely thought to be the [6: A) more useful B) most useful C) usefullest] of them all.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 14 sentences: (1) Explain, for a younger student, how to borrow a book from a library and return it on time, setting out the steps clearly so that someone who has never visited a library could follow them. (2) Write a short narrative about a day when an ordinary, familiar place suddenly felt new to you because of something you noticed or someone you met there."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "Which of these feels most like you at your best?", "options": {"A": "Being active and good at sport", "B": "Being curious and good at learning", "C": "Being imaginative and good at making things", "D": "Being kind and good with people"}, "cnum": "1 let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
