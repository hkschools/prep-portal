<title>IDAT HKIS: Stage 6 (V3)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

": "scientists encounter", "B": "do scientists encounter", "C": "scientists do encounter", "D": "have scientists encountered"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>luminosity</u> as it is used in the third section (\"its real luminosity\")?", "options": {"A": "rhythm", "B": "distance", "C": "temperature", "D": "brightness"}, "fig": "", "passage": "<strong>The Woman Who Read the Stars in a Glass Plate</strong><br>A Factory of Hidden Light\n\nAt the close of the nineteenth century, the Harvard College Observatory housed one of the strangest workplaces in all of science. Its walls were lined not with telescopes but with stacks of glass photographic plates, each one a frozen image of a patch of night sky. Every clear evening, astronomers exposed these plates to the heavens; every day, a team of women sat at long desks examining them by eye, measuring and cataloguing the brightness of star after star. They were paid a fraction of a man's wage and were not permitted to operate the great telescope themselves. The men called them, dismissively, \"computers,\" because their job was to compute. Yet it was in this quiet room, bent over panes of glass, that some of the most important discoveries in modern astronomy were made.\n\nThe Problem of Distance\n\nOne of the women, Henrietta Swan Leavitt, was given what seemed a tedious assignment: to record the brightness of a particular class of pulsing stars, called Cepheid variables, that grew brighter and dimmer in a steady rhythm. For most observers these stars were merely points of changing light, useful for filling catalogues but little else. Astronomy at the time faced a maddening problem. A star might look faint either because it was genuinely dim or because it was simply very far away, and there was no reliable way to tell the two apart. Without a yardstick for distance, the universe was a flat picture with no depth, a scattering of lights at unknown removes. Leavitt set out, plate by plate, to time the rhythm of hundreds of these pulsing stars in a single distant cloud of the sky.\n\nA Rift No One Expected\n\nWhat she noticed changed everything. Because all the stars she was studying lay in the same far-off cloud, they were all at roughly the same distance from Earth, like lamps strung along one distant wall. This meant that any difference in their apparent brightness reflected a real difference in the stars themselves, not a trick of distance. Comparing her measurements, Leavitt found a startlingly precise rule: the slower a Cepheid pulsed, the brighter it truly was. The rhythm of the star, something anyone could time with a clock, revealed its real luminosity. And once you knew a star's true brightness, you could compare it with how bright it merely appeared and calculate, at last, how far away it lay. Leavitt had forged the first dependable ruler for measuring the cosmos.\n\nThe Ladder to the Galaxies\n\nFor years the significance of her rule was slow to be recognised, and Leavitt herself, often ill and always underpaid, was given little authority to develop it. Others took up her relationship and ran with it. Within two decades it had become the bottom rung of a \"distance ladder\" that let astronomers measure the gulfs between galaxies. Using Leavitt's law, Edwin Hubble was able to prove that faint smudges once thought to be clouds within our own galaxy were in fact separate galaxies, immense and unthinkably far away, and later that these galaxies were rushing apart, evidence that the universe itself is expanding. The grandest conclusions of twentieth-century cosmology rested on a rule discovered by a woman who was never allowed to touch the telescope. Leavitt died in 1921 with little public fame, her name absent from the headlines her work had made possible. Yet every modern map of the expanding universe still begins, in effect, with the patient timing of pulsing stars on pane either because it was genuinely dim or because it was simply very far away, and there was no reliable way to tell the two apart. Without a yardstick for distance, the universe was a flat picture with no depth, a scattering of lights at unknown removes. Leavitt set out, plate by plate, to time the rhythm of hundreds of these pulsing stars in a single distant cloud of the sky.\n\nA Rift No One Expected\n\nWhat she noticed changed everything. Because all the stars she was studying lay in the same far-off cloud, they were all at roughly the same distance from Earth, like lamps strung along one distant wall. This meant that any difference in their apparent brightness reflected a real difference in the stars themselves, not a trick of distance. Comparing her measurements, Leavitt found a startlingly precise rule: the slower a Cepheid pulsed, the brighter it truly was. The rhythm of the star, something anyone could time with a clock, revealed its real luminosity. And once you knew a star's true brightness, you could compare it with how bright it merely appeared and calculate, at last, how far away it lay. Leavitt had forged the first dependable ruler for measuring the cosmos.\n\nThe Ladder to the Galaxies\n\nFor years the significance of her rule was slow to be recognised, and Leavitt herself, often ill and always underpaid, was given little authority to develop it. Others took up her relationship and ran with it. Within two decades it had become the bottom rung of a \"distance ladder\" that let astronomers measure the gulfs between galaxies. Using Leavitt's law, Edwin Hubble was able to prove that faint smudges once thought to be clouds within our own galaxy were in fact separate galaxies, immense and unthinkably far away, and later that these galaxies were rushing apart, evidence that the universe itself is expanding. The grandest conclusions of twentieth-century cosmology rested on a rule discovered by a woman who was never allowed to touch the telescope. Leavitt died in 1921 with little public fame, her name absent from the headlines her work had made possible. Yet every modern map of the expanding universe still begins, in effect, with the patient timing of pulsing stars on panes of Harvard glass.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Stage 6 (HKIS IDAT Concise) two-part English writing task: a drop-down editing cloze followed by a single paragraph chosen from two options (one explanatory, one recount/narrative).", "label": "", "body": "", "hint": "This Writing section has two parts. In Part 1, read the short passage and choose the correct option (A, B, or C) for each of the six numbered brackets to make the passage grammatically correct. In Part 2, choose ONE of the two tasks and write a single paragraph of no more than 14 sentences. Use precise vocabulary, vary your sentence structure, and check your grammar, spelling and punctuation.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option that makes the writing correct and appropriate.\n\nThe night market opens just as the last light fades from the harbour. By seven o'clock the narrow lanes [1: A) was B) were C) is] crowded with stalls selling grilled skewers, painted fans and second-hand books. The oldest vendors say the market [2: A) has been B) had been C) was being] trading on this same street for well over a century. Cooks work [3: A) quick B) quickly C) more quick] behind their stoves, flipping noodles in clouds of fragrant steam. [4: A) Because of B) Despite C) Owing to] the summer heat, the lanes stay packed until well past midnight, and the mood is unmistakably festive. Regular shoppers agree that this is [5: A) the more lively B) the most lively C) a most lively] market the city has ever known. New visitors are advised to keep a close eye [6: A) on B) of C) at] the stalls they pass, because the best bargains vanish within minutes.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 14 sentences: (1) Explain why a well-run public market or shared community space matters to a large modern city, and what trade-offs a city faces in deciding whether to protect or redevelop such a place. (2) Recount an experience or journey that did not go as you had planned, focusing on what it revealed about you or changed in the way you think."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "Which of these do you enjoy and feel good at?", "options": {"A": "Moving, playing sport or being active", "B": "Reading, writing or solving problems", "C": "Drawing, music or building things", "D": "Talking with and helping people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "Which of these would you most like to get even better at?", "options": {"A": "Staying calm when things go wrong", "B": "Keeping going until something is finished", "C": "Speaking up in front of a group", "D": "Getting along with everyone on a team"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What makes you happy?", "options": {"A": "Doing well at something I tried hard on", "B": "Finding out something I did not know", "C": "Making or building something of my own", "D": "Spending time with people I like"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "How much do you like to know how well you are doing while you work on something?", "options": {"A": "Not important", "B": "A little important", "C": "Quite important", "D": "Very important"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "A sport you have never played", "B": "A really tricky puzzle or brain-teaser", "C": "Performing on a stage", "D": "Leading a new club or team"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "When you try something for the very first time, how do you usually feel?", "options": {"A": "Excited and ready to go", "B": "Fine, mostly relaxed", "C": "A bit unsure at first", "D": "I like to wait until I feel ready"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "When something turns out to be really hard, what do you most often do?", "options": {"A": "Keep doing it the same way until it works", "B": "Try a completely different approach", "C": "Ask someone for help", "D": "Take a break and come back later"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "Which of these would you rather avoid if you could?", "options": {"A": "Doing the same thing over and over", "B": "Trying something brand new", "C": "Working without any instructions", "D": "Changing my plans at the last minute"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Imagine you are handed four things: a box of bricks, a camera, a journal and a pile of gears. You can pick the one that sounds most fun, there is no right choice. Which would you most want to use?", "options": {"A": "The bricks, to build something of my own design", "B": "The camera, to capture pictures in my own way", "C": "The journal, to fill with my ideas or stories", "D": "The gears, to work out how they fit together"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you start a new project, what do you like most?", "options": {"A": "Coming up with a totally new idea", "B": "Improving on an idea someone already had", "C": "Spotting a pattern or clever shortcut", "D": "Following a clear plan step by step"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "Which of these do you do best?", "options": {"A": "Thinking of unusual ideas", "B": "Figuring out how things work", "C": "Making a careful plan", "D": "Finishing what others have started"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "If you could try solving one problem, which would you pick?", "options": {"A": "Build something that has never been built", "B": "Fix something that is broken", "C": "Find a faster way to do a job", "D": "Organise something that is messy"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "What helps people get along with each other?", "options": {"A": "Listening carefully to one another", "B": "Sharing and taking turns", "C": "Saying sorry when someone is upset", "D": "Being fair and following the rules"}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "When you work in a group, what do you like most?", "options": {"A": "Sharing my ideas with everyone", "B": "Listening to what others think", "C": "Helping the group agree", "D": "Doing my own part well"}, "cnum": "14"}, {"n": "33", "type": "selfeval", "section": "Character", "stem": "Which of these would bother you the most?", "options": {"A": "Seeing someone left out", "B": "Not being understood", "C": "An argument between friends", "D": "Having to work all alone"}, "cnum": "15"}, {"n": "34", "type": "selfeval", "section": "Character", "stem": "When you are in a group, how much do you notice whether everyone is included?", "options": {"A": "I do not notice much", "B": "I notice a little", "C": "I notice quite a bit", "D": "I notice nearly always"}, "cnum": "16"}, {"n": "35", "type": "info", "title": "Maths", "body": "Read each question carefully and choose the best answer."}, {"n": "36", "type": "mcq", "section": "Maths", "stem": "In triangle ABC, AB = 9 cm, BC = 6 cm and the included angle B = 112°. Find AC, to 2 d.p.", "options": {"A": "12.55 cm", "B": "8.31 cm", "C": "10.82 cm", "D": "5.20 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"314\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"185\" cy=\"55\" r=\"3\" fill=\"#1F3864\"/><text x=\"185\" y=\"47\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"180\" y=\"215\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">9 cm</text><text x=\"264\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">6 cm</text><text x=\"100\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#C00\">?</text><text x=\"260\" y=\"223\" font-size=\"13\" fill=\"#C00\">112°</text><path d=\"M318,195 A18,18 0 0 1 312,182\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.4\"/></svg>", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "A triangle has sides 6 cm, 9 cm and 11 cm. Find the largest angle of the triangle, to 1 d.p.", "options": {"A": "35.4°", "B": "52.5°", "C": "92.1°", "D": "87.9°"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "A triangle has sides 7 cm, 9 cm and 12 cm. Use Heron's formula to find its area, to 2 d.p.", "options": {"A": "31.50 cm²", "B": "31.30 cm²", "C": "54.00 cm²", "D": "14.00 cm²"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "Convert 7π/4 radians to degrees.", "options": {"A": "157.5°", "B": "252°", "C": "630°", "D": "315°"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "For events A and B, P(A) = 0.45, P(B) = 0.6 and P(A∪B) = 0.78. Determine whether A and B are independent.", "options": {"A": "Independent, because P(A)·P(B) = P(A∩B)", "B": "Dependent, because P(A∩B) ≠ 0", "C": "Dependent, because P(A)·P(B) ≠ P(A∪B)", "D": "Cannot be determined without more information"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "Given A below and B = [[1, −3, 2],[−2, 1, 3]], compute A − 2B.", "options": {"A": "[[7, −8, 8],[−3, 8, 6]]", "B": "[[4, 1, 2],[3, 5, −3]]", "C": "[[3, 4, 0],[5, 4, −6]]", "D": "Undefined — the matrices have different dimensions"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"214\" height=\"104\" viewBox=\"0 0 214 104\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"214\" height=\"104\" fill=\"white\"/><text x=\"10\" y=\"57\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A =</text><path d=\"M60,18 L52,18 L52,86 L60,86\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M194,18 L202,18 L202,86 L194,86\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"81\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">5</text><text x=\"127\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">-2</text><text x=\"173\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">4</text><text x=\"81\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">1</text><text x=\"127\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">6</text><text x=\"173\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">0</text></svg>", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "Simplify (7 + 4i) / (2 − i), writing the answer in the form a + bi.", "options": {"A": "2 − 3i", "B": "2 + 3i", "C": "3.5 − 4i", "D": "10 + 15i"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "A polynomial with real coefficients has 3 + 2i as a root. Find a real quadratic factor of the polynomial.", "options": {"A": "x² + 6x + 13", "B": "x² − 6x + 5", "C": "x² − 5x + 6", "D": "x² − 6x + 13"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "Find the remainder when f(x) = 2x³ + 3x² − x + 5 is divided by (2x + 1).", "options": {"A": "6", "B": "5.5", "C": "9", "D": "7"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "In the expansion of (3x + 2)⁵, find the coefficient of the x² term.", "options": {"A": "90", "B": "240", "C": "720", "D": "2160"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "46", "type": "mcq", "section": "Maths", "stem": "In a geometric sequence the 2nd term is 12 and the 5th term is 96. Given the common ratio is positive, find the first term a₁.", "options": {"A": "2", "B": "6", "C": "24", "D": "3"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "47", "type": "mcq", "section": "Maths", "stem": "For the arithmetic sequence 60, 53, 46, 39, …, find the sum of the first 15 terms.", "options": {"A": "−38", "B": "270", "C": "330", "D": "165"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "48", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at this sequence of letter-triples, where each of the three positions follows the same hidden rule:\n\nBDG,  FHK,  JLO,  ____,  RTW\n\nWhich triple correctly fills the gap?", "options": {"A": "MPS", "B": "NPS", "C": "NPR", "D": "OPS"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A bag holds 6 red counters, 5 blue counters and 4 yellow counters (15 in total). You draw two counters one after the other WITHOUT replacing the first. What is the probability that BOTH counters are red?", "options": {"A": "4/25", "B": "2/15", "C": "1/7", "D": "2/5"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Which single word can be placed in FRONT of all four words below to make a common compound word?\n\n____ fall    ____ proof    ____ melon    ____ colour", "options": {"A": "rain", "B": "snow", "C": "fire", "D": "water"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Read the statement, then decide whether the proposed assumption is one that the statement NECESSARILY takes for granted.\n\nStatement: 'The principal announced, \"To cut queues at the canteen, students should pre-order their lunch through the new school app.\"'\n\nProposed assumption: 'A meaningful number of students are able to access and use the school app.'\n\nIs this assumption implicit in the statement?", "options": {"A": "Yes — the recommendation only makes sense if students can actually use the app to pre-order.", "B": "Yes — but only because the principal, not the students, controls the app.", "C": "No — the statement is about queues, not about technology, so app access is irrelevant.", "D": "No — the assumption goes beyond the statement, which never mentions students' devices."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A city is debating this proposal: 'The city should ban all private cars from the historic town centre on weekends.' Which of the following, if true, is the STRONGEST argument IN FAVOUR of the proposal?", "options": {"A": "A neighbouring city banned weekend cars from its centre and saw a similar ban proposed elsewhere.", "B": "Weekend pedestrian numbers in the town centre have risen sharply, and recent collisions there nearly all involved private cars on weekends.", "C": "Many residents of the town centre own private cars and use them on weekends.", "D": "Some shop owners in the town centre believe the ban would be inconvenient for their suppliers."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "PASSAGE: A hospital director argues: \"Antibiotic-resistant infections in our wards have climbed for three years running. The principal driver is our own over-prescribing: we hand out antibiotics at almost twice the rate of comparable hospitals our size. Therefore the board should impose a policy cutting our antibiotic prescriptions by forty per cent; doing so is the surest way to slow the rise of resistance on our wards.\"\n\nThe argument rests on SEVERAL hidden assumptions. Which ONE of the following is NOT an assumption the argument needs in order to stand?", "options": {"A": "A large share of the hospital's current prescriptions can be withdrawn without leaving patients who genuinely need antibiotics untreated.", "B": "The level of resistance on the hospital's own wards responds to changes in that hospital's own prescribing, rather than being driven mainly by resistance brought in from outside.", "C": "The comparable hospitals used as the benchmark are similar enough in patient mix and case severity for their lower prescribing rate to be a meaningful target.", "D": "Patients on the wards would, if asked, say that they would prefer to be prescribed antibiotics less often than they currently are."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "PASSAGE: \"A marine-biology team reported that coral reefs lying inside a newly created no-fishing reserve held, on average, about thirty per cent more fish than reefs of the same type lying outside the reserve. The team did not survey any of these reefs in the years before the reserve was established. They also noted that the reserve happens to sit in a stretch of warmer, shallower, more sheltered water than the reefs they compared it against.\"\n\nWhich ONE of the following can be inferred WITH CONFIDENCE from the passage alone?", "options": {"A": "The ban on fishing inside the reserve is the cause of the higher fish numbers on the reserve's reefs.", "B": "Every reef inside the reserve held more fish than every reef outside it.", "C": "On the evidence given, the higher fish numbers inside the reserve cannot safely be attributed to the fishing ban alone.", "D": "Before the reserve was created, the reefs now inside it held fewer fish than the reefs now outside it."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: Should the school move from a five-day to a four-day teaching week, with longer days?\n\nFour people each give an argument. A strong argument is one that bears directly on the question and is backed by sound, unbiased evidence rather than by a logical fallacy. Which ONE of the following is the STRONGEST argument?", "options": {"A": "Yes — a four-year trial across thirty secondary schools, run by an independent education research body, found that schools on a four-day week showed no fall in exam results and a measurable drop in student and staff absence, while teaching the same total hours.", "B": "No — the teacher who proposed the four-day week is often late to his own lessons, so we should not take any timetable idea of his seriously.", "C": "Yes — either we move to a four-day week or our students will keep burning out completely, and since no one wants burnout, we have no choice but to make the change.", "D": "No — a survey paid for by a private tutoring company, which sells weekend classes, concluded that a four-day week would damage learning, so the plan should be dropped."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "57", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS: (1) If a school meets the national literacy benchmark, it is awarded the Bronze Standard. (2) If a school is awarded the Bronze Standard, its name is printed in the annual education report. (3) No school whose name is printed in the annual education report is placed under special review. (4) Oakfield School has been placed under special review.\n\nWhich ONE of the following conclusions does NOT follow from these facts alone?", "options": {"A": "Oakfield School's name is not printed in the annual education report.", "B": "Every school whose name is printed in the annual education report has met the national literacy benchmark.", "C": "Oakfield School has not been awarded the Bronze Standard.", "D": "Oakfield School did not meet the national literacy benchmark."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 6 (V3)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
