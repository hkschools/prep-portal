<title>IDAT HKIS: Stage 6 (V5)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>

a gap in the early afternoon that everyone in the village had long since arranged their lives around.</p><p>When the transport authority proposed to close the line, it published a consultation document of forty pages. The case rested on a single figure: an average occupancy of eleven per cent. At that level, the document explained, the subsidy per passenger journey was almost four times the network average, and the money would deliver more benefit spent elsewhere.</p><p>Marta Osei, who taught mathematics at the village school and had never attended a public meeting in her life, read the document twice and then wrote to the authority to ask how the average had been calculated. The reply, when it came six weeks later, was perfectly straightforward: total passenger boardings divided by total seat capacity across all services, measured over a fortnight in February.</p><p>She took the figure apart in an evening. The eleven per cent was accurate, and it was also, she thought, close to meaningless. Averaged across six services, it concealed the fact that two of them, the 7.02 and the 16.55, ran at better than seventy per cent, while the two early-afternoon services ran nearly empty. The average described no actual tram. What the line had was not a demand problem but a timetable that had stopped matching the village fifty years earlier.</p><p>At the meeting she did not argue that the line should be saved. She said that the authority had measured the right thing in the wrong way, and that if it wished to close the line it should first try running four services instead of six, at the hours people actually travelled, and measure again. The proposal was harder to refuse than a plea would have been, because it accepted the authority's own test.</p><p>The revised timetable began in the September. Occupancy across the four services settled at thirty-eight per cent, which was still below the network average and still, by the authority's stated rule, a candidate for closure. The lin ument twice and then wrote to the authority to ask how the average had been calculated. The reply, when it came six weeks later, was perfectly straightforward: total passenger boardings divided by total seat capacity across all services, measured over a fortnight in February.</p><p>She took the figure apart in an evening. The eleven per cent was accurate, and it was also, she thought, close to meaningless. Averaged across six services, it concealed the fact that two of them, the 7.02 and the 16.55, ran at better than seventy per cent, while the two early-afternoon services ran nearly empty. The average described no actual tram. What the line had was not a demand problem but a timetable that had stopped matching the village fifty years earlier.</p><p>At the meeting she did not argue that the line should be saved. She said that the authority had measured the right thing in the wrong way, and that if it wished to close the line it should first try running four services instead of six, at the hours people actually travelled, and measure again. The proposal was harder to refuse than a plea would have been, because it accepted the authority's own test.</p><p>The revised timetable began in the September. Occupancy across the four services settled at thirty-eight per cent, which was still below the network average and still, by the authority's stated rule, a candidate for closure. The line stayed open. Nobody involved could afterwards point to the moment at which the decision had been taken, or by whom.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "The final sentence, that nobody could point to when or by whom the decision was taken, chiefly serves to", "options": {"A": "suggest the outcome owed more to a shifted argument than to any single decision", "B": "imply that the authority acted improperly", "C": "show that the villagers never learned the result", "D": "indicate that the line closed after all"}, "fig": "", "passage": "<strong>Eleven Per Cent</strong><br><p>The tram had run to Bellhouse since 1908, and the timetable had not changed since 1962. Six services a day, the first at 6.14 and the last at 19.40, and between them a gap in the early afternoon that everyone in the village had long since arranged their lives around.</p><p>When the transport authority proposed to close the line, it published a consultation document of forty pages. The case rested on a single figure: an average occupancy of eleven per cent. At that level, the document explained, the subsidy per passenger journey was almost four times the network average, and the money would deliver more benefit spent elsewhere.</p><p>Marta Osei, who taught mathematics at the village school and had never attended a public meeting in her life, read the document twice and then wrote to the authority to ask how the average had been calculated. The reply, when it came six weeks later, was perfectly straightforward: total passenger boardings divided by total seat capacity across all services, measured over a fortnight in February.</p><p>She took the figure apart in an evening. The eleven per cent was accurate, and it was also, she thought, close to meaningless. Averaged across six services, it concealed the fact that two of them, the 7.02 and the 16.55, ran at better than seventy per cent, while the two early-afternoon services ran nearly empty. The average described no actual tram. What the line had was not a demand problem but a timetable that had stopped matching the village fifty years earlier.</p><p>At the meeting she did not argue that the line should be saved. She said that the authority had measured the right thing in the wrong way, and that if it wished to close the line it should first try running four services instead of six, at the hours people actually travelled, and measure again. The proposal was harder to refuse than a plea would have been, because it accepted the authority's own test.</p><p>The revised timetable began in the September. Occupancy across the four services settled at thirty-eight per cent, which was still below the network average and still, by the authority's stated rule, a candidate for closure. The line stayed open. Nobody involved could afterwards point to the moment at which the decision had been taken, or by whom.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Taken as a whole, the passage most strongly suggests that a statistic is best challenged by", "options": {"A": "disputing whether the underlying data were collected honestly", "B": "showing that it is accurate but answers the wrong question", "C": "appealing to the tradition and history behind what it measures", "D": "producing a rival statistic from an independent source"}, "fig": "", "passage": "<strong>Eleven Per Cent</strong><br><p>The tram had run to Bellhouse since 1908, and the timetable had not changed since 1962. Six services a day, the first at 6.14 and the last at 19.40, and between them a gap in the early afternoon that everyone in the village had long since arranged their lives around.</p><p>When the transport authority proposed to close the line, it published a consultation document of forty pages. The case rested on a single figure: an average occupancy of eleven per cent. At that level, the document explained, the subsidy per passenger journey was almost four times the network average, and the money would deliver more benefit spent elsewhere.</p><p>Marta Osei, who taught mathematics at the village school and had never attended a public meeting in her life, read the document twice and then wrote to the authority to ask how the average had been calculated. The reply, when it came six weeks later, was perfectly straightforward: total passenger boardings divided by total seat capacity across all services, measured over a fortnight in February.</p><p>She took the figure apart in an evening. The eleven per cent was accurate, and it was also, she thought, close to meaningless. Averaged across six services, it concealed the fact that two of them, the 7.02 and the 16.55, ran at better than seventy per cent, while the two early-afternoon services ran nearly empty. The average described no actual tram. What the line had was not a demand problem but a timetable that had stopped matching the village fifty years earlier.</p><p>At the meeting she did not argue that the line should be saved. She said that the authority had measured the right thing in the wrong way, and that if it wished to close the line it should first try running four services instead of six, at the hours people actually travelled, and measure again. The proposal was harder to refuse than a plea would have been, because it accepted the authority's own test.</p><p>The revised timetable began in the September. Occupancy across the four services settled at thirty-eight per cent, which was still below the network average and still, by the authority's stated rule, a candidate for closure. The line stayed open. Nobody involved could afterwards point to the moment at which the decision had been taken, or by whom.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Writing section, two parts. Part 1 is an editing task; Part 2 is one short piece of writing. On the real online test, Part 1 appears as drop-down menus inside the passage.", "label": "", "body": "", "hint": "This section has TWO parts and your writing will be viewed by your future school. Part 1: read the passage and, for each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Part 2: choose ONE of the two tasks and write a single paragraph of no more than 14 sentences. Check your spelling, punctuation and grammar before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear.\n\n[1: A) Because B) Whereas C) Despite] the funding had been secured in March, work on the footbridge did not begin until October. The delay, [2: A) that B) which C) what] frustrated residents on both sides of the river, was eventually traced to a survey that had never been commissioned. The contractor argued that responsibility [3: A) lay B) laid C) lied] with the council, while the council maintained that the tender documents had been clear. Neither party [4: A) were B) was C) have been] willing to accept the cost. By the time the bridge opened, it [5: A) cost B) had cost C) costs] almost twice the original estimate. Residents who had campaigned for it for years were, understandably, [6: A) fewer B) lesser C) less] impressed than the ribbon-cutting suggested.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 14 sentences:\n(1) Some argue that public spending decisions should be made by expert panels rather than by elected politicians. Set out your position, giving reasons and answering one objection to it.\n(2) Write about an occasion when you were proved right but took no satisfaction from it. Explain what happened and what it taught you."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "Which of these feels most like you at your best?", "options": {"A": "Being active and good at sport", "B": "Being curious and good at learning", "C": "Being imaginative and good at making things", "D": "Being kind and good with people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What kind of moment makes you happiest?", "options": {"A": "Getting really good at something I practised", "B": "Laughing and hanging out with friends", "C": "Discovering something new and surprising", "D": "Working out how something tricky works"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "Which of these would you most like to get even better at?", "options": {"A": "Keeping a steady head when things go wrong", "B": "Sharing my voice in a group", "C": "Keeping going when something is tricky", "D": "Picking up on how other people feel"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "Which of these do you enjoy the least?", "options": {"A": "Working on my own for a long time", "B": "Being in a big, noisy group", "C": "Sitting still for a long stretch", "D": "Having to do things in a hurry"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one bold new thing, which would you pick?", "options": {"A": "Learn a tricky new sport or dance move", "B": "Perform a piece in front of an audience", "C": "Enter a contest where I might not win", "D": "Start a conversation with someone new"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "How do you usually feel about trying something you have never done before, on your own?", "options": {"A": "Very excited to try", "B": "Quite ready to give it a go", "C": "A little unsure at first", "D": "Happier when someone helps me start"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "What do you like the most about a new challenge?", "options": {"A": "It feels exciting and a bit scary", "B": "I get to learn something fresh", "C": "I can take it on together with others", "D": "I can take my time and plan it out"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "When a task turns out harder than you expected, what do you do best?", "options": {"A": "Stick with it and keep trying", "B": "Switch to a different way of doing it", "C": "Ask someone to lend a hand", "D": "Step away, then come back fresh"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Imagine you are handed four things: a ball, a paintbrush, a building block and a puzzle. Which would you most want to use?", "options": {"A": "The ball, to invent a brand-new game", "B": "The paintbrush, to paint from my imagination", "C": "The building block, to design and build something", "D": "The puzzle, to solve it piece by piece"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you make or build something, what do you like the most?", "options": {"A": "Coming up with my very own idea", "B": "Taking someone's idea and making it better", "C": "Working out how all the parts fit together", "D": "Following clear steps so it turns out right"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "If you had to crack a tricky problem, which way would you most like to try?", "options": {"A": "Talk it over with a group to spark ideas", "B": "Break it into small, clear steps", "C": "Try an unusual idea no one expects", "D": "Look for a pattern from something before"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "What makes you happiest while you are working on a project?", "options": {"A": "Getting every little detail just right", "B": "Trying something that has not been done before", "C": "Figuring out a puzzle hidden inside it", "D": "Seeing my plan come together as I hoped"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "When you want to get along with someone, what do you do most?", "options": {"A": "Listen carefully to what they say", "B": "Share my own ideas clearly", "C": "Take turns and keep things fair", "D": "Notice when they seem upset"}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "What do you like the most when you work with other people?", "options": {"A": "Sharing my ideas with the group", "B": "Helping someone who is stuck", "C": "Listening to everyone's ideas", "D": "Keeping the group calm and friendly"},  and subtends an angle of three quarters of π radians at the centre. Find the exact area of the sector.", "options": {"A": "6 π cm<sup>2</sup>", "B": "48 π cm<sup>2</sup>", "C": "12 π cm<sup>2</sup>", "D": "24 π cm<sup>2</sup>"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "A cylinder has base radius 4 cm and height 9 cm. Find its volume, leaving your answer in terms of π.", "options": {"A": "36 π cm<sup>3</sup>", "B": "144 π cm<sup>3</sup>", "C": "72 π cm<sup>3</sup>", "D": "104 π cm<sup>3</sup>"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"300\" viewBox=\"0 0 300 300\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"300\" fill=\"white\"/><ellipse cx=\"100\" cy=\"230\" rx=\"64\" ry=\"20\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"36\" y=\"60\" width=\"128\" height=\"170\" fill=\"#EAF0FA\" stroke=\"none\"/><line x1=\"36\" y1=\"60\" x2=\"36\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"164\" y1=\"60\" x2=\"164\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M36,230 A64,20 0 0 0 164,230\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><ellipse cx=\"100\" cy=\"60\" rx=\"64\" ry=\"20\" fill=\"#DCE6F6\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"100\" y1=\"60\" x2=\"164\" y2=\"60\" stroke=\"#C00\" stroke-width=\"1.5\"/><text x=\"132\" y=\"53\" font-size=\"13\" text-anchor=\"middle\" fill=\"#C00\">4 cm</text><line x1=\"180\" y1=\"60\" x2=\"180\" y2=\"230\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"186\" y=\"145\" font-size=\"13\" fill=\"#333\">9 cm</text></svg>", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "A bag contains 5 red counters and 7 blue counters. Two counters are drawn at random without replacement. Find the probability that one is red and one is blue.", "options": {"A": "<span class=\"frac\"><span class=\"num\">35</span><span class=\"den\">144</span></span>", "B": "<span class=\"frac\"><span class=\"num\">35</span><span class=\"den\">132</span></span>", "C": "<span class=\"frac\"><span class=\"num\">35</span><span class=\"den\">66</span></span>", "D": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">12</span></span>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "46", "type": "mcq", "section": "Maths", "stem": "Find all values of x between 0 and 360° inclusive for which cos x = -0.5.", "options": {"A": "x = 120° and 240°", "B": "x = 60° and 300°", "C": "x = 120° only", "D": "x = 30° and 150°"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "47", "type": "mcq", "section": "Maths", "stem": "For which values of k does the equation 2x<sup>2</sup> + kx + 8 = 0 have NO real roots?", "options": {"A": "k greater than 8", "B": "k less than -8 or k greater than 8", "C": "-8 less than k less than 8", "D": "k = 8 or k = -8"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "48", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the nonsensical sentence. Based on the clues in the sentence, what part of speech is the word in <b>quorbish</b>?<br><br>The traves grew more <b>quorbish</b> as the fenning drew near.", "options": {"A": "Verb", "B": "Noun", "C": "Adjective", "D": "Adverb"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The following is a cryptic crossword clue, which means there is a play on words in the clue.<br><br>Clue: Silent instrument found in the post<br><br>It is five letters long.", "options": {"A": "Piano", "B": "Organ", "C": "Flute", "D": "Stamp"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "What number is missing from the sequence?<br><br>2, 6, 14, 30, ___, 126", "options": {"A": "46", "B": "62", "C": "58", "D": "60"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A courier charges 45 dollars for the first 5 kilograms and 4 dollars for each additional kilogram or part of a kilogram. A customer sends a parcel weighing 12.4 kilograms. What is the charge?", "options": {"A": "75.60 dollars", "B": "77 dollars", "C": "73 dollars", "D": "81 dollars"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The university should drop its written entrance examination and select candidates on school grades alone, because the examination adds cost and stress without improving the quality of the intake.\"<br><br>ASSUMPTION: \"School grades are a comparably reliable guide to how candidates will perform at the university.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every container inspected at the north gate on Tuesday carried a valid seal. Container 118 was inspected on Tuesday and did not carry a valid seal.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Container 118 was inspected at a gate other than the north gate.", "B": "Container 118 was carrying prohibited goods.", "C": "Every container with a valid seal was inspected at the north gate.", "D": "The north gate inspects more containers than any other gate."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"A council introduced weekly food-waste collections across one district last year. Household food waste sent to landfill from that district fell by 31 per cent over the following twelve months. A survey of 900 residents in the district found that 640 said they now separate food waste, and 210 said the new caddies were too small.\"<br><br>CONCLUSIONS:<br>(1) More than two thirds of the residents surveyed said they now separate food waste.<br>(2) Every household in the district now separates its food waste.<br>(3) Some residents surveyed reported a practical problem with the new caddies.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "All three conclusions follow.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "Only conclusion (3) follows."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every document held in the sealed archive requires a level three clearance to view.<br>2. No item requiring level three clearance may be photographed.<br>3. The Ferris letter is held in the sealed archive.<br><br>Therefore, which of the following conclusions FOLLOWS?", "options": {"A": "Every item requiring level three clearance is held in the sealed archive.", "B": "The Ferris letter may not be photographed.", "C": "The Ferris letter is the only document in the sealed archive that may not be photographed."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "57", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "ARGUMENT: Should large employers be required to move their staff to a four-day working week with no reduction in pay?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Between 2022 and 2023, sixty-one British companies employing about 2,900 people ran a six-month four-day-week trial with independent researchers measuring the results. Revenue was broadly stable, staff turnover fell sharply, and 56 of the 61 companies chose to continue afterwards. Therefore the change is workable at scale without loss of output.", "B": "Obviously not. Businesses exist to make money, and you cannot simply pay people the same for less work and expect the sums to add up. My uncle has run a printing firm for thirty years and he says it would finish him within a year. Where exactly is this money supposed to come from?", "C": "Yes, absolutely, because people are exhausted. Everyone I know is burnt out and miserable, and life is about more than sitting at a desk. We would all be happier and healthier with an extra day, and surely happiness ought to count for something in these decisions."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 6 (V5)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
