<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}

  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>

const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Write your answers in the spaces provided."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which transitional word or phrase results in a DIFFERENT meaning from the others?<br><br>The first two attempts produced nothing usable; ___, the team refined the method and tried again.", "options": {"A": "therefore", "B": "similarly", "C": "accordingly", "D": "so"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Correct the underlined word.<br><br>The museum succeeded in <u>acquire</u> the collection before it went to auction.", "options": {"A": "to acquire", "B": "acquired", "C": "acquiring", "D": "acquire"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly.<br><br>The samples, along with the field notebook, ___ been transferred to the new store.", "options": {"A": "was", "B": "has", "C": "have", "D": "is"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which sentence applies the neither and nor agreement rule correctly?", "options": {"A": "Neither the curator nor the conservators were told that the loan had been cancelled.", "B": "Neither the curator nor the conservators was told that the loan had been cancelled.", "C": "Neither the curator or the conservators were told that the loan had been cancelled.", "D": "Neither of the curator nor the conservators were told that the loan had been cancelled."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which suffix means CAPABLE OF BEING?", "options": {"A": "-ible", "B": "-ance", "C": "-wards"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Fill in the blank.<br><br>The dating of the site remains ___, since the two laboratories returned results four centuries apart.", "options": {"A": "corroborated", "B": "contested", "C": "catalogued", "D": "calibrated"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the saying below mean?<br><br>The curator was accused of <i>gilding the lily</i> in the exhibition notes.", "options": {"A": "Spending public money on luxuries", "B": "Claiming credit for someone else's work", "C": "Concealing a flaw with a superficial repair", "D": "Adding unnecessary decoration to something already fine"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?<br><br>The account of the voyage is <u>meticulous</u>.", "options": {"A": "perfunctory", "B": "speculative", "C": "abridged", "D": "scrupulous"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which of these carries the same idea as the underlined word but at a much LOWER intensity?<br><br>The find was described as <u>unprecedented</u>.", "options": {"A": "unparalleled", "B": "unusual", "C": "unverified", "D": "unremarkable"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Fill in the blank.<br><br>The two dating methods are ___: each can be used to check the other.", "options": {"A": "complementary", "B": "contradictory", "C": "interchangeable", "D": "obsolete"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Why, according to the passage, was the horse domesticated later than other animals?", "options": {"A": "It is only worth keeping once you know what to use it for", "B": "Horses were harder to catch than sheep or cattle", "C": "Horses were not found near early settlements", "D": "Early societies lacked the equipment to control them"}, "fig": "", "passage": "<strong>The Horse: A Late Arrival</strong><br><p>The horse was domesticated late. Sheep, goats, cattle and pigs were all kept for thousands of years before anyone rode anything, and the reason is not that horses are difficult to catch. It is that a horse is only worth keeping if you can do something with it that you cannot do with your own legs, and working out what that was took time.</p><p>The earliest evidence is indirect and much argued over. Wear on the teeth of horses from the steppe suggests bits, and therefore control, several thousand years before the earliest surviving depictions of riders. Changes in the proportion of horse bones at settlement sites suggest herding rather than hunting. Neither line of evidence is conclusive on its own, and specialists differ on the dates by centuries.</p><p>What is clearer is the sequence of uses. Horses were probably eaten before they were milked, milked before they were driven, and driven before they were ridden in any organised way. Chariots appear in the archaeological record well before cavalry, which is the reverse of what most people assume.</p><p><b>What the horse changed.</b> The consequences reached well beyond transport:</p><p><b>Distance.</b> A rider could cover in a day what a walker covered in three, which altered how far a message, a trade good or an army could reach.<br><b>Warfare.</b> Mounted troops changed the balance between settled societies and mobile ones for roughly two thousand years.<br><b>Agriculture.</b> Horses eventually replaced oxen for ploughing in much of Europe, working faster on suitable soils.<br><b>Language.</b> The spread of some language families tracks, imperfectly, the spread of horse-keeping.</p><p>That last point should be made carefully. The correlation between horses and the movement of languages is real, but a correlation across thousands of years and several continents will support a great many stories, and the confident versions usually rest on less evidence than they suggest.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What does the passage say about the order in which horses were used?", "options": {"A": "They were ridden before they were driven", "B": "They were driven before they were ridden in an organised way", "C": "They were used for ploughing before anything else", "D": "They were milked only after cavalry appeared"}, "fig": "", "passage": "<strong>The Horse: A Late Arrival</strong><br><p>The horse was domesticated late. Sheep, goats, cattle and pigs were all kept for thousands of years before anyone rode anything, and the reason is not that horses are difficult to catch. It is that a horse is only worth keeping if you can do something with it that you cannot do with your own legs, and working out what that was took time.</p><p>The earliest evidence is indirect and much argued over. Wear on the teeth of horses from the steppe suggests bits, and therefore control, several thousand years before the earliest surviving depictions of riders. Changes in the proportion of horse bones at settlement sites suggest herding rather than hunting. Neither line of evidence is conclusive on its own, and specialists differ on the dates by centuries.</p><p>What is clearer is the sequence of uses. Horses were probably eaten before they were milked, milked before they were driven, and driven before they were ridden in any organised way. Chariots appear in the archaeological record well before cavalry, which is the reverse of what most people assume.</p><p><b>What the horse changed.</b> The consequences reached well beyond transport:</p><p><b>Distance.</b> A rider could cover in a day what a walker covered in three, which altered how far a message, a trade good or an army could reach.<br><b>Warfare.</b> Mounted troops changed the balance between settled societies and mobile ones for roughly two thousand years.<br><b>Agriculture.</b> Horses eventually replaced oxen for ploughing in much of Europe, working faster on suitable soils.<br><b>Language.</b> The spread of some language families tracks, imperfectly, the spread of horse-keeping.</p><p>That last point should be made carefully. The correlation between horses and the movement of languages is real, but a correlation across thousands of years and several continents will support a great many stories, and the confident versions usually rest on less evidence than they suggest.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "The passage says the earliest evidence is 'much argued over'. What does it give as the reason?", "options": {"A": "The evidence has mostly been destroyed", "B": "Specialists disagree about how horses were ridden", "C": "Neither line of evidence settles the question by itself", "D": "The depictions of riders cannot be dated"}, "fig": "", "passage": "<strong>The Horse: A Late Arrival</strong><br><p>The horse was domesticated late. Sheep, goats, cattle and pigs were all kept for thousands of years before anyone rode anything, and the reason is not that horses are difficult to catch. It is that a horse is only worth keeping if you can do something with it that you cannot do with your own legs, and working out what that was took time.</p><p>The earliest evidence is indirect and much argued over. Wear on the teeth of horses from the steppe suggests bits, and therefore control, several thousand years before the earliest surviving depictions of riders. Changes in the proportion of horse bones at settlement sites suggest herding rather than hunting. Neither line of evidence is conclusive on its own, and specialists differ on the dates by centuries.</p><p>What is clearer is the sequence of uses. Horses were probably eaten before they were milked, milked before they were driven, and driven before they were ridden in any organised way. Chariots appear in the archaeological record well before cavalry, which is the reverse of what most people assume.</p><p><b>What the horse changed.</b> The consequences reached well beyond transport:</p><p><b>Distance.</b> A rider could cover in a day what a walker covered in three, which altered how far a message, a trade good or an army could reach.<br><b>Warfare.</b> Mounted troops changed the balance between settled societies and mobile ones for roughly two thousand years.<br><b>Agriculture.</b> Horses eventually replaced oxen for ploughing in much of Europe, working faster on suitable soils.<br><b>Language.</b> The spread of some language families tracks, imperfectly, the spread of horse-keeping.</p><p>That last point should be made carefully. The correlation between horses and the movement of languages is real, but a correlation across thousands of years and several continents will support a great many stories, and the confident versions usually rest on less evidence than they suggest.</p>", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which of these is NOT listed in the passage among the things the horse changed?", "options": {"A": "How far a message could travel", "B": "The balance between settled and mobile societies", "C": "What animal was used for ploughing", "D": "The design of permanent settlements"}, "fig": "", "passage": "<strong>The Horse: A Late Arrival</strong><br><p>The horse was domesticated late. Sheep, goats, cattle and pigs were all kept for thousands of years before anyone rode anything, and the reason is not that horses are difficult to catch. It is that a horse is only worth keeping if you can do something with it that you cannot do with your own legs, and working out what that was took time.</p><p>The earliest evidence is indirect and much argued over. Wear on the teeth of horses from the steppe suggests bits, and therefore control, several thousand years before the earliest surviving depictions of riders. Changes in the proportion of horse bones at settlement sites suggest herding rather than hunting. Neither line of evidence is conclusive on its own, and specialists differ on the dates by centuries.</p><p>What is clearer is the sequence of uses. Horses were probably eaten before they were milked, milked before they were driven, and driven before they were ridden in any organised way. Chariots appear in the archaeological record well before cavalry, which is the reverse of what most people assume.</p><p><b>What the horse changed.</b> The consequences reached well beyond transport:</p><p><b>Distance.</b> A rider could cover in a day what a walker covered in three, which altered how far a message, a trade good or an army could reach.<br><b>Warfare.</b> Mounted troops changed the balance between settled societies and mobile ones for roughly two thousand years.<br><b>Agriculture.</b> Horses eventually replaced oxen for ploughing in much of Europe, working faster on suitable soils.<br><b>Language.</b> The spread of some language families tracks, imperfectly, the spread of horse-keeping.</p><p>That last point should be made carefully. The correlation between horses and the movement of languages is real, but a correlation across thousands of years and several continents will support a great many stories, and the confident versions usually rest on less evidence than they suggest.</p>", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Why does the writer say the point about language 'should be made carefully'?", "options": {"A": "A correlation spread over that much time and space can support too many explanations", "B": "The correlation between horses and language has been disproved", "C": "Languages leave no archaeological evidence at all", "D": "Specialists have not yet studied the question"}, "fig": "", "passage": "<strong>The Horse: A Late Arrival</strong><br><p>The horse was domesticated late. Sheep, goats, cattle and pigs were all kept for thousands of years before anyone rode anything, and the reason is not that horses are difficult to catch. It is that a horse is only worth keeping if you can do something with it that you cannot do with your own legs, and working out what that was took time.</p><p>The earliest evidence is indirect and much argued over. Wear on the teeth of horses from the steppe suggests bits, and therefore control, several thousand years before the earliest surviving depictions of riders. Changes in the proportion of horse bones at settlement sites suggest herding rather than hunting. Neither line of evidence is conclusive on its own, and specialists differ on the dates by centuries.</p><p>What is clearer is the sequence of uses. Horses were probably eaten before they were milked, milked before they were driven, and driven before they were ridden in any organised way. Chariots appear in the archaeological record well before cavalry, which is the reverse of what most people assume.</p><p><b>What the horse changed.</b> The consequences reached well beyond transport:</p><p><b>Distance.</b> A rider could cover in a day what a walker covered in three, which altered how far a message, a trade good or an army could reach.<br><b>Warfare.</b> Mounted troops changed the balance between settled societies and mobile ones for roughly two thousand years.<br><b>Agriculture.</b> Horses eventually replaced oxen for ploughing in much of Europe, working faster on suitable soils.<br><b>Language.</b> The spread of some language families tracks, imperfectly, the spread of horse-keeping.</p><p>That last point should be made carefully. The correlation between horses and the movement of languages is real, but a correlation across thousands of years and several continents will support a great many stories, and the confident versions usually rest on less evidence than they suggest.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for the text type. Part 2: choose ONE task and write a paragraph of no more than 14 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nThe Wheel: Later Than You Would Think\n\nThe wheel appears in the archaeological record thousands of years after farming, pottery and weaving. [1: A) This text sets out when it appeared and why it took so long. B) Wheels! You would think they came first, right? C) The wheel, then. Quite the latecomer.]\n\nThe difficulty. A wheel on its own [2: A) achieve B) achieves C) achieving] nothing. It needs an axle, and the join between wheel and axle [3: A) has B) have C) having] to be smooth enough to turn but tight enough to carry weight, [4: A) which is a demanding piece of carpentry. B) which are a demanding piece of carpentry. C) being of a demanding piece of carpentry.]\n\nThe ground. Wheels also need surfaces. On soft or broken ground a sledge or a pack animal [5: A) work B) works C) working] better, which is why wheeled transport spread unevenly and why some regions [6: A) did without it for centuries. B) does without it for centuries. C) doing without it for centuries.]\n\nAfterwards. Once established, the principle [7: A) was applied far beyond transport, to pottery, milling and spinning. B) were applied far beyond transport, to pottery, milling and spinning. C) got used for loads of other stuff too.] The potter's wheel [8: A) is B) are C) being] in some regions older than the cart.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 14 sentences. This will be viewed by your future school.\n(1) Write a recount of a time you learned to use a tool or a piece of equipment for the first time. Describe what was harder than you expected.\n(2) Write an explanatory text about why a particular invention took longer to appear than people might assume."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 6 English Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
