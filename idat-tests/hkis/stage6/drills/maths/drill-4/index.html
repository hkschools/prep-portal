<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 6 Maths Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 6 Maths Drill 4</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "6", VERSION = "MATH-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Maths", "body": "Answer all questions. A calculator is allowed."}, {"n": "2", "type": "mcq", "section": "Maths", "stem": "Solve the pair: 3x + 2y = 16 and 5x - 2y = 8.", "options": {"A": "x = 2, y = 5", "B": "x = 3, y = 3.5", "C": "x = 4, y = 2", "D": "x = 3, y = 2"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Maths", "stem": "A triangle has sides of 7 cm and 9 cm with an angle of 50° between them. How long is the third side, to two decimal places?", "options": {"A": "7.00 cm", "B": "16.00 cm", "C": "11.40 cm", "D": "2.00 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"314\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"185\" cy=\"55\" r=\"3\" fill=\"#1F3864\"/><text x=\"185\" y=\"47\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"180\" y=\"215\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">7 cm</text><text x=\"264\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">9 cm</text><text x=\"100\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#C00\">?</text><text x=\"260\" y=\"223\" font-size=\"13\" fill=\"#C00\">50</text><path d=\"M318,195 A18,18 0 0 1 312,182\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.4\"/></svg>", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Maths", "stem": "Two similar solids have corresponding lengths in the ratio 3 : 4. The smaller has a volume of 108 cubic centimetres. What is the volume of the larger?", "options": {"A": "256 cm<sup>3</sup>", "B": "144 cm<sup>3</sup>", "C": "192 cm<sup>3</sup>", "D": "324 cm<sup>3</sup>"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Maths", "stem": "From the same box of 10 fuses, 3 of them faulty, two are taken without replacement. What is the probability that they are NOT both faulty?", "options": {"A": "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">15</span></span>", "B": "<span class=\"frac\"><span class=\"num\">13</span><span class=\"den\">15</span></span>", "C": "<span class=\"frac\"><span class=\"num\">14</span><span class=\"den\">15</span></span>", "D": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">10</span></span>"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Maths", "stem": "A team's points across eight matches are listed below. Find the interquartile range.<br><br>2, 5, 6, 8, 9, 11, 14, 20", "options": {"A": "8.5", "B": "18", "C": "7", "D": "12.5"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"684\" height=\"134\" viewBox=\"0 0 684 134\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"684\" height=\"134\" fill=\"white\"/><text x=\"342.0\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">The eight values in order</text><text x=\"69.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"69.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">2</text><line x1=\"36.0\" y1=\"72\" x2=\"102.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"147.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"147.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">5</text><line x1=\"114.0\" y1=\"72\" x2=\"180.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"225.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"225.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">6</text><line x1=\"192.0\" y1=\"72\" x2=\"258.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"303.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"303.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">8</text><line x1=\"270.0\" y1=\"72\" x2=\"336.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"381.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"381.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">9</text><line x1=\"348.0\" y1=\"72\" x2=\"414.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"459.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"459.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">11</text><line x1=\"426.0\" y1=\"72\" x2=\"492.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"537.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"537.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">14</text><line x1=\"504.0\" y1=\"72\" x2=\"570.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"615.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#1F3864\">✕</text><text x=\"615.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">20</text><line x1=\"582.0\" y1=\"72\" x2=\"648.0\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"30\" y1=\"72\" x2=\"654\" y2=\"72\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"342.0\" y=\"118\" text-anchor=\"middle\" font-size=\"14\" fill=\"#333\"><tspan font-weight=\"bold\" fill=\"#1F3864\">✕</tspan> = 1 1 value</text></svg>", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Maths", "stem": "A circle of radius 7 cm has a sector with an angle of π/3 radians. Find the arc length, to two decimal places.", "options": {"A": "3.67 cm", "B": "25.66 cm", "C": "14.66 cm", "D": "7.33 cm"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Maths", "stem": "Use the explicit formula for the nth term to find the common ratio.<br><br>a<sub>n</sub> = 6 · 2<sup>n-1</sup>", "options": {"A": "8", "B": "2", "C": "6", "D": "n - 1"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Maths", "stem": "Work out the product MN.<br><br>M has rows (2, 1) and (3, 4). N has rows (5, 0) and (2, 6).", "options": {"A": "12, 23 / 6, 24", "B": "10, 0 / 6, 24", "C": "7, 1 / 5, 10", "D": "12, 6 / 23, 24"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"168\" height=\"104\" viewBox=\"0 0 168 104\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"168\" height=\"104\" fill=\"white\"/><text x=\"10\" y=\"57\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">M =</text><path d=\"M60,18 L52,18 L52,86 L60,86\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M148,18 L156,18 L156,86 L148,86\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"81\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">2</text><text x=\"127\" y=\"40\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">1</text><text x=\"81\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">3</text><text x=\"127\" y=\"74\" font-size=\"16\" text-anchor=\"middle\" fill=\"#222\">4</text></svg>", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Maths", "stem": "A polynomial function with rational coefficients has 2 - i as a zero. Find the additional zero.", "options": {"A": "-2 + i", "B": "Not enough information", "C": "-2 - i", "D": "2 + i"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Maths", "stem": "(8 × 10<sup>7</sup>) ÷ (2 × 10<sup>3</sup>) = ___, in standard form.", "options": {"A": "4 × 10<sup>4</sup>", "B": "4 × 10<sup>10</sup>", "C": "6 × 10<sup>4</sup>", "D": "4 × 10<sup>21</sup>"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Maths", "stem": "A line has gradient 4. What is the gradient of any line perpendicular to it?", "options": {"A": "4", "B": "-4", "C": "-0.25", "D": "0.25"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"170\" viewBox=\"0 0 300 170\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"170\" fill=\"white\"/><line x1=\"40\" y1=\"100\" x2=\"260\" y2=\"100\" stroke=\"#1F3864\" stroke-width=\"3\"/><line x1=\"150\" y1=\"25\" x2=\"150\" y2=\"150\" stroke=\"#1F3864\" stroke-width=\"3\"/></svg>", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Maths", "stem": "In triangle ABC, angle A = 80°, angle B = 35° and side a = 12 cm. Find side b, to two decimal places.", "options": {"A": "5.25 cm", "B": "6.99 cm", "C": "20.60 cm", "D": "12.00 cm"}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Maths", "stem": "A pendulum 40 cm long swings through an angle of 30°. How far does its tip travel, to two decimal places?", "options": {"A": "20.94 cm", "B": "418.88 cm<sup>2</sup>", "C": "30.00 cm", "D": "1,256.64 cm"}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Maths", "stem": "The probability that a component fails on any given day is 0.02, independently of other days. What is the probability that it fails at least once in a five-day week, to three decimal places?", "options": {"A": "0.020", "B": "0.100", "C": "0.096", "D": "0.904"}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Maths", "stem": "A researcher wants to estimate the average commuting time in a city. She surveys people at a railway station between 08:00 and 09:00. What is the main problem with her method?", "options": {"A": "She should have surveyed more than one station", "B": "Commuting time cannot be averaged meaningfully", "C": "People at a station in the rush hour are not typical of all commuters", "D": "The sample is too small to estimate anything"}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Maths", "stem": "For f(x) = 3x<sup>2</sup> - 2x + 1, find f(-2).", "options": {"A": "5", "B": "-15", "C": "9", "D": "17"}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Maths", "stem": "An angle θ lies between 90° and 180°. Which statement is true?", "options": {"A": "sin θ is negative and cos θ is positive", "B": "sin θ is positive and cos θ is negative", "C": "Both sin θ and cos θ are negative", "D": "Both sin θ and cos θ are positive"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Maths", "stem": "Two triangles have three pairs of equal angles. What can be concluded?", "options": {"A": "They are similar but not necessarily congruent", "B": "Nothing can be concluded", "C": "They have equal areas", "D": "They are congruent"}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Maths", "stem": "A taxi charges 5 dollars plus 2 dollars a kilometre. A passenger has 27 dollars. What is the greatest whole number of kilometres they can travel?", "options": {"A": "13", "B": "16", "C": "10", "D": "11"}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Maths", "stem": "In triangle ABC, side a = 7 cm, side b = 9 cm and angle A = 35°. How many triangles are possible?", "options": {"A": "None", "B": "Two", "C": "Three", "D": "One"}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 6 Maths Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
