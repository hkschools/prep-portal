<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 6 Critical Thinking Drill 3</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 6 Critical Thinking Drill 3</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "6", VERSION = "CT-D3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions. Use only the information given in each question."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The guideline should be revised, because the trial it rests on enrolled only patients under 65 while most people now prescribed the drug are older than that.\"<br><br>ASSUMPTION: \"Age can affect how patients respond to this drug.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The clinic should offer appointments in the evening, because the patients who miss appointments most often are those in shift work who cannot attend during the day.\"<br><br>ASSUMPTION: \"The clinic has staff willing to work in the evening.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The department should publish waiting times by specialty rather than as a single hospital figure, because the overall average conceals differences between specialties of several months.\"<br><br>ASSUMPTION: \"The hospital's overall waiting time is longer than the national average.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The screening programme should be offered from age 50 rather than age 40, because below 50 the great majority of positive results turn out on further testing to be false.\"<br><br>ASSUMPTION: \"No person under 50 has ever benefited from screening.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every patient enrolled in the study had a confirmed diagnosis. Mr Halloran did not have a confirmed diagnosis.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Mr Halloran does not have the condition.", "B": "Every patient with a confirmed diagnosis was enrolled in the study.", "C": "Mr Halloran was not enrolled in the study.", "D": "Mr Halloran was offered enrolment and declined."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No ward in the hospital met the four-hour target every week last year. Some wards in the hospital are surgical wards.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "No surgical ward anywhere meets the four-hour target.", "B": "Every ward in the hospital is a surgical ward.", "C": "Surgical wards perform worse than other wards.", "D": "At least one surgical ward failed to meet the four-hour target in some week last year."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A drug reduces the risk of a particular complication from 2 in 1,000 to 1 in 1,000. The manufacturer describes this as a 50 per cent reduction in risk.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The manufacturer's description is inaccurate.", "B": "The drug prevents the complication in about 1 person in every 1,000 treated.", "C": "Most people who take the drug avoid the complication because of it.", "D": "The drug prevents the complication in about 500 people in every 1,000 treated."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Whenever a serious adverse event occurs, the trial's safety board is convened. The safety board was not convened during the second phase.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "No adverse events of any kind occurred during the second phase.", "B": "The trial's second phase was safe for all participants.", "C": "The safety board convenes only for serious adverse events.", "D": "No serious adverse event occurred during the second phase."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A hospital introduced a checklist before surgery four years ago. The rate of post-operative infection fell from 4.1 per cent to 2.6 per cent. In the same period the hospital moved the majority of its hip operations to a new day-surgery unit, where patients spend far less time on a ward. Of the 3,200 procedures audited, 1,850 were carried out in the new unit.\"<br><br>CONCLUSIONS:<br>(1) Most of the audited procedures took place in the new day-surgery unit.<br>(2) The checklist caused the fall in the infection rate.<br>(3) The hospital moved most of its hip operations to a new unit during the period.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "C": "All three conclusions follow.", "D": "Only conclusion (1) follows."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A study of a new therapy recruited volunteers through a patients' association. Of the 400 who took part, 61 per cent reported an improvement in symptoms after twelve weeks. There was no control group. The association's newsletter reported the finding under the headline: New therapy works for six in ten.\"<br><br>CONCLUSIONS:<br>(1) Most of those who took part reported an improvement.<br>(2) The therapy caused the improvement in those who reported it.<br>(3) The study had no control group.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "B": "Only conclusion (3) follows.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A public health report notes that the district with the highest rate of a rare cancer and the district with the lowest rate are both small rural districts with populations under 4,000. The national average rate is 12 cases per 100,000 people a year. The report recommends no action specific to either district.\"<br><br>CONCLUSIONS:<br>(1) Both the highest and the lowest rates were recorded in districts with populations under 4,000.<br>(2) Something in the highest district is causing cancer.<br>(3) The report recommends no action specific to either district.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "Only conclusion (1) follows."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"An analysis of 90,000 births found that babies delivered at weekends had a slightly higher rate of complications than those delivered on weekdays. The analysis notes that planned deliveries are almost always scheduled on weekdays. It also reports that staffing levels are lower at weekends.\"<br><br>CONCLUSIONS:<br>(1) Complication rates were higher for weekend deliveries than for weekday deliveries in this sample.<br>(2) Lower weekend staffing caused the higher complication rate.<br>(3) Planned deliveries are almost always scheduled on weekdays.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "B": "All three conclusions follow.", "C": "Only conclusion (3) follows.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every sample sent to the reference laboratory is logged on arrival.<br>2. No sample logged on arrival is discarded within thirty days.<br>3. Sample 62 was sent to the reference laboratory.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Every sample logged on arrival was sent to the reference laboratory.", "B": "Sample 62 was logged on arrival.", "C": "Sample 62 will not be discarded within thirty days."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All of the patients on the trial register gave written consent.<br>2. Some patients who gave written consent later withdrew.<br>3. Mrs Ibarra is on the trial register.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "Every patient who gave written consent is on the trial register.", "B": "Mrs Ibarra gave written consent.", "C": "Mrs Ibarra later withdrew."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. No medicine without a batch number may be dispensed.<br>2. Every medicine supplied by the central pharmacy has a batch number.<br>3. The antibiotic was dispensed on Thursday.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "At least one medicine has been dispensed.", "B": "The antibiotic has a batch number.", "C": "The antibiotic was supplied by the central pharmacy."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every incident the trust classifies as never events is reported to the regulator.<br>2. No report made to the regulator is withdrawn once submitted.<br>3. The trust classified the March incident as a never event.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "The March incident caused harm to a patient.", "B": "The report of the March incident will not be withdrawn once submitted.", "C": "Every report made to the regulator concerns a never event."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should a new medicine be approved on the basis of an improvement in a laboratory measurement rather than in how patients actually fare?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. Patients with a serious illness cannot wait ten years for a definitive trial, and a regulator that makes them wait is choosing certainty over lives. I would want the drug now.", "B": "No. A review of 90 approvals granted on laboratory measurements alone followed each drug to see whether a benefit to patients was later demonstrated. In roughly 40 per cent of cases no such benefit was ever shown, and in a further 15 per cent the later trials found the drug performed worse than the existing treatment on the outcomes patients care about. Time to market was on average two years shorter for these approvals, which is the gain being traded against that record.", "C": "No. A number on a chart is not a person getting better. Medicine is supposed to be about how somebody feels and how long they live, not about what a machine prints out."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should hospitals publish infection rates for individual surgical teams?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. If I am about to be operated on I would like to know how the person holding the knife compares with the alternatives. It is my body and my risk.", "B": "No. Ranking surgeons by a single number is a recipe for gaming, and everybody who works in a hospital knows it. You will simply teach people to avoid the difficult cases.", "C": "No. In one health system that moved from departmental to team-level publication, an evaluation of 40,000 procedures found that reported infection rates fell, but that the proportion of high-risk patients referred on to specialist centres rose by about a quarter, and their waiting times rose with it. Among the patients who continued to be operated on locally, actual infection rates were essentially unchanged, so the published improvement largely reflected who was being operated on."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should governments fund treatments for very rare diseases at a much higher cost per patient than they accept for common ones?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "The question turns on a trade-off the figures can make explicit. In one system, treatments for rare diseases were funded at an average of about eight times the cost per year of healthy life gained that was accepted elsewhere. An analysis estimated that the same budget spent at the standard threshold would have produced roughly four times as many years of healthy life overall, while noting that under a strict threshold no treatment for any of the 60 conditions studied would have been funded at all.", "B": "No. Every pound has to come from somewhere, and a pound spent at eight times the going rate is seven pounds taken from someone else who is just as ill. The arithmetic is not complicated.", "C": "Yes. A person with a rare disease did not choose to be rare, and a health service that abandons people because there are not enough of them to be worth counting has lost its purpose."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should people be paid to take part in medical research?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes, subject to the limit the evidence identifies. Across 120 studies, sites offering payment recruited to target about twice as fast and enrolled a markedly wider range of participants by income and occupation than unpaid sites, which improves how far results generalise. Where payment exceeded roughly a week's median local earnings, however, the proportion of participants who under-reported symptoms that would have excluded them rose sharply, which is the point at which the inducement starts to distort the study.", "B": "No. Paying somebody to take a risk they would not otherwise take is not consent, it is purchase, and the poorer the volunteer the less it looks like a free choice.", "C": "Yes. People are paid for their time in every other context, and expecting volunteers to give up a day's work for nothing is simply a way of restricting research to the comfortable."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 6 Critical Thinking Drill 3</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
