<title>IDAT HKIS: Stage 5 (V4)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the idiom in the sentence below.\n\nAfter three years of setbacks and mounting debts, the young inventor finally ______ and abandoned the project altogether.", "options": {"A": "hit the roof", "B": "pulled her socks up", "C": "threw in the towel", "D": "went back to the drawing board"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\n______ weeks of intensive rehearsal, the lead actor froze the moment the curtain rose.", "options": {"A": "Despite", "B": "Although", "C": "However", "D": "Whereas"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "In the sentence below, what part of speech is the underlined word?\n\nHer <u>sound</u> advice saved the company from a costly mistake.", "options": {"A": "adverb", "B": "adjective", "C": "noun", "D": "verb"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\nHad the engineers ______ the hairline crack during last month's inspection, the bridge would not have been closed for emergency repairs.", "options": {"A": "detect", "B": "had detected", "C": "would have detected", "D": "detected"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>placate</u> in the sentence below?\n\nThe airline offered meal vouchers to <u>placate</u> passengers whose flights had been cancelled.", "options": {"A": "calm", "B": "repay", "C": "deceive", "D": "distract"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Choose the most appropriate formal replacement for the underlined phrase in this sentence from an official report.\n\nThe audit revealed that the project had <u>burned through</u> its entire budget by June.", "options": {"A": "blown", "B": "squandered", "C": "exhausted", "D": "used up masses of"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nWhen the results were announced, a <u>deafening silence</u> fell over the hall.", "options": {"A": "onomatopoeia", "B": "oxymoron", "C": "personification", "D": "hyperbole"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "One of the four labelled sections contains an error. Choose the labelled section that must be changed.\n\n(A) Since the new timetable was introduced, (B) there has been (C) a sharp fall in (D) the amount of students arriving late.", "options": {"A": "(A)", "B": "(B)", "C": "(C)", "D": "(D)"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which word is most nearly OPPOSITE in meaning to the underlined word?\n\nThe geologist admitted that the evidence supporting her theory was <u>tenuous</u>.", "options": {"A": "solid", "B": "fragile", "C": "tense", "D": "concealed"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\nThe tribunal demanded that every witness ______ available for cross-examination before the hearing began.", "options": {"A": "was", "B": "be", "C": "is", "D": "would be"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the word <u>confined</u> as it is used in the third paragraph (\"Auroras, normally <u>confined</u> to the polar regions\")?", "options": {"A": "locked away as a punishment", "B": "faintly visible", "C": "limited or restricted", "D": "frozen in place"}, "fig": "", "passage": "<strong>The Storm That Set the Sky on Fire</strong><br>Early on the morning of 2 September 1859, telegraph operators across Europe and North America arrived at work to find their equipment behaving as if possessed. Sparks leapt from the machines, paper caught fire, and several operators received sharp electric shocks. Strangest of all, some discovered that they could disconnect their batteries entirely and continue sending messages, the wires powered by nothing anyone could see.\n\nThe culprit was 150 million kilometres away. A day earlier, the British astronomer Richard Carrington had been sketching a cluster of sunspots when two points of blinding white light flared on the Sun's surface. He was so startled that he ran to fetch a witness; by the time he returned, barely a minute later, the light had already faded. Fortunately, another astronomer, Richard Hodgson, had seen the same flash from his own observatory, and his independent record convinced doubters that the event was real. Carrington had witnessed a solar flare, an enormous eruption of magnetic energy, and the cloud of electrically charged particles it hurled towards Earth arrived just seventeen hours later, far faster than such clouds usually travel. When the cloud collided with Earth's magnetic field, the impact set the field quivering, and those vibrations drove powerful electric currents through any long metal wire on the planet's surface. It was this invisible current, surging along thousands of kilometres of telegraph line, that kept the batteryless machines running. The result was the greatest geomagnetic storm ever recorded, now known as the Carrington Event.\n\nThe effects were as spectacular as they were destructive. Auroras, normally confined to the polar regions, blazed so far south that they were reported in Cuba and Colombia. In parts of the United States the night sky glowed so brightly that gold miners in the Rocky Mountains woke and began cooking breakfast, convinced that dawn had come, and some newspapers could reportedly be read at midnight by the aurora's light alone.\n\nIn 1859 the world's only electrical network was the telegraph, so the damage, though alarming, was limited. Scientists warn that a storm of the same magnitude today would strike a very different world, one dependent on satellites, power grids and undersea cables. Studies suggest that such an event could destroy giant transformers that take years to manufacture and replace, causing blackouts lasting months and damage costing trillions of dollars.\n\nHumanity is no longer entirely blind to the danger. A fleet of satellites now watches the Sun around the clock, and when an eruption is spotted, forecasters can give power companies several hours' warning to protect their equipment. What no one can do, however, is predict when the next great storm will erupt. Storms of this size are rare, but they are not hypothetical: in July 2012 a solar storm of comparable strength crossed Earth's orbit, missing our planet by only nine days.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "According to the passage, why could some telegraph operators continue sending messages after disconnecting their batteries?", "options": {"A": "The storm's collision with Earth's magnetic field was driving electric current through the telegraph wires.", "B": "The telegraph machines stored enough spare charge inside to run for several more hours.", "C": "The sparks leaping from the machines had recharged the batteries without the operators noticing.", "D": "The auroras overhead were carrying the telegraph signals directly through the air."}, "fig": "", "passage": "<strong>The Storm That Set the Sky on Fire</strong><br>Early on the morning of 2 September 1859, telegraph operators across Europe and North America arrived at work to find their equipment behaving as nergy, and the cloud of electrically charged particles it hurled towards Earth arrived just seventeen hours later, far faster than such clouds usually travel. When the cloud collided with Earth's magnetic field, the impact set the field quivering, and those vibrations drove powerful electric currents through any long metal wire on the planet's surface. It was this invisible current, surging along thousands of kilometres of telegraph line, that kept the batteryless machines running. The result was the greatest geomagnetic storm ever recorded, now known as the Carrington Event.\n\nThe effects were as spectacular as they were destructive. Auroras, normally confined to the polar regions, blazed so far south that they were reported in Cuba and Colombia. In parts of the United States the night sky glowed so brightly that gold miners in the Rocky Mountains woke and began cooking breakfast, convinced that dawn had come, and some newspapers could reportedly be read at midnight by the aurora's light alone.\n\nIn 1859 the world's only electrical network was the telegraph, so the damage, though alarming, was limited. Scientists warn that a storm of the same magnitude today would strike a very different world, one dependent on satellites, power grids and undersea cables. Studies suggest that such an event could destroy giant transformers that take years to manufacture and replace, causing blackouts lasting months and damage costing trillions of dollars.\n\nHumanity is no longer entirely blind to the danger. A fleet of satellites now watches the Sun around the clock, and when an eruption is spotted, forecasters can give power companies several hours' warning to protect their equipment. What no one can do, however, is predict when the next great storm will erupt. Storms of this size are rare, but they are not hypothetical: in July 2012 a solar storm of comparable strength crossed Earth's orbit, missing our planet by only nine days.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Why does the writer mention the solar storm of July 2012 in the final paragraph?", "options": {"A": "to prove that solar storms have become more frequent since 1859", "B": "to reassure readers that dangerous solar storms always miss Earth", "C": "to show that a Carrington-scale storm is a realistic present-day possibility, not just a historical curiosity", "D": "to demonstrate that modern astronomers can now predict when such storms will strike Earth"}, "fig": "", "passage": "<strong>The Storm That Set the Sky on Fire</strong><br>Early on the morning of 2 September 1859, telegraph operators across Europe and North America arrived at work to find their equipment behaving as if possessed. Sparks leapt from the machines, paper caught fire, and several operators received sharp electric shocks. Strangest of all, some discovered that they could disconnect their batteries entirely and continue sending messages, the wires powered by nothing anyone could see.\n\nThe culprit was 150 million kilometres away. A day earlier, the British astronomer Richard Carrington had been sketching a cluster of sunspots when two points of blinding white light flared on the Sun's surface. He was so startled that he ran to fetch a witness; by the time he returned, barely a minute later, the light had already faded. Fortunately, another astronomer, Richard Hodgson, had seen the same flash from his own observatory, and his independent record convinced doubters that the event was real. Carrington had witnessed a solar flare, an enormous eruption of magnetic energy, and the cloud of electrically charged particles it hurled towards Earth arrived just seventeen hours later, far faster than such clouds usually travel. When the cloud collided with Earth's magnetic field, the impact set the field quivering, and those vibrations drove powerful electric currents through any long metal wire on the planet's surface. It was this invisible current, surging along thousands of kilometres of telegraph line, that kept the batteryless machines running. The result was the greatest geomagnetic storm ever recorded, now known as the Carrington Event.\n\nThe effects were as spectacular as they were destructive. Auroras, normally confined to the polar regions, blazed so far south that they were reported in Cuba and Colombia. In parts of the United States the night sky glowed so brightly that gold miners in the Rocky Mountains woke and began cooking breakfast, convinced that dawn had come, and some newspapers could reportedly be read at midnight by the aurora's light alone.\n\nIn 1859 the world's only electrical network was the telegraph, so the damage, though alarming, was limited. Scientists warn that a storm of the same magnitude today would strike a very different world, one dependent on satellites, power grids and undersea cables. Studies suggest that such an event could destroy giant transformers that take years to manufacture and replace, causing blackouts lasting months and damage costing trillions of dollars.\n\nHumanity is no longer entirely blind to the danger. A fleet of satellites now watches the Sun around the clock, and when an eruption is spotted, forecasters can give power companies several hours' warning to protect their equipment. What no one can do, however, is predict when the next great storm will erupt. Storms of this size are rare, but they are not hypothetical: in July 2012 a solar storm of comparable strength crossed Earth's orbit, missing our planet by only nine days.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "English Writing: two tasks. Part 1 is a drop-down editing passage; Part 2 is a single free-write paragraph.", "label": "", "body": "", "hint": "Part 1: Read the passage. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and appropriate, and record your answers as 1-A, 2-B, and so on. Part 2: Choose ONE of the two tasks and write your paragraph of no more than 12 sentences in the answer box.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1:\n\nEvery Friday afternoon, the school's new student podcast [1: A) recorded B) is recorded C) recording] in a small studio behind the library. Each of the twenty-minute episodes [2: A) take B) taking C) takes] several hours to prepare, so the team plans every interview a full week in advance. In a recent episode about the school canteen, the presenters spoke to cooks, parents and even [3: A) little kids B) youngsters C) young children] from the junior school. The first episode was downloaded eight hundred times, [4: A) so B) unless C) but] the delighted team has already planned a second season. Reviewers say its honest conversations set it apart [5: A) from B) with C) of] ordinary programmes, and teachers admire how [6: A) professional B) professionally C) more professional] the young crew edits every episode.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences: (1) Explain, step by step, how to prepare a simple dish you know well, making your instructions clear enough for someone who has never cooked before to follow successfully. (2) Write a short narrative about a character who misses the last ferry home, and describe how the unexpected delay changes the rest of their evening."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you do best?", "options": {"A": "Sports and moving my body", "B": "Art, music or making things", "C": "Making and keeping friends", "D": "Schoolwork and learning new facts"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What would you like to get even better at?", "options": {"A": "Speaking up in front of other people", "B": "Staying calm when ou most want to do with them?", "options": {"A": "Make up a brand-new game using the ball", "B": "Paint or draw whatever comes to mind", "C": "Write my ideas and plans in the notebook", "D": "Solve the puzzle piece by piece"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you have free time, what do you like the most?", "options": {"A": "Making something new, like a story, model or drawing", "B": "Playing games with clear rules", "C": "Practising something I already do well", "D": "Exploring and finding out how things work"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "When your group has a tricky problem, what do you do best?", "options": {"A": "Think of a completely new idea", "B": "Make someone else's idea even better", "C": "Spot a pattern that others missed", "D": "Keep everyone following the plan"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "How comfortable are you sharing an idea that is different from everyone else's?", "options": {"A": "Very comfortable", "B": "Quite comfortable", "C": "A little uncomfortable", "D": "Very uncomfortable"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "What do you think helps people get along with each other?", "options": {"A": "Listening carefully to each other", "B": "Sharing and taking turns", "C": "Helping someone who is stuck", "D": "Saying kind and encouraging words"}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "What makes you sad?", "options": {"A": "Seeing a friend left out of a game", "B": "Losing a game I tried really hard at", "C": "Having an argument with someone I like", "D": "When plans I looked forward to are cancelled"}, "cnum": "14"}, {"n": "33", "type": "selfeval", "section": "Character", "stem": "When a friend disagrees with your idea, what do you usually do first?", "options": {"A": "Explain my idea again in a different way", "B ", "section": "Maths", "stem": "After a 15% discount, a jacket costs $170. Find the original price.", "options": {"A": "$195.50", "B": "$185.00", "C": "$212.50", "D": "$200.00"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "Factorise fully: x² − 5x − 24.", "options": {"A": "(x + 8)(x − 3)", "B": "(x − 8)(x + 3)", "C": "(x − 6)(x + 4)", "D": "(x − 8)(x − 3)"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "Solve: 2x/3 + x/4 = 11.", "options": {"A": "x = 1", "B": "x = 44", "C": "x = 12", "D": "x = 11"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "The sequence 7, 11, 15, 19, … continues with the same pattern. One term of the sequence is 163. Find the value of n for which the nth term equals 163.", "options": {"A": "n = 40", "B": "n = 39", "C": "n = 53", "D": "n = 41"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "In the triangle shown, two of the interior angles are (2x + 10)° and (3x − 15)°. The exterior angle at the third vertex is 115°. Find the value of x.", "options": {"A": "14", "B": "24", "C": "25", "D": "37"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"340\" height=\"240\" viewBox=\"0 0 340 240\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"340\" height=\"240\" fill=\"white\"/><polygon points=\"60,190 280,190 150,50\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"74\" y=\"180\" font-size=\"15\" fill=\"#333\">(2x + 10)°</text><text x=\"246\" y=\"180\" font-size=\"15\" fill=\"#333\">(3x − 15)°</text><text x=\"142\" y=\"74\" font-size=\"15\" font-weight=\"bold\" fill=\"#C00\">?</text><circle cx=\"60\" cy=\"190\" r=\"3\" fill=\"#1F3864\"/><circle cx=\"280\" cy=\"190\" r=\"3\" fill=\"#1F3864\"/><circle cx=\"150\" cy=\"50\" r=\"3\" fill=\"#1F3864\"/></svg>", "passage": "", "qnum": "10"}, {"n": "46", "type": "mcq", "section": "Maths", "stem": "The 16 cards shown each carry one symbol. Two cards are taken at random, one after the other, WITHOUT replacement. Find the probability that both cards show a diamond.", "options": {"A": "5/48", "B": "25/256", "C": "5/64", "D": "1/12"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"280\" height=\"280\" viewBox=\"0 0 280 280\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"280\" height=\"280\" fill=\"white\"/><rect x=\"10\" y=\"10\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"42.0\" y=\"52.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#C00\">◆</text><rect x=\"74\" y=\"10\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"106.0\" y=\"52.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#C00\">◆</text><rect x=\"138\" y=\"10\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"170.0\" y=\"52.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#C00\">◆</text><rect x=\"202\" y=\"10\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"234.0\" y=\"52.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#C00\">◆</text><rect x=\"10\" y=\"74\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"42.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#C00\">◆</text><rect x=\"74\" y=\"74\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"106.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#E8A200\">★</text><rect x=\"138\" y=\"74\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"170.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#E8A200\">★</text><rect x=\"202\" y=\"74\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"234.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"30\" fill=\"#E8A200\">★</text><rect x=\"10\" y=\"138\" width=\"64\" height=\"64\" fill=\"white\" stroke=\"#999\"/><text x=\"42.0\" y=\"180.0\" text-anchor=\"middle {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Four teams, P, Q, R and S, play in a round-robin tournament: each team plays every other team exactly once. A win is worth 3 points, a draw 1 point and a loss 0 points. You are told:\n\n1. P won all three of its matches.\n2. Q drew exactly two matches and lost the other.\n3. S finished the tournament with exactly 1 point.\n\nWhat was the result of the match between R and S?", "options": {"A": "R beat S", "B": "S beat R", "C": "R and S drew", "D": "It cannot be determined from the information given"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Two ferry services run from the same pier. The Lamma ferry leaves every 45 minutes, with the first departure at 07:20. The Peng Chau ferry leaves every 30 minutes, with the first departure at 07:35. A photographer wants to film the two ferries leaving the pier at the same moment. She arrives at the pier at 09:00. At what time will she next see both ferries depart together?", "options": {"A": "09:05", "B": "09:35", "C": "10:30", "D": "11:05"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "In a year group of 40 students, 21 study French, 19 study Spanish and 15 study Japanese. 8 students study both French and Spanish, 7 study both Spanish and Japanese, and 6 study both French and Japanese. 4 students study all three languages. How many students study NONE of the three languages?", "options": {"A": "10", "B": "6", "C": "2", "D": "0"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The health clinic should introduce an online booking system, because doing so will let patients arrange their appointments without waiting in long telephone queues.\"<br><br>ASSUMPTION: \"At least some patients are currently inconvenienced by telephone queues when booking appointments.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "INFERENCE. Statement: \"Every stall at Saturday's craft market sold at least one item. The pottery stall sold more items than any other stall. The candle stall sold exactly three items.\"\n\nWhich one of the following MUST be true on the basis of the statement alone?", "options": {"A": "The candle stall sold fewer items than every other stall at the market.", "B": "Every stall at the market sold at least three items.", "C": "The pottery stall sold at least four items.", "D": "The pottery stall earned more money than the candle stall."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "DEDUCTION. Treat the following facts as completely true:\n\n- Every member of the debate club is in Year 10 or Year 11.\n- No Year 10 student at the school studies Drama.\n- Maya is a member of the debate club, and she studies Drama.\n\nThree of the conclusions below follow logically from these facts. Which conclusion does NOT follow?", "options": {"A": "Maya is not in Year 10.", "B": "Maya is in Year 11.", "C": "Every Year 11 member of the debate club studies Drama."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the city introduce a small refundable deposit on single-use drink bottles, returned to customers when the bottle is brought back for recycling?\"\n\nWhich of the following is the STRONGEST argument, judged only by the quality of its reasoning?", "options": {"A": "Yes — in the three neighbouring regions that introduced a similar deposit, independent audits recorded bottle-return rates rising from below 50% to above 85% within two years.", "B": "No — my own family already recycles every bottle we use, so most households clearly don't need a financial push to recycle.", "C": "No — the manager of the city's biggest supermarket chain, who has worked in retail for thirty years, says bottle deposits never change customer behaviour."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"An energy supplier surveyed all 500 households on its standard tariff. Every household answered both questions. 320 households said they had switched supplier at least once before. 210 households said they had installed a smart meter. 140 households said both.\"<br><br>CONCLUSIONS:<br>(1) 110 of the surveyed households had neither switched supplier before nor installed a smart meter.<br>(2) More than half of the surveyed households had switched supplier at least once before.<br>(3) Households that install a smart meter are more likely to switch supplier.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "Only conclusion (2) follows.", "C": "All three conclusions follow.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 (V4)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
