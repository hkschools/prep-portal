<title>IDAT HKIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "5", VERSION = "3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the connective that best completes the sentence.\n\nThe factory had every modern safety device installed; ______, the inspectors found that none of them had ever been switched on.", "options": {"A": "therefore", "B": "however", "C": "consequently", "D": "likewise"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\n______ the application was submitted on time, it was returned because two of the required documents were missing.", "options": {"A": "Because", "B": "Unless", "C": "Although", "D": "So that"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the sentence written in the register most appropriate for a formal letter applying for a part-time job.", "options": {"A": "I am writing to apply for the position advertised on your website last week.", "B": "I wanted to drop you a quick line about the job you've got going.", "C": "Just checking in to say I'd love a shot at that role you posted.", "D": "Hey, I saw your ad and figured I'd throw my name in the hat."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "In the sentence below, what part of speech is the underlined word?\n\nThe scientist offered a <u>compelling</u> explanation that silenced even her harshest critics.", "options": {"A": "noun", "B": "adjective", "C": "verb", "D": "adverb"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes this third conditional sentence.\n\nIf the climbers ______ the forecast more carefully, they would never have set out in such dangerous weather.", "options": {"A": "checked", "B": "would have checked", "C": "have checked", "D": "had checked"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What is the meaning of the underlined word as it is used in the sentence below?\n\nThe witness gave a <u>candid</u> account, admitting openly to the mistakes she had made.", "options": {"A": "angry and defensive", "B": "long and confusing", "C": "honest and frank", "D": "carefully rehearsed"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the idiom that best completes the sentence.\n\nThe veteran editor refused to take sides in the dispute, preferring instead to ______ until she had heard every argument.", "options": {"A": "sit on the fence", "B": "jump in at the deep end", "C": "throw caution to the wind", "D": "take the bull by the horns"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined word?\n\nThe rain <u>pattered</u> softly against the window all through the night.", "options": {"A": "personification", "B": "hyperbole", "C": "simile", "D": "onomatopoeia"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe editor asked the journalist to ______ the report, cutting the unnecessary detail so that only the essential facts remained.", "options": {"A": "embellish", "B": "condense", "C": "fabricate", "D": "reiterate"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "One of the four labelled sections contains an error. Choose the labelled section that must be corrected.\n\nNeither the head coach nor the players (A) believes (B) that the new training schedule (C) will improve (D) the team's results.", "options": {"A": "the players", "B": "believes", "C": "the new training schedule", "D": "will improve"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What does the word \"perilously\" most nearly mean as it is used in the first paragraph (\"we are perilously close to throwing away\")?", "options": {"A": "dangerously", "B": "reluctantly", "C": "accidentally", "D": "permanently"}, "fig": "", "passage": "<strong>Why Our Town Must Save Its Last Wetland</strong><br>Neighbours, ratepayers, friends: I have not come here tonight to mourn something we have lost, but to defend something we still have, and that we are perilously close to throwing away. On the eastern edge of our town lies Marsh End, the last surviving wetland for forty kilometres in any direction. Next month, this council will vote on whether to drain it and sell the land for a car park. I am here to ask you, with everything I have, to vote no.\n\nLet me begin with the water under our own feet. A wetland is not waste ground; it is the most efficient flood defence that nature has ever built. According to a 2022 report by the National Rivers Trust, a single hectare of healthy marsh can absorb and slowly release as much storm water as a concrete reservoir costing several million dollars to construct. Marsh End covers eleven such hectares. When the river burst its banks three winters ago, it was that marsh, and not our drains, that kept the floodwater out of the houses on Lowfield Road.\n\nSome of you will say that the town needs parking far more than it needs a muddy field, and I understand the pressure. But I would ask you to weigh what we would actually be trading. The same report estimates that replacing the marsh's flood protection with engineered drainage would cost the town close to four million dollars over the next decade, before a single car was ever parked. We would pay a fortune to destroy something that already does the job for nothing.\n\nThe wetland is also alive in a way no car park ever could be. Marsh End is home to nesting bitterns, a bird so rare that fewer than two hundred breeding pairs remain in the entire country. Children from our own primary school walk there each spring to count frogspawn and watch the herons. Once we drain it, none of this returns; an ecosystem built over centuries cannot be rebuilt over a weekend.\n\nI will not pretend the decision is free of cost. Parking is a genuine problem, and I do not dismiss the residents who circle the high street each morning searching for a space. Yet the council's own surveyors have already identified two disused sites nearer the town centre that could provide more spaces than Marsh End ever would, without sacrificing a single reed. The choice before us, then, is not parking versus nature. It is whether we are willing to destroy something irreplaceable when a better answer sits a few streets away.\n\nSo I ask you tonight not whether we can afford to keep Marsh End, but whether we can possibly afford to lose it. The water it holds back, the creatures it shelters, the children it teaches: these are not luxuries we can buy again once they are gone. Vote no. Keep the marsh. Thank you.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "According to the speech, what does the 2022 National Rivers Trust report state?", "options": {"A": "Marsh End is home to fewer than two hundred breeding pairs of bitterns.", "B": "Two disused sites nearer the town centre could provide more parking spaces.", "C": "Children from the primary school walk to the marsh each spring.", "D": "A single hectare of healthy marsh can store as much storm water as a multi-million-dollar reservoir."}, "fig": "", "passage": "<strong>Why Our Town Must Save Its Last Wetland</strong><br>Neighbours, ratepayers, friends: I have not come here tonight to mourn something we have lost, but to defend something we still have, and that we are perilously close to throwing away. On the eastern edge of our town lies Marsh End, the last surviving wetland for forty kilometres in any direction. Next month, this council will vote on whether to drain it and sell the land for a car park. I am here to ask you, with everything I have, to vote no.\n\nLet me begin with the water under our own feet. A wetland is not waste ground; it is the most efficient flood defence that nature has ever built. According to a 2022 report by the National Rivers Trust, a single hectare of healthy marsh can absorb and slowly release as much storm water as a concrete reservoir costing several million dollars to construct. Marsh End covers eleven such hectares. When the river burst its banks three winters ago, it was that marsh, and not our drains, that kept the floodwater out of the houses on Lowfield Road.\n\nSome of you will say that the town needs parking far more than it needs a muddy field, and I understand the pressure. But I would ask you to weigh what we would actually be trading. The same report estimates that replacing the marsh's flood protection with engineered drainage would cost the town close to four million dollars over the next decade, before a single car was ever parked. We would pay a fortune to destroy something that already does the job for nothing.\n\nThe wetland is also alive in a way no car park ever could be. Marsh End is home to nesting bitterns, a bird so rare that fewer than two hundred breeding pairs remain in the entire country. Children from our own primary school walk there each spring to count frogspawn and watch the herons. Once we drain it, none of this returns; an ecosystem built over centuries cannot be rebuilt over a weekend.\n\nI will not pretend the decision is free of cost. Parking is a genuine problem, and I do not dismiss the residents who circle the high street each morning searching for a space. Yet the council's own surveyors have already identified two disused sites nearer the town centre that could provide more spaces than Marsh End ever would, without sacrificing a single reed. The choice before us, then, is not parking versus nature. It is whether we are willing to destroy something irreplaceable when a better answer sits a few streets away.\n\nSo I ask you tonight not whether we can afford to keep Marsh End, but whether we can possibly afford to lose it. The water it holds back, the creatures it shelters, the children it teaches: these are not luxuries we can buy again once they are gone. Vote no. Keep the marsh. Thank you.", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "What does the speaker most strongly imply by saying \"an ecosystem built over centuries cannot be rebuilt over a weekend\"?", "options": {"A": "The marsh could be recreated quickly if the council provided enough funding.", "B": "The loss of the wetland would be effectively permanent and irreversible.", "C": "The council should spend an entire weekend studying the marsh before voting.", "D": "Ecosystems are too complicated for ordinary residents to understand."}, "fig": "", "passage": "<strong>Why Our Town Must Save Its Last Wetland</strong><br>Neighbours, ratepayers, friends: I have not come here tonight to mourn something we have lost, but to defend something we still have, and that we are perilously close to throwing away. On the eastern edge of our town lies Marsh End, the last surviving wetland for forty kilometres in any direction. Next month, this council will vote on whether to drain it and sell the land for a car park. I am here to ask you, with everything I have, to vote no.\n\nLet me begin with the water under our own feet. A wetland is not waste ground; it is the most efficient flood defence that nature has ever built. According to a 2022 report by the National Rivers Trust, a single hectare of healthy marsh can absorb and slowly release as much storm water as a concrete reservoir costing several million dollars to construct. Marsh End covers eleven such hectares. When the river burst its banks three winters ago, it was that marsh, and not need any more parking at all", "B": "To admit that there is no real solution to the town's parking problem", "C": "To answer the parking objection by showing a better alternative exists", "D": "To complain that the council's surveyors have been slow to act"}, "fig": "", "passage": "<strong>Why Our Town Must Save Its Last Wetland</strong><br>Neighbours, ratepayers, friends: I have not come here tonight to mourn something we have lost, but to defend something we still have, and that we are perilously close to throwing away. On the eastern edge of our town lies Marsh End, the last surviving wetland for forty kilometres in any direction. Next month, this council will vote on whether to drain it and sell the land for a car park. I am here to ask you, with everything I have, to vote no.\n\nLet me begin with the water under our own feet. A wetland is not waste ground; it is the most efficient flood defence that nature has ever built. According to a 2022 report by the National Rivers Trust, a single hectare of healthy marsh can absorb and slowly release as much storm water as a concrete reservoir costing several million dollars to construct. Marsh End covers eleven such hectares. When the river burst its banks three winters ago, it was that marsh, and not our drains, that kept the floodwater out of the houses on Lowfield Road.\n\nSome of you will say that the town needs parking far more than it needs a muddy field, and I understand the pressure. But I would ask you to weigh what we would actually be trading. The same report estimates that replacing the marsh's flood protection with engineered drainage would cost the town close to four million dollars over the next decade, before a single car was ever parked. We would pay a fortune to destroy something that already does the job for nothing.\n\nThe wetland is also alive in a way no car park ever could be. Marsh End is home to nesting bitterns, a bird so rare that fewer than two hundred breeding pairs remain in the entire country. Children from our own primary school walk there each spring to count frogspawn and watch the herons. Once we drain it, none of this returns; an ecosystem built over centuries cannot be rebuilt over a weekend.\n\nI will not pretend the decision is free of cost. Parking is a genuine problem, and I do not dismiss the residents who circle the high street each morning searching for a space. Yet the council's own surveyors have already identified two disused sites nearer the town centre that could provide more spaces than Marsh End ever would, without sacrificing a single reed. The choice before us, then, is not parking versus nature. It is whether we are willing to destroy something irreplaceable when a better answer sits a few streets away.\n\nSo I ask you tonight not whether we can afford to keep Marsh End, but whether we can possibly afford to lose it. The water it holds back, the creatures it shelters, the children it teaches: these are not luxuries we can buy again once they are gone. Vote no. Keep the marsh. Thank you.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which statement best expresses the central argument of the speech?", "options": {"A": "The town should keep Marsh End because it provides cheap flood protection and irreplaceable wildlife, and better parking options exist elsewhere.", "B": "The town's flooding problems can only be solved by building a concrete reservoir.", "C": "Parking is the most urgent problem the town faces and must be solved at any cost.", "D": "Rare birds such as bitterns are more important than the safety of local residents."}, "fig": "", "passage": "<strong>Why Our Town Must Save Its Last Wetland</strong><br>Neighbours, ratepayers, friends: I have not come here tonight to mourn something we have lost, but to defend something we still have, and that we are perilously close to throwing away. On the eastern edge of our town lies Marsh End, the last surviving wetland for forty kilometres in any direction. Next month, this council will vote on whether to drain it and sell the land for a car park. I am here to ask you, with everything I have, to vote no.\n\nLet me begin with the water under our own feet. A wetland is not waste ground; it is the most efficient flood defence that nature has ever built. According to a 2022 report by the National Rivers Trust, a single hectare of healthy marsh can absorb and slowly release as much storm water as a concrete reservoir costing several million dollars to construct. Marsh End covers eleven such hectares. When the river burst its banks three winters ago, it was that marsh, and not our drains, that kept the floodwater out of the houses on Lowfield Road.\n\nSome of you will say that the town needs parking far more than it needs a muddy field, and I understand the pressure. But I would ask you to weigh what we would actually be trading. The same report estimates that replacing the marsh's flood protection with engineered drainage would cost the town close to four million dollars over the next decade, before a single car was ever parked. We would pay a fortune to destroy something that already does the job for nothing.\n\nThe wetland is also alive in a way no car park ever could be. Marsh End is home to nesting bitterns, a bird so rare that fewer than two hundred breeding pairs remain in the entire country. Children from our own primary school walk there each spring to count frogspawn and watch the herons. Once we drain it, none of this returns; an ecosystem built over centuries cannot be rebuilt over a weekend.\n\nI will not pretend the decision is free of cost. Parking is a genuine problem, and I do not dismiss the residents who circle the high street each morning searching for a space. Yet the council's own surveyors have already identified two disused sites nearer the town centre that could provide more spaces than Marsh End ever would, without sacrificing a single reed. The choice before us, then, is not parking versus nature. It is whether we are willing to destroy something irreplaceable when a better answer sits a few streets away.\n\nSo I ask you tonight not whether we can afford to keep Marsh End, but whether we can possibly afford to lose it. The water it holds back, the creatures it shelters, the children it teaches: these are not luxuries we can buy again once they are gone. Vote no. Keep the marsh. Thank you.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "This task has two parts. Part 1 tests your editing of a short passage; Part 2 asks you to write one developed paragraph.", "label": "", "body": "", "hint": "Part 1: For each of the six numbered brackets, choose the option (A, B or C) that makes the sentence grammatically correct. Part 2: Choose ONE of the two tasks and write a single paragraph of no more than 12 sentences. Write in clear, well-organised English, paying attention to sentence variety, vocabulary, and accurate grammar.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option (A, B or C) that makes the sentence correct.\n\nThe old lighthouse on the headland, which [1: A) have B) has C) are] guided ships safely for over a hundred years, is now open to visitors every weekend. Each Saturday the guides polish the great lamp [2: A) careful B) carefully C) carefuller] so that it shines as brightly as it did in the past. Visitors are asked to climb the spiral staircase [3: A) slower B) more slowly C) most slowly] than they might elsewhere, because the steps are narrow and worn. [4: A) Although B) Because C) Unless] the view from the top is breathtaking, very few people are brave enough to step onto the outer balcony. Last summer the lantern room [5: A) was restored B) restored C) has restored] by a team of local craftspeople, and it is now [6: A) the more impressive B) impressiver C) the most impressive] sight on the whole coast.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences: (1) Explain to a younger student how to plant a seed in a pot and look after it until it grows, describing each step clearly and in order. (2) Write a short narrative about a time you explored an old or forgotten place and found something you did not expect, using vivid language to bring the moment to life."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "Which of these feels most like you?", "options": {"A": "Being active, sporty and on the move", "B": "Working things out and learning new ideas", "C": "Designing, building or creating things", "D": "Getting on well with the people around me"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What would you most like to get even better at?", "options": {"A": "Feeling settled and steady when things get tough", "B": "Sharing my ideas out loud when I want to", "C": "Keeping going until a job is finished", "D": "Trying things that look a bit difficult"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What gives you the best feeling?", "options": {"A": "Taking on a fun challenge", "B": "Discovering something I did not know", "C": "Making something that is all my own", "D": "Spending good time with friends"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "How much do you like to put real effort into a task?", "options": {"A": "Not much", "B": "A little", "C": "Quite a lot", "D": "A great deal"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "A new sport or physical challenge", "B": "A harder puzzle or brain teaser", "C": "A new kind of art or music", "  "mcq", "section": "Global Knowledge & Logic", "stem": "A flight leaves Hong Kong at 21:50 (HKT) on Thursday. The journey takes 13 hours 20 minutes. The destination city, Doha, is 5 hours BEHIND Hong Kong. What is the local date and clock time in Doha when the flight lands?", "options": {"A": "06:10 on Friday", "B": "11:10 on Friday", "C": "16:10 on Friday", "D": "06:10 on Thursday"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Four tiles each show the SAME L-shaped figure. Three of the tiles show that figure simply turned (rotated) to different angles. One tile shows the figure as a MIRROR IMAGE (a reflection), which cannot be produced by turning. Which tile is the odd one out?", "options": {"A": "Tile A", "B": "Tile B", "C": "Tile C", "D": "Tile D"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Start with a capital letter F in its normal upright position. First REFLECT it across a vertical mirror line (so it faces the opposite way). Then ROTATE that mirror image 90 degrees CLOCKWISE. Which option shows the final figure?", "options": {"A": "the F after only the reflection (no rotation)", "B": "the reflected F turned 90 degrees clockwise", "C": "the upright F turned 90 degrees clockwise (no reflection)", "D": "the reflected F turned 90 degrees ANTI-clockwise"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "ASSUMPTION. Statement: \"Our company should offer free evening language classes to its staff, because every overseas client we surveyed says it values being able to deal with staff who speak the client's own language.\"\n\nProposed assumption: \"The free language classes would actually increase the number of staff able to speak the clients' languages.\"\n\nUsing only the information in the statement, is this assumption one the argument must take for granted? sing ONLY the information given?", "options": {"A": "Both Conclusion I and Conclusion II follow.", "B": "Neither Conclusion I nor Conclusion II follows.", "C": "Conclusion II follows but Conclusion I does not.", "D": "Conclusion I follows but Conclusion II does not."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the city require all new office buildings to install rooftop solar panels?\" Which of the following is the STRONGEST argument, judged only by the quality of its reasoning?", "options": {"A": "No, because requiring solar panels would be unfair, and nobody likes being told what to do with a building they paid for.", "B": "Yes, because a study of 300 detached family HOMES found their rooftop panels cut household electricity bills by a quarter, so office buildings would clearly see the same saving.", "C": "Yes, because a three-year study of 200 commercial OFFICE buildings found rooftop panels cut each building's grid electricity use by an average of 28% and repaid their installation cost within seven years.", "D": "No, because my uncle fitted panels to his house and his bill barely changed, so they are plainly not worth the cost for any building."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
