<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 5 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "5", VERSION = "1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence.\n\nThe proposal was financially sound; ________, the committee rejected it on ethical grounds.", "options": {"A": "therefore", "B": "moreover", "C": "consequently", "D": "nevertheless"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence.\n\nIf the council ________ the warnings last year, the flood damage could have been prevented.", "options": {"A": "had heeded", "B": "heeded", "C": "would heed", "D": "has heeded"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which sentence uses the colon and semicolon correctly?", "options": {"A": "The expedition needed three things; rope, water and a reliable map.", "B": "The expedition needed: three things, rope, water and a reliable map.", "C": "The expedition needed three things: rope, water and a reliable map.", "D": "The expedition needed three things: rope; water; and a reliable map."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Three of the connectives below could replace one another in the sentence without changing its meaning. Choose the ONE connective that could NOT.\n\nThe trial produced encouraging early results; ________, the researchers urged caution until larger studies were complete.", "options": {"A": "however", "B": "even so", "C": "thus", "D": "nonetheless"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "One of the four labelled sections contains a grammatical error. Choose the labelled section that must be changed.\n\nNeither the manager nor the employees (A) was informed (B) about the sudden (C) changes to the (D) schedule.", "options": {"A": "Neither the manager nor", "B": "was informed", "C": "changes to the", "D": "schedule"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What is the meaning of the underlined word as it is used in the sentence below?\n\nThe ambassador's remarks were deliberately <u>equivocal</u>, allowing each side to believe she supported their position.", "options": {"A": "extremely detailed", "B": "firmly decisive", "C": "deliberately offensive", "D": "open to more than one interpretation"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "In the sentence below, what part of speech is the underlined word?\n\nThe new policy will <u>benefit</u> students from low-income families.", "options": {"A": "verb", "B": "noun", "C": "adjective", "D": "adverb"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the idiom so the sentence makes sense.\n\nAfter months of preparation, the new recruits were expected to ________ and contribute fully from their very first day.", "options": {"A": "throw in the towel", "B": "get up to speed slowly", "C": "hit the ground running", "D": "jump the gun"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the sentence in which the modifier is correctly placed.", "options": {"A": "Walking to the station, the rain soaked the commuters before they arrived.", "B": "The rain soaked the commuters walking to the station before they arrived.", "C": "Walking to the station, soaked the commuters the rain before they arrived.", "D": "Before they arrived, the rain walking to the station soaked the commuters."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nThe abandoned house <u>stared back at us with hollow, broken eyes</u>.", "options": {"A": "simile", "B": "hyperbole", "C": "oxymoron", "D": "personification"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is the closest meaning of the word <u>colossal</u> as it is used in the second paragraph ('a colossal waste of energy')?", "options": {"A": "slight", "B": "enormous", "C": "unexpected", "D": "deliberate"}, "fig": "", "passage": "<strong>The Case for the Night Sky</strong><br>Good evening. Tonight I want to talk about something most of us have already lost without noticing: the stars. For nearly all of human history, anyone who looked up could see thousands of them. Today, more than eighty per cent of the world's population lives under skies polluted by artificial light, and roughly a third of humanity can no longer see the Milky Way at all. We have, quite literally, switched off the universe.\n\nWe are often told that brighter streets mean safer streets. Yet the evidence is far less reassuring than the slogan suggests. A 2015 review published in the Journal of Epidemiology found no consistent link between increased outdoor lighting and reduced crime. What excessive lighting does reliably produce is glare, which can actually impair a driver's vision, and a colossal waste of energy. The International Dark-Sky Association estimates that poorly directed lighting wastes billions of dollars in electricity every year, releasing millions of tonnes of carbon dioxide for light that simply spills uselessly into the sky.\n\nThe harm reaches our own bodies too. Researchers studying human sleep have shown that exposure to bright artificial light at night suppresses melatonin, the hormone that regulates our internal clock. Disrupted melatonin has been linked in repeated studies to poorer sleep, daytime fatigue, and longer-term health problems. The light we pour into the night, in other words, does not stop at the bedroom curtain; it reaches into the rhythms our bodies have followed for hundreds of thousands of years.\n\nThe damage is not only economic or personal. Migrating birds, guided for millennia by the stars, are drawn off course by city lights and die in their thousands. Newly hatched sea turtles, which instinctively crawl toward the brightest horizon, now stumble inland toward roads instead of the sea.\n\nNone of this requires us to live in darkness. The solution is not less light but smarter light: shielded fixtures that point downward, warmer tones, and timers that dim when streets are empty. Cities such as Tucson have cut light pollution dramatically while keeping their streets perfectly usable.\n\nSo I ask you tonight to look up, while you still can, and to demand that we treat darkness not as an enemy to be banished, but as something worth protecting.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "According to the speech, what did the 2015 review find about outdoor lighting and crime?", "options": {"A": "Brighter lighting clearly reduces crime.", "B": "There was no consistent link between more lighting and less crime.", "C": "Brighter lighting clearly increases crime.", "D": "The review found lighting reduced only night-time crime."}, "fig": "", "passage": "<strong>The Case for the Night Sky</strong><br>Good evening. Tonight I want to talk about something most of us have already lost without noticing: the stars. For nearly all of human history, anyone who looked up could see thousands of them. Today, more than eighty per cent of the world's population lives under skies polluted by artificial light, and roughly a third of humanity can no longer see the Milky Way at all. We have, quite literally, switched off the universe.\n\nWe are often told that brighter streets mean safer streets. Yet the evidence is far less reassuring than the slogan suggests. A 2015 review published in the Journal of Epidemiology found no consistent link between nks it is more persuasive than the evidence supports.", "D": "The speaker has no opinion on the slogan."}, "fig": "", "passage": "<strong>The Case for the Night Sky</strong><br>Good evening. Tonight I want to talk about something most of us have already lost without noticing: the stars. For nearly all of human history, anyone who looked up could see thousands of them. Today, more than eighty per cent of the world's population lives under skies polluted by artificial light, and roughly a third of humanity can no longer see the Milky Way at all. We have, quite literally, switched off the universe.\n\nWe are often told that brighter streets mean safer streets. Yet the evidence is far less reassuring than the slogan suggests. A 2015 review published in the Journal of Epidemiology found no consistent link between increased outdoor lighting and reduced crime. What excessive lighting does reliably produce is glare, which can actually impair a driver's vision, and a colossal waste of energy. The International Dark-Sky Association estimates that poorly directed lighting wastes billions of dollars in electricity every year, releasing millions of tonnes of carbon dioxide for light that simply spills uselessly into the sky.\n\nThe harm reaches our own bodies too. Researchers studying human sleep have shown that exposure to bright artificial light at night suppresses melatonin, the hormone that regulates our internal clock. Disrupted melatonin has been linked in repeated studies to poorer sleep, daytime fatigue, and longer-term health problems. The light we pour into the night, in other words, does not stop at the bedroom curtain; it reaches into the rhythms our bodies have followed for hundreds of thousands of years.\n\nThe damage is not only economic or personal. Migrating birds, guided for millennia by the stars, are drawn off course by city lights and die in their thousands. Newly hatched sea turtles, which instinctively crawl toward the brightest horizon, now stumble inland o the sky.\n\nThe harm reaches our own bodies too. Researchers studying human sleep have shown that exposure to bright artificial light at night suppresses melatonin, the hormone that regulates our internal clock. Disrupted melatonin has been linked in repeated studies to poorer sleep, daytime fatigue, and longer-term health problems. The light we pour into the night, in other words, does not stop at the bedroom curtain; it reaches into the rhythms our bodies have followed for hundreds of thousands of years.\n\nThe damage is not only economic or personal. Migrating birds, guided for millennia by the stars, are drawn off course by city lights and die in their thousands. Newly hatched sea turtles, which instinctively crawl toward the brightest horizon, now stumble inland toward roads instead of the sea.\n\nNone of this requires us to live in darkness. The solution is not less light but smarter light: shielded fixtures that point downward, warmer tones, and timers that dim when streets are empty. Cities such as Tucson have cut light pollution dramatically while keeping their streets perfectly usable.\n\nSo I ask you tonight to look up, while you still can, and to demand that we treat darkness not as an enemy to be banished, but as something worth protecting.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "In the final paragraph, the speaker urges the audience to 'look up, while you still can'. What is the main persuasive effect of this phrase?", "options": {"A": "It creates a sense of urgency, suggesting the chance may soon be lost.", "B": "It provides statistical proof of light pollution.", "C": "It offers a precise scientific definition of darkness.", "D": "It concedes that the problem cannot be solved."}, "fig": "", "passage": "<strong>The Case for the Night Sky</strong><br>Good evening. Tonight I want to talk about something most of us have already lost without noticing: the stars. For nearly all of human history, anyone who looked up could see thousands of them. Today, more than eighty per cent of the world's population lives under skies polluted by artificial light, and roughly a third of humanity can no longer see the Milky Way at all. We have, quite literally, switched off the universe.\n\nWe are often told that brighter streets mean safer streets. Yet the evidence is far less reassuring than the slogan suggests. A 2015 review published in the Journal of Epidemiology found no consistent link between increased outdoor lighting and reduced crime. What excessive lighting does reliably produce is glare, which can actually impair a driver's vision, and a colossal waste of energy. The International Dark-Sky Association estimates that poorly directed lighting wastes billions of dollars in electricity every year, releasing millions of tonnes of carbon dioxide for light that simply spills uselessly into the sky.\n\nThe harm reaches our own bodies too. Researchers studying human sleep have shown that exposure to bright artificial light at night suppresses melatonin, the hormone that regulates our internal clock. Disrupted melatonin has been linked in repeated studies to poorer sleep, daytime fatigue, and longer-term health problems. The light we pour into the night, in other words, does not stop at the bedroom curtain; it reaches into the rhythms our bodies have followed for hundreds of thousands of years.\n\nThe damage is not only economic or personal. Migrating birds, guided for millennia by the stars, are drawn off course by city lights and die in their thousands. Newly hatched sea turtles, which instinctively crawl toward the brightest horizon, now stumble inland toward roads instead of the sea.\n\nNone of this requires us to live in darkness. The solution is not less light but smarter light: shielded fixtures that point downward, warmer tones, and timers that dim when streets are empty. Cities such as Tucson have cut light pollution dramatically while keeping their streets perfectly usable.\n\nSo I ask you tonight to look up, while you still can, and to demand that we treat darkness not as an enemy to be banished, but as something worth protecting.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Stage 5 writing: a drop-down editing cloze (Part 1) followed by a choice of one short paragraph task (Part 2), informative or narrative.", "label": "", "body": "", "hint": "This section has two parts. In Part 1, read the passage and choose the best option for each of the six numbered brackets. In Part 2, choose ONE of the two tasks and write a paragraph of no more than 12 sentences. Plan briefly, then write in clear, well-organised English using accurate grammar, varied vocabulary and correct punctuation.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Edit the passage below. For each numbered bracket, choose the option that makes the writing correct and appropriate.\n\nThe school's new rooftop garden, which opened in March, [1: A) have B) has C) having] already become the most popular spot on campus. Students who once spent break indoors now move [2: A) more eager B) more eagerly C) most eagerly] into the fresh air. Herbs, vegetables and flowers [3: A) is B) are C) was] grown in raised beds, and the harvest is shared with the canteen. \"This is the [4: A) more rewarding B) most rewarding C) rewardingest] project we have ever run,\" the head gardener said. The whole scheme depends [5: A) on B) in C) at] a small group of trained volunteers, [6: A) but B) and C) because] no one else on the staff knows how to tend the raised beds.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences: (1) Explain, step by step, how a newcomer to your city could borrow a book from the public library for the first time, making the instructions clear enough for someone who has never used a library before. (2) Write a short narrative about a character who finds an unexpected letter while clearing out an old desk, and describe how the discovery changes the rest of their day."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you do best?", "options": {"A": "Sports and moving my body", "B": "School subjects like reading or maths", "C": "Art, music or making things", "D": "Helping people and working in a team"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What do you most want to get better at?", "options": {"A": "Staying calm when things go wrong", "B": "Sharing my ideas with the group when I want to", "C": "Finishing my work on time", "D": "Coming up with new ideas"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What makes you happiest at school?", "options": {"A": "Doing well on something hard", "B": "Spending time with my friends", "C": "Making or building something", "D": "Having free time to choose what I do"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "How important is it to you to know what you are good at?", "options": {"A": "Not something I think about much", "B": "A little important", "C": "Quite important", "D": "Very important"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "A sport I have never played", "B": "Speaking on a stage", "C": "A tricky puzzle or brain game", "D": "Building something I have never made"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "When something is really hard, which is most like you?", "options": {"A": "Keep working at it myself", "B": "Ask someone to help me", "C": "Try a different way to do it", "D": "Take a break and come back later"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "How do you usually feel about trying something new in front of other people?", "options": {"A": "Very comfortable", "B": "Quite comfortable", "C": "A little careful at first", "D": "I like to feel ready first"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "Which of these would you like the least?", "options": {"A": "Making a mistake in front of the class", "B": "Trying a food I have never tasted", "C": "Going somewhere new where I know no one yet", "D": "Doing a long task all by myself"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Imagine you are given four things: a ball, a paintbrush, a notebook and a puzzle. What would you most want to do?", "options": {"A": "Make up a new game with the ball", "B": "Paint or draw something of my own", "C": "Write a story in the notebook", "D": "Solve the puzzle and find the pattern"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you solve a problem, what do you like doing most?", "options": {"A": "Thinking of a brand new idea", "B": "Improving an idea someone else had", "C": "Spotting a pattern or clue", "D": "Following clear steps to the answer"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "When you make something, what do you do best?", "options": {"A": "Dreaming up unusual ideas", "B": "Planning how it will all fit together", "C": "Carefully finishing every detail", "D": "Working with others to build it"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "How important is it to you to do things in your own unusual way?", "options": {"A": "Not important", "B": "A little important", "C": "Quite important", "D": "Very important"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "What helps people get along with each other the most?", "options": {"A": "Listening carefully to others" \" stroke=\"#1F3864\" stroke-width=\"2\"/><ellipse cx=\"100\" cy=\"60\" rx=\"64\" ry=\"20\" fill=\"#DCE6F6\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"100\" y1=\"60\" x2=\"164\" y2=\"60\" stroke=\"#C00\" stroke-width=\"1.5\"/><text x=\"132\" y=\"53\" font-size=\"13\" text-anchor=\"middle\" fill=\"#C00\">r = 5 cm</text><line x1=\"180\" y1=\"60\" x2=\"180\" y2=\"230\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"186\" y=\"145\" font-size=\"13\" fill=\"#333\">h = 12 cm</text></svg>", "passage": "", "qnum": "10"}, {"n": "46", "type": "mcq", "section": "Maths", "stem": "Write as a single fraction in its simplest form: (x + 1)/3 + (x − 2)/4.", "options": {"A": "(2x − 1)/7", "B": "(7x − 2)/7", "C": "(7x − 2)/12", "D": "(7x + 2)/12"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "47", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "In a code, EMERALD is written as VNVIZOW (each letter is replaced by its mirror in the alphabet, A↔Z, B↔Y, and so on). Using the same code, what is the word PLANET written as?", "options": {"A": "KOZNVG", "B": "KOZMVG", "C": "KOMZGV", "D": "KOAMVG"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A flight leaves Hong Kong at 22:40 on Tuesday (Hong Kong time) and the journey takes 14 hours 30 minutes. London is 7 hours behind Hong Kong. What is the local arrival time and day in London?", "options": {"A": "06:10 on Wednesday", "B": "13:10 on Wednesday", "C": "20:10 on Wednesday", "D": "06:10 on Tuesday"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Read the four statements below. Three of them are internally consistent and could be true. ONE of them is self-contradictory — it cannot possibly be true. Which statement is the illogical one?", "options": {"A": "The library opens every day except Sunday, so it is closed exactly one day each week.", "B": "Every student in Class 6 passed the test, so no student in Class 6 failed.", "C": "All of the runners finished the marathon, yet three of the runners did not finish.", "D": "The shop stocks only blue and green pens, so it does not stock red pens."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A town council proposes closing the main square to cars every Saturday. Assume each option below is true. Which one is the STRONGEST argument IN FAVOUR of the proposal?", "options": {"A": "Some shopkeepers near the square say they personally dislike the noise that cars make.", "B": "A neighbouring town closed a different street to cars on Mondays several years ago.", "C": "Closing the square would mean the council has to repaint the road markings next year.", "D": "The square has its heaviest pedestrian crowds on Saturdays, so banning cars then would prevent the most accidents."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "All florns are quibs. No quibs are tazzles. Some tazzles are velrs. Treat these statements as completely true. Which conclusion MUST follow?", "options": {"A": "No florns are tazzles.", "B": "Some florns are velrs.", "C": "No velrs are quibs.", "D": "No florns are velrs."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Our city should install 200 more public electric-vehicle charging points this year, because doing so will encourage more residents to switch to electric cars.\"\n\nPROPOSED ASSUMPTION: At least some residents who have not switched to an electric car are held back by a shortage of charging points.\n\nUsing only the information in the statement, is this assumption logical (necessarily taken for granted by the argument)?", "options": {"A": "Yes — the argument's claim that more charging points will encourage switching only makes sense if a lack of charging points is currently one of the reasons some residents have not switched.", "B": "No — the statement is about installing charging points, so it makes no assumption about why residents have or have not switched to electric cars.", "C": "Yes — the statement proves that a shortage of charging points is the single main reason residents avoid electric cars.", "D": "No — residents might switch to electric cars for environmental reasons, so charging points are irrelevant to the decision."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"In a recent survey, every student reported whether or not they felt alert during morning lessons. Every student who reported sleeping at least eight hours per night also reported feeling alert during morning lessons. Some students who slept fewer than eight hours also reported feeling alert.\"\n\nWhich one of the following MUST be true on the basis of the statement alone?", "options": {"A": "Sleeping at least eight hours is the only thing that makes a student feel alert in morning lessons.", "B": "Any student in the survey who reported not feeling alert during morning lessons slept fewer than eight hours.", "C": "Most students who slept fewer than eight hours did not feel alert during morning lessons.", "D": "A student who sleeps nine hours is guaranteed to feel more alert than a student who sleeps eight hours."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Greenfield College offered a place to 800 of its applicants last year. Exactly three-quarters of those who were offered a place chose to enrol. The college had 600 places available and filled every one of them.\"\n\nCONCLUSIONS:\n1. The college offered places to more applicants than it had seats available.\n2. One in four of the applicants offered a place chose not to enrol.\n3. Every applicant who was offered a place chose to enrol.\n\nUsing ONLY the information given, which conclusions FOLLOW?", "options": {"A": "Conclusion 1 only follows.", "B": "Conclusions 2 and 3 follow.", "C": "Conclusions 1 and 2 follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should secondary schools replace all printed textbooks with digital tablets?\"\n\nWhich of the following is the STRONGEST argument, judged only by the quality of its reasoning?", "options": {"A": "Yes — a survey found that students who already prefer tablets tend to get higher grades, which shows that giving everyone tablets will raise grades across the school.", "B": "No — when I tried reading on a tablet I got a headache, so tablets are clearly bad for learning.", "C": "Yes — almost every teenager owns a phone now, so it would be old-fashioned for schools to keep printing books.", "D": "No — in a three-year trial, 60 schools were randomly assigned either tablets or printed texts, and the tablet schools' students scored lower, on average, on standardised reading-comprehension tests."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
