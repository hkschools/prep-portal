<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 5 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "5", VERSION = "1";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence: \"Neither the head prefect nor the junior monitors had finished ___ preparations before the assembly began.\"", "options": {"A": "his", "B": "its", "C": "their", "D": "his or her"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "Choose the option with correct apostrophe use: \"The two ___ proposals were both rejected, although ___ was clearly the more detailed.\"", "options": {"A": "witnesses' / theirs", "B": "witness's / their's", "C": "witnesses's / theirs", "D": "witnesses' / their's"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence: \"By the time the rescue team reached the summit, the storm ___ for nine hours.\"", "options": {"A": "was raging", "B": "has been raging", "C": "is raging", "D": "had been raging"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "You are writing a formal letter requesting permission from a school principal. Which option is the most appropriate completion? \"___ we have permission to hold the fundraiser in the main hall?\"", "options": {"A": "Might", "B": "Can", "C": "May", "D": "Could"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "A journalist wants to describe a politician's spending in the most NEGATIVE light. Which word best fits? \"The minister was criticised for being ___ with public funds.\"", "options": {"A": "thrifty", "B": "profligate", "C": "generous", "D": "economical"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "What is the meaning of the word \"capricious\" as it is used in the sentence below? \"Investors grew wary of the market's capricious swings, which seemed to follow no discernible pattern.\"", "options": {"A": "steady and reliable", "B": "slow and gradual", "C": "unpredictable and changeable", "D": "deliberate and planned"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "What part of speech is the underlined word as it functions in the sentence below? \"The committee's decision to <u>fast-track</u> the proposal surprised everyone.\"", "options": {"A": "noun", "B": "adjective", "C": "adverb", "D": "verb"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below? \"When the new policy was announced, the veteran teachers took it with a pinch of salt.\"", "options": {"A": "regarded it with scepticism", "B": "accepted it with great enthusiasm", "C": "found it deeply offensive", "D": "forgot about it immediately"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "What is the meaning of the word \"unsettle\" as it is used in the sentence: \"Let me begin with a number that should unsettle us\"?", "options": {"A": "physically move from a fixed place", "B": "disturb or trouble the mind", "C": "settle a debt or payment", "D": "make calm and reassured"}, "fig": "", "passage": "<strong>A Speech to the School Council on Food Waste</strong><br>Fellow council members, thank you for hearing me today. I want to talk about something that is thrown away in our canteen every single afternoon, yet almost never discussed: food.<br><br>Let me begin with a number that should unsettle us. According to the United Nations Environment Programme&#x27;s 2021 Food Waste Index Report, the world discards roughly 931 million tonnes of food each year, and households are responsible for about 61 per cent of that total. The Food and Agriculture Organization adds that if food waste were a country, it would be the third-largest emitter of greenhouse gases on the planet, behind only China and the United States. These are not abstract statistics. They describe a daily habit, repeated in kitchens and canteens like ours, that quietly warms the climate while millions go hungry.<br><br>Some will say that one school cannot move a global figure, and they are right that we are small. But consider the contrast between two approaches our council could take. Last term, we ran a simple campaign asking students to take smaller portions and return for seconds if still hungry. In the four weeks it ran, our canteen supplier measured a 28 per cent drop in plate waste. The term before, with no campaign at all, waste had risen steadily week after week. The difference was not a new machine or a large budget; it was attention. A small community that pays attention can bend its own curve, even if it cannot bend the world&#x27;s.<br><br>Critics of action often raise cost. They argue that reducing waste means buying expensive equipment or hiring staff to sort bins. Yet the EAT-Lancet Commission, a body of scientists studying sustainable diets, has repeatedly pointed out that the cheapest tonne of food is the one we never waste in the first place. Prevention costs less than disposal. When we stop over-ordering, we spend less; when we compost what remains, we pay nothing to a landfill. The economic objection, examined honestly, argues for action rather than against it.<br><br>So I am asking this council to do three concrete things. First, make the smaller-portion campaign permanent. Second, install clearly labelled compost bins beside every disposal point. Third, publish our canteen&#x27;s monthly waste figures on the noticeboard, so that what is measured can be improved. None of these requires money we do not have. All of them require the one thing this council was elected to provide: a willingness to lead by example.<br><br>We cannot feed the world from our canteen. But we can stop wasting our own share of it, and in doing so, show a wider community that small, attentive choices add up. I urge you to vote yes. Thank you.", "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "Based on the speaker's comparison of the two terms, which conclusion is best supported?", "options": {"A": "The canteen supplier caused the change in waste levels both terms.", "B": "A focused campaign reduced waste, whereas its absence let waste rise.", "C": "New equipment was the main reason plate waste fell by 28 per cent.", "D": "Waste fell in both terms, but faster when the campaign ran."}, "fig": "", "passage": "<strong>A Speech to the School Council on Food Waste</strong><br>Fellow council members, thank you for hearing me today. I want to talk about something that is thrown away in our canteen every single afternoon, yet almost never discussed: food.<br><br>Let me begin with a number that should unsettle us. According to the United Nations Environment Programme&#x27;s 2021 Food Waste Index Report, the world discards roughly 931 million tonnes of food each year, and households are responsible for about 61 per cent of that total. The Food and Agriculture Organization adds that if food waste were a country, it would be the third-largest emitter of greenhouse gases on the planet, behind only China and the United States. These are not abstract statistics. They describe a daily habit, repeated in kitchens and canteens like ours, that quietly warms the climate while millions go hungry.<br><br>Some will say that one school cannot move a global figure, and they are right that we are small. But consider the contrast between two approaches our council could take. Last term, we ran a simple campaign asking students to take smaller portions and return for seconds if still hungry. In the four weeks it ran, our canteen supplier measured a 28 per cent drop in plate waste. The term before, with no campaign at all, waste had risen steadily week after week. The difference was not a new machine or a large budget; it was attention. A small community that pays attention can bend its own curve, even if it cannot bend the world&#x27;s.<br><br>Critics of action often raise cost. They argue that reducing waste means buying expensive equipment or hiring staff to sort bins. Yet the EAT-Lancet Commission, a body of scientists studying sustainable diets, has repeatedly pointed out that the cheapest tonne of food is the one we never waste in the first place. Prevention costs less than disposal. When we stop over-ordering, we spend less; when we compost what remains, we pay nothing to a landfill. The economic objection, examined honestly, argues for action rather than against it.<br><br>So I am asking this council to do three concrete things. First, make the smaller-portion campaign permanent. Second, install clearly labelled compost bins beside every disposal point. Third, publish our canteen&#x27;s monthly waste figures on the noticeboard, so that what is measured can be improved. None of these requires money we do not have. All of them require the one thing this council was elected to provide: a willingness to lead by example.<br><br>We cannot feed the world from our canteen. But we can stop wasting our own share of it, and in doing so, show a wider community that small, attentive choices add up. I urge you to vote yes. Thank you.", "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Which of the following statements is TRUE according to the speech?", "options": {"A": "Households account for the majority of global food waste.", "B": "Food waste is the single largest source of greenhouse gases worldwide.", "C": "Reducing waste requires expensive new equipment.", "D": "The school's campaign ran for an entire term without effect."}, "fig": "", "passage": "<strong>A Speech to the School Council on Food Waste</strong><br>Fellow council members, thank you for hearing me today. I want to talk about something that is thrown away in our canteen every single afternoon, yet almost never discussed: food.<br><br>Let me begin with a number that should unsettle us. According to the United Nations Environment Programme&#x27;s 2021 Food Waste Index Report, the world discards roughly 931 million tonnes of food each year, and households are responsible for about 61 per cent of that total. The Food and Agriculture Organization adds that if food waste were a country, it would be the third-largest emitter of greenhouse gases on the planet, behind only China and the United States. These are not abstract statistics. They describe a daily habit, repeated in kitchens and canteens like ours, that quietly warms the climate while millions go hungry.<br><br>Some will say that one school cannot move a global figure, and they are right that we are small. But consider the contrast between two approaches our council could take. Last term, we ran a simple campaign asking students to take smaller portions and return for seconds if still hungry. In the four weeks it ran, our canteen supplier measured a 28 per cent drop in plate waste. The term before, with no campaign at all, waste had risen steadily week after week. The difference was not a new machine or a large budget; it was attention. A small community that pays attention can bend its own curve, even if it cannot bend the world&#x27;s.<br><br>Critics of action often raise cost. They argue that reducing waste means buying expensive equipment or hiring staff to sort bins. Yet the EAT-Lancet Commission, a body of scientists studying sustainable diets, has repeatedly pointed out that the cheapest tonne of food is the one we never waste in the first place. Prevention costs less than disposal. When we stop over-ordering, we spend less; when we compost what remains, we pay nothing to a landfill. The economic objection, examined honestly, argues for action rather than against it.<br><br>So I am asking this council to do three concrete things. First, make the smaller-portion campaign permanent. Second, install clearly labelled compost bins beside every disposal point. Third, publish our canteen&#x27;s monthly waste figures on the noticeboard, so that what is measured can be improved. None of these requires money we do not have. All of them require the one thing this council was elected to provide: a willingness to lead by example.<br><br>We cannot feed the world from our canteen. But we can stop wasting our own share of it, and in doing so, show a wider community that small, attentive choices add up. I urge you to vote yes. Thank you.", "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "Which statement best expresses the central argument of the speech?", "options": {"A": "Global food-waste statistics are too large for any individual to influence.", "B": "The canteen should be closed until a composting machine is bought.", "C": "Small, attentive choices by a community can meaningfully cut food waste.", "D": "Climate change can be solved entirely by reducing school food waste."}, "fig": "", "passage": "<strong>A Speech to the School Council on Food Waste</strong><br>Fellow council members, thank you for hearing me today. I want to talk about something that is thrown away in our canteen every single afternoon, yet almost never discussed: food.<br><br>Let me begin with a number that should unsettle us. According to the United Nations Environment Programme&#x27;s 2021 Food Waste Index Report, the world discards roughly 931 million tonnes of food each year, and households are responsible for about 61 per cent of that total. The Food and Agriculture Organization adds that if food waste were a country, it would be the third-largest emitter of greenhouse gases on the planet, behind only China and the United States. These are not abstract statistics. They describe a daily habit, repeated in kitchens and canteens like ours, that quietly warms the climate while millions go hungry.<br><br>Some will say that one school cannot move a global figure, and they are right that we are small. But consider the contrast between two approaches our council could take. Last term, we ran a simple campaign asking students to take smaller portions and return for seconds if still hungry. In the four weeks it ran, our canteen supplier measured a 28 per cent drop in plate waste. The term before, with no campaign at all, waste had risen steadily week after week. The difference was not a new machine or a large budget; it was attention. A small community that pays attention can bend its own curve, even if it cannot bend the world&#x27;s.<br><br>Critics of action often raise cost. They argue that reducing waste means buying expensive equipment or hiring staff to sort bins. Yet the EAT-Lancet Commission, a body of scientists studying sustainable diets, has repeatedly pointed out that the cheapest tonne of food is the one we never waste in the first place. Prevention costs less than disposal. When we stop over-ordering, we spend less; when we compost what remains, we pay nothing to a landfill. The economic objection, examined honestly, argues for action rather than against it.<br><br>So I am asking this council to do three concrete things. First, make the smaller-portion campaign permanent. Second, install clearly labelled compost bins beside every disposal point. Third, publish our canteen&#x27;s monthly waste figures on the noticeboard, so that what is measured can be improved. None of these requires money we do not have. All of them require the one thing this council was elected to provide: a willingness to lead by example.<br><br>We cannot feed the world from our canteen. But we can stop wasting our own share of it, and in doing so, show a wider community that small, attentive choices add up. I urge you to vote yes. Thank you.", "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Which body does the speaker cite for the claim that prevention is cheaper than disposal?", "options": {"A": "The United Nations Environment Programme", "B": "The Food and Agriculture Organization", "C": "The canteen supplier", "D": "The EAT-Lancet Commission"}, "fig": "", "passage": "<strong>A Speech to the School Council on Food Waste</strong><br>Fellow council members, thank you for hearing me today. I want to talk about something that is thrown away in our canteen every single afternoon, yet almost never discussed: food.<br><br>Let me begin with a number that should unsettle us. According to the United Nations Environment Programme&#x27;s 2021 Food Waste Index Report, the world discards roughly 931 million tonnes of food each year, and households are responsible for about 61 per cent of that total. The Food and Agriculture Organization adds that if food waste were a country, it would be the third-largest emitter of greenhouse gases on the planet, behind only China and the United States. These are not abstract statistics. They describe a daily habit, repeated in kitchens and canteens like ours, that quietly warms the climate while millions go hungry.<br><br>Some will say that one school cannot move a global figure, and they are right that we are small. But consider the contrast between two approaches our council could take. Last term, we ran a simple campaign asking students to take smaller portions and return for seconds if still hungry. In the four weeks it ran, our canteen supplier measured a 28 per cent drop in plate waste. The term before, with no campaign at all, waste had risen steadily week after week. The difference was not a new machine or a large budget; it was attention. A small community that pays attention can bend its own curve, even if it cannot bend the world&#x27;s.<br><br>Critics of action often raise cost. They argue that reducing waste means buying expensive equipment or hiring staff to sort bins. Yet the EAT-Lancet Commission, a body of scientists studying sustainable diets, has repeatedly pointed out that the cheapest tonne of food is the one we never waste in the first place. Prevention costs less than disposal. When we stop over-ordering, we spend less; when we compost what remains, we pay nothing to a landfill. The economic objection, examined honestly, argues for action rather than against it.<br><br>So I am asking this council to do three concrete things. First, make the smaller-portion campaign permanent. Second, install clearly labelled compost bins beside every disposal point. Third, publish our canteen&#x27;s monthly waste figures on the noticeboard, so that what is measured can be improved. None of these requires money we do not have. All of them require the one thing this council was elected to provide: a willingness to lead by example.<br><br>We cannot feed the world from our canteen. But we can stop wasting our own share of it, and in doing so, show a wider community that small, attentive choices add up. I urge you to vote yes. Thank you.", "qnum": 13}, {"n": 15, "type": "writing", "section": "English Writing", "intro": "This section has two parts. Part A checks your editing and proofreading; Part B asks you to write one short paragraph.", "label": "", "body": "PART A: Editing: The paragraph below contains five deliberate errors (in spelling, punctuation, grammar, or word choice). Rewrite the paragraph correctly, fixing all five errors. \"Last Saturday our class visited the science museum, it was the first trip we had taken all year. The exhibits was fascinating, and many of us had never scene a real fossil before. My friend and me spent nearly an hour at the space display. By the time we left, everyone agreed that the visit were worthwhile.\"\n\nPART B: Paragraph: Choose ONE of the two tasks below and write a single paragraph of no more than 12 sentences.\n(1) INFORMATIVE: Explain to a new Stage 5 student how your school recycles or reduces waste, and why these habits matter.\n(2) ARGUMENTATIVE: Argue for or against the statement: \"Students, not staff, should be responsible for keeping the canteen clean.\"", "hint": "For Part A, copy out the corrected paragraph in full with all five errors fixed. For Part B, write at least 8 and no more than 12 sentences on ONE chosen task. State your purpose clearly, support it with reasons or detail, and use precise, well-organised language. Make clear at the top of Part B whether you chose the informative (1) or argumentative (2) task.", "placeholder": "Type your response here…", "partA": "Editing: The paragraph below contains five deliberate errors (in spelling, punctuation, grammar, or word choice). Rewrite the paragraph correctly, fixing all five errors. \"Last Saturday our class visited the science museum, it was the first trip we had taken all year. The exhibits was fascinating, and many of us had never scene a real fossil before. My friend and me spent nearly an hour at the space display. By the time we left, everyone agreed that the visit were worthwhile.\"", "partB": "Paragraph: Choose ONE of the two tasks below and write a single paragraph of no more than 12 sentences.\n(1) INFORMATIVE: Explain to a new Stage 5 student how your school recycles or reduces waste, and why these habits matter.\n(2) ARGUMENTATIVE: Argue for or against the statement: \"Students, not staff, should be responsible for keeping the canteen clean.\""}, {"n": 16, "type": "info", "title": "Listening &amp; Interview", "body": "<div class='info-body'>In the real test this section is delivered live: you listen to short clips and answer interview-style questions on camera. There is nothing to type or record here, the sample questions below show what to expect, so you can practise your answers out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Tell us about yourself and what you hope to gain from this school.</li><li style='margin:7px 0'>Describe a goal you set for yourself and how you worked towards it.</li><li style='margin:7px 0'>Talk about a current issue you feel strongly about and explain your reasoning.</li><li style='margin:7px 0'>Describe a time you worked in a team, what was your role and what did you learn?</li><li style='margin:7px 0'>Listen to a short talk, then answer questions on its main idea and supporting details.</li></ul>"}, {"n": 17, "type": "info", "title": "Character", "body": "There are no right or wrong answers in this test. Every choice you made simply mirrors a little of who you are, what you enjoy and how you like to do things. All of the qualities it shows are strengths and leanings, never better or worse than each other."}, {"n": 18, "type": "selfeval", "section": "Character", "stem": "What do you think you do best?", "options": {"A": "Playing a sport or moving my body", "B": "Doing school work and learning new things", "C": "Making art, music or stories", "D": "Helping friends and working with others"}, "fig": "", "passage": null, "cnum": 1}, {"n": 19, "type": "selfeval", "section": "Character", "stem": "What would you most like to do better?", "options": {"A": "Stay calm when I feel upset", "B": "Finish my work without getting distracted", "C": "Speak up and share my ideas", "D": "Be braver about trying hard things"}, "fig": "", "passage": null, "cnum": 2}, {"n": 20, "type": "selfeval", "section": "Character", "stem": "When you finish a piece of work, what do you notice the most?", "options": {"A": "How proud I feel of it", "B": "The parts I could make better", "C": "What my teacher or friends think", "D": "That it is done and I can move on"}, "fig": "", "passage": null, "cnum": 3}, {"n": 21, "type": "selfeval", "section": "Character", "stem": "How important is it to you to understand WHY you feel happy or upset?", "options": {"A": "Not important", "B": "A little important", "C": "Quite important", "D": "Very important"}, "fig": "", "passage": null, "cnum": 4}, {"n": 22, "type": "selfeval", "section": "Character", "stem": "When do you feel most like yourself?", "options": {"A": "When I am busy and getting things done", "B": "When I am quietly thinking or imagining", "C": "When I am out with people I like", "D": "When I am free to do my own thing"}, "fig": "", "passage": null, "cnum": 5}, {"n": 23, "type": "selfeval", "section": "Character", "stem": "Which feeling do you find the hardest to notice in yourself?", "options": {"A": "When I am tired or need a break", "B": "When I am worried about something", "C": "When I am frustrated or annoyed", "D": "When I am sad or a bit down"}, "fig": "", "passage": null, "cnum": 6}, {"n": 24, "type": "selfeval", "section": "Character", "stem": "How well do you think your friends would describe what you are good at?", "options": {"A": "They would describe it just like I would", "B": "They would mostly agree with me", "C": "They would notice different things than I do", "D": "I am still curious to find out what they would say"}, "fig": "", "passage": null, "cnum": 7}, {"n": 25, "type": "selfeval", "section": "Character", "stem": "If you were given some free time this week, which would you most want to do?", "options": {"A": "A sport or game I have never played", "B": "A harder puzzle or challenge problem", "C": "Performing or sharing my work in front of others", "D": "Getting even better at something I already love"}, "fig": "", "passage": null, "cnum": 8}, {"n": 26, "type": "selfeval", "section": "Character", "stem": "When something turns out to be really hard, what do you do most?", "options": {"A": "Keep trying until I get it", "B": "Try a different way", "C": "Ask someone to help me", "D": "Take a break and come back later"}, "fig": "", "passage": null, "cnum": 9}, {"n": 27, "type": "selfeval", "section": "Character", "stem": "When you try something for the very first time, how comfortable do you feel?", "options": {"A": "Very comfortable", "B": "Mostly comfortable", "C": "A little unsure", "D": "Quite unsure"}, "fig": "", "passage": null, "cnum": 10}, {"n": 28, "type": "selfeva chor=\"end\" font-family=\"Arial\">8</text><rect x=\"55.4\" y=\"97.5\" width=\"46.2\" height=\"112.5\" fill=\"#4a6fa5\" stroke=\"#27406b\"/><text x=\"78.5\" y=\"226\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Arial\">2</text><rect x=\"132.4\" y=\"30.0\" width=\"46.2\" height=\"180.0\" fill=\"#4a6fa5\" stroke=\"#27406b\"/><text x=\"155.5\" y=\"226\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Arial\">3</text><rect x=\"209.4\" y=\"120.0\" width=\"46.2\" height=\"90.0\" fill=\"#4a6fa5\" stroke=\"#27406b\"/><text x=\"232.5\" y=\"226\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Arial\">4</text><rect x=\"286.4\" y=\"142.5\" width=\"46.2\" height=\"67.5\" fill=\"#4a6fa5\" stroke=\"#27406b\"/><text x=\"309.5\" y=\"226\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Arial\">5</text><text x=\"12\" y=\"120.0\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Arial\" transform=\"rotate(-90 12 120.0)\">Number of pupils</text></svg>", "passage": null, "qnum": 23}, {"n": 57, "type": "mcq", "section": "Maths", "stem": "A sphere has radius 6 cm. Find its volume (take π = 3.14159). Give your answer to 2 d.p.", "options": {"A": "904.78 cm³", "B": "452.39 cm³", "C": "678.58 cm³", "D": "150.80 cm³"}, "fig": "<svg viewBox=\"0 0 230 200\" width=\"230\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"230\" height=\"200\" fill=\"#ffffff\"/><circle cx=\"110\" cy=\"100\" r=\"58\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><ellipse cx=\"110\" cy=\"100\" rx=\"58\" ry=\"17\" fill=\"none\" stroke=\"#27406b\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><text x=\"8\" y=\"190\" font-size=\"12\">r = 6 cm</text></svg>", "passage": null, "qnum": 24}, {"n": 58, "type": "info", "title": "Global Knowledge &amp; Logic", "body": "Logic and critical-thinking questions."}, {"n": 59, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The vowels (a, e, i, o, u) have been removed from a sentence, leaving only the consonants and the gaps between words: 'Th brght stdnt slvd th prblm qckly'. Reading the consonant skeleton, which is the original sentence?", "options": {"A": "The bought student saved the problem quickly.", "B": "Though bright students solve the problems quick.", "C": "The bright student solved the problem quickly.", "D": "The brought student slaved at the problem quickly."}, "fig": "", "passage": null, "qnum": 25}, {"n": 60, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Read these statements as a pure logic puzzle, ignoring what the invented words might mean in real life: 'All thrums are glints. No glints are vesks. Some vesks are prouns.'\nWhich conclusion MUST be true?", "options": {"A": "Some prouns are thrums.", "B": "No thrums are vesks.", "C": "All glints are thrums.", "D": "No prouns are thrums."}, "fig": "", "passage": null, "qnum": 26}, {"n": 61, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A flight leaves Hong Kong at 22:40 on Monday (Hong Kong time) and the journey takes 14 hours 25 minutes. The destination city is 11 hours behind Hong Kong. What is the local arrival time and day at the destination?", "options": {"A": "02:05 on Tuesday", "B": "13:05 on Tuesday", "C": "00:05 on Tuesday", "D": "01:40 on Tuesday"}, "fig": "", "passage": null, "qnum": 27}, {"n": 62, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Treat these as the only facts you know: 'Every student who passes the final exam receives a certificate. Some students who receive a certificate are awarded a scholarship. No student who fails the final exam is awarded a scholarship.' Every student either passes or fails.\nWhich conclusion does NOT necessarily follow?", "options": {"A": "Some certificate holders are scholarship winners.", "B": "Every scholarship winner passed the final exam.", "C": "Any student who passed the exam holds a certificate.", "D": "Every student who receives a certificate is awarded a scholarship."}, "fig": "", "passage": null, "qnum": 28}, {"n": 63, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Exactly one of the following statements is logically impossible, that is, it cannot be true no matter the circumstances. Which one?", "options": {"A": "Most members of the team are right-handed, but a few are left-handed.", "B": "The committee has nine members, and exactly half of them voted in favour.", "C": "The race was won by the runner who had started in last place.", "D": "Every shop on the street was closed except for the bakery."}, "fig": "", "passage": null, "qnum": 29}, {"n": 64, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Our city should build more cycle lanes, because if we make cycling safer, far more residents will choose to commute by bike instead of by car.\"\n\nPROPOSED ASSUMPTION: A significant number of residents currently avoid cycling to work mainly because they feel it is unsafe.\n\nUsing the information in the statement, is this assumption logical?", "options": {"A": "Yes, the statement's reasoning only works if safety is a real reason residents are not already cycling, so it must be taking that for granted.", "B": "Yes, the statement proves that cycling is the fastest way to commute in the city.", "C": "No, the statement is about cycle lanes, so it makes no assumption about why residents currently drive.", "D": "No, the statement already concludes that more residents will commute by bike, so it does not need to assume anything further."}, "fig": "", "passage": null, "qnum": 30}, {"n": 65, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every student who scored above 80% on the mock exam was offered a place in the advanced class. Mei scored 76% on the mock exam.\"\n\nWhich of the following MUST be true based only on this information?", "options": {"A": "Mei was not offered a place in the advanced class.", "B": "The information does not by itself guarantee that Mei was offered a place in the advanced class.", "C": "Only students who scored above 80% were offered a place in the advanced class.", "D": "Mei must have been offered a place, because the advanced class is open to anyone who sat the mock exam."}, "fig": "", "passage": null, "qnum": 31}, {"n": 66, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"In a survey of 600 commuters, 70% said they would use a new express bus route if it cut their journey time by at least 15 minutes. The proposed route is projected to cut journey time by 10 minutes.\"\n\nConclusions:\n1. A majority of the commuters surveyed said they would use the new route if it saved them at least 15 minutes.\n2. The proposed route will definitely be used by 70% of all commuters in the city.\n\nWhich option correctly states whether each conclusion follows, using only the information given?", "options": {"A": "Both Conclusion 1 and Conclusion 2 follow.", "B": "Conclusion 2 follows, but Conclusion 1 does not.", "C": "Conclusion 1 follows, but Conclusion 2 does not.", "D": "Neither Conclusion 1 nor Conclusion 2 follows."}, "fig": "", "passage": null, "qnum": 32}, {"n": 67, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: Should secondary schools replace printed textbooks entirely with digital tablets?\n\nWhich of the four arguments below is the STRONGEST?", "options": {"A": "No, when my older brother's school switched to tablets, he hated reading on a screen, so clearly tablets are worse for everyone.", "B": "Yes, tablets let schools update content more easily than reprinting textbooks each year.", "C": "Yes, printed textbooks are heavy to carry, so getting rid of them is obviously the right thing to do.", "D": "No, a three-year study of 40 schools found that students reading long texts on tablets retained on average 12% less information than those using print, and showed higher eye-strain let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
