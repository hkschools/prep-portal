<head>

<title>IDAT HKIS: Stage 5 (V5)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "5", VERSION = "5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "The Latin root <u>voc-</u> (also written <u>vok-</u>) means 'call' or 'voice'. Which word below most closely means 'to cancel or withdraw something that was granted earlier'?", "options": {"A": "provoke", "B": "advocate", "C": "revoke", "D": "vocation"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\nThe northern campus has its own science laboratories, ______ the southern campus shares its facilities with a neighbouring college.", "options": {"A": "whereas", "B": "because", "C": "so that", "D": "unlike"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nThe minister announced a review and a new helpline, but campaigners said the measures merely <u>papered over the cracks</u>.", "options": {"A": "delayed the decision until after the next election", "B": "hid a serious problem instead of repairing it", "C": "made an existing problem noticeably worse", "D": "explained a complicated problem in simple terms"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\nThe research team, ______ findings were published only last month, has already been invited to advise the government.", "options": {"A": "which", "B": "that", "C": "who's", "D": "whose"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "In the sentence below, which underlined word is used as a NOUN?\n\nThe <u>training</u> of new volunteers was <u>demanding</u>, but the coordinator was <u>smiling</u> as she <u>rewrote</u> the timetable.", "options": {"A": "demanding", "B": "training", "C": "smiling", "D": "rewrote"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\nBy the end of next March, the harbour tunnel ______ open for exactly ten years.", "options": {"A": "will be", "B": "has been", "C": "will have been", "D": "would have been"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Which literary device is used in the underlined phrase?\n\nBy the third week of revision, Danny had read <u>every book ever written about the French Revolution</u>.", "options": {"A": "metaphor", "B": "hyperbole", "C": "verbal irony", "D": "understatement"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\n______ the proposal at last Thursday's meeting, but it also refused to consider a revised version.", "options": {"A": "Not only the committee rejected", "B": "Not only has the committee rejected", "C": "Not only was the committee rejecting", "D": "Not only did the committee reject"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Read this sentence: The chairman answered our questions with a <u>reserve</u> that his colleagues found unsettling.\n\nIn which sentence below does <u>reserve</u> carry the same meaning?", "options": {"A": "Even among old friends, she spoke about her illness with noticeable <u>reserve</u>.", "B": "The club keeps a <u>reserve</u> of spare kit in the equipment room.", "C": "Please <u>reserve</u> a table for six on Friday evening.", "D": "The injured striker was replaced by a <u>reserve</u> from the bench."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "One of the four labelled sections contains an error. Choose the labelled section that must be changed.\n\nThe induction programme is designed (A) to introduce new staff to the building, (B) to explain the safety procedures (C) and giving them a chance to meet their mentors (D) before term begins.", "options": {"A": "to introduce new staff to the building", "B": "to explain the safety procedures", "C": "and giving them a chance to meet their mentors", "D": "before term begins"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>scour</u> as it is used in the second paragraph ('the current would <u>scour</u> the lining')?", "options": {"A": "search through it thoroughly", "B": "wear it away by rubbing", "C": "scrub it until it is clean", "D": "overflow it and flood the banks"}, "fig": "", "passage": "<strong>The Aqueduct That Barely Falls</strong><br>When Roman engineers were asked to bring fresh water to Nemausus, the town we now call Nîmes in southern France, they faced a problem of arithmetic as much as of stone. The spring they chose, near Uzès, lay only about twenty kilometres away in a straight line, but a ridge of limestone hills stood in the way. Rather than tunnel through the ridge, the surveyors curved their channel north and then west, stretching it to nearly fifty kilometres.\n\nThat detour created a second difficulty. Water in an open channel moves only because the channel tilts, and the spring stood barely twelve metres above the storage tanks waiting in the town. Spread over fifty kilometres, that is a fall of roughly one centimetre for every forty metres travelled, a slope no eye can see and no careless workman can hold. Tilt the channel a little too steeply and the current would scour the lining; tilt it too gently and the water would slow, settle and stagnate.\n\nTo hold so fine a line, the surveyors relied on the chorobates: a heavy wooden bench with a water-filled groove cut along the top. When the water in the groove sat perfectly still, the bench was level, and the next stretch of channel could be pegged out against it, dropping by a measured fraction. Where the ground fell away, the channel was carried on arches, the most famous of which, the bridge over the river Gardon, rises in three tiers to nearly fifty metres.\n\nAt the end of its journey the water arrived at a round stone basin, the castellum, from which ten lead pipes led away into the streets. The public fountains were served first and were never shut off; the baths took the next share; private houses, whose owners paid for the privilege, drew whatever remained. Because the fountains ran day and night, any fall in the supply was felt in the wealthiest houses long before it was felt in the street, and the complaints of those householders are among the few surviving records of the system's decline.\n\nThe aqueduct also kept its own accounts. The water of the region is rich in dissolved lime, and a thin crust of it hardened onto the channel walls, layer upon layer. By the time the system was abandoned, centuries later, that crust was as thick as a man's arm, and the channel it lined had been narrowed until it could carry only a fraction of its original flow. Archaeologists have counted the layers much as a forester counts the rings of a tree, and from that count they estimate that water flowed along the channel for about five hundred years.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "The passage says the channel fell 'roughly one centimetre for every forty metres travelled'. What does this figure show about the surveyors' task?", "options": {"A": "They had to control a slope too slight for the eye to judge, so every measurement had to be exact.", "B": "The channel fell about one metre for every kilometre it travelled.", "C": "The longer route was chosen because it gave the water a gentler, safer slope.", "D": "The lie of the land already provided the right fall, so little measuring was needed."}, "fig": "", "passage": "<strong>The Aqueduct That Barely Falls</strong><br>When Roman engineers were asked to bring fresh water to Nemausus, the town we now call Nîmes in southern France, they faced a problem of arithmetic as much as of stone. The spring they chose, near Uzès, lay only about twenty kilometres away in a straight line, but a ridge of limestone hills stood in the way. Rather than tunnel through the ridge, the surveyors curved their channel north and then west, stretching it to nearly fifty kilometres.\n\nThat detour created a second difficulty. Water in an open channel moves only because the channel tilts, and the spring stood barely twelve metres above the storage tanks waiting in the town. Spread over fifty kilometres, that is a fall of roughly one centimetre for every forty metres travelled, a slope no eye can see and no careless workman can hold. Tilt the channel a little too steeply and the current would scour the lining; tilt it too gently and the water would slow, settle and stagnate.\n\nTo hold so fine a line, the surveyors relied on the chorobates: a heavy wooden bench with a water-filled groove cut along the top. When the water in the groove sat perfectly still, the bench was level, and the next stretch of channel could be pegged out against it, dropping by a measured fraction. Where the ground fell away, the channel was carried on arches, the most famous of which, the bridge over the river Gardon, rises in three tiers to nearly fifty metres.\n\nAt the end of its journey the water arrived at a round stone basin, the castellum, from which ten lead pipes led away into the streets. The public fountains were served first and were never shut off; the baths took the next share; private houses, whose owners paid for the privilege, drew whatever remained. Because the fountains ran day and night, any fall in the supply was felt in the wealthiest houses long before it was felt in the street, and the complaints of those householders are among the few surviving records of the system's decline.\n\nThe aqueduct also kept its own accounts. The water of the region is rich in dissolved lime, and a thin crust of it hardened onto the channel walls, layer upon layer. By the time the system was abandoned, centuries later, that crust was as thick as a man's arm, and the channel it lined had been narrowed until it could carry only a fraction of its original flow. Archaeologists have counted the layers much as a forester counts the rings of a tree, and from that count they estimate that water flowed along the channel for about five hundred years.", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "What must be true if the layers of lime are to show how long the aqueduct was in use?", "options": {"A": "The channel must have been cleaned out regularly while it was in use.", "B": "The water must have carried less lime in later centuries than in earlier ones.", "C": "The aqueduct must have been repaired at least once in every century.", "D": "The lime must have been laid down at a fairly steady rate, year after year."}, "fig": "", "passage": "<strong>The Aqueduct That Barely Falls</strong><br>When Roman engineers were asked to bring fresh water to Nemausus, the town we now call Nîmes in southern France, they faced a problem of arithmetic as much as of stone. The spring they chose, near Uzès, lay only about twenty kilometres away in a straight line, but a ridge of limestone hills stood in the way. Rather than tunnel through the ridge, the surveyors curved their channel north and then west, stretching it to nearly fifty kilometres.\n\nThat detour created a second difficulty. Water in an open channel moves only because the channel tilts, and the spring stood barely twelve metres above the storage tanks waiting in the town. Spread over fifty kilometres, that is a fall of roughly one centimetre for every forty metres travelled, a slope no eye can see and no careless workman can hold. Tilt the channel a little too steeply and the current would scour the lining; tilt it too gently and the water would slow, settle and stagnate.\n\nTo hold so fine a line, the surveyors relied on the chorobates: a heavy wooden bench with a water-filled groove cut along the top. When the water in the groove sat perfectly still, the bench was level, and the next stretch of channel could be pegged out against it, dropping by a measured fraction. Where the ground fell away, the channel was carried on arches, the most famous of which, the bridge over the river Gardon, rises in three tiers to nearly fifty metres.\n\nAt the end of its journey the water arrived at a round stone basin, the castellum, from which ten lead pipes led away into the streets. The public fountains were served first and were never shut off; the baths took the next share; private houses, whose owners paid for the privilege, drew whatever remained. Because the fountains ran day and night, any fall in the supply was felt in the wealthiest houses long before it was felt in the street, and the complaints of those householders are among the few surviving records of the system's decline.\n\nThe aqueduct also kept its own accounts. The water of the region is rich in dissolved lime, and a thin crust of it hardened onto the channel walls, layer upon layer. By the time the system was abandoned, centuries later, that crust was as thick as a man's arm, and the channel it lined had been narrowed until it could carry only a fraction of its original flow. Archaeologists have counted the layers much as a forester counts the rings of a tree, and from that count they estimate that water flowed along the channel for about five hundred years.", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "Which of these does the passage state as a fact?", "options": {"A": "The channel was pegged out against the chorobates only where the ground was flat.", "B": "The bridge over the Gardon is the only part of the aqueduct built on arches.", "C": "The chorobates used standing water to show when its bench was level.", "D": "The lime crust formed fastest in the sections carried on arches."}, "fig": "", "passage": "<strong>The Aqueduct That Barely Falls</strong><br>When Roman engineers were asked to bring fresh water to Nemausus, the town we now call Nîmes in southern France, they faced a problem of arithmetic as much as of stone. The spring they chose, near Uzès, lay only about twenty kilometres away in a straight line, but a ridge of limestone hills stood in the way. Rather than tunnel through the ridge, the surveyors curved their channel north and then west, stretching it to nearly fifty kilometres.\n\nThat detour created a second difficulty. Water in an open channel moves only because the channel tilts, and the spring stood barely twelve metres above the storage tanks waiting in the town. Spread over fifty kilometres, that is a fall of roughly one centimetre for every forty metres travelled, a slope no eye can see and no careless workman can hold. Tilt the channel a little too steeply and the current would scour the lining; tilt it too gently and the water would slow, settle and stagnate.\n\nTo hold so fine a line, the surveyors relied on the chorobates: a heavy wooden bench with a water-filled groove cut along the top. When the water in the groove sat perfectly still, the bench was level, and the next stretch of channel could be pegged out against it, dropping by a measured fraction. Where the ground fell away, the channel was carried on arches, the most famous of which, the bridge over the river Gardon, rises in three tiers to nearly fifty metres.\n\nAt the end of its journey the water arrived at a round stone basin, the castellum, from which ten lead pipes led away into the streets. The public fountains were served first and were never shut off; the baths took the next share; private houses, whose owners paid for the privilege, drew whatever remained. Because the fountains ran day and night, any fall in the supply was felt in the wealthiest houses long before it was felt in the street, and the complaints of those householders are among the few surviving records of the system's decline.\n\nThe aqueduct also kept its own accounts. The water of the region is rich in dissolved lime, and a thin crust of it hardened onto the channel walls, layer upon layer. By the time the system was abandoned, centuries later, that crust was as thick as a man's arm, and the channel it lined had been narrowed until it could carry only a fraction of its original flow. Archaeologists have counted the layers much as a forester counts the rings of a tree, and from that count they estimate that water flowed along the channel for about five hundred years.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which statement best expresses the main point the writer makes about the aqueduct at Nemausus?", "options": {"A": "Its success rested on holding an extremely small, precisely controlled fall along a deliberately lengthened route.", "B": "Its most remarkable feature was the height and beauty of the bridge over the river Gardon.", "C": "It failed in the end because the Romans had chosen a spring that lay too far from the town.", "D": "It shows that Roman engineers preferred simple tools to careful calculation."}, "fig": "", "passage": "<strong>The Aqueduct That Barely Falls</strong><br>When Roman engineers were asked to bring fresh water to Nemausus, the town we now call Nîmes in southern France, they faced a problem of arithmetic as much as of stone. The spring they chose, near Uzès, lay only about twenty kilometres away in a straight line, but a ridge of limestone hills stood in the way. Rather than tunnel through the ridge, the surveyors curved their channel north and then west, stretching it to nearly fifty kilometres.\n\nThat detour created a second difficulty. Water in an open channel moves only because the channel tilts, and the spring stood barely twelve metres above the storage tanks waiting in the town. Spread over fifty kilometres, that is a fall of roughly one centimetre for every forty metres travelled, a slope no eye can see and no careless workman can hold. Tilt the channel a little too steeply and the current would scour the lining; tilt it too gently and the water would slow, settle and stagnate.\n\nTo hold so fine a line, the surveyors relied on the chorobates: a heavy wooden bench with a water-filled groove cut along the top. When the water in the groove sat perfectly still, the bench was level, and the next stretch of channel could be pegged out against it, dropping by a measured fraction. Where the ground fell away, the channel was carried on arches, the most famous of which, the bridge over the river Gardon, rises in three tiers to nearly fifty metres.\n\nAt the end of its journey the water arrived at a round stone basin, the castellum, from which ten lead pipes led away into the streets. The public fountains were served first and were never shut off; the baths took the next share; private houses, whose owners paid for the privilege, drew whatever remained. Because the fountains ran day and night, any fall in the supply was felt in the wealthiest houses long before it was felt in the street, and the complaints of those householders are among the few surviving records of the system's decline.\n\nThe aqueduct also kept its own accounts. The water of the region is rich in dissolved lime, and a thin crust of it hardened onto the channel walls, layer upon layer. By the time the system was abandoned, centuries later, that crust was as thick as a man's arm, and the channel it lined had been narrowed until it could carry only a fraction of its original flow. Archaeologists have counted the layers much as a forester counts the rings of a tree, and from that count they estimate that water flowed along the channel for about five hundred years.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "This section has two parts. Part 1 tests careful editing; Part 2 tests clear, controlled writing.", "label": "", "body": "", "hint": "Part 1: Read the passage below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and appropriate, and record your answers as 1-A, 2-B, and so on. Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences in the answer box. Plan for a moment before you begin, and check your spelling, punctuation and grammar at the end.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1:\n\nThe monthly bird survey at the Silver Bay wetland reserve [1: A) had started B) was started C) has been started] eleven years ago by a group of retired birdwatchers who live nearby. On the first clear night of every month, a team of six volunteers [2: A) walk B) is walking C) walks] the same three kilometres of muddy path. The volunteers are responsible [3: A) for B) to C) of] recording every call they hear, however faint. A summary of the results [4: A) was sent B) gets fired off C) is sent] to the regional wildlife trust before the end of the week. The team works [5: A) patient B) patiently C) more patiently], even when the rain is heavy and the path disappears under water. Last winter the reserve recorded [6: A) the rarest B) the rarer C) rarest] visitor in its history.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences: (1) Explain, step by step, how someone who has just arrived in your city could travel by public transport from a station or stop near your home to a place you visit often, making your directions clear enough to follow without asking anyone for help. (2) Write a short narrative about a character who is asked, with almost no warning, to speak in front of a large audience, showing what they are thinking as well as what they say."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "When you are learning something new, what do you do best?", "options": {"A": "Watching carefully first, then copying what I saw.", "B": "Asking questions until it makes sense to me.", "C": "Getting hands-on and working it out by doing it.", "D": "Reading or listening to the explanation from the start."}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What would you most like to become stronger at?", "options": {"A": "Explaining my thinking so other people can follow it.", "B": "Keeping my work and my things organised.", "C": "Staying patient when something takes a long time.", "D": "Working independently, without waiting to be told."}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "At school, which way of working do you like the most?", "options": {"A": "On my own, at my own pace.", "B": "With one partner I can talk things through with.", "C": "In a bigger team, where we collaborate.", "D": "On my own, with a teacher nearby to check in with."}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "Which of these makes you feel happiest?", "options": {"A": "Learning something I did not know this morning.", "B": "Being told that I was helpful to someone.", "C": "Getting a plan to work exactly as I imagined it.", "D": "A free day, when I get to choose what to do."}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could take up one new activity this term, which would you pick?", "options": {"A": "A class in the arts, like drawing, film or drama.", "B": "A new sports or fitness challenge.", "C": "A study club, like debating, coding or science.", "D": "A games club, like chess or cards, where you work out a plan."}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "How comfortable do you feel starting a task when you do not yet know how it will turn out?", "options": {"A": "Very comfortable. I just start and see.", "B": "Quite comfortable. I begin, and I adjust as I go.", "C": "A little unsure. I like to ask a few questions first.", "D": "Not very comfortable. I like to know the steps before I begin."}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "When something turns out to be harder than you expected, which of these are you most likely to do?", "options": {"A": "Try a completely different way of doing it.", "B": "Take a short break, then come back to it.", "C": "Ask somebody to work on it with me.", "D": "Keep going at it until it works."}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "How important is it to you to know what could go wrong before you start something?", "options": {"A": "Not important. I would rather begin and find out.", "B": "A little important. A quick think is enough for me.", "C": "Quite important. I like to picture what might happen.", "D": "Very important. I weigh up the risk carefully first."}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Look at the five things in the picture: a box of building bricks, a roll of tape, a torch, a bag of elastic bands and a length of string. What would you most want to do with them?", "options": {"A": "Build something creative that nobody has made before.", "B": "Improve something at home that does not work well.", "C": "Test what each thing can do, one at a time.", "D": "Make something together with a friend."}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you are working on a project of your own, what do you do best?", "options": {"A": "Coming up with lots of different ideas quickly.", "B": "Choosing the one idea that will actually work.", "C": "Making the finished thing look and feel right.", "D": "Keeping it moving, so it is finished on time."}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "When you are given a task with no instructions, what do you most want to do first?", "options": {"A": "Start straight away and see what happens.", "B": "Talk it over with somebody else first.", "C": "Make a plan or a list before I begin.", "D": "Look at an example first, to see how it is usually done."}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "When you are working on a tricky problem, which of these do you like the least?", "options": {"A": "Waiting before I am allowed to start.", "B": "Explaining every step out loud while I work.", "C": "Changing my idea after I have already started.", "D": "Being told exactly how it must be done."}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "When you are getting on well with somebody, what are you usually doing?", "options": {"A": "Really listening, instead of waiting for my turn to talk.", "B": "Being fair, and saying sorry when I should.", "C": "Noticing how they are feeling before I speak.", "D": "Doing something together that we both enjoy."}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "Which of these would make you feel most sad?", "options": {"A": "Somebody being spoken to unkindly.", "B": "Not being able to help a friend who is upset.", "C": "Working hard on something and nobody noticing.", "D": "People around me arguing loudly."}, "cnum": "14"}, {"n": "33", "type": "selfeval", "section": "Character", "stem": "How comfortable do you feel speaking in front of the whole class, in the language you use most easily?", "options": {"A": "Very comfortable. I enjoy it.", "B": "Quite comfortable. I settle once I have started.", "C": "A little unsure. I prefer a smaller group.", "D": "Not very comfortable. I would rather write my ideas down."}, "cnum": "15"}, {"n": "34", "type": "selfeval", "section": "Character", "stem": "How important is it to you to have time to think before you answer out loud?", "options": {"A": "Not important. I usually answer straight away.", "B": "A little important. A few seconds is enough.", "C": "Quite important. I like to sort my thoughts first.", "D": "Very important. I answer best once I have thought it through."}, "cnum": "16"}, {"n": "35", "type": "info", "title": "Maths", "body": "Read each question carefully and choose the best answer."}, {"n": "36", "type": "mcq", "section": "Maths", "stem": "A solid metal sphere has volume 1150 cm³. Find its radius, giving your answer to 1 d.p. (Volume of a sphere = 4/3 πr³.)", "options": {"A": "7.2 cm", "B": "6.5 cm", "C": "16.6 cm", "D": "13.0 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><circle cx=\"110\" cy=\"105\" r=\"70\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><ellipse cx=\"110\" cy=\"105\" rx=\"70\" ry=\"22\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "Rationalise the denominator and simplify fully: 12/√6.", "options": {"A": "2√6", "B": "2√3", "C": "2", "D": "√2"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "Solve simultaneously: 4x + 3y = 2 and 2x − 5y = 27.", "options": {"A": "x = 3.5, y = 4", "B": "x = −4, y = 3.5", "C": "x = 3.5, y = −4", "D": "x = 6, y = −3"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "A sector of a circle has radius 8.4 cm and an angle of 115° at the centre. Find the perimeter of the sector, to 1 d.p.", "options": {"A": "16.9 cm", "B": "70.8 cm", "C": "25.3 cm", "D": "33.7 cm"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "The rectangle shown has area 45 cm². Find the value of x. (Diagram not drawn to scale.)", "options": {"A": "4.5", "B": "9", "C": "10", "D": "4.7"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"340\" height=\"230\" viewBox=\"0 0 340 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"340\" height=\"230\" fill=\"white\"/><rect x=\"70\" y=\"50\" width=\"200\" height=\"120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"170.0\" y=\"198\" text-anchor=\"middle\" font-size=\"15\">(2x + 1) cm</text><text x=\"58\" y=\"115.0\" text-anchor=\"end\" font-size=\"15\">x cm</text></svg>", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "The ratio of red counters to blue counters in a box is 7 : 3. After 16 more blue counters are put in, the ratio of red to blue becomes 7 : 5. How many red counters are in the box?", "options": {"A": "40", "B": "14", "C": "56", "D": "24"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "In triangle ABC the angle at B is 90°, angle BAC = 34° and AC = 15.8 cm. Find the length of BC, to 1 d.p. (Diagram not drawn to scale.)", "options": {"A": "10.7 cm", "B": "8.8 cm", "C": "13.1 cm", "D": "8.4 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"360\" height=\"250\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"white\"/><polygon points=\"60,195 300,195 185,55\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"46\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">A</text><circle cx=\"300\" cy=\"195\" r=\"3\" fill=\"#1F3864\"/><text x=\"314\" y=\"213\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">B</text><circle cx=\"185\" cy=\"55\" r=\"3\" fill=\"#1F3864\"/><text x=\"185\" y=\"47\" font-size=\"14\" font-weight=\"bold\" fill=\"#1F3864\">C</text><text x=\"100\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">15.8 cm</text><text x=\"264\" y=\"125\" font-size=\"14\" text-anchor=\"middle\" fill=\"#C00\">?</text><text x=\"84\" y=\"223\" font-size=\"13\" fill=\"#C00\">34°</text><path d=\"M78,195 A18,18 0 0 1 72,182\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.4\"/></svg>", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "Thirty students recorded the time, t minutes, they spent travelling to school. The results were: 0 < t ≤ 10, 4 students; 10 < t ≤ 20, 9 students; 20 < t ≤ 30, 12 students; 30 < t ≤ 40, 5 students. Calculate an estimate of the mean travel time, to 1 d.p.", "options": {"A": "26.0 minutes", "B": "20.0 minutes", "C": "16.0 minutes", "D": "21.0 minutes"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "$6800 is invested in an account paying 2.7% compound interest per year. Find the total value of the investment after 6 years, to the nearest dollar.", "options": {"A": "$7902", "B": "$7769", "C": "$7979", "D": "$6911"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "The point P shown on the grid has coordinates (5, 2). P is first reflected in the line y = x, and that image is then rotated 90° anticlockwise about the origin O. Find the coordinates of the final image.", "options": {"A": "(−5, 2)", "B": "(5, −2)", "C": "(−2, 5)", "D": "(−2, −5)"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"260\" height=\"260\" viewBox=\"0 0 260 260\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"260\" height=\"260\" fill=\"white\"/><line x1=\"30\" y1=\"230.0\" x2=\"240\" y2=\"230.0\" stroke=\"#ddd\"/><line x1=\"30.0\" y1=\"20\" x2=\"30.0\" y2=\"230\" stroke=\"#ddd\"/><text x=\"30.0\" y=\"246\" text-anchor=\"middle\" font-size=\"11\">0</text><text x=\"20\" y=\"234.0\" text-anchor=\"end\" font-size=\"11\">0</text><line x1=\"30\" y1=\"195.0\" x2=\"240\" y2=\"195.0\" stroke=\"#ddd\"/><line x1=\"65.0\" y1=\"20\" x2=\"65.0\" y2=\"230\" stroke=\"#ddd\"/><text x=\"65.0\" y=\"246\" text-anchor=\"middle\" font-size=\"11\">1</text><text x=\"20\" y=\"199.0\" text-anchor=\"end\" font-size=\"11\">1</text><line x1=\"30\" y1=\"160.0\" x2=\"240\" y2=\"160.0\" stroke=\"#ddd\"/><line x1=\"100.0\" y1=\"20\" x2=\"100.0\" y2=\"230\" stroke=\"#ddd\"/><text x=\"100.0\" y=\"246\" text-anchor=\"middle\" font-size=\"11\">2</text><text x=\"20\" y=\"164.0\" text-anchor=\"end\" font-size=\"11\">2</text><line x1=\"30\" y1=\"125.0\" x2=\"240\" y2=\"125.0\" stroke=\"#ddd\"/><line x1=\"135.0\" y1=\"20\" x2=\"135.0\" y2=\"230\" stroke=\"#ddd\"/><text x=\"135.0\" y=\"246\" text-anchor=\"middle\" font-size=\"11\">3</text><text x=\"20\" y=\"129.0\" text-anchor=\"end\" font-size=\"11\">3</text><line x1=\"30\" y1=\"90.0\" x2=\"240\" y2=\"90.0\" stroke=\"#ddd\"/><line x1=\"170.0\" y1=\"20\" x2=\"170.0\" y2=\"230\" stroke=\"#ddd\"/><text x=\"170.0\" y=\"246\" text-anchor=\"middle\" font-size=\"11\">4</text><text x=\"20\" y=\"94.0\" text-anchor=\"end\" font-size=\"11\">4</text><line x1=\"30\" y1=\"55.0\" x2=\"240\" y2=\"55.0\" stroke=\"#ddd\"/><line x1=\"205.0\" y1=\"20\" x2=\"205.0\" y2=\"230\" stroke=\"#ddd\"/><text x=\"205.0\" y=\"246\" text-anchor=\"middle\" font-size=\"11\">5</text><text x=\"20\" y=\"59.0\" text-anchor=\"end\" font-size=\"11\">5</text><line x1=\"30\" y1=\"20.0\" x2=\"240\" y2=\"20.0\" stroke=\"#ddd\"/><line x1=\"240.0\" y1=\"20\" x2=\"240.0\" y2=\"230\" stroke=\"#ddd\"/><text x=\"240.0\" y=\"246\" text-anchor=\"middle\" font-size=\"11\">6</text><text x=\"20\" y=\"24.0\" text-anchor=\"end\" font-size=\"11\">6</text><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"230\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"30\" y1=\"230\" x2=\"240\" y2=\"230\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"205.0\" cy=\"160.0\" r=\"5\" fill=\"#C00\"/><text x=\"213.0\" y=\"154.0\" font-size=\"13\" font-weight=\"bold\" fill=\"#C00\">P</text></svg>", "passage": "", "qnum": "10"}, {"n": "46", "type": "mcq", "section": "Maths", "stem": "Solve the inequality: 7 − x/2 ≥ 3x + 21.", "options": {"A": "x ≥ −4", "B": "x ≤ −4", "C": "x ≤ 4", "D": "x ≤ −3.5"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "47", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The five figures below follow a pattern. Which of the labelled options comes next in the sequence?", "options": {"A": "the shaded 6-sided shape (hexagon)", "B": "the shaded 9-sided shape (nonagon)", "C": "the unshaded 9-sided shape (nonagon)", "D": "the unshaded 6-sided shape (hexagon)"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"560\" height=\"230\" viewBox=\"0 0 560 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"560\" height=\"230\" fill=\"white\"/><text x=\"10\" y=\"22\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Sequence:</text><polygon points=\"60.0,34.0 82.5,73.0 37.5,73.0\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"150.0,34.0 170.3,43.8 175.3,65.8 161.3,83.4 138.7,83.4 124.7,65.8 129.7,43.8\" fill=\"#9FB6D9\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"214\" y=\"34\" width=\"52\" height=\"52\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"330.0,34.0 348.4,41.6 356.0,60.0 348.4,78.4 330.0,86.0 311.6,78.4 304.0,60.0 311.6,41.6\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"420.0,34.0 444.7,52.0 435.3,81.0 404.7,81.0 395.3,52.0\" fill=\"#9FB6D9\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"510\" y=\"70\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"bold\" fill=\"#C00\">?</text><line x1=\"10\" y1=\"120\" x2=\"550\" y2=\"120\" stroke=\"#ccc\"/><text x=\"10\" y=\"142\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Options:</text><polygon points=\"60.0,149.0 82.5,162.0 82.5,188.0 60.0,201.0 37.5,188.0 37.5,162.0\" fill=\"#9FB6D9\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"150.0,149.0 166.7,155.1 175.6,170.5 172.5,188.0 158.9,199.4 141.1,199.4 127.5,188.0 124.4,170.5 133.3,155.1\" fill=\"#9FB6D9\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"150\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"240.0,149.0 256.7,155.1 265.6,170.5 262.5,188.0 248.9,199.4 231.1,199.4 217.5,188.0 214.4,170.5 223.3,155.1\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"240\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"330.0,149.0 352.5,162.0 352.5,188.0 330.0,201.0 307.5,188.0 307.5,162.0\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"330\" y=\"218\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "1"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A community makerspace offers two ways to pay for time on its laser-cutter bay.\n\nPlan A: no membership fee, $70 for every hour booked.\nPlan B: a membership fee of $240 per month, then $40 for every hour booked.\n\nA design group books the same number of whole hours every month. What is the SMALLEST number of hours per month for which Plan B costs LESS than Plan A?", "options": {"A": "6 hours", "B": "7 hours", "C": "8 hours", "D": "9 hours"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Five students - Farah, Gil, Hana, Ivan and Jun - finished a cross-country race in first to fifth place. There were no ties. Treat all three facts below as completely true.\n\n1. Hana finished immediately ahead of Ivan, with nobody between them.\n2. Farah finished ahead of Gil but behind Ivan.\n3. Jun did not finish last.\n\nWhich statement MUST be true?", "options": {"A": "Hana finished first.", "B": "Ivan finished immediately ahead of Farah.", "C": "Ivan finished second or third.", "D": "Jun finished first or third."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Choose the word that completes the relationship in the same way.\n\nTHRIFTY is to MISERLY as CONFIDENT is to ______.", "options": {"A": "arrogant", "B": "assured", "C": "ambitious", "D": "hesitant"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The Riverford Wildlife Trust says the otter population of the River Tarn has recovered, because the number of otter sightings reported by members of the public along the river has tripled since 2019.\"<br><br>ASSUMPTION: \"The rise in reported sightings reflects a real rise in otter numbers, rather than simply more people watching the river and reporting what they see.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "INTERPRETATION. Statement: \"A ferry company surveyed all 400 passengers on one crossing, and every passenger answered both questions asked. 260 passengers said they had travelled with the company before. 180 passengers said they were travelling for work. 90 passengers said both: that they had travelled with the company before and that they were travelling for work.\"\n\nCONCLUSIONS:\n1. Exactly 50 passengers were neither travelling for work nor had travelled with the company before.\n2. More than half of the passengers travelling for work were making their first crossing with the company.\n3. Most of the passengers who had travelled with the company before were travelling for work.\n\nUsing ONLY the information given, which option correctly states whether each conclusion follows?", "options": {"A": "Conclusions 1 and 2 follow; conclusion 3 does not follow.", "B": "None of the three conclusions follows.", "C": "Only conclusion 1 follows; conclusions 2 and 3 do not follow.", "D": "Conclusions 1 and 3 follow; conclusion 2 does not follow."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "DEDUCTION. Treat the following facts as completely true:\n\n- If the harbour siren sounds, then the lifeboat crew is paged.\n- If the lifeboat crew is paged, then the boathouse doors are opened.\n- On Tuesday the boathouse doors were not opened.\n\nThree of the conclusions below follow logically from these facts. Which conclusion does NOT follow?", "options": {"A": "On Tuesday the lifeboat crew was not paged.", "B": "On Tuesday the harbour siren did not sound.", "C": "If the boathouse doors are opened, then the harbour siren has sounded."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the city close its historic centre to private cars every Saturday?\"\n\nWhich of the following is the STRONGEST argument, judged only by the quality of its reasoning?", "options": {"A": "Yes: an online poll on the council's website drew 12,000 responses, and 78% of those who chose to take part said a car-free centre would be a more pleasant place to walk around.", "B": "Yes: my cousin spent a weekend in a European city where the old town is closed to cars, and she said the whole place felt delightful.", "C": "No: when the riverside road was closed for two weeks of repairs last spring, journey times across the district rose by about a quarter and the number of vehicles entering the district did not fall, so the traffic was pushed onto other streets rather than removed."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every batch of vaccine released by the laboratory has passed the sterility test. Batch 47 was released by the laboratory this morning.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Batch 47 passed the sterility test.", "B": "Batch 47 passed every test the laboratory carries out.", "C": "Any batch that passes the sterility test is released by the laboratory.", "D": "Batches that fail the sterility test are destroyed."}, "fig": "", "passage": "", "qnum": "9"}];

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 (V5)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
