<!DOCTYPE html>

<head>

<title>IDAT HKIS: Stage 5 (V2)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCHOOL = "HKIS", STAGE = "5", VERSION = "2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the word or phrase that best completes the sentence below.\n\nThe museum doubled its opening hours last spring; ______, attendance over the following months barely changed at all.", "options": {"A": "consequently", "B": "meanwhile", "C": "nevertheless", "D": "in addition"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\nIf the pilot ______ the storm warning before take-off, the flight would never have been delayed for six hours.", "options": {"A": "received", "B": "would receive", "C": "has received", "D": "had received"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the option that uses the colon or semicolon correctly.", "options": {"A": "The kit contains four items, a torch; a whistle; a map; and a blanket.", "B": "The kit contains four items: a torch, a whistle, a map and a blanket.", "C": "The kit contains four items; a torch, a whistle, a map and a blanket.", "D": "The kit contains: four items a torch, a whistle, a map and a blanket."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the sentence below.\n\nThe box of old photographs and faded letters ______ been sitting untouched in the attic for years.", "options": {"A": "has", "B": "have", "C": "are", "D": "were"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "One of the four labelled sections contains an error. Choose the labelled section that must be changed.\n\nNeither the students nor the teacher (A) were available (B) to attend the meeting, (C) which had been called (D) at short notice.", "options": {"A": "were available", "B": "to attend the meeting", "C": "which had been called", "D": "at short notice"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the underlined word in the sentence below?\n\nThe negotiations reached an <u>impasse</u>, with neither side willing to offer a single concession.", "options": {"A": "a temporary pause", "B": "a noisy disagreement", "C": "a deadlock with no progress", "D": "a final agreement"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "In the sentence below, what part of speech is the underlined word?\n\nHer <u>measured</u> response to the criticism impressed even her rivals.", "options": {"A": "verb", "B": "adjective", "C": "noun", "D": "adverb"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the option that best completes the idiom in the sentence below.\n\nThe new manager was eager and capable, and she ______ the ground running on her very first day.", "options": {"A": "hit", "B": "jumped", "C": "took", "D": "broke"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which literary device is used in the sentence below?\n\nThe new policy was a resounding success that quietly bankrupted three local businesses.", "options": {"A": "hyperbole", "B": "personification", "C": "alliteration", "D": "irony"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the word that best completes the sentence below.\n\nThe witness's account directly contradicted the security footage, so the jury dismissed it as ______ and gave it no weight at all.", "options": {"A": "meticulous", "B": "implausible", "C": "candid", "D": "verbose"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the underlined word as it is used in the passage?\n\n\"I <u>anticipate</u> one serious objection, and it is a fair one: childcare.\"", "options": {"A": "argue against", "B": "expect in advance", "C": "welcome warmly", "D": "agree with"}, "fig": "", "passage": "<strong>A Speech to the School Board on the Four-Day Week</strong><br>Members of the board, I rise tonight to propose something that will sound, at first, like less: a four-day school week. I assure you it is not a plea for idleness. It is a plea for a school day that fits how young people actually learn, rest and grow.\n\nConsider first the evidence on learning. We have long assumed that more hours in a classroom must mean more knowledge in a head. Yet a review by the National Institute for Educational Research, which tracked forty schools that moved to a four-day timetable, found no fall in examination results over three years. Where lessons were redesigned to be longer and more focused, results in mathematics and science actually rose by a modest four per cent. The lesson is plain: it is the quality of attention, not the quantity of hours, that builds understanding.\n\nConsider next the question of wellbeing. Our own counselling service reported a thirty per cent rise in stress-related absences over the past two years. Teenagers, the sleep researchers tell us, are biologically wired to fall asleep late and wake late; an extra morning free each week lets the body recover the rest that early starts steal from it. A rested student is not a lazy student. A rested student is one who can concentrate, reason and remember.\n\nConsider, too, the cost. Heating, lighting, transport and catering for a fifth day are far from trivial. The Schools Finance Office estimates that closing the building one weekday would save this district close to nine hundred thousand dollars a year, money that could pay for the very teaching assistants and counsellors our students so plainly need.\n\nI anticipate one serious objection, and it is a fair one: childcare. For many working families, the school day is not only a place of learning but a place of safety while parents earn a living. This is real, and I will not wave it away. That is why my proposal pairs the shorter week with a low-cost, optional activity day on the fifth morning, staffed by community volunteers and focused on sport, music and the arts, so that no family is left without support.\n\nSo I do not ask you to teach our children less. I ask you to teach them better: to trade tired hours for focused ones, and to give back to growing minds the rest they are built to need. A wiser school is not a school that simply opens longer. It is one that asks, honestly, what its longest day is really for. Let us have the courage to ask that question. Thank you.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "According to the passage, how much does the Schools Finance Office estimate the district could save each year?", "options": {"A": "four per cent of the school budget", "B": "thirty per cent of all staffing costs", "C": "close to nine hundred thousand dollars", "D": "the full cost of all teaching assistants"}, "fig": "", "passage": "<strong>A Speech to the School Board on the Four-Day Week</strong><br>Members of the board, I rise tonight to propose something that will sound, at first, like less: a four-day school week. I assure you it is not a plea for idleness. It is a plea for a school day that fits how young people actually learn, rest and grow.\n\nConsider first the evidence on learning. We have long assumed that more hours in a classroom must mean more knowledge in a head. Yet a review by the National Institute for Educational Research, which tracked forty schools that moved to a four-day timetable, found no fall in examination results over three years. Where lessons were redesigned to be longer and more focused, results in mathematics and science actually rose by a modest four per cent. The lesson is plain: it is the quality of attention, not the quantity of hours, that builds understanding.\n\nConsider next the question of wellbeing. Our own counselling service reported a thirty per cent rise in stress-related absences over the past two years. Teenagers, the sleep researchers tell us, are biologically wired to fall asleep late and wake late; an extra morning free each week lets the body recover the rest that early starts steal from it. A rested student is not a lazy student. A rested student is one who can concentrate, reason and remember.\n\nConsider, too, the cost. Heating, lighting, transport and catering for a fifth day are far from trivial. The Schools Finance Office estimates that closing the building one weekday would save this district close to nine hundred thousand dollars a year, money that could pay for the very teaching assistants and counsellors our students so plainly need.\n\nI anticipate one serious objection, and it is a fair one: childcare. For many working families, the school day is not only a place of learning but a place of safety while parents earn a living. This is real, and I will not wave it away. That is why my proposal pairs the shorter week with a low-cost, optional activity day on the fifth morning, staffed by community volunteers and focused on sport, music and the arts, so that no family is left without support.\n\nSo I do not ask you to teach our children less. I ask you to teach them better: to trade tired hours for focused ones, and to give back to growing minds the rest they are built to need. A wiser school is not a school that simply opens longer. It is one that asks, honestly, what its longest day is really for. Let us have the courage to ask that question. Thank you.", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "What can be most reasonably inferred from the speaker's point about teenagers and sleep?", "options": {"A": "Teenagers are naturally lazier than y rose by a modest four per cent. The lesson is plain: it is the quality of attention, not the quantity of hours, that builds understanding.\n\nConsider next the question of wellbeing. Our own counselling service reported a thirty per cent rise in stress-related absences over the past two years. Teenagers, the sleep researchers tell us, are biologically wired to fall asleep late and wake late; an extra morning free each week lets the body recover the rest that early starts steal from it. A rested student is not a lazy student. A rested student is one who can concentrate, reason and remember.\n\nConsider, too, the cost. Heating, lighting, transport and catering for a fifth day are far from trivial. The Schools Finance Office estimates that closing the building one weekday would save this district close to nine hundred thousand dollars a year, money that could pay for the very teaching assistants and counsellors our students so plainly need.\n\nI anticipate one serious objection, and it is a fair one: childcare. For many working families, the school day is not only a place of learning but a place of safety while parents earn a living. This is real, and I will not wave it away. That is why my proposal pairs the shorter week with a low-cost, optional activity day on the fifth morning, staffed by community volunteers and focused on sport, music and the arts, so that no family is left without support.\n\nSo I do not ask you to teach our children less. I ask you to teach them better: to trade tired hours for focused ones, and to give back to growing minds the rest they are built to need. A wiser school is not a school that simply opens longer. It is one that asks, honestly, what its longest day is really for. Let us have the courage to ask that question. Thank you.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which statement best expresses the central argument of the speech?", "options": {"A": "Schools should close one day a week mainly to save money.", "B": "A shorter, more focused week can serve learning and wellbeing better than simply more hours.", "C": "Examination results always improve when school hours are reduced.", "D": "Teenagers should set their own school timetables."}, "fig": "", "passage": "<strong>A Speech to the School Board on the Four-Day Week</strong><br>Members of the board, I rise tonight to propose something that will sound, at first, like less: a four-day school week. I assure you it is not a plea for idleness. It is a plea for a school day that fits how young people actually learn, rest and grow.\n\nConsider first the evidence on learning. We have long assumed that more hours in a classroom must mean more knowledge in a head. Yet a review by the National Institute for Educational Research, which tracked forty schools that moved to a four-day timetable, found no fall in examination results over three years. Where lessons were redesigned to be longer and more focused, results in mathematics and science actually rose by a modest four per cent. The lesson is plain: it is the quality of attention, not the quantity of hours, that builds understanding.\n\nConsider next the question of wellbeing. Our own counselling service reported a thirty per cent rise in stress-related absences over the past two years. Teenagers, the sleep researchers tell us, are biologically wired to fall asleep late and wake late; an extra morning free each week lets the body recover the rest that early starts steal from it. A rested student is not a lazy student. A rested student is one who can concentrate, reason and remember.\n\nConsider, too, the cost. Heating, lighting, transport and catering for a fifth day are far from trivial. The Schools Finance Office estimates that closing the building one weekday would save this district close to nine hundred thousand dollars a year, money that could pay for the very teaching assistants and counsellors our students so plainly need.\n\nI anticipate one serious objection ess] the weather on the day was dreadful, more than two hundred families still came through the gates. By closing time ours was [5: A) the busier B) the busiest C) busier] stall in the hall, and we had raised far more [6: A) then B) than C) that] we had ever dared to hope.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences: (1) Explain to a younger student how to revise for a spelling test they are worried about. Describe the steps clearly and in a sensible order, and give one piece of advice for staying calm during the test. (2) Write about a time you volunteered to help with something and it turned out differently from what you expected. Describe what happened and what you learned from it."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "Which of these feels most like a strength of yours?", "options": {"A": "Being active and good with my body", "B": "Picking up new things in lessons quickly", "C": "Imagining and making creative things", "D": "Reading how my friends are feeling"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "If you could grow in one of these, which would you choose?", "options": {"A": "Keeping a cool head under pressure", "B": "Speaking up when I have something to say", "C": "Sticking with a task until it is done", "D": "Tuning in to how others are feeling"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What gives you a real sense of pride?", "options": {"A": "Working something out by myself", "B": "Getting kind words about my effort", "C": "Coming up with something original", "D": "Being there for someone who needed me"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "How often do you think about what comes easily to you and what feels harder?", "options": {"A": "I rarely think about it", "B": "Now and then", "C": "Fairly often", "D": "A lot of the time"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "Given a free choice, which new thing would you reach for first?", "options": {"A": "An outdoor activity I have never done", "B": "A challenging logic or strategy game", "C": "Performing a piece in front of an audience", "D": "Organising and leading a team task"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "When you try something you are not sure you can do yet, how do you usually feel?", "options": {"A": "Excited to dive straight in", "B": "Curious and ready to give it a go", "C": "A bit unsure but willing to try", "D": "I like to feel prepared before I start"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "When a task turns out to be really tough, which is most like you?", "options": {"A": "Keep going my own way", "B": "Switch to a completely different approach", "C": "Reach out to someone for help", "D": "Step away and return to it fresh"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "Which of these would you enjoy the least?", "options": {"A": "Trying a brand-new activity in front of others", "B": "Working on a task with no help available", "C": "Changing the plan at the last minute", "D": "Tackling something with no clear instructions"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "You have these things to play with: a ball, a paintbrush, a notebook and a puzzle. What would you most want to do?", "options": {"A": "Invent a brand-new game with the ball", "B": "Paint or draw something of my own", "C": "Write a story or my own ideas in the notebook", "D": "Work out the puzzle step by step"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When there is a problem to crack, what do you enjoy most?", "options": {"A": "Dreaming up an idea no one else has had", "B": "Taking someone's idea and making it better", "C": "Spotting the hidden pattern or trick", "D": "Working through clear steps until it works"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "Put these in the order you most enjoy doing them, from your favourite to your least favourite.", "options": {"A": "Building or making things with my hands", "B": "Imagining stories or whole new worlds", "C": "Figuring out how things work inside", "D": "Drawing, music or other arts"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "If you could work in one new way, which sounds best to you?", "options": {"A": "Build the whole idea from scratch", "B": "Blend two old ideas into something new", "C": "Test lots of options to see what works", "D": "Use a method that already works well"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "When you want others to really get what you mean, what works best for you?", "options": {"A": "Talking it through out loud", "B": "Writing or drawing it out", "C": "Showing them by doing it", "D": "Listening first, then adding my idea"}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "What do you think matters most for a group to work well together?", "options": {"A": "Really listening to how others feel", "B": "Taking turns and sharing fairly", "C": "Forgiving and moving on after a clash", "D": "Pulling together towards one goal"}, "cnum": "14"}, {"n": "33", "type": "selfeval", "section": "Character", "stem": "At school, which of these matters most to you?", "options": {"A": "That nobody gets left out", "B": "That people understand me when I speak", "C": "That I get along with people I like", "D": "That I have others to work alongside"}, "cnum": "15"}, {"n": "34", "type": "selfeval", "section": "Character", "stem": "How much does it matter to you that everyone in a group feels included?", "options": {"A": "I focus more on the task itself", "B": "A little", "C": "Quite a lot", "D": "A great deal"}, "cnum": "16"}, {"n": "35", "type": "info", "title": "Maths", "body": "Read each question carefully and choose the best answer."}, {"n": "36", "type": "mcq", "section": "Maths", "stem": "A solid cylinder has diameter 18 cm and height 9 cm. Find its volume, to 1 d.p. (Use the π button.)", "options": {"A": "2290.2 cm³", "B": "9160.9 cm³", "C": "4580.4 cm³", "D": "763.4 cm³"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"300\" viewBox=\"0 0 300 300\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"300\" fill=\"white\"/><ellipse cx=\"100\" cy=\"230\" rx=\"64\" ry=\"20\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"36\" y=\"60\" width=\"128\" height=\"170\" fill=\"#EAF0FA\" stroke=\"none\"/><line x1=\"36\" y1=\"60\" x2=\"36\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"164\" y1=\"60\" x2=\"164\" y2=\"230\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M36,230 A64,20 0 0 0 164,230\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"2\"/><ellipse cx=\"100\" cy=\"60\" rx=\"64\" ry=\"20\" fill=\"#DCE6F6\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"100\" y1=\"60\" x2=\"164\" y2=\"60\" stroke=\"#C00\" stroke-width=\"1.5\"/><text x=\"132\" y=\"53\" font-size=\"13\" text-anchor=\"middle\" fill=\"#C00\">d = 18 cm</text><line x1=\"180\" y1=\"60\" x2=\"180\" y2=\"230\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"186\" y=\"145\" font-size=\"13\" fill=\"#333\">h = 9 cm</text></svg>", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "Simplify fully: 5√(48x²), where x > 0.", "options": {"A": "5x√48", "B": "20x√3", "C": "240x²", "D": "20x√12"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "A sum of money is shared between three people in the ratio 3 : 5 : 7. The total ig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "A straight line has gradient −2/5 and passes through the point (5, 4). Find its equation in the form y = mx + c.", "options": {"A": "y = −2/5 x + 4", "B": "y = 2/5 x + 6", "C": "y = −2/5 x + 6", "D": "y = −5/2 x + 4"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "Find the lower quartile of these 11 values: 5, 8, 11, 13, 16, 19, 22, 25, 28, 31, 34.", "options": {"A": "16", "B": "19", "C": "22", "D": "11"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "The bar chart shows the number of goals scored by a team in each match: 2 goals in 3 matches, 3 goals in 6 matches, and 5 goals in 1 match. Which statement is true?", "options": {"A": "The mean number of goals is 2.9.", "B": "The modal number of goals is 5.", "C": "The median number of goals is 5.", "D": "The range of goals is 6."}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"460\" height=\"300\" viewBox=\"0 0 460 300\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"460\" height=\"300\" fill=\"white\"/><text x=\"230.0\" y=\"18\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">Goals per match</text><line x1=\"50\" y1=\"250.0\" x2=\"440\" y2=\"250.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"254.0\" text-anchor=\"end\" font-size=\"11\">0</text><line x1=\"50\" y1=\"206.0\" x2=\"440\" y2=\"206.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"210.0\" text-anchor=\"end\" font-size=\"11\">2</text><line x1=\"50\" y1=\"162.0\" x2=\"440\" y2=\"162.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"166.0\" text-anchor=\"end\" font-size=\"11\">4</text><line x1=\"50\" y1=\"118.0\" x2=\"440\" y2=\"118.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"122.0\" text-anchor=\"end\" font-size=\"11\">6</text><line x1=\"50\" y1=\"74.0\" x2=\"440\" y2=\"74.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"78.0\" text-anchor=\"end\" font-size=\"11\">8</text><line x1=\"50\" y1=\"30.0\" x2=\"440\" y2=\"30.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"34.0\" text-anchor=\"end\" font-size=\"11\">10</text><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"250\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"250\" x2=\"440\" y2=\"250\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"76.0\" y=\"184.0\" width=\"78.0\" height=\"66.0\" fill=\"#4472C4\"/><text x=\"115.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">2</text><rect x=\"206.0\" y=\"118.0\" width=\"78.0\" height=\"132.0\" fill=\"#ED7D31\"/><text x=\"245.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">3</text><rect x=\"336.0\" y=\"228.0\" width=\"78.0\" height=\"22.0\" fill=\"#70AD47\"/><text x=\"375.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"12\">5</text><text x=\"14\" y=\"140.0\" text-anchor=\"middle\" font-size=\"11\" transform=\"rotate(-90 14 140.0)\">Number of matches</text></svg>", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "A closed cylinder has radius 6 cm and height 9 cm. Find its total surface area, giving your answer in terms of π.", "options": {"A": "108π cm²", "B": "180π cm²", "C": "144π cm²", "D": "126π cm²"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "46", "type": "mcq", "section": "Maths", "stem": "Write as a single fraction in its simplest form: 2n/3 − 3n/5.", "options": {"A": "−n/2", "B": "−n/8", "C": "n/15", "D": "5n/8"}, "fig": "", "passage": "", "qnum": "11"}, {"n": "47", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A non-stop flight leaves Hong Kong at 23:50 (HKT) on Friday and is in the air for 11 hours 40 minutes. The destination city, Sydney, is 3 hours ahead of Hong Kong. What is the local date and time of arrival in Sydney?", "options": {"A": "Saturday, 11:30", "B": "Saturday, 08:30", "C": "Friday, 14:30", "D": "Saturday, 14:30"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "On the planet Velor, every rule below is true:\n(1) All zorbs are plinky.\n(2) No plinky creature is fast.\n(3) Some grues are zorbs.\nWhich statement MUST be true?", "options": {"A": "All grues are plinky.", "B": "All plinky creatures are zorbs.", "C": "Some grues are not fast.", "D": "No grue is a zorb."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Sam wants to save exactly $600 over 5 months. He earns $160 a month from a paper round and receives $30 a month allowance, but spends $80 a month on transport and $20 a month on snacks. If he keeps this up, by how much will his actual 5-month saving fall SHORT of his $600 goal?", "options": {"A": "Short by $150", "B": "Short by $50", "C": "Short by $300", "D": "Short by $240"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Four tiles below show the same L-shaped piece. Three of them are simply the piece turned (rotated) on the page; one is a mirror image (a reflection) and so cannot be made by turning. Which tile is the odd one out?", "options": {"A": "Tile A", "B": "Tile B", "C": "Tile C", "D": "Tile D"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A rectangular box measures 10 cm long, 8 cm wide and 6 cm tall. It is to be filled completely with small solid cubes, each measuring 2 cm along every edge, packed in neat rows with no gaps. What is the GREATEST number of these cubes that will fit inside the box?", "options": {"A": "240", "B": "60", "C": "120", "D": "480"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "ASSUMPTION. Statement: \"Our town library should stay open until 10 p.m. on weeknights, because doing so will give working adults a quiet place to study after their jobs end.\"\n\nProposed assumption: At least some working adults who would use the library for study are currently unable to do so because it closes before they finish work.\n\nUsing only the information in the statement, is this assumption one the argument must take for granted?", "options": {"A": "Yes, because the claim that later hours will give working adults a place to study only makes sense if some of them are at present prevented from using the library by its closing time.", "B": "No, because the statement is about library opening hours, so it makes no assumption about whether working adults actually want to study there.", "C": "Yes, because the statement proves that closing time is the single reason working adults do not currently use the library.", "D": "No, because working adults could simply study at home instead, so the library's hours make no difference to them."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "INFERENCE. Read the statement, then choose the option that MUST be true on the basis of the statement alone.\n\nStatement: \"Every player who attended all of the pre-season training sessions was named in the starting team. Priya was not named in the starting team. Raj attended all of the pre-season training sessions.\"", "options": {"A": "Priya did not attend any of the pre-season training sessions.", "B": "Priya missed at least one pre-season training session.", "C": "Raj was the best player at the pre-season training sessions.", "D": "Only players who attended all the sessions were named in the starting team."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "INTERPRETATION. Statement: \"In a study of one company, 70% of employees who cycled to work reported low stress levels at midday, while 50% of employees who drove to work reported low stress levels at midday.\"\n\nConsider the two conclusions:\nI. A higher proportion of cyclists than drivers reported low stress at midday.\nII. Cycling to work causes employees to have lower stress at midday.\n\nWhich option correctly states whether each conclusion follows, using ONLY the given information?", "options": {"A": "I follows; II follows.", "B": "I does not follow; II follows.", "C": "I follows; II does not follow.", "D": "Neither I nor II follows."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "56", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the school move the start of the school day from 8 a.m. to 9 a.m. for all secondary students?\"\n\nWhich of the following is the STRONGEST argument, judged only by the quality of its reasoning?", "options": {"A": "No, because when my brother's school started later he still felt tired, so a later start clearly does nothing for anyone.", "B": "Yes, because a later start would obviously be more pleasant, and any change that makes students happier must be the right thing to do.", "C": "No, because starting later would be an unfair attack on hard-working families who are already awake early and have nothing to gain.", "D": "Yes, because a two-year trial in which 40 schools were randomly assigned an 8 a.m. or a 9 a.m. start found that the 9 a.m. schools had measurably higher attendance and test scores."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 (V2)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
