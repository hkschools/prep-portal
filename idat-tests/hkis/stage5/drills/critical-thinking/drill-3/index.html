<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 5 Critical Thinking Drill 3</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 5 Critical Thinking Drill 3</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "5", VERSION = "CT-D3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions. Use only the information given in each question."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The polling company should weight its results by age, because the people who answer its telephone surveys are far older than the population it is trying to describe.\"<br><br>ASSUMPTION: \"Age is related to the opinions the survey is measuring.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The newspaper should stop reporting single-poll changes of one or two points, because such changes are smaller than the margin of error of the polls it quotes.\"<br><br>ASSUMPTION: \"The newspaper's readers currently believe those small changes are meaningful.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The agency should report crime figures per hundred thousand residents rather than as raw totals, because the districts it covers differ enormously in population.\"<br><br>ASSUMPTION: \"Comparing districts is one of the purposes the figures serve.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The broadcaster should describe the sample size whenever it reports a survey, because a result from sixty people and a result from six thousand are currently presented in the same words.\"<br><br>ASSUMPTION: \"Surveys of sixty people are always worthless.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every figure in the report that comes from the national census is marked with an asterisk. The unemployment figure in the report is not marked with an asterisk.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The unemployment figure in the report is unreliable.", "B": "Every figure marked with an asterisk comes from the national census.", "C": "The report contains no figures from the national census.", "D": "The unemployment figure in the report does not come from the national census."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No question in the survey about household income was answered by more than half of the respondents. Some questions in the survey about household income asked about savings.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Every question about household income asked about savings.", "B": "No question about savings anywhere in the survey was answered by more than half of the respondents.", "C": "At least one question about savings was answered by no more than half of the respondents.", "D": "Respondents were unwilling to discuss their savings."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A news report states that road deaths in the county fell by 50 per cent last year. It also states that there were four road deaths last year.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "There were eight road deaths in the county in the previous year.", "B": "Road deaths will fall again next year.", "C": "The county has the lowest road death rate in the country.", "D": "Roads in the county became safer last year."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Whenever the agency revises a figure downwards, it issues a correction notice. No correction notice was issued for the March trade figure.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The March trade figure was not revised at all.", "B": "The March trade figure was not revised downwards.", "C": "The agency issues correction notices only for downward revisions.", "D": "The March trade figure was correct."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A newspaper reported that a town's recycling rate rose from 38 per cent to 52 per cent after new bins were introduced. The council changed what counts as recyclable waste in the same month the bins arrived. A survey of 400 residents found that 232 said they now recycle more than before. The council leader called the scheme a complete success.\"<br><br>CONCLUSIONS:<br>(1) Most of the residents surveyed said they now recycle more than before.<br>(2) The new bins caused the rise in the recycling rate.<br>(3) The council leader described the scheme as a complete success.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (1) follows.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A magazine ran an online poll asking readers whether the city should charge drivers to enter the centre. Of the 9,000 people who responded, 6,300 said no. The poll was open to anyone and could be answered more than once from the same device. The magazine headline read: City rejects charge.\"<br><br>CONCLUSIONS:<br>(1) Most of those who responded to the poll said no.<br>(2) A majority of the city's residents oppose the charge.<br>(3) The poll allowed more than one response from the same device.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "B": "All three conclusions follow.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "Only conclusion (3) follows."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"An insurer reported that claims from drivers under 25 rose 18 per cent last year, while claims from all other drivers rose 4 per cent. The number of drivers under 25 insured by the company rose 21 per cent over the same year. The insurer has announced higher premiums for that age group.\"<br><br>CONCLUSIONS:<br>(1) Claims from drivers under 25 rose by a larger percentage than claims from other drivers.<br>(2) Drivers under 25 became more likely to make a claim last year.<br>(3) The insurer has announced higher premiums for drivers under 25.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Only conclusion (3) follows.", "C": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not follow."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A charity reported that it answered 48,000 calls to its helpline last year, of which 15,600 were from people contacting it for the first time. It employed 60 more advisers than the year before. Its annual review states that demand for the service has never been higher.\"<br><br>CONCLUSIONS:<br>(1) Fewer than a third of the calls answered were from first-time callers.<br>(2) The charity employed more advisers than in the previous year.<br>(3) More people needed the charity's help last year than ever before.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "Only conclusion (2) follows."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every figure quoted in the bulletin is checked by the statistics desk.<br>2. No figure checked by the statistics desk is published without a source note.<br>3. The inflation figure was quoted in the bulletin.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Every figure checked by the statistics desk is quoted in the bulletin.", "B": "The inflation figure was checked by the statistics desk.", "C": "The inflation figure was not published without a source note."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All of the surveys commissioned this year used a random sample.<br>2. Some surveys using a random sample had a response rate below 20 per cent.<br>3. The housing survey was commissioned this year.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "The housing survey had a response rate below 20 per cent.", "B": "Every survey using a random sample was commissioned this year.", "C": "The housing survey used a random sample."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. No dataset without documented collection methods may be cited in the yearbook.<br>2. Every dataset produced by the national office has documented collection methods.<br>3. The migration dataset is cited in the yearbook.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "At least one dataset is cited in the yearbook.", "B": "The migration dataset has documented collection methods.", "C": "The migration dataset was produced by the national office."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every correction the paper issues is recorded in the corrections log.<br>2. No record in the corrections log is deleted within five years.<br>3. The paper issued a correction about the census story in June.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "The record of the census correction will not be deleted within five years.", "B": "Every record in the corrections log concerns the census story.", "C": "The census story was withdrawn."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should news organisations be required to publish the full question wording and sample details of any poll they report?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. A media regulator required the disclosure from half of a country's national outlets for one election cycle. An independent panel found that the proportion of poll stories in the disclosing outlets that overstated a result, by treating a within-margin change as real, fell from about 30 per cent to about 8 per cent, while the number of poll stories they ran was essentially unchanged. Editors had predicted that the requirement would crowd out coverage, and it did not.", "B": "No. Readers skip that sort of detail anyway. I have never once met anyone who reads the small print under a poll, and adding more of it will not turn the public into statisticians.", "C": "Yes. If a poll cannot survive having its own method printed beside it, that tells you everything about the poll. Anyone objecting is objecting to being checked."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should governments publish the underlying data behind official statistics at the same time as the headline figures?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Releasing everything at once just hands ammunition to people who will misread it and shout about it. Statistics need explaining, and explaining takes time.", "B": "Yes. One national office moved to simultaneous release for half of its statistical series and kept the old delayed release for the rest, over three years. Errors in the affected series were identified by outside users a median of eleven days sooner, and the number of corrections issued fell over the period rather than rising. Staff time spent preparing releases, which the office had warned would climb, rose by under 3 per cent.", "C": "Yes. It is our data. We paid for it, it is about us, and the idea that officials should sit on it while they decide how to present it belongs to another century."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should schools teach statistics as a separate compulsory subject rather than within mathematics?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. Every adult meets statistics every day, in the news, at the doctor and at the ballot box, and almost none of them meets quadratic equations. The curriculum should reflect the life people actually lead.", "B": "No. Statistics is mathematics, and pulling it out would leave both halves poorer. You cannot understand a distribution without the algebra that describes it, and everybody in the field knows that.", "C": "No. A region that made statistics a separate compulsory subject was compared with three similar regions that kept it inside mathematics, over four years. Attainment in statistical reasoning was about the same in both arrangements, while the separate subject took roughly 90 hours of curriculum time a year, drawn mostly from mathematics, and attainment in algebra fell slightly in the region that made the change."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should official unemployment figures count people who want more hours but are already in part-time work?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. Anyone scraping by on eight hours a week and desperate for forty is not employed in any sense that means anything, and a statistic that says otherwise is an insult to them.", "B": "Yes. A statistics agency published both measures side by side for six years. The broader measure moved ahead of the headline rate before each of the two downturns in the period, by about two quarters on average, and tracked it closely otherwise, so it carried information the headline rate did not. The agency also found that the groups most affected, women and younger workers, were roughly twice as likely to appear only in the broader measure.", "C": "No. Change the definition and you can make unemployment whatever number you like. The headline rate has been measured the same way for decades and that consistency is worth more than any refinement."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 Critical Thinking Drill 3</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
