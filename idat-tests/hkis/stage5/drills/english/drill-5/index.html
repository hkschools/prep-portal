<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 5 English Drill 5</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "5", VERSION = "ENG-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Write your answers in the spaces provided."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which transitional word or phrase results in a DIFFERENT meaning from the others?<br><br>The pilot scheme met its targets; ___, the council extended it to the whole district.", "options": {"A": "hence", "B": "for this reason", "C": "by contrast", "D": "accordingly"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Correct the underlined word.<br><br>The board is committed to <u>reduce</u> emissions by a quarter within five years.", "options": {"A": "reduces", "B": "reduced", "C": "reduce", "D": "reducing"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly.<br><br>The number of applications ___ risen sharply since the fee was removed.", "options": {"A": "have", "B": "has", "C": "are", "D": "were"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which sentence uses its punctuation correctly?", "options": {"A": "The trial which ran for three winters, produced results the team had not expected.", "B": "The trial, which ran for three winters produced results the team had not expected.", "C": "The trial, which ran for three winters, produced results the team had not expected.", "D": "The trial, which, ran for three winters, produced results the team had not expected."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which prefix means ACROSS or BEYOND?", "options": {"A": "sub-", "B": "pre-", "C": "trans-"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Fill in the blank.<br><br>The report was criticised for relying on ___ evidence: a handful of stories rather than any systematic survey.", "options": {"A": "empirical", "B": "anecdotal", "C": "statistical", "D": "archival"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the saying below mean?<br><br>Presented with the figures, the department chose to <i>move the goalposts</i>.", "options": {"A": "To change the standard by which something is judged, usually unfairly", "B": "To postpone a decision until a later date", "C": "To accept a result reluctantly", "D": "To hand a problem to a different department"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?<br><br>The committee's response was <u>tepid</u>.", "options": {"A": "prompt", "B": "hostile", "C": "unanimous", "D": "lukewarm"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which body is credited with the costing of the garden?", "options": {"A": "The Childhood Nutrition Panel", "B": "The school board", "C": "The speaker", "D": "The Regional Schools Trust"}, "fig": "", "passage": "<strong>A Speech to the School Board: Fund the Garden, and Fund It for Three Years</strong><br><p>Members of the board, thank you. I am asking you to fund a school kitchen garden and to keep funding it for at least three years, and I want to give you the numbers rather than the enthusiasm.</p><p><b>What gardens do and do not do.</b> The Childhood Nutrition Panel reviewed 28 school garden schemes. Children who took part ate on average 0.4 more portions of vegetables a day than comparable children who did not, which is a real change but a modest one. The same review found no measurable effect on body weight, and I would rather you heard that from me than from somebody objecting later.</p><p><b>Where the stronger effect appeared.</b> The clearer finding was about willingness to try unfamiliar food. In the schemes reviewed, the proportion of children willing to taste a vegetable they did not recognise rose from about a third to about two thirds. The Panel describes this as the most consistent result across the 28 schemes.</p><p><b>What it costs.</b> The Regional Schools Trust puts the set-up cost of a garden of the size we are discussing at 4,800 dollars, with annual running costs of about 900 dollars once established. Roughly 70 per cent of the running cost is staff time rather than materials, which is the part that tends to be forgotten when a scheme is proposed.</p><p><b>Why three years.</b> The Panel found that schemes running for a single year showed no lasting change once they ended. Those running for three years or more retained most of their effect a year after the scheme finished. A one-year garden is not a cheaper version of this proposal. It is a different and less useful thing.</p><p>I am asking for 4,800 dollars now and about 900 a year after that. Thank you for hearing me out.</p>", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What does the speaker say the review found about body weight?", "options": {"A": "It found no measurable effect", "B": "It found a small reduction in body weight", "C": "It did not examine body weight", "D": "It found an effect only in schemes lasting three years"}, "fig": "", "passage": "<strong>A Speech to the School Board: Fund the Garden, and Fund It for Three Years</strong><br><p>Members of the board, thank you. I am asking you to fund a school kitchen garden and to keep funding it for at least three years, and I want to give you the numbers rather than the enthusiasm.</p><p><b>What gardens do and do not do.</b> The Childhood Nutrition Panel reviewed 28 school garden schemes. Children who took part ate on average 0.4 more portions of vegetables a day than comparable children who did not, which is a real change but a modest one. The same review found no measurable effect on body weight, and I would rather you heard that from me than from somebody objecting later.</p><p><b>Where the stronger effect appeared.</b> The clearer finding was about willingness to try unfamiliar food. In the schemes reviewed, the proportion of children willing to taste a vegetable they did not recognise rose from about a third to about two thirds. The Panel describes this as the most consistent result across the 28 schemes.</p><p><b>What it costs.</b> The Regional Schools Trust puts the set-up cost of a garden of the size we are discussing at 4,800 dollars, with annual running costs of about 900 dollars once established. Roughly 70 per cent of the running cost is staff time rather than materials, which is the part that tends to be forgotten when a scheme is proposed.</p><p><b>Why three years.</b> The Panel found that schemes running for a single year showed no lasting change once they ended. Those running for three years or more retained most of their effect a year after the scheme finished. A one-year garden is not a cheaper version of this proposal. It is a different and less useful thing.</p><p>I am asking for 4,800 dollars now and about 900 a year after that. Thank you for hearing me out.</p>", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to the speech, what was the most consistent result across the schemes reviewed?", "options": {"A": "An increase of 0.4 portions of vegetables a day", "B": "A rise in children's willingness to taste unfamiliar vegetables", "C": "A fall in the cost of running school kitchens", "D": "An improvement in children's body weight"}, "fig": "", "passage": "<strong>A Speech to the School Board: Fund the Garden, and Fund It for Three Years</strong><br><p>Members of the board, thank you. I am asking you to fund a school kitchen garden and to keep funding it for at least three years, and I want to give you the numbers rather than the enthusiasm.</p><p><b>What gardens do and do not do.</b> The Childhood Nutrition Panel reviewed 28 school garden schemes. Children who took part ate on average 0.4 more portions of vegetables a day than comparable children who did not, which is a real change but a modest one. The same review found no measurable effect on body weight, and I would rather you heard that from me than from somebody objecting later.</p><p><b>Where the stronger effect appeared.</b> The clearer finding was about willingness to try unfamiliar food. In the schemes reviewed, the proportion of children willing to taste a vegetable they did not recognise rose from about a third to about two thirds. The Panel describes this as the most consistent result across the 28 schemes.</p><p><b>What it costs.</b> The Regional Schools Trust puts the set-up cost of a garden of the size we are discussing at 4,800 dollars, with annual running costs of about 900 dollars once established. Roughly 70 per cent of the running cost is staff time rather than materials, which is the part that tends to be forgotten when a scheme is proposed.</p><p><b>Why three years.</b> The Panel found that schemes running for a single year showed no lasting change once they ended. Those running for three years or more retained most of their effect a year after the scheme finished. A one-year garden is not a cheaper version of this proposal. It is a different and less useful thing.</p><p>I am asking for 4,800 dollars now and about 900 a year after that. Thank you for hearing me out.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Why does the speaker argue that a one-year scheme would not simply be a cheaper option?", "options": {"A": "Because the set-up cost would still have to be paid in full", "B": "Because staff time makes up most of the running cost", "C": "Because schemes lasting only a year showed no lasting change once they ended", "D": "Because the Panel did not review any one-year schemes"}, "fig": "", "passage": "<strong>A Speech to the School Board: Fund the Garden, and Fund It for Three Years</strong><br><p>Members of the board, thank you. I am asking you to fund a school kitchen garden and to keep funding it for at least three years, and I want to give you the numbers rather than the enthusiasm.</p><p><b>What gardens do and do not do.</b> The Childhood Nutrition Panel reviewed 28 school garden schemes. Children who took part ate on average 0.4 more portions of vegetables a day than comparable children who did not, which is a real change but a modest one. The same review found no measurable effect on body weight, and I would rather you heard that from me than from somebody objecting later.</p><p><b>Where the stronger effect appeared.</b> The clearer finding was about willingness to try unfamiliar food. In the schemes reviewed, the proportion of children willing to taste a vegetable they did not recognise rose from about a third to about two thirds. The Panel describes this as the most consistent result across the 28 schemes.</p><p><b>What it costs.</b> The Regional Schools Trust puts the set-up cost of a garden of the size we are discussing at 4,800 dollars, with annual running costs of about 900 dollars once established. Roughly 70 per cent of the running cost is staff time rather than materials, which is the part that tends to be forgotten when a scheme is proposed.</p><p><b>Why three years.</b> The Panel found that schemes running for a single year showed no lasting change once they ended. Those running for three years or more retained most of their effect a year after the scheme finished. A one-year garden is not a cheaper version of this proposal. It is a different and less useful thing.</p><p>I am asking for 4,800 dollars now and about 900 a year after that. Thank you for hearing me out.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which of these figures does the speech NOT give?", "options": {"A": "The number of schemes the Panel reviewed", "B": "The set-up cost of the garden", "C": "The share of running costs made up of staff time", "D": "The number of children who would take part at this school"}, "fig": "", "passage": "<strong>A Speech to the School Board: Fund the Garden, and Fund It for Three Years</strong><br><p>Members of the board, thank you. I am asking you to fund a school kitchen garden and to keep funding it for at least three years, and I want to give you the numbers rather than the enthusiasm.</p><p><b>What gardens do and do not do.</b> The Childhood Nutrition Panel reviewed 28 school garden schemes. Children who took part ate on average 0.4 more portions of vegetables a day than comparable children who did not, which is a real change but a modest one. The same review found no measurable effect on body weight, and I would rather you heard that from me than from somebody objecting later.</p><p><b>Where the stronger effect appeared.</b> The clearer finding was about willingness to try unfamiliar food. In the schemes reviewed, the proportion of children willing to taste a vegetable they did not recognise rose from about a third to about two thirds. The Panel describes this as the most consistent result across the 28 schemes.</p><p><b>What it costs.</b> The Regional Schools Trust puts the set-up cost of a garden of the size we are discussing at 4,800 dollars, with annual running costs of about 900 dollars once established. Roughly 70 per cent of the running cost is staff time rather than materials, which is the part that tends to be forgotten when a scheme is proposed.</p><p><b>Why three years.</b> The Panel found that schemes running for a single year showed no lasting change once they ended. Those running for three years or more retained most of their effect a year after the scheme finished. A one-year garden is not a cheaper version of this proposal. It is a different and less useful thing.</p><p>I am asking for 4,800 dollars now and about 900 a year after that. Thank you for hearing me out.</p>", "qnum": "13"}, {"n": "15", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for the text type. Part 2: choose ONE task and write a paragraph of no more than 12 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nSalt: The Mineral That Built Roads\n\nSalt has been traded, taxed and fought over for most of recorded history. [1: A) This text explains why it mattered so much and how it was obtained. B) Salt! Who would have thought it was such a big deal. C) Anyway, salt is next.]\n\nWhy it mattered. Before refrigeration, salting [2: A) were B) was C) being] one of the few reliable ways of keeping meat and fish through a winter. A community without access to salt [3: A) face B) faced C) facing] a genuine problem of survival, [4: A) which is why routes to the nearest source were guarded so carefully. B) which are why routes to the nearest source were guarded so carefully. C) guarding of the routes to the source very carefully.]\n\nHow it was obtained. Coastal communities [5: A) evaporates B) evaporated C) evaporating] seawater in shallow pans, while inland deposits [6: A) was mined B) were mined C) were mine] or dissolved and pumped to the surface as brine.\n\nThe legacy. Several major roads across Europe began as salt routes, [7: A) and a number of towns still carry the word in their names. B) and a number of towns still carries the word in their names. C) and you can still spot them if you know what to look for.] The tax on salt [8: A) was resented in almost every country that levied it. B) were resented in almost every country that levied it. C) went down about as well as you would expect.]", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences. This will be viewed by your future school.\n(1) Write a short informative text about a material or resource that shaped where people settled or how they travelled.\n(2) Write a short argumentative text about whether governments should tax particular foods in order to change what people eat. Include your own opinion."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 English Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
