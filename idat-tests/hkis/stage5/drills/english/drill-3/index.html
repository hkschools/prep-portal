<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 5 English Drill 3</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

re you puts the saving at 340,000 dollars a year. I have read the appendix. Around 60 per cent of that figure is staff costs, and the same appendix notes that most of those staff would be redeployed rather than released. The genuine saving is therefore considerably smaller than the headline, though I accept it is not nothing.</p><p><b>The point I concede.</b> The two buildings proposed for closure are in poor repair, and the survey commissioned by the Estates Committee puts the cost of bringing them up to standard at 1.2 million dollars. That is a real number and I am not going to pretend otherwise. My argument is not that the buildings are fine. It is that closing them is not the only way of dealing with buildings that are not.</p><p><b>What I propose instead.</b> Three of our neighbours have moved smaller libraries into shared premises with a health centre or a community hall, keeping the service and shedding the building. The Association of Library Authorities reports that boroughs taking this route retained on average 80 per cent of their visits while cutting premises costs by about half.</p><p>I am not asking you to spend 1.2 million dollars. I am asking you not to confuse a building with a service. Thank you.</p>", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What point does the speaker make about the 412,000 recorded visits?", "options": {"A": "They were spread evenly across the four sites", "B": "Most of them were made by children attending reading sessions", "C": "Fewer than half of them involved borrowing a book", "D": "They have fallen since the previous year"}, "fig": "", "passage": "<strong>A Speech to the Council: Do Not Confuse a Building with a Service</strong><br><p>Chair, councillors, thank you. I am speaking against the proposal to close two of this borough's four libraries, and I want to be careful about what I claim.</p><p><b>What the libraries are used for.</b> The Borough Research Unit counted visits at all four site  two buildings are in poor repair and would cost 1.2 million dollars to fix"}, "fig": "", "passage": "<strong>A Speech to the Council: Do Not Confuse a Building with a Service</strong><br><p>Chair, councillors, thank you. I am speaking against the proposal to close two of this borough's four libraries, and I want to be careful about what I claim.</p><p><b>What the libraries are used for.</b> The Borough Research Unit counted visits at all four sites over twelve months. Of the 412,000 visits recorded, fewer than half involved borrowing a book at all. The rest were people using the computers, attending a class, bringing a child to a reading session, or sitting somewhere warm and quiet. If we judge a library by loans alone we will close the wrong buildings for the right-looking reasons.</p><p><b>Where the savings actually come from.</b> The report before you puts the saving at 340,000 dollars a year. I have read the appendix. Around 60 per cent of that figure is staff costs, and the same appendix notes that most of those staff would be redeployed rather than released. The genuine saving is therefore considerably smaller than the headline, though I accept it is not nothing.</p><p><b>The point I concede.</b> The two buildings proposed for closure are in poor repair, and the survey commissioned by the Estates Committee puts the cost of bringing them up to standard at 1.2 million dollars. That is a real number and I am not going to pretend otherwise. My argument is not that the buildings are fine. It is that closing them is not the only way of dealing with buildings that are not.</p><p><b>What I propose instead.</b> Three of our neighbours have moved smaller libraries into shared premises with a health centre or a community hall, keeping the service and shedding the building. The Association of Library Authorities reports that boroughs taking this route retained on average 80 per cent of their visits while cutting premises costs by about half.</p><p>I am not asking you to spend 1.2 million dollars. I am asking you not to confuse a building with a service. Thank you.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "Why does the speaker mention that most affected staff would be redeployed rather than released?", "options": {"A": "To argue that the true saving is smaller than the headline figure suggests", "B": "To reassure the staff concerned about their jobs", "C": "To suggest that the report's authors acted dishonestly", "D": "To propose that the staff be moved into the shared premises instead"}, "fig": "", "passage": "<strong>A Speech to the Council: Do Not Confuse a Building with a Service</strong><br><p>Chair, councillors, thank you. I am speaking against the proposal to close two of this borough's four libraries, and I want to be careful about what I claim.</p><p><b>What the libraries are used for.</b> The Borough Research Unit counted visits at all four sites over twelve months. Of the 412,000 visits recorded, fewer than half involved borrowing a book at all. The rest were people using the computers, attending a class, bringing a child to a reading session, or sitting somewhere warm and quiet. If we judge a library by loans alone we will close the wrong buildings for the right-looking reasons.</p><p><b>Where the savings actually come from.</b> The report before you puts the saving at 340,000 dollars a year. I have read the appendix. Around 60 per cent of that figure is staff costs, and the same appendix notes that most of those staff would be redeployed rather than released. The genuine saving is therefore considerably smaller than the headline, though I accept it is not nothing.</p><p><b>The point I concede.</b> The two buildings proposed for closure are in poor repair, and the survey commissioned by the Estates Committee puts the cost of bringing them up to standard at 1.2 million dollars. That is a real number and I am not going to pretend otherwise. My argument is not that the buildings are fine. It is that closing them is not the only way of dealing with buildings that are not.</p><p><b>What I propose instead.</b> Three of our neighbours have moved smaller libraries into shared premises with a health centre or a community hall, keeping the service and shedding the building. The Association of Library Authorities reports that boroughs taking this route retained on average 80 per cent of their visits while cutting premises costs by about half.</p><p>I am not asking you to spend 1.2 million dollars. I am asking you not to confuse a building with a service. Thank you.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which of these costs is NOT given a figure anywhere in the speech?", "options": {"A": "The claimed annual saving from the closures", "B": "The annual running cost of a library in shared premises", "C": "The cost of bringing the two buildings up to standard", "D": "The share of the claimed saving made up of staff costs"}, "fig": "", "passage": "<strong>A Speech to the Council: Do Not Confuse a Building with a Service</strong><br><p>Chair, councillors, thank you. I am speaking against the proposal to close two of this borough's four libraries, and I want to be careful about what I claim.</p><p><b>What the libraries are used for.</b> The Borough Research Unit counted visits at all four sites over twelve months. Of the 412,000 visits recorded, fewer than half involved borrowing a book at all. The rest were people using the computers, attending a class, bringing a child to a reading session, or sitting somewhere warm and quiet. If we judge a library by loans alone we will close the wrong buildings for the right-looking reasons.</p><p><b>Where the savings actually come from.</b> The report before you puts the saving at 340,000 dollars a year. I have read the appendix. Around 60 per cent of that figure is staff costs, and the same appendix notes that most of those staff would be redeployed rather than released. The genuine saving is therefore considerably smaller than the headline, though I accept it is not nothing.</p><p><b>The point I concede.</b> The two buildings proposed for closure are in poor repair, and the survey commissioned by the Estates Committee puts the cost of bringing them up to standard at 1.2 million dollars. That is a real number and I am not going to pretend otherwise. My argument is not that the buildings are fine. It is that closing them is not the only way of dealing with buildings that are not.</p><p><b>What I propose instead.</b> Three of our neighbours have moved smaller libraries into shared premises with a health centre or a community hall, keeping the service and shedding the building. The Association of Library Authorities reports that boroughs taking this route retained on average 80 per cent of their visits while cutting premises costs by about half.</p><p>I am not asking you to spend 1.2 million dollars. I am asking you not to confuse a building with a service. Thank you.</p>", "qnum": "13"}, {"n": "15", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for the text type. Part 2: choose ONE task and write a paragraph of no more than 12 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nPaper Money: A Promise You Can Fold\n\nPaper money was first used in China around a thousand years ago. [1: A) This text sets out how it began and why it spread. B) Money, eh? Funny stuff when you think about it. C) You will not believe how old banknotes actually are.]\n\nThe origin. Merchants carrying heavy strings of coin [2: A) was deposited B) deposited C) depositing] them with trusted agents and took away a receipt. The receipts themselves [3: A) begins B) began C) beginning] to circulate, [4: A) because a piece of paper is easier to carry than a cart of metal. B) because a piece of paper are easier to carry than a cart of metal. C) a piece of paper being easier and all that.]\n\nTrust. A note is only worth what its holder believes it can be exchanged for, [5: A) so confidence in the issuer matters more than the paper itself. B) so confidence in the issuer matter more than the paper itself. C) so basically it is all in your head.] Governments that issued more notes than they could honour [6: A) has found B) have found C) have finding] that confidence disappears quickly.\n\nToday. Most money now [7: A) exist B) exists C) existing] only as entries in electronic records, and physical notes [8: A) make up a small and falling share of the total. B) makes up a small and falling share of the total. C) are, well, on the way out really.]", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences. This will be viewed by your future school.\n(1) Write a short informative text explaining how something people use every day came to work the way it does.\n(2) Write a short argumentative text about whether cash should be phased out in favour of electronic payment. Include your own opinion."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 English Drill 3</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
