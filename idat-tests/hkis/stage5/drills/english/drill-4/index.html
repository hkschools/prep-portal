<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 5 English Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>

  <header>
    <div class="brand">HK-Schools.com</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "5", VERSION = "ENG-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Answer all questions. Write your answers in the spaces provided."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Which transitional word or phrase results in a DIFFERENT meaning from the others?<br><br>The first trial was inconclusive; ___, the funders extended the study by a year.", "options": {"A": "as a result", "B": "consequently", "C": "conversely", "D": "therefore"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Correct the underlined word.<br><br>The authority insisted on <u>to inspect</u> the site before granting the licence.", "options": {"A": "to inspect", "B": "inspect", "C": "inspecting", "D": "inspected"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly.<br><br>Rarely ___ a result of this kind been reproduced so quickly.", "options": {"A": "has", "B": "a result has", "C": "have", "D": "did"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Which sentence makes the verb agree after Each of the three methods?", "options": {"A": "Each of the three methods produce a slightly different estimate.", "B": "Each of the three methods produces a slightly different estimate.", "C": "Each of the three methods are producing a slightly different estimate.", "D": "Each of the three methods have produced a slightly different estimate."}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which suffix means WITHOUT?", "options": {"A": "-ful", "B": "-less", "C": "-ish"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Fill in the blank.<br><br>Support for the proposal proved ___: it collapsed as soon as the costs were published.", "options": {"A": "entrenched", "B": "unanimous", "C": "substantial", "D": "ephemeral"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the saying below mean?<br><br>Asked about the missing funds, the director <i>stonewalled</i> for an hour.", "options": {"A": "To refuse to answer or cooperate", "B": "To explain at excessive length", "C": "To admit responsibility reluctantly", "D": "To blame a junior colleague"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word, but describes a WEAKER version of it?<br><br>The findings were <u>categorical</u>.", "options": {"A": "erroneous", "B": "suggestive", "C": "voluminous", "D": "conclusive"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Which body is credited with the estimate that a nine o'clock start would add eleven minutes to the average bus journey?", "options": {"A": "The Adolescent Sleep Institute", "B": "The school's parents", "C": "The County Transport Board", "D": "The speaker"}, "fig": "", "passage": "<strong>A Speech to the Parents' Meeting: A Later Start, and What It Would and Would Not Do</strong><br><p>Colleagues, parents, thank you for coming. I am proposing that this school move its start time from eight o'clock to nine, and I want to set out the case and its limits honestly.</p><p><b>What the research says.</b> The Adolescent Sleep Institute reviewed 44 studies of school start times. Where schools moved their start back by an hour or more, students gained an average of 34 minutes of sleep a night, which is less than the hour the day moved but is not nothing. Attendance improved in most of the studies reviewed, and reported daytime sleepiness fell in nearly all of them.</p><p><b>What the research does not say.</b> I want to be careful here. The same review found that effects on examination results were small and inconsistent: some schools saw a modest gain, several saw no change at all. Anyone telling you that a later start will raise this school's results is going beyond what the evidence supports, and I am not going to do that.</p><p><b>The objections.</b> Two are serious. The first is transport: the County Transport Board has confirmed that a nine o'clock start would place our buses in the peak flow, adding an estimated eleven minutes to the average journey. The second is families with children at more than one school, who would face two different start times. Neither objection is imaginary and neither is unanswerable.</p><p><b>What I am asking.</b> Not a decision tonight. I am asking for a one-year trial with the start moved to half past eight rather than nine, which the Transport Board advises would keep us clear of the worst of the peak, and for attendance and sleepiness to be measured before and after.</p><p>If the trial shows nothing, we will have lost a year of slightly later mornings. That seems to me a small wager. Thank you.</p>", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What does the speaker say the research does NOT support?", "options": {"A": "That students gain any extra sleep from a later start", "B": "That attendance improves when schools start later", "C": "That daytime sleepiness is a real problem for students", "D": "That a later start will raise this school's examination results"}, "fig": "", "passage": "<strong>A Speech to the Parents' Meeting: A Later Start, and What It Would and Would Not Do</strong><br><p>Colleagues, parents, thank you for coming. I am proposing that this school move its start time from eight o'clock to nine, and I want to set out the case and its limits honestly.</p><p><b>What the research says.</b> The Adolescent Sleep Institute reviewed 44 studies of school start times. Where schools moved their start back by an hour or more, students gained an average of 34 minutes of sleep a night, which is less than the hour the day moved but is not nothing. Attendance improved in most of the studies reviewed, and reported daytime sleepiness fell in nearly all of them.</p><p><b>What the research does not say.</b> I want to be careful here. The same review found that effects on examination results were small and inconsistent: some schools saw a modest gain, several saw no change at all. Anyone telling you that a later start will raise this school's results is going beyond what the evidence supports, and I am not going to do that.</p><p><b>The objections.</b> Two are serious. The first is transport: the County Transport Board has confirmed that a nine o'clock start would place our buses in the peak flow, adding an estimated eleven minutes to the average journey. The second is families with children at more than one school, who would face two different start times. Neither objection is imaginary and neither is unanswerable.</p><p><b>What I am asking.</b> Not a decision tonight. I am asking for a one-year trial with the start moved to half past eight rather than nine, which the Transport Board advises would keep us clear of the worst of the peak, and for attendance and sleepiness to be measured before and after.</p><p>If the trial shows nothing, we will have lost a year of slightly later mornings. That seems to me a small wager. Thank you.</p>", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "How does the sleep gained compare with the amount by which the day moved, in the studies reviewed?", "options": {"A": "Students gained rather less sleep than the amount the day was moved back", "B": "Students gained rather more sleep than the amount the day was moved back", "C": "Students gained exactly the amount the day was moved back", "D": "The review did not measure how much sleep students gained"}, "fig": "", "passage": "<strong>A Speech to the Parents' Meeting: A Later Start, and What It Would and Would Not Do</strong><br><p>Colleagues, parents, thank you for coming. I am proposing that this school move its start time from eight o'clock to nine, and I want to set out the case and its limits honestly.</p><p><b>What the research says.</b> The Adolescent Sleep Institute reviewed 44 studies of school start times. Where schools moved their start back by an hour or more, students gained an average of 34 minutes of sleep a night, which is less than the hour the day moved but is not nothing. Attendance improved in most of the studies reviewed, and reported daytime sleepiness fell in nearly all of them.</p><p><b>What the research does not say.</b> I want to be careful here. The same review found that effects on examination results were small and inconsistent: some schools saw a modest gain, several saw no change at all. Anyone telling you that a later start will raise this school's results is going beyond what the evidence supports, and I am not going to do that.</p><p><b>The objections.</b> Two are serious. The first is transport: the County Transport Board has confirmed that a nine o'clock start would place our buses in the peak flow, adding an estimated eleven minutes to the average journey. The second is families with children at more than one school, who would face two different start times. Neither objection is imaginary and neither is unanswerable.</p><p><b>What I am asking.</b> Not a decision tonight. I am asking for a one-year trial with the start moved to half past eight rather than nine, which the Transport Board advises would keep us clear of the worst of the peak, and for attendance and sleepiness to be measured before and after.</p><p>If the trial shows nothing, we will have lost a year of slightly later mornings. That seems to me a small wager. Thank you.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What exactly is the speaker asking the meeting to agree to?", "options": {"A": "An immediate move to a nine o'clock start", "B": "A one-year trial of a half past eight start, with attendance and sleepiness measured", "C": "A permanent change to a half past eight start", "D": "A study of transport costs before any change is considered"}, "fig": "", "passage": "<strong>A Speech to the Parents' Meeting: A Later Start, and What It Would and Would Not Do</strong><br><p>Colleagues, parents, thank you for coming. I am proposing that this school move its start time from eight o'clock to nine, and I want to set out the case and its limits honestly.</p><p><b>What the research says.</b> The Adolescent Sleep Institute reviewed 44 studies of school start times. Where schools moved their start back by an hour or more, students gained an average of 34 minutes of sleep a night, which is less than the hour the day moved but is not nothing. Attendance improved in most of the studies reviewed, and reported daytime sleepiness fell in nearly all of them.</p><p><b>What the research does not say.</b> I want to be careful here. The same review found that effects on examination results were small and inconsistent: some schools saw a modest gain, several saw no change at all. Anyone telling you that a later start will raise this school's results is going beyond what the evidence supports, and I am not going to do that.</p><p><b>The objections.</b> Two are serious. The first is transport: the County Transport Board has confirmed that a nine o'clock start would place our buses in the peak flow, adding an estimated eleven minutes to the average journey. The second is families with children at more than one school, who would face two different start times. Neither objection is imaginary and neither is unanswerable.</p><p><b>What I am asking.</b> Not a decision tonight. I am asking for a one-year trial with the start moved to half past eight rather than nine, which the Transport Board advises would keep us clear of the worst of the peak, and for attendance and sleepiness to be measured before and after.</p><p>If the trial shows nothing, we will have lost a year of slightly later mornings. That seems to me a small wager. Thank you.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which of these does the speaker NOT describe as a serious objection?", "options": {"A": "That buses would run in the peak flow", "B": "That some families have children at more than one school", "C": "That parents would object to paying for extra bus services", "D": "That the journey time would rise by about eleven minutes"}, "fig": "", "passage": "<strong>A Speech to the Parents' Meeting: A Later Start, and What It Would and Would Not Do</strong><br><p>Colleagues, parents, thank you for coming. I am proposing that this school move its start time from eight o'clock to nine, and I want to set out the case and its limits honestly.</p><p><b>What the research says.</b> The Adolescent Sleep Institute reviewed 44 studies of school start times. Where schools moved their start back by an hour or more, students gained an average of 34 minutes of sleep a night, which is less than the hour the day moved but is not nothing. Attendance improved in most of the studies reviewed, and reported daytime sleepiness fell in nearly all of them.</p><p><b>What the research does not say.</b> I want to be careful here. The same review found that effects on examination results were small and inconsistent: some schools saw a modest gain, several saw no change at all. Anyone telling you that a later start will raise this school's results is going beyond what the evidence supports, and I am not going to do that.</p><p><b>The objections.</b> Two are serious. The first is transport: the County Transport Board has confirmed that a nine o'clock start would place our buses in the peak flow, adding an estimated eleven minutes to the average journey. The second is families with children at more than one school, who would face two different start times. Neither objection is imaginary and neither is unanswerable.</p><p><b>What I am asking.</b> Not a decision tonight. I am asking for a one-year trial with the start moved to half past eight rather than nine, which the Transport Board advises would keep us clear of the worst of the peak, and for attendance and sleepiness to be measured before and after.</p><p>If the trial shows nothing, we will have lost a year of slightly later mornings. That seems to me a small wager. Thank you.</p>", "qnum": "13"}, {"n": "15", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for the text type. Part 2: choose ONE task and write a paragraph of no more than 12 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nThe Lighthouse: Warning by Light\n\nLighthouses have marked dangerous coasts for more than two thousand years. [1: A) This text explains how they work and how they changed. B) Lighthouses are just cool, no other word for it. C) Right then, lighthouses.]\n\nThe problem. A light that simply shone [2: A) were B) was C) being] of limited use, because a sailor could not tell one from another. The solution [3: A) were B) was C) being] to give each light its own pattern of flashes, [4: A) so that a navigator could identify the coast from the timing alone. B) so that a navigator could identifies the coast from the timing alone. C) a navigator identifying of the coast from timing.]\n\nThe lens. Early lights lost most of their output upwards and downwards. A stepped lens, developed in the 1820s, [5: A) gather B) gathers C) gathering] that stray light into a narrow beam, and the same design [6: A) is B) are C) being] still recognisable in lighthouses today.\n\nAutomation. Keepers [7: A) was replaced B) were replaced C) were replace] by automatic systems through the twentieth century, [8: A) and the last manned light in many countries was automated by the 1990s. B) and the last manned light in many countries were automated by the 1990s. C) and that was the end of that, sadly.]", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 12 sentences. This will be viewed by your future school.\n(1) Write a short informative text about a piece of technology that solved a specific practical problem. Explain the problem and how the solution worked.\n(2) Write a short argumentative text about whether historic buildings that no longer serve their original purpose should be preserved at public expense. Include your own opinion."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 5 English Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
