<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}

gical in her paintings.", "options": {"A": "childish", "B": "childishly", "C": "childless", "D": "childlike"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nOf the two ferry routes, the northern one is ____ because it shelters behind the islands.", "options": {"A": "the calmest", "B": "the calmer", "C": "calmest", "D": "more calmer"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is most nearly OPPOSITE in meaning to the word thrifty in the sentence below?\n\nAunt Mei was thrifty by habit, comparing prices at three stalls before she would spend a single dollar.", "options": {"A": "careful", "B": "generous", "C": "wealthy", "D": "extravagant"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nIf the climbers ____ an hour earlier, they would have reached the summit before the storm arrived.", "options": {"A": "had set out", "B": "set out", "C": "would set out", "D": "have set out"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the word that correctly completes the sentence.\n\nThe documentary gave a ____ account of daily life aboard the space station.", "options": {"A": "fascinate", "B": "fascinating", "C": "fascinated", "D": "fascination"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to the passage, why could a ship take more than a week to load before the 1950s?", "options": {"A": "Cranes could lift only one container at a time.", "B": "Ships had to wait in port for calm weather.", "C": "Every item had to be carried and packed into the hold by hand.", "D": "The metal boxes were too heavy to move quickly."}, "fig": "", "passage": "<strong>The Box That Changed the World</strong><br>A Slow and Costly Business\n\nUntil the 1950s, loading a cargo ship was slow, back-breaking work. Goods arrived at the docks in sacks, barrels and wooden crates of every shape and size. Gangs of dockworkers carried each item up the gangway and packed it into the hold by hand, fitting the pieces together like an enormous puzzle. A single ship could take more than a week to load, and it often spent longer tied up in port than it did sailing on the open sea. Cargo was frequently damaged, lost or stolen along the way, and insurance companies charged shipowners heavily for the risk. Moving goods cost so much that many products were simply never traded between countries at all: it made no sense to send inexpensive items abroad when the journey could double their price.\n\nOne Simple Idea\n\nIn 1956, an American trucking businessman named Malcom McLean tried something different. Instead of unloading the goods from his trucks piece by piece, he lifted the entire metal box off the back of each truck and set it straight onto a ship. That April, a converted tanker called the Ideal X sailed from Newark to Houston carrying fifty-eight of these boxes on its deck, and the container age had quietly begun. Because every container was built to exactly the same size, cranes could stack them quickly and neatly, like giant building blocks. A ship that once needed a week in port could now be loaded in less than a day, and the sealed boxes kept cargo safe from weather and theft. McLean was not a sailor or an engineer; he was a businessman who simply asked why cargo had to be handled so many times on its journey.\n\nNot an Instant Success\n\nSurprisingly, the world did not rush to copy the idea. Containers only save money when everyone uses the same system, and for years shipping lines argued about what the standard size of the box should be. Ports faced an expensive choice as well: to handle the new ships they had to buy giant cranes, lay out huge storage yards and dig deeper harbours, without any guarantee that the traffic would come. Many famous old ports hesitated, and some never recovered from waiting too long. Others gambled boldly on the box. Rotterdam, and later Hong Kong and Singapore, invested early in container terminals and grew into some of the busiest ports on Earth, while cities that clung to the old ways watched the ships sail past them.\n\nA World Rebuilt\n\nThe result, in the end, was dramatic. The cost of shipping goods plummeted, and factories on one side of the world could suddenly sell their products cheaply on the other. A toy made in one country could sit on a shelf on the far side of the planet for less than the cost of making the same toy nearby, and companies began to plan their whole business around the cheap, reliable movement of parts across oceans. Ports changed as well: instead of employing thousands of dockworkers, modern terminals rely on towering cranes operated by a few skilled drivers, guided by computers that track every box among tens of thousands. Today container ships criss-cross the oceans day and night, and almost everything in an ordinary home, from clothes and furniture to toys and televisions, has spent part of its life inside one of these plain steel boxes. Few inventions so simple have changed everyday life so much.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word plummeted as it is used in this sentence from the passage?\n\n'The cost of shipping goods plummeted, and factories on one side of the world could suddenly sell their products cheaply on the other.'", "options": {"A": "fell sharply", "B": "rose quickly", "C": "changed unpredictably", "D": "fell slightly"}, "fig": "", "passage": "<strong>The Box That Changed the World</strong><br>A Slow and Costly Business\n\nUntil the 1950s, loading a cargo ship was slow, back-breaking work. Goods arrived at the docks in sacks, barrels and wooden crates of every shape and size. Gangs  an American trucking businessman named Malcom McLean tried something different. Instead of unloading the goods from his trucks piece by piece, he lifted the entire metal box off the back of each truck and set it straight onto a ship. That April, a converted tanker called the Ideal X sailed from Newark to Houston carrying fifty-eight of these boxes on its deck, and the container age had quietly begun. Because every container was built to exactly the same size, cranes could stack them quickly and neatly, like giant building blocks. A ship that once needed a week in port could now be loaded in less than a day, and the sealed boxes kept cargo safe from weather and theft. McLean was not a sailor or an engineer; he was a businessman who simply asked why cargo had to be handled so many times on its journey.\n\nNot an Instant Success\n\nSurprisingly, the world did not rush to copy the idea. Containers only save money when everyone uses the same system, and for years shipping lines argued about what the standard size of the box should be. Ports faced an expensive choice as well: to handle the new ships they had to buy giant cranes, lay out huge storage yards and dig deeper harbours, without any guarantee that the traffic would come. Many famous old ports hesitated, and some never recovered from waiting too long. Others gambled boldly on the box. Rotterdam, and later Hong Kong and Singapore, invested early in container terminals and grew into some of the busiest ports on Earth, while cities that clung to the old ways watched the ships sail past them.\n\nA World Rebuilt\n\nThe result, in the end, was dramatic. The cost of shipping goods plummeted, and factories on one side of the world could suddenly sell their products cheaply on the other. A toy made in one country could sit on a shelf on the far side of the planet for less than the cost of making the same toy nearby, and companies began to plan their whole business around the cheap, reliable movement of parts across oceans. Ports changed as well: instead of employing thousands of dockworkers, modern terminals rely on towering cranes operated by a few skilled drivers, guided by computers that track every box among tens of thousands. Today container ships criss-cross the oceans day and night, and almost everything in an ordinary home, from clothes and furniture to toys and televisions, has spent part of its life inside one of these plain steel boxes. Few inventions so simple have changed everyday life so much.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Section: Writing. Part 1 is a drop-down editing task (choose the best option for each bracket); Part 2 is a free-written paragraph. On the real online test, Part 1 appears as drop-down menus inside the passage.", "label": "", "body": "", "hint": "Part 1: Read the passage and, for each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Part 2: Choose ONE of the two tasks and write a single paragraph of no more than 10 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option that makes the writing correct and clear.\n\nOn the last Saturday of term, my brother and I [1: A) signing up B) signed up C) signs up] for a beach clean-up at Turtle Cove. By mid-morning, dozens of sacks [2: A) had been carried B) had carried C) carrying] up to the collection point and sorted into bins for glass, plastic and metal. My own job was to search the rocks [3: A) carefully B) careful C) more careful] for tangled fishing line, which is dangerous [4: A) at B) to C) with] seabirds. [5: A) Because B) Although C) Unless] the sun was fierce all morning, hardly anyone stopped to rest. By noon the shoreline looked [6: A) kind of okay B) totally awesome C) spotless], and the organiser thanked each helper by name before we caught the bus home.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences: (1) Explain to a visitor how to use the buses or trains in your city to reach one famous place, describing the steps in a clear, sensible order. (2) Write about a time you helped a neighbour or a stranger, describing what happened and how you both felt afterwards."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you do best?", "options": {"A": "Playing sports and moving my body", "B": "Making art or music", "C": "Learning and remembering things at school", "D": "Making friends and getting along with people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What would you most like to get better at?", "options": {"A": "A sport or physical activity", "B": "Speaking in front of other people", "C": "A school subject that feels tricky", "D": "Making new friends more easily"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "How comfortable are you talking about your own feelings with someone you trust?", "options": {"A": "Very comfortable: I find it easy", "B": "Mostly comfortable: I can do it, even if I feel a little shy", "C": "I need some time first, then I can share", "D": "I like to keep my feelings to myself and think them through"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "What makes you happy?", "options": {"A": "Winning a game or competition", "B": "Learning something new that I did not know before", "C": "Making or building something myself", "D": "Helping someone who needed me"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "Rock climbing or another adventure sport", "B": "Joining a brand-new club at school",  {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The last slice of cake in the staff room was taken by one of three students. When asked, they said:\n\nBen: \"I did not take it.\"\nCarla: \"Ben took it.\"\nDan: \"I did not take it.\"\n\nEXACTLY ONE of the three statements is true. Who took the slice of cake?", "options": {"A": "Ben", "B": "Carla", "C": "Dan", "D": "It cannot be worked out from the information given"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Mia is exactly three times as old as her brother. In 4 years' time, Mia will be exactly twice as old as her brother. How old is Mia NOW?", "options": {"A": "12", "B": "4", "C": "6", "D": "24"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the figure. The first shape is changed into the second shape by a single rule made up of TWO changes happening together. The same rule, applied to the third shape, produces one of the four labelled shapes A to D. Which labelled shape completes the pattern?", "options": {"A": "Shape A", "B": "Shape B", "C": "Shape C", "D": "Shape D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"250\" viewBox=\"0 0 480 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"250\" fill=\"white\"/><text x=\"10\" y=\"20\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">A is to B, as C is to ?</text><polygon points=\"55.0,50.0 79.2,92.0 30.8,92.0\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"100\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><g transform=\"rotate(90 155 78)\"><polygon points=\"155.0,50.0 179.2,92.0 130.8,92.0\" fill=\"#14213A\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"206\" y=\"86\" font-size=\"22\" font-weight=\"bold\" fill=\"#333\">::</text><g transform=\"rotate(180 262 78)\"><polygon points=\"234,67 268,67 268,50 290,78 268,106 268,89 234,89\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"308\" y=\"86\" font-size=\"22\" fill=\"#C00\">&#8594;</text><text x=\"362\" y=\"90\" font-size=\"30\" font-weight=\"bold\" fill=\"#C00\">?</text><line x1=\"10\" y1=\"140\" x2=\"470\" y2=\"140\" stroke=\"#ccc\"/><text x=\"10\" y=\"162\" font-size=\"13\" font-weight=\"bold\" fill=\"#333\">Options:</text><g transform=\"rotate(270 60 198)\"><polygon points=\"32,187 66,187 66,170 88,198 66,226 66,209 32,209\" fill=\"#FFFFFF\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"60\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">A</text><g transform=\"rotate(270 152 198)\"><polygon points=\"124,187 158,187 158,170 180,198 158,226 158,209 124,209\" fill=\"#14213A\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"152\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">B</text><g transform=\"rotate(180 244 198)\"><polygon points=\"216,187 250,187 250,170 272,198 250,226 250,209 216,209\" fill=\"#14213A\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"244\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">C</text><g transform=\"rotate(90 336 198)\"><polygon points=\"336.0,170.0 360.2,212.0 311.8,212.0\" fill=\"#14213A\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"336\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "4"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"From next month, the harbour tram company will print a small map of its route on the back of every ticket, so that visitors who do not know the city can find the stop closest to their destination.\"\n\nPROPOSED ASSUMPTION: \"Printing maps on tickets costs the company less than installing large route maps at every tram stop.\"\n\nUsing only the information in the statement, is this assumption logical?", "options": {"A": "YES", "B": "NO"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"A community garden contains 22 planting boxes. Every box is rented to exactly one family, and each family rents either one box or three boxes. This year exactly 16 different families rent boxes in the garden.\"\n\nWhich one of the following MUST be true?", "options": {"A": "Exactly six of the families rent three boxes.", "B": "Some of the planting boxes are shared by two families.", "C": "The garden will need to add more boxes next year.", "D": "Exactly three of the families rent three boxes."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"A fruit stall at a weekend market sold 120 mangoes on Saturday and 90 mangoes on Sunday. The stallholder believes that Sunday's heavy rain kept many of his regular customers at home.\"<br><br>CONCLUSIONS:<br>(1) The stall sold 25 per cent fewer mangoes on Sunday than on Saturday.<br>(2) Next Saturday, the stall will sell about 120 mangoes.<br>(3) The heavy rain was the reason the stall sold fewer mangoes on Sunday.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (1) follows.", "B": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "C": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "D": "None of the three conclusions follows."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should the cinema add a late 11:30 p.m. film screening on Friday and Saturday nights?\"\n\nARGUMENTS:\n(1) Yes · a recent survey found that 78% of local residents enjoy watching films, and the cinema's booking app was downloaded 5,000 times last year.\n(2) Yes · midnight films feel exciting and grown-up, and everyone loves staying up late at the weekend.\n(3) No · the cinema is inside a shopping mall whose doors are locked by building management from midnight until 6 a.m., so the audience of a screening that starts at 11:30 p.m. would be unable to leave the building when the film ends.\n\nWhich argument is the STRONGEST?", "options": {"A": "Argument (1)", "B": "Argument (2)", "C": "Argument (3)"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every medicine kept in the locked cabinet requires a pharmacist's signature before it is issued.<br>2. No medicine that requires a pharmacist's signature may be issued by a trainee working alone.<br>3. The medicine Nurse Okafor collected was kept in the locked cabinet.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "The medicine Nurse Okafor collected required a pharmacist's signature before it was issued.", "B": "Every medicine requiring a pharmacist's signature is kept in the locked cabinet.", "C": "The medicine Nurse Okafor collected could not have been issued by a trainee working alone."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 (V5)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
