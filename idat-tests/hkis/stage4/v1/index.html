<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

um": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Read the sentence below. Is the connotation of the underlined word positive, negative, or neutral?\n\nThe new manager was <u>meticulous</u>, checking every figure twice before signing the report.", "options": {"A": "Positive", "B": "Negative", "C": "Neutral"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "A sentence is in the PASSIVE voice when the subject receives the action rather than performing it.\n\nWhich of the following sentences is written in the passive voice?", "options": {"A": "The festival organisers chose the winning design last month.", "B": "The festival organisers are choosing the winning design now.", "C": "The festival organisers will choose the winning design soon.", "D": "The winning design was chosen by the festival organisers last month."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.\n\nThe instructions were written so ____ that nobody could misunderstand them.", "options": {"A": "clearley", "B": "clearly", "C": "clearily", "D": "clearrly"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nThe architect ____ designs won the international prize will speak at our school next week.", "options": {"A": "who", "B": "which", "C": "whose", "D": "that"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Choose the word that means 'impossible to believe'.\n\nThe magician's final trick was so astonishing that the whole audience found it ____.", "options": {"A": "incredible", "B": "credible", "C": "creditable", "D": "discredited"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to the passage, why were Joseph Bazalgette's sewers built in London?", "options": {"A": "To carry clean drinking water into homes", "B": "To respond to severe pollution and smell from the River Thames", "C": "To protect fibre-optic internet cables", "D": "To copy the stone drains of ancient Rome"}, "fig": "", "passage": "<strong>The City Beneath the Streets</strong><br>When you walk through a modern city, you rarely think about what lies beneath your feet. The pavements look solid and ordinary. Yet under that surface runs a hidden city of pipes, cables, and tunnels that keeps the bright city above it alive. If this buried world stopped working for even one day, the city overhead would grind to a halt.\n\nThe Oldest Layer: Sewers\n\nThe oldest of these underground systems is the sewer. Ancient Rome built stone drains more than two thousand years ago to carry waste away from its crowded streets, and parts of those drains still survive today. For centuries afterwards, though, most cities forgot this lesson and simply let dirty water run in open gutters along the road. The result was filth and disease.\n\nThis changed dramatically in the 1850s, when engineers in London faced a crisis. The River Thames had become so polluted that a terrible smell, later called the Great Stink, drove members of Parliament out of their building beside the river. Something had to be done. In response, the engineer Joseph Bazalgette designed a vast network of brick sewers running for many kilometres beneath the streets. His tunnels were so carefully built, and so generously sized, that many of them are still carrying away the city's waste more than a hundred and fifty years later.\n\nWater Under Pressure\n\nWater pipes form a second underground layer. Clean water travels under pressure from distant reservoirs, sometimes many kilometres away, into the taps of homes, schools, and shops. Keeping that water moving requires careful engineering. Because a single broken pipe can flood a street within minutes and cut off thousands of people, engineers bury water lines deep underground. At that depth the pipes are protected both from the freezing temperatures of winter, which could crack them, and from the heavy traffic rumbling along the road above.\n\nThe Cable Maze\n\nThe newest layer is made of cables. Electricity, telephone lines, and the fibre-optic cables that carry the internet all share the crowded underground space. These cables are thin, but the services they provide are enormous. A single fibre-optic cable, no thicker than a garden hose, can carry the phone calls and messages of an entire district. Because they are so important, planners must map them with great care. A digging crew that accidentally slices through one cable can disconnect a whole neighbourhood in an instant, plunging homes into silence and darkness.\n\nMapping the Unseen\n\nManaging this buried world is a constant challenge, and the biggest problem is knowing where everything is. Different services were often laid in different years by different companies, each keeping its own records, so no single map shows everything that lies below a given street. When a city grows and needs new tunnels, engineers must thread them around the old ones like surgeons working carefully inside a crowded body, taking care not to cut anything vital by mistake.\n\nThe city beneath the streets is rarely seen and almost never thanked. Most people pass over it every day without a single thought. Yet without this hidden network of sewers, pipes, and cables, the shining city above could not function for even a single hour.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "In the section 'Mapping the Unseen', the word 'thread' is closest in meaning to which of the following?\n\n'...engineers must thread them around the old ones...'", "options": {"A": "cut into pieces", "B": "carefully guide or weave", "C": "a thin piece of cotton", "D": "quickly destroy"}, "fig": "", "passage": "<strong>The City Beneath the Streets</st tant challenge, and the biggest problem is knowing where everything is. Different services were often laid in different years by different companies, each keeping its own records, so no single map shows everything that lies below a given street. When a city grows and needs new tunnels, engineers must thread them around the old ones like surgeons working carefully inside a crowded body, taking care not to cut anything vital by mistake.\n\nThe city beneath the streets is rarely seen and almost never thanked. Most people pass over it every day without a single thought. Yet without this hidden network of sewers, pipes, and cables, the shining city above could not function for even a single hour.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "According to the passage, why do engineers bury water pipes deep underground?", "options": {"A": "To keep them away from the sewers built by Bazalgette", "B": "To make room for fibre-optic cables above them", "C": "To allow the Great Stink to escape safely", "D": "To protect them from freezing and from the heavy traffic above"}, "fig": "", "passage": "<strong>The City Beneath the Streets</strong><br>When you walk through a modern city, you rarely think about what lies beneath your feet. The pavements look solid and ordinary. Yet under that surface runs a hidden city of pipes, cables, and tunnels that keeps the bright city above it alive. If this buried world stopped working for even one day, the city overhead would grind to a halt.\n\nThe Oldest Layer: Sewers\n\nThe oldest of these underground systems is the sewer. Ancient Rome built stone drains more than two thousand years ago to carry waste away from its crowded streets, and parts of those drains still survive today. For centuries afterwards, though, most cities forgot this lesson and simply let dirty water run in open gutters along the road. The result was filth and disease.\n\nThis changed dramatically in the 1850s, when engineers in London faced a crisis. The River Thames had become so polluted that a terrible smell, later called the Great Stink, drove members of Parliament out of their building beside the river. Something had to be done. In response, the engineer Joseph Bazalgette designed a vast network of brick sewers running for many kilometres beneath the streets. His tunnels were so carefully built, and so generously sized, that many of them are still carrying away the city's waste more than a hundred and fifty years later.\n\nWater Under Pressure\n\nWater pipes form a second underground layer. Clean water travels under pressure from distant reservoirs, sometimes many kilometres away, into the taps of homes, schools, and shops. Keeping that water moving requires careful engineering. Because a single broken pipe can flood a street within minutes and cut off thousands of people, engineers bury water lines deep underground. At that depth the pipes are protected both from the freezing temperatures of winter, which could crack them, and from the heavy traffic rumbling along the road above.\n\nThe Cable Maze\n\nThe newest layer is made of cables. Electricity, telephone lines, and the fibre-optic cables that carry the internet all share the crowded underground space. These cables are thin, but the services they provide are enormous. A single fibre-optic cable, no thicker than a garden hose, can carry the phone calls and messages of an entire district. Because they are so important, planners must map them with great care. A digging crew that accidentally slices through one cable can disconnect a whole neighbourhood in an instant, plunging homes into silence and darkness.\n\nMapping the Unseen\n\nManaging this buried world is a constant challenge, and the biggest problem is knowing where everything is. Different services were often laid in different years by different companies, each keeping its own records, so no single map shows everything that lies below a given street. When a city grows and needs new tunnels, engineers must thread them around the old ones like surgeons working carefully inside a crowded body, taking care not to cut anything vital by mistake.\n\nThe city beneath the streets is rarely seen and almost never thanked. Most people pass over it every day without a single thought. Yet without this hidden network of sewers, pipes, and cables, the shining city above could not function for even a single hour.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "This writing section has two parts: an editing task and a paragraph-writing task.", "label": "", "body": "", "hint": "Part 1: For each numbered bracket, choose the ONE option that makes the sentence correct. Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences. Write in clear, complete sentences and check your spelling and grammar.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option that makes the sentence correct.\n\nLast Tuesday our whole class [1: A) go B) goes C) went] to the science centre for a special workshop on robots. A guide met us at the door and led us upstairs to a bright laboratory. The instructor, who [2: A) were B) was C) are] patient and cheerful, showed us how the little robots were programmed to move. We learned that each tiny machine [3: A) was controlled B) were controlled C) is controlling] by a set of simple commands typed on a laptop. I followed the steps [4: A) careful B) carefully C) carefuller], typing each line exactly as the screen showed, [5: A) because B) although C) unless] I had never coded before in my life. When my robot finally rolled forward and turned, I felt it was the [6: A) more exciting B) most exciting C) excitingest] thing I had done all term.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences: (1) Explain to a younger student how to pack a school bag the night before so that nothing is forgotten in the morning, giving clear steps in a sensible order. (2) Write about a time you learned a new skill, and describe how you felt before you started and how you felt once you had managed it."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you think you do best?", "options": {"A": "Sports and active games", "B": "Schoolwork, reading or thinking things through", "C": "Art, music or making things", "D": "Helping and working with other people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What would you most like to grow even stronger at knowing about yourself?", "options": {"A": "Knowing exactly what I am good at", "B": "Explaining how I am feeling", "C": "Noticing what I find tricky", "D": "Understanding why I make my choices"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What makes you feel happiest about yourself?", "options": {"A": "When I do well at something I worked at", "B": "When I understand something for the first time", "C": "When I make something I am proud of", "D": "When I help someone feel better"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "How important is it to you to know what you are good at and what you find tricky?", "options": {"A": "Not something I think about much", "B": "A little important", "C": "Quite important", "D": "Very important"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing this week, which kind of new would you reach for?", "options": {"A": "Something I might not be good at yet", "B": "Something a bit scary but exciting", "C": "Something new that I am fairly sure I can do", "D": "Something I would try once a friend joined me"}, =\"198\" text-anchor=\"middle\" font-size=\"15\">4.75 cm</text><text x=\"58\" y=\"115.0\" text-anchor=\"end\" font-size=\"15\">2.85 cm</text></svg>", "passage": "", "qnum": "10"}, {"n": "46", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "47", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the number sequence. The same rule connects every term. What number replaces the blank?\n\n3, 4, 7, 11, 18, 29, ___", "options": {"A": "47", "B": "40", "C": "36", "D": "58"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "In a certain code, the word MILK is written as PLON. Each letter is changed by the SAME rule. Using that rule, how is the word FROG written in this code?", "options": {"A": "GSPH", "B": "IURJ", "C": "COLD", "D": "JRUI"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A cinema charges $72 for an adult ticket. On Family Tuesday every ticket is sold at 25% off. A family buys 4 adult tickets at the Family Tuesday price. What is the total cost?", "options": {"A": "$288", "B": "$144", "C": "$216", "D": "$188"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The figure shows four labelled shapes. Three of them have at least one line of symmetry. Which ONE is the odd one out because it has NO line of symmetry? (A line of symmetry is a line that folds the shape exactly onto itself.)", "options": {"A": "Shape A", "B": "Shape B", "C": "Shape C", "D": "Shape D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><rect x=\"26\" y=\"28\" width=\"68\" height=\"68\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"180.0,28.0 212.3,51.5 200.0,89.5 160.0,89.5 147.7,51.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"300.0,28.0 329.4,45.0 329.4,79.0 300.0,96.0 270.6,79.0 270.6,45.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"386,96 454,82 444,28 410,42 386,62\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "4"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the figure. The arrow on the LEFT points UPWARD. After a single transformation it becomes the arrow on the RIGHT, which points DOWNWARD. Which transformation maps the left arrow onto the right arrow?", "options": {"A": "180 degrees", "B": "90 degrees clockwise", "C": "90 degrees anticlockwise", "D": "Reflection in a vertical mirror line"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"170\" viewBox=\"0 0 320 170\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"320\" height=\"170\" fill=\"white\"/><g transform=\"rotate(-90 75 80)\"><polygon points=\"37,65 83,65 83,42 113,80 83,118 83,95 37,95\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"75\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">original</text><text x=\"160\" y=\"85\" text-anchor=\"middle\" font-size=\"26\" fill=\"#C00\">&#8594;</text><g transform=\"rotate(90 245 80)\"><polygon points=\"207,65 253,65 253,42 283,80 253,118 253,95 207,95\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/></g><text x=\"245\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">after turning</text></svg>", "passage": "", "qnum": "5"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The school canteen has started serving a hot vegetarian dish every lunchtime, so that students who do not eat meat can still have a warm meal at school.\"\n\nPROPOSED ASSUMPTION: \"At least some students at the school do not eat meat.\"\n\nUsing only the information in the statement, is this assumption logical — YES or NO?", "options": {"A": "YES", "B": "NO"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every student who passed the school swimming test was awarded a blue badge. Priya was not awarded a blue badge.\"\n\nWhich one of the following MUST be true?", "options": {"A": "Priya is afraid of the water.", "B": "Priya did not pass the school swimming test.", "C": "Priya is the weakest swimmer in her year group.", "D": "Everyone awarded a blue badge passed the swimming test."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"In one Year 8 class of 30 students, a teacher recorded how many books each student read over the summer holidays. 18 students read three or more books, and the remaining 12 students read fewer than three books.\"\n\nCONCLUSIONS:\n(1) More than half of the students in this class read three or more books over the holidays.\n(2) Most teenagers in Hong Kong read three or more books over the summer holidays.\n\nUsing only the information in the statement, which conclusion(s) follow?", "options": {"A": "Only Conclusion 1 follows.", "B": "Only Conclusion 2 follows.", "C": "Both Conclusion 1 and Conclusion 2 follow.", "D": "Neither conclusion follows."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should the school move the start of the school day 30 minutes later, from 8:00 a.m. to 8:30 a.m.?\"\n\nARGUMENTS:\n(1) Yes — in a one-term trial of the later start, the school nurse recorded that the number of students arriving late fell by 40% and the number reporting tiredness in first period fell by half.\n(2) Yes — I would personally love an extra half-hour in bed each morning, and I am sure most students feel the same way.\n(3) No — most other schools in the city still begin at 8:00 a.m., so there is no reason for us to be different.\n\nWhich argument is the STRONGEST?", "options": {"A": "Argument 2", "B": "Argument 3", "C": "Argument 1"}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
