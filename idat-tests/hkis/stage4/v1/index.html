<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>IDAT HKIS: Stage 4 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "1";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "The hikers were absolutely famished after walking for nine hours without stopping to eat. In this sentence, \"famished\" most nearly means:", "options": {"A": "extremely hungry", "B": "frightened", "C": "lost", "D": "thirsty"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "Choose the correctly spelled plural to complete the sentence: \"The chef sliced three ripe ___ for the salad.\"", "options": {"A": "tomatos", "B": "tomato's", "C": "tomatos'", "D": "tomatoes"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the correct article: \"My uncle works as ___ honest lawyer in the city centre.\"", "options": {"A": "a", "B": "the", "C": "an", "D": "no article needed"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "Choose the correct verb: \"Each of the players ___ expected to bring a water bottle.\"", "options": {"A": "are", "B": "is", "C": "were", "D": "be"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Add a prefix to \"necessary\" to give it the opposite meaning. The result is:", "options": {"A": "unnecessary", "B": "disnecessary", "C": "innecessary", "D": "denecessary"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Read the sentence: \"When Maya gave the report to her teacher, she said it needed more examples.\" Grammatically, who or what does \"it\" most clearly refer to?", "options": {"A": "Maya", "B": "her teacher", "C": "the report", "D": "more examples"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Definition: a sentence is in the PASSIVE voice when the subject receives the action rather than performing it. Which sentence below is written in the passive voice?", "options": {"A": "The committee announced the results on Friday.", "B": "The committee will announce the results on Friday.", "C": "The committee is announcing the results on Friday.", "D": "The results were announced by the committee on Friday."}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Which word has the most NEGATIVE connotation while still meaning \"to look at someone\"?", "options": {"A": "gaze", "B": "glare", "C": "glance", "D": "observe"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "According to the passage, what made the Fresnel lens better than earlier lighthouse lights?", "options": {"A": "It used a fire that never needed any fuel.", "B": "It gathered scattered light into a single powerful beam.", "C": "It was the first lighthouse ever built.", "D": "It could only be seen from very close to shore."}, "fig": "", "passage": "<strong>How the Lighthouse Earns Its Keep</strong><br>For thousands of years, sailors faced the same deadly problem: how to find safe passage along a rocky coast in the dark. A single hidden reef could tear open the hull of a ship and send its crew and cargo to the bottom of the sea. Without any way to mark where the danger lay, captains had to choose between staying far out in open water, which wasted days, or creeping toward an unfamiliar shore and hoping for the best. The lighthouse was humanity&#x27;s answer to that danger, a fixed point of light that told a sailor, even on the blackest night, exactly where not to steer.<br><br>The earliest lighthouses were simply bonfires lit on hilltops near a harbour. The famous Pharos of Alexandria, built in Egypt more than two thousand years ago, used a fire at the top of a tall stone tower and was counted among the seven wonders of the ancient world. Travellers wrote that its light could be seen many kilometres out to sea, and for centuries it guided trading ships safely into one of the busiest ports of the ancient world. These early lights worked, but they had clear weaknesses. Wood was heavy and had to be hauled up the tower by hand, day after day. The flames could be smothered by rain or scattered by strong wind, and on a foggy night the glow barely reached the ships that needed it most. A light that failed in bad weather was of little use, because bad weather was exactly when ships were most likely to run aground.<br><br>The great breakthrough came in 1822, when a French engineer named Augustin-Jean Fresnel designed a new kind of lens. Instead of one thick, heavy piece of glass, the Fresnel lens used many thin rings of glass arranged in a careful pattern. Each ring caught light that would otherwise have spilled uselessly in every direction and bent it toward the same point, so that the rings together gathered scattered light into a single powerful beam. A lighthouse fitted with a Fresnel lens could warn ships from more than thirty kilometres away, far beyond the reach of any open fire, and it did so while burning only a fraction of the fuel. Within a few decades the new lenses had been installed in lighthouses all around the world.<br><br>A bright beam alone, however, was not enough. On a coast crowded with lights, how was a captain to know which lighthouse he was looking at? The answer was to give each lighthouse its own pattern of flashes, called a &quot;signature.&quot; One light might flash twice and then go dark for ten seconds; another might shine steadily for three seconds and then blink once. By timing how long the light stayed dark between flashes, an experienced captain could tell exactly which lighthouse he was passing, and therefore where along the coast his ship actually was. Printed lists of these signatures were carried on board so that any officer could match the pattern he saw to a point on his chart.<br><br>Today, satellite navigation guides most large vessels, pinpointing a ship&#x27;s position to within a few metres without anyone needing to watch the horizon. Many lighthouses have been switched off, automated, or turned into museums, and the keepers who once lived beside them are long gone. Yet along storm-battered coasts, a number of lighthouses still turn faithfully through the night. They stand as a steady reminder of the long human effort, stretching from a bonfire on a hill to a precise beam of light, to make the sea a little less dangerous.", "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "What was a weakness of the earliest hilltop bonfire lighthouses?", "options": {"A": "Their flashing signatures were too complicated for captains to read.", "B": "Their glass lenses were too heavy to lift into place.", "C": "They pinpointed a ship's position to within a few metres.", "D": "Someone had to haul heavy wood up the tower and the flames could be smothered by rain."}, "fig": "", "passage": "<strong>How the Lighthouse Earns Its Keep</strong><br>For thousands of years, sailors faced the same deadly problem: how to find safe passage along a rocky coast in the dark. A single hidden reef could tear open the hull of a ship and send its crew and cargo to the bottom of the sea. Without any way to mark where the danger lay, captains had to choose between staying far out in open water, which wasted days, or creeping toward an unfamiliar shore and hoping for the best. The lighthouse was humanity&#x27;s answer to that danger, a fixed point of light that told a sailor, even on the blackest night, exactly where not to steer.<br><br>The earliest lighthouses were simply bonfires lit on hilltops near a harbour. The famous Pharos of Alexandria, built in Egypt more than two thousand years ago, used a fire at the top of a tall stone tower and was counted among the seven wonders of the ancient world. Travellers wrote that its light could be seen many to one of the busiest ports of the ancient world. These early lights worked, but they had clear weaknesses. Wood was heavy and had to be hauled up the tower by hand, day after day. The flames could be smothered by rain or scattered by strong wind, and on a foggy night the glow barely reached the ships that needed it most. A light that failed in bad weather was of little use, because bad weather was exactly when ships were most likely to run aground.<br><br>The great breakthrough came in 1822, when a French engineer named Augustin-Jean Fresnel designed a new kind of lens. Instead of one thick, heavy piece of glass, the Fresnel lens used many thin rings of glass arranged in a careful pattern. Each ring caught light that would otherwise have spilled uselessly in every direction and bent it toward the same point, so that the rings together gathered scattered light into a single powerful beam. A lighthouse fitted with a Fresnel lens could warn ships from more than thirty kilometres away, far beyond the reach of any open fire, and it did so while burning only a fraction of the fuel. Within a few decades the new lenses had been installed in lighthouses all around the world.<br><br>A bright beam alone, however, was not enough. On a coast crowded with lights, how was a captain to know which lighthouse he was looking at? The answer was to give each lighthouse its own pattern of flashes, called a &quot;signature.&quot; One light might flash twice and then go dark for ten seconds; another might shine steadily for three seconds and then blink once. By timing how long the light stayed dark between flashes, an experienced captain could tell exactly which lighthouse he was passing, and therefore where along the coast his ship actually was. Printed lists of these signatures were carried on board so that any officer could match the pattern he saw to a point on his chart.<br><br>Today, satellite navigation guides most large vessels, pinpointing a ship&#x27;s position to within a few metres without anyone needing to watch the horizon. Many lighthouses have been switched off, automated, or turned into museums, and the keepers who once lived beside them are long gone. Yet along storm-battered coasts, a number of lighthouses still turn faithfully through the night. They stand as a steady reminder of the long human effort, stretching from a bonfire on a hill to a precise beam of light, to make the sea a little less dangerous.", "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "What is the author's main purpose in this passage?", "options": {"A": "To argue that all old lighthouses should be switched back on.", "B": "To describe a single dramatic shipwreck in detail.", "C": "To give step-by-step instructions for building a Fresnel lens.", "D": "To explain how lighthouses developed over time and why they mattered."}, "fig": "", "passage": "<strong>How the Lighthouse Earns Its Keep</strong><br>For thousands of years, sailors faced the same deadly problem: how to find safe passage along a rocky coast in the dark. A single hidden reef could tear open the hull of a ship and send its crew and cargo to the bottom of the sea. Without any way to mark where the danger lay, captains had to choose between staying far out in open water, which wasted days, or creeping toward an unfamiliar shore and hoping for the best. The lighthouse was humanity&#x27;s answer to that danger, a fixed point of light that told a sailor, even on the blackest night, exactly where not to steer.<br><br>The earliest lighthouses were simply bonfires lit on hilltops near a harbour. The famous Pharos of Alexandria, built in Egypt more than two thousand years ago, used a fire at the top of a tall stone tower and was counted among the seven wonders of the ancient world. Travellers wrote that its light could be seen many kilometres out to sea, and for centuries it guided trading ships safely into one of the busiest ports of the ancient world. These early lights worked, but they had clear weaknesses. Wood was heavy and had to be hauled up the tower by hand, day after day. The flames could be smothered by rain or scattered by strong wind, and on a foggy night the glow barely reached the ships that needed it most. A light that failed in bad weather was of little use, because bad weather was exactly when ships were most likely to run aground.<br><br>The great breakthrough came in 1822, when a French engineer named Augustin-Jean Fresnel designed a new kind of lens. Instead of one thick, heavy piece of glass, the Fresnel lens used many thin rings of glass arranged in a careful pattern. Each ring caught light that would otherwise have spilled uselessly in every direction and bent it toward the same point, so that the rings together gathered scattered light into a single powerful beam. A lighthouse fitted with a Fresnel lens could warn ships from more than thirty kilometres away, far beyond the reach of any open fire, and it did so while burning only a fraction of the fuel. Within a few decades the new lenses had been installed in lighthouses all around the world.<br><br>A bright beam alone, however, was not enough. On a coast crowded with lights, how was a captain to know which lighthouse he was looking at? The answer was to give each lighthouse its own pattern of flashes, called a &quot;signature.&quot; One light might flash twice and then go dark for ten seconds; another might shine steadily for three seconds and then blink once. By timing how long the light stayed dark between flashes, an experienced captain could tell exactly which lighthouse he was passing, and therefore where along the coast his ship actually was. Printed lists of these signatures were carried on board so that any officer could match the pattern he saw to a point on his chart.<br><br>Today, satellite navigation guides most large vessels, pinpointing a ship&#x27;s position to within a few metres without anyone needing to watch the horizon. Many lighthouses have been switched off, automated, or turned into museums, and the keepers who once lived beside them are long gone. Yet along storm-battered coasts, a number of lighthouses still turn faithfully through the night. They stand as a steady reminder of the long human effort, stretching from a bonfire on a hill to a precise beam of light, to make the sea a little less dangerous.", "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Which of the following is NOT mentioned in the passage?", "options": {"A": "The exact yearly wage that a lighthouse keeper was paid.", "B": "The Fresnel lens was designed in 1822.", "C": "Most large ships today use satellite navigation.", "D": "The Pharos of Alexandria was built in Egypt."}, "fig": "", "passage": "<strong>How the Lighthouse Earns Its Keep</strong><br>For thousands of years, sailors faced the same deadly problem: how to find safe passage along a rocky coast in the dark. A single hidden reef could tear open the hull of a ship and send its crew and cargo to the bottom of the sea. Without any way to mark where the danger lay, captains had to choose between staying far out in open water, which wasted days, or creeping toward an unfamiliar shore and hoping for the best. The lighthouse was humanity&#x27;s answer to that danger, a fixed point of light that told a sailor, even on the blackest night, exactly where not to steer.<br><br>The earliest lighthouses were simply bonfires lit on hilltops near a harbour. The famous Pharos of Alexandria, built in Egypt more than two thousand years ago, used a fire at the top of a tall stone tower and was counted among the seven wonders of the ancient world. Travellers wrote that its light could be seen many kilometres out to sea, and for centuries it guided trading ships safely into one of the busiest ports of the ancient world. These early lights worked, but they had clear weaknesses. Wood was heavy and had to be hauled up the tower by hand, day after day. The flames could be smothered by rain or scattered by strong wind, and on a foggy night the glow barely reached the ships that needed it most. A light that failed in bad weather was of little use, because bad weather was exactly when ships were most likely to run aground.<br><br>The great breakthrough came in 1822, when a French engineer named Augustin-Jean Fresnel designed a new kind of lens. Instead of one thick, heavy piece of glass, the Fresnel lens used many thin rings of glass arranged in a careful pattern. Each ring caught light that would otherwise have spilled uselessly in every direction and bent it toward the same point, so that the rings together gathered scattered light into a single powerful beam. A lighthouse fitted with a Fresnel lens could warn ships from more than thirty kilometres away, far beyond the reach of any open fire, and it did so while burning only a fraction of the fuel. Within a few decades the new lenses had been installed in lighthouses all around the world.<br><br>A bright beam alone, however, was not enough. On a coast crowded with lights, how was a captain to know which lighthouse he was looking at? The answer was to give each lighthouse its own pattern of flashes, called a &quot;signature.&quot; One light might flash twice and then go dark for ten seconds; another might shine steadily for three seconds and then blink once. By timing how long the light stayed dark between flashes, an experienced captain could tell exactly which lighthouse he was passing, and therefore where along the coast his ship actually was. Printed lists of these signatures were carried on board so that any officer could match the pattern he saw to a point on his chart.<br><br>Today, satellite navigation guides most large vessels, pinpointing a ship&#x27;s position to within a few metres without anyone needing to watch the horizon. Many lighthouses have been switched off, automated, or turned into museums, and the keepers who once lived beside them are long gone. Yet along storm-battered coasts, a  2, Paragraph", "body": "Write a single paragraph of no more than 10 sentences on ONE of the following.\nOption A (informative): Explain to a new student how to make the most of the school library.\nOption B (argumentative): Some people think students should not be given homework at weekends. Do you agree or disagree? Give your opinion and reasons.", "hint": "", "placeholder": "Type your Task 2 answer here…", "partA": "Write a single paragraph of no more than 10 sentences on ONE of the following.\nOption A (informative): Explain to a new student how to make the most of the school library.\nOption B (argumentative): Some people think students should not be given homework at weekends. Do you agree or disagree? Give your opinion and reasons.", "partB": ""}, {"n": 17, "type": "info", "title": "Listening &amp; Interview", "body": "<div class='info-body'>In the real test this section is delivered live: you listen to short clips and answer interview-style questions on camera. There is nothing to type or record here, the sample questions below show what to expect, so you can practise your answers out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Tell us about yourself and what you enjoy outside school.</li><li style='margin:7px 0'>Describe a goal you set and how you worked towards it.</li><li style='margin:7px 0'>Talk about an issue you care about and explain why.</li><li style='margin:7px 0'>What does resilience mean to you? Give an example from your own life.</li><li style='margin:7px 0'>Listen to a short talk, then answer questions on the main idea and details.</li></ul>"}, {"n": 18, "type": "info", "title": "Character", "body": "There are no right or wrong answers here. This little quiz is simply a mirror of who you are: how you like to learn, play, try new things and get along with others. Every answer you give points to a strength or a leaning, and all of them are good ways to be."}, {"n": 19, "type": let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
