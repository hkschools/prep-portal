<title>IDAT HKIS: Stage 4 (V4)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nSince it opened in 2019, the harbour museum ____ more than a million visitors.", "options": {"A": "welcomed", "B": "welcomes", "C": "will welcome", "D": "has welcomed"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the word proficient in the sentence below?\n\nAfter two years of lessons, Marco is now proficient enough at the piano to accompany the school choir.", "options": {"A": "enthusiastic", "B": "confident", "C": "skilled", "D": "patient"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Read the sentence below. Which noun does the underlined pronoun refer to?\n\nThe librarians moved the atlases to the lower shelves so that <u>they</u> would be easier for younger readers to reach.", "options": {"A": "the librarians", "B": "the atlases", "C": "the lower shelves", "D": "younger readers"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the word that correctly completes the sentence.\n\nDoctors say that even a short walk each day can have a positive ____ on a student's concentration.", "options": {"A": "effect", "B": "affect", "C": "affection", "D": "affects"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Which sentence is punctuated correctly?", "options": {"A": "The bus was crowded, we decided to walk home along the waterfront.", "B": "The bus was crowded so, we decided to walk home along the waterfront.", "C": "The bus was crowded so we decided, to walk home along the waterfront.", "D": "The bus was crowded, so we decided to walk home along the waterfront."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What does the underlined phrasal verb mean in the sentence below?\n\nAlthough the salary was generous, Ms Rivera <u>turned down</u> the job in the city because she did not want to move away from her family.", "options": {"A": "refused", "B": "reconsidered", "C": "accepted", "D": "delayed"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the reported sentence.\n\nThe coach said, \"We will train on the beach tomorrow.\"\n\nReported: The coach said that the team ____ on the beach the next day.", "options": {"A": "will train", "B": "had trained", "C": "would train", "D": "trains"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the word that correctly completes the sentence.\n\nThe judges praised the young inventor for the ____ of her water-saving design.", "options": {"A": "original", "B": "originality", "C": "originally", "D": "originate"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the correct passive form of the sentence below.\n\nThe committee will announce the winners of the design contest on Friday.", "options": {"A": "The winners of the design contest will be announced on Friday.", "B": "The winners of the design contest will announce on Friday.", "C": "The winners of the design contest are announced on Friday.", "D": "The winners of the design contest will be announcing on Friday."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the word eminent in the sentence below?\n\nThe lecture on ocean currents was given by an eminent scientist whose research is quoted all over the world.", "options": {"A": "elderly", "B": "about to arrive", "C": "mysterious", "D": "distinguished"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to the story, what task did Master Juno give Tam after his boast?", "options": {"A": "to polish the base of the master's own lantern", "B": "to make a lantern for the harbour master", "C": "to repair a lantern that had been damaged in a storm", "D": "to cut the glass panes for three new lanterns"}, "fig": "", "passage": "<strong>The Lantern-Maker's Apprentice</strong><br>In a narrow street of an old harbour town, where the smell of salt and tar drifted up from the docks, lived a lantern-maker named Master Juno. Fishermen said his lamps burned steadily through the wildest storms, and captains bound for distant ports would wait a whole season rather than buy a lantern from anyone else. His workshop was small and cluttered, its shelves crowded with coils of copper wire, panes of glass wrapped in soft cloth, and pots of polish worn smooth by years of use.\n\nHis apprentice, Tam, was quick-fingered and quicker to boast. He had learned to bend copper in his first month and to cut glass in his second, and he could not understand why his master lingered so long over every joint and seam. \"I could finish three lanterns in the time it takes you to finish one,\" Tam declared one morning, watching the old man smooth a single pane of glass for the third time.\n\nMaster Juno did not look up. He only smiled and set the pane gently into its frame. \"Then make one for the harbour master,\" he said. \"His ship sails on Friday.\"\n\nDelighted, Tam set to work at once. He bent the copper frame in an afternoon, humming as he worked. He cut the glass panes in an hour, barely pausing to check their edges. He fastened the joints with hurried dabs of solder, telling himself that nobody would ever look closely at the seams of a working lantern. By Wednesday his lantern hung gleaming in the shop window for every passer-by to admire, while Master Juno was still patiently polishing the base of his own.\n\nOn Friday, a gale swept in from the sea. Rain rattled the shutters, and the ropes sang in the wind all along the waterfront. The harbour master, needing to inspect his ship before she sailed, carried Tam's lantern to the end of the pier. Within minutes the wind had found a loose seam, pried it open, and snuffed the flame. In the dark, with spray stinging his face, he stumbled back along the slippery boards and made his way to the little shop, where Master Juno's lantern, finished only that morning, burned without a flicker in the doorway.\n\nTam saw the ruined lantern set down on the counter and waited for his master to scold him. He had already prepared his excuses: the storm had been unusually fierce; anyone's lantern might have failed on such a night. But Master Juno said nothing about the storm. Instead, the old man handed him a cloth and a pot of polish, sat him down at the bench, and worked beside him in silence until the loose seam was mended and the copper shone like new. Outside, the gale howled on; inside, there was only the small scrape of tools and the steady hiss of the lamp.\n\n\"The sea does not care how fast a thing was made,\" Master Juno said at last, holding the mended lantern up to the light. \"It only asks how well.\"\n\nTam turned those words over in his mind that night, and for many nights after. From that day, the neighbours noticed a change in the little shop. The boasting fell silent. Tam still worked quickly, for his fingers had lost none of their skill, but now he tested every seam twice and polished every joint until it satisfied not the shop window, but the storm. And the lanterns that left the shop, even the small ones signed with an apprentice's mark, never again went out in the wind.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word snuffed as it is used in this sentence from the story?\n\n\"...the wind had h the wildest storms, and captains bound for distant ports would wait a whole season rather than buy a lantern from anyone else. His workshop was small and cluttered, its shelves crowded with coils of copper wire, panes of glass wrapped in soft cloth, and pots of polish worn smooth by years of use.\n\nHis apprentice, Tam, was quick-fingered and quicker to boast. He had learned to bend copper in his first month and to cut glass in his second, and he could not understand why his master lingered so long over every joint and seam. \"I could finish three lanterns in the time it takes you to finish one,\" Tam declared one morning, watching the old man smooth a single pane of glass for the third time.\n\nMaster Juno did not look up. He only smiled and set the pane gently into its frame. \"Then make one for the harbour master,\" he said. \"His ship sails on Friday.\"\n\nDelighted, Tam set to work at once. He bent the copper frame in an afternoon, humming as he worked. He cut the glass panes in an hour, barely pausing to check their edges. He fastened the joints with hurried dabs of solder, telling himself that nobody would ever look closely at the seams of a working lantern. By Wednesday his lantern hung gleaming in the shop window for every passer-by to admire, while Master Juno was still patiently polishing the base of his own.\n\nOn Friday, a gale swept in from the sea. Rain rattled the shutters, and the ropes sang in the wind all along the waterfront. The harbour master, needing to inspect his ship before she sailed, carried Tam's lantern to the end of the pier. Within minutes the wind had found a loose seam, pried it open, and snuffed the flame. In the dark, with spray stinging his face, he stumbled back along the slippery boards and made his way to the little shop, where Master Juno's lantern, finished only that morning, burned without a flicker in the doorway.\n\nTam saw the ruined lantern set down on the counter and waited for his master to scold him. He had already ft cloth, and pots of polish worn smooth by years of use.\n\nHis apprentice, Tam, was quick-fingered and quicker to boast. He had learned to bend copper in his first month and to cut glass in his second, and he could not understand why his master lingered so long over every joint and seam. \"I could finish three lanterns in the time it takes you to finish one,\" Tam declared one morning, watching the old man smooth a single pane of glass for the third time.\n\nMaster Juno did not look up. He only smiled and set the pane gently into its frame. \"Then make one for the harbour master,\" he said. \"His ship sails on Friday.\"\n\nDelighted, Tam set to work at once. He bent the copper frame in an afternoon, humming as he worked. He cut the glass panes in an hour, barely pausing to check their edges. He fastened the joints with hurried dabs of solder, telling himself that nobody would ever look closely at the seams of a working lantern. By Wednesday his lantern hung gleaming in the shop window for every passer-by to admire, while Master Juno was still patiently polishing the base of his own.\n\nOn Friday, a gale swept in from the sea. Rain rattled the shutters, and the ropes sang in the wind all along the waterfront. The harbour master, needing to inspect his ship before she sailed, carried Tam's lantern to the end of the pier. Within minutes the wind had found a loose seam, pried it open, and snuffed the flame. In the dark, with spray stinging his face, he stumbled back along the slippery boards and made his way to the little shop, where Master Juno's lantern, finished only that morning, burned without a flicker in the doorway.\n\nTam saw the ruined lantern set down on the counter and waited for his master to scold him. He had already prepared his excuses: the storm had been unusually fierce; anyone's lantern might have failed on such a night. But Master Juno said nothing about the storm. Instead, the old man handed him a cloth and a pot of polish, sat him down at the bench, and worked beside him in silence until the loose seam was mended and the copper shone like new. Outside, the gale howled on; inside, there was only the small scrape of tools and the steady hiss of the lamp.\n\n\"The sea does not care how fast a thing was made,\" Master Juno said at last, holding the mended lantern up to the light. \"It only asks how well.\"\n\nTam turned those words over in his mind that night, and for many nights after. From that day, the neighbours noticed a change in the little shop. The boasting fell silent. Tam still worked quickly, for his fingers had lost none of their skill, but now he tested every seam twice and polished every joint until it satisfied not the shop window, but the storm. And the lanterns that left the shop, even the small ones signed with an apprentice's mark, never again went out in the wind.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Writing has two parts. Part 1 is an editing task with drop-down choices; Part 2 is a short paragraph.", "label": "", "body": "", "hint": "Part 1: Read the passage. For each numbered bracket, choose the letter (A, B or C) that makes the writing correct and clear. Part 2: Choose ONE of the two tasks and write your paragraph in the box. Write no more than 10 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option that makes the writing correct and clear.\n\nEarlier this spring, my sister and I [1: A) entered B) enters C) entering] a junior cooking contest at the community centre. Each pair of cooks [2: A) were handed B) is handing C) was handed] a basket of surprise ingredients and ninety minutes on the clock. [3: A) Because B) Although C) Unless] neither of us had ever cooked in front of strangers before, we still divided the jobs calmly: my sister sliced the vegetables [4: A) neat B) neater C) neatly] while I stirred the sauce. At the end, every dish had to [5: A) taste B) be tasted C) be tasting] by a panel of three judges. When our dumplings won second prize, we were [6: A) delighted B) totally over the moon C) sort of pleased], and we thanked the judges before hurrying home to tell our grandmother.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences: (1) Explain to a younger student how to look after a classroom plant or class pet for a week, describing the jobs to do and when to do each one. (2) Write about a time you made a mistake and what you learned from putting it right."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you do best?", "options": {"A": "Sports and moving my body", "B": "Drawing, music or making things", "C": "Reading, writing or working with numbers", "D": "Helping and cheering up other people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What do you want to do better?", "options": {"A": "Feeling braver about trying new things", "B": "Explaining my ideas to other people", "C": "Finishing tricky work on my own", "D": "Understanding how other people feel"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "How comfortable are you when a teacher tells you how you did on your work?", "options": {"A": "Very comfortable, I like hearing how I did", "B": "Mostly comfortable, I want to hear it even if it feels a bit strange", "C": "A little uncomfortable, I need a moment before I hear it", "D": "Quite uncomfortable, I would rather look over my work myself first"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "What makes you happy?", "options": {"A": "Doing well at a game or sport", "B": "Making something new that is all my own", "C": "Learning something interesting at school", "D": "Spending time with family and friends"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "A sport I have never played", "B": "Performing on a stage", "C": "Building or inventing something", "D": "Joining an activity with people I have not met before"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "How comfortable are you doing something you might not be good at yet?", "options": {"A": "Very comfortable, I love a challenge", "B": "Mostly comfortable, I feel a little nervous but I try anyway", "C": "A little uncomfortable, I like to watch someone else first", "D": "Quite uncomfortable, I prefer things I already know well"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "What makes you sad?", "options": {"A": "Losing a game I tried hard to win", "B": "When my plan does not work out", "C": "When I have to stop before I finish", "D": "When a friend is upset"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "What do you like the most?", "options": {"A": "Doing something I already know really well", "B": "Trying a harder level of something I can do", "C": "Trying something completely new", "D": "Making up my own version of an activity or game"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Look at these four things: a ball, an art set, a board game and a puzzle. Which would you most want to use?", "options": {"A": "Take the ball outside for an active game with others", "B": "Use the art set to make pictures or stories", "C": "Set up the board game for everyone to play", "D": "Work quietly on the puzzle until it is finished"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "What do you like the least?", "options": {"A": "Copying a picture exactly, line by line", "B": "Making something with no instructions at all", "C": "Doing the same activity again and again", "D": "Working on something with no one to talk to"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "How important is it to find your own way to solve a problem, even if it takes longer?", "options": {"A": "Not important, any way that works is fine", "B": "A little important, sometimes I like my own way", "C": "Quite important, I usually want to figure it out myself", "D": "Very important, finding my own way is the best part"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "When you get a new LEGO or model kit, what do you most want to do?", "options": {"A": "Follow the instructions and build exactly what is shown", "B": "Build it as shown first, then change it into something new", "C": "Skip the instructions and build my own idea", "D": "Build something together with someone else"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "Which of these do you think helps most when getting along with others?", "options": {"A": "Listening carefully to what others say", "B": "Sharing and taking turns", "C": "Saying kind words when someone is sad", "D": "Working together to finish a job"}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "How important is it to know how your friend is feeling?", "options": {"A": "Not so important, we can have fun together without talking about feelings", "B": "A little important, I notice big feelings", "C": "Quite important, I often check on my friends", "D": "Very important, I always want to know how they feel"}, "cnum": "14"}, {"n": "33", "type": "selfeval", "section": "Character", "stem": "How comfortable are you speaking in front of your whole class?", "options": {"A": "Very comfortable, I enjoy it", "B": "Mostly comfortable, I feel nervous but I still do it", "C": "A little uncomfortable, I am happier in small groups", "D": "Quite uncomfortable, I am happiest talking with one good friend"}, "cnum": "15"}, {"n": "34", "type": "selfeval", "section": "Character", "stem": "What do you do best when you are with friends?", "options": {"A": "Coming up with ideas for what to do", "B": "Making everyone laugh", "C": "Helping when someone is stuck or left out", "D": "Sticking by a friend when things go wrong"}, "cnum": "16"}, {"n": "35", "type": "info", "title": "Maths", "body": "Read each question carefully and choose the best answer."}, {"n": "36", "type": "mcq", "section": "Maths", "stem": "Solve for x:  −4x + 9 = 33", "options": {"A": "x = 6", "B": "x = −6", "C": "x = −10.5", "D": "x = 10.5"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "Evaluate 3a² − 5a when a = −2.", "options": {"A": "22", "B": "−2", "C": "2", "D": "−22"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "Expand and simplify:  −3(2x − 5) + 4x", "options": {"A": "−2x − 15", "B": "−2x − 5", "C": "−2x + 15", "D": "10x + 15"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "In a sale, the price of a jacket is decreased by 35%. The sale price is $52. What was the original price?", "options": {"A": "$70.20", "B": "$87", "C": "$148.57", "D": "$80"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "2/5 − 3/4 =", "options": {"A": "7/20", "B": "−7/20", "C": "−1", "D": "−1/20"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "Simplify:  (m⁴)³ ÷ m⁵", "options": {"A": "m⁷", "B": "m²", "C": "m¹⁷", "D": "m⁶⁰"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "Find the mean of:  −8, 5, −3, 12, −1", "options": {"A": "5", "B": "5.8", "C": "1", "D": "1.25"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "|−6.3| − |−9.8| =", "options": {"A": "3.5", "B": "−16.1", "C": "16.1", "D": "−3.5"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "Find the missing number:  ▢ × 0.56 = 4.0432", "options": {"A": "7.22", "B": "0.722", "C": "2.264192", "D": "72.2"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "In the triangle shown, two angles measure 47° and 68°, and the third angle is marked x. One side of the triangle is extended at that vertex, forming an exterior angle next to x on a straight line. Find the size of this exterior angle.", "options": {"A": "65°", "B": "115°", "C": "133°", "D": "112°"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"340\" height=\"240\" viewBox=\"0 0 340 240\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"340\" height=\"240\" fill=\"white\"/><polygon points=\"60,190 280,190 150,50\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"74\" y=\"180\" font-size=\"15\" fill=\"#333\">47°</text><text x=\"246\" y=\"180\" font-size=\"15\" fill=\"#333\">68°</text><text x=\"142\" y=\"74\" font-size=\"15\" font-weight=\"bold\" fill=\"#C00\">?</text><circle cx=\"60\" cy=\"190\" r=\"3\" fill=\"#1F3864\"/><circle cx=\"280\" cy=\"190\" r=\"3\" fill=\"#1F3864\"/><circle cx=\"150\" cy=\"50\" r=\"3\" fill=\"#1F3864\"/></svg>", "passage": "", "qnum": "10"}, {"n": "46", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "47", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Four students — Kira, Leon, Maya and Noah — sit in a row of four seats numbered 1 to 4 from left to right. Noah sits in the left-end seat. Maya sits immediately to the right of Leon. Kira does not sit next to Noah. Who sits in seat 3?", "options": {"A": "Kira", "B": "Leon", "C": "Maya", "D": "It cannot be determined from the information given"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Buses leave Green Hill for the ferry pier at 7:40 a.m., 8:00 a.m., 8:20 a.m. and 8:40 a.m., and the bus ride takes 25 minutes. Ferries leave the pier at 8:05 a.m., 8:35 a.m. and 9:05 a.m., and the crossing takes 30 minutes. Ada must arrive on the island no later than 9:15 a.m. What is the latest bus she can take from Green Hill?", "options": {"A": "7:40 a.m.", "B": "8:00 a.m.", "C": "8:20 a.m.", "D": "8:40 a.m."}, "fig": "", "passage": "", "qnum": "2"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Four words are listed below.\n\ngrating    gravity    grateful    gravel\n\nIf the four words are arranged in correct dictionary (alphabetical) order, which word comes THIRD?", "options": {"A": "grateful", "B": "grating", "C": "gravity", "D": "gravel"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "There are 32 students in a class. 19 of them are in the choir, 15 are in the drama club, and 6 are in neither group. How many students are in BOTH the choir and the drama club?", "options": {"A": "8", "B": "4", "C": "2", "D": "6"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The community sports centre has announced that from next month its outdoor tennis courts will stay open until 10 p.m. under newly installed floodlights.\"\n\nPROPOSED ASSUMPTION: \"Tennis is the most popular sport at the sports centre.\"\n\nUsing only the information in the statement, is this assumption logical?", "options": {"A": "YES", "B": "NO"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"A hotel shuttle bus has exactly 16 passenger seats. On its 6 p.m. trip on Friday, every seat was taken, exactly three more passengers stood in the aisle for the whole journey, and no other passengers were on board at any point.\"\n\nWhich one of the following MUST be true?", "options": {"A": "There were exactly 19 passengers on that 6 p.m. trip.", "B": "The three standing passengers had to stand because they boarded after all the seats were taken.", "C": "The 6 p.m. trip carries more passengers than any other trip the bus makes that day.", "D": "The bus was carrying more passengers than it is legally allowed to carry."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"A community library counted its visitors during one week in July. 800 people visited during that week, which was 200 more than the number of visitors in the same week last year.\"<br><br>CONCLUSIONS:<br>(1) More than 3,000 people visited the library in July this year.<br>(2) The library attracted more visitors this year because it extended its opening hours.<br>(3) During that week last year, 600 people visited the library.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (1) follows.", "B": "Only conclusion (3) follows.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "None of the three conclusions follows."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS:\n• Every lifeguard at the swimming pool holds a first-aid certificate.\n• Some of the lifeguards at the swimming pool are university students.\n• All of the lifeguards at the swimming pool are at least 17 years old.\n\nWhich one of the following conclusions does NOT follow from these facts?", "options": {"A": "No lifeguard at the swimming pool is under 17 years old.", "B": "Some university students at the swimming pool hold a first-aid certificate.", "C": "Every university student at the swimming pool holds a first-aid certificate."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should the district lower the speed limit to 30 km/h on all residential streets?\"<br><br>Which of the following is the STRONGEST argument, judged only by the quality of its reasoning?", "options": {"A": "No, drivers already have enough restrictions to think about, and adding another limit would simply be one more rule that nobody pays much attention to anyway.", "B": "Yes, the transport department monitored twelve residential districts for two years after the limit was lowered and recorded a fall of about 35 per cent in collisions causing injury, with average journey times rising by under one minute.", "C": "No, I drive through those streets every day and I have never once seen an accident there, so the current limit is clearly working perfectly well."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 (V4)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
