<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 4 (V2)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmXlzvpnHvxI5ILdACyHHZv8HWfNQ08pCP27GmmluJ7lUGiou1izR4e7Gs8LxKLtgo/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "2";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the correct article to complete the sentence.\n\nMy uncle works as ___ engineer at a company that builds bridges across the harbour.", "options": {"A": "an", "B": "a", "C": "the", "D": "(no article needed)"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?\n\nThe coach gave a brief talk before the match.", "options": {"A": "loud", "B": "short", "C": "boring", "D": "important"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nEach of the students ___ a laptop for the online lesson.", "options": {"A": "are needing", "B": "have needed", "C": "needs", "D": "need"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "What does the underlined pronoun refer to?\n\nMaya handed the report to her teacher because it was finally complete.", "options": {"A": "Maya", "B": "the teacher", "C": "the lesson", "D": "the report"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Two scientists each wrote their own report. Choose the option with correct apostrophe use.", "options": {"A": "The two scientist's reports were published last week.", "B": "The two scientists' reports were published last week.", "C": "The two scientists report's were published last week.", "D": "The two scientist's report's were published last week."}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word famished in the sentence below?\n\nAfter the long hike with no lunch, the children were absolutely famished by the time they reached camp.", "options": {"A": "extremely hungry", "B": "exhausted", "C": "frightened", "D": "cheerful"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Read the definition, then answer the question.\n\nIn a PASSIVE sentence, the action is done TO the grammatical subject, and the doer (if named) appears in a \"by\" phrase.\n\nIn the sentence below, what is the grammatical subject?\n\n\"The new proposal was reviewed carefully by the committee.\"", "options": {"A": "the committee", "B": "carefully", "C": "reviewed", "D": "the new proposal"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Add a prefix to the word \"necessary\" so that it means \"NOT necessary\". Which prefix is correct?", "options": {"A": "im-", "B": "dis-", "C": "un-", "D": "ir-"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Choose the correct verb form to complete the sentence.\n\nThe team succeeded in ___ the bridge ahead of schedule.", "options": {"A": "completing", "B": "complete", "C": "to complete", "D": "completes"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "Choose the option that best completes the analogy.\n\nparched is to thirsty as exhausted is to ___", "options": {"A": "sleepy", "B": "awake", "C": "lazy", "D": "tired"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "According to the passage, what is the gnomon?", "options": {"A": "The imaginary line around which Earth spins", "B": "The thin blade or rod that casts a shadow", "C": "The flat surface marked with hour lines", "D": "The angle that depends on latitude"}, "fig": "", "passage": "<strong>How the Sundial Told Time</strong><br>Long before clocks had hands or screens, people measured the day by watching shadows. The sundial, one of the oldest timekeeping tools, turns the steady journey of the sun into a way of reading the hour. Its design is simple, yet the science behind it is surprisingly precise.<br><br>A sundial has two main parts. The first is the dial face, a flat surface marked with lines for the hours. The second is the gnomon, a thin blade or rod that stands upright and casts a shadow across the face. As the sun moves from east to west during the day, the shadow of the gnomon swings slowly around the dial, pointing to a different hour line as the hours pass. In the morning the shadow falls to the west; by late afternoon it stretches toward the east.<br><br>For a sundial to keep accurate time, its gnomon cannot simply point straight up. It must be tilted so that it lines up with the Earth&#x27;s axis, the imaginary line around which our planet spins. This tilt depends on how far north or south the sundial sits. A sundial built for Hong Kong would have its gnomon set at a different angle from one built for London, because the two cities lie at different latitudes.<br><br>Sundials do have limits. They cannot tell time on a cloudy day or at night, when there is no sunlight to cast a shadow. They also do not adjust for daylight saving time, and they can run slightly fast or slow at certain points in the year. Even so, a well-made sundial can match a modern clock within a few minutes.<br><br>Today sundials are mostly decorative, found in gardens and parks. Yet they remain a quiet reminder that for thousands of years, humans learned to read time from nothing more than sunlight and a shadow.", "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word precise as it is used in the first paragraph?\n\n\"...yet the science behind it is surprisingly precise.\"", "options": {"A": "exact", "B": "old", "C": "simple", "D": "complicated"}, "fig": "", "passage": "<strong>How the Sundial Told Time</strong><br>Long before clocks had hands or screens, people measured the day by watching shadows. The sundial, one of the oldest timekeeping tools, turns the steady journey of the sun into a way of reading the hour. Its design is simple, yet the science behind it is surprisingly precise.<br><br>A sundial has two main parts. The first is the dial face, a flat surface marked with lines for the hours. The second is the gnomon, a thin blade or rod that stands upright and casts a shadow across the face. As the sun moves from east to west during the day, the shadow of the gnomon swings slowly around the dial, pointing to a different hour line as the hours pass. In the morning the shadow falls to the west; by late afternoon it stretches toward the east.<br><br>For a sundial to keep accurate time, its gnomon cannot simply point straight up. It must be tilted so that it lines up with the Earth&#x27;s axis, the imaginary line around which our planet spins. This tilt depends on how far north or south the sundial sits. A sundial built for Hong Kong would have its gnomon set at a different angle from one built for London, because the two cities lie at different latitudes.<br><br>Sundials do have limits. They cannot tell time on a cloudy day or at night, when there is no sunlight to cast a shadow. They also do not adjust for daylight saving time, and they can run slightly fast or slow at certain points in the year. Even so, a well-made sundial can match a modern clock within a few minutes.<br><br>Today sundials are mostly decorative, found in gardens and parks. Yet they remain a quiet reminder that for thousands of years, humans learned to read time from nothing more than sunlight and a shadow.", "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Why must a sundial's gnomon be tilted rather than point straight up?", "options": {"A": "So that it can follow the sun as it physically moves across the sky", "B": "So that it can be seen on a cloudy day", "C": "So that it lines up with the Earth's axis", "D": "So that it can adjust for daylight saving time"}, "fig": "", "passage": "<strong>How the Sundial Told Time</strong><br>Long before clocks had hands or screens, people measured the day by watching shadows. The sundial, one of the oldest timekeeping tools, turns the steady journey of the sun into a way of reading the hour. Its design is simple, yet the science behind it is surprisingly precise.<br><br>A sundial has two main parts. The first is the dial face, a flat surface marked with lines for the hours. The second is the gnomon, a thin blade or rod that stands upright and casts a shadow across the face. As the sun moves from east to west during the day, the shadow of the gnomon swings slowly around the dial, pointing to a different hour line as the hours pass. In the morning the shadow falls to the west; by late afternoon it stretches toward the east.<br><br>For a sundial to keep accurate time, its gnomon cannot simply point straight up. It must be tilted so that it lines up with the Earth&#x27;s axis, the imaginary line around which our planet spins. This tilt depends on how far north or south the sundial sits. A sundial built for Hong Kong would have its gnomon set at a different angle from one built for London, because the two cities lie at different latitudes.<br><br>Sundials do have limits. They cannot tell time on a cloudy day or at night, when there is no sunlight to cast a shadow. They also do not adjust for daylight saving time, and they can run slightly fast or slow at certain points in the year. Even so, a well-made sundial can match a modern clock within a few minutes.<br><br>Today sundials are mostly decorative, found in gardens and parks. Yet they remain a quiet reminder that for thousands of years, humans learned to read time from nothing more than sunlight and a shadow.", "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "Which of the following is NOT mentioned in the passage as a limitation of sundials?", "options": {"A": "They cannot tell time at night.", "B": "They do not adjust for daylight saving time.", "C": "They can run slightly fast or slow during the year.", "D": "They are too expensive for most people to own."}, "fig": "", "passage": "<strong>How the Sundial Told Time</strong><br>Long before clocks had hands or screens, people measured the day by watching shadows. The sundial, one of the oldest timekeeping tools, turns the steady journey of the sun into a way of reading the hour. Its design is simple, yet the science behind it is surprisingly precise.<br><br>A sundial has two main parts. The first is the dial face, a flat surface marked with lines for the hours. The second is the gnomon, a thin blade or rod that stands upright and casts a shadow across the face. As the sun moves from east to west during the day, the shadow of the gnomon swings slowly around the dial, pointing to a different hour line as the hours pass. In the morning the shadow falls to the west; by late afternoon it stretches toward the east.<br><br>For a sundial to keep accurate time, its gnomon cannot simply point straight up. It must be tilted so that it lines up with the Earth&#x27;s axis, the imaginary line around which our planet spins. This tilt depends on how far north or south the sundial sits. A sundial built for Hong Kong would have its gnomon set at a different angle from one built for London, because the two cities lie at different latitudes.<br><br>Sundials do have limits. They cannot tell time on a cloudy day or at night, when there is no sunlight to cast a shadow. They also do not adjust for daylight saving time, and they can run slightly fast or slow at certain points in the year. Even so, a well-made sundial can match a modern clock within a few minutes.<br><br>Today sundials are mostly decorative, found in gardens and parks. Yet they remain a quiet reminder that for thousands of years, humans learned to read time from nothing more than sunlight and a shadow.", "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "What is the author's main purpose in writing this passage?", "options": {"A": "To persuade readers to buy a sundial for their garden", "B": "To explain how a sundial works and what its limits are", "C": "To tell an entertaining story about an inventor", "D": "To compare Hong Kong and London as cities"}, "fig": "", "passage": "<strong>How the Sundial Told Time</strong><br>Long before clocks had hands or screens, people measured the day by watching shadows. The sundial, one of the oldest timekeeping tools, turns the steady journey of the sun into a way of reading the hour. Its design is simple, yet the science behind it is surprisingly precise.<br><br>A sundial has two main parts. The first is the dial face, a flat surface marked with lines for the hours. The second is the gnomon, a thin blade or rod that stands upright and casts a shadow across the face. As the sun moves from east to west during the day, the shadow of the gnomon swings slowly around the dial, pointing to a different hour line as the hours pass. In the morning the shadow falls to the west; by late afternoon it stretches toward the east.<br><br>For a sundial to keep accurate time, its gnomon cannot simply point straight up. It must be tilted so that it lines up with the Earth&#x27;s axis, the imaginary line around which our planet spins. This tilt depends on how far north or south the sundial sits. A sundial built for Hong Kong would have its gnomon set at a different angle from one built for London, because the two cities lie at different latitudes.<br><br>Sundials do have limits. They cannot tell time on a cloudy day or at night, when there is no sunlight to cast a shadow. They also do not adjust for daylight saving time, and they can run slightly fast or slow at certain points in the year. Even so, a well-made sundial can match a modern clock within a few minutes.<br><br>Today sundials are mostly decorative, found in gardens and parks. Yet they remain a quiet reminder that for thousands of years, humans learned to read time from nothing more than sunlight and a shadow.", "qnum": 15}, {"n": 17, "type": "writing", "section": "English Writing", "intro": "For this task, choose ONE of the two prompts below. Plan a few ideas before you begin.", "label": "", "body": "Option 1 (Informative): Explain how a young person could spend a free Saturday in a way that is both useful and enjoyable. Describe what they would do and why it is a good use of the day.\n\nOption 2 (Argumentative): Some people think students should not be given homework on weekends. What is your opinion? Give your view and support it with clear reasons.", "hint": "Choose ONE option. Write one paragraph of no more than 10 sentences.", "placeholder": "Type your response here…", "partA": "Option 1 (Informative): Explain how a young person could spend a free Saturday in a way that is both useful and enjoyable. Describe what they would do and why it is a good use of the day.\n\nOption 2 (Argumentative): Some people think students should not be given homework on weekends. What is your opinion? Give your view and support it with clear reasons.", "partB": ""}, {"n": 18, "type": "info", "title": "Listening &amp; Interview", "body": "<div class='info-body'>In the real test this section is delivered live: you listen to short clips and answer interview-style questions on camera. There is nothing to type or record here, the sample questions below show what to expect, so you can practise your answers out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Tell us about yourself and what you enjoy outside school.</li><li style='margin:7px 0'>Describe a goal you set and how you worked towards it.</li><li style='margin:7px 0'>Talk about an issue you care about and explain why.</li><li style='margin:7px 0'>What does resilience mean to you? Give an example from your own life.</li><li style='margin:7px 0'>Listen to a short talk, then answer questions on the main idea and details.</li></ul>"}, {"n": 19, "type": "info", "title": "Character", "body": "There are no right or wrong answers in this test. Every choice you made simply mirrors who you are right now, what you enjoy, what you find easy, and how you like to do things. All of these qualities are strengths or leanings, never something to fix, so read your portrait as a friendly picture of yourself, not a score."}, {"n": 20, "type": "selfeval", "section": "Character", "stem": "What do you think you do best?", "options": {"A": "Sports and moving my body", "B": "Reading, writing or figuring things out", "C": "Drawing, music or the arts", "D": "Helping and working with others"}, "fig": "", "passage": null, "cnum": 1}, {"n": 21, "type": "selfeval", "section": "Character", "stem": "When you finish a piece of work, what do you usually notice first?", "options": {"A": "The parts I did well", "B": "The parts I could do better next time", "C": "How long it took me", "D": "How my teacher or friends will feel about it"}, "fig": "", "passage": null, "cnum": 2}, {"n": 22, "type": "selfeval", "section": "Character", "stem": "What do you most want to get better at?", "options": {"A": "A sport or physical skill", "B": "A school subject", "C": "An art, music or creative skill", "D": "Getting along with people"}, "fig": "", "passage": null, "cnum": 3}, {"n": 23, "type": "selfeval", "section": "Character", "stem": "What makes you feel proud of yourself?", "options": {"A": "Doing well at a game or sport", "B": "Solving a hard problem on my own", "C": "Making something nobody has seen before", "D": "Helping a friend feel better"}, "fig": "", "passage": null, "cnum": 4}, {"n": 24, "type": "selfeval", "section": "Character", "stem": "How much do you like thinking about what you are good at?", "options": {"A": "Not at all", "B": "A little", "C": "Quite a lot", "D": "A great deal"}, "fig": "", "passage": null, "cnum": 5}, {"n": 25, "type": "selfeval", "section": "Character", "stem": "When you have a strong feeling, how do you usually notice it?", "options": {"A": "I notice it quickly inside myself", "B": "I work it out after a while", "C": "Someone else points it out to me", "D": "I show it more than I think about it"}, "fig": "", "passage": null, "cnum": 6}, {"n": 26, "type": "selfeval", "section": "Character", "stem": "Which of these is hardest for you to be sure about?", "options": {"A": "How well I did on a task", "B": "How others see me", "C": "How I am feeling that day", "D": "What I want to do next"}, "fig": "", "passage": null, "cnum": 7}, {"n": 27, "type": "selfeval", "section": "Character", "stem": "If you were allowed to try one new thing this week, which would you pick?", "options": {"A": "A sport or activity I have never done", "B": "A harder level in a subject I know", "C": "Performing or showing my work to others", "D": "A project where I am not sure it will work"}, "fig": "", "passage": null, "cnum": 8}, {"n": 28, "type": "selfeval", "section": "Character", "stem": "When something is hard, what do you usually do?", "options": {"A": "Keep trying on my own", "B": "Try a different way", "C": "Ask someone for help", "D": "Take a break and come back to it"}, "fig": "", "passage": null, "cnum": 9}, {"n": 29, "type": "selfeval", "section": "Character", "stem": "How do you feel about trying something you might get wrong?", "options": {"A": "Totally fine", "B": "Mostly fine", "C": "A bit unsure", "D": "I would rather be sure first"}, "fig": "", "passage": null, "cnum": 10}, {"n": 30, "type": "selfeval", "section": "Character", "stem": "How do you feel when a plan changes suddenly?", "options": {"A": "Excited, I like surprises", "B": "Fine, I just go with it", "C": "A bit unsure at first, then okay", "D": "I prefer to keep to the first plan"}, "fig": "", "passage": null, "cnum": 11}, {"n": 31, "type": "selfeval", "section": "Character", "stem": "Which would you least like to do?", "options": {"A": "Try a sport I have never played", "B": "Speak in front of the whole class", "C": "Start a task with no instructions", "D": "Try a food I have never tasted"}, "fig": "", "passage": null, "cnum": 12}, {"n": 32, "type": "selfeval", "section": "Character", "stem": "How important is it to you to try new and challenging things?", "options": {"A": "Not important", "B": "A little important", "C": "Quite important", "D": "Very important"}, "fig": "", "passage": null, "cnum": 13}, {"n": 33, "type": "selfeval", "section": "Character", "stem": "You are offered two paths on a trip: one you know and one you have never taken. Which do you choose?", "options": {"A": "The new path, always", "B": "The new path if a friend comes too", "C": "The path I know, it feels safer", "D": "I would ask which is best, then decide"}, "fig": "", "passage": null, "cnum": 14}, {"n": 34, "type": "selfeval", "section": "Character", "stem": "Imagine you are given a ball, a paintbrush, a notebook, a board game and a puzzle. What would you most want to do?", "options": {"A": "Play with the ball outside", "B": "Paint or draw something", "C": "Make up a story or comic in the notebook", "D": "Solve the puzzle or play the game"}, "fig": "", "passage": null, "cnum": 15}, {"n": 35, "type": "selfeval", "section": "Character", "stem": "When you have to solve a problem, what do you like to do most?", "options": {"A": "Think of a brand new idea", "B": "Improve an idea someone already had", "C": "Spot a pattern or a clue", "D": "Follow clear steps that work"}, "fig": "", "passage": null, "cnum": 16}, {"n": 36, "type": "selfeval", "section": "Character", "stem": "Which of these do you think you do best?", "options": {"A": "Come up with unusual ideas", "B": "Make a messy idea neat and clear", "C": "Find the missing piece in a puzzle", "D": "Build something step by step"}, "fig": "", "passage": null, "cnum": 17}, {"n": 37, "type": "selfeval", "section": "Character", "stem": "What kind of task makes you happiest?", "options": {"A": "One with lots of answers to invent", \" y=\"95.0\" font-size=\"12\" font-family=\"Arial\">4.2 cm</text></svg>", "passage": null, "qnum": 25}, {"n": 59, "type": "info", "title": "Global Knowledge &amp; Logic", "body": "Logic and critical-thinking questions."}, {"n": 60, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the sequence below. The same two-step rule is applied again and again across the whole sequence. What number replaces the blank?\n\n84, 42, 48, 24, 30, 15, ___", "options": {"A": "21", "B": "9", "C": "30", "D": "8"}, "fig": "", "passage": null, "qnum": 26}, {"n": 61, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Which word, when added at the FRONT, completes ALL THREE of these to make real English words?\n\n___PORT     ___MOUNT     ___CALL", "options": {"A": "EX", "B": "RE", "C": "DIS", "D": "IM"}, "fig": "", "passage": null, "qnum": 27}, {"n": 62, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A printing shop charges a fixed setup fee of $40 per order plus $0.15 per page. A school orders 320 booklets, each 12 pages long, in a single order. What is the total cost?", "options": {"A": "$576.00", "B": "$580.00", "C": "$616.00", "D": "$656.00"}, "fig": "", "passage": null, "qnum": 28}, {"n": 63, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The figure shows four labelled shapes. Which ONE is the odd one out because it is NOT a regular polygon? (A regular polygon has all sides equal AND all angles equal.)", "options": {"A": "Shape A", "B": "Shape B", "C": "Shape C", "D": "Shape D"}, "fig": "<svg viewBox=\"0 0 368 120\" width=\"368\" height=\"120\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"368\" height=\"120\" fill=\"#ffffff\"/><rect x=\"25.8\" y=\"31.8\" width=\"40.5\" height=\"40.5\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"46.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\" studies French plays in the football team.", "B": "Every Year 9 student who studies Spanish plays in the football team.", "C": "If a Year 9 student plays in the football team, that student does not study French.", "D": ""}, "fig": "", "passage": null, "qnum": 34}, {"n": 69, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "EVALUATION OF ARGUMENTS. Question: \"Should the school replace its printed student handbook with a digital-only version?\"\nWhich is the STRONGEST argument?", "options": {"A": "Yes, last year the school spent HK$48,000 printing handbooks that a follow-up survey found 70% of students never opened, while the same information online was viewed far more often.", "B": "No, I personally love the feel of a real printed handbook and would be sad to see it go.", "C": "No, there is always a chance the school website goes down on the day an important notice is posted, leaving students with nothing.", "D": ""}, "fig": "", "passage": null, "qnum": 35}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 (V2)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
