<title>IDAT HKIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nNot only the violinists but also the pianist ____ asked to arrive an hour before the concert began.", "options": {"A": "are", "B": "have been", "C": "were", "D": "was"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word in the sentence below?\n\nAfter days of heavy rain, the path up the hillside had become so <u>treacherous</u> that the guides turned the group back.", "options": {"A": "steep and tiring", "B": "muddy and wet", "C": "dangerously unsafe", "D": "long and winding"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nThe coach congratulated the team on ____ their first away match of the season.", "options": {"A": "to win", "B": "winning", "C": "win", "D": "to have won"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "What is the connotation (tone) of the underlined word in the sentence below?\n\nThe reviewer called the chef's new menu a <u>daring</u> mix of old recipes and bold new flavours.", "options": {"A": "Positive", "B": "Negative", "C": "Neutral", "D": "Sarcastic"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nBy the time the inspector reached the warehouse, the damaged crates ____ already ____ away by the staff.", "options": {"A": "had ... cleared", "B": "was ... clearing", "C": "has ... been cleared", "D": "had ... been cleared"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word in the sentence below?\n\nThe witness gave such a <u>credible</u> account of the accident that the police recorded every word.", "options": {"A": "deserving of praise or honour", "B": "believable and worthy of trust", "C": "easily damaged or broken", "D": "kept secret from the public"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "A sentence is in the PASSIVE voice when the subject receives the action rather than performing it.\n\nWhich of the four sentences below is written in the passive voice?", "options": {"A": "The council is repairing the old footbridge this week.", "B": "The council will repair the old footbridge next month.", "C": "The old footbridge is being repaired by the council this week.", "D": "The council repaired the old footbridge last year."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.\n\nThe climbers moved ____ across the icy ledge, testing every foothold before trusting it.", "options": {"A": "cautiously", "B": "cautiosly", "C": "cautiousy", "D": "cautiousely"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Read the sentence below. One of the four labelled sections contains an error. Which labelled section must be changed to make the sentence correct?\n\n(A) Every one of the runners (B) were handed (C) a numbered bib (D) at the registration desk.", "options": {"A": "Section (A)", "B": "Section (B)", "C": "Section (C)", "D": "Section (D)"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nWhen Leah promised to finish the whole mural by herself in one afternoon, her teammates thought she had <u>bitten off more than she could chew</u>.", "options": {"A": "behaved rudely toward the group", "B": "lost interest in the project", "C": "taken on more than she could handle", "D": "eaten before finishing her work"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to the passage, where do the monarch butterflies that fly south in autumn spend the winter?", "options": {"A": "In gardens and schoolyards across North America", "B": "On wide stretches of open desert", "C": "Among the flowers where they stop to feed", "D": "In warm mountain fir forests in central Mexico"}, "fig": "", "passage": "<strong>The Long Road of the Monarch</strong><br>Every autumn, one of the most remarkable journeys in the natural world takes place high above the fields and forests of North America. Millions of monarch butterflies, each weighing less than a paperclip, lift into the air and begin a flight that will carry them thousands of kilometres to the south. Their delicate orange-and-black wings hardly seem built for such a task, yet these tiny travellers cross an entire continent to escape the coming cold.\n\nA Journey No Single Butterfly Completes\n\nThe most astonishing part of the monarch's story is that no single butterfly makes the whole round trip. The insects that fly south in autumn travel all the way to warm mountain forests in central Mexico, where they cluster together by the millions on the same fir trees their ancestors used. There they wait out the winter. When spring arrives, they begin the journey north, but they do not get far before they lay their eggs and die. It is their children, and then their grandchildren, who continue the journey, so that several short-lived generations together complete a single migration. Somehow, a butterfly that has never seen Mexico still knows the way back, season after season.\n\nReading an Invisible Map\n\nFor a long time, scientists were puzzled about how the monarchs find their route. A butterfly has a brain smaller than the head of a pin, yet it navigates with surprising accuracy. Researchers have discovered that monarchs use the position of the sun as a kind of compass, adjusting for the time of day so that they always head in roughly the right direction. On cloudy days, when the sun is hidden, they appear to sense the Earth's magnetic field instead, using it as a backup guide. Together, these two senses keep the fragile insects on course across deserts, cities, and wide stretches of open land.\n\nA Fuel Stop Along the Way\n\nFlying such a distance takes enormous energy, and the monarchs cannot carry it all from the start. Along the route they stop to feed on the nectar of flowers, refuelling much as a long-distance traveller might pause at a service station. One plant matters above all the others: milkweed. Female monarchs lay their eggs only on milkweed, because it is the single food their caterpillars will eat. The plant also makes the butterflies mildly poisonous to birds, giving them some protection on their long and dangerous flight. Where milkweed disappears, the monarchs cannot raise the next generation, and the chain of the journey is broken.\n\nA Fragile Future\n\nIn recent decades the number of migrating monarchs has fallen sharply. As farms and roads spread, the wild milkweed they depend on has been cleared from much of the land, and the forests where they spend the winter have been thinned by logging. Changes in the weather have made some journeys harder still. Scientists and ordinary citizens have begun planting milkweed in gardens, parks, and schoolyards, hoping to rebuild the broken links in the butterflies' path. Whether these efforts will be enough, no one can yet say. What is certain is that the survival of one of nature's greatest travellers may depend on choices made by the people who share its long and winding road.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word navigates as it d, because it is the single food their caterpillars will eat. The plant also makes the butterflies mildly poisonous to birds, giving them some protection on their long and dangerous flight. Where milkweed disappears, the monarchs cannot raise the next generation, and the chain of the journey is broken.\n\nA Fragile Future\n\nIn recent decades the number of migrating monarchs has fallen sharply. As farms and roads spread, the wild milkweed they depend on has been cleared from much of the land, and the forests where they spend the winter have been thinned by logging. Changes in the weather have made some journeys harder still. Scientists and ordinary citizens have begun planting milkweed in gardens, parks, and schoolyards, hoping to rebuild the broken links in the butterflies' path. Whether these efforts will be enough, no one can yet say. What is certain is that the survival of one of nature's greatest travellers may depend on choices made by the people who share its long and winding road.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "What is the author's main purpose in the final section, 'A Fragile Future'?", "options": {"A": "To show that the monarchs' future is uncertain and may depend on human choices", "B": "To prove that the monarch butterfly has already become extinct", "C": "To explain step by step how milkweed is planted in a garden", "D": "To argue that logging should be banned everywhere in the world"}, "fig": "", "passage": "<strong>The Long Road of the Monarch</strong><br>Every autumn, one of the most remarkable journeys in the natural world takes place high above the fields and forests of North America. Millions of monarch butterflies, each weighing less than a paperclip, lift into the air and begin a flight that will carry them thousands of kilometres to the south. Their delicate orange-and-black wings hardly seem built for such a task, yet these tiny travellers cross an entire continent to escape the coming cold.\n\nA Journey No Single Butterfly Completes\n\nThe most astonishing part of the monarch's story is that no single butterfly makes the whole round trip. The insects that fly south in autumn travel all the way to warm mountain forests in central Mexico, where they cluster together by the millions on the same fir trees their ancestors used. There they wait out the winter. When spring arrives, they begin the journey north, but they do not get far before they lay their eggs and die. It is their children, and then their grandchildren, who continue the journey, so that several short-lived generations together complete a single migration. Somehow, a butterfly that has never seen Mexico still knows the way back, season after season.\n\nReading an Invisible Map\n\nFor a long time, scientists were puzzled about how the monarchs find their route. A butterfly has a brain smaller than the head of a pin, yet it navigates with surprising accuracy. Researchers have discovered that monarchs use the position of the sun as a kind of compass, adjusting for the time of day so that they always head in roughly the right direction. On cloudy days, when the sun is hidden, they appear to sense the Earth's magnetic field instead, using it as a backup guide. Together, these two senses keep the fragile insects on course across deserts, cities, and wide stretches of open land.\n\nA Fuel Stop Along the Way\n\nFlying such a distance takes enormous energy, and the monarchs cannot carry it all from the start. Along the route they stop to feed on the nectar of flowers, refuelling much as a long-distance traveller might pause at a service station. One plant matters above all the others: milkweed. Female monarchs lay their eggs only on milkweed, because it is the single food their caterpillars will eat. The plant also makes the butterflies mildly poisonous to birds, giving them some protection on their long and dangerous flight. Where milkweed disappears, the monarchs cannot raise the next generation, and the chain of the journey is broken.\n\nA Fragile Future\n\nIn recent decades the number of migrating monarchs has fallen sharply. As farms and roads spread, the wild milkweed they depend on has been cleared from much of the land, and the forests where they spend the winter have been thinned by logging. Changes in the weather have made some journeys harder still. Scientists and ordinary citizens have begun planting milkweed in gardens, parks, and schoolyards, hoping to rebuild the broken links in the butterflies' path. Whether these efforts will be enough, no one can yet say. What is certain is that the survival of one of nature's greatest travellers may depend on choices made by the people who share its long and winding road.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "This task has two parts. Part 1 tests your editing; Part 2 tests your paragraph writing.", "label": "", "body": "", "hint": "Part 1: Read the passage and choose the ONE option (A, B or C) in each numbered bracket that makes the writing correct and clear. Write your six answers as 1-_, 2-_, 3-_, 4-_, 5-_, 6-_. Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences. Use clear, accurate English with varied vocabulary and sentence structure.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Read the passage below. For each numbered bracket, choose the option that makes the writing correct and clear.\n\nLast winter my cousin and I [1: A) was B) were C) is] chosen to look after the small library in our neighbourhood centre while the usual helper was away. At first the job looked [2: A) simple B) simply C) simpleness], but returned books piled up [3: A) quick B) quickly C) quicker] faster than we could shelve them. Every afternoon the shelves had to [4: A) tidy B) be tidied C) tidying] before the centre closed for the night. [5: A) Although B) Because C) Unless] we sometimes grumbled about the work, we were quietly proud of the neat rows we left behind. By the end of the month our little library was the [6: A) most tidy B) tidiest C) more tidy] it had ever been, and the regular helper said she could hardly believe the change.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences:\n(1) Explain to a younger student how to borrow a book from a library and return it on time, describing the steps clearly and in order.\n(2) Write about a time you were trusted with an important job and how you felt when the job was done."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "When you finish a busy week, what do you usually feel you did best?", "options": {"A": "Stayed active and kept moving", "B": "Thought hard and learned new things", "C": "Made, drew or played something", "D": "Looked out for the people around me"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "Which kind of task pulls you in the most?", "options": {"A": "Something hands-on that I can build or fix", "B": "Something full of ideas to think about", "C": "Something I can design or imagine", "D": "Something I do alongside other people"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What would you most like to get a bit better at?", "options": {"A": "Speaking up when I have something to say", "B": "Keeping going when work gets tricky", "C": "Getting better at a sport or a skill", "D": "Planning my time and staying organised"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "Which of these do you enjoy the least?", "options": {"A": "Sitting still for a long stretch", "B": "Waiting a long time before I see a result", "C": "Doing the same thing over and over", "D": "Starting before there is a clear plan"}, "  the best answer."}, {"n": "36", "type": "mcq", "section": "Maths", "stem": "9.2 − 24.65 =", "options": {"A": "15.45", "B": "−15.45", "C": "−15.55", "D": "−16.45"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "0.084 written as a fraction in lowest terms and as a percentage is:", "options": {"A": "21/250 and 0.84%", "B": "84/1000 and 8.4%", "C": "21/25 and 8.4%", "D": "21/250 and 8.4%"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "0.45 × 0.6, written as a fraction in lowest terms, is:", "options": {"A": "27/100", "B": "27/1000", "C": "27/10", "D": "27/50"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "3¾ ÷ ⅚ =", "options": {"A": "3⅛", "B": "2/9", "C": "4½", "D": "3⅗"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "7/12 ÷ 7/8 =", "options": {"A": "49/96", "B": "3/2", "C": "8/12", "D": "2/3"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "Simplify:  −7p − 6p + 19p", "options": {"A": "32p", "B": "6p", "C": "−32p", "D": "18p"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "Order from least to greatest:  −2.7,  1/2,  −15,  4,  −0.85", "options": {"A": "−2.7, −15, −0.85, 1/2, 4", "B": "−15, −2.7, 1/2, −0.85, 4", "C": "−15, −2.7, −0.85, 1/2, 4", "D": "1/2, 4, −0.85, −2.7, −15"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "41.6256 ÷ 0.96 =", "options": {"A": "4.336", "B": "43.36", "C": "433.6", "D": "44.36"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "2⅘ + 3.65 =", "options": {"A": "6.45", "B": "6.05", "C": "5.65", "D": "6.25"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "45", "type": "mcq", "section": "Maths", "stem": "Find the perimeter of the rectangle shown.", "options": {"A": "46.48 cm²", "B": "13.9 cm", "C": "27.8 cm", "D": "16.6 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"340\" height=\"230\" viewBox=\"0 0 340 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"340\" height=\"230\" fill=\"white\"/><rect x=\"70\" y=\"50\" width=\"200\" height=\"120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"170.0\" y=\"198\" text-anchor=\"middle\" font-size=\"15\">8.3 cm</text><text x=\"58\" y=\"115.0\" text-anchor=\"end\" font-size=\"15\">5.6 cm</text></svg>", "passage": "", "qnum": "10"}, {"n": "46", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "47", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at this number sequence. The SAME two-step rule repeats all the way along: one operation, then a second operation, in turn. What number replaces the blank?\n\n3, 4, 8, 9, 18, 19, ___", "options": {"A": "20", "B": "38", "C": "36", "D": "37"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Three of these instruments share ONE clear property that the fourth does not. Which word is the odd one out?", "options": {"A": "violin", "B": "cello", "C": "guitar", "D": "trumpet"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A shop sells notebooks at $18 each. This week every notebook is discounted by 25%. Maya buys 4 notebooks at the discounted price and pays with a single $60 note. How much change does she receive?", "options": {"A": "$13.50", "B": "$6.00", "C": "$15.00", "D": "$8.00"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The figure shows a square with BOTH of its diagonals drawn in, crossing at the centre. How many triangles of any size can be counted in the figure?", "options": {"A": "4", "B": "8", "C": "6", "D": "10"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the sequence inside the boxes. TWO things change at each step at the same time: the single arrow rotates 90 degrees CLOCKWISE, AND the number of dots beside it goes up by one. The boxes show: an arrow pointing UP with 1 dot, an arrow pointing RIGHT with 2 dots, an arrow pointing DOWN with 3 dots. Which box comes next?", "options": {"A": "an arrow pointing LEFT with 4 dots", "B": "an arrow pointing UP with 4 dots", "C": "an arrow pointing LEFT with 3 dots", "D": "an arrow pointing DOWN with 4 dots"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The drama club should perform this year's play in the main hall rather than the classroom we used last year, because last year many parents had to be turned away at the door for lack of space.\"\n\nPROPOSED ASSUMPTION: \"The main hall can seat more people than the classroom can.\"\n\nUsing only the information in the statement, is this assumption logical — YES or NO?", "options": {"A": "YES", "B": "NO", "C": "", "D": ""}, "fig": "", "passage": "", "qnum": "6"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every student who was chosen for the school orchestra had to first attend three rehearsals during the trial week. Daniel was chosen for the school orchestra this year.\"\n\nWhich one of the following MUST be true?", "options": {"A": "Daniel attended the three trial-week rehearsals.", "B": "Daniel plays a musical instrument better than anyone else who was chosen.", "C": "Daniel enjoys orchestra more than any other school activity.", "D": "Daniel will be chosen for the orchestra again next year."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"A teacher recorded how 40 students in one Year 9 class travelled to school on a particular Monday. 25 of the students cycled to school, and the remaining 15 came by some other means.\"\n\nCONCLUSIONS:\n(1) On that Monday, more than half of the students in this class cycled to school.\n(2) Most Year 9 students across the city usually cycle to school.\n\nUsing only the information in the statement, which conclusion(s) follow?", "options": {"A": "Only Conclusion 1 follows.", "B": "Only Conclusion 2 follows.", "C": "Both Conclusion 1 and Conclusion 2 follow.", "D": "Neither conclusion follows."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "55", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should the school give every Year 7 student a printed planner to write down their homework?\"\n\nARGUMENTS:\n(1) Yes — in a one-year trial with two Year 7 classes, the class given printed planners handed in 30% fewer pieces of homework late than the class without them.\n(2) Yes — printed planners are old-fashioned, and a traditional school should always do things the way they have always been done.\n(3) No — I never used a planner myself and I turned out perfectly fine, so I do not see why anyone needs one.", "options": {"A": "Argument 2", "B": "Argument 3", "C": "Argument 1", "D": ""}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
