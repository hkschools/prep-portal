<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 4 (V3)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCHOOL = "HKIS", STAGE = "4", VERSION = "3";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the option that makes the sentence grammatically correct. The box of old photographs ____ on the top shelf of the cupboard.", "options": {"A": "is sitting", "B": "are sitting", "C": "have sat", "D": "sit"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word famished in the sentence below? After the long hike up the ridge, the scouts were famished and ate everything in their packs.", "options": {"A": "frightened", "B": "exhausted", "C": "cheerful", "D": "very hungry"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the option with correct apostrophe use. All the ____ lockers were repainted over the summer holiday.", "options": {"A": "student's", "B": "students", "C": "students'", "D": "student"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "Choose the word closest in meaning to the underlined word. The new captain proved remarkably proficient at organising the team's training schedule.", "options": {"A": "skilled", "B": "interested", "C": "famous", "D": "strict"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Does the underlined word carry a positive, negative, or neutral connotation in this sentence? The politician's promises were dismissed by reporters as nothing more than cheap slogans.", "options": {"A": "positive connotation", "B": "negative connotation", "C": "neutral connotation", "D": "the word has no connotation at all"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence. Each of the two coaches has finished writing ____ report on the season.", "options": {"A": "our", "B": "his or her", "C": "their", "D": "its"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Choose the word most nearly OPPOSITE in meaning to the word abundant in the sentence below. Rainfall was abundant that season, and the reservoirs quickly filled.", "options": {"A": "plentiful", "B": "ample", "C": "sufficient", "D": "scarce"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Choose the most appropriate word to complete this sentence in a formal letter to a school principal. We would be grateful if you ____ consider extending the application deadline.", "options": {"A": "could", "B": "can", "C": "can't", "D": "won't"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Which sentence is written in the passive voice?", "options": {"A": "The committee will announce the results on Friday.", "B": "The committee will be announcing the results on Friday.", "C": "The results will be announced by the committee on Friday.", "D": "The committee will have announced the results on Friday."}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "Which word means 'not able to be read'? The handwriting was so messy that the note was completely ____.", "options": {"A": "illegible", "B": "eligible", "C": "legislate", "D": "allege"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "According to the passage, why did the first settlers move into the lagoon?", "options": {"A": "Because they admired its natural beauty", "B": "Because the land there was rich for farming", "C": "To be closer to the trading routes of the East", "D": "To escape invaders, who found the marshy ground hard to cross"}, "fig": "", "passage": "<strong>The City That Sails on Water</strong><br>For more than a thousand years, the Italian city of Venice has done something no other great city has managed: it has stood on water. Venice is built across small islands in a shallow coastal lagoon in north-east Italy. Instead of roads, its main routes are canals, and instead of buses, narrow boats and water taxis carry people from place to place.<br><br>The first settlers did not choose this strange location for its beauty. Around 1,500 years ago, people fleeing invaders on the mainland escaped into the marshy lagoon, where the soft, watery ground made it difficult for armies to follow. To build on such unstable land, they drove millions of wooden poles deep into the mud until the poles reached a firmer layer below. Buildings were then constructed on top of these hidden foundations. Remarkably, because the poles are sealed away from oxygen under the water, many have hardened over the centuries rather than rotting away.<br><br>Venice grew rich because of its position. Sitting between Europe and the trading routes of the East, the city became a busy meeting point for merchants carrying silk, spices and glass. Venetian traders returned with both goods and new ideas, and the wealth they gathered paid for grand palaces that still line the canals today.<br><br>Yet the very water that made Venice special now threatens it. The city is slowly sinking, while the sea around it is rising. Several times each year, high tides flood the famous squares. Engineers have built huge movable barriers that can rise to hold back the highest tides. Whether such defences will protect this floating city for another thousand years, no one can yet say.", "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "What does the passage say has happened to the wooden poles beneath the buildings?", "options": {"A": "They have rotted and must be replaced often", "B": "They float to the surface during floods", "C": "They have hardened because they are sealed away from oxygen", "D": "They were removed once the buildings were finished"}, "fig": "", "passage": "<strong>The City That Sails on Water</strong><br>For more than a thousand years, the Italian city of Venice has done something no other great city has managed: it has stood on water. Venice is built across small islands in a shallow coastal lagoon in north-east Italy. Instead of roads, its main routes are canals, and instead of buses, narrow boats and water taxis carry people from place to place.<br><br>The first settlers did not choose this strange location for its beauty. Around 1,500 years ago, people fleeing invaders on the mainland escaped into the marshy lagoon, where the soft, watery ground made it difficult for armies to follow. To build on such unstable land, they drove millions of wooden poles deep into the mud until the poles reached a firmer layer below. Buildings were then constructed on top of these hidden foundations. Remarkably, because the poles are sealed away from oxygen under the water, many have hardened over the centuries rather than rotting away.<br><br>Venice grew rich because of its position. Sitting between Europe and the trading routes of the East, the city became a busy meeting point for merchants carrying silk, spices and glass. Venetian traders returned with both goods and new ideas, and the wealth they gathered paid for grand palaces that still line the canals today.<br><br>Yet the very water that made Venice special now threatens it. The city is slowly sinking, while the sea around it is rising. Several times each year, high tides flood the famous squares. Engineers have built huge movable barriers that can rise to hold back the highest tides. Whether such defences will protect this floating city for another thousand years, no one can yet say.", "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word unstable as it is used in this sentence from the passage? To build on such unstable land, they drove millions of wooden poles deep into the mud.", "options": {"A": "crowded", "B": "not firm or solid", "C": "expensive", "D": "newly discovered"}, "fig": "", "passage": "<strong>The City That Sails on Water</strong><br>For more than a thousand years, the Italian city of Venice has done something no other great city has managed: it has stood on water. Venice is built across small islands in a shallow coastal lagoon in north-east Italy. Instead of roads, its main routes are canals, and instead of buses, narrow boats and water taxis carry people from place to place.<br><br>The first settlers did not choose this strange location for its beauty. Around 1,500 years ago, people fleeing invaders on the mainland escaped into the marshy lagoon, where the soft, watery ground made it difficult for armies to follow. To build on such unstable land, they drove millions of wooden poles deep into the mud until the poles reached a firmer layer below. Buildings were then constructed on top of these hidden foundations. Remarkably, because the poles are sealed away from oxygen under the water, many have hardened over the centuries rather than rotting away.<br><br>Venice grew rich because of its position. Sitting between Europe and the trading routes of the East, the city became a busy meeting point for merchants carrying silk, spices and glass. Venetian traders returned with both goods and new ideas, and the wealth they gathered paid for grand palaces that still line the canals today.<br><br>Yet the very water that made Venice special now threatens it. The city is slowly sinking, while the sea around it is rising. Several times each year, high tides flood the famous squares. Engineers have built huge movable barriers that can rise to hold back the highest tides. Whether such defences will protect this floating city for another thousand years, no one can yet say.", "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "Which of the following is NOT given in the passage as a reason Venice became wealthy?", "options": {"A": "Its position between Europe and the trading routes of the East", "B": "Merchants carrying silk, spices and glass meeting there to trade", "C": "Gold discovered in the mud of the lagoon", "D": "Traders returning with both goods and new ideas"}, "fig": "", "passage": "<strong>The City That Sails on Water</strong><br>For more than a thousand years, the Italian city of Venice has done something no other great city has managed: it has stood on water. Venice is built across small islands in a shallow coastal lagoon in north-east Italy. Instead of roads, its main routes are canals, and instead of buses, narrow boats and water taxis carry people from place to place.<br><br>The first settlers did not choose this strange location for its beauty. Around 1,500 years ago, people fleeing invaders on the mainland escaped into the marshy lagoon, where the soft, watery ground made it difficult for armies to follow. To build on such unstable land, they drove millions of wooden poles deep into the mud until the poles reached a firmer layer below. Buildings were then constructed on top of these hidden foundations. Remarkably, because the poles are sealed away from oxygen under the water, many have hardened over the centuries rather than rotting away.<br><br>Venice grew rich because of its position. Sitting between Europe and the trading routes of the East, the city became a busy meeting point for merchants carrying silk, spices and glass. Venetian traders returned with both goods and new ideas, and the wealth they gathered paid for grand palaces that still line the canals today.<br><br>Yet the very water that made Venice special now threatens it. The city is slowly sinking, while the sea around it is rising. Several times each year, high tides flood the famous squares. Engineers have built huge movable barriers that can rise to hold back the highest tides. Whether such defences will protect this floating city for another thousand years, no one can yet say.", "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "What is the author's main purpose in the final paragraph?", "options": {"A": "To explain how the movable barriers were first invented", "B": "To show that the water which made Venice special now also endangers it", "C": "To persuade readers to visit Venice before it disappears", "D": "To list the names of the squares that flood each year"}, "fig": "", "passage": "<strong>The City That Sails on Water</strong><br>For more than a thousand years, the Italian city of Venice has done something no other great city has managed: it has stood on water. Venice is built across small islands in a shallow coastal lagoon in north-east Italy. Instead of roads, its main routes are canals, and instead of buses, narrow boats and water taxis carry people from place to place.<br><br>The first settlers did not choose this strange location for its beauty. Around 1,500 years ago, people fleeing invaders on the mainland escaped into the marshy lagoon, where the soft, watery ground made it difficult for armies to follow. To build on such unstable land, they drove millions of wooden poles deep into the mud until the poles reached a firmer layer below. Buildings were then constructed on top of these hidden foundations. Remarkably, because the poles are sealed away from oxygen under the water, many have hardened over the centuries rather than rotting away.<br><br>Venice grew rich because of its position. Sitting between Europe and the trading routes of the East, the city became a busy meeting point for merchants carrying silk, spices and glass. Venetian traders returned with both goods and new ideas, and the wealth they gathered paid for grand palaces that still line the canals today.<br><br>Yet the very water that made Venice special now threatens it. The city is slowly sinking, while the sea around it is rising. Several times each year, high tides flood the famous squares. Engineers have built huge movable barriers that can rise to hold back the highest tides. Whether such defences will protect this floating city for another thousand years, no one can yet say.", "qnum": 15}, {"n": 17, "type": "writing", "section": "English Writing", "intro": "Everyone has a place where they feel completely at ease.", "label": "", "body": "Describe a place where you feel calm and happy. Explain what it looks like, what you do there, and why it matters to you.", "hint": "Write at least 7 sentences, and make sure you cover all three parts: what the place looks like, what you do there, and why it matters to you.", "placeholder": "Type your response here…", "partA": "Describe a place where you feel calm and happy. Explain what it looks like, what you do there, and why it matters to you.", "partB": ""}, {"n": 18, "type": "info", "title": "Listening &amp; Interview", "body": "<div class='info-body'>In the real test this section is delivered live: you listen to short clips and answer interview-style questions on camera. There is nothing to type or record here, the sample questions below show what to expect, so you can practise your answers out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Tell us about yourself and what you enjoy outside school.</li><li style='margin:7px 0'>Describe a goal you set and how you worked towards it.</li><li style='margin:7px 0'>Talk about an issue you care about and explain why.</li><li style='margin:7px 0'>What does resilience mean to you? Give an example from your own life.</li><li style='margin:7px 0'>Listen to a short talk, then answer questions on the main idea and details.</li></ul>"}, {"n": 19, "type": "info", "title": "Character", "body": "There are no right or wrong answers here. Every choice you made simply mirrors who you are and how you like to do things. All of these qualities are strengths and leanings, never something to fix, so read this as a friendly picture of yourself."}, {"n": 20, "type": "selfeval", "section": "Character", "stem": "What do you think you do best?", "options": {"A": "Sports and active games", "B": "Reading, writing or thinking through problems", "C": "Art, music or making things", "D": "Helping and getting along with people"}, "fig": "", "passage": null, "cnum": 1}, {"n": 21, "type": "selfeval", "section": "Character", "stem": "Which of these is the trickiest for you right now?", "options": {"A": "Sitting still and focusing", "B": "Sharing my ideas out loud", "C": "Trying something brand new", "D": "Finishing a long piece of work"}, "fig": "", "passage": null, "cnum": 2}, {"n": 22, "type": "selfeval", "section": "Character", "stem": "When you finish a task, how do you usually know if you did well?", "options": {"A": "I just feel it inside", "B": "A teacher or parent tells me", "C": "I compare it to my last try", "D": "My friends react to it"}, "fig": "", "passage": null, "cnum": 3}, {"n": 23, "type": "selfeval", "section": "Character", "stem": "How much do you like thinking about your own feelings?", "options": {"A": "Not much", "B": "A little", "C": "Quite a lot", "D": "A lot"}, "fig": "", "passage": null, "cnum": 4}, {"n": 24, "type": "selfeval", "section": "Character", "stem": "What do you like the most about working on something?", "options": {"A": "Doing it on my own", "B": "Doing it with a partner", "C": "Figuring out how I did", "D": "Showing someone the result"}, "fig": "", "passage": null, "cnum": 5}, {"n": 25, "type": "selfeval", "section": "Character", "stem": "What do you most want to get better at understanding?", "options": {"A": "How others see me", "B": "What I am good at", "C": "Why I feel a certain way", "D": "When I need a break"}, "fig": "", "passage": null, "cnum": 6}, {"n": 26, "type": "selfeval", "section": "Character", "stem": "When someone gives you feedback about your work, how do you usually feel?", "options": {"A": "I welcome it straight away", "B": "I take it in pretty easily", "C": "I need a moment, then use it", "D": "I like to sit with it first"}, "fig": "", "passage": null, "cnum": 7}, {"n": 27, "type": "selfeval", "section": "Character", "stem": "If you could try one new thing this week, which would you pick?", "options": {"A": "A sport I have never played", "B": "Speaking in front of the class", "C": "A tricky new puzzle or project", "D": "Meeting a group of new people"}, "fig": "", "passage": null, "cnum": 8}, {"n": 28, "type": "selfeval", "section": "Character", "stem": "When something turns out harder than you expected, what do you usually do?", "options": {"A": "Keep trying on my own", "B": "Ask someone for help", "C": "Try a different way", "D": "Take a break, then return"}, "fig": "", "passage": null, "cnum": 9}, {"n": 29, "type": "selfeval", "section": "Character", "stem": "How do you feel about trying something new when you are not sure how it will turn out?", "options": {"A": "Excited to jump in", "B": "Mostly keen", "C": "A bit careful", "D": "I like to feel ready first"}, "fig": "", "passage": null, "cnum": 10}, {"n": 30, "type": "selfeval", "section": "Character", "stem": "What do you like the most about a challenge?", "options": {"A": "That it feels exciting", "B": "That I learn something new", "C": "That I can do it with others", "D": "That I get it done step by step"}, "fig": "", "passage": null, "cnum": 11}, {"n": 31, "type": "selfeval", "section": "Character", "stem": "What do you like the least when plans suddenly change?", "options": {"A": "Starting over again", "B": "Not knowing what comes next", "C": "Doing it a new way", "D": "Waiting to find out more"}, "fig": "", "passage": null, "cnum": 12}, {"n": 32, "type": "selfeval", "section": "Character", "stem": "After you try really hard, which of these would bother you the most?", "options": {"A": "Not finishing in time", "B": "Making a mistake", "C": "Running out of ideas", "D": "Not getting it just right"}, "fig": "", "passage": null, "cnum": 13}, {"n": 33, "type": "selfeval", "section": "Character", "stem": "How much do you like to keep going when something is difficult?", "options": {"A": "Not much", "B": "A little", "C": "Quite a lot", "D": "A lot"}, "fig": "", "passage": null, "cnum": 14}, {"n": 34, "type": "selfeval", "section": "Character", "stem": "Imagine you are given these five things: a ball, a paintbrush, a notebook, a board game and a jigsaw puzzle. Which would you most want to use?", "options": {"A": "Play and invent a game with the ball", "B": "Paint or draw something of my own", "C": "Write or sketch ideas in the notebook", "D": "Solve the jigsaw puzzle on my own"}, "fig": "", "passage": null, "cnum": 15}, {"n": 35, "type": "selfeval", "section": "Character", "stem": "When you have a problem to solve, what do you enjoy the most?", "options": {"A": "Coming up with a brand-new idea", "B": "Improving an idea that already works", "C": "Spotting the pattern or the trick", "D": "Following clear steps to the answer"}, "fig": "", "passage": null, "cnum": 16}, {"n": 36, "type": "selfeval", "section": "Character", "stem": "If you could make something this weekend, which would you try?", "options": {"A": "A story, comic or song", "B": "A model, gadget or build", "C": "A drawing or painting", "D": "A plan for a fun event"}, "fig": "", "passage": null, "cnum": 17}, {"n": 37, "type": "selfeval", "section": "Character", "stem": "What do you do best when a task has no clear right answer?", "options": {"A": "Think of lots of options", "B": "Pick one idea and develop it", "C": "Look for what others missed", "D": "Test ideas to see what works"}, "fig": "", "passage": null, "cnum": 18}, {"n": 38, "type": "selfeval", "section": "Character", "stem": "What makes you happy while you are creating something?", "options": {"A": "Surprising myself with an idea", "B": "Making it look just right", "C": "Sharing it with others", "D": "Seeing it actually work"}, "fig": "", "passage": null, "cnum": 19}, {"n": 39, "type": "selfeval", "section": "Character", "stem": "What let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 (V3)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
