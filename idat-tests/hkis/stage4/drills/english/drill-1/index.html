<html lang="en">
<head>

<title>IDAT HKIS: Stage 4 English Drill 1</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

 may have been caused by the weather, although the report does not say so.", "options": {"A": "may", "B": "caused", "C": "although", "D": "report"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which prefix means AGAINST or OPPOSED TO?", "options": {"A": "anti-", "B": "ante-", "C": "auto-"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the saying below mean?<br><br>The committee decided to <i>bite the bullet</i> and close the older building.", "options": {"A": "To act without thinking about the consequences", "B": "To accept something painful because there is no better option", "C": "To refuse to make a decision", "D": "To argue fiercely with an opponent"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word, but describes a STRONGER feeling?<br><br>The residents were <u>annoyed</u> by the noise from the building site.", "options": {"A": "irritated", "B": "concerned", "C": "incensed", "D": "puzzled"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "According to the passage, why did merchants travelling between China and the Mediterranean pass near Samarkand?", "options": {"A": "Timur ordered all traders to stop in his capital", "B": "It was the only city that produced silk", "C": "The Silk Road had been built to connect it to China", "D": "The surrounding region was mostly desert and mountain, so the valley offered a practical route"}, "fig": "", "passage": "<strong>The Crossroads City: Samarkand</strong><br><p>Samarkand, in modern Uzbekistan, is one of the oldest continuously inhabited cities in Central Asia. For more than two thousand years it stood at a crossroads of trade, and much of what makes the city remarkable today grew out of that position.</p><p><b>Position and trade.</b> Samarkand lies in a fertile valley watered by the Zarafshan river, in a region otherwise dominated by desert and mountain. Merchants travelling between China and the Mediterranean had little choice but to pass nearby, and the city became a natural halt on the network of routes later called the Silk Road. Silk moved west; glass, horses and silver moved east. Ideas travelled with the goods, and papermaking is generally thought to have reached the western world through Samarkand after techniques arrived there from China in the eighth century.</p><p><b>The Timurid city.</b> In the fourteenth century the ruler Timur made Samarkand his capital and set out to make it the most magnificent city of its age. Craftsmen were brought from the lands he had conquered, and they built on a scale intended to impress every visitor. The Registan, a public square framed by three teaching colleges, dates from this period and the century that followed. Its facades are covered in glazed tiles in deep blues and greens, colours that survive because the glaze protects the clay beneath from the weather.</p><p><b>Learning and astronomy.</b> Timur's grandson Ulugh Beg was more interested in scholarship than in conquest. In the 1420s he built an observatory on a hill outside the city, equipped with a stone arc so large that part of it was sunk into the rock. Working without any telescope, which had not yet been invented, the astronomers there measured the length of the year to within about a minute of the figure accepted today. Their star catalogue was still being consulted in Europe two centuries later.</p><p><b>Decline and rediscovery.</b> As sea routes between Europe and Asia opened, the overland trade that had sustained Samarkand mattered less, and the city declined. Buildings were damaged by earthquakes and left unrepaired. Restoration began in earnest only in the twentieth century, and it has not been without argument: some specialists hold that the rebuilding has been too confident, replacing lost tilework with enth century the ruler Timur made Samarkand his capital and set out to make it the most magnificent city of its age. Craftsmen were brought from the lands he had conquered, and they built on a scale intended to impress every visitor. The Registan, a public square framed by three teaching colleges, dates from this period and the century that followed. Its facades are covered in glazed tiles in deep blues and greens, colours that survive because the glaze protects the clay beneath from the weather.</p><p><b>Learning and astronomy.</b> Timur's grandson Ulugh Beg was more interested in scholarship than in conquest. In the 1420s he built an observatory on a hill outside the city, equipped with a stone arc so large that part of it was sunk into the rock. Working without any telescope, which had not yet been invented, the astronomers there measured the length of the year to within about a minute of the figure accepted today. Their star catalogue was still being consulted in Europe two centuries later.</p><p><b>Decline and rediscovery.</b> As sea routes between Europe and Asia opened, the overland trade that had sustained Samarkand mattered less, and the city declined. Buildings were damaged by earthquakes and left unrepaired. Restoration began in earnest only in the twentieth century, and it has not been without argument: some specialists hold that the rebuilding has been too confident, replacing lost tilework with new material rather than conserving what remained.</p><p><b>Samarkand today.</b> The historic centre was placed on the World Heritage list in 2001. Visitors come for the monuments, but the city is not a museum; it remains a working place of markets, workshops and neighbourhoods whose street plans are older than the buildings around them.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which of these details about Samarkand does the passage NOT give?", "options": {"A": "The century in which Ulugh Beg built his observatory", "B": "The year the historic centre joined the World Heritage list", "C": "A disagreement among specialists about the restoration", "D": "The population of Samarkand today"}, "fig": "", "passage": "<strong>The Crossroads City: Samarkand</strong><br><p>Samarkand, in modern Uzbekistan, is one of the oldest continuously inhabited cities in Central Asia. For more than two thousand years it stood at a crossroads of trade, and much of what makes the city remarkable today grew out of that position.</p><p><b>Position and trade.</b> Samarkand lies in a fertile valley watered by the Zarafshan river, in a region otherwise dominated by desert and mountain. Merchants travelling between China and the Mediterranean had little choice but to pass nearby, and the city became a natural halt on the network of routes later called the Silk Road. Silk moved west; glass, horses and silver moved east. Ideas travelled with the goods, and papermaking is generally thought to have reached the western world through Samarkand after techniques arrived there from China in the eighth century.</p><p><b>The Timurid city.</b> In the fourteenth century the ruler Timur made Samarkand his capital and set out to make it the most magnificent city of its age. Craftsmen were brought from the lands he had conquered, and they built on a scale intended to impress every visitor. The Registan, a public square framed by three teaching colleges, dates from this period and the century that followed. Its facades are covered in glazed tiles in deep blues and greens, colours that survive because the glaze protects the clay beneath from the weather.</p><p><b>Learning and astronomy.</b> Timur's grandson Ulugh Beg was more interested in scholarship than in conquest. In the 1420s he built an observatory on a hill outside the city, equipped with a stone arc so large that part of it was sunk into the rock. Working without any telescope, which had not yet been invented, the astronomers there measured the length of the year to within about a minute of the figure accepted today. Their star catalogue was still being consulted in Europe two centuries later.</p><p><b>Decline and rediscovery.</b> As sea routes between Europe and Asia opened, the overland trade that had sustained Samarkand mattered less, and the city declined. Buildings were damaged by earthquakes and left unrepaired. Restoration began in earnest only in the twentieth century, and it has not been without argument: some specialists hold that the rebuilding has been too confident, replacing lost tilework with new material rather than conserving what remained.</p><p><b>Samarkand today.</b> The historic centre was placed on the World Heritage list in 2001. Visitors come for the monuments, but the city is not a museum; it remains a working place of markets, workshops and neighbourhoods whose street plans are older than the buildings around them.</p>", "qnum": "13"}, {"n": "15", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task on an informative text. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for an informative text. Part 2: choose ONE task and write a paragraph of no more than 10 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nThe Great Wall of China: A Structure Built Over Centuries\n\nThe Great Wall is not a single wall but a series of fortifications built across northern China over many centuries. [1: A) Let's have a look at how it all came about. B) This article describes how it was built and why. C) It is well cool and you should definitely go.]\n\nConstruction. Work began under separate kingdoms and [2: A) was later joined B) later joining C) is later joined] together under the first emperor. The materials [3: A) varies B) varied C) very] according to the region: rammed earth in the west, and stone and brick in sections nearer the capital. Many of the best preserved sections [4: A) was built B) were built C) were build] during the Ming dynasty.\n\nPurpose. The wall was intended to slow the movement of raiders rather than to stop them completely, [5: A) and its B) and it's C) and its'] garrisons could signal along the line using smoke by day and fire by night. The system worked [6: A) good B) well C) goodly] when it was properly staffed.\n\nToday. Some sections have been restored for visitors, [7: A) while others have been left to decay B) while others has been left to decay C) while others left decaying]. Conservation is difficult because the wall crosses remote country, [8: A) so repairs cost a lot of money and take ages. B) so repair work is both expensive and slow. C) so basically it's a nightmare to fix.]", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences. This will be viewed by your future school.\n(1) Write a short informative text about a building or place in your city that visitors should know about. Explain what it is and why it matters.\n(2) Write a short argumentative text about whether old buildings should be restored or left as ruins. Include your own opinion."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 English Drill 1</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
