<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 4 English Drill 5</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCHOOL = "HKIS", STAGE = "4", VERSION = "ENG-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "A full English practice section at Stage 4: five grammar questions, three vocabulary questions, a reading passage with five questions, and two writing tasks. One vocabulary question offers three choices rather than four, as on the real test. This passage makes a claim and then qualifies it, so read to the end before answering the purpose question."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Correct the underlined word.<br><br>The museum has fewer visitors on weekdays, but <u>less</u> complaints about queues.", "options": {"A": "fewer", "B": "less", "C": "lesser", "D": "least"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly.<br><br>The curator, along with two assistants, ___ preparing the new display.", "options": {"A": "are", "B": "is", "C": "were", "D": "have"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which sentence is written correctly?", "options": {"A": "Having checked the figures twice, the accounts were signed by the treasurer.", "B": "Having checked the figures twice, it was signed by the treasurer.", "C": "Having checked the figures twice, the treasurer signed the accounts.", "D": "Having checked the figures twice and the treasurer signed the accounts."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly.<br><br>By next summer the restoration ___ for three years.", "options": {"A": "will run", "B": "has been running", "C": "will be running", "D": "will have been running"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "In the sentence below, which word introduces an example?<br><br>Several materials were tried, notably copper, before the final choice was made.", "options": {"A": "notably", "B": "several", "C": "before", "D": "final"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which prefix means TOO MUCH or ABOVE?", "options": {"A": "under-", "B": "over-", "C": "inter-"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the saying below mean?<br><br>Asked to explain the loss, the director simply <i>passed the buck</i>.", "options": {"A": "Paid the money that was owed", "B": "Shifted the responsibility to somebody else", "C": "Explained the situation in full", "D": "Resigned from the position"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word?<br><br>The committee's response to the proposal was <u>lukewarm</u>.", "options": {"A": "hostile", "B": "delayed", "C": "unenthusiastic", "D": "unanimous"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "According to the passage, what was Gutenberg's actual achievement?", "options": {"A": "Inventing movable type for the first time", "B": "Being the first person in Europe to print from wooden blocks", "C": "Designing a new kind of press from scratch", "D": "Combining metal type, a suitable ink and an adapted press into one working system"}, "fig": "", "passage": "<strong>Three Qualifications About the Printing Press</strong><br><p>It is often said that the printing press invented by Johannes Gutenberg in the middle of the fifteenth century changed the world. The claim is broadly fair, but it needs three qualifications, and setting them out explains more about the change than the claim itself does.</p><p><b>What Gutenberg actually did.</b> Printing from carved wooden blocks was already old, and had been practised in East Asia for centuries. Movable type, in which each character is a separate piece that can be reused, was also not new. Gutenberg's achievement was to combine a workable metal type, an oil-based ink that would stick to metal, and a press adapted from the kind used for making wine, into a system that could produce identical pages quickly and repeatedly.</p><p><b>The first qualification: it was gradual.</b> The first printed books imitated manuscripts closely, and for some decades printed and handwritten books were sold side by side. Printing spread across Europe within about fifty years, which was fast, but the effects on what people read and believed took much longer to appear.</p><p><b>The second qualification: it needed readers.</b> A press is of little use where few people can read. Literacy rose slowly and unevenly, and in many places the greatest early demand was not for new work at all but for cheaper copies of texts that were already valued. Printers were businesses, and they printed what sold.</p><p><b>The third qualification: the effects were not all welcome.</b> The same technology that spread useful knowledge spread error and rumour just as efficiently, and printers were among the first to face systematic censorship. Neither the enthusiasm nor the alarm was entirely misplaced.</p><p><b>What is left of the claim.</b> Strip away the exaggeration and something substantial remains. Once a text could be reproduced identically in large numbers, it became possible to refer another reader to a particular page and know they would find the same words there. Scholars in different countries could work from the same edition. That reliability, more than sheer quantity, is what the press contributed.</p>", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "What does the passage say about the earliest printed books?", "options": {"A": "They closely imitated handwritten manuscripts", "B": "They were cheaper than manuscripts from the very beginning", "C": "They were mostly works that had never been written down before", "D": "They were printed only in th e possible to refer another reader to a particular page and know they would find the same words there. Scholars in different countries could work from the same edition. That reliability, more than sheer quantity, is what the press contributed.</p>", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Why does the writer point out that printers were businesses?", "options": {"A": "To suggest that they were more interested in money than in learning", "B": "To explain why they printed texts that were already in demand", "C": "To explain why literacy rose so slowly", "D": "To show that printing was unprofitable at first"}, "fig": "", "passage": "<strong>Three Qualifications About the Printing Press</strong><br><p>It is often said that the printing press invented by Johannes Gutenberg in the middle of the fifteenth century changed the world. The claim is broadly fair, but it needs three qualifications, and setting them out explains more about the change than the claim itself does.</p><p><b>What Gutenberg actually did.</b> Printing from carved wooden blocks was already old, and had been practised in East Asia for centuries. Movable type, in which each character is a separate piece that can be reused, was also not new. Gutenberg's achievement was to combine a workable metal type, an oil-based ink that would stick to metal, and a press adapted from the kind used for making wine, into a system that could produce identical pages quickly and repeatedly.</p><p><b>The first qualification: it was gradual.</b> The first printed books imitated manuscripts closely, and for some decades printed and handwritten books were sold side by side. Printing spread across Europe within about fifty years, which was fast, but the effects on what people read and believed took much longer to appear.</p><p><b>The second qualification: it needed readers.</b> A press is of little use where few people can read. Literacy rose slowly and unevenly, and in many places the greatest early demand was not for new work at all but for cheaper copies of texts that were already valued. Printers were businesses, and they printed what sold.</p><p><b>The third qualification: the effects were not all welcome.</b> The same technology that spread useful knowledge spread error and rumour just as efficiently, and printers were among the first to face systematic censorship. Neither the enthusiasm nor the alarm was entirely misplaced.</p><p><b>What is left of the claim.</b> Strip away the exaggeration and something substantial remains. Once a text could be reproduced identically in large numbers, it became possible to refer another reader to a particular page and know they would find the same words there. Scholars in different countries could work from the same edition. That reliability, more than sheer quantity, is what the press contributed.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What does the writer identify as the press's most important contribution?", "options": {"A": "That books became far cheaper than they had been", "B": "That it allowed new ideas to spread faster than censors could act", "C": "That a text could be reproduced identically, so readers could rely on finding the same words", "D": "That it produced far more books than had existed before"}, "fig": "", "passage": "<strong>Three Qualifications About the Printing Press</strong><br><p>It is often said that the printing press invented by Johannes Gutenberg in the middle of the fifteenth century changed the world. The claim is broadly fair, but it needs three qualifications, and setting them out explains more about the change than the claim itself does.</p><p><b>What Gutenberg actually did.</b> Printing from carved wooden blocks was already old, and had been practised in East Asia for centuries. Movable type, in which each character is a separate piece that can be reused, was also not new. Gutenberg's achievement was to combine a workable metal type, an oil-based ink that would stick to metal, and a press adapted from the kind used for making wine, into a system that could produce identical pages quickly and repeatedly.</p><p><b>The first qualification: it was gradual.</b> The first printed books imitated manuscripts closely, and for some decades printed and handwritten books were sold side by side. Printing spread across Europe within about fifty years, which was fast, but the effects on what people read and believed took much longer to appear.</p><p><b>The second qualification: it needed readers.</b> A press is of little use where few people can read. Literacy rose slowly and unevenly, and in many places the greatest early demand was not for new work at all but for cheaper copies of texts that were already valued. Printers were businesses, and they printed what sold.</p><p><b>The third qualification: the effects were not all welcome.</b> The same technology that spread useful knowledge spread error and rumour just as efficiently, and printers were among the first to face systematic censorship. Neither the enthusiasm nor the alarm was entirely misplaced.</p><p><b>What is left of the claim.</b> Strip away the exaggeration and something substantial remains. Once a text could be reproduced identically in large numbers, it became possible to refer another reader to a particular page and know they would find the same words there. Scholars in different countries could work from the same edition. That reliability, more than sheer quantity, is what the press contributed.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which of these does the passage NOT provide?", "options": {"A": "A reason that printers faced censorship", "B": "An example of a technology Gutenberg adapted", "C": "A region where block printing was already old", "D": "The number of books printed in Europe by 1500"}, "fig": "", "passage": "<strong>Three Qualifications About the Printing Press</strong><br><p>It is often said that the printing press invented by Johannes Gutenberg in the middle of the fifteenth century changed the world. The claim is broadly fair, but it needs three qualifications, and setting them out explains more about the change than the claim itself does.</p><p><b>What Gutenberg actually did.</b> Printing from carved wooden blocks was already old, and had been practised in East Asia for centuries. Movable type, in which each character is a separate piece that can be reused, was also not new. Gutenberg's achievement was to combine a workable metal type, an oil-based ink that would stick to metal, and a press adapted from the kind used for making wine, into a system that could produce identical pages quickly and repeatedly.</p><p><b>The first qualification: it was gradual.</b> The first printed books imitated manuscripts closely, and for some decades printed and handwritten books were sold side by side. Printing spread across Europe within about fifty years, which was fast, but the effects on what people read and believed took much longer to appear.</p><p><b>The second qualification: it needed readers.</b> A press is of little use where few people can read. Literacy rose slowly and unevenly, and in many places the greatest early demand was not for new work at all but for cheaper copies of texts that were already valued. Printers were businesses, and they printed what sold.</p><p><b>The third qualification: the effects were not all welcome.</b> The same technology that spread useful knowledge spread error and rumour just as efficiently, and printers were among the first to face systematic censorship. Neither the enthusiasm nor the alarm was entirely misplaced.</p><p><b>What is left of the claim.</b> Strip away the exaggeration and something substantial remains. Once a text could be reproduced identically in large numbers, it became possible to refer another reader to a particular page and know they would find the same words there. Scholars in different countries could work from the same edition. That reliability, more than sheer quantity, is what the press contributed.</p>", "qnum": "13"}, {"n": "15", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task on an informative text. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for an informative text. Part 2: choose ONE task and write a paragraph of no more than 10 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nPaper: A Material That Travelled\n\nPaper was first made in China more than two thousand years ago and reached Europe only much later. [1: A) This text traces how it spread and why it mattered. B) Paper, right, it's everywhere now. C) Bet you never thought about paper before.]\n\nHow it is made. Plant fibres are soaked and beaten until they separate, and the mixture [2: A) are poured B) is poured C) is pour] onto a fine mesh. As the water drains away the fibres [3: A) settles B) settle C) settling] into a sheet, which is then pressed and dried. The principle [4: A) has not changed much in two thousand years. B) have not changed much in two thousand years. C) not changing much in two thousand years.]\n\nThe journey west. Knowledge of papermaking moved along the trade routes, [5: A) reaching Central Asia, then the Middle East, and finally Europe. B) reaching Central Asia, then the Middle East, and finally Europe, innit. C) and reached Central Asia, then it reached the Middle East, and then it reached Europe as well.] Early European mills [6: A) was built B) were built C) were build] beside rivers, because the beating of the fibres [7: A) require B) requires C) requiring] a great deal of power.\n\nToday. Most paper is now made from wood pulp rather than rags, [8: A) and recycling supplies a growing share of the fibre used. B) and recycling supply a growing share of the fibre used. C) and loads of it gets recycled these days.]", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences. This will be viewed by your future school.\n(1) Write a short informative text explaining how an everyday object you use is made, or how it reached the place where you live.\n(2) Write a short argumentative text about whether schools should replace printed books with screens. Include your own opinion."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 English Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
