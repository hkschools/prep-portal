e narrow spaces that large predators cannot enter", "D": "Fishing boats are not allowed to enter mangrove areas"}, "fig": "", "passage": "<strong>The Forests Between Land and Sea</strong><br><p>Mangroves are trees and shrubs that grow in the salt water of tropical and subtropical coasts. They are unusual among land plants in tolerating conditions that would kill almost any other tree, and the forests they form do a surprising amount of work.</p><p><b>Surviving in salt.</b> Salt water draws moisture out of ordinary roots. Mangroves manage in several ways: some species filter most of the salt out at the root, while others take it up and then push it out through glands in the leaves, where it can be seen as crystals. The mud they grow in holds very little oxygen, so many species also grow roots that rise above the surface and take in air directly.</p><p><b>A nursery for fish.</b> The tangle of roots below the waterline slows the current and creates spaces too narrow for large predators to enter. Young fish shelter there, and a considerable share of the fish caught on tropical coasts is thought to spend part of its early life among mangrove roots. Where mangroves are cleared, local fishing catches have often fallen in the years that follow.</p><p><b>Coastal defence.</b> A belt of mangroves reduces the force of waves reaching the shore, and the roots trap sediment, which builds up the land rather than allowing it to wash away. After several severe storms in recent decades, engineers compared stretches of coast with and without mangrove belts, and the sheltered stretches generally suffered less damage. This has made planting schemes attractive to governments, though a young planted forest does not offer the protection of a mature one.</p><p><b>Carbon.</b> Mangrove soils store carbon in waterlogged mud where it decays only slowly, and per hectare they hold considerably more carbon than most forests on dry land. Clearing a mangrove releases much of this, which is why the loss of a small area can matter out of proportion to its size.</p><p><b>Pressure and response.</b> Mangroves have been cleared for shrimp ponds, for building land and for firewood, and a substantial share of the world's mangrove area has been lost since the middle of the twentieth century. The rate of loss has slowed in several countries as the value of the forests has become better understood. Restoration is possible but not straightforward: seedlings planted in the wrong part of the tidal range, or in mud of the wrong kind, frequently fail, and schemes that simply count seedlings planted can report success where little forest has actually established.</p>", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What qualification does the writer add about mangrove planting schemes?", "options": {"A": "Planting schemes are usually more expensive than sea walls", "B": "Governments have generally refused to fund them", "C": "They can only succeed where storms are rare", "D": "A newly planted forest does not protect the coast as well as a mature one"}, "fig": "", "passage": "<strong>The Forests Between Land and Sea</strong><br><p>Mangroves are trees and shrubs that grow in the salt water of tropical and subtropical coasts. They are unusual among land plants in tolerating conditions that would kill almost any other tree, and the forests they form do a surprising amount of work.</p><p><b>Surviving in salt.</b> Salt water draws moisture out of ordinary roots. Mangroves manage in several ways: some species filter most of the salt out at the root, while others take it up and then push it out through glands in the leaves, where it can be seen as crystals. The mud they grow in holds very little oxygen, so many species also grow roots that rise above the surface and take in air directly.</p><p><b>A nursery for fish.</b> The tangle of roots below the waterline slows the current and creates spaces too narrow for large predators to enter. Young fish shelter there est shelters a different species of fish", "D": "Because small areas are the hardest to replant"}, "fig": "", "passage": "<strong>The Forests Between Land and Sea</strong><br><p>Mangroves are trees and shrubs that grow in the salt water of tropical and subtropical coasts. They are unusual among land plants in tolerating conditions that would kill almost any other tree, and the forests they form do a surprising amount of work.</p><p><b>Surviving in salt.</b> Salt water draws moisture out of ordinary roots. Mangroves manage in several ways: some species filter most of the salt out at the root, while others take it up and then push it out through glands in the leaves, where it can be seen as crystals. The mud they grow in holds very little oxygen, so many species also grow roots that rise above the surface and take in air directly.</p><p><b>A nursery for fish.</b> The tangle of roots below the waterline slows the current and creates spaces too narrow for large predators to enter. Young fish shelter there, and a considerable share of the fish caught on tropical coasts is thought to spend part of its early life among mangrove roots. Where mangroves are cleared, local fishing catches have often fallen in the years that follow.</p><p><b>Coastal defence.</b> A belt of mangroves reduces the force of waves reaching the shore, and the roots trap sediment, which builds up the land rather than allowing it to wash away. After several severe storms in recent decades, engineers compared stretches of coast with and without mangrove belts, and the sheltered stretches generally suffered less damage. This has made planting schemes attractive to governments, though a young planted forest does not offer the protection of a mature one.</p><p><b>Carbon.</b> Mangrove soils store carbon in waterlogged mud where it decays only slowly, and per hectare they hold considerably more carbon than most forests on dry land. Clearing a mangrove releases much of this, which is why the loss of a small area can matter out of proportion to its size.</p><p><b>Pressure and response.</b> Mangroves have been cleared for shrimp ponds, for building land and for firewood, and a substantial share of the world's mangrove area has been lost since the middle of the twentieth century. The rate of loss has slowed in several countries as the value of the forests has become better understood. Restoration is possible but not straightforward: seedlings planted in the wrong part of the tidal range, or in mud of the wrong kind, frequently fail, and schemes that simply count seedlings planted can report success where little forest has actually established.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which of these does the passage NOT tell the reader about mangroves?", "options": {"A": "Some of the uses for which mangroves have been cleared", "B": "How long a mangrove tree usually lives", "C": "A reason that replanting schemes can fail", "D": "A way that mangrove roots take in air"}, "fig": "", "passage": "<strong>The Forests Between Land and Sea</strong><br><p>Mangroves are trees and shrubs that grow in the salt water of tropical and subtropical coasts. They are unusual among land plants in tolerating conditions that would kill almost any other tree, and the forests they form do a surprising amount of work.</p><p><b>Surviving in salt.</b> Salt water draws moisture out of ordinary roots. Mangroves manage in several ways: some species filter most of the salt out at the root, while others take it up and then push it out through glands in the leaves, where it can be seen as crystals. The mud they grow in holds very little oxygen, so many species also grow roots that rise above the surface and take in air directly.</p><p><b>A nursery for fish.</b> The tangle of roots below the waterline slows the current and creates spaces too narrow for large predators to enter. Young fish shelter there, and a considerable share of the fish caught on tropical coasts is thought to spend part of its early life among mangrove roots. Where mangroves are cleared, local fishing catches have often fallen in the years that follow.</p><p><b>Coastal defence.</b> A belt of mangroves reduces the force of waves reaching the shore, and the roots trap sediment, which builds up the land rather than allowing it to wash away. After several severe storms in recent decades, engineers compared stretches of coast with and without mangrove belts, and the sheltered stretches generally suffered less damage. This has made planting schemes attractive to governments, though a young planted forest does not offer the protection of a mature one.</p><p><b>Carbon.</b> Mangrove soils store carbon in waterlogged mud where it decays only slowly, and per hectare they hold considerably more carbon than most forests on dry land. Clearing a mangrove releases much of this, which is why the loss of a small area can matter out of proportion to its size.</p><p><b>Pressure and response.</b> Mangroves have been cleared for shrimp ponds, for building land and for firewood, and a substantial share of the world's mangrove area has been lost since the middle of the twentieth century. The rate of loss has slowed in several countries as the value of the forests has become better understood. Restoration is possible but not straightforward: seedlings planted in the wrong part of the tidal range, or in mud of the wrong kind, frequently fail, and schemes that simply count seedlings planted can report success where little forest has actually established.</p>", "qnum": "13"}, {"n": "15", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task on an informative text. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for an informative text. Part 2: choose ONE task and write a paragraph of no more than 10 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nThe Monarch Butterfly Migration\n\nEach autumn, monarch butterflies travel from Canada and the northern United States to a small area of forest in central Mexico. [1: A) This text explains how the journey works and why it is unusual. B) Get this, butterflies fly thousands of miles, which is mad. C) Butterflies, well, they migrate.]\n\nThe journey. No single butterfly [2: A) complete B) completes C) completing] the round trip. The insects that fly south in autumn [3: A) is B) are C) be] several generations removed from those that flew north in spring, [4: A) and yet they find the same forests. B) and yet they finds the same forests. C) and yet finding the same forests.] How they navigate [5: A) are B) is C) were] still not fully understood, though the position of the sun appears to play a part.\n\nThe wintering forests. The butterflies gather on fir trees in such numbers that the branches [6: A) bends B) bend C) bending] under their weight. The forest keeps them cool enough to slow their bodies down, [7: A) which conserves the fat they need to survive the winter. B) which conserve the fat they need to survive the winter. C) conserving of the fat which they need it.]\n\nConcerns. Numbers have fallen over recent decades, [8: A) and it's a real shame if you ask me. B) and conservationists have linked the decline to habitat loss along the route. C) and loads of people reckon it's the weather.]", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences. This will be viewed by your future school.\n(1) Write a short informative text about an animal or plant that survives in a difficult environment. Explain what makes the environment difficult and how the living thing copes.\n(2) Write a short argumentative text about whether protecting wildlife should come before building new housing. Include your own opinion."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 English Drill 3</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();

    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
