<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>IDAT HKIS: Stage 4 English Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCHOOL = "HKIS", STAGE = "4", VERSION = "ENG-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "A full English practice section at Stage 4: five grammar questions, three vocabulary questions, a reading passage with five questions, and two writing tasks. One vocabulary question offers three choices rather than four, as on the real test. Several grammar questions turn on making a verb agree with the right subject."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Correct the underlined word.<br><br>The list of approved suppliers <u>have</u> been updated twice this year.", "options": {"A": "have", "B": "having", "C": "has been", "D": "has"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly.<br><br>Hardly ___ the announcement when the phone lines became busy.", "options": {"A": "had they made", "B": "they had made", "C": "did they make", "D": "have they made"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Which sentence is written correctly?", "options": {"A": "The report explains why did the delay occur and who authorised the extra cost.", "B": "The report explains why the delay occurred and who authorised the extra cost.", "C": "The report explains why the delay occurred and who did authorise the extra cost.", "D": "The report explains why occurred the delay and who the extra cost authorised."}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the option that completes the sentence correctly.<br><br>The equipment ___ regularly, which is why it has lasted so long.", "options": {"A": "services", "B": "has serviced", "C": "is serviced", "D": "was serviced"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "In the sentence below, which word makes the claim less definite?<br><br>The change appears to have reduced the queues, although no figures have been published.", "options": {"A": "reduced", "B": "although", "C": "published", "D": "appears"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "Which suffix means ABLE TO BE, as in a thing that can have something done to it?", "options": {"A": "-able", "B": "-ment", "C": "-ist"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "What does the saying below mean?<br><br>The two departments have been <i>at loggerheads</i> since the budget was announced.", "options": {"A": "In firm disagreement with each other", "B": "Working unusually closely together", "C": "Waiting for a decision from someone else", "D": "Competing for the same job"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word is closest in meaning to the underlined word, but describes a WEAKER version of it?<br><br>The audience was <u>astonished</u> by the ending.", "options": {"A": "stunned", "B": "surprised", "C": "delighted", "D": "bored"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "What does the passage say about the relationship between the ancient and modern Games?", "options": {"A": "The modern Games have been held without interruption since ancient times", "B": "The modern Games copy the ancient programme of events", "C": "The modern Games are a nineteenth-century revival rather than a continuation", "D": "The modern Games began at Olympia and later moved to Athens"}, "fig": "", "passage": "<strong>Reviving the Games</strong><br><p>The Olympic Games of the ancient world were held at Olympia in Greece for roughly a thousand years before being discontinued in late antiquity. The Games that take place today are not a continuation of them but a nineteenth-century revival, and the differences are as revealing as the similarities.</p><p><b>The revival.</b> Interest in the ancient Games grew as excavations at Olympia through the nineteenth century uncovered the site. Various local festivals borrowed the name, but the modern international Games date from a congress held in Paris in 1894, which agreed to hold a revived Olympics and appointed a committee to organise it. The first modern Games took place in Athens in 1896, with athletes from a small number of countries and a programme that would look thin beside a modern one.</p><p><b>What changed.</b> The ancient Games were a religious festival as much as a sporting one, held in honour of Zeus, and only free Greek men could compete. The modern Games were international from the start, though women were excluded from the first edition and were admitted to a limited programme in 1900. The range of sports has grown enormously, and events have been added and dropped in most cycles.</p><p><b>Amateurs and professionals.</b> For most of the twentieth century competitors had to be amateurs, meaning they could not be paid for their sport. The rule was applied unevenly, since athletes supported by a state or by a university were treated differently from those paid by a club, and it was gradually relaxed from the 1970s. Most sports at the Games now admit professionals.</p><p><b>Cost and its critics.</b> Host cities build stadiums, housing and transport, and the final bill has frequently exceeded the estimate made at the time of bidding. Some venues have found long-term uses and others have stood largely empty. Partly for this reason the number of cities bidding fell sharply in the 2010s, and the organisers changed the process to encourage the use of existing venues.</p><p><b>Why it survives.</b> Despite the criticism, the Games remain the largest regular gathering of nations for any purpose other than diplomacy, and for many sports they are the only occasion on which a wide public pays attention. That, rather than any link to Olympia, is what keeps them going.</p>", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "According to the passage, what did the congress of 1894 do?", "options": {"A": "It held the first modern Olympic Games", "B": "It began the excavations at Olympia", "C": "It admitted women to the Olympic programme", "D": "It agreed to revive the Olympics and appointed a committee to organise them"}, "fig": "", "passage": "<strong>Reviving the Games</strong><br><p>The Olympic Games of the ancient world were held at Olympia in Greece for roughly a thousand years before being discontinued in late antiquity. The Games that take place today are not a continuation of them but a nineteenth-century revival, and the differences are as revealing as the similarities.</p><p><b>The revival.</b> Interest in the ancient Games grew as excavations at Olympia through the nineteenth century uncovered the site. Various local festivals borrowed the name, but the modern international Games date from a congress held in Paris in 1894, which agreed to hold a revived Olympics and appointed a committee to organise it. The first modern Games took place in Athens in 1896, with athletes from a small number of countries and a programme that would look thin beside a modern one.</p><p><b>What changed.</b> The ancient Games were a religious festival as much as a sporting one, held in honour of Zeus, and only free Greek men could compete. The modern Games were international from the start, though women were excluded from the first edition and were admitted to a limited programme in 1900. The range of sports has grown enormously, and events have been added and dropped in most cycles.</p><p><b>Amateurs and professionals.</b> For most of the twentieth century competitors had to be amateurs, meaning they could not be paid for their sport. The rule was applied unevenly, since athletes supported by a state or by a university were treated differently from those paid by a club, and it was gradually relaxed from the 1970s. Most sports at the Games now admit professionals.</p><p><b>Cost and its critics.</b> Host cities build stadiums, housing and transport, and the final bill has frequently exceeded the estimate made at the time of bidding. Some venues have found long-term uses and others have stood largely empty. Partly for this reason the number of cities bidding fell sharply in the 2010s, and the organisers changed the process to encourage the use of existing venues.</p><p><b>Why it survives.</b> Despite the criticism, the Games remain the largest regular gathering of nations for any purpose other than diplomacy, and for many sports they are the only occasion on which a wide public pays attention. That, rather than any link to Olympia, is what keeps them going.</p>", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "Why does the writer describe the amateur rule as having been 'applied unevenly'?", "options": {"A": "Athletes funded by a state or a university were treated differently from those paid by a club", "B": "Some countries ignored the rule completely", "C": "The rule applied only to certain sports", "D": "Officials could not agree on what counted as a sport"}, "fig": "", "passage": "<strong>Reviving the Games</strong><br><p>The Olympic Games of the ancient world were held at Olympia in Greece for roughly a thousand years before being discontinued in late antiquity. The Games that take place today are not a continuation of them but a nineteenth-century revival, and the differences are as revealing as the similarities.</p><p><b>The revival.</b> Interest in the ancient Games grew as excavations at Olympia through the nineteenth century uncovered the site. Various local festivals borrowed the name, but the modern international Games date from a congress held in Paris in 1894, which agreed to hold a revived Olympics and appointed a committee to organise it. The first modern Games took place in Athens in 1896, with athletes from a small number of countries and a programme that would look thin beside a modern one.</p><p><b>What changed.</b> The ancient Games were a religious festival as much as a sporting one, held in honour of Zeus, and only free Greek men could compete. The modern Games were international from the start, though women were excluded from the first edition and were admitted to a limited programme in 1900. The range of sports has grown enormously, and events have been added and dropped in most cycles.</p><p><b>Amateurs and professionals.</b> For most of the twentieth century competitors had to be amateurs, meaning they could not be paid for their sport. The rule was applied unevenly, since athletes supported by a state or by a university were treated differently from those paid by a club, and it was gradually relaxed from the 1970s. Most sports at the Games now admit professionals.</p><p><b>Cost and its critics.</b> Host cities build stadiums, housing and transport, and the final bill has frequently exceeded the estimate made at the time of bidding. Some venues have found long-term uses and others have stood largely empty. Partly for this reason the number of cities bidding fell sharply in the 2010s, and the organisers changed the process to encourage the use of existing venues.</p><p><b>Why it survives.</b> Despite the criticism, the Games remain the largest regular gathering of nations for any purpose other than diplomacy, and for many sports they are the only occasion on which a wide public pays attention. That, rather than any link to Olympia, is what keeps them going.</p>", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What reason does the passage give for the fall in the number of cities bidding to host the Games?", "options": {"A": "A shortage of cities large enough to host the Games", "B": "Concern about costs that had often exceeded the original estimates", "C": "The decision to allow professional athletes to compete", "D": "Disagreements about which sports should be included"}, "fig": "", "passage": "<strong>Reviving the Games</strong><br><p>The Olympic Games of the ancient world were held at Olympia in Greece for roughly a thousand years before being discontinued in late antiquity. The Games that take place today are not a continuation of them but a nineteenth-century revival, and the differences are as revealing as the similarities.</p><p><b>The revival.</b> Interest in the ancient Games grew as excavations at Olympia through the nineteenth century uncovered the site. Various local festivals borrowed the name, but the modern international Games date from a congress held in Paris in 1894, which agreed to hold a revived Olympics and appointed a committee to organise it. The first modern Games took place in Athens in 1896, with athletes from a small number of countries and a programme that would look thin beside a modern one.</p><p><b>What changed.</b> The ancient Games were a religious festival as much as a sporting one, held in honour of Zeus, and only free Greek men could compete. The modern Games were international from the start, though women were excluded from the first edition and were admitted to a limited programme in 1900. The range of sports has grown enormously, and events have been added and dropped in most cycles.</p><p><b>Amateurs and professionals.</b> For most of the twentieth century competitors had to be amateurs, meaning they could not be paid for their sport. The rule was applied unevenly, since athletes supported by a state or by a university were treated differently from those paid by a club, and it was gradually relaxed from the 1970s. Most sports at the Games now admit professionals.</p><p><b>Cost and its critics.</b> Host cities build stadiums, housing and transport, and the final bill has frequently exceeded the estimate made at the time of bidding. Some venues have found long-term uses and others have stood largely empty. Partly for this reason the number of cities bidding fell sharply in the 2010s, and the organisers changed the process to encourage the use of existing venues.</p><p><b>Why it survives.</b> Despite the criticism, the Games remain the largest regular gathering of nations for any purpose other than diplomacy, and for many sports they are the only occasion on which a wide public pays attention. That, rather than any link to Olympia, is what keeps them going.</p>", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Which of these questions about the Olympic Games does the passage leave unanswered?", "options": {"A": "When women were first admitted to the programme", "B": "Where the first modern Games were held", "C": "How the host city for each Games is chosen", "D": "Who could compete in the ancient Games"}, "fig": "", "passage": "<strong>Reviving the Games</strong><br><p>The Olympic Games of the ancient world were held at Olympia in Greece for roughly a thousand years before being discontinued in late antiquity. The Games that take place today are not a continuation of them but a nineteenth-century revival, and the differences are as revealing as the similarities.</p><p><b>The revival.</b> Interest in the ancient Games grew as excavations at Olympia through the nineteenth century uncovered the site. Various local festivals borrowed the name, but the modern international Games date from a congress held in Paris in 1894, which agreed to hold a revived Olympics and appointed a committee to organise it. The first modern Games took place in Athens in 1896, with athletes from a small number of countries and a programme that would look thin beside a modern one.</p><p><b>What changed.</b> The ancient Games were a religious festival as much as a sporting one, held in honour of Zeus, and only free Greek men could compete. The modern Games were international from the start, though women were excluded from the first edition and were admitted to a limited programme in 1900. The range of sports has grown enormously, and events have been added and dropped in most cycles.</p><p><b>Amateurs and professionals.</b> For most of the twentieth century competitors had to be amateurs, meaning they could not be paid for their sport. The rule was applied unevenly, since athletes supported by a state or by a university were treated differently from those paid by a club, and it was gradually relaxed from the 1970s. Most sports at the Games now admit professionals.</p><p><b>Cost and its critics.</b> Host cities build stadiums, housing and transport, and the final bill has frequently exceeded the estimate made at the time of bidding. Some venues have found long-term uses and others have stood largely empty. Partly for this reason the number of cities bidding fell sharply in the 2010s, and the organisers changed the process to encourage the use of existing venues.</p><p><b>Why it survives.</b> Despite the criticism, the Games remain the largest regular gathering of nations for any purpose other than diplomacy, and for many sports they are the only occasion on which a wide public pays attention. That, rather than any link to Olympia, is what keeps them going.</p>", "qnum": "13"}, {"n": "15", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task on an informative text. Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and suitable for an informative text. Part 2: choose ONE task and write a paragraph of no more than 10 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the informative text below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Think about text type, formality, grammar, style and word choice.\n\nThe Underground Railway: Building Beneath a City\n\nThe first underground passenger railway opened in London in 1863. [1: A) This text sets out how it was built and what followed. B) So here's the story, and it's a good one. C) Trains, but underground, which is odd.]\n\nDigging the first line. The earliest tunnels [2: A) was dug B) were dug C) were dig] by opening a trench along a street, building the tunnel inside it and covering it over again. This method, known as cut and cover, [3: A) cause B) caused C) causing] enormous disruption, since the street above [4: A) had to be closed for months. B) have to be closed for months. C) had to be closing for months.]\n\nGoing deeper. Later lines were bored far below the surface using a shield, [5: A) which allowed workers to tunnel without disturbing the buildings above. B) which allow workers to tunnel without disturbing the buildings above. C) allowing of the workers to tunnel and not disturbing above.] The deep tunnels were [6: A) narrower B) more narrow C) narrowest] than the earlier ones, which is why some carriages are curved at the shoulder.\n\nSince then. Underground railways now operate in cities across the world, [7: A) and each has been adapted to its own ground conditions. B) and each have been adapted to its own ground conditions. C) and they all just copied London, basically.] The engineering problems [8: A) remains B) remain C) remaining] much the same: water, soft ground and the buildings overhead.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 10 sentences. This will be viewed by your future school.\n(1) Write a short informative text explaining how people travel around your city, and what a visitor would need to know to use the system.\n(2) Write a short argumentative text about whether cities should spend more on public transport than on roads for cars. Include your own opinion."}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 English Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
