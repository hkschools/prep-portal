<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 4 Critical Thinking Drill 2</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 4 Critical Thinking Drill 2</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "CT-D2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions. Use only the information given in each question."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The health authority should send its flu vaccination reminders by text message rather than by letter, because a third of the letters it posted last winter came back undelivered.\"<br><br>ASSUMPTION: \"The authority holds a current mobile telephone number for a substantial share of the people it needs to reach.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The hospital should publish the average waiting time for each of its clinics on its website, because patients currently arrive expecting to be seen within minutes and are angry when they are not.\"<br><br>ASSUMPTION: \"The hospital's clinics have longer waiting times than the clinics at other hospitals in the region.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The city should plant street trees along the eastern road corridor, because monitoring shows particulate pollution is higher there than anywhere else in the city and street trees trap particulates.\"<br><br>ASSUMPTION: \"Particulate pollution damages health more than the other pollutants found on that corridor.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The repeat-prescription collection scheme should be extended to the rural districts, because in the urban districts where it already runs, patients receive their repeat medicines on average nine days sooner than they did before.\"<br><br>ASSUMPTION: \"The delay that the scheme removes in the urban districts also occurs in the rural districts.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"In a survey of 900 adults registered at the clinic, 48 per cent said they had had a flu vaccination in the previous twelve months. Among the surveyed adults aged over 65, the figure was 74 per cent.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "More than 400 of the adults surveyed were aged over 65.", "B": "According to the survey, most of the surveyed adults aged over 65 had been vaccinated in the previous twelve months.", "C": "Most of the adults surveyed had been vaccinated in the previous twelve months.", "D": "Vaccination among the clinic's patients has risen since the previous year."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every meal served in the hospital canteen is prepared in the hospital's own kitchen. The chicken curry served at lunch on Thursday was a meal served in the hospital canteen.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Every meal prepared in the hospital's own kitchen is served in the canteen.", "B": "The hospital's own kitchen prepares food for no other building.", "C": "The chicken curry served at lunch on Thursday was prepared in the hospital's own kitchen.", "D": "The chicken curry was made with ingredients bought locally."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No patient on the ward's Monday list had been referred by a family doctor. Some patients referred by family doctors that week were waiting for a hearing test.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "No patient on the ward's Monday list was waiting for a hearing test.", "B": "Every patient referred by a family doctor that week was waiting for a hearing test.", "C": "The ward saw more patients on Monday than on any other day of that week.", "D": "At least one patient waiting for a hearing test that week was not on the ward's Monday list."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Whenever the air quality index passes 150, the school cancels outdoor games. On Wednesday the school did not cancel outdoor games.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The school cancels outdoor games for no reason other than air quality.", "B": "The air quality index was below 100 on Wednesday.", "C": "The air quality index did not pass 150 on Wednesday.", "D": "Outdoor games were played at the school on Wednesday."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A district began offering free vitamin D supplements to residents aged over 70 two years ago. In the two years since, falls requiring hospital treatment in that age group have fallen by 12 per cent. A pharmacy audit found that 3,800 of the district's 11,000 residents aged over 70 had collected the supplement at least once. The district's public health lead told a council meeting that she expected injuries from falls to keep dropping.\"<br><br>CONCLUSIONS:<br>(1) The supplement scheme caused the drop in falls requiring hospital treatment.<br>(2) Fewer than half of the district's residents aged over 70 have collected the supplement at least once.<br>(3) Falls requiring hospital treatment in that age group will keep dropping.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "All three conclusions follow.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "Only conclusion (2) follows."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A hospital opened a same-day telephone line for its asthma patients in January. Between January and June the line handled 4,200 calls, of which 1,900 were resolved by a nurse without an appointment being made. Over the same six months, attendances at the hospital's emergency department for asthma were 9 per cent lower than in the same period a year earlier. The clinical director told the trust board that the line had taken the pressure off the emergency department.\"<br><br>CONCLUSIONS:<br>(1) Fewer than half of the calls the line handled were resolved without an appointment being made.<br>(2) The clinical director has told the board that the line reduced pressure on the emergency department.<br>(3) The telephone line caused the fall in asthma attendances at the emergency department.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Only conclusion (2) follows.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A country introduced a levy on sugary drinks four years ago. Manufacturers reformulated many products, and the average sugar content of the drinks sold fell by 29 per cent over the period. Total soft drink sales by volume were 3 per cent higher at the end of the period than at the start. A dental association survey of 500 dentists found that 64 per cent believed children's dental health had improved.\"<br><br>CONCLUSIONS:<br>(1) Children's dental health has improved since the levy was introduced.<br>(2) People bought more soft drinks by volume at the end of the period than at the start.<br>(3) Most of the dentists surveyed believed that children's dental health had improved.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "All three conclusions follow.", "D": "Only conclusion (3) follows."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A city ambulance service publishes its response times each quarter. Last quarter it reached 71 per cent of the most urgent calls within eight minutes, against a published target of 75 per cent. It received 46,000 emergency calls in the quarter, of which 9,200 were classified as most urgent. The service's annual report states that recruiting paramedics is its principal operational challenge.\"<br><br>CONCLUSIONS:<br>(1) The service did not meet its eight-minute target for the most urgent calls last quarter.<br>(2) The most urgent calls made up one fifth of the emergency calls the service received last quarter.<br>(3) The service has stated that recruiting paramedics is its principal operational challenge.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "Only conclusion (1) follows."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every patient admitted to the isolation unit is swab tested on arrival.<br>2. No patient swab tested on arrival is moved to a general ward on the same day.<br>3. Mr Okafor was admitted to the isolation unit on Monday.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Every patient swab tested on arrival was admitted to the isolation unit.", "B": "Mr Okafor was swab tested on Monday.", "C": "Mr Okafor was not moved to a general ward on Monday."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All of the clinic's evening appointments are booked through the online system.<br>2. Some appointments booked through the online system are cancelled by the patient.<br>3. Mrs Lau has an evening appointment at the clinic.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "Mrs Lau's appointment will be cancelled by her.", "B": "Mrs Lau's appointment was booked through the online system.", "C": "Every appointment booked through the online system is an evening appointment."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every district in the region runs a school vaccination programme.<br>2. Some districts in the region also run a workplace vaccination programme.<br>3. Eastvale is a district in the region.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Eastvale runs a workplace vaccination programme.", "B": "Eastvale runs a school vaccination programme.", "C": "At least one district in the region runs both a school and a workplace vaccination programme."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every prescription dispensed at the pharmacy is entered in that day's log.<br>2. No prescription entered in the day's log lacks a pharmacist's signature.<br>3. Prescription 207 was dispensed at the pharmacy on Sunday.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "Every prescription carrying a pharmacist's signature was dispensed at the pharmacy.", "B": "Prescription 207 was the only prescription dispensed at the pharmacy on Sunday.", "C": "Prescription 207 carries a pharmacist's signature."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should flu vaccination be offered free of charge to all primary school children at school?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. My two children have never had a flu vaccination and they have never had flu either. Meanwhile my neighbour had the vaccination last year and was ill for a fortnight afterwards. I do not see how anyone can look at that and tell me the injection is doing what they claim it does.", "B": "Yes. In a region that introduced school-based vaccination in half of its districts first, an independent team compared the two halves over three flu seasons. In the districts with the school programme, confirmed flu cases among children were about 30 per cent lower and cases among adults over 65 in the same districts were around 10 per cent lower, which is what the argument for vaccinating children in the first place predicts. Absence rates for reasons other than flu were unchanged, so the classroom time given up was recovered.", "C": "Yes. Children are the most precious thing any society has, and no parent should ever have to watch a child struggle to breathe when something could have been done. If we can protect them, how can we possibly justify sitting on our hands? Anyone who has nursed a sick child through the night already knows what the right answer is."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should patients be charged a fee when they miss a hospital appointment without cancelling it?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Once you start charging patients for one thing you will end up charging them for everything, and the whole principle of care free at the point of use goes out of the window. First it is missed appointments, then it is prescriptions, then it is the appointments themselves. The line has to be held somewhere and it may as well be held here.", "B": "Yes. Every missed appointment is money poured away, and everyone knows somebody who simply could not be bothered to turn up. People value what they pay for and ignore what they get for nothing. Charge them and they will remember; that is human nature and no amount of official research is going to change it.", "C": "No. One hospital group introduced a missed appointment fee and an independent evaluation tracked 12,000 appointments for a year before and a year after. Missed appointments fell by about 2 per cent, while the proportion of missed appointments accounted for by patients from the poorest districts rose sharply, and the number of those patients who did not rebook at all roughly doubled. The fee therefore buys a very small gain in attendance at the cost of pushing the least well off out of care altogether."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should smoking be banned in the outdoor seating areas of restaurants and cafes?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. Nobody should have to eat their dinner in a cloud of somebody else's smoke, and it is frankly astonishing that in this day and age we are still even discussing it. Would we let a stranger pour something into a child's drink? Because that is really what this amounts to when you think about it.", "B": "Yes. In a city that extended its indoor smoking ban to outdoor seating, monitors placed at 40 venues recorded average airborne nicotine at outdoor tables falling to about a fifth of its previous level within six months. Trade body figures for the same venues showed takings over the following year within 1 per cent of the city-wide trend for restaurants, so the loss of custom that operators had warned of did not appear.", "C": "No. People have smoked outside cafes for as long as there have been cafes. If somebody does not care for it there is a whole street to walk down and a room indoors to sit in. We cannot keep rearranging public life around whoever complains most loudly this year."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should packaged foods be required to carry a colour-coded label showing fat, sugar and salt content on the front of the pack?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Anyone who wants this information can already find it on the back of the packet, printed in full. If people cannot be troubled to turn the box over, a coloured square on the front is hardly going to transform them into careful shoppers. The problem is not labelling, it is that people do not want to know.", "B": "Yes. We are raising a generation that will be less healthy than their parents, and every day we delay is another day of children eating things no one should be eating. Surely a simple coloured label is the very least we can do? If it saves even one family from a lifetime of illness it will have been worth every penny.", "C": "Yes. When one supermarket chain applied colour-coded front labels to its own-brand range and a comparable chain did not, researchers followed the purchases of 20,000 loyalty card holders across both chains for eighteen months. In the labelled chain, the average sugar content of the baskets bought fell by about 6 per cent while total spending per basket was unchanged, and shoppers in the comparison chain showed no such fall. The label therefore shifts what people buy without simply making them buy less."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 Critical Thinking Drill 2</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
