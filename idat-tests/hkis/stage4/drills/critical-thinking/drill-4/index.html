<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 4 Critical Thinking Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 4 Critical Thinking Drill 4</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "CT-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions. Use only the information given in each question."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The messaging service should let a user report a harassing message with a single tap, because at present the user has to leave the conversation, find the settings menu and complete a four-page form.\"<br><br>ASSUMPTION: \"Most harassing messages on the service are sent by people the recipient does not know.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The app store should require developers to state what data an application collects before the download button appears, because users at present agree to collection that they discover only afterwards.\"<br><br>ASSUMPTION: \"Users would read a statement placed before the download button.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The platform should employ moderators who speak the local language in each market it enters, because complaints in markets without local-language moderators take four times as long to resolve.\"<br><br>ASSUMPTION: \"The delay in those markets is caused at least partly by the language in which complaints are written.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Advertisements aimed at children should be banned from video platforms, because a child watching a video cannot reliably tell where the programme ends and the advertisement begins.\"<br><br>ASSUMPTION: \"No adult is ever misled by an advertisement on a video platform.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Whenever a post is reported by more than fifty accounts, the platform sends it for review by a person. The post about the harbour tunnel was not sent for review by a person.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The post about the harbour tunnel did not break the platform's rules.", "B": "The post about the harbour tunnel was not reported by more than fifty accounts.", "C": "The platform sends posts for review by a person only when they are reported.", "D": "Fewer than fifty accounts saw the post about the harbour tunnel."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every application in the store's Editor's Choice list has passed the store's security review. The mapping application Nightfall is in the Editor's Choice list.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Nightfall has passed the store's security review.", "B": "Every application that has passed the security review is in the Editor's Choice list.", "C": "Nightfall is the most downloaded mapping application in the store.", "D": "Applications that are not in the Editor's Choice list have not passed the security review."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A platform reported that 41 per cent of the accounts it removed last year were removed for automated spam, and that 3 per cent of the accounts it removed had posted political content.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Most of the accounts removed last year were removed for automated spam.", "B": "Accounts that post political content are less likely to be removed than other accounts.", "C": "The platform removed more spam accounts last year than in the previous year.", "D": "According to the platform, fewer than half of the accounts it removed last year were removed for automated spam."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No advertisement approved by the platform's automated checker last month was aimed at children. Some advertisements aimed at children were submitted to the platform last month.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The platform approved no advertisements at all last month.", "B": "Every advertisement aimed at children was rejected by the platform last month.", "C": "At least one advertisement submitted last month was not approved by the automated checker.", "D": "Advertisements aimed at children are always reviewed by a person."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A video platform introduced a reminder that appears after ninety minutes of continuous viewing. In the six months that followed, the average session length among accounts registered to users aged 13 to 17 fell from 74 minutes to 66 minutes. A survey of 2,000 of those users found that 45 per cent recalled seeing the reminder. The platform's blog described the change as a success.\"<br><br>CONCLUSIONS:<br>(1) Average session length among accounts registered to 13 to 17 year olds was lower in the six months after the reminder was introduced than before it.<br>(2) Fewer than half of the surveyed users recalled seeing the reminder.<br>(3) The reminder caused the fall in average session length.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "C": "Only conclusion (1) follows.", "D": "Conclusions (1) and (2) follow; conclusion (3) does not follow."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"An online retailer began showing a delivery emissions figure beside each item at checkout. Over the following quarter, the share of customers choosing the slower consolidated delivery option rose from 21 per cent to 34 per cent. The retailer's sustainability manager said the figure had changed the way people shop. A poll of 300 customers found that 52 per cent said they had noticed the figure.\"<br><br>CONCLUSIONS:<br>(1) The emissions figure caused the rise in the share of customers choosing consolidated delivery.<br>(2) A majority of the customers polled said they had noticed the emissions figure.<br>(3) Most of the retailer's customers now choose the consolidated delivery option.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (2) follows.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "All three conclusions follow.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A social platform published its annual transparency report. It states that the platform removed 12,400 accounts for coordinated inauthentic behaviour during the year, of which 7,900 were removed in the final quarter. It states that the platform employed 340 investigators at the end of the year, against 210 a year earlier. The report describes election integrity as the platform's highest enforcement priority.\"<br><br>CONCLUSIONS:<br>(1) Most of the accounts removed for coordinated inauthentic behaviour during the year were removed in the final quarter.<br>(2) The platform employed more investigators at the end of the year than a year earlier.<br>(3) The report describes election integrity as the platform's highest enforcement priority.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (2) follows.", "B": "All three conclusions follow.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not follow."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A country required video platforms to verify a user's age before showing content rated for adults. In the year that followed, one large platform reported a 38 per cent fall in the number of accounts registered to users aged under 18 in that country. A children's charity said the requirement had made the internet safer for children. Traffic to a group of smaller platforms with no verification requirement rose by 22 per cent over the same year.\"<br><br>CONCLUSIONS:<br>(1) Fewer children in that country now see content rated for adults.<br>(2) One large platform reported a fall in the number of accounts registered to under-18 users in that country.<br>(3) Traffic to a group of smaller platforms without a verification requirement rose over the same year.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "Only conclusion (3) follows.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every advertisement shown to a logged-out visitor is selected without using personal data.<br>2. No advertisement selected without using personal data is sold at the premium rate.<br>3. Advertisement 1140 was shown to a logged-out visitor.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Every advertisement selected without using personal data is shown to logged-out visitors.", "B": "Advertisement 1140 was not sold at the premium rate.", "C": "Advertisement 1140 was selected without using personal data."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All of the platform's verified accounts have supplied a government-issued document.<br>2. Some accounts that have supplied a government-issued document are not verified.<br>3. The account HarbourWatch is verified on the platform.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "HarbourWatch supplied its document after it was verified.", "B": "HarbourWatch has supplied a government-issued document.", "C": "Every account that has supplied a government-issued document is verified."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. No image uploaded without a caption may be used in the platform's news module.<br>2. Every image supplied by the wire agency has a caption.<br>3. Image 62 is used in the platform's news module.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Image 62 has a caption.", "B": "At least one image is used in the platform's news module.", "C": "Image 62 was supplied by the wire agency."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every complaint the moderation team upholds is entered in the enforcement record.<br>2. No entry in the enforcement record is deleted within twelve months of being made.<br>3. The moderation team upheld a complaint about the account TunnelNews in March.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "Every entry in the enforcement record is an upheld complaint.", "B": "The account TunnelNews was suspended in March.", "C": "The entry for the complaint about TunnelNews will not be deleted before the following March."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should online platforms be required to verify the age of every user before allowing an account to be created?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. In a country that imposed such a requirement, an independent study tracked usage for two years. Accounts registered to under-18s on the platforms covered fell sharply, but a survey of 4,000 teenagers found the proportion reporting weekly use of platforms outside the rules almost doubled, and the total time they reported online was unchanged. Meanwhile 1 in 9 adults surveyed said they had abandoned an account rather than upload identity documents. The requirement therefore moves young users rather than protecting them, at a real cost to adult access.", "B": "No. I have had accounts on these sites for fifteen years and never once had to prove who I am, and I have come to no harm at all. Nobody I know has either. This is a solution looking for a problem, dreamed up by people who do not use the services they are so keen to regulate.", "C": "Yes. There is no excuse in this day and age for handing a child the keys to the entire internet and hoping for the best. We would not let a ten-year-old wander into a casino, so why on earth do we let one wander into anything a screen puts in front of them? Parents deserve better and children deserve better."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should people who are paid to promote a product online be required to label every such post as an advertisement?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Everybody already knows perfectly well that these people are paid. Nobody watching a famous person hold up a bottle of shampoo genuinely believes they bought it themselves. A label states the obvious and clutters the post for no benefit whatsoever.", "B": "Yes. A regulator required the label on one large platform while leaving a comparable platform unchanged for a year. Researchers showed matched groups of viewers posts from both. On the labelled platform, viewers correctly identified paid posts 71 per cent of the time against 34 per cent on the unlabelled one, and among viewers aged 13 to 15 the gap was wider still. Engagement with the labelled posts fell by only 3 per cent, so the objection that labelling destroys the format is not borne out.", "C": "Yes. It is basic honesty, and honesty is not something we should have to argue about. If someone is being paid to say a thing, they should say so, and anyone who objects to putting one word at the top of a post has told you everything you need to know about why the rule is necessary."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should online platforms be held legally responsible for content that their users post?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. These companies have grown rich beyond imagining on other people's words and it is high time they were made to answer for them. A newspaper editor is responsible for every line printed; why should someone running a service used by two billion people be treated any differently just because the words arrive by keyboard?", "B": "Yes. My cousin was targeted for months on one of these sites and every report she made vanished into silence. Nothing was done until a local reporter took an interest. If the company had faced a court instead of a complaints form it would have moved on the first day, and no family should have to go through what hers did.", "C": "No. Where one jurisdiction made platforms liable for user posts, researchers examined 50,000 removal decisions in the following year. Removals rose by more than half, but an independent panel judged that 38 per cent of the removed posts broke no rule at all, with complaints about local officials among the most heavily affected categories. Reports of the harmful material the law was aimed at fell by only 4 per cent. The law therefore removes a great deal of lawful speech while barely touching its target."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should advertising that is targeted using a person's browsing history be banned?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. It is frankly sinister that a shop you glanced at once should follow you around the internet for a fortnight. It feels like being watched, and being watched is not something anyone should have to accept simply for reading the news. If it makes your skin crawl, that is your own judgement telling you something.", "B": "No. When one large publisher stopped using browsing history to target advertising across half of its sites for six months, an independent analysis found advertising revenue on those sites fell by about 8 per cent, while measured reader trust and time on page were unchanged. On the other half, revenue tracked the market. A ban would therefore transfer income away from publishers who depend on it without delivering the improvement in reader experience that supporters of a ban predict.", "C": "No. Nobody is forced to use these services, and anyone who does not care for targeted advertising can switch it off in about four taps, or use a different browser, or simply not look. Complaining about the price of something you have chosen to accept is not really an argument at all."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 Critical Thinking Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
