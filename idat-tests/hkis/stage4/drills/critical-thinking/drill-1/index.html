<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 4 Critical Thinking Drill 1</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}

  /* ---------- maths typography (mirrors the PDF paper.css) ---------- */
  .frac{display:inline-block;vertical-align:-0.5em;text-align:center;
        font-size:.92em;line-height:1.05;margin:0 .15em}
  .frac>.num{display:block;padding:0 .25em;border-bottom:1px solid currentColor}
  .frac>.den{display:block;padding:0 .25em}
  .rad{border-top:1px solid currentColor;padding:0 .18em 0 .1em;margin-left:-.06em}
  sup,sub{font-size:.68em;line-height:0}
  sup{vertical-align:.55em}
  sub{vertical-align:-.25em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 4 Critical Thinking Drill 1</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "CT-D1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions. Use only the information given in each question."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The broadcaster should move its evening news bulletin from 18:00 to 21:00, because the younger viewers it is trying to reach are rarely at home at 18:00.\"<br><br>ASSUMPTION: \"A substantial number of those younger viewers are available to watch at 21:00.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The magazine should drop its horoscope page, because those two pages could instead carry the investigative reporting that has won the title its recent awards.\"<br><br>ASSUMPTION: \"None of the magazine's readers believe that horoscopes can predict future events.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The news agency should put a second fact checker on the overnight shift, because errors that reach publication between midnight and 06:00 stay uncorrected far longer than errors published during the day.\"<br><br>ASSUMPTION: \"The overnight errors are of a kind that a fact checker could catch before publication.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Political advertisements online should be required to display who paid for them, because at present a voter scrolling a feed has no way of telling a party advertisement from an ordinary post.\"<br><br>ASSUMPTION: \"Most voters would vote differently if they knew who had paid for an advertisement.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every reporter on the paper's business desk has completed the company's data-handling course. Priya is a reporter on the paper's business desk.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The data-handling course is compulsory for all staff at the paper.", "B": "Priya has completed the data-handling course.", "C": "Everyone who has completed the data-handling course works on the business desk.", "D": "Priya joined the business desk after the course was introduced."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No article published on the paper's front page last month was written by a freelance contributor. Some articles written by freelance contributors last month were about the harbour redevelopment.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "No article about the harbour redevelopment appeared on the front page last month.", "B": "Every article written by a freelance contributor last month was about the harbour redevelopment.", "C": "The paper published fewer freelance articles than staff articles last month.", "D": "At least one article about the harbour redevelopment did not appear on the front page last month."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A radio station's audience survey found that 62 per cent of its listeners aged under 30 had used the station's mobile app at least once in the previous week. Among its listeners aged over 60, the figure was 18 per cent.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The station has more listeners aged under 30 than listeners aged over 60.", "B": "Most of the station's listeners aged over 60 do not own a mobile phone.", "C": "According to the survey, a majority of the station's listeners aged under 30 had used the app in the previous week.", "D": "The app is easier to use for younger listeners than for older ones."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Whenever the overnight editor is absent, the front page is signed off by the deputy editor. Tuesday's front page was not signed off by the deputy editor.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The overnight editor signs off the front page whenever the deputy editor is absent.", "B": "The deputy editor was absent on Tuesday.", "C": "Tuesday's front page contained an error.", "D": "The overnight editor was not absent on Tuesday."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A national broadcaster began publishing a weekly corrections log eighteen months ago. In the twelve months since, the media regulator received 34 per cent fewer complaints about the broadcaster's factual accuracy than in the twelve months before it. A survey of 1,200 of the broadcaster's viewers found that 71 per cent of those surveyed had never heard of the log. Several senior journalists at the broadcaster have said publicly that the log makes them check contested figures a second time before transmission.\"<br><br>CONCLUSIONS:<br>(1) Most of the viewers surveyed did not know that the corrections log existed.<br>(2) The corrections log caused the fall in accuracy complaints to the regulator.<br>(3) At least some journalists at the broadcaster say the log has changed the way they work.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (2) follows.", "B": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "C": "All three conclusions follow.", "D": "Conclusions (1) and (2) follow; conclusion (3) does not follow."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A regional newspaper closed its print edition six years ago and now publishes only online. Its online readership is 40 per cent larger than its print readership in the final year of printing, but 55 per cent of that online readership lives outside the region the paper covers. The editor has said that the newsroom now employs four reporters, down from nine in the final print year.\"<br><br>CONCLUSIONS:<br>(1) The paper reaches more readers now than in its final year of printing.<br>(2) Fewer than half of the paper's current readers live in the region it covers.<br>(3) The fall in the number of reporters was caused by the closure of the print edition.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Only conclusion (1) follows.", "C": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A press regulator publishes the outcome of every complaint it upholds. Last year it upheld 96 complaints, of which 61 concerned headlines that the regulator judged were not supported by the article printed beneath them. Three publishers between them accounted for 44 of the 96 upheld complaints. In a public lecture, the regulator's chair described headline accuracy as the body's main area of concern.\"<br><br>CONCLUSIONS:<br>(1) Most of the complaints upheld last year concerned headlines unsupported by the article beneath them.<br>(2) Fewer than half of the upheld complaints were accounted for by those three publishers.<br>(3) The regulator's chair has publicly identified headline accuracy as the body's main area of concern.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "C": "Only conclusion (3) follows.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not follow."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A streaming service released a documentary series about a mountaineering expedition. In the month after release, searches for climbing courses on one training provider's website were 28 per cent higher than in the month before release. The service reported that 2.1 million households watched the series and described the release as its strongest launch of the year.\"<br><br>CONCLUSIONS:<br>(1) The documentary series caused the rise in searches for climbing courses.<br>(2) Searches for climbing courses on that provider's website were higher in the month after release than in the month before.<br>(3) More than 2.1 million people watched the series.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (2) follows.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "All three conclusions follow.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every article in the paper's Saturday supplement is commissioned at least a month in advance.<br>2. No article commissioned at least a month in advance is written by the duty news reporter.<br>3. The article \"The Long Walk Home\" appeared in the paper's Saturday supplement.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "\"The Long Walk Home\" was not written by the duty news reporter.", "B": "Every article commissioned at least a month in advance appears in the Saturday supplement.", "C": "\"The Long Walk Home\" was commissioned at least a month in advance."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All of the station's live phone-in programmes are broadcast with a seven-second delay.<br>2. Some programmes broadcast with a seven-second delay are pre-recorded.<br>3. \"Harbour Talk\" is a live phone-in programme on the station.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "Every programme broadcast with a seven-second delay is a live phone-in programme.", "B": "\"Harbour Talk\" is pre-recorded.", "C": "\"Harbour Talk\" is broadcast with a seven-second delay."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. No photograph in the archive that lacks a named photographer may be licensed to advertisers.<br>2. Every photograph taken by the paper's own staff has a named photographer.<br>3. Photograph 4471 in the archive may be licensed to advertisers.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "At least one photograph in the archive may be licensed to advertisers.", "B": "Photograph 4471 was taken by the paper's own staff.", "C": "Photograph 4471 has a named photographer."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every complaint the regulator upholds in a given month is published in that month's report.<br>2. The regulator's report for March contained no complaint about the Gazette.<br>3. A complaint about the Gazette was ruled on by the regulator in March.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "The regulator upheld no complaints at all in March.", "B": "The Gazette did not breach the regulator's code in March.", "C": "The complaint about the Gazette ruled on in March was not upheld."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should public money be used to fund local news reporting in districts that no longer have a paid local newspaper?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. An independent evaluation of one national reporting fund compared 60 districts that received funded reporters with 60 similar districts that did not, over three years. In the funded districts, the share of council decisions reported before they were taken roughly doubled and turnout at local elections rose slightly, while an audit of 400 funded stories found no case in which the funding body had influenced what was published. The scheme therefore delivers the civic benefit claimed for it without the political interference its critics predicted.", "B": "Yes, without question. A town without a newspaper is a town without a memory, and no child should grow up in a place whose history goes unrecorded. Can we really put a price on the stories that make somewhere what it is? Anyone who has stood in an emptied newsroom knows the answer in their heart.", "C": "No. My own town lost its paper years ago and honestly nothing much has changed. I still hear everything I need to know from neighbours and from the residents' group I belong to. Why should taxpayers be asked to pay for journalists nobody actually requested? If people genuinely wanted local news, they would pay for it themselves, exactly as they used to."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should social media platforms be required to attach a visible label to images that were generated by artificial intelligence?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. I can always tell when an image has been generated: the hands are wrong, the lettering is nonsense and the light never quite falls properly. Anyone who looks carefully for two seconds can see it. Labels would only be needed by people who cannot be bothered to look, and we should not redesign the whole internet for them.", "B": "Yes. One large platform trialled a visible label on generated images with half of its users for six months. An independent research team found that, among labelled users, posts later judged false by fact checkers were shared 24 per cent less often, while sharing of accurate posts was essentially unchanged. Reported uncertainty about whether an image was real fell in the labelled group and did not fall in the unlabelled group. The label therefore reduces the spread of the material it targets without suppressing ordinary content.", "C": "No. Once we start labelling one kind of content there will be no logical place to stop. Today it is generated images, tomorrow it will be edited photographs, then filters, then anything a lawyer decides looks misleading, and in the end every post on the internet will carry a warning sticker that nobody reads. Better not to take the first step at all."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should a country replace the licence fee that funds its public broadcaster with advertising revenue?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. A review of ten countries whose public broadcasters made this change found that within five years the share of the schedule given to news and current affairs had fallen by between a fifth and a third in nine of the ten, while the broadcasters' total audience share was broadly unchanged. If the purpose of a public broadcaster is to supply programming the market will not, the change removes the output that justifies its existence and buys no additional reach in return.", "B": "No. The public broadcaster is part of who we are as a nation. It has been there through every crisis and every celebration, and to hand it over to advertisers would be to sell off something that belongs to all of us. Some things are simply above money, and this is one of them.", "C": "Yes. I have not watched that channel in years and I resent the bill landing every April. Nobody I know watches it either. It is absurd that a household should be forced to pay for programmes it never chooses to see, when everything else we watch is paid for by the people who actually want it."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should newspapers be barred from naming a person who has been arrested but not charged with any offence?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. In one jurisdiction that introduced such a restriction, researchers tracked 300 arrests that did not lead to charges for two years either side of the change. Lasting harm to employment among those arrested fell by about a third after the restriction, while the number of witnesses coming forward after a public appeal, which opponents had predicted would collapse, was statistically unchanged, since police appeals may still name a suspect where there is an investigative reason to.", "B": "Yes. Imagine your own name in a headline beside the word arrested, with neighbours reading it over breakfast and your children hearing about it at school, and then imagine the police quietly deciding weeks later that there was never a case. No family should have to live through that, and anyone who says otherwise has clearly never been on the receiving end.", "C": "No. The press has always named people at arrest and the sky has not fallen. Journalists know their job far better than any committee drafting rules, and once you start telling editors what they may not print you are only a short step from telling them what they must. Freedom of the press is not something you trim a little at a time."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 Critical Thinking Drill 1</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
