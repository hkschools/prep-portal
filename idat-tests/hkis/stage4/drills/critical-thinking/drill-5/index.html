<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 4 Critical Thinking Drill 5</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 4 Critical Thinking Drill 5</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "4", VERSION = "CT-D5";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions. Use only the information given in each question."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The college should advertise its evening courses on local radio, because the adults it wants to reach are at work when its recruitment stalls are open.\"<br><br>ASSUMPTION: \"Local radio reaches more people in the district than any other advertising medium.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The health service should recruit nurses trained overseas, because the number of domestic training places has been smaller than the number of vacancies for eight years running.\"<br><br>ASSUMPTION: \"Nurses trained overseas provide better care than nurses trained domestically.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The blood service should open a donation centre inside the main railway station, because the reason lapsed donors most often give for stopping is the time the journey to a centre takes.\"<br><br>ASSUMPTION: \"A meaningful number of lapsed donors pass through the main railway station.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The apprenticeship scheme should guarantee a job interview to everyone who completes it, because the reason school leavers most often give for not applying is that they doubt the scheme leads anywhere.\"<br><br>ASSUMPTION: \"School leavers would treat a guaranteed interview as a credible sign that the scheme leads somewhere.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No apprentice who joined the scheme in September had previously worked in the industry. Some apprentices who joined the scheme in September hold a first aid certificate.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "No holder of a first aid certificate has previously worked in the industry.", "B": "Every apprentice who joined the scheme in September holds a first aid certificate.", "C": "At least one holder of a first aid certificate had not previously worked in the industry.", "D": "The scheme prefers applicants who hold a first aid certificate."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every course at the college that leads to a professional licence is inspected each year. The plumbing course at the college leads to a professional licence.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Every course inspected each year leads to a professional licence.", "B": "The plumbing course passed its most recent inspection.", "C": "The plumbing course at the college is inspected each year.", "D": "Courses that do not lead to a professional licence are never inspected."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A careers service surveyed 1,400 school leavers. It found that 46 per cent had applied for at least one apprenticeship. Among the surveyed leavers whose parents had themselves done an apprenticeship, the figure was 68 per cent.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "According to the survey, most of the surveyed leavers whose parents had done an apprenticeship had applied for at least one themselves.", "B": "Most of the school leavers surveyed had applied for at least one apprenticeship.", "C": "More than 700 of those surveyed had a parent who had done an apprenticeship.", "D": "Having a parent who did an apprenticeship makes a school leaver more likely to apply for one."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Whenever a training centre fails two inspections in a row, the authority suspends its funding. The authority did not suspend the funding of the Riverside training centre.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The Riverside centre has never failed an inspection.", "B": "The authority suspends funding for no reason other than failed inspections.", "C": "The Riverside centre passed both of its two most recent inspections.", "D": "The Riverside centre did not fail two inspections in a row."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A city opened four walk-in physiotherapy clinics two years ago. Referrals to hospital orthopaedic departments in the city have fallen by 7 per cent over the two years. The clinics recorded 26,000 appointments, of which 9,400 were with patients who had never used a physiotherapy service before. The health board minutes put the cost of running the clinics at 2.4 million dollars over the period.\"<br><br>CONCLUSIONS:<br>(1) The walk-in clinics caused the fall in referrals to hospital orthopaedic departments.<br>(2) Fewer than half of the appointments at the clinics were with patients new to physiotherapy.<br>(3) The health board minutes put the running cost of the clinics at 2.4 million dollars over the period.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Only conclusion (1) follows.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"An adult literacy programme enrolled 2,600 learners last year, of whom 1,560 completed the full course. A follow-up six months later reached 400 of those who completed and found that 55 per cent were in paid work, against 38 per cent of the same group at the time they enrolled. The programme's annual report names retaining tutors as its main difficulty.\"<br><br>CONCLUSIONS:<br>(1) Most of the learners who enrolled last year completed the full course.<br>(2) Among those followed up, a higher proportion were in paid work six months after the course than at the time they enrolled.<br>(3) The programme's annual report names retaining tutors as its main difficulty.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "C": "Only conclusion (3) follows.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A national campaign encouraging adults to have their blood pressure checked ran for three months. Pharmacies reported 340,000 checks during the campaign, against 210,000 in the same three months a year earlier. A survey of 1,000 adults found that 62 per cent recalled seeing the campaign. The campaign's director told a conference that the campaign had saved lives.\"<br><br>CONCLUSIONS:<br>(1) Pharmacies reported more blood pressure checks during the campaign than in the same three months a year earlier.<br>(2) Most of the adults surveyed recalled seeing the campaign.<br>(3) The campaign saved lives.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "Only conclusion (2) follows."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A vocational college reported that 900 students began its engineering diploma three years ago and that 480 of them completed it. The principal described the completion rate as among the best in the sector. A survey of 120 employers in the region found that 44 per cent had recruited a graduate of the diploma.\"<br><br>CONCLUSIONS:<br>(1) The completion rate of the diploma is among the best in the sector.<br>(2) More than half of the students who began the diploma completed it.<br>(3) Most of the employers surveyed had recruited a graduate of the diploma.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "Only conclusion (2) follows.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every trainee on the night rotation carries a personal alarm.<br>2. No trainee carrying a personal alarm works alone in the store room.<br>3. Farida is a trainee on the night rotation.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Farida carries a personal alarm.", "B": "Farida does not work alone in the store room.", "C": "Every trainee who carries a personal alarm is on the night rotation."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All of the clinic's home visits are made by a qualified nurse.<br>2. Some visits made by a qualified nurse are not home visits.<br>3. Mr Silva received a home visit from the clinic.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "Every visit made by a qualified nurse is a home visit.", "B": "Mr Silva's visit was made by a qualified nurse.", "C": "Mr Silva is unable to travel to the clinic."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. No applicant without a valid first aid certificate may be placed on the summer rota.<br>2. Every applicant trained at the city centre branch has a valid first aid certificate.<br>3. Tomas was placed on the summer rota.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Tomas was trained at the city centre branch.", "B": "At least one applicant was placed on the summer rota.", "C": "Tomas has a valid first aid certificate."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every learner who misses three sessions in a term is contacted by a tutor.<br>2. No learner contacted by a tutor is removed from the register in that term.<br>3. Ayesha missed three sessions this term.<br><br>Which one of the following conclusions FOLLOWS from these facts?", "options": {"A": "Ayesha was not removed from the register this term.", "B": "Every learner contacted by a tutor has missed three sessions.", "C": "Ayesha will complete the course."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should an apprenticeship place receive the same amount of public funding as a university place?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. For too long this country has treated anyone who works with their hands as a second-class citizen, and the funding gap is simply that prejudice written down in a budget. It is time we said plainly that a plumber matters as much as a lawyer. Anyone who disagrees should try living for a week without either.", "B": "Yes. When one region raised its apprenticeship funding to match its university funding, an independent evaluation compared it with three regions that did not, over four years. Employer-offered places rose by 22 per cent in the funded region against 4 per cent elsewhere, completion rates rose by six percentage points, and university applications in that region were unchanged, which addresses the objection that funding one route simply drains the other.", "C": "No. Universities cost far more to run, with laboratories, libraries and researchers to pay for, whereas an apprentice is on an employer's premises using the employer's equipment. Paying the same for two things that cost different amounts to provide would be nothing but waste."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should hospitals be required to publish the results of individual surgeons rather than of departments as a whole?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. In one health system that moved to surgeon-level publication, researchers examined 60,000 operations over three years either side of the change. Death rates for the operations that went ahead improved slightly, but the proportion of high-risk patients who were offered surgery at all fell by 9 per cent, and referrals of those patients to a small number of specialist centres rose sharply. Publishing at surgeon level therefore improves the figures partly by changing which patients are operated on, which is not the same as improving care.", "B": "Yes. Sunlight is the best disinfectant, as the saying goes, and anybody who resists being measured usually has a reason for resisting. If surgeons are as good as they say they are, they have nothing whatever to fear from the numbers being published.", "C": "Yes. It is my body on the table and I have every right to know who is holding the knife. Nobody would buy a car without knowing which factory built it. The idea that a patient should be kept in the dark about the one person whose skill matters most is indefensible in any other walk of life."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should evening classes be free of charge for adults who hold no formal qualification?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Something given away for nothing is never valued. People who pay for a course turn up to it, and people who are handed one drift away after a fortnight. Charge even a small fee and you will fill the room with people who mean it, which is better for everyone including the tutor.", "B": "Yes. When one authority removed fees for adults without a qualification while a neighbouring authority kept them, an independent study followed both for three years. Enrolment among the target group rose by 60 per cent in the fee-free authority and was flat next door, completion rates in the two authorities were within one percentage point of each other, and the additional cost per completed course was lower in the fee-free authority because the classes ran fuller.", "C": "Yes. Nobody chooses to leave school without a qualification; life chooses it for them, through illness or a family that needed the wages or a school that gave up on them. Charging those same people for a second chance is a way of punishing them twice, and a decent society does not do that."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should employers be required to give staff paid time off to attend a health screening appointment?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. A person's health is worth more than an afternoon's output, and any employer who cannot see that has lost sight of what a workplace is for. We are talking about people, not machines, and treating them as though the two were the same is exactly how we ended up needing a law in the first place.", "B": "No. Where does this end? Today it is a screening appointment, tomorrow it is the dentist, and before long an employer will be paying staff to attend anything with a clinic attached to it. A business cannot function if every worker has an open invitation to be somewhere else on full pay.", "C": "Yes. In a country that introduced this right, an evaluation covering 900 firms compared the two years before and after. Screening attendance among shift and hourly paid staff, the group with the lowest previous attendance, rose by 31 per cent, while recorded absence for all other reasons was unchanged and payroll costs rose by less than a tenth of one per cent. The requirement therefore reaches the group it was aimed at without the disruption employers had predicted."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 4 Critical Thinking Drill 5</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
