<title>IDAT HKIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

do when they found the clay head?", "options": {"A": "Dig a well to find water for their village", "B": "Dig the foundations for a new museum", "C": "Search for buried treasure from the emperor's tomb", "D": "Plant crops in the dry countryside"}, "fig": "", "passage": "<strong>The Farmer Who Found an Army</strong><br>In the spring of 1974, a Chinese farmer named Yang Zhifa was digging a well with his brothers in the dry countryside near the city of Xi'an. Their village desperately needed water, but instead of striking a spring, Yang's spade struck something hard. Out of the yellow earth came a life-sized human head made of baked clay. The brothers had no idea that they had just made one of the most famous archaeological discoveries of the twentieth century.\n\nArchaeologists hurried to the site and began to dig. Beneath the fields lay an enormous underground chamber holding thousands of clay soldiers arranged in neat battle lines. The figures belonged to the Terracotta Army, created more than 2,200 years ago to guard the tomb of Qin Shi Huang, the first emperor of China. People at that time believed the emperor would continue to rule in the afterlife, so he would need an army to protect him there.\n\nWhat amazes visitors most is the detail. No two soldiers are exactly alike: their faces, hairstyles and expressions all differ, and the generals stand taller than the ordinary foot soldiers. Yet the army was also a marvel of organisation. Workshops produced the legs, bodies and arms separately, almost like a modern assembly line, and craftsmen then finished each head by hand. Many figures even carry a small stamp naming the workshop that made them, so that careless work could be traced and punished. The figures were once painted in bright reds, purples and greens, but the ancient paint is so fragile that it flakes away within minutes of meeting the air.\n\nThe soldiers were not the only treasures underground. Archaeologists uncovered thousands of real bronze weapons, including swords, spears and crossbow triggers, some of them still sharp after two thousand years. Two half-sized bronze chariots, each pulled by four bronze horses, were found lying in hundreds of pieces and took restorers years to piece together again.\n\nExperts estimate that about 8,000 soldiers, along with clay horses and wooden chariots, lie buried at the site, and that around 700,000 workers helped to build the tomb complex. Yet much of it remains untouched. Archaeologists have deliberately left large sections buried, waiting until scientists develop better ways to protect the delicate colours. The emperor's own burial mound has never been opened at all. Ancient writers claimed that rivers of shining mercury flowed inside it, and modern soil tests do show unusually high levels of mercury in the hill, so the greatest chamber of all remains sealed for now.\n\nAs for Yang Zhifa, the farmer who was only looking for water, his life changed completely. A museum was built over the very field where his spade first struck clay, and for many years he sat inside it, signing books and greeting curious visitors from every corner of the world. He sometimes joked that he never did find any water; he found an emperor's army instead.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>deliberately</u> as it is used in the passage ('Archaeologists have deliberately left large sections buried')?", "options": {"A": "carelessly", "B": "secretly", "C": "temporarily", "D": "on purpose"}, "fig": "", "passage": "<strong>The Farmer Who Found an Army</strong><br>In the spring of 1974, a Chinese farmer named Yang Zhifa was digging a well with his brothers in the dry countryside near the city of Xi'an. Their village desperately needed water, but instead of striking a spring, Yang's spade struck something hard. Out of the yellow earth came a life-sized human head made of baked clay. The brothers had no idea that they had just ater; he found an emperor's army instead.", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "English", "stem": "In the final paragraph, the writer describes Yang Zhifa as 'the farmer who was only looking for water'. What does this phrase emphasise?", "options": {"A": "How poor Yang Zhifa's village was before the discovery", "B": "That one of history's greatest discoveries happened completely by accident", "C": "That Yang Zhifa never received any reward for what he found", "D": "That digging wells mattered more to Yang Zhifa than the clay army did"}, "fig": "", "passage": "<strong>The Farmer Who Found an Army</strong><br>In the spring of 1974, a Chinese farmer named Yang Zhifa was digging a well with his brothers in the dry countryside near the city of Xi'an. Their village desperately needed water, but instead of striking a spring, Yang's spade struck something hard. Out of the yellow earth came a life-sized human head made of baked clay. The brothers had no idea that they had just made one of the most famous archaeological discoveries of the twentieth century.\n\nArchaeologists hurried to the site and began to dig. Beneath the fields lay an enormous underground chamber holding thousands of clay soldiers arranged in neat battle lines. The figures belonged to the Terracotta Army, created more than 2,200 years ago to guard the tomb of Qin Shi Huang, the first emperor of China. People at that time believed the emperor would continue to rule in the afterlife, so he would need an army to protect him there.\n\nWhat amazes visitors most is the detail. No two soldiers are exactly alike: their faces, hairstyles and expressions all differ, and the generals stand taller than the ordinary foot soldiers. Yet the army was also a marvel of organisation. Workshops produced the legs, bodies and arms separately, almost like a modern assembly line, and craftsmen then finished each head by hand. Many figures even carry a small stamp naming the workshop that made them, so that carel tailed clay army built to guard China's first emperor."}, "fig": "", "passage": "<strong>The Farmer Who Found an Army</strong><br>In the spring of 1974, a Chinese farmer named Yang Zhifa was digging a well with his brothers in the dry countryside near the city of Xi'an. Their village desperately needed water, but instead of striking a spring, Yang's spade struck something hard. Out of the yellow earth came a life-sized human head made of baked clay. The brothers had no idea that they had just made one of the most famous archaeological discoveries of the twentieth century.\n\nArchaeologists hurried to the site and began to dig. Beneath the fields lay an enormous underground chamber holding thousands of clay soldiers arranged in neat battle lines. The figures belonged to the Terracotta Army, created more than 2,200 years ago to guard the tomb of Qin Shi Huang, the first emperor of China. People at that time believed the emperor would continue to rule in the afterlife, so he would need an army to protect him there.\n\nWhat amazes visitors most is the detail. No two soldiers are exactly alike: their faces, hairstyles and expressions all differ, and the generals stand taller than the ordinary foot soldiers. Yet the army was also a marvel of organisation. Workshops produced the legs, bodies and arms separately, almost like a modern assembly line, and craftsmen then finished each head by hand. Many figures even carry a small stamp naming the workshop that made them, so that careless work could be traced and punished. The figures were once painted in bright reds, purples and greens, but the ancient paint is so fragile that it flakes away within minutes of meeting the air.\n\nThe soldiers were not the only treasures underground. Archaeologists uncovered thousands of real bronze weapons, including swords, spears and crossbow triggers, some of them still sharp after two thousand years. Two half-sized bronze chariots, each pulled by four bronze horses, were found lying in hundreds of pieces and took restorers years to piece together again.\n\nExperts estimate that about 8,000 soldiers, along with clay horses and wooden chariots, lie buried at the site, and that around 700,000 workers helped to build the tomb complex. Yet much of it remains untouched. Archaeologists have deliberately left large sections buried, waiting until scientists develop better ways to protect the delicate colours. The emperor's own burial mound has never been opened at all. Ancient writers claimed that rivers of shining mercury flowed inside it, and modern soil tests do show unusually high levels of mercury in the hill, so the greatest chamber of all remains sealed for now.\n\nAs for Yang Zhifa, the farmer who was only looking for water, his life changed completely. A museum was built over the very field where his spade first struck clay, and for many years he sat inside it, signing books and greeting curious visitors from every corner of the world. He sometimes joked that he never did find any water; he found an emperor's army instead.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Stage 3 Concise writing = two tasks on one screen: a drop-down editing cloze over a short narrative (6 blanks) followed by ONE free-written paragraph of no more than 8 sentences, chosen from a procedure/explanation task or a narrative task.", "label": "", "body": "", "hint": "This section has two parts. In Part 1, read the whole passage first, then choose the best option for each numbered bracket. In Part 2, choose ONE of the two tasks and write a single clear paragraph of no more than 8 sentences, using full sentences, correct punctuation and your best vocabulary. Your writing may be viewed by your future school.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear.\n\nLast Saturday morning, my cousin Mei and I arrived [1: A) at B) to C) in] the community centre for the junior baking competition. Each pair of bakers [2: A) were B) are C) was] given ninety minutes to prepare a fruit tart. I nearly dropped the mixing bowl [3: A) so B) because C) although] my hands were trembling with excitement. My pastry looked [4: A) good B) best C) better] than Mei's, but hers smelled absolutely wonderful. At the end, the prizes [5: A) handed out B) were handed out C) handing out] by a famous chef from a hotel in Central. Standing on the stage with our silver medals was the [6: A) proudest B) most proud C) more proud] moment of my whole year.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 8 sentences:\n(1) Explain, step by step, how a student should borrow a book from the school library and return it on time, so that a brand-new student could follow your instructions easily.\n(2) Write about a day when bad weather changed your family's plans. Describe what happened and how the day turned out in the end."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you do best?", "options": {"A": "Playing sports or moving my body", "B": "Learning and remembering things at school", "C": "Drawing, building or making things", "D": "Making friends and helping people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "A new sport I have never played", "B": "A game where I don't know the rules yet", "C": "Performing on a stage in front of people", "D": "Building something nobody has built before"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What do you like the most?", "options": {"A": "Making up my own games", "B": "Playing games I already know really well", "C": "Solving puzzles and brain teasers", "D": "Playing games together with a team"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "What helps people get along with each other?", "options": {"A": "Listening carefully to each other", "B": "Sharing what you have", "C": "Taking turns fairly", "D": "Saying kind and encouraging words"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "What do you want to do better?", "options": {"A": "Sports and physical activities", "B": "My school subjects", "C": "Speaking in front of other people", "D": "Making and creating things"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "How comfortable are you when plans change suddenly?", "options": {"A": "Very comfortable, I quite like surprises", "B": "Mostly comfortable, I adjust after a moment", "C": "A little uncomfortable, I like to know what is happening", "D": "I find sudden changes hard, I like to know the plan ahead of time"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "Imagine you are given four things: a ball, a paintbrush, a notebook and a puzzle. What would you most want to do?", "options": {"A": "Start a ball game with friends", "B": "Paint a picture from my imagination", "C": "Write or draw my own story in the notebook", "D": "Sit down quietly and work on the puzzle"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "What makes you sad?", "options": {"A": "When a friend is left out", "B": "When nobody listens to my idea", "C": "When friends argue with each other", "D": "When I can't help someone who needs it"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "How comfortable are you when a teacher or friend tells you what they think of your work?", "options": {"A": "Very comfortable, hearing it helps me", "B": "Mostly comfortable, I listen and take it in", "C": "A little wobbly, I need a moment first", "D": "I find it hard to hear, I care a lot about doing well"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "What do you like the least?", "options": {"A": "When something is too easy", "B": "When I have to stop before I am finished", "C": "When I have to wait a long time for my turn", "D": "When I have to do everything by myself"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "How important is it to find your own way of solving a problem?", "options": {"A": "Not so important, I like using ways that already work", "B": "A little important, I mostly use ways I have been shown", "C": "Quite important, I often try my own way first", "D": "Very important, I love finding my own way"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "What helps a group work well together?", "options": {"A": "Everyone sharing their ideas", "B": "Everyone having a clear job to do", "C": "Everyone encouraging each other", "D": "Everyone listening before deciding"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "What do you like the most about yourself?", "options": {"A": "I keep trying even when things are hard", "B": "I have lots of ideas", "C": "I am a good friend", "D": "I can work well on my own"}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "Imagine you are given: a skateboard you have never ridden, a 500-piece puzzle, a board game you know really well, and a kite on a windy day. What would you pick first?", "options": {"A": "Try riding the skateboard", "B": "Start the big 500-piece puzzle", "C": "Play the board game I know well", "D": "Fly the kite in the wind"}, "cnum": "14"}, {"n": "33", "type": "selfeval", "section": "Character", "stem": "What makes you happy?", "options": {"A": "Figuring something out all by myself", "B": "Making something nobody has made before", "C": "Finding a surprising new use for everyday things", "D": "Finishing a plan step by step"}, "cnum": "15"}, {"n": "34", "type": "selfeval", "section": "Character", "stem": "How important is it to know how your friend is feeling?", "options": {"A": "I don't think about it much, we just have fun together", "B": "A little important, I notice big feelings when they show", "C": "Important, I often check how my friends are doing", "D": "Very important, I usually check how my friend is feeling first"}, "cnum": "16"}, {"n": "35", "type": "info", "title": "Maths", "body": "Read each question carefully and choose the best answer."}, {"n": "36", "type": "mcq", "section": "Maths", "stem": "What is the highest common factor (HCF) of 24 and 36?", "options": {"A": "6", "B": "12", "C": "8", "D": "72"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "What is the remainder when 250 is divided by 12?", "options": {"A": "20", "B": "2", "C": "0", "D": "10"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "In the number 6.462, the 6 in the ones place is worth how many times as much as the 6 in the hundredths place?", "options": {"A": "10", "B": "1000", "C": "100", "D": "2"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "Ava and Ben share $72 in the ratio 4 : 5. How much does Ben receive?", "options": {"A": "$40", "B": "$32", "C": "$36", "D": "$45"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "Which of these has the greatest value?  7/10,  0.65,  3/5,  55%", "options": {"A": "7/10", "B": "0.65", "C": "3/5", "D": "55%"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "Kiri buys 3 notebooks at $4.85 each and pays with a $20 note. How much change does she receive?", "options": {"A": "$14.55", "B": "$5.45", "C": "$4.55", "D": "$15.15"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "The rectangle shown measures 16 cm by 4 cm. A square has the SAME AREA as this rectangle. What is the perimeter of the square?", "options": {"A": "40 cm", "B": "64 cm", "C": "32 cm", "D": "20 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"340\" height=\"230\" viewBox=\"0 0 340 230\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"340\" height=\"230\" fill=\"white\"/><rect x=\"70\" y=\"50\" width=\"200\" height=\"120\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"170.0\" y=\"198\" text-anchor=\"middle\" font-size=\"15\">16 cm</text><text x=\"58\" y=\"115.0\" text-anchor=\"end\" font-size=\"15\">4 cm</text></svg>", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "Look at the four labelled shapes. Which shape has exactly ONE line of symmetry?", "options": {"A": "The rectangle", "B": "The rhombus", "C": "The regular hexagon", "D": "The trapezium"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><rect x=\"16\" y=\"38\" width=\"88\" height=\"48\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><polygon points=\"180.0,28 207,62 180.0,96 153,62\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><polygon points=\"300.0,28.0 329.4,45.0 329.4,79.0 300.0,96.0 270.6,79.0 270.6,45.0\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"386,86 454,86 439,38 401,38\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "The two triangles shown are similar. The smaller triangle has base 6 cm and height 4 cm. The larger triangle has base 15 cm. What is the height of the larger triangle?", "options": {"A": "10 cm", "B": "13 cm", "C": "8 cm", "D": "22.5 cm"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"420\" height=\"220\" viewBox=\"0 0 420 220\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"420\" height=\"220\" fill=\"white\"/><polygon points=\"40,150 110,150 40,95\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"40\" y=\"138\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1\"/><text x=\"75\" y=\"168\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">6 cm</text><text x=\"30\" y=\"122\" font-size=\"13\" text-anchor=\"end\" fill=\"#333\">4 cm</text><polygon points=\"230,175 370,175 230,65\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><rect x=\"230\" y=\"163\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1\"/><text x=\"300\" y=\"193\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">15 cm</text><text x=\"220\" y=\"120\" font-size=\"13\" text-anchor=\"end\" fill=\"#C00\">?</text></svg>", "passage": "", "qnum": "9"}, {"n": "45", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "46", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Minibuses leave Green Hill stop at 8:25, 8:40, 8:55 and 9:10. Every journey to the ferry pier stop takes exactly 20 minutes, and from that stop it is an 8-minute walk to the pier gate. Nadia must be at the pier gate by 9:20 at the latest. Which is the LATEST minibus she can catch?", "options": {"A": "The 8:25 minibus", "B": "The 8:40 minibus", "C": "The 8:55 minibus", "D": "The 9:10 minibus"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "47", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Someone ate the last cupcake in the classroom. Exactly ONE of these three statements is true, and the other two are false.\n\nAmy says: \"Ben ate it.\"\nBen says: \"I did not eat it.\"\nCara says: \"I did not eat it.\"\n\nWho ate the cupcake?", "options": {"A": "Amy", "B": "Ben", "C": "Cara", "D": "It cannot be worked out from the information given"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "The four words below all begin with the same four letters. If they were listed in a dictionary, which word would appear LAST?\n\nportrait    portable    portray    porter", "options": {"A": "portray", "B": "portrait", "C": "porter", "D": "portable"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the pattern of shapes in the figure. The shapes follow TWO rules at the same time from left to right. Which shape should come NEXT in the pattern?", "options": {"A": "An unshaded octagon", "B": "A shaded heptagon", "C": "A shaded hexagon", "D": "An unshaded heptagon"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "You have 9 gold coins that look exactly the same. One of them is slightly heavier than the rest. You have a balance scale with two pans but no weights. What is the SMALLEST number of weighings that GUARANTEES you find the heavier coin, no matter how the weighings turn out?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The sports centre should buy more table-tennis tables, because at lunchtime every table is in constant use and pupils stand in a queue waiting for a turn.\"\n\nPROPOSED ASSUMPTION: \"At lunchtime, some pupils who want to play cannot get a table straight away.\"\n\nUsing ONLY the information in the statement, which option BEST evaluates whether this assumption is logical?", "options": {"A": "Yes — the statement says every table is in use while pupils queue for a turn, so at that moment some pupils who want to play cannot get a table straight away.", "B": "Yes — table tennis is the most popular activity at the sports centre, so demand will always be greater than the number of tables.", "C": "No — the statement does not tell us exactly how many pupils use the sports centre, so nothing can be concluded.", "D": "No — the pupils in the queue might only be watching their friends rather than waiting to play."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every stall at the weekend market sells food or crafts (or both), and some stalls do sell both. The stall nearest the entrance does not sell any food.\"\n\nUsing ONLY the information above, which one of the following MUST be true?", "options": {"A": "The stall nearest the entrance sells both food and crafts.", "B": "The stall nearest the entrance sells crafts.", "C": "Most of the stalls at the market sell food.", "D": "No other stall at the market sells crafts."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The town library has one borrowing rule: DVDs may be borrowed for 3 days only, and every other kind of item may be borrowed for 2 weeks. On Monday, Kiran borrowed one item, and the library told him he does not have to return it until two weeks later.\"\n\nPROPOSED CONCLUSIONS:\n1. The item Kiran borrowed is not a DVD.\n2. The item Kiran borrowed is a book.\n3. Some library items may be kept for longer than 3 days.\n\nUsing ONLY the information in the statement, which conclusions follow and which do not?", "options": {"A": "All three conclusions follow.", "B": "Only conclusion 1 follows.", "C": "Conclusions 1 and 3 follow; conclusion 2 does not follow.", "D": "Only conclusion 3 follows."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should the public swimming pool set aside one lane for beginners only?\"\n\nFour people each give an argument. Treating each argument on its own merits, which is the STRONGEST argument?", "options": {"A": "Yes — my cousin swims at the pool every single morning and says a beginners-only lane would make the pool feel far more welcoming and look much better organised.", "B": "No — beginners should simply practise harder until they can keep up with everyone else, and then no special lane would ever be needed.", "C": "No — when a nearby pool tried reserving a lane last year the queues were terrible for weeks, and reserving lanes always causes overcrowding everywhere it is tried.", "D": "Yes — a leisure-department study of similar pools found beginner lanes cut swimmer collisions by about 40% with little effect on waiting times."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
