<head>

<title>IDAT HKIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

const SCHOOL = "HKIS", STAGE = "3", VERSION = "3";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nDon't call me at nine o'clock tonight, because I ______ for my history exam then.", "options": {"A": "study", "B": "will study", "C": "will be studying", "D": "studied"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "The prefix \"sub-\" is added to the word \"marine.\" What does \"submarine\" tell you about where the vessel travels?", "options": {"A": "between two seas", "B": "under the water", "C": "around the coast"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nMy sister and ______ cooked the whole dinner by ______ while our parents were out.", "options": {"A": "I ... ourselves", "B": "me ... ourselves", "C": "I ... ourself", "D": "me ... themselves"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word \"famished\" in the sentence below?\n\nThe campers had skipped both breakfast and lunch, so by the evening they were famished and ate everything on their plates.", "options": {"A": "bored", "B": "frightened", "C": "cheerful", "D": "very hungry"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the option that best rewrites the sentence in the passive voice.\n\nActive: The manager is signing the contracts.", "options": {"A": "The contracts are signed by the manager.", "B": "The contracts are being signed by the manager.", "C": "The contracts were signed by the manager.", "D": "The contracts have been signed by the manager."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nMy uncle lives so far away that we only see him <u>once in a blue moon</u>.", "options": {"A": "late at night", "B": "during holidays only", "C": "very rarely", "D": "without any warning"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Read the sentence below. One of the four labelled sections contains an error. Choose the labelled section that must be changed.\n\nEither the manager (A) or the cashiers (B) is (C) responsible for the missing receipts. (D)", "options": {"A": "the manager", "B": "or the cashiers", "C": "is", "D": "the missing receipts"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "Which word shows the STRONGEST degree of being tired?\n\nAfter running the full marathon in the heat, Daniel was completely ______.", "options": {"A": "exhausted", "B": "sleepy", "C": "weary", "D": "drowsy"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "In the sentence below, which word shows that something is REQUIRED (that you have no choice)?\n\nVisitors must sign in at the front desk, and they may borrow a locker if they wish.", "options": {"A": "front", "B": "wish", "C": "may", "D": "must"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which option is the correctly spelled word to complete the sentence?\n\nIt is ______ to wear a helmet whenever you ride a bicycle on the road.", "options": {"A": "neccessary", "B": "necessary", "C": "necesary", "D": "neccesary"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "What is the closest in meaning to the word \"coax\" as it is used in the fifth paragraph (\"coax the frozen machine back to life\")?", "options": {"A": "force roughly", "B": "gently persuade into working", "C": "completely replace", "D": "switch off"}, "fig": "", "passage": "<strong>The Clock That Kept the Town</strong><br>For as long as anyone could remember, the great clock in the tower above Marsh Square had told the town of Aldridge what to do. Its deep bell rang at seven so the bakers lit their ovens, at noon so the children spilled out of school for lunch, and at six so the shops pulled down their shutters for the night. People did not own many watches in those days, and they did not need to. They simply listened for old Mr. Finch's clock.\n\nMr. Finch had wound the clock by hand every single morning for forty years. Before the sun was properly up, he would climb the crooked wooden stairs inside the tower, fit the iron key into the heart of the great machine, and turn it slowly until the springs were tight. Then he would oil the gears, brush away the dust, and check that each hand pointed true. \"A clock is not a machine,\" he liked to say to anyone who would listen. \"It is a promise you make to a whole town, and you must keep it every day.\"\n\nThe younger people of Aldridge laughed at him gently. Why climb a tower in the cold, they asked, when a clock could surely be left to run on its own? One spring the town council agreed with them. They fitted a small electric motor to the clock so that it would wind itself, thanked Mr. Finch warmly for his years of care, and told him he had earned a long rest.\n\nFor a while, all was well. The new motor hummed quietly, the bell rang on time, and the people of Aldridge barely noticed the change. But Mr. Finch noticed. Each morning he woke before dawn out of forty years of habit, and lay in bed listening to a clock that no longer needed him. The bell still rang, yet to his ear it had lost something he could not quite name, the way a song sounds thinner when only a machine is singing it.\n\nThen came the long frost. For three icy weeks the cold crept into every corner of Aldridge, and one black morning the little motor froze solid and stopped. The bell did not ring at seven. The bakers slept too long, the children were late for school, and the whole town drifted out of step with itself, each person guessing at the hour and guessing wrong. The council members hurried up to the tower, but not one of them knew how to coax the frozen machine back to life.\n\nMr. Finch was already climbing the crooked stairs. His hands were stiff and his breath came in clouds, but he found the old iron key still hanging on its nail where he had left it. He fitted it into the heart of the clock and turned, slowly and patiently, just as he had ten thousand times before. With a groan and a shudder the great hands began to move, and a few minutes later the bell rang out across the frozen square. One by one, the people of Aldridge looked up, and smiled, and knew exactly what to do.\n\nThe council offered to make him the keeper once again. Mr. Finch only shook his head and smiled. \"Keep your motor,\" he said. \"It is a fine servant on an easy day. But mend it well, and keep the old key on its nail, and let someone learn to climb the stairs. A town should never forget how to wind its own clock.\" And from that day, Aldridge kept both the motor and a keeper, and the bell was never silent again.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "According to the passage, why did Mr. Finch stop winding the clock at first?", "options": {"A": "He grew too old to climb the tower stairs.", "B": "The clock was taken down for repairs.", "C": "He lost the iron key to the great machine.", "D": "The council fitted a motor so the clock would wind itself."}, "fig": "", "passage": "<strong>The Clock That Kept the Town</strong><br>For as long as anyone could remember, the great clock in the tower above Marsh Square had told the town of Aldridge what to do. Its deep bell rang at seven so the bakers lit their ovens, at noon so the children spilled out of school for lunch, and at six so th d stairs. His hands were stiff and his breath came in clouds, but he found the old iron key still hanging on its nail where he had left it. He fitted it into the heart of the clock and turned, slowly and patiently, just as he had ten thousand times before. With a groan and a shudder the great hands began to move, and a few minutes later the bell rang out across the frozen square. One by one, the people of Aldridge looked up, and smiled, and knew exactly what to do.\n\nThe council offered to make him the keeper once again. Mr. Finch only shook his head and smiled. \"Keep your motor,\" he said. \"It is a fine servant on an easy day. But mend it well, and keep the old key on its nail, and let someone learn to climb the stairs. A town should never forget how to wind its own clock.\" And from that day, Aldridge kept both the motor and a keeper, and the bell was never silent again.", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "What can we infer about how Mr. Finch felt during the time after the motor was fitted, before the frost came?", "options": {"A": "Uneasy, as if something was missing.", "B": "Relieved and completely content to rest.", "C": "Angry at the younger people of the town.", "D": "Frightened that the new motor would break."}, "fig": "", "passage": "<strong>The Clock That Kept the Town</strong><br>For as long as anyone could remember, the great clock in the tower above Marsh Square had told the town of Aldridge what to do. Its deep bell rang at seven so the bakers lit their ovens, at noon so the children spilled out of school for lunch, and at six so the shops pulled down their shutters for the night. People did not own many watches in those days, and they did not need to. They simply listened for old Mr. Finch's clock.\n\nMr. Finch had wound the clock by hand every single morning for forty years. Before the sun was properly up, he would climb the crooked wooden stairs inside the tower, fit the iron key into the heart of the great l, and let someone learn to climb the stairs. A town should never forget how to wind its own clock.\" And from that day, Aldridge kept both the motor and a keeper, and the bell was never silent again.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which sentence best states the main message (theme) of the story?", "options": {"A": "Cold weather can cause serious problems for a town.", "B": "Even when a machine can do a job, human skill and care are still worth keeping.", "C": "New technology should always replace older ways of working.", "D": "Old people deserve a long rest after years of hard work."}, "fig": "", "passage": "<strong>The Clock That Kept the Town</strong><br>For as long as anyone could remember, the great clock in the tower above Marsh Square had told the town of Aldridge what to do. Its deep bell rang at seven so the bakers lit their ovens, at noon so the children spilled out of school for lunch, and at six so the shops pulled down their shutters for the night. People did not own many watches in those days, and they did not need to. They simply listened for old Mr. Finch's clock.\n\nMr. Finch had wound the clock by hand every single morning for forty years. Before the sun was properly up, he would climb the crooked wooden stairs inside the tower, fit the iron key into the heart of the great machine, and turn it slowly until the springs were tight. Then he would oil the gears, brush away the dust, and check that each hand pointed true. \"A clock is not a machine,\" he liked to say to anyone who would listen. \"It is a promise you make to a whole town, and you must keep it every day.\"\n\nThe younger people of Aldridge laughed at him gently. Why climb a tower in the cold, they asked, when a clock could surely be left to run on its own? One spring the town council agreed with them. They fitted a small electric motor to the clock so that it would wind itself, thanked Mr. Finch warmly for his years of care, and told him he had earned a long rest.\n\nFor a while, all was well. The new motor hummed quietly, the bell rang on time, and the people of Aldridge barely noticed the change. But Mr. Finch noticed. Each morning he woke before dawn out of forty years of habit, and lay in bed listening to a clock that no longer needed him. The bell still rang, yet to his ear it had lost something he could not quite name, the way a song sounds thinner when only a machine is singing it.\n\nThen came the long frost. For three icy weeks the cold crept into every corner of Aldridge, and one black morning the little motor froze solid and stopped. The bell did not ring at seven. The bakers slept too long, the children were late for school, and the whole town drifted out of step with itself, each person guessing at the hour and guessing wrong. The council members hurried up to the tower, but not one of them knew how to coax the frozen machine back to life.\n\nMr. Finch was already climbing the crooked stairs. His hands were stiff and his breath came in clouds, but he found the old iron key still hanging on its nail where he had left it. He fitted it into the heart of the clock and turned, slowly and patiently, just as he had ten thousand times before. With a groan and a shudder the great hands began to move, and a few minutes later the bell rang out across the frozen square. One by one, the people of Aldridge looked up, and smiled, and knew exactly what to do.\n\nThe council offered to make him the keeper once again. Mr. Finch only shook his head and smiled. \"Keep your motor,\" he said. \"It is a fine servant on an easy day. But mend it well, and keep the old key on its nail, and let someone learn to climb the stairs. A town should never forget how to wind its own clock.\" And from that day, Aldridge kept both the motor and a keeper, and the bell was never silent again.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Two-task English writing section: a six-blank drop-down editing cloze followed by a single short paragraph (choice of one procedure/explanation task or one narrative task), calibrated to HKIS IDAT Concise Stage 3.", "label": "", "body": "", "hint": "Part 1: Read the passage and choose the correct option for each of the six numbered brackets. Part 2: Choose ONE of the two tasks and write a paragraph of no more than 8 sentences. Write in clear, complete sentences. Your writing will be viewed by your future school, so check your spelling, punctuation, and grammar carefully.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option that makes the sentence correct.\n\nLast month our whole year group [1: A) travel B) travelled C) travels] to a farm in the New Territories for a study day. We were all very [2: A) curious B) curiously C) curiosity] about how vegetables are grown without any soil. The farmer explained that the lettuces [3: A) was B) is C) were] fed by water full of nutrients instead. We worked [4: A) careful B) carefully C) more careful] as we planted tiny seedlings into long plastic trays. In the afternoon a guide showed us a greenhouse where the tomatoes grew [5: A) bigger B) biggest C) more big] than any I had ever seen before. [6: A) Because B) Although C) So] the day was long and our boots were thick with mud, not one of us wanted to go home.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 8 sentences:\n(1) Explain to a younger student how to look after a small plant so that it stays healthy. Describe the steps clearly and in order.\n(2) Write about a time when you tried something new for the first time. Describe what happened and how you felt."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "Which of these feels most like you?", "options": {"A": "I am good with my hands and moving my body", "B": "I am good at thinking things through and learning", "C": "I am good at making and imagining things", "D": "I am good at understanding and helping people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "What would you most like to get even better at?", "options": {"A": "Keeping a steady head when things go wrong", "B": "Sharing my ideas more openly", "C": "Seeing things all the way through to the end", "D": "Giving new and tricky things a go"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What makes you happiest?", "options": {"A": "Reaching a goal I set for myself", "B": "Discovering how something works", "C": "Making something that is all my own", "D": "Sharing time with people I care about"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "How much do you like to find out how you did on something you worked on?", "options": {"A": "I am happy to enjoy the work without scoring it", "B": "A little, now and then", "C": "Quite a lot", "D": "I really like clear feedback to see how I am growing"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing this week, which would you pick?", "options": {"A": "A sport or activity I have never done", "B": "A hard puzzle or brain-teaser", "C": "A food or a place I have never experienced", "D": "Cooking or building something I have never made"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "When something is hard, what do you like to do the most?", "options": {"A": "Keep trying on my own until I get it", "B": "Bring in someone to figure it out with me", "C": "Try a different way to solve it", "D": "Take a break and come back to it"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "When you might get something wrong in front of others, what feels most like you?", "options": {"A": "Totally fine, I just go for it", "B": "Mostly fine, I give it a go", "C": "A bit unsure, I like to watch others first", "D": "I would rather feel really ready first"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "Which of these would you like the least?", "options": {"A": "Doing the same easy task again and again", "B": "Trying something brand new on my own", "C": "Changing my plan halfway through", "D": "Waiting a long time for my turn"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Imagine you are given four things: a set of building blocks, a paintbrush, a notebook and a puzzle. Which would you reach for first?", "options": {"A": "Build something new with the blocks", "B": "Paint or draw whatever comes to mind", "C": "Write or sketch my own ideas in the notebook", "D": "Work out the puzzle piece by piece"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you make a project, what do you enjoy the most?", "options": {"A": "Coming up with a brand-new idea", "B": "Improving an idea someone else started", "C": "Finding the pattern or the trick to it", "D": "Following a clear plan step by step"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "Which of these do you think you do best?", "options": {"A": "Thinking of unusual ideas", "B": "Fixing things that are not working", "C": "Explaining how something works", "D": "Putting things in a clear, neat order"}, "cnum": "11"}, {"n": "30", "type": "selfeval", "section": "Character", "stem": "If you could invent one thing, which would you choose?", "options": {"A": "A new game to play", "B": "A gadget that solves a problem", "C": "A piece of art or music", "D": "A better way to do a daily task"}, "cnum": "12"}, {"n": "31", "type": "selfeval", "section": "Character", "stem": "What helps people get along with each other the most?", "options": {"A": "Listening carefully to one another", "B": "Sharing and taking turns", "C": "Owning it when you make a mistake", "D": "Cheering each other on"}, "cnum": "13"}, {"n": "32", "type": "selfeval", "section": "Character", "stem": "When you work with others, what do you like to do the most?", "options": {"A": "Share my ideas with the group", "B": "Listen and help others with their ideas", "C": "Keep the group organised", "D": "Make sure everyone feels included"}, "cnum": "14"}, {"n": "33", "type": "selfeval", "section": "Character", "stem": "Which of these bothers you the most?", "options": {"A": "When a friend is left out", "B": "When someone does not listen to me", "C": "When I run out of time to finish something", "D": "When there is an argument"}, "cnum": "15"}, {"n": "34", "type": "selfeval", "section": "Character", "stem": "Which would you like the least?", "options": {"A": "Working all by myself for a long time", "B": "A group where no one shares their ideas", "C": "Solving a problem with no one to talk to", "D": "Not getting a chance to hear what others think"}, "cnum": "16"}, {"n": "35", "type": "info", "title": "Maths", "body": "Read each question carefully and choose the best answer."}, {"n": "36", "type": "mcq", "section": "Maths", "stem": "Which list orders these decimals from smallest to largest: 0.7, 0.68, 0.705, 0.75?", "options": {"A": "0.68, 0.7, 0.75, 0.705", "B": "0.68, 0.7, 0.705, 0.75", "C": "0.705, 0.68, 0.7, 0.75", "D": "0.75, 0.705, 0.7, 0.68"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "Work out 5/9 + 7/12. Give your answer over the lowest common denominator, not simplified.", "options": {"A": "12/21", "B": "12/36", "C": "31/36", "D": "41/36"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "Calculate 46 × 28.", "options": {"A": "1 196", "B": "928", "C": "1 288", "D": "1 248"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "Work out 63.205 − 9.47.", "options": {"A": "53.735", "B": "53.835", "C": "54.735", "D": "62.418"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "Which of these numbers is prime?", "options": {"A": "39", "B": "49", "C": "51", "D": "47"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "2.07 km = ___ m", "options": {"A": "207", "B": "2 070", "C": "20 700", "D": "20.7"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "Estimate the size of the marked angle shown in the figure.", "options": {"A": "90°", "B": "120°", "C": "150°", "D": "180°"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"220\" fill=\"white\"/><line x1=\"60\" y1=\"170\" x2=\"190\" y2=\"170\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><line x1=\"60\" y1=\"170\" x2=\"-52.6\" y2=\"105.0\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><path d=\"M94,170 A34,34 0 0 0 30.6,153.0\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.5\"/><circle cx=\"60\" cy=\"170\" r=\"3\" fill=\"#1F3864\"/></svg>", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "Which of the labelled shapes is a regular polygon (all sides equal and all angles equal)?", "options": {"A": "Shape A", "B": "Shape B", "C": "Shape C", "D": "Shape D"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"150\" viewBox=\"0 0 480 150\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"480\" height=\"150\" fill=\"white\"/><polygon points=\"60.0,28 87,62 60.0,96 33,62\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"60\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">A</text><rect x=\"136\" y=\"38\" width=\"88\" height=\"48\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"180\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">B</text><ellipse cx=\"300.0\" cy=\"62\" rx=\"44\" ry=\"27\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">C</text><polygon points=\"420.0,28.0 452.3,51.5 440.0,89.5 400.0,89.5 387.7,51.5\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><text x=\"420\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\" fill=\"#1F3864\">D</text></svg>", "passage": "", "qnum": "8"}, {"n": "44", "type": "mcq", "section": "Maths", "stem": "How many faces does the solid shown have?", "options": {"A": "5", "B": "6", "C": "9", "D": "4"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"220\" height=\"210\" viewBox=\"0 0 220 210\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"220\" height=\"210\" fill=\"white\"/><polygon points=\"150,160 70,160 110,90 190,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><polygon points=\"40,160 150,160 110,90\" fill=\"#EAF0FA\" stroke=\"#1F3864\" stroke-width=\"2\"/><line x1=\"40\" y1=\"160\" x2=\"80\" y2=\"90\" stroke=\"#1F3864\" stroke-width=\"2\"/><path d=\"M80,90 L190,90 M80,90 L110,90\" fill=\"none\" stroke=\"#1F3864\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/></svg>", "passage": "", "qnum": "9"}, {"n": "45", "type": "info", "title": "Global Knowledge & Logic", "body": "Read each question carefully and choose the best answer."}, {"n": "46", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the number sequence: 4, 7, 13, 25, 49, __. What is the next term?", "options": {"A": "73", "B": "97", "C": "98", "D": "96"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "47", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A cinema ticket normally costs $80. On Tuesdays there is a 25% discount. A family buys 4 Tuesday tickets and also pays a $15 booking fee for the whole order. How much does the family pay in total?", "options": {"A": "$240", "B": "$320", "C": "$225", "D": "$255"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Which word goes with the other three? GLOVE, HELMET, KNEE-PAD, BICYCLE", "options": {"A": "BICYCLE", "B": "HELMET", "C": "GLOVE", "D": "KNEE-PAD"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A square sheet of paper is folded exactly in half once, so it becomes a rectangle with two layers. While it is folded, a single hole is punched through both layers near the middle. The paper is then unfolded flat again. How many holes are there in the unfolded sheet?", "options": {"A": "1", "B": "4", "C": "2", "D": "3"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "In a secret code, the word CAT is written as DBU. Using the same rule, how is the word DOG written?", "options": {"A": "CNF", "B": "EPH", "C": "EOG", "D": "FQI"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The community centre should add a Saturday morning coding class, because so many parents have asked for an activity their children can do before lunchtime at the weekend.\"\n\nPROPOSED ASSUMPTION: \"At least some children are free on Saturday mornings to attend such a class.\"\n\nAn assumption is an unstated idea the speaker must be taking for granted for the reasoning to hold. Using ONLY the information in the statement, is this assumption logical? Answer YES or NO.", "options": {"A": "YES", "B": "NO", "C": "YES", "D": "NO"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every member of the robotics club has passed the safety test. Sam has not passed the safety test.\"\n\nUsing ONLY the information above, which one of the following MUST be true?", "options": {"A": "Sam knows less about robots than every member of the robotics club.", "B": "Sam is not a member of the robotics club.", "C": "Sam will pass the safety test if he tries again.", "D": "Every person who has passed the safety test is a member of the robotics club."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS:\n1. All the books on the top shelf are written in French.\n2. No book written in French is allowed to leave the library.\n3. The blue dictionary is a book on the top shelf.\n\nWhich conclusion does NOT follow from these facts?", "options": {"A": "The blue dictionary is written in French.", "B": "The blue dictionary is not allowed to leave the library.", "C": "No book on the top shelf is allowed to leave the library.", "D": "Every book written in French is on the top shelf."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should our school replace the plastic water bottles in the canteen with free refill stations?\"\n\nThree arguments are offered below. Treating each on its own merits, which is the STRONGEST argument?", "options": {"A": "No — a couple of my friends said they would just forget to bring a reusable bottle anyway.", "B": "Yes — a one-year trial at three nearby schools recorded that refill stations cut plastic-bottle waste by about 70% with no drop in the amount of water students drank.", "C": "No — getting rid of plastic bottles would be a huge hassle and totally change everything about how the canteen works.", "D": "Yes — a refill station would look really modern and make our canteen seem much more up to date."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
