<head>

<title>IDAT HKIS: Stage 3 (V3)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

anting new trees along the river.\"", "options": {"A": "New trees are planting along the river by the council.", "B": "New trees were planted along the river by the council.", "C": "New trees are being planted along the river by the council.", "D": "New trees have been planted along the river by the council."}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "All four words can describe being angry, but which word shows the STRONGEST, most extreme degree of anger?", "options": {"A": "livid", "B": "irritated", "C": "frustrated", "D": "annoyed"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Read the sentence: \"The team might win the trophy if they train hard.\" Which word shows that the result is only a POSSIBILITY, not a certainty?", "options": {"A": "team", "B": "might", "C": "win", "D": "hard"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in this sentence?\n\"When Daniel signed up for four clubs, three competitions and a part-time job all in one week, his sister warned him he had _bitten off more than he could chew_.\"", "options": {"A": "taken on more than he could manage", "B": "eaten his food too quickly", "C": "said something he regretted", "D": "become greedy about money"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Why does Priya dig up a jar of soil from the back garden before leaving?", "options": {"A": "She wants to sell the soil in the new city.", "B": "She wants to keep a piece of her old home with her.", "C": "She is following an instruction her mother gave her.", "D": "She needs the soil to grow vegetables on the journey."}, "fig": "", "passage": "<strong>The Last Box</strong><br>Priya had promised herself she would not cry on moving day, but the empty bedroom made it hard. The walls, once covered with her drawings, were now just pale rectangles where the posters had been. Every footstep echoed in a way it never had before, as if the house itself had grown larger and lonelier overnight. She lingered in the doorway, memorising the precise spot by the window where the morning light used to fall across her desk, as though she could fold the memory up and slip it into her pocket.<br><br>Downstairs, the removal van swallowed box after box. Priya carried the last one out herself, hugging it against her chest. Inside were the things she could not bear to pack with the others: a chipped mug from her grandmother, a bundle of letters tied with faded ribbon, and a small jar of soil from the back garden. She had dug it up that morning while no one was watching, scooping the cool, dark earth into the jar with her bare hands. The garden had been her favourite place in all the world, the spot where she had buried a pet goldfish, learned to ride her bicycle, and read whole afternoons away beneath the apple tree.<br><br>Mr Okafor, their elderly neighbour, was waiting by the gate. For eight years he had handed sweets over the fence and taught Priya the names of every bird that visited his feeder. &quot;You will plant new roots,&quot; he said gently, nodding at the jar in her arms. &quot;But it is a fine thing to carry a little of the old ground with you.&quot; He pressed a small paper bag of sunflower seeds into her hand and told her that even the smallest seed remembers how to grow.<br><br>Priya had been dreading the new city for weeks. She had pictured grey streets and strangers who would never know her, and the thought had sat in her stomach like a stone. She had imagined a school full of unfamiliar faces and a bedroom that would never quite feel like hers. Yet standing there with the jar warm against her, she felt the stone shift, just a little. The soil in her arms was proof that some things could move without breaking.<br><br>The van&#x27;s engine coughed and rumbled. Priya climbed into th , "B": "Speaking up in front of a group", "C": "Finishing my work without giving up", "D": "Trying things I find scary"}, "fig": "", "passage": null, "cnum": 2}, {"n": 22, "type": "selfeval", "section": "Character", "stem": "What makes you feel proud of yourself?", "options": {"A": "Doing well at something hard", "B": "Helping someone who needed me", "C": "Making something new on my own", "D": "Trying even when I was nervous"}, "fig": "", "passage": null, "cnum": 3}, {"n": 23, "type": "selfeval", "section": "Character", "stem": "How important is it to you to understand yourself, like what you enjoy and what you do well?", "options": {"A": "Not important", "B": "A little important", "C": "Quite important", "D": "Very important"}, "fig": "", "passage": null, "cnum": 4}, {"n": 24, "type": "selfeval", "section": "Character", "stem": "When you finish a piece of work, what do you notice first?", "options": {"A": "How much I enjoyed doing it", "B": "Whether I got it right", "C": "What I would change next time", "D": "What other people think of it"}, "fig": "", "passage": null, "cnum": 5}, {"n": 25, "type": "selfeval", "section": "Character", "stem": "Which of these would you usually choose last?", "options": {"A": "Playing sports or games", "B": "Reading and studying", "C": "Art, music or making things", "D": "Working in a big group"}, "fig": "", "passage": null, "cnum": 6}, {"n": 26, "type": "selfeval", "section": "Character", "stem": "How comfortable are you sharing how you really feel with a grown-up you trust?", "options": {"A": "Very comfortable", "B": "Quite comfortable", "C": "A little unsure", "D": "I keep my feelings to myself"}, "fig": "", "passage": null, "cnum": 7}, {"n": 27, "type": "selfeval", "section": "Character", "stem": "If you could try one new thing this week, which would you pick?", "options": {"A": "A tricky climbing wall", "B": "Speaking on a stage", "C": "A really tricky puzzle or brain-teaser", "D": "Cooking a meal by myself"}, "fig": "", "passage n", "C": "Drawing or showing it", "D": "Acting it out or presenting"}, "fig": "", "passage": null, "cnum": 27}, {"n": 47, "type": "selfeval", "section": "Character", "stem": "What makes you happy when you are with other people?", "options": {"A": "When everyone is included", "B": "When we agree on a plan", "C": "When I can make someone laugh", "D": "When someone really listens to me"}, "fig": "", "passage": null, "cnum": 28}, {"n": 48, "type": "info", "title": "Mathematics", "body": "Answer each question and choose the best answer."}, {"n": 49, "type": "mcq", "section": "Maths", "stem": "Which list orders these decimals from least to greatest? 0.7, 0.68, 0.709, 0.8", "options": {"A": "0.68, 0.7, 0.709, 0.8", "B": "0.68, 0.7, 0.8, 0.709", "C": "0.7, 0.68, 0.8, 0.709", "D": "0.709, 0.8, 0.7, 0.68"}, "fig": "", "passage": null, "qnum": 16}, {"n": 50, "type": "mcq", "section": "Maths", "stem": "7/15 + 3/8 = ?  (give the answer over the lowest common denominator, not simplified)", "options": {"A": "10/23", "B": "101/120", "C": "10/120", "D": "56/120"}, "fig": "", "passage": null, "qnum": 17}, {"n": 51, "type": "mcq", "section": "Maths", "stem": "47 × 38 = ?", "options": {"A": "1410", "B": "1786", "C": "376", "D": "611"}, "fig": "", "passage": null, "qnum": 18}, {"n": 52, "type": "mcq", "section": "Maths", "stem": "52.304 − 7.58 = ?", "options": {"A": "44.724", "B": "45.834", "C": "59.884", "D": "44.72"}, "fig": "", "passage": null, "qnum": 19}, {"n": 53, "type": "mcq", "section": "Maths", "stem": "A whole number multiplied by itself, then by itself again (such as 4 × 4 × 4 = 64), is called a ___ number.", "options": {"A": "square", "B": "square root", "C": "prime", "D": "cube"}, "fig": "", "passage": null, "qnum": 20}, {"n": 54, "type": "mcq", "section": "Maths", "stem": "4500 m = ___ km", "options": {"A": "45 km", "B": "4.5 km", "C": "450 km", "D": "0.45 km"}, "fig": "", "passage": null, "qnum": 21}, {"n": 55, "type": "mcq", "section": "Maths", "stem": "Estimate the siz ch does the customer pay in total?", "options": {"A": "$60", "B": "$189", "C": "$192", "D": "$228"}, "fig": "", "passage": null, "qnum": 27}, {"n": 62, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the four shapes shown. A regular polygon has all sides equal in length AND all angles equal. Which labelled shape is a regular polygon?", "options": {"A": "Shape A (rectangle)", "B": "Shape B (rhombus)", "C": "Shape C (isosceles trapezium with two pairs of equal angles)", "D": "Shape D (square)"}, "fig": "<svg viewBox=\"0 0 368 120\" width=\"368\" height=\"120\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x=\"0\" y=\"0\" width=\"368\" height=\"120\" fill=\"#ffffff\"/><rect x=\"19.0\" y=\"35.8\" width=\"54.0\" height=\"32.4\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"46.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">A</text><polygon points=\"138.0,25.0 156.9,52.0 138.0,79.0 119.1,52.0\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"138.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">B</text><polygon points=\"216.5,35.8 243.5,35.8 257.0,68.2 203.0,68.2\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"230.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">C</text><rect x=\"301.8\" y=\"31.8\" width=\"40.5\" height=\"40.5\" fill=\"#dbe6f5\" stroke=\"#27406b\" stroke-width=\"2\"/><text x=\"322.0\" y=\"102\" font-size=\"13\" text-anchor=\"middle\">D</text></svg>", "passage": null, "qnum": 28}, {"n": 63, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Three painters can paint three fences in three hours. Working at the same steady rate, how many fences can nine painters paint in nine hours?", "options": {"A": "27", "B": "9", "C": "81", "D": "54"}, "fig": "", "passage": null, "qnum": 29}, {"n": 64, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"We should hold the Year 6 science fair in the school gymnasium this year, because that is the only space large enough to fit all the project tables and still leave room for visitors to walk between them.\"\n\nPROPOSED ASSUMPTION: \"Last year's science fair was held in a space that was too small for the number of projects.\"\n\nUsing only the information in the statement, is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": null, "qnum": 30}, {"n": 65, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every pupil in Class 6B who returned their signed permission slip by Friday went on the Saturday museum trip. Mei did not go on the Saturday museum trip.\"\n\nWhich of the following MUST BE TRUE?", "options": {"A": "Mei forgot to return her permission slip.", "B": "Mei did not want to go to the museum.", "C": "Mei did not return a signed permission slip by Friday.", "D": "Mei is not a pupil in Class 6B."}, "fig": "", "passage": null, "qnum": 31}, {"n": 66, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS:\n1. All members of the chess club also play in the school orchestra.\n2. No one who plays in the school orchestra is on the swimming team.\n3. Tom is a member of the chess club.\n\nWhich conclusion does NOT follow from the facts above?", "options": {"A": "Tom plays in the school orchestra.", "B": "Tom is not on the swimming team.", "C": "No member of the chess club is on the swimming team.", "D": "Everyone in the school orchestra is in the chess club."}, "fig": "", "passage": null, "qnum": 32}, {"n": 67, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: Should the school replace the printed library catalogue with a computer search system that pupils use on tablets?\n\nWhich of the three arguments below is the STRONGEST?", "options": {"A": "Yes - a one-term trial at a similar school found that pupils located the book they wanted in an average of 40 seconds with the tablet system, compared with about 3 minutes using the printed catalogue.", "B": "Yes - tablets are modern and exciting, so pupils would feel proud that their school has up-to-date equipment.", "C": "No - I personally find printed catalogues easier to read and I have always preferred turning pages to tapping a screen.", "D": "No - computers sometimes break down, and it would be a disaster if that ever happened."}, "fig": "", "passage": null, "qnum": 33}, {"n": 68, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"In the school's end-of-year survey, 80% of the 200 pupils said they take part in at least one after-school club. Of those club members, exactly half attend a sports club.\"\n\nCONCLUSIONS:\n1. At least 160 pupils take part in at least one after-school club.\n2. Exactly 80 pupils attend a sports club.\n3. Most pupils in the school dislike sport.\n\nUsing ONLY the information in the statement, which conclusion(s) FOLLOW?", "options": {"A": "Conclusion 1 only follows.", "B": "Conclusions 1 and 2 only follow.", "C": "Conclusions 1, 2 and 3 all follow.", "D": "Conclusion 3 only follows."}, "fig": "", "passage": null, "qnum": 34}, {"n": 69, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Whenever the school field is too wet to use, Friday's outdoor PE lesson is moved into the sports hall. This Friday, the outdoor PE lesson was NOT moved into the sports hall.\"\n\nWhich of the following MUST BE TRUE?", "options": {"A": "The weather this Friday was sunny.", "B": "PE was cancelled this Friday.", "C": "The school field was not too wet to use this Friday.", "D": "The sports hall was being used by another class this Friday."}, "fig": "", "passage": null, "qnum": 35}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V3)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
