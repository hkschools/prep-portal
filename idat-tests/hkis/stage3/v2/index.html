<head>

<title>IDAT HKIS: Stage 3 (V2)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

er children", "B": "Excited to explore every part of the street", "C": "Annoyed at her grandmother for being unkind", "D": "Proud of the many friends she had quickly made"}, "fig": "", "passage": "<strong>The Map in the Attic</strong><br>Nadia had lived in her grandmother's narrow house for three weeks, and in all that time the other children on Wren Street had not once spoken to her. They cycled past in noisy packs, calling to one another in a language of jokes she did not yet understand, while she watched from the front step with a book she was not really reading. Her grandmother said the children were not unkind, only shy of newcomers, but to Nadia the difference felt very small. Each evening she climbed to the dusty attic, the one room that was entirely her own, and let the silence settle around her like dust on the rafters.\n\nIt was there, beneath a loose floorboard, that she found the map. It was old and soft as cloth, its ink faded to the colour of weak tea, and across the top someone had written in looping letters: A Tour of Wren Street's Secret Places. Nadia's heart quickened. The map marked a hollow oak, a wall where wild strawberries grew, and a gap in the railings that led down to a hidden stream. Whoever had drawn it had loved this street the way you love a friend.\n\nThe next morning, map in hand, she set out alone. She found the hollow oak exactly where the map promised, its trunk wide enough to hide three children. She found the strawberries, small and sweet, and ate them until her fingers were stained pink. But when she reached the gap in the railings, she was not alone. A boy about her own age was already crouched there, peering down at the stream with a jam jar in his hand.\n\nHe looked up, startled, then noticed the map. \"Where did you get that?\" he asked, not crossly but with something like wonder. Nadia explained about the attic and the loose board. The boy, whose name was Theo, said his older sister had drawn a map just like it years ago, b wn by curiosity. They took turns holding the precious map and adding new places of their own: a windowsill where a cat always slept, a drainpipe that sang when the wind blew. Nadia, who three weeks earlier had not known a single name, now found herself at the very centre of the noise. She realised, with a quiet jolt of surprise, that the map had not shown her the street at all. It had shown her the way in.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "HKIS IDAT Concise Stage 3 Writing section, with two tasks: a drop-down editing passage (Part 1) and one short paragraph chosen from two options (Part 2). Both tasks are viewed by your future school.", "label": "", "body": "", "hint": "This section has two writing tasks. In Part 1, read the short passage and choose the correct option (A, B or C) inside each numbered bracket so the passage is correct and well written. In Part 2, choose ONE of the two tasks and write a single paragraph of no more than 8 sentences. Write in clear, full sentences. Your writing will be viewed by your future school, so use your best spelling, punctuation and grammar.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear.\n\nLast weekend, my family and I [1: A) visits B) visited C) visiting] an old fishing village along the coast. The narrow streets [2: A) was B) is C) were] full of little shops, and the smell of grilled fish drifted everywhere. We walked [3: A) slow B) slowly C) slower] down to the harbour to watch the boats come in. An enormous net, [4: A) repairing B) repaired C) repairs] by the fishermen that very morning, hung drying between two poles. The sun was setting, [5: A) although B) so C) but] we hurried to take a photograph before the light faded. Of all the trips we have taken this year, it was by far the [6: A) good B) better C) e a long time", "D": "Cooking or building something by myself"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "When something turns out to be really hard, what do you most often do?", "options": {"A": "Keep trying until I work it out", "B": "Try a different way to do it", "C": "Ask someone to help me", "D": "Take a break and come back later"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "When you might make a mistake in front of others, what feels most like you?", "options": {"A": "I jump in and do not mind the mistake", "B": "I have a go, even if I feel a bit nervous first", "C": "I like to watch others try before me", "D": "I prefer to practise on my own first"}, "cnum": "7"}, {"n": "26", "type": "selfeval", "section": "Character", "stem": "Which of these would bother you the most?", "options": {"A": "Not getting to try something I really wanted to", "B": "Getting something wrong in front of the class", "C": "Having to change my plan at the last minute", "D": "Having to stop something before it was finished"}, "cnum": "8"}, {"n": "27", "type": "selfeval", "section": "Character", "stem": "Imagine you are shown five things: a ball, a paintbrush, a notebook, a board game and a puzzle. What would you most want to do?", "options": {"A": "Invent a brand-new game with the ball", "B": "Paint or draw something of my own", "C": "Write a story in the notebook", "D": "Work out the puzzle on my own"}, "cnum": "9"}, {"n": "28", "type": "selfeval", "section": "Character", "stem": "When you start a new project, what do you like the most?", "options": {"A": "Coming up with unusual, surprising ideas", "B": "Making someone else's idea even better", "C": "Spotting how the pieces fit together", "D": "Following clear steps from start to finish"}, "cnum": "10"}, {"n": "29", "type": "selfeval", "section": "Character", "stem": "Which of these do you do best?", "options": {"A": "Thinking of lots of different answers", "B": ", "B": "0.59, 0.6, 0.65, 0.605", "C": "0.65, 0.605, 0.6, 0.59", "D": "0.605, 0.59, 0.6, 0.65"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "37", "type": "mcq", "section": "Maths", "stem": "Work out 5/12 + 7/18. Give your answer over the lowest common denominator, not simplified.", "options": {"A": "12/30", "B": "12/36", "C": "29/36", "D": "35/216"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "38", "type": "mcq", "section": "Maths", "stem": "38 × 54 = ?", "options": {"A": "1900", "B": "2052", "C": "2152", "D": "1872"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "39", "type": "mcq", "section": "Maths", "stem": "41.302 − 8.57 = ?", "options": {"A": "33.732", "B": "32.872", "C": "32.73", "D": "32.732"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "40", "type": "mcq", "section": "Maths", "stem": "Which of these is a cube number? 16, 25, 27, 36", "options": {"A": "16", "B": "25", "C": "27", "D": "36"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "41", "type": "mcq", "section": "Maths", "stem": "6200 m = ? km", "options": {"A": "6.2 km", "B": "62 km", "C": "0.62 km", "D": "620 km"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "42", "type": "mcq", "section": "Maths", "stem": "Estimate the size of the angle drawn on the square grid below.", "options": {"A": "90°", "B": "180°", "C": "45°", "D": "135°"}, "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"300\" height=\"220\" fill=\"white\"/><line x1=\"60\" y1=\"170\" x2=\"190\" y2=\"170\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><line x1=\"60\" y1=\"170\" x2=\"-31.9\" y2=\"78.1\" stroke=\"#1F3864\" stroke-width=\"2.5\"/><path d=\"M94,170 A34,34 0 0 0 36.0,146.0\" fill=\"none\" stroke=\"#C00\" stroke-width=\"1.5\"/><circle cx=\"60\" cy=\"170\" r=\"3\" fill=\"#1F3864\"/></svg>", "passage": "", "qnum": "7"}, {"n": "43", "type": "mcq", "section": "Maths", "stem": "Which of the labelled shapes is a regular ge": "", "qnum": "1"}, {"n": "47", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Six hens lay six eggs in six days. Laying at the same steady rate, how many eggs will twelve hens lay in twelve days?", "options": {"A": "24", "B": "12", "C": "144", "D": "48"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "48", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "A winter coat is priced at $400. In a sale it is reduced by 30%. At the till, the shopper also uses a $40 voucher off the sale price. How much does the shopper pay in total?", "options": {"A": "$252", "B": "$280", "C": "$240", "D": "$196"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "49", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Look at the four tiles labelled A, B, C and D in the figure. Three of them are the SAME tile simply turned (rotated) to different positions. One tile is a mirror image (a flip) of the others and can never be made just by turning them. Which tile is the odd one out?", "options": {"A": "Tile A", "B": "Tile B", "C": "Tile C", "D": "Tile D"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "50", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "Study the figure. In the first pair, a small white square changes into a large shaded (filled-in) square. In the same way, a small white triangle should change into which shape?", "options": {"A": "Large shaded triangle", "B": "Large white triangle", "C": "Large shaded circle", "D": "Small shaded triangle"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "51", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"The bakery should start opening at 6 a.m. instead of 8 a.m., because many people would like to buy fresh bread on their way to work.\"\n\nPROPOSED ASSUMPTION: \"At least some people travel to work before 8 a.m.\"\n\nUsing only the information in the statement, is this assumption logical? Answer YES or NO.", "options": {"Yes": "Yes", "No": "No"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "52", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"Every athlete who finished the marathon under four hours received a gold medal. Priya finished the marathon but did not receive a gold medal.\"\n\nWhich one of the following MUST be true?", "options": {"A": "Priya did not finish the marathon in under four hours.", "B": "Priya is a slower runner than everyone who received a gold medal.", "C": "Everyone who received a gold medal finished in under four hours.", "D": "Priya gave up before the end of the race."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "53", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS:\n1. All the plants in the greenhouse need daily watering.\n2. None of the plants that need daily watering can survive a week of drought.\n3. The orchid is a plant in the greenhouse.\n\nWhich conclusion does NOT follow from these facts?", "options": {"A": "The orchid needs daily watering.", "B": "The orchid cannot survive a week of drought.", "C": "No plant in the greenhouse can survive a week of drought.", "D": "Every plant that needs daily watering is kept in the greenhouse."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "54", "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: \"Should the town install LED street lights along Maple Avenue?\"\n\nThree arguments are offered below. Which is the STRONGEST argument?", "options": {"A": "No — I think the old orange street lamps look much prettier and I would miss them.", "B": "Yes — in four comparable towns, council records showed that switching to LED street lights cut night-time electricity use on similar roads by about 50%.", "C": "Yes — everybody knows that anything labelled 'LED' is automatically better than what came before."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V2)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
