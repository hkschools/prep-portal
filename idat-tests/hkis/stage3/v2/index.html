<title>IDAT HKIS: Stage 3 (V2)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "3", VERSION = "2";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the word that correctly completes the sentence.\n\nMy sister and ____ are going to the museum on Saturday.", "options": {"A": "me", "B": "I", "C": "myself", "D": "us"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "What does the word 'reconsider' mean?", "options": {"A": "to think about something before anyone else", "B": "to refuse to think about something", "C": "to think about something again", "D": "to think about something carelessly"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Choose the verb form that correctly completes the sentence.\n\nThis time tomorrow, we ____ across the English Channel on the ferry.", "options": {"A": "will be sailing", "B": "sailed", "C": "have sailed", "D": "are sailing yesterday"}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'reluctant' in the sentence below?\n\nMaya was reluctant to join the swimming team because she had never competed before.", "options": {"A": "excited", "B": "prepared", "C": "exhausted", "D": "unwilling"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Choose the word that is spelled correctly.", "options": {"A": "neccessary", "B": "necessary", "C": "necesary", "D": "neccesary"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Choose the verb form that correctly completes the sentence.\n\nEach of the new students ____ a locker and a timetable on the first day.", "options": {"A": "receive", "B": "are receiving", "C": "receives", "D": "have received"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Read the sentence below.\n\nThe team might win the championship if they train hard this term.\n\nWhich word shows that the result is only a POSSIBILITY rather than a certainty?", "options": {"A": "might", "B": "win", "C": "team", "D": "hard"}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Choose the sentence that correctly rewrites the active sentence below in the passive voice.\n\nA storm damaged the old bridge last night.", "options": {"A": "The old bridge is damaged by a storm last night.", "B": "A storm was damaged by the old bridge last night.", "C": "The old bridge has damaged a storm last night.", "D": "The old bridge was damaged by a storm last night."}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Choose the word that means MOST thirsty.\n\nAfter the long desert hike, the travellers were ____.", "options": {"A": "dry", "B": "parched", "C": "thirsty", "D": "dehydrated"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nWhen Leo signed up for three clubs, two sports, and a part-time job, his father warned him that he had BITTEN OFF MORE THAN HE COULD CHEW.", "options": {"A": "eaten his lunch too quickly", "B": "made an excellent, ambitious choice", "C": "taken on more than he could manage", "D": "told a small lie to his father"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Why was the crow unable to drink from the pitcher when he first looked inside?", "options": {"A": "The water was too low for his beak to reach.", "B": "The pitcher was completely empty.", "C": "Another bird was already drinking from it.", "D": "The water was too dirty to drink."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of the summer, a thirsty crow flew low over the dry fields, searching for a single drop of water. The streams that once threaded the valley had shrunk to cracked ribbons of mud, and the leaves hung limp and grey on the trees. The crow&#x27;s throat felt as rough as sandpaper, and his wings grew heavier with every weary beat. He had flown since dawn without rest, and the white sun pressed down on his black feathers like a hand.<br><br>More than once he had been disappointed. He had dived toward what looked like a shining puddle, only to find a sheet of dusty glass thrown out by some farmer. He had chased the silver glint of a ditch, only to land in dry weeds. Each failure made his small heart sink a little further, yet he did not turn back toward the cool woods where he had been born. Something stubborn in him kept his eyes moving over the cracked land below.<br><br>At last, near the edge of an abandoned garden, he spotted a tall clay pitcher standing in the shade of a crumbling wall. His heart leapt. He swooped down, gripped the rim with his claws, and peered inside. There, far below, lay a small pool of water, glinting like a coin at the bottom of a well. The sight was almost painful, for he was so thirsty and the water was so near.<br><br>The crow stretched his neck as far as it would go, but his beak fell well short of the water. He hopped onto the rim and tried again, leaning until he almost tumbled in, yet still the pool stayed beyond his reach. He could have screeched in frustration and flown away, as many tired birds would have done. Instead, he settled on a nearby branch, folded his aching wings, and made himself think.<br><br>His sharp eyes fell on a scattering of small pebbles lying in the dust beneath the wall. For a long moment he stared at them, and then an idea sparkled in his mind, as bright and sudden as the water itself. One by one, he carried the pebbles in his beak and dropped them into the pitcher. Each stone sank with a soft plink, and slowly, almost magically, the water began to climb the inside of the clay. The crow worked patiently as the sun sank lower and his shadow stretched long across the ground, never once stopping to rest.<br><br>At last the water rose high enough to touch his beak. The crow drank deeply, and the cool water spread through him like new life, washing the dryness from his throat. As he lifted into the soft evening sky and turned for home, he carried more than relief. He carried a quiet lesson that he would not forget: when strength alone will not do, a patient and thinking mind can still find a way.", "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word 'weary' in the sentence below, taken from the passage?\n\n'...his wings grew heavier with every weary beat.'", "options": {"A": "angry", "B": "colourful", "C": "speedy", "D": "tired"}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of the summer, a thirsty crow flew low over the dry fields, searching for a single drop of water. The streams that once threaded the valley had shrunk to cracked ribbons of mud, and the leaves hung limp and grey on the trees. The crow&#x27;s throat felt as rough as sandpaper, and his wings grew heavier with every weary beat. He had flown since dawn without rest, and the white sun pressed down on his black feathers like a hand.<br><br>More than once he had been disappointed. He had dived toward what looked like a shining puddle, only to find a sheet of dusty glass thrown out by some farmer. He had chased the silver glint of a ditch, only to land in dry weeds. Each failure made his small heart sink a little further, yet he did not turn back toward the cool woods where he had been born. Something stubborn in him kept his eyes moving over the cracked land below.<br><br>At last, near the edge of an abandoned garden, he spotted a tall clay pitcher standing in the shade of a crumbling wall. His heart leapt. He swooped down, gripped the rim with his claws, and peered inside. There, far below, lay a small pool of water, glinting like a coin at the bottom of a well. The sight was almost painful, for he was so thirsty and the water was so near.<br><br>The crow stretched his neck as far as it would go, but his beak fell well short of the water. He hopped onto the rim and tried again, leaning until he almost tumbled in, yet still the pool stayed beyond his reach. He could have screeched in frustration and flown away, as many tired birds would have done. Instead, he settled on a nearby branch, folded his aching wings, and made himself think.<br><br>His sharp eyes fell on a scattering of small pebbles lying in the dust beneath the wall. For a long moment he stared at them, and then an idea sparkled in his mind, as bright and sudden as the water itself. One by one, he carried the pebbles in his beak and dropped them into the pitcher. Each stone sank with a soft plink, and slowly, almost magically, the water began to climb the inside of the clay. The crow worked patiently as the sun sank lower and his shadow stretched long across the ground, never once stopping to rest.<br><br>At last the water rose high enough to touch his beak. The crow drank deeply, and the cool water spread through him like new life, washing the dryness from his throat. As he lifted into the soft evening sky and turned for home, he carried more than relief. He carried a quiet lesson that he would not forget: when strength alone will not do, a patient and thinking mind can still find a way.", "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Why did the crow settle on a nearby branch instead of flying away?", "options": {"A": "He was too injured to fly any further.", "B": "He stopped to think of a way to reach the water.", "C": "He was waiting for another animal to help him.", "D": "He had decided to give up and rest before going home."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of the summer, a thirsty crow flew low over the dry fields, searching for a single drop of water. The streams that once threaded the valley had shrunk to cracked ribbons of mud, and the leaves hung limp and grey on the trees. The crow&#x27;s throat felt as rough as sandpaper, and his wings grew heavier with every weary beat. He had flown since dawn without rest, and the white sun pressed down on his black feathers like a hand.<br><br>More than once he had been disappointed. He had dived toward what looked like a shining puddle, only to find a sheet of dusty glass thrown out by some farmer. He had chased the silver glint of a ditch, only to land in dry weeds. Each failure made his small heart sink a little further, yet he did not turn back toward the cool woods where he had been born. Something stubborn in him kept his eyes moving over the cracked land below.<br><br>At last, near the edge of an abandoned garden, he spotted a tall clay pitcher standing in the shade of a crumbling wall. His heart leapt. He swooped down, gripped the rim with his claws, and peered inside. There, far below, lay a small pool of water, glinting like a coin at the bottom of a well. The sight was almost painful, for he was so thirsty and the water was so near.<br><br>The crow stretched his neck as far as it would go, but his beak fell well short of the water. He hopped onto the rim and tried again, leaning until he almost tumbled in, yet still the pool stayed beyond his reach. He could have screeched in frustration and flown away, as many tired birds would have done. Instead, he settled on a nearby branch, folded his aching wings, and made himself think.<br><br>His sharp eyes fell on a scattering of small pebbles lying in the dust beneath the wall. For a long moment he stared at them, and then an idea sparkled in his mind, as bright and sudden as the water itself. One by one, he carried the pebbles in his beak and dropped them into the pitcher. Each stone sank with a soft plink, and slowly, almost magically, the water began to climb the inside of the clay. The crow worked patiently as the sun sank lower and his shadow stretched long across the ground, never once stopping to rest.<br><br>At last the water rose high enough to touch his beak. The crow drank deeply, and the cool water spread through him like new life, washing the dryness from his throat. As he lifted into the soft evening sky and turned for home, he carried more than relief. He carried a quiet lesson that he would not forget: when strength alone will not do, a patient and thinking mind can still find a way.", "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "Read this sentence from the passage:\n\n'There, far below, lay a small pool of water, glinting like a coin at the bottom of a well.'\n\nWhat does this comparison mainly help the reader to picture?", "options": {"A": "that the water was actually made of metal", "B": "that the crow had found buried treasure", "C": "how small, bright, and far away the water looked", "D": "that the pitcher was full to the top"}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of the summer, a thirsty crow flew low over the dry fields, searching for a single drop of water. The streams that once threaded the valley had shrunk to cracked ribbons of mud, and the leaves hung limp and grey on the trees. The crow&#x27;s throat felt as rough as sandpaper, and his wings grew heavier with every weary beat. He had flown since dawn without rest, and the white sun pressed down on his black feathers like a hand.<br><br>More than once he had been disappointed. He had dived toward what looked like a shining puddle, only to find a sheet of dusty glass thrown out by some farmer. He had chased the silver glint of a ditch, only to land in dry weeds. Each failure made his small heart sink a little further, yet he did not turn back toward the cool woods where he had been born. Something stubborn in him kept his eyes moving over the cracked land below.<br><br>At last, near the edge of an abandoned garden, he spotted a tall clay pitcher standing in the shade of a crumbling wall. His heart leapt. He swooped down, gripped the rim with his claws, and peered inside. There, far below, lay a small pool of water, glinting like a coin at the bottom of a well. The sight was almost painful, for he was so thirsty and the water was so near.<br><br>The crow stretched his neck as far as it would go, but his beak fell well short of the water. He hopped onto the rim and tried again, leaning until he almost tumbled in, yet still the pool stayed beyond his reach. He could have screeched in frustration and flown away, as many tired birds would have done. Instead, he settled on a nearby branch, folded his aching wings, and made himself think.<br><br>His sharp eyes fell on a scattering of small pebbles lying in the dust beneath the wall. For a long moment he stared at them, and then an idea sparkled in his mind, as bright and sudden as the water itself. One by one, he carried the pebbles in his beak and dropped them into the pitcher. Each stone sank with a soft plink, and slowly, almost magically, the water began to climb the inside of the clay. The crow worked patiently as the sun sank lower and his shadow stretched long across the ground, never once stopping to rest.<br><br>At last the water rose high enough to touch his beak. The crow drank deeply, and the cool water spread through him like new life, washing the dryness from his throat. As he lifted into the soft evening sky and turned for home, he carried more than relief. He carried a quiet lesson that he would not forget: when strength alone will not do, a patient and thinking mind can still find a way.", "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "Which sentence best states the main lesson of the story?", "options": {"A": "Careful thinking can solve a problem when force cannot.", "B": "It is dangerous to fly far from home on a hot day.", "C": "You should always share water with thirsty animals.", "D": "Birds are cleverer than all other creatures."}, "fig": "", "passage": "<strong>The Crow and the Pitcher</strong><br>On the hottest afternoon of the summer, a thirsty crow flew low over the dry fields, searching for a single drop of water. The streams that once threaded the valley had shrunk to cracked ribbons of mud, and the leaves hung limp and grey on the trees. The crow&#x27;s throat felt as rough as sandpaper, and his wings grew heavier with every weary beat. He had flown since dawn without rest, and the white sun pressed down on his black feathers like a hand.<br><br>More than once he had been disappointed. He had dived toward what looked like a shining puddle, only to find a sheet of dusty glass thrown out by some farmer. He had chased the silver glint of a ditch, only to land in dry weeds. Each failure made his small heart sink a little further, yet he did not turn back toward the cool woods where he had been born. Something stubborn in him kept his eyes moving over the cracked land below.<br><br>At last, near the edge of an abandoned garden, he spotted a tall clay pitcher standing in the shade of a crumbling wall. His heart leapt. He swooped down, gripped the rim with his claws, and peered inside. There, far below, lay a small pool of water, glinting like a coin at the bottom of a well. The sight was almost painful, for he was so thirsty and the water was so near.<br><br>The crow stretched his neck as far as it would go, but his beak fell well short of the water. He hopped onto the rim and tried again, leaning until he almost tumbled in, yet still the pool stayed beyond his reach. He could have screeched in frustration and flown away, as many tired birds would have done. Instead, he settled on a nearby branch, folded his aching wings, and made himself think.<br><br>His sharp eyes fell on a scattering of small pebbles lying in the dust beneath the wall. For a long moment he stared at them, and then an idea sparkled in his mind, as bright and sudden as the water itself. One by one, he carried the pebbles in his beak and dropped them into the pitcher. Each stone sank with a soft plink, and slowly, almost magically, the water began to climb the inside of the clay. The crow worked patiently as the sun sank lower and his shadow stretched long across the ground, never once stopping to rest.<br><br>At last the water rose high enough to touch his beak. The crow drank deeply, and the cool water spread through him like new life, washing the dryness from his throat. As he lifted into the soft evening sky and turned for home, he carried more than relief. He carried a quiet lesson that he would not forget: when strength alone will not do, a patient and thinking mind can still find a way.", "qnum": 15}, {"n": 17, "type": "writing", "section": "English Writing", "intro": "Your response will be viewed by your future school, so plan your ideas and write carefully. Choose ONE of the two tasks below.", "label": "", "body": "Option 1 (Narrative): Write about a time when you faced a challenge and how you dealt with it. Describe what happened, how you felt, and what you learned.\n\nOption 2 (Procedure/Explanation): Explain how to do something you are good at, so that someone who has never tried it could follow your steps. Make the order of the steps clear and easy to understand.", "hint": "Choose ONE option only. Write no more than 8 sentences.", "placeholder": "Type your response here…", "partA": "Option 1 (Narrative): Write about a time when you faced a challenge and how you dealt with it. Describe what happened, how you felt, and what you learned.\n\nOption 2 (Procedure/Explanation): Explain how to do something you are good at, so that someone who has never tried it could follow your steps. Make the order of the steps clear and easy to understand.", "partB": ""}, {"n": 18, "type": "info", "title": "Listening &amp; Interview", "body": "<div class='info-body'>In the real test this section is delivered live: you listen to short clips and answer interview-style questions on camera. There is nothing to type or record here, the sample questions below show what to expect, so you can practise your answers out loud.</div><ul style='margin:12px 0 0;padding-left:20px;line-height:1.6;font-size:15px'><li style='margin:7px 0'>Why would you like to come to this school?</li><li style='margin:7px 0'>Tell me about something you are really good at.</li><li style='margin:7px 0'>Describe a time you helped someone.</li><li style='margin:7px 0'>What is your favourite book, and what happens in it?</li><li style='margin:7px 0'>Listen to a short passage, then answer questions about what happened.</li></ul>"}, {"n": 19, "type": "info", "title": "Character", "body": "There are no right or wrong answers in this test, and nothing here is a score to pass or fail. Your choices simply mirror who you are right now: what you enjoy, how you like to work, and how you connect with others. Every answer points to a real strength or a natural leaning, and all of them are good ways to be."}, {"n": 20, "type": "selfeval", "section": "Character", "stem": "What do you think you do best?", "options": {"A": "Sports and moving my body", "B": "School work and learning new facts", "C": "Art, music or making things", "D": "Helping my friends and family"}, "fig": "", "passage": null, "cnum": 1}, {"n": 21, "type": "selfeval", "section": "Character", "stem": "When you finish a piece of work, what do you notice the most?", "options": {"A": "Whether I tried my hardest", "B": "Whether I followed all the steps carefully", "C": "Whether it looks the way I wanted", "D": "Whether other people liked it"}, "fig": "", "passage": null, "cnum": 2}, {"n": 22, "type": "selfeval", "section": "Character", "stem": "What makes you feel proud of yourself?", "options": {"A": "Finishing something that was hard", "B": "Learning something brand new", "C": refers story books to reference books."}, "fig": "", "passage": null, "qnum": 35}, {"n": 70, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "STATEMENT: \"At Greenfield School, 60% of the students walk to school, and the rest travel by bus.\"\n\nCONCLUSIONS:\n1. Fewer than half of the students travel by bus.\n2. Some students travel to school by car.\n3. More students walk than travel by bus.\n\nUsing only the information in the statement, which conclusions FOLLOW?", "options": {"A": "Conclusions 1 and 2 only", "B": "Conclusions 2 and 3 only", "C": "Conclusions 1 and 3 only", "D": "Conclusions 1, 2 and 3"}, "fig": "", "passage": null, "qnum": 36}, {"n": 71, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "FACTS:\n• All members of the chess club stay after school on Fridays.\n• No member of the choir stays after school on Fridays.\n• Tom is a member of the chess club.\n\nWhich conclusion does NOT follow from these facts?", "options": {"A": "Tom stays after school on Fridays.", "B": "Tom is not a member of the choir.", "C": "No one who leaves immediately after school on Friday is a chess club member.", "D": "Tom is the only chess club member who stays after school on Fridays."}, "fig": "", "passage": null, "qnum": 37}, {"n": 72, "type": "mcq", "section": "Global Knowledge & Logic", "stem": "QUESTION: Should the school keep the library open for an extra hour after classes end?\n\nWhich of the following THREE arguments is the STRONGEST?", "options": {"A": "Yes, in a trial last year, the number of students who finished their homework on the same day rose by 28% when the library stayed open an extra hour, and the school's costs did not go up.", "B": "No, I never use the library after class, so I don't think anyone else would use it either.", "C": "Yes, every good school in the world keeps its library open late, so ours should too.", "D": ""}, "fig": "", "passage": null, "qnum": 38}];

    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
