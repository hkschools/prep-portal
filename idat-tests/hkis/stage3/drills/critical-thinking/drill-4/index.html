<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 3 Critical Thinking Drill 4</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 3 Critical Thinking Drill 4</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "3", VERSION = "CT-D4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Answer all questions. Use only the information given in each question."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The trust should fit solar panels to the school roofs, because the electricity generated would cover most of the daytime demand of the buildings beneath them.\"<br><br>ASSUMPTION: \"The school roofs receive enough sunlight to generate a substantial amount of electricity.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The city should extend the night bus route to the hospital, because shift workers finishing at two in the morning currently have no way home.\"<br><br>ASSUMPTION: \"The extended night bus would run at around the time those shifts finish.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The gallery should abolish its entry charge, because attendance at comparable galleries rose sharply after they went free.\"<br><br>ASSUMPTION: \"The gallery holds a larger permanent collection than the comparable galleries.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The hospital should abolish staff parking charges, because the charge is deterring nurses from accepting shifts at short notice.\"<br><br>ASSUMPTION: \"Some nurses who might otherwise accept short-notice shifts drive to the hospital.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every sample stored in freezer C was catalogued on arrival. Sample 88 was not catalogued on arrival.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Sample 88 is not stored in freezer C.", "B": "Every catalogued sample is stored in freezer C.", "C": "Sample 88 was damaged.", "D": "Freezer C is full."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A swimming club has 90 members. Every member who competes also holds a timing licence, and 34 members compete.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Exactly 34 members hold a timing licence.", "B": "56 members do not hold a timing licence.", "C": "At least 34 members hold a timing licence.", "D": "Every member holding a timing licence competes."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No vehicle without a resident permit may park in zone 4 overnight. The blue estate car parked in zone 4 overnight and has no resident permit.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The blue estate car was issued a fine.", "B": "The two statements cannot both be true.", "C": "Zone 4 has more spaces than any other zone.", "D": "The blue estate car belongs to a visitor."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A bakery made 480 loaves yesterday. Every sourdough loaf was baked before six in the morning, and 150 loaves were sourdough.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "330 loaves were baked after six in the morning.", "B": "Sourdough is the bakery's most popular loaf.", "C": "Only sourdough loaves were baked before six.", "D": "At least 150 loaves were baked before six in the morning."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A bike-share scheme recorded 1.4 million hires last year, up from 1.1 million. The proportion of hires ending at a station with no free dock rose from 3 per cent to 7 per cent. The operator added 200 bicycles but no new stations.\"<br><br>CONCLUSIONS:<br>(1) Hires increased compared with the previous year.<br>(2) A larger share of hires ended at a full station than in the previous year.<br>(3) Adding bicycles without stations caused the docking problem.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "B": "Only conclusion (1) follows.", "C": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A university received 24,000 applications this year, 3,000 more than last year. The share of applicants offered a place fell from 42 per cent to 38 per cent. The university introduced a new foundation programme during the year.\"<br><br>CONCLUSIONS:<br>(1) The university received 21,000 applications last year.<br>(2) A smaller share of applicants was offered a place than last year.<br>(3) Fewer applicants were offered places than last year.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "B": "Only conclusion (1) follows.", "C": "All three conclusions follow.", "D": "Conclusions (1) and (2) follow; conclusion (3) does not follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A supermarket chain reports that food sent to waste fell by 22 per cent after it began discounting items close to their use-by date. Sales revenue was unchanged. Staff at three stores reported that the discount labels take significant time to apply each evening.\"<br><br>CONCLUSIONS:<br>(1) Food waste fell after the discounting began.<br>(2) Some staff reported a practical drawback of the scheme.<br>(3) The scheme increased the chain profits.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "Only conclusion (2) follows."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A coastal survey found that 14 of 40 monitored beaches lost more than a metre of sand last winter. Of those 14, nine lie east of the headland. The survey covered 22 beaches east of the headland and 18 west of it.\"<br><br>CONCLUSIONS:<br>(1) Most monitored beaches did not lose more than a metre of sand.<br>(2) A higher proportion of eastern beaches than western beaches lost more than a metre.<br>(3) The headland caused the difference between east and west.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "Only conclusion (1) follows.", "C": "All three conclusions follow.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every plant entering the nursery is held in quarantine for a fortnight.<br>2. No plant in quarantine may be sold to the public.<br>3. The Wexford roses entered the nursery on Monday.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "The Wexford roses were held in quarantine.", "B": "The Wexford roses could not be sold to the public during quarantine.", "C": "Every plant in quarantine entered the nursery."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. If the overnight backup fails, an alert is written to the system log.<br>2. If an alert is written to the system log, the duty engineer is paged.<br>3. On Sunday night the duty engineer was not paged.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "On Sunday night the overnight backup did not fail.", "B": "Whenever the duty engineer is paged, the overnight backup has failed.", "C": "On Sunday night no alert was written to the system log."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every ticket bought through the box office is refundable.<br>2. No refundable ticket may be resold by the holder.<br>3. Devika bought her ticket through the box office.<br><br>Therefore, which of the following conclusions FOLLOWS?", "options": {"A": "Devika may not resell her ticket.", "B": "Every refundable ticket was bought through the box office.", "C": "Devika is the only ticket holder barred from reselling."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All candidates on the audition shortlist have passed a sight-reading test.<br>2. Some who have passed the sight-reading test play a brass instrument.<br>3. No brass player may audition in the small studio.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "All candidates on the shortlist have passed a sight-reading test.", "B": "Anyone permitted to audition in the small studio does not play brass.", "C": "Some candidates on the shortlist play a brass instrument."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should secondary schools ban smartphones during the school day?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. Walk into any secondary school at break time and you will see thirty children in a room, all silent, all staring downwards. It is a bleak sight and anyone who remembers what break time used to be would ban them tomorrow.", "B": "A study across a set of English secondary schools compared attainment before and after phone bans, and found the largest gains among lower-attaining pupils, with little measurable change for the highest attainers. A separate national survey found no difference in average wellbeing scores between schools with and without bans. Therefore the case for a ban rests on attainment among struggling pupils rather than on wellbeing.", "C": "No. Banning a device does not teach anyone to use it sensibly. Children will leave school and be handed a phone and no self-control, and we will have simply postponed the problem rather than dealing with it."}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should there be a minimum price per unit of alcohol?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Scotland introduced a 50 pence minimum unit price in 2018. Public Health Scotland's evaluation found alcohol sales fell by about 3 per cent, with the reduction concentrated among the heaviest-drinking households, and modelling attributed a fall of roughly 13 per cent in alcohol-specific deaths. Therefore the policy reached the group it was aimed at.", "B": "Yes. Cheap alcohol is a scourge and everyone knows it. You can buy strong cider for less than a bottle of water, which tells you everything about the priorities of the people selling it.", "C": "No. It is a tax on being poor, plain and simple. Wealthy drinkers will not notice a penny of it, while someone on a small income who enjoys a drink at the end of the week pays more for exactly the same bottle. Punishing people for their income is not health policy."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should rental e-scooters be permitted on public roads?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Great Britain ran rental e-scooter trials in around thirty areas from 2020. Department for Transport monitoring recorded a collision rate per mile higher than for cycling but lower than for motorcycling, alongside survey evidence that roughly a fifth of rental trips replaced a car journey. Therefore the decision involves weighing a measurable safety cost against a measurable reduction in car use.", "B": "Yes. Cities are choking on traffic and we cannot keep pretending the car is the answer. Anything that gets people out of their vehicles deserves support, and objecting to a small electric machine while ignoring the lorries is simply not serious.", "C": "No. They are a menace. I have nearly been knocked down twice on my own pavement by silent machines travelling at the speed of a moped, ridden by people who plainly have no idea what the rules are, assuming there are any."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should employers be required to enrol staff automatically into a pension, with the option to opt out?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. People are hopeless at planning for the future. Left alone, most of us would spend the lot and worry about it at sixty-five, and then expect somebody else to pick up the bill. Sometimes people need saving from themselves.", "B": "No. Calling it a choice is a sleight of hand. Everyone knows most people never change a default setting on anything, so an opt-out is a compulsion dressed in polite clothing, and we should at least be honest about what we are doing.", "C": "The United Kingdom introduced automatic enrolment from 2012. Participation among eligible private-sector employees rose from around 42 per cent to about 86 per cent within a decade, and opt-out rates settled near one in ten, well below the levels predicted beforehand. Therefore the default changes behaviour substantially while leaving the choice formally intact."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 Critical Thinking Drill 4</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
