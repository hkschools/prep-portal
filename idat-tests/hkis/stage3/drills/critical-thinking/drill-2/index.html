<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 3 Critical Thinking Drill 2</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 3 Critical Thinking Drill 2</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "3", VERSION = "CTD2";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Twenty questions on the five Critical Thinking question types used in the IDAT. Use ONLY the information you are given. The number of choices varies by question type, and Yes/No questions do not always put Yes first, so read the options each time."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The borough should convert the disused rail cutting into a cycle route, because it would give residents of the eastern estates a direct off-road link to the hospital.\"<br><br>ASSUMPTION: \"The rail cutting runs between the eastern estates and the hospital.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The clinic should send dental check-up reminders by text message rather than by post, because doing so will reduce the number of appointments missed without attendance.\"<br><br>ASSUMPTION: \"Some patients who miss appointments do so because the postal reminder did not reach them in time.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The festival should move from July to September, because July competes with three other regional festivals for the same performers.\"<br><br>ASSUMPTION: \"The festival attracts a younger audience than the three competing events.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The university should publish past examination papers online, because students who cannot afford commercial revision courses are currently at a disadvantage.\"<br><br>ASSUMPTION: \"The commercial revision courses give students access to past examination papers.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every parcel processed at the Eastgate depot on Monday was scanned on arrival. Parcel 4471 was processed at Eastgate on Monday.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Parcel 4471 was the only parcel scanned at Eastgate.", "B": "Parcel 4471 was delivered on Monday.", "C": "Every parcel scanned on arrival was processed at Eastgate.", "D": "Parcel 4471 was scanned on arrival."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A cinema has six screens. Every film showing before noon is screened in an accessible auditorium, and screens 1 and 2 are the only accessible auditoriums.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Screens 3 to 6 are never used before noon for any purpose.", "B": "Screens 1 and 2 show films only before noon.", "C": "Exactly two films are shown before noon each day.", "D": "No films are shown before noon on screens 3 to 6."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"All the modules Priya took in her second year required a written examination. One module she took in her second year was assessed entirely by coursework.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Priya failed that module.", "B": "Priya took no modules in her second year.", "C": "The statements above cannot both be true.", "D": "Priya took the coursework module in her third year."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A delivery company operates 40 vans. Twenty-five are electric, and every electric van is fitted with a telematics unit. Twelve vans in total are more than five years old.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "All twelve of the older vans are diesel.", "B": "At least twenty-five vans have a telematics unit.", "C": "Exactly twenty-five vans have a telematics unit.", "D": "Fifteen vans have no telematics unit."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A city monitored roadside air quality at twelve sites for two years. Average nitrogen dioxide fell by 18 per cent across the sites. Two sites, both beside bus interchanges, recorded no measurable fall. The city introduced a low-emission zone during the first year.\"<br><br>CONCLUSIONS:<br>(1) Average nitrogen dioxide across the monitored sites fell over the two years.<br>(2) The low-emission zone caused the fall in nitrogen dioxide.<br>(3) Not every monitored site recorded a fall.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (1) follows.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "Conclusions (1) and (3) follow; conclusion (2) does not follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A school surveyed all 480 pupils about its lunch service. 312 said the queue was too long, 156 said the food ran out before they were served, and 108 said both. The school added a second serving counter after the survey closed.\"<br><br>CONCLUSIONS:<br>(1) 120 pupils reported neither a long queue nor food running out.<br>(2) Fewer than half the pupils reported that food ran out.<br>(3) The second serving counter shortened the queue.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "All three conclusions follow.", "C": "Only conclusion (2) follows.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A rail operator reports that 84 per cent of its trains arrived within three minutes of schedule last quarter, up from 79 per cent the previous quarter. It also reports that the number of trains cancelled rose from 310 to 402 over the same period.\"<br><br>CONCLUSIONS:<br>(1) Punctuality among the trains that ran improved compared with the previous quarter.<br>(2) More trains were cancelled last quarter than in the previous one.<br>(3) The service as a whole improved for passengers.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (2) follows.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "All three conclusions follow.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not follow."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"An energy regulator found that 2.1 million households switched supplier last year, the highest number recorded. It also found that households in the lowest income quintile switched at less than half the rate of those in the highest, and that 68 per cent of households have never switched.\"<br><br>CONCLUSIONS:<br>(1) Most households have never switched supplier.<br>(2) Lower income households switched less often than higher income households.<br>(3) Households that switched saved money.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "Only conclusion (2) follows.", "C": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "D": "All three conclusions follow."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every sample stored in the cold room is logged in the freezer register.<br>2. No sample logged in the freezer register may be discarded without a supervisor signature.<br>3. Sample K-12 is stored in the cold room.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Sample K-12 is logged in the freezer register.", "B": "Every sample logged in the freezer register is stored in the cold room.", "C": "Sample K-12 may not be discarded without a supervisor signature."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. If a claim exceeds 10,000 dollars, it is referred to the review panel.<br>2. If a claim is referred to the review panel, payment is delayed by at least two weeks.<br>3. The Nakamura claim was paid without any delay.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "The Nakamura claim was not referred to the review panel.", "B": "The Nakamura claim did not exceed 10,000 dollars.", "C": "Any claim paid without delay is worth less than 1,000 dollars."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every painting on loan to the gallery is insured by the lending institution.<br>2. No painting insured by a lending institution may travel without a courier.<br>3. The Rousseau landscape is on loan to the gallery.<br><br>Therefore, which of the following conclusions FOLLOWS?", "options": {"A": "The Rousseau landscape may not travel without a courier.", "B": "Every painting insured by a lending institution is on loan to the gallery.", "C": "The Rousseau landscape is the only loaned painting requiring a courier."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All holders of an allotment tenancy live in the parish.<br>2. Some residents of the parish keep bees.<br>3. No beekeeper may use the parish store shed for chemical storage.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Some allotment tenancy holders keep bees.", "B": "Anyone permitted to store chemicals in the parish store shed does not keep bees.", "C": "All allotment tenancy holders live in the parish."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should restaurants be required to display calorie counts on their menus?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "England required calorie labelling in large food outlets from 2022. Researchers comparing labelled and unlabelled chains found the calories purchased per customer fell by a small but measurable amount, around 4 per cent, with no detectable change in overall spending at the outlets studied. Therefore the measure shifts choices slightly without harming the businesses required to apply it.", "B": "No, and I speak as someone who eats out perhaps twice a week. Nobody wants a lecture with their dinner. Half the numbers are guesswork anyway, and the people who really need to change their habits are precisely the ones who will ignore a figure printed next to the price.", "C": "Yes, obviously. Obesity is one of the great health crises of our time and we cannot simply pretend otherwise. If putting a number on a menu nudges even a handful of people towards a better choice, then what conceivable reason is there not to do it?"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should primary schools set a strict limit on the amount of homework given each week?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. Childhood lasts such a short time and we are filling it with worksheets. My daughter cried over a maths sheet last Tuesday and I found myself wondering what any of it is really for. Children should be climbing trees, not sitting at kitchen tables until seven in the evening.", "B": "A review of research covering more than a hundred studies found no measurable link between homework volume and attainment at primary level, while the same review found a clear link at secondary level. Therefore a primary limit would cost little in attainment terms and would free time for other activity.", "C": "No. Homework teaches discipline, and discipline is what children lack today. Every generation before this one managed perfectly well with homework, and they turned out fine. Removing it would simply be one more surrender to the idea that nothing should ever be difficult."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should hospitals send text message reminders before every outpatient appointment?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Hospitals are not short of things to spend money on, and every pound going into a messaging system is a pound not going into treatment. People manage to remember their own dentist and hairdresser, so why should a hospital appointment be any different?", "B": "Yes. It is basic courtesy, and frankly it is embarrassing that we are even debating it in an age when everyone carries a telephone in their pocket. Any organisation that cannot manage a text message in the twenty-first century has bigger problems than missed appointments.", "C": "A trial across several NHS trusts sent reminders to a randomly selected half of patients and compared attendance with the unreminded half. Missed appointments fell from about 11 per cent to about 8 per cent among those reminded, and the messaging cost was a small fraction of the value of the recovered appointment slots. Therefore reminders recover more capacity than they cost."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should local authorities be allowed to charge higher council tax on homes left empty for more than a year?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Yes. It is frankly obscene that houses sit empty while families are on waiting lists. Anyone who can afford to leave a property rotting for a year can afford to pay more for the privilege, and if they do not like it they are welcome to sell it to somebody who will actually live in it.", "B": "Councils in England have been able to levy an empty-homes premium since 2013. Government data show the number of long-term empty properties in authorities applying the highest premium fell by roughly 9 per cent over five years, against a small rise in comparable authorities that did not apply it. Therefore the charge measurably reduces the number of homes left empty.", "C": "No. Punishing people through the tax system for the crime of owning a building is a dangerous road to start down. Where does it end? Today it is empty homes, tomorrow it is spare rooms, and the year after that it is anyone whose house is judged bigger than a committee thinks they need."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 Critical Thinking Drill 2</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
