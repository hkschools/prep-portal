<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 3 Critical Thinking Drill 1</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">HK-Schools.com</div>
    <div class="timer" id="timer"></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="foot">IDAT HKIS: Stage 3 Critical Thinking Drill 1</div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "3", VERSION = "CT-D1";
const QUESTIONS = [{"n": "1", "type": "info", "title": "Critical Thinking", "body": "Twenty questions on the five Critical Thinking question types used in the IDAT. Use ONLY the information you are given; do not bring in anything you happen to know from outside the question. The number of choices varies by question type, and Yes/No questions do not always put Yes first, so read the options each time."}, {"n": "2", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The council should replace the street lighting in the old quarter with LED units, because doing so will cut the district's lighting electricity bill by about a third.\"<br><br>ASSUMPTION: \"The existing street lights in the old quarter consume more electricity than LED units of equivalent brightness.\"<br><br>Is this assumption logical?", "options": {"A": "Yes", "B": "No"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The airline should introduce a hand-luggage-only fare, because passengers who travel without a checked bag are subsidising those who do not.\"<br><br>ASSUMPTION: \"The airline currently charges the same fare whether or not a passenger checks a bag.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The museum should stop publishing visitor numbers, because the figures are used by critics to attack its funding.\"<br><br>ASSUMPTION: \"The museum's visitor figures are the most accurate measure of its cultural value.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The ferry operator should add a 06:30 sailing, because commuters currently arriving on the 07:15 reach the business district after their shifts have started.\"<br><br>ASSUMPTION: \"The 06:30 sailing would be scheduled to arrive before those shifts begin.\"<br><br>Is this assumption logical?", "options": {"A": "No", "B": "Yes"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"Every apartment in the Marlow building that was refurbished last year has a new water meter. Apartment 12B does not have a new water meter.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "Apartment 12B uses more water than the refurbished apartments.", "B": "Apartment 12B was not refurbished last year.", "C": "Every apartment with a new water meter was refurbished last year.", "D": "Apartment 12B will be refurbished next year."}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A regional library service has 30 branches. Eighteen of them open on Sundays, and every branch that opens on Sunday also opens on Saturday.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "At least eighteen branches open on Saturdays.", "B": "Exactly eighteen branches open on Saturdays.", "C": "Twelve branches are closed at weekends.", "D": "Every branch that opens on Saturday also opens on Sunday."}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"The Halvard Prize has been awarded every year since 1996. It has never been awarded to the same person twice.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The prize has been awarded to more than one person in some years.", "B": "Every winner has been alive at the time of the award.", "C": "The prize has had a different winner in every year since 1996.", "D": "The prize is the most prestigious award in its field."}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"No train on the coastal line runs after 22:00. The 21:40 service from Fairhaven is on the coastal line and was delayed by fifty minutes.\"<br><br>Using ONLY the information above, which one of the following MUST be true?", "options": {"A": "The 21:40 service was cancelled.", "B": "The coastal line is the busiest line in the region.", "C": "Passengers on the 21:40 service were offered a refund.", "D": "At least one train on the coastal line ran after 22:00."}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A city introduced a deposit-return scheme for drink containers eighteen months ago. Since then, 78 per cent of eligible containers have been returned, and litter surveys in the city centre record 40 per cent fewer discarded containers. Some small retailers report that the return machines take up floor space they can ill afford.\"<br><br>CONCLUSIONS:<br>(1) Most eligible containers are now returned under the scheme.<br>(2) The scheme has caused the fall in discarded containers recorded by the litter surveys.<br>(3) Some retailers have raised a practical objection to the scheme.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "All three conclusions follow.", "C": "Only conclusion (1) follows.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not follow."}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A regional hospital treated 4,800 patients in its emergency department last month, which was 600 more than in the same month last year. Average waiting time rose from 3.1 hours to 3.4 hours. The hospital opened a new assessment unit partway through the month.\"<br><br>CONCLUSIONS:<br>(1) The emergency department treated 4,200 patients in the same month last year.<br>(2) Waiting times rose by less than half an hour on average.<br>(3) The new assessment unit failed to reduce waiting times.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Only conclusion (1) follows.", "B": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "C": "All three conclusions follow.", "D": "Conclusions (2) and (3) follow; conclusion (1) does not follow."}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"An employer surveyed all 250 of its staff about a proposed move to the city outskirts. Every member of staff replied. 160 said the move would lengthen their commute, 95 said they would consider leaving the company if it went ahead, and 70 said both.\"<br><br>CONCLUSIONS:<br>(1) 65 members of staff said neither that their commute would lengthen nor that they would consider leaving.<br>(2) A majority of staff said the move would lengthen their commute.<br>(3) The move will cause 95 members of staff to resign.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "All three conclusions follow.", "B": "Conclusions (2) and (3) follow; conclusion (1) does not follow.", "C": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "D": "Only conclusion (2) follows."}, "fig": "", "passage": "", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "Critical Thinking", "stem": "STATEMENT: \"A national parks agency reports that visitor numbers to its upland reserves rose 12 per cent last year. Mountain rescue callouts in the same areas rose 9 per cent. The agency also introduced a free route-planning app during the year, which was downloaded 40,000 times.\"<br><br>CONCLUSIONS:<br>(1) Both visitor numbers and rescue callouts increased last year.<br>(2) Callouts rose more slowly than visitor numbers.<br>(3) The route-planning app reduced the number of callouts.<br><br>Using ONLY the information in the statement, which conclusions follow?", "options": {"A": "Conclusions (1) and (2) follow; conclusion (3) does not follow.", "B": "Only conclusion (1) follows.", "C": "All three conclusions follow.", "D": "Conclusions (1) and (3) follow; conclusion (2) does not follow."}, "fig": "", "passage": "", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every vessel registered in the harbour carries a marine radio.<br>2. No vessel carrying a marine radio may moor at the inner quay overnight.<br>3. The Selkie is registered in the harbour.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "The Selkie carries a marine radio.", "B": "Every vessel carrying a marine radio is registered in the harbour.", "C": "The Selkie may not moor at the inner quay overnight."}, "fig": "", "passage": "", "qnum": "13"}, {"n": "15", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. If the frost alarm sounds, the greenhouse vents close.<br>2. If the greenhouse vents close, the backup heater starts.<br>3. On Thursday night the backup heater did not start.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "On Thursday night the greenhouse vents did not close.", "B": "On Thursday night the frost alarm did not sound.", "C": "Whenever the backup heater starts, the frost alarm has sounded."}, "fig": "", "passage": "", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. Every grant approved by the trustees is published in the annual register.<br>2. No grant published in the annual register is exempt from audit.<br>3. The Kestrel grant was approved by the trustees.<br><br>Therefore, which of the following conclusions FOLLOWS?", "options": {"A": "The Kestrel grant is not exempt from audit.", "B": "Every grant published in the annual register was approved by the trustees.", "C": "The Kestrel grant is the only approved grant subject to audit."}, "fig": "", "passage": "", "qnum": "15"}, {"n": "17", "type": "mcq", "section": "Critical Thinking", "stem": "FACTS: Treat all of the following as completely true.<br>1. All members of the harbour board live within the district.<br>2. Some residents of the district hold a commercial fishing licence.<br>3. No holder of a commercial fishing licence may vote on quota decisions.<br><br>Which conclusion does NOT follow from these facts?", "options": {"A": "Some members of the harbour board hold a commercial fishing licence.", "B": "Anyone who may vote on quota decisions does not hold a commercial fishing licence.", "C": "Every member of the harbour board lives within the district."}, "fig": "", "passage": "", "qnum": "16"}, {"n": "18", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should the city introduce a 30 km/h speed limit on all residential streets?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "When Bristol lowered its limit to 20 miles per hour across most residential streets, an independent university study covering three years and roughly 500 streets recorded 4 fewer fatal and 11 fewer serious injuries a year, with average journey times changing by well under a minute. Therefore the measure reduces harm without meaningfully slowing traffic.", "B": "Certainly not. I drive through those streets twice a day and I have never once seen anything remotely resembling an accident. Drivers already have quite enough signs to look at without another one, and adding more rules that nobody enforces simply teaches people to ignore the rules that matter.", "C": "Yes, without question. Every child deserves to be safe walking to school, and if a lower limit spares even one family from the worst news of their lives then the argument is surely over. Who could possibly put a few seconds of journey time above a child's life?"}, "fig": "", "passage": "", "qnum": "17"}, {"n": "19", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should supermarkets be required to sell fruit and vegetables loose rather than in plastic packaging?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "Absolutely. Plastic is choking the oceans and we all know it. Every time I unwrap a cucumber I feel a stab of guilt, and I cannot be the only one. Future generations will judge us harshly for wrapping food that already comes in its own skin.", "B": "No. Packaging exists for a reason, and anyone who has watched a supermarket at closing time knows how much produce gets damaged by handling. Take the wrapping away and you will simply swap a plastic problem for a food-waste problem, which is worse.", "C": "A French ban on plastic packaging for around thirty types of fruit and vegetable took effect in 2022. Government monitoring over the following two years found roughly a billion fewer items of packaging annually, while measured spoilage in the affected categories rose by under 2 per cent. Therefore the packaging can be removed at scale with only a small trade-off."}, "fig": "", "passage": "", "qnum": "18"}, {"n": "20", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should secondary schools start the day at 09:30 rather than 08:15?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Schools have started in the early morning for generations and it has never done anyone any harm. Changing it now would throw every family routine into chaos, and for what? Teenagers who are tired should simply go to bed earlier instead of expecting the world to rearrange itself around them.", "B": "A Seattle school district moved its secondary start time from 07:50 to 08:45 in 2016. Researchers measured students' sleep with wrist monitors before and after, finding an average gain of 34 minutes a night, alongside improved grades and a fall in recorded lateness. Therefore a later start delivers measurable benefits rather than simply shifting the problem.", "C": "Yes. Anyone who has tried to wake a fifteen-year-old at seven in the morning knows exactly how this argument ends. My own two are practically sleepwalking at breakfast, and it seems obvious that nobody learns anything useful in that state."}, "fig": "", "passage": "", "qnum": "19"}, {"n": "21", "type": "mcq", "section": "Critical Thinking", "stem": "ARGUMENT: Should the government fund free public transport for everyone under eighteen?<br><br>Which of the following is the strongest argument in relation to the question above?", "options": {"A": "No. Nothing is free, and someone always ends up paying. Money does not appear from nowhere, and every pound spent on this is a pound not spent on something else. It is easy to be generous with other people's taxes when you are not the one writing the cheque.", "B": "Yes. Getting about should not depend on what your parents earn, and it is simply unfair that some children can reach a sports club or a library and others cannot. A civilised country ought to be better than that, and most people would agree if they thought about it honestly.", "C": "Scotland introduced free bus travel for under-22s in 2022. Transport Scotland's monitoring found about 150 million free journeys made in the first two years, with the largest increases among young people in the most deprived areas, and no measurable fall in service reliability. Therefore the policy widens access substantially without degrading the network."}, "fig": "", "passage": "", "qnum": "20"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 Critical Thinking Drill 1</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
