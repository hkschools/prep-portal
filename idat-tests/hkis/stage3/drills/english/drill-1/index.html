  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}

  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}

  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}

 arranging lamps on the rocks below, which struck him as an odd way to make darkness. At half past nine he pulled the switch, and the beam that had gone round every twelve seconds since before he was born stopped going round.</p><p>What surprised him was not the dark. It was the quiet. He had forgotten that the lamp made a sound, a soft rhythmic breath as the mechanism turned, so constant that for thirty years he had stopped hearing it. Without it the tower was as silent as a cupboard.</p><p>He had expected to spend the hours thinking about his father, or about the years of climbing those stairs twice a night, but what came instead was smaller and stranger: the memory of a particular winter when the fog had sat on the point for nine days and the beam had been, as far as any ship could tell, entirely useless. He had kept it turning anyway. That was the job. You did not switch off a light because you could not see what it reached.</p><p>Below him the film people moved their lamps twice more and argued quietly about a shadow. Somebody laughed. The sea went on doing what it had always done, invisible now and much louder for it, and Mr Odell found that he was listening to it properly for the first time in three decades.</p><p>A young woman from the film company climbed up at eleven with two paper cups of tea. She asked whether he minded, and he said he did not, which was true, and then found himself explaining that his father had kept the same light, and that the beam had been the first thing he ever remembered seeing from his bedroom window, sweeping the ceiling every twelve seconds like something checking he was still there.</p><p>She was quiet for a while. Then she said that when they finished she would like to watch him switch it back on, if that was allowed.</p><p>At twenty past two the mechanism took hold, the sound returned before the light did, and the beam went out across the water as though it had never stopped. The young woman said something Mr Odell did not c eper to give up his job at the lighthouse."}, "fig": "", "passage": "<strong>The Light at Skerry Point</strong><br><p>The lighthouse at Skerry Point had been automatic for eleven years when Mr Odell was asked to switch it off for one night.</p><p>A film company wanted the headland dark for a scene, and the harbour authority had agreed, provided somebody who knew the machinery stood beside it the whole time. Mr Odell had been the last keeper before the automation, so the letter came to him.</p><p>He arrived at six with a flask and a folding chair, and found the film people arranging lamps on the rocks below, which struck him as an odd way to make darkness. At half past nine he pulled the switch, and the beam that had gone round every twelve seconds since before he was born stopped going round.</p><p>What surprised him was not the dark. It was the quiet. He had forgotten that the lamp made a sound, a soft rhythmic breath as the mechanism turned, so constant that for thirty years he had stopped hearing it. Without it the tower was as silent as a cupboard.</p><p>He had expected to spend the hours thinking about his father, or about the years of climbing those stairs twice a night, but what came instead was smaller and stranger: the memory of a particular winter when the fog had sat on the point for nine days and the beam had been, as far as any ship could tell, entirely useless. He had kept it turning anyway. That was the job. You did not switch off a light because you could not see what it reached.</p><p>Below him the film people moved their lamps twice more and argued quietly about a shadow. Somebody laughed. The sea went on doing what it had always done, invisible now and much louder for it, and Mr Odell found that he was listening to it properly for the first time in three decades.</p><p>A young woman from the film company climbed up at eleven with two paper cups of tea. She asked whether he minded, and he said he did not, which was true, and then found himself explaining that his father had kept the same light, and that the beam had been the first thing he ever remembered seeing from his bedroom window, sweeping the ceiling every twelve seconds like something checking he was still there.</p><p>She was quiet for a while. Then she said that when they finished she would like to watch him switch it back on, if that was allowed.</p><p>At twenty past two the mechanism took hold, the sound returned before the light did, and the beam went out across the water as though it had never stopped. The young woman said something Mr Odell did not catch, because he was listening to the machinery. On the way down she thanked him, and he realised she had stayed nearly three hours in the cold for a switch that took two seconds to throw.</p>", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English", "intro": "Two writing tasks. Part 1 is an editing task; Part 2 is one short piece of writing.", "label": "", "body": "", "hint": "Part 1: for each numbered bracket choose the option that makes the writing correct and clear. Part 2: choose ONE task and write a paragraph of no more than 8 sentences.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear.\n\n[1: A) Although B) Because C) Since] the forecast promised sunshine, we packed raincoats anyway. By the time we [2: A) arrive B) arrived C) had arrived] at the reservoir, the sky had turned the colour of slate. Mira, [3: A) who's B) whose C) who] idea the walk had been, insisted that the weather [4: A) would clear B) will clear C) clears] within the hour. It did not. We sheltered under a stand of pines and ate our sandwiches, [5: A) watching B) watched C) watch] the rain move across the water in grey sheets. Nobody complained, and by four o'clock we [6: A) have agreed B) had agreed C) agree] it had been the best day of the holiday.", " let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 English Drill 1</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
