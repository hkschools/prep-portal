<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .cz{background:#eaf2fb;border:1px solid #b9d3ee;border-radius:5px;padding:1px 5px;white-space:normal;display:inline-block;margin:1px 0}
  .cz b{color:var(--brand);font-weight:700}
  .cz i{font-style:italic}
  .cz .czn{background:var(--brand);color:#fff;border-radius:4px;padding:0 5px;margin-right:3px;font-weight:700}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "3", VERSION = "4";
const QUESTIONS = [{"n": "1", "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": "2", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nOf the three routes to school, the ferry is the ______.", "options": {"A": "faster", "B": "most fastest", "C": "fastest", "D": "most fast"}, "fig": "", "passage": "", "qnum": "1"}, {"n": "3", "type": "mcq", "section": "English", "stem": "Add a suffix to the word <u>child</u> to complete the sentence with a word meaning 'silly and immature'.\n\nThe coach told the twins to stop their ______ arguing over whose turn it was.", "options": {"A": "childlike", "B": "childhood", "C": "childless", "D": "childish"}, "fig": "", "passage": "", "qnum": "2"}, {"n": "4", "type": "mcq", "section": "English", "stem": "Choose the word that correctly completes the sentence.\n\nThe violinist ______ performance closed the concert received a standing ovation.", "options": {"A": "whose", "B": "who", "C": "which", "D": "whom"}, "fig": "", "passage": "", "qnum": "3"}, {"n": "5", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence.\n\nThe rainy weather did not ______ our plans for the class picnic in the least.", "options": {"A": "effect", "B": "affect", "C": "affected", "D": "effected"}, "fig": "", "passage": "", "qnum": "4"}, {"n": "6", "type": "mcq", "section": "English", "stem": "Choose the correct question tag to complete the sentence.\n\nThe visitors haven't seen the panda enclosure yet, ______?", "options": {"A": "haven't they", "B": "did they", "C": "do they", "D": "have they"}, "fig": "", "passage": "", "qnum": "5"}, {"n": "7", "type": "mcq", "section": "English", "stem": "What does the underlined idiom mean in the sentence below?\n\nWith exams only two days away, Marcus stayed up <u>burning the midnight oil</u> to review his notes.", "options": {"A": "working or studying late into the night", "B": "staying awake because he was unable to sleep", "C": "wasting time on unimportant tasks", "D": "using up all his energy too quickly"}, "fig": "", "passage": "", "qnum": "6"}, {"n": "8", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the reported sentence.\n\nDirect speech: \"I am rehearsing for the school musical,\" said Maya last month.\nReported speech: Maya said that she ______ for the school musical at the time.", "options": {"A": "is rehearsing", "B": "rehearsed", "C": "was rehearsing", "D": "has rehearsed"}, "fig": "", "passage": "", "qnum": "7"}, {"n": "9", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>falter</u> in the sentence below?\n\nHalfway through her speech, Priya's voice began to falter, but she took a deep breath and carried on to the end.", "options": {"A": "grow stronger and more confident", "B": "become unsteady and hesitant", "C": "speed up nervously", "D": "stop completely"}, "fig": "", "passage": "", "qnum": "8"}, {"n": "10", "type": "mcq", "section": "English", "stem": "Choose the option that correctly completes the sentence in formal written English.\n\nIf Jonah ______ taller, he would try out for the school basketball team.", "options": {"A": "were", "B": "was", "C": "is", "D": "will be"}, "fig": "", "passage": "", "qnum": "9"}, {"n": "11", "type": "mcq", "section": "English", "stem": "Which option could replace the underlined word to show a FAR greater, more extreme degree of fear?\n\nAs the rope bridge began to sway over the gorge, Leo felt <u>nervous</u> and could not move another step.", "options": {"A": "uneasy", "B": "startled", "C": "petrified", "D": "anxious"}, "fig": "", "passage": "", "qnum": "10"}, {"n": "12", "type": "mcq", "section": "English", "stem": "According to the passage, what does the ANGLE of the waggle run tell the other bees?", "options": {"A": "how rich the patch of flowers is", "B": "how far away the flowers are", "C": "the direction of the hive in relation to the flowers", "D": "the direction of the flowers in relation to the sun"}, "fig": "", "passage": "<strong>The Dance of the Honeybees</strong><br>Deep inside a beehive, where no sunlight ever reaches, honeybees share some of the most precise directions in the animal kingdom. When a worker bee discovers a rich patch of flowers, she flies home and performs a curious routine known as the waggle dance. She runs in a straight line while shaking her body rapidly from side to side, then circles back to the start and repeats the run, over and over, while dozens of her sisters crowd around her in the dark. If the flowers are very close to the hive, she performs a simpler routine called the round dance instead; the full waggle dance is saved for food that lies farther away.\n\nFor centuries, beekeepers noticed the dance but had no idea what it meant. It was not until the 1940s that an Austrian scientist, Karl von Frisch, finally deciphered it. After marking individual bees with tiny dots of paint and watching thousands of dances, he realised the dance was a coded map. The angle of the straight waggle run matches the direction of the flowers: if the bee runs straight up the honeycomb, the food lies in the direction of the sun, while a run angled to the left or right tells the others to fly that far to the left or right of the sun. The length of the run matters too. The longer the bee waggles, the farther away the food is.\n\nBecause the hive is completely dark, the watching bees cannot actually see the dance. Instead, they press close to the dancer, feeling the vibrations and the puffs of air made by her buzzing wings. Within minutes, bees that have never left the hive can fly hundreds of metres, almost straight to flowers they have never seen. A single successful dancer can recruit dozens of foragers in this way, and on a good day the hive may be following directions to several different flower patches at once.\n\nNot everyone accepted the idea at first. Some scientists insisted that the bees were simply following flower scents clinging to the dancer's body, and the argument rumbled on for decades. The doubters were finally silenced when researchers fitted bees with tiny radar trackers: the insects flew almost exactly the distance and direction that the dance had promised, even over bare ground with no flowers to smell. Engineers later built a small robot bee that could perform the waggle dance inside a real hive, and living bees obediently flew out to the feeding stations it described.\n\nVon Frisch's discovery amazed the scientific world, and in 1973 it helped earn him a Nobel Prize. The humble waggle dance reminds us that even the smallest creatures may be carrying out astonishingly complicated conversations, right under our noses.", "qnum": "11"}, {"n": "13", "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word <u>deciphered</u> as it is used in the second paragraph ('Karl von Frisch finally deciphered it')?", "options": {"A": "worked out the meaning of", "B": "wrote down in a notebook", "C": "performed in front of an audience", "D": "proved to be untrue"}, "fig": "", "passage": "<strong>The Dance of the Honeybees</strong><br>Deep inside a beehive, where no sunlight ever reaches, honeybees share some of the most precise directions in the animal kingdom. When a worker bee discovers a rich patch of flowers, she flies home and performs a curious routine known as the waggle dance. She runs in a straight line while shaking her body rapidly from side to side, then circles back to the start and repeats the run, over and over, while dozens of her sisters crowd around her in the dark. If the flowers are very close to the hive, she performs a simpler routine called the round dance instead; the full waggle dance is saved for food that lies farther away.\n\nFor centuries, beekeepers noticed the dance but had no idea what it meant. It was not until the 1940s that an Austrian scientist, Karl von Frisch, finally deciphered it. After marking individual bees with tiny dots of paint and watching thousands of dances, he realised the dance was a coded map. The angle of the straight waggle run matches the direction of the flowers: if the bee runs straight up the honeycomb, the food lies in the direction of the sun, while a run angled to the left or right tells the others to fly that far to the left or right of the sun. The length of the run matters too. The longer the bee waggles, the farther away the food is.\n\nBecause the hive is completely dark, the watching bees cannot actually see the dance. Instead, they press close to the dancer, feeling the vibrations and the puffs of air made by her buzzing wings. Within minutes, bees that have never left the hive can fly hundreds of metres, almost straight to flowers they have never seen. A single successful dancer can recruit dozens of foragers in this way, and on a good day the hive may be following directions to several different flower patches at once.\n\nNot everyone accepted the idea at first. Some scientists insisted that the bees were simply following flower scents clinging to the dancer's body, and the argument rumbled on for decades. The doubters were finally silenced when researchers fitted bees with tiny radar trackers: the insects flew almost exactly the distance and direction that the dance had promised, even over bare ground with no flowers to smell. Engineers later built a small robot bee that could perform the waggle dance inside a real hive, and living bees obediently flew out to the feeding stations it described.\n\nVon Frisch's discovery amazed the scientific world, and in 1973 it helped earn him a Nobel Prize. The humble waggle dance reminds us that even the smallest creatures may be carrying out astonishingly complicated conversations, right under our noses.", "qnum": "12"}, {"n": "14", "type": "mcq", "section": "English", "stem": "Why do the watching bees press close to the dancer instead of simply watching her from nearby?", "options": {"A": "The hive is too crowded for them to stand further back", "B": "The hive is completely dark, so they must sense the dance through vibrations and moving air", "C": "The dancer moves too quickly for their eyes to follow", "D": "They are trying to join in and copy the dance themselves"}, "fig": "", "passage": "<strong>The Dance of the Honeybees</strong><br>Deep inside a beehive, where no sunlight ever reaches, honeybees share some of the most precise directions in the animal kingdom. When a worker bee discovers a rich patch of flowers, she flies home and performs a curious routine known as the waggle dance. She runs in a straight line while shaking her body rapidly from side to side, then circles back to the start and repeats the run, over and over, while dozens of her sisters crowd around her in the dark. If the flowers are very close to the hive, she performs a simpler routine called the round dance instead; the full waggle dance is saved for food that lies farther away.\n\nFor centuries, beekeepers noticed the dance but had no idea what it meant. It was not until the 1940s that an Austrian scientist, Karl von Frisch, finally deciphered it. After marking individual bees with tiny dots of paint and watching thousands of dances, he realised the dance was a coded map. The angle of the straight waggle run matches the direction of the flowers: if the bee runs straight up the honeycomb, the food lies in the direction of the sun, while a run angled to the left or right tells the others to fly that far to the left or right of the sun. The length of the run matters too. The longer the bee waggles, the farther away the food is.\n\nBecause the hive is completely dark, the watching bees cannot actually see the dance. Instead, they press close to the dancer, feeling the vibrations and the puffs of air made by her buzzing wings. Within minutes, bees that have side, then circles back to the start and repeats the run, over and over, while dozens of her sisters crowd around her in the dark. If the flowers are very close to the hive, she performs a simpler routine called the round dance instead; the full waggle dance is saved for food that lies farther away.\n\nFor centuries, beekeepers noticed the dance but had no idea what it meant. It was not until the 1940s that an Austrian scientist, Karl von Frisch, finally deciphered it. After marking individual bees with tiny dots of paint and watching thousands of dances, he realised the dance was a coded map. The angle of the straight waggle run matches the direction of the flowers: if the bee runs straight up the honeycomb, the food lies in the direction of the sun, while a run angled to the left or right tells the others to fly that far to the left or right of the sun. The length of the run matters too. The longer the bee waggles, the farther away the food is.\n\nBecause the hive is completely dark, the watching bees cannot actually see the dance. Instead, they press close to the dancer, feeling the vibrations and the puffs of air made by her buzzing wings. Within minutes, bees that have never left the hive can fly hundreds of metres, almost straight to flowers they have never seen. A single successful dancer can recruit dozens of foragers in this way, and on a good day the hive may be following directions to several different flower patches at once.\n\nNot everyone accepted the idea at first. Some scientists insisted that the bees were simply following flower scents clinging to the dancer's body, and the argument rumbled on for decades. The doubters were finally silenced when researchers fitted bees with tiny radar trackers: the insects flew almost exactly the distance and direction that the dance had promised, even over bare ground with no flowers to smell. Engineers later built a small robot bee that could perform the waggle dance inside a real hive, and living bees obediently flew out to the feeding stations it described.\n\nVon Frisch's discovery amazed the scientific world, and in 1973 it helped earn him a Nobel Prize. The humble waggle dance reminds us that even the smallest creatures may be carrying out astonishingly complicated conversations, right under our noses.", "qnum": "14"}, {"n": "16", "type": "mcq", "section": "English", "stem": "Which statement best expresses the main idea of the whole passage?", "options": {"A": "Karl von Frisch received a Nobel Prize in 1973 for his research", "B": "Honeybees use a coded dance, finally decoded by a patient scientist, to tell one another exactly where to find food", "C": "Honeybees cooperate in many ways to keep their hive running smoothly", "D": "Bees learn where flowers are by following other bees and watching where they fly"}, "fig": "", "passage": "<strong>The Dance of the Honeybees</strong><br>Deep inside a beehive, where no sunlight ever reaches, honeybees share some of the most precise directions in the animal kingdom. When a worker bee discovers a rich patch of flowers, she flies home and performs a curious routine known as the waggle dance. She runs in a straight line while shaking her body rapidly from side to side, then circles back to the start and repeats the run, over and over, while dozens of her sisters crowd around her in the dark. If the flowers are very close to the hive, she performs a simpler routine called the round dance instead; the full waggle dance is saved for food that lies farther away.\n\nFor centuries, beekeepers noticed the dance but had no idea what it meant. It was not until the 1940s that an Austrian scientist, Karl von Frisch, finally deciphered it. After marking individual bees with tiny dots of paint and watching thousands of dances, he realised the dance was a coded map. The angle of the straight waggle run matches the direction of the flowers: if the bee runs straight up the honeycomb, the food lies in the direction of the sun, while a run angled to the left or right tells the others to fly that far to the left or right of the sun. The length of the run matters too. The longer the bee waggles, the farther away the food is.\n\nBecause the hive is completely dark, the watching bees cannot actually see the dance. Instead, they press close to the dancer, feeling the vibrations and the puffs of air made by her buzzing wings. Within minutes, bees that have never left the hive can fly hundreds of metres, almost straight to flowers they have never seen. A single successful dancer can recruit dozens of foragers in this way, and on a good day the hive may be following directions to several different flower patches at once.\n\nNot everyone accepted the idea at first. Some scientists insisted that the bees were simply following flower scents clinging to the dancer's body, and the argument rumbled on for decades. The doubters were finally silenced when researchers fitted bees with tiny radar trackers: the insects flew almost exactly the distance and direction that the dance had promised, even over bare ground with no flowers to smell. Engineers later built a small robot bee that could perform the waggle dance inside a real hive, and living bees obediently flew out to the feeding stations it described.\n\nVon Frisch's discovery amazed the scientific world, and in 1973 it helped earn him a Nobel Prize. The humble waggle dance reminds us that even the smallest creatures may be carrying out astonishingly complicated conversations, right under our noses.", "qnum": "15"}, {"n": "17", "type": "writing", "section": "English Writing", "intro": "Writing section, two parts: Part 1 is a drop-down editing task; Part 2 is one short paragraph. On the real online test, Part 1 appears as drop-down menus inside the passage.", "label": "", "body": "", "hint": "This section has TWO parts and your writing will be viewed by your future school. Part 1: read the passage and, for each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear. Part 2: choose ONE of the two tasks and write a single paragraph of no more than 8 sentences. Check your spelling, punctuation and grammar before you finish.", "placeholder": "Type your answer here (it will be saved for review)…", "partA": "Part 1: Read the passage below. For each numbered bracket, choose the option (A, B or C) that makes the writing correct and clear.\n\n[1: A) Although B) Because C) So] the forecast warned of fierce sun, more than forty students [2: A) gathering B) gathered C) gathers] at the beach early on Sunday for our school's first clean-up day. Our teacher divided us [3: A) onto B) among C) into] six teams and handed out gloves, tongs and rubbish bags. My team worked [4: A) steadily B) steady C) more steady] along the rocks, collecting bottle caps, straws and tangled fishing line. Even at midday, nobody complained about the heat or asked to rest. By noon, every bag [5: A) weighing B) weighed C) was weighed] and labelled by the parent helpers. When the final total was announced, we all agreed it had been the [6: A) most awesome B) proudest C) top] moment of our school year.", "partB": "Part 2: Choose ONE of the two tasks and write a paragraph of no more than 8 sentences:\n(1) Explain how to prepare your favourite simple snack or drink, step by step, so that a friend could follow your instructions exactly.\n(2) Write about a time you lost something important. Describe what happened, how you searched for it, and how the situation ended."}, {"n": "18", "type": "info", "title": "Character", "body": "These questions help us understand how you like to learn. There are no right or wrong answers."}, {"n": "19", "type": "selfeval", "section": "Character", "stem": "What do you do best?", "options": {"A": "Sports and games that keep me moving", "B": "School subjects like reading and maths", "C": "Art, music or making things", "D": "Helping my friends and getting along with people"}, "cnum": "1"}, {"n": "20", "type": "selfeval", "section": "Character", "stem": "If you could try one new thing, which would you pick?", "options": {"A": "A sport I have never played before", "B": "Building or inventing something on my own", "C": "Performing on stage in front of people", "D": "Joining a new club with people I do not know yet"}, "cnum": "2"}, {"n": "21", "type": "selfeval", "section": "Character", "stem": "What do you like the most?", "options": {"A": "Making up my own stories, drawings or games", "B": "Solving puzzles and figuring things out", "C": "Playing games with clear rules to follow", "D": "Improving something until it works really well"}, "cnum": "3"}, {"n": "22", "type": "selfeval", "section": "Character", "stem": "What helps people get along with each other?", "options": {"A": "Listening carefully to what others say", "B": "Sharing and taking turns", "C": "Saying kind and encouraging things", "D": "Working together on the same goal"}, "cnum": "4"}, {"n": "23", "type": "selfeval", "section": "Character", "stem": "What do you want to do better?", "options": {"A": "Speaking up and sharing my ideas", "B": "Staying calm when things go wrong", "C": "Finishing tricky work without giving up", "D": "Making new friends easily"}, "cnum": "5"}, {"n": "24", "type": "selfeval", "section": "Character", "stem": "Everyone feels differently about this. How do you feel about making mistakes when you try something new?", "options": {"A": "I do not mind mistakes at all. They help me learn", "B": "I mind a little, but I still have a go", "C": "I prefer to feel prepared before I try", "D": "I like to feel really sure before I try"}, "cnum": "6"}, {"n": "25", "type": "selfeval", "section": "Character", "stem": "Imagine you are given: a ball, a paintbrush, a notebook and a puzzle. What would you most want to do?", "options": {"A": "Go outside and play with the ball", "B": "Paint or draw a picture", "C": "Write or plan something in the notebook", "D": "Do the puzzle"}, "cnum": "7"}, {"n": "26", "type": "selfe ": "The Alvarez household is not connected to the new metered supply.", "B": "The Alvarez household uses more water than any household on the metered supply.", "C": "The new metered supply lowers consumption in every district the authority serves.", "D": "The Alvarez household will record lower consumption next year."}, "fig": "", "passage": "", "qnum": "9"}];
let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function clozify(s){
  return s.replace(/\[(\d+):\s*([^\]]*)\]/g, function(_, n, body){
    var parts = body.split(/(?=[A-Z]\))/).filter(function(c){ return c.trim(); });
    var inner = parts.map(function(c){
      var m = c.trim().match(/^([A-Z]\))\s*(.*)$/);
      return m ? '<b>'+m[1]+'</b> <i>'+m[2].trim()+'</i>' : c.trim();
    }).join(' &nbsp;');
    return '<span class="cz"><span class="czn">'+n+'</span>'+inner+'</span>';
  });
}
function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V4)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part 1: Editing</div><div class="wbody">${clozify(esc(q.partA))}</div><textarea id="taA" placeholder="Type your Part 1 answers here, e.g. 1-B, 2-C, 3-A…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part 2: Your writing</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Write your Part 2 paragraph here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
