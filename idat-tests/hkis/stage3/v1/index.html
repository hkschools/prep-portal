<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDAT HKIS: Stage 3 (V1)</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6b7a;--brand:#27406b;--accent:#4a6fa5;--line:#dce3ea;--bg:#f4f6f9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:680px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:700;color:var(--brand);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;flex:1;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0 0 6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .qnum{font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
  .stem{font-size:17px;line-height:1.5;margin:0 0 14px;white-space:pre-line}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;margin-bottom:16px}
  .wlabel{font-weight:700;color:var(--brand);font-size:15px;margin:14px 0 8px}
  .wbody{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:15px;line-height:1.65;margin:0 0 14px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;background:#fff}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--brand);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .info-body{font-size:15px;line-height:1.6;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .prev{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .next,.begin,.submit{background:var(--brand);color:#fff;font-weight:600}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .field{margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
  .center{text-align:center;margin:auto 0}
  .big{font-size:48px;line-height:1}
  .ok{color:#1e7a46}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_AymeO8fIN8FFiER3mJZwRlh8OvSIpNuW1Pq1byUN6Q-_sydYmkEihmInIJxvzfeK/exec";
const SCHOOL = "HKIS", STAGE = "3", VERSION = "1";
const QUESTIONS = [{"n": 1, "type": "info", "title": "English", "body": "Read each question and choose the best answer. This section covers grammar, vocabulary and reading comprehension."}, {"n": 2, "type": "mcq", "section": "English", "stem": "Choose the correct words to complete the sentence.\n\nThis time tomorrow afternoon, our family ___ on a beach in Phuket.", "options": {"A": "will lie", "B": "will be lying", "C": "is lying", "D": "will have lain"}, "fig": "", "passage": null, "qnum": 1}, {"n": 3, "type": "mcq", "section": "English", "stem": "What does the prefix trans- mean in words such as transcontinental, transatlantic and transport?", "options": {"A": "across", "B": "before", "C": "against", "D": "again"}, "fig": "", "passage": null, "qnum": 2}, {"n": 4, "type": "mcq", "section": "English", "stem": "Which sentence is written correctly?", "options": {"A": "She opened quickly the letter.", "B": "She opened the letter quick.", "C": "She quickly opened letter.", "D": "She quickly opened the letter."}, "fig": "", "passage": null, "qnum": 3}, {"n": 5, "type": "mcq", "section": "English", "stem": "What does the idiom in quotation marks mean in the sentence below?\n\nWhen Priya promised to finish the whole science project in one evening, her brother warned her that she was 'skating on thin ice'.", "options": {"A": "showing off her talents", "B": "moving too quickly to be careful", "C": "putting herself in a risky situation", "D": "enjoying a difficult challenge"}, "fig": "", "passage": null, "qnum": 4}, {"n": 6, "type": "mcq", "section": "English", "stem": "Choose the word that correctly completes the sentence.\n\nNobody showed the twins how to juggle; they taught ___ by watching online videos.", "options": {"A": "themselves", "B": "theirselves", "C": "themself", "D": "them"}, "fig": "", "passage": null, "qnum": 5}, {"n": 7, "type": "mcq", "section": "English", "stem": "Which word could replace the word in quotation marks to show a much STRONGER feeling?\n\nAfter hiking all day with no lunch, the scouts were 'hungry'.", "options": {"A": "peckish", "B": "ravenous", "C": "drowsy", "D": "furious"}, "fig": "", "passage": null, "qnum": 6}, {"n": 8, "type": "mcq", "section": "English", "stem": "Choose the correct passive form of this sentence.\n\nThe librarian is repairing the old books.", "options": {"A": "The old books are repairing by the librarian.", "B": "The old books were repaired by the librarian.", "C": "The old books are been repaired by the librarian.", "D": "The old books are being repaired by the librarian."}, "fig": "", "passage": null, "qnum": 7}, {"n": 9, "type": "mcq", "section": "English", "stem": "Choose the correctly spelled word to complete the sentence.\n\nKeep the two liquids in ___ containers until the experiment begins.", "options": {"A": "seperate", "B": "separete", "C": "separate", "D": "seprate"}, "fig": "", "passage": null, "qnum": 8}, {"n": 10, "type": "mcq", "section": "English", "stem": "Read the sentence below.\n\n'You must hand in your project by Friday, although you may email the teacher questions at any time, and you should check the class page daily.'\n\nWhich word indicates that something is ALLOWED?", "options": {"A": "must", "B": "may", "C": "should", "D": "although"}, "fig": "", "passage": null, "qnum": 9}, {"n": 11, "type": "mcq", "section": "English", "stem": "What is closest in meaning to the word in quotation marks in the sentence below?\n\nMei took three deep breaths to 'quell' her nerves before stepping onto the stage.", "options": {"A": "stir up", "B": "hide", "C": "calm", "D": "explain"}, "fig": "", "passage": null, "qnum": 10}, {"n": 12, "type": "mcq", "section": "English", "stem": "Which sentence best summarises the story?", "options": {"A": "A girl is annoyed by her grandmother's noisy bird until its borrowed words help her understand her grandmother's loneliness.", "B": "A girl's grandmother goes into hospital for a knee operation and is visited by her family on Saturday.", "C": "A clever mynah bird learns how to help a girl with her maths homework.", "D": "A family argues about where a pet bird should stay while its owner is away."}, "fig": "", "passage": "<strong>The Bird Who Spoke Like Grandma</strong><br>When Grandma went into hospital for a knee operation, Mum announced that her mynah bird, Pepper, would be staying with us. I cleared a corner of my desk for the cage without enthusiasm, certain that my quiet bedroom, my one peaceful place in the flat, was about to be ruined.<br><br>I was right, at first. Pepper screeched at sunrise. He rattled his seed bowl against the bars whenever he was bored, and he shouted &#x27;Aiya!&#x27; every time I dropped my pencil. Mum had left a page of instructions, fruit in the morning, fresh water twice a day, cover the cage at nine o&#x27;clock, but nowhere did it explain how to make him stop. By the third day, I had given up and moved my homework to the kitchen table, where my little brother kept knocking my elbow and the television muttered in the background. Even that was better than the screeching.<br><br>Then, on Thursday evening, while I was back in my room hunting for a protractor and wrestling with a maths problem in my head, Pepper tilted his head and said, in a voice that was not quite his own, &#x27;Slowly, slowly. Try again.&#x27; I froze. It was Grandma&#x27;s voice: her exact words, the ones she used whenever I knotted my knitting or burned the rice at her flat.<br><br>After that, I started listening properly. I carried my books back to my desk and sat very still, waiting. Mixed in with the squawks were whole pieces of my grandmother. &#x27;Drink some water.&#x27; &#x27;Clever girl.&#x27; &#x27;One more try, then rest.&#x27; Once, when my brother stomped in without knocking, Pepper barked, &#x27;Slippers! Slippers!&#x27; and we both burst out laughing, because that was exactly what Grandma shouted at anyone who walked on her clean floor in outdoor shoes. Pepper had spent years in her sitting room, soaking up her words the way a sponge soaks up water, and now he was pouring them back out into mine.<br><br>I even tried an experiment. For two evenings I said &#x27;Good night, Pepper&#x27; each time I switched off my lamp, hoping to teach him something of my own. He ignored me grandly and answered with a squawk. Clearly, two evenings were nothing against years of Grandma.<br><br>On Saturday we visited the hospital. I told Grandma her bird had been coaching me through my homework. She laughed so hard that a nurse looked over. &#x27;He only repeats what he hears often,&#x27; she said, patting my hand. &#x27;So now you know what I say all day.&#x27;<br><br>That night, back in my room, Pepper screeched at the moon and knocked his bell against the bars. I did not move my books. The noise did not seem like noise anymore. It seemed like company, and I understood, suddenly, that for Grandma, alone in her flat, that was exactly what it had always been.", "qnum": 11}, {"n": 13, "type": "mcq", "section": "English", "stem": "Before Pepper first spoke in Grandma's voice on Thursday, how did the narrator feel about the bird?", "options": {"A": "She found him entertaining.", "B": "She found him annoying.", "C": "She was frightened of him.", "D": "She felt sorry for him."}, "fig": "", "passage": "<strong>The Bird Who Spoke Like Grandma</strong><br>When Grandma went into hospital for a knee operation, Mum announced that her mynah bird, Pepper, would be staying with us. I cleared a corner of my desk for the cage without enthusiasm, certain that my quiet bedroom, my one peaceful place in the flat, was about to be ruined.<br><br>I was right, at first. Pepper screeched at sunrise. He rattled his seed bowl against the bars whenever he was bored, and he shouted &#x27;Aiya!&#x27; every time I dropped my pencil. Mum had left a page of instructions, fruit in the morning, fresh water twice a day, cover the cage at nine o&#x27;clock, but nowhere did it explain how to make him stop. By the third day, I had given up and moved my homework to the kitchen table, where my little brother kept knocking my elbow and the television muttered in the background. Even that was better than the screeching.<br><br>Then, on Thursday evening, while I was back in my room hunting for a protractor and wrestling with a maths problem in my head, Pepper tilted his head and said, in a voice that was not quite his own, &#x27;Slowly, slowly. Try again.&#x27; I froze. It was Grandma&#x27;s voice: her exact words, the ones she used whenever I knotted my knitting or burned the rice at her flat.<br><br>After that, I started listening properly. I carried my books back to my desk and sat very still, waiting. Mixed in with the squawks were whole pieces of my grandmother. &#x27;Drink some water.&#x27; &#x27;Clever girl.&#x27; &#x27;One more try, then rest.&#x27; Once, when my brother stomped in without knocking, Pepper barked, &#x27;Slippers! Slippers!&#x27; and we both burst out laughing, because that was exactly what Grandma shouted at anyone who walked on her clean floor in outdoor shoes. Pepper had spent years in her sitting room, soaking up her words the way a sponge soaks up water, and now he was pouring them back out into mine.<br><br>I even tried an experiment. For two evenings I said &#x27;Good night, Pepper&#x27; each time I switched off my lamp, hoping to teach him something of my own. He ignored me grandly and answered with a squawk. Clearly, two evenings were nothing against years of Grandma.<br><br>On Saturday we visited the hospital. I told Grandma her bird had been coaching me through my homework. She laughed so hard that a nurse looked over. &#x27;He only repeats what he hears often,&#x27; she said, patting my hand. &#x27;So now you know what I say all day.&#x27;<br><br>That night, back in my room, Pepper screeched at the moon and knocked his bell against the bars. I did not move my books. The noise did not seem like noise anymore. It seemed like company, and I understood, suddenly, that for Grandma, alone in her flat, that was exactly what it had always been.", "qnum": 12}, {"n": 14, "type": "mcq", "section": "English", "stem": "Why does the narrator carry her books back to her desk and begin 'listening properly' after Thursday evening?", "options": {"A": "She hopes Pepper will tell her the answers to her maths homework.", "B": "The kitchen table has become too noisy for her to work at.", "C": "She has heard her grandmother's voice and words in Pepper's speech and wants to catch more of them.", "D": "Mum has asked her to keep the bird company while Grandma is in hospital."}, "fig": "", "passage": "<strong>The Bird Who Spoke Like Grandma</strong><br>When Grandma went into hospital for a knee operation, Mum announced that her mynah bird, Pepper, would be staying with us. I cleared a corner of my desk for the cage without enthusiasm, certain that my quiet bedroom, my one peaceful place in the flat, was about to be ruined.<br><br>I was right, at first. Pepper screeched at sunrise. He rattled his seed bowl against the bars whenever he was bored, and he shouted &#x27;Aiya!&#x27; every time I dropped my pencil. Mum had left a page of instructions, fruit in the morning, fresh water twice a day, cover the cage at nine o&#x27;clock, but nowhere did it explain how to make him stop. By the third day, I had given up and moved my homework to the kitchen table, where my little brother kept knocking my elbow and the television muttered in the background. Even that was better than the screeching.<br><br>Then, on Thursday evening, while I was back in my room hunting for a protractor and wrestling with a maths problem in my head, Pepper tilted his head and said, in a voice that was not quite his own, &#x27;Slowly, slowly. Try again.&#x27; I froze. It was Grandma&#x27;s voice: her exact words, the ones she used whenever I knotted my knitting or burned the rice at her flat.<br><br>After that, I started listening properly. I carried my books back to my desk and sat very still, waiting. Mixed in with the squawks were whole pieces of my grandmother. &#x27;Drink some water.&#x27; &#x27;Clever girl.&#x27; &#x27;One more try, then rest.&#x27; Once, when my brother stomped in without knocking, Pepper barked, &#x27;Slippers! Slippers!&#x27; and we both burst out laughing, because that was exactly what Grandma shouted at anyone who walked on her clean floor in outdoor shoes. Pepper had spent years in her sitting room, soaking up her words the way a sponge soaks up water, and now he was pouring them back out into mine.<br><br>I even tried an experiment. For two evenings I said &#x27;Good night, Pepper&#x27; each time I switched off my lamp, hoping to teach him something of my own. He ignored me grandly and answered with a squawk. Clearly, two evenings were nothing against years of Grandma.<br><br>On Saturday we visited the hospital. I told Grandma her bird had been coaching me through my homework. She laughed so hard that a nurse looked over. &#x27;He only repeats what he hears often,&#x27; she said, patting my hand. &#x27;So now you know what I say all day.&#x27;<br><br>That night, back in my room, Pepper screeched at the moon and knocked his bell against the bars. I did not move my books. The noise did not seem like noise anymore. It seemed like company, and I understood, suddenly, that for Grandma, alone in her flat, that was exactly what it had always been.", "qnum": 13}, {"n": 15, "type": "mcq", "section": "English", "stem": "The narrator says Pepper spent years 'soaking up her words the way a sponge soaks up water'. What does this comparison suggest?", "options": {"A": "Pepper needed fresh water in his cage every day.", "B": "Grandma talked far too much for the bird's liking.", "C": "Pepper understood the meaning of everything Grandma said.", "D": "Pepper gradually absorbed and stored the words he heard most often."}, "fig": "", "passage": "<strong>The Bird Who Spoke Like Grandma</strong><br>When Grandma went into hospital for a knee operation, Mum announced that her mynah bird, Pepper, would be staying with us. I cleared a corner of my desk for the cage without enthusiasm, certain that my quiet bedroom, my one peaceful place in the flat, was about to be ruined.<br><br>I was right, at first. Pepper screeched at sunrise. He rattled his seed bowl against the bars whenever he was bored, and he shouted &#x27;Aiya!&#x27; every time I dropped my pencil. Mum had left a page of instructions, fruit in the morning, fresh water twice a day, cover the cage at nine o&#x27;clock, but nowhere did it explain how to make him stop. By the third day, I had given up and moved my homework to the kitchen table, where my little brother kept knocking my elbow and the television muttered in the background. Even that was better than the screeching.<br><br>Then, on Thursday evening, while I was back in my room hunting for a protractor and wrestling with a maths problem in my head, Pepper tilted his head and said, in a voice that was not quite his own, &#x27;Slowly, slowly. Try again.&#x27; I froze. It was Grandma&#x27;s voice: her exact words, the ones she used whenever I knotted my knitting or burned the rice at her flat.<br><br>After that, I started listening properly. I carried my books back to my desk and sat very still, waiting. Mixed in with the squawks were whole pieces of my grandmother. &#x27;Drink some water.&#x27; &#x27;Clever girl.&#x27; &#x27;One more try, then rest.&#x27; Once, when my brother stomped in without knocking, Pepper barked, &#x27;Slippers! Slippers!&#x27; and we both burst out laughing, because that was exactly what Grandma shouted at anyone who walked on her clean floor in outdoor shoes. Pepper had spent years in her sitting room, soaking up her words the way a sponge soaks up water, and now he was pouring them back out into mine.<br><br>I even tried an experiment. For two evenings I said &#x27;Good night, Pepper&#x27; each time I switched off my lamp, hoping to teach him something of my own. He ignored me grandly and answered with a squawk. Clearly, two evenings were nothing against years of Grandma.<br><br>On Saturday we visited the hospital. I told Grandma her bird had been coaching me through my homework. She laughed so hard that a nurse looked over. &#x27;He only repeats what he hears often,&#x27; she said, patting my hand. &#x27;So now you know what I say all day.&#x27;<br><br>That night, back in my room, Pepper screeched at the moon and knocked his bell against the bars. I did not move my books. The noise did not seem like noise anymore. It seemed like company, and I understood, suddenly, that for Grandma, alone in her flat, that was exactly what it had always been.", "qnum": 14}, {"n": 16, "type": "mcq", "section": "English", "stem": "What does the narrator come to understand at the end of the story?", "options": {"A": "Pepper's noise had been company for her grandmother, who lived alone.", "B": "Mynah birds are more intelligent than most people believe.", "C": "She should visit her grandmother in hospital more often.", "D": "Pepper copied Grandma's voice because he missed her and wanted to comfort the narrator."}, "fig": "", "passage": "<strong>The Bird Who Spoke Like Grandma</strong><br>When Grandma went into hospital for a knee operation, Mum announced that her mynah bird, Pepper, would be staying with us. I cleared a corner of my desk for the cage without enthusiasm, certain that my quiet bedroom, my one peaceful place in the flat, was about to be ruined.<br><br>I was right, at first. Pepper screeched at sunrise. He rattled his seed bowl against the bars whenever he was bored, and he shouted &#x27;Aiya!&#x27; every time I dropped my pencil. Mum had left a page of instructions, fruit in the morning, fresh water twice a day, cover the cage at nine o&#x27;clock, but nowhere did it explain how to make him stop. By the third day, I had given up and moved my homework to the kitchen table, where my little brother kept knocking my elbow and the television muttered in the background. Even that was better than the screeching.<br><br>Then, on Thursday evening, while I was back in my room hunting for a protractor and wrestling with a maths problem in my head, Pepper tilted his head and said, in a voice that was not quite his own, &#x27;Slowly, slowly. Try again.&#x27; I froze. It was Grandma&#x27;s voice: her exact words, the ones she used whenever I knotted my knitting or burned the rice at her flat.<br><br>After that, I started listening properly. I carried my books back to my desk and sat very still, waiting. Mixed in with the squawks were whole pieces of my grandmother. &#x27;Drink some water.&#x27; &#x27;Clever girl.&#x27; &#x27;One more try, then rest.&#x27; Once, when my brother stomped in without knocking, Pepper barked, &#x27;Slippers! Slippers!&#x27; and we both burst out laughing, because that was exactly what Grandma shouted at anyone who walked on her clean floor in outdoor shoes. Pepper had spent years in her sitting room, soaking up her words the way a sponge soaks up water, and now he was pouring them back out into mine.<br><br>I even tried an experiment. For two evenings I said &#x27;Good night, Pepper&#x27; each time I switched off my lamp, hoping to teach him something of my own. He ignored me grandly and answered with a squawk. Clearly, two evenings were nothing against years of Grandma.<br><br>On Saturday we visited the hospital. I told Grandma her bird had been coaching me through my homework. She laughed so hard that a nurse looked over. &#x27;He only repeats what he hears often,&#x27; she said, patting my hand. &#x27;So now you know what I say all day.&#x27;<br><br>That night, back in my room, Pepper screeched at the moon and knocked his bell against the bars. I did not move my books. The noise did not seem like noise anymore. It seemed like company, and I understood, suddenly, that for Grandma, alone in her flat, that was exactly what it had always been.", "qnum": 15}, {"n": 17, "type": "writing", "section": "English Writing", "intro": "This section has two parts. Part 1 checks your editing skills; Part 2 is a short piece of your own writing.", "label": "", "body": "Last Saturday our class visited the Hong Kong Science Museum. We [1: A) was  B) were  C) is] excited because the new energy gallery had just opened. Our teacher reminded us to stay with our partners and to speak [2: A) quiet  B) quieter  C) quietly] inside the exhibition halls. At the entrance, each student [3: A) was given  B) gave  C) giving] a worksheet to complete. My favourite display showed how wind turbines turn moving air [4: A) into  B) onto  C) under] electricity. After lunch we watched a short film about saving energy at home, [5: A) but  B) and  C) or] then we wrote down three ideas to try in our own flats. On the bus back to school, everyone agreed it had been the [6: A) most interesting  B) more interesting  C) interestingest] trip of the year.\n\nPart 2: Choose ONE of the two tasks and write a paragraph of no more than 8 sentences. (1) Explain, step by step, how you pack your school bag the night before school so that nothing is forgotten. (2) Write a short story that begins: \"When the lift doors opened, the lobby was completely dark.\"", "hint": "For Part 1, read the text and choose the best option for each numbered bracket (write the number with your chosen letter, e.g. 1-B). For Part 2, choose ONE task and write a paragraph of no more than 8 sentences.", "placeholder": "Type your response here…", "partA": "Last Saturday our class visited the Hong Kong Science Museum. We [1: A) was  B) were  C) is] excited because the new energy gallery had just opened. Our teacher reminded us to stay with our partners and to speak [2: A) quiet  B) quieter  C) quietly] inside the exhibition halls. At the entrance, each student [3: A) was given  B) gave  C) giving] a worksheet to complete. My favourite display showed how wind turbines turn moving air [4: A) in let idx = -1;                  // -1 = start screen
const answers = {};            // n -> letter
const texts = {};              // n -> string
let student = {name:"",email:""};
let startTs = null;

const card = document.getElementById('card');
const prog = document.getElementById('prog');
const timerEl = document.getElementById('timer');

function esc(s){return (s==null?'':String(s));}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':' + String(ss).padStart(2,'0');}
function tick(){ if(!startTs) return; const s=Math.floor((Date.now()-startTs)/1000); timerEl.textContent=fmtTime(s);}
setInterval(tick,1000);

function setProg(){ const pct = idx<0?0:Math.round(((idx+1)/QUESTIONS.length)*100); prog.style.width=pct+'%'; }

function renderStart(){
  setProg();
  card.innerHTML = `
    <h1>IDAT HKIS: Stage 3 (V1)</h1>
    <p class="info-body">Enter your details to begin. Please enter a valid e-mail address. Your answers will be submitted to HK-Schools.com for review.</p>
    <div class="field"><label>Full name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label>Email <span style="color:#c0392b">*</span></label><input id="em" type="email" autocomplete="email"></div>
    <div class="err" id="startErr"></div>
    <div class="nav"><span></span><button class="begin" id="beginBtn">Begin</button></div>`;
  document.getElementById('beginBtn').onclick=()=>{
    student.name=(document.getElementById('nm').value||'').trim();
    student.email=(document.getElementById('em').value||'').trim();
    const err=document.getElementById('startErr');
    if(!student.name){ err.textContent='Please enter your full name.'; document.getElementById('nm').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(student.email)){
      err.textContent='A valid email is required so your tutor can match your submission.';
      document.getElementById('em').focus(); return;
    }
    startTs=Date.now(); idx=0; render();
  };
}

function render(){
  if(idx<0){ renderStart(); return; }
  if(idx>=QUESTIONS.length){ renderConfirm(); return; }
  setProg();
  const q=QUESTIONS[idx];
  let body='';
  const sec = q.section? `<div class="sec">${esc(q.section)}</div>`:'';
  if(q.type==='info'){
    body=`${q.title?`<div class="sec">Section</div><h1>${q.title}</h1>`:''}<div class="info-body">${q.body}</div>`;
  } else if(q.type==='writing'){
    body=`${sec}`
      + (q.intro?`<div class="stem">${esc(q.intro)}</div>`:'')
      + (q.partA?`<div class="wlabel">Part A</div><div class="wbody">${esc(q.partA)}</div><textarea id="taA" placeholder="Type your Part A answer here…">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.partB?`<div class="wlabel">Part B</div><div class="wbody">${esc(q.partB)}</div><textarea id="taB" placeholder="Type your Part B answer here…">${esc(texts[q.n+'b']||'')}</textarea>`:'')
      + ((!q.partA&&!q.partB&&q.body)?`<div class="wbody">${esc(q.body)}</div><textarea id="ta" placeholder="${esc(q.placeholder||'Type your response here…')}">${esc(texts[q.n]||'')}</textarea>`:'')
      + (q.hint?`<p class="hint">${esc(q.hint)}</p>`:'');
  } else { // mcq or selfeval
    const passage = q.passage? `<div class="passage">${q.passage}</div>`:'';
    let opts='';
    for(const k of Object.keys(q.options)){
      const seld = answers[q.n]===k?' sel':'';
      opts+=`<div class="opt${seld}" data-k="${k}"><span class="l">${k}</span>${esc(q.options[k])}</div>`;
    }
    const qlabel = q.qnum? ('Question '+q.qnum) : (q.cnum? ('Character '+q.cnum) : '');
    const head = `<div class="qhead">${q.section?`<span class="sec">${esc(q.section)}</span>`:'<span></span>'}${qlabel?`<span class="qnum">${qlabel}</span>`:''}</div>`;
    body=`${head}${passage}<div class="stem">${esc(q.stem)}</div>${q.fig?`<div style="margin:0 0 14px">${q.fig}</div>`:''}${opts}`;
  }
  const isLast = idx===QUESTIONS.length-1;
  card.innerHTML = body + `<div class="nav">
      <button class="prev" id="prevBtn"${idx===0?' style="visibility:hidden"':''}>Back</button>
      <button class="next" id="nextBtn">${isLast?'Finish &amp; submit':'Next'}</button>
    </div>`;
  if(q.type!=='info' && q.type!=='writing'){
    card.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      answers[q.n]=el.dataset.k;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  }
  document.getElementById('prevBtn').onclick=()=>{ saveText(q); idx--; render(); };
  document.getElementById('nextBtn').onclick=()=>{ saveText(q); if(isLast){ submit(); } else { idx++; render(); } };
}
function saveText(q){ if(q.type==='writing'){ var a=document.getElementById('taA'); if(a) texts[q.n]=a.value; var bb=document.getElementById('taB'); if(bb) texts[q.n+'b']=bb.value; var t=document.getElementById('ta'); if(t) texts[q.n]=t.value; } }

function renderConfirm(){ idx=QUESTIONS.length; }


function svgToPng(svg){ return new Promise(function(res){ try{
  var wm=svg.match(/width=\"(\d+)/), hm=svg.match(/height=\"(\d+)/);
  var w=wm?+wm[1]:320, h=hm?+hm[1]:240, scale=2;
  var blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){ try{ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/png')); }catch(e){ res(''); } };
  img.onerror=function(){ URL.revokeObjectURL(url); res(''); };
  img.src=url;
}catch(e){ res(''); } }); }
async function buildFigs(){ var figs={}; for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i];
  if(q.fig && /<svg/i.test(q.fig)){ var png=await svgToPng(q.fig); if(png) figs[q.n]=png; } } return figs; }

async function submit(){
  card.innerHTML = `<div class="center"><div class="big">…</div><p class="info-body">Submitting your answers…</p></div>`;
  let figs={}; try{ figs=await buildFigs(); }catch(e){}
  const qslim = QUESTIONS.map(function(q){ return {n:q.n,type:q.type,section:q.section,stem:q.stem,options:q.options,passage:q.passage,qnum:q.qnum,cnum:q.cnum,intro:q.intro,partA:q.partA,partB:q.partB}; });
  const payload={ type:"idat", school:SCHOOL, stage:STAGE, version:VERSION, name:student.name, email:student.email,
    elapsedSeconds: startTs? Math.floor((Date.now()-startTs)/1000):0, answers, texts, questions:qslim, figs };
  let done=false;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await res.text(); done=true;
  }catch(e){ done=true; } // confirmation-only: we don't display the score regardless
  card.innerHTML = `<div class="center">
    <div class="big ok">✓</div>
    <h1>Submitted</h1>
    <p class="info-body">Thank you, ${esc(student.name)}. Your responses have been sent to HK-Schools.com for review. We will follow up with you soon.</p>
  </div>`;
  prog.style.width='100%';
}
render();
</script>
</body>
</html>
